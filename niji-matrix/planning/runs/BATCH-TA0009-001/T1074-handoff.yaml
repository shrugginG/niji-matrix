handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-001
work_item_ref: WORK-TA0009-T1074
temporary_key_prefix: T1074_
candidate:
  source_type: attack
  source_attack_id: T1074
  source_attack_version: '19.1'
  name:
    zh: 数据暂存
    en: Data Staged
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: ATT&CK 的父级行为是把已经取得的数据汇入后续外传前的暂存位置，数据可以分文件保存，也可以再由 T1560 归档。固定 19.1 基线明确指出，集中暂存可以减少受害网络到攻击者 C2 的连接数，因此这一父行为有可验证的匿迹潜力；但普通复制到临时目录并不自动具备匿迹特征。建议适配为“匿迹型数据暂存”，只纳入攻击者有意改变暂存拓扑、可见命名空间或存储观察面的情况。
      en: The ATT&CK parent behavior moves already acquired data into a staging location before later exfiltration; files
        may remain separate or be archived under T1560. The fixed 19.1 baseline explicitly says central staging can reduce
        connections from the victim network to adversary C2, giving the parent a verifiable stealth potential. An ordinary
        copy into a temporary directory does not itself establish stealth. Adapt the parent to Stealth-Oriented Data Staging,
        limited to deliberate changes in staging topology, visible namespace, or storage observation plane.
    - zh: 父级准入由暂存对防守观察的变化决定，而非由“本地/远程”位置标签决定。Volexity 观察到邮件导出文件被放到 OWA 服务器可由 HTTP 获取的路径；SecureWorks 观察到加密归档先转移到遭入侵的互联网服务器再被取走；Calisto
        与 BackdoorDiplomacy 则显示隐藏目录或回收站可被用作数据暂存。实际减小告警概率需要结合组织的日志覆盖和正常工作流判断，不能由案例反推每个攻击者的主观意图。
      en: Admission rests on a change to defender observation, not a local-versus-remote location label. Volexity observed
        mailbox exports placed in an HTTP-retrievable OWA server path; SecureWorks observed encrypted archives moved to a
        compromised Internet-facing server before retrieval; Calisto and BackdoorDiplomacy show hidden directories or the
        Recycle Bin used for collected data. A lower alert probability depends on the organization's telemetry and normal
        workflows, and the cases do not prove every actor's subjective intent.
  scope_notes:
    zh: 直接对象是已取得数据的暂存位置、汇聚链与后续取用关系。T1119 拥有规则化或自动触发的获取过程，T1560 拥有归档容器及压缩加密过程，T1036/T1027 拥有一般外观伪装或表示遮蔽，T1070 拥有外传后的擦除。只有收集数据的暂存安排本身改变观察时，才归入此父级。
    en: The direct object is the staging location, aggregation chain, and later retrieval relationship for data already obtained.
      T1119 owns rule-based or automatically triggered acquisition; T1560 owns archive-container construction, compression,
      and encryption; T1036/T1027 own general appearance or representation concealment; T1070 owns post-exfiltration erasure.
      The staging arrangement belongs here only when it itself changes observation.
proposed_content:
  name:
    zh: 匿迹型数据暂存
    en: Stealth-Oriented Data Staging
  summary:
    zh: 攻击者在外传前重排已收集数据的暂存拓扑或可见位置，使数据来源、敏感性质或取用链路更难被防守方识别。
    en: Before exfiltration, adversaries rearrange the topology or visible location of collected data so its origin, sensitivity,
      or retrieval chain is harder for defenders to identify.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型数据暂存是攻击者在取得目标数据后、外传或其他使用前，将其复制、移动或写入一个受控的中间位置，并选择该位置的汇聚方式或可见属性来改变防守观察。直接目的既是让数据可供后续取用，也是减少外部出口、混入预期存储命名空间，或避开仅覆盖普通文件的传感器。它服务于
        Collection 战术中“已取得数据的准备”阶段；文件扩展名、具体操作系统和复制工具都不是定义条件。
      en: Stealth-Oriented Data Staging occurs after an adversary has obtained target data and before exfiltration or other
        use. The adversary copies, moves, or writes it to a controlled intermediate location and chooses the aggregation or
        visible properties of that location to change defender observation. The immediate purpose is to make the data available
        for later retrieval while reducing external exits, blending it into an expected storage namespace, or avoiding sensors
        limited to ordinary files. It is the preparation of already acquired data within Collection; file extension, operating
        system, and copy tool do not define it.
    - zh: 暂存可以发生在来源主机、内部汇聚主机、互联网可达的受害服务器或受控云资源中。关键事实不是目标与来源的物理距离，而是来源数据在暂存点形成可追溯的新副本或缓冲、之后又被读取或传出。归档、加密、定时获取和清理可能与暂存连续出现，但每一步仍应按其直接对象分别分析。
      en: Staging may occur on a source host, internal aggregation host, Internet-reachable victim server, or controlled cloud
        resource. The decisive fact is not physical distance from the source but a traceable new copy or buffer of source
        data at the staging point followed by retrieval or transmission. Archiving, encryption, scheduled acquisition, and
        cleanup may occur in the same sequence, yet each step must be analyzed by its direct object.
  stealth_characteristics:
    paragraphs:
    - zh: 数据暂存的匿迹效果表现为观察关系被重排。多源数据若先汇入一台被控服务器，外部边界可能只看见该服务器的少数连接而看不到各来源主机的外传；若敏感数据落入回收站、应用资源目录或隐藏目录，按预设敏感路径巡检的系统也可能漏掉实际副本。源文件访问、内部传输、目标写入、后续读取和外传仍留下可关联痕迹，集中还可能在暂存点产生异常写入峰值。
      en: Stealth in data staging comes from rearranged observation relationships. When data from multiple sources first reaches
        one compromised server, an external boundary may see only a few connections from that server rather than exfiltration
        by every source. Sensitive content placed in a Recycle Bin, application resource path, or hidden directory may escape
        monitoring keyed only to expected sensitive paths. Source reads, internal transfers, destination writes, later reads,
        and outbound retrieval still leave joinable traces, and concentration may cause an unusual write spike at the staging
        point.
    - zh: 匿迹收益依赖防守方是否只监控外联或固定路径，以及是否能跨主机、共享和服务器访问日志建立谱系。如果内部网络、文件对象与 HTTP 请求得到统一关联，暂存会从“少数外联”变成“多源入站、单点出站”的可识别图形。因而这里的匿迹是有条件的观察差，而非暂存行为的固有属性。
      en: The benefit depends on whether defenders monitor only egress or fixed paths and whether they can reconstruct lineage
        across hosts, shares, and server access logs. With joined internal network, file-object, and HTTP telemetry, staging
        changes from a few outbound connections into a recognizable many-source-inbound, one-point-outbound graph. Stealth
        here is therefore a conditional observation difference rather than an inherent property of staging.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入条件是已经取得的敏感或任务相关数据被放入攻击者可控制的中间存储，并有可论证的出口收敛、命名空间误导或监测面迁移。普通备份、同步、邮件导出、数据库转储和合法软件缓存也会产生集中副本；必须用账户授权、业务计划、来源类别、目标路径、后继读取或外传等上下文区别，不能凭“临时目录有文件”定性。
      en: Include already acquired sensitive or mission-relevant data placed in adversary-controlled intermediate storage
        when egress convergence, namespace misdirection, or a shift in monitored storage plane is defensible. Ordinary backups,
        synchronization, mailbox exports, database dumps, and legitimate software caches also create concentrated copies.
        Account authorization, work schedule, source class, destination path, and successor retrieval or exfiltration must
        distinguish them; a file in a temporary directory alone is insufficient.
    - zh: 自动搜索与复制规则属于 T1119 的数据获取阶段，完成获取后在哪里汇聚才属于本技术。压缩、加密、分卷和容器生成属于 T1560；暂存点可存放归档，但“有归档”不等于暂存匿迹。通过扩展名或良性外层格式隐藏内容还可能同时属于
        T1036/T1027；外传后的删除、共享拆除属于 T1070，不在此处作为暂存子项。主 Agent 应保留这些跨对象关系，而不以同一案例重复计数。
      en: Automated search and copy rules belong to T1119's acquisition stage; the later choice of aggregation site belongs
        here. Compression, encryption, splitting, and container creation belong to T1560. A staging point may hold an archive,
        but archive presence does not establish stealthy staging. Hiding content through a filename or benign outer format
        may also implicate T1036/T1027. Deletion or share detachment after exfiltration belongs to T1070 and is not a staging
        child. The primary agent should preserve these cross-object relationships without counting a case twice as the same
        behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在获得文件共享、邮箱或数据库访问后，攻击者可能先把导出的数据放到内部服务器或互联网可达的业务服务器，再从单一位置提取。Volexity 的 OWA 案例是邮箱导出、服务器端暂存和 HTTP 取回连成一链；SecureWorks
          的 BRONZE UNION 案例则显示归档从高价值系统转至遭入侵的外部可达服务器。端点型恶意程序也可能在外传前把浏览器、凭据或可移动介质数据放在隐藏工作目录或回收站。
        en: After gaining access to shares, mailboxes, or databases, an adversary may first place exports on an internal or
          Internet-reachable business server and retrieve them from one site. Volexity's OWA case links mailbox export, server-side
          staging, and HTTP retrieval; SecureWorks' BRONZE UNION case moves archives from a high-value system to a compromised
          Internet-facing server. Endpoint malware may also buffer browser, credential, or removable-media data in a hidden
          working directory or Recycle Bin before transmission.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须先有可收集的数据和足以读源、写暂存点并再次取用的权限。出口汇聚通常还需要对多台主机、共享或业务服务器的横向访问；命名空间暂存需要知道哪些路径会被巡检、哪些路径可由被控进程写入。其代价是内部复制和目标写入变多，存储容量、权限和保留时间也限制暂存规模。
          en: The adversary needs data already available for collection and authority to read the source, write the staging
            point, and retrieve it again. Egress convergence usually also requires lateral access to several hosts, shares,
            or business servers. Namespace staging requires knowledge of monitored paths and locations writable by the controlled
            process. It increases internal copies and destination writes, while capacity, permissions, and retention constrain
            scale.
      defender_model:
        paragraphs:
        - zh: 防守方可能有终端文件创建、受审计共享访问、IIS 请求、云对象数据事件及网络流量，却未必在同一账户、主机和文件谱系上关联它们。仅看外部连接的系统易低估汇聚前的来源数量；只审查普通敏感目录的系统易漏掉非典型暂存点。若未开启目标共享的详细访问审计、敏感源文件
            SACL 或云对象数据事件，证据链会断裂；加密归档还能遮蔽内容，但这是相邻归档机理。
          en: Defenders may have endpoint file-creation events, audited share access, IIS requests, cloud object data events,
            and network flows without joining them by account, host, and file lineage. Egress-only monitoring can undercount
            pre-aggregation sources; monitoring only ordinary sensitive directories can miss unconventional staging points.
            The chain breaks if detailed share access auditing, SACLs for sensitive source files, or cloud object data events
            are not enabled. Encrypted archives may further hide content, but that is an adjacent archival mechanism.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 将多源收集痕迹移入内部汇聚链或低覆盖存储面
      en: Shift multi-source collection traces into an internal aggregation chain or weakly monitored storage plane
    analysis:
      paragraphs:
      - zh: 攻击者把来源文件先复制到可控中间点，再从中间点访问或外传。出口传感器原本可见的多台来源主机被压缩为单个取用节点；若中间点位于未纳入常规文件巡检的目录或注册表，文件路径检测进一步失去对象。残留的共享访问、文件创建、注册表值变更和出口请求可以恢复链路，因此该机理只在防守覆盖或关联缺口存在时成立。
        en: The adversary copies source files to a controlled intermediate point and retrieves or exfiltrates them from there.
          An egress sensor that might have seen several source hosts sees one retrieval node instead. If the intermediate
          point sits in a directory or Registry area outside routine file review, path-based detection loses the object as
          well. Share access, file creation, Registry value changes, and outbound requests can restore the chain, so this
          mechanism holds only where coverage or correlation gaps exist.
    evidence_keys:
    - T1074_REF_ATTACK_PARENT
    - T1074_REF_SECUREWORKS
    - T1074_REF_VOLEXITY
    - T1074_REF_WAZUH
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 让已收集数据出现在预期的系统或业务资源路径
      en: Place collected data in expected system or business-resource paths
    analysis:
      paragraphs:
      - zh: 暂存内容进入回收站、隐藏工作目录或业务资源目录后，路径的日常用途会影响分析人员和规则对其意义的初判。Volexity 记录了 OWA 资源路径上的可下载归档，ESET 记录了回收站中的复制数据，Calisto 分析记录了隐藏目录中的采集结果。若防守方按数据敏感度而非仅按路径分类，并关联源读、目标写与后继取用，外观上的正常性会被打破；案例不能证明所有路径选择都是为了伪装。
        en: Once staged content lands in a Recycle Bin, hidden working directory, or business-resource path, the path's ordinary
          purpose influences an analyst's or rule's first interpretation. Volexity records a downloadable archive in an OWA
          resource path, ESET records copied data in the Recycle Bin, and Calisto analysis records harvested results in a
          hidden directory. Classifying by data sensitivity and joining source reads, destination writes, and later retrieval
          can defeat the benign appearance. The cases do not prove every path choice was intended as disguise.
    evidence_keys:
    - T1074_REF_VOLEXITY
    - T1074_REF_ESET_BACKDOOR
    - T1074_REF_CALISTO
    confidence: medium
proposed_subtechniques:
- temporary_key: T1074_CHILD_EGRESS_CONVERGENCE
  proposed_status: formal_candidate
  name:
    zh: 出口汇聚暂存
    en: Egress-Convergent Staging
  summary:
    zh: 攻击者先将多处已收集数据汇入少数内部节点，再由这些节点对外取用，使外部连接与真实来源脱钩。
    en: Adversaries first aggregate collected data from several origins at a few internal nodes, then retrieve it externally
      from those nodes, separating outbound connections from the true sources.
  stable_stealth_variable:
    zh: 可控变量是“来源主机数与最终外联节点数的收敛程度”，而不是目标主机位于本地还是远程。
    en: The controlled variable is the degree of convergence between source-host count and final egress-node count, not whether
      the destination is labeled local or remote.
  trace_change:
    zh: 由多台源主机直接外联改为多源到单点的内部传输与单点外联；目标主机写入和内部链路流量增加。
    en: Multiple direct source-to-external paths become many-to-one internal transfers followed by one-node egress; writes
      at the destination and internal transfer traffic increase.
  defender_observation_difference:
    zh: 只看出口的防守方低估受影响来源；跨主机、共享文件和外联关联后可恢复多源入站与单点出站的图形。
    en: Egress-only defenders undercount affected sources; correlation across hosts, shares, files, and egress can recover
      the many-source-inbound, one-point-outbound graph.
  prerequisites_and_scenario:
    zh: 攻击者已从多台主机、共享或业务系统取得数据，并控制一个可写、可取回且有外联通路的暂存节点；可发生于内部文件服务器、OWA 服务器或云实例。
    en: The attacker has obtained data from multiple hosts, shares, or business systems and controls a writable, retrievable
      staging node with an outbound path; this may be an internal file server, OWA server, or cloud instance.
  sibling_boundary:
    zh: 此项按内外链路拓扑划分，暂存路径是否伪装无关；单源数据复制到另一主机而不减少出口来源数量，仅属父级核心行为。
    en: This child is defined by internal-to-external topology, regardless of path appearance; copying one source to another
      host without reducing the number of egress sources is only parent-core behavior.
  proposed_content:
    definition_and_concept:
      paragraphs:
      - zh: 出口汇聚暂存是在外传前，把来自多个已取得来源的数据放到少数受控中间节点，并让后续外联从这些节点发起的安排。它服务于“汇集后取用”的 Collection 阶段，关键是出口来源与原始数据来源的关系被收敛，而不是 SMB、SCP、云实例或某一服务器产品。
        en: Egress-Convergent Staging places data from multiple already acquired sources on a small number of controlled intermediate
          nodes before exfiltration and initiates later external retrieval from those nodes. It serves the aggregate-then-retrieve
          stage of Collection. The defining property is convergence between outbound source and original data sources, not
          SMB, SCP, cloud instances, or a server product.
    stealth_characteristics:
      paragraphs:
      - zh: 出口汇聚暂存让外部边界只看到少数外联节点，因此源主机的收集规模与流向不再由外联主机数直接体现。内部横向复制、共享访问、暂存目录增长、服务器访问和最终外联仍会形成多对一图形；部署了跨边界谱系关联的防守方反而更容易注意异常的单点汇入。
        en: Egress-Convergent Staging leaves an external boundary seeing only a few outbound nodes, so source-host count no
          longer directly reflects collection scale or direction. Internal lateral copying, share access, staging-directory
          growth, server access, and final egress still form a many-to-one graph; defenders with cross-boundary lineage may
          find the unusual concentration easier to notice.
    scope_boundary_definition:
      paragraphs:
      - zh: 本项要求至少两个可区分的数据来源向较少的暂存节点汇聚，随后这些节点被用来取用或外传。单源的远程复制、正常备份代理与集中 ETL 都不因其拓扑相似而自动纳入；应结合授权、数据类别、任务时间和目标节点角色判断。归档形成属于
          T1560，自动选择并复制源文件属于 T1119，后续外传协议属于相应外传技术。
        en: This child requires at least two distinguishable data origins converging on fewer staging nodes that are later
          used for retrieval or exfiltration. A single-source remote copy, normal backup agent, or central ETL is not automatically
          included because its topology looks similar; authorization, data class, schedule, and node role must be assessed.
          Archive creation belongs to T1560, automatic source selection and copying to T1119, and the eventual outbound protocol
          to the relevant exfiltration technique.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 在多个主机或邮箱已暴露后，攻击者可用内部共享或管理权限把导出物汇集到被控 Web 服务器，再由该服务器提供一次或少数几次外部取回。Scattered Spider 联合建议直接记录多个数据源汇入中央数据库；BRONZE
            UNION 在受害环境中把加密归档转至已经遭入侵的互联网服务器，Volexity 观察到 OWA 上的邮箱导出归档。后两案支持中间服务器与后继取回，但不能单独证明同一事件有多少原始来源。
          en: Once several hosts or mailboxes are exposed, the adversary can use internal shares or administration rights
            to aggregate exports on a compromised web server and retrieve them externally in one or a few sessions. The Scattered
            Spider joint advisory directly records multiple data sources brought into a central database. BRONZE UNION moved
            encrypted archives to already compromised Internet-facing servers, while Volexity observed mailbox-export archives
            on OWA. The latter two cases support intermediate servers and later retrieval but do not individually establish
            the number of original sources in each event.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者需要多个数据来源的读取权限、一个具备足够容量的可写中间节点，以及对该节点外部取用能力。增加汇聚点会提高内部传输和权限暴露，也可能使被控服务器的文件增长异常。
            en: The attacker needs read access to multiple data origins, a writable intermediate node with sufficient capacity,
              and an external retrieval path from it. Adding the aggregation point increases internal transfer and permission
              exposure and may make file growth on the compromised server anomalous.
        defender_model:
          paragraphs:
          - zh: 假定出口边界能看到连接但缺少源文件上下文，内部共享审计和目标主机文件创建可能只部分开启。若对共享访问的来源 IP、账户、目标文件，与出口服务器上的创建及后续 HTTP 请求进行关联，原本分离的阶段可被恢复；没有详细共享审计或服务器日志时只能提出较弱怀疑。
            en: Assume the egress boundary sees connections but lacks source-file context, while internal share auditing and
              destination file creation may be only partly enabled. Joining share-access source IP, account, and target with
              creation on the egress server and later HTTP requests can reconstruct the stages. Without detailed share or
              server logs, only a weaker suspicion is possible.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 以内部多源汇入替换多源直接外联
        en: Replace multiple direct exits with internal many-to-one ingress
      analysis:
        paragraphs:
        - zh: 攻击者把多源数据先送到被控节点，再从该节点取走，令仅依赖外联节点清单的规则把多个来源合并成一个源。内部传输与目标写入没有消失，跨主机图关联可以重建真实规模，因此这一机理依赖出口视角与内部视角之间的关联缺口。
          en: By sending multiple sources to a controlled node before retrieval, the adversary makes rules based only on outbound-node
            lists collapse many origins into one. Internal transfers and destination writes remain. Cross-host graph correlation
            can recover the true scale, so the mechanism depends on a gap between egress and internal views.
      evidence_keys:
      - T1074_REF_ATTACK_PARENT
      - T1074_REF_SECUREWORKS
      - T1074_REF_VOLEXITY
      - T1074_REF_SCATTERED
      confidence: medium
