research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1074.001
    - T1074.002
    represented_dimensions:
    - zh: T1074.001 与 T1074.002 主要按暂存点相对于来源主机的本地或远程位置区分。
      en: T1074.001 and T1074.002 primarily divide staging points by local versus remote location relative to source hosts.
    - zh: 两者均可涉及分文件或归档、命令行复制和后续外传，位置差异不自动构成不同匿迹机理。
      en: Both may use separate files or archives, command-line copying, and later exfiltration; location alone does not establish
        a different stealth mechanism.
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_id: T1074.001
      resolution: niji-variable-candidate
      explanation:
        zh: 本地暂存可支持命名空间偏差与非文件缓冲的研究，但“本地”不是 Niji 子项名称或边界。
        en: Local staging informs the namespace-mismatch and non-file-buffer inquiries, but local is neither a Niji child
          name nor boundary.
    - attack_id: T1074.002
      resolution: niji-variable-candidate
      explanation:
        zh: 远程暂存支持多源出口汇聚研究；并非每一次远程复制都会形成出口收敛。
        en: Remote staging informs many-source egress convergence; not every remote copy produces convergence.
    candidate_stealth_axes_examined:
    - key: T1074_CHILD_EGRESS_CONVERGENCE
      verdict: formal_candidate
      trace: many-to-one internal copies followed by fewer outbound nodes
      defense_difference: cross-host share-file-egress join
    - key: T1074_CHILD_NAMESPACE_SHIFT
      verdict: formal_candidate_with_boundary_review
      trace: sensitive copies in expected system/business paths
      defense_difference: source-to-path semantic lineage rather than topology
    - key: T1074_AXIS_NONFILE_BUFFER
      verdict: defer_cross_technique
      trace: Registry value writes replace ordinary file-create events
      defense_difference: Registry monitoring and buffer-read correlation; overlaps NJT-0115/NJS-0115-003 if content is embedded
        in a carrier
    - key: T1074_AXIS_FAST_CLEANUP
      verdict: adjacent_technique
      trace: post-exfiltration deletion or share detachment
      defense_difference: owned by T1070/NJT-0112
    - key: T1074_AXIS_ARCHIVE_FORMAT
      verdict: adjacent_technique
      trace: compressed or encrypted container
      defense_difference: owned by T1560
    - key: T1074_AXIS_AUTOMATION_CADENCE
      verdict: adjacent_technique
      trace: scheduled or repeated acquisition
      defense_difference: owned by T1119
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两项正式候选按外联拓扑和暂存路径语义划分，既覆盖两个 ATT&CK 位置分支中的有证据差异，又没有机械按本地、远程映射。第三个非文件缓冲轴有直接技术例子，但须由主 Agent 与现有 NJT-0115、NJS-0115-003
        确认边界后决定是否追加。
      en: The two formal candidates divide by egress topology and staging-path semantics, covering supported differences across
        the two ATT&CK location branches without mapping local and remote mechanically. A third non-file buffer axis has a
        direct technical example but awaits the primary agent's boundary decision against NJT-0115 and NJS-0115-003.
  evidence_coverage:
    parent_behavior_keys:
    - T1074_REF_ATTACK_PARENT
    - T1074_REF_VOLEXITY
    - T1074_REF_SECUREWORKS
    - T1074_REF_SCATTERED
    boundary_keys:
    - T1074_REF_ATTACK_PARENT
    - T1074_REF_ATTACK_LOCAL
    - T1074_REF_ATTACK_REMOTE
    - T1074_REF_SECUREWORKS
    mechanism_support:
    - mechanism_ref: NM-BT
      evidence_keys:
      - T1074_REF_ATTACK_PARENT
      - T1074_REF_SECUREWORKS
      - T1074_REF_VOLEXITY
      - T1074_REF_SCATTERED
      caution: Connection reduction is ATT&CK parent analysis; incident reports do not quantify reduction.
    - mechanism_ref: NM-FD
      evidence_keys:
      - T1074_REF_VOLEXITY
      - T1074_REF_ESET_BACKDOOR
      - T1074_REF_CALISTO
      caution: Path camouflage effect is inferred; no source measures path-rule alert suppression.
    child_existence_support:
    - child_key: T1074_CHILD_EGRESS_CONVERGENCE
      evidence_keys:
      - T1074_REF_ATTACK_PARENT
      - T1074_REF_ATTACK_REMOTE
      - T1074_REF_SCATTERED
      - T1074_REF_SECUREWORKS
      - T1074_REF_VOLEXITY
    - child_key: T1074_CHILD_NAMESPACE_SHIFT
      evidence_keys:
      - T1074_REF_ESET_BACKDOOR
      - T1074_REF_CALISTO
      - T1074_REF_KOBALOS
      - T1074_REF_VOLEXITY
    unsupported_or_deferred:
    - key: T1074_AXIS_NONFILE_BUFFER
      reason: DarkWatchman supports Registry buffer and different telemetry, but a formal child could duplicate TA0005 carrier/storage
        concealment; cross-technique ruling required.
    - key: kobalos_successor_exfiltration
      reason: ESET states file and UDP exfil modes are alternative configurations; later retrieval of the .pid file is not
        observed.
    - key: scattered_spider_detection_effect
      reason: The joint advisory establishes multi-source central-database staging but does not measure reduced C2 connections
        or alert suppression.
    - key: cloud_object_staging
      reason: ATT&CK supports the general scenario and AWS documents telemetry, but this handoff has no independent incident
        establishing a distinct cloud-specific stealth axis.
    - key: alert_reduction_metric
      reason: No cited case quantifies detector misses or risk reduction; analytic thresholds and mitigation effects remain
        explicit inferences.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 研究文稿分别展开父级定义、观察差、正常相似行为、攻防前提、子项边界和证据限制。双语段落供主 Agent 重新收敛后正式编写；本文件未分配 NJT/NJS 或共享库 ID。
      en: The research draft separately develops the parent definition, observation difference, benign lookalikes, attacker
        and defender prerequisites, child boundaries, and evidence limits. Bilingual paragraphs are for the primary agent
        to converge before canonical writing; this file allocates no NJT/NJS or shared-library ID.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML syntax check only
  limitations:
    paragraphs:
    - zh: 固定 19.1 工作簿是 ATT&CK 范围与措辞的权威基线；公开技术页可能在以后更新，不能用未来网页变化替换基线。ATT&CK 对“减少 C2 连接”的说明是一般机制陈述，具体事件的连接数、传感器覆盖和告警结果并未公开量化。OWA
        与 BRONZE UNION 案例同时存在归档、改名、Web shell、清理等相邻行为，不能把整个效果都归因于暂存。Calisto 的外联尝试未确认成功，BackdoorDiplomacy 的回收站副本缺少完整后继外传链。正常备份、邮件迁移和
        ETL 具有相似拓扑，需要环境授权与数据分类证据。
      en: The fixed 19.1 workbook is authoritative for ATT&CK scope and wording; later live-page changes cannot replace the
        baseline. ATT&CK's reduced-C2-connections statement is a general mechanism assertion, while incident-specific connection
        counts, sensor coverage, and alerts are not publicly quantified. OWA and BRONZE UNION also involve archiving, renaming,
        web shells, and cleanup, so their whole effect cannot be attributed to staging. Calisto's outbound attempt was not
        confirmed successful, and the BackdoorDiplomacy Recycle Bin copy lacks a complete successor-exfiltration chain. Normal
        backup, mailbox migration, and ETL share similar topology and require environment-specific authorization and data-classification
        evidence.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason: Staging topology or path alone does not transform data content; encrypted archives are T1560 and representation
      concealment belongs to T1027.
  - mechanism_ref: NM-ST
    reason: The proposed funnel concentrates rather than spatially dilutes internal traces; no evidence here establishes low-and-slow
      temporal dilution as a T1074-specific variable.
