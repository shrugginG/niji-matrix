    en: ATT&CK 19.1 supports the causal direction that central staging reduces C2 connections; the two incident reports establish
      intermediate servers and retrieval chains, but public material does not quantify the egress-node convergence ratio in
      either case.
- temporary_key: T1074_CHILD_NAMESPACE_SHIFT
  proposed_status: formal_candidate_with_boundary_review
  name:
    zh: 低审查命名空间暂存
    en: Low-Scrutiny Namespace Staging
  summary:
    zh: 攻击者把已收集数据存入与其敏感性质不符、通常被视作系统废弃物或业务资源的路径，削弱按预期目录巡检的识别能力。
    en: Adversaries place collected data in paths treated as system discard or business resources rather than sensitive stores,
      weakening inspection keyed to expected directories.
  stable_stealth_variable:
    zh: 可控变量是暂存位置的预期用途与真实内容之间的语义偏差；隐藏目录、回收站和 Web 资源目录是实现例子，不各自成为子项。
    en: The controlled variable is the semantic mismatch between a staging location's expected purpose and its actual contents;
      hidden directories, Recycle Bins, and web resource paths are examples, not separate children.
  trace_change:
    zh: 敏感数据副本写入通常不作为敏感数据源监控的路径，可能留下文件创建或元数据事件但不命中路径白名单外的审查规则。
    en: Sensitive copies are written to paths not normally treated as sensitive stores; file-creation or metadata events remain
      but path-scoped inspection may not classify them.
  defender_observation_difference:
    zh: 路径或扩展名驱动的规则可能误判；通过源数据分类、文件内容/格式、异常写入者及后继请求建立跨路径谱系可以恢复。
    en: Path- or extension-led rules may misclassify the object; cross-path lineage using source classification, content or
      format, anomalous writer, and later request can recover it.
  prerequisites_and_scenario:
    zh: 需能在选定路径创建或移动副本，并了解该路径的正常角色；典型证据见 Calisto 隐藏目录、BackdoorDiplomacy 回收站、OWA 资源目录。
    en: The adversary must be able to create or move copies in a selected path and understand its ordinary role; examples
      include Calisto's hidden directory, BackdoorDiplomacy's Recycle Bin, and an OWA resource path.
  sibling_boundary:
    zh: 本项改变的是暂存对象的路径语义，出口是否汇聚无关；单纯重命名归档而不改变暂存位置首先交由 T1036/T1560 评估。
    en: This child changes the staging object's path semantics regardless of egress convergence; merely renaming an archive
      without changing staging context should first be evaluated under T1036/T1560.
  proposed_content:
    definition_and_concept:
      paragraphs:
      - zh: 低审查命名空间暂存是把已取得的数据副本放进常被解释为系统临时物、回收内容、隐藏工作区或业务静态资源的位置，以便后续取用。其核心不是某个目录名，而是暂存数据与该位置预期语义错位，让“看路径判断对象”的流程失去可靠性。
        en: Low-Scrutiny Namespace Staging places copies of already obtained data in locations commonly interpreted as temporary
          system material, discarded content, hidden workspaces, or business static resources for later retrieval. Its core
          is not a directory name but the mismatch between staged data and the location's expected semantics, making path-based
          interpretation unreliable.
    stealth_characteristics:
      paragraphs:
      - zh: 低审查命名空间暂存让敏感数据出现在不被当作敏感库的目录，固定目录规则因此可能漏报或错误归类。文件创建、大小变化、来源到目标的复制和后续读取仍存在；全盘文件元数据、内容敏感度识别及异常写入者关联会压缩这一差异。隐藏标记或良性路径名也不保证不被枚举。
        en: Low-Scrutiny Namespace Staging puts sensitive data in directories not treated as sensitive repositories, so fixed-directory
          rules may miss or misclassify it. File creation, size changes, source-to-target copying, and later reads remain.
          Full-volume metadata, content sensitivity classification, and anomalous-writer correlation reduce the difference.
          A hidden flag or benign path name does not prevent enumeration.
    scope_boundary_definition:
      paragraphs:
      - zh: 只纳入已收集数据的暂存点与预期用途明显错位、且有证据显示该点供后续取用的情况。合法缓存、用户回收文件、应用发布资产和临时导出均可能位于相似路径；需用来源、写入者、内容和后继访问区分。若目标只是给恶意代码改文件名，则由 T1036
          拥有；若真实内容藏在另一载体内部并需提取，则由 T1027 拥有；归档本体由 T1560 拥有。
        en: Include only staging points for collected data whose expected purpose clearly conflicts with the data and which
          are supported as later retrieval locations. Legitimate caches, user-deleted files, published application assets,
          and temporary exports can use similar paths; source, writer, content, and successor access distinguish them. A malicious
          code filename change belongs to T1036; content hidden inside another carrier requiring extraction belongs to T1027;
          the archive container itself belongs to T1560.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 端点恶意程序可先把凭据和浏览器数据汇入隐藏目录，或把可移动介质内容复制到回收站；在服务器侧，攻击者可把邮箱导出归档写入 OWA 可公开请求的静态资源目录。Calisto 和 BackdoorDiplomacy 提供前两种落点，Volexity
            提供服务器链；各案的后续取用程度不同，应避免把 Calisto 未成功的网络连接表述成成功外传。
          en: Endpoint malware may first put credentials and browser data in a hidden directory or copy removable-media contents
            into the Recycle Bin. On a server, an attacker may write a mailbox-export archive into an HTTP-retrievable OWA
            static-resource directory. Calisto and BackdoorDiplomacy support the first two locations, and Volexity the server
            chain. The cases differ in observed retrieval, and Calisto's unsuccessful network contact must not be described
            as successful exfiltration.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者需要已收集数据、选定路径的写权限和后续读取路径；服务器静态资源目录通常需要更高权限或既有 Web 服务器控制。其选择还受路径清理任务、容量、Web 暴露和应用完整性检查限制。
            en: The adversary needs collected data, write access to the chosen location, and a later read path; a server static-resource
              directory often requires elevated rights or existing web-server control. Cleanup jobs, capacity, web exposure,
              and application integrity checks constrain the choice.
        defender_model:
          paragraphs:
          - zh: 假定防守方有路径规则和部分文件创建事件，但未对回收站、隐藏目录或应用静态资源进行内容与来源关联。若有敏感文件审计、全盘创建事件、Web 服务器日志与文件内容标记，仍可看见敏感源到异常落点的迁移。文件被迅速清理、内容加密或源读取缺日志会降低归因强度。
            en: Assume defenders have path rules and partial file-creation events but do not join content and provenance for
              Recycle Bins, hidden directories, or application static resources. Sensitive-file auditing, volume-wide creation
              events, web-server logs, and content labels can still show migration from a sensitive source to an anomalous
              destination. Rapid cleanup, encrypted contents, or missing source-read logs weaken attribution.
    stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 用预期的系统或业务路径外观承载敏感副本
        en: Give sensitive copies the appearance of expected system or business-path content
      analysis:
        paragraphs:
        - zh: 攻击者将数据从敏感来源写入回收、隐藏或业务资源命名空间，路径标签与真实内容的关系因此失真。只按目录意义或扩展名识别的防守方可能把副本当作普通废弃物或应用文件；文件来源、大小、真实格式和后继读取仍可揭示其用途。案例支持落点和链路，具体“降低某机构告警率”仍是依赖传感器配置的推断。
          en: The adversary writes data from a sensitive source into a discarded, hidden, or business-resource namespace,
            distorting the relationship between path label and actual contents. A defender classifying only by directory purpose
            or extension may treat the copy as ordinary discard or application content. Provenance, size, true format, and
            later reads still reveal its purpose. The cases support locations and chains; any claimed reduction in a particular
            organization's alert rate remains conditional on sensor configuration.
      evidence_keys:
      - T1074_REF_CALISTO
      - T1074_REF_ESET_BACKDOOR
      - T1074_REF_KOBALOS
      - T1074_REF_VOLEXITY
      confidence: medium
  evidence_keys:
  - T1074_REF_CALISTO
  - T1074_REF_ESET_BACKDOOR
  - T1074_REF_KOBALOS
  - T1074_REF_VOLEXITY
  defense_candidate_keys:
  - T1074_DET_NAMESPACE
  - T1074_NJA_PATH_SEMANTICS
  - T1074_MIT_STAGING_SURFACE
  evidence_limit:
    zh: 路径偏差与残留文件事件有直接案例支持；攻击者是否专门为避开路径规则而选择每一落点，公开来源没有一致明说，故子项以 medium 提议并要求跨 T1036 边界复核。
    en: The path mismatch and remaining file events have direct case support. Public sources do not consistently state that
      each location was chosen specifically to defeat path rules, so this child is proposed at medium confidence and requires
      a cross-T1036 boundary review.
defense_candidates:
  detection_strategies:
  - temporary_key: T1074_DET_LINEAGE
    name:
      zh: 暂存汇聚到出口的跨节点谱系
      en: Cross-Node Staging-to-Egress Lineage
    objective:
      zh: 识别多个敏感来源在中间节点汇入并由该节点取用或对外传输的因果链。
      en: Identify the causal chain in which multiple sensitive origins converge on an intermediate node that is later retrieved
        or transmits outward.
    subjects:
    - parent
    - T1074_CHILD_EGRESS_CONVERGENCE
    analytic_keys:
    - T1074_NJA_FUNNEL
    evidence_keys:
    - T1074_REF_ATTACK_PARENT
    - T1074_REF_ATTACK_DET_REMOTE
    - T1074_REF_SECUREWORKS
    - T1074_REF_VOLEXITY
    - T1074_REF_MS_5145
    - T1074_REF_MS_SYSMON
    - T1074_REF_MS_IIS
  - temporary_key: T1074_DET_NAMESPACE
    name:
      zh: 敏感数据到异常暂存命名空间的迁移
      en: Sensitive-Data Migration to Anomalous Staging Namespaces
    objective:
      zh: 在文件创建或共享写入之后，识别敏感来源与暂存路径预期用途不一致且随后被取用的副本。
      en: After file creation or share writes, identify copies whose sensitive origin conflicts with the staging path's expected
        purpose and which are subsequently retrieved.
    subjects:
    - parent
    - T1074_CHILD_NAMESPACE_SHIFT
    analytic_keys:
    - T1074_NJA_PATH_SEMANTICS
    evidence_keys:
    - T1074_REF_ATTACK_DET_PARENT
    - T1074_REF_CALISTO
    - T1074_REF_ESET_BACKDOOR
    - T1074_REF_VOLEXITY
    - T1074_REF_MS_4663
    - T1074_REF_MS_SYSMON
    - T1074_REF_MS_IIS
  detection_analytics:
  - temporary_key: T1074_NJA_FUNNEL
    strategy_key: T1074_DET_LINEAGE
    name:
      zh: 多源共享写入与单点出口关联
      en: Many-Source Share Writes to Single Egress Correlation
    platforms:
    - Windows
    logic:
      zh: 在经授权的文件服务器和 Web 服务器上开启成功的 Detailed File Share 审计，并将 5145 的 IpAddress、SubjectUserSid、ShareName、RelativeTargetName、AccessMask
        按目的主机和目录汇总。只把 WriteData 或 AddFile 权限请求视作写入候选，再用同主机 Sysmon 11 的 TargetFilename 和时间确认文件确实创建。若 24 小时内至少两个经资产映射区分的源主机向同一非批准暂存目录写入敏感导出物，且该服务器随后出现外部
        HTTP GET（IIS c-ip、cs-uri-stem、sc-bytes）或异常外联，则输出包含每个来源、对象和取回请求的谱系图。阈值是环境初值，不能单靠 5145 权限检查断言写入成功。
      en: Enable successful Detailed File Share auditing on authorized file and web servers and group event 5145 IpAddress,
        SubjectUserSid, ShareName, RelativeTargetName, and AccessMask by destination host and directory. Treat WriteData or
        AddFile access as a write candidate, then confirm actual creation with the same host's Sysmon 11 TargetFilename and
        time. If at least two asset-mapped source hosts write sensitive exports to one unapproved staging directory within
        24 hours and the server then shows an external HTTP GET (IIS c-ip, cs-uri-stem, sc-bytes) or anomalous outbound connection,
        emit a lineage graph of origins, objects, and retrieval requests. The threshold is an environmental starting point,
        and 5145 access checks alone cannot establish a successful write.
    data_requirements:
    - source_type: windows-security-share-access
      channel: Security/5145
      required_fields:
      - TimeCreated
      - Computer
      - IpAddress
      - SubjectUserSid
      - ShareName
      - RelativeTargetName
      - AccessMask
    - source_type: sysmon-file-create
      channel: Microsoft-Windows-Sysmon/Operational/11
      required_fields:
      - UtcTime
      - Computer
      - Image
      - TargetFilename
    - source_type: iis-http-access
      channel: IIS-W3C
      required_fields:
      - date
      - time
      - c-ip
      - cs-uri-stem
      - sc-bytes
      - sc-status
    correlation:
      window: 24h
      dimensions:
      - destination_host
      - source_host
      - account_sid
      - staging_path
      - object_basename
      - http_uri
    observables:
      zh: 多个源 IP 指向同一共享和目标目录、目标服务器新文件、随后相同路径的外部 HTTP 读取；若对象被重命名，需借助大小、摘要或进程链扩展关联。
      en: Several source IPs target one share and directory, new files appear on the destination server, and external HTTP
        reads follow for the same path; renaming requires size, digest, or process-lineage joins.
    false_positives:
      zh: 备份代理、邮件迁移、集中 ETL 和软件分发也会形成多源到单点，但其授权账户、固定任务、目标目录和取用者通常有记录。
      en: Backup agents, mailbox migration, central ETL, and software distribution can also form many-to-one paths; their
        authorized accounts, scheduled jobs, destinations, and retrievers should be recorded.
    blind_spots:
      zh: 5145 未开启、源 IP 经代理折叠、文件通过非 SMB 路径进入、IIS 不记录目标路径，或归档加密且文件名多次改变时，谱系会不完整。
      en: The lineage is incomplete if 5145 is disabled, proxies collapse source IPs, files arrive without SMB, IIS omits
        the target path, or encrypted archives are renamed repeatedly.
    tuning:
      zh: 按服务器角色建立批准的备份和迁移源、目录、时段及取回者清单；保留对批准任务以外的新源、新路径和 Web 取回的检测，不把整台服务器永久排除。
      en: Baseline approved backup and migration sources, directories, windows, and retrievers by server role; retain detection
        for new sources, new paths, and web retrieval outside the approved job instead of exempting the whole server.
    evidence_keys:
    - T1074_REF_MS_5145
    - T1074_REF_MS_SYSMON
    - T1074_REF_MS_IIS
    - T1074_REF_SECUREWORKS
    - T1074_REF_VOLEXITY
    inference_note: The 24h window and two-source threshold are proposed tuning values, not parameters established by the
      cited cases.
  - temporary_key: T1074_NJA_PATH_SEMANTICS
    strategy_key: T1074_DET_NAMESPACE
    name:
      zh: 非预期路径的敏感副本与后续读取
      en: Sensitive Copies in Unexpected Paths with Successor Reads
    platforms:
    - Windows
    logic:
      zh: 对选定敏感源启用文件系统审计 SACL，并用 4663 中的 ObjectName、SubjectUserSid、ProcessName、AccessMask 识别读取候选；用 Sysmon 11 的 Image、TargetFilename、UtcTime
        在同账户或进程谱系下寻找新副本。若目标位于回收站、Web 静态资源或其他非批准暂存命名空间，且文件大小、内容标签或摘要与源相符，再关联目标文件后续读取或 IIS 请求以升级告警。无法获得内容标签时只给出路径异常和时间关系，不把文件名相似当作内容同一性的证明。
      en: Enable file-system auditing SACLs on selected sensitive sources and use event 4663 ObjectName, SubjectUserSid, ProcessName,
        and AccessMask to identify read candidates. Join Sysmon 11 Image, TargetFilename, and UtcTime for new copies in the
        same account or process lineage. If the destination is a Recycle Bin, web static-resource path, or another unapproved
        staging namespace and size, content label, or digest matches the source, join a successor read or IIS request to raise
        confidence. Without content labels, report only path anomaly and temporal relation; similar filenames do not prove
        content identity.
    data_requirements:
    - source_type: windows-security-file-access
      channel: Security/4663
      required_fields:
      - TimeCreated
      - Computer
      - ObjectName
      - SubjectUserSid
      - ProcessName
      - AccessMask
    - source_type: sysmon-file-create
      channel: Microsoft-Windows-Sysmon/Operational/11
      required_fields:
      - UtcTime
      - Computer
      - Image
      - TargetFilename
    - source_type: iis-http-access
      channel: IIS-W3C
      required_fields:
      - date
      - time
      - c-ip
      - cs-uri-stem
      - sc-bytes
      - sc-status
    correlation:
      window: 2h
      dimensions:
      - host
      - account_sid
      - process_lineage
      - source_path
      - destination_path
      - content_fingerprint
      - http_uri
    observables:
      zh: 敏感源访问后非预期目录创建副本、目标对象大小或摘要相符、后继读取或 Web 请求；Unix/macOS 需另用可证实的文件事件实现。
      en: A copy appears in an unexpected directory after sensitive-source access, size or digest matches, and a later read
        or web request follows; Unix/macOS require a separately supported file-event implementation.
    false_positives:
      zh: 正常邮件导出、用户恢复已删文件、应用缓存生成和应急取证都可能产生类似源到临时路径的迁移。
      en: Legitimate mailbox exports, user restoration of deleted files, application cache generation, and incident-response
        collection can resemble a source-to-temporary-path move.
    blind_spots:
      zh: 未配置 SACL、源数据在数据库而非文件中、目标只存在于注册表或内存、文件被快速删除、加密或重新打包时，文件谱系可能无法建立。
      en: File lineage may fail if SACLs are absent, the source is a database rather than a file, the destination exists only
        in Registry or memory, or the file is rapidly deleted, encrypted, or repackaged.
    tuning:
      zh: 维护各主机角色的可写目录与批准导出流程；监控 Web 根目录和回收站中的新大文件或敏感内容，但应结合写入者与后继取用，避免把正常系统清理当作外传准备。
      en: Maintain role-specific writable paths and approved export workflows; watch for new large or sensitive objects in
        web roots and Recycle Bins, but require writer and successor-use context so normal cleanup is not classified as exfiltration
        preparation.
    evidence_keys:
    - T1074_REF_MS_4663
    - T1074_REF_MS_SYSMON
    - T1074_REF_MS_IIS
    - T1074_REF_CALISTO
    - T1074_REF_ESET_BACKDOOR
    - T1074_REF_KOBALOS
    - T1074_REF_VOLEXITY
    inference_note: The 2h window is a proposed environment-dependent join period, not a measured attacker dwell time.
  mitigations:
  - temporary_key: T1074_MIT_STAGING_SURFACE
    name:
      zh: 限制敏感导出落点与出口节点
      en: Constrain Sensitive-Export Destinations and Egress Nodes
    purpose:
      zh: 通过限定谁能把敏感数据写到可外部取用的目录或汇聚服务器，并保持暂存点与外联的独立审计，减少隐蔽暂存机会。
      en: Reduce covert staging opportunities by constraining who may write sensitive data to externally retrievable directories
        or aggregation servers and by retaining independent audit of staging points and egress.
    measures:
    - key: approved_export_destinations
      control_type: preventive
      action:
        zh: 为敏感邮箱导出、文件共享和数据库转储指定受控落点；取消普通账户在 Web 静态资源、回收站以外异常系统目录和临时共享上的不必要写权限，审计例外。
        en: Assign controlled destinations for sensitive mailbox exports, shares, and database dumps; remove unnecessary ordinary-account
          write rights to web static resources, unusual system paths, and temporary shares, with audited exceptions.
    - key: egress_role_separation
      control_type: exposure-reduction
      action:
        zh: 使汇聚服务器的外联目的地与源主机权限按角色最小化；外部可访问 Web 服务器不应同时成为未经批准的敏感数据汇聚点。
        en: Minimize outbound destinations and source-host rights for aggregation servers by role; an Internet-facing web
          server should not also be an unapproved sensitive-data aggregation point.
    - key: independent_staging_audit
      control_type: detective-support
      action:
        zh: 对批准导出目录保留文件或对象访问日志、共享访问日志和 Web 请求日志，并以独立权限保存，保证能复原源、暂存点和取用者。
        en: Retain file or object access, share access, and web request logs for approved export locations under independent
          access control so source, staging point, and retriever can be reconstructed.
    applications:
    - target: parent
      use:
        zh: 把数据导出路径与可外部取用的服务器分离，并持续审查新增临时目录和共享的写权限。
        en: Separate data-export destinations from externally retrievable servers and continuously review write rights on
          newly created temporary directories and shares.
      expected_effect:
        zh: 提高建立任意暂存点的权限成本，并为正常导出与异常暂存建立可核对基线。
        en: Raise the permission cost of arbitrary staging points and create an auditable baseline separating normal exports
          from anomalous staging.
      limitations:
        zh: 已取得管理员或云存储控制权的攻击者仍可能创建新路径；控制需要持续权限审查，不能阻止在批准目录内发生的恶意复制。
        en: An adversary with administrator or cloud-storage control may create new paths; the measure requires ongoing rights
          review and cannot stop malicious copying inside an approved directory.
    - target: T1074_CHILD_EGRESS_CONVERGENCE
      use:
        zh: 对可接收多台主机数据的服务器限定来源、写入账户和对外连接目的地，并将备份/迁移任务列为有期限的例外。
        en: Limit source hosts, writing accounts, and outbound destinations for servers able to receive data from many hosts;
          make backup and migration jobs time-bounded exceptions.
      expected_effect:
        zh: 减少攻击者能选作单一出口的内部节点，并使新来源或新外联关系更突出。
        en: Reduce internal nodes usable as a single egress point and make new sources or outbound relationships more conspicuous.
      limitations:
        zh: 正常集中备份也需要多源入站，过严限制会影响运维；受控账户被盗或允许的出口被滥用仍可能绕过。
        en: Legitimate central backup also needs many-source ingress, so strict controls can disrupt operations; stolen approved
          accounts or allowed egress paths may still be abused.
    - target: T1074_CHILD_NAMESPACE_SHIFT
      use:
        zh: 阻止非部署流程向 Web 静态资源写入，审查回收站及隐藏工作区中的敏感副本，并将导出工具绑定到批准目录。
        en: Prevent non-deployment workflows from writing web static resources, review sensitive copies in Recycle Bins and
          hidden workspaces, and bind export tools to approved directories.
      expected_effect:
        zh: 缩小“敏感内容落入低审查路径”的机会，同时使异常写入具有更高区分度。
        en: Narrow opportunities for sensitive content to enter low-scrutiny paths and make anomalous writes more discriminating.
      limitations:
        zh: 回收站和临时目录无法整体禁止写入；管理员权限、应用漏洞和合法进程代理仍可写入，内容加密会降低敏感度识别。
        en: Recycle Bins and temporary directories cannot be made wholly unwritable; administrative access, application flaws,
          and legitimate process proxies may still write there, and encryption weakens sensitivity classification.
    evidence_keys:
    - T1074_REF_VOLEXITY
    - T1074_REF_SECUREWORKS
    - T1074_REF_MS_5145
    - T1074_REF_MS_4663
    - T1074_REF_MS_IIS
    inference_note: Control effects are reasoned from the observed write-and-retrieve chains; no cited source measures their
      prevention rate.
