  relationship_refs: []
  notes:
    zh: 对现有共享库执行 automated collection、file monitoring、sensitive file access、object access audit、S3 data events、least privilege sensitive data、Bitdefender FunnyDream 等查询，并用 rg 精确查 T1119、FunnyDream、FilePakMonitor 与 4663 ReadData；未发现同一来源或同一防御逻辑的明确可复用对象。主 Agent 须在写入前重跑 catalog 与查重，并裁定与本批 T1560/T1074 的共享对象关系。
    en: Searches for automated collection, file monitoring, sensitive file access, object access audit, S3 data events, least privilege sensitive data, and Bitdefender FunnyDream, plus exact-text checks for T1119, FunnyDream, FilePakMonitor, and 4663 ReadData, found no clear identical source or defense logic in the current library. The primary agent should rerun the catalog and duplicate checks before writing and resolve sharing with T1560 and T1074.
library_candidates:
  references:
    - key: T1119_REF_ATTACK19
      title: "Automated Collection, Technique T1119 - Enterprise"
      url: https://attack.mitre.org/techniques/T1119/
      fixed_version_basis: "Repository ATT&CK Enterprise v19.1 workbook, techniques sheet row 60"
      supports: [parent_behavior, tactic_mapping, zero_attack_children, example_variety, baseline_detection_leads]
      excludes: [niji_child_stealth_effect, analytic_thresholds, mitigation_effect]
    - key: T1119_REF_BITDEFENDER_FUNNYDREAM
      title: "Dissecting a Chinese APT Targeting South Eastern Asian Government Institutions"
      author: Bitdefender DracoTeam
      url: https://www.bitdefender.com/files/News/CaseStudies/study/379/Bitdefender-Whitepaper-Chinese-APT.pdf
      evidence_location: "PDF pp. 3-4, 18-19; especially PDF text lines 603-616: 12-hour listing, ft.data SYSTEMTIME, changed-since-last-pass selection, WM_DEVICECHANGE removable-drive trigger"
      supports: [incremental_selector_implementation, first_pass_and_later_pass_boundary, checkpoint_artifact, arrival_trigger_observed]
      excludes: [measured_detection_evasion, cloud_generalization, universal_actor_intent]
    - key: T1119_REF_MS_4663
      title: "4663(S): An attempt was made to access an object"
      author: Microsoft
      url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663
      supports: [windows_file_read_event_fields, ReadData_access_mask, SACL_condition]
    - key: T1119_REF_MS_FILE_AUDIT
      title: "Audit Policy CSP - ObjectAccess_AuditFileSystem"
      author: Microsoft
      url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-audit
      supports: [audit_file_system_configuration, SACL_requirement, event_volume_caveat]
    - key: T1119_REF_MS_FILE_RIGHTS
      title: "File Security and Access Rights"
      author: Microsoft
      url: https://learn.microsoft.com/en-us/windows/win32/fileio/file-security-and-access-rights
      supports: [windows_file_read_access_control, backup_exception_caveat]
    - key: T1119_REF_AWS_S3_EVENTS
      title: "Amazon S3 CloudTrail events"
      author: Amazon Web Services
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-s3-info.html
      supports: [GetObject_data_event, data_events_not_default]
    - key: T1119_REF_AWS_CLOUDTRAIL_FIELDS
      title: "CloudTrail record contents for management, data, and network activity events"
      author: Amazon Web Services
      url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
      supports: [cloudtrail_identity_eventname_sourceip_useragent_requestparameters]
    - key: T1119_REF_AWS_S3_ACCESS
      title: "Access control in Amazon S3"
      author: Amazon Web Services
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-management.html
      supports: [narrow_GetObject_permission_scope, bucket_policy_read_controls]
  claims:
    - key: T1119_CLM_ADMISSION
      subject_keys: [T1119_PARENT]
      proposition:
        zh: T1119 的自动获取是 Collection 行为，但只有攻击者控制的范围或时机改变了获取痕迹时才能纳入匿迹矩阵。
        en: T1119 automated acquisition is Collection behavior, but it enters the stealth matrix only when attacker-controlled scope or timing changes acquisition traces.
      evidence_keys: [T1119_REF_ATTACK19, T1119_REF_BITDEFENDER_FUNNYDREAM]
      evidence_mode: baseline_plus_analysis
      confidence: medium
    - key: T1119_CLM_INCREMENTAL_IMPLEMENTATION
      subject_keys: [T1119_PARENT, T1119_CHILD_INCREMENTAL]
      proposition:
        zh: FilePakMonitor 首轮后用 ft.data 的上次列举时间只选取此后发生变化的文件，而不是每轮重收全部匹配文件。
        en: After its first pass, FilePakMonitor uses the previous listing time in ft.data to select only files changed since that pass, rather than recollecting all matching files every time.
      evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM]
      evidence_mode: reverse_engineering_observation
      confidence: high
    - key: T1119_CLM_INCREMENTAL_DEFENDER_EFFECT
      subject_keys: [T1119_PARENT, T1119_CHILD_INCREMENTAL]
      proposition:
        zh: 当源文件变化率较低且检测仅看短时间大量读取时，增量选择可降低后续单轮读取规模并增加跨轮重建需求；这并非报告实测的规避效果。
        en: When source-file change rates are low and detection depends on short-window bulk reads, incremental selection can reduce later per-pass volume and increase the need for cross-pass reconstruction; this is not an evasion effect measured in the source report.
      evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM, T1119_REF_MS_4663]
      evidence_mode: bounded_inference
      confidence: medium
    - key: T1119_CLM_READ_TELEMETRY
      subject_keys: [T1119_PARENT, T1119_CHILD_INCREMENTAL]
      proposition:
        zh: 配置敏感文件 SACL 与 Audit File System 后，Windows 4663 可提供 ReadData、对象、进程和主体字段来关联源读取；未配置时不能假设有该遥测。
        en: With a sensitive-file SACL and Audit File System configured, Windows 4663 can supply ReadData, object, process, and subject fields for source-read correlation; the telemetry must not be assumed otherwise.
      evidence_keys: [T1119_REF_MS_4663, T1119_REF_MS_FILE_AUDIT]
      evidence_mode: vendor_documentation
      confidence: high
    - key: T1119_CLM_CLOUD_LOGGING_LIMIT
      subject_keys: [T1119_PARENT]
      proposition:
        zh: CloudTrail 可记录 S3 GetObject 对象数据事件，但这类事件默认不启用，云端检测必须明确选择敏感桶并保持记录。
        en: CloudTrail can record S3 GetObject object data events, but these are not enabled by default, so cloud detection must explicitly select sensitive buckets and retain events.
      evidence_keys: [T1119_REF_AWS_S3_EVENTS]
      evidence_mode: vendor_documentation
      confidence: high
  cases:
    - key: T1119_CASE_FUNNYDREAM
      name:
        zh: FunnyDream FilePakMonitor 的状态化文档收集
        en: FunnyDream FilePakMonitor Stateful Document Collection
      scope: "Bitdefender investigation of Southeast Asian government targets, observed from 2018 onward; FilePakMonitor module behavior, not an asserted measurable stealth outcome"
      observed_facts:
        - "The first pass limited target document extensions and recent modification time."
        - "Subsequent listings ran every 12 hours and used ft.data SYSTEMTIME to select files changed after the previous listing."
        - "Removable-media arrival events separately triggered collection from removable drives."
      evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM]
  detection_strategies: [T1119_DET_SOURCE_READ_LINEAGE]
  detection_analytics: [T1119_NJA_WINDOWS_INCREMENTAL, T1119_NJA_S3_REPEATED_READ]
  mitigations: [T1119_MIT_SOURCE_READ_GOVERNANCE]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: changed_since_checkpoint_selection
        resolution: formal
        reason: "Stable attacker-controlled state; narrower later read set; distinct long-horizon detection; Bitdefender implementation evidence."
      - axis: source_arrival_trigger
        resolution: evidence-deferred
        reason: "Observed WM_DEVICECHANGE trigger but all-file burst may be more visible; source-medium overlap with T1025."
      - axis: workflow_context_trigger
        resolution: evidence-deferred
        reason: "RTM URL-conditioned screenshots show a possible trigger but primarily T1113, and a T1119-specific stealth effect is unproven."
      - axis: fixed_periodic_schedule
        resolution: parent-core
        reason: "Periodicity is baseline T1119 automation, not intrinsically stealth; schedule creation belongs to execution/persistence."
      - axis: extension_or_location_filter
        resolution: parent-core
        reason: "Target criteria in T1119; an extension or path is not a stable stealth variable by itself."
      - axis: checkpoint_location_or_archive_type
        resolution: adjacent-technique
        reason: "Storage location belongs to T1074 and archive representation to T1560."
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 无子项不表示 Niji 无分类。已在变化状态、来源接入事件、用户工作流条件、固定周期与目标字段范围上开放检索；仅变化检查点同时满足稳定变量、痕迹变化、独立防守差异和直接实现证据。来源事件及工作流触发保留为研究候选，主 Agent 可在跨技术边界评审后裁定。
      en: Zero ATT&CK children does not imply zero Niji children. The search covered change state, source-arrival events, user-workflow conditions, fixed periodicity, and target-field scope. Only the change checkpoint currently meets the stable-variable, trace-change, distinct-defense, and direct-implementation evidence gates. Source-event and workflow triggers remain research candidates for the primary agent's cross-technique review.
  evidence_coverage:
    parent_behavior_keys: [T1119_REF_ATTACK19]
    boundary_keys: [T1119_REF_ATTACK19, T1119_REF_BITDEFENDER_FUNNYDREAM]
    mechanism_support:
      - mechanism_ref: NM-ST
        keys: [T1119_REF_BITDEFENDER_FUNNYDREAM, T1119_REF_MS_4663]
        direct_observation: "Incremental selector and checkpoint are observed; detector-threshold effect is bounded inference."
    child_existence_support:
      - child_key: T1119_CHILD_INCREMENTAL
        keys: [T1119_REF_BITDEFENDER_FUNNYDREAM]
        conclusion_scope: "Host document-collection implementation; not cloud or all platforms."
    unsupported_or_deferred:
      - "No source establishes stealth from a scheduled task or script merely existing."
      - "No measured evasion rate or quantitative threshold for FilePakMonitor."
      - "No evidence yet that source-arrival collection reduces traces; it may burst."
      - "No case-level proof of a cloud incremental Niji child; cloud analytic is parent-level design."
      - "No evidence that DeviceFileEvents alone records all reads."
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级与拟议子级分别覆盖定义、匿迹特性、范围、场景、攻击者与防守方模型、机理、证据及限制；具体论述建立在 FilePakMonitor 的检查点状态和 Windows 读取审计条件上。NJT-0001 仅作字段责任与论证深度对照，未复用其扫描结论。
      en: Parent and proposed child each cover definition, stealth properties, boundary, scenario, attacker and defender models, mechanism, evidence, and limits. The argument is specific to FilePakMonitor's checkpoint state and conditions for Windows read auditing. NJT-0001 was used only to check field responsibility and argument depth, not as evidence.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: ["Fixed-workbook row extraction with Python standard-library ZIP/XML", "Shared-library lookup and exact-text search"]
  limitations:
    paragraphs:
      - zh: 固定工作簿与 ATT&CK 页面证明 T1119 的通用行为，不证明任一自动收集天然匿迹。FilePakMonitor 报告证明状态化选择和残余状态文件，却未测量告警概率；短窗阈值下降需按具体目录变化率与审计配置检验。Windows 4663 和 S3 CloudTrail 仅为特定已启用遥测面，不能直接覆盖其他平台或缺失审计的环境。
        en: The fixed workbook and ATT&CK page establish general T1119 behavior, not that automated collection is inherently stealthy. The FilePakMonitor report establishes stateful selection and a residual state file but does not measure alert probability; a reduced short-window signal must be tested against local change rates and auditing. Windows 4663 and S3 CloudTrail are specific enabled telemetry surfaces, not coverage for other platforms or environments without auditing.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 归档加密与内容不可读性属于 T1560 或后续处理，不能从自动获取或增量选择推出。
        en: Archive encryption and content opacity belong to T1560 or later processing, not automated acquisition or incremental selection.
    - mechanism_ref: NM-FD
      reason:
        zh: 合法备份也可能增量，但报告未证明攻击者伪装成备份身份或模仿其特征。
        en: Legitimate backups can be incremental, but the report does not establish that the actor impersonated a backup identity or imitated its features.
    - mechanism_ref: NM-BT
      reason:
        zh: 未启用读取审计是防守盲区，但没有证据表明该样本有意定位或利用特定盲区。
        en: Absent read auditing is a defender blind spot, but no evidence shows this sample deliberately selected or exploited a specific coverage gap.
  open_questions:
    - "Can the primary agent identify a distinct, conclusion-supported event- or workflow-gated acquisition child without crossing into T1025, T1113, or T1056?"
    - "Can T1560/T1074 share any source-read strategy without changing its objective or analytic logic?"
    - "Does a fixed baseline source snapshot exist for the MITRE detection strategy URL, or should it remain a design lead rather than formal evidence?"
