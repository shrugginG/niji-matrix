handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0009-001
work_item_ref: WORK-TA0009-T1119
temporary_key_prefix: T1119_
candidate:
  source_type: attack
  source_attack_id: T1119
  name:
    zh: 自动收集
    en: Automated Collection
  fixed_baseline:
    domain: enterprise-attack
    version: "19.1"
    workbook: data/mitre-attck/enterprise/v19.1/excel/enterprise-attack-v19.1-techniques.xlsx
    workbook_row: "techniques sheet row 60; T1119 version 1.4; Collection; zero ATT&CK children"
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  proposed_name:
    zh: 匿迹约束的自动收集
    en: Stealth-Constrained Automated Collection
  rationale:
    paragraphs:
      - zh: ATT&CK T1119 的固定版本将规则化、周期性或工具内置的内部数据自动获取列入 Collection，范围覆盖主机与云端；这为父技术提供稳定的行为锚点。自动执行本身并不改变可见性，定时任务、脚本或 API 调用的存在更不能证明匿迹，因此建议 adapt：仅在攻击者有意控制获取集合、重复访问范围或触发时机，且这种控制改变痕迹及防守观察时，纳入正式匿迹技术。Bitdefender 对 FunnyDream FilePakMonitor 的逆向分析直接记录了首轮后依上次扫描时间只收集已变化文件，足以支持状态化的收集范围变量；“因此更难发现”是基于访问量和跨时关联的分析推断，不能写成该报告实测结论。
        en: The fixed T1119 baseline anchors rule-driven, periodic, or tool-integrated automated acquisition of internal data under Collection across hosts and cloud services. Automation alone does not change visibility, and the presence of a scheduled task, script, or API call does not establish stealth. Adapt the candidate to cases in which the adversary intentionally controls the acquisition set, repeated-access scope, or trigger timing and that control changes traces and defender observation. Bitdefender's reverse engineering of FunnyDream FilePakMonitor directly documents collection of only files changed since the previous scan after an initial pass, supporting a stateful collection-scope variable. Reduced detectability is an inference from access volume and the need for cross-time correlation, not an outcome measured by that report.
proposed_content:
  summary:
    zh: 攻击者用预设规则和状态持续获取内部数据，并约束每次获取的范围或时机，以减少单次可见收集痕迹，同时留下可跨轮次关联的访问记录。
    en: An adversary uses predefined rules and state to acquire internal data repeatedly while constraining the scope or timing of each acquisition, reducing each visible collection episode while leaving access records that can be correlated across runs.
  definition_and_concept:
    paragraphs:
      - zh: 匿迹约束的自动收集指入侵者在已获得的主机、账户或云资源访问权限内，配置代理、脚本、计划流程或 API 客户端按规则反复取得内部数据，并通过可重复的范围或触发控制降低收集动作的显著性。行为核心是从源对象读取或复制数据；规则可以选择文件、对象、变化状态或事件窗口，但只有其对痕迹有因果作用时才构成匿迹特性。
        en: Stealth-constrained automated collection is the repeated acquisition of internal data through an agent, script, scheduled workflow, or API client operating with access already obtained by an intruder. A repeatable scope or trigger constraint makes individual collection episodes less conspicuous. The core behavior is reading or copying source objects. Rules may select files, objects, change state, or event windows, but they count as stealth properties only when they causally alter the traces left behind.
      - zh: 该技术表达的是数据获取的编排维度，可以与从本地系统、共享驱动器、云存储或电子邮件获取数据同时出现。它不把后续暂存、归档压缩或外传定义为自动收集的必要步骤，也不因工具同时提供这些功能而吞并相邻父技术。正式对象应保留 ATT&CK T1119 的自动化获取锚点，同时显式要求匿迹变量成立。
        en: This technique describes the orchestration of acquisition and can coexist with collection from a local system, a shared drive, cloud storage, or email. Subsequent staging, archive creation, and exfiltration are separate operations rather than required stages of automated collection, even when one tool performs all of them. The formal object should retain T1119's automated-acquisition anchor while explicitly requiring an established stealth variable.
  stealth_characteristics:
    paragraphs:
      - zh: 状态化的筛选能够让后续轮次只读取近期变化的目标，减少单轮重复读取的文件数和目录广度；在以短时间大量读取为条件的告警中，局部信号可能下降，但这些较小活动仍会在较长时间内累积。首次基线扫描、定期列目录、检查点文件和目标文件的实际读取仍然可见；攻击者不能凭“自动”或“低频”推导出不可见。
        en: Stateful selection can limit later passes to recently changed targets, reducing repeated file reads and directory breadth per pass. Local signals may fall below rules that require a large short-window read burst, while smaller episodes accumulate over a longer horizon. The initial baseline pass, directory enumeration, checkpoint artifact, and actual reads remain observable; neither automation nor a low frequency implies invisibility.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入有可核验获取规则、重复或自动触发、并有意改变获取痕迹的内部数据收集。T1560 的归档容器形成、T1074 的汇聚位置与暂存生命周期、T1020 的自动外传，以及 T1053 或其他执行技术的任务注册和触发，由各自对象负责；T1119 只描述收集判定和源数据取得。文件扩展名、目标平台、任务调度器或 API 产品不是 Niji 子技术边界。
        en: Include internal-data acquisition with verifiable rules and repeated or automatic triggering when those rules intentionally change acquisition traces. T1560 owns archive-container formation, T1074 owns the aggregation location and staging lifecycle, T1020 owns automated exfiltration, and T1053 or other execution techniques own task registration and launch. T1119 covers the decision to collect and the acquisition from source objects. File extensions, target platforms, schedulers, and API products are not Niji child boundaries.
      - zh: 正常备份、企业搜索索引、同步、ETL、电子发现和安全扫描也可能定期读取相同文件，甚至采用增量规则。仅凭重复性、检查点、文件数量或夜间运行无法判定恶意；需要结合进程或身份来源、授权作业清单、读取目标敏感性、任务配置和后续去向。按活动窗口捕获屏幕或键盘内容可能归 T1113/T1056；只有其自动触发如何改变收集痕迹得到独立证明时，才可同时从 T1119 角度讨论。
        en: Legitimate backup, enterprise indexing, synchronization, ETL, e-discovery, and security scans may read the same files periodically and may also use incremental rules. Repetition, a checkpoint, file count, or nighttime execution cannot by itself establish malice. Process or identity provenance, an inventory of authorized jobs, target sensitivity, task configuration, and subsequent destinations must be considered. Screen or keystroke capture during an activity window may belong to T1113 or T1056; a T1119 interpretation additionally requires independent proof that its automated trigger changes collection traces.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者取得持续访问后，希望长期获取新增或修改的文档，而持续全盘复制会反复触及大量静态文件。其收集组件可以先建立基线，再在后续轮次按变化时间选择目标，使资料逐渐进入攻击者控制的处理链。Bitdefender 记录的 FilePakMonitor 属于此类场景，但该工具随后把文件装入归档并传送的阶段仍须分别归 T1560、T1074 或外传技术。
          en: After gaining persistent access, an adversary may want newly created or modified documents over a long period while avoiding repeated copies of the same static files. A collector can establish an initial baseline and select targets by modification time on later passes, gradually feeding the adversary's processing chain. Bitdefender's FilePakMonitor illustrates such acquisition, while its later archive and transfer stages still require separate treatment under T1560, T1074, or exfiltration techniques.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者至少需要可读取目标数据的身份或进程权限、运行重复收集逻辑的能力，以及存储上次扫描状态或从源端取得变化信息的途径。增量方案还要求可靠的时间比较、跨重启状态延续和对首次基线扫描较高可见性的容忍；时间戳被重写、文件被替换或权限变化会造成漏收。对云 API 的泛化需另证具体服务的枚举和读取权限。
            en: The adversary needs an identity or process that can read target data, a way to run repeated collection logic, and a checkpoint or source-side change signal. An incremental design also requires reliable time comparison, state persistence across runs, and tolerance for a more visible initial baseline. Rewritten timestamps, replaced files, or permission changes may make it miss data. Applying the model to a cloud API requires separate evidence for that service's enumeration and read permissions.
      defender_model:
        paragraphs:
          - zh: 防守方若只保留进程启动或短窗大批量复制告警，可能看到任务而无法识别低量的后续源文件读取。对于启用了敏感目录 SACL 和 Audit File System 的 Windows 主机，4663 可记录主体、对象、进程与 ReadData 权限；文件改动事件可提供比较基线。防守方仍需足够长的保留期、稳定的进程与身份关联键，以及获授权作业清单，才能区分增量窃取与正常备份或同步。未启用读取审计时，不能声称仅用 DeviceFileEvents 的创建/修改事件恢复全部读取。
            en: A defender retaining only process launches or short-window bulk-copy alerts may see a task yet miss low-volume source reads in later passes. On Windows hosts where sensitive-directory SACLs and Audit File System are enabled, event 4663 can record the subject, object, process, and ReadData right; file modification events supply a comparison baseline. The defender still needs sufficient retention, stable process and identity correlation keys, and an authorized-job inventory to distinguish incremental theft from backup or synchronization. Without read auditing, creation and modification events in DeviceFileEvents cannot be assumed to reconstruct all reads.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 用变化检查点收缩后续收集轮次的访问范围
        en: Change checkpoints narrow the access scope of subsequent collection passes
      analysis:
        paragraphs:
          - zh: 收集组件在首轮后保存上次列举时间，并让后续轮次主要处理此后变更的文件。相较每轮重复读取完整目标集，每次活动触及的对象更少，按短窗读取总量或目录扇出判断的检测更难在单轮恢复完整行为；防守方必须跨轮次把同一进程或身份对不同文件的读取与检查点更新关联起来。Bitdefender 证明了该选择机制和残留检查点，降低告警强度与匿迹收益则是有条件的推断，取决于源文件变化率及监测配置。
            en: After an initial pass, the collector stores the previous listing time and mostly processes files changed since then. Compared with rereading the whole target set on every run, each episode touches fewer objects, so a detector based on short-window read volume or directory fan-out may fail to reconstruct the whole operation from one episode. The defender must link reads by the same process or identity and checkpoint updates across runs. Bitdefender establishes the selection logic and residual checkpoint; lower alert strength and stealth benefit are conditional inferences that depend on file-change rate and monitoring configuration.
      evidence_keys: [T1119_REF_ATTACK19, T1119_REF_BITDEFENDER_FUNNYDREAM]
      confidence: medium
proposed_subtechniques:
  - temporary_key: T1119_CHILD_INCREMENTAL
    recommendation: formal
    confidence: medium
    name:
      zh: 变化检查点约束的增量收集
      en: Change-Checkpoint-Constrained Incremental Collection
    stable_stealth_variable:
      zh: 攻击者保存上次收集边界，并用“上次之后变化”而非每轮全量重读来决定哪些源对象进入下一轮。
      en: The adversary preserves the previous collection boundary and selects source objects changed since that boundary instead of rereading the full set on each pass.
    distinct_trace_and_defender_effect:
      zh: 首轮与后续轮次形成不对称访问谱，后续单轮读取量变小，同时出现状态文件或等效状态以及跨轮次的稳定进程或身份。防守方需关联多轮读取和源文件修改记录；仅监控大规模即时复制会漏掉后续低量访问。
      en: >-
        The initial pass and later passes show an asymmetric access profile: later per-pass read volume is lower, while a state file or equivalent state and a recurring process or identity remain. Defenders must correlate multiple read episodes with source-file modifications; rules limited to immediate bulk copying may miss later low-volume access.
    sibling_boundary:
      zh: 本项以“按变化状态收缩被读取对象集合”为边界；按设备接入或用户动作启动收集属于触发时机轴，不论是否同时读取增量。扩展名过滤和文件位置只是父技术的目标条件。
      en: This child is bounded by narrowing the objects read according to change state. Launching acquisition after device arrival or user activity is a trigger-timing axis, even when it also uses incremental selection. File-extension and location filters are parent-level target criteria.
    prerequisites_and_scenario:
      zh: 需要首次扫描、持久检查点和重复读取权限；适用于长期潜伏中持续获取新近变更文档，且静态存量较大而单轮全量访问会显著增加痕迹的环境。
      en: It requires an initial scan, persistent checkpoint, and repeated read rights. It applies to a long-lived foothold gathering recently changed documents where a large static corpus would make full rereads conspicuous.
    proposed_content:
      summary:
        zh: 攻击者在自动收集的首轮后保存变化边界，后续只获取此后修改的目标，以缩小每轮读取集合。
        en: After the first automated collection pass, the adversary saves a change boundary and acquires only targets modified since it, narrowing each later read set.
      definition_and_concept:
        paragraphs:
          - zh: 变化检查点约束的增量收集是一种状态化自动获取方式。它先识别目标集合并记录时间或版本边界，再在下一轮把源对象的变化属性与边界比较，只读取满足条件者。该项定义的是进入收集轮次的判定规则，不定义读取后的归档格式或暂存位置。
            en: Change-checkpoint-constrained incremental collection is a stateful mode of automated acquisition. It first identifies a target set and records a time or version boundary, then compares source-object change attributes with that boundary on later runs and reads only qualifying objects. The child defines admission to an acquisition pass, not the archive format or staging location after a read.
      stealth_characteristics:
        paragraphs:
          - zh: 变化检查点约束的增量收集（Change-Checkpoint-Constrained Incremental Collection）将后续读取分摊到较小的变化集合，减少重复触及静态对象，使短窗批量访问告警可能缺少完整图像。它仍留下首轮扫描、列举、源文件读取和检查点更新；若被监控目录本身快速变化或审计能跨轮次关联，匿迹效果会减弱。
            en: Change-Checkpoint-Constrained Incremental Collection limits later reads to smaller changed sets, avoiding repeated access to static objects and potentially fragmenting the view of short-window bulk-read alerts. It still leaves the first scan, enumeration, source reads, and checkpoint updates. Its stealth effect weakens when monitored directories change rapidly or auditing correlates runs over time.
      scope_boundary_definition:
        paragraphs:
          - zh: 纳入由攻击者控制的持久变化边界及其对后续读取集合的约束；首轮全量扫描是建立该状态的前提，不是独立子项。仅按扩展名、路径或每日时间读取不构成此子项，正常备份和同步使用相似状态机制时须以授权、执行谱系与数据去向区分。文件复制后的本地汇聚和归档交给 T1074 与 T1560。
            en: Include an attacker-controlled persistent change boundary that constrains later read sets; the initial full pass establishes this state and is not a separate child. Filtering only by extension, path, or daily time does not qualify. Legitimate backup and synchronization use similar state, so authorization, execution lineage, and data destination must distinguish them. Local aggregation and archive creation after copying belong to T1074 and T1560.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: 在长期文档窃取中，攻击者先完成一次可承受的基线获取，随后让组件在每轮只提取新近修改文件。Bitdefender 观察到 FilePakMonitor 每 12 小时列举，首轮受 20 天修改条件限制，后续依 ft.data 中的 SYSTEMTIME 选择上轮之后变化文件；报告直接支持行为模式，但未量化告警规避效果。
              en: In long-term document theft, an adversary may tolerate one baseline acquisition and then extract only newly modified files on each run. Bitdefender observed FilePakMonitor enumerate every 12 hours, limit the first pass by a 20-day modification condition, and use SYSTEMTIME in ft.data to select files changed since the previous pass. The report directly supports the behavior, not a measured reduction in alerts.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: 攻击者必须维持可读取目标文件的权限、保存并恢复检查点，并接受初始扫描可能更显著以及时间戳变动造成漏收的代价。若仅有一次性命令执行或每次运行身份不稳定，此分类的状态边界较难持续。
                en: The adversary must retain permission to read target files, store and recover a checkpoint, and accept a more visible first scan and possible misses caused by timestamp changes. A one-shot execution context or unstable identity makes this state boundary difficult to maintain.
          defender_model:
            paragraphs:
              - zh: 防守方需对敏感源目录启用读取审计，并保存文件修改、读取和进程身份记录，才能比较某一进程是否反复只读取上轮之后变化的对象。单独的计划任务事件、文件创建事件或单轮低计数不能确认该项；授权备份作业也可能呈现同样的增量图案。
                en: Defenders need read auditing on sensitive source directories and retained file-modification, read, and process-identity records to compare whether a process repeatedly reads only objects changed since its prior pass. A task event, a file-creation event, or one low-count pass alone cannot establish this child; authorized backup jobs can show the same incremental pattern.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary:
            zh: 以变化状态压缩每轮读取扇出
            en: Change state compresses the read fan-out of each pass
          analysis:
            paragraphs:
              - zh: 检查点把连续获取拆为初始扫描与多次较小的后续读取。每轮访问的源对象集合因排除未变化文件而缩小，短窗批量检测可能只看到零散访问；跨轮的检查点更新、目录列举和读取身份又构成可重建的残留链。该推断只适用于源对象变化率足够低、阈值窗口较短的条件。
                en: The checkpoint divides continuing acquisition into a first scan and multiple smaller later read sets. Excluding unchanged files narrows each per-pass source set, so short-window bulk detection may see scattered accesses; checkpoint updates, enumeration, and read identity across runs remain a reconstructible chain. This inference applies only when source-change rates are low enough and detector windows are short enough.
          evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM]
          confidence: medium
      defense_fit:
        detection_strategy_keys: [T1119_DET_SOURCE_READ_LINEAGE]
        analytic_keys: [T1119_NJA_WINDOWS_INCREMENTAL]
        mitigation_keys: [T1119_MIT_SOURCE_READ_GOVERNANCE]
      evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM, T1119_REF_MS_4663, T1119_REF_MS_FILE_AUDIT]
      limitations:
        paragraphs:
          - zh: 公开逆向结果证明了 FilePakMonitor 的状态与筛选实现，却没有对照试验量化检测概率。文件修改时间可以被篡改，某些文件访问不经过所配置的 Windows 审计面；跨平台或云端增量收集需另找案例证明，不得从本机案例直接泛化。
            en: Published reverse engineering establishes FilePakMonitor's state and selection behavior but provides no controlled measurement of detection probability. File modification times can be manipulated, and some accesses fall outside a configured Windows audit surface. Cross-platform or cloud incremental collection needs separate case evidence rather than extrapolation from this host example.
  - temporary_key: T1119_CHILD_ARRIVAL_TRIGGER
    recommendation: defer
    confidence: low
    name:
      zh: 来源到达触发的收集
      en: Source-Arrival-Triggered Collection
    stable_stealth_variable:
      zh: 由来源设备接入事件替代持续轮询作为收集启动条件。
      en: A source-device arrival event replaces continual polling as the collection trigger.
    evidence_keys: [T1119_REF_BITDEFENDER_FUNNYDREAM]
    reason:
      zh: FilePakMonitor 确实监听 WM_DEVICECHANGE 并在可移动介质接入后读取，但报告记载的是接入后收集全部文件，可能形成更大的集中读取；缺少其减弱痕迹或防守观察效果的结论级证据。也容易落入 T1025 的来源维度，故暂不正式建 NJS。
      en: FilePakMonitor does listen for WM_DEVICECHANGE and reads after removable-media arrival, but the report describes collecting all files after arrival, which may create a larger burst. It lacks conclusion-level evidence of weaker traces or a defender-observation effect and may merely restate T1025's source dimension, so no formal NJS is proposed.
defense_candidates:
  detection_strategies:
    - temporary_key: T1119_DET_SOURCE_READ_LINEAGE
      name:
        zh: 自动收集源读取与变化谱系关联
        en: Automated Collection Source-Read and Change-Lineage Correlation
      objective:
        zh: 找到未获授权的重复源数据读取，尤其识别首次扫描后只读取近期变化对象的较小后续轮次。
        en: Find unauthorized repeated source-data reads, especially smaller later passes that read only recently changed objects after an initial scan.
      subjects: [T1119_PARENT, T1119_CHILD_INCREMENTAL]
      analytic_keys: [T1119_NJA_WINDOWS_INCREMENTAL, T1119_NJA_S3_REPEATED_READ]
      distinction:
        zh: 检测目标是源对象取得的长时序谱系，不是归档文件、暂存目录或单纯计划任务创建；与 T1560/T1074 防御对象只在明确共享数据要求和逻辑时复用。
        en: The objective is a long-horizon lineage of source-object acquisition, not archive files, staging directories, or task creation alone. Reuse with T1560 or T1074 only where data requirements and logic truly match.
  detection_analytics:
    - temporary_key: T1119_NJA_WINDOWS_INCREMENTAL
      name:
        zh: 敏感文件增量读取轮次关联
        en: Sensitive-File Incremental-Read Pass Correlation
      platform: Windows
      logic:
        zh: 在预先划定的敏感目录启用 Audit File System 与 ReadData SACL，采集 Security 4663 成功读取以及文件修改事件；按主机、主体 SID/LogonId、进程映像和稳定进程启动时间关联读取。以至少 7 至 30 天观察期分组为多轮，计算每轮读取的唯一文件数、与上一轮被修改集合的交集比例、首次大范围读取与后续小范围读取的差异。仅当未授权进程或身份反复呈现高度“上轮后变化文件”选择性，且与许可备份、索引或同步清单不符时升级调查。阈值由本地基线训练，不能把固定 12 小时间隔或 ft.data 文件名当通用特征。
        en: Enable Audit File System and a ReadData SACL on predefined sensitive directories; ingest successful Security 4663 reads and file-modification events. Link reads by host, subject SID/LogonId, process image, and stable process start time. Over at least 7–30 days, group episodes and calculate unique files read per pass, overlap with files modified since the previous pass, and the difference between an initial broad pass and smaller later passes. Escalate only when an unauthorized process or identity repeatedly selects a high proportion of recently changed files and does not match an approved backup, indexing, or sync job. Train thresholds on local baselines; neither a 12-hour interval nor the ft.data name is a general signature.
      required_data:
        - source_type: windows_security_4663
          channel: Security
          required_fields: [TimeCreated, Computer, SubjectUserSid, SubjectLogonId, ObjectName, ObjectType, AccessMask, ProcessId, ProcessName]
        - source_type: file_modification_inventory
          channel: null
          required_fields: [event_time, device_id, file_path, modification_action]
        - source_type: authorized_job_inventory
          channel: null
          required_fields: [principal, process_path, covered_paths, approved_schedule]
      correlation:
        window: 7-30 days
        dimensions: [device_id, subject_sid, logon_id, process_image, process_start_time, source_file_path]
      false_positives:
        - zh: 企业备份、同步、索引与电子发现工具会合法地按变化读取大量文件。
          en: Enterprise backup, synchronization, indexing, and e-discovery tools legitimately read changed files.
      blind_spots:
        - zh: 未启用目标目录的读取 SACL 时 4663 不会提供所需读取证据；读取审计覆盖窄或保留期短会破坏跨轮关联。
          en: Without a read SACL on target directories, 4663 will not provide the required read evidence; narrow coverage or short retention breaks cross-pass correlation.
      evidence_keys: [T1119_REF_MS_4663, T1119_REF_MS_FILE_AUDIT, T1119_REF_BITDEFENDER_FUNNYDREAM]
    - temporary_key: T1119_NJA_S3_REPEATED_READ
      name:
        zh: S3 对象重复读取轮次关联
        en: S3 Object Repeated-Read Pass Correlation
      platform: IaaS
      logic:
        zh: 仅对已开启 CloudTrail S3 对象数据事件的敏感桶，按 IAM 主体、源 IP、userAgent 与时间窗口聚合 GetObject，观察此前少见主体是否在多个轮次读取大量不同对象，或跨轮持续只读取新变更对象。与批准 ETL、备份和应用任务的角色及工作时段核对，并与桶的对象变更记录关联。此方案可检测 T1119 父技术的云端自动获取，但当前案例不足以把云端“增量”确立为正式子项证据。
        en: Only for sensitive buckets with CloudTrail S3 object data events enabled, group GetObject calls by IAM principal, source IP, userAgent, and time window. Identify previously unusual principals reading many different objects across passes or repeatedly selecting newly changed objects. Compare roles and work periods with approved ETL, backup, and application jobs, and correlate with bucket object-change records. This can detect cloud automated acquisition at the T1119 parent level, but current case evidence does not establish cloud incremental behavior as a formal child.
      required_data:
        - source_type: cloudtrail_s3_data_event
          channel: CloudTrail data events
          required_fields: [eventTime, eventName, userIdentity.arn, sourceIPAddress, userAgent, requestParameters.bucketName, requestParameters.key]
        - source_type: approved_cloud_job_inventory
          channel: null
          required_fields: [role_arn, bucket_scope, approved_schedule]
      correlation:
        window: 7-30 days
        dimensions: [principal_arn, bucket_name, object_key, source_ip, user_agent]
      false_positives:
        - zh: 批量分析、数据管道、灾备和合法同步可产生相同的跨轮 GetObject 模式。
          en: Batch analytics, data pipelines, disaster recovery, and legitimate sync can create similar repeated GetObject patterns.
      blind_spots:
        - zh: S3 对象数据事件默认不启用，未覆盖的桶或服务不会留下该分析所需读取记录；GetObject 也不能单独证明数据被攻击者保留。
          en: S3 object data events are not enabled by default; unselected buckets or services lack the required read records, and GetObject alone does not prove adversary retention of data.
      evidence_keys: [T1119_REF_AWS_S3_EVENTS, T1119_REF_AWS_CLOUDTRAIL_FIELDS, T1119_REF_ATTACK19]
  mitigations:
    - temporary_key: T1119_MIT_SOURCE_READ_GOVERNANCE
      name:
        zh: 收集源读取权限与审计治理
        en: Collection-Source Read Permission and Audit Governance
      measures:
        - key: restrict_source_reads
          control_type: exposure-reduction
          description:
            zh: 对敏感目录及云对象范围按工作职责缩窄读取授权，审查可跨大量对象读取的服务账户和长时凭证，并将合法备份或 ETL 身份单列。
            en: Narrow read authorization on sensitive directories and cloud-object scopes by job duty, review service identities and long-lived credentials with broad read reach, and separately inventory approved backup or ETL identities.
        - key: preserve_read_lineage
          control_type: detective-support
          description:
            zh: 对高价值文件启用定向读取审计并保留足以覆盖多轮的事件；云端对敏感桶启用对象级数据事件，记录授权自动作业的身份、范围与时间。
            en: Enable targeted read auditing for high-value files and retain events across multiple passes; enable object-level data events for sensitive cloud buckets and record approved automation identities, scopes, and schedules.
      applications:
        - target_key: T1119_PARENT
          use:
            zh: 在自动收集可接触的源数据端限制可读对象和服务账户权限，并保留重复源读取的审计谱系。
            en: Limit readable objects and service-account rights at sources accessible to automated collectors and retain a lineage of repeated source reads.
          expected_effect:
            zh: 缩小一次失陷身份可自动遍历的数据范围，并让小规模重复读取可跨轮次关联。
            en: Reduce the data a compromised identity can traverse automatically and make smaller repeated reads correlatable across passes.
          limitations:
            zh: 已有合法广泛读取权限的高权限身份仍可滥用；读取审计会产生容量与性能开销，且无法阻止攻击者利用未覆盖的数据源。
            en: A compromised high-privilege identity with legitimate broad read rights can still be abused; read auditing has storage and performance costs and cannot cover uninstrumented sources.
        - target_key: T1119_CHILD_INCREMENTAL
          use:
            zh: 对允许增量访问的授权作业登记检查点、身份与目标目录，并针对其他进程的跨轮变化文件读取做审计关联。
            en: Register checkpoints, identities, and target directories for approved incremental jobs, then correlate changed-file reads by other processes across passes.
          expected_effect:
            zh: 降低攻击者借用增量读取常态混入短窗低量访问的机会，并使状态化选择留下可审计差异。
            en: Reduce the opportunity to blend into normal low-volume incremental reads and make stateful selection distinguishable in audit history.
          limitations:
            zh: 与获授权备份同一身份或同一进程内发生的滥用可能仍难分辨；权限与审计不能保证识别内容被复制后的去向。
            en: Abuse within the same identity or process as an approved backup may remain hard to distinguish; permissions and auditing do not establish what happens after the content is copied.
      evidence_keys: [T1119_REF_MS_FILE_RIGHTS, T1119_REF_MS_FILE_AUDIT, T1119_REF_AWS_S3_ACCESS, T1119_REF_AWS_S3_EVENTS]
