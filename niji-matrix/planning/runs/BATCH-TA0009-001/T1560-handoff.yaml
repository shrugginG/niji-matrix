handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0009-001
work_item_ref: WORK-TA0009-T1560
temporary_key_prefix: T1560_
candidate:
  source_type: attack
  source_attack_id: T1560
  name: {zh: 归档已收集数据, en: Archive Collected Data}
recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: 固定 Enterprise 19.1 工作簿把 T1560 定义为外传前压缩或加密已收集数据；压缩减少传输量并遮蔽原始内容，加密使没有密钥的防守方难以检查内容。归档过程本身因此具有明确的 Collection 行为和可分析的匿迹面，值得保留父级语义。保留不意味着把每次合法压缩都视为匿迹，正式归类仍应要求已收集数据、攻击者控制的打包动作及可论证的观察变化。
        en: The fixed Enterprise 19.1 workbook defines T1560 as compression or encryption of already collected data before exfiltration. Compression reduces transfer volume and obscures source content, while encryption makes contents difficult for a defender without the key to inspect. The archival process therefore has a clear Collection behavior and analyzable stealth surface that warrants retaining the parent meaning. Retention does not turn ordinary compression into stealth; formal classification still requires collected data, attacker-controlled packaging, and a defensible change in observation.
      - zh: T1074 以数据被汇聚到何处以及如何暂存为直接对象，归档可以发生在暂存之前、之中或之后；T1119 以预设规则或重复触发的数据获取为直接对象，自动化是否存在不决定归档方式。一次事件可以同时映射三者，但 T1560 的独立证据应落在输入数据到容器或编码流的转换，而不是目录位置、计划任务或网络上传本身。
        en: T1074 directly concerns where data is aggregated and staged, and archiving may occur before, during, or after that staging. T1119 directly concerns rule-based or repeatedly triggered acquisition, so automation does not define the archival method. One incident can map to all three, but independent T1560 evidence must show transformation of input data into a container or encoded stream, rather than a directory location, scheduled task, or network upload alone.
proposed_content:
  summary:
    zh: 攻击者在外传前把已收集数据压缩、加密或封装，以降低内容可检查性或改变归档行为的可见痕迹。
    en: An adversary compresses, encrypts, or packages already collected data before exfiltration to reduce content inspectability or alter the visible traces of archiving.
  definition_and_concept:
    paragraphs:
      - zh: 本技术指攻击者在取得目标数据之后、向控制端传送之前，将其转换为压缩包、加密归档或等价的封装数据流。核心对象是这次转换及产物：多个源文件可能成为一个容器，单个源文件可能成为不可直接解释的压缩或加密流。实现可以使用外部工具、链接库或程序内置代码，不能据此把 ATT&CK 的实现分类照搬为 Niji 子技术。
        en: "This technique covers the attacker-controlled conversion of target data after acquisition and before delivery to a control endpoint into a compressed package, encrypted archive, or equivalent packaged stream. Its core objects are the transformation and result: multiple source files may become one container, or one source file may become a compressed or encrypted stream that cannot be interpreted directly. External utilities, linked libraries, and built-in code can all implement it; those ATT&CK implementation classes do not define Niji children."
      - zh: 归档可同时服务于运输效率和匿迹。是否属于本矩阵的匿迹技术，应依据其让源文件语义、敏感性或执行谱系更难被防守方连接的可观察事实，而非仅凭扩展名、压缩比、工具名称或后来发生外传来推断主观意图。
        en: Archiving can serve both transport efficiency and stealth. Inclusion in this matrix should rest on observable facts showing that source-file meaning, sensitivity, or execution lineage became harder for the defender to connect, rather than inferring intent solely from an extension, compression ratio, tool name, or later exfiltration.
  stealth_characteristics:
    paragraphs:
      - zh: 压缩使大量原始文件的名称、内容和逐文件传输量缩为较少的产物与传输，原有按文件类型或内容运行的检查不一定能直接作用于外层字节。密码保护或加密进一步使没有密钥的检查器无法还原内部条目；但容器头、创建时间、大小、写入进程和先前源文件访问仍可能可见。
        en: Compression collapses many source names, contents, and per-file transfers into fewer artifacts and transfers, so controls that inspect original file types or contents may not work directly on the outer bytes. Password protection or encryption further prevents an inspector without the key from recovering inner entries, although the container header, creation time, size, writing process, and earlier source-file access may remain visible.
      - zh: 当封装发生在既有进程内时，归档工具启动事件可能完全不存在，只有源文件读取、模块调用、输出写入或同进程外联保留为线索。该差异不能从“没有看到工具”倒推成立：进程日志缺失、正常应用集成归档和直接编码通信都可产生相似现象，必须结合可证明的输入到产物关系。
        en: "When packaging occurs inside an existing process, a separate archiver launch event may never exist; source reads, module use, output writes, or same-process egress remain as clues. Absence of a tool event cannot establish this variant by itself: missing process telemetry, legitimate integrated archiving, and direct encoded communications can look similar. The input-to-output transformation must be demonstrated."
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入针对已收集目标数据的压缩、加密和封装，无论输出是落盘容器还是随即发送的数据流。单纯复制、移动、集中存放或选取暂存目录归 T1074；按照规则定期搜寻和获取数据归 T1119；传输路径、协议、带宽、分块大小或删除完成后的文件归属后续外传、传输大小限制或清痕技术。分卷归档如果只有网络分块大小这一目的，应交给 T1030 而非据此创造 T1560 子项。
        en: Scope includes compression, encryption, and packaging of already collected target data, whether the output is a disk container or an immediately transmitted stream. Copying, moving, centralizing, or choosing a staging directory belongs to T1074; repeatedly finding and acquiring data under rules belongs to T1119. Transfer path, protocol, bandwidth, chunk size, or post-transfer deletion belongs to exfiltration, transfer-size, or cleanup techniques. A multivolume archive used only to size network chunks should be handled under T1030 rather than used to manufacture a T1560 child.
      - zh: 正常备份、软件发布、邮件附件和用户授权的数据打包会产生相同的压缩程序及容器格式；受保护的业务归档也可能无法在检测系统中解密。仅有归档文件或失败的内容检查不够，需将敏感源文件访问、执行身份、异常目的地、授权业务流程和产物关系合并判断。仅对恶意代码本身做打包、编码或混淆，而未处理已收集数据的行为，归其他技术。
        en: Legitimate backup, software release, email attachment, and authorized user packaging create the same utility and container formats; protected business archives may also be unreadable to a scanner. An archive file or failed content scan alone is insufficient. Sensitive source access, execution identity, unusual destination, approved workflow, and output relationship must be assessed together. Packing, encoding, or obfuscating malicious code itself without processing collected data belongs elsewhere.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 常见情境是在已入侵端点或服务器上选取文档、数据库导出、凭据材料或配置后，先形成便于后续上传的归档。外部可访问 Web 服务器、共享目录或本地主机均可承载产物，但地点只描述 T1074 的伴随行为；T1560 的关键时刻是源数据被转换为容器或编码流。Unit 42 和 SecureWorks 的事件显示加密 RAR 可与分卷和暂存同现，ESET 的 InvisiMole 分析则显示恶意程序可在内部完成部分压缩。
          en: A common scenario begins after compromise of an endpoint or server, when documents, database exports, credential material, or configuration are selected and packaged for later upload. An internet-facing web server, share, or local host may hold the result, but location describes accompanying T1074 behavior; the T1560 moment is conversion of source data into a container or encoded stream. Unit 42 and SecureWorks incidents show encrypted RAR alongside volume splitting and staging, while ESET's InvisiMole analysis shows that malware can perform some compression internally.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者须已能读取目标数据，并有权启动归档工具、调用可用库或运行自己的压缩代码。其可控制输入集合、归档参数、密钥或口令及输出位置，但未必控制企业的端点传感器、DLP 或出口网关。若想削弱内容检查，需要密钥不在防守检查点可用；若想省去独立归档进程，需要能够在现有进程上下文中完成转换。
            en: The attacker must already be able to read the target data and invoke an archive utility, an available library, or custom compression code. The attacker can choose inputs, archival parameters, keys or passwords, and output location, but may not control endpoint sensors, DLP, or egress gateways. Content inspection is weakened only if the key is unavailable at the defensive inspection point; eliminating a separate archiver process requires transformation inside an existing process context.
      defender_model:
        paragraphs:
          - zh: 防守方可能具备文件创建、进程启动、网络连接与 DLP 分类事件，但未必持续记录所有文件读取、归档条目或内存缓冲。若只在外传点检查容器内容，密码保护会形成盲区；若只按 7z、rar、tar 等工具命令行告警，进程内路径会漏报。具备源文件敏感性标签、进程关联 ID、产物解析结果与出口对象 ID 的环境可以重建更多上下文，即使仍无法解密内容。
            en: A defender may have file creation, process launch, network connection, and DLP classification events without continuous records of every file read, archive member, or memory buffer. Inspecting only container content at egress leaves a blind spot when the container is password protected; alerting only on 7z, rar, or tar command lines misses an in-process path. Environments with source sensitivity labels, process correlation IDs, archive parsing outcomes, and egress object IDs can recover more context even when content cannot be decrypted.
  stealth_mechanisms:
    - mechanism_ref: NM-DO
      role: primary
      summary: {zh: 将已收集数据封入难以直接检查的归档内容, en: Place collected data in archive content that resists direct inspection}
      analysis:
        paragraphs:
          - zh: 攻击者把可读源文件转换为压缩或加密产物，检查点看到的从原始语义变成容器字节；若密钥不可用，检查器不能完整恢复内部内容。攻击者因而可以让内容规则、敏感信息分类或逐文件审阅失去直接输入，但文件访问、产物头部、大小和转出元数据并不随之消失。
            en: The attacker transforms readable source files into compressed or encrypted output, so an inspection point sees container bytes in place of original semantics. If the key is unavailable, the inspector cannot fully recover inner content. Content rules, sensitive-information classification, or per-file review then lose their direct input, while file access, container headers, size, and transfer metadata remain.
      evidence_keys: [T1560_ATTACK_PARENT_19_1, T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 在既有进程内形成归档而省去独立工具启动, en: Create packaging inside an existing process without a separate utility launch}
      analysis:
        paragraphs:
          - zh: 由植入程序自身或已链接代码完成归档时，基于单独归档工具进程及命令行的检测没有触发对象。防守方仍可从同一进程的源文件访问、归档写入、压缩模块加载或外联行为恢复链条；若这些数据未采集，行为可能落在进程创建监测之外。现有证据支持实现和遥测差异，不直接证明每个使用内置压缩的攻击者都有规避进程检测的主观目的。
            en: When an implant or linked code packages data itself, a detector keyed to a separate archiver process and command line has no event to match. A defender may still reconstruct the chain from source-file access, archive writes, compression-module loads, or egress by the same process; without such telemetry, the behavior can fall outside process-creation monitoring. Current evidence supports the implementation and telemetry difference, not a claim that every actor using integrated compression intended to evade process detection.
      evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]
      confidence: medium
proposed_subtechniques:
  - temporary_key: T1560_CHILD_CONTENT_OPACITY
    recommendation: formal
    name: {zh: 受保护归档内容遮蔽, en: Protected Archive Content Obscuration}
    stable_stealth_variable:
      zh: 归档产物是否在防守检查点需要攻击者控制的密钥或口令才能恢复内部数据；该轴与所用工具、库、自定义代码和暂存位置无关。
      en: Whether recovery of inner data at the defender's inspection point requires an attacker-controlled key or password; this axis is independent of utility, library, custom code, and staging location.
    trace_change:
      zh: 原始文件内容及部分归档成员元数据变成不可直接解释的加密负载；文件头、大小、创建和移动行为仍可能可见。
      en: Original file content and some archive-member metadata become encrypted payload rather than directly interpretable data; header, size, creation, and movement may remain visible.
    defender_observation_effect:
      zh: 不能用外层扫描结果排除内部敏感内容；需要对无法检查的归档保留状态，并从加密前源文件行为和传出对象恢复证据。
      en: An outer scan cannot rule out sensitive inner content; the defender must preserve an uninspectable state and recover evidence from pre-encryption source activity and the outbound object.
    prerequisites_and_scenario:
      zh: 攻击者掌握目标文件和归档密钥，使用可加密的容器或编码流；TONESHELL 对外传用 RAR 使用每次不同的 13 字符口令是直接案例。
      en: The attacker controls target files and an archive key and uses an encrypting container or encoded stream; TONESHELL's unique 13-character passwords on RAR archives intended for exfiltration provide a direct case.
    sibling_boundary:
      zh: 可以与进程内归档同时出现，但分类变量是内容可恢复性；只压缩且可正常解压的归档属于父级核心，不自动进入本子项。
      en: It may coexist with in-process packaging, but its variable is content recoverability; a compressed archive that can be unpacked normally remains parent core.
    detection_difference:
      zh: 必须记录解析器的 encrypted/password-required/unsupported 状态，再将其与源文件敏感性、创建进程、后续上传关联；不能把扫描未报毒视为已检查。
      en: Record parser states such as encrypted, password required, or unsupported, then join them to source sensitivity, creating process, and later upload; a clean scan result must not be treated as proof of inspection.
    mitigation_difference:
      zh: 对未经批准的受保护归档出口执行隔离或审核，允许业务加密时要求受控密钥交付或源文件级 DLP；不能要求所有业务归档一律解密。
      en: Quarantine or review unauthorized protected archives at egress; where business encryption is allowed, require controlled key access or source-file DLP rather than assuming every archive can be decrypted.
    mechanism_refs: [NM-DO]
    evidence_keys: [T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN, T1560_ATTACK_PARENT_19_1]
    confidence: high
    limitation:
      zh: Microsoft 的无口令扫描限制来自邮件安全产品，证明一般的无密钥检查问题，但不能外推为所有端点或网络产品均无法识别外层元数据。TONESHELL 报告证明口令归档的现场使用，不单独证明其主观规避意图。
      en: Microsoft's no-password scanning limit is documented for an email security product and demonstrates the general inspection problem without a key; it does not prove that every endpoint or network product loses outer metadata. The TONESHELL report proves password-protected archival in the field, not subjective evasion intent by itself.
  - temporary_key: T1560_CHILD_PROCESS_LINEAGE_COMPRESSION
    recommendation: formal_with_medium_confidence
    name: {zh: 进程内归档谱系压缩, en: In-Process Archival Lineage Compression}
    stable_stealth_variable:
      zh: 归档转换是否由已存在的收集或植入进程在内部完成，从而不产生独立归档工具的进程创建事件；库和自定义算法都可能实现该变量，外部工具则通常不能。
      en: Whether packaging occurs within the already running collector or implant and therefore creates no separate archiver process event. Both library and custom-code implementations can realize this variable, while an external utility normally cannot.
    trace_change:
      zh: 7z、rar、tar 等命令行及父子进程边消失，输入读取、压缩模块、输出写入或同进程上传仍可保留。
      en: The 7z, rar, or tar command line and parent-child process edge disappear, while input reads, compression modules, output writes, or same-process upload may remain.
    defender_observation_effect:
      zh: 工具名称检测漏掉该路径，防守方必须将进程内部的源数据访问和输出行为关联；不能以“未见工具”单独作阳性判断。
      en: Tool-name detections miss this path, requiring the defender to correlate source-data access and output within the process; absence of a utility alone is not a positive finding.
    prerequisites_and_scenario:
      zh: 攻击者控制能够读取目标数据并调用压缩代码的长驻程序。ESET 分析 InvisiMole 恶意程序内部的 Zlib 例程以及另行复制的 WinRAR 工具，提供同一工具集里两种可观察执行路径的对照。
      en: The attacker controls a resident program that reads target data and invokes compression code. ESET's analysis of InvisiMole's internal Zlib routine alongside its separate copied WinRAR utility contrasts two observable execution paths within one toolset.
    sibling_boundary:
      zh: 与受保护归档子项的内容可恢复性轴正交；独立进程使用合法工具但改名或伪装归 T1036 等特征伪装范畴，不属于本子项。
      en: This is orthogonal to the protected archive child's content recoverability axis; renaming or disguising an external legitimate utility belongs to masquerading such as T1036, not this child.
    detection_difference:
      zh: 将可疑进程的源文件读取、输出文件创建与网络连接以进程唯一 ID 和时间窗口关联，压缩模块或 API 调用作增强证据；不能只搜归档程序启动。
      en: Join suspicious source-file reads, output creation, and network connections by process-unique ID and time window, using compression module or API calls as supporting evidence; do not search only for archiver launches.
    mitigation_difference:
      zh: 将源文件敏感性和出口权限控制施加于读取与发送主体，并限制未经批准的长驻进程批量访问敏感目录；单独封禁归档工具对该变量无效。
      en: Apply source-file sensitivity and egress permissions to the reading and sending principal, and limit unapproved resident programs' bulk access to sensitive directories; banning only archiver utilities does not control this variable.
    mechanism_refs: [NM-BT]
    evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]
    confidence: medium
    limitation:
      zh: ESET 的 Zlib 段落描述内部数据与注册表内容的打包，并非完整证明每一目标文件都没有落盘归档；正式子项须把“没有独立进程”限定为该路径的可观察差异，而非无痕或无磁盘输出的断言。
      en: ESET's Zlib passage describes packaging of internal data and registry content, not proof that every target file avoids a disk archive. The formal child should limit the claim to the observable absence of a separate process, not assert trace-free or disk-free operation.
defense_candidates:
  detection_strategies:
    - temporary_key: T1560_DET_ARCHIVE_TRANSFORMATION
      resolution: create
      objective:
        zh: 识别敏感源数据被转换为受保护或进程内归档产物，并连接后续传出；同时保留内容不可检查与进程内路径两种不同的判定结果。
        en: Identify transformation of sensitive source data into protected or in-process archival output and link subsequent outbound activity, preserving separate outcomes for content uninspectability and in-process execution.
      targets: [T1560_PARENT, T1560_CHILD_CONTENT_OPACITY, T1560_CHILD_PROCESS_LINEAGE_COMPRESSION]
      analytics: [T1560_NJA_PROTECTED_ARCHIVE, T1560_NJA_IN_PROCESS_ARCHIVE]
      domains: [enterprise]
      evidence_keys: [T1560_ATTACK_PARENT_19_1, T1560_MS_PASSWORD_SCAN, T1560_ESET_INVISIMOLE, T1560_MDE_FILE_EVENTS, T1560_MDE_PROCESS_EVENTS, T1560_MDE_NETWORK_EVENTS, T1560_WINDOWS_4663_READ]
  detection_analytics:
    - temporary_key: T1560_NJA_PROTECTED_ARCHIVE
      strategy_key: T1560_DET_ARCHIVE_TRANSFORMATION
      logic:
        zh: 在受管端点或出口提取新产物的实际格式与解析状态，区分可展开、需要口令、加密但仅元数据可见、格式不支持。对需要口令或加密产物，按设备、写入进程唯一 ID、账户和 30 分钟窗口连接既有敏感文件读取或 DLP 活动，再接同一文件哈希或路径的上传、共享复制或外联。只有源到容器或容器到出口的关系成立并且超出已批准备份/交付流程时，输出 protected_archive_content_blindness；解析失败单独输出待核查状态。
        en: Extract the true format and parser state of a newly created artifact at a managed endpoint or egress point, distinguishing unpackable, password-required, encrypted with metadata only, and unsupported. For password-required or encrypted output, join prior sensitive-file reads or DLP activity by device, writer process-unique ID, account, and a 30-minute window, then join upload, share copy, or egress for the same file hash or path. Emit protected_archive_content_blindness only when source-to-container or container-to-egress linkage exists outside an approved backup or delivery workflow; report parser failure alone as an investigation state.
      platforms: [Windows]
      data_requirements:
        - {source_type: windows_file_access_audit, channel: Security/4663, fields: [TimeCreated, Computer, SubjectLogonId, ObjectName, AccessMask, ProcessId, ProcessName]}
        - {source_type: endpoint_file_events, fields: [Timestamp, DeviceId, ActionType, FileName, FolderPath, SHA1, FileSize, InitiatingProcessUniqueId, InitiatingProcessAccountName]}
        - {source_type: archive_inspection, fields: [timestamp, artifact_id, true_format, encrypted_state, password_required, member_parse_state]}
        - {source_type: source_sensitivity, fields: [timestamp, file_id, sensitivity_label, access_principal, device_id]}
        - {source_type: outbound_object_events, fields: [timestamp, device_id, account_id, artifact_id_or_hash, destination, action]}
      correlation: {window: 30m, dimensions: [device_id, process_unique_id, account_id, artifact_id_or_hash, time]}
      observables: [protected_archive_written, prior_sensitive_source_access, uninspectable_archive_state, subsequent_outbound_object]
      false_positives:
        zh: 授权备份、财务或法务交付、软件发布和受控加密附件会形成相同链条。
        en: Authorized backup, finance or legal delivery, software release, and controlled encrypted attachments can form the same chain.
      blind_spots:
        zh: 没有读取审计或稳定对象 ID 时难把来源与容器对应；自定义格式和内存直传可能没有可检查文件；文件哈希在重写后会变化。
        en: Without read audit or stable object IDs, source-to-container linkage is weak; custom formats and direct memory transfer may lack an inspectable file, and hashes change after rewriting.
      tuning:
        zh: 按业务工作流白名单化具体身份、目录、目的地和有效期，绝不把所有 ZIP/RAR、所有加密归档或所有备份进程全局排除。阈值基于源敏感性和链条异常调优，解析失败保留单独计数。
        en: Allowlist specific identities, paths, destinations, and validity periods by business workflow; do not globally exclude ZIP/RAR, protected archives, or backup processes. Tune on source sensitivity and anomalous linkage, while retaining separate counts of parse failures.
      evidence_keys: [T1560_MS_PASSWORD_SCAN, T1560_MDE_FILE_EVENTS, T1560_MDE_NETWORK_EVENTS, T1560_MS_ENDPOINT_DLP, T1560_WINDOWS_4663_READ]
    - temporary_key: T1560_NJA_IN_PROCESS_ARCHIVE
      strategy_key: T1560_DET_ARCHIVE_TRANSFORMATION
      logic:
        zh: 将读取多项敏感源文件的同一进程与其新建压缩/加密产物、同进程外联或归档格式输出关联，核查该窗口不存在由该进程启动的独立归档工具，同时要求正向的源到产物证据。使用模块加载或 API 跟踪（若已启用）增强对内置压缩的判断；没有子进程只是分支条件，不能作为单独告警。按受管备份、同步和应用内导出基线比较进程角色、输入范围及目的地，输出 in_process_archival_lineage。
        en: Join a process that reads multiple sensitive source files to its new compressed or encrypted output, same-process egress, or archive-format stream. Check that it launched no separate archive utility in the window while requiring positive source-to-output evidence. Module-load or API tracing, where enabled, strengthens attribution to integrated compression; missing child process is a branch condition, never a standalone alert. Compare process role, input scope, and destination against managed backup, sync, and application export baselines before emitting in_process_archival_lineage.
      platforms: [Windows]
      data_requirements:
        - {source_type: windows_file_access_audit, channel: Security/4663, fields: [TimeCreated, Computer, SubjectLogonId, ObjectName, AccessMask, ProcessId, ProcessName]}
        - {source_type: endpoint_file_events, fields: [Timestamp, DeviceId, ActionType, FileName, FolderPath, InitiatingProcessUniqueId, InitiatingProcessAccountName]}
        - {source_type: endpoint_process_events, fields: [Timestamp, DeviceId, ProcessUniqueId, InitiatingProcessUniqueId, FileName, ProcessCommandLine]}
        - {source_type: endpoint_network_events, fields: [Timestamp, DeviceId, InitiatingProcessUniqueId, RemoteIP, RemoteUrl, RemotePort]}
        - {source_type: archive_output_classifier, fields: [timestamp, artifact_id, process_unique_id, true_format, compression_or_encryption_result]}
      correlation: {window: 30m, dimensions: [device_id, process_unique_id, account_id, source_path, output_artifact, time]}
      observables: [sensitive_source_reads, same_process_archive_write_or_stream, no_separate_archiver_child, same_process_egress]
      false_positives:
        zh: 正常备份代理、同步客户端、邮件程序、数据库导出和软件构建也可能在自身进程内压缩。
        en: Legitimate backup agents, sync clients, mail programs, database exports, and software builds may compress inside their own process.
      blind_spots:
        zh: 仅有文件创建而无读取或流遥测时无法证明输入集合；静态链接代码不产生独立模块加载；进程遥测丢失会把工具路径误判为内置路径。
        en: File creation without read or stream telemetry cannot prove the input set; statically linked code creates no separate module-load event; dropped process telemetry can misclassify a utility path as integrated.
      tuning:
        zh: 先在具备读取审计和进程完整性的资产试运行，按应用签名、角色、受控任务与批准输入目录建基线；缺少正向源到产物链时保持未判定，不因缺失 7z/rar 进程而提高风险分数。
        en: Pilot on assets with read audit and reliable process telemetry, baselining application signature, role, managed task, and approved input paths. Keep cases without positive source-to-output linkage indeterminate; do not raise risk simply because no 7z or rar process appeared.
      evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS, T1560_MDE_FILE_EVENTS, T1560_MDE_PROCESS_EVENTS, T1560_MDE_NETWORK_EVENTS, T1560_WINDOWS_4663_READ]
  mitigations:
    - temporary_key: T1560_MIT_SOURCE_AND_ARCHIVE_EGRESS_GOVERNANCE
      resolution: create
      concept:
        zh: 在敏感源文件仍可理解时约束读取和外发，并对无法检查的归档设置受控出口路径。
        en: Govern access and release while sensitive source files remain intelligible and route uninspectable archives through controlled egress.
      measures:
        - key: sensitive_source_access_and_pretransform_dlp
          control_type: preventive
          action:
            zh: 以身份、设备和目录为范围执行最小读取权限；在源文件仍可分类时启用敏感标签/DLP 与高价值目录访问审计，保留主体和对象 ID。
            en: Enforce least read privilege by identity, device, and directory; classify and audit high-value source access while files remain inspectable, preserving principal and object IDs.
        - key: protected_archive_release_gate
          control_type: containment
          action:
            zh: 对出站受保护归档记录格式和不可检查原因；未经批准的口令归档隔离或人工审核，批准业务通过受控密钥交付或源文件级证明放行。
            en: Record format and reason an outbound protected archive cannot be inspected; quarantine or review unapproved password archives, allowing approved business delivery through controlled key handling or source-level evidence.
        - key: archival_process_scope
          control_type: detective-support
          action:
            zh: 维护被批准归档工具、代理和应用内导出的具体任务、输入目录、账号、目的地及有效期，完整记录外部工具和进程内路径的输出与外联。
            en: Maintain task, input path, account, destination, and validity period for approved utilities, agents, and in-app exports, retaining output and egress records for both utility and integrated paths.
      applications:
        - target_key: T1560_PARENT
          use:
            zh: 把源数据权限、归档产物和出口审批连为一条控制链，而不只盘点安装的压缩工具。
            en: Connect source-data permissions, archive output, and egress approval as one control chain rather than merely inventorying installed compressors.
          expected_effect:
            zh: 限制攻击者可读输入与可用出口，同时保留归档前仍可分类的证据。
            en: Reduce the attacker's readable inputs and available egress paths while retaining evidence before packaging removes content visibility.
          limitations:
            zh: 高权限攻击者、未受管设备和内存直传仍可能绕过部分控制；通用封禁压缩会破坏正常备份和交付。
            en: Privileged attackers, unmanaged devices, and direct memory transfer can bypass parts of the control; blanket compression bans would disrupt legitimate backup and delivery.
        - target_key: T1560_CHILD_CONTENT_OPACITY
          use:
            zh: 把口令保护且不可解析的归档作为需审查状态，依源文件标签和授权密钥流程决定出口。
            en: Treat password-protected, unparseable archives as a review state and decide release using source labels and an authorized key process.
          expected_effect:
            zh: 消除“扫描未报毒即视为内容已检查”的错误放行，并保留元数据与源侧证据。
            en: Prevent a clean outer scan from being mistaken for completed content inspection while retaining metadata and source-side evidence.
          limitations:
            zh: 防守方无法强制解开所有业务加密，合法高保密归档会带来审核负荷。
            en: The defender cannot force open every legitimate encrypted delivery, and authorized confidential archives create review workload.
        - target_key: T1560_CHILD_PROCESS_LINEAGE_COMPRESSION
          use:
            zh: 对能够读取敏感数据且自行归档的长期运行应用施加最小读取和出口权限，记录输出；不要仅以归档工具允许/禁止清单作控制。
            en: Apply least read and egress privilege to resident applications that can package sensitive data themselves and retain output records; do not rely only on utility allow or deny lists.
          expected_effect:
            zh: 即使归档不生成独立工具进程，源文件和出口仍有权限与审计边界。
            en: Source files and egress retain permission and audit boundaries even when packaging launches no utility process.
          limitations:
            zh: 已被攻陷的受信应用可能继承合法权限，需要以任务、输入范围和目的地限制例外。
            en: A compromised trusted application may inherit legitimate permissions, so exceptions must be constrained by task, input scope, and destination.
      evidence_keys: [T1560_ATTACK_PARENT_19_1, T1560_MS_PASSWORD_SCAN, T1560_MS_ENDPOINT_DLP, T1560_MDE_FILE_EVENTS]
