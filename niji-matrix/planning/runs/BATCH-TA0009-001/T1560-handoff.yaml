research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1560.003, T1560.002, T1560.001]
    represented_dimensions:
      - {zh: 第三方工具执行与显式归档命令, en: External utility execution and explicit archiver command lines}
      - {zh: 链接库调用并在调用进程内处理数据, en: Linked-library calls that process data in the calling process}
      - {zh: 自定义算法或嵌入式代码实现, en: Custom algorithm or embedded-code implementation}
    breadth_trigger: examine_at_least_two_stealth_axes
    coverage_resolutions:
      - attack_subtechnique_id: T1560.001
        resolution: parent-core
        notes: 工具路径提供进程可见性对照，也可产生受保护内容；工具本身不是稳定匿迹变量。
      - attack_subtechnique_id: T1560.002
        resolution: niji-variable-candidate
        notes: 库可支持进程内谱系压缩，但 Niji 变量跨越库与自定义代码，且不是库名分类。
      - attack_subtechnique_id: T1560.003
        resolution: niji-variable-candidate
        notes: 自定义代码可支持进程内路径或受保护内容；若仅有算法不同则为 parent-core。
    candidate_stealth_axes_examined:
      - key: T1560_AXIS_CONTENT_RECOVERABILITY
        decision: formal
        variable: 归档内容是否需要攻击者控制的密钥才能在检查点恢复
        trace_change: 内部内容由可解析变为不可解析，外层元数据仍在
        defender_difference: 内容检查失败须转向源侧 DLP、解析状态和出口关联
        evidence_keys: [T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN]
      - key: T1560_AXIS_PROCESS_LINEAGE
        decision: formal_with_medium_confidence
        variable: 是否存在独立归档工具进程
        trace_change: 工具进程和命令行边消失，同进程输入与输出保留
        defender_difference: 进程名检测改为输入到产物或出口的同进程关联
        evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]
      - key: T1560_AXIS_VOLUME_SPLITTING
        decision: defer_adjacent_T1030
        variable: 归档分卷数与每卷大小
        trace_change: 一份产物变成可关联的多份产物
        defender_difference: 可能需要跨卷重组，但降低阈值的实际匿迹收益未被来源直接证明
        evidence_keys: [T1560_UNIT42_MULTIVOLUME, T1560_CISA_PLAY_SEGMENTATION, T1560_STRONGPITY_SPLIT]
      - key: T1560_AXIS_STAGING_LOCATION
        decision: adjacent_T1074
        variable: 容器放在本地、共享目录或互联网可达主机
        trace_change: 位置和跨主机复制改变，归档转换本身没有必然变化
        defender_difference: 应按暂存位置的权限、共享和复制记录分析
        evidence_keys: [T1560_ATTACK_T1074_19_1, T1560_SECUREWORKS_BRONZE_UNION]
      - key: T1560_AXIS_OUTPUT_EXTENSION_RENAME
        decision: defer_adjacent_T1036
        variable: 归档产物的文件扩展名是否与真实格式不一致
        trace_change: ZIP 头部保留而显示扩展名从 zip 变为 dat
        defender_difference: 依扩展名筛选的规则可能失配，但规范文件类型解析仍可识别；当前来源没有测试该差异
        evidence_keys: [T1560_UNIT42_KIMJONGRAT_RENAME]
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 3 个 ATT&CK 子项表达实现路径，不构成 3 个 Niji 子项配额。两项建议子技术分别由内容可恢复性与执行谱系可见性定义；进程内项需主 Agent 审核中等置信度和数据要求。分卷已研究但因 T1030 边界及缺乏明确匿迹收益而暂缓。
      en: The three ATT&CK children express implementation paths, not a three-child Niji quota. The two proposed children use content recoverability and execution-lineage visibility. The in-process child requires primary review of medium confidence and telemetry prerequisites. Multivolume packaging was examined but deferred because of the T1030 boundary and lack of evidence for a distinct stealth benefit.
  evidence_coverage:
    parent_behavior_keys: [T1560_ATTACK_PARENT_19_1, T1560_TONESHELL_PASSWORD, T1560_ESET_INVISIMOLE]
    boundary_keys: [T1560_ATTACK_T1074_19_1, T1560_ATTACK_T1119_19_1, T1560_SECUREWORKS_BRONZE_UNION]
    mechanism_support:
      - {mechanism_ref: NM-DO, evidence_keys: [T1560_ATTACK_PARENT_19_1, T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN]}
      - {mechanism_ref: NM-BT, evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]}
    child_existence_support:
      - {child_key: T1560_CHILD_CONTENT_OPACITY, evidence_keys: [T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN]}
      - {child_key: T1560_CHILD_PROCESS_LINEAGE_COMPRESSION, evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]}
    unsupported_or_deferred:
      - 分卷造成检测阈值规避或每卷内容无法检查的结论未直接证明；T1030 边界优先。
      - 进程内压缩等于无磁盘归档、无文件痕迹或确定主观规避意图的结论未被现有证据证明。
      - 仅凭文件扩展名、熵值、工具名或无子进程判定恶意归档均不成立。
      - KimJongRAT 的 init.zip 改名 init.dat 有原始样本证据，但防守观察差异仅属推断，且改名主要落在 T1036/特征伪装边界，暂不纳入正式 NJS。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级研究段落分别说明定义、内容与进程观测差异、T1074/T1119/T1030 边界、具体情境、攻防能力与残余痕迹；两个子项各有不同变量、证据、检测与缓解。此为研究交接，主 Agent 写正式内容时仍须逐字段核对 NJT-0001 深度及中英文同等强度。
      en: Parent research paragraphs separately cover definition, content and process visibility, T1074/T1119/T1030 boundaries, concrete scenarios, attacker and defender capabilities, and residual traces. Each child has a different variable, evidence, detection, and mitigation. This remains a research handoff; canonical prose still needs field-by-field comparison with NJT-0001 for depth and bilingual strength.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [固定工作簿行号核验, 共享库文本与 URL 查重]
  limitations:
    paragraphs:
      - zh: 固定工作簿与 MITRE 页面能够锚定 T1560 行为及其三种实现类别，却不能单独证明 Niji 子项的故意规避目的。Unit 42 的口令 RAR、ESET 的内置 Zlib 与外部 WinRAR、Unit 42/CISA/Bitdefender 的分卷报告分别支持不同事实层级；不得把共现的暂存、传输分块和后续删除误写为归档机理。对进程内归档的隐蔽性只作中等置信度技术推断，等待更多直接事件级证据。
        en: The fixed workbook and MITRE pages anchor T1560 behavior and its three implementation classes but do not alone prove intentional evasion by Niji children. Unit 42's passworded RAR, ESET's integrated Zlib and external WinRAR, and Unit 42/CISA/Bitdefender multivolume reports support different levels of fact. Co-occurring staging, transfer chunking, and later deletion must not be rewritten as archival mechanisms. The stealth value of in-process archiving is a medium-confidence technical inference pending more direct event-level evidence.
      - zh: Microsoft 的 Safe Attachments 文档只证明该产品在缺少口令时无法完整扫描或引爆受保护附件；MDE 高级狩猎字段只证明所列事件在部署相应服务时可用，不保证读取审计、跨表文件对象 ID 或自定义归档解码。正式 NJA 必须把缺失字段列为前提或盲区，并以本地仿真验证源文件、产物和出口关联。
        en: Microsoft's Safe Attachments documentation proves only that that product cannot fully scan or detonate a protected attachment without a password. MDE hunting schemas show available fields only when the relevant service is deployed; they do not guarantee file-read audit, cross-table file object IDs, or custom-archive decoding. Formal analytics must treat missing fields as prerequisites or blind spots and validate source, output, and egress linkage in local simulation.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason: 分卷实际存在，但来源未证明局部阈值规避，而且传输片大小可能直接归 T1030。
    - mechanism_ref: NM-FD
      reason: 正常工具可被滥用；KimJongRAT 的 ZIP 改名 DAT 虽有现场证据，却没有结论级来源证明其造成独立检测差异，且文件类型伪装与 T1036 边界待统一裁定。
  open_questions:
    - 主 Agent 应与 T1074、T1119 研究交接统一裁定复合事件的父级边界，特别是 InvisiMole 内部打包与暂存、StrongPity 自动搜集与归档的双重映射。
    - 主 Agent 应复核进程内子项是否有足够直接资料进入 review；若不足，保留父级 NM-BT 中等置信度并将子项转为 deferred，不通过改名补证据。
    - 主 Agent 应核验 MDE 是否提供所需读取事件；若只提供创建/修改，NJA 应要求另行配置读取审计或改用已证实的源侧 DLP 事件。
