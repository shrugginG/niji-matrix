  claims:
    - key: T1560_CLM_PARENT
      proposition:
        zh: 外传前对已收集数据进行压缩或加密会把可读输入转为归档产物，并可能遮蔽原始内容或减少传输量。
        en: Compressing or encrypting collected data before exfiltration converts readable input to archival output and can obscure original content or reduce transfer volume.
      evidence_keys: [T1560_ATTACK_PARENT_19_1]
    - key: T1560_CLM_BOUNDARY
      proposition:
        zh: T1560 的归档转换与 T1074 的暂存位置、T1119 的自动获取规则是可以共现但互不替代的行为对象。
        en: T1560 archival transformation, T1074 staging location, and T1119 automated acquisition rules are distinct behavioral objects that may coexist but do not substitute for one another.
      evidence_keys: [T1560_ATTACK_PARENT_19_1, T1560_ATTACK_T1074_19_1, T1560_ATTACK_T1119_19_1]
    - key: T1560_CLM_PROTECTED_CONTENT
      proposition:
        zh: 攻击者确有使用口令保护外传用归档的现场行为，缺少口令的内容检查点不能完整恢复其内部数据。
        en: Attackers have used password-protected archives for exfiltration, and an inspection point without the password cannot fully recover their inner data.
      evidence_keys: [T1560_TONESHELL_PASSWORD, T1560_MS_PASSWORD_SCAN]
    - key: T1560_CLM_INPROCESS_DIFFERENTIAL
      proposition:
        zh: 程序内置或链接压缩可在没有独立归档工具启动的条件下处理数据，使单纯依赖工具进程的检测逻辑不覆盖该路径。
        en: Built-in or linked compression can process data without launching a separate archiver, so detection that depends solely on an archiver process does not cover this path.
      evidence_keys: [T1560_ATTACK_CHILD_LIBRARY_19_1, T1560_ESET_INVISIMOLE, T1560_SYSMON_EVENTS]
    - key: T1560_CLM_SEGMENTATION_DEFERRED
      proposition:
        zh: 分卷或分段归档在现场存在，但当前证据不充分说明分卷本身的隐蔽收益有别于传输大小限制。
        en: Multivolume or segmented archiving occurs in the field, but current evidence does not sufficiently distinguish a stealth benefit of splitting itself from transfer-size limiting.
      evidence_keys: [T1560_UNIT42_MULTIVOLUME, T1560_CISA_PLAY_SEGMENTATION, T1560_STRONGPITY_SPLIT]
  cases:
    - key: T1560_CASE_TONESHELL_PASSWORD
      actor_or_campaign: Stately Taurus / TONESHELL
      observed_fact:
        zh: Unit 42 观察攻击者以 TONESHELL 为外传归档文件，并为 RAR 设置每次不同的 13 字符口令。
        en: Unit 42 observed TONESHELL archiving files for exfiltration and protecting RAR output with a unique 13-character password.
      evidence_keys: [T1560_TONESHELL_PASSWORD]
      scope_limit: 只证明口令归档和外传用途，不证明所有目标或所有检测系统的实际漏报。
    - key: T1560_CASE_INVISIMOLE_PATHS
      actor_or_campaign: InvisiMole
      observed_fact:
        zh: ESET 发现 InvisiMole 在工作目录存放 WinRAR.exe，同时在恶意程序二进制内实现 Zlib 例程以打包内部数据。
        en: ESET found WinRAR.exe in InvisiMole's working directory and a Zlib routine implemented within the malware binary to pack internal data.
      evidence_keys: [T1560_ESET_INVISIMOLE]
      scope_limit: 两条实现路径的技术对照；不能推断全部目标文件都走内部路径或有明确规避目的。
