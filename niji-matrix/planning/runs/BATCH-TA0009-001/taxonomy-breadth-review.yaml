    formal_niji_child_refs: [NJS-0133-001, NJS-0133-002]
    breadth_gap_explanation: Two children survive evidence and defense-difference gates; utility/library/custom categories collapse into process lineage. Splitting is deferred at T1030 and extension disguise at T1036 boundaries.
    second_pass_required: false
  - source_attack_id: T1074
    attack_subtechnique_count: 2
    attack_subtechnique_ids: [T1074.001, T1074.002]
    represented_dimensions: [local storage position, remote storage position]
    breadth_trigger: ordinary
    coverage_resolutions:
      - {attack_ref: T1074.001, resolution: parent-core, explanation: Locality is a storage location label and can participate in several distinct topologies.}
      - {attack_ref: T1074.002, resolution: niji-variable-candidate, explanation: Remote relay cases support many-source convergence, but remoteness itself is not the boundary.}
    candidate_stealth_axes_examined: [many-source egress convergence, low-scrutiny namespace, non-file buffer, rapid cleanup, archive format, automation cadence]
    formal_niji_child_refs: [NJS-0134-001]
    breadth_gap_explanation: Namespace and non-file buffer axes remain deferred because their independent observation effect or boundary with existing TA0005 objects is unresolved; egress convergence is independently supported.
    second_pass_required: false
  - source_attack_id: T1119
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: open-ended-search
    coverage_resolutions: []
    candidate_stealth_axes_examined: [changed-since-checkpoint selection, source-arrival trigger, workflow trigger, fixed periodicity, extension or location filter]
    formal_niji_child_refs: [NJS-0135-001]
    breadth_gap_explanation: The zero-child ATT&CK parent received an open-ended search. Only the checkpoint variable has direct implementation evidence and a bounded defender-observation difference.
    second_pass_required: false
review:
  status: review
  reviewer_notes_zh: 三个候选均完成独立轴搜索与跨技术边界裁决。正式四个 NJS 均非 ATT&CK 子项导入；T1560 的三项实现分法只用于广度提醒，T1119 无 ATT&CK 子项仍完成开放检索。
  reviewer_notes_en: All three candidates received independent axis searches and cross-technique boundary review. The four formal NJS are not imported ATT&CK children; T1560's three implementation categories served only as a breadth prompt, and T1119 received an open search despite having no ATT&CK children.
