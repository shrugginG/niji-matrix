schema_version: "1.0.0"
type: batch-taxonomy-breadth-review
batch_ref: BATCH-TA0009-001
attack_baseline: {domain: enterprise-attack, version: "19.1"}
principle: ATT&CK children are planning-only implementation breadth context; no ATT&CK child is imported as NJS.
candidate_reviews:
  - source_attack_id: T1560
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1560.003, T1560.002, T1560.001]
    represented_dimensions: [custom archiving implementation, linked library implementation, separate utility implementation]
    breadth_trigger: two-axis-search
    coverage_resolutions:
      - {attack_ref: T1560.003, resolution: niji-variable-candidate, explanation: Custom code can remove a separate utility edge, but method identity is not a Niji boundary.}
      - {attack_ref: T1560.002, resolution: niji-variable-candidate, explanation: Linked compression can remove a separate utility edge; the distinct variable is process lineage, not library use.}
      - {attack_ref: T1560.001, resolution: parent-core, explanation: A separate utility provides a contrast path but does not itself produce a distinct Niji stealth variable.}
