handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-002
work_item_ref: WORK-TA0009-T1114
temporary_key_prefix: T1114_
candidate:
  source_type: attack
  source_attack_id: T1114
  source_attack_version: '19.1'
  name:
    zh: 电子邮件收集
    en: Email Collection
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿将 T1114 定义为从邮件服务器或客户端取得敏感消息，并列出 T1114.001、T1114.002、T1114.003 三个按存储位置或转发功能区分的子项。邮箱内容可包含业务秘密、个人信息或应急响应细节，父行为符合
        Collection 范围；但授权邮件读取、迁移与备份同样会产生大量读取，普通获取不能自动算作匿迹。建议适配为“匿迹型邮件内容收集”，要求有可证的读取观察面转移、内容选择或消息到达触发分流，并把账户取得与后续外传分开分析。
      en: The fixed ATT&CK Enterprise 19.1 workbook defines T1114 as obtaining sensitive messages from mail servers or clients
        and lists three children partitioned by storage location or forwarding capability. Mail can contain business secrets,
        personal information, or incident-response details, so the parent belongs in Collection. Authorized reading, migration,
        and backup can also cause large reads, however; ordinary acquisition is not automatically stealth. Adapt the parent
        to Stealth-Oriented Email Content Collection and require a demonstrable shift in the read observation plane, content
        selection, or arrival-triggered replication, while analyzing account acquisition and later exfiltration separately.
    - zh: Microsoft 说明预先同步到 Outlook 的邮件可在离线状态访问，而服务器 MailItemsAccessed 不会记录这次本地再次读取；Microsoft 的 BEC 调查则直接观察到攻击者以财务关键词选择邮件，并由转发规则持续复制至受控地址。两者改变的痕迹及防守关联方式不同，支持进一步研究
        Niji 原生子项。来源并未量化告警下降率，也不能仅凭有 OST 或有转发规则断言攻击者匿迹意图。
      en: Microsoft documents that previously synchronized Outlook mail can be accessed offline without a new server MailItemsAccessed
        record for that local reread. Its BEC investigation directly observed attackers selecting financial mail by keywords
        and continuously copying matching messages to controlled addresses through forwarding rules. Their traces and defender
        joins differ, supporting Niji-native child inquiry. The sources do not quantify alert reduction, and an OST file or
        a forwarding rule alone does not prove adversarial stealth intent.
  scope_notes:
    zh: 直接对象是邮件正文与附件的取得、选取及被动复制。T1213 负责非邮件信息库，T1185 负责浏览器会话中的交互中介；取得账户、令牌、邮箱委派或会话属于前置访问，T1119 拥有跨源通用自动搜集的调度和检查点，T1074 拥有已取得邮件导出物的暂存，T1560
      拥有归档，TA0010 拥有组织边界之外的传送。规则配置可作为本技术的前提与观测事实，但持久规则本身还可能属于账户/配置持久化；不可把规则存在等同于已有消息被取得。
    en: The direct object is acquisition, selection, or passive replication of email bodies and attachments. T1213 covers
      nonmail repositories, and T1185 covers interaction mediation in an active browser session. Account, token, delegation,
      or session acquisition is prerequisite access; T1119 owns generic cross-source automated schedules and checkpoints,
      T1074 owns staging of already acquired mail exports, T1560 owns archiving, and TA0010 owns transmission beyond the organization.
      Rule configuration can be a prerequisite and observable fact here but a durable rule may also be account or configuration
      persistence; its existence alone does not prove message acquisition.
proposed_content:
  name:
    zh: 匿迹型邮件内容收集
    en: Stealth-Oriented Email Content Collection
  summary:
    zh: 攻击者取得邮件正文或附件时，利用已有副本或邮件到达处理改变读取与复制的可见位置，使单一邮箱观察面难以还原取得过程。
    en: Adversaries acquire email bodies or attachments through preexisting copies or message-arrival processing, shifting
      where reading and copying appear so that one mailbox observation plane cannot reconstruct the acquisition.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型邮件内容收集是在攻击者已能触及邮箱、邮件服务器、客户端或其同步副本之后，取得消息正文与附件，并有意安排读取或复制路径，使邮件服务端、终端或邮件传输层中的某一单独视角不能完整表述收集过程。收集可以是历史邮件的针对性读取，也可以是新邮件到达时按条件生成副本；它的直接结果是攻击者获得或可持续接收邮件内容，不以具体产品、协议、邮箱所在位置或文件扩展名定义。
      en: Stealth-Oriented Email Content Collection occurs after an attacker can reach a mailbox, mail server, client, or
        synchronized replica. The attacker obtains message bodies or attachments and deliberately arranges the read or copy
        path so that any single mail-service, endpoint, or transport view gives an incomplete account of the collection. It
        may involve targeted reading of historical mail or conditional copies when new mail arrives. Its direct result is
        attacker access to mail content; no product, protocol, mailbox location, or file extension defines it.
    - zh: 判断需要把被访问的消息集合、发起主体、访问上下文、选择条件和结果副本联系起来。服务端的成功登录、客户端缓存存在、规则创建或邮件投递，只能分别证明链上的一环。若没有内容接触或匹配消息确已流向攻击者控制点的证据，应保留为访问、配置或企图，而不能直接写成已完成收集。
      en: Assessment must connect the accessed message set, acting principal, access context, selection condition, and resulting
        copy. A successful server login, existing client cache, rule creation, or mail delivery proves only one link in that
        chain. Without evidence of content access or a matching message reaching an attacker-controlled point, classify the
        observation as access, configuration, or attempt rather than completed collection.
  stealth_characteristics:
    paragraphs:
    - zh: 对已有同步副本的再次读取不需要新的服务器消息绑定事件，却会在终端留下缓存文件读取、进程活动或后继复制；到达触发的分流则把一次配置操作和后续多次邮件副本分散在不同时间，历史邮件读取量可能很低，但规则变更、路由与外部收件人仍可关联。两种方式都没有让消息凭空消失，而是把关键证据移到与传统邮箱读取不同的观察面。
      en: Rereading an existing synchronized replica needs no new server message-bind event, while leaving endpoint cache-file
        access, process activity, or later copies. Arrival-triggered replication separates a one-time configuration action
        from later message copies; historical mail reads can be low, but rule changes, transport, and external recipients
        remain joinable. Neither mode makes messages disappear. Each moves decisive evidence to an observation plane different
        from conventional mailbox reads.
    - zh: 正常 Outlook 离线使用、共享邮箱同步、归档、灾备、合规留存和邮件迁移都可能呈现相似痕迹。匿迹结论依赖原设备和进程基线、审批与工单、被选消息敏感度、目的地归属，以及攻击前后时间关系；不能把缺少单类日志当作没有发生收集，也不能把高容量读取单独当作恶意。
      en: Normal Outlook offline use, shared-mailbox sync, archiving, disaster recovery, compliance retention, and migration
        can create similar traces. A stealth conclusion depends on device and process baseline, approvals and tickets, sensitivity
        of selected messages, destination ownership, and the before-and-after timeline. Missing one log class is not evidence
        that collection did not occur, and high read volume alone does not establish malice.
  scope_boundary_definition:
    paragraphs:
    - zh: 范围纳入攻击者接触的邮件正文和附件，无论通过缓存副本、服务端 API、导出或投递时复制。T1213 的协作与代码平台内容不因通知邮件而整体转为 T1114；若实际读取的是邮件中的摘要或附件，则只将该邮件对象计入本技术。T1185
        的活跃浏览器交互截获或改写仍由会话中介负责，浏览器里打开网页版邮箱本身不改变这里的内容对象边界。
      en: Scope includes attacker access to message bodies and attachments through cached copies, server APIs, exports, or
        delivery-time copies. Collaboration and code-platform material under T1213 does not all become T1114 merely because
        notification mail exists; only a digest or attachment actually read as mail belongs here. T1185 owns interception
        or alteration of live browser interaction, and opening webmail in a browser does not change the content-object boundary
        here.
    - zh: 被盗凭据、会话令牌、OAuth 授权和邮箱委派解决“如何进入”，不是邮件内容获取本身。T1119 适用于通用的周期搜集规则与增量检查点；在邮件特有的投递事件、选择谓词和邮件路由形成独立痕迹时，才把到达触发分流作为本技术子项，二者可在同一事件链并存。取得后生成
        PST、ZIP 或其他暂存副本分别由 T1074、T1560 处理；外部转发的跨边界传送还应与外传战术交叉标注，不能由收集技术吞并。
      en: Stolen credentials, session tokens, OAuth grants, and mailbox delegation explain entry, not email content acquisition.
        T1119 owns generic periodic collection rules and incremental checkpoints. Arrival-triggered replication is a child
        here only when mail-specific delivery events, selection predicates, and mail routing create an independent trace;
        both techniques may coexist in an incident chain. PST, ZIP, or other copies staged after acquisition belong to T1074
        or T1560 as applicable. External forwarding across the organizational boundary may also require an exfiltration annotation
        and is not swallowed by this Collection technique.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 取得受管工作站后，攻击者可从已经同步的邮箱副本抽取历史通信，避开为本次逐封取信重新调用邮件服务；Mandiant 对 APT1 的 GETMAIL 报告表明攻击者可从 PST 取消息与附件，并按日期限制范围。攻陷邮箱账户后，攻击者也可根据财务主题设置到达触发的规则，Microsoft
          在一场 BEC 行动中看到数百个邮箱的条件转发与后续删除规则。两例说明实现可能性，具体是否降低某环境告警仍需当地基线检验。
        en: After compromising a managed workstation, an adversary can extract historical communications from a previously
          synchronized mailbox copy without asking the mail service for each message again. Mandiant's APT1 report shows GETMAIL
          extracting messages and attachments from PST files with date-limited selection. After taking over mail accounts,
          adversaries can configure arrival-triggered rules for financial topics; Microsoft observed conditional forwarding
          and deletion rules across hundreds of mailboxes in one BEC campaign. These cases establish possible implementations,
          while any reduction in alerts requires the local baseline to be tested.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 副本复用要求攻击者能读取已同步端点文件或进程可见的邮件，并接受缓存可能只有近月内容、附件未完全同步或副本陈旧。到达触发分流要求攻击者能修改邮箱或邮件流规则，知道可选的主题、发件人或正文条件，并控制可收取副本的目的地；其代价是留下配置变更、规则状态和每封匹配邮件的路由记录。两者都不要求攻击者同时拥有所有邮箱的管理员权限。
          en: Replica reuse requires access to already synchronized endpoint files or mail visible to the client process,
            and the attacker must accept that cache content may be recent only, attachments incompletely synchronized, or
            copies stale. Arrival-triggered replication requires permission to change mailbox or mail-flow rules, knowledge
            of selectable subject, sender, or body conditions, and control of a destination receiving copies. It leaves configuration
            changes, rule state, and routing records for every match. Neither mode requires administrator rights over every
            mailbox.
      defender_model:
        paragraphs:
        - zh: 防守方可能拥有 Exchange Online 的 MailItemsAccessed、规则变更、自动转发报告、消息跟踪、终端文件审计和身份登录日志，但覆盖受许可、设置与留存限制。只审查服务器消息访问会漏掉既有缓存再次读取，只审查异常登录会漏掉同一会话内的持续转发；将设备、进程、邮箱、规则、InternetMessageId
            与接收目的地关联后可恢复链条。若终端文件审计或邮件传输日志缺失，应明确降低结论强度。
          en: Defenders may have Exchange Online MailItemsAccessed, rule-change records, auto-forward reports, message trace,
            endpoint file audit, and identity sign-ins, subject to licensing, configuration, and retention limits. Server-message-access
            review alone misses rereads of existing caches; anomalous-sign-in review alone misses continuing forwarding in
            the same session. Joining device, process, mailbox, rule, InternetMessageId, and recipient destination can recover
            the chain. Missing endpoint file audit or transport logs should lower confidence explicitly.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 邮件读取移至服务器访问审计之外的副本或投递流程
      en: Shift mail acquisition to a replica or delivery path outside ordinary server-read review
    analysis:
      paragraphs:
      - zh: 攻击者不再对每封目标邮件产生新的服务端绑定读取，而从早已同步的终端副本提取内容，或让邮件投递流程按条件复制新消息。以邮箱登录或逐封读取为中心的分析因此只能看到先前同步或一次规则变更，误把后续获取视为空白；终端文件和消息路由证据仍可重建行为。Microsoft
          的审计说明、缓存模式说明和转发报告支持观察面差异，攻击案例支持真实使用，但防守遗漏是依赖部署的推断。
        en: The attacker avoids a fresh server bind for every target message by extracting from an earlier endpoint replica
          or causing the delivery process to copy new messages conditionally. Analysis centered on mailbox sign-ins or per-message
          reads sees an earlier sync or a single rule change and may mistake subsequent acquisition for inactivity; endpoint-file
          and mail-routing evidence can still reconstruct it. Microsoft's audit, cached-mode, and forwarding documentation
          supports the observation-plane difference, and incident reports support real use, while actual defensive misses
          depend on deployment.
    evidence_keys:
    - T1114_REF_MS_MAIL_AUDIT
    - T1114_REF_MS_CACHE
    - T1114_REF_MS_FORWARD_REPORT
    - T1114_REF_MANDIANT_APT1
    - T1114_REF_MS_BEC
    confidence: medium
proposed_subtechniques:
- temporary_key: T1114_CHILD_PREEXISTING_REPLICA_READ
  proposed_status: formal_candidate
  name:
    zh: 既存邮件副本二次读取
    en: Rereading a Preexisting Mail Replica
  summary:
    zh: 攻击者从此前同步的邮件副本取得正文或附件，使本次读取留在端点而不产生新的服务器逐封读取。
    en: An adversary obtains message bodies or attachments from a previously synchronized replica, leaving the current read
      on the endpoint without a new server per-message read.
  stable_stealth_variable:
    zh: 变量是攻击者能否复用收集前已经存在的同步副本，并让本次内容读取不经过权威邮件服务；不是本地与远程地址标签。
    en: The variable is whether the attacker reuses a replica that existed before collection and reads content without the
      authoritative mail service in this operation; it is not a local-versus-remote address label.
  trace_change:
    zh: 原应出现的本次服务器消息绑定或导出请求，变成终端缓存文件读取、进程解析和可能的复制；较早的正常同步记录与当前读取分离。
    en: A current server bind or export request is replaced by endpoint cache-file access, process parsing, and possible copying;
      an earlier ordinary sync record is separated in time from the current read.
  defender_observation_difference:
    zh: 服务器审计不能逐封证明离线二次读取，端点文件审计和进程谱系可以定位副本接触；两者时间错位是检测重点。
    en: Server audit cannot prove a later offline reread per message; endpoint file audit and process lineage can locate access
      to the replica, and the time offset between them is the detection focus.
  prerequisites_and_scenario:
    zh: 已同步用户或共享邮箱内容的受控设备上存在可读缓存或归档，攻击者拥有相应文件或应用进程访问权；APT1 的 GETMAIL 抽取 PST 邮件是实际例子，但并非所有 PST 都是自动同步缓存。
    en: A controlled device has a readable cache or archive containing already synchronized user or shared-mailbox content,
      and the attacker can access the file or application process. APT1 GETMAIL extraction from PST is an observed example,
      although not every PST is an automatically synchronized cache.
  sibling_boundary:
    zh: 本项的判断点是本次读取绕开权威服务且利用既存副本；到达触发分流则依赖未来邮件的匹配与传输。攻击者新建导出请求把邮件写成 PST 不满足“既存”，它属于父级获取并可能接续 T1074 暂存。
    en: This child requires a current read outside the authoritative service from a preexisting replica; the sibling requires
      matching and routing of future mail. A newly requested PST export is not preexisting and remains parent-level acquisition,
      possibly followed by T1074 staging.
  proposed_content:
    definition_and_concept:
      paragraphs:
      - zh: 既存邮件副本二次读取是攻击者在邮件客户端早先已完成同步或归档之后，直接从可读副本中恢复消息正文、附件或特定时间段通信。它改变的是本次获取与邮件服务端的关系：服务器看到的最后一次同步可能属于正常用户流程，而攻击者本次解析不会生成同等粒度的新服务器读取事件。是否为
          OST、PST 或其他格式仅决定取证实现，不构成子项条件。
        en: 'Rereading a Preexisting Mail Replica occurs after a mail client has already synchronized or archived content,
          when an adversary recovers message bodies, attachments, or a selected date range directly from the readable copy.
          It changes the relationship between current acquisition and the mail server: the last server sync may belong to
          normal user workflow, while the adversary''s parsing generates no equally granular new server read. OST, PST, or
          another format affects forensics but does not define the child.'
    stealth_characteristics:
      paragraphs:
      - zh: 服务器侧缺少当前逐封读取与终端侧出现异常读/复制同时成立，才形成可解释的观察差。Microsoft 明确指出同步到本地后离线访问不会进入邮箱审计；Mandiant 的 GETMAIL 案例证明攻击者可从 PST 抽取限定日期邮件。但个案未证明攻击者事先选择副本以规避审计，且合法迁移工具也可能一次读取整个
          PST。
        en: The observation difference requires both absence of a current server per-message read and anomalous endpoint read
          or copy evidence. Microsoft explicitly says offline access after sync is not captured by mailbox auditing; Mandiant's
          GETMAIL case demonstrates date-limited extraction from PST. The incident does not prove the attacker chose the copy
          specifically to avoid audit, and authorized migration tools may also read a whole PST.
    scope_boundary_definition:
      paragraphs:
      - zh: 纳入已有副本的消息接触，排除单纯发现 OST 路径、首次服务器同步、管理员发起的新导出和后续把抽取物打包暂存。与到达触发分流的边界在于这里读取历史副本，而后者复制到达后的新消息。若攻击者只读取地址簿而非消息内容，应归身份发现而非本项。
        en: Include contact with messages in a preexisting copy; exclude merely discovering an OST path, first server synchronization,
          a newly initiated administrator export, and later packaging or staging. The sibling copies new messages after arrival,
          whereas this child reads historical copies. Reading only an address book rather than message content belongs to
          identity discovery.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 攻击者进入员工工作站后可取用已经同步的用户邮箱或共享邮箱副本，按日期或主题筛选近期业务通信。APT1 报告中的 GETMAIL 从 PST 提取邮件与附件，一名攻击者连续四周每周返回取上周邮件；该周期性可同时触及 T1119，但本子项只讨论其利用已有邮件副本引起的审计错位。
          en: An attacker on an employee workstation can use previously synchronized user or shared-mailbox copies and select
            recent business communications by date or subject. Mandiant reports GETMAIL extracting messages and attachments
            from PST and one attacker returning weekly for four weeks to take the previous week's mail. That cadence may also
            implicate T1119; this child addresses only the audit displacement caused by the preexisting mail copy.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者需要读取缓存所在设备或用户文件，理解邮件副本格式，并承担副本不完整、受加密保护或过时的限制。对已解锁客户端进程的滥用可能绕过直接文件解析，但必须另证消息实际接触。
            en: The attacker needs access to the cache-bearing device or user file, knowledge of the replica format, and must
              tolerate an incomplete, encrypted, or stale copy. Abuse of an unlocked client process may avoid direct file
              parsing, but actual message contact still needs evidence.
        defender_model:
          paragraphs:
          - zh: 防守方应将邮件服务的最近同步时间和内容覆盖，与端点对邮件数据文件的非预期进程读取、文件复制和出站写入关联。若无端点文件遥测，就只能从先前同步推断可能暴露范围，不能定位攻击者本次读了哪些消息。
            en: Defenders should join the mail service's last sync time and covered folders to unexpected process reads of
              mail-data files, copies, and outbound writes on the endpoint. Without endpoint file telemetry, earlier sync
              only bounds possible exposure; it cannot identify which messages the attacker reread.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 借用先前同步副本移走当前服务器读取痕迹
        en: Reuse an earlier synced replica to remove current server-read traces
      analysis:
        paragraphs:
        - zh: 客户端先前的正常同步建立副本，攻击者后来直接解析该副本，本次消息选择和读取只在端点发生。只以 MailItemsAccessed 的当前 Bind 事件追查会低估历史邮件接触；先前 Sync 范围与端点读/复制进程关联后可恢复风险。该机理不能宣称服务器从未有同步痕迹，也不能把没有端点日志解释为无收集。
          en: Earlier normal client synchronization creates a copy that the attacker later parses, so the current message
            selection and read occur at the endpoint. An investigation using only current MailItemsAccessed Bind events undercounts
            historical-mail exposure; joining the earlier Sync scope with endpoint read or copy processes restores the risk.
            This mechanism does not claim that the server has no sync trace or that missing endpoint logs prove no collection.
      evidence_keys:
      - T1114_REF_MS_MAIL_AUDIT
      - T1114_REF_MS_CACHE
      - T1114_REF_MANDIANT_APT1
      confidence: medium
  evidence_keys:
  - T1114_REF_MS_MAIL_AUDIT
  - T1114_REF_MS_CACHE
  - T1114_REF_MANDIANT_APT1
  - T1114_REF_MS_4663
  limitations:
    paragraphs:
    - zh: GETMAIL 案例是 PST 归档提取，不能自动当成 OST 离线缓存的具体入侵证据；离线缓存覆盖范围取决于同步设置，共享邮箱与附件还可能单独受限。Windows 4663 只有配置目标 SACL 才会产生所需文件访问事件，E5/高级邮箱审计可用性亦需按环境核实。
      en: The GETMAIL case concerns PST archive extraction and is not itself an intrusion demonstration against an OST offline
        cache. Cache coverage depends on sync settings, with shared mailboxes and attachments adding limits. Windows event
        4663 requires an appropriate target SACL, and availability of advanced mailbox auditing must be verified locally.
- temporary_key: T1114_CHILD_ARRIVAL_CONDITIONED_REPLICATION
  proposed_status: formal_candidate_with_boundary_review
  name:
    zh: 到达条件驱动的邮件副本分流
    en: Arrival-Conditioned Mail Replication
  summary:
    zh: 攻击者让邮件到达与内容匹配触发持续复制，使一次规则配置和多次收集结果分散在不同审计时点。
    en: An attacker makes mail arrival and content matching trigger continued copying, separating a one-time rule change from
      collection outcomes at later audit times.
  stable_stealth_variable:
    zh: 变量是邮件投递事件与选择谓词共同触发副本，而不是“存在转发规则”这个产品功能或规则创建权限本身。
    en: The variable is that a delivery event and selection predicate jointly trigger a copy, not the product feature called
      a forwarding rule or the permission to create one.
  trace_change:
    zh: 历史邮件反复检索被一次配置变更、匹配消息的路由副本和外部或内部接收记录替代；每封匹配邮件仍可能留有消息追踪。
    en: Repeated historical-mail searches give way to one configuration change, routed copies of matching messages, and internal
      or external receipt records; every match may still leave message-trace evidence.
  defender_observation_difference:
    zh: 只看用户读信事件会低估新邮件的被动复制；需关联规则版本、匹配谓词、送达消息 ID 与新增收件目的地，而不能只告警规则创建。
    en: User read events alone undercount passive copies of new mail; defenders must join rule version, match predicate, delivered
      message ID, and added destination rather than alerting on creation alone.
  prerequisites_and_scenario:
    zh: 攻击者可修改邮箱或传输规则，知道哪些新消息具有目标价值，并能访问目标收件方；Microsoft BEC 调查中的财务关键词条件转发和删除规则提供实例。
    en: The attacker can change mailbox or transport rules, knows which new messages carry target value, and can access the
      recipient destination; Microsoft's BEC investigation of finance-keyword forwarding and deletion rules provides an example.
  sibling_boundary:
    zh: 此项处理新消息到达后的选择与复制；既存副本二次读取处理此前缓存的历史消息。纯通用周期脚本或增量检查点归 T1119；只有邮件投递、消息谓词和路由结果共同存在才保留本项。
    en: This child selects and copies newly arriving messages; the sibling rereads historical cached messages. Generic periodic
      scripts or incremental checkpoints belong to T1119; retain this child only when mail delivery, a message predicate,
      and a routing result are all present.
  proposed_content:
    definition_and_concept:
      paragraphs:
      - zh: 到达条件驱动的邮件副本分流是攻击者预先设置消息选择条件和副本目的地，让邮件服务器在后续消息送达时自动复制匹配内容。它的定义是到达事件与谓词触发收集，适用的机制可以是邮箱规则、邮件流规则或等价的投递处理，而不是把 ATT&CK
          的“转发规则”子项重新命名。若规则尚未命中消息，只能记录为准备或企图。
        en: Arrival-Conditioned Mail Replication is the adversary's advance setting of a message predicate and copy destination
          so that a mail service replicates matching content on later delivery. The defining relation is arrival plus predicate
          triggering collection. An inbox rule, mail-flow rule, or equivalent delivery processor may implement it; this is
          not a relabeling of ATT&CK's forwarding-rule child. A rule with no observed message match remains preparation or
          attempt.
    stealth_characteristics:
      paragraphs:
      - zh: 一次配置可在较长时间内产生许多副本，因而收集行为与攻击者登录或主动读信不再一一对应。Microsoft 的 BEC 案例证明按财务关键词转发到受控地址并删除相关邮件确实出现过；删除是相邻痕迹抑制行为，不是本项成立条件。每次成功分流仍应在自动转发报告或邮件流记录留下目的地证据，匿迹效果取决于防守是否把规则与消息结果联查。
        en: One configuration can create many copies over time, so collection no longer maps one-to-one to attacker sign-ins
          or active message reads. Microsoft's BEC case establishes forwarding of finance-keyword mail to controlled addresses
          with associated deletion rules; deletion is adjacent trace suppression, not a condition of this child. Each successful
          replication should still leave destination evidence in auto-forward reports or mail-flow records, and the stealth
          effect depends on whether defenders join rules to message outcomes.
    scope_boundary_definition:
      paragraphs:
      - zh: 必须证明攻击者控制的选择条件、实际匹配邮件和副本目的地，不能仅凭规则新建或外部地址配置定性。没有消息谓词、只把所有邮件转发的设置仍可属于父级收集与外传，但未必体现本项的低噪音选择变量。规则持久性归相邻账户或配置持久化；消息跨组织传送归外传战术，通用自动调度归
          T1119。
        en: Establish the attacker-controlled selection condition, actual matching mail, and copy destination; a new rule
          or configured external address alone is insufficient. A setting that forwards every message without a message predicate
          may belong to parent-level collection and exfiltration but need not have this child's low-volume selection variable.
          Durable rule state belongs to adjacent account or configuration persistence, cross-boundary transmission to Exfiltration,
          and generic automatic scheduling to T1119.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 在 BEC 场景中，攻击者取得一个财务相关邮箱后，可把包含 invoice、payment 或 statement 的未来邮件复制到可控地址，并在正常收件箱中保留业务流；Microsoft 观察到这类条件规则覆盖多个受害组织。合规归档、企业邮件日记、代理收件与迁移期间的临时转发可能产生相似结果，必须核查审批、目的域和生效时间。
          en: In BEC, an attacker with a finance-related mailbox can copy future messages containing invoice, payment, or
            statement to a controlled address while ordinary business mail continues. Microsoft observed such conditional
            rules across multiple victim organizations. Compliance archiving, enterprise journaling, delegated receipt, and
            temporary forwarding during migration can produce similar results, so approval, destination domain, and effective
            time must be checked.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者需要邮箱或邮件流配置写入权限、能预测目标邮件的稳定谓词，并维护可收到消息的目的地。条件过窄会漏掉目标邮件，条件过宽会增加传输量和被审查概率；阻断外部自动转发或规则审批会压缩该路径，但内部受控目的地仍可能可用。
            en: The attacker needs mailbox or mail-flow configuration write access, a stable predicate anticipating target
              mail, and a reachable receiving destination. A narrow predicate misses targets, while a broad one raises transport
              volume and scrutiny. Blocking external auto-forwarding or requiring rule approval constrains this route, although
              an attacker-controlled internal destination may remain possible.
        defender_model:
          paragraphs:
          - zh: 防守方需要统一审计中的 New-InboxRule、Set-InboxRule 或等价配置事件，以及自动转发报告或消息跟踪中的匹配邮件与新增收件人。只核查当前规则可能漏掉已删除规则，只审查新建操作可能漏掉修改旧规则；需保留规则历史和消息结果。Microsoft
              报告可按规则类型、收件域、用户和首次转发时间回溯，但具体字段和保留期依租户实现。
            en: Defenders need New-InboxRule, Set-InboxRule, or equivalent configuration events in unified audit and matching
              mail plus added recipients in auto-forward reports or message trace. Current-rule inspection can miss deleted
              rules, and creation-only review misses changes to existing rules; retain rule history and message outcomes.
              Microsoft's report can pivot by rule type, recipient domain, forwarding user, and first-forward time, subject
              to tenant-specific fields and retention.
    stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 以投递事件分散持续邮件收集的控制与结果痕迹
        en: Separate continuing mail collection control and outcomes across delivery events
      analysis:
        paragraphs:
        - zh: 攻击者仅在前期改变一次路由选择状态，之后每封目标邮件由正常投递过程触发副本；控制事件与多个收集结果跨时间分布，若告警只看短窗口的异常登录或批量读信，难以把它们复原为一条链。规则历史、匹配谓词、InternetMessageId
            和目的地关联可消除此差异；合法归档也可产生相似图形，必须纳入批准基线。
          en: The attacker changes routing selection state once; each later target message causes a copy through ordinary
            delivery. The control event and multiple collection results are spread over time, so alerts focused on short windows
            of anomalous sign-ins or bulk reads may fail to reconstruct one chain. Joining rule history, predicate, InternetMessageId,
            and destination removes that gap; authorized archiving can produce a similar graph and requires an approval baseline.
      evidence_keys:
      - T1114_REF_MS_BEC
      - T1114_REF_MS_FORWARD_REPORT
      - T1114_REF_MS_RULE_AUDIT
      confidence: medium
  evidence_keys:
  - T1114_REF_MS_BEC
  - T1114_REF_MS_FORWARD_REPORT
  - T1114_REF_MS_RULE_AUDIT
  - T1114_REF_MS_FORWARD_CONTROL
  limitations:
    paragraphs:
    - zh: BEC 案例直接证明条件转发和删除规则，但没有公布每封邮件的完整消息跟踪或告警命中率。Microsoft 自动转发报告只覆盖其说明的时间窗口与转发类型；本地 Exchange、Google Workspace 或第三方网关需要另行映射字段。外部自动转发被禁用时，内部收件点或其他传送方式仍应单独评估。
      en: The BEC report directly establishes conditional forwarding and deletion rules but does not publish full message
        trace or alert outcomes for every mail item. Microsoft's auto-forward report covers its stated windows and forwarding
        types; on-premises Exchange, Google Workspace, and third-party gateways need separate field mappings. When external
        auto-forwarding is disabled, internal destinations or other transfer paths still need separate assessment.
defense_candidates:
  detection_strategies:
  - temporary_key: T1114_DET_REPLICA_READ
    name:
      zh: 邮件同步范围到端点副本读取谱系
      en: Mail Sync Scope to Endpoint Replica Read Lineage
    objective:
      zh: 将既往同步范围与本次端点邮件副本读取及结果复制相连，识别服务器消息审计之外的内容接触。
      en: Join prior sync scope to current endpoint replica reads and resulting copies to identify content access outside
        server message auditing.
    subjects:
    - parent
    - T1114_CHILD_PREEXISTING_REPLICA_READ
    analytic_keys:
    - T1114_NJA_REPLICA_READ
    evidence_keys:
    - T1114_REF_MS_MAIL_AUDIT
    - T1114_REF_MS_CACHE
    - T1114_REF_MS_4663
    - T1114_REF_MANDIANT_APT1
  - temporary_key: T1114_DET_ARRIVAL_ROUTING
    name:
      zh: 邮件条件配置到投递副本谱系
      en: Mail Predicate Configuration to Delivery Copy Lineage
    objective:
      zh: 识别规则变更后由邮件匹配条件触发并流向未批准目的地的内容副本。
      en: Identify content copies triggered by a mail predicate after rule changes and delivered to an unapproved destination.
    subjects:
    - parent
    - T1114_CHILD_ARRIVAL_CONDITIONED_REPLICATION
    analytic_keys:
    - T1114_NJA_RULE_TO_MESSAGE
    evidence_keys:
    - T1114_REF_MS_RULE_AUDIT
    - T1114_REF_MS_FORWARD_REPORT
    - T1114_REF_MS_BEC
  detection_analytics:
  - temporary_key: T1114_NJA_REPLICA_READ
    strategy_key: T1114_DET_REPLICA_READ
    name:
      zh: 非预期进程读取既有邮件副本与先前同步关联
      en: Unexpected Process Reads of Preexisting Mail Replica Joined to Prior Sync
    platforms:
    - Windows
    - Office Suite
    logic:
      zh: 对批准的邮件数据目录和经识别的 PST/OST 设置文件访问 SACL 或等价 EDR 读取遥测，筛选非 Outlook、备份、索引及批准迁移进程对大量邮件副本的连续 ReadData/复制。用文件创建时间或 Outlook
        同步范围确认副本早于本次进程活动，再将进程签名、父进程、用户、设备、目标复制路径与 MailItemsAccessed Sync 的邮箱、客户端 IP、会话和时间关联。若没有相应的新 Bind/导出事件而存在可疑副本读取，输出“端点读取、服务器未新增逐封访问”的差分；缺少服务器日志时只能报告端点异常，不可写成已证明零服务端访问。
      en: Apply a file-access SACL or equivalent EDR read telemetry to approved mail-data directories and identified PST/OST
        files. Select sustained ReadData or copy access by processes other than Outlook, backup, indexing, or approved migration
        tools. Establish that the replica predates the current process from file creation time or Outlook sync scope, then
        join process signer, parent, user, device, copy destination, and MailItemsAccessed Sync mailbox, client IP, session,
        and time. If suspicious replica reads occur without corresponding new Bind or export events, emit an endpoint-read
        versus no-new-per-message-server-access differential. If server logs are missing, report only endpoint anomaly, not
        proven absence of server access.
    data_requirements:
    - source_type: endpoint-file-access
      channel: Windows Security 4663 with SACL or EDR equivalent
      required_fields:
      - TimeCreated
      - Computer
      - SubjectUserSid
      - ProcessName
      - ObjectName
      - AccessMask
    - source_type: endpoint-process-lineage
      channel: EDR process and file copy telemetry
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - parent_process_guid
      - signer
      - destination_path
    - source_type: exchange-mailbox-audit
      channel: Purview MailItemsAccessed and mailbox export audit
      required_fields:
      - CreationTime
      - MailboxUPN
      - UserId
      - ClientIPAddress
      - SessionId
      - MailAccessType
      - ParentFolder
    correlation:
      window: 24 hours around endpoint read plus historical sync scope
      dimensions:
      - mailbox
      - device
      - user
      - process
      - replica_path
    observables:
    - preexisting mail replica
    - unexpected reader process
    - copy target
    - last server sync
    - current bind or export presence
    false_positives:
      zh: 授权迁移、eDiscovery、备份、杀毒扫描、索引与用户本人离线阅读会读取同一文件；需按签名、工单、设备角色和结果去向排除。
      en: Approved migration, eDiscovery, backup, antivirus, indexing, and ordinary offline reading access the same files;
        exclude using signer, ticket, device role, and copy destination.
    blind_spots:
      zh: 无文件 SACL/EDR、加密副本、内存中客户端访问、PST 来自其他主机、缺失高级邮箱审计或留存过短都会破坏差分。
      en: Missing SACL or EDR, encrypted copies, in-memory client access, PST files from another host, absent advanced mailbox
        audit, or short retention break the differential.
    tuning:
      zh: 先登记批准的迁移/备份进程和邮箱数据目录，再按文件大小、读取持续时间、身份角色和敏感邮箱分层；不能以单次打开文件告警。
      en: Inventory approved migration and backup processes and mail-data directories first, then stratify by file size, read
        duration, identity role, and sensitive mailbox; do not alert on one file open alone.
    evidence_keys:
    - T1114_REF_MS_MAIL_AUDIT
    - T1114_REF_MS_CACHE
    - T1114_REF_MS_4663
    - T1114_REF_MANDIANT_APT1
  - temporary_key: T1114_NJA_RULE_TO_MESSAGE
    strategy_key: T1114_DET_ARRIVAL_ROUTING
    name:
      zh: 邮件规则版本与实际匹配转发关联
      en: Mail Rule Version to Actual Matching Forward Correlation
    platforms:
    - Office Suite
    logic:
      zh: 从统一审计取 New-InboxRule、Set-InboxRule、Set-Mailbox 和邮件流规则变更，保留配置前后谓词、动作、操作者、邮箱、规则 ID 与目的地；再取自动转发报告或消息跟踪中的转发用户、类型、收件域、首次转发时间、消息
        ID 与结果。只有规则在生效窗口内匹配实际邮件且副本流向未批准收件人时标记完成收集，优先排序财务/安全关键字、受保护邮箱、首次出现目的域或规则创建后异常删除。若只有配置而无匹配消息，输出准备行为；若只有转发结果而缺少规则历史，输出待追溯路由异常。
      en: Take New-InboxRule, Set-InboxRule, Set-Mailbox, and mail-flow-rule changes from unified audit, preserving before/after
        predicate, action, actor, mailbox, rule ID, and destination. Join the auto-forward report or message trace by forwarding
        user, type, recipient domain, first-forward time, message ID, and outcome. Mark completed collection only when a rule
        matches actual mail within its effective interval and a copy reaches an unapproved recipient. Prioritize finance or
        security terms, protected mailboxes, first-seen destination domains, and anomalous deletion after rule creation. Configuration
        without matching mail is preparation; forwarding without rule history is an unresolved routing anomaly.
    data_requirements:
    - source_type: exchange-unified-audit
      channel: Purview mailbox and transport rule audit
      required_fields:
      - CreationTime
      - Operation
      - UserId
      - MailboxOwnerUPN
      - ObjectId
      - Parameters
      - ClientIP
      - SessionId
    - source_type: exchange-mail-flow
      channel: Auto-forwarded messages report or message trace
      required_fields:
      - timestamp
      - sender_mailbox
      - internet_message_id
      - forwarding_type
      - recipient
      - recipient_domain
      - delivery_status
    - source_type: governance-baseline
      channel: approved forwarding and migration register
      required_fields:
      - mailbox
      - rule_id
      - destination
      - approver
      - effective_start
      - effective_end
    correlation:
      window: rule effective interval with 30 day initial lookback
      dimensions:
      - mailbox
      - rule_id
      - internet_message_id
      - recipient
    observables:
    - rule predicate
    - rule action
    - matched message
    - newly added recipient
    - forwarding result
    false_positives:
      zh: 合规日记、归档、共享邮箱、代理转发、迁移过渡与用户批准的规则可产生相同模式；要以批准目的地和有效期限作基线。
      en: Compliance journaling, archives, shared mailboxes, delegated forwarding, migration windows, and user-approved rules
        can look identical; baseline approved destinations and effective intervals.
    blind_spots:
      zh: 规则审计过期、隐藏 MAPI 属性、内部收件人、外部网关缺日志、转发报告时间窗有限及邮件未投递，会使成功收集无法判定。
      en: Expired rule audit, hidden MAPI properties, internal recipients, absent external-gateway logs, limited forwarding-report
        windows, and undelivered mail can prevent a successful-collection conclusion.
    tuning:
      zh: 在敏感邮箱及首次外部目的域提高权重；保留旧规则修改和删除历史；不要把合法全量邮件迁移与单条财务主题规则混作同一基线。
      en: Weight sensitive mailboxes and first-seen external domains more heavily, preserve modifications and removals of
        old rules, and do not use a full-mailbox migration baseline for a narrow finance-topic rule.
    evidence_keys:
    - T1114_REF_MS_RULE_AUDIT
    - T1114_REF_MS_FORWARD_REPORT
    - T1114_REF_MS_BEC
  mitigations:
  - temporary_key: T1114_MIT_CONTENT_PATH_CONTROL
    name:
      zh: 邮件副本与自动分流的最小化治理
      en: Mail Replica and Automatic Routing Minimization
    description:
      zh: 限制敏感邮箱可下载副本的设备与范围，审批自动分流目的地并保留独立审计，使历史副本读取和到达触发复制更难发生且更可追溯。
      en: Constrain devices and scope allowed to hold sensitive mailbox replicas, approve automatic routing destinations,
        and retain independent audit so historical-copy reads and arrival-triggered copies are harder and more traceable.
    measures:
    - key: T1114_MIT_MANAGED_REPLICA
      control_type: preventive
      use:
        zh: 对高敏邮箱按业务需要限制离线同步窗口、共享邮箱下载和非受管设备访问；对保留副本的终端启用磁盘加密、文件访问遥测及退役清理。
        en: For sensitive mailboxes, limit offline sync windows, shared-mailbox downloads, and unmanaged-device access according
          to business need; encrypt, audit, and clean up endpoints that retain replicas.
      expected_effect:
        zh: 可被继承的历史邮件副本范围缩小，端点读取更容易关联到受管设备。
        en: The historical replica available for inheritance shrinks, and endpoint reads are easier to tie to managed devices.
      limitations:
        zh: 离线办公和代理邮箱会受影响，受控端点上的合法副本仍可能被读取。
        en: Offline work and delegated mailboxes are affected, and legitimate copies on a compromised managed endpoint remain
          readable.
    - key: T1114_MIT_FORWARD_GOVERNANCE
      control_type: preventive
      use:
        zh: 默认限制外部自动转发，对经批准的目的域、邮箱和规则设置期限；保存规则变更及实际转发报告，定期复核内部转发链。
        en: Restrict external auto-forwarding by default, time-bound approved domains, mailboxes, and rules, preserve rule-change
          and actual-forward reports, and review internal forwarding paths.
      expected_effect:
        zh: 未批准的外部分流被阻断或留下策略失败证据，内部异常目的地更易突出。
        en: Unapproved external copies are blocked or leave policy-failure evidence, while anomalous internal destinations
          stand out.
      limitations:
        zh: 外部转发限制不阻止受控内部收件人、正常 API 读取或已有缓存；合规日记和迁移需要例外。
        en: External-forward restrictions do not stop controlled internal recipients, ordinary API reads, or existing caches;
          journaling and migration require exceptions.
