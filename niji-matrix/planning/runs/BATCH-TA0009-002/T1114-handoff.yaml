    - T1114_REF_ATTACK_002
    - T1114_REF_ATTACK_003
    - T1114_REF_MS_MAIL_AUDIT
    - T1114_REF_MS_RULE_AUDIT
    mechanism_support:
    - mechanism_ref: NM-BT
      evidence_keys:
      - T1114_REF_MS_MAIL_AUDIT
      - T1114_REF_MS_CACHE
      - T1114_REF_MS_FORWARD_REPORT
      - T1114_REF_MANDIANT_APT1
      - T1114_REF_MS_BEC
      caution: Observation gap is architectural; incident-specific alert suppression is not measured.
    - mechanism_ref: NM-ST
      evidence_keys:
      - T1114_REF_MS_BEC
      - T1114_REF_MS_RULE_AUDIT
      - T1114_REF_MS_FORWARD_REPORT
      caution: Rule and delivery events are temporally separated
      but forwarding itself remains visible in transport telemetry.: null
    child_existence_support:
    - child_key: T1114_CHILD_PREEXISTING_REPLICA_READ
      evidence_keys:
      - T1114_REF_MS_MAIL_AUDIT
      - T1114_REF_MS_CACHE
      - T1114_REF_MANDIANT_APT1
    - child_key: T1114_CHILD_ARRIVAL_CONDITIONED_REPLICATION
      evidence_keys:
      - T1114_REF_MS_BEC
      - T1114_REF_MS_RULE_AUDIT
      - T1114_REF_MS_FORWARD_REPORT
    unsupported_or_deferred:
    - key: selective_query_child
      reason: Date or keyword selection can reduce volume but appears across repository collection and overlaps T1119 incremental
        scheduling; current sources do not establish a mail-specific independent defense boundary.
    - key: hidden_rule_child
      reason: Hidden MAPI rule attributes are a configuration visibility issue; current handoff lacks a separate case and
        analytic that prove distinct mail-content collection beyond arrival-conditioned replication.
    - key: measured_alert_reduction
      reason: No incident source here publishes comparative detector hit rates for the proposed axes.
    - key: cross_platform_generalization
      reason: Concrete logging and control recommendations are Microsoft-specific; analogous Google or on-premises fields
        require separate mapping.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父子草案分别覆盖定义、匿迹特性、边界、场景、攻防前提、机理、证据和限制，并为两轴提出不同的可实施谱系分析；正式写入前仍须主 Agent 审定到达触发分流与 T1119、持久化及外传的交叉边界。
      en: Parent and child drafts cover definition, stealth traits, boundaries, scenarios, attacker and defender assumptions,
        mechanisms, evidence, and limits, with distinct implementable lineage analytics. The primary agent must still settle
        arrival-triggered replication against T1119, persistence, and exfiltration before canonical writing.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed workbook XML extraction
    - YAML syntax validation
    - library lookup
  limitations:
    paragraphs:
    - zh: 固定 19.1 工作簿是 ATT&CK 范围依据，在线页面及 Microsoft 文档会变动，正式参考应保存访问日期和精确定位。GETMAIL 的 PST 案例不能等同 OST 攻击实测，BEC 案例没有逐封邮件跟踪或告警比较，Microsoft
        的审计与自动转发报表依赖许可、启用状态和留存。正常迁移、备份、eDiscovery、共享邮箱代理及合规日记是强反例；如果没有授权、设备和结果目的地证据，应降低置信度而不是把相似形状判为恶意。
      en: The fixed 19.1 workbook governs ATT&CK scope; live pages and Microsoft documentation may change, so canonical references
        need access dates and exact locators. The GETMAIL PST case is not a measured OST intrusion, and the BEC case lacks
        per-message traces or comparative alert data. Microsoft audit and auto-forward reports depend on licensing, configuration,
        and retention. Authorized migration, backup, eDiscovery, shared-mailbox delegation, and compliance journaling are
        strong counterexamples. Without authorization, device, and destination evidence, lower confidence rather than treating
        a similar shape as malicious.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason: The proposed collection paths do not themselves obscure message content; password-protected archives belong to
      T1560.
  - mechanism_ref: NM-FD
    reason: A legitimate Outlook process or expected mail-flow feature alone is not proof of feature disguise; process and
      rule provenance must be examined.
  open_questions:
  - zh: 主 Agent 是否将到达触发的邮件副本分流保留为 T1114 子项，同时把同一案件的外部传送和持久规则分别标注给外传与持久化，而不重复定义消息获取？
    en: Should the primary agent retain arrival-triggered mail replication as a T1114 child while separately annotating external
      transmission and durable rule state under exfiltration and persistence without duplicating the content-acquisition definition?
  - zh: 既存 PST 归档和 OST 同步缓存应使用同一子项的“收集前已有副本”条件，还是因 PST 来源不明而把具体案件限制在父级应用场景？
    en: Should preexisting PST archives and OST sync caches share the child's preexisting-replica condition, or should uncertain
      PST provenance confine a particular case to the parent scenario?
