research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: meeting_process_attribution
      resolution: proposed-formal
      variable: recorder host process is an audio-expected conference app
      trace_change: microphone event and audio file are attributable to an expected app process rather than a separate recorder
      defender_difference: join audio session to unapproved module or injection and meeting context
      evidence_keys: [T1123_REF_ESET_PDF]
    - axis: call_application_interface_attachment
      resolution: parent-core
      variable: call media are acquired through a signed-in app interface and its grant path
      trace_change: third-party interface grant and call-timed artifacts replace a standalone microphone-recorder trail
      defender_difference: join requester identity, user approval, call session, and media artifact
      evidence_keys: [T1123_REF_T9000]
    - axis: short_or_condition_triggered_recording
      resolution: evidence-deferred
      variable: start and stop device capture only on a trigger or operator command
      trace_change: shorter active microphone intervals are plausible but unmeasured in the reviewed Enterprise sources
      defender_difference: would require longer-window activation-to-command correlation, but no conclusion-level stealth source found
      evidence_keys: []
    - axis: memory_buffer_or_delayed_disk_write
      resolution: evidence-deferred
      variable: hold audio in memory or delay disk persistence
      trace_change: fewer immediate file writes are plausible but not established by Attor, which wrote encrypted files, or T9000, which wrote temporary files
      defender_difference: would shift from file creation to audio-session and memory/egress correlation if proven
      evidence_keys: []
    - axis: microphone_device_or_audio_format
      resolution: not-stealth-distinct
      variable: device model, OS API, codec, or filename
      trace_change: none inherent without an independently evidenced change in attribution or observability
      defender_difference: platform and parser tuning, not a stable Niji child boundary
      evidence_keys: [T1123_REF_ATTACK]
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 无子项仍开放检索五个轴。Attor 与 T9000 各有一手结论级录音观察，且防守实现差异明确；但两者共享借用通信应用身份的匿迹效果，接口类型差异不足以独立划分子项。建议只将 Attor 的进程归因变量正式化，T9000 留作父级实例与独立检测分析。短时/条件触发与内存缓冲/延迟落盘没有足以证明企业端点匿迹结果的来源，暂不正式化；零 ATT&CK 子项不决定 Niji 数量。
      en: Despite no ATT&CK children, five axes were searched. Attor and T9000 each provide primary evidence of actual recording and distinct defense implementation, but they share the stealth effect of borrowing a communication-app identity. Interface type alone is insufficient for an independent child. Recommend formalizing only Attor's process-attribution variable; retain T9000 as a parent case and a separate analytic. Short/conditional capture and memory buffering/delayed disk writes lack sources establishing a stealth outcome on enterprise endpoints and remain nonformal. Zero ATT&CK children does not determine the Niji count.
  evidence_coverage:
    parent_behavior_keys: [T1123_REF_ATTACK, T1123_REF_ESET_PDF, T1123_REF_T9000]
    boundary_keys: [T1123_REF_ATTACK, T1123_REF_ESET_PDF, T1123_REF_T9000]
    mechanism_support:
    - mechanism_ref: NM-FD
      evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_T9000]
      conclusion_level: implementation observed; confusion or stealth effect reasoned and source-qualified
    child_existence_support:
    - child_key: T1123_CHILD_PROCESS
      evidence_keys: [T1123_REF_ESET_PDF]
      conclusion_level: direct process gating, recording, and author-stated possible stealth explanation
    - child_key: T1123_CHILD_CALL_API
      evidence_keys: [T1123_REF_T9000]
      conclusion_level: direct app-interface attachment, user grant, call recording, and author-stated potential user confusion; parent-core only pending independent stealth-variable evidence
    unsupported_or_deferred:
    - key: T1123_AXIS_SHORT_BURST
      reason:
        zh: VERMIN 的启动/停止命令和移动恶意软件的时间设定只证明控制能力，不足以证明 Enterprise 19.1 范围内独立匿迹分区或告警降低。
        en: VERMIN start/stop commands and timed mobile malware show control capability, not an independent stealth partition or alert reduction in Enterprise 19.1 scope.
    - key: T1123_AXIS_MEMORY
      reason:
        zh: 未找到音频采集内存缓冲减少磁盘痕迹的一手实例；Attor 和 T9000 均有落盘证据。不得把通用内存执行或延迟外传当作音频采集子项。
        en: No primary case established audio buffering that reduces disk traces; both Attor and T9000 wrote files. Generic memory execution or delayed exfiltration cannot become an audio-capture child.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 草案逐项交代了定义、匿迹观察差、包括与排除、正常会议反例、攻击前提、防守遥测、因果机理、一项建议正式化与一项暂缓的子项边界、案例和证据限制；正式集成仍需主 Agent 与其他四项比较边界及双语深度。
      en: The draft covers definition, observation difference, inclusion and exclusions, normal-meeting comparator, attacker prerequisites, defender telemetry, causal mechanism, one proposed child and one deferred axis, cases, and evidence limits. The primary agent still needs cross-candidate boundary and bilingual-depth review during integration.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [local ATT&CK OOXML row extraction, shared-library text search]
  limitations:
    paragraphs:
    - zh: 本研究以 ATT&CK Enterprise 19.1 固定工作簿锚定范围；在线 ATT&CK 页面用于核对而不是迁移基线。ESET 与 Unit 42 的样本分析直接报告录音行为，Microsoft 与 Apple 平台文档只说明权限、指示或控制能力，不能证明恶意录音或绕过。Attor 白皮书对进程条件与磁盘产物的证据很强，但其匿迹解释为作者推测。T9000 是旧 Skype 接口的真实实现，不能直接代表现行会议客户端或无感权限绕过。任何正式 NJA 的音频设备与应用接口字段都须经本地产品试点验证，Windows 用户界面的七日历史不自动构成企业日志流。
      en: The fixed ATT&CK Enterprise 19.1 workbook anchors scope; the live ATT&CK page was cross-checked without migrating the baseline. ESET and Unit 42 sample analyses directly report recording; Microsoft and Apple platform documents establish only permission, indicator, or control capabilities, not malicious recording or bypass. Attor's white paper strongly documents process gating and disk artifacts but frames its stealth explanation as the authors' inference. T9000 is a real implementation against an older Skype interface and cannot stand for current meeting clients or silent permission bypass. Audio-device and app-interface fields in any formal NJA need local product-pilot validation; Windows' seven-day user-interface history is not automatically an enterprise log stream.
    - zh: 防守方案把合法会议录音、转写、客服质检和无障碍使用作为反例，并要求真实的模块身份、接口请求者、会话及录音结果关联。缺少这些数据时只能上报较弱的可疑访问或调查线索，不能从麦克风活动、授权提示或音频文件扩展名直接推断恶意采集。
      en: The defense proposals treat authorized meeting recording, transcription, contact-center quality assurance, and accessibility use as benign comparators and require real joins among module identity, interface requester, session, and audio outcome. Without those data, they can report only weaker suspicious-access or investigation leads; microphone activity, a grant prompt, or an audio extension alone cannot prove malicious capture.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 尚无结论级企业端点资料表明短时/条件触发录音将痕迹稀释到检测阈值以下；普通启停控制不能证明时空释痕。
      en: No conclusion-level enterprise evidence shows brief or conditioned recording diluting traces below detection thresholds; ordinary start/stop control does not establish spatiotemporal dilution.
  - mechanism_ref: NM-DO
    reason:
      zh: Attor 的加密录音是产物保护，T1560 与后续传送可另标；不能据此推断本父级的核心匿迹机理是内容遮蔽。
      en: Attor's encrypted recording protects the artifact and may receive separate T1560 or transfer labels; it does not establish content obscuration as this parent's core mechanism.
  open_questions:
  - zh: 主 Agent 应决定 REF-000484 的 Attor 网页对象如何扩展，以免同 URL 重复；PDF 可作为独立来源。
    en: The primary agent should decide how to extend the existing Attor webpage REF-000484 without duplicating its URL; the PDF can be a separate source.
  - zh: 正式策略如声明覆盖 Linux/macOS，需额外取得各平台可验证的音频会话与应用授权遥测；本交接的实施分析仅为有相应采集器的 Windows 环境。
    en: If formal strategies claim Linux or macOS coverage, obtain platform-specific validated audio-session and app-grant telemetry; the implementation analytics here cover Windows only where the requisite sensors exist.
