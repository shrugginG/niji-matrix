handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-002
work_item_ref: WORK-TA0009-T1123
temporary_key_prefix: T1123_
candidate:
  source_type: attack
  source_attack_id: T1123
  source_attack_version: '19.1'
  name:
    zh: 音频捕获
    en: Audio Capture
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿把 T1123 置于 Collection，涵盖利用麦克风或通信应用取得环境和谈话音频，且没有 ATT&CK 子项。该父行为有明确的一手实例，但单纯录音不必然改变防守观察。建议将 Niji 父级适配为有意改变音频来源归因或通话授权解释的匿迹型音频捕获，同时保留设备与应用音频这两种输入路径。
      en: The fixed ATT&CK Enterprise 19.1 workbook places T1123 in Collection and covers acquisition of environmental or conversational audio through microphones or communication applications, with no ATT&CK children. Primary reports establish the parent behavior, but recording alone does not necessarily change defender observation. Adapt the Niji parent to audio capture that deliberately changes attribution of the audio source or the interpretation of call authorization, while retaining both device and application audio input paths.
    - zh: ESET 对 Attor 的逆向分析显示录音插件只在会议应用进程中激活，即便录到应用外谈话也可让麦克风访问看起来来自预期使用麦克风的进程；作者明确将此作为可能的隐蔽理由。Unit 42 对 T9000 的分析显示恶意插件经 Skype 内置接口附着到已登录应用，在用户许可后录制通话，授权提示中的正常进程身份可能误导用户。二者分别说明进程归因与应用接口两条实施路径，但都借用了正常通信应用的身份语境。严格按稳定匿迹变量收敛时，只建议 Attor 的进程归因作为当前正式子项；T9000 接口路径作为父级实例和独立防守分析保留，不仅因接口不同而另建子项。来源没有提供告警率下降的实测数值。
      en: ESET's reverse engineering shows Attor's recorder activates only inside teleconferencing processes, so even conversations outside the app can appear as microphone access by a process expected to use a microphone; the authors explicitly identify stealth as a possible reason. Unit 42 shows T9000 attaching through Skype's built-in interface after the app is running and logged in, then recording calls following user approval; the normal process identity in the prompt may mislead the user. They show process-attribution and application-interface implementation paths, but both borrow the normal communication-app identity context. Under a strict stable-stealth-variable test, only the Attor process-attribution child is recommended for formalization now. Keep the T9000 interface path as a parent example and a distinct defense analytic rather than creating a child solely from a different interface. Neither source measures a reduction in alerts.
  scope_notes:
    zh: 直接对象为环境或通话音频的取得。T1056 负责键盘、图形界面等输入事件与文字内容，不能因声波由输入设备产生就吞并 T1123。T1113 与 T1125 分别负责屏幕图像和视频帧；同一次会议可并列标注音频与视频，但不得将视频帧作为音频证据。取得麦克风权限、注入进程或建立应用接口授权是前提及伴随行为；T1074 处理录音后暂存，T1560 处理压缩或加密归档，外传另属后续战术。合法会议录音、语音转写和客服质检是必需的正常反例。
    en: The direct object is acquisition of ambient or call audio. T1056 owns keyboard, GUI, and other input events or text; sound originating from an input device does not make it T1056. T1113 and T1125 own screen images and video frames respectively; one meeting can warrant both audio and video labels, but frames are not evidence of audio capture. Obtaining microphone permission, injecting a process, or obtaining an application-interface grant are prerequisites or accompanying acts. T1074 owns staging after recording, T1560 owns compression or encrypted archiving, and exfiltration belongs to a later tactic. Authorized meeting recording, transcription, and quality assurance are necessary benign comparators.
proposed_content:
  name:
    zh: 匿迹型音频捕获
    en: Stealth-Oriented Audio Capture
  summary:
    zh: 攻击者获取环境或通话音频，并让采集活动借用预期会使用音频的进程或通话应用接口，削弱单凭麦克风活动或授权提示识别恶意录音的能力。
    en: An adversary acquires ambient or call audio while placing capture in an audio-expected process or call-application interface, weakening identification from microphone activity or authorization prompts alone.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型音频捕获指攻击者在已控制端点或应用交互路径后，通过输入音频设备或通信应用接口取得环境谈话、语音会议或通话音频，并有意安排采集所处进程或应用会话，使行为与正常音频使用更难区分。判断对象是音频从设备或应用会话进入攻击者控制的记录链，而非插件名称、音频编码格式或最终上传路径。
      en: Stealth-Oriented Audio Capture occurs after an adversary controls an endpoint or application interaction path and obtains ambient conversation, voice-meeting, or call audio through an input device or communication-application interface. The adversary deliberately places capture in a process or application session where it is harder to distinguish from expected audio use. The object of assessment is the path by which audio enters an attacker-controlled recording chain, not a plugin name, encoding format, or eventual upload route.
    - zh: 录音能力、麦克风权限和实际取得内容应分层确认。植入程序包含录音模块只能证明潜在能力；设备会话、应用接口附着与音频产物共同出现，才足以提高已发生采集的结论强度。任何预期会使用麦克风的应用仍可能被恶意代码借用，因此“进程正常”或“用户点过允许”都不能单独证明录音得到业务授权。
      en: Recording capability, microphone permission, and actual acquisition must be assessed separately. An implant containing a recorder proves capability only. A device session or application-interface attachment combined with an audio artifact gives stronger grounds to conclude capture occurred. An app expected to use a microphone can still be borrowed by malicious code, so a normal-looking process or a user approval click alone does not establish business authorization for the recording.
  stealth_characteristics:
    paragraphs:
    - zh: 进程内麦克风录音使设备访问的进程归因落到电话会议软件，而不一定出现独立录音程序；防守方若只维护“会议软件可用麦克风”的许可名单，就可能忽略同一进程中新载入的恶意模块、异常开始时点与录音产物。麦克风会话和模块注入并未消失，关键变化是正常进程名降低了单一信号的区分力。
      en: In-process microphone recording attributes device access to teleconferencing software without necessarily launching a separate recorder. A defender that merely allows listed meeting apps to use microphones may miss a newly loaded malicious module, an unusual start time, or a recording artifact in the same process. The microphone session and module injection do not vanish; the normal process name reduces the discriminating value of one signal.
    - zh: 通话应用接口路径将采集与一次已登录、可能正在进行的通话关联起来，授权提示及本地暂存痕迹可能看似由合法应用发起。T9000 案例仍要求用户允许 Skype 接口访问，并留下附着、调用、临时音频和会后文件的线索；它既不证明自动绕过授权，也不证明完全复用现存麦克风设备会话。
      en: The call-application-interface path associates capture with a logged-in app and potentially an active call, while an authorization prompt and local temporary files may look tied to a legitimate application. In the T9000 case the user still had to allow Skype API access, and attachment, calls, temporary audio, and post-call files remained observable. The case proves neither automatic bypass of authorization nor complete reuse of an existing microphone-device session.
  scope_boundary_definition:
    paragraphs:
    - zh: 范围包括恶意进程借预期使用麦克风的应用身份采集环境声音，及经通信应用接口取得语音通话内容。录音前的进程注入、应用权限取得或会话登录可分别归入其自身技术；本父技术只在音频输入被实际接触或记录时成立。键击、剪贴板文本和表单输入归 T1056 等相邻项；屏幕和视频内容归 T1113、T1125，纵使来源于同一会议。
      en: Scope includes ambient sound captured under the identity of an application expected to use the microphone and voice-call content acquired through a communication-application interface. Prior process injection, application grants, or sign-in can receive their own technique labels; this parent applies when audio input is actually accessed or recorded. Keystrokes, clipboard text, and form input belong to T1056 or other neighbors; screen and video content belong to T1113 and T1125 even when they come from the same meeting.
    - zh: 录音产物被放入集中目录时可另标 T1074，被压缩或加密归档时可另标 T1560，随后网络送出不改变本技术的采集边界。合法会议录音、媒体制作、无障碍语音功能与客服质检会呈现相同麦克风访问；仅有设备唤醒、进程名称、WAV 文件或用户点击允许都不足以作恶意结论，应结合应用完整性、会议或工作任务、录音目的地及产物授权判定。
      en: A recording placed in a central directory may also be T1074, and a compressed or encrypted package may also be T1560; later network delivery does not change this capture boundary. Authorized meeting recording, media production, accessibility speech features, and contact-center quality assurance can show the same microphone access. Device activation, process name, a WAV file, or an approval click alone is insufficient; app integrity, the meeting or work task, recording destination, and authorization for the artifact must be joined.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在受害者经常使用会议软件的工作站上，植入程序可以进入这些进程再访问麦克风；ESET 观察到 Attor 的录音插件只在硬编码的电话会议进程中启用，并将音频加密存入 Upload 目录。另一场景是恶意插件附着已登录的通话应用接口；Unit 42 的 T9000 案例中用户须批准 Skype 接口请求，随后插件录制通话并在会后处理暂存音频。两例的防守关注点分别是进程完整性与第三方应用接口授权。
        en: On a workstation where the victim regularly uses meeting software, an implant can enter those processes and access the microphone. ESET observed Attor's recorder activating only in a hard-coded list of teleconferencing processes and storing encrypted audio in an Upload directory. In another scenario a malicious plugin attaches to a logged-in call application's interface. In Unit 42's T9000 case the user had to approve Skype API access, after which the plugin recorded calls and processed temporary audio after the call. Process integrity matters in the first case and third-party application-interface authorization in the second.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少需要执行可访问音频输入的代码，或能让通话应用接受第三方接口连接。进程归因路径还要求将模块注入或装入会议应用，并识别该应用的进程名；应用接口路径要求目标应用运行、登录、接口可用以及可能的用户批准。攻击者可以选择宿主进程、模块、录音时机和文件位置，但不能假定能压制操作系统的麦克风指示器、应用授权弹窗或终端文件审计。
          en: The attacker needs code able to access audio input or a way to have a call application accept a third-party interface connection. The process-attribution path further requires injecting or loading a module into a meeting app and recognizing its process identity. The application-interface path requires the target app to be running, signed in, and exposing the interface, and may require user approval. The attacker can choose host process, module, timing, and file location, but cannot assume suppression of OS microphone indicators, app prompts, or endpoint file audit.
      defender_model:
        paragraphs:
        - zh: 防守方可能看到进程与模块加载、跨进程访问、麦克风活跃会话、应用授权事件、会议开始结束时间、文件写入和网络外联，但这些数据未必都集中可查询。Windows 的用户界面可显示麦克风使用历史，macOS 可显示麦克风指示与应用权限；这些不等于自动提供企业级逐事件导出。只有在传感器验证确实能提供进程和时间键后，才可把音频设备会话、应用状态和产物关联为分析逻辑。
          en: A defender may observe process and module loads, cross-process access, active microphone sessions, app-grant events, meeting start and end times, file writes, and network egress, but these data may not all be centrally queryable. Windows can display microphone-use history to the user, and macOS can show microphone indicators and app grants; neither guarantees enterprise-grade event export. An analytic may join audio-device sessions, app state, and artifacts only after a sensor pilot verifies process and time keys are actually available.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用预期录音的应用身份或通话接口掩盖恶意音频采集
      en: Borrow an audio-expected app identity or call interface to disguise malicious capture
    analysis:
      paragraphs:
      - zh: 攻击者将录音模块放进本来就可能使用麦克风的电话会议进程，或使通话应用接口成为录音入口。设备访问和授权提示于是携带正常应用身份，单靠进程名或会话存在无法区分恶意录音。防守仍可寻找非预期模块、第三方接口授权、异常录音时段和未经批准的音频产物；ESET 与 Unit 42 直接支持实现与混淆可能性，不支持量化成功率。
        en: An adversary places a recorder in a teleconferencing process that is normally expected to use a microphone or makes a call-app interface the recording entry point. Device access and prompts then carry a legitimate app context, so process name or call existence alone cannot distinguish malicious capture. Defenders can still seek unexpected modules, third-party interface grants, unusual recording intervals, and unapproved audio artifacts. ESET and Unit 42 directly support the implementations and potential confusion, not a quantified success rate.
    evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_T9000]
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 当前只建议一个原生子项，变量是把恶意麦克风会话归因给本来承担音频职责的会议进程，判定依赖模块、设备会话和进程身份。通话接口依附采集确有一手实例且需要不同防守分析，但现有证据没有证明它与进程归因借用构成独立的匿迹效果，故留在父级实例，不因设备接口与应用接口的实现差异单独分类。短时启停和内存缓冲缺少足够的企业端点证据而暂缓。
        en: Only one Niji child is recommended now. Its variable is attribution of a malicious microphone session to a meeting process with a normal audio role, tested through module, device-session, and process identity. Call-interface-attached capture has a primary case and needs a different defense analytic, but current evidence does not establish a separate stealth effect beyond borrowed app identity; keep it as a parent example rather than partitioning by device versus application interface. Short bursts and memory buffering remain deferred for lack of sufficient enterprise-endpoint evidence.
    proposed_child_keys: [T1123_CHILD_PROCESS]
proposed_subtechniques:
- temporary_key: T1123_CHILD_PROCESS
  formalization_recommendation: supported
  name:
    zh: 会议进程归因借用录音
    en: Teleconference-Process-Attributed Recording
  summary:
    zh: 攻击者只在预期使用麦克风的会议进程内激活录音，使设备访问呈现正常应用身份，即使录制的是应用外谈话。
    en: An adversary activates recording only within a meeting process expected to use the microphone, giving device access a normal app identity even when outside-app conversation is captured.
  definition_and_concept:
    paragraphs:
    - zh: 本子项以录音代码所在的进程身份为可控变量：恶意模块先进入电话会议应用进程，再从输入设备获取音频。它不要求正在发生通话，也不声称会议应用自行批准录音。与父级的普通独立录音相比，其直接变化是麦克风访问和文件写入可以落在一个本来就有音频职责的进程谱系中。
      en: This child uses the recorder's process identity as the controlled variable. A malicious module first enters a teleconferencing app process and then obtains audio from an input device. It does not require an active call or claim that the meeting app authorized recording. Relative to a separate recorder, microphone access and file writes can appear under a process lineage that already has an audio role.
  stealth_characteristics:
    paragraphs:
    - zh: 会议进程归因借用录音使“应用获准使用麦克风”这个单点信号失去区分力。ESET 在 Attor 中发现录音插件依据进程名只在会议应用内激活，既可能录制在线通话，也能记录应用外环境谈话；作者将这种安排解释为可能避免用户怀疑。模块注入、麦克风活跃时段和加密录音文件仍是残余线索，不能据此宣称设备访问完全不可见。
      en: Teleconference-Process-Attributed Recording makes the single signal of an app being allowed to use a microphone less discriminating. ESET found Attor's recorder activated by process name only inside meeting apps; it could record online calls or ambient conversation outside the app, and the authors saw reduced user suspicion as a possible reason. Module injection, microphone-active intervals, and encrypted recording files remain traces, so device access is not invisible.
  scope_boundary_definition:
    paragraphs:
    - zh: 只有实际在音频职责进程中执行采集才属于本子项；仅将恶意文件命名为会议软件、只注入而未录音或仅有会议进程自身的合法录制均不足。若通过应用接口取得通话媒体而非借宿主进程设备访问，应留在父级，待独立匿迹变量得到证明后再考虑子项。进程注入本身、音频文件暂存和加密后上传可分别并列归其他技术，不能替代采集证据。
      en: This child applies only when capture actually executes in an audio-role process. Naming malware after meeting software, injecting without recording, or a legitimate recording by the meeting app is insufficient. When call media are obtained through the app's interface rather than device access under its process identity, keep them at the parent pending evidence of an independent stealth variable. Process injection itself, audio staging, and encrypted upload may receive separate labels but cannot replace proof of capture.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: ESET 对 Attor 的插件分析给出明确实例：录音插件位于包含 Skype 等应用的硬编码进程名单中才激活，使用可用麦克风并把录音加密写入集中 Upload 目录。该场景适用于会议客户端常驻、用户习惯看到其占用麦克风的终端；若会议应用从未启动，预期进程身份就不存在，攻击路径也不能按此子项成立。
        en: ESET's Attor plugin analysis provides a concrete example. The recorder activates only in a hard-coded process list including Skype, uses an available microphone, and writes encrypted recordings to a central Upload directory. The scenario fits an endpoint where a meeting client runs and users expect it to use the microphone. If that app never runs, the expected process identity is absent and this child does not describe the path.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需已能将录音代码加载进会议软件进程，并控制何时启用设备访问；进程注入可遭受应用保护、模块完整性检测或权限边界阻拦。攻击者并不控制所有音频会话审计，也无法确保用户不会看到麦克风指示或录音产物。
          en: The attacker needs to load recording code into a meeting-app process and control when it accesses the device. App protection, module-integrity checks, and privilege boundaries may block injection. The attacker does not control all audio-session audit and cannot guarantee users miss microphone indicators or recorded artifacts.
      defender_model:
        paragraphs:
        - zh: 防守方如果只对未知进程访问麦克风告警，容易把该进程列为正常；若保留模块加载、跨进程访问、进程签名与麦克风会话同一进程键，可检验音频职责是否由非预期代码触发。正常会议插件、虚拟音频设备、无障碍组件和录制软件也会装入模块，必须结合代码来源、授权清单与实际会议时段。
          en: A defender alerting only on unknown microphone-using processes may allowlist this process. With module loads, cross-process access, process signature, and microphone sessions joined by process identity, the defender can test whether unexpected code caused audio use. Legitimate meeting plugins, virtual audio devices, accessibility components, and recording tools also load modules, so code provenance, approved inventories, and actual meeting times matter.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 让恶意麦克风会话继承会议应用的正常进程外观
      en: Give a malicious microphone session the normal process appearance of a meeting app
    analysis:
      paragraphs:
      - zh: 恶意模块在会议应用内启动设备录音，传感器看到的是预期使用麦克风的进程，按进程名筛选的规则因此丢失区分力。残留的模块加载、注入边、非会议时段采集和音频文件仍可重建行为。ESET 直接观察到这一执行条件及产物，并将降低用户怀疑表述为可能目的，因此匿迹效果保持中等置信度。
        en: A malicious module starts device recording inside a meeting app, causing a sensor to see a process expected to use a microphone and reducing the value of a process-name rule. Module loads, injection edges, capture outside meeting time, and audio files can still reconstruct the action. ESET directly observed the activation condition and artifacts but described reduced suspicion as a possible motive, so the stealth effect remains medium confidence.
    evidence_keys: [T1123_REF_ESET_PDF]
    confidence: medium
  evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_MITRE_DET]
  defense_strategy_keys: [T1123_DET_PROCESS]
  mitigation_keys: [T1123_MIT_PROCESS]
  limitations:
    paragraphs:
    - zh: Attor 白皮书是单一样本族的逆向结果，能够证明进程条件、录音和可能的匿迹意图，不能推断所有会议进程内录音都恶意，也没有量化对端点告警的影响。需要现场传感器证明音频会话能与进程及模块对应；只有进程创建日志时，该子项的核心因果边无法直接检验。
      en: The Attor white paper is reverse engineering of one malware family. It establishes process gating, recording, and a possible stealth rationale, not that every recording inside a meeting app is malicious or that endpoint alerts fell by a measured amount. A local sensor must prove audio sessions can be joined to process and module identity; process-creation logs alone cannot test the core causal edge.
- temporary_key: T1123_CHILD_CALL_API
  formalization_recommendation: defer_as_parent_example
  formalization_note:
    zh: 本草案保留结论级 T9000 行为与独立防守方案，供主 Agent 收敛；应用接口与进程内设备接口的差别尚不足以证明独立匿迹变量，不建议据此新增正式 NJS。
    en: This draft preserves conclusion-level T9000 behavior and a distinct defense approach for primary-agent convergence. The difference between app and in-process device interfaces does not yet prove an independent stealth variable, so no separate formal NJS is recommended.
  name:
    zh: 通话接口依附音频采集
    en: Call-Interface-Attached Audio Capture
  summary:
    zh: 攻击者通过已登录通信应用的接口附着通话媒体，使恶意录音与合法通话和应用授权语境共同出现。
    en: An adversary attaches to a signed-in communication app's interface for call media, placing malicious recording in the context of a legitimate call and app grant.
  definition_and_concept:
    paragraphs:
    - zh: 本子项以应用会话接口而非录音进程身份为变量：攻击者让恶意组件附着正在运行并已登录的通话应用，通过该应用暴露的接口取得语音通话内容。附着可能触发独立授权；是否允许由用户或平台决定。它不等于窃取登录态，也不意味着攻击者直接接管麦克风驱动或复用原有设备会话。
      en: This child uses the application-session interface, rather than recorder process identity, as the variable. A malicious component attaches to a running, signed-in call app and obtains voice-call content through an interface exposed by that app. Attachment may trigger a separate grant decided by the user or platform. It is not theft of the login state and does not imply control of the microphone driver or reuse of an existing device session.
  stealth_characteristics:
    paragraphs:
    - zh: 通话接口依附音频采集将录音时点和内容限制在通信应用可见的通话语境，授权提示可能展示正常应用身份而使用户误判第三方接入。Unit 42 对 T9000 的观察明确显示需先运行并登录 Skype、用户许可接口访问，之后才录制通话；因此“无新授权提示”不是本子项的性质。接口授权、会话事件、临时音频文件和会后处理仍可被关联。
      en: Call-Interface-Attached Audio Capture places timing and content in a call context visible to the communication app. A grant prompt may display a legitimate process identity and cause a user to misjudge third-party access. Unit 42 observed that T9000 required Skype to be running and logged in and the user to approve API access before calls were recorded. Absence of a new prompt is therefore not a property of this child. Interface grants, call events, temporary audio files, and post-call processing remain correlatable.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入经通话应用接口取得语音媒体，排除仅因应用活跃而另开麦克风录音的情形，后者归 T1123_CHILD_PROCESS 或父级。取得会话凭据、欺骗用户批准接口、植入插件、录制视频帧和截获聊天文字可各有相邻分类；本子项仅以音频流被取得为完成条件。正常录音机器人、会议纪要插件和残障辅助工具是关键反例。
      en: Scope includes voice media obtained through a call-app interface. A separate microphone recorder activated while the app happens to be active belongs to T1123_CHILD_PROCESS or the parent. Acquiring session credentials, inducing a grant, installing a plugin, capturing video frames, and intercepting chat text may receive separate neighboring labels. This child is complete only when audio is acquired. Authorized recording bots, meeting-notes plugins, and accessibility tools are key benign comparators.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Unit 42 报告的 T9000 插件调用 SkypeControlAPIDiscover 与 SkypeControlAPIAttach；仅在 Skype 运行且用户登录后才收集，并在用户允许后录制音频和视频通话，把临时音频保存在应用数据目录。该案例说明通话应用接口可成为采集入口，不能直接外推到已停用的 Skype API 以外产品；现代应用需逐个验证其开放接口和日志。
        en: Unit 42 reported T9000 calling SkypeControlAPIDiscover and SkypeControlAPIAttach. Collection occurred only when Skype was running and the user was logged in; after approval, it recorded audio and video calls and stored temporary audio in an application-data directory. The case establishes that a call-app interface can be a capture entry point, not that the retired Skype API's behavior applies to other products. Each current app's interface and logs must be validated separately.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要可运行的附着组件、目标通信应用及其登录会话，并可能需要说服用户批准接口请求。其可控制何时请求附着及如何保存所得媒体，但应用若关闭接口、提示明确标示第三方主体或阻止非批准集成，路径会受限。
          en: The attacker needs a runnable attachment component, the target communication app and its signed-in session, and may need to persuade the user to approve an interface request. The attacker can time attachment and choose how to store media, but the path is constrained if the app closes the interface, clearly identifies the third-party requester, or blocks unapproved integrations.
      defender_model:
        paragraphs:
        - zh: 防守方需要应用接口授权或附着日志、通话会话时间、组件身份及录音文件事件，才能把正常会议与第三方偷录区分开。若现代客户端不导出接口审计，只能用文件、模块和终端行为作较弱推断；单凭会议举行、用户点过允许或产生 WAV 文件均不足以确定恶意采集。
          en: Defenders need app-interface grant or attachment logs, call-session times, component identity, and recording-file events to distinguish a normal meeting from third-party capture. If a modern client does not export interface audit, files, modules, and endpoint behavior allow only weaker inference. A meeting, an approval click, or a WAV file alone does not establish malicious capture.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借正常通话应用接口使恶意录音带有合法会话外观
      en: Use a normal call-app interface to give malicious recording a legitimate session appearance
    analysis:
      paragraphs:
      - zh: 恶意组件经通话应用接口附着，录音出现在一个确有通信需求的会话附近；授权提示中显示的正常进程可能掩盖第三方实际请求者。由此，单凭通话存在或应用身份不足以分辨录音，需把请求组件、许可事件与音频产物关联。Unit 42 明确报告该误导可能性，但没有量化成功率或证明所有当前会议产品具有相同接口。
        en: A malicious component attaches through a call-app interface, so recording occurs near a real communication need; a normal process shown in the grant prompt may obscure the third-party requester. Call existence or app identity alone is then insufficient, and the requesting component, grant, and audio artifact need correlation. Unit 42 explicitly describes the potential confusion but gives no success rate or proof that current meeting products expose the same interface.
    evidence_keys: [T1123_REF_T9000]
    confidence: medium
  evidence_keys: [T1123_REF_T9000, T1123_REF_ATTACK]
  defense_strategy_keys: [T1123_DET_CALL_API]
  mitigation_keys: [T1123_MIT_CALL_API]
  limitations:
    paragraphs:
    - zh: T9000 研究针对旧版 Skype 接口，能证明该路径在该产品和时期存在，不能支持当前 Teams、Zoom 或其他客户端同样可被附着。原研究记载用户许可要求，因此不能把接口路径写成无感绕过权限；若应用接口或日志不可用，检测建议必须降级为端点产物调查而非强结论自动分析。
      en: T9000 research concerns an older Skype API. It proves the path existed in that product and period, not that current Teams, Zoom, or other clients can be attached in the same way. The report records a user-approval requirement, so this path cannot be described as silently bypassing permission. Where app interfaces or logs are unavailable, detection must fall back to endpoint artifact investigation rather than a strong automated conclusion.
defense_candidates:
  detection_strategies:
  - temporary_key: T1123_DET_PROCESS
    name:
      zh: 会议进程麦克风使用与模块谱系关联
      en: Correlate Meeting-Process Microphone Use With Module Lineage
    objective:
      zh: 在预期使用麦克风的会议进程中，识别非批准模块或注入行为所触发的录音，而不是按进程名直接放行。
      en: Identify recording triggered by an unapproved module or injection inside a meeting process normally expected to use the microphone, rather than allowing the process name alone.
    detects_keys: [T1123_PARENT, T1123_CHILD_PROCESS]
    domains: [enterprise]
    analytic_keys: [T1123_NJA_PROCESS]
    evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_MITRE_DET, T1123_REF_MS_PRIVACY]
  - temporary_key: T1123_DET_CALL_API
    name:
      zh: 通话应用第三方接口授权与音频产物关联
      en: Correlate Third-Party Call-App Grants With Audio Artifacts
    objective:
      zh: 将通话应用接口附着和授权主体与实际通话及后续音频文件相连，识别未经业务批准的第三方录制。
      en: Join call-app interface attachment and granting principal to actual calls and later audio files to identify third-party recording without business approval.
    detects_keys: [T1123_PARENT]
    domains: [enterprise]
    analytic_keys: [T1123_NJA_CALL_API]
    evidence_keys: [T1123_REF_T9000]
  detection_analytics:
  - temporary_key: T1123_NJA_PROCESS
    strategy_key: T1123_DET_PROCESS
    name:
      zh: 非预期模块伴随会议进程麦克风会话
      en: Unexpected Module During Meeting-Process Microphone Session
    platforms: [Windows]
    logic:
      zh: 在试点中先确认 EDR 能导出音频输入会话的 process_id、session_start 和 session_end。按 endpoint_id 与 process_id 连接会议进程的模块加载及跨进程访问记录，比较模块签名、哈希和加载路径与受批准版本；在可见的新非批准模块或异常注入之后十五分钟内出现麦克风会话，且同一进程或其控制的文件写入方生成非批准录音产物时提高风险。若无文件写入但录音会话与模块边成立，报告为可疑设备访问而非已证实录音。会议时段与用户授权是排除条件的证据，不是按进程名的一键白名单。
      en: First validate in a pilot that the EDR exports process_id, session_start, and session_end for audio-input sessions. Join module loads and cross-process access for meeting processes on endpoint_id and process_id, then compare module signer, hash, and load path with approved versions. Raise risk when a newly observed unapproved module or injection precedes a microphone session within fifteen minutes and the process or its controlled writer creates an unapproved audio artifact. Without a file artifact, report suspicious device access rather than proven recording. Meeting times and user approval are contextual evidence, not a blanket process-name allowlist.
    data_requirements:
    - source_type: endpoint_audio_session
      channel: validated EDR audio-device session telemetry; not guaranteed by native Windows process logs
      required_fields: [endpoint_id, process_id, session_start, session_end, device_kind]
    - source_type: module_and_process_lineage
      channel: EDR module load and cross-process access; Sysmon Event ID 7 and 10 only where explicitly configured
      required_fields: [endpoint_id, process_id, event_time, module_path, module_hash, module_signer, source_process_id]
    - source_type: file_creation
      channel: EDR file telemetry or Sysmon Event ID 11
      required_fields: [endpoint_id, process_id, event_time, file_path, file_size]
    observables: [meeting_process_audio_session, first_seen_unapproved_module, cross_process_access, audio_artifact_write]
    correlation:
      window: 15m before audio activation through 30m after session end
      dimensions: [endpoint_id, process_id, user_id, module_hash, audio_session_id]
    false_positives:
      zh: 经批准的会议插件、语音增强、虚拟音频驱动、辅助功能、客服质检和会议录制可能同时产生模块及录音文件；经批准更新会改变哈希。
      en: Approved meeting plugins, voice enhancement, virtual audio drivers, accessibility tools, contact-center quality assurance, and authorized recording can create modules and audio files; approved updates change hashes.
    blind_spots:
      zh: 标准进程创建日志不提供音频会话；未启用模块审计、内存中映射代码、跨进程 PID 重用或无文件输出会降低结论。Sysmon Event ID 10 只代表配置范围内的进程访问，不能直接当作麦克风 API 调用。
      en: Standard process-creation logs do not provide audio sessions. Absent module auditing, memory-only mapped code, PID reuse, or no file output weakens conclusions. Sysmon Event ID 10 records configured process access and must not be treated as microphone API execution.
    tuning_guidance:
      zh: 先按企业批准的插件签名、安装来源、会议录制角色和更新时间建立版本化基线；豁免绑定模块身份与具体工作流程，而非豁免整个会议进程。试点需验证设备事件时间戳与 PID 的准确性，并针对常规会议和非会议时段分别评估误报。
      en: Baseline approved plugin signers, install sources, recording roles, and update times with versioning. Bind exceptions to module identity and a specific workflow, never to the entire meeting process. The pilot must validate device-event timestamps and PID fidelity and evaluate false positives separately during and outside scheduled meetings.
    evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_MITRE_DET, T1123_REF_MS_PRIVACY]
  - temporary_key: T1123_NJA_CALL_API
    strategy_key: T1123_DET_CALL_API
    name:
      zh: 通话接口附着后的非批准录音产物
      en: Unapproved Audio Artifact After Call-Interface Attachment
    platforms: [Windows]
    logic:
      zh: 对确实提供接口授权或插件附着审计的通话应用，记录 requester_id、app_session_id、grant_actor 和 event_time，关联同一用户与设备的通话开始结束事件；若未经批准的请求组件在通话期间或临近时取得接口访问，且在会话中或结束后三十分钟内出现相应音频文件或导出任务，则生成候选。若只有接口授权而无音频结果，标注为暴露或企图。旧 Skype API 名称仅作为 T9000 案例证据，不作为现代产品的通用检测字段。
      en: For a call app that actually exports interface-grant or plugin-attachment audit, record requester_id, app_session_id, grant_actor, and event_time and join call start and end events for the same user and endpoint. Generate a candidate when an unapproved requester gains interface access during or near a call and a corresponding audio file or export task appears during the call or within thirty minutes afterward. A grant without audio outcome is exposure or attempt. Old Skype API names are evidence for T9000, not universal detection fields for current products.
    data_requirements:
    - source_type: call_app_interface_audit
      channel: product-specific admin or client audit validated before deployment
      required_fields: [user_id, endpoint_id, requester_id, app_session_id, event_time, grant_actor, action]
    - source_type: call_app_session
      channel: product-specific call or meeting session events
      required_fields: [user_id, endpoint_id, app_session_id, call_start, call_end]
    - source_type: endpoint_file_creation
      channel: EDR file telemetry or Sysmon Event ID 11
      required_fields: [endpoint_id, process_id, event_time, file_path, file_size]
    observables: [third_party_interface_grant, call_session, audio_artifact_or_export]
    correlation:
      window: 15m before call start through 30m after call end
      dimensions: [user_id, endpoint_id, app_session_id, requester_id]
    false_positives:
      zh: 经审批的会议录制机器人、转写集成、培训录制和无障碍工具也可获得接口授权并保存音频；会议主办人临时批准新集成会改变基线。
      en: Approved recording bots, transcription integrations, training recordings, and accessibility tools can receive grants and save audio; a host's temporary approval of a new integration can change the baseline.
    blind_spots:
      zh: 不提供接口审计的应用无法执行该关联；从通信应用进程内部直接录音或通过设备回路录音也可能不产生第三方接口事件。文件后缀不能单独证明音频内容，端到端加密或云端处理可能无本地文件。
      en: Apps without interface audit cannot support this join. In-process recording or device loopback may produce no third-party interface event. An extension alone does not prove audio content, and end-to-end encryption or cloud processing may leave no local file.
    tuning_guidance:
      zh: 只对已验证日志字段与已登记的产品版本启用；维护按请求组件、租户、会议类型和审批单限定的许可表，定期复核长期授权。保留首次见到的请求者和会后产物线索，即使它属于常见会议软件生态。
      en: Enable only for app versions with verified log fields. Maintain grants bounded by requester, tenant, meeting type, and approval ticket; periodically revalidate durable grants. Preserve first-seen requesters and post-call artifacts even within a common meeting-software ecosystem.
    evidence_keys: [T1123_REF_T9000]
  mitigations:
  - temporary_key: T1123_MIT_PROCESS
    name:
      zh: 会议进程完整性与麦克风使用治理
      en: Meeting-Process Integrity and Microphone-Use Governance
    description:
      zh: 限定哪些应用及模块可占用音频设备，并通过受管部署、模块完整性与麦克风使用记录降低恶意代码寄居会议进程的机会。Windows 应用隐私策略对受支持的应用类型生效，不能宣称对所有传统桌面程序逐项强制拒绝。
      en: Limit which apps and modules can use audio input and reduce the chance of malicious code living inside a meeting process through managed deployment, module integrity, and microphone-use review. Windows app privacy policy applies to supported app types and must not be claimed as per-app enforcement for every classic desktop program.
    measures:
    - key: approved_audio_processes
      control_type: preventive
      zh: 受管部署会议客户端与扩展，阻止未批准模块注入或加载，并在支持的平台上按应用执行麦克风权限策略。
      en: Deploy meeting clients and extensions through managed channels, block unapproved module injection or loading, and enforce per-app microphone policies where supported.
    - key: audio_activity_review
      control_type: detective-support
      zh: 保留可用的麦克风使用记录，结合进程、模块、会议时段和录音目的地复核，不把正常客户端名称视为全面豁免。
      en: Retain available microphone-use records and review them against process, module, meeting time, and recording destination without exempting an entire normal client name.
    applications:
    - target_key: T1123_PARENT
      use:
        zh: 对处理敏感语音的工作站建立最小必要麦克风使用名单和受管录音流程；设备被启用时复核实际应用与业务目的。
        en: On workstations handling sensitive speech, maintain a least-necessary microphone-use inventory and managed recording workflow; review the actual app and business purpose when audio input activates.
      expected_effect:
        zh: 降低未授权录音入口并提高后续音频活动的可解释性。
        en: Reduce unauthorized recording entry points and improve interpretability of later audio activity.
      limitations:
        zh: 系统级麦克风禁止会影响合法会议；权限允许不能证明每次录音都获批准，传统桌面应用的控制能力随平台版本和策略范围而异。
        en: Disabling microphones at the system level disrupts legitimate meetings. A permission grant does not authorize every recording, and controls for classic desktop apps vary by platform version and policy scope.
    - target_key: T1123_CHILD_PROCESS
      use:
        zh: 对会议客户端实行模块签名与扩展目录约束，对新出现的模块、注入和非会议时段麦克风活动触发复核。
        en: Constrain meeting-client modules by signer and extension directory; review newly observed modules, injection, and microphone use outside meeting periods.
      expected_effect:
        zh: 提高恶意录音模块进入正常会议进程的成本，并保留可供归因的模块谱系。
        en: Raise the cost of placing a recorder in a normal meeting process and retain module lineage for attribution.
      limitations:
        zh: 经批准的插件仍可能被攻陷，内存映射代码可能避开普通模块日志；不能仅靠代码签名判断录音目的。
        en: Approved plugins can be compromised and memory-mapped code may evade ordinary module logs; code signing alone cannot establish recording purpose.
    evidence_keys: [T1123_REF_ESET_PDF, T1123_REF_MS_CSP, T1123_REF_APPLE_MIC]
  - temporary_key: T1123_MIT_CALL_API
    name:
      zh: 通话应用第三方接口授权治理
      en: Governance of Third-Party Call-App Interface Grants
    description:
      zh: 将可接触通话媒体的第三方接口或插件视为敏感授权，限制其安装、授予、持久化和输出路径，并定期与真实会议录制需求核对。
      en: Treat third-party interfaces or plugins able to access call media as sensitive grants. Bound their installation, approval, persistence, and output path, and regularly compare them with real meeting-recording needs.
    measures:
    - key: approved_call_integrations
      control_type: preventive
      zh: 禁止或审批未经管理的通话媒体接口集成，要求明确显示请求组件身份、权限范围、有效期及负责业务人。
      en: Block or approve unmanaged call-media integrations and display requester identity, permission scope, expiry, and business owner clearly.
    - key: grant_and_artifact_review
      control_type: detective-support
      zh: 审核首次及长期第三方授权，将授权、通话时段、录音产物和批准记录相连。
      en: Review first-time and durable third-party grants and join grants, call intervals, recording artifacts, and approvals.
    applications:
    - target_key: T1123_PARENT
      use:
        zh: 对受管通话软件建立可取得音频的接口清单，默认只允许经审查的录音、转写或辅助功能集成。
        en: Inventory audio-capable interfaces in managed call software and allow only reviewed recording, transcription, or accessibility integrations by default.
      expected_effect:
        zh: 减少把正常通话语境作为偷录入口的机会，并使异常授权可被追溯。
        en: Reduce opportunities to turn normal calls into recording entry points and make anomalous grants traceable.
      limitations:
        zh: 应用若不提供接口治理或审计，只能依赖终端应用控制；此措施不阻止独立麦克风录音。
        en: If the app lacks interface governance or audit, only endpoint application control remains; this measure does not stop separate microphone recording.
    - target_key: T1123_CHILD_CALL_API
      formalization_recommendation: defer_as_parent_example
      use:
        zh: 对有媒体接口的应用要求按请求组件与租户审批录音权限，禁止无业务所有人的长期授权，并复核会后出现的音频文件。
        en: For apps with media interfaces, approve recording rights by requester and tenant, prohibit ownerless durable grants, and review post-call audio files.
      expected_effect:
        zh: 阻断或缩短第三方组件的通话媒体访问，并留下可关联到录音结果的授权记录。
        en: Block or shorten third-party access to call media and retain grants that can be joined to recording outcomes.
      limitations:
