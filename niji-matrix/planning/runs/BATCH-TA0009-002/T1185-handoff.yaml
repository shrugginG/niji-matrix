handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-002
work_item_ref: WORK-TA0009-T1185
temporary_key_prefix: T1185_
candidate:
  source_type: attack
  source_attack_id: T1185
  source_attack_version: '19.1'
  name:
    zh: 浏览器会话劫持
    en: Browser Session Hijacking
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿的 T1185 行将浏览器会话劫持列为 Collection，涵盖在浏览器内改变内容、拦截信息以及借用已经认证的浏览器上下文。Niji 应保留这一父行为，但把本战术的直接对象限定为活动浏览器会话中的业务页面、请求或响应内容及其可读机会。单纯取得
        Cookie、执行注入、盗取表单按键，或让用户首次进入钓鱼站点，均不足以宣称已发生本技术的内容收集。
      en: The fixed ATT&CK Enterprise 19.1 T1185 row maps browser session hijacking to Collection and covers changing content,
        intercepting information, and borrowing an authenticated browser context. Niji should keep that parent behavior while
        narrowing this tactic's direct object to readable business pages, requests, or responses in an active browser session.
        A cookie result, an injection event, captured form keystrokes alone, or the user's first entry to a phishing site
        does not establish collection through this technique.
    - zh: 样本研究直接展示浏览器网络 API hook、按目标页面注入脚本与扩展读取页面源码或请求内容；浏览器 pivot 的工具作者文档证明可在目标浏览器上下文内代理独立请求，但属于能力说明而非某次真实入侵中已获取内容的观察。准入因此为
        adapt 且中等置信；正式案例只能在有具体会话内容或应用端访问证据时落到相应子项，不能把工具功能清单写成现场成效。
      en: Sample research directly shows browser network API hooks, target-page script injection, and an extension reading
        page source or request content. The browser pivot author's documentation demonstrates that independent requests can
        be proxied through a victim browser context, but describes capability rather than observed content acquisition in
        a particular intrusion. Admission is therefore adapt with medium confidence. A formal case should map to a child only
        when session content or application access is evidenced, not merely because a tool lists the capability.
  scope_notes:
    zh: 仅纳入攻击者控制正在使用或可复用的浏览器执行上下文，且有会话内容读取或可验证读取机会的行为。T1557 处理通信路径中间介入，T1539 处理会话 Cookie 取得，T1055 处理跨进程注入实现，T1114 处理邮件正文取得，TA0001
      处理首次钓鱼入口；同一链可多重标注，但每一对象需独立证据。
    en: Include adversary control over an active or reusable browser execution context only when session content is read or
      a verifiable opportunity to read it exists. T1557 owns communication-path interposition, T1539 cookie acquisition, T1055
      cross-process injection implementation, T1114 email body acquisition, and TA0001 the first phishing entry. One chain
      may receive multiple labels only with separate evidence for each object.
  original_attack_subtechniques_imported: false
proposed_content:
  temporary_key: T1185_PARENT
  name:
    zh: 活动浏览器会话中介
    en: Active Browser Session Interposition
  summary:
    zh: 攻击者借用或改变目标浏览器的活动会话，使页面与请求内容在原有认证上下文中可被读取，而常规服务日志仍可能呈现为该用户的浏览器活动。
    en: An adversary borrows or alters an active victim browser session to read pages and requests in its existing authentication
      context, while service logs may still resemble that user's browser activity.
  definition_and_concept:
    paragraphs:
    - zh: 活动浏览器会话中介是攻击者在已建立的浏览器上下文内设置可观察、改写或转发会话交互的控制点，以取得浏览器能够访问的页面、请求或响应内容。控制点可位于浏览器进程内、具有页面权限的扩展或经浏览器上下文完成请求的代理；浏览器、插件和注入手段只是实现条件。Collection
        的直接结果是对内容的访问，既有认证状态使内容可读但不等同于再次获得账户凭据。
      en: Active Browser Session Interposition places an adversary-controlled observation, modification, or forwarding point
        inside an established browser context to obtain pages, requests, or responses accessible to that browser. The control
        point can reside in a browser process, a page-permitted extension, or a proxy that fulfills requests through the browser
        context; browser products, plug-ins, and injection methods are implementation conditions. The Collection result is
        access to content. Existing authentication state makes that content readable but is not itself newly acquired account
        credentials.
    - zh: 这一概念要求把会话状态与内容取得连成因果链。进程句柄、扩展权限、调试附着或代理监听只能证明控制能力；还需页面读取、请求正文、响应访问或可信服务端记录，才可认定内容路径确实被使用。攻击者也可在用户浏览的页面上插入条件式内容或借同一浏览器为远端操作员发出请求，这两者对用户界面和服务端请求序列留下不同的痕迹。
      en: This concept requires a causal link between session state and content acquisition. A process handle, extension permission,
        debugger attachment, or proxy listener shows control capability; a page read, request body, response access, or corroborating
        application record is needed to establish use of the content path. An adversary may interpose on pages the user is
        viewing or drive separate requests through the same browser for a remote operator, leaving different UI and server-side
        request traces.
  stealth_characteristics:
    paragraphs:
    - zh: 中介运行在用户本来访问网站的浏览器环境中，服务端的登录状态、客户端证书与常用设备属性可以延续，使仅按新设备登录或显著来源变化建模的检测较难区分。若攻击者只在目标页面或业务动作出现时启用，恶意请求的时间与正常会话重叠。代理式借用则可能完全不改变用户当前页面，但在同一会话身份下产生额外的资源访问。
      en: Interposition runs in the browser environment that already visits the service, so login state, client certificates,
        and familiar device attributes can persist and frustrate detection based only on a new sign-in or large source shift.
        A trigger tied to a target page or business action overlaps malicious activity with normal session time. Proxy-style
        borrowing may leave the user's current page untouched while producing additional resource accesses under the same
        session identity.
    - zh: 匿迹并非无痕。浏览器扩展版本、权限或来源的变化，外部进程访问浏览器、远程线程与模块载入，调试连接，浏览器到陌生控制端的连接，以及服务端与用户可见页面不一致的请求序列，均可形成交叉证据。浏览器隔离、权限约束、内容安全策略和企业扩展策略可能使中介失效；若缺少端点浏览器和服务端双侧遥测，正常扩展、自动化测试与恶意中介的区分会降低。
      en: 'Stealth leaves residue: extension version, permission, or origin changes; external process access to a browser;
        remote threads and module loads; debugger attachments; browser connections to an unfamiliar controller; and request
        sequences inconsistent with the visible user workflow. Browser isolation, permissions, content security policy, and
        managed extension policy can defeat an implementation. Without both browser endpoint and service telemetry, distinguishing
        approved extensions or test automation from malicious interposition becomes less reliable.'
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入浏览器内 hook、受控扩展或附着工具实际读取已认证页面及请求内容，或远端操作经受害浏览器上下文访问其可见的站点内容。合法密码管理器、无障碍扩展、开发者调试、受批准的自动化测试和企业流量检查可产生相似权限或连接，须依据批准主体、变更记录、访问对象与结果区分。仅有扩展安装、进程注入或浏览器代理能力而无内容读取链时，不能进入
        Collection 的确认层级。
      en: Include an in-browser hook, controlled extension, or attached tool that actually reads authenticated pages or requests,
        and remote actions that retrieve site content through the victim browser context. Legitimate password managers, accessibility
        extensions, developer debugging, approved test automation, and enterprise inspection can create similar permissions
        or connections; distinguish them by authorization, change history, target objects, and outcome. An extension install,
        process injection, or available browser proxy without a content-read chain does not reach confirmed Collection.
    - zh: T1557 的介入点在终端与服务之间的通信路径，本技术的介入点在浏览器执行或会话上下文。T1539 的对象是 Cookie 或令牌；T1055 是让代码进入另一进程的执行步骤；T1056 是捕获输入事件或表单键值。邮件正文、仓库页面或云资源在被浏览器实际读取后仍可按
        T1114、T1213 等数据来源技术另记，不应因浏览器作为客户端就吞并来源边界。TA0001 的首次钓鱼入口也不因后续页面中介而倒填为本技术。
      en: T1557 interposes in the path between endpoint and service; this technique interposes in browser execution or session
        context. T1539 concerns a cookie or token result, T1055 the execution step of placing code in another process, and
        T1056 input events or form values. Email bodies, repository pages, or cloud resources read through a browser may also
        map to T1114, T1213, or another source technique; the browser client does not erase the source boundary. A first phishing
        entry under TA0001 should not be recast as this technique because of later page interposition.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已在终端或浏览器配置取得控制，发现目标用户处于已认证的银行、企业门户或内网站点会话时，选择与页面活动同步读取内容，或在远端操作端发起受害浏览器能够访问的额外页面请求。成功的 Collection 可为后续信息盗取、欺诈或横向行动提供材料，但后续外传与交易篡改是各自独立行为。
        en: After obtaining endpoint or browser-configuration control, an adversary finds an authenticated banking, enterprise
          portal, or intranet session and either reads content alongside the user's page activity or requests additional pages
          reachable from the victim browser for a remote operator. Successful Collection may feed later theft, fraud, or lateral
          activity, but exfiltration and transaction alteration are separate behaviors.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要浏览器进程写入能力、可安装或篡改扩展的配置能力、或已经建立的浏览器自动化/调试权限之一，并了解目标站点的登录状态、页面结构或可访问资源。进程内代理可能要求高完整性或特定浏览器架构；扩展路径受主机权限和站点访问许可限制。攻击者还需把收集到的内容传回控制端或保留在本机，其通道若缺失，只有观察机会不能证明已取得内容。
          en: The attacker needs at least one of browser-process write access, control of an installable or alterable extension,
            or established browser automation or debugging permission, together with knowledge of target login state, page
            structure, or reachable resources. An in-process proxy may require high integrity or a particular browser architecture;
            extension paths depend on host and site permissions. The actor also needs a way to retain or return read content;
            without that channel, observed control is only an opportunity, not proof of acquisition.
      defender_model:
        paragraphs:
        - zh: 防守方可结合端点进程与扩展清单、调试会话、浏览器外连、企业 IdP/应用访问日志以及用户实际交互或页面导航线索。服务端通常只见同一认证主体发出的请求，不能直接分辨由用户、扩展还是代理生成；端点也未必能解密浏览器内每个读取动作。把浏览器控制事件与页面访问对象、时窗和内容外传关联，可提高归因强度，但保留期、隐私限制和未受管设备会形成盲区。
          en: The defender may combine endpoint processes and extension inventory, debugger sessions, browser egress, identity-provider
            and application access logs, and evidence of actual user interaction or page navigation. The service often sees
            requests under one authenticated principal and cannot directly tell whether the user, extension, or proxy generated
            them; endpoint sensors may not expose every in-browser read. Joining browser-control events to page objects, time
            windows, and content egress improves attribution, but retention, privacy limits, and unmanaged devices leave blind
            spots.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借既有浏览器身份呈现内容访问
      en: Content access under an established browser identity
    analysis:
      paragraphs:
      - zh: 攻击者在浏览器上下文中读取页面或由它发出请求，服务端因而继续观察到用户已有的认证状态和浏览器来源，而非明显的新客户端。身份连续性降低仅依赖新登录或来源偏移的区分能力，但额外访问顺序、扩展或注入痕迹仍可暴露控制点。此机理说明归因困难，不宣称认证本身消失或所有服务端控制均被绕过。
        en: The actor reads pages or sends requests inside the browser context, so the service continues to observe existing
          user authentication and browser origin rather than an obviously new client. Identity continuity weakens rules based
          only on new logins or source shifts, while extra request order, extensions, or injection residue can reveal the
          control point. This mechanism describes attribution difficulty and does not imply authentication disappears or all
          server controls are bypassed.
    evidence_keys:
    - T1185_REF_ATTACK
    - T1185_REF_COBALT
    - T1185_REF_KASPERSKY
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 浏览器内部读取落在外围遥测盲区
      en: In-browser reads fall outside perimeter telemetry
    analysis:
      paragraphs:
      - zh: 页面内容可在浏览器网络或 DOM 层被读取，外围网络设备只见正常的浏览器到服务连接，未必看到本地扩展或脚本取得的数据。若终端没有扩展权限、脚本及浏览器外连的记录，关键读取动作就不进入常规检测视野；具备端点和服务端关联时，这一盲区会缩小。此项仅在实际使用浏览器内控制点时成立。
        en: Page content can be read at the browser network or DOM layer while perimeter devices see ordinary browser-to-service
          connections and may miss local extension or script access. Without endpoint records of extension permissions, scripts,
          and browser egress, the critical read falls outside routine detection. Correlated endpoint and service telemetry
          narrows that gap. This mechanism applies only when an in-browser control point is actually used.
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    - T1185_REF_CHROME_DEBUGGER
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 建议按攻击者是否与用户当前页面活动共同使用同一会话来划分：一类在用户当前页面上条件式读取或改写内容，另一类为远端操作端通过受害浏览器上下文发出额外请求。前者主要留下页面脚本、扩展和内容差异，后者主要留下控制通道与服务端额外访问序列。浏览器品牌、扩展与
          DLL、银行与邮箱、表单字段类别都不是稳定分界；一个事件可同时满足两类，但各自要有内容访问证据。
        en: Proposed children separate whether the adversary shares the user's current page activity or drives additional
          requests through the victim browser for a remote operator. The first leaves page script, extension, and content-difference
          traces; the second leaves a control channel and extra server request sequence. Browser brands, extension versus
          DLL, banking versus email, and form-field categories are not stable partitions. One event may satisfy both when
          each content-access path has evidence.
    subtechnique_refs:
    - T1185_CHILD_COVIEW
    - T1185_CHILD_RELAY
proposed_subtechniques:
- temporary_key: T1185_CHILD_COVIEW
  name:
    zh: 同页活动内容中介
    en: Co-Viewed Page Content Interposition
  summary:
    zh: 攻击者在用户正在浏览的页面或请求上按条件读取或改写内容，使收集与正常页面活动重叠。
    en: An actor conditionally reads or modifies the page or requests the user is viewing, overlapping collection with normal
      page activity.
  definition_and_concept:
    paragraphs:
    - zh: 同页活动内容中介是攻击者把读取或改写点放入用户正在使用的页面、浏览器网络处理或扩展脚本，使当前会话中的页面源码、请求正文或响应片段进入攻击者可控范围。直接目的是取得这些内容，条件式触发可由站点、页面路径或业务动作决定；是否使用
        DLL、扩展或调试接口不决定此子项身份。
      en: Co-Viewed Page Content Interposition places a read or modification point in the page, browser network handling,
        or extension script the user is currently using, exposing page source, request bodies, or response fragments to the
        actor. Its direct purpose is to acquire that content, with triggers based on site, page path, or business action.
        A DLL, extension, or debugger interface does not define the child.
  stealth_characteristics:
    paragraphs:
    - zh: 同页活动内容中介把异常读取压进用户原本会访问的页面时段，服务端可能只见自然的登录和页面顺序，外部网络传感器也可能看不到浏览器内的 DOM 或请求截取。残余包括新扩展权限、页面脚本/DOM 差异、浏览器控制端外连和被改写的请求；若用户没有打开目标页面，条件式控制点通常不产生相同内容流。
      en: Co-Viewed Page Content Interposition compresses the read into the time the user was already visiting a page. The
        service may see a natural login and page order, and perimeter sensors may miss browser-local DOM or request interception.
        Residue includes new extension permissions, script or DOM differences, browser egress to a controller, and altered
        requests. Without a user visit to the targeted page, a conditional control point usually has no equivalent content
        flow.
  scope_boundary_definition:
    paragraphs:
    - zh: 本子项要求攻击者从用户当前页面或同次页面请求实际取得内容或具有可验证的读取链。单独截取按键和表单字符归 T1056；仅把用户导向假登录页且未在原会话读取内容，归首次入口或凭据路径。页面改写若仅推动交易欺诈或保持会话而没有内容取得证据，不足以成立
        Collection。获批准的扩展和开发者调试需按授权、版本、站点权限及数据目的区分。
      en: This child requires actual content acquisition or a verifiable read chain from the user's current page or its requests.
        Keystrokes and form characters alone belong to T1056. Sending a user to a fake login page without reading the original
        session belongs to first entry or credential-path behavior. A page rewrite that only promotes fraud or preserves a
        session does not establish Collection without content evidence. Authorized extensions and developer debugging require
        checks of approval, version, host permissions, and data purpose.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用户已登录企业或金融应用并打开包含敏感正文的页面时，攻击者驻留的浏览器控制点按域名或页面状态启用，复制页面或请求内容，并可能用局部 HTML 改写诱导显示更多字段。后续凭据盗取、交易改写和外传另作行为评价。
        en: When a user opens a sensitive page in an authenticated enterprise or financial app, a resident browser control
          point activates on domain or page state, copies page or request content, and may locally change HTML to elicit additional
          fields. Later credential theft, transaction alteration, and exfiltration are assessed separately.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需使浏览器加载受控脚本、扩展或 hook，并匹配目标页面结构和时机；动态页面、CSP、扩展许可与浏览器更新可能破坏读取或改写路径。攻击者若只持有页面外的网络位置，应转由 T1557 评价。
          en: The actor must cause the browser to load a controlled script, extension, or hook and match target page structure
            and timing. Dynamic pages, CSP, extension permission, and browser updates can break reading or modification. Control
            only at a network position is evaluated under T1557.
      defender_model:
        paragraphs:
        - zh: 防守方需要扩展清单及权限、进程模块与调试附着、浏览器外连和应用请求日志；单一应用端请求日志无法看到本地 DOM 读取。用户可报告页面变化，但不应以可见变化为必要条件。
          en: The defender needs extension inventory and permissions, process modules and debugger attachments, browser egress,
            and application request logs. Application requests alone do not expose local DOM reads. User-visible page changes
            can be reported but are not required.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 页面内读取避开外围内容观察
      en: Page-local reads evade perimeter content observation
    analysis:
      paragraphs:
      - zh: 控制点只在目标页面加载后于浏览器内取得页面或请求内容，服务端仍处理正常会话且外围网络可能仅见加密连接，造成内容读取与服务访问日志脱钩。扩展权限、脚本变更和内容外传仍可恢复这一链条。
        en: A control point reads page or request content inside the browser after a target page loads. The service handles
          a normal session while perimeter monitoring may see only encrypted connections, separating the read from ordinary
          service logs. Extension permissions, script changes, and content egress can still reconstruct the chain.
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    confidence: medium
  evidence_keys:
  - T1185_REF_KASPERSKY
  - T1185_REF_ELASTIC
  - T1185_REF_TALOS
  claim_keys:
  - T1185_CLM_COVIEW
  defense_keys:
  - T1185_DET_COVIEW
  - T1185_MIT_BROWSER_CONTROL
  limitations:
    paragraphs:
    - zh: Kaspersky 的 QakBot 分析证明网络 API hook 与按金融页面注入脚本，但所展示片段不量化每次实际取回的数据；Elastic 的扩展分析区分从样本得到的能力与实验靶页验证。Talos Qbot 样本中全部
        618 份只观察到登出重定向，该动作是保持会话的佐证，不能单独支持本子项的内容取得。正常扩展同样可能观察 DOM，故权限异常不能代替内容证据。
      en: Kaspersky documents QakBot network API hooking and financial-page script injection but does not quantify the content
        retrieved in every instance. Elastic distinguishes sample capability from validation on a test page. In the 618 Qbot
        samples Talos examined, the observed webinject action was logout redirection; it corroborates session manipulation
        but does not by itself prove this child's content acquisition. Legitimate extensions can also observe the DOM, so
        permission anomalies cannot replace content evidence.
- temporary_key: T1185_CHILD_RELAY
  name:
    zh: 浏览器上下文代理借用
    en: Browser-Context Proxy Borrowing
  summary:
    zh: 攻击者从独立操作端经受害浏览器上下文请求站点内容，使服务端仍见既有会话身份但出现额外访问序列。
    en: An actor requests site content from a separate operator endpoint through the victim browser context, leaving existing
      session identity but extra access sequences at the service.
  definition_and_concept:
    paragraphs:
    - zh: 浏览器上下文代理借用是攻击者在目标浏览器执行环境中建立请求转发点，让独立操作端提出的页面请求由受害浏览器所持会话状态完成。它取得的内容可与用户当时屏幕上的页面不同，因此区别于同页中介；核心变量是操作端与受害浏览器分离，而非所用代理产品或浏览器类型。
      en: Browser-Context Proxy Borrowing establishes a request relay in the victim browser execution environment so pages
        requested by a separate operator are fulfilled with the victim browser's session state. Retrieved content can differ
        from what the user is viewing. The stable variable is separation of operator and victim browser, not the proxy product
        or browser type.
  stealth_characteristics:
    paragraphs:
    - zh: 浏览器上下文代理借用可以不改变用户当前页面，且目标站点可能把独立操作端的请求记在受害者既有认证与设备环境之下。可观察残余是浏览器进程控制点、与远端的代理或隧道连接，以及用户缺少相应交互时仍出现的额外资源请求；高权限注入并非所有实现的必要条件，但典型进程内代理会留下句柄和线程线索。
      en: Browser-Context Proxy Borrowing can leave the current user page unchanged while the target site records the operator's
        requests under the victim's existing authentication and device environment. Residue includes a browser control point,
        remote proxy or tunnel connection, and extra resource requests without matching user interaction. High-integrity injection
        is not required by every implementation, though a typical in-process proxy leaves handle and thread clues.
  scope_boundary_definition:
    paragraphs:
    - zh: 只有证明独立请求经浏览器上下文完成并取得站点内容，才纳入本子项。复制 Cookie 后在另一台设备重放属于 T1539 的结果及后续凭据使用；一般企业代理未借受害浏览器会话；单纯建立隧道或注入 DLL 也不等于收集。若经代理读取邮件或知识库内容，可在有对象证据时同时记
        T1114 或 T1213。
      en: Include this child only when independent requests are shown to complete through the browser context and retrieve
        site content. Copying a cookie and replaying it on another device is a T1539 result and later credential use. An ordinary
        enterprise proxy does not borrow the victim browser session, and a tunnel or DLL injection alone is not Collection.
        Reading mail or repository content through the relay may additionally map to T1114 or T1213 when the object is evidenced.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 已控制终端的攻击者发现用户浏览器可访问内部门户或已完成多因素认证的业务站点，便从独立操作端请求用户未必正在查看的页面。此用法可避免新设备登录流程，并可取得应用内容；是否真的绕过特定 MFA 政策须按应用日志证明。
        en: After controlling an endpoint, the actor finds that the user's browser can reach an intranet portal or an MFA-authenticated
          business site, then requests pages the user may not be viewing from a separate operator endpoint. This can avoid
          a new-device sign-in flow and acquire application content, but bypass of a particular MFA policy requires application
          evidence.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需能在具备有效会话状态的浏览器上下文建立代理、维持与远端操作端的链路，并选择该浏览器确实有权访问的资源。权限、进程隔离和浏览器关闭会限制有效期；工具作者的实现说明不证明现代浏览器都具有同样状态共享方式。
          en: The actor must establish a relay in a browser context with valid session state, maintain a link to the remote
            operator, and select resources the browser can actually access. Permissions, process isolation, and browser closure
            limit its lifetime. A tool author's implementation does not establish that modern browsers all share state in
            the same way.
      defender_model:
        paragraphs:
        - zh: 防守方应有浏览器进程访问/模块事件、主机连接记录、IdP 与目标应用的细粒度请求日志，并可在隐私允许下取得用户交互线索。若只有登录事件，独立请求会被并入同一会话；若只有主机事件，也可能只看到注入而无法证明读取了哪一页。
          en: The defender needs browser process-access and module events, host connection records, fine-grained IdP and target-app
            requests, and user interaction evidence where privacy permits. Sign-in events alone can fold independent requests
            into one session; endpoint events alone may show injection without proving which page was read.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 独立请求借用受害浏览器认证外观
      en: Independent requests borrow victim-browser authentication appearance
    analysis:
      paragraphs:
      - zh: 独立操作端把请求交给受害浏览器中的代理，该代理使用浏览器现有状态取得响应，目标服务遂把额外请求关联到熟悉的会话而非新设备。新登录检测失去区分力，但服务端额外请求序列与端点代理链仍可揭露借用。
        en: A separate operator passes requests to a proxy inside the victim browser, which fulfills them with existing browser
          state. The service associates extra requests with a familiar session instead of a new device. New-login detection
          loses discrimination, but extra request sequences and the endpoint relay chain can expose the borrowing.
    evidence_keys:
    - T1185_REF_COBALT
    - T1185_REF_ATTACK
    confidence: medium
  evidence_keys:
  - T1185_REF_COBALT
  - T1185_REF_ATTACK
  - REF-000366
  claim_keys:
  - T1185_CLM_RELAY
  defense_keys:
  - T1185_DET_RELAY
  - T1185_MIT_BROWSER_CONTROL
  limitations:
    paragraphs:
    - zh: Cobalt Strike 原作者说明代理在旧版 Internet Explorer/WinINet 上借用会话，并非现代 Chromium、Firefox 或真实受害现场的普遍实证。ATT&CK 文本将浏览器 pivot
        列为例子，却没有为每次被引用的入侵给出应用端请求与内容证据。正式案例需要代理连接、受害浏览器进程和站点资源读取三者闭环。
      en: Cobalt Strike's author describes session borrowing in older Internet Explorer and WinINet; this is not universal
        evidence for modern Chromium, Firefox, or real victim incidents. ATT&CK lists browser pivoting as an example but does
        not supply application request and content evidence for every cited intrusion. A formal case needs a closed chain
        among relay connection, victim browser process, and resource read.
defense_candidates:
  detection_strategies:
  - key: T1185_DET_COVIEW
    name:
      zh: 关联浏览器控制点与同页内容读取
      en: Correlate Browser Control with Co-Viewed Content Reads
    objective:
      zh: 识别未授权扩展、hook 或调试控制与目标页面内容访问、向外传递之间的时序闭环。
      en: Identify the temporal chain from unauthorized extension, hook, or debugger control to target-page content access
        and outward transfer.
    detects_keys:
    - T1185_PARENT
    - T1185_CHILD_COVIEW
    analytic_keys:
    - T1185_NJA_COVIEW
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    - T1185_REF_MS_EXTINV
    - REF-000366
  - key: T1185_DET_RELAY
    name:
      zh: 关联浏览器代理控制与额外站点读取
      en: Correlate Browser Relay Control with Extra Site Reads
    objective:
      zh: 把浏览器进程异常访问和远端代理链路，与同一认证会话的无对应交互资源请求相连。
      en: Link unusual browser process access and a remote relay to resource requests in the same authenticated session without
        corresponding user interaction.
    detects_keys:
    - T1185_PARENT
    - T1185_CHILD_RELAY
    analytic_keys:
    - T1185_NJA_RELAY
    evidence_keys:
    - T1185_REF_ATTACK
    - T1185_REF_COBALT
    - REF-000366
  detection_analytics:
  - key: T1185_NJA_COVIEW
    strategy_key: T1185_DET_COVIEW
    logic:
      zh: 以设备、用户和浏览器配置文件为键，先找扩展新增/版本或权限扩大、未批准调试附着或进程模块变化；再在同一会话 30 分钟内关联敏感站点页面访问以及浏览器到非批准域的内容传输。只有能取得页面源码、请求正文或后续匹配内容时才升级为已收集；仅有扩展权限时输出待核查。
      en: Join device, user, and browser profile. Find extension installs or version/permission growth, unapproved debugger
        attachment, or browser module changes, then correlate sensitive-site page access and browser transfer to an unapproved
        domain within 30 minutes. Escalate to confirmed collection only with page source, request body, or a matching downstream
        content artifact; permission alone yields an investigative lead.
    data_requirements:
    - source_type: browser_extension_inventory
      required_fields:
      - device_id
      - browser_name
      - extension_id
      - version
      - permissions
      - install_origin
      - observed_at
    - source_type: endpoint_process_and_network
      required_fields:
      - device_id
      - process_guid
      - process_image
      - target_process_guid
      - event_type
      - destination_domain
      - observed_at
    - source_type: application_request_log
      required_fields:
      - account_id
      - session_id
      - resource_path
      - request_method
      - observed_at
    observables:
    - unapproved_extension_permission_change
    - browser_debugger_or_module_change
    - target_page_request
    - browser_nonapproved_egress
    - content_match_when_available
    correlation:
      window: 30m
      dimensions:
      - device_id
      - browser_profile
      - account_id
      - session_id
      - resource_path
    false_positives:
      zh: 密码管理器、无障碍插件、合法浏览器开发调试、DLP 扩展和回归测试会访问页面并产生外连；必须核对签名、变更单、主机范围和目标站点权限。
      en: Password managers, accessibility plug-ins, approved browser debugging, DLP extensions, and regression tests can
        access pages and connect outward; check signer, change ticket, fleet scope, and host permissions.
    blind_spots:
      zh: 浏览器端 DOM 读取往往没有独立系统事件；无扩展清单、缺少应用 request ID 或加密外传不可检查时，只能给出控制风险线索。
      en: Browser-local DOM reads often lack separate OS events. Without extension inventory, app request IDs, or inspectable
        encrypted egress, this is a control-risk lead only.
    tuning_guidance:
      zh: 以受管扩展及开发工具的批准版本、站点范围和维护窗建基线，但不得把所有 debugger 权限或浏览器外连整体放行；高敏站点与异常权限变更优先。
      en: Baseline approved extension and developer-tool versions, host scopes, and maintenance windows, without globally
        allowing all debugger permissions or browser egress; prioritize sensitive sites and new permissions.
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    - T1185_REF_MS_EXTINV
    - T1185_REF_CHROME_DEBUGGER
    - REF-000366
  - key: T1185_NJA_RELAY
    strategy_key: T1185_DET_RELAY
    logic:
      zh: 对有浏览器进程写权限访问或异常模块载入的设备，关联同一浏览器进程到非批准远端的长连接，再检查 20 分钟内该设备认证会话读取内部应用资源的序列。若请求在无相应页面导航或用户活动时出现、超出用户近期访问基线，且与代理控制链同现，提升风险；仅凭
        Sysmon 8/10 不断言内容取得。
      en: On devices with write-capable browser process access or unusual module loads, correlate a long connection from the
        same browser process to an unapproved remote endpoint. Inspect internal-app resource reads in the device's authenticated
        session within 20 minutes. Raise risk when requests lack matching page navigation or user activity, exceed the user's
        recent access baseline, and coincide with the relay chain. Sysmon 8 or 10 alone does not prove content acquisition.
    data_requirements:
    - source_type: sysmon_process_access
      required_fields:
      - utc_time
      - source_process_guid
      - target_process_guid
      - granted_access
    - source_type: endpoint_network_connection
      required_fields:
      - utc_time
      - process_guid
      - destination_ip
      - destination_port
    - source_type: application_request_log
      required_fields:
      - account_id
      - session_id
      - device_id
      - resource_path
      - response_status
      - observed_at
    observables:
    - browser_write_access
    - browser_remote_thread_or_module_load_when_available
    - browser_remote_relay
    - extra_authenticated_resource_reads
    correlation:
      window: 20m
      dimensions:
      - device_id
      - browser_process_guid
      - account_id
      - session_id
      - resource_path
    false_positives:
      zh: 经批准的 Selenium/Playwright 自动化、远程协助、浏览器测试代理和辅助功能可能造成浏览器控制与额外页面请求；应根据批准进程及测试账号区分。
      en: Approved Selenium or Playwright automation, remote support, browser test proxies, and accessibility functions may
        create browser control and extra requests; distinguish by approved process and test account.
    blind_spots:
      zh: 现代浏览器的多进程隔离使会话映射复杂；无端点进程事件或应用资源日志时无法闭环，内存内代理也可能避开模块载入事件。
      en: Modern browser process isolation complicates session mapping. Missing endpoint events or app resource logs prevent
        a closed chain, and an in-memory relay may avoid module-load events.
    tuning_guidance:
      zh: 在浏览器进程名和写权限掩码上做定向筛选，并记录企业代理与远程支持排除项的进程签名和运行时段；仍保留高价值账户在正常设备上出现新资源序列的检测。
      en: Filter on browser process names and write-capable access masks; scope enterprise proxy and remote-support exclusions
        by signed process and approved window while retaining new-resource sequence detection for high-value accounts on familiar
        devices.
    evidence_keys:
    - T1185_REF_ATTACK
    - T1185_REF_COBALT
    - REF-000366
  mitigations:
  - key: T1185_MIT_BROWSER_CONTROL
    name:
      zh: 浏览器控制面与活动会话收敛
      en: Browser Control-Plane and Active-Session Reduction
    description:
      zh: 在受管终端限制可接触敏感站点的扩展与调试能力，约束浏览器进程写入，并缩短不再使用的活动会话寿命。
      en: On managed endpoints, restrict extension and debugger access to sensitive sites, constrain writes into browser processes,
        and shorten the life of unused active sessions.
    measures:
    - key: extension_policy
      control_type: preventive
      description:
        zh: 对敏感站点执行扩展安装来源、主机权限和 debugger 权限策略，维持带版本的批准清单与持续盘点。
        en: Enforce extension install-origin, host-permission, and debugger-permission policy for sensitive sites, with a
          versioned allowlist and continuous inventory.
    - key: process_protection
      control_type: cost-increasing
      description:
        zh: 限制普通账户调试与写入浏览器进程的权限，并对进程访问及远程线程进行审计。
        en: Restrict ordinary accounts' debugging and write access to browser processes, and audit process access and remote
          threads.
    - key: session_lifecycle
      control_type: exposure-reduction
      description:
        zh: 对高价值应用设置合理的不活动超时、会话撤销和设备状态复核，避免浏览器关闭后状态长期可复用。
        en: Set reasonable idle timeouts, session revocation, and device-state checks for high-value apps so browser state
          is not reusable indefinitely.
    applications:
    - target_key: T1185_PARENT
      use:
        zh: 将浏览器控制权限与高价值会话有效期共同收敛，减少可被中介的已认证内容窗口。
        en: Reduce both browser-control permission and the lifetime of high-value authenticated content windows.
      expected_effect:
        zh: 提高中介部署成本并缩短已认证内容可读时间。
        en: Raise interposition cost and shorten the period in which authenticated content is readable.
      limitations:
        zh: 合法扩展和远程支持需要精细批准；会话超时不能移除已植入的浏览器控制点。
        en: Legitimate extensions and remote support need precise approval; session timeout does not remove an implanted browser
          control point.
    - target_key: T1185_CHILD_COVIEW
      use:
        zh: 限制扩展对敏感域的读取/改写权限并复核版本变更，保留端点浏览器外连监测。
        en: Restrict extensions' read and modify permissions on sensitive domains, review version changes, and retain browser
          egress monitoring.
      expected_effect:
        zh: 压缩同页读取入口，且使新增权限和外连更可辨。
        en: Narrow co-viewed read entry points and make new permissions and egress more distinguishable.
      limitations:
        zh: 获批准扩展被攻陷或进程内 hook 可绕开单纯扩展策略；严禁一刀切破坏无障碍与密码管理功能。
        en: Compromised approved extensions or in-process hooks can bypass extension-only policy; blanket blocking can harm
          accessibility and password management.
    - target_key: T1185_CHILD_RELAY
      use:
        zh: 限制对浏览器进程的写入与调试，监控远端代理链路，并使高价值站点在关键资源读取时复核设备或会话状态。
        en: Restrict write and debug access to browser processes, monitor remote relay links, and have high-value sites recheck
          device or session state for sensitive resource reads.
      expected_effect:
        zh: 增加建立代理的门槛并削弱长期无交互借用会话的机会。
        en: Increase the barrier to relay setup and reduce opportunities for long unattended session borrowing.
      limitations:
        zh: 控制了受信端点的攻击者仍可使用其真实会话；过短超时或频繁复核会影响业务操作。
        en: An actor controlling a trusted endpoint may still use its real session; aggressive timeouts or rechecks can disrupt
          work.
    evidence_keys:
    - T1185_REF_ATTACK
    - T1185_REF_MS_POLICY
    - T1185_REF_MS_EXTINV
    - REF-000366
