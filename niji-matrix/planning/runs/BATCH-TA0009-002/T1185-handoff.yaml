research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - Parent covers in-process browser access, browser proxy pivot, and page/form manipulation despite having no ATT&CK children
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - key: T1185_AXIS_IN_PROCESS
      resolution: parent-core
      reasoning:
        zh: 进程内借用会话是两个正式子项可共同使用的实现条件；单独按是否 DLL 注入分类会复制 T1055，且不能稳定区分页面共览与独立代理的观察差。
        en: In-process session borrowing is an implementation shared by both proposed children. Splitting on DLL injection
          would duplicate T1055 and would not distinguish co-viewed pages from an independent relay.
    - key: T1185_AXIS_COVIEW
      resolution: formal
      trace_change:
        zh: 页面访问期间出现 hook/扩展脚本、读取或改写请求及浏览器外连，服务端页面顺序可保持自然。
        en: A hook or extension script, request read or rewrite, and browser egress appear during page use while the server
          page sequence can remain natural.
      defender_difference:
        zh: 需要扩展权限与页面内容路径关联；仅有登录日志不足。
        en: Requires joining extension permissions to the page-content path; login logs alone are insufficient.
      evidence_keys:
      - T1185_REF_KASPERSKY
      - T1185_REF_ELASTIC
    - key: T1185_AXIS_RELAY
      resolution: formal
      trace_change:
        zh: 与用户可见页面无关的额外资源请求借同一浏览器会话出现，伴随浏览器进程控制与远端代理链路。
        en: Extra resource requests unrelated to the user-visible page appear under the same browser session, with browser
          process control and a remote relay.
      defender_difference:
        zh: 需要关联端点代理链、服务端资源序列及用户交互缺口。
        en: Requires joining endpoint relay, server resource sequence, and lack of matching user interaction.
      evidence_keys:
      - T1185_REF_COBALT
      - T1185_REF_ATTACK
    - key: T1185_AXIS_FORM_REWRITE
      resolution: adjacent-or-deferred
      reasoning:
        zh: 纯表单抓取与输入捕获 T1056 重叠；Qbot 登出重定向可延长会话却未证明内容读取。只有在改写诱导并实际取得页面/请求内容时才纳入同页中介，暂不另立按表单或改写方式划分的 NJS。
        en: Pure form grabbing overlaps T1056, while Qbot logout redirection preserves a session without proving content reads.
          A rewrite that elicits and captures page or request content belongs to co-viewed interposition; no separate form-
          or rewrite-based NJS is justified yet.
      evidence_keys:
      - T1185_REF_TALOS
      - T1185_REF_ELASTIC
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 无子项不等于 Niji 无划分；两条正式轴是会话操作位置与防守观察差，不是浏览器、工具或表单类型。第三轴因邻接技术及结果证据不足暂缓。
      en: No ATT&CK children does not imply no Niji split. The two proposed axes concern session operation and defender observations
        rather than browser, tool, or form type. A third axis is deferred because of adjacent techniques and insufficient
        outcome evidence.
  evidence_coverage:
    parent_behavior_keys:
    - T1185_REF_ATTACK
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    boundary_keys:
    - T1185_REF_ATTACK
    - T1185_REF_TALOS
    - T1185_REF_CHROME_DEBUGGER
    - REF-000245
    mechanism_support:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    - T1185_REF_COBALT
    child_existence_support:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    - T1185_REF_COBALT
    unsupported_or_deferred:
    - zh: ICEBRG 原始页面在本次研究中不可访问，不能作为具体结论的已核验来源。
      en: The original ICEBRG page was unavailable during this research and is not treated as verified support for a specific
        conclusion.
    - zh: Cobalt Strike 浏览器 pivot 是一手能力说明，没有现场数据可证明某个真实受害者页面已被读取。
      en: The first-party Cobalt Strike pivot account is capability evidence, not field evidence that a particular victim
        page was read.
    - zh: Talos Qbot 样本仅证登出重定向，不能升级为内容收集或通用网页注入成效。
      en: Talos's Qbot samples support logout redirection only and cannot be upgraded to content collection or general webinject
        success.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级与两子级均分开定义、匿迹属性、范围、场景、攻防模型、机理与限制；正式集成前仍须主 Agent 比较邻项 T1557、T1114 及共享防御库。
      en: Parent and both children separately address definition, stealth properties, scope, scenario, attacker and defender
        models, mechanism, and limitations. The primary agent must still compare adjacent T1557 and T1114 and the shared defense
        library before integration.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: []
  limitations:
    paragraphs:
    - zh: 浏览器 pivot 的关键一手资料来自工具作者而非事件响应；QakBot 与 KREMLIN 样本分析能证明控制与内容路径，但不能把每次能力触发当成用户数据已被收集。固定基线仅是 19.1 工作簿，2026 年 9 月的新研究只能补充机制证据，不应倒填为
        ATT&CK 19.1 自身内容。实际应用需按浏览器版本、扩展 API 权限、目标站点和隐私许可重新校准检测字段。
      en: The key first-party browser-pivot source is a tool author's account rather than incident response. QakBot and KREMLIN
        sample analyses support control and content paths but do not make every available capability an observed user-data
        collection. The baseline remains the 19.1 workbook; new September 2026 research supplements mechanism evidence and
        is not retroactively part of ATT&CK 19.1. Detection fields require recalibration to browser version, extension API
        permissions, target site, and privacy permissions.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 条件式页面触发是操作门控，但尚无充分证据证明跨时间或来源的系统性释痕是本技术稳定机理。
      en: Page-conditioned activation is an operational gate, but evidence does not establish systematic temporal or source
        dilution as a stable mechanism here.
  - mechanism_ref: NM-DO
    reason:
      zh: 资料没有证明被收集内容本身被加密、编码或遮蔽以规避内容观察；正常 TLS 不足以单独构成此机理。
      en: The sources do not show collected content itself being encrypted, encoded, or concealed to defeat inspection; ordinary
        TLS alone is insufficient for this mechanism.
  open_questions:
  - zh: 主 Agent 应决定是否仅将浏览器代理借用保持为正式子项的 medium 假说，还是要求现场案例才进入 review；两种路径都不得用 Cobalt Strike 能力冒充攻击者实际读取。
    en: The primary agent should decide whether browser proxy borrowing can enter review with medium capability evidence or
      needs a field case; neither path may present Cobalt Strike capability as observed attacker reading.
  - zh: 与本批 T1114、T1213 的重叠只在浏览器实际读取对应内容时双重标注，需在集成摘要中记录对象层级证据。
    en: Overlap with this batch's T1114 and T1213 warrants dual mapping only when browser access to their respective content
      is shown; record object-level evidence in integration.
