  claims:
  - key: T1185_CLM_PARENT
    proposition:
      zh: 活动浏览器控制点可在既有认证上下文读取页面或请求内容，而单纯控制权限不证明内容已取得。
      en: An active browser control point can read page or request content under existing authentication, while control permission
        alone does not prove content acquisition.
    evidence_keys:
    - T1185_REF_ATTACK
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    confidence: medium
  - key: T1185_CLM_COVIEW
    proposition:
      zh: 目标页面触发的浏览器内 hook 或扩展可在同页活动中读取请求或页面内容，并留下浏览器控制与外连残余。
      en: Target-page-triggered hooks or extensions can read requests or page content during the same page activity, leaving
        browser-control and egress residue.
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
    confidence: medium
  - key: T1185_CLM_RELAY
    proposition:
      zh: 注入浏览器上下文的请求代理可借该上下文的认证状态完成独立站点请求；公开一手材料主要证明工具能力而非具体受害事件。
      en: A request proxy injected into a browser context can fulfill independent site requests with that context's authentication
        state; public first-party material chiefly proves tool capability rather than a specific victim event.
