handoff_schema_version: '2.0.0'
type: "technique-research-handoff"
batch_ref: "BATCH-TA0009-002"
work_item_ref: "WORK-TA0009-T1213"
temporary_key_prefix: "T1213_"
candidate:
  source_type: "attack"
  source_attack_id: "T1213"
  name: {zh: 从信息存储库获取数据, en: Data from Information Repositories}
recommendation:
  decision: "adapt"
  confidence: "medium"
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: "固定版 T1213 的直接行为是从协作、业务或代码等信息库取得内容，而不是确定使用何种工具、产品或后继外传渠道。这个 Collection 锚点值得保留，但“读取信息库”本身不具有匿迹性质；Niji 应把范围改写为攻击者在库内选择、读取和呈现方式上有意改变可见痕迹的内容获取。至少应证明成功的内容访问，以及所主张变量如何改变防守观察。"
        en: "Fixed-baseline T1213 directly concerns acquiring content from collaboration, business, code, and other information repositories, rather than a particular tool, product, or later exfiltration channel. That Collection anchor should remain, but repository access alone is not stealth. Niji should adapt the scope to attacker-controlled selection and retrieval choices that change visible traces, requiring proof of successful content access and of the claimed variable's effect on defender observation."
      - zh: "当前一条可进一步正式化的轴是查询驱动的选择性读取，证据证明攻击者会检索目标词且平台留下不同的搜索、访问和下载事件；低量选择是否确实降低告警仍是有条件推断。借用受信集成身份的案例虽涉及 CRM 数据，但 NJT-0086 已拥有身份与持久授权边界；本批不得以信息库名称重建它。"
        en: "Query-led selective reading is the one axis worth considering for formalization: incident evidence shows adversary searches for target terms, while platforms expose distinct search, access, and download events. Whether low-volume selection actually lowers alerts remains a conditional inference. The trusted-integration case also involves CRM data, but NJT-0086 already owns identity and durable-grant boundaries and must not be rebuilt under a repository label."
proposed_content:
  summary:
    zh: "攻击者从有权访问的信息库取得内部内容，并通过选择性查询与读取使少量高价值访问混入普通库活动；搜索与内容读取仍可留下可关联记录。"
    en: "An adversary acquires internal content from an accessible information repository and uses selective querying and reading to blend a small number of valuable accesses into ordinary repository activity; search and content reads still leave linkable records."
  definition_and_concept:
    paragraphs:
      - zh: "匿迹型信息库内容获取，是攻击者使用既有访问途径从组织的协作知识库、代码库、业务记录库或非邮件消息库读取可利用的内部内容，并调节库内发现与取用的范围，使其在普通使用流中较难被区分。直接目标是获得信息内容；仅知道库地址、权限、目录结构或搜索结果标题，不足以证明完成 Collection。"
        en: "Stealth-oriented information-repository collection occurs when an adversary uses an available access path to read exploitable internal content from a collaboration knowledge base, code repository, business-record repository, or non-mail messaging store, while shaping discovery and retrieval scope so it is harder to distinguish within ordinary use. The direct objective is acquiring content. Knowing a repository address, permission, hierarchy, or search-result title alone does not establish completed Collection."
      - zh: "信息库是持续组织和检索内容的服务，不由某个厂商名称定义。父级可以覆盖人工浏览、库内搜索、查询接口和经批准客户端的成功读取，但纳入匿迹矩阵要求额外识别由攻击者控制且改变痕迹的选择变量。凭据如何取得、应用授权如何维持，以及取出数据之后如何归档、暂存或外传，都需按相邻对象另判。"
        en: "An information repository is a service that organizes and retrieves persistent content, not a vendor name. The parent can encompass manual browsing, native search, query interfaces, and successful reading through an approved client, but inclusion in a stealth matrix additionally requires an attacker-controlled selection variable that changes traces. Credential acquisition, durable application authorization, and later archiving, staging, or exfiltration require separate classification."
  stealth_characteristics:
    paragraphs:
      - zh: "当攻击者先用目标语义搜索再读取少量匹配对象时，短时间内的对象总数与导出量可能低于按批量访问构造的告警；库内动作仍与正常查询、审阅和下载同形，恶意性须从查询主题、对象敏感性、身份职责和后续使用恢复。搜索、成功访问、下载、来源设备和会话活动并未消失，具有足够细粒度日志与保留期的防守方可重建序列。"
        en: "When an adversary searches for target concepts and reads only a few matching objects, object counts and export volume in a short window may fall below bulk-access alerts. Native repository actions also resemble ordinary search, review, and download; maliciousness must be reconstructed from query topic, object sensitivity, role, and later use. Search, successful access, download, source device, and session activity remain, and defenders with granular logs and adequate retention can reconstruct the sequence."
      - zh: "匿迹效果取决于平台是否审计搜索内容、页面取用与具体对象，以及安全团队是否把这些日志与身份和数据分类连接。Confluence Data Center 的搜索与附件下载需要 Full 审计才有相应事件，GitHub 克隆事件的访问与保留限制也不同；不能把一个平台的日志能力推广到所有信息库。大量导出或定时增量收集可能与本父级同现，但其自身的批量与编排轴应另判。"
        en: "The effect depends on whether a platform audits search content, page retrieval, and specific objects, and whether the security team joins those logs to identity and classification context. Confluence Data Center search and attachment-download events require Full auditing, while GitHub clone events have different access and retention limits; one platform's visibility cannot be generalized to every repository. Bulk export or scheduled incremental collection may co-occur but their volume and orchestration axes need separate assessment."
  scope_boundary_definition:
    paragraphs:
      - zh: "纳入有成功内容读取、能界定库内对象与主体，并有证据表明攻击者选择的检索/取用路径改变可见痕迹的事件。T1530 管理云对象存储的对象读取，T1602 管理设备或基础设施配置库，T1114 管理邮件消息和附件，T1119 管理重复自动化或检查点约束；一个服务既有文档又有邮件时按实际取得的内容及操作划界，而不是按品牌划界。"
        en: "Include events with successful content reading, an identifiable repository object and principal, and evidence that the attacker-selected retrieval path changes observable traces. T1530 owns cloud object-storage reads, T1602 owns device or infrastructure configuration repositories, T1114 owns mail messages and attachments, and T1119 owns repeated automation or checkpoint constraints. When a service holds both documents and mail, classify by content and action, not by brand."
      - zh: "仅列举站点、查询元数据、检索公开代码或取得权限而未读取内部内容，不足以认定本 Collection 技术；既有集成的授权与 token 挪用归 NJT-0086，攻击者居中截获通信归 T1557，已取得内容的汇聚、归档和外送另属后继步骤。合法员工搜索、法务电子发现、审计、迁移、备份和源代码安全扫描可产生相似日志，必须用职责、工单、对象敏感性与去向排除。"
        en: "Site enumeration, metadata-only queries, public-code search, or obtaining permission without reading internal content do not establish this Collection technique. Existing-integration grants and token co-option belong to NJT-0086; interception in transit belongs to T1557; aggregation, archiving, and transfer of acquired content are later steps. Employee research, legal e-discovery, audit, migration, backup, and source-code security scanning can yield similar logs and need role, ticket, object sensitivity, and destination context."
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: "入侵者取得可访问内部协作库的账户后，可能先搜索“confidential”“vpn”或项目词，再打开或下载少数与凭据、网络或客户有关的文档，以便横向移动、进一步利用或勒索。Mandiant 对 UNC6661 的报告记录了此类云应用关键词搜索，并给出同一行动中 SharePoint FileDownloaded 日志；报告没有把具体每次搜索与相同文件的一次下载逐一配对。"
          en: "After gaining an account that can access internal collaboration repositories, an intruder may search for terms such as confidential, vpn, or a project name and then open or download a small set of documents useful for lateral movement, further exploitation, or extortion. Mandiant reports UNC6661 searches for such terms in cloud applications and supplies a SharePoint FileDownloaded record from the same activity. It does not pair each particular query with a download of the same object."
        - zh: "代码库、知识库、CRM 和聊天库可能共同提供资料，但本建议的分类依据是查询到内容读取的选择关系，而不是跨库收集这一事实。若调查只看到代码库的 git.clone 或 CRM 批量导出，应在父级记录来源和实际内容范围，并另检验自动化、受信集成身份或外传特征，不能自动套入选择性读取子项。"
          en: "Code, knowledge, CRM, and chat repositories may collectively supply information, but the proposed child turns on the relationship between a query and selected content reads rather than multi-repository use. If an investigation sees only a code-repository git.clone or a CRM bulk export, it should record source and actual content at the parent level and separately test automation, trusted-integration identity, or exfiltration properties rather than assign the selective-reading child automatically."
    threat_model:
      attacker_model:
        paragraphs:
          - zh: "攻击者需拥有可成功读取相关库对象的账户、会话或应用权限，并知道可过滤高价值资料的词、字段或业务实体。选择性搜索牺牲了全量覆盖，依赖检索索引和权限对目标资料的可发现性；若命中不足，攻击者可能转向更显眼的广泛浏览、克隆或导出。与自动增量收集不同，该轴不要求计划任务或跨轮状态。"
            en: "The attacker needs an account, session, or application authorization that can successfully read relevant objects, plus terms, fields, or business entities that filter valuable material. Selection sacrifices complete coverage and depends on indexed, permission-visible target content; poor hits may push the actor toward more visible browsing, cloning, or export. Unlike automated incremental collection, this axis does not require a schedule or cross-run state."
      defender_model:
        paragraphs:
          - zh: "防守方需要库内搜索/查询事件、成功对象访问或下载事件、账户/应用和会话标识、对象分类与授权职责清单，并在足够时段内按主体和对象连接。Microsoft 365 能记录 SharePoint 查询与 FileAccessed/FileDownloaded，但部分系统账户会触发搜索，FileAccessed 对同一用户和文件有五分钟抑制；Confluence 需配置 Full 审计才暴露搜索词。缺少搜索词或页面读取日志时，防守方只能证明敏感对象访问，不能证明查询驱动关系。"
            en: "Defenders need repository search or query events, successful object access or download, account/application and session identifiers, object classification, and an authorized-duty inventory, joined over a suitable period by principal and object. Microsoft 365 can record SharePoint search and FileAccessed/FileDownloaded, but system accounts also search and FileAccessed is suppressed for the same user/file for five minutes. Confluence requires Full auditing for search terms. Without query text or page-read logs, defenders can establish sensitive-object access but cannot prove a query-led sequence."
  stealth_mechanisms:
    - mechanism_ref: "NM-BT"
      role: "primary"
      summary: {zh: 库内选择性读取避开只识别批量提取的观察逻辑, en: Selective repository reads evade bulk-extraction-only observation logic}
      analysis:
        paragraphs:
          - zh: "攻击者用库的原生搜索或谓词筛出少数内容并成功读取，使库侧形成搜索与零散访问，而不是连续全库导出。若防守方只监控短窗读取数或导出作业，少量敏感读取可能落在检测逻辑外；把查询主题、对象标签、主体职责和随后去向关联可以恢复异常。真实案例证明搜索行为与下载事件可出现，现有来源没有量化减少的告警，因此匿迹收益须按本地规则作条件推断。"
            en: "The attacker uses native search or predicates to select a small content set and reads it successfully, leaving search and scattered access rather than continuous corpus export. A defender watching only short-window read counts or export jobs may miss a few sensitive reads; joining query topic, object label, principal duty, and later destination can recover the anomaly. Incident evidence establishes search behavior and download events, but does not quantify alert reduction, so the stealth benefit is conditional on local rules."
      evidence_keys: [T1213_R_MANDIANT_SEARCH, T1213_R_ATTACK_DET, T1213_R_M365_AUDIT]
      confidence: "low"
  subtechnique_taxonomy:
    coverage: "conditional-established"
    proposed_refs: [T1213_CHILD_QUERY_SELECTIVE]
    narrative:
      paragraphs:
        - zh: "暂建议一项原生子项，以攻击者是否使用库内语义/谓词筛选并仅读取匹配的少量内容为轴。它改变查询与对象访问的比例，要求防守方把搜索意图与成功读取连接；人工或脚本均可执行，因此不以自动化划界。产品、数据类型、SQL 方言和 ATT&CK 六个子项都不是子项身份。"
          en: "One native child is proposed conditionally, keyed to whether an attacker uses repository-native semantic or predicate filtering and reads only a small matching content set. It changes the search-to-object-access relationship and requires defenders to connect query intent with successful reads. Either a human or script can perform it, so automation is not the boundary. Product, data type, SQL dialect, and the six ATT&CK children do not define the child."
        - zh: "二轮审查将既有集成控制和状态化增量收集分别交给 NJT-0086 与 NJT-0135；原位浏览、多主体分散和接口选择没有足够独立证据。六个外部子项对一个暂拟 Niji 子项的广度差距详见本批覆盖表，正式准入需要主 Agent 明确复核低置信度机理；否则应把 taxonomy 置为 deferred，而不是人为扩充。"
          en: "The second pass assigns existing-integration control and stateful incremental acquisition to NJT-0086 and NJT-0135 respectively. In-place browsing, cross-principal distribution, and interface choice lack sufficient independent evidence. The six-to-one breadth gap is explained in this batch's coverage table; formal admission requires explicit primary review of the low-confidence mechanism. If that gate fails, taxonomy should be deferred instead of artificially expanded."
proposed_subtechniques:
  - temporary_key: "T1213_CHILD_QUERY_SELECTIVE"
    status: "conditional-proposal"
    name: {zh: 查询驱动的选择性库内读取, en: Query-Led Selective Repository Reading}
    summary:
      zh: "攻击者先用库内查询筛出高价值内容，再读取少量匹配对象，使批量提取指标减弱，但留下可关联的查询与内容访问。"
      en: "An adversary filters valuable content with repository-native queries and reads a small matching set, weakening bulk-extraction signals while leaving linkable query and content-access traces."
    definition_and_concept:
      paragraphs:
        - zh: "查询驱动的选择性库内读取是攻击者根据已知主题、关键词、业务字段或路径条件，在内部信息库中缩小候选集合，并实际打开、读取或下载匹配内容的获取方式。它的直接对象是内部内容而非搜索功能本身；查询结果只列出标题、元数据或权限时不能单独认定内容已被收集。"
          en: "Query-Led Selective Repository Reading is an acquisition pattern in which an adversary uses known topics, keywords, business fields, or path predicates to narrow candidates within an internal information repository and actually opens, reads, or downloads matching content. Its direct object is internal content rather than the search feature itself; a result exposing only titles, metadata, or permissions does not alone prove content collection."
        - zh: "变量是高价值内容选择与读取集合之间的关系，可横跨知识库、文档库和结构化业务库，但必须在各实现上分别证明查询和读取的可观测性。它可以由人工操作或脚本完成，不要求产品 API、自动调度或固定字段类型。"
          en: "The variable is the relationship between valuable-content selection and the resulting read set. It can cross knowledge bases, document libraries, and structured business repositories, but query and read observability must be proven for each implementation. A person or script may perform it; no product API, automated schedule, or fixed field type is required."
    stealth_characteristics:
      paragraphs:
        - zh: "查询驱动的选择性库内读取把可见活动压缩为少数查询和目标对象读取，避免大量无关文件触碰所产生的高扇出或导出事件。与正常员工调查同形的访问使单个事件难以归因；可恢复的痕迹包括搜索词或过滤条件、对象访问/下载、敏感标签、身份与来源设备。查询量很高、搜索词明显异常，或目标文件已被精细审计时，匿迹效果会减弱。"
          en: "Query-Led Selective Repository Reading compresses visible activity into a few queries and target-object reads, avoiding the high fan-out or export events of touching many unrelated files. Individual accesses resemble employee research and are difficult to attribute alone. Recoverable traces include terms or predicates, object access/download, sensitivity labels, identity, and source device. The benefit weakens when query volume is high, terms are conspicuous, or target objects are closely audited."
    scope_boundary_definition:
      paragraphs:
        - zh: "纳入可证实的“过滤条件—匹配内容—成功取用”链，允许查询与取用相隔短暂时间但不得只凭同一账户的两个无关事件拼接。无后继内容读取的搜索是发现，完整仓库克隆或全表导出没有选择性边界；重复检查点由 NJT-0135 管，应用 token 来源由 NJT-0086 管。仅凭“读取量小”无法区别合法分析、法务调查与恶意收集。"
          en: "Include a supportable filter-to-matching-content-to-successful-retrieval chain. Query and retrieval may be separated briefly, but two unrelated events from the same account must not be stitched together. Search without later content access is discovery; full repository clones or full-table exports lack this selection boundary. NJT-0135 owns repeated checkpoints and NJT-0086 owns application-token provenance. Small read volume alone cannot distinguish lawful analysis or legal review from malicious collection."
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: "拿到协作平台用户会话的攻击者希望快速找到内部 VPN、客户或未公开项目资料，不愿下载整站。Mandiant 报告 UNC6661 在云应用中搜索此类词并记录了同一行动的 SharePoint 下载；这些材料支持场景存在，却没有证明某条特定搜索导致某个特定下载，应由本地日志确认。"
            en: "An attacker with a collaboration-platform user session may want VPN, customer, or unpublished-project information without downloading the entire site. Mandiant reports UNC6661 searches for such terms in cloud applications and documents a SharePoint download in the same activity. These observations support the scenario but do not prove that a specific query caused a specific download; local logs must establish that join."
      threat_model:
        attacker_model:
          paragraphs:
            - zh: "攻击者需要有权运行库内搜索或谓词查询并读取命中对象，且须掌握足够的业务词汇以减少无关命中。搜索索引不完整、权限限制或未知命名会使选择失效；为补足信息而扩展查询或导出，会增加可见度。"
              en: "The attacker needs permission to issue native search or predicate queries and read matching objects, and enough business vocabulary to limit irrelevant hits. Incomplete indexing, access restrictions, or unfamiliar naming can defeat selection; widening queries or exporting to compensate raises visibility."
        defender_model:
          paragraphs:
            - zh: "防守方需要搜索/查询审计、对象级成功访问、主体与会话、敏感标签及批准职责，并能在同一库内按时间和对象连接。Confluence Data Center Full 可给搜索词与附件下载，Microsoft 365 可给 SharePoint 搜索和文件访问，但查询词、页面正文访问或行级结果未必可用；缺字段时不能宣称验证了完整链。"
              en: "The defender needs search/query audit, object-level successful access, principal and session, sensitivity labels, and approved duties, joined by time and object in one repository. Confluence Data Center Full can expose terms and attachment downloads; Microsoft 365 can expose SharePoint search and file access. Query terms, page-body reads, or row-level results may be unavailable, and a missing field precludes claiming the full chain was verified."
    stealth_mechanisms:
      - mechanism_ref: "NM-BT"
        role: "primary"
        summary: {zh: 目标查询与少量读取落在批量提取告警盲点内, en: Targeted queries and few reads fall outside bulk-extraction alerts}
        analysis:
          paragraphs:
            - zh: "攻击者以语义或业务谓词提前筛除无关对象，随后只读取匹配资料，使短窗访问量较全量枚举和导出低。若检测仅看读取次数或导出作业，内容已被取得却不会达到其触发条件；搜索词、敏感文件访问、身份职责偏离仍然可见且应联合分析。公开报告不证明攻击者主观选择此方式专为规避检测，也没有给出告警下降率，因此机理维持低置信度。"
              en: "The attacker filters irrelevant objects with semantic or business predicates and then reads matching material, producing fewer short-window accesses than broad enumeration or export. A detector limited to read counts or export jobs may not trigger despite successful acquisition; terms, sensitive-file access, and deviation from role remain visible and should be joined. Public reporting neither proves the actor chose this pattern expressly to evade detection nor measures alert reduction, so the mechanism stays low confidence."
        evidence_keys: [T1213_R_MANDIANT_SEARCH, T1213_R_ATTACK_DET, T1213_R_ATLASSIAN_AUDIT]
        confidence: "low"
    research_limitations:
      paragraphs:
        - zh: "证据将攻击者关键词搜索、平台可记录搜索与读取、以及按批量提取检测的盲点联系起来，但未提供同一文件的查询—下载配对或对照实验。产品和许可影响搜索词、页面访问、附件下载的可见性；已授权员工、电子发现与秘密扫描均可能出现类似的少量高敏命中。若无法证明实际内容被读取，应退回发现阶段而非正式子项。"
          en: "Evidence links adversary keyword search, platform search/read telemetry, and the limitations of bulk-extraction detection, but supplies neither a same-file query-to-download pair nor a controlled comparison. Product and licensing affect visibility of terms, page access, and attachments; authorized staff, e-discovery, and secret scanning can produce similar small high-sensitivity hit sets. If actual content access cannot be proven, the case returns to discovery rather than this child."
defense_candidates:
  detection_strategies:
    - temporary_key: "T1213_DET_QUERY_READ_LINEAGE"
      name: {zh: 库内查询—敏感内容读取谱系, en: Repository Query-to-Sensitive-Read Lineage}
      objective:
        zh: "识别少量搜索后取得与职责不符的敏感库内容，覆盖单次低量读取而非只监测大批导出。"
        en: "Identify small search episodes followed by out-of-duty sensitive content acquisition, including low-volume reads rather than only bulk exports."
      subjects: [T1213_PARENT, T1213_CHILD_QUERY_SELECTIVE]
      domain: "enterprise"
      evidence_keys: [T1213_R_MANDIANT_SEARCH, T1213_R_M365_AUDIT, T1213_R_ATLASSIAN_AUDIT]
  detection_analytics:
    - temporary_key: "T1213_NJA_SHAREPOINT_SEARCH_READ"
      strategy_key: "T1213_DET_QUERY_READ_LINEAGE"
      platform: "Microsoft 365 SharePoint"
      logic:
        zh: "在已启用审计的租户中，按 UserId、会话/ClientIP 和时间关联 SharepointSearchQueryInitiated 或 SearchQueryPerformed 与后续 FileAccessed/FileDownloaded；对有敏感标签的 ObjectId/Site 计算该主体过去 30 日是否常用、是否属于职责站点，以及是否有批准调查工单。仅在能解析到实际文件读取且敏感性/职责偏离成立时输出；若日志没有查询词，只表述“搜索后敏感访问”，不声称关键词命中或因果。"
        en: "In an audited tenant, join SharepointSearchQueryInitiated or SearchQueryPerformed to later FileAccessed/FileDownloaded by UserId, session or ClientIP, and time. For labeled ObjectId/Site, compare the principal's preceding 30-day usage, role-owned sites, and approved investigation tickets. Emit only when actual file access and sensitivity or duty deviation are established; if terms are absent, report search followed by sensitive access without claiming a keyword hit or causal match."
      data_requirements:
        - source_type: "m365-sharepoint-search-audit"
          channel: "Microsoft Purview Audit / OfficeActivity"
          required_fields: [CreationTime, Operation, UserId, Workload]
        - source_type: "m365-sharepoint-file-audit"
          channel: "Microsoft Purview Audit / OfficeActivity"
          required_fields: [CreationTime, Operation, UserId, Workload, ObjectId]
        - source_type: "object-sensitivity-and-duty"
          channel: null
          required_fields: [object_id, sensitivity, authorized_roles, owner, approval_window]
      correlation_window: '0–60 minutes query to access; 30-day per-principal/site baseline, adapted to local workflow.'
      false_positives: 'Legal e-discovery, incident response, classification services, employee research, and migration jobs.'
      blind_spots: 'Query terms may not be present; FileAccessed is suppressed for repeated same-user/file accesses within five minutes; app@sharepoint and other system accounts need attribution; absent file read logs cannot establish acquisition.'
      tuning: 'Baseline by job, site, role, and sensitivity, not a global small-count threshold; keep approved-case exceptions time bounded and never suppress novel sensitive sites under a familiar account.'
      evidence_keys: [T1213_R_M365_AUDIT, T1213_R_M365_FIELDS, T1213_R_M365_GETSTARTED, T1213_R_MANDIANT_SEARCH]
    - temporary_key: "T1213_NJA_CONFLUENCE_SEARCH_ATTACHMENT"
      strategy_key: "T1213_DET_QUERY_READ_LINEAGE"
      platform: "Confluence Data Center with Full audit coverage"
      logic:
        zh: "在 Full 审计已启用时按用户和时间连接 Search performed 的词与随后 Attachment downloaded；若页面正文读取另有可靠访问日志，可扩展连接，但不能把搜索结果本身视为内容读取。对同一用户在非职责空间的敏感附件、罕见搜索词及未批准调查期加权，核查真实下载是否成功。"
        en: "With Full auditing enabled, join Search performed terms to later Attachment downloaded by actor and time. Extend to page-body reads only when reliable access logs exist; never treat a search result alone as content access. Weight sensitive attachments in out-of-duty spaces, rare terms, and activity outside approved investigation windows, and verify successful downloads."
      data_requirements:
        - source_type: "confluence-datacenter-search-audit"
          channel: "Full audit coverage"
          required_fields: [timestamp, actor, event, search_terms]
        - source_type: "confluence-datacenter-attachment-audit"
          channel: "Full audit coverage"
          required_fields: [timestamp, actor, event, attachment_id, space_id]
        - source_type: "repository-authorization-context"
          channel: null
          required_fields: [actor, space_id, assigned_role, approved_case, sensitivity]
      correlation_window: '0–60 minutes query to attachment download; 30-day actor/space baseline.'
      false_positives: 'Documentation maintainers, support engineers, legal review, and approved secret or compliance scans.'
      blind_spots: 'Base/Advanced coverage does not provide the cited search/download pair; page view is not listed as a Full audit event; search terms can be disabled, and version-specific schemas must be checked.'
      tuning: 'Require both search and successful attachment retrieval; baseline by space and role, exclude only approved bounded jobs, and retain a separate high-severity path for restricted spaces.'
      evidence_keys: [T1213_R_ATLASSIAN_AUDIT]
  mitigations:
    - temporary_key: "T1213_MIT_REPOSITORY_READ_SCOPE"
      name: {zh: 敏感信息库读取权限与审计治理, en: Sensitive Repository Read-Scope and Audit Governance}
      measures:
        - key: "sensitive-scope-review"
          control_type: "exposure-reduction"
          description_zh: "对高敏站点、空间、库和业务对象按实际职责分组授权，定期审查宽泛读取、共享链接和离职/转岗成员，保留业务 owner 的审批依据。"
          description_en: "Grant high-sensitivity sites, spaces, repositories, and business objects by real duties; periodically review broad read rights, sharing links, and departing or transferred members while retaining owner approval records."
        - key: "search-read-telemetry"
          control_type: "detective-support"
          description_zh: "对关键库启用搜索、对象读取及下载审计，验证保留期与字段、保护日志完整性，并把对象敏感性映射到稳定 ID。"
          description_en: "Enable search, object-read, and download audit for critical repositories, verify retention and fields, protect log integrity, and map sensitivity to stable object IDs."
      applications:
        - target_key: "T1213_PARENT"
          use_zh: "限制不相关主体对敏感协作、代码和业务库的读取，并在同一身份下保留从查询到实际内容访问的证据。"
          use_en: "Limit irrelevant principals' reads of sensitive collaboration, code, and business repositories and retain evidence from search to actual content access under the same identity."
          expected_effect_zh: "缩小可被普通账户悄然取得的内容集合，同时提高跨库调查的对象归属可见度。"
          expected_effect_en: "Shrinks the content a routine account can quietly acquire and improves object-attribution visibility across repositories."
          limitations_zh: "过度限制会妨碍协作；已授权用户仍可读取其职责内内容，缺少对象日志的产品仍有盲区。"
          limitations_en: "Excessive restriction impairs collaboration; authorized users can still read in-duty content, and products without object-level logs retain gaps."
        - target_key: "T1213_CHILD_QUERY_SELECTIVE"
          use_zh: "为高敏对象维持精确访问组与标签，启用查询和成功内容读取事件，并按业务职责复核小量高敏命中，而不是仅设下载量阈值。"
          use_en: "Maintain precise access groups and labels for high-sensitivity objects, enable query and successful-read events, and review small sensitive hit sets against business duty rather than relying only on download-volume thresholds."
          expected_effect_zh: "降低关键词筛选可命中的非职责内容，保留低量取用的上下文链，使攻击者必须扩大权限或暴露更多查询。"
          expected_effect_en: "Reduces out-of-duty content reachable by keyword filtering and preserves context for low-volume reads, forcing the actor to expand privileges or expose more queries."
          limitations_zh: "合法调查与安全扫描仍会命中敏感内容；日志许可、页面访问缺项及未标记对象会削弱控制效果。"
          limitations_en: "Legitimate investigations and security scans still hit sensitive content; licensing, absent page-read logs, and unlabeled objects reduce effectiveness."
      evidence_keys: [T1213_R_MS_SAM, T1213_R_M365_AUDIT, T1213_R_ATLASSIAN_AUDIT]
