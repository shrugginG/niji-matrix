    - key: "T1213_R_ATLASSIAN_AUDIT"
      url: "https://confluence.atlassian.com/doc/audit-log-events-in-confluence-1005333793.html"
      source_type: "official-platform-documentation"
      supports: 'Confluence Data Center Full-level Search performed with terms and Attachment downloaded; page view is not among listed end-user audit events, and search-term logging may be disabled.'
    - key: "T1213_R_GITHUB_AUDIT"
      url: "https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization"
      source_type: "official-platform-documentation"
      supports: 'git.clone/git.fetch audit events and Git event access/retention constraints; not evidence that code-search terms or file-content reads are logged.'
    - key: "T1213_R_MS_SAM"
      url: "https://learn.microsoft.com/en-us/sharepoint/advanced-management"
      source_type: "official-platform-documentation"
      supports: 'Site-level least-privilege, oversharing reports, and access restriction measures for SharePoint/OneDrive; not universal to all repositories.'
  claims:
    - key: "T1213_CLM_PARENT_SCOPE"
      proposition_zh: "信息库存储可用于后续行动的协作与业务内容，只有成功获取内容才成立本 Collection 判断；库产品不是匿迹变量。"
      proposition_en: "Information repositories store collaboration and business content useful to later operations; successful content acquisition is needed for this Collection classification, and repository product is not a stealth variable."
      evidence_keys: [T1213_R_ATTACK_PARENT]
    - key: "T1213_CLM_SEARCH_READ"
      proposition_zh: "UNC6661 在云应用中按高价值词检索，且同一行动出现 SharePoint 文件下载；源未证明每条查询与文件的一对一关系或告警降低。"
      proposition_en: "UNC6661 searched cloud applications for high-value terms and SharePoint file downloads occurred in the same activity; the source does not prove a one-to-one query/file link or reduced alerts."
      evidence_keys: [T1213_R_MANDIANT_SEARCH]
    - key: "T1213_CLM_TELEMETRY"
      proposition_zh: "Microsoft 365 与 Confluence Data Center 在特定配置下可提供搜索和内容访问事件，但字段、许可与保留限制会改变可验证的因果范围。"
      proposition_en: "Microsoft 365 and Confluence Data Center can provide search and content-access events under specified configurations, but fields, licensing, and retention alter which causal links can be verified."
      evidence_keys: [T1213_R_M365_AUDIT, T1213_R_M365_GETSTARTED, T1213_R_ATLASSIAN_AUDIT]
    - key: "T1213_CLM_LOW_VOLUME_INFERENCE"
      proposition_zh: "针对少量对象的选择性读取可能躲开只统计短窗批量访问的规则；这是从已知日志和规则类型作出的条件性分析推断，非公开事件实测结论。"
      proposition_en: "Selective reads of a few objects may escape a rule that counts only short-window bulk access; this is a conditional analytic inference from known logs and rule types, not a measured public-incident result."
      evidence_keys: [T1213_R_MANDIANT_SEARCH, T1213_R_ATTACK_DET]
  cases:
    - key: "T1213_CASE_UNC6661"
      status: "candidate-only"
      event_zh: "2026 年 1 月 UNC6661 在遭入侵 SaaS 中搜索敏感词，Mandiant 同篇给出 SharePoint 文件下载日志。"
      event_en: "In January 2026 UNC6661 searched compromised SaaS for sensitive terms, and Mandiant supplied a SharePoint file-download log in the same report."
      limit: 'Do not claim specific query-to-file causation, low volume, evasion intent, or alert suppression from this source alone.'
      evidence_keys: [T1213_R_MANDIANT_SEARCH]
