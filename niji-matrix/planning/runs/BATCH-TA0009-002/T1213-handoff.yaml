research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 6
    attack_subtechnique_ids: [T1213.003, T1213.001, T1213.004, T1213.006, T1213.005, T1213.002]
    represented_dimensions: [code-control, collaboration-documents, structured-business-data, database-queries, messaging-content]
    breadth_trigger: "six-plus-explicit-coverage-and-second-pass"
    coverage_table_path: "planning/runs/BATCH-TA0009-002/T1213-taxonomy-coverage.yaml"
    second_pass_required: true
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: "6:1 差距按六项覆盖和二轮轴排除解释，但唯一子项为低置信度条件建议；主 Agent 须决定是接受还是把分类置 deferred。"
      en: "Six-to-one breadth is explained through six-row coverage and second-pass rejections, but the sole child is a low-confidence conditional proposal; the primary agent must accept it or defer taxonomy."
  evidence_coverage:
    parent_behavior_keys: [T1213_R_ATTACK_PARENT]
    boundary_keys: [T1213_R_ATTACK_PARENT, T1213_R_GITHUB_AUDIT, REF-000178]
    mechanism_support: [T1213_R_MANDIANT_SEARCH, T1213_R_ATTACK_DET, T1213_R_M365_AUDIT]
    child_existence_support: [T1213_R_MANDIANT_SEARCH, T1213_R_ATLASSIAN_AUDIT, T1213_R_M365_AUDIT]
    unsupported_or_deferred:
      - 'No observed same-object query-to-download linkage or measured decrease in alerts.'
      - 'No conclusion-level support for in-place viewing, cross-principal dilution, or API-type split as formal children.'
      - 'No universal search-text, page-view, row-level-read, or clone-content telemetry across products.'
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: "已按 NJT-0001 的字段责任检查定义、特性、边界、攻防模型、机理、证据及限制；子项草案是条件研究建议，不表示已通过人工评审。"
      en: "Draft fields were checked against NJT-0001 responsibilities for definition, properties, boundaries, attacker/defender models, mechanism, evidence, and limits; the child remains a conditional research proposal, not human-approved content."
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [fixed-baseline-inventory-reading, shared-library-lookup]
  limitations:
    paragraphs:
      - zh: "目前事件证据足以证明信息库搜索与内容取得在真实入侵中出现，官方文档也确认部分搜索、文件访问与下载日志，但没有实测证明选择性读取降低告警，更不能把同篇报告里的搜索和单条下载推断为同一文件的链。因此父技术适配为 medium，唯一子项与 NM-BT 推断为 low；若主审认为需要更强的同对象证据，应维持子项 deferred。"
        en: "Incident evidence establishes repository search and content acquisition in real intrusions, and official documentation confirms some search, file-access, and download telemetry. It does not measure reduced alerts from selective reading or make a same-file chain out of searches and one download appearing in the same report. The parent adaptation is therefore medium confidence, while the sole child and NM-BT inference are low; if the primary reviewer requires stronger same-object evidence, the child should remain deferred."
      - zh: "库访问审计高度依赖服务、许可证和设置。SharePoint 搜索事件可能由系统账户产生，重复文件访问会受到抑制；Confluence Full 日志可能有搜索词和附件下载却不提供页面正文读取；GitHub Git 事件的保留和访问方式不同。任何正式分析只能声明实际启用并验证过的字段，不能将平台事件名当成所有信息库的通用可见性。"
        en: "Repository access auditing depends heavily on service, license, and configuration. SharePoint search events may come from system accounts and repeat file access is suppressed; Confluence Full logs can include terms and attachment downloads without page-body reads; GitHub Git events have different access and retention. A formal analytic may claim only fields actually enabled and validated, not treat a platform event name as universal visibility."
  rejected_mechanisms:
    - 'NM-FD for existing integration principal: already NJT-0086/NJS-0086-003, no independent repository-read disguise variable.'
    - 'NM-ST for mere small read volume: quantity reduction alone is not dispersion across time or space.'
    - 'NM-DO for ordinary encrypted TLS or hidden content: repository retrieval has no evidence of altered data form.'
  open_questions:
    - 'Can a source or local test prove a specific sensitive query led to a successful read of the matching object, not merely same-campaign proximity?'
    - 'Should the low-confidence query-led child be formal, or should parent taxonomy remain deferred until direct trace-effect evidence exists?'
    - 'Which services in the target deployment expose stable query, object, principal, and result identifiers for a reliable analytic?'
