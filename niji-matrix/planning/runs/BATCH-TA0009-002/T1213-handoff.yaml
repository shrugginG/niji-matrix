    - key: "T1213_R_MANDIANT_SEARCH"
      url: "https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft"
      source_type: "incident-report"
      supports: 'Mandiant/GTIG reports UNC6661 keyword searches for sensitive cloud documents and gives a SharePoint FileDownloaded audit example in the same operation; no per-object query/download pairing or measured stealth benefit.'
    - key: "T1213_R_M365_AUDIT"
      url: "https://learn.microsoft.com/en-us/purview/audit-log-activities"
      source_type: "official-platform-documentation"
