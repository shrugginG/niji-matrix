schema_version: 1.0.0
type: planning-only-taxonomy-coverage
batch_ref: BATCH-TA0009-002
work_item_ref: WORK-TA0009-T1213
temporary_key_prefix: T1213_
baseline:
  domain: enterprise-attack
  version: '19.1'
  source: data/mitre-attck/enterprise/v19.1/excel/enterprise-attack-v19.1-techniques.xlsx
  attack_subtechnique_count: 6
  attack_subtechnique_ids: [T1213.003, T1213.001, T1213.004, T1213.006, T1213.005, T1213.002]
  original_attack_subtechniques_imported: false
first_pass:
  represented_dimensions:
    - 'Code repositories: source-control content and clone/fetch APIs; this is a repository/transport dimension.'
    - 'Confluence and SharePoint: collaborative knowledge/document surfaces; these are products, not stealth mechanisms.'
    - 'CRM software and databases: structured business records and query/export APIs; data model differs, evasion need not.'
    - 'Messaging applications: channel/thread histories; email message stores are reserved for T1114.'
  coverage_resolutions:
    - attack_child_id: T1213.003
      name_en: Code Repositories
      resolution: niji-variable-candidate
      explanation_zh: 私有代码库读取属父级内容获取；关键词、路径或提交范围驱动的少量内容读取可为选择性读取轴提供对照，但 git clone/fetch 的量与日志属于实现，不自动构成 NJS。
      explanation_en: Private-code reads are parent behavior; keyword, path, or commit-scoped reads inform the selective-read axis, while git clone/fetch volume and telemetry are implementations rather than automatic NJS boundaries.
    - attack_child_id: T1213.001
      name_en: Confluence
      resolution: niji-variable-candidate
      explanation_zh: 产品本身不成轴；可检验搜索词与后续附件下载或页面取用的选择关系，且 Data Center Full 审计与云版可见性不同。
      explanation_en: The product is not an axis; search terms followed by attachment or page retrieval can test selection, but Data Center Full auditing and cloud visibility differ.
    - attack_child_id: T1213.004
      name_en: Customer Relationship Management Software
      resolution: parent-core
      explanation_zh: CRM 记录的查询/导出属于内容获取；受信连接器 token 的来源和持续授权另属 NJT-0086，不能改名为 T1213 子项。
      explanation_en: Querying/exporting CRM records is core acquisition; co-option of a trusted connector token and durable grant belongs to NJT-0086 and cannot be relabeled as a T1213 child.
    - attack_child_id: T1213.006
      name_en: Databases
      resolution: parent-core
      explanation_zh: 结构化查询和结果返回是父级行为；SQL、驱动和数据库产品不是匿迹变量，低量谓词查询若有对象级结果证据才可进入选择性读取轴。
      explanation_en: Structured queries and returned rows are parent behavior; SQL dialect, driver, and database product are not stealth variables, while low-volume predicate queries inform selection only with object-level result evidence.
    - attack_child_id: T1213.005
      name_en: Messaging Applications
      resolution: parent-core
      explanation_zh: 聊天历史和协作消息可在父级；邮件消息与附件由 T1114 负责。按消息平台另设子项无法证明不同匿迹因果。
      explanation_en: Chat and collaboration histories may be parent scope; mail messages and attachments belong to T1114. Splitting by messaging platform lacks a separate stealth causal chain.
    - attack_child_id: T1213.002
      name_en: Sharepoint
      resolution: niji-variable-candidate
      explanation_zh: 文档库搜索—文件读取是选择性读取轴的主要可观测实现；SharePoint/OneDrive 名称和文件格式都不是 NJS 边界。
      explanation_en: Search-to-file access in a document library is a key observable implementation of selective reading; SharePoint/OneDrive labels and file formats are not NJS boundaries.
second_pass:
  completed: true
  axes_examined:
    - key: T1213_QUERY_SELECTIVE_READ
      status: conditional-formal-proposal
      controlled_variable: 'Select repository-native semantic search/predicate filtering and a small matching read set instead of broad enumeration or export.'
      trace_change: 'Search events and a bounded number of high-value content reads replace a conspicuous broad read/export episode; file/row access still remains.'
      defender_difference: 'Join search or query context to sensitive object access and account work context; short-window volume thresholds alone are insufficient.'
      prerequisites: 'Readable repository, search/query rights, and attacker knowledge of useful terms or business objects.'
      evidence_keys: [T1213_R_MANDIANT_SEARCH, T1213_R_M365_AUDIT, T1213_R_ATLASSIAN_AUDIT, T1213_R_ATTACK_DET]
      confidence: low
      caveat: 'Mandiant reports adversary searches and a SharePoint download example in the same campaign, but does not prove each downloaded object followed a specific search or quantify evasion; require primary review before canonical child admission.'
    - key: T1213_EXISTING_INTEGRATION_PRINCIPAL
      status: adjacent-technique
      reason: 'NJT-0086/NJS-0086-003 already owns existing vendor integration control co-option and its app/client-token-resource correlation; UNC6395 adds no repository-read-specific trace variable.'
      reuse_refs: [NJT-0086, NJS-0086-003, REF-000178, CLM-000358, CASE-000064, DET-000067, NJA-000046, MIT-000066]
    - key: T1213_INCREMENTAL_OR_SCHEDULED_READ
      status: adjacent-technique
      reason: 'Timing/checkpoint/repeated acquisition is the direct orchestration variable of NJT-0135/NJS-0135-001; repository is only its source.'
      reuse_refs: [NJT-0135, NJS-0135-001]
    - key: T1213_IN_PLACE_VIEW_NO_EXPORT
      status: evidence-deferred
      reason: 'Potential difference between view/search and export logs, but no conclusion-level incident source establishes intentional in-place acquisition with separable effect across repositories; some products do not log page views.'
    - key: T1213_CROSS_PRINCIPAL_DISTRIBUTION
      status: evidence-deferred
      reason: 'Multiple account/source distribution could dilute per-principal volume, but available cases do not establish coordinated repository reads, stable sibling boundary, or distinct control.'
    - key: T1213_NATIVE_BULK_EXPORT_VS_API_QUERY
      status: not-stealth-distinct
      reason: 'A transport/API and workload distinction unless a changed trace/defender conclusion is independently proven; UNC6395 bulk query jobs are not low-volume selective reads.'
    - key: T1213_POST_QUERY_JOB_DELETION
      status: adjacent-technique
      reason: 'GTIG observed UNC6395 delete query jobs, but deletion is a later anti-forensic action and did not remove audit logs; it is not repository acquisition taxonomy.'
    - key: T1213_LINK_SHARE_OR_SYNC_OUT
      status: adjacent-technique
      reason: 'External sharing and synchronization are transfer/exfiltration or staging decisions after repository content is selected.'
breadth_gap:
  proposed_formal_niji_children: 1
  acceptable_only_after_primary_review: true
  explanation_zh: 六个 ATT&CK 子项主要按库产品、内容模式和接口划分。二轮搜索只得到一条可能独立的库内选择轴；集成身份与状态化增量分别已有正式对象，原位阅读和多主体稀释缺少结论级证据，接口与批量导出不是独立匿迹变量。因此 6:1 差距是有解释的研究结果，须由主 Agent 审核选择性读取是否达到正式低置信度门槛；若未达到应设 taxonomy deferred，而非补造子项。
  explanation_en: The six ATT&CK children divide mainly by product, content model, and interface. The second pass found one potentially independent in-repository selection axis. Integration identity and checkpointed acquisition already have formal owners; in-place viewing and cross-principal dilution lack conclusion-level support, while API choice and bulk export are not standalone stealth variables. The 6:1 gap is thus explained, but the primary reviewer must decide whether selective reading meets even a low-confidence formal gate; otherwise taxonomy should be deferred rather than padded.
