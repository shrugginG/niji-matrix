research:
  source_baseline:
    path: data/mitre-attck/enterprise/v19.1/excel/enterprise-attack-v19.1-techniques.xlsx
    row_id: T1557
    tactics:
    - Collection
    - Credential Access
    version: '2.5'
    verified_with_local_xlsx: true
    online_version_caveat: Live ATT&CK may have changed; use the local workbook as fixed 19.1.
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids:
    - T1557.001
    - T1557.002
    - T1557.003
    - T1557.004
    represented_dimensions:
    - zh: 名称解析伪答与 SMB/NTLM 中继
      en: Name-resolution spoofing and SMB/NTLM relay
    - zh: ARP 邻居映射替换
      en: ARP neighbor-mapping replacement
    - zh: DHCP 网络配置伪权威
      en: Rogue DHCP network-configuration authority
    - zh: 无线接入点身份模仿
      en: Wireless access-point identity imitation
    breadth_trigger: examine_two_or_more_axes
    coverage_resolutions:
    - attack_id: T1557.001
      resolution: adjacent-technique
      rationale:
        zh: 固定页主要描述获取或中继认证材料；名称解析可为内容路径提供入口，但没有内容流证据时仍属于 NJT-0136 或父级路径线索。
        en: The fixed child chiefly describes acquiring or relaying authentication material. Name resolution can initiate
          a content path, but without content-flow evidence it remains NJT-0136 or a parent-level path lead.
    - attack_id: T1557.002
      resolution: parent-core
      rationale:
        zh: ARP 改写可实现主动路径介入，却不独立决定筛选范围、内容可读性或正常交易外观。
        en: ARP rewriting can implement active path intervention but does not independently determine selection, content readability,
          or ordinary transaction appearance.
    - attack_id: T1557.003
      resolution: parent-core
      rationale:
        zh: DHCP 伪权威提供路径方向，只有附加的内容流和筛选或可信终止证据才进入拟议 NJS。
        en: Rogue DHCP supplies a path direction; a proposed NJS still needs additional content-flow plus selection or trusted-termination
          evidence.
    - attack_id: T1557.004
      resolution: niji-variable-candidate
      rationale:
        zh: 伪 AP 是接入媒介而不是子项；固定页所述自定义证书提示可检验的可信终止轴，但正式证据来自独立现场测量而非把无线标签导入。
        en: A rogue AP is an access medium, not a child. Its mention of custom certificates points to a testable trusted-termination
          axis, supported formally by independent field measurement rather than import of a wireless label.
    candidate_stealth_axes_examined:
    - axis: T1557C_CHILD_SELECTIVE
      variable: selected domain, endpoint, path, or period of readable content interception
      trace_change: substitute certificate and route differences confined to target-domain and affected-path intersection
      defender_difference: compare same domain across paths and different domains on one path, with endpoint TLS acceptance
        and content request
      evidence_urls:
      - https://censoredplanet.org/assets/Kazakhstan.pdf
      evidence_supports: observed SNI/path selection and sparse substitute certificates, not measured alert-rate reduction
        or retained content
      normal_counterexamples:
      - approved selective enterprise proxy
      - CDN edge selection
      - staged network migration
      resolution: propose_formal_child_at_medium_confidence
    - axis: T1557C_CHILD_TRUSTED_TERMINATION
      variable: client-accepted TLS terminator differs from real origin while content is forwarded
      trace_change: copied certificate names and unchanged test response with different key, issuer, trust root, and upstream
        TLS client
      defender_difference: join endpoint accepted chain, independent origin chain, trust-root ownership, and origin-side upstream
        source
      evidence_urls:
      - https://censoredplanet.org/assets/Kazakhstan.pdf
      - https://blog.mozilla.org/security/2019/08/21/protecting-our-users-in-kazakhstan/
      evidence_supports: observed replacement certificate/upstream connection and technical plaintext access, not copying
        of particular user content
      normal_counterexamples:
      - approved TLS inspection gateway
      - debugging proxy
      - CDN certificate variation
      resolution: propose_formal_child_at_medium_confidence
    - axis: content-preserving-relay-alone
      variable: request/response forwarding without a distinct trust or selection condition
      trace_change: ordinary forwarding is intrinsic to many proxies and need not change a stable stealth variable
      defender_difference: requires the same two-leg comparison as trusted termination
      resolution: parent-core_or_merge_into_trusted_termination
    - axis: protocol-or-medium
      variable: DNS versus DHCP versus ARP versus Wi-Fi
      trace_change: different packet surfaces but no invariant content-specific stealth effect
      defender_difference: sensor placement changes, not a distinct Niji causal variable
      resolution: reject_as_child
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 四项固定子项逐项覆盖；两个拟议子项分别按介入范围和受信可读终止划分，可共现而不能以原 ATT&CK 协议或媒介标签命名。保留正文复制结论的严格证据门槛。
      en: All four fixed children have coverage resolutions. The two proposed children divide by interception scope and trusted
        readable termination, can coexist, and are not named after ATT&CK protocol or medium labels. Claims about copying
        content retain a strict evidence threshold.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000488
    - T1557C_REF_KAZAKH_PAPER
    boundary_keys:
    - REF-000488
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
    mechanism_support:
    - mechanism: NM-ST
      evidence_keys:
      - T1557C_REF_KAZAKH_PAPER
      level: observed_selection_plus_inferred_defender_effect
    - mechanism: NM-FD
      evidence_keys:
      - T1557C_REF_KAZAKH_PAPER
      - T1557C_REF_MOZILLA_KAZAKH
      level: measured_certificate_and_response_plus_protocol_inference
    child_existence_support:
    - child_key: T1557C_CHILD_SELECTIVE
      evidence_keys:
      - T1557C_REF_KAZAKH_PAPER
      level: field-measured-selection
    - child_key: T1557C_CHILD_TRUSTED_TERMINATION
      evidence_keys:
      - T1557C_REF_KAZAKH_PAPER
      - T1557C_REF_MOZILLA_KAZAKH
      level: field-measured-tls-split_and_vendor-explanation
    unsupported_or_deferred:
    - No seized intermediary flow log proves storage, export, or later use of a specific user's general content.
    - No content acquisition may be inferred from DHCP/DNS/ARP/Wi-Fi redirection alone.
    - The measured lack of changes in test responses cannot prove all real traffic was unmodified.
    - A substitute certificate visible on a failed TLS connection does not prove plaintext access.
    - mitmproxy documentation proves capability only, not adversarial deployment or detection evasion.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级和两项子级分别给出直接内容对象、可读性门槛、攻击者条件、防守遥测、正常反例与证据层级；与 NJT-0001 只对照字段职责及论证深度，没有借用扫描内容。
      en: Parent and both children separately specify the direct content object, readability threshold, attacker prerequisites,
        defender telemetry, benign lookalikes, and evidence levels. NJT-0001 was used only to compare field responsibilities
        and argument depth, not scanning content.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed XLSX XML row extraction
    - YAML serialization
  limitations:
    paragraphs:
    - zh: 本批最强现场资料是运营商级 HTTPS 介入，研究者没有进入中间设备，所以“内容可被解密”比“指定正文确已保存”更强。正式对象可以描述可读的内容路径，但案例和 Analytic 必须把介入、可读终止和已证复制分级；若主 Agent
        认为 Collection 准入必须有已复制的特定内容，则应暂缓正式 NJT 而非把凭据事件或工具能力升级为内容证据。
      en: The strongest field source is carrier-scale HTTPS interception, and researchers did not access the intermediary.
        Thus the case supports content decryptability more strongly than retention of a specified body. A formal object can
        describe a readable content path, but its case and analytics must distinguish intervention, readable termination,
        and proven copying. If the primary agent judges that Collection admission requires a specific copied item, it should
        defer a formal NJT rather than promote credential incidents or tool capability into content evidence.
    - zh: 域/路径选择性和可信 TLS 终止来自同一现场案例，说明两种变量可共现，但不能据此假定它们在每种协议上均独立实现。TLS 1.3 的被动网络观察、ECH、端到端应用加密、CDN 证书轮换和无源站协作均限制所提检测；窗口与字段是可实施起点，须由部署条件校准。
      en: Domain/path selection and trusted TLS termination come from one field case, showing that the variables can coexist
        but not that each operates independently in every protocol. Passive network observation of TLS 1.3, ECH, application-layer
        end-to-end encryption, CDN certificate rotation, and missing origin cooperation limit the proposed analytics. Windows
        and fields are implementation starting points requiring deployment-specific calibration.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason:
      zh: 来源证明受信 TLS 终止使明文可读，没有证据显示攻击者另行混淆或隐藏数据本身。
      en: Sources establish plaintext readability through trusted TLS termination, not a separate act of obfuscating or hiding
        the data itself.
  - mechanism_ref: NM-BT
    reason:
      zh: 不同观察点确有分散事实，但尚无证据证明关键行为完全落在监测范围外；与 NM-FD 的正常外观重复计数不合适。
      en: Vantage points hold separated facts, but evidence does not show the critical behavior wholly outside monitoring;
        counting it again beyond NM-FD's normal appearance is not justified.
  open_questions:
  - zh: 受害组织或服务商能否提供中间节点流记录、原始内容副本或后继利用，以证明具体正文而非仅可读机会？
    en: Can a victim or provider supply intermediary flow records, original content copies, or downstream use proving a particular
      body rather than only a readable opportunity?
  - zh: 共享 MIT-000131 能否安全改写其认证专用摘要并增加内容应用，还是应按控制对象拆分？
    en: Can MIT-000131's credential-specific summary be generalized safely with content applications, or should the control
      be split by direct object?
  - zh: 部署能否取得终端实际接受的证书链、根信任变更、独立源站证书和服务端入口握手？
    en: Can the deployment obtain endpoint-accepted chains, trust-root changes, independent origin certificates, and origin-side
      inbound handshakes?
