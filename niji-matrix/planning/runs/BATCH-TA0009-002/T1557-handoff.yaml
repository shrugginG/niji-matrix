    description:
      zh: 研究者在 2019 年 7 至 8 月测到哈萨克斯坦特定网络路径对通信站点 SNI 注入 Qaznet 签发的证书，并在自控源站看到中间节点的上游握手；测试响应未见头部或正文改动。此案例只证明选择性中间介入和可读终止机会，不证明运营方已保存某份用户内容。
      en: From July to August 2019, researchers measured Qaznet-issued certificate injection for communications-site SNIs
        on particular Kazakhstan network paths and observed the intermediary's upstream handshake at an origin they controlled.
        Test response headers and bodies were not observed to change. This case proves selective intermediary positioning
        and a readable-termination opportunity, not retention of any user's particular content.
