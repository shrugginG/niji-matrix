library_candidates:
  references:
  - temporary_key: T1557C_REF_KAZAKH_PAPER
    decision: create
    identity: Raman, Evdokimov, Wustrow, Halderman, Ensafi, Investigating Large Scale HTTPS Interception in Kazakhstan, ACM
      IMC 2020, DOI 10.1145/3419394.3423665
    url: https://censoredplanet.org/assets/Kazakhstan.pdf
    source_type: original-research
    locator: pp. 1–5, especially §3.2 and §4.2.3–4.2.5
    supports:
    - Observed interception was selected by affected SNI, a particular network path, and a valid origin certificate.
    - A Qaznet-signed replacement certificate was observed for selected connections, not for control domains.
    - Replacement certificates copied Subject/SAN but changed public key, serial, extensions, and issuer chain.
    - A controlled origin server saw the interceptor's upstream TLS handshake; tested response headers/body showed no observed
      change.
    - Twenty-seven communications-site SNIs triggered in initial testing; 37 of Alexa top 10,000 domains triggered in the
      broader survey. These are different measured sets, not contradictory counts.
    does_not_support:
    - The operator stored or exported a particular real user's content.
    - All intercepted sessions were unchanged or all affected users trusted the root.
    - An enterprise detector's alert rate was empirically lowered.
  - temporary_key: T1557C_REF_MOZILLA_KAZAKH
    decision: create
    identity: Mozilla Security Blog, Protecting our Users in Kazakhstan, Wayne Thayer, 2019-08-21
    url: https://blog.mozilla.org/security/2019/08/21/protecting-our-users-in-kazakhstan/
    source_type: original-vendor-response
    supports:
    - Client installation of the custom root lets the interceptor issue accepted site certificates and decrypt communications.
    - Firefox and Chrome blocked that specific root even if locally installed.
    does_not_support:
    - Copying, retention, or downstream use of any particular message.
    - A generic browser policy to block every enterprise inspection root.
  - temporary_key: T1557C_REF_MITMPROXY
    decision: defer
    identity: mitmproxy project original documentation, https://docs.mitmproxy.org/stable/
    url: https://docs.mitmproxy.org/stable/
    supports:
    - transparent_and_reverse_proxy_modes
    - TLS_interception_and_full_HTTP_flow_capture
    does_not_support:
    - malicious_field_incident
    - actual_evasion_effect
    reason: Capability corroboration only; the measured Kazakhstan case is stronger for the proposed children.
