handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-002
work_item_ref: WORK-TA0009-T1557
temporary_key_prefix: T1557C_
candidate:
  source_type: attack
  source_attack_id: T1557
  source_attack_version: '19.1'
  name:
    zh: 攻击者居中
    en: Adversary-in-the-Middle
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿将 T1557 同时归入 Collection 和 Credential Access，父行为是主动使通信经过攻击者控制的位置，以支持信息收集等后续行为。TA0006
        的 NJT-0136 已有意收窄为凭据承载路径、认证交换或认证证明；它的两项子技术及检测均以认证结果为直接对象，不能承载一般通信正文、附件或业务响应的取得。TA0009 应另立经过范围改写的父技术，以主动路径介入和可证实的通信内容接触为必要条件；只有
        DNS、ARP、DHCP、无线或证书异常而没有内容承载会话时，仍只是路径调查线索。
      en: The fixed ATT&CK Enterprise 19.1 workbook maps T1557 to both Collection and Credential Access and defines the parent
        as active positioning of adversary-controlled infrastructure in a communication path to enable information collection
        and other follow-on acts. Existing TA0006 NJT-0136 deliberately narrows this behavior to credential-bearing paths,
        authentication exchanges, and proofs. Its two children and analytics have authentication outcomes as their direct
        object and cannot represent access to ordinary message bodies, attachments, or business responses. TA0009 therefore
        needs a separately adapted parent requiring active path intervention and evidenced access to a content-bearing exchange.
        A DNS, ARP, DHCP, wireless, or certificate anomaly alone remains a path lead without a content-flow link.
    - zh: 2019 年哈萨克斯坦 HTTPS 拦截的原始测量记录了按域名和路径选择的证书替换、面向真实站点的上游握手以及测试响应未见头部或正文变化，因而足以支持选择性内容流介入与可信终止转发两个候选匿迹轴。Mozilla 对受信自定义根证书使中间节点能够解密网站通信的解释补足技术因果链。这些来源并未取得拦截节点的存储记录或证明哪一份真实用户正文被保存；正式案例和事件判断必须把“明文可接触”与“特定内容已收集”分层表述。
      en: Original measurements of Kazakhstan's 2019 HTTPS interception recorded domain- and path-selective certificate substitution,
        an upstream handshake to the real site, and no observed header or body change in test responses. They support two
        candidate stealth axes, selective content-flow interception and trusted termination with forwarding. Mozilla's explanation
        of decryption through a trusted custom root supplies the technical causal link. These sources did not obtain the interceptor's
        storage records or prove that any specific real user's message was saved. A formal case and incident decision must
        distinguish plaintext accessibility from confirmed acquisition of particular content.
  scope_notes:
    zh: 直接对象是仍在传输的非凭据通信内容及其读取机会；同一路径若同时涉及凭据和正文，可分别标注 TA0006 与 TA0009，但须各有对象证据。T1040 处理不改变路径的被动嗅探，T1114/T1213 等处理后来从邮箱或资料库读取的静态内容，T1565.002
      处理传输内容改写，T1689/T1600 处理降级或加密保护削弱结果。
    en: The direct object is non-credential content in transit and a demonstrable opportunity to read it. A path carrying
      both credentials and message content may justify both TA0006 and TA0009 only with separate evidence for each object.
      T1040 owns passive observation without path intervention; T1114/T1213 own later reads from mailboxes or repositories;
      T1565.002 owns modification of transmitted content; T1689/T1600 own downgrade or weakened-protection outcomes.
  original_attack_subtechniques_imported: false
proposed_content:
  temporary_key: T1557C_PARENT
  name:
    zh: 通信内容路径中间介入
    en: Content-Path Adversary-in-the-Middle
  summary:
    zh: 攻击者主动改变通信路径或受信终止点，使正在交换的一般内容可被其中间节点读取，同时保留足以维持会话的正常外观。
    en: An adversary actively changes a communication path or trusted termination point so an intermediary can read ordinary
      content in transit while preserving enough of the expected exchange to keep the session going.
  definition_and_concept:
    paragraphs:
    - zh: 通信内容路径中间介入是攻击者让一段原本应在终端与真实服务之间完成的内容交换经过自己可控制的转发或终止点，并在那里接触请求、响应、消息或附件的可读内容。该行为可由被接受的名称和网关指向、接入网络、代理配置或受信 TLS 证书实现；实现媒介并非分类基础。它区别于单纯占据链路的位置，因为本战术需要证明内容承载会话确实走过该节点，以及协议与密钥状态允许其读取内容。
      en: Content-Path Adversary-in-the-Middle routes an exchange that should occur between an endpoint and a real service
        through an adversary-controlled forwarding or termination point, where readable requests, responses, messages, or
        attachments become accessible. Accepted name and gateway directions, access networks, proxy settings, or a trusted
        TLS certificate can create the position; the medium does not define the technique. Merely occupying a path is insufficient
        for Collection; evidence must link a content-bearing session to the intermediary and show that protocol and key state
        allow it to read the content.
    - zh: 本技术所说的收集既可表现为对明文流的实时检查，也可表现为复制或留存；两者需要不同的证据。转发到真实服务可以让用户继续得到预期内容，从而保持使用体验与服务端交易记录的连续性，但不会抹去路径、证书、上游来源或终端信任状态的差异。若只能证明攻击者能引流或拥有代理软件，却不能证明目标内容到达该点，应保留为候选而非宣称已收集。
      en: Collection here may mean live inspection of plaintext or copying and retention, and the latter requires stronger
        evidence. Forwarding to the real service can preserve the user's expected result and the service's transaction continuity,
        but it leaves differences in route, certificate, upstream source, or endpoint trust state. If evidence shows only
        an ability to redirect or possession of proxy software without a target content flow reaching that point, the event
        remains a candidate rather than confirmed collection.
  stealth_characteristics:
    paragraphs:
    - zh: 攻击者可以只在少数目的域、网络路径或时段插入内容流，使未命中的连接提供看似正常的对照，并削弱以全网平均故障率或持续网关漂移为条件的告警。中间节点也可保持请求与响应不变，仍使用目标站点名称或相似证书字段，令终端和服务端各自的应用日志显示正常交易。选择性控制介入范围与伪装受信终止点是不同变量：前者改变痕迹分布，后者改变可读性和应用层外观。
      en: An actor can insert itself only for chosen domains, paths, or periods, leaving unaffected connections as apparently
        ordinary controls and weakening alerts that depend on network-wide failure rates or persistent gateway drift. An intermediary
        can also keep requests and responses unchanged while presenting the expected site name or similar certificate fields,
        leaving ordinary-looking transactions in endpoint and service application logs. Selection controls trace distribution;
        trusted termination controls readability and application appearance. They are distinct variables.
    - zh: 残余痕迹包括同一目的地在不同路径或设备上呈现不同证书链、终端突然信任新的根、实际服务观察到代理而非原终端的握手，以及受影响域名与未受影响域名之间的差异。只有端点应用日志或目标服务访问日志时，这些差异可能被拆散；把客户端所见证书、独立观察点的真实证书、路径历史和服务端上游来源相连，才能检验中间节点是否真的有可读机会。TLS
        1.3 等协议环境下，被动网关未必看得到客户端收到的证书，须有端点或主动测量遥测。
      en: Residue includes different certificate chains for the same destination across paths or devices, a newly trusted
        root on an endpoint, the origin service seeing a proxy rather than the original client handshake, and differences
        between selected and unselected domains. Endpoint application logs or origin access logs alone can separate these
        facts. Joining the certificate seen by the client, the real certificate from an independent vantage, path history,
        and origin-side source is needed to test whether the intermediary had a readable opportunity. Under TLS 1.3 and similar
        conditions, a passive gateway may not see the certificate presented to the client, so endpoint or active measurement
        telemetry is required.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入主动替换网络指向、部署会被目标选择的伪接入点、控制中途代理，或以被客户端接受的证书终止并转发一般内容的情况；可读性的证明可以是中间节点流记录、双端 TLS 分段及可信证书状态，或与原始内容相符的后继结果。只有普通路由器转发、未解密的
        TLS 密文、单纯证书错误页面、无线连接建立或 DNS 伪答时，不可据此断言一般内容已被读取。合法企业 TLS 检查和故障切换要依据所有者、批准范围和变更记录排除。
      en: Included behavior is active replacement of network direction, an access point selected by the victim, an intermediary
        proxy, or trusted-certificate termination and forwarding of ordinary content. Readability can be shown through intermediary
        flow records, evidence of separate client and server TLS legs with trusted certificate state, or a downstream result
        matching original content. Ordinary router forwarding, unreadable TLS ciphertext, a certificate-error page, Wi-Fi
        association alone, or a forged DNS reply alone cannot establish that general content was read. Authorized enterprise
        TLS inspection and failover require checks against owner, approved scope, and change records.
    - zh: 凭据承载流以及跨目标认证证明由 NJT-0136 与其子项解释；首次钓鱼入口的实时身份提供方代理由 NJS-0057-004 解释。取得会话 Cookie 或令牌是结果类相邻对象；进入邮箱、代码库或文档库读取静态内容属于各自的
        Collection 技术。被动抓包归 T1040；若攻击者改变了正在传输的数据，应另外评价 T1565.002。单一事件可以具备多种行为，但不能仅因技术实现相似就把结果互作证据。
      en: NJT-0136 and its children explain credential-bearing flows and cross-destination authentication proofs; NJS-0057-004
        explains real-time IdP proxying as a first phishing entry. Acquired cookies or tokens are adjacent result objects,
        while later reads from mailboxes, code repositories, or document stores belong to their respective Collection techniques.
        Passive packet capture belongs to T1040, and changed in-flight content warrants separate assessment under T1565.002.
        One event may contain several behaviors, but a similar implementation does not allow one outcome to serve as evidence
        for another.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 典型场景是受管终端访问协作服务或通信站点时，攻击者控制它接受的 DNS、DHCP、无线接入或代理，或者把可被客户端信任的证书放入中间节点，使目标会话穿过可读取内容的位置。哈萨克斯坦 2019 年的现场测量提供按通信站点
          SNI 和网络路径选择性注入证书的实例，并观察到测试响应继续返回；这一事实支持场景存在，却不能确定某个用户的具体消息后来被保存。
        en: A representative scenario is a managed endpoint visiting a collaboration or communications service while an actor
          controls the DNS, DHCP, wireless, or proxy direction it accepts, or equips an intermediary with a certificate the
          client will trust, allowing a content-bearing session to pass through a readable point. Field measurements of the
          2019 Kazakhstan interception show certificate injection selected by communications-site SNI and network path, with
          test responses continuing to return. This establishes a real scenario without proving that a particular user's message
          was later retained.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需拥有能影响目标连接选择的网络位置或策略控制，且必须满足内容可读条件。对 HTTPS，能修改路由但没有可被客户端接受的证书、会话密钥或协议弱点，并不足以解密正文；可信终止还要求控制信任根、错误签发的证书或被接受的代理环境。选择性介入要求知道目标域、SNI、终端或活动时段；真实服务转发要求保持足够的连接兼容性，否则用户错误、证书警报和服务失败会暴露行为。
          en: The actor needs a network position or policy control capable of changing the target's connection choice, plus
            a condition that makes content readable. Redirecting HTTPS traffic without a client-accepted certificate, session
            key, or protocol weakness is insufficient to decrypt its body. Trusted termination also requires control of a
            trust root, misissued certificate, or accepted proxy environment. Selective interception requires knowledge of
            target domains, SNI, endpoints, or activity times; forwarding to the real service must remain compatible enough
            to avoid user errors, certificate warnings, and failed transactions.
      defender_model:
        paragraphs:
        - zh: 防守方可能分别持有终端信任根和浏览器连接记录、交换机或 DNS/DHCP 历史、TLS 证书遥测、以及真实服务的入口连接记录。单一记录通常只能证明证书或路径异常，无法同时证明内容可读与实际留存；因此检测应分级输出“路径介入”“可读终止”“内容已取”的结论。用户自带设备、组织外
            Wi-Fi、加密 DNS、缺少端点证书遥测、合法 CDN 证书轮换和未获服务端协作都会降低关联能力。
          en: Defenders may separately hold endpoint trust-store and browser connection records, switch or DNS/DHCP history,
            TLS certificate telemetry, and the real service's inbound connection records. One record usually proves only a
            certificate or path anomaly, not both readable content and actual retention. Detection should therefore separate
            path intervention, readable termination, and confirmed content acquisition. Bring-your-own devices, external Wi-Fi,
            encrypted DNS, absent endpoint certificate telemetry, legitimate CDN certificate rotation, and lack of origin
            cooperation reduce correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 按域与路径限制内容流介入范围
      en: Limit content-flow interception by domain and path
    analysis:
      paragraphs:
      - zh: 选择性响应或拦截规则只让目标域和路径的连接进入中间节点，其他流量维持原状，因此异常证书和路径差在网络总体中稀疏分布。现场测量显示目标 SNI 与网络路径是实际触发条件；由此推断只查全网证书异常总量的防守可能漏看局部关系，但来源没有测量告警降低幅度。逐域、逐路径和逐终端与未受影响对照连接比较，可恢复该差异。
        en: Selection rules send only connections for target domains and paths through the intermediary while other traffic
          stays on its usual route, making certificate and path differences sparse at network scale. Field measurements identify
          target SNI and network path as actual triggers. It is an inference, not a measured alert result, that network-wide
          anomaly totals may miss the local relationship. Per-domain, per-path, and per-endpoint comparison with unaffected
          controls can recover it.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    confidence: medium
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 以受信证书和真实服务转发维持正常交易外观
      en: Preserve an ordinary transaction appearance through trusted certification and real-service forwarding
    analysis:
      paragraphs:
      - zh: 中间节点以客户端接受的证书终止连接、读取明文，再以独立连接访问真实服务；复制原证书的名称字段并保持返回头部与正文，可使浏览器和应用操作继续成功。变化发生在证书公钥、签发链、TLS 上游来源和信任根，而不是必然发生在页面内容。原始测量记录了这些差异及未见正文改变；是否实际复制或保存内容仍需额外证据。
        en: The intermediary terminates a connection under a certificate the client accepts, gains plaintext access, and separately
          contacts the real service. Copying the original certificate's name fields and preserving response headers and body
          can let browser and application activity continue. The differences lie in public key, issuing chain, upstream TLS
          source, and trust root rather than necessarily in page content. Original measurements record these differences and
          no observed body change; actual copying or retention needs additional evidence.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
    confidence: medium
proposed_subtechniques:
- temporary_key: T1557C_CHILD_SELECTIVE
  lineage:
    attck_subtechnique_inherited: false
  name:
    zh: 选择性内容流介入
    en: Selective Content-Flow Interception
  summary:
    zh: 仅令目标域、受害终端、路径或时段的内容流经过中间节点，使异常按范围稀疏分布。
    en: Route content flows for selected domains, endpoints, paths, or periods through an intermediary so the anomalous traces
      remain sparse by scope.
  definition_and_concept:
    paragraphs:
    - zh: 选择性内容流介入是攻击者控制哪些正在传输的一般内容会经过可读取的中间位置，而非持续覆盖全部通信。选择变量可以是域名、SNI、终端、网络路径或时间，必须实际决定内容会话是否被介入；DNS、无线和代理只是实现面。分类需要证明被选择的会话包含一般内容且与中间节点相连，不能仅凭过滤配置成立。
      en: Selective Content-Flow Interception means the actor controls which ordinary content in transit passes through a
        readable intermediary instead of continuously intercepting all communication. Domain, SNI, endpoint, network path,
        or time may be the selector if it actually determines whether a content session is intercepted; DNS, wireless, and
        proxy are implementation surfaces. Classification requires a selected content-bearing session linked to the intermediary,
        not merely the existence of a filter setting.
  stealth_characteristics:
    paragraphs:
    - zh: 选择性内容流介入使同一网络中多数连接仍呈正常路径与证书，异常只出现在受影响域和受影响路径交集。全网 TLS 失败率和平均证书变化可能保持很低，而被选择终端仍会出现到中间节点的改道、证书链差异或双连接。哈萨克斯坦测量记录了目标域与网络路径两重条件；将这种稀疏性解释为防守遗漏风险是分析推论，不是已经量化的规避效果。
      en: Selective Content-Flow Interception leaves most connections on their ordinary path and certificate, confining anomalies
        to the intersection of selected domains and affected paths. Network-wide TLS failure rates and average certificate
        changes may remain low, while a selected endpoint still shows diversion, a chain difference, or two legs of a proxied
        connection. The Kazakhstan measurements document target-domain and path conditions. Their effect on missed alerts
        is an analytic inference, not a quantified evasion result.
  scope_boundary_definition:
    paragraphs:
    - zh: 本项要求有意限定介入集合且这种限定改变痕迹分布；持续全域代理属于父级，受信证书终止可与本项并存并另标第二子项。单纯按用户分流的合法 CDN、企业代理例外、测试网段迁移也会造成选择性，须对照批准策略与证书所有权。凭据选择性引流仍以
        NJT-0136 的认证对象判断，本项仅处理一般内容。
      en: This child requires deliberate scoping that changes trace distribution; persistent all-domain proxying remains parent
        core, while trusted-certificate termination may coexist and qualify for the second child. Legitimate CDN steering,
        enterprise proxy exceptions, and test-segment migrations are also selective and require comparison with approved policy
        and certificate ownership. Selectively diverted credentials remain assessed through NJT-0136; this child concerns
        ordinary content.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者若只关心协作或通信域，可在受控接入路径上按 SNI 插入中间设备，而让软件更新与其他网页继续正常直连。现场测量中通信站点被命中、其他域不注入证书，说明该变量不是按协议或产品机械拆分；实际企业调查仍需把目标终端的一次内容访问与中间节点连起来。
        en: An actor interested in collaboration or communications domains can insert an intermediary by SNI on a controlled
          access path while leaving software updates and unrelated browsing direct. Field measurements observed communications
          sites being selected while other domains received no injected certificate, showing a variable beyond protocol or
          product labels. An enterprise investigation must still connect a particular endpoint's content visit to the intermediary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须控制能够检查或引导连接的网段或代理规则，并知道目标域或主机在何时经过该路径。过滤太窄会错失内容，过滤太宽会增加证书或路径异常；对 TLS，筛选命中后仍须有使正文可读的额外条件。
          en: The actor must control a segment or proxy rule that can select or steer connections and know when target domains
            or hosts cross that path. A narrow selector misses content; a broad one increases certificate or route anomalies.
            For TLS, a selected flow still needs an additional condition before its body becomes readable.
      defender_model:
        paragraphs:
        - zh: 防守方应按目的域、路径、终端和时间比较证书签发者与实际转发来源，并保存未命中连接作对照。仅在某一出口汇总的证书统计可能看不见这种交集；不同 CDN 边缘与地区合法证书差异需要分层基线，不能把任何证书不一致直接判恶。
          en: Defenders should compare certificate issuer and forwarding source by destination domain, path, endpoint, and
            time, retaining unaffected flows as controls. Aggregated certificate statistics from one egress point can miss
            the intersection. Legitimate differences among CDN edges and regions need separate baselines; any certificate
            mismatch alone is not malicious.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 把内容拦截痕迹局限在少数域与路径
      en: Confine content-interception traces to selected domains and paths
    analysis:
      paragraphs:
      - zh: 目标域和路径条件使多数连接没有证书或路由差，令总体平均掩盖受影响交集。原始测量证明这种筛选确实存在；其降低现实告警的程度仍未测量。防守方可构造相同域名在不同路径、相同路径在不同域名的对照，寻找只在交集出现的异常证书及内容流。
        en: Domain and path conditions leave most connections without certificate or route differences, so an overall average
          hides the affected intersection. Original measurements establish this selection but do not measure its effect on
          real alerts. Defenders can compare the same domain across paths and different domains on the same path, looking
          for a certificate anomaly and content flow only at the intersection.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    confidence: medium
  evidence_keys:
  - REF-000488
  - T1557C_REF_KAZAKH_PAPER
  limitations:
    paragraphs:
    - zh: 哈萨克斯坦论文用研究请求测得筛选条件，未取得中间节点保存的真实用户消息；它可证明选择性介入和明文访问条件，不证明某条消息已被复制。企业内 DNS、DHCP 或无线实现是否以相同变量运行，还须按事件再证，不能从运营商级案例直接外推。
      en: The Kazakhstan paper measured selection with research requests and did not obtain real-user messages stored by the
        intermediary. It establishes selective interception and a plaintext-access condition, not copying of a particular
        message. Whether enterprise DNS, DHCP, or wireless implementations use the same variable still needs event-specific
        evidence and cannot be assumed from a carrier-scale case.
- temporary_key: T1557C_CHILD_TRUSTED_TERMINATION
  lineage:
    attck_subtechnique_inherited: false
  name:
    zh: 受信终止与原样内容转发
    en: Trusted Termination with Content-Preserving Relay
  summary:
    zh: 以客户端接受的证书在中间节点解密内容，并将交易继续转发至真实服务，以保留正常页面和服务结果。
    en: Decrypt content at an intermediary under a client-accepted certificate, then forward the transaction to the real service
      to preserve expected page and service results.
  definition_and_concept:
    paragraphs:
    - zh: 受信终止与原样内容转发是攻击者把一个端到端的加密会话拆成客户端至中间节点、中间节点至真实服务两段，并使客户端接受前段证书，同时让请求或响应内容继续流向原服务。稳定变量是“客户端信任的终止者”和“真实服务的终止者”分离，而应用交易看似连续；自定义根证书、误签证书和被接受的代理是不同实现。仅存在受信根或代理而没有内容承载会话时，本子项不成立。
      en: Trusted Termination with Content-Preserving Relay splits an end-to-end encrypted session into client-to-intermediary
        and intermediary-to-origin legs. The client accepts the first leg's certificate while requests or responses continue
        to the real service. The stable variable is separation of the termination point trusted by the client from the real
        service while the application transaction appears continuous. A custom root, misissued certificate, or accepted proxy
        are implementations. A trusted root or proxy without a content-bearing session does not establish this child.
  stealth_characteristics:
    paragraphs:
    - zh: 中间节点可复制原证书的 Subject 和 SAN、返回看似未改变的页面，让 URL、内容和服务成功日志单独看都符合预期；可见差异转移到公钥、签发链、根证书来源、TLS 指纹和真实服务所见上游客户端。现场测量观察到伪证书复制名称字段而密钥与扩展不同，并见中间节点先向真实服务器握手；测试响应的头部与正文未发现变化。它不能证明所有真实用户交易均未改动。
      en: The intermediary may copy the original certificate's Subject and SAN and return an apparently unchanged page, so
        URL, content, and service success logs each look expected. The visible difference moves to public key, issuing chain,
        trust-root provenance, TLS fingerprint, and the upstream client seen by the real service. Field measurements observed
        copied certificate names with changed keys and extensions, plus an intermediary handshake to the real server; test
        response headers and bodies showed no change. That does not prove every real-user transaction was unmodified.
  scope_boundary_definition:
    paragraphs:
    - zh: 本项要求可被客户端接受的中间终止点、真实服务转发和一般内容可读性。未被终端信任而只造成警告或失败的伪证书，不足以说明内容已读；仅由企业批准的 TLS 检查实施相同技术流程也不是恶意活动。改变返回正文或注入脚本还应单独评价传输数据操纵；只为了截取口令的身份代理落入凭据对象。
      en: This child requires a client-accepted intermediate termination point, forwarding to the real service, and readability
        of ordinary content. A forged certificate rejected by the endpoint and causing only a warning or failure does not
        establish content access. The same flow under approved enterprise TLS inspection is not malicious activity. Changed
        response bodies or injected scripts also require an assessment of transmitted-data manipulation, while an identity
        proxy used only for passwords belongs under credential objects.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已影响终端的信任根或控制可被接受的证书时，可针对通信或协作站点建立两段 TLS，并让用户继续浏览、交换消息或下载页面。2019 年哈萨克斯坦案例提供了被接受根证书、按域注入证书与真实服务上游握手的现场证据；它是大规模部署样例，不能直接代表普通企业局域网权限条件。
        en: When an actor has influenced endpoint trust roots or controls a certificate the client accepts, it can create
          two TLS legs for communications or collaboration sites while the user continues browsing, exchanging messages, or
          downloading pages. The 2019 Kazakhstan case supplies field evidence of an accepted root, domain-based certificate
          injection, and upstream handshakes to real services. Its carrier-scale deployment does not directly represent the
          permissions available in a typical enterprise LAN.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者既需位于目标路径，又需取得客户端对替代证书的信任，并维持上游 TLS 与应用语义。浏览器内置阻断、证书固定、端到端加密的应用层内容或客户端证书认证可使该路径失效；有根证书权限也不自动意味着所有应用信任该根。
          en: The actor needs both a position on the target path and client trust in a substitute certificate, then must maintain
            upstream TLS and application semantics. Browser-specific distrust, certificate pinning, application-layer end-to-end
            encryption, or client-certificate authentication can break the path. Authority over one trust store does not imply
            every application trusts it.
      defender_model:
        paragraphs:
        - zh: 防守方应保存终端实际接受的证书链及信任根变更，并从不受同一中间路径影响的观察点取得真实服务证书；若能得到服务端 TLS 来源，可验证“客户端看到的终止者”与“服务端看到的发起者”不是同一端到端会话。仅凭浏览器显示锁形图标或源站
            HTTP 200 不足以排除。合法安全网关、调试代理和 CDN 证书轮换是主要正常反例。
          en: Defenders should retain the certificate chain actually accepted by the endpoint and trust-root changes, then
            obtain the real service certificate from a vantage outside the same intermediary path. Origin-side TLS source,
            if available, can show that the client's termination point and the origin's initiating client are not one end-to-end
            session. A browser padlock or HTTP 200 at the origin is insufficient to exclude interception. Approved security
            gateways, debugging proxies, and CDN certificate rotation are major benign lookalikes.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 复制可信站点名称并延续真实内容返回
      en: Copy trusted site names and continue real content responses
    analysis:
      paragraphs:
      - zh: 伪证书保留原服务的名称字段，中间节点读取后仍转发真实请求与响应，使用户与服务端应用日志看似连续。证书公钥、签发链及上游握手却发生可核验变化；研究测量直接记录了这些变化和测试内容未变。观察者必须把 TLS 信任资料与两段连接合并，才不会把正常页面当成端到端保密的证据。
        en: A substitute certificate keeps the origin's name fields and the intermediary forwards real requests and responses
          after gaining readability, preserving apparent continuity in user and origin application logs. Public key, issuing
          chain, and upstream handshake nevertheless change in verifiable ways; original measurements recorded those changes
          and unchanged test content. An observer must join TLS trust evidence to both connection legs rather than treating
          a normal page as proof of end-to-end confidentiality.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
    confidence: medium
  evidence_keys:
  - REF-000488
  - T1557C_REF_KAZAKH_PAPER
  - T1557C_REF_MOZILLA_KAZAKH
  limitations:
    paragraphs:
    - zh: 原始测量能证明所测连接出现替代证书和上游握手，但无法看到运营方是否记录、筛选或导出了用户明文；本子项的“可读”应保持中等置信度，具体内容被复制的说法需另有流记录或后继利用。客户端应用若另行端到端加密正文，即使 TLS 被终止也可能仍读不到该正文。
      en: Original measurements establish substitute certificates and upstream handshakes for tested connections, but cannot
        reveal whether the operator recorded, selected, or exported user plaintext. Readability remains a medium-confidence
        conclusion, and claims that particular content was copied need flow records or downstream use. An application that
        adds end-to-end encryption to its body may keep that body unreadable even when TLS is terminated.
defense_candidates:
  detection_strategies:
  - temporary_key: T1557C_DET_CONTENT_PATH
    decision: create
    name:
      zh: 内容路径与受信终止差分
      en: Content-Path and Trusted-Termination Differential
    objective:
      zh: 关联内容流的网络路径、终端所见 TLS 身份与真实服务上游连接，分级发现选择性介入、可读终止和已证内容取得。
      en: Join a content flow's network path, the TLS identity seen by the endpoint, and the origin's upstream connection
        to separate selective interception, readable termination, and confirmed content acquisition.
    proposed_subject_keys:
    - T1557C_PARENT
    - T1557C_CHILD_SELECTIVE
    - T1557C_CHILD_TRUSTED_TERMINATION
    analytic_keys:
    - T1557C_NJA_SELECTED_FLOW
    - T1557C_NJA_SPLIT_TLS
    evidence_keys:
    - REF-000488
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
    distinction_from_existing:
      zh: DET-000142 和 NJA-000147 的终点是认证流，不能直接确认一般内容可读；本策略必须追踪非凭据内容会话。
      en: DET-000142 and NJA-000147 end at authentication flow and cannot directly establish readability of ordinary content;
        this strategy requires a non-credential content session.
  detection_analytics:
  - temporary_key: T1557C_NJA_SELECTED_FLOW
    strategy_key: T1557C_DET_CONTENT_PATH
    name:
      zh: 域与路径交集证书差分
      en: Domain-and-Path Certificate Differential
    logic:
      zh: 每五至十分钟从受管终端或受控探针对目标通信域和不相干对照域记录 SNI、目标地址、出口、完整证书链、公钥指纹和请求是否成功；从不经过同一出口的独立探针取同域证书。建立同域跨路径、同路径跨域的二乘二对照，只有目标域与特定路径交集反复出现未批准的替代链或公钥且内容请求成功，才上报选择性介入候选。随后确认终端是否接受该证书、真实服务是否继续收到连接以及正文有无额外端到端加密。
      en: Every five to ten minutes, use managed endpoints or controlled probes to record SNI, destination, egress, full certificate
        chain, public-key fingerprint, and request success for target communications domains and unrelated control domains.
        Probe the same domain from a path outside the suspected egress. Build a two-by-two comparison of the same domain across
        paths and different domains on one path. Report selective interception only when an unapproved substitute chain or
        key repeatedly appears at the target-domain and path intersection with a successful content request. Then verify that
        the endpoint accepted the certificate, the origin still received a connection, and the body lacked separate end-to-end
        encryption.
    data_requirements:
    - source_type: endpoint-tls-probe
      required_fields:
      - event.timestamp
      - endpoint.id
      - requested.domain
      - tls.sni
      - peer.certificate.chain_fingerprint
      - peer.certificate.spki_fingerprint
      - tls.validation_result
      - http.response_status
    - source_type: network-path-map
      required_fields:
      - event.timestamp
      - endpoint.id
      - destination.ip
      - egress.id
      - route.path_id
    - source_type: approved-proxy-certificate-inventory
      required_fields:
      - issuer.fingerprint
      - proxy.id
      - owner.id
      - scope.domain
      - valid.from
      - valid.to
    observables:
      zh: 只有目标域与受影响路径的交集出现被终端接受的替代证书；对照域和独立路径保持源站证书。
      en: An endpoint-accepted substitute certificate appears only at the target-domain and affected-path intersection; control
        domains and independent paths retain the origin certificate.
    correlation:
      window:
        zh: 同一十分钟探测周期内比较并连续复测，保留二十四小时路径和批准例外记录。
        en: Compare within a ten-minute probe cycle and repeat; retain twenty-four hours of path and approved-exception history.
      dimensions:
      - endpoint.id
      - requested.domain
      - tls.sni
      - egress.id
      - route.path_id
      - peer.certificate.spki_fingerprint
      - event.timestamp
    false_positives:
      zh: 经批准的 TLS 检查、CDN 不同边缘节点、证书轮换及双栈出口差异。
      en: Approved TLS inspection, different CDN edges, certificate rotation, and dual-stack egress differences.
    blind_spots:
      zh: 外部无线和自带设备无探针覆盖、ECH 隐去 SNI、终端证书数据未留存，或攻击者只读取非 TLS 明文协议。
      en: No probe coverage for external Wi-Fi or unmanaged devices, ECH hiding SNI, absent endpoint certificate records,
        or an actor reading non-TLS plaintext protocols.
    tuning:
      zh: 按域、CDN 边缘、出口和时间维护批准证书与代理例外，但批准代理也须检查是否越权扩大拦截范围；不能把证书替换直接升级为数据复制。
      en: Maintain approved certificate and proxy exceptions by domain, CDN edge, egress, and time, but still check whether
        an approved proxy exceeds its scope; do not promote certificate substitution directly into copied data.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
  - temporary_key: T1557C_NJA_SPLIT_TLS
    strategy_key: T1557C_DET_CONTENT_PATH
    name:
      zh: 客户端信任链与源站上游握手关联
      en: Client Trust Chain and Origin Upstream-Handshake Join
    logic:
      zh: 当终端对敏感通信域接受新根或非批准签发链时，比较本端证书的名称、公钥和签发者与独立观察点所得源站证书；在源站可协作或受控时，把同一请求窗口的入口 TLS 来源和客户端原始来源相连。相同名称但链或公钥不同，且有独立上游握手和正常内容返回时，判为可读终止候选；只有中间节点流记录、内容副本或可核验的后继使用才升级为特定内容已收集。
      en: When an endpoint accepts a new root or unapproved chain for a sensitive communications domain, compare the certificate's
        names, public key, and issuer with an origin certificate from an independent vantage. Where the origin is cooperative
        or controlled, join its inbound TLS source to the original client in the same request window. Matching names with
        a different chain or key, a separate upstream handshake, and a normal content response indicate readable termination.
        Promote to acquisition of particular content only with intermediary flow records, a content copy, or verifiable downstream
        use.
    data_requirements:
    - source_type: endpoint-certificate-observation
      required_fields:
      - event.timestamp
      - endpoint.id
      - requested.domain
      - peer.certificate.subject
      - peer.certificate.san
      - peer.certificate.spki_fingerprint
      - peer.certificate.issuer_fingerprint
      - tls.validation_result
    - source_type: endpoint-trust-store-inventory
      required_fields:
      - event.timestamp
      - endpoint.id
      - trust_root.fingerprint
      - trust_root.owner
      - install.source
    - source_type: independent-origin-probe
      required_fields:
      - event.timestamp
      - requested.domain
      - peer.certificate.spki_fingerprint
      - peer.certificate.issuer_fingerprint
    - source_type: origin-tls-access
      required_fields:
      - event.timestamp
      - requested.domain
      - source.ip
      - tls.client_hello_fingerprint
      - http.request_id
    observables:
      zh: 同名站点下终端所见证书的密钥和签发链与独立源站不同，源站同时收到额外节点的上游 TLS 连接。
      en: For the same site name, the client's certificate key and issuing chain differ from the independent origin view,
        while the origin receives an upstream TLS connection from an additional node.
    correlation:
      window:
        zh: 以请求时间前后二分钟关联，根证书变更查看前后二十四小时。
        en: Join within two minutes of the request and review trust-root changes in the surrounding twenty-four hours.
      dimensions:
      - endpoint.id
      - requested.domain
      - peer.certificate.spki_fingerprint
      - trust_root.fingerprint
      - source.ip
      - http.request_id
      - event.timestamp
    false_positives:
      zh: 批准安全网关、调试代理、CDN 边缘证书、移动运营商优化代理和正常续签。
      en: Approved security gateways, debugging proxies, CDN edge certificates, mobile-carrier optimization proxies, and normal
        renewal.
    blind_spots:
      zh: 无端点证书遥测、无独立路径、源站不提供入口 TLS 记录、请求 ID 跨代理丢失，或应用另有端到端正文加密。
      en: Missing endpoint certificate telemetry, independent path, or origin TLS records; request IDs lost across a proxy;
        or separate application-layer end-to-end encryption.
    tuning:
      zh: 先核验签发者所有权与批准检查范围，再以链、公钥和上游来源三方差分提高置信度；单个 IP 或 TLS 指纹不是通用 IOC，批准根的越权使用也不应白名单排除。
      en: Verify issuer ownership and approved inspection scope before raising confidence through chain, key, and upstream-source
        differences. One IP or TLS fingerprint is not a universal IOC, and misuse of an approved root should not disappear
        into an allowlist.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
  mitigations:
  - temporary_key: T1557C_MIT_NETWORK_AUTHORITY_EXTENSION
    decision: extend-or-split
    reuse_ref: MIT-000131
    name:
      zh: 网络路径权威约束的内容流应用
      en: Content-Flow Application of Network-Path Authority Enforcement
    measures:
      zh: 对 DHCP、ARP、IPv6 第一跳和不需要的组播名称解析实施已批准权威约束，保留逐终端接受的方向。
      en: Enforce approved DHCP, ARP, IPv6 first-hop, and unnecessary multicast-name-resolution authority and retain directions
        accepted by each endpoint.
    applications:
    - target_key: T1557C_PARENT
      use:
        zh: 验证内容目的地网络指向的来源并拒绝非授权回答。
        en: Verify the authority behind directions for content destinations and reject unauthorized replies.
      expected_effect:
        zh: 减少伪权威插入内容路径的机会并保留访问时的路径证据。
        en: Reduce opportunities for false-authority insertion into content paths and retain route evidence at access time.
      limitations:
        zh: 不覆盖组织外 Wi-Fi、已批准代理被滥用或受信根证书终止。
        en: Does not cover external Wi-Fi, abuse of approved proxies, or termination under a trusted root.
    - target_key: T1557C_CHILD_SELECTIVE
      use:
        zh: 少数域和终端的短时路径变化仍按单次来源合法性校验并保留同段对照。
        en: Validate each short-lived direction affecting even a few domains or endpoints and retain same-segment controls.
      expected_effect:
        zh: 选择性不再单独足以绕过接入层阻断或事后路径还原。
        en: Selection alone no longer avoids access-layer blocking or later path reconstruction.
      limitations:
        zh: 批准网络设备被攻陷时仍需证书和内容流差分。
        en: A compromised approved device still requires certificate and content-flow comparison.
    evidence_keys:
    - REF-000491
    - REF-000515
    reuse_caveat:
      zh: MIT-000131 现有摘要明确写“认证路径替换”；若扩展到 Collection，必须由主 Agent 连同摘要、证据和既有 applications 一并审查，不能只加目标引用。MIT-000132 的 SMB/LDAP
        认证受众绑定不适用于一般内容。
      en: MIT-000131's current summary explicitly says authentication-path substitution; extending to Collection requires
        the primary agent to review its summary, evidence, and existing applications, not just add target references. MIT-000132's
        SMB/LDAP authentication-audience binding does not apply to ordinary content.
  - temporary_key: T1557C_MIT_TLS_TRUST
    decision: create
    name:
      zh: 内容通信的证书信任边界治理
      en: Certificate-Trust Boundary Governance for Content Communications
    measures:
    - key: trust-root-inventory
      control_type: preventive
      description:
        zh: 对受管终端的根证书和检查代理建立所有者、安装来源、批准范围、到期与撤销记录，阻止未经批准的根进入浏览器及系统信任库。
        en: Record owner, installation source, approved scope, validity, and revocation for managed endpoint roots and inspection
          proxies, and prevent unapproved roots from entering browser and system stores.
    - key: sensitive-origin-validation
      control_type: detective-support
      description:
        zh: 对敏感通信域从独立出口定期取得源站证书并与终端实际接受的链比较，对已知恶意根执行浏览器或终端级阻断。
        en: Periodically obtain origin certificates for sensitive communications domains through an independent egress, compare
          them with chains actually accepted by endpoints, and block known malicious roots at browser or endpoint level.
    applications:
    - target_key: T1557C_PARENT
      use:
        zh: 限制内容承载服务的非批准证书终止并记录代理与根证书变更。
        en: Restrict unapproved certificate termination for content-bearing services and log proxy and root changes.
      expected_effect:
        zh: 增加攻击者获得受信终止点的难度，使被改道内容更可能保持密文。
        en: Raise the cost of obtaining a trusted termination point so diverted content is more likely to remain ciphertext.
      limitations:
        zh: 不保护原本以明文传输的内容，也无法单独阻止批准代理失陷。
        en: Does not protect content originally sent in plaintext or by itself stop a compromised approved proxy.
    - target_key: T1557C_CHILD_TRUSTED_TERMINATION
      use:
        zh: 对关键通信域核对终端签发链、独立源站与批准检查清单；未批准根须撤销信任并调查两段连接。
        en: For critical domains compare endpoint chain, independent origin, and approved inspection inventory; revoke unapproved
          roots and investigate both connection legs.
      expected_effect:
        zh: 降低伪证书被默默接受的机会，以信任来源差暴露复制站点名称的中间节点。
        en: Reduce silent acceptance of substitute certificates and expose an intermediary copying site names through trust
          provenance differences.
      limitations:
        zh: CDN 与企业检查会造成合法差异；部分应用使用独立信任库，需要按应用验证。
        en: CDN and enterprise inspection create legitimate differences; some applications have separate trust stores needing
          application-specific validation.
    evidence_keys:
    - T1557C_REF_KAZAKH_PAPER
    - T1557C_REF_MOZILLA_KAZAKH
