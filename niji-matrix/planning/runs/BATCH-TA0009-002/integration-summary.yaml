review_notes_zh: 五个固定基线 ATT&CK 父候选先完成 adapt 准入，再形成 5 个 NJT 与 8 个按内容路径、库内选择、邮件副本、浏览器会话和音频归因划分的原生 NJS。T1213 子项与 T1185 代理子项保持低置信度，现场能力与已取内容严格分级。共享库归并
  REF-000593/REF-000612 至 REF-000561/REF-000572，记录 4778/4779 分立。质量、五份 Bundle、89 项 Web 测试与双语 API QA 已通过；TA0009 正式 8/17，剩余 9
  项。所有本批正式对象保持 review，待人工领域评审。
review_notes_en: Five fixed-baseline ATT&CK parents received adapt admission before authoring, yielding five NJT and eight
  Niji-native children divided by content path, repository selection, mail copies, browser session, and audio attribution.
  The T1213 child and T1185 proxy child remain low-confidence, with capability separated from acquired content. Shared references
  REF-000593/REF-000612 were merged into REF-000561/REF-000572 and the 4778/4779 distinction was recorded. Quality, five bundles,
  89 Web tests, and bilingual API QA passed. TA0009 has 8 of 17 formal parents with nine remaining. All new objects stay review
  pending human domain approval.
