schema_version: 1.0.0
type: batch-taxonomy-breadth-review
batch_ref: BATCH-TA0009-002
attack_baseline:
  domain: enterprise-attack
  version: '19.1'
principle: ATT&CK children are planning-only breadth context; all formal NJS use independent stealth variables and defender-observation
  differences.
candidate_reviews:
- source_attack_id: T1557
  attack_subtechnique_count: 4
  attack_subtechnique_ids:
  - T1557.001
  - T1557.002
  - T1557.003
  - T1557.004
  represented_dimensions:
  - zh: 名称解析伪答与 SMB/NTLM 中继
    en: Name-resolution spoofing and SMB/NTLM relay
  - zh: ARP 邻居映射替换
    en: ARP neighbor-mapping replacement
  - zh: DHCP 网络配置伪权威
    en: Rogue DHCP network-configuration authority
  - zh: 无线接入点身份模仿
    en: Wireless access-point identity imitation
  breadth_trigger: examine_two_or_more_axes
  coverage_resolutions:
  - attack_id: T1557.001
    resolution: adjacent-technique
    rationale:
      zh: 固定页主要描述获取或中继认证材料；名称解析可为内容路径提供入口，但没有内容流证据时仍属于 NJT-0136 或父级路径线索。
      en: The fixed child chiefly describes acquiring or relaying authentication material. Name resolution can initiate a
        content path, but without content-flow evidence it remains NJT-0136 or a parent-level path lead.
  - attack_id: T1557.002
    resolution: parent-core
    rationale:
      zh: ARP 改写可实现主动路径介入，却不独立决定筛选范围、内容可读性或正常交易外观。
      en: ARP rewriting can implement active path intervention but does not independently determine selection, content readability,
        or ordinary transaction appearance.
  - attack_id: T1557.003
    resolution: parent-core
    rationale:
      zh: DHCP 伪权威提供路径方向，只有附加的内容流和筛选或可信终止证据才进入拟议 NJS。
      en: Rogue DHCP supplies a path direction; a proposed NJS still needs additional content-flow plus selection or trusted-termination
        evidence.
  - attack_id: T1557.004
    resolution: niji-variable-candidate
    rationale:
      zh: 伪 AP 是接入媒介而不是子项；固定页所述自定义证书提示可检验的可信终止轴，但正式证据来自独立现场测量而非把无线标签导入。
      en: A rogue AP is an access medium, not a child. Its mention of custom certificates points to a testable trusted-termination
        axis, supported formally by independent field measurement rather than import of a wireless label.
  candidate_stealth_axes_examined:
  - axis: T1557C_CHILD_SELECTIVE
    variable: selected domain, endpoint, path, or period of readable content interception
    trace_change: substitute certificate and route differences confined to target-domain and affected-path intersection
    defender_difference: compare same domain across paths and different domains on one path, with endpoint TLS acceptance
      and content request
    evidence_urls:
    - https://censoredplanet.org/assets/Kazakhstan.pdf
    evidence_supports: observed SNI/path selection and sparse substitute certificates, not measured alert-rate reduction or
      retained content
    normal_counterexamples:
    - approved selective enterprise proxy
    - CDN edge selection
    - staged network migration
    resolution: propose_formal_child_at_medium_confidence
  - axis: T1557C_CHILD_TRUSTED_TERMINATION
    variable: client-accepted TLS terminator differs from real origin while content is forwarded
    trace_change: copied certificate names and unchanged test response with different key, issuer, trust root, and upstream
      TLS client
    defender_difference: join endpoint accepted chain, independent origin chain, trust-root ownership, and origin-side upstream
      source
    evidence_urls:
    - https://censoredplanet.org/assets/Kazakhstan.pdf
    - https://blog.mozilla.org/security/2019/08/21/protecting-our-users-in-kazakhstan/
    evidence_supports: observed replacement certificate/upstream connection and technical plaintext access, not copying of
      particular user content
    normal_counterexamples:
    - approved TLS inspection gateway
    - debugging proxy
    - CDN certificate variation
    resolution: propose_formal_child_at_medium_confidence
  - axis: content-preserving-relay-alone
    variable: request/response forwarding without a distinct trust or selection condition
    trace_change: ordinary forwarding is intrinsic to many proxies and need not change a stable stealth variable
    defender_difference: requires the same two-leg comparison as trusted termination
    resolution: parent-core_or_merge_into_trusted_termination
  - axis: protocol-or-medium
    variable: DNS versus DHCP versus ARP versus Wi-Fi
    trace_change: different packet surfaces but no invariant content-specific stealth effect
    defender_difference: sensor placement changes, not a distinct Niji causal variable
    resolution: reject_as_child
  second_pass_required: false
  second_pass_completed: false
  formal_niji_child_refs:
  - NJS-0142-001
  - NJS-0142-002
  breadth_gap_explained: true
  reviewer_notes:
    zh: 四项固定子项逐项覆盖；两个拟议子项分别按介入范围和受信可读终止划分，可共现而不能以原 ATT&CK 协议或媒介标签命名。保留正文复制结论的严格证据门槛。
    en: All four fixed children have coverage resolutions. The two proposed children divide by interception scope and trusted
      readable termination, can coexist, and are not named after ATT&CK protocol or medium labels. Claims about copying content
      retain a strict evidence threshold.
- source_attack_id: T1213
  attack_subtechnique_count: 6
  attack_subtechnique_ids:
  - T1213.003
  - T1213.001
  - T1213.004
  - T1213.006
  - T1213.005
  - T1213.002
  represented_dimensions:
  - code-control
  - collaboration-documents
  - structured-business-data
  - database-queries
  - messaging-content
  breadth_trigger: six-plus-explicit-coverage-and-second-pass
  coverage_resolutions:
  - attack_child_id: T1213.003
    name_en: Code Repositories
    resolution: niji-variable-candidate
    explanation_zh: 私有代码库读取属父级内容获取；关键词、路径或提交范围驱动的少量内容读取可为选择性读取轴提供对照，但 git clone/fetch 的量与日志属于实现，不自动构成 NJS。
    explanation_en: Private-code reads are parent behavior; keyword, path, or commit-scoped reads inform the selective-read
      axis, while git clone/fetch volume and telemetry are implementations rather than automatic NJS boundaries.
  - attack_child_id: T1213.001
    name_en: Confluence
    resolution: niji-variable-candidate
    explanation_zh: 产品本身不成轴；可检验搜索词与后续附件下载或页面取用的选择关系，且 Data Center Full 审计与云版可见性不同。
    explanation_en: The product is not an axis; search terms followed by attachment or page retrieval can test selection,
      but Data Center Full auditing and cloud visibility differ.
  - attack_child_id: T1213.004
    name_en: Customer Relationship Management Software
    resolution: parent-core
    explanation_zh: CRM 记录的查询/导出属于内容获取；受信连接器 token 的来源和持续授权另属 NJT-0086，不能改名为 T1213 子项。
    explanation_en: Querying/exporting CRM records is core acquisition; co-option of a trusted connector token and durable
      grant belongs to NJT-0086 and cannot be relabeled as a T1213 child.
  - attack_child_id: T1213.006
    name_en: Databases
    resolution: parent-core
    explanation_zh: 结构化查询和结果返回是父级行为；SQL、驱动和数据库产品不是匿迹变量，低量谓词查询若有对象级结果证据才可进入选择性读取轴。
    explanation_en: Structured queries and returned rows are parent behavior; SQL dialect, driver, and database product are
      not stealth variables, while low-volume predicate queries inform selection only with object-level result evidence.
  - attack_child_id: T1213.005
    name_en: Messaging Applications
    resolution: parent-core
    explanation_zh: 聊天历史和协作消息可在父级；邮件消息与附件由 T1114 负责。按消息平台另设子项无法证明不同匿迹因果。
    explanation_en: Chat and collaboration histories may be parent scope; mail messages and attachments belong to T1114. Splitting
      by messaging platform lacks a separate stealth causal chain.
  - attack_child_id: T1213.002
    name_en: Sharepoint
    resolution: niji-variable-candidate
    explanation_zh: 文档库搜索—文件读取是选择性读取轴的主要可观测实现；SharePoint/OneDrive 名称和文件格式都不是 NJS 边界。
    explanation_en: Search-to-file access in a document library is a key observable implementation of selective reading; SharePoint/OneDrive
      labels and file formats are not NJS boundaries.
  candidate_stealth_axes_examined:
  - key: T1213_QUERY_SELECTIVE_READ
    status: conditional-formal-proposal
    controlled_variable: Select repository-native semantic search/predicate filtering and a small matching read set instead
      of broad enumeration or export.
    trace_change: Search events and a bounded number of high-value content reads replace a conspicuous broad read/export episode;
      file/row access still remains.
    defender_difference: Join search or query context to sensitive object access and account work context; short-window volume
      thresholds alone are insufficient.
    prerequisites: Readable repository, search/query rights, and attacker knowledge of useful terms or business objects.
    evidence_keys:
    - T1213_R_MANDIANT_SEARCH
    - T1213_R_M365_AUDIT
    - T1213_R_ATLASSIAN_AUDIT
    - T1213_R_ATTACK_DET
    confidence: low
    caveat: Mandiant reports adversary searches and a SharePoint download example in the same campaign, but does not prove
      each downloaded object followed a specific search or quantify evasion; require primary review before canonical child
      admission.
  - key: T1213_EXISTING_INTEGRATION_PRINCIPAL
    status: adjacent-technique
    reason: NJT-0086/NJS-0086-003 already owns existing vendor integration control co-option and its app/client-token-resource
      correlation; UNC6395 adds no repository-read-specific trace variable.
    reuse_refs:
    - NJT-0086
    - NJS-0086-003
    - REF-000178
    - CLM-000358
    - CASE-000064
    - DET-000067
    - NJA-000046
    - MIT-000066
  - key: T1213_INCREMENTAL_OR_SCHEDULED_READ
    status: adjacent-technique
    reason: Timing/checkpoint/repeated acquisition is the direct orchestration variable of NJT-0135/NJS-0135-001; repository
      is only its source.
    reuse_refs:
    - NJT-0135
    - NJS-0135-001
  - key: T1213_IN_PLACE_VIEW_NO_EXPORT
    status: evidence-deferred
    reason: Potential difference between view/search and export logs, but no conclusion-level incident source establishes
      intentional in-place acquisition with separable effect across repositories; some products do not log page views.
  - key: T1213_CROSS_PRINCIPAL_DISTRIBUTION
    status: evidence-deferred
    reason: Multiple account/source distribution could dilute per-principal volume, but available cases do not establish coordinated
      repository reads, stable sibling boundary, or distinct control.
  - key: T1213_NATIVE_BULK_EXPORT_VS_API_QUERY
    status: not-stealth-distinct
    reason: A transport/API and workload distinction unless a changed trace/defender conclusion is independently proven; UNC6395
      bulk query jobs are not low-volume selective reads.
  - key: T1213_POST_QUERY_JOB_DELETION
    status: adjacent-technique
    reason: GTIG observed UNC6395 delete query jobs, but deletion is a later anti-forensic action and did not remove audit
      logs; it is not repository acquisition taxonomy.
  - key: T1213_LINK_SHARE_OR_SYNC_OUT
    status: adjacent-technique
    reason: External sharing and synchronization are transfer/exfiltration or staging decisions after repository content is
      selected.
  second_pass_required: true
  second_pass_completed: true
  formal_niji_child_refs:
  - NJS-0143-001
  breadth_gap_explained: true
  reviewer_notes:
    zh: 6:1 差距按六项覆盖和二轮轴排除解释，但唯一子项为低置信度条件建议；主 Agent 须决定是接受还是把分类置 deferred。
    en: Six-to-one breadth is explained through six-row coverage and second-pass rejections, but the sole child is a low-confidence
      conditional proposal; the primary agent must accept it or defer taxonomy.
  breadth_gap_explanation:
    proposed_formal_niji_children: 1
    acceptable_only_after_primary_review: true
    explanation_zh: 六个 ATT&CK 子项主要按库产品、内容模式和接口划分。二轮搜索只得到一条可能独立的库内选择轴；集成身份与状态化增量分别已有正式对象，原位阅读和多主体稀释缺少结论级证据，接口与批量导出不是独立匿迹变量。因此
      6:1 差距是有解释的研究结果，须由主 Agent 审核选择性读取是否达到正式低置信度门槛；若未达到应设 taxonomy deferred，而非补造子项。
    explanation_en: The six ATT&CK children divide mainly by product, content model, and interface. The second pass found
      one potentially independent in-repository selection axis. Integration identity and checkpointed acquisition already
      have formal owners; in-place viewing and cross-principal dilution lack conclusion-level support, while API choice and
      bulk export are not standalone stealth variables. The 6:1 gap is thus explained, but the primary reviewer must decide
      whether selective reading meets even a low-confidence formal gate; otherwise taxonomy should be deferred rather than
      padded.
- source_attack_id: T1114
  attack_subtechnique_count: 3
  attack_subtechnique_ids:
  - T1114.003
  - T1114.001
  - T1114.002
  represented_dimensions:
  - zh: T1114.001 与 T1114.002 主要区分邮件副本所在端点与服务端，不直接区分匿迹变量。
    en: T1114.001 and T1114.002 chiefly distinguish endpoint and server placement, not stealth variables.
  - zh: T1114.003 以邮箱或传输规则功能划分，功能可支持到达触发分流，但规则存在不等于消息已经复制。
    en: T1114.003 partitions by mailbox or transport-rule function; that function can support arrival-triggered replication,
      but a rule's existence does not establish copied mail.
  breadth_trigger: examine_two_distinct_axes
  coverage_resolutions:
  - attack_id: T1114.001
    resolution: niji-variable-candidate
    explanation:
      zh: 本地邮件资料提供既存副本的可能载体；只有证明本次读取与先前同步分离才进入第一轴。
      en: Locally held mail can be a preexisting replica; only a current read separated from earlier sync supports the first
        axis.
  - attack_id: T1114.002
    resolution: parent-core
    explanation:
      zh: 服务器或云邮箱直接读取是父级邮件获取；是否服务器端不自动创造独立匿迹子项，选择性查询另作边界检验。
      en: Direct server or cloud mailbox reads are parent-core acquisition; server placement creates no child automatically,
        while selective queries need separate boundary review.
  - attack_id: T1114.003
    resolution: niji-variable-candidate
    explanation:
      zh: 规则功能提供投递处理证据；Niji 第二轴要求到达事件、选择谓词、实际副本和防守谱系，而非翻译原子项。
      en: Rule functionality informs delivery processing; the second Niji axis requires arrival, predicate, actual copy, and
        defender lineage rather than a translation of the ATT&CK child.
  candidate_stealth_axes_examined:
  - key: T1114_CHILD_PREEXISTING_REPLICA_READ
    verdict: formal_candidate
    trace: earlier server sync then current endpoint replica read without new server bind
    defense_difference: endpoint file and process lineage joined to mailbox sync scope
  - key: T1114_CHILD_ARRIVAL_CONDITIONED_REPLICATION
    verdict: formal_candidate_with_boundary_review
    trace: one predicate configuration then dispersed actual mail-routing copies
    defense_difference: rule version and match to message IDs and destinations
  - key: T1114_AXIS_SELECTIVE_QUERY
    verdict: parent_core_or_T1119
    trace: fewer server reads or date-selected PST extraction
    defense_difference: volume and query terms need mailbox baseline; generic scheduled incremental passes already owned by
      T1119
  - key: T1114_AXIS_NEW_EXPORT
    verdict: parent_core_plus_T1074
    trace: server export event followed by new PST or archive
    defense_difference: export and staging logs; not preexisting replica
  - key: T1114_AXIS_HIDDEN_RULE
    verdict: adjacent_or_deferred
    trace: rule state concealed from ordinary admin UI
    defense_difference: MAPI/property-level inspection; concealment of rule state is not itself a second mail-content acquisition
      mode
  second_pass_required: false
  second_pass_completed: false
  formal_niji_child_refs:
  - NJS-0144-001
  - NJS-0144-002
  breadth_gap_explained: true
  reviewer_notes:
    zh: 三个 ATT&CK 子项是广度先验。正式提案的两个子项按“本次读取发生在既存副本”与“后续投递事件触发条件副本”划分，前者要求服务器—端点审计错位，后者要求谓词—消息—目的地谱系；不按本地/远程/转发功能直接移植。精确检索、批量导出和隐藏规则经第二个边界检验后不另立子项。
    en: 'The three ATT&CK children are a breadth prior. The two proposed Niji children partition current reread of a preexisting
      replica from conditional copying on future delivery: the first requires a server-endpoint audit differential, the second
      a predicate-message-destination lineage. They do not import local, remote, or forwarding labels. Selective search, bulk
      export, and hidden-rule state do not become separate children after boundary review.'
- source_attack_id: T1185
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions:
  - Parent covers in-process browser access, browser proxy pivot, and page/form manipulation despite having no ATT&CK children
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - key: T1185_AXIS_IN_PROCESS
    resolution: parent-core
    reasoning:
      zh: 进程内借用会话是两个正式子项可共同使用的实现条件；单独按是否 DLL 注入分类会复制 T1055，且不能稳定区分页面共览与独立代理的观察差。
      en: In-process session borrowing is an implementation shared by both proposed children. Splitting on DLL injection would
        duplicate T1055 and would not distinguish co-viewed pages from an independent relay.
  - key: T1185_AXIS_COVIEW
    resolution: formal
    trace_change:
      zh: 页面访问期间出现 hook/扩展脚本、读取或改写请求及浏览器外连，服务端页面顺序可保持自然。
      en: A hook or extension script, request read or rewrite, and browser egress appear during page use while the server
        page sequence can remain natural.
    defender_difference:
      zh: 需要扩展权限与页面内容路径关联；仅有登录日志不足。
      en: Requires joining extension permissions to the page-content path; login logs alone are insufficient.
    evidence_keys:
    - T1185_REF_KASPERSKY
    - T1185_REF_ELASTIC
  - key: T1185_AXIS_RELAY
    resolution: formal
    trace_change:
      zh: 与用户可见页面无关的额外资源请求借同一浏览器会话出现，伴随浏览器进程控制与远端代理链路。
      en: Extra resource requests unrelated to the user-visible page appear under the same browser session, with browser process
        control and a remote relay.
    defender_difference:
      zh: 需要关联端点代理链、服务端资源序列及用户交互缺口。
      en: Requires joining endpoint relay, server resource sequence, and lack of matching user interaction.
    evidence_keys:
    - T1185_REF_COBALT
    - T1185_REF_ATTACK
  - key: T1185_AXIS_FORM_REWRITE
    resolution: adjacent-or-deferred
    reasoning:
      zh: 纯表单抓取与输入捕获 T1056 重叠；Qbot 登出重定向可延长会话却未证明内容读取。只有在改写诱导并实际取得页面/请求内容时才纳入同页中介，暂不另立按表单或改写方式划分的 NJS。
      en: Pure form grabbing overlaps T1056, while Qbot logout redirection preserves a session without proving content reads.
        A rewrite that elicits and captures page or request content belongs to co-viewed interposition; no separate form-
        or rewrite-based NJS is justified yet.
    evidence_keys:
    - T1185_REF_TALOS
    - T1185_REF_ELASTIC
  second_pass_required: false
  second_pass_completed: false
  formal_niji_child_refs:
  - NJS-0145-001
  - NJS-0145-002
  breadth_gap_explained: true
  reviewer_notes:
    zh: ATT&CK 无子项不等于 Niji 无划分；两条正式轴是会话操作位置与防守观察差，不是浏览器、工具或表单类型。第三轴因邻接技术及结果证据不足暂缓。
    en: No ATT&CK children does not imply no Niji split. The two proposed axes concern session operation and defender observations
      rather than browser, tool, or form type. A third axis is deferred because of adjacent techniques and insufficient outcome
      evidence.
- source_attack_id: T1123
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: []
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - axis: meeting_process_attribution
    resolution: proposed-formal
    variable: recorder host process is an audio-expected conference app
    trace_change: microphone event and audio file are attributable to an expected app process rather than a separate recorder
    defender_difference: join audio session to unapproved module or injection and meeting context
    evidence_keys:
    - T1123_REF_ESET_PDF
  - axis: call_application_interface_attachment
    resolution: parent-core
    variable: call media are acquired through a signed-in app interface and its grant path
    trace_change: third-party interface grant and call-timed artifacts replace a standalone microphone-recorder trail
    defender_difference: join requester identity, user approval, call session, and media artifact
    evidence_keys:
    - T1123_REF_T9000
  - axis: short_or_condition_triggered_recording
    resolution: evidence-deferred
    variable: start and stop device capture only on a trigger or operator command
    trace_change: shorter active microphone intervals are plausible but unmeasured in the reviewed Enterprise sources
    defender_difference: would require longer-window activation-to-command correlation, but no conclusion-level stealth source
      found
    evidence_keys: []
  - axis: memory_buffer_or_delayed_disk_write
    resolution: evidence-deferred
    variable: hold audio in memory or delay disk persistence
    trace_change: fewer immediate file writes are plausible but not established by Attor, which wrote encrypted files, or
      T9000, which wrote temporary files
    defender_difference: would shift from file creation to audio-session and memory/egress correlation if proven
    evidence_keys: []
  - axis: microphone_device_or_audio_format
    resolution: not-stealth-distinct
    variable: device model, OS API, codec, or filename
    trace_change: none inherent without an independently evidenced change in attribution or observability
    defender_difference: platform and parser tuning, not a stable Niji child boundary
    evidence_keys:
    - T1123_REF_ATTACK
  second_pass_required: false
  second_pass_completed: false
  formal_niji_child_refs:
  - NJS-0146-001
  breadth_gap_explained: true
  reviewer_notes:
    zh: ATT&CK 无子项仍开放检索五个轴。Attor 与 T9000 各有一手结论级录音观察，且防守实现差异明确；但两者共享借用通信应用身份的匿迹效果，接口类型差异不足以独立划分子项。建议只将 Attor 的进程归因变量正式化，T9000
      留作父级实例与独立检测分析。短时/条件触发与内存缓冲/延迟落盘没有足以证明企业端点匿迹结果的来源，暂不正式化；零 ATT&CK 子项不决定 Niji 数量。
    en: Despite no ATT&CK children, five axes were searched. Attor and T9000 each provide primary evidence of actual recording
      and distinct defense implementation, but they share the stealth effect of borrowing a communication-app identity. Interface
      type alone is insufficient for an independent child. Recommend formalizing only Attor's process-attribution variable;
      retain T9000 as a parent case and a separate analytic. Short/conditional capture and memory buffering/delayed disk writes
      lack sources establishing a stealth outcome on enterprise endpoints and remain nonformal. Zero ATT&CK children does
      not determine the Niji count.
primary_review:
  status: review
