review_type: cross-technique-taxonomy-duplicate
batch_ref: BATCH-TA0009-003
candidate_ref: WORK-TA0009-T1113
compared_existing_ref: NJS-0132-001
source_handoff: T1113-handoff.yaml
review_status: primary-accepted
recommendation:
  parent_decision: adapt
  formal_niji_child_count: 0
  parent_taxonomy_coverage: none-justified
  proposed_child_key: T1113_CHILD_TARGET_GATE
  proposed_child_resolution: defer-duplicate
  rationale:
    zh: 现有 NJS-0132-001 已将窗口名称或焦点谓词控制后继通信或截图何时开始作为稳定匿迹变量。T1113 草案的目标窗口门控截图沿用同一个谓词、同一非命中时段后继痕迹缺席、同一前后时序关联方法及 Attor 来源。增加截图已实际发生的证据，是判定
      T1113 父级收集完成和防止窗口发现越界所需的结果条件；它不改变攻击者控制的匿迹变量。故正式 T1113 应保留显示像素取得的独立父级行为和目标特定防御分析，但不再为该门控轴新增 NJS。
    en: Existing NJS-0132-001 already uses a window-name or focus predicate controlling when later communication or screenshots
      begin as its stable stealth variable. The proposed T1113 target-window child reuses the same predicate, absence of follow-on
      traces before a match, before/after correlation method, and Attor source. Requiring proof that a screenshot actually
      occurred establishes completion of the T1113 parent collection behavior and prevents window discovery from overreaching;
      it does not change the attacker-controlled stealth variable. The formal T1113 parent should preserve the distinct act
      of acquiring display pixels and target-specific defense analytics, without adding another NJS for this gate.
comparison:
- dimension: directly_controlled_variable
  existing:
    zh: 标题或前台窗口条件决定后继通信或截图何时开始。
    en: Title or foreground-window condition determines when later communication or capture begins.
  proposed:
    zh: 目标进程与前台窗口条件决定截图何时开始。
    en: Target-process and foreground-window conditions determine when screenshots begin.
  disposition: same-axis
  explanation:
    zh: Attor 的进程条件与窗口条件组合并未证明另一种独立的匿迹控制量；NJS-0132-001 明确容纳窗口所属进程与标题、焦点共同形成谓词。
    en: Attor's combination of process and window predicates does not establish another independent stealth control; NJS-0132-001
      expressly allows the owning process to combine with title and focus in the predicate.
- dimension: direct_information_object
  existing:
    zh: 读取窗口状态以取得条件信息，之后可触发任一后继行为。
    en: Read window state as condition information before any later behavior.
  proposed:
    zh: 截图后取得显示像素，属于 Collection 的直接对象。
    en: Acquire displayed pixels from a screenshot, the direct Collection object.
  disposition: distinct-parent-object-not-distinct-child-axis
  explanation:
    zh: 此差异足以保留 T1113 父技术，也允许同一事件同时标注 NJS-0132-001 和 T1113；但它是后继行为的对象，不是另一个门控变量。
    en: This difference preserves the T1113 parent and permits both NJS-0132-001 and T1113 on one event, but it identifies
      the later behavior's object rather than a second gating variable.
- dimension: trace_change
  existing:
    zh: 未命中时后继通信或收集事件缺席，命中后出现可见结果。
    en: Follow-on communication or collection events are absent before a match and visible after it.
  proposed:
    zh: 未命中时截图产物缺席，命中后十秒间隔产出画面。
    en: Screenshot artifacts are absent before a match and produced at ten-second intervals after it.
  disposition: screenshot-specific-instance-of-existing-trace-change
  explanation:
    zh: 十秒间隔是 Attor 实现参数；非命中时缺席、命中后出现的痕迹形状与现有子项相同。
    en: The ten-second interval is an Attor implementation parameter; absence before and appearance after a match is the existing
      child's trace shape.
- dimension: defender_observation_difference
  existing:
    zh: 用经验证的 GUI 窗口时间线、进程谱系及后继网络或截图结果做前后比较。
    en: Compare validated GUI-window timeline, process lineage, and later network or capture outcome before and after a match.
  proposed:
    zh: 在同一前后比较中加入实际取像成功或可信屏幕图像产物，以证明收集完成。
    en: Add capture success or a verified display-image artifact to the same before/after comparison to prove collection completion.
  disposition: additional-outcome-verification-not-new-stealth-observation
  explanation:
    zh: T1113 所需像素验证可由目标特定 NJA 实现；NJS-0132-001 的 DET-000141/NJA-000146 已允许截图作为后继结果，不因此需要第二套门控分类。
    en: A target-specific NJA can verify pixels for T1113; existing DET-000141/NJA-000146 already allows capture as a follow-on
      outcome, so it does not require another gating taxonomy.
- dimension: evidence
  existing:
    zh: REF-000484 的 Attor 应用选择博客已在 NJS-0132-001、CLM-000695、DET-000141 中使用。
    en: REF-000484's Attor application-selection report already supports NJS-0132-001, CLM-000695, and DET-000141.
  proposed:
    zh: REF-000583 的 Attor 白皮书第 19 页为同一案例补强实际截图、十秒间隔和加密产物。
    en: REF-000583's Attor white paper at page 19 strengthens proof of actual screenshots, ten-second intervals, and encrypted
      output in the same case.
  disposition: stronger-outcome-evidence-same-case
  explanation:
    zh: 新证据可扩展原有 Claim 或 T1113 父级 Case 的支持范围，不能仅因细节更完整而产生新 NJS 身份。
    en: The new evidence can strengthen an existing Claim or a T1113 parent Case; added detail alone does not create a new
      NJS identity.
- dimension: process-only-condition
  existing:
    zh: NJS-0132-001 排除仅按进程名选择且无窗口输入的行为。
    en: NJS-0132-001 excludes process-name-only selection without window input.
  proposed:
    zh: Attor 在目标进程内激活，但还监测前台窗口；白皮书未独立证明仅进程条件造成不同的匿迹效果。
    en: Attor activates inside target processes but also monitors foreground windows; the white paper does not independently
      establish a different stealth effect from process-only gating.
  disposition: possible-future-axis-evidence-deferred
  explanation:
    zh: 只有未来证据同时证明仅进程条件控制实际取像、改变了与窗口门控不同的痕迹及防守观察，才可重新评估 Niji 子项；当前不能从复合谓词拆出。
    en: Reconsider a Niji child only if future evidence establishes that a process-only predicate controls actual capture
      and changes traces and defender observation differently from window gating; the composite Attor predicate cannot be
      split now.
implementation_guidance:
  parent_scope:
    zh: T1113 正式父级直接描述并证明显示像素取得；Attor 可作为条件化截图案例，FunnyDream 作为连续抓屏对照。无取像结果的窗口匹配不得作为 T1113 完成事实。
    en: The formal T1113 parent should describe and prove acquisition of displayed pixels; Attor may serve as a conditional-capture
      case and FunnyDream as a continuous-capture comparator. A window match without acquisition cannot establish completed
      T1113.
  taxonomy:
    zh: 建议 subtechnique_taxonomy.coverage 为 none-justified，subtechnique_refs 为空。叙事须说明门控轴已由 NJS-0132-001 负责，阶段节奏、受信图形进程归因和缓冲输出目前缺少独立的结论级证据。
    en: Recommend subtechnique_taxonomy.coverage none-justified with no child refs. Its narrative should state that NJS-0132-001
      owns the gating axis and that phase cadence, trusted-graphics-process attribution, and buffered output lack independent
      conclusion-level evidence.
  detection:
    zh: T1113 可保留屏幕取像成功/可信像素产物的独立 NJA，并在有窗口遥测时与 DET-000141/NJA-000146 的条件链关联；后者检测窗口谓词，前者验证截图结果。缺少取像或产物验证时只能报告疑点。
    en: T1113 may retain a distinct NJA for successful screen capture or a verified pixel artifact and, where window telemetry
      exists, correlate with the condition chain in DET-000141/NJA-000146. The latter detects the window predicate; the former
      verifies the capture outcome. Without acquisition or artifact verification, report only a lead.
  mechanism:
    zh: 草案中的 NM-ST 低置信度释痕与既有 NJS-0132-001 的 NM-BT 条件缺席解释同一因果链，且没有阈值实测。主 Agent 应避免用不同机制编号包装重复子项；若父级要保留条件化匿迹描述，应限于已支持的观察差并明确复用该轴，不能宣称额外的空间或时间释痕效果。
    en: The draft's low-confidence NM-ST dilution and existing NJS-0132-001's NM-BT absence-on-nonmatch describe the same
      causal chain, without measured thresholds. The primary agent should not use different mechanism IDs to package a duplicate
      child. If the parent keeps conditional stealth prose, it should limit itself to the supported observation effect and
      explicitly reuse the existing axis, without claiming an additional spatial or temporal dilution effect.
  library:
    zh: REF-000583 与 REF-000512 应按 URL 复用并扩展 locator；CLM-000695 已声明窗口条件可限制后继截图。新 T1113 Claim 应聚焦像素已取得及可信产物，避免重复声明同一门控变量。
    en: Reuse REF-000583 and REF-000512 by URL and extend their locators. CLM-000695 already states that a window condition
      can confine later capture. New T1113 Claims should focus on acquired pixels and verified artifacts rather than restating
      the same gating variable.
