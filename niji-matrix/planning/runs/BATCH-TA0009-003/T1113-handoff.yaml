      en: The plugin activates in selected app processes, observes foreground windows, captures every ten seconds after a
        browser-title or target-app match, and writes encrypted output to Upload. Supports gating and results, not measured
        detection benefit.
  - temporary_key: T1113_REF_FUNNYDREAM
