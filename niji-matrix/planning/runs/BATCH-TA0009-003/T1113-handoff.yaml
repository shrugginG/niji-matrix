    locator: BLUELIGHT C2 loop and screenshot uploads, approximately thirty seconds for first five minutes then five minutes
    supports:
      zh: 证实有意编排的截图节奏与上传结果；文章并未把节奏切换归因为规避截图检测，且 .jpg 扩展名也用于非图像数据。
      en: Establishes programmed screenshot cadence and upload outcomes; the report does not attribute the cadence switch
        to capture-evasion, and the .jpg extension also labels nonimage data.
  - temporary_key: T1113_REF_MITRE_DET
    url: https://attack.mitre.org/detectionstrategies/DET0346/
    source_type: framework-detection
    confidence: medium
    supports:
      zh: 官方将截图命令和图形 API 调用作为检测线索；具体 API 字段、可见性与误报控制需本地验证。
      en: Officially identifies screenshot commands and graphics API calls as detection leads; concrete API fields, visibility,
        and false-positive controls require local validation.
  - temporary_key: T1113_REF_SYSMON
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/sysmon/sysmon-configuration-files
    source_type: vendor-documentation
    confidence: high
    supports:
      zh: Sysmon 事件 1、7、11 分别是进程创建、模块加载和文件创建；该列表不提供普通图形截图调用事件，不能以这些事件单独证明像素取得。
      en: Sysmon Events 1, 7, and 11 cover process creation, image load, and file creation; this list supplies no ordinary
        graphics-capture-call event, so those events alone cannot prove pixel acquisition.
  - temporary_key: T1113_REF_MS_WGC
    url: https://learn.microsoft.com/en-us/windows/uwp/audio-video-camera/screen-capture
    source_type: vendor-documentation
    confidence: high
    supports:
      zh: Windows.Graphics.Capture 提供选择器和黄色边框，适用于采用该接口的显示或窗口帧获取；不得外推到 CopyFromScreen、GDI 或所有截图工具。
      en: Windows.Graphics.Capture uses a picker and yellow border for display or window-frame acquisition through that API;
        not a general property of CopyFromScreen, GDI, or all screenshot tools.
  - temporary_key: T1113_REF_APPLE_SCREEN
    url: https://support.apple.com/en-ke/guide/mac-help/mchld6aa7d23/mac
    source_type: vendor-documentation
    confidence: high
    supports:
      zh: macOS 可按应用管理屏幕和系统音频录制权限；不证明所有恶意截图被阻断，也不保证集中审计。
      en: macOS allows per-app management of screen and system-audio recording rights; it does not prove all malicious screenshots
        are blocked or centrally logged.
  claims:
  - temporary_key: T1113_CLM_PARENT
    statement:
      zh: 屏幕捕获的完成条件是显示像素已被取得，截图能力、窗口状态与后续文件处理应分开判断。
      en: Screen capture completes when display pixels have been acquired; capture capability, window state, and later file
        processing require separate judgments.
    evidence_keys:
    - T1113_REF_ATTACK
    - T1113_REF_ATTOR_PDF
    - T1113_REF_FUNNYDREAM
    confidence: high
  - temporary_key: T1113_CLM_GATE
    statement:
      zh: Attor 的抓屏插件用目标进程和前台窗口条件控制每十秒一次的截图，未命中时该条件化产物链不执行；匿迹收益是低置信度防守推断。
      en: Attor's grabber uses target-process and foreground-window conditions to control ten-second screenshots, leaving
        that conditional output chain inactive on nonmatches; any stealth benefit is a low-confidence defensive inference.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    - REF-000484
    confidence: medium
  - temporary_key: T1113_CLM_CADENCE_LIMIT
    statement:
      zh: BLUELIGHT 的截图从初始阶段约三十秒一次转为每五分钟一次，但来源没有证明这一切换以规避检测为目的或实际达到检测阈值以下。
      en: BLUELIGHT switches screenshots from approximately every thirty seconds initially to every five minutes, but the
        source does not show evasion intent or that the switch fell below a detection threshold.
    evidence_keys:
    - T1113_REF_VOLEXITY
    confidence: high
  - temporary_key: T1113_CLM_FUNNYDREAM
    statement:
      zh: FunnyDream 样本每五秒取得屏幕图像，暂存 JPEG 并转包归档，是连续抓屏与文件可见性的对照，不能被描述为低频匿迹。
      en: The FunnyDream sample acquires screen images every five seconds, stages a JPEG and packages it, providing a continuous-capture
        and file-visibility comparator rather than low-frequency stealth.
    evidence_keys:
    - T1113_REF_FUNNYDREAM
    confidence: high
  cases:
  - temporary_key: T1113_CASE_ATTOR
    name:
      zh: Attor 目标窗口条件截图
      en: Attor Target-Window-Conditioned Capture
    event:
      zh: ESET 逆向分析显示 Attor 抓屏插件只在攻击者选定的应用进程中启用，检查前台窗口及浏览器标题，匹配后每十秒截图并加密写入 Upload 目录。
      en: ESET reverse engineered Attor's grabber activating only in attacker-selected app processes, checking foreground
        window and browser title, then capturing every ten seconds after a match and writing encrypted output to Upload.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
  - temporary_key: T1113_CASE_FUNNYDREAM
    name:
      zh: FunnyDream 持续抓屏
      en: FunnyDream Continuous Screen Grab
    event:
      zh: Bitdefender 报告 ScreenCap 通过 GDI+ 链取得 JPEG，先写 ws.tmp 后转成二进制包并归档；所见配置以五秒间隔持续运行。
      en: Bitdefender reports ScreenCap acquiring JPEGs through a GDI+ chain, writing ws.tmp before converting images into
        binary blobs and archives; the observed configuration runs continuously at five-second intervals.
    evidence_keys:
    - T1113_REF_FUNNYDREAM
  detection_strategies:
  - T1113_DET_CAPTURE_GATE
  detection_analytics:
  - T1113_NJA_CAPTURE_GATE
  - T1113_NJA_CAPTURE_ARTIFACT
  mitigations:
  - T1113_MIT_CAPTURE
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: target_context_gated_pixel_acquisition
      resolution: proposed-formal
      variable: selected process and foreground window predicate controls actual display-pixel capture
      trace_change: image output absent before or outside match and repeats at ten-second intervals on match
      defender_difference: require target-state-to-capture-success-to-artifact join rather than window-query-only detection
      evidence_keys:
      - T1113_REF_ATTOR_PDF
    - axis: phase_based_cadence_dilution
      resolution: evidence-deferred
      variable: screenshot interval changes between operation phases
      trace_change: BLUELIGHT output shifts from roughly thirty seconds to five minutes
      defender_difference: longer observation windows would be needed if cadence actually reduced alertability
      evidence_keys:
      - T1113_REF_VOLEXITY
    - axis: trusted_graphics_process_attribution
      resolution: evidence-deferred
      variable: malicious capture executes inside a normally graphical app process
      trace_change: capture calls and artifacts may be attributed to app process rather than a stand-alone grabber
      defender_difference: requires module and injection lineage, but the reviewed Attor source does not establish a separate
        stealth outcome for screenshot attribution
      evidence_keys:
      - T1113_REF_ATTOR_PDF
    - axis: memory_buffer_or_delayed_file_output
      resolution: evidence-deferred
      variable: acquired pixels held in memory or emitted later
      trace_change: immediate file output would be reduced if shown
      defender_difference: would shift detection toward capture-session and later network correlation; reviewed Attor and
        FunnyDream cases write files
      evidence_keys:
      - T1113_REF_ATTOR_PDF
      - T1113_REF_FUNNYDREAM
    - axis: api_os_format_or_image_target
      resolution: not-stealth-distinct
      variable: capture API, operating system, image extension, window type, or product
      trace_change: none inherent without an independently supported observation effect
      defender_difference: parser and platform tuning, not a stable Niji child boundary
      evidence_keys:
      - T1113_REF_ATTACK
      - T1113_REF_MS_WGC
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定版零 ATT&CK 子项只说明无需高广度触发，仍审查五个轴。Attor 能同时证明条件与实际图像结果，故建议一项 NJS；BLUELIGHT 的阶段节奏未报告规避动机或检出差，受信图形进程归因与门控在 Attor 中重叠且独立收益未证，缓冲轴与现有落盘实例相反。正式数量由证据决定，与
        ATT&CK 零子项无对应关系。
      en: Zero fixed-baseline ATT&CK children avoids a high-breadth trigger but did not stop the five-axis search. Attor proves
        both predicate and image outcome, supporting one NJS. BLUELIGHT's phase cadence lacks reported evasion motive or detection
        difference. Trusted-process attribution overlaps Attor's gate without an independently established benefit, and buffering
        conflicts with the observed file writes. Evidence determines the formal count, not the absence of ATT&CK children.
  evidence_coverage:
    parent_behavior_keys:
    - T1113_REF_ATTACK
    - T1113_REF_ATTOR_PDF
    - T1113_REF_FUNNYDREAM
    boundary_keys:
    - T1113_REF_ATTACK
    - T1113_REF_ATTOR_PDF
    - T1113_REF_FUNNYDREAM
    - T1113_REF_MS_WGC
    mechanism_support:
    - mechanism_ref: NM-ST
      evidence_keys:
      - T1113_REF_ATTOR_PDF
      conclusion_level: target condition and post-match output observed; reduced nonmatch trace inferred; no measured detection
        threshold
    child_existence_support:
    - child_key: T1113_CHILD_TARGET_GATE
      evidence_keys:
      - T1113_REF_ATTOR_PDF
      conclusion_level: direct process and foreground predicate plus actual ten-second encrypted screenshot output
    unsupported_or_deferred:
    - key: T1113_AXIS_CADENCE
      reason:
        zh: BLUELIGHT 节奏切换真实存在，但没有来源把它与匿迹意图、告警阈值或检出变化联系起来；不能把普通分阶段采样直接写成 NM-ST。
        en: BLUELIGHT's cadence switch is real, but no source links it to evasion intent, alert thresholds, or detection change;
          ordinary phase sampling cannot be written directly as NM-ST.
    - key: T1113_AXIS_MEMORY
      reason:
        zh: Attor 和 FunnyDream 都有明确落盘产物，当前没有一手证据证明另一截图链通过内存缓冲改变观察面。
        en: Attor and FunnyDream both have explicit disk artifacts; no reviewed primary case shows another screenshot chain
          changing observation through memory buffering.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 草案分别说明屏幕像素完成点、门控引起的截图缺席和出现、T1125 输入源与相邻收集边界、交互会话前提、窗口及图形传感器盲区、合法支持反例、Attor 结论级子项与 BLUELIGHT 暂缓理由。主 Agent 仍需与 T1125
        收敛，并复核 NM-ST 低置信度能否进入正式对象。
      en: The draft distinguishes the pixel-acquisition completion point, gated absence and presence of screenshots, T1125
        input source and adjacent collection boundaries, interactive-session prerequisites, window and graphics-sensor blind
        spots, legitimate support comparators, the Attor-supported child, and BLUELIGHT deferral. The primary agent still
        needs to converge with T1125 and review whether low-confidence NM-ST belongs in the formal object.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed ATT&CK workbook OOXML row lookup
    - exact URL duplicate search
    - YAML syntax verification
  limitations:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿锚定 T1113 的 TA0009、平台和零子项；在线 ATT&CK 页面只用于来源追溯与检测线索。ESET 对 Attor 的逆向结果能证明门控及命中后截图，但没有量化检测规避；Bitdefender
        的 FunnyDream 证明持续截图与文件痕迹而非匿迹；Volexity 的 BLUELIGHT 证明频率变化而非规避目的。正式机理必须保留这三个结论层级，不能把工具能力或代码配置写成现场告警下降。
      en: The fixed ATT&CK Enterprise 19.1 workbook anchors T1113's TA0009 mapping, platforms, and zero children; the live
        ATT&CK page is used only for provenance and detection leads. ESET's Attor reverse engineering proves gating and post-match
        capture but not measured detector evasion. Bitdefender's FunnyDream proves continuous capture and file traces rather
        than stealth. Volexity's BLUELIGHT proves a cadence change rather than evasion purpose. A formal mechanism must preserve
        these three evidence levels and must not turn tool capability or code configuration into a field-measured alert reduction.
    - zh: 本交接的分析实施范围是有试点验证的 Windows 图形与窗口传感器，并需要可确认的像素结果。Sysmon 进程、模块和文件事件提供谱系及产物线索，不是截图 API 事件。Windows.Graphics.Capture 的选择器与边框仅属于该
        API；macOS 屏幕录制许可是平台控制能力，并不保证集中可导出的逐次截图日志。缺少可用传感器时，防守输出须降级，且合法远程支持、会议共享、无障碍和用户截图始终需要业务授权上下文。
      en: The proposed analytics apply to Windows environments with pilot-validated graphics and window sensors and verifiable
        pixel outcomes. Sysmon process, module, and file events provide lineage and artifact leads, not screenshot-API events.
        The Windows.Graphics.Capture picker and border belong only to that API; macOS screen-recording grants are a platform
        control and do not guarantee centrally exportable per-capture logs. Without the required sensors, defensive output
        must be downgraded, and authorized remote support, meeting sharing, accessibility, and user screenshots always need
        business-authorization context.
  rejected_mechanisms:
  - mechanism_ref: NM-FD
    reason:
      zh: Attor 抓屏插件确在目标应用进程运行，但来源没有把其进程身份证明为独立于目标门控的截图匿迹收益；不把工具架构直接当作特征伪装机理。
      en: Attor's grabber runs inside target apps, but the source does not establish process identity as a screenshot-stealth
        benefit independent of target gating; tool architecture alone is not feature disguise.
  - mechanism_ref: NM-DO
    reason:
      zh: Attor 的加密产物和 FunnyDream 的二进制包属于取得后的内容处理，可分别分析 T1074/T1560；不能反向充当屏幕像素取得本身的匿迹机理。
      en: Attor's encrypted artifacts and FunnyDream's binary packages are post-acquisition handling that can be assessed
        under T1074/T1560; they cannot retroactively serve as the mechanism of pixel acquisition itself.
  open_questions:
  - zh: 主 Agent 应裁决 Attor 的低置信度 NM-ST 推断是否满足正式机理门槛；若不满足，应保留研究记录、缩小父级声明，并考虑子项暂缓，不能用通用 BT 或 FD 代填。
    en: The primary agent should decide whether Attor's low-confidence NM-ST inference meets the formal mechanism threshold.
      If not, keep it in research, narrow the parent claim, and consider deferring the child rather than substituting generic
      BT or FD.
  - zh: 正式集成要与 T1125 研究者确认屏幕共享和摄像头视频帧的输入源边界；同一会议可双标，但每项都需独立的像素来源和实际取得证据。
    en: Integration should confirm the input-source boundary for screen sharing and camera/video frames with the T1125 researcher.
      One meeting may receive both labels, but each needs independent source and acquisition evidence.
