handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-003
work_item_ref: WORK-TA0009-T1113
temporary_key_prefix: T1113_
candidate:
  source_type: attack
  source_attack_id: T1113
  source_attack_version: '19.1'
  name:
    zh: 屏幕捕获
    en: Screen Capture
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿把 T1113 置于 TA0009 Collection，直接行为是取得桌面或应用窗口显示像素，且没有 ATT&CK 子项。ESET 对 Attor 的逆向分析确证按目标进程及前台窗口条件取得截图，Bitdefender
        对 FunnyDream 的分析确证连续截图与本地产物。屏幕捕获作为父行为应保留，但一般用户截图或持续截屏并不自身证明匿迹；建议将正式 Niji 父级适配为攻击者控制截图发生条件的屏幕像素获取，明确至少取得过一帧显示像素。
      en: The fixed ATT&CK Enterprise 19.1 workbook places T1113 in TA0009 Collection, with desktop or application-window
        display pixels as the direct object and no ATT&CK children. ESET's Attor analysis establishes screenshots acquired
        under target-process and foreground-window conditions; Bitdefender's FunnyDream analysis establishes continuous capture
        and local artifacts. Preserve the parent capture behavior, but an ordinary user screenshot or continuous capture does
        not itself establish stealth. Adapt the formal Niji parent to acquisition of screen pixels under attacker-controlled
        capture conditions, requiring evidence that at least one displayed frame was actually obtained.
    - zh: 目前仅有 Attor 足以支撑一个稳定的 Niji 子项：目标应用和前台内容条件控制截图是否发生，命中后每十秒产生截图并加密写入 Upload 目录。条件读取步骤与 NJT-0132 的窗口发现可并存，但 T1113 子项须以实际像素产物及其命中前后差异为判定核心。BLUELIGHT
        的三十秒转五分钟节奏证明频率变化，却未证明降低检测阈值或匿迹目的；FunnyDream 的五秒持续抓屏与落盘反而显示高密度对照。二者不应为追求子项数被提升为正式匿迹子技术。
      en: 'At present Attor supports one stable Niji child: target-app and foreground-content conditions determine whether
        screenshots occur, followed by capture every ten seconds and encrypted writes to an Upload directory. Reading those
        conditions may also be NJT-0132 window discovery, but the T1113 child requires acquired pixels and a before/after
        difference in capture outcome. BLUELIGHT''s shift from thirty-second to five-minute screenshots proves a frequency
        change, not evasion intent or passage below a detection threshold. FunnyDream''s five-second continuous capture and
        disk writes instead offer a high-density comparator. Neither should become a formal stealth child merely to increase
        the count.'
  scope_notes:
    zh: 直接对象是显示器、桌面或应用窗口的像素；T1125 直接对象是摄像头、视频通话或其他视频输入帧，不能仅以静态图像与视频文件格式区分。T1123 负责音频，NJT-0132/T1010 负责窗口状态发现，T1056 负责按键和界面输入。T1074
      与 T1560 负责屏幕像素取得后的暂存、压缩或加密归档。合法远程支持、会议共享、质检、无障碍和用户主动截图是必要反例；仅有截图命令、模块能力、窗口匹配或图像文件名都不足以断言已恶意采集。
    en: The direct object is pixels from a display, desktop, or application window. T1125 takes camera, video-call, or other
      video-input frames; a still image versus video file is not the boundary. T1123 owns audio, NJT-0132/T1010 owns window-state
      discovery, and T1056 owns keystrokes and interface input. T1074 and T1560 own staging, compression, or encrypted archiving
      after pixels are acquired. Authorized remote support, meeting sharing, quality assurance, accessibility, and user-initiated
      screenshots are necessary benign comparators. A screenshot command, module capability, window match, or image filename
      alone does not prove malicious acquisition.
proposed_content:
  temporary_key: T1113_PARENT
  name:
    zh: 匿迹型屏幕捕获
    en: Stealth-Oriented Screen Capture
  summary:
    zh: 攻击者取得桌面或应用窗口的显示像素，并以受控的目标与时机减少无关截图痕迹，使按全屏持续抓取假设建立的观察更难还原采集过程。
    en: An adversary acquires desktop or application-window pixels while controlling capture target and timing, reducing irrelevant
      capture traces and complicating reconstruction based on continuous full-screen capture assumptions.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型屏幕捕获是攻击者在已控制的交互桌面上把显示像素读入其控制的程序、内存或截图产物，以获取用户正在观看的邮件、文档、会话或其他可视信息，并有意改变截图发生的条件。其完成点是像素已经被取得，而不是拥有截图代码、发现窗口标题或准备一个输出目录；一次截图、周期抓屏与窗口内截图都可能属于父级，前提是具有可论证的匿迹变量。
      en: Stealth-Oriented Screen Capture is the adversary's reading of displayed pixels from a controlled interactive desktop
        into its program, memory, or image artifact to acquire visible email, documents, conversations, or other information,
        while deliberately changing when capture occurs. Completion requires acquired pixels, not possession of screenshot
        code, discovery of a window title, or preparation of an output folder. A single screenshot, periodic capture, or application-window
        capture can fall within the parent when a defensible stealth variable is present.
    - zh: 截屏路径可以调用操作系统工具、图形接口或应用内部组件；这些路径只说明怎样取像，不自动构成不同技术。ESET 的 Attor 插件提供已观测的条件化像素获取实例，Bitdefender 的 FunnyDream 则证明持续屏幕抓取也能产生相同类别的像素结果。正式分类需要把行为设计、取得结果及防守观察差相连，而不按工具、操作系统、API
        或文件扩展名分拆。
      en: Capture may use an operating-system utility, graphics API, or in-app component; these paths describe how pixels
        are obtained and do not automatically define separate techniques. ESET's Attor plugin provides an observed instance
        of conditional pixel acquisition, while Bitdefender's FunnyDream shows that continuous screen grabbing can produce
        the same class of pixel result. Formal classification joins behavior design, acquisition outcome, and defender-observation
        difference rather than splitting by tool, operating system, API, or extension.
  stealth_characteristics:
    paragraphs:
    - zh: 条件化截图改变截图产物与目标上下文的分布：未命中目标进程或前台窗口时不形成该采集链，命中后才在较窄的时段连续输出目标画面。相对无条件抓屏，防守方若只检查固定短时窗口或搜索大量全屏图片，可能错过等待阶段，且较难从孤立截图推断前置门控。该效果是从
        Attor 行为推得的观察差，来源没有量化告警降低或证明所有传感器都会漏报。
      en: Conditional capture changes the distribution of screenshot artifacts relative to target context. The capture chain
        remains inactive before a selected process or foreground window matches, then emits target images in a narrower period.
        Compared with unconditional grabbing, a defender examining only a fixed short interval or looking for a large run
        of full-screen images may miss the waiting phase and struggle to infer the preceding gate from isolated images. This
        is an observation effect inferred from Attor's behavior; the source does not measure alert reduction or prove all
        sensors miss it.
    - zh: 截图并未因此不可见。Attor 仍需存在于交互进程中，命中后每十秒取得图像，并把加密产物交给共享 Upload 目录；FunnyDream 在五秒循环中还留下临时 JPEG、二进制包和归档。进程与模块谱系、经验证的图形捕获遥测、文件创建和目标窗口会话可以提供重建线索。只有确认相应数据被采集并可用同一进程与会话关联，才能把“预期目标下出现像素结果”提升为分析结论。
      en: The screenshots are not invisible. Attor still resides in an interactive process, obtains an image every ten seconds
        after a match, and places encrypted output in a shared Upload directory. FunnyDream's five-second loop also leaves
        a temporary JPEG, binary blobs, and archives. Process and module lineage, validated graphics-capture telemetry, file
        creation, and target-window session context can reconstruct the action. A conclusion about pixels appearing under
        the selected context requires proof that these sources were collected and joinable by process and session.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入攻击者实际读取桌面、显示器或应用窗口像素，并以目标状态控制取像而改变截图痕迹的情形。只读取窗口标题、焦点、句柄或进程名称而没有画面取得，归 NJT-0132；仅具截图能力、发出失败命令、创建空目录或生成非屏幕图像，也不达到本技术完成点。受信应用中出现截图并不自动证明恶意，仍须检验代码来源、业务授权及结果去向。
      en: Include actual acquisition of desktop, display, or application-window pixels when target state controls acquisition
        and changes capture traces. Reading only title, focus, handle, or process name without pixels belongs to NJT-0132.
        A screenshot capability, failed command, empty directory, or image unrelated to the display does not reach this technique's
        completion point. A screenshot within a trusted app is not automatically malicious; code provenance, business authorization,
        and outcome destination still matter.
    - zh: 摄像头及视频通话图像输入归 T1125，即使只存单帧；屏幕共享或桌面录像若直接取得显示像素仍由 T1113 负责，是否同时涉及其他媒介应另证。麦克风与通话声音归 T1123，按键和界面操作输入归 T1056。取得后的集中暂存可另标
        T1074，压缩或加密包可另标 T1560，网络发送不能代替屏幕取得证据。员工主动截图、授权远程协助、会议共享和无障碍辅助属于相同观察面的正常反例。
      en: Camera and video-call visual input belongs to T1125 even if only one frame is saved. Screen sharing or desktop recording
        still has display pixels as its direct source and falls under T1113; other media require their own evidence. Microphone
        or call audio belongs to T1123, and keystrokes or interface input to T1056. Central staging after capture may also
        be T1074, compression or encryption T1560, and network transfer cannot substitute for proof of pixel acquisition.
        Employee-initiated screenshots, authorized remote help, meeting sharing, and accessibility assistance are benign comparators
        on the same observation surface.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已在用户登录的 Windows 工作站运行植入组件，等待浏览器、邮件客户端或即时通信窗口呈现目标内容后截图。Attor 在选中的进程中激活抓屏插件，并对符合条件的前台窗口每十秒取像，适合等待高价值会话出现而不持续保存无关桌面画面。另一种已观测的连续抓屏可由
          FunnyDream 说明，但其高频落盘是对照案例，不构成同一匿迹子项。
        en: An adversary runs an implant on a logged-in Windows workstation and waits for a browser, mail client, or messaging
          window to show target content. Attor activates a grabber in selected processes and captures a qualifying foreground
          window every ten seconds, fitting a campaign that waits for a high-value session without continuously storing unrelated
          desktop images. FunnyDream illustrates observed continuous capture, but its frequent disk output is a comparator
          rather than the same stealth child.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要在有交互桌面的会话内执行截图代码或控制具有等效访问能力的进程，并掌握可判断目标窗口的进程名、标题类别或前台状态。条件化采集还要求组件驻留并接受目标不出现时没有截图的成本；若恶意模块寄居其他应用，则须承担注入或加载造成的额外痕迹。攻击者不能假定所有图形接口无提示，也不能假定文件或网络遥测被关闭。
          en: The attacker needs capture-capable code in an interactive desktop session or control of an equivalent process
            and knowledge of process names, title categories, or foreground state that identify a target. Conditional capture
            requires residence and accepts no screenshot if the target never appears. If the malicious module inhabits another
            app, injection or loading adds traces. The attacker cannot assume every graphics API is promptless or that file
            and network telemetry are absent.
      defender_model:
        paragraphs:
        - zh: 防守方可能获得进程创建、模块加载、文件创建、用户会话、前台窗口及经试点验证的截图接口调用数据。Sysmon 的进程或文件事件不能单独证明发生图形抓取，也无法解释加密文件内容；Windows.Graphics.Capture
            的选择器和黄色边框只适用于该接口，不能泛化到 Attor 使用的路径。若没有能把调用主体、目标窗口和像素结果连起来的传感器，检测只能报告可疑图像链或模块行为，不能把窗口匹配当成截图完成。
          en: Defenders may have process creation, module load, file creation, user session, foreground-window state, and
            capture-API data from a pilot-validated sensor. Sysmon process or file events alone do not prove a graphics grab
            or explain encrypted contents. The picker and yellow border documented for Windows.Graphics.Capture apply to that
            interface, not automatically to Attor's path. Without telemetry joining caller, target window, and pixel outcome,
            detection can report only a suspicious image chain or module behavior and cannot treat a window match as completed
            capture.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 让截图只在目标窗口命中后的较窄时段出现
      en: Confine screenshots to a narrower period after target-window matches
    analysis:
      paragraphs:
      - zh: 攻击者把截图执行绑定到目标进程与前台窗口条件，而非在每个运行时段无条件抓屏；Attor 的实际取像和加密文件只在条件满足后按十秒节奏出现。无关时段少了截图结果，使短窗口图像量规则或只采样离散时段的防守方更难看见完整的等待与采集链。命中后产物仍可被文件及图形遥测发现，且是否真的低于本地阈值未被来源测量，所以只以低置信度提出时空释痕机理。
        en: The attacker binds capture execution to target-process and foreground-window conditions rather than grabbing the
          screen throughout runtime. Attor's observed image acquisition and encrypted files occur after a match at ten-second
          intervals. Fewer images in irrelevant periods make a short-window volume rule or sampled monitoring less likely
          to see the full waiting-and-capture chain. Post-match artifacts remain discoverable through file and graphics telemetry,
          and the source does not measure whether local thresholds were crossed, so this spatiotemporal-dilution mechanism
          carries low confidence.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    confidence: low
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 建议一个原生子项，以“显示像素取得是否受目标应用及前台内容条件门控”为稳定变量。它改变截图产生与缺席的时段、结果密度和可关联目标画面；判定必须同时看到条件、命中后实际像素取得和结果间隔，仅见窗口读取属于 NJT-0132。BLUELIGHT
          的频率切换、FunnyDream 的持续抓屏、截图 API 与文件格式均已检视；前者缺少结论级匿迹证据，后者只是父级对照或实现细节，均不作为正式兄弟项。
        en: Recommend one Niji child using the stable variable of whether target-app and foreground-content conditions gate
          acquisition of display pixels. It changes periods of screenshot presence and absence, artifact density, and the
          target imagery available for correlation. Classification requires the condition, pixels actually obtained after
          a match, and resulting capture intervals; a window read alone is NJT-0132. BLUELIGHT's cadence change, FunnyDream's
          continuous grab, capture APIs, and file formats were examined. The first lacks conclusion-level stealth evidence,
          and the others are parent comparators or implementation details rather than formal siblings.
    proposed_child_keys:
    - T1113_CHILD_TARGET_GATE
proposed_subtechniques:
- temporary_key: T1113_CHILD_TARGET_GATE
  formalization_recommendation: supported_low_confidence
  name:
    zh: 目标窗口门控截图
    en: Target-Window-Gated Screen Capture
  summary:
    zh: 攻击者仅在预选应用和前台窗口条件匹配后取得显示像素，使截图结果集中于目标画面及命中时段。
    en: An adversary acquires display pixels only after selected app and foreground-window conditions match, concentrating
      screenshot results in target imagery and matching periods.
  definition_and_concept:
    paragraphs:
    - zh: 目标窗口门控截图以截图执行条件为变量：恶意组件先检查宿主进程和当前前台窗口是否符合目标列表，条件命中才从对应显示画面取得像素。Attor 的抓屏插件在选定应用中激活，对浏览器标题或其他目标应用判断后每十秒生成截图，证明该变量实际控制了取像结果。子项并非把“发现窗口”改名；若只读到窗口状态而没有像素产物，就停留在
        NJT-0132。
      en: Target-Window-Gated Screen Capture uses execution conditions as the variable. A malicious component tests its host
        process and current foreground window against selected targets, then acquires pixels from the relevant display only
        on a match. Attor's grabber activates in selected apps and produces screenshots every ten seconds after evaluating
        browser titles or another target app, establishing that the variable controlled actual acquisition. The child does
        not rename window discovery; a window-state read without a pixel outcome remains NJT-0132.
    - zh: 条件可由进程名、窗口标题类别或前台状态组合形成，任何单一字符串值都不是子项身份。截图文件是否加密、是否经 Upload 目录传送也不是门控本身；它们改变后续检查与传输面，应作为并列产物或另行归类。
      en: Conditions may combine process name, window-title category, and foreground state; no particular string is the child's
        identity. Whether an image is encrypted or passed through an Upload directory is not the gate itself. Those choices
        affect later inspection and transfer and should be treated as accompanying artifacts or separately classified behavior.
  stealth_characteristics:
    paragraphs:
    - zh: 目标窗口门控截图使未命中时缺少截图文件、截图接口调用和画面输出，命中后则出现有规律的取像结果。防守方若只在任意时刻查找持续全屏截图，可能把没有产物的等待期当成没有采集能力，也难以从一张加密文件看到它对应的目标窗口。Attor
        同时留下驻留模块、前台条件读取和十秒间隔产物；在具备会话和文件关联的观察面中，该行为并不隐形。
      en: Target-Window-Gated Screen Capture leaves no image file, capture call, or output during a nonmatching interval,
        then produces regular results after a match. A defender looking only for continuous full-screen capture at arbitrary
        times may mistake a quiet waiting period for absence of capture capability and cannot infer the target window from
        one encrypted file. Attor still leaves a resident module, foreground-condition reads, and ten-second artifacts, so
        it is not invisible where session and file correlation are available.
  scope_boundary_definition:
    paragraphs:
    - zh: 必须同时证明攻击者控制的目标条件、条件命中后的实际截图结果，以及命中与未命中阶段的采集差异。独立的窗口枚举或焦点查询仍是 NJT-0132，单次用户主动截图或授权远程支持不属于本子项；无条件每隔固定时间截图属于父级行为，不能只因画面中碰巧出现邮件窗口而归入门控。选择目标应用并不要求证明攻击者知道每个窗口的文本内容。
      en: Require the attacker-controlled target condition, an actual screenshot result after matching, and a capture difference
        between matching and nonmatching periods. Independent enumeration or focus queries remain NJT-0132; a user-initiated
        screenshot or authorized remote help is outside the child. Unconditional fixed-interval capture remains parent behavior
        and does not become gated merely because an email window happens to appear in an image. Selecting an app does not
        require proof that the attacker knew every window's text.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在浏览器、邮件或即时通信应用会短暂呈现敏感内容的工作站，攻击者可让驻留插件等待预选进程及前台窗口，再按固定间隔取得该画面。Attor 是结论级实例：插件在目标应用激活，按前台窗口及浏览器标题决定取像，命中后每十秒写入加密截图。若目标应用从未运行或窗口始终未匹配，子项不应被记为已完成截图。
        en: 'On a workstation where browsers, mail, or messaging apps briefly display sensitive content, an adversary can
          let a resident plugin wait for selected processes and foreground windows, then acquire that display at a fixed interval.
          Attor is a conclusion-level example: its plugin activates in target apps, decides acquisition from the foreground
          window and browser title, and writes encrypted screenshots every ten seconds after a match. If the app never runs
          or the window never matches, this child should not be recorded as completed capture.'
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能在交互会话内运行或注入抓屏组件，配置可匹配的目标进程与窗口类别，并持续检查前台状态。等待目标降低无关产物却承担错过短暂画面、标题变化或用户改用其他应用的风险；注入还可能遭到应用完整性与模块谱系检测。其可控制条件和采样间隔，但不能假设操作系统或终端探针完全不记录图像产生。
          en: The attacker must run or inject a grabber in an interactive session, configure matching process and window categories,
            and continue observing foreground state. Waiting reduces irrelevant output but risks missing brief content, changed
            titles, or user migration to another app; injection may also be exposed by app-integrity and module-lineage checks.
            The attacker controls the predicate and sampling interval but cannot assume the OS or endpoint probe never records
            image creation.
      defender_model:
        paragraphs:
        - zh: 要确认本子项，防守方须将经验证的前台窗口事件、截图调用或可信产物识别、进程模块谱系和时间戳归到同一主机用户会话；只看到窗口匹配无法证明取像，只看到加密文件也无法确认其内容。生产环境可能只有 Sysmon 文件创建与进程日志，此时应报告较弱的条件链线索并保留调查级置信度。授权截图、远程协助及无障碍组件也会按窗口状态动作，需借工单和软件来源区分。
          en: To establish this child, defenders need validated foreground-window events, capture calls or reliable artifact
            identification, process-module lineage, and timestamps joined within one host, user, and session. A window match
            alone does not prove acquisition, and an encrypted file alone does not reveal content. Production environments
            may have only Sysmon file creation and process logs; they should then report a weaker conditional-chain lead with
            investigative confidence. Authorized screenshots, remote assistance, and accessibility tools can also react to
            windows and need work-order and software-provenance context.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 将截图产物限制在目标窗口出现后的时间片
      en: Restrict screenshot artifacts to intervals after target windows appear
    analysis:
      paragraphs:
      - zh: 恶意插件持续检查目标应用与前台状态，只有条件匹配才启动十秒一次的显示像素取得。与无条件采集相比，非目标时段缺少图像事件，使只观察局部时间片或按持续量设阈值的防守方更难重建“等待目标再取像”的链条。匹配阶段仍产生密集文件，来源未测量检出率，故只支持低置信度的局部释痕推断，不能声称全面规避检测。
        en: The malicious plugin continues checking selected apps and foreground state, starting ten-second pixel acquisition
          only on a match. Compared with unconditional capture, nontarget periods lack image events, making a defender limited
          to local time slices or sustained-volume thresholds less able to reconstruct a wait-then-capture chain. Matching
          periods still produce frequent files, and the source measures no detection rate. It therefore supports only a low-confidence
          inference of local trace dilution, not a claim of general detector evasion.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    confidence: low
  evidence_keys:
  - T1113_REF_ATTOR_PDF
  - REF-000484
  - T1113_REF_MITRE_DET
  defense_strategy_keys:
  - T1113_DET_CAPTURE_GATE
  mitigation_keys:
  - T1113_MIT_CAPTURE
  limitations:
    paragraphs:
    - zh: ESET 对 Attor 的逆向分析直接证明条件和命中后截图，却未给出条件未命中时的全量运行遥测、检测阈值或告警率。门控减少非目标截图是由代码条件与结果链得出的防守推断；若窗口状态探针缺失或加密产物无法识别，正式分析不能声称直接观察到了每次取像。合法按窗口截屏业务会产生相似时序，需以软件完整性和授权任务约束结论。
      en: ESET's reverse engineering directly establishes the predicate and post-match screenshots, but it does not supply
        complete nonmatch runtime telemetry, detection thresholds, or alert rates. Fewer nontarget images is a defensive inference
        from code conditions and outcomes. If window-state probes are absent or encrypted artifacts cannot be identified,
        an analytic cannot claim to have directly observed every capture. Legitimate window-conditioned screenshot workflows
        can show similar timing and require software-integrity and authorization context.
defense_candidates:
  detection_strategies:
  - temporary_key: T1113_DET_CAPTURE_GATE
    name:
      zh: 窗口条件与屏幕像素结果关联
      en: Correlate Window Conditions With Acquired Screen Pixels
    objective:
      zh: 在交互会话中把目标窗口出现前后的实际屏幕像素取得、截图产物和调用者谱系相连，识别未授权的条件化截图。
      en: Join actual pixel acquisition, image artifacts, and caller lineage across target-window appearance in an interactive
        session to identify unauthorized conditional capture.
    detects_keys:
    - T1113_PARENT
    - T1113_CHILD_TARGET_GATE
    domains:
    - enterprise
    analytic_keys:
    - T1113_NJA_CAPTURE_GATE
    - T1113_NJA_CAPTURE_ARTIFACT
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    - T1113_REF_MITRE_DET
    - T1113_REF_SYSMON
  detection_analytics:
  - temporary_key: T1113_NJA_CAPTURE_GATE
    strategy_key: T1113_DET_CAPTURE_GATE
    name:
      zh: 前台目标命中后截图链验证
      en: Verify Capture Chain After Foreground-Target Match
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在高价值交互终端的试点中验证窗口状态传感器和图形捕获传感器确能报告调用进程、会话、目标窗口、调用结果与时间。以主机、用户、会话及进程谱系关联同一主体的目标状态、捕获成功事件和随后可信识别的图像或加密产物；比较目标出现前后是否只有命中后出现一组有间隔的截图结果。若缺少取像成功或可验证产物，只报告窗口门控疑点而不归为
          T1113 已完成。
        en: Pilot window-state and graphics-capture sensors on high-value interactive endpoints and verify that they report
          caller process, session, target window, call result, and time. Join one actor's target state, successful capture
          event, and subsequently verified image or encrypted artifact by host, user, session, and process lineage; compare
          before and after target appearance for interval-spaced screenshot outcomes only after a match. Without successful
          acquisition or a verified artifact, report a possible window gate rather than completed T1113.
    data_requirements:
    - source_type: validated-window-state-sensor
      name:
        zh: 经验证的前台窗口状态传感器
        en: Validated foreground-window state sensor
      channel: null
      required_fields:
      - timestamp
      - host_id
      - user_id
      - session_id
      - actor_process_guid
      - target_window_key
      - title_category
      - foreground_state
    - source_type: validated-graphics-capture-sensor
      name:
        zh: 经验证的图形取像传感器
        en: Validated graphics-capture sensor
      channel: null
      required_fields:
      - timestamp
      - host_id
      - user_id
      - session_id
      - actor_process_guid
      - target_window_key
      - capture_result
      - pixel_source
    - source_type: endpoint-file-and-lineage
      name:
        zh: 终端文件与进程模块谱系
        en: Endpoint file and process-module lineage
      channel: Sysmon Event 1, 7, and 11 or verified EDR equivalent
      required_fields:
      - utc_time
      - computer
      - processguid
      - image
      - image_loaded
      - target_filename
    observables:
    - zh: 同一进程在目标窗口命中后才有成功的显示像素捕获和相关产物
      en: One process has successful display-pixel captures and related artifacts only after target-window matches
    - zh: 匹配时段的截图结果呈稳定间隔而未匹配时段缺席
      en: Capture outcomes recur at a stable interval during matching periods and are absent during nonmatching periods
    correlation:
      window:
        zh: 试点以目标首次命中前后各十分钟比较，并保留同一会话二十四小时的条件与结果摘要；按业务实际截图节奏校准，不把十秒固定为通用阈值。
        en: Pilot ten minutes on each side of the first target match and retain a twenty-four-hour session summary of conditions
          and outcomes; calibrate to legitimate capture cadence rather than treating ten seconds as a universal threshold.
      dimensions:
      - host_id
      - user_id
      - session_id
      - actor_process_guid
      - target_window_key
      - title_category
      - timestamp
    false_positives:
    - zh: 远程支持、RPA、无障碍和测试程序可合法地按窗口状态截图
      en: Remote support, RPA, accessibility, and testing tools may legitimately capture by window condition
    blind_spots:
    - zh: 默认 Sysmon 不记录每次图形取像；传感器不覆盖 GDI、受保护桌面或注入模块时不能确认像素取得
      en: Default Sysmon does not record every graphics capture; lack of GDI, protected-desktop, or injected-module coverage
        prevents proof of pixel acquisition
    tuning_guidance:
      paragraphs:
      - zh: 按软件发布者、批准的窗口类别、工单、用户会话和进程模块完整性建立基线，标题只存分类或隐私受控哈希。不要因进程签名或调用 BitBlt 就直接放行或告警；校准探针能否观察所选接口，再把缺少产物的结果降级为调查线索。
        en: Baseline publisher, approved window categories, work order, user session, and process-module integrity, storing
          only a title category or privacy-controlled hash. Do not automatically allow or alert on a signed process or a BitBlt
          call. Validate sensor coverage of the relevant interface and downgrade results without pixel outcomes to investigation
          leads.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    - T1113_REF_SYSMON
    - T1113_REF_MITRE_DET
  - temporary_key: T1113_NJA_CAPTURE_ARTIFACT
    strategy_key: T1113_DET_CAPTURE_GATE
    name:
      zh: 异常截图产物与调用者谱系关联
      en: Correlate Unusual Screenshot Artifacts With Caller Lineage
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在可审计的截图输出目录、临时目录及业务受控收集目录中记录文件创建、写入进程和后续封装事件，并以试点识别出的图像头、图像解码结果或样本族结构确认文件确为屏幕像素产物。将产物序列与进程及模块来源、交互用户和批准的远程支持/会议时段关联；若只有加密文件且没有取像传感器或可确认内容，输出应是可疑图像链而非已完成截图的强结论。
        en: Log file creation, writer process, and later packaging in auditable screenshot, temporary, and controlled collection
          paths, then confirm display-pixel content using an image header, decoded result, or pilot-validated family structure.
          Join the artifact sequence to process and module provenance, interactive user, and approved remote-support or meeting
          periods. If files are encrypted and no capture sensor or content verification exists, output a suspicious artifact
          chain rather than a strong completed-capture conclusion.
    data_requirements:
    - source_type: endpoint-file-creation
      name:
        zh: 终端文件创建与写入事件
        en: Endpoint file-creation and write events
      channel: Sysmon Event 11 or verified EDR equivalent
      required_fields:
      - utc_time
      - computer
      - processguid
      - image
      - target_filename
    - source_type: artifact-classification
      name:
        zh: 经验证的截图产物识别
        en: Validated screenshot-artifact classification
      channel: null
      required_fields:
      - timestamp
      - host_id
      - path
      - artifact_type
      - classification_basis
      - content_verified
    - source_type: endpoint-process-lineage
      name:
        zh: 进程与模块谱系
        en: Process and module lineage
      channel: Sysmon Event 1 and 7 or verified EDR equivalent
      required_fields:
      - utc_time
      - computer
      - processguid
      - parentprocessguid
      - image
      - image_loaded
    observables:
    - zh: 非批准进程或异常模块写出一组已确认为屏幕画面的图像产物
      en: An unapproved process or anomalous module writes a sequence confirmed as display images
    - zh: 临时截图被改写为二进制包或送入统一上传目录
      en: Temporary screenshots are transformed into binary packages or placed in a shared upload directory
    correlation:
      window:
        zh: 以同一主机、进程和会话在三十分钟内关联图像创建、临时文件改写与归档，长期定时截屏按二十四小时摘要复核；窗口值仅是试点起点。
        en: Join image creation, temporary-file rewriting, and packaging within thirty minutes by host, process, and session;
          review twenty-four-hour summaries for periodic capture. These windows are pilot starting points.
      dimensions:
      - host_id
      - process_guid
      - parent_process_guid
      - user_id
      - session_id
      - artifact_path
      - timestamp
    false_positives:
    - zh: 用户主动截图、会议录制、远程协助与质检工具也可能连续写出图像
      en: User screenshots, meeting recording, remote assistance, and quality-assurance tools may also emit image sequences
    blind_spots:
    - zh: 内存或直接网络输出没有文件事件；未知加密格式若不能验证内容，无法从扩展名证明截图
      en: In-memory or direct-network output has no file event, and an unverified encrypted format cannot prove screenshot
        content from its extension
    tuning_guidance:
      paragraphs:
      - zh: 对批准截图工作流维护发布者、路径、会话和业务 owner 清单，对未列出的产物保留抽样解码或样本族验证流程。不要仅按 JPEG 扩展名分类：BLUELIGHT 的报告说明该扩展名也用于非图像数据；对加密文件应以调用遥测或可核验结构提高结论强度。
        en: 'Maintain approved capture-workflow inventories by publisher, path, session, and business owner, and retain sampled
          decoding or family-structure validation for unlisted artifacts. Do not classify solely by a JPEG extension: the
          BLUELIGHT report shows that extension was also used for nonimage data. For encrypted files, use capture telemetry
          or verifiable structure to strengthen the conclusion.'
    evidence_keys:
    - REF-000512
    - T1113_REF_VOLEXITY
    - T1113_REF_ATTOR_PDF
    - T1113_REF_SYSMON
  mitigations:
  - temporary_key: T1113_MIT_CAPTURE
    name:
      zh: 屏幕采集主体与输出路径治理
      en: Govern Screen-Capture Actors and Output Paths
    summary:
      zh: 以批准主体、图形访问面和图像输出路径减少未经授权的屏幕像素获取机会，并保留可核验的结果链。
      en: Use approved actors, graphics-access surfaces, and image-output paths to reduce unauthorized acquisition of screen
        pixels and retain a verifiable outcome chain.
    description:
      paragraphs:
      - zh: 在有人机交互的高价值终端上，组织应盘点远程支持、会议共享、无障碍、截图与自动化工具的签名、负责人、会话范围和输出位置，并限制未知组件进入这些进程或写入业务收集目录。macOS 的按应用屏幕录制授权可作平台特定控制，Windows.Graphics.Capture
          的选择器和边框只约束采用该接口的程序；控制方案不能假定所有截屏路径都有统一许可开关。
        en: On high-value interactive endpoints, inventory the signatures, owners, session scopes, and output locations of
          remote support, meeting sharing, accessibility, screenshot, and automation tools, and constrain unknown components
          entering those processes or writing to business collection paths. macOS app-level screen-recording grants offer
          a platform-specific control, while Windows.Graphics.Capture's picker and border apply only to programs using that
          API. The control cannot assume a universal permission switch for all capture paths.
    domains:
    - enterprise
    measures:
    - key: approved-capture-actors
      name:
        zh: 登记截图与共享屏幕主体
        en: Register screenshot and screen-sharing actors
      description:
        paragraphs:
        - zh: 为每个批准工具记录发布者、业务 owner、目标会话、截图用途、预期输出目录和留存期，离职或工单结束后移除不再需要的权限。
          en: Record publisher, business owner, target session, capture purpose, expected output directory, and retention
            for each approved tool, and remove grants no longer needed after a user departure or work-order closure.
      control_type: governance
    - key: capture-process-integrity
      name:
        zh: 约束图形进程内未知模块
        en: Constrain unknown modules in graphics processes
      description:
        paragraphs:
        - zh: 在试点覆盖的高价值终端启用可执行代码和模块来源控制，阻断或隔离未批准的截图组件与注入链，并审计受信应用新出现的模块。
          en: On pilot-covered high-value endpoints, enforce executable and module provenance controls, block or isolate unapproved
            grabbers and injection chains, and audit newly loaded modules in trusted apps.
      control_type: preventive
    - key: screen-grant-and-output-review
      name:
        zh: 复核屏幕授权与产物去向
        en: Review screen grants and artifact destinations
      description:
        paragraphs:
        - zh: 对平台可管理的屏幕录制授权实行最小化，并审核临时图像、批量截图及非批准上传目录的写入主体与留存。
          en: Minimize platform-manageable screen-recording grants and review writers and retention for temporary images,
            screenshot batches, and unapproved upload directories.
      control_type: detective-support
    applications:
    - target_key: T1113_PARENT
      use:
        zh: 对屏幕像素采集，限制非批准截屏程序运行及敏感工作站上的跨应用取像权限，并保留图像产物与进程谱系供调查。
        en: For screen-pixel acquisition, restrict unapproved grabbers and cross-app capture permissions on sensitive workstations,
          retaining image artifacts and process lineage for investigation.
      expected_effect:
        zh: 减少可执行的未授权截屏路径，并提高取得结果与调用主体的可归属性。
        en: Reduce executable unauthorized capture paths and improve attribution of acquired images to their caller.
      limitations:
        zh: 用户合法截图和业务共享不能全面禁用；GDI 等路径不受 Windows.Graphics.Capture 选择器覆盖，内存或远程流输出也可能不落盘。
        en: Legitimate user screenshots and business sharing cannot be universally disabled; GDI paths are outside the Windows.Graphics.Capture
          picker, and memory or remote-stream output may avoid disk.
    - target_key: T1113_CHILD_TARGET_GATE
      use:
        zh: 为可依据前台窗口自动截图的工具建立目标类别与工单范围，监控受信图形进程的模块变化，并比较批准与未批准目录中目标命中后的截图产物。
        en: For tools that automatically capture by foreground window, define approved target categories and work-order scope,
          monitor module changes in trusted graphics processes, and compare post-match artifacts in approved and unapproved
          directories.
      expected_effect:
        zh: 缩短攻击者借正常应用驻留等待目标的空间，并使命中后的像素结果与授权条件可核对。
        en: Narrow the opportunity to wait inside a normal app for a target and make post-match pixel outcomes checkable against
          approved conditions.
      limitations:
        zh: 标题变化、合法自动化、受保护桌面和缺少图形取像遥测会降低区分力；仅控制输出目录不能阻止内存中取得像素。
        en: Changing titles, legitimate automation, protected desktops, and missing graphics-capture telemetry reduce discrimination;
          controlling output directories alone does not stop in-memory pixel acquisition.
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    - T1113_REF_APPLE_SCREEN
    - T1113_REF_MS_WGC
    - T1113_REF_SYSMON
