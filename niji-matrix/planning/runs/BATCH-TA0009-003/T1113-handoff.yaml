library_candidates:
  references:
  - temporary_key: T1113_REF_ATTACK
    url: https://attack.mitre.org/techniques/T1113/
    source_type: framework
    confidence: high
    supports:
      zh: 固定工作簿父行为与 TA0009 映射的在线核对、零子项、平台及 DET0346 线索；在线内容不改变 19.1 基线，也不独立证明 Niji 子项。
      en: Online cross-check of the fixed workbook's parent behavior, TA0009 mapping, zero children, platforms, and DET0346
        lead; live content does not migrate the 19.1 baseline or independently prove a Niji child.
  - temporary_key: T1113_REF_ATTOR_PDF
    reuse_ref: REF-000583
    url: https://web-assets.esetstatic.com/wls/2019/10/ESET_Attor.pdf
    source_type: sample-analysis
