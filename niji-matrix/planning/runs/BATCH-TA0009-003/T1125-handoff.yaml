      en: 'Add separately after the existing audio facts: Unit 42 reports that after user approval the plugin also recorded
        video calls, with temporary video in a video subdirectory; decrypted output showed periodic call images. This video
        conclusion comes directly from the same primary report, not inference from the audio description.'
