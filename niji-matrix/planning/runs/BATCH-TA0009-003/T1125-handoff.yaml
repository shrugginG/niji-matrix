      en: Supported Windows apps can have default and per-Package-Family-Name camera allow or deny policy; not universal per-app
        enforcement for classic desktop software.
  claims:
  - temporary_key: T1125_CLM_PARENT
    statement:
      zh: 视频捕获可从摄像头或视频通话接口取得间隔帧；文件为静态图片不排除 T1125，屏幕像素另归 T1113。
      en: Video capture can obtain interval frames from cameras or video-call interfaces; still-image files do not exclude
        T1125, while display pixels belong to T1113.
    evidence_keys:
    - T1125_REF_ATTACK
    - T1125_REF_T9000
    - T1125_REF_INV
    confidence: high
  - temporary_key: T1125_CLM_T9000_VIDEO
