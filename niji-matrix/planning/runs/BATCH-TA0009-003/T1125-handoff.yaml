      zh: 研究者在 2020 年 Zoom macOS 实验中以注入库继承已有相机授权并录制短视频，未将该路径识别为野外恶意实施。
      en: In a 2020 Zoom for macOS experiment, an injected library inherited an existing camera grant and recorded a short
        video; the report did not identify this path as an in-the-wild malicious deployment.
    evidence_keys:
