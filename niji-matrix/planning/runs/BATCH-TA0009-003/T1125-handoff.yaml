    source_type: framework
    locator: fixed Enterprise 19.1 workbook row 683; live page cross-check only
    supports:
      zh: 视频设备或视频通话输入、间隔图像、TA0009、无 ATT&CK 子项；不独立证明 Niji 匿迹效果。在线页面的更新不能替代固定工作簿。
      en: Camera or video-call input, interval images, TA0009, and zero ATT&CK children; not independent proof of Niji stealth.
        Live-page updates do not replace the fixed workbook.
  - temporary_key: T1125_REF_T9000
    resolution: reuse-and-extend REF-000584
    url: https://unit42.paloaltonetworks.com/t9000-advanced-modular-backdoor-uses-complex-anti-analysis-techniques/
    source_type: sample-analysis
    locator: Plugin
    supports:
      zh: Skype 运行登录且用户许可后录制视频通话；临时视频文件进入 video 子目录，会后压缩加密；解密后周期性图像直接证明视频画面取得。正常进程提示可能误导用户，但不是无提示绕过。
      en: Video-call recording after Skype is running, signed in, and user-approved; temporary files in the video subfolder
        and later compression and encryption; decrypted periodic images directly prove visual acquisition. An apparently normal
        process in the prompt may mislead, but no promptless bypass is shown.
  - temporary_key: T1125_REF_INV
    resolution: reuse-and-extend REF-000506
    url: https://www.welivesecurity.com/2018/06/07/invisimole-equipped-spyware-undercover/
    source_type: sample-analysis
    locator: Technical analysis; Internal storage table; backdoor commands 218 and 220
    supports:
      zh: 内部文件表明确区分 webcam 照片、屏幕截图和音频，命令 220 为摄像头拍照 API；可支持直接设备路径和源分类，不能证明摄像头指示规避或节奏匿迹。
      en: Internal file table distinguishes webcam photos, screen screenshots, and audio; command 220 is a webcam-photo API.
