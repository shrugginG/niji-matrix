research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: call_media_interface_context
      resolution: proposed-formal
      variable: third-party visual-media request rides a real signed-in video-call app and grant context
      trace_change: call-linked interface grant and video-subfolder frame output rather than a standalone camera-open trail
      defender_difference: join requester, grant actor, call session, and confirmed call frames; local camera activity alone
        is insufficient
      evidence_keys:
      - T1125_REF_T9000
    - axis: existing_camera_session_piggyback
      resolution: evidence-deferred
      variable: secondary consumer starts only while a user-initiated camera session is already active
      trace_change: no new initial LED activation in the older OS X demonstration, but a secondary consumer remains observable
      defender_difference: would require per-consumer rather than per-device-start accounting
      evidence_keys:
      - T1125_REF_WARDLE
    - axis: trusted_meeting_process_grant_inheritance
      resolution: evidence-deferred
      variable: injected recorder executes inside a previously authorized video-app process
      trace_change: the 2020 Zoom macOS lab generated no additional camera authorization prompt, while module provenance changed
      defender_difference: would require app-module integrity and camera-session attribution, not app grant alone
      evidence_keys:
      - T1125_REF_ZOOM
      - T1125_REF_APPLE_CAM
    - axis: short_or_conditional_camera_activation
      resolution: evidence-deferred
      variable: camera reads only on an operator or activity trigger
      trace_change: narrower device-active intervals are plausible, but Kazuar command capability and ATT&CK's interval-image
        language do not prove reduced visibility
      defender_difference: would need long-window command-to-device-session correlation and a specific positive case
      evidence_keys:
      - T1125_REF_ATTACK
    - axis: in_memory_frame_buffering
      resolution: evidence-deferred
      variable: hold frames without immediate disk writes
      trace_change: hypothetical reduction in local files; T9000 and InvisiMole both report files
      defender_difference: would require device or app-interface capture plus network or memory evidence, unsupported here
      evidence_keys: []
    - axis: codec_file_type_camera_model_or_os
      resolution: not-stealth-distinct
      variable: picture versus movie, format, product, API name, or operating system
      trace_change: no inherent stealth effect without a separately established provenance or observation change
      defender_difference: parser or sensor choice rather than a stable sibling boundary
      evidence_keys:
      - T1125_REF_ATTACK
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 零子项没有缩小搜索；检验了通话接口、已激活设备会话、受信进程授权继承、条件触发、内存缓冲及格式/平台六组轴。只有 T9000 同时具备野外样本、实际视频帧结果、授权语境和可实施的第三方接口防守差异。Wardle
        2016 与 Zoom 2020 均为技术演示，不能从实验可能性推断攻击者野外采用；其余轴缺少可证匿迹变化或只是格式差异。
      en: Zero ATT&CK children did not narrow the search. The review tested call interface, already active device session,
        trusted-process grant inheritance, conditional activation, memory buffering, and format/platform axes. Only T9000
        has an observed malware sample, actual visual output, grant context, and a workable third-party-interface defense
        distinction. Wardle 2016 and Zoom 2020 are technical demonstrations, not proof of malicious deployment; the remaining
        axes lack supported stealth effects or merely separate formats.
  evidence_coverage:
    parent_behavior_keys:
    - T1125_REF_ATTACK
    - T1125_REF_T9000
    - T1125_REF_INV
    boundary_keys:
    - T1125_REF_ATTACK
    - T1125_REF_T9000
    - T1125_REF_INV
    mechanism_support:
    - mechanism_ref: NM-FD
      evidence_keys:
      - T1125_REF_T9000
      conclusion_level: real video-call frame acquisition and source-stated possible grant confusion; no measured evasion
    child_existence_support:
    - child_key: T1125_CHILD_CALL
      evidence_keys:
      - T1125_REF_T9000
      conclusion_level: real older-Skype interface attachment, explicit approval, video capture, temporary files, decrypted
        interval frames
    unsupported_or_deferred:
    - key: T1125_AXIS_PIGGYBACK
      reason:
        zh: Wardle 2016 是研究演示，并未发现相应野外恶意实施；旧 OS X 指示模型不能直接迁移到现代平台。
        en: Wardle 2016 is a research demonstration without a corresponding observed malicious deployment; the older OS X
          indicator model is not portable to current platforms.
    - key: T1125_AXIS_TRUSTED_PROCESS
      reason:
        zh: Zoom 2020 实验确实录到视频且无新增授权提示，但它是特定版本实验，未证攻击者在野外以该轴实施。
        en: The 2020 Zoom experiment recorded video without another prompt, but it was version-specific laboratory work, not
          evidence of attackers deploying this axis in the wild.
    - key: T1125_AXIS_SHORT_BUFFER
      reason:
        zh: 间隔帧是 ATT&CK 允许的输出形态，不能据此证明短时设备激活；T9000 和 InvisiMole 均存在文件，不能构造无盘缓冲子项。
        en: Interval frames are an ATT&CK-permitted output form, not proof of short device activations; T9000 and InvisiMole
          both had files, so a diskless-buffer child is unsupported.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父子草案分别写明输入对象、取得完成条件、可信通话语境的痕迹与观察差、正常反例、攻击前提、防守数据、因果机理及来源限制；一项建议正式子项没有依 ATT&CK 子项或文件格式拆分。主 Agent 仍须与 T1113 的独立研究共同审定通话窗口截图和视频媒体帧边界。
      en: Parent and child drafts separately state input, completion condition, call-context trace and observation change,
        benign comparators, attacker prerequisites, defender data, causal mechanism, and evidence limits. The proposed child
        is independent of ATT&CK children and file format. The primary agent still needs to converge the call-window screenshot
        versus video-media frame boundary with the separate T1113 research.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - stdlib OOXML extraction of fixed T1125 workbook row
    - shared-library lookup and exact URL search
    - YAML syntax check
  limitations:
    paragraphs:
    - zh: 固定 Enterprise 19.1 工作簿用于范围与零子项锚定，在线 ATT&CK 页面只作交叉核对。Unit 42 对 T9000 的视频事实是一手逆向及解密产物观察，但旧 Skype API 不代表现行会议客户端；该报告说用户必须批准授权，且只认为提示可能误导，没有报告无提示绕过或告警降低。ESET
        的 InvisiMole 类型表证明 webcam 照片与屏幕截图分开，仍不能证明每次现场执行都取得摄像头画面或隐藏设备指示。Objective-See 的两项会话/权限差异均为研究演示，须保持假设层级。
      en: The fixed Enterprise 19.1 workbook anchors scope and zero-child inventory; the live ATT&CK page was only cross-checked.
        Unit 42's T9000 video facts are first-hand reverse engineering and decrypted-output observation, but the older Skype
        API does not represent current clients. The report requires user approval and describes only possible prompt confusion,
        not silent bypass or fewer alerts. ESET's InvisiMole type table distinguishes webcam photos from screen screenshots
        but does not prove every field execution acquired camera images or hid indicators. Objective-See's two session and
        permission differences remain research demonstrations at hypothesis level.
    - zh: Windows 与 Apple 文档说明用户可见的相机许可、指示及控制能力，不保证端点或会议产品可导出所需关联键。实施 NJA 前必须逐产品验证设备会话、第三方接口审计、视频会话模态与文件内容确认；若缺失，只能提出设备访问或授权暴露线索。合法会议录制、远程支持、质检及用户主动拍照都可能产生相同外观，因此不能由灯亮、文件扩展名或批准点击单独作恶意结论。
      en: Windows and Apple documents describe user-visible grants, indicators, and controls, not guaranteed exports of the
        required correlation keys. Before deployment, verify camera sessions, third-party interface audit, video modality,
        and media-content confirmation per product; without them only device-access or grant-exposure leads are justified.
        Authorized meetings, remote support, quality assurance, and user photography can share the same appearance, so camera
        light, extension, or approval click alone cannot establish malicious capture.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 现有证据没有证明短时或条件摄像头启停降低设备会话可见性；通话帧的周期性是输出节奏，不等于摄像头激活节奏。
      en: Evidence does not show that short or conditional camera activation reduces session visibility; periodic call-frame
        output is not a camera-activation cadence.
  - mechanism_ref: NM-DO
    reason:
      zh: T9000 会后加密和 InvisiMole 的临时文件保护属于已得画面后处理，可与 T1560 并列，不是本技术的采集入口机理。
      en: T9000 post-call encryption and InvisiMole temporary-file protection follow acquisition and may receive T1560; they
        are not the capture-entry mechanism.
  open_questions:
  - zh: 主 Agent 应在同一事件身份下扩展 CASE-000198 的视频直接事实及新 subject_refs，并更新 REF-000584 的 locator 与双语支持说明；勿新建同事件 Case 或把现有音频 Claim 升级为视频。
    en: The primary agent should extend CASE-000198 under the same event identity with direct video facts and new subject
      refs, and update REF-000584's locator and bilingual support. Do not create a duplicate case or promote the audio Claim
      into video evidence.
  - zh: DET-000162 与 NJA-000173 专指音频结果；视频分析需要不同内容确认与反例。MIT-000149 的媒体授权治理措施可扩展具体视频应用，主 Agent 需在最终共享库查重后裁决。
    en: DET-000162 and NJA-000173 concern audio outcomes; video analysis needs distinct content confirmation and benign comparators.
      MIT-000149's media-grant control can take video-specific applications, subject to final shared-library deduplication
      by the primary agent.
