      en: InvisiMole's sample type table lists webcam photos separately from screen screenshots but does not prove hidden
        camera indication or an independent cadence-based stealth effect.
    evidence_keys:
    - T1125_REF_INV
    confidence: high
  - temporary_key: T1125_CLM_ZOOM_LAB
