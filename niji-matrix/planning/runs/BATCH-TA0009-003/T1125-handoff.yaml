      zh: T9000 经用户批准的 Skype 接口录制视频通话，临时视频文件与解密后的周期性通话图像直接证明取帧；正常进程提示仅构成可能的用户误判。
      en: T9000 recorded video calls through a user-approved Skype interface; temporary video files and decrypted periodic
        call images directly establish frame capture, while the normal-process prompt supports only possible user confusion.
    evidence_keys:
    - T1125_REF_T9000
    confidence: high
  - temporary_key: T1125_CLM_CAMERA_SOURCE
