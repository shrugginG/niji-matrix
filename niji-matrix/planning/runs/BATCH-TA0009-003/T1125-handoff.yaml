candidate:
  source_type: attack
  source_attack_id: T1125
  source_attack_version: '19.1'
  name:
    zh: 视频捕获
    en: Video Capture
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿将 T1125 列为 Collection 父技术，覆盖摄像头、视频通话等视频输入的录像或间隔图像，且无 ATT&CK 子项。Unit 42 直接报告 T9000 在获用户许可后经已登录
        Skype 的接口录制视频通话，并在解密产物中见到周期性取得的通话图像；ESET 在 InvisiMole 样本的内部文件类型中区分 webcam 照片与屏幕截图。这足以保留视频取得这一行为，但单纯具有摄像头功能或生成图片不构成匿迹，应把
        Niji 父级适配为有意使视频取得混入可信通话语境或改变可见来源归因的采集行为。
      en: The fixed ATT&CK Enterprise 19.1 workbook places T1125 under Collection and covers recordings or interval images
        from camera and video-call inputs, with no ATT&CK children. Unit 42 directly reports T9000 recording video calls through
        a signed-in Skype interface after user approval and observing periodically captured call images in decrypted output.
        ESET distinguishes webcam photos from screen screenshots in InvisiMole's internal file types. These sources support
        retaining the acquisition behavior, but a camera capability or image file alone is not stealth. Adapt the Niji parent
        to acquisition deliberately placed in a trusted call context or otherwise changing attribution of the visible source.
    - zh: 建议只正式化一项有现场样本支持的原生子项：经通话应用接口取得视觉媒体，令第三方采集与正常会话及授权提示同现。T9000 的提示显示正常进程可能误导用户，但用户确需允许访问，不能宣称无提示绕过。Objective-See 在旧
        macOS 既有摄像头会话以及 2020 年 Zoom 进程内权限继承上做了能录到视频的实验，分别说明另一种潜在观察差；它们不是已见野外恶意实施，故不据此增列正式子项。
      en: 'Recommend one formal Niji child with an observed malware sample: acquiring visual call media through a call-app
        interface so third-party capture coexists with a normal session and grant prompt. Unit 42 says the prompt''s normal
        process could mislead a user, but the user had to approve access; no silent permission bypass is established. Objective-See
        demonstrated recording through an already active camera session on older macOS and inherited camera grants inside
        Zoom in 2020. These show potential observation differences, but they are experiments rather than observed malicious
        deployment and do not justify more formal children here.'
  scope_notes:
    zh: 直接对象是摄像头或视频通话输入的帧或序列，是否保存为图片或视频文件不决定分类。T1113 取得桌面和应用窗口像素；T1123 取得音频；设备授权、进程注入和接口许可属于前提或相邻行为；T1074/T1560 处理采集后的暂存与归档。同一会议可同时产生这些对象，须分别证明来源和结果。合法会议录制、远程支持、无障碍辅助、质检及用户主动拍照均为正常反例。
    en: The direct object is frames or sequences from a camera or video-call input; still-image versus movie storage does
      not determine classification. T1113 acquires desktop or application-window pixels, and T1123 acquires audio. Device
      grants, process injection, and interface approval are prerequisites or adjacent acts; T1074 and T1560 own later staging
      and archiving. One meeting may involve several of these objects, each requiring separate source and outcome evidence.
      Authorized meeting recording, remote support, accessibility, quality assurance, and user-initiated photography are benign
      comparators.
proposed_content:
  temporary_key: T1125_PARENT
  name:
    zh: 匿迹型视频捕获
    en: Stealth-Oriented Video Capture
  summary:
    zh: 攻击者取得摄像头或视频通话帧，并安排采集落在可信通话或设备使用语境中，使单看应用身份、摄像头指示或文件类型难以辨认未经授权的视觉记录。
    en: An adversary obtains camera or video-call frames while placing capture in a trusted call or device-use context, so
      app identity, camera indication, or file type alone poorly distinguishes unauthorized visual recording.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型视频捕获指攻击者在已有端点或通话应用访问能力后，从摄像头、视频通话媒体或同等视频输入取得一帧、多帧或连续序列，并有意利用采集入口与正常使用的关系削弱防守归因。判断核心是视觉媒体是否实际进入攻击者可控制的记录链；摄像头可用、授权已授予、插件已装入和后续文件加密只是不同层级的事实，均不能单独证明这一取得结果。
      en: Stealth-Oriented Video Capture occurs after an adversary gains endpoint or call-app access and obtains one frame,
        repeated frames, or a continuous sequence from a camera, video-call media, or equivalent video input. The adversary
        deliberately exploits the relationship between capture entry point and expected use to weaken attribution. The core
        question is whether visual media actually enters an attacker-controlled recording path; camera availability, an existing
        grant, a loaded plugin, and later file encryption are separate facts that do not individually prove acquisition.
    - zh: 该概念以输入来源而非文件容器划界。周期性保存的通话画面仍是视频输入的取得，屏幕录制保存为 AVI 仍可能只属于屏幕捕获。T9000 同时具备桌面截图和视频通话画面采集，必须依据报告中不同线程、接口调用和结果文件把两者拆开；任何“会开摄像头”的工具功能列表也应与实际执行和产物分开记录。
      en: This concept is bounded by input source, not output container. Periodically saved call images are still acquisition
        from a video input, whereas a desktop recording saved as AVI may remain screen capture. T9000 had both desktop-screenshot
        and video-call capture functionality; its different threads, interface calls, and artifacts must keep the conclusions
        separate. A tool feature list saying it can open a camera must likewise be separated from observed execution and output.
  stealth_characteristics:
    paragraphs:
    - zh: 恶意组件若从正常视频通话接口取得帧，时间和对象会贴近用户确在使用的通话。T9000 的 Skype 接口请求仍弹出许可提示，但 Unit 42 指出提示中看似正常的进程可能使用户错误批准；会话本身并不证明第三方记录获得业务授权。残余线索包括接口发现和附着、批准主体、通话时段、视频子目录中的临时文件及会后加密产物。
      en: When a malicious component takes frames through an ordinary video-call interface, timing and content align with
        a call the user is actually conducting. T9000 still presented a Skype API approval prompt, yet Unit 42 noted that
        an apparently legitimate process in the prompt could induce a mistaken approval. The call itself does not authorize
        third-party recording. Interface discovery and attachment, the granting actor, call timing, temporary video files,
        and encrypted post-call output remain residual traces.
    - zh: 直接打开摄像头的恶意程序通常会增加设备会话，并可能触发摄像头灯或系统指示；若只看文件扩展名或可执行文件名，防守方也可能漏掉 webcam 照片。InvisiMole 的内部类型表把 webcam 照片与屏幕截图分别标注，说明两类来源可留下不同产物；该报告没有证明摄像头指示被隐藏或拍照节奏本身降低告警。本父级不把“设备可访问”写成无痕采集。
      en: Malware opening a camera directly usually adds a device session and can trigger a camera light or system indicator;
        a defender relying only on extensions or executable names can also miss webcam photos. InvisiMole's internal type
        table separately identifies webcam photos and screen screenshots, showing distinguishable outputs from the two sources.
        That report does not show a hidden camera indicator or reduced alerting from capture cadence. This parent does not
        equate device access with traceless capture.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入已证实从摄像头取得画面，或经视频通话应用的媒体接口取得参与者画面，即使最终只有间隔图片。排除只采集显示器、远程支持共享屏幕、应用窗口缩略图和屏幕录制的路径，它们由 T1113 处理。T1123 只覆盖同一通话的声音；语音与视频必须分别具备输入及产物证据。打开设备权限、劫持应用进程和说服用户批准接口可作为先决或伴随行为，但不是本技术的完成条件。
      en: Include proven acquisition of camera imagery or participant imagery through a video-call media interface, even if
        output consists only of interval images. Exclude display capture, shared screens in remote support, application-window
        thumbnails, and desktop recordings; T1113 owns those paths. T1123 covers sound from the same call only when separate
        input and outcome evidence exists. Opening device permissions, subverting a host process, and inducing interface approval
        can be prerequisites or accompanying acts, not completion of this technique.
    - zh: 视频帧被集中暂存、压缩、加密或外传可以另行标注 T1074、T1560 或后续战术，不能反推画面来源。正常会议录制、授权视频质检、远程技术支持和无障碍图像处理会产生类似会话和文件；仅有绿色摄像头指示、一次接口授权或 MOV、JPG
        文件均不足以判恶。应结合发起组件身份、会议业务目的、参与者同意、产物去向和批准记录。
      en: Central staging, compression, encryption, or egress of frames may receive T1074, T1560, or later-tactic labels but
        cannot establish the frame source retrospectively. Authorized meeting recording, video quality assurance, remote technical
        support, and accessibility image processing can produce similar sessions and files. A green camera indicator, one
        interface grant, or a MOV or JPG file alone does not prove malicious capture. Join requester identity, meeting purpose,
        participant consent, output destination, and approval records.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已登录的视频通话客户端上，T9000 插件先调用 Skype 的发现与附着接口，用户批准后记录通话媒体；Unit 42 对解密数据确认视频画面以周期性图像形式取得。此场景的匿迹约束是攻击者必须等到应用和会话可用，并让采集伴随真实通信需求。另一类直接设备取得可由
          InvisiMole 的 webcam 照片内部类型证明，但其文件加密和删除属于后续产物处理，不应自动作为视频采集子项。
        en: In a signed-in video-call client, T9000 called Skype discovery and attachment interfaces, then recorded call media
          after user approval. Unit 42 confirmed that decrypted video output contained periodically taken call images. This
          path depends on an available app and session, placing acquisition alongside real communication activity. InvisiMole's
          webcam-photo internal type shows a separate direct-device acquisition route, but its file encryption and deletion
          are later artifact handling and do not automatically create a video-capture child.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少须能运行读取摄像头或附着通信应用接口的组件，并有权限接触目标输入。T9000 路径要求 Skype 正在运行、目标已登录且用户许可接口访问；攻击者能选择请求时机和媒体保存位置，却不能假定所有视频平台提供同类接口。经受信进程继承相机授权是实验所证技术可能性，若用于正式行为结论仍须有目标平台版本和现场执行证据。
          en: The attacker needs runnable code able to read a camera or attach to a communication-app interface and authorization
            to reach the input. T9000 required Skype to be running and signed in, plus user approval for API access. The attacker
            could choose request timing and output location but cannot assume every video platform exposes a similar interface.
            Inheriting a trusted process's camera grant is demonstrated experimentally, yet a formal behavioral claim still
            needs the relevant platform version and observed execution.
      defender_model:
        paragraphs:
        - zh: 防守方可能拥有进程及模块来源、摄像头会话、应用接口授权、通话时间、文件创建和文件内容类型等数据，但这些数据通常分散在端点、应用与用户界面。Windows 可向用户显示摄像头灯或启动通知，并保留有限使用历史；macOS
            对应用访问摄像头要求授权且显示使用指示。这些用户界面并不保证可导出逐事件企业日志；正式检测须先验证传感器确能给出用户、进程、会话和时间键。
          en: Defenders may have process and module provenance, camera sessions, app-interface grants, call timing, file creation,
            and media-type evidence, but these often sit across endpoint, application, and user-interface surfaces. Windows
            may show a camera light or activation notice and limited usage history; macOS requires app authorization and shows
            use indication. Those user interfaces do not guarantee event-level enterprise exports. A deployable detector must
            first verify that its sensors supply user, process, session, and time keys.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用正常视频通话的应用与授权语境掩盖第三方取帧
      en: Borrow a normal video-call app and grant context to disguise third-party frame capture
    analysis:
      paragraphs:
      - zh: 恶意组件经已登录通话应用的媒体接口附着，取得视频帧时会话和请求提示仍带有正常通话应用的外观。若审查只看“通话正在进行”或提示的进程名，真实第三方采集者可能被混同于业务通话；这正是 T9000 中 Unit 42 指出的用户误判风险。接口授权、请求组件、视频子目录和解密后的周期性帧仍可恢复因果链；该来源支持误导可能和真实录制，不支持实测告警下降或无提示绕过。
        en: A malicious component attaches through a signed-in call app's media interface, so the session and grant prompt
          retain an ordinary call-app appearance while frames are taken. Reviewing only the fact that a call exists or the
          process name in a prompt can conflate the third-party collector with the business call, matching the user-confusion
          risk identified by Unit 42 for T9000. Interface grant, requester component, video directory, and decrypted periodic
          frames preserve a causal trail. The source supports possible confusion and actual capture, not a measured alert
          reduction or silent bypass.
    evidence_keys:
    - T1125_REF_T9000
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 仅建议“通话接口语境取帧”作为当前正式 Niji 子项，其稳定变量是由真实通话应用的第三方媒体授权与会话承载恶意视觉采集，导致防守必须把请求者、许可、通话及帧产物联看。独立打开摄像头是父级对照，缺少额外已证匿迹变量；既有摄像头会话寄生和受信会议进程权限继承虽可改变指示与提示解释，目前只有研究实验，保留为假设。按
          OS、工具、摄像头品牌、图像后缀或视频文件与静态图片划分均不成立。
        en: Recommend only call-interface-context frame capture as a formal Niji child. Its stable variable is malicious visual
          acquisition carried by a real call app's third-party media grant and session, requiring defenders to join requester,
          grant, call, and frame output. Direct camera opening is a parent comparator without another supported stealth variable.
          Piggybacking on an existing camera session and inheriting grants inside a trusted meeting process may alter interpretation
          of indicators and prompts but currently have only research demonstrations, so remain hypotheses. OS, tool, camera
          brand, extension, and movie-versus-still partitions do not qualify.
    proposed_child_keys:
    - T1125_CHILD_CALL
proposed_subtechniques:
- temporary_key: T1125_CHILD_CALL
  formalization_recommendation: proposed-formal
  name:
    zh: 通话接口语境取帧
    en: Call-Interface-Context Frame Capture
  summary:
    zh: 攻击者附着真实视频通话应用的媒体接口取得周期性画面，让未经授权的取帧伴随已登录通话及看似正常的授权流程。
    en: An adversary attaches to a real video-call app's media interface for periodic images, placing unauthorized frame capture
      alongside a signed-in call and apparently ordinary grant flow.
  definition_and_concept:
    paragraphs:
    - zh: 通话接口语境取帧的可控变量是视频画面从已登录通话应用的媒体接口进入第三方组件，而非另起一个直接摄像头读取器。它要求证明接口附着、实际通话及帧取得的连接；通话应用仅运行、用户批准接口或恶意插件只具备录制能力都不足以完成子项。所得媒体可为周期性图片，不要求生成连续视频文件。
      en: 'Call-Interface-Context Frame Capture controls the entry point: visual call media pass from a signed-in call app''s
        interface into a third-party component rather than a separate direct camera reader. The child requires a link among
        interface attachment, an actual call, and acquired frames. A running app, an interface approval, or a plugin merely
        capable of recording is insufficient. Output may be periodic images rather than a continuous movie file.'
  stealth_characteristics:
    paragraphs:
    - zh: 通话接口语境取帧使第三方视觉采集贴附在本来允许视频活动的会话中，普通“摄像头被使用”或“Skype 正在通话”信号因而不足以辨认偷录。T9000 仍触发明确的 Skype API 授权，用户必须允许；Unit 42 只指出提示中的正常进程可能误导用户。第三方附着动作、授予记录与通话后的图像产物仍提供独立观察面，本子项不声称关闭摄像头灯或绕开新的授权。
      en: Call-Interface-Context Frame Capture places third-party visual acquisition inside a session where video activity
        is already expected, making a bare camera-use or active-Skype signal insufficient to recognize unauthorized recording.
        T9000 still triggered an explicit Skype API grant that the user had to approve; Unit 42 only noted that the normal
        process in the prompt might mislead. Third-party attachment, grant records, and post-call image output remain independent
        observation surfaces. The child does not claim a disabled camera light or bypassed grant.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入经通话媒体接口取得参与者视频帧的恶意行为，排除只从桌面截图观察通话窗口、仅通过摄像头驱动直接拍照、只录通话音频和仅取得接口授权而未取帧。前两类分别归 T1113 或本父级直接设备路径，音频另归 T1123；许可、会后加密暂存和外传可另行标注。合法会议录制机器人、经授权的转写与录像插件、质检和远程支持是必要反例，须核对组件与业务审批。
      en: Include malicious acquisition of participant frames through a call-media interface. Exclude screenshots of a call
        window on the desktop, camera-driver photography without call-media attachment, audio-only recording, and interface
        approval without frames. The first paths belong to T1113 or this parent's direct-device route, and audio belongs to
        T1123; grant, later encrypted staging, and egress may be labeled separately. Authorized meeting recorders, transcription
        or video plugins, quality assurance, and remote support are necessary comparators requiring requester and business-approval
        checks.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Unit 42 对 T9000 的逆向报告显示，插件只在 Skype 运行且用户已登录后调用 SkypeControlAPIDiscover 和 SkypeControlAPIAttach。用户许可后它录制视频通话，临时视频放在应用数据路径的视频子目录；会后文件被压缩加密，解密结果是周期性通话图像。该例证明旧
          Skype 接口上的实际取帧与授权语境，不意味着今天所有会议产品仍开放相同接口。
        en: Unit 42's reverse engineering reports that T9000 called SkypeControlAPIDiscover and SkypeControlAPIAttach only
          after Skype was running and the user signed in. Following approval it recorded video calls, used a video subdirectory
          under application data for temporary output, and compressed and encrypted files after calls; decrypted output showed
          periodic call images. This proves actual frame capture and a grant context on an older Skype interface, not equivalent
          interfaces in current meeting products.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要能在终端运行附着组件，等待目标通话应用登录，并诱使用户或管理员许可第三方媒体接口。攻击者可控制附着请求与产物处理，却不能跳过该旧接口的用户批准条件；若平台禁用第三方媒体读取或明确展示请求者身份，该路径受阻。视频通话可包含对方画面，本子项不要求本地摄像头被再次打开。
          en: The adversary needs a runnable attachment component, a signed-in target call app, and a user or administrator
            grant for the third-party media interface. The adversary controls attachment request and output handling but cannot
            skip the older interface's approval condition. A platform that disables third-party media reads or clearly identifies
            the requester constrains the path. Call frames can contain a remote participant, so this child does not require
            a fresh local camera open.
      defender_model:
        paragraphs:
        - zh: 防守方若能取得接口授权、请求组件标识、通话会话以及端点文件事件，可将“有人开会”与“第三方提取画面”拆开。仅有摄像头使用日志会遗漏远端参与者媒体接口取帧；仅有文件后缀又无法区分通话帧与桌面截图。若现代客户端不导出接口事件，应降级为文件与模块的调查线索，而非自动声称已识别该子项。
          en: Interface grants, requester identity, call sessions, and endpoint file events allow defenders to separate a
            real meeting from third-party frame extraction. Camera-use logs alone can miss media-interface capture of a remote
            participant, while extensions cannot distinguish call frames from desktop screenshots. If a current client exports
            no interface events, detection degrades to file and module investigation rather than a conclusive automated classification.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 将取帧入口置于已登录通话的正常授权语境
      en: Place frame acquisition in the normal grant context of a signed-in call
    analysis:
      paragraphs:
      - zh: T9000 的组件经已登录 Skype 的控制接口进入通话媒体，在用户可见的正常进程授权提示后取得视频帧。这把恶意取帧的时间、应用名称及输出背景与正常会议重叠，单凭通话存在无法确认授权采集；防守需用请求组件、批准事件和视频子目录产物恢复真正采集者。Unit
          42 证实行为和可能的误判，未测量防守告警减少。
        en: T9000's component entered call media through a signed-in Skype control interface and acquired video frames after
          a prompt associated with an apparently ordinary process. Timing, app name, and output context thus overlap a normal
          meeting, so call existence alone does not establish authorized capture. Defenders must recover the actual collector
          through requester identity, grant event, and video-directory output. Unit 42 establishes the behavior and possible
          confusion, not a measured reduction in defender alerts.
    evidence_keys:
    - T1125_REF_T9000
    confidence: medium
  evidence_keys:
  - T1125_REF_T9000
  - T1125_REF_ATTACK
  defense_strategy_keys:
  - T1125_DET_CALL
  mitigation_keys:
  - T1125_MIT_CALL
  limitations:
    paragraphs:
    - zh: 该子项的结论级实例仅是旧 Skype API 的 T9000，尚无证据表明现代会议应用保留相同接口或提示。报告直接展示周期性视频画面，但没有给出可迁移的接口日志架构、帧提取频率阈值或成功误导率；正式检测必须针对实际产品试点验证日志字段，并保留用户明示许可这一事实。
      en: The conclusion-level example is T9000 on an older Skype API; there is no evidence that current meeting apps retain
        the same interface or prompt. The report directly shows periodic video images but supplies no portable interface-audit
        schema, frame-rate threshold, or deception success rate. A formal detector must validate fields on each real product
        and retain the fact of explicit user approval.
defense_candidates:
  detection_strategies:
  - temporary_key: T1125_DET_CAMERA
    name:
      zh: 摄像头会话与画面产物来源关联
      en: Camera-Session to Visual-Artifact Provenance Correlation
    objective:
      zh: 将受管端点的摄像头设备会话与实际图片或视频产物、进程来源和授权工作流相连，区分直接摄像头取像与屏幕截图或正常会议。
      en: Join camera-device sessions on managed endpoints to actual image or video output, process provenance, and authorized
        workflow, distinguishing direct camera acquisition from screen capture and ordinary meetings.
    detects_keys:
    - T1125_PARENT
    domains:
    - enterprise
    analytic_keys:
    - T1125_NJA_CAMERA
    evidence_keys:
    - T1125_REF_ATTACK
    - T1125_REF_INV
    - T1125_REF_MS_CAM
    - T1125_REF_APPLE_CAM
  - temporary_key: T1125_DET_CALL
    name:
      zh: 视频通话第三方授权与帧产物关联
      en: Video-Call Third-Party Grant to Frame-Output Correlation
    objective:
      zh: 在可审计媒体接口的通话应用中，将第三方请求者、用户批准、视频会话及帧产物连接，识别未获业务授权的通话画面采集。
      en: Where a call app audits media interfaces, join third-party requester, user grant, video session, and frame output
        to identify acquisition without business authorization.
    detects_keys:
    - T1125_PARENT
    - T1125_CHILD_CALL
    domains:
    - enterprise
    analytic_keys:
    - T1125_NJA_CALL
    evidence_keys:
    - T1125_REF_T9000
  detection_analytics:
  - temporary_key: T1125_NJA_CAMERA
    strategy_key: T1125_DET_CAMERA
    name:
      zh: 非批准摄像头会话后的视觉产物
      en: Visual Output Following an Unapproved Camera Session
    platforms:
    - Windows
    - macOS
    logic:
      zh: 先以一台受管设备试点证明摄像头传感器实际导出 endpoint_id、process_id、device_id、session_start 与 session_end，且可与进程签名和文件事件对齐。按端点和进程连接摄像头启动前后五分钟的模块或进程来源，以及会话期间至结束后十五分钟创建的图像或视频候选；经文件类型识别或预览确认产物确含摄像头画面，并与批准会议、远程支持和拍照任务比较。只有设备会话时标为可疑访问；有可信画面产物且缺少业务批准才升级为采集候选。不要以
        JPG、MOV 后缀或 ATT&CK 页面列举的 DLL 加载单独推断视频捕获。
      en: First pilot a managed endpoint to prove that a camera sensor exports endpoint_id, process_id, device_id, session_start,
        and session_end and can be joined to process provenance and file events. Join process or module provenance within
        five minutes of camera start and candidate image or video output written during the session or within fifteen minutes
        afterward. Confirm by media-type inspection or preview that output actually contains camera imagery, then compare
        with approved meetings, remote support, and photography tasks. A device session alone is suspicious access; verified
        visual output without business approval raises an acquisition candidate. Neither JPG or MOV extensions nor a DLL named
        on the ATT&CK page independently proves video capture.
    data_requirements:
    - source_type: camera-device-session
      channel: validated endpoint camera-session sensor; user privacy UI is not an enterprise event stream
      required_fields:
      - endpoint_id
      - process_id
      - device_id
      - session_start
      - session_end
    - source_type: process-and-module-provenance
      channel: EDR process and module telemetry with signer and parent identity
      required_fields:
      - endpoint_id
      - process_id
      - event_time
      - executable_path
      - signer
      - parent_process_id
    - source_type: endpoint-file-and-media-type
      channel: EDR file events plus approved media classifier or controlled review
      required_fields:
      - endpoint_id
      - process_id
      - event_time
      - file_path
      - file_size
      - detected_media_type
    observables:
    - camera_session
    - requester_process_provenance
    - confirmed_camera_visual_output
    - business_approval
    correlation:
      window: 5m before device activation through 15m after session end
      dimensions:
      - endpoint_id
      - process_id
      - device_id
      - user_id
    false_positives:
      zh: 正常会议录制、视频质检、授权远程支持、无障碍工具、证件验证和用户主动拍照可产生同样的设备会话与产物；摄像头测试软件更新也会改变签名或路径。
      en: Ordinary meeting recording, video quality assurance, approved remote support, accessibility, identity verification,
        and user-initiated photography can produce the same sessions and artifacts; camera-test updates may change signer
        or path.
    blind_spots:
      zh: Windows 或 macOS 用户界面权限历史通常不能直接导出逐进程事件；平台和 EDR 若无摄像头会话键，此分析不能运行。视频通话接口取得远端画面可完全绕开新的本地摄像头会话，应交给另一分析；纯内存流或云端产物也可能无本地文件。
      en: Windows and macOS user-facing permission history does not automatically export per-process events; without camera-session
        keys from platform or EDR this analytic cannot run. A call-media interface can acquire a remote participant without
        a new local camera session and needs the other analytic; memory-only streams or cloud output may leave no local file.
    tuning_guidance:
      zh: 以应用签名、安装来源、工作任务、设备型号和会话时间建立版本化基线，例外绑定经批准组件与具体业务，而非整个摄像头应用名。试点核验传感器 PID 重用、时间漂移和媒体类型识别的误差；保留首见组件和非会议时段的高优先级线索。
      en: Baseline signed app builds, install origins, job roles, device models, and session times with versioning. Bind exceptions
        to an approved component and task, never the entire camera-app name. Pilot PID reuse, timestamp drift, and media-type
        error rates; preserve first-seen requesters and out-of-meeting activity as higher-priority leads.
    evidence_keys:
    - T1125_REF_ATTACK
    - T1125_REF_INV
    - T1125_REF_MS_CAM
    - T1125_REF_APPLE_CAM
  - temporary_key: T1125_NJA_CALL
    strategy_key: T1125_DET_CALL
    name:
      zh: 视频会话接口附着后的周期性画面文件
      en: Periodic Call Frames After Media-Interface Attachment
    platforms:
    - Windows
    logic:
      zh: 对确实导出第三方媒体接口审计的通话产品，按 user_id、endpoint_id 和 app_session_id 关联 requester_id 的首次附着或授权事件与视频通话起止事件；在通话中及结束后三十分钟寻找由该请求组件写出的帧序列、视频临时文件或经内容识别的画面产物，并对照企业批准的录制集成。接口授权但无取帧产物只算暴露或企图，单张屏幕截图须先排除
        T1113。T9000 的 SkypeControlAPI 名称及路径只用于历史回溯，不作为现代通话产品的统一字段。
      en: For call products that actually export third-party media-interface audit, join requester_id's first attachment or
        grant with video-call start and end using user_id, endpoint_id, and app_session_id. During the call and thirty minutes
        afterward, look for frame sequences, temporary video files, or content-confirmed call imagery written by that requester,
        then compare with approved recording integrations. A grant without frames is exposure or attempt; a single desktop
        screenshot must first be excluded as T1113. T9000's SkypeControlAPI names and paths are historical pivots, not common
        fields for modern clients.
    data_requirements:
    - source_type: call-media-interface-audit
      channel: product-specific interface grant and attachment events validated before deployment
      required_fields:
      - user_id
      - endpoint_id
      - requester_id
      - app_session_id
      - event_time
      - action
      - grant_actor
    - source_type: video-call-session
      channel: product-specific call or meeting audit with modality
      required_fields:
      - user_id
      - endpoint_id
      - app_session_id
      - call_start
      - call_end
      - video_enabled
    - source_type: endpoint-visual-artifact
      channel: EDR file telemetry plus frame-content confirmation
      required_fields:
      - endpoint_id
      - process_id
      - event_time
      - file_path
      - file_size
      - detected_media_type
    observables:
    - third_party_media_attachment
    - active_video_call
    - frame_sequence_or_call_image
    - approved_recording_role
    correlation:
      window: 15m before call start through 30m after call end
      dimensions:
      - user_id
      - endpoint_id
      - app_session_id
      - requester_id
    false_positives:
      zh: 经批准的录像机器人、会议纪要与视频质检集成、无障碍字幕或远程支持可附着会议并保存视觉片段；会议主持人临时批准组件也需纳入审批审计。
      en: Approved recording bots, meeting-note and video-quality integrations, accessibility captioning, and remote support
        may attach to calls and retain visual excerpts; temporary host approvals require approval-audit context.
    blind_spots:
      zh: 不提供接口审计或输出仅在云端的产品无法完成此关联；端点内存取帧可能无文件。通话媒体接口取得的远端画面不必触发本地摄像头指示；授权提示是否具有同样 UI 误导效果必须逐产品验证。
      en: Apps without interface audit or with cloud-only output cannot support the join; memory-only extraction may leave
        no file. A remote participant's call media need not trigger a local camera indicator, and prompt-confusion behavior
        must be verified for each product.
    tuning_guidance:
      zh: 先核实当前产品确有请求者、会话与视频模态字段；按租户、业务主持人、请求组件、有效期和录制批准单维护许可，不把所有“会议软件”一次性放行。样本基线应包含合法会中录像与无录像的会议、同一应用的屏幕共享，以及用户主动截图，以校准视频帧内容确认。
      en: First verify requester, session, and video-modality fields on the deployed product. Maintain grants by tenant, business
        owner, requester, expiry, and recording approval, rather than allowlisting all meeting software. Baseline authorized
        recorded and unrecorded calls, screen shares in the same app, and user screenshots to calibrate confirmation of call
        frames.
    evidence_keys:
    - T1125_REF_T9000
  mitigations:
  - temporary_key: T1125_MIT_CALL
    resolution: extend MIT-000149
    name:
      zh: 通话应用第三方接口授权治理
      en: Governance of Third-Party Call-App Interface Grants
    description:
      zh: 扩展现有通话媒体授权措施，在视频输入权限与录制产物范围内明确请求组件、允许的会议类型、审批人和有效期，并保留授权与撤销记录。
      en: Extend the existing call-media grant measure to specify requester, permitted video-input scope and meeting types,
        approver, and expiry, retaining grant and revocation records.
    application_keys:
    - T1125_PARENT
    - T1125_CHILD_CALL
    applications:
    - target_key: T1125_PARENT
      use:
        zh: 对受管会议产品列出能读取视频媒体或调取相机的第三方集成，默认阻断无业务所有人和会话范围的授权。
        en: Inventory integrations able to read video media or invoke cameras in managed meeting products and block grants
          without a business owner and session scope by default.
      expected_effect:
        zh: 降低正常会议应用成为隐蔽视觉采集入口的机会，并为后续帧产物提供可核查的授权链。
        en: Reduce opportunities for a meeting app to become a disguised visual-acquisition entry point and leave an auditable
          grant chain for later frame output.
      limitations:
        zh: 旧 Skype 案例不能证明当前产品能细粒度限制视频接口；独立恶意摄像头读取不依赖通话接口，需另设设备访问控制。
        en: The old Skype case does not show that current products can scope video interfaces finely; independent malicious
          camera reading does not depend on a call interface and needs device-access controls.
    - target_key: T1125_CHILD_CALL
      use:
        zh: 将视频会议媒体读取权限限制于经审查的录制集成，授权提示清楚展示第三方请求者，并按会议及有效期复核长期授权。
        en: Limit video-call media reads to reviewed recording integrations, display the third-party requester clearly in
          the grant flow, and review durable grants by meeting and expiry.
      expected_effect:
        zh: 减少 T9000 式误判正常进程后授予第三方取帧权限的机会，使请求者和会话可追溯。
        en: Reduce opportunities for a T9000-like requester to obtain frame access through confusion over a normal process
          and make requester and session traceable.
      limitations:
        zh: 用户可仍批准恶意请求；不导出接口授权审计的产品无法仅靠该措施证明后续取帧，必须结合产物调查。
        en: Users may still approve a malicious request; a product without grant audit cannot prove later frame extraction
          through this measure alone and needs artifact investigation.
    evidence_keys:
    - T1125_REF_T9000
  - temporary_key: T1125_MIT_CAMERA
    resolution: create-if-no-equivalent
    name:
      zh: 摄像头访问范围与应用完整性控制
      en: Camera-Access Scope and App-Integrity Control
    description:
      zh: 在可管理的平台上限制摄像头访问主体，并检查视频会议与相机应用的模块来源、完整性和更新通道，减少未经批准代码直接取像或借受信进程权限取像的机会。
      en: Restrict camera access principals where the platform supports it and verify module provenance, integrity, and update
        channels for meeting and camera apps, reducing direct camera capture or abuse of trusted-process grants.
    measures:
    - key: scoped-camera-grants
      description:
        zh: 使用受支持的系统与 MDM 相机策略设定设备或应用许可；Windows 传统桌面应用的细粒度限制需按平台实际能力验证。
        en: Apply supported system and MDM camera policies to devices or apps; validate the actual granularity available for
          classic Windows desktop apps.
      control_type: preventive
    - key: meeting-app-integrity
      description:
        zh: 对会议应用和相机工具实施签名、模块来源和受管更新约束，并审计新增插件或替换库。
        en: Constrain signatures, module provenance, and managed updates for meeting and camera tools, and audit newly loaded
          plugins or replacement libraries.
      control_type: cost-increasing
    applications:
    - target_key: T1125_PARENT
      use:
        zh: 关闭无业务需要终端的摄像头访问，保留准许应用及进程完整性清单，对受管摄像头会话和新模块共同复核。
        en: Disable camera access on endpoints without a business need, retain an approved app and process-integrity inventory,
          and review managed camera sessions with newly loaded modules.
      expected_effect:
        zh: 缩小直接设备取像面，提升攻击者借合法会议进程取像的成本并保留来源归因材料。
        en: Reduce direct camera acquisition exposure, increase the cost of using a legitimate meeting process, and preserve
          provenance for attribution.
      limitations:
        zh: 通话接口仍可取得远端参与者画面而不新开本地摄像头；Windows 桌面应用权限不总能逐应用强制，摄像头指示不能代替审计。
        en: A call interface may acquire a remote participant without reopening a local camera; Windows desktop-app controls
          are not always enforceable per app, and a camera indicator is not audit evidence.
    evidence_keys:
    - T1125_REF_MS_CAM
    - T1125_REF_APPLE_CAM
    - T1125_REF_ZOOM
