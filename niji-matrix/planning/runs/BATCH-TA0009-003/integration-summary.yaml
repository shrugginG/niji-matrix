review_notes_zh: 两个 ATT&CK Enterprise 19.1 父候选均先完成 adapt 准入，新增 NJT-0158、NJT-0159 及一个按通话接口语境划分的 NJS-0159-001。T1113 窗口门控轴与现有
  NJS-0132-001 重复，故正式零子项，屏幕像素取得由父级和目标特定 Analytic 验证；BLUELIGHT 节奏和摄像头寄生实验未升级为子项。REF-000583/000512/000584/000506 与 CASE-000198
  精确扩展，MIT-000149 新增视频应用。质量、两份 Bundle、91 项 Web 测试和双语 API QA 通过；TA0009 正式 10/17，剩余 7 项。对象保持 review，等待人工领域评审。
review_notes_en: Both ATT&CK Enterprise 19.1 parents received adapt admission first, producing NJT-0158, NJT-0159, and one
  call-interface-context child NJS-0159-001. T1113 has zero new children because its window gate duplicates NJS-0132-001;
  the parent and targeted Analytic verify acquired display pixels. BLUELIGHT cadence and laboratory camera piggybacking were
  not promoted to children. REF-000583/000512/000584/000506 and CASE-000198 were precisely extended, and MIT-000149 gained
  video applications. Quality, two bundles, 91 Web tests, and bilingual API QA passed. TA0009 has 10 of 17 formal parents
  and seven remaining. Objects remain review pending human domain approval.
