schema_version: 1.0.0
type: batch-taxonomy-breadth-review
batch_ref: BATCH-TA0009-003
attack_baseline:
  domain: enterprise-attack
  version: '19.1'
principle: Zero ATT&CK children did not end the search; Niji children require distinct controlled stealth variables and defender-observation
  effects.
candidate_reviews:
- source_attack_id: T1113
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: []
  breadth_trigger: open-ended-search
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - axis: target_context_gated_pixel_acquisition
    resolution: adjacent-technique
    variable: selected process and foreground window predicate controls actual display-pixel capture
    trace_change: image output absent before or outside match and repeats at ten-second intervals on match
    defender_difference: require target-state-to-capture-success-to-artifact join rather than window-query-only detection
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    owner_ref: NJS-0132-001
  - axis: phase_based_cadence_dilution
    resolution: evidence-deferred
    variable: screenshot interval changes between operation phases
    trace_change: BLUELIGHT output shifts from roughly thirty seconds to five minutes
    defender_difference: longer observation windows would be needed if cadence actually reduced alertability
    evidence_keys:
    - T1113_REF_VOLEXITY
  - axis: trusted_graphics_process_attribution
    resolution: evidence-deferred
    variable: malicious capture executes inside a normally graphical app process
    trace_change: capture calls and artifacts may be attributed to app process rather than a stand-alone grabber
    defender_difference: requires module and injection lineage, but the reviewed Attor source does not establish a separate
      stealth outcome for screenshot attribution
    evidence_keys:
    - T1113_REF_ATTOR_PDF
  - axis: memory_buffer_or_delayed_file_output
    resolution: evidence-deferred
    variable: acquired pixels held in memory or emitted later
    trace_change: immediate file output would be reduced if shown
    defender_difference: would shift detection toward capture-session and later network correlation; reviewed Attor and FunnyDream
      cases write files
    evidence_keys:
    - T1113_REF_ATTOR_PDF
    - T1113_REF_FUNNYDREAM
  - axis: api_os_format_or_image_target
    resolution: not-stealth-distinct
    variable: capture API, operating system, image extension, window type, or product
    trace_change: none inherent without an independently supported observation effect
    defender_difference: parser and platform tuning, not a stable Niji child boundary
    evidence_keys:
    - T1113_REF_ATTACK
    - T1113_REF_MS_WGC
  second_pass_required: false
  formal_niji_child_refs: []
  primary_breadth_resolution: Window-context gating is already NJS-0132-001; screenshot pixels are the T1113 parent outcome.
    Cadence, process attribution, and buffering lack independent evidence, so no new NJS is justified.
- source_attack_id: T1125
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: []
  breadth_trigger: open-ended-search
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - axis: call_media_interface_context
    resolution: formal
    variable: third-party visual-media request rides a real signed-in video-call app and grant context
    trace_change: call-linked interface grant and video-subfolder frame output rather than a standalone camera-open trail
    defender_difference: join requester, grant actor, call session, and confirmed call frames; local camera activity alone
      is insufficient
    evidence_keys:
    - T1125_REF_T9000
  - axis: existing_camera_session_piggyback
    resolution: evidence-deferred
    variable: secondary consumer starts only while a user-initiated camera session is already active
    trace_change: no new initial LED activation in the older OS X demonstration, but a secondary consumer remains observable
    defender_difference: would require per-consumer rather than per-device-start accounting
    evidence_keys:
    - T1125_REF_WARDLE
  - axis: trusted_meeting_process_grant_inheritance
    resolution: evidence-deferred
    variable: injected recorder executes inside a previously authorized video-app process
    trace_change: the 2020 Zoom macOS lab generated no additional camera authorization prompt, while module provenance changed
    defender_difference: would require app-module integrity and camera-session attribution, not app grant alone
    evidence_keys:
    - T1125_REF_ZOOM
    - T1125_REF_APPLE_CAM
  - axis: short_or_conditional_camera_activation
    resolution: evidence-deferred
    variable: camera reads only on an operator or activity trigger
    trace_change: narrower device-active intervals are plausible, but Kazuar command capability and ATT&CK's interval-image
      language do not prove reduced visibility
    defender_difference: would need long-window command-to-device-session correlation and a specific positive case
    evidence_keys:
    - T1125_REF_ATTACK
  - axis: in_memory_frame_buffering
    resolution: evidence-deferred
    variable: hold frames without immediate disk writes
    trace_change: hypothetical reduction in local files; T9000 and InvisiMole both report files
    defender_difference: would require device or app-interface capture plus network or memory evidence, unsupported here
    evidence_keys: []
  - axis: codec_file_type_camera_model_or_os
    resolution: not-stealth-distinct
    variable: picture versus movie, format, product, API name, or operating system
    trace_change: no inherent stealth effect without a separately established provenance or observation change
    defender_difference: parser or sensor choice rather than a stable sibling boundary
    evidence_keys:
    - T1125_REF_ATTACK
  second_pass_required: false
  formal_niji_child_refs:
  - NJS-0159-001
  primary_breadth_resolution: T9000 directly supports one call-interface context variable and verified video frames; laboratory
    camera-session piggyback and grant inheritance remain deferred.
primary_review:
  status: review
  notes_zh: T1113 的窗口门控轴经六维复核归 NJS-0132-001，正式零子项；T1125 的 T9000 视频接口轴成立一项，实验性摄像头寄生保持待证。
  notes_en: A six-dimension review assigned the T1113 window-gating axis to NJS-0132-001, leaving zero new children. T1125
    establishes one T9000 video-interface axis while laboratory camera piggybacking remains deferred.
