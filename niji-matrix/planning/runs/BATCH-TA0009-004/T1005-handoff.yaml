library_candidates:
  references:
    - key: T1005_R_ATTACK_PARENT
      title_en: Data from Local System, Technique T1005, Enterprise version 19
      url: https://attack.mitre.org/versions/v19/techniques/T1005/
      source_type: official-taxonomy
      supports: >-
        Fixed-baseline T1005 parent behavior, Collection mapping, local source examples, and zero ATT&CK children; it does not prove a Niji stealth variable, successful use of every listed procedure, or a detection effect.
    - key: T1005_R_ATTACK_DET0380
      title_en: Detection of Local Data Collection Prior to Exfiltration, DET0380
      url: https://attack.mitre.org/detectionstrategies/DET0380/
      source_type: official-detection-strategy
      supports: >-
        ATT&CK 19.1 maps T1005 to Windows process/file creation, Linux open/execve, macOS process/file access, network-device command logging, and ESXi datastore/command analytics; useful defense prior, not proof of Niji fields or a derivative-view child.
    - key: T1005_R_TAJMAHAL
      title_en: Project TajMahal – a sophisticated new APT framework
      url: https://securelist.com/project-tajmahal/90240/
      source_type: original-malware-analysis
      supports: >-
        Kaspersky found TajMahal on one diplomatic victim and analyzed capabilities including its own file indexer and theft of print-queue documents. The public report does not state that the print-queue capability executed on that victim or identify acquired document contents.
    - key: T1005_R_COOKIEMINER
      title_en: Mac Malware Steals Cryptocurrency Exchanges’ Cookies
      url: https://unit42.paloaltonetworks.com/mac-malware-steals-cryptocurrency-exchanges-cookies/
      source_type: original-malware-analysis
      supports: >-
        Unit 42 code analysis states that CookieMiner seeks to steal iPhone text messages from iTunes backups on a tethered Mac. It is capability/attempt evidence and does not establish successful message recovery or measured evasion.
    - key: T1005_R_MS_AUDIT_FILE_SYSTEM
      title_en: Audit File System
      url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/audit-file-system
      source_type: official-platform-documentation
      supports: >-
        File-system audit events require a matching object SACL and requested access type; success auditing can record successful access, while default file-system SACLs do not generate these events. It supports targeted coverage and the absent-event limitation.
    - key: T1005_R_MS_BACKUP_PRIVILEGE
      title_en: Managing Privileges in a File System
      url: https://learn.microsoft.com/en-us/windows-hardware/drivers/ifs/privileges
      source_type: official-platform-documentation
      supports: >-
        SeBackupPrivilege permits file-content retrieval without an ACL grant. It establishes interface authority, not malicious use or a completed T1005 result.
    - key: T1005_R_MS_BACKUP_AUDIT
      title_en: Audit Sensitive Privilege Use
      url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/audit-sensitive-privilege-use
      source_type: official-platform-documentation
      supports: >-
        Backup and restore privilege use is audited only when the additional backup/restore audit policy is enabled, and Microsoft warns about event volume. It supports analytic prerequisites and limitations.
    - key: T1005_R_MS_BACKUP_RIGHT
      title_en: Back up files and directories - security policy setting
      url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/back-up-files-and-directories
      source_type: official-platform-documentation
      supports: >-
        SeBackupPrivilege can bypass persistent-object permissions through the backup API, and Microsoft recommends assigning it only to trusted users or dedicated backup service accounts. It supports least-authority measures, not an intrusion case.
    - key: T1005_R_MS_PRINT_307
      title_en: RPC_BranchOfficeJobDataPrinted
      url: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/b4a22048-7837-460e-b1bd-8d34f4270f29
      source_type: official-protocol-documentation
      supports: >-
        The structure used for PrintService Operational Event 307 includes status, document, user, client machine, printer, port, byte size, and page count. It does not provide a universal spool path or prove a later read.
    - key: T1005_R_APPLE_LOCAL_BACKUP
      title_en: About encrypted backups on your iPhone, iPad, or iPod touch
      url: https://support.apple.com/en-us/108353
      source_type: official-platform-documentation
      supports: >-
        Apple local backups are stored on a computer, can contain sensitive information, and can be password-protected and encrypted; encryption is not enabled by default. The page supports derivative-copy exposure and mitigation, not CookieMiner execution or endpoint audit fields.
  claims:
    - key: T1005_CLM_PARENT_BEHAVIOR
      proposition_zh: >-
        T1005 的完成条件是从已控制主机的本地来源实际取得内容；目录、路径、权限或工具能力不能单独代替内容结果，且固定版无 ATT&CK 子技术。
      proposition_en: >-
        T1005 completes through actual acquisition of content from a local source on an accessed host; directory, path, authority, or tool capability alone does not substitute for a content result, and the fixed baseline has no ATT&CK sub-techniques.
      evidence_keys: [T1005_R_ATTACK_PARENT]
    - key: T1005_CLM_TAJMAHAL_CAPABILITY
      proposition_zh: >-
        Kaspersky 在一处外交机构受害环境发现 TajMahal，并分析出自有文件索引与打印队列文档窃取能力；公开材料未证明打印队列模块在该受害环境成功取得内容。
      proposition_en: >-
        Kaspersky found TajMahal in a diplomatic victim environment and analyzed a proprietary file index plus print-queue document theft capability; the public material does not prove that the print-queue module successfully acquired content there.
      evidence_keys: [T1005_R_TAJMAHAL]
    - key: T1005_CLM_COOKIEMINER_CAPABILITY
      proposition_zh: >-
        Unit 42 分析的 CookieMiner 尝试从 Mac 上的 iTunes 备份取得 iPhone 短信；来源不证明短信恢复成功或攻击者主观匿迹意图。
      proposition_en: >-
        Unit 42's CookieMiner analysis reports an attempt to obtain iPhone text messages from an iTunes backup on a Mac; the source does not prove successful recovery or subjective stealth intent.
      evidence_keys: [T1005_R_COOKIEMINER]
    - key: T1005_CLM_DERIVATIVE_OBSERVATION_INFERENCE
      proposition_zh: >-
        从先前生成的本地派生对象读取内容，会把当前读取从规范源应用或原对象监测面移到副本路径；这是由能力事实与审计语义支持的条件性机理推断，不是事件中实测的告警下降。
      proposition_en: >-
        Reading content from a previously produced local derivative moves the current read from canonical-source application or object monitoring to the copy path; this is a conditional mechanism inference supported by capability facts and audit semantics, not a measured alert reduction in an incident.
      evidence_keys: [T1005_R_TAJMAHAL, T1005_R_COOKIEMINER, T1005_R_MS_PRINT_307, REF-000379]
    - key: T1005_CLM_WINDOWS_READ_TELEMETRY
      proposition_zh: >-
        Windows 文件读取判断需要在匹配 SACL 与审计策略下解释 4663 的对象、主体、进程和 AccessMask；未配置覆盖时缺少事件不能证明没有读取。
      proposition_en: >-
        A Windows file-read judgment requires interpreting 4663 object, subject, process, and AccessMask under a matching SACL and audit policy; without configured coverage, a missing event does not prove no read occurred.
      evidence_keys: [REF-000379, T1005_R_MS_AUDIT_FILE_SYSTEM]
    - key: T1005_CLM_BACKUP_AUTHORITY_ONLY
      proposition_zh: >-
        SeBackupPrivilege 可以绕过普通文件权限取得内容读取能力，但权限分配或调用本身不证明敏感内容已取得；合法备份是必须按作业和身份排除的强反例。
      proposition_en: >-
        SeBackupPrivilege can bypass ordinary file permissions to provide content-read capability, but assignment or invocation alone does not prove sensitive content was acquired; legitimate backup is a strong counterexample that must be excluded by job and identity.
      evidence_keys: [T1005_R_MS_BACKUP_PRIVILEGE, T1005_R_MS_BACKUP_AUDIT, T1005_R_MS_BACKUP_RIGHT]
    - key: T1005_CLM_DERIVATIVE_CONTROL
      proposition_zh: >-
        对本地派生副本实施加密、最短保留、最小消费者权限和定向读取审计，可减少明文暴露并提高非批准读取的可区分性，但不能阻止已控制批准消费者或密钥的攻击者。
      proposition_en: >-
        Encryption, minimum retention, minimal consumer authority, and targeted read audit for local derivative copies can reduce plaintext exposure and improve distinction of unapproved reads, but cannot stop an adversary controlling an approved consumer or key.
      evidence_keys: [T1005_R_APPLE_LOCAL_BACKUP, T1005_R_MS_BACKUP_RIGHT, REF-000379]
  cases: []
  detection_strategies: [T1005_DET_LOCAL_CONTENT_READ_LINEAGE]
  detection_analytics: [T1005_NJA_WINDOWS_LOCAL_READ_OUTCOME, T1005_NJA_WINDOWS_DERIVATIVE_PRODUCER_READER, T1005_NJA_WINDOWS_BACKUP_PRIVILEGE_READ]
  mitigations: [T1005_MIT_DERIVATIVE_LOCAL_CONTENT]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
      - broad-local-content-source-without-attack-children
    breadth_trigger: ordinary-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: selective-path-extension-or-content-reading
        resolution: evidence-deferred-and-adjacent
        reason_zh: >-
          路径与扩展名只是选择条件，未稳定改变观察面；状态化跨轮选择归 NJT-0135，信息库语义/谓词查询归 NJT-0143。未找到本地索引查询到实际内容取得的原始事件链。
        reason_en: >-
          Paths and extensions are selection conditions without a stable observation-plane change. NJT-0135 owns stateful cross-pass selection and NJT-0143 owns semantic or predicate repository queries. No original incident chain was found from a local-index query to actual content acquisition.
      - axis: approved-backup-sync-or-application-identity
        resolution: adjacent-technique-and-evidence-deferred
        reason_zh: >-
          若变量是既有集成或服务身份控制权，交给 NJT-0086/身份对象；若是受信进程内代码，交给 NJT-0103 等上下文对象。SeBackupPrivilege 证明能力但没有非凭据 T1005 的结论级真实事件。
        reason_en: >-
          Control of an existing integration or service identity returns to NJT-0086 and identity objects; code within a trusted process returns to NJT-0103 and related context objects. SeBackupPrivilege establishes capability but lacks a conclusion-level real noncredential T1005 incident.
      - axis: derivative-local-view
        resolution: conditional-niji-variable-candidate
        reason_zh: >-
          先前正常流程生成的打印队列或文件级备份使当前读取落到副本对象，产生独立审计与防御差；现有来源仅为能力级，故子项保持 low 并由主 Agent formalize/defer。
        reason_en: >-
          A print queue or file-level backup produced by an earlier normal workflow moves the current read to a copy object with a distinct audit and defense difference. Current sources are capability-level only, so the child remains low confidence for primary formalize/defer review.
      - axis: version-snapshot-or-raw-view
        resolution: adjacent-technique
        reason_zh: >-
          卷影、原始卷、块设备与不经普通命名空间的读取由 NJT-0108 拥有；认证存储的非活动视图由 NJS-0177-002 拥有。
        reason_en: >-
          NJT-0108 owns shadow copies, raw volumes, block devices, and reads outside the ordinary namespace; NJS-0177-002 owns inactive authentication-store views.
      - axis: event-triggered-low-rate-or-incremental-acquisition
        resolution: adjacent-technique
        reason_zh: >-
          重复轮次、变化检查点、事件触发与时间稀释属于 NJT-0135/NJS-0135-001 的编排边界；一次本地读取不因低量自动形成 NJS。
        reason_en: >-
          Repeated passes, change checkpoints, event triggers, and temporal dilution belong to NJT-0135/NJS-0135-001 orchestration. A one-time local read does not become a child merely because volume is small.
      - axis: alternate-api-or-interface
        resolution: parent-core-adjacent-or-deferred
        reason_zh: >-
          应用 API 若仍读取规范内容而无可证观察差，留在父级；原始存储接口归 NJT-0108；备份 API 只有能力和官方语义，缺少本地非凭据内容实际取得案例，暂缓独立子项。
        reason_en: >-
          An application API that reads canonical content without a proven observation difference remains parent-core; a raw-storage interface belongs to NJT-0108; backup API evidence establishes capability and official semantics but lacks a real case of acquired noncredential local content, so a separate child is deferred.
      - axis: process-memory-local-content
        resolution: parent-core-or-adjacent
        reason_zh: >-
          内存是 ATT&CK 父级列出的本地来源而不是匿迹变量；认证材料、屏幕、输入或进程控制分别按更窄对象判断，不能以“内存”拆分。
        reason_en: >-
          Memory is a local source listed by the ATT&CK parent rather than a stealth variable. Authentication material, screen, input, or process control is classified under narrower objects and is not partitioned merely as memory.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定版 0 个子项不降低开放检索责任。本轮审查七类轴后仅保留一个低置信度派生视图条件草案；若正式门禁要求实际内容取得事件，应设 taxonomy deferred 或 none-justified，而不得按文件、目录、平台或工具补数。
      en: >-
        Zero fixed-baseline children does not reduce the open-search obligation. After seven axes, only one low-confidence derivative-view conditional draft remains. If the formal gate requires an incident with actual content acquisition, taxonomy should be deferred or none-justified rather than padded by file, directory, platform, or tool.
  evidence_coverage:
    parent_behavior_keys: [T1005_R_ATTACK_PARENT]
    boundary_keys: [T1005_R_ATTACK_PARENT, REF-000379, T1005_R_MS_BACKUP_PRIVILEGE, T1005_R_TAJMAHAL, T1005_R_COOKIEMINER]
    mechanism_support:
      - subject: T1005_PARENT
        evidence_keys: [T1005_R_TAJMAHAL, T1005_R_COOKIEMINER, T1005_R_MS_PRINT_307, REF-000379]
        conclusion_limit: conditional-observation-path-inference
      - subject: T1005_CHILD_DERIVATIVE_LOCAL_VIEW
        evidence_keys: [T1005_R_TAJMAHAL, T1005_R_COOKIEMINER, T1005_R_MS_PRINT_307, REF-000379]
        conclusion_limit: capability-only-no-proven-content-result
    child_existence_support:
      - child_key: T1005_CHILD_DERIVATIVE_LOCAL_VIEW
        evidence_keys: [T1005_R_TAJMAHAL, T1005_R_COOKIEMINER, T1005_R_APPLE_LOCAL_BACKUP]
        confidence: low
    unsupported_or_deferred:
      - No public incident proves that TajMahal's print-queue module successfully acquired a named document on its confirmed victim.
      - CookieMiner reporting describes an attempt to recover iPhone messages from an iTunes backup, not verified recovered message content.
      - No controlled source measures alert reduction from derivative-view acquisition.
      - No conclusion-level noncredential T1005 case was found for SeBackupPrivilege, BackupRead, or a normal backup service identity.
      - No original incident chain was found from a local search index query to actual content acquisition and a distinct read-telemetry reduction.
      - Snapshot and raw-volume axes are owned by NJT-0108; authentication-store copies are owned by NJS-0177-002.
      - Path, extension, data type, product, directory, platform, and tool partitions fail the stable-variable gate.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        已按 NJT-0001 的字段责任完整检查父级与条件子项的定义、匿迹特性、范围、场景、攻防模型、因果机理、证据与限制。正文明确区分路径发现、读取能力、实际内容结果、派生观察差和后继暂存，不把工具能力写成已发生案例。
      en: >-
        Parent and conditional child drafts were checked against NJT-0001 field responsibilities for definition, stealth properties, scope, scenarios, attacker and defender models, causal mechanism, evidence, and limitations. The prose separates path discovery, read capability, actual content result, derivative observation difference, and later staging, and does not present tool capability as an observed case.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - fixed-baseline-workbook-row-extraction
      - shared-library-exact-url-and-text-lookup
      - yaml-parse-validation
  limitations:
    paragraphs:
      - zh: >-
          固定 ATT&CK 页面能锚定 T1005 的广泛父行为，却不能证明任一读取天然匿迹。TajMahal 与 CookieMiner 是代码/模块能力分析，缺少派生对象已返回内容的受害端证据；因此父级适配为 medium，派生视图子项和 NM-BT 机理为 low。若主 Agent 不接受能力级证据支持正式子项，应保留父级并把 taxonomy 置 deferred 或 none-justified。
        en: >-
          The fixed ATT&CK page anchors broad T1005 behavior but does not make every read stealthy. TajMahal and CookieMiner are code or module capability analyses without victim-side evidence that a derivative object returned content. The parent adaptation is therefore medium confidence, while the derivative-view child and NM-BT mechanism are low. If the primary agent does not accept capability-level evidence for a formal child, it should retain the parent and set taxonomy to deferred or none-justified.
      - zh: >-
          文件读取遥测依赖平台与配置。4663 需要匹配 SACL，备份/恢复权限审计可能造成极高事件量，Print 307 不保证 spool 路径映射，EDR 文件表不等于完整读取记录，macOS 本地备份也缺少可在本稿中验证的等价审计字段。正式 Analytic 必须先在目标环境验证字段、事件量、时间同步、对象键和保留期。
        en: >-
          File-read telemetry depends on platform and configuration. Event 4663 needs a matching SACL, backup and restore privilege auditing can create very high volume, Print 307 does not guarantee spool-path mapping, an EDR file table is not a universal read record, and an equivalent validated audit field set for macOS local backups was not established here. A formal analytic must first validate fields, volume, time synchronization, object keys, and retention in the target environment.
      - zh: >-
          正常备份、索引、打印、EDR、反恶意软件、管理员支持、迁移、电子发现和取证与候选行为高度同形。签名进程或熟悉服务身份不能单独作为永久放行条件；精度依赖主体、作业、目标范围、产生者—消费者关系和结果去向。内容验证应使用隔离解析与摘要，避免把敏感原文写入检测日志。
        en: >-
          Normal backup, indexing, printing, EDR, antimalware, administrator support, migration, e-discovery, and forensics closely resemble the candidate behavior. A signed process or familiar service identity cannot be a permanent allowance by itself; precision depends on principal, job, target scope, producer-consumer relationship, and output destination. Content validation should use isolated parsing and protected digests rather than logging sensitive plaintext.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason_zh: >-
        单次少量文件读取或派生副本读取没有证明跨时间/空间分散；跨轮变化检查点已由 NJT-0135/NJS-0135-001 管理。
      reason_en: >-
        A one-time small file set or derivative-copy read does not establish dispersion across time or space; NJT-0135/NJS-0135-001 already owns cross-pass change checkpoints.
    - mechanism_ref: NM-FD
      reason_zh: >-
        派生对象路径本身不证明读取进程、身份或行为特征模仿合法消费者；若代码寄生或身份借用成立，应同时交给已有上下文/身份对象。
      reason_en: >-
        A derivative-object path does not prove that the reader process, identity, or behavior imitates a legitimate consumer; proven code parasitism or identity borrowing belongs concurrently to existing context or identity objects.
    - mechanism_ref: NM-DO
      reason_zh: >-
        本候选改变读取位置而非取得内容的可解释形态；加密副本会降低攻击可用性，不能自动作为攻击者的数据遮蔽机理。
      reason_en: >-
        The candidate changes read location rather than the interpretability of acquired content; an encrypted copy can reduce attacker usability and is not automatically an adversary data-obscuration mechanism.
  open_questions:
    - Can an original incident report prove successful recovery of a named document, message, or record from a local print queue, file-level backup, or application derivative?
    - Should the capability-supported derivative-view child be formalized at low confidence, or should the parent use deferred/none-justified taxonomy until actual content-result evidence appears?
    - Which deployed applications expose a stable canonical-object to derivative-object key that can support more than time-and-path correlation?
    - Can the target environment sustain scoped 4663 and backup-privilege auditing without losing required events to volume or retention limits?
  normal_counterexamples:
    - zh: >-
        企业备份代理按专用服务身份读取批准范围并写入登记的备份库；仅有大量 ReadData 不足以判恶意，需核对作业 ID、签名、源/目的范围、窗口、owner 与恢复测试。
      en: >-
        An enterprise backup agent reads an approved scope under a dedicated service identity and writes to a registered vault. High ReadData volume alone is insufficient; job ID, signer, source and destination scope, window, owner, and restore testing must match.
    - zh: >-
        搜索索引器按配置 crawl scope 读取文件并更新索引；其可表现为大范围重复读取，但不等于内容进入攻击者上下文，且索引查询到实际文件取得须另证。
      en: >-
        A search indexer reads files within configured crawl scope and updates its index. It may produce broad repeated reads but does not show content entering an attacker context, and any index-query-to-file-acquisition chain needs separate proof.
    - zh: >-
        EDR、反恶意软件与 DLP 可能以 SYSTEM 或受信服务读取高价值文件并生成隔离或分析产物；应按签名、sensor ID、策略、隔离库和管理控制面核对，而不是永久信任进程名。
      en: >-
        EDR, antimalware, and DLP may read high-value files as SYSTEM or a trusted service and produce quarantine or analysis artifacts. Validate signer, sensor ID, policy, quarantine store, and management control plane rather than permanently trusting a process name.
    - zh: >-
        管理员支持、迁移、电子发现与数字取证可导出数据库、用户资料或设备备份；需要工单、法律/事件范围、双人批准、目标介质与到期清理证明。
      en: >-
        Administrator support, migration, e-discovery, and digital forensics may export databases, user profiles, or device backups. Require a ticket, legal or incident scope, dual approval, destination medium, and expiry or cleanup evidence.
integration:
  status: pending-primary-review
  resolutions:
    - object: T1005_PARENT
      proposed_action: adapt
      note: >-
        Preserve the local-content Collection anchor but require an attacker-controlled observation-changing variable and actual content result.
    - object: T1005_CHILD_DERIVATIVE_LOCAL_VIEW
      proposed_action: formalize-or-defer
      note: >-
        Complete low-confidence draft supplied; capability and telemetry evidence supports a stable hypothesis, but no proven victim-side content result was found.
    - object: MIT-000137
      proposed_action: extend
      note: >-
        Add a T1005 parent application only if the parent is admitted; existing measures fit source authorization and targeted read audit.
    - object: T1005_MIT_DERIVATIVE_LOCAL_CONTENT
      proposed_action: create-if-child-formalized
      note: >-
        Separate object is needed for derivative lifecycle, encryption, producer-consumer separation, manifests, and child-specific limitations.
