handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0009-004
work_item_ref: WORK-TA0009-T1005
temporary_key_prefix: T1005_
candidate:
  source_type: attack
  source_attack_id: T1005
  name:
    zh: 从本地系统获取数据
    en: Data from Local System
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1005 覆盖攻击者在已控制主机上从文件系统、配置文件、本地数据库、虚拟机文件或进程内存中寻找并取得有用数据。这个 Collection 锚点应保留，但本地主机位置、文件类型、目录名或读取工具本身都不是匿迹变量。Niji 应把正式范围适配为实际取得本地内容且至少存在一项由攻击者控制、会改变读取痕迹或防守观察位置的设计；只列出路径、看到文件名或获得读取权限仍属于发现或暴露，不能代替内容结果。
        en: >-
          ATT&CK Enterprise 19.1 T1005 covers an adversary finding and acquiring useful data from file systems, configuration files, local databases, virtual-machine files, or process memory on an accessed host. That Collection anchor should remain, but local placement, file type, directory name, or reader tool is not itself a stealth variable. Niji should adapt the formal scope to actual local-content acquisition with at least one attacker-controlled design that changes read traces or the defender's observation plane. Listing a path, seeing a filename, or obtaining read authority remains discovery or exposure and does not substitute for a content result.
      - zh: >-
          开放式检索后，路径或扩展名筛选缺少独立痕迹效应，状态化增量由 NJT-0135 管理，库内查询选择由 NJT-0143 管理，既有集成或受信身份控制由 NJT-0086 等身份对象管理，卷影、原始卷与块视图由 NJT-0108 管理，认证材料由 T1555 与 NJT-0177 等凭据对象管理。派生本地视图仍值得作为低置信度条件子项提交：攻击者读取打印队列、文件级本地备份或应用派生副本而不直接读取规范源，使当前访问落到另一存储视图。Kaspersky 与 Unit 42 只证明相应模块能力，并未证明目标内容已成功取得或检测概率下降，主 Agent 应在跨技术评审后选择 formalize 或 defer。
        en: >-
          After an open taxonomy search, path or extension filtering lacks an independent trace effect; NJT-0135 owns stateful incremental collection, NJT-0143 owns repository query selection, NJT-0086 and related identity objects own control of an existing integration or trusted identity, NJT-0108 owns shadow, raw-volume, and block views, and T1555 plus NJT-0177 and related credential objects own authentication material. A derivative local view remains worth submitting as a low-confidence conditional child: an adversary reads a print queue, file-level local backup, or application-derived copy instead of directly reading the canonical source, moving the current access to another storage view. Kaspersky and Unit 42 establish the relevant module capabilities but do not prove successful content acquisition or reduced detection probability, so the primary agent should formalize or defer it after cross-technique review.
proposed_content:
  name:
    zh: 匿迹型本地内容获取
    en: Stealth-Oriented Local Content Acquisition
  summary:
    zh: 攻击者从已控制主机实际取得本地内容，并通过选择读取视图或接口改变源侧痕迹；文件发现、内容结果和后继暂存必须分别验证。
    en: An adversary actually acquires local content from an accessed host and changes source-side traces by choosing a read view or interface; file discovery, content outcome, and later staging require separate proof.
  definition_and_concept:
    paragraphs:
      - zh: >-
          匿迹型本地内容获取是攻击者在已经能够访问的终端、服务器、虚拟化主机或网络设备上，从本地持久存储、应用数据、文件级副本或可读进程内容中取得能服务于后续行动的信息，并有意选择使读取范围、主体或观察位置发生变化的获取路径。其直接目标是让内容进入攻击者可处理的上下文；文件名、元数据、存在性、ACL 或可读句柄只能证明候选和能力，除非来源进一步证明内容字节、可验证记录或等价结果已被取得。
        en: >-
          Stealth-Oriented Local Content Acquisition occurs when an adversary on an already accessible endpoint, server, virtualization host, or network device obtains information from local persistent storage, application data, file-level copies, or readable process content for later operations, while deliberately choosing an acquisition path that changes read scope, subject, or observation location. Its direct objective is to place content in an attacker-usable context. A filename, metadata, existence, ACL, or readable handle establishes only a candidate and capability unless the source further proves content bytes, validated records, or an equivalent result were obtained.
      - zh: >-
          “本地”描述内容在获取时由受控主机承载，不按 Windows、Linux、macOS、数据库产品、文件格式或目录分类。一次人工读取、脚本复制、应用导出或经文件级副本恢复都可落入父级，但必须分别证明相应匿迹变量。权限取得、目录发现、自动化轮次、内容暂存、归档转换和外传是可以同现的相邻阶段，不因同一程序同时完成而被本技术吞并。
        en: >-
          Local describes content hosted by the accessed machine at acquisition time and does not partition by Windows, Linux, macOS, database product, file format, or directory. A manual read, scripted copy, application export, or recovery from a file-level copy may fall within the parent, but the corresponding stealth variable must be established separately. Authority acquisition, directory discovery, automated passes, content staging, archive transformation, and exfiltration are adjacent stages that may coexist and are not absorbed merely because one program performs them together.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          攻击者若从应用已经生成的派生副本、打印队列或文件级备份取得内容，规范源应用可能没有本次逐对象读取事件，当前文件访问则出现在通常由打印、恢复、索引或同步组件接触的位置。只监测原目录、原数据库事务或短窗批量读取的防守方可能低估内容接触；派生对象的创建者、路径、读取进程、主体会话和后继输出仍留下可关联痕迹。
        en: >-
          When an adversary obtains content from an application-produced derivative copy, print queue, or file-level backup, the canonical source application may have no current per-object read event while the present access appears in a location routinely approached by printing, recovery, indexing, or synchronization components. A defender watching only the original directory, canonical database transaction, or short-window bulk reads may undercount content contact. The derivative object's producer, path, reader process, subject session, and successor output remain correlatable traces.
      - zh: >-
          直接读取一般本地文件并不天然匿迹；Windows 4663 只有在目标对象存在匹配 SACL 且启用文件系统审计时才记录实际使用的访问权，EDR 文件事件也不保证覆盖读取。完整监测若同时保存敏感源清单、派生对象 manifest、进程谱系、读取访问与输出去向，可以恢复观察差。派生副本已加密、保留时间短或访问范围受限时会降低攻击可行性；宽泛备份权限、长期明文副本和仅按进程名放行会放大盲区。
        en: >-
          Ordinary direct reads of local files are not inherently stealthy. Windows 4663 records exercised access only when the target has a matching SACL and file-system auditing is enabled, and EDR file events do not guarantee read coverage. Complete monitoring that retains a sensitive-source inventory, derivative-object manifests, process lineage, read access, and output destinations can reconstruct the observation difference. Encrypted or short-lived derivative copies and narrow access scope reduce feasibility, while broad backup authority, long-lived plaintext copies, and process-name-only allowances enlarge the blind spot.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求同时说明受控主机、本地内容对象、成功读取结果，以及攻击者控制的读取视图或接口如何改变可见痕迹。T1083/NJT-0182 负责文件与目录发现，T1119/NJT-0135 负责跨轮自动获取与检查点，T1213/NJT-0143 负责信息库内查询选择，T1074/NJT-0134 负责取得后的汇聚暂存，T1560/NJT-0133 负责归档转换。读取网络共享、云对象、邮件、配置存储库、剪贴板或可移动介质时，分别交给其数据来源父技术。
        en: >-
          Inclusion requires an accessed host, a local content object, a successful read result, and an attacker-controlled read view or interface whose effect on visible traces can be explained. T1083/NJT-0182 owns file and directory discovery; T1119/NJT-0135 owns cross-pass automation and checkpoints; T1213/NJT-0143 owns query selection inside information repositories; T1074/NJT-0134 owns aggregation and staging after acquisition; and T1560/NJT-0133 owns archive transformation. Reads from network shares, cloud objects, mail, configuration repositories, clipboards, or removable media belong to their respective source parents.
      - zh: >-
          浏览器凭据、口令库、认证数据库、token 与会话材料按 T1555、NJT-0147、NJT-0177 或其他凭据对象判定，不能因其文件位于本机而重复计入。卷影、原始卷、块设备或不经普通文件命名空间的读取属于 NJT-0108；若只体现既有集成身份、备份服务身份或受信进程控制权变化，应交给 NJT-0086、进程上下文或权限对象。合法备份、索引、EDR、反恶意软件、打印、迁移、电子发现、取证和管理员支持都是重要反例，必须按身份、签名、目标范围、工单、时间与结果去向排除。
        en: >-
          Browser credentials, password stores, authentication databases, tokens, and session material are classified under T1555, NJT-0147, NJT-0177, or another credential object and are not duplicated merely because their files are local. Shadow copies, raw volumes, block devices, and reads outside the ordinary file namespace belong to NJT-0108. If the only variable is control of an existing integration identity, backup-service identity, or trusted process, ownership returns to NJT-0086, a process-context object, or an authority object. Legitimate backup, indexing, EDR, antimalware, printing, migration, e-discovery, forensics, and administrator support are material counterexamples that must be excluded by identity, signer, target scope, ticket, time, and output destination.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            入侵者在员工终端上需要文档、业务记录或移动设备内容时，可以直接读取原文件，也可能优先使用已存在的应用派生物。Kaspersky 对 TajMahal 的分析发现其具备从打印队列窃取文档和建立主机文件索引的模块；Unit 42 对 CookieMiner 的代码分析表明它尝试从连接 Mac 的 iTunes 本地备份取得 iPhone 短信。两份来源证明能力设计，均未证明相关模块在已确认受害环境中成功返回了具体内容。
          en: >-
            An intruder seeking documents, business records, or mobile-device content on an employee endpoint may read originals directly or prefer an existing application derivative. Kaspersky's TajMahal analysis found modules capable of stealing print-queue documents and building a host file index. Unit 42's CookieMiner code analysis shows an attempt to obtain iPhone text messages from an iTunes local backup on the tethered Mac. Both sources establish capability design, but neither proves that the relevant module successfully returned specific content in a confirmed victim environment.
        - zh: >-
            管理员权限或服务账户也可能允许攻击者调用备份语义、应用导出或本地数据库接口读取受保护内容。只有单次命令、成功句柄或工具存在时应保持在能力层；取得的文件、副本、记录集合或独立取证验证才能支持 Collection 结果。若收集按修改时间跨轮持续进行，同时标注 NJT-0135；若输出先集中到隐藏目录，再标注 NJT-0134，而不改变本父级对源读取的判断。
          en: >-
            Administrator authority or a service identity may also let an adversary invoke backup semantics, an application export, or a local database interface to read protected content. A command, successful handle, or tool presence alone remains capability-level evidence; an acquired file, copy, record set, or independent forensic validation is needed to support a Collection result. If acquisition continues across passes by modification time, NJT-0135 may also apply. If output is concentrated into a concealed directory, NJT-0134 may also apply without changing this parent's source-read judgment.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者至少需要在目标主机上执行读取逻辑，或控制能代表其完成读取的本地应用、服务或账户，并具备目标路径、应用格式或派生对象布局知识。派生视图方式还要求目标内容此前被打印、同步、备份、缓存或导出，且副本仍存在并可解密；它可能比直接读取更陈旧、不完整，也可能缺少规范源的最新变更。
            en: >-
              The adversary needs to execute read logic on the target host or control a local application, service, or account that can read on its behalf, together with knowledge of target paths, application formats, or derivative-object layout. A derivative-view path additionally requires that the target content was previously printed, synchronized, backed up, cached, or exported and that the copy still exists and can be decrypted. It may be staler or less complete than a direct read and may omit recent changes to the canonical source.
          - zh: >-
              备份语义可能要求 SeBackupPrivilege 或等价平台权限，受信应用读取可能要求进程注入、插件控制或已解锁会话，文件级副本可能受独立密钥保护。攻击者若无法把可见读取与内容结果对应，或只取得损坏、加密且不可恢复的对象，则不能把准备能力升级为完成的本地内容获取。
            en: >-
              Backup semantics may require SeBackupPrivilege or equivalent platform authority; trusted-application reads may require process injection, plug-in control, or an unlocked session; and file-level copies may be protected by a separate key. If the adversary cannot connect a visible read to a content result, or obtains only a corrupt or unrecoverable encrypted object, preparatory capability cannot be promoted to completed local-content acquisition.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要预先标记高价值本地源及派生存储，针对性启用成功 ReadData 审计，并保存主体 SID、LogonId、对象路径、AccessMask、进程 ID/映像、进程启动与父子关系。输出文件创建、临时目录写入和网络去向用于验证内容进入后继处理链；目录列举或 ReadAttributes 不应被误写为内容读取。没有目标 SACL 时，Windows 4663 的缺席不能证明文件未被访问。
            en: >-
              Defenders need an inventory of high-value local sources and derivative stores, targeted successful ReadData auditing, and retained subject SID, LogonId, object path, AccessMask, process ID or image, process start, and parent-child lineage. Output-file creation, temporary-directory writes, and network destinations help establish that content entered a successor processing chain. Directory enumeration or ReadAttributes must not be mislabeled as content reads. Without a target SACL, the absence of Windows 4663 does not prove that a file was untouched.
          - zh: >-
              对派生视图，防守方还需保存生成它的控制面或 manifest，例如打印文档、用户、客户端、打印机、大小与页数，或备份作业、来源范围、服务身份、完成时间与保留期。关联键不足时只能报告“未批准进程读取了派生存储”，不能断言读取了某一规范源内容。备份、索引、反恶意软件和 EDR 具有高读取量及宽权限，例外必须绑定准确的身份、签名、作业、路径范围和有效期，不能永久按进程名信任。
            en: >-
              For derivative views, defenders also need the control-plane record or manifest that produced them, such as print document, user, client, printer, size, and page count, or backup job, source scope, service identity, completion time, and retention. When correlation keys are insufficient, the conclusion is limited to an unapproved process reading a derivative store, not that a particular canonical source was read. Backup, indexing, antimalware, and EDR perform broad high-volume reads; exceptions must bind exact identity, signer, job, path scope, and validity rather than permanently trusting a process name.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 派生存储把当前内容读取移出规范源观察面
        en: Derivative storage moves the current content read outside canonical-source observation
      analysis:
        paragraphs:
          - zh: >-
              正常打印、备份、同步或应用处理先生成一个可读派生对象，攻击者随后从该对象取得内容，使当前读取不必再次经过规范应用的逐对象接口。源应用审计与原目录规则因而可能只看到较早的正常生成过程，关键读事件转移到常被忽略的队列或副本路径；派生对象的生成 manifest、成功 ReadData、读取进程与后继输出仍可重建这条链。TajMahal 与 CookieMiner 报告证明这种能力存在，但没有测量告警规避或证明受害环境中的内容结果，因此机理保持低置信度。
            en: >-
              Normal printing, backup, synchronization, or application processing first creates a readable derivative object, which an adversary later uses to obtain content without another per-object call through the canonical application. Source-application audit and original-directory rules may therefore show only the earlier legitimate production step while the critical read moves to an overlooked queue or copy path. The derivative manifest, successful ReadData access, reader process, and successor output can still reconstruct the chain. TajMahal and CookieMiner reporting establishes the capability, but measures neither alert evasion nor a victim-side content result, so the mechanism remains low confidence.
      evidence_keys:
        - T1005_R_TAJMAHAL
        - T1005_R_COOKIEMINER
        - T1005_R_MS_PRINT_307
        - REF-000379
      confidence: low
  subtechnique_taxonomy:
    coverage: conditional-established
    proposed_refs:
      - T1005_CHILD_DERIVATIVE_LOCAL_VIEW
    narrative:
      paragraphs:
        - zh: >-
            暂建议一项 Niji 原生子项，以“当前内容是否从正常流程先前生成的本地派生视图取得”为稳定变量。变量改变当前读取所在对象和审计面，横跨打印队列、文件级本地备份和应用派生副本；产品、扩展名、目录、备份厂商、数据库类型和读取工具均不是分类边界。卷影、原始卷或块视图不纳入此项，交还 NJT-0108。
          en: >-
            One Niji-native child is proposed conditionally, keyed to whether current content is obtained from a local derivative view produced earlier by a normal workflow. The variable changes the object and audit plane of the current read across print queues, file-level local backups, and application-derived copies. Product, extension, directory, backup vendor, database type, and reader tool do not define the boundary. Shadow, raw-volume, and block views are excluded and returned to NJT-0108.
        - zh: >-
            ATT&CK 19.1 对 T1005 没有子技术，因此不存在外部子项导入。开放检索仍审查了路径/内容选择、低频、事件触发、既有身份、备份语义、快照和替代接口；前四项分别因缺少稳定痕迹差或已由 NJT-0143、NJT-0135 与 NJT-0086 等对象拥有而收敛，快照与原始接口归 NJT-0108。派生视图子项只有能力级案例，主 Agent 若要求实际内容取得证据，应将 taxonomy 置为 deferred，而不是以文件种类补足。
          en: >-
            ATT&CK 19.1 has no T1005 sub-techniques, so no external child is imported. The open search still examined path or content selection, low rate, event triggering, existing identity, backup semantics, snapshots, and alternate interfaces. The first four either lack a stable trace difference or are already owned by NJT-0143, NJT-0135, NJT-0086, and related objects; snapshots and raw interfaces return to NJT-0108. The derivative-view proposal has only capability-level cases. If the primary agent requires evidence of actual content acquisition, the taxonomy should be deferred rather than padded with file categories.
proposed_subtechniques:
  - temporary_key: T1005_CHILD_DERIVATIVE_LOCAL_VIEW
    status: conditional-proposal
    confidence: low
    name:
      zh: 派生本地视图内容获取
      en: Derivative Local-View Content Acquisition
    summary:
      zh: 攻击者从打印队列、文件级备份或应用派生副本取得内容，把本次读取移到规范源之外，同时留下派生对象与读取谱系。
      en: An adversary acquires content from a print queue, file-level backup, or application-derived copy, moving the current read away from the canonical source while leaving derivative-object and reader lineage.
    definition_and_concept:
      paragraphs:
        - zh: >-
            派生本地视图内容获取是攻击者读取由正常或较早应用流程在同一主机上物化的内容副本，并从中恢复文档、消息、业务记录或其他有用内容。副本可以是打印队列对象、文件级设备备份、导出副本或应用缓存；分类依据是当前读取不再经过规范源对象或服务接口，而不是副本的扩展名、产品或目录。
          en: >-
            Derivative Local-View Content Acquisition occurs when an adversary reads a content copy materialized on the same host by a normal or earlier application workflow and recovers documents, messages, business records, or other useful content. The copy may be a print-queue object, file-level device backup, exported copy, or application cache. Classification depends on the current read no longer traversing the canonical source object or service interface, not on the copy's extension, product, or directory.
        - zh: >-
            子项以实际内容结果完成。发现副本路径、列出备份、创建快照、读取 manifest 或取得解密能力仅是准备；攻击者必须从派生对象取得可识别内容或有独立取证确认的等价结果。若副本承载邮件、地址簿身份或认证材料，应分别交给 NJS-0144-001、NJS-0131-001 或相应凭据对象，因为这些对象已按内容与服务审计差定义更窄边界。
          en: >-
            The child completes with an actual content result. Discovering a copy path, listing backups, creating a snapshot, reading a manifest, or gaining decryption ability is preparatory; the adversary must recover identifiable content from the derivative or an independently verified equivalent result. Mail, address-book identity, or authentication material in a copy belongs respectively to NJS-0144-001, NJS-0131-001, or the applicable credential object because those objects already define narrower content and service-audit boundaries.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            派生本地视图内容获取（Derivative Local-View Content Acquisition）把当前恶意读取置于先前正常流程产生的对象上，使规范应用没有新的逐对象查询或读取记录，也可能让原目录的高价值文件监控不再覆盖目标路径。队列、备份或缓存又常被合法服务接触，单条读取难以区分；生成时间、来源范围、读取者与内容去向之间的关系成为主要判据。
          en: >-
            Derivative Local-View Content Acquisition places the current malicious read against an object produced by an earlier normal workflow, so the canonical application has no new per-object query or read record and high-value monitoring on the original directory may no longer cover the target path. Queues, backups, and caches are routinely touched by legitimate services, making an individual read difficult to classify. The relationship among production time, source scope, reader, and content destination becomes the main discriminator.
        - zh: >-
            观察迁移不等于无痕：打印与备份流程可能保留 manifest，文件系统在匹配 SACL 下可记录实际 ReadData，进程与输出文件也可暴露非批准消费者。副本加密、按需生成并迅速删除、由独立服务身份保护，或防守方对派生路径实施相同敏感级别监控时，匿迹收益和可行性都会降低。
          en: >-
            Observation displacement is not trace elimination. Print and backup workflows may retain manifests, file systems can record exercised ReadData when a matching SACL is present, and process plus output files can expose an unapproved consumer. The stealth benefit and feasibility decline when copies are encrypted, generated on demand and rapidly removed, protected by a separate service identity, or monitored at the same sensitivity as their canonical sources.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求能够说明派生对象由何种先前流程形成、其承载的源内容范围、攻击者对派生对象的成功读取以及结果进入攻击者控制上下文。合法恢复、打印重试、搜索索引、反恶意软件、EDR、迁移和取证会生成同形访问，必须用批准身份、签名、工单、对象范围、时间、读取者职责与输出去向排除。只因为路径包含 backup、cache、spool 或 temp 不能成立子项。
          en: >-
            Inclusion requires a supportable account of the earlier process that produced the derivative, its covered source content, the adversary's successful read of that derivative, and the result entering an attacker-controlled context. Legitimate recovery, print retry, search indexing, antimalware, EDR, migration, and forensics produce similar accesses and must be excluded through approved identity, signer, ticket, object scope, time, reader duty, and output destination. A path containing backup, cache, spool, or temp does not establish the child.
        - zh: >-
            从卷影、原始卷、磁盘镜像或块设备读取交给 NJT-0108；从既存邮件副本读取交给 NJS-0144-001；状态化变化检查点交给 NJS-0135-001；仅利用查询筛选对象而仍读取规范源交给 NJS-0143-001 或父级；取得后复制到集中目录属于 NJT-0134。若恶意代码寄生在合法备份或应用进程内，派生视图与进程上下文可并列，但不得用本子项替代对代码控制权变化的判断。
          en: >-
            Reads from a shadow copy, raw volume, disk image, or block device return to NJT-0108; reads from an existing mail replica return to NJS-0144-001; stateful change checkpoints return to NJS-0135-001; query-only selection that still reads the canonical source returns to NJS-0143-001 or its parent; and copying acquired material into a central directory belongs to NJT-0134. If malicious code inhabits a legitimate backup or application process, derivative view and process context may coexist, but this child does not replace the judgment about changed code control.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              Kaspersky 分析的 TajMahal 框架包含从打印队列取得文档的能力，并有自己的文件索引器；这说明攻击工具会把正常应用派生物当成候选内容源。报告确认框架出现在一处外交机构，但没有说明打印队列模块是否在该受害环境执行或取得了哪些文档，因此只能支持能力级场景。
            en: >-
              Kaspersky's TajMahal analysis describes a capability to take documents from the print queue and an internal file indexer, showing that an espionage tool can treat normal application derivatives as candidate content sources. The report confirms the framework on a diplomatic victim but does not state that the print-queue module executed there or identify documents acquired, so it supports only a capability-level scenario.
          - zh: >-
              Unit 42 对 CookieMiner 的分析说明恶意脚本尝试从 Mac 上的 iTunes 备份恢复 iPhone 短信。该例证明文件级本地备份能够成为与原移动设备消息服务分离的读取视图；来源表述为 seeks/attempts，未证明短信恢复成功，也未证明攻击者为规避日志而选择备份。
            en: >-
              Unit 42 reports that CookieMiner attempts to recover iPhone text messages from an iTunes backup on a Mac. The example establishes that a file-level local backup can form a read view separate from the original mobile message service. The source describes an attempt and does not prove successful message recovery or that the backup was chosen to evade logging.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要访问承载副本的主机和派生存储，理解队列、备份或缓存的结构，并在需要时持有解密或解析材料。派生视图只有在正常流程已经物化相关内容时可用；副本可能过期、只含部分字段、使用不稳定对象名或在作业结束后迅速删除。
              en: >-
                The adversary needs access to the host and derivative store, knowledge of queue, backup, or cache structure, and any required decryption or parsing material. The view is usable only after a normal workflow has materialized the relevant content. The copy may be stale, contain only some fields, use unstable object names, or be deleted quickly after a job.
            - zh: >-
                直接读取副本通常仍需要文件权限；若攻击者改用 SeBackupPrivilege、注入批准服务或读取原始卷，则分别增加权限使用、进程上下文或 NJT-0108 的边界。无法把副本对象映射到内容、只见工具命令或只取得密文时，应把结论限制为能力或暴露。
              en: >-
                Direct reading of a copy still normally requires file authority. If the adversary instead uses SeBackupPrivilege, injects an approved service, or reads a raw volume, the case adds authority use, process context, or NJT-0108 respectively. When the copy cannot be mapped to content, only a tool command is observed, or only ciphertext is acquired, the conclusion remains capability or exposure.
        defender_model:
          paragraphs:
            - zh: >-
                防守方应给派生存储分配与源内容相称的敏感级别，保存生成 manifest，并对非批准读取者采集实际 ReadData 与进程谱系。Windows 打印 Event 307 的协议结构可以提供文档、用户、客户端、打印机、端口、大小与页数，但它不直接给出每个本地 spool 文件路径；对象映射不稳定时只能以短窗和多字段相似度关联。
              en: >-
                Defenders should assign derivative stores a sensitivity level matching their source content, retain producer manifests, and collect exercised ReadData plus process lineage for unapproved readers. The protocol structure underlying Windows Print Event 307 can provide document, user, client, printer, port, size, and page count, but does not directly supply every local spool-file path. When object mapping is unstable, correlation is limited to a narrow window and multiple matching fields.
            - zh: >-
                备份与缓存可能没有统一 manifest 或读取审计，macOS 本地备份访问也不能从 Windows 字段泛化。没有派生对象与规范源的稳定关系时，检测只能证明异常副本读取；内容确认需要隔离取证、应用解析或安全摘要，不能把敏感原文送入集中日志。
              en: >-
                Backups and caches may lack a common manifest or read audit, and Windows fields cannot be generalized to macOS local-backup access. Without a stable derivative-to-canonical relationship, detection establishes only anomalous copy access. Content confirmation needs isolated forensics, application parsing, or protected digests rather than placing sensitive plaintext in centralized logs.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 从既存派生对象读取避开规范源的本次访问记录
          en: Reading an existing derivative avoids a current canonical-source access record
        analysis:
          paragraphs:
            - zh: >-
                攻击者把读取对象从规范内容源改为正常流程较早生成的本地副本，因此本次行为可能不进入源应用或源对象监测面，而在队列、备份或缓存路径表现为一次普通文件读取。只检查规范服务日志的防守方会漏掉当前内容接触；把派生物生成记录、文件 ReadData、非批准进程和后继输出连接后可以恢复。公开报告支持能力与观察路径差，不支持成功内容结果或实测匿迹收益。
              en: >-
                The adversary changes the read object from the canonical content source to a local copy produced earlier by a normal workflow. The current action may therefore be absent from source-application or source-object monitoring and appear as an ordinary file read in a queue, backup, or cache path. A defender inspecting only canonical-service logs can miss current content contact, while joining derivative production, file ReadData, unapproved process, and successor output can recover it. Public reporting supports the capability and observation-path difference, not a successful content result or measured stealth gain.
        evidence_keys:
          - T1005_R_TAJMAHAL
          - T1005_R_COOKIEMINER
          - T1005_R_MS_PRINT_307
          - REF-000379
        confidence: low
    defense_candidates:
      detection_strategy_keys:
        - T1005_DET_LOCAL_CONTENT_READ_LINEAGE
      mitigation_keys:
        - T1005_MIT_DERIVATIVE_LOCAL_CONTENT
    evidence_keys:
      - T1005_R_TAJMAHAL
      - T1005_R_COOKIEMINER
      - T1005_R_MS_PRINT_307
      - T1005_R_APPLE_LOCAL_BACKUP
      - REF-000379
    research_limitations:
      paragraphs:
        - zh: >-
            目前公开来源把 TajMahal 的打印队列读取和 CookieMiner 的 iTunes 备份短信恢复表述为模块能力或尝试，均未给出成功内容样本、被读取对象 ID、受害端结果或告警对照。它们足以提出稳定观察路径假设，但不足以把任一事件登记为已证子项案例。正式化需要主 Agent 接受低置信度，或补充能证明派生对象实际返回内容的原始事件报告。
          en: >-
            Current public sources describe TajMahal print-queue reading and CookieMiner iTunes-backup message recovery as module capability or attempted behavior. Neither provides a successful content sample, read object ID, victim-side result, or alert comparison. They support a stable observation-path hypothesis but cannot be registered as proven child cases. Formalization requires the primary agent to accept low confidence or add an original incident report establishing that a derivative object actually returned content.
        - zh: >-
            打印、备份和应用缓存的生命周期与遥测差异很大。Windows 4663 依赖 SACL，Print Event 307 与实际 spool 路径未必可一一映射，Apple 文档证明备份内容和加密控制但不提供攻击检测字段。跨平台实现必须分别验证 manifest、读取事件与保留期，不能从一个产品的可见性推导通用检测。
          en: >-
            Print, backup, and application-cache lifecycle and telemetry vary widely. Windows 4663 depends on a SACL, Print Event 307 may not map one-to-one to a spool path, and Apple documentation establishes backup content and encryption controls without attack-detection fields. Each platform implementation must validate manifests, read events, and retention rather than generalizing visibility from one product.
defense_candidates:
  detection_strategies:
    - temporary_key: T1005_DET_LOCAL_CONTENT_READ_LINEAGE
      name:
        zh: 本地敏感内容读取与派生视图谱系
        en: Local Sensitive-Content Read and Derivative-View Lineage
      objective:
        zh: >-
          区分目录发现、实际内容读取和后继输出，并在规范源与派生本地视图之间恢复读取者、对象和结果关系；合法备份、索引、EDR、打印、迁移与取证必须按批准范围排除。
        en: >-
          Distinguish directory discovery, exercised content reads, and successor output while reconstructing reader, object, and result relationships across canonical sources and derivative local views; approved backup, indexing, EDR, printing, migration, and forensics must be excluded by authorized scope.
      subjects:
        - T1005_PARENT
        - T1005_CHILD_DERIVATIVE_LOCAL_VIEW
      domain: enterprise
      analytic_keys:
        - T1005_NJA_WINDOWS_LOCAL_READ_OUTCOME
        - T1005_NJA_WINDOWS_DERIVATIVE_PRODUCER_READER
        - T1005_NJA_WINDOWS_BACKUP_PRIVILEGE_READ
      evidence_keys:
        - T1005_R_ATTACK_DET0380
        - REF-000379
        - REF-000475
        - REF-000868
        - T1005_R_MS_AUDIT_FILE_SYSTEM
        - T1005_R_MS_PRINT_307
        - T1005_R_MS_BACKUP_AUDIT
  detection_analytics:
    - temporary_key: T1005_NJA_WINDOWS_LOCAL_READ_OUTCOME
      strategy_key: T1005_DET_LOCAL_CONTENT_READ_LINEAGE
      name:
        zh: Windows 敏感本地 ReadData 到内容输出关联
        en: Windows Sensitive Local ReadData-to-Content-Output Correlation
      platform: Windows
      logic:
        zh: >-
          先为经数据 owner 确认的高价值本地目录、数据库导出区与派生存储配置成功 ReadData SACL，并验证 4663 实际产生。筛选 ObjectType=File 且 Accesses/AccessMask 表示 FILE_READ_DATA 的事件，排除只有 ListDirectory、ReadAttributes 或失败句柄的记录；按 device、SubjectUserSid、SubjectLogonId、ProcessId 与 4688/EDR 的进程启动实例连接。随后在三十分钟内寻找同一进程或可证子进程创建的输出文件、应用导出结果、临时副本或出站发送。只有 ReadData 加可验证内容结果才输出 collection-supported；只有读取输出 local-content-read-observed；只有列举回退 discovery-only。与批准备份、索引、EDR、反恶意软件、迁移、电子发现和取证的匹配必须同时满足主体、签名、作业 ID、覆盖路径与有效窗口。
        en: >-
          Configure successful ReadData SACLs on high-value local directories, database export areas, and derivative stores confirmed by data owners, then verify that 4663 is actually emitted. Select ObjectType=File records whose Accesses or AccessMask represents FILE_READ_DATA and exclude records showing only ListDirectory, ReadAttributes, or a failed handle. Join by device, SubjectUserSid, SubjectLogonId, and ProcessId to the process instance from 4688 or verified EDR telemetry. Within thirty minutes, seek an output file, application export result, temporary copy, or outbound send by the same process or a proven child. Emit collection-supported only for ReadData plus a verified content result, local-content-read-observed for a read alone, and discovery-only for enumeration alone. An approved backup, indexer, EDR, antimalware, migration, e-discovery, or forensic exception must match principal, signer, job ID, covered paths, and validity window together.
      data_requirements:
        - source_type: windows-file-read-audit
          channel: Security/4663 with targeted SACL
          required_fields: [timestamp, device_id, subject_user_sid, subject_logon_id, object_type, object_name, access_list, access_mask, process_id, process_name]
        - source_type: windows-process-lineage
          channel: Security/4688 or verified EDR equivalent
          required_fields: [timestamp, device_id, process_id, process_start_id, parent_process_id, image, command_line, signer, user_sid]
        - source_type: endpoint-file-or-egress-outcome
          channel: DeviceFileEvents or verified endpoint/network equivalent
          required_fields: [timestamp, device_id, initiating_process_id, action_type, destination_path_or_address, file_name, available_hash]
        - source_type: authorized-reader-inventory
          channel: null
          required_fields: [principal_id, process_signer, process_hash_or_path, job_id, approved_paths, approval_window, owner]
      observables:
        - zh: 非批准进程对高价值对象实际使用 ReadData，而非只列举或读属性
          en: An unapproved process exercises ReadData against a high-value object rather than merely enumerating or reading attributes
        - zh: 同一进程谱系在读取后形成可验证输出、临时副本或外送结果
          en: The same process lineage creates a verifiable output, temporary copy, or transfer result after the read
      correlation_window: >-
        Pilot thirty minutes from ReadData to output for one process lineage, retain thirty days of per-principal and per-path baseline, and adapt both to application export duration.
      false_positives: >-
        Approved backup, endpoint security, indexing, printing, database maintenance, software migration, e-discovery, incident response, and digital forensics can read sensitive content and create outputs.
      blind_spots: >-
        Event 4663 is absent without a matching SACL; memory-only or application-internal reads may lack a file event; DeviceFileEvents confirms selected file actions rather than universal reads; content output can remain only in memory or an encrypted stream.
      tuning: >-
        Scope SACLs to owner-approved sensitive paths, require FILE_READ_DATA rather than path-name matching, version exceptions by principal plus signer plus job plus path plus time, and keep a separate result state when output or content cannot be established.
      evidence_keys: [REF-000379, REF-000475, REF-000868, T1005_R_MS_AUDIT_FILE_SYSTEM, T1005_R_ATTACK_DET0380]
    - temporary_key: T1005_NJA_WINDOWS_DERIVATIVE_PRODUCER_READER
      strategy_key: T1005_DET_LOCAL_CONTENT_READ_LINEAGE
      name:
        zh: Windows 派生对象生成者与非批准读取者差分
        en: Windows Derivative-Object Producer and Unapproved-Reader Differential
      platform: Windows
      logic:
        zh: >-
          为打印队列、文件级备份和应用导出区建立 derivative manifest，至少记录 producer_kind、job_id、produced_time、source_owner、source_scope、derivative_object_id/path、expected_consumer、retention_end。打印适配器可从 PrintService/Operational 307 取得 document、user、client machine、printer、port、size 与 pages，但只有能稳定映射 spool 对象时才声明具体文档关系。把 manifest 与该路径的 4663 FILE_READ_DATA 连接，若读取进程或主体不在 expected_consumer 且随后产生复制、解析或外送结果，则输出 derivative-read-supported；只有路径时间近似而无稳定对象键时输出 derivative-store-anomaly，不声称规范源内容已读。打印队列试点用生成前后十分钟，普通备份按 manifest 保留期至多二十四小时或本地批准值。
        en: >-
          Build a derivative manifest for print queues, file-level backups, and application export areas with at least producer_kind, job_id, produced_time, source_owner, source_scope, derivative_object_id or path, expected_consumer, and retention_end. A print adapter may obtain document, user, client machine, printer, port, size, and pages from PrintService/Operational 307, but it may assert a document relationship only when the spool object maps stably. Join the manifest to FILE_READ_DATA in 4663 for the derivative path. If the reader process or principal is outside expected_consumer and produces a copy, parse result, or outbound outcome, emit derivative-read-supported. When only path and time proximity exist without a stable object key, emit derivative-store-anomaly without claiming canonical content was read. Pilot ten minutes around print production and use the manifest retention interval, capped at twenty-four hours or a locally approved value, for ordinary backups.
      data_requirements:
        - source_type: derivative-object-manifest
          channel: PrintService/Operational 307, backup catalog, or application export audit
          required_fields: [timestamp, producer_kind, job_id, source_owner, source_scope, derivative_object_id_or_path, expected_consumer, retention_end]
        - source_type: windows-derivative-read-audit
          channel: Security/4663 with SACL
          required_fields: [timestamp, device_id, subject_user_sid, subject_logon_id, object_name, access_mask, process_id, process_name]
        - source_type: process-and-output-lineage
          channel: Security/4688 plus endpoint file/network telemetry
          required_fields: [timestamp, device_id, process_start_id, parent_process_start_id, signer, output_path_or_destination, action_type]
      observables:
        - zh: 派生对象由批准生产者生成后，被不在 manifest 中的进程实际读取
          en: A derivative object is produced by an approved producer and then actually read by a process absent from its manifest
        - zh: 非批准读取者形成解析输出、复制或外送，而规范源没有本次逐对象读取
          en: The unapproved reader creates a parse result, copy, or transfer while the canonical source has no current per-object read
      correlation_window: >-
        Ten minutes around transient print-spool production; producer-defined retention for backups and exports, capped at twenty-four hours for the pilot; thirty days for consumer baselines.
      false_positives: >-
        Print rendering and retry, backup verification, antivirus or EDR scanning, indexing, DLP inspection, support export, legal hold, migration, and forensic acquisition.
      blind_spots: >-
        Print Event 307 may not expose a stable spool path; manifests can omit per-file source mappings; direct application APIs or memory parsing may not generate 4663; Windows telemetry does not establish macOS backup reads.
      tuning: >-
        Require a producer manifest and exercised ReadData, prefer stable derivative IDs over path substrings, bind expected consumers to signer and service SID plus job scope, and preserve an anomaly-only state whenever canonical-to-derivative mapping is uncertain.
      evidence_keys: [T1005_R_TAJMAHAL, T1005_R_MS_PRINT_307, REF-000379, REF-000475, REF-000868]
    - temporary_key: T1005_NJA_WINDOWS_BACKUP_PRIVILEGE_READ
      strategy_key: T1005_DET_LOCAL_CONTENT_READ_LINEAGE
      name:
        zh: Windows 备份权限敏感内容读取关联
        en: Windows Backup-Privilege Sensitive-Content Read Correlation
      platform: Windows
      logic:
        zh: >-
          在严格限定的高价值系统试点 Audit Sensitive Privilege Use 与“Audit the use of Backup and Restore privilege”，采集 4673/4674 中包含 SeBackupPrivilege 的主体、LogonId、进程和对象上下文，并与同会话 4688 及敏感路径 4663 ReadData 连接。只有权限实际使用、目标内容读取和未批准输出三段同时成立时才输出 backup-semantic-collection-supported；权限分配或 whoami 结果只表示能力。合法备份必须匹配专用服务身份、签名、已登记作业、源范围、目的存储和窗口。由于 Microsoft 明确提示逐文件备份审计事件量很高，此分析不得全域无界启用。
        en: >-
          On a narrowly scoped set of high-value systems, pilot Audit Sensitive Privilege Use together with Audit the use of Backup and Restore privilege. Collect subject, LogonId, process, and object context from 4673 or 4674 records containing SeBackupPrivilege, then join to 4688 in the same session and 4663 ReadData on a sensitive path. Emit backup-semantic-collection-supported only when privilege exercise, target-content read, and unapproved output all exist; privilege assignment or whoami output establishes capability only. A legitimate backup must match a dedicated service identity, signer, registered job, source scope, destination store, and window. Because Microsoft states that per-file backup auditing has high event volume, this analytic must not be enabled globally without bounds.
      data_requirements:
        - source_type: windows-sensitive-privilege-audit
          channel: Security/4673 and 4674 with backup/restore auditing enabled
          required_fields: [timestamp, device_id, subject_user_sid, subject_logon_id, process_id, process_name, privilege_list, object_server_or_name]
        - source_type: windows-sensitive-file-read
          channel: Security/4663 with SACL
          required_fields: [timestamp, device_id, subject_logon_id, object_name, access_mask, process_id]
        - source_type: authorized-backup-job
          channel: null
          required_fields: [service_sid, signer, job_id, source_paths, destination_store, approved_window, owner]
        - source_type: endpoint-output
          channel: DeviceFileEvents or verified equivalent
          required_fields: [timestamp, device_id, initiating_process_id, destination_path, action_type, file_name]
      observables:
        - zh: 非备份作业进程使用 SeBackupPrivilege 后读取受保护敏感内容
          en: A process outside an approved backup job uses SeBackupPrivilege and then reads protected sensitive content
        - zh: 同一会话把读取结果物化到未批准路径或后继传输
          en: The same session materializes the read result in an unapproved path or successor transfer
      correlation_window: >-
        Zero to thirty minutes from privilege exercise to sensitive read and output, constrained to one device, subject LogonId, and process lineage; retain thirty days of approved-job history.
      false_positives: >-
        Enterprise backup, system-state recovery, authorized migration, incident-response acquisition, and storage or security products that legitimately invoke backup APIs.
      blind_spots: >-
        Backup/restore privilege-use auditing is commonly disabled because of event volume; APIs and event versions may not expose a direct content result; raw-volume reads belong to NJT-0108 and require different telemetry.
      tuning: >-
        Deploy only on selected systems and paths, compare service SID plus signer plus job ID plus source/destination scope, suppress no process by name alone, and distinguish privilege assignment, privilege exercise, ReadData, and materialized output as separate states.
      evidence_keys: [T1005_R_MS_BACKUP_PRIVILEGE, T1005_R_MS_BACKUP_AUDIT, T1005_R_MS_BACKUP_RIGHT, REF-000379, REF-000475, REF-000868]
  mitigations:
    - temporary_key: T1005_MIT_DERIVATIVE_LOCAL_CONTENT
      name:
        zh: 派生本地内容最小化与读取治理
        en: Derivative Local-Content Minimization and Read Governance
      description:
        zh: >-
          把打印队列、文件级本地备份、应用缓存和导出副本视为源内容的同等级敏感副本，缩短保留、启用可用加密、分离生成与读取权限，并为批准消费者和异常读取保留 manifest 与定向审计。
        en: >-
          Treat print queues, file-level local backups, application caches, and export copies as sensitive equivalents of their source content; shorten retention, enable available encryption, separate production and read authority, and retain manifests plus targeted audit for approved consumers and anomalous reads.
      measures:
        - key: derivative-copy-minimization
          control_type: exposure-reduction
          description_zh: >-
            盘点承载敏感内容的队列、备份、缓存和导出目录，关闭不必要副本，按业务恢复目标设置最短保留，并对本地设备备份及其他支持的副本强制加密和密钥分离。
          description_en: >-
            Inventory queues, backups, caches, and export directories that carry sensitive content; disable unnecessary copies, set the shortest retention consistent with recovery objectives, and require supported encryption plus separate key custody for local device backups and other copies.
        - key: producer-consumer-authority-separation
          control_type: preventive
          description_zh: >-
            让派生对象仅能由专用生产服务写入并由最小消费者集合读取，限制 SeBackupPrivilege 与备份操作员成员资格，禁止普通管理员或交互账户长期读取全部副本。
          description_en: >-
            Allow only dedicated producer services to write derivative objects and a minimal consumer set to read them; restrict SeBackupPrivilege and Backup Operators membership, and deny ordinary administrators or interactive accounts standing access to every copy.
        - key: derivative-manifest-read-audit
          control_type: detective-support
          description_zh: >-
            为高价值派生存储保存生成作业、来源范围、对象键、批准消费者和到期时间，并在受控路径启用 ReadData 审计，把读取者谱系与输出去向连接。
          description_en: >-
            Retain producing job, source scope, object key, approved consumers, and expiry for high-value derivative stores; enable ReadData auditing on controlled paths and join reader lineage to output destinations.
      applications:
        - target_key: T1005_CHILD_DERIVATIVE_LOCAL_VIEW
          use_zh: >-
            对打印 spool、文件级本地备份和应用导出区逐类登记 owner、来源内容、批准生产者/消费者、加密状态、保留期与清理结果；高敏路径只允许非交互服务身份按作业读取，并针对其他进程启用定向审计。
          use_en: >-
            For print spools, file-level local backups, and application export areas, register owner, source content, approved producers and consumers, encryption state, retention, and cleanup result. Permit high-sensitivity paths to be read only by noninteractive service identities within a job and enable targeted audit for other processes.
          expected_effect_zh: >-
            减少攻击者可直接利用的长期明文派生副本，使未批准读取从正常生成过程分离，并留下可关联的对象与主体差异。
          expected_effect_en: >-
            Reduce long-lived plaintext derivative copies available to an adversary, separate unapproved reads from normal production, and preserve correlatable object and principal differences.
          limitations_zh: >-
            某些打印、恢复、索引和移动设备支持流程需要可读副本；强制加密或快速清理会增加恢复与支持成本。已控制批准消费者或持有解密密钥的攻击者仍可沿正常路径读取，且无稳定 manifest 的应用难以建立精确关联。
          limitations_en: >-
            Some printing, recovery, indexing, and mobile-device support workflows require readable copies; encryption or rapid cleanup can increase recovery and support cost. An adversary controlling an approved consumer or decryption key can still read through the normal path, and applications without stable manifests are hard to correlate precisely.
      evidence_keys: [T1005_R_TAJMAHAL, T1005_R_COOKIEMINER, T1005_R_APPLE_LOCAL_BACKUP, T1005_R_MS_BACKUP_RIGHT, T1005_R_MS_PRINT_307, REF-000379]
