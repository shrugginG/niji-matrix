    REF-000379 supplies exercised object-access fields, REF-000475 supplies output file-action and initiating-process fields, and REF-000868 supplies process-creation lineage. MIT-000137 has reusable source-read authorization and targeted-audit measures and should be extended with a T1005 parent application if the parent is admitted. Its current measures do not govern derivative-copy lifecycle, encryption, producer-consumer separation, or manifests, so the proposed child mitigation remains a create candidate. Existing DET/NJA objectives are tied to automated passes, identity views, mail replicas, archives, or credential stores and should not be extended by title similarity.
