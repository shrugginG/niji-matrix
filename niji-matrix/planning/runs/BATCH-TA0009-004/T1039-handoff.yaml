handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-004
work_item_ref: WORK-TA0009-T1039
temporary_key_prefix: T1039_
candidate:
  source_type: attack
  source_attack_id: T1039
  source_attack_version: '19.1'
  name:
    zh: 从网络共享驱动器获取数据
    en: Data from Network Shared Drive
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        固定 ATT&CK Enterprise 19.1 将 T1039 置于 Collection，并把行为锚定为从当前系统可达的远程共享驱动器或文件服务器取得敏感内容，固定版没有 ATT&CK 子项。Forcepoint 对 TINYTYPHON 的逆向分析显示样本遍历可见驱动器、按配置扩展名选择文档并上传，研究者在其控制端看到数千份被取走文档；The DFIR Report 又在真实入侵中观察到 Rclone 从 UNC 共享直接复制到 MEGA。两类资料足以保留“实际取得远端共享内容”这一父行为，不能把共享枚举、访问授权或工具能力替代为取得结果。
      en: >-
        The fixed ATT&CK Enterprise 19.1 baseline places T1039 under Collection and anchors it in obtaining sensitive content from a remote shared drive or file server reachable from the current system, with no ATT&CK children. Forcepoint reverse engineered TINYTYPHON traversing visible drive letters, selecting configured document extensions, and uploading them, while researchers observed thousands of stolen documents on its controller. The DFIR Report separately observed Rclone copying directly from a UNC share to MEGA in an intrusion. These sources justify retaining actual acquisition of remote-share content as the parent behavior; share enumeration, authorization, or tool capability cannot substitute for the acquisition outcome.
    - zh: >-
        网络共享位置本身不构成匿迹，因此建议适配为“匿迹型网络共享内容获取”：只有攻击者借用业务共享、有效身份、既有映射或正常读取接口，使读取在来源、进程或业务语境上难与合法访问区分时才进入正式矩阵。当前建议一项 Niji 原生子项“既有映射共享语境复用”，变量是恶意进程使用受害者登录会话中已经存在的映射和访问身份，而不另建映射或显式提交新凭据。Forcepoint 证明恶意收集器确实从已映射驱动器取文档，Microsoft 证明映射与登录会话绑定；来源没有测量告警下降，故子项置信度为 medium，主 Agent 可在跨技术评审中保留或降为 deferred。
      en: >-
        A network-share location is not stealth by itself, so adapt the candidate to Stealth-Oriented Network Share Content Acquisition. It enters the formal matrix only when an adversary borrows a business share, valid identity, preexisting mapping, or ordinary read interface so source, process, or business context poorly distinguishes the read from legitimate access. One Niji-native child is proposed: Preexisting Mapped-Share Context Reuse, whose variable is malicious use of a mapping and access identity already present in the victim logon session instead of creating a new mapping or explicitly submitting new credentials. Forcepoint establishes malicious collection from mapped drives, and Microsoft establishes that mappings are bound to logon sessions. Neither source measures alert reduction, so the child is medium confidence and may be retained or deferred by the primary agent after cross-technique review.
  scope_notes:
    zh: >-
      直接对象是远程 SMB、NFS 或等价共享文件系统返回的文件正文或字节。T1135 与 T1083 只证明共享、路径或名称；T1021 负责远程服务会话或目标交互；T1005 负责从本地主机及已落地离线缓存读取；T1074/NJT-0134 负责取得后的汇聚与暂存；T1570/NJT-0130 负责把工具或文件送达另一内部主机；T1567 等负责离开环境。一次 Rclone 从 UNC 共享直达外部云可同时具有 T1039 与外传语义，但因为没有中间落点而不能自动记为 T1074。5145 是共享访问权限检查；必须以实际使用 ReadData 的 4663、NAS 成功 READ 记录、成功 SMB READ 响应或内容结果补强，后续复制只作独立旁证。
    en: >-
      The direct object is file content or bytes returned by a remote SMB, NFS, or equivalent shared filesystem. T1135 and T1083 establish only shares, paths, or names. T1021 owns remote-service sessions or destination interaction. T1005 owns reads from the local host or an already materialized offline cache. T1074 and NJT-0134 own aggregation and staging after acquisition. T1570 and NJT-0130 own delivery of a tool or file to another internal host, and T1567 and peers own departure from the environment. One Rclone operation from a UNC share directly to external cloud can instantiate T1039 and exfiltration without automatically becoming T1074 because no intermediate destination exists. Event 5145 is a share-access authorization check and requires stronger support from exercised ReadData in 4663, a NAS successful READ record, a successful SMB READ response, or a content result; later copying remains separate corroboration.
proposed_content:
  temporary_key: T1039_PARENT
  name:
    zh: 匿迹型网络共享内容获取
    en: Stealth-Oriented Network Share Content Acquisition
  summary:
    zh: 攻击者从远程文件共享实际取得内容，并借用有效共享身份、业务路径或既有访问语境，使恶意读取与正常浏览、备份或迁移读取难以在单一观察面区分。
    en: An adversary actually obtains content from a remote file share while borrowing a valid share identity, business path, or existing access context, making malicious reads difficult to distinguish from ordinary browsing, backup, or migration at one observation point.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: >-
        匿迹型网络共享内容获取是攻击者在取得共享访问权和网络可达性后，从另一主机、文件服务器或 NAS 所承载的共享文件系统读取文件正文，并有意让请求沿预期身份、命名空间或读取接口出现，以降低单一日志对恶意目的的区分力。完成条件是远端对象的内容进入攻击者控制的处理链；共享存在、目录列表、ACL 允许、文件句柄打开或一条权限检查均不足以证明内容已经取得。
      en: >-
        Stealth-Oriented Network Share Content Acquisition occurs after an adversary gains share authority and network reachability, reads file content from a shared filesystem hosted by another endpoint, file server, or NAS, and deliberately makes the request appear through an expected identity, namespace, or read interface. Completion requires remote-object content to enter an attacker-controlled processing path. Share existence, directory listing, an allowing ACL, an opened handle, or one authorization check does not establish acquisition.
    - zh: >-
        概念锚是“客户端或进程—共享会话或映射—服务器共享/导出—对象路径—成功内容读取”，不是 SMB、NFS、盘符、NAS 品牌或复制工具。读取后可直接外传，也可写入本地或远程暂存点；这些后继方向不改变源行为的 T1039 归属。若文件先由合法同步或离线缓存落到本地主机，攻击者随后只读本地副本，则当次读取归 T1005，不能因副本历史来源于共享而继续标成 T1039。
      en: >-
        The conceptual anchor is client or process, share session or mapping, server share or export, object path, and successful content read, rather than SMB, NFS, a drive letter, a NAS brand, or a copy utility. The read may feed direct exfiltration or a local or remote staging write; those later directions do not change the T1039 source behavior. If legitimate synchronization or offline caching first materializes the file locally and the adversary later reads only that local copy, the read belongs to T1005 even though the copy historically came from a share.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        文件共享本来就承载员工文档访问、应用数据、备份、索引、反恶意软件扫描与迁移。恶意读取使用同一用户或服务身份、同一共享名和同一 ReadData 语义时，服务器侧事件可以完整记录访问却仍缺乏业务目的；若检测只按工具名、总字节或新映射命令判断，使用原生 API、现有盘符或低量目标读取的行为会与正常活动重叠。对象敏感度、主体职责、源主机角色、进程来源与后继处理必须共同恢复区分力。
      en: >-
        File shares normally carry employee document access, application data, backup, indexing, antimalware scanning, and migration. When a malicious read uses the same user or service identity, share name, and ReadData semantics, server events may accurately record access while lacking business purpose. Detection based only on tool names, aggregate bytes, or a new mapping command can therefore conflate native APIs, an existing drive letter, or a small targeted read set with ordinary activity. Object sensitivity, principal duty, source-host role, process provenance, and later handling must restore distinction together.
    - zh: >-
        客户端与服务器还保留不同视角：5145 能给出服务器、源地址、登录标识、共享和相对路径，却只是访问检查；配置 SACL 后的 4663 能表明对象权限被实际使用，但不说明完整字节量或攻击者是否保存内容。客户端进程遥测可能归出发进程，却未必记录远端成功结果。成功 SMB READ 响应或 NAS 成功读取审计可补强结果，后续本地文件、归档或外联则进一步提高可信度；任何缺层都应保留为部分谱系。
      en: >-
        Client and server retain different views. Event 5145 can expose server, source address, logon ID, share, and relative path, but it remains an access check. With a SACL, event 4663 can show that an object right was exercised, yet it does not report complete byte volume or prove attacker retention. Client process telemetry can attribute the initiating process without necessarily recording the remote result. A successful SMB READ response or NAS successful-read audit strengthens the outcome, while a later local file, archive, or egress raises confidence further. Missing layers must remain a partial lineage.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入从已知共享或挂载文件系统实际读取远端文件正文的行为，包括从 UNC、映射盘符或 NFS mount 读取后直接送往外部目的地。只列出共享、目录、文件名、时间戳或属性属于 T1135/T1083；登录远程服务、执行命令或横向控制属于 T1021 等行为。读取失败、AccessCheck 允许但未返回数据、仅打开目录句柄和仅发现文件均不完成本技术。
      en: >-
        Include actual reads of remote file bodies from a known share or mounted filesystem, including content read from a UNC path, mapped drive, or NFS mount and sent directly to an external destination. Listing shares, directories, file names, timestamps, or attributes belongs to T1135 or T1083. Remote-service logon, command execution, and lateral control belong to T1021 and related behaviors. A failed read, an allowing AccessCheck without returned data, a directory handle alone, or discovery alone does not complete this technique.
    - zh: >-
        取得后的本地/远程写入与汇聚归 T1074/NJT-0134，压缩归 T1560，离开环境归外传战术；把载荷复制到另一主机归 T1570/NJT-0130。方向必须从对象来源和结果判断：从服务器共享读业务文件是 T1039，向 ADMIN$ 写工具是 T1570，同一 SMB 会话可同时发生但证据不可互相替代。合法备份、文件服务器扫描、杀毒/分类、电子发现、恢复、用户批量复制及 Storage Migration Service/RoboCopy 迁移都是强反例，必须用作业 owner、身份、源/目标范围、时间与变更记录排除。
      en: >-
        Later local or remote writes and aggregation belong to T1074 and NJT-0134, archiving to T1560, and departure to exfiltration; copying a payload to another host belongs to T1570 and NJT-0130. Direction follows object source and result: reading business files from a server share is T1039, while writing a tool into ADMIN$ is T1570. One SMB session may contain both, but their evidence is not interchangeable. Authorized backup, file-server scanning, antimalware or classification, e-discovery, restore, user bulk copy, and Storage Migration Service or RoboCopy migration are strong counterexamples that require job owner, identity, source and destination scope, schedule, and change record for exclusion.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          一类场景是进入用户会话的收集器遍历该会话可见的映射驱动器，筛选文档并上传。Forcepoint 对 TINYTYPHON 的分析记录其扫描驱动器字母、按配置扩展名选择并上传文档，控制端存在数千份受害者文档；公开报告没有为每份文档保留远端共享与本地盘的逐文件来源标签，因此它最强地支持映射语境行为与实际文档取得，而不支持所有文档均来自共享的数量结论。
        en: >-
          One scenario places a collector in a user session, where it traverses visible mapped drives, selects documents, and uploads them. Forcepoint reports TINYTYPHON scanning drive letters, selecting configured extensions, and uploading documents, with thousands of victim documents present on the controller. The public report does not preserve a per-file label separating remote-share and local-drive origin, so it most strongly establishes mapped-context behavior and actual document acquisition rather than a count asserting that every document came from a share.
      - zh: >-
          另一类场景由内网服务器直接读取远端共享并外传。The DFIR Report 在 Bazar/Conti 入侵中观察到 Rclone 以 UNC 共享为源向 MEGA 复制，另一次 Emotet 入侵的命令行同样以共享为源，且 Zeek 记录到 SMB 共享连接。这些事件证明读取与后继发送可由同一工具连续完成；直接外传不产生独立中间暂存点，不能据此增加 T1074。
        en: >-
          Another scenario has an internal server read a remote share directly into exfiltration. The DFIR Report observed Rclone copying from a UNC share to MEGA in a Bazar/Conti intrusion. A separate Emotet intrusion likewise used a share as the command-line source and exposed SMB share connections in Zeek. These incidents establish that one tool can perform source acquisition and subsequent sending continuously. Direct egress creates no separate intermediate staging point and does not by itself add T1074.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者至少需要到共享服务器的网络路径、可读取目标对象的共享与文件系统权限，以及能在客户端发出文件读取的进程或会话。其可控制源主机、身份、路径集合、读取顺序和后继去向，但受 ACL、export policy、映射所属登录会话、文件锁、离线状态和协议版本约束。既有映射子项还要求恶意进程实际运行在能看见该映射的同一登录上下文；提升或另起身份可能因 LUID 分离而看不到原盘符。
          en: >-
            The adversary needs network reachability to the share server, share and filesystem authority to read target objects, and a client process or session able to issue file reads. The actor can control source host, identity, path set, read order, and successor destination, but ACLs, export policy, mapping ownership by logon session, locks, offline state, and protocol version constrain the operation. The proposed preexisting-mapping child additionally requires malicious execution in the same logon context that can see the mapping; elevation or another identity may lose the drive letter because of LUID separation.
      defender_model:
        paragraphs:
        - zh: >-
            防守方可能拥有文件服务器共享审计、对象 SACL、NAS/NFS 审计、网络 SMB 元数据、端点进程与映射清单，但这些来源的成功语义和关联键不同。Windows 5145 应只产生“请求并通过/拒绝共享检查”的候选；4663 ReadData、NAS 成功 READ 或成功 SMB READ 响应才把结论提升到服务器提供内容。再按服务器、LogonId、源 IP/资产、对象路径、客户端进程、身份职责和批准作业关联。没有服务器成功事件时可报告高风险请求，不能宣称数据已被完整取得。
          en: >-
            Defenders may have file-server share audit, object SACLs, NAS or NFS audit, SMB network metadata, endpoint processes, and mapping inventory, but these sources differ in success semantics and join keys. Windows 5145 should create only a requested and allowed or denied share-check candidate. Event 4663 ReadData, a NAS successful READ, or a successful SMB READ response raises the conclusion to server-provided content. Correlation then uses server, LogonId, source IP or asset, object path, client process, identity duty, and approved job. Without a server success event, report a high-risk request rather than claiming complete acquisition.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用业务共享身份与读取外观掩盖恶意内容获取
      en: Borrow business-share identity and read appearance to disguise malicious content acquisition
    analysis:
      paragraphs:
      - zh: >-
          攻击者以已获授权的用户或服务身份，通过日常共享路径执行与浏览、备份、扫描或迁移相同的文件读取。服务器记录的主体、源地址、共享和 ReadData 可以真实，却无法单独表达业务目的；如果客户端又复用现有映射，显式建连或凭据提交动作还会少于新挂载路径。防守方必须把成功读取与主体职责、客户端进程、映射归属、对象敏感度和批准作业做差。Forcepoint 证明映射驱动器被恶意收集器实际使用，Microsoft 证明映射属于登录会话，匿迹收益仍是受环境基线约束的推断。
        en: >-
          The adversary reads through an already authorized user or service identity and an ordinary share path, producing the same file-read semantics as browsing, backup, scanning, or migration. Server-recorded principal, source address, share, and ReadData may all be accurate while failing to express business purpose. Reuse of an existing mapping can also avoid the explicit mapping or credential-submission action of a newly mounted path. Defenders must compare successful reads with principal duty, client process, mapping ownership, object sensitivity, and approved jobs. Forcepoint establishes malicious use of mapped drives and Microsoft establishes logon-session ownership of mappings; the stealth benefit remains an inference bounded by the environment's baseline.
    evidence_keys:
    - T1039_REF_FORCEPOINT_MONSOON
    - T1039_REF_MS_MAPPED_SESSION
    - REF-000474
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: >-
          建议仅把“既有映射共享语境复用”形式化为当前 Niji 子项。稳定变量是读取者是否进入受害者登录会话中已经存在的共享映射和身份语境；反事实是另建映射、显式提供新凭据或从新客户端访问。该变量改变客户端侧建连/映射痕迹及服务器侧归因解释，并要求映射、登录会话、客户端进程与成功读取的专门关联。按 SMB/NFS、盘符/UNC、文件服务器/NAS、工具或服务器产品拆分都只是实现差异。
        en: >-
          Recommend formalizing only Preexisting Mapped-Share Context Reuse as the current Niji child. Its stable variable is whether the reader enters a share mapping and identity context already present in the victim logon session; the counterfactual creates a mapping, explicitly submits new credentials, or arrives from a new client. This variable changes client-side connection or mapping traces and the interpretation of server-side attribution, requiring a distinct join among mapping, logon session, client process, and successful read. SMB versus NFS, drive letter versus UNC, file server versus NAS, tool, and server product are implementation differences.
      - zh: >-
          扩展名、路径、年龄或敏感标签筛选属于 T1119/NJT-0135 的收集编排或父级目标范围；变化检查点和低频增量已由 NJS-0135-001 覆盖。跨多源分散读取缺少结论级现场证据；服务器审计与端点缓存错位是观察限制，而从离线缓存读字节归 T1005。快照、备份 API 与管理 REST 旁路审计有风险线索，但当前没有恶意主体实际经这些接口取得共享正文的充分证据。它们均不增列子项。
        en: >-
          Extension, path, age, and sensitivity filters belong to T1119 and NJT-0135 orchestration or to parent target scope; change-checkpoint and low-rate incremental behavior is already covered by NJS-0135-001. Cross-source dispersion lacks conclusion-level incident evidence. Server-audit versus endpoint-cache mismatch is an observation limit, while reading bytes from an offline cache belongs to T1005. Snapshot, backup API, and administrative REST audit-bypass paths are research leads without sufficient evidence of a malicious actor actually obtaining shared content through them. None creates another child.
    proposed_child_keys:
    - T1039_CHILD_EXISTING_MAPPING
proposed_subtechniques:
- temporary_key: T1039_CHILD_EXISTING_MAPPING
  formalization_recommendation: proposed-formal
  confidence: medium
  name:
    zh: 既有映射共享语境复用
    en: Preexisting Mapped-Share Context Reuse
  summary:
    zh: 攻击者在受害者已有登录会话中使用预先存在的共享映射和有效身份读取远端内容，使恶意访问缺少新的映射或显式凭据动作并继承正常用户语境。
    en: An adversary reads remote content through a share mapping and valid identity already present in the victim logon session, avoiding a new mapping or explicit credential action and inheriting ordinary user context.
  definition_and_concept:
    paragraphs:
    - zh: >-
        既有映射共享语境复用以“恶意读取是否使用进入进程之前已属于当前登录会话的网络驱动器或共享连接”为控制变量。完成仍要求服务器返回文件内容；映射存在、恶意进程能看到盘符或一次 ReadData 权限检查不足以完成子项。若恶意代码调用 net use、WNetAddConnection 或等价接口新建连接，仍可属于父技术，但不属于本子项。
      en: >-
        Preexisting Mapped-Share Context Reuse controls whether the malicious reader uses a network drive or share connection that already belonged to the current logon session before the process entered the path. Completion still requires the server to return file content. Mapping existence, visibility of a drive letter to the malicious process, or one ReadData authorization check is insufficient. A malicious net use, WNetAddConnection, or equivalent creation of a new connection may still instantiate the parent but falls outside this child.
    - zh: >-
        “既有”由登录会话和映射生命周期判定，不由盘符名称判定。Microsoft 说明映射使用认证 ID/LUID 与登录会话关联，不同提升会话可能无法看到原映射；因此同一台主机、相同用户名或相同 UNC 不能自动证明复用。防守方应保存映射策略或状态、进程令牌/会话和服务器成功读取之间的连续关系。
      en: >-
        Existing is determined by logon session and mapping lifetime, not by the drive-letter name. Microsoft documents mapped drives as associated with an authentication ID or LUID and unavailable to a different elevated session in common configurations. The same host, user name, or UNC path therefore does not automatically establish reuse. Defenders need continuity among mapping policy or state, process token or session, and a successful server read.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        本子项使恶意读取继承受害者已经使用的共享名、源设备和用户身份，并可能省去新的映射命令、凭据提示或新增盘符。只监控 net use、新网络登录或陌生源主机的检测可能把它当成正常用户文件访问。痕迹没有消失：恶意进程会接触映射命名空间，文件服务器仍可能记录 5145、4663 或 NAS READ，映射策略、登录 LUID、对象路径与读取时序可以恢复因果链。
      en: >-
        The child inherits a share name, source device, and user identity already used by the victim and may avoid a new mapping command, credential prompt, or added drive letter. A detector centered on net use, a new network logon, or an unfamiliar source host can therefore treat the event as ordinary user file access. Traces remain: the malicious process touches the mapped namespace, the file server may record 5145, 4663, or a NAS READ, and mapping policy, logon LUID, object path, and read timing can restore causality.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入同一受害者登录会话中的恶意进程经已存在映射实际取得远端共享正文。排除新建或重连映射、显式提交攻击者凭据、只枚举映射盘符、只列目录及只读取本地离线缓存。映射由 GPO、登录脚本、用户手工或业务客户端创建不构成兄弟分类；关键是它在恶意读取前已存在且属于同一可见登录上下文。
      en: >-
        Include a malicious process in the same victim logon session actually obtaining remote-share content through a preexisting mapping. Exclude newly created or reconnected mappings, explicit submission of adversary credentials, mapped-drive enumeration alone, directory listing alone, and reads from a local offline cache. Whether Group Policy, a logon script, a user, or a business client created the mapping does not form sibling categories; it must predate the malicious read and belong to the same visible logon context.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          Forcepoint 报告 TINYTYPHON 搜索操作系统盘后继续遍历 C 到 Z 的驱动器，对匹配配置扩展名的文档执行上传；报告概述明确称其抓取 mapped drives。该实现适合已进入用户会话且组织用登录脚本或用户映射暴露业务共享的环境。报告没有给出每个盘符的 UNC、LUID、服务器审计或新建映射调用，因此子项结论限于已有映射被恶意收集器复用的实现事实，不外推到无映射的直接 UNC 访问。
        en: >-
          Forcepoint reports TINYTYPHON searching the operating-system drive and then drive letters C through Z, uploading documents whose extensions match its configuration; the report overview explicitly describes mapped-drive crawling. This implementation fits a collector inside a user session where logon scripts or users expose business shares through mappings. The report does not publish each drive's UNC, LUID, server audit, or mapping-creation call, so the child conclusion is limited to reuse of mapped drives by a malicious collector and does not extend to unmapped direct UNC access.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要在有映射的登录会话内执行，继承或使用能访问远端文件的令牌，并知道或枚举可见盘符。它受映射在线状态、用户权限、UAC/LUID 分离和会话结束约束。若恶意进程在 SYSTEM、另一个用户或不同提升登录中运行，原映射可能不可见，攻击者必须创建新连接并失去本子项边界。
          en: >-
            The adversary needs execution inside the logon session that owns the mapping, a token able to access remote files, and knowledge or enumeration of visible drive letters. Mapping availability, user permissions, UAC or LUID separation, and session termination constrain the path. Malware running as SYSTEM, another user, or a different elevated logon may not see the original mapping and must create a new connection, losing this child boundary.
      defender_model:
        paragraphs:
        - zh: >-
            防守方须能把映射的用户/LUID 与客户端进程身份连接，再通过服务器端 LogonId、源 IP、共享/路径和成功读取结果闭合。映射清单若只有当前状态而无首次出现时间，只能说明可达性；5145 若没有 4663、NAS 成功 READ 或 SMB 响应也只说明权限检查。检测应把未经批准的进程/任务与正常用户、备份代理、迁移服务、索引器及安全扫描器比较。
          en: >-
            Defenders need to join mapping user or LUID to the client process and then close the path through server LogonId, source IP, share and path, and a successful read outcome. A current-state mapping inventory without first-seen time establishes reachability only. Event 5145 without 4663, a NAS successful READ, or an SMB response remains an authorization check. Detection must compare unapproved processes and tasks with normal users, backup agents, migration services, indexers, and security scanners.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 复用受害者登录会话的共享映射与身份外观
      en: Reuse the victim logon session's share mapping and identity appearance
    analysis:
      paragraphs:
      - zh: >-
          既有映射让恶意进程沿受害者本来可见的盘符和有效身份读取文件，减少新增映射、显式凭据提交及陌生来源这些容易单独筛选的特征。服务器侧仍会把访问归给真实用户/源主机并留下对象读取，客户端也可见异常进程；难点从识别“谁能访问”转为识别“同一授权语境中哪个进程为何访问”。Forcepoint 支持恶意映射盘收集，Microsoft 支持映射与登录会话绑定；两者未提供实测漏报率，故置信度为 medium。
        en: >-
          An existing mapping lets a malicious process read through a drive letter and valid identity already visible to the victim, reducing separately searchable features such as a new mapping, explicit credential submission, or unfamiliar source. The server still attributes access to the real user and source host and retains object reads, while the client can expose an abnormal process. The problem shifts from who can access to which process in the authorized context accessed the content and why. Forcepoint supports malicious mapped-drive collection and Microsoft supports session-bound mapping; neither measures missed detections, so confidence is medium.
    evidence_keys:
    - T1039_REF_FORCEPOINT_MONSOON
    - T1039_REF_MS_MAPPED_SESSION
    confidence: medium
  evidence_keys:
  - T1039_REF_FORCEPOINT_MONSOON
  - T1039_REF_MS_MAPPED_SESSION
  - REF-000474
  - REF-000379
  defense_strategy_keys:
  - T1039_DET_SHARE_READ_OUTCOME
  mitigation_keys:
  - T1039_MIT_SHARE_READ_SCOPE_AUDIT
  limitations:
    paragraphs:
    - zh: >-
        Forcepoint 没有公开 TINYTYPHON 的逐盘 UNC、用户 SID/LUID、SMB/NFS 服务器事件或映射创建历史，控制端文档也未逐件标注本地或网络来源。因此该案例证明从 mapped drives 收集和真实文档外流，但“省去新建映射使告警下降”仍是平台语义支持的有界推断。若后续证据显示样本实际为每个目标新建连接，子项应撤回而父技术仍成立。
      en: >-
        Forcepoint does not publish per-drive UNC paths, user SID or LUID, SMB or NFS server events, or mapping-creation history for TINYTYPHON, and the controller documents are not individually labeled as local or network sourced. The case establishes mapped-drive collection and real document loss, while reduced alerting from avoiding a new mapping remains a bounded inference supported by platform semantics. If later evidence shows the sample created a fresh connection for each target, withdraw the child while retaining the parent.
defense_candidates:
  detection_strategies:
  - temporary_key: T1039_DET_SHARE_READ_OUTCOME
    name:
      zh: 网络共享请求—成功读取—客户端来源关联
      en: Network-Share Request to Successful Read and Client Provenance Correlation
    objective:
      zh: 把共享权限检查与服务器实际提供内容分层，并将成功读取连接到客户端进程、登录/映射语境、对象敏感度和批准作业。
      en: Separate share authorization checks from server-provided content, then join successful reads to client process, logon or mapping context, object sensitivity, and approved work.
    detects_keys:
    - T1039_PARENT
    - T1039_CHILD_EXISTING_MAPPING
    domains:
    - enterprise
    analytic_keys:
    - T1039_NJA_WINDOWS_SMB_READ_LINEAGE
    - T1039_NJA_ONTAP_NAS_READ_SCOPE
    evidence_keys:
    - REF-000474
    - REF-000379
    - REF-000906
    - T1039_REF_MS_MAPPED_SESSION
    - T1039_REF_MS_SMB2_READ_RESPONSE
    - T1039_REF_NETAPP_NAS_AUDIT
    - T1039_REF_NETAPP_NFS_FPOLICY
  detection_analytics:
  - temporary_key: T1039_NJA_WINDOWS_SMB_READ_LINEAGE
    strategy_key: T1039_DET_SHARE_READ_OUTCOME
    name:
      zh: Windows SMB 成功读取与客户端进程/映射谱系
      en: Windows SMB Successful Read to Client Process and Mapping Lineage
    platforms:
    - Windows
    logic:
      zh: >-
        在重点文件服务器启用 Audit Detailed File Share，并只把 5145 中请求 ReadData、带 SubjectLogonId、IpAddress、ShareName、RelativeTargetName 和 AccessCheckResult 的事件作为共享权限检查候选；拒绝项用于暴露探测，允许项仍不能证明字节返回。对已配置 ReadData SACL 的敏感对象，在同一服务器按 SubjectLogonId、规范化共享/对象路径和短时间窗寻找 4663 ReadData；若网络传感器能解析 SMB，再以 status=success 且 response data length 大于零的 READ 响应补强。4663 或成功 READ 可把结论提升为服务器提供内容，但仍不证明攻击者完整保存文件。

        把服务器 SubjectLogonId 接到 4624 Type 3 的用户和源 IP，再解析为稳定客户端资产。客户端侧用进程唯一 ID、用户 SID/LUID、SMB 网络连接和已验证的远端文件读取事件恢复发起进程；映射清单或 GPO/登录脚本清单把盘符规范化到 UNC，并标记映射是否属于同一登录上下文。按三十分钟读取窗口聚合敏感对象数、路径扇出及服务器读取结果，与身份职责、获批准备份/索引/杀毒/迁移作业和维护窗口比较。只在成功读与未经批准来源闭合时输出 confirmed_share_content_read；只有 5145 时输出 access_check_only。后续暂存或外联可提高优先级但不是确认读取的必需条件。
      en: >-
        Enable Audit Detailed File Share on priority file servers and treat event 5145 requests containing ReadData, SubjectLogonId, IpAddress, ShareName, RelativeTargetName, and AccessCheckResult only as share authorization candidates. Denials expose probing; allowed checks still do not prove returned bytes. For sensitive objects with a ReadData SACL, find event 4663 ReadData on the same server by SubjectLogonId, normalized share and object path, and a short window. If a network sensor parses SMB, strengthen the result with a READ response having success status and nonzero response data length. Event 4663 or a successful READ raises the finding to server-provided content but still does not prove the adversary retained the complete file.

        Join server SubjectLogonId to type-3 event 4624 for principal and source IP, then resolve a stable client asset. On the client, recover the initiating process through process unique ID, user SID or LUID, SMB network connection, and a validated remote-file read event. Mapping inventory or Group Policy and logon-script inventory normalizes drive letters to UNC and identifies whether the mapping belongs to the same logon context. Aggregate sensitive object count, path fan-out, and server read results over thirty minutes and compare them with principal duty, approved backup, indexing, antimalware, or migration jobs, and maintenance windows. Emit confirmed_share_content_read only when a successful read closes with an unapproved source; emit access_check_only for 5145 alone. Later staging or egress can raise priority but is not required to confirm the read.
    data_requirements:
    - source_type: windows-detailed-file-share
      channel: Security/5145 on the file server
      required_fields: [timestamp, server_id, subject_user_sid, subject_logon_id, source_ip, source_port, share_name, share_path, relative_target_name, access_mask, accesses, access_check_result]
    - source_type: windows-file-object-access
      channel: Security/4663 with matching ReadData SACL on the file server
      required_fields: [timestamp, server_id, subject_user_sid, subject_logon_id, object_name, object_type, access_mask, accesses, process_id, process_name]
    - source_type: windows-network-logon
      channel: Security/4624 on the file server
      required_fields: [timestamp, server_id, target_logon_id, target_user_sid, logon_type, source_ip, authentication_package]
    - source_type: endpoint-process-and-network-lineage
      channel: validated EDR or Sysmon process plus network telemetry
      required_fields: [timestamp, client_id, process_unique_id, process_id, parent_process_id, image, signer, command_line, user_sid, logon_luid, remote_ip, remote_port]
    - source_type: share-mapping-and-authorized-job-inventory
      channel: configuration management, GPO/logon scripts, approved jobs, and current mapping state
      required_fields: [client_id, user_sid, logon_luid, local_path, remote_unc, mapping_source, first_seen, job_id, owner, process_path, principal_id, approved_paths, valid_from, valid_to]
    - source_type: sensitive-share-object-registry
      channel: null
      required_fields: [server_id, normalized_object_path, sensitivity, business_owner, authorized_roles]
    observables:
    - permission_check_only
    - server_exercised_readdata
    - smb_success_response_with_bytes
    - client_process_and_logon_context
    - preexisting_mapping_context
    - sensitive_path_fanout
    correlation:
      window: 5145 to 4663 or SMB response within 60s; reads grouped for 30m; user/share/process baseline 30d
      dimensions: [server_id, subject_logon_id, subject_user_sid, source_ip, client_id, process_unique_id, logon_luid, share_name, normalized_object_path, mapping_id, job_id, time]
    false_positives:
      zh: >-
        文件服务器备份与恢复、反恶意软件或 DLP/分类扫描、Windows Search 或企业索引、Storage Migration Service/RoboCopy、软件发布、电子发现、合法批量分析和用户复制都会产生成功 ReadData。进程签名、服务账户或夜间时间本身都不能永久放行，必须核对 owner、具体路径、源主机、目标、任务 ID 和有效窗口。
      en: >-
        File-server backup and restore, antimalware or DLP and classification scans, Windows Search or enterprise indexing, Storage Migration Service or RoboCopy, software distribution, e-discovery, authorized analytics, and user copying all produce successful ReadData. A process signature, service account, or nighttime schedule must never become a permanent allow rule; verify owner, exact paths, source host, destination, job ID, and validity window.
    blind_spots:
      zh: >-
        5145 事件量高且只表达共享访问检查；4663 需要预先配置对象 SACL，服务器记录的 process 通常不是客户端原始进程。客户端 EDR 可能不记录远端文件读取，SMB 加密会阻止网络解析，NAT/跳板会弱化源映射，映射首次出现时间也可能不可得。成功读取事件仍不证明完整文件已保存或随后外传。
      en: >-
        Event 5145 is high volume and expresses only share authorization. Event 4663 requires an object SACL in advance, and the server-side process is generally not the original client process. Client EDR may omit remote-file reads, SMB encryption prevents network parsing, NAT or jump hosts weaken source mapping, and mapping first-seen time may be unavailable. A successful read event still does not prove complete retention or later exfiltration.
    tuning_guidance:
      zh: >-
        先在少量高价值共享按敏感路径和主体启用成功读取审计，验证 5145、4663、4624 的 LogonId 与路径规范化，再扩大覆盖。把 5145-only、server-read-confirmed 和 client-process-attributed 分成不同结论等级；按职责和批准作业建立三十日基线，例外必须绑定 owner、源/目标、路径、进程、身份及到期时间。对复用映射子项不要把“未观察到 net use”当正证据，必须有同一 LUID 的映射状态与成功读取。
      en: >-
        Pilot successful-read auditing on a small set of high-value paths and principals, validate LogonId and path normalization across 5145, 4663, and 4624, then expand. Keep 5145-only, server-read-confirmed, and client-process-attributed as separate conclusion levels. Build a thirty-day duty and approved-job baseline, and bind each exception to owner, source and destination, path, process, identity, and expiry. For the mapping-reuse child, absence of net use is not positive evidence; require mapping state in the same LUID plus a successful read.
    evidence_keys:
    - REF-000474
    - REF-000379
    - REF-000906
    - T1039_REF_MS_MAPPED_SESSION
    - T1039_REF_MS_SMB2_READ_RESPONSE
    - T1039_REF_DFIR_EMOTET
  - temporary_key: T1039_NJA_ONTAP_NAS_READ_SCOPE
    strategy_key: T1039_DET_SHARE_READ_OUTCOME
    name:
      zh: ONTAP SMB/NFS 成功读取与授权范围差分
      en: ONTAP SMB or NFS Successful-Read and Authorized-Scope Differential
    platforms:
    - Linux
    - Windows
    logic:
      zh: >-
        在选定 ONTAP SVM 和高价值卷上先创建并验证 NAS audit 配置，再为 SMB 的 List folder/Read data 或 NFSv4 审计 ACE 配置成功事件；未经该前提不得从缺日志推断未读取。解析转换后的 EVTX/XML 或受管 FPolicy 通知，保留 SVM、协议、客户端 IP、Windows 用户或 UNIX UID/GID、ObjectName/卷与相对路径、operation=READ、成功/失败结果、HandleID 和事件时间。FPolicy 若启用 first-read，只能证明观察期内首次读取通知，不能恢复所有读次数。

        将成功 READ 按客户端、主体、export/share、对象敏感度和三十分钟窗口聚合，并接到 connected-client/export-policy、身份映射以及批准备份、迁移、扫描和业务应用清单。对象路径需由 ObjectName 中的卷和相对路径还原到 junction path。只有成功 READ 越出批准路径/职责或由陌生客户端和进程来源发起时提升；access denied 或 security trace 仅表示授权结果。后续文件/外联结果作为优先级信息，不把 NAS 管理 REST 的对象读取误认为普通 SMB/NFS 审计已覆盖，因为官方文档说明管理 REST 可绕过 NAS audit。
      en: >-
        Create and validate a NAS audit configuration on selected ONTAP SVMs and high-value volumes before configuring successful events for SMB List folder or Read data or NFSv4 audit ACEs. Without that prerequisite, missing logs cannot establish no read. Parse converted EVTX or XML or governed FPolicy notifications and retain SVM, protocol, client IP, Windows principal or UNIX UID and GID, ObjectName with volume and relative path, operation READ, success or failure result, HandleID, and event time. If FPolicy uses first-read, it proves only the first notification in the observation period and cannot reconstruct every read count.

        Aggregate successful READ events by client, principal, export or share, object sensitivity, and a thirty-minute window, then join connected-client or export-policy state, identity mapping, and approved backup, migration, scanning, and business application inventories. Reconstruct the full path by joining the volume and relative path in ObjectName to its junction path. Elevate only when successful READ leaves approved path or duty or comes from an unfamiliar client or process source; access denied or a security trace establishes authorization outcome only. Later file or egress results change priority. Do not assume ordinary SMB or NFS audit covers administrative REST content access, because official documentation states that management REST can bypass NAS audit.
    data_requirements:
    - source_type: ontap-nas-audit-read
      channel: ONTAP converted EVTX/XML audit log with successful file-operation auditing
      required_fields: [timestamp, svm_id, protocol, client_ip, principal, uid, gid, event_id, operation, success, object_name, handle_id]
    - source_type: ontap-fpolicy-read-notification
      channel: validated FPolicy event stream when deployed
      required_fields: [timestamp, svm_id, protocol, client_ip, principal, operation, filter, object_path, result]
    - source_type: ontap-client-export-and-path-state
      channel: ONTAP connected-clients, export policy, volume, and junction inventory
      required_fields: [svm_id, client_ip, protocol, volume_id, export_policy_id, share_or_export, junction_path]
    - source_type: authorized-nas-reader-inventory
      channel: null
      required_fields: [principal_id, client_id, application_or_job_id, approved_share_or_export, approved_paths, owner, valid_from, valid_to]
    - source_type: nas-object-sensitivity
      channel: null
      required_fields: [normalized_object_path, sensitivity, business_owner, authorized_roles]
    observables:
    - successful_nas_read
    - first_read_notification
    - client_principal_path_scope_deviation
    - nas_audit_bypass_gap
    correlation:
      window: successful READs grouped for 30m; principal/client/export baseline 30d
      dimensions: [svm_id, protocol, client_ip, principal, uid, gid, share_or_export, volume_id, normalized_object_path, handle_id, application_or_job_id, time]
    false_positives:
      zh: >-
        NAS 备份、快照/恢复验证、文件迁移、反恶意软件或分类扫描、索引、媒体工作流、电子发现和合法 NFS 计算任务都会批量读取。版本升级或 failover 还可能改变 node、client/session 和重复通知特征。
      en: >-
        NAS backup, snapshot or restore validation, file migration, antimalware or classification scanning, indexing, media workflows, e-discovery, and authorized NFS compute jobs all perform bulk reads. Upgrade or failover can also change node, client or session identity, and duplicate-notification behavior.
    blind_spots:
      zh: >-
        审计配置、SACL/ACE、转换空间和保留任何一项缺失都会丢失读取；NFS UID/GID 映射、共享 NAT、FPolicy first-read 和未支持的协议版本会降低计数与归因。ONTAP 管理 REST 文件访问可绕过 NAS audit，且成功 READ 仍不证明攻击者保存了完整对象。
      en: >-
        Missing audit configuration, SACL or ACE, conversion capacity, or retention loses reads. NFS UID and GID mapping, shared NAT, FPolicy first-read, and unsupported protocol versions reduce count and attribution. ONTAP administrative REST file access can bypass NAS audit, and a successful READ still does not prove the adversary retained the complete object.
    tuning_guidance:
      zh: >-
        按最小必要范围对高价值卷部署成功 READ 审计，先验证一组已知 SMB/NFS 测试读取能生成完整路径、主体、客户端和成功结果。对备份/迁移例外使用精确 SVM、export/share、路径、主体、客户端、job ID 和时间窗口，保留越权路径与陌生客户端；不要按协议或 NAS 产品名称直接判恶。
      en: >-
        Deploy successful-READ audit on the smallest necessary high-value volume scope and first verify known SMB and NFS test reads produce complete path, principal, client, and success fields. Define backup and migration exceptions by exact SVM, export or share, path, principal, client, job ID, and window, while retaining out-of-scope paths and unfamiliar clients. Do not classify activity as malicious by protocol or NAS product name.
    evidence_keys:
    - T1039_REF_NETAPP_NAS_AUDIT
    - T1039_REF_NETAPP_NFS_FPOLICY
    - T1039_REF_NETAPP_AUDIT_BYPASS
  mitigations:
  - temporary_key: T1039_MIT_SHARE_READ_SCOPE_AUDIT
    name:
      zh: 网络共享最小读取范围与成功读取问责
      en: Network-Share Least Read Scope and Successful-Read Accountability
    description:
      zh: >-
        以业务 owner、主体职责和内容敏感度缩小共享/文件系统读取权，清理不再需要的持久映射，并在高价值对象上验证成功读取审计与独立保留。控制同时维护备份、扫描、索引和迁移任务清单，使合法批量读取有明确来源、路径、目的和到期时间。
      en: >-
        Narrow share and filesystem read rights by business owner, principal duty, and content sensitivity, remove persistent mappings no longer required, and validate successful-read audit with independent retention on high-value objects. Maintain an inventory of backup, scanning, indexing, and migration jobs so legitimate bulk reads have explicit source, path, purpose, and expiry.
    measures:
    - key: least_share_and_object_read
      control_type: exposure-reduction
      description:
        zh: >-
          分别审查共享权限、NTFS/NFS ACL、export policy 和服务账户权限，使用户与工作负载只能读取职责所需路径；移除离职/转岗、临时项目和过期服务身份的宽泛访问，并用独立敏感标签标记重点对象。
        en: >-
          Review share permissions, NTFS or NFS ACLs, export policy, and service-account rights separately so users and workloads read only duty-required paths. Remove broad access for departed or transferred staff, temporary projects, and expired service identities, and mark priority objects through an independent sensitivity registry.
    - key: mapping_and_reader_inventory
      control_type: governance
      description:
        zh: >-
          清点 GPO、登录脚本、客户端和用户创建的持久映射，记录 owner、用户组、源设备范围、UNC/export 和有效期；同时登记备份、恢复、杀毒、DLP/分类、索引、电子发现与迁移 job 的进程、身份、路径及时间。
        en: >-
          Inventory persistent mappings created by Group Policy, logon scripts, clients, and users, recording owner, user group, source-device scope, UNC or export, and expiry. Also register process, identity, paths, and schedule for backup, restore, antimalware, DLP or classification, indexing, e-discovery, and migration jobs.
    - key: targeted_successful_read_audit
      control_type: detective-support
      description:
        zh: >-
          对少量高价值 Windows 共享配置 5145 和 ReadData SACL/4663，对 NAS/NFS 配置受支持的成功 READ 审计或 FPolicy；用测试读取验证字段与成功语义，监测日志容量、转换失败和丢失，并把日志写入共享管理员无法修改的存储。
        en: >-
          Configure 5145 plus ReadData SACL and 4663 for a small set of high-value Windows shares and supported successful-READ audit or FPolicy for NAS and NFS. Verify fields and success semantics with test reads, monitor capacity, conversion failures, and loss, and write logs to storage that share administrators cannot alter.
    - key: administrative_bypass_path_control
      control_type: preventive
      description:
        zh: >-
          限制能通过存储管理 REST、快照、备份接口或管理员通道直接读取内容的主体与网络来源，使用独立管理身份和强认证，并为这些旁路建立单独控制面审计，避免把其覆盖误算为普通 NAS 文件审计。
        en: >-
          Restrict principals and network origins able to read content through storage-management REST, snapshot, backup, or administrative channels, use separate strongly authenticated management identities, and retain independent control-plane audit rather than assuming ordinary NAS file audit covers those bypasses.
    applications:
    - target_key: T1039_PARENT
      use:
        zh: >-
          对匿迹型网络共享内容获取，按业务职责缩小共享与对象读取范围，标记高敏路径，在服务器端验证成功读取审计，并把读取主体/客户端同批准备份、扫描、索引、迁移和用户工作流清单比较。
        en: >-
          For Stealth-Oriented Network Share Content Acquisition, narrow share and object reads by duty, label sensitive paths, validate server-side successful-read audit, and compare reader principal and client with approved backup, scanning, indexing, migration, and user workflows.
      expected_effect:
        zh: >-
          减少一个受陷身份可从共享取得的内容集合，并把允许访问但越出职责/任务范围的成功读取变成可关联事件；攻击者需要扩大权限、切换管理旁路或留下更多服务器与客户端痕迹。
        en: >-
          Reduce the content a compromised identity can obtain and make successful reads outside duty or job scope correlatable even when authorization succeeds. The adversary must broaden privileges, move to an administrative bypass, or leave more server and client traces.
      limitations:
        zh: >-
          已被攻陷且本来有广泛读取权的用户、备份代理或迁移身份仍可取数；精细 ACL 会增加运维成本，成功读取审计有容量与性能代价，且不能追回已复制内容或证明未监控路径安全。
        en: >-
          A compromised user, backup agent, or migration identity with legitimate broad read rights can still collect data. Fine-grained ACLs increase operational cost, successful-read audit consumes capacity and performance, and the control cannot retract copied content or establish safety on unmonitored paths.
    - target_key: T1039_CHILD_EXISTING_MAPPING
      use:
        zh: >-
          对既有映射共享语境复用，删除无业务必要或无 owner 的登录映射，把每个映射绑定用户组、设备组和 UNC/export；保留映射策略/状态与登录 LUID，并在高敏路径将成功读取回接客户端进程和批准任务。
        en: >-
          For Preexisting Mapped-Share Context Reuse, remove logon mappings without a business need or owner, bind each mapping to user group, device group, and UNC or export, retain mapping policy or state with logon LUID, and join successful reads on sensitive paths back to client process and approved work.
      expected_effect:
        zh: >-
          缩小恶意进程可直接继承的共享命名空间，并使复用正常身份但由异常进程触发的读取更容易与批准用户/任务分开；攻击者可能被迫建立新连接并增加映射或认证痕迹。
        en: >-
          Shrink the share namespace a malicious process can inherit and make reads under a normal identity but abnormal process easier to separate from approved users and jobs. The adversary may be forced to create a new connection and add mapping or authentication traces.
      limitations:
        zh: >-
          用户业务可能依赖持久映射，恶意代码若注入批准进程或同一备份代理仍可继承例外；许多环境无法可靠保留映射首次出现时间或 LUID，且直接 UNC 访问不受清理盘符本身阻止。
        en: >-
          Business workflows may depend on persistent mappings, and malware injected into an approved process or backup agent can inherit its exception. Many environments cannot reliably retain mapping first-seen time or LUID, and direct UNC access is not prevented merely by cleaning drive letters.
    evidence_keys:
    - T1039_REF_MS_MAPPED_SESSION
    - REF-000474
    - REF-000379
    - T1039_REF_NETAPP_NAS_AUDIT
    - T1039_REF_NETAPP_AUDIT_BYPASS
    - T1039_REF_MS_STORAGE_MIGRATION
existing_library_reuse:
  reference_refs:
  - REF-000625
  - REF-000640
  - REF-000474
  - REF-000379
  - REF-000906
  claim_refs: []
  case_refs:
  - CASE-000214
  strategy_refs: []
  analytic_refs: []
  mitigation_refs: []
  relationship_refs: []
  notes:
    zh: >-
      REF-000640 与 CASE-000214 的同一 Bazar/Conti 事件已经存在，应 extend locator/subject_refs 以覆盖 UNC 共享源读取，而不是复制。REF-000474、REF-000379、REF-000906 可直接复用其权限检查、实际使用权限与审核配置语义；REF-000625 可继续作为固定 STIX 总基线，但建议另建 T1039 版本页引用以提供可读父定义。CLM-000757 聚焦共享内容被消费/执行，不能直接证明 T1039 读取成功。DET-000139/NJA-000143 检测向共享写入后的工具到达，方向相反；DET-000148 检测跨轮自动读取，缺少共享服务器成功结果与客户端映射关联；MIT-000192 只约束命名空间枚举。三者均不直接复用为本候选防御对象。
    en: >-
      REF-000640 and CASE-000214 already represent the same Bazar/Conti incident and should have locator or subject_refs extended for the UNC-share source read rather than be duplicated. REF-000474, REF-000379, and REF-000906 can be reused for access-check, exercised-right, and audit-configuration semantics. REF-000625 remains the general fixed STIX baseline, while a T1039 version-page reference is proposed for a readable parent definition. CLM-000757 concerns shared content consumption or execution and cannot directly establish successful T1039 acquisition. DET-000139 and NJA-000143 detect tool arrival after a write into a share, the opposite direction. DET-000148 detects repeated automated reads but lacks share-server success and client-mapping lineage. MIT-000192 governs namespace enumeration only. None should be reused directly as this candidate's defense object.
