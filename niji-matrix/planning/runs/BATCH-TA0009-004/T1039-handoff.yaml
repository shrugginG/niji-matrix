  claims:
  - key: T1039_CLM_ADMISSION
    subject_keys: [T1039_PARENT]
    proposition:
      zh: T1039 只有在远端共享对象内容实际进入攻击者控制链，且共享身份、路径或访问语境改变防守解释时，才符合匿迹矩阵准入；共享发现或允许访问本身不完成行为。
      en: T1039 enters the stealth matrix only when remote-share content actually enters an attacker-controlled path and share identity, path, or access context changes defender interpretation; share discovery or allowed access alone does not complete the behavior.
    evidence_keys: [T1039_REF_ATTACK19, T1039_REF_FORCEPOINT_MONSOON, REF-000640]
    evidence_mode: baseline_plus_incident_analysis
    confidence: medium
  - key: T1039_CLM_DIRECT_SHARE_ACQUISITION
    subject_keys: [T1039_PARENT]
    proposition:
      zh: The DFIR Report 在 Bazar/Conti 入侵中记录 Rclone 以 UNC 共享为源向 MEGA 复制，证明远端共享读取可同外传连续发生而无需独立暂存点。
      en: The DFIR Report records Rclone copying from a UNC share to MEGA in a Bazar or Conti intrusion, establishing remote-share acquisition continuous with exfiltration and without a separate staging point.
    evidence_keys: [REF-000640]
    evidence_mode: incident_observation
    confidence: high
  - key: T1039_CLM_EXISTING_MAPPING_IMPLEMENTATION
    subject_keys: [T1039_PARENT, T1039_CHILD_EXISTING_MAPPING]
    proposition:
      zh: TINYTYPHON 遍历映射/可见驱动器并上传匹配文档，而 Windows 映射与登录会话认证 ID/LUID 绑定，因此同会话恶意进程可复用用户已有共享语境；来源未测量告警下降。
      en: TINYTYPHON traverses mapped or visible drives and uploads matching documents, while Windows binds mappings to logon-session authentication IDs or LUIDs, allowing same-session malware to reuse an existing user share context; the sources do not measure alert reduction.
    evidence_keys: [T1039_REF_FORCEPOINT_MONSOON, T1039_REF_MS_MAPPED_SESSION]
    evidence_mode: observed_implementation_plus_platform_semantics
    confidence: medium
  - key: T1039_CLM_AUDIT_OUTCOME_LEVELS
    subject_keys: [T1039_PARENT, T1039_CHILD_EXISTING_MAPPING]
    proposition:
      zh: 5145 是共享层权限检查；配置对象审计后 4663 ReadData 表明权限被实际使用，ONTAP 可记录成功 READ，但这些事件仍不能单独证明完整文件已被攻击者保留或外传。
      en: Event 5145 is a share-layer authorization check; event 4663 ReadData with object auditing shows an exercised right, and ONTAP can record successful READ operations, yet these events alone do not prove the adversary retained or exfiltrated a complete file.
    evidence_keys: [REF-000474, REF-000379, T1039_REF_MS_SMB2_READ_RESPONSE, T1039_REF_NETAPP_NAS_AUDIT, T1039_REF_NETAPP_AUDIT_BYPASS]
    evidence_mode: vendor_documentation_plus_bounded_inference
    confidence: high
  - key: T1039_CLM_BOUNDARY
    subject_keys: [T1039_PARENT]
    proposition:
      zh: 同一共享事务必须按方向和结果拆分：远端业务文件被读入攻击者链属于 T1039，工具被写入另一内部主机属于 T1570/NJT-0130，取得后汇聚到中间点属于 T1074/NJT-0134。
      en: >-
        One share transaction must be split by direction and result: a remote business file read into the attacker path is T1039, a tool written to another internal host is T1570 and NJT-0130, and later aggregation at an intermediate point is T1074 and NJT-0134.
    evidence_keys: [T1039_REF_ATTACK19, REF-000474, REF-000640]
    evidence_mode: taxonomy_boundary_analysis
    confidence: high
  cases:
  - key: T1039_CASE_TINYTYPHON_MAPPED_DRIVES
    name:
      zh: TINYTYPHON 映射驱动器文档收集
      en: TINYTYPHON Mapped-Drive Document Collection
    actor_or_campaign: MONSOON / TINYTYPHON
    scope: Forcepoint sample analysis and controller observation; mapped-drive implementation is observed, but per-document local-versus-network provenance and measured evasion are unavailable
    observed_facts:
    - TINYTYPHON crawled mapped or visible drive letters and selected documents by configured extension.
    - Matching documents were uploaded to its command-and-control server.
    - Researchers observed thousands of victim documents on the controller, including sensitive government-related material.
    evidence_keys: [T1039_REF_FORCEPOINT_MONSOON]
    confidence: medium
  detection_strategies: [T1039_DET_SHARE_READ_OUTCOME]
  detection_analytics: [T1039_NJA_WINDOWS_SMB_READ_LINEAGE, T1039_NJA_ONTAP_NAS_READ_SCOPE]
  mitigations: [T1039_MIT_SHARE_READ_SCOPE_AUDIT]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: preexisting_mapped_share_context_reuse
      resolution: formal
      reason: Stable logon-session mapping context changes client mapping traces and server attribution interpretation; Forcepoint implementation and Microsoft platform semantics support a distinct mapping/process/read join.
    - axis: selective_extension_path_age_or_sensitivity_read
      resolution: adjacent-technique
      reason: Selection predicates are generic collection orchestration owned by T1119/NJT-0135 or parent target scope; extension or path values are not share-specific stealth variables.
    - axis: low_frequency_or_checkpoint_incremental_share_read
      resolution: adjacent-technique
      reason: Change-state and cross-pass reduction are already formalized by NJS-0135-001 and should be co-tagged rather than duplicated below T1039.
    - axis: cross_source_distributed_read
      resolution: evidence-deferred
      reason: A distribution variable could dilute per-client volume, but no conclusion-level incident or sample evidence was found for coordinated share reads across several clients with distinct defense value.
    - axis: server_audit_endpoint_cache_or_offline_copy_misalignment
      resolution: adjacent-technique
      reason: Telemetry mismatch is a defender limitation; when bytes are read from a local offline or synchronized copy, the actual acquisition belongs to T1005.
    - axis: snapshot_backup_or_administrative_api_view
      resolution: evidence-deferred
      reason: Official documentation shows legitimate backup and administrative audit differences, including an ONTAP REST bypass, but current evidence does not establish malicious acquisition of shared content through that interface.
    - axis: direct_share_to_cloud_copy
      resolution: parent-core
      reason: It proves T1039 acquisition plus exfiltration and clarifies no-staging boundaries, but destination topology is not a T1039 child variable.
    - axis: smb_nfs_share_type_tool_or_server_product
      resolution: not-stealth-distinct
      reason: Protocol, share type, command, and vendor change implementation and telemetry without a stable cross-implementation stealth cause.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        ATT&CK 零子项没有终止 Niji 开放检索。已审查会话/映射复用、选择性、时间和检查点、来源分布、服务器/端点视角、缓存、快照/备份接口、直接外传及实现维度。仅既有映射语境同时具有稳定变量、痕迹反事实、独立检测联接和恶意样本线索；它仍缺同案 LUID 与服务器成功读取，因此正式建议为 medium，主 Agent 可在跨候选收敛时 defer 而不影响父级 adapt。
      en: >-
        Zero ATT&CK children did not end the Niji search. The review examined session or mapping reuse, selection, time and checkpoints, source distribution, server and endpoint views, caches, snapshot or backup interfaces, direct egress, and implementation dimensions. Only preexisting mapping context currently has a stable variable, trace counterfactual, distinct detection join, and malicious sample lead. It still lacks same-incident LUID and server successful-read data, so its formal recommendation is medium confidence and the primary agent may defer it during cross-candidate convergence without changing the parent adapt decision.
  evidence_coverage:
    parent_behavior_keys: [T1039_REF_ATTACK19, T1039_REF_FORCEPOINT_MONSOON, REF-000640, T1039_REF_DFIR_EMOTET]
    boundary_keys: [T1039_REF_ATTACK19, REF-000474, REF-000379, REF-000640, T1039_REF_MS_STORAGE_MIGRATION]
    mechanism_support:
    - mechanism_ref: NM-FD
      keys: [T1039_REF_FORCEPOINT_MONSOON, T1039_REF_MS_MAPPED_SESSION, REF-000474]
      direct_observation: Malicious mapped-drive document collection and session-bound mapping are documented; reduced alerting is a bounded inference.
    child_existence_support:
    - child_key: T1039_CHILD_EXISTING_MAPPING
      keys: [T1039_REF_FORCEPOINT_MONSOON, T1039_REF_MS_MAPPED_SESSION]
      conclusion_scope: Windows mapped-drive reuse in a victim logon context; no generalization to all UNC, NFS, or reconnected mappings.
    unsupported_or_deferred:
    - No source measures T1039 alert reduction, false-negative rate, or a universal read-volume threshold.
    - No same-incident data joins TINYTYPHON client LUID, mapping creation time, server 5145/4663, and per-file controller output.
    - Event 5145 alone does not establish bytes served; event 4663 or a successful NAS/SMB read still does not prove complete retention.
    - Cross-client distributed collection and malicious snapshot/backup-interface reads remain unsupported hypotheses.
    - Offline or synchronized local copies belong to T1005 when the malicious read is local.
    - Extension, path, age, cadence, checkpoint, protocol, tool, and vendor partitions are not T1039 Niji children.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级和拟议子级分别覆盖实际内容结果、共享访问的匿迹条件、五组相邻边界、两类现场场景、攻防前提、因果机理、成功读取证据等级、备份/扫描/迁移反例与限制。防御将 5145 access check、4663/NAS successful read 和后续复制分成不同结论级，而不是复用“异常读取”模板。NJT-0001 仅用于字段责任与论证深度对照。
      en: >-
        Parent and proposed child separately cover actual content outcome, stealth conditions for share access, five adjacent boundaries, two observed scenarios, attacker and defender assumptions, causal mechanism, successful-read evidence levels, backup or scanning or migration counterexamples, and limitations. Defense separates 5145 access checks, 4663 or NAS successful reads, and later copies into different conclusion levels instead of reusing a generic abnormal-read template. NJT-0001 was used only for field responsibility and argumentative depth.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [Shared-library exact URL and semantic lookup, fixed ATT&CK child inventory review, YAML parsing and formatting validation]
  limitations:
    paragraphs:
    - zh: >-
        ATT&CK 固定版与事件资料证明共享内容获取的存在，却不证明任何网络共享读取天然匿迹。Forcepoint 报告将映射驱动器遍历、文档上传和控制端文档结合，但没有逐文件来源、登录 LUID 或服务器读事件；DFIR 案例给出 UNC 源与 Rclone 外传，却不能把限速、选择条件或外传匿迹全部归因于 T1039。父级的特征拟态机理应保持 medium，不能写成“共享读取无痕”。
      en: >-
        The fixed ATT&CK baseline and incident sources establish network-share acquisition but do not make every share read stealthy. Forcepoint combines mapped-drive traversal, document upload, and controller documents without per-file origin, logon LUID, or server read events. The DFIR cases provide UNC source and Rclone egress but do not attribute throttling, selection, or exfiltration stealth wholly to T1039. The parent's feature-disguise mechanism should remain medium confidence and must not be described as traceless share reading.
    - zh: >-
        防御可见性依赖审计前置条件。5145 是高量权限检查；4663 需 SACL 且不提供完整字节量；NFS/NAS 字段、支持版本和 first-read 语义随平台变化；管理 REST、缓存或未审计路径可绕开所选观察面。成功 READ 也只能证明服务器提供过数据，不能单独证明攻击者完整保存、暂存或外传。所有阈值、路径敏感度和批准作业例外必须本地验证。
      en: >-
        Defensive visibility depends on auditing prerequisites. Event 5145 is a high-volume authorization check. Event 4663 requires a SACL and does not provide complete byte volume. NFS or NAS fields, supported versions, and first-read semantics vary by platform. Administrative REST, caches, or unaudited paths can bypass the selected view. A successful READ proves only that the server provided data, not that the adversary retained, staged, or exfiltrated it completely. Every threshold, sensitivity map, and approved-job exception requires local validation.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 时间稀释、变化检查点和多来源分布是可研究轴，但前两者由 NJT-0135/NJS-0135-001 所有，后一项缺结论级 T1039 证据；不能因 Rclone 限速把外传节流归到源读取。
      en: Temporal dilution, change checkpoints, and source distribution are research axes, but NJT-0135 and NJS-0135-001 own the first two and the last lacks conclusion-level T1039 evidence. Rclone egress throttling cannot be reassigned to source acquisition.
  - mechanism_ref: NM-BT
    reason:
      zh: 客户端、文件服务器和出口日志分离是检测架构事实；现有资料没有证明攻击者把观察面分离本身作为可控 T1039 变量，出口汇聚又已由 NJT-0134 所有。
      en: Separation among client, file-server, and egress logs is a detection-architecture fact. Current sources do not establish it as an attacker-controlled T1039 variable, and egress convergence is already owned by NJT-0134.
  - mechanism_ref: NM-DO
    reason:
      zh: 加密归档、内容混淆或不可检查外传属于 T1560 或后继传输，不由共享读取本身产生。
      en: Encrypted archives, content obfuscation, and opaque egress belong to T1560 or later transfer and are not caused by the share read itself.
  open_questions:
  - Can the primary agent retain the existing-mapping child after comparing T1115, T1005, T1530, and T1602 context-reuse candidates, or should a wider cross-source variable own it?
  - Is there incident telemetry that joins a mapped-drive reader process and LUID to server-side successful ReadData for the same object?
  - Should REF-000640 and CASE-000214 be extended for T1039 source acquisition while preserving their existing T1030/T1567 meaning?
  - Can a vendor-neutral NFS successful-read analytic be supported beyond the explicit ONTAP implementation without inventing fields?
