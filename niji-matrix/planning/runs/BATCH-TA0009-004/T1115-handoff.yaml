candidate:
  source_type: attack
  source_attack_id: T1115
  source_attack_version: '19.1'
  name:
    zh: 剪贴板数据
    en: Clipboard Data
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 工作簿将 T1115 置于 TA0009 Collection，直接行为是取得用户在应用内或应用间复制到剪贴板的数据，且没有 ATT&CK 子项。eSentire 对 NightshadeC2 的现场与样本分析证明恶意程序在剪贴板变化后取得内容、写入隐藏日志并可由 C2 命令上传；Fortinet 对 QBot 的逆向分析证明注入模块在实际粘贴路径中截获 GetClipboardData 返回值，记录进程、窗口和内容后加密暂存并传输。父行为有充分的实害和 Collection 结果证据，应保留其来源对象，同时适配为要求实际内容取得并具备可论证匿迹变量的“匿迹型剪贴板内容获取”。
      en: The fixed ATT&CK Enterprise 19.1 workbook places T1115 under TA0009 Collection, with data copied within or between applications as its direct object and no ATT&CK children. eSentire's incident and sample analysis of NightshadeC2 establishes content acquisition after clipboard changes, writes to a hidden log, and upload through a C2 command. Fortinet's QBot reverse engineering establishes an injected module intercepting the GetClipboardData return path during an actual paste, recording process, window, and content before encrypted staging and transmission. The parent behavior has strong harm and Collection-outcome evidence. Preserve its source object while adapting it to Stealth-Oriented Clipboard Content Acquisition, which requires actual content acquisition and a defensible stealth variable.
    - zh: 两个原生子项通过证据门禁。第一项把读取绑定到剪贴板变化通知，空闲期不作固定轮询，痕迹从连续打开与读取转为长期监听注册及变化后的短窗读取；第二项在正常粘贴消费者进程中截获剪贴板读取结果，使内容副本沿既有粘贴调用出现并把表面主体转移到被注入应用。二者的控制变量、残余痕迹和分析方法不同。按内容正则筛选、按目标应用但不证明实际取得、低频轮询、复用剪贴板管理器或同步主体等轴尚缺少同时证明 Collection 结果与独立观察差的来源，应保持暂缓，不能为扩大子项数而正式化。
      en: Two Niji-native children pass the evidence gate. The first binds reads to clipboard-change notifications, avoiding fixed polling while idle and shifting traces from repeated open-and-read operations to a long-lived listener plus short-window reads after changes. The second intercepts clipboard results inside a normal paste-consuming process, placing the copied content on an existing paste call path and shifting the apparent actor to the injected application. Their control variables, residual traces, and analytics differ. Content-regex selection, app targeting without proof of acquired content, low-rate polling, and reuse of clipboard-manager or synchronization identities currently lack sources that jointly establish a Collection outcome and an independent observation difference; keep them deferred rather than formalizing them to increase child count.
  scope_notes:
    zh: 本候选以剪贴板服务、pasteboard 或 selection 提供的实际内容为直接对象，至少须证明内容进入攻击者控制的内存、日志、缓冲或传输链。T1056 负责在内容进入剪贴板前捕获按键、表单或其他输入；T1119 负责跨数据源的自动遍历和轮次控制；T1185 负责浏览器会话内页面、请求或响应内容介入；T1005 负责直接解析本地文件、数据库或应用存储，包含绕过剪贴板服务而直接读取历史数据库的情形。取得后的集中落点属于 T1074，压缩或加密归档属于 T1560。只替换钱包地址、写入恶意命令、注册监听器、执行一次失败读取或仅具备读取能力均不足以确认本 Collection 技术。密码管理器、剪贴板历史工具、DLP、远程支持、虚拟机共享剪贴板、RDP 和无障碍工具是必须保留的正常反例。
    en: This candidate takes actual content supplied by a clipboard service, pasteboard, or selection as its direct object and requires evidence that content entered adversary-controlled memory, a log, a buffer, or a transfer chain. T1056 owns keystrokes, form values, and other input captured before it enters the clipboard. T1119 owns automated traversal and round control across data sources. T1185 owns interposition on pages, requests, or responses inside a browser session. T1005 owns direct parsing of local files, databases, or application storage, including reading a clipboard-history database while bypassing the clipboard service. T1074 covers a centralized destination after acquisition, while T1560 covers compression or encrypted archiving. Merely replacing a wallet address, writing a malicious command, registering a listener, attempting one failed read, or possessing read capability does not confirm this Collection technique. Password managers, clipboard-history tools, DLP, remote support, virtual-machine shared clipboards, RDP, and accessibility tools are required benign comparators.
proposed_content:
  temporary_key: T1115_PARENT
  name:
    zh: 匿迹型剪贴板内容获取
    en: Stealth-Oriented Clipboard Content Acquisition
  summary:
    zh: 攻击者取得交互会话中的剪贴板内容，并把读取绑定到内容变化或正常粘贴路径，以减少独立轮询痕迹或使获取活动呈现为既有应用行为。
    en: An adversary acquires clipboard content from an interactive session and binds reads to content changes or normal paste paths, reducing independent polling traces or making acquisition appear as existing application behavior.
  definition_and_concept:
    paragraphs:
    - zh: 匿迹型剪贴板内容获取是攻击者从操作系统剪贴板、macOS pasteboard、X11 selection 或等效会话交换面读取已经被用户或应用复制的数据，并把至少一项实际内容保留在其控制的内存、日志、文件或传输缓冲中。其直接目的可能是取得凭据、令牌、账户信息、地址、命令、文档片段或其他短驻内容，以服务后续分析、认证滥用、欺诈或外传。完成点是内容副本已被攻击者取得；监听注册、剪贴板变化、格式枚举、读取能力或空结果只是前提与线索。
      en: Stealth-Oriented Clipboard Content Acquisition is the adversary's reading of data already copied by a user or application from an operating-system clipboard, macOS pasteboard, X11 selection, or equivalent session exchange surface, with at least one actual item retained in adversary-controlled memory, a log, a file, or a transfer buffer. Its direct purpose may be to obtain credentials, tokens, account information, addresses, commands, document fragments, or other short-lived content for later analysis, authentication abuse, fraud, or exfiltration. Completion occurs when the adversary acquires a content copy; listener registration, a clipboard change, format enumeration, read capability, or an empty result is only a prerequisite or lead.
    - zh: 剪贴板是按会话和平台实现的交换机制，而不是一种文件类型或单一 API。Windows 可通过变化通知、sequence number、viewer chain 或直接读取接口提供内容；macOS NSPasteboard 以所有权和 changeCount 表达变化；X11 由 selection owner 在请求时传输数据，Wayland 由 data offer 与文件描述符完成协商。平台、文本或图像格式、PowerShell、pbpaste、xclip 与具体恶意软件名称只说明实现路径，不能独立定义 Niji 子项。正式分类关注攻击者怎样控制读取触发与执行上下文，以及这些选择怎样改变痕迹和防守观察。
      en: A clipboard is a session- and platform-specific exchange mechanism rather than one file type or API. Windows can expose content through change notifications, a sequence number, a viewer chain, or direct read interfaces. macOS NSPasteboard represents changes through ownership and changeCount. X11 has a selection owner transfer data on request, while Wayland negotiates through data offers and file descriptors. Platform, text or image format, PowerShell, pbpaste, xclip, and a malware family name describe implementation paths and do not independently define Niji children. Formal classification asks how the adversary controls the read trigger and execution context and how those choices change traces and defensive observation.
  stealth_characteristics:
    paragraphs:
    - zh: 剪贴板内容通常短驻、按用户交互变化，并与大量合法复制粘贴共处。攻击者若只在变化通知到达后读取，空闲时段不再产生固定间隔的 OpenClipboard/GetClipboardData 序列；若在粘贴消费者进程内截获读取结果，则没有一个独立收集进程重复取得同一内容，调用和窗口上下文会首先指向正在粘贴的合法应用。这些设计分别削弱依赖轮询密度或独立读取主体的检测假设，并要求防守方将变化、调用者完整性、成功返回和后继结果连成一条链。
      en: Clipboard content is often short-lived, changes with user interaction, and coexists with high volumes of legitimate copy and paste activity. When an adversary reads only after a change notification, fixed-interval OpenClipboard and GetClipboardData sequences disappear during idle periods. When the adversary intercepts a result inside a paste-consuming process, no stand-alone collector repeatedly retrieves the same content and the call and window context initially points to the legitimate application performing the paste. These designs respectively weaken detections based on polling density or an independent reader and require defenders to join change, caller integrity, successful return, and downstream outcome into one chain.
    - zh: 这种获取仍留下可观察残余。事件耦合路径需要长期存在的窗口、listener 或 viewer 注册、消息循环及变化后的读取；消费者上下文截获需要进程写入、模块或私有可执行内存、函数 detour 或异常调用栈。NightshadeC2 还写隐藏日志并在命令 150 下上传，QBot 把带进程和窗口上下文的内容加密写入本地文件再由传输线程处理。若终端传感器不记录剪贴板 API、监听注册或内存完整性，只靠进程创建日志难以确认内容取得；若具备经验证的 API、模块、文件和网络关联，匿迹效果会明显下降。
      en: Acquisition still leaves observable residue. An event-coupled path needs a long-lived window, listener or viewer registration, a message loop, and a read after each change. Consumer-context interception needs process writes, a module or private executable memory, a function detour, or an abnormal call stack. NightshadeC2 also writes a hidden log and uploads it under command 150, while QBot encrypts content annotated with process and window context into a local file for a transmission thread. If endpoint sensors do not record clipboard APIs, listener registration, or memory integrity, process-creation logs alone struggle to prove acquisition. Stealth falls sharply where validated API, module, file, and network correlation exists.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入从当前剪贴板、pasteboard 或 selection 实际取得内容，并以事件触发或粘贴调用上下文改变读取痕迹的行为。只观察 Ctrl+C、Ctrl+V 或键盘输入但不取得剪贴板返回内容归 T1056 或行为线索；只发现剪贴板格式、sequence number 或所有者而没有成功内容结果不达到完成点。通过剪贴板服务读取历史项仍可属于本技术；绕过服务直接解析本地历史数据库、应用缓存或浏览器存储，则以 T1005 等来源技术判断。
      en: Include actual acquisition from the current clipboard, pasteboard, or selection when event triggering or paste-call context changes read traces. Observing Ctrl+C, Ctrl+V, or keyboard input without acquiring the returned clipboard content remains T1056 or a behavioral lead. Discovering only formats, a sequence number, or the owner without a successful content result does not reach completion. Reading historical items through the clipboard service can remain here; bypassing the service to parse a local history database, application cache, or browser store directly should be assessed under T1005 or the applicable source technique.
    - zh: T1119 可与本技术并列标记跨轮次自动收集，但不能用通用循环替代剪贴板内容取得证据；NJS-0135-001 还要求持久变化检查点约束后继收集轮次，而一次瞬时 clipboard change 通知触发当前内容读取并不满足该状态边界。T1185 只有在浏览器会话控制点读取页面、请求或响应时成立，浏览器把文本写入剪贴板或从剪贴板粘贴并不会改变 T1115 的直接对象。内容被取得后的隐藏日志、集中目录、压缩包和外传分别由 T1074、T1560 与外传技术补充。仅修改剪贴板以替换地址或植入命令属于另一目的；只有当原内容也被实际读取并保留或传送时，才可另记本 Collection 技术。密码管理器自动清理、剪贴板管理器、DLP 检查、RDP 或远程支持同步以及虚拟化 guest tools 会产生相同 API 与时序，必须用授权主体、版本、会话和结果去向区分。
      en: T1119 may be co-labeled for automated rounds, but a generic loop cannot replace proof of acquired clipboard content. NJS-0135-001 additionally requires a persistent change checkpoint that constrains later collection passes; one transient clipboard-change notification triggering a read of current content does not satisfy that state boundary. T1185 applies only when a browser-session control point reads pages, requests, or responses; a browser writing text to or pasting from the clipboard does not change T1115's direct object. Hidden logs, centralized directories, archives, and exfiltration after acquisition are separately covered by T1074, T1560, and exfiltration techniques. Clipboard modification that substitutes an address or plants a command serves another purpose. This Collection technique can be added only when the original content was also read and retained or transmitted. Password-manager clearing, clipboard managers, DLP inspection, RDP or remote-support synchronization, and virtualization guest tools can produce the same APIs and timing and require differentiation by authorized actor, version, session, and outcome destination.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已登录的办公终端上，信息窃取程序可创建不出现在任务栏和 Alt+Tab 的窗口，注册剪贴板变化通知，并在用户复制凭据、内部 URL、命令或文档片段时把新内容追加到隐藏日志，之后由独立 C2 命令取回。NightshadeC2 是这一场景的结论级实例。另一场景中，银行木马把注入模块放入用户实际粘贴内容的应用，hook GetClipboardData 与消息处理路径，在正常粘贴返回前复制内容并附加进程路径和窗口标题；QBot 的 Notepad 实验与加密日志证明了实际取得和后继处理。
        en: On a logged-in workstation, an information stealer can create a window absent from the taskbar and Alt+Tab, register for clipboard changes, append newly copied credentials, internal URLs, commands, or document fragments to a hidden log, and later retrieve the log through a separate C2 command. NightshadeC2 is a conclusion-level instance of this scenario. In another scenario, a banking trojan places an injected module inside an application where the user actually pastes content, hooks GetClipboardData and message handling, and copies the result with process path and window title before the normal paste returns. QBot's Notepad experiment and encrypted log establish actual acquisition and downstream handling.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少需要在目标用户的交互会话内执行代码或控制能够访问该会话剪贴板的进程，并能把成功读取的内容保留到其控制的缓冲或结果链。事件耦合需要消息窗口、viewer/listener 注册或平台等效通知以及持续驻留；消费者上下文截获还需要向目标进程加载代码、修改函数路径或控制插件，并承担进程完整性和注入痕迹。会话隔离、Wayland compositor 权限、应用沙箱和平台隐私控制可能限制读取。攻击者还必须接受内容可能在读取前被覆盖、清空或从未出现的风险。
          en: The adversary needs code execution in the target user's interactive session or control of a process able to access that session's clipboard, plus a means to retain a successful read in an adversary-controlled buffer or outcome chain. Event coupling requires a message window, viewer or listener registration, or a platform-equivalent notification and continued residence. Consumer-context interception additionally requires loading code into a target process, altering a function path, or controlling a plug-in and incurs process-integrity and injection traces. Session isolation, Wayland compositor permissions, application sandboxes, and platform privacy controls can limit reading. The adversary also accepts that content may be overwritten, cleared, or never appear before acquisition.
      defender_model:
        paragraphs:
        - zh: 防守方可能拥有进程与模块谱系、跨进程写入和内存完整性、经试点验证的剪贴板 API 调用、窗口或 listener 注册、文件写入、网络连接以及 DLP copy/paste 事件。Windows 文档定义变化通知和读取原语，但没有为本交接保证一个默认集中式逐次读取审计通道；macOS、X11 与 Wayland 的对象和转移语义也不相同。因此分析必须先验证传感器确能报告调用者、会话、API 结果和时间，再决定结论强度。若只有命令行进程日志，可发现 Get-Clipboard、pbpaste、xclip 等显式工具，却看不到编译进程内的每次读取或 hook 返回值。
          en: Defenders may have process and module lineage, cross-process writes and memory integrity, pilot-validated clipboard API calls, window or listener registration, file writes, network connections, and DLP copy or paste events. Windows documentation defines change-notification and read primitives but does not guarantee a default centrally exportable audit event for every read in this handoff. macOS, X11, and Wayland also use different objects and transfer semantics. An analytic must therefore first verify that its sensor reports caller, session, API result, and time before assigning conclusion strength. Command-line process logs can expose explicit utilities such as Get-Clipboard, pbpaste, or xclip but miss many in-process reads and hooked return values in compiled applications.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 只在剪贴板内容变化后形成读取与结果痕迹
      en: Produce read and result traces only after clipboard changes
    analysis:
      paragraphs:
      - zh: 攻击者注册变化通知并让消息到达后才读取内容，使空闲期不再出现固定间隔打开和查询剪贴板的调用。Windows 文档说明 listener 会在内容变化时收到 WM_CLIPBOARDUPDATE，Volatility 的分析说明高频轮询会反复打开剪贴板并可能阻塞合法应用，而事件通知避免这种连续访问。NightshadeC2 把该设计用于真实内容收集。痕迹因此集中到用户复制后的短窗并在其余时段稀释，使只看轮询密度或任意短时采样的防守方更难重建完整驻留链；listener 注册、隐藏窗口、变化后读取和日志仍可被长期关联，所以该机理不表示不可见。
        en: The adversary registers for change notifications and reads only after a message arrives, eliminating fixed-interval clipboard opens and queries during idle periods. Windows documentation states that a listener receives WM_CLIPBOARDUPDATE when content changes. Volatility's analysis explains that frequent polling repeatedly opens the clipboard and can block legitimate applications, whereas event notification avoids that continuous access. NightshadeC2 applies the design to actual content collection. Traces therefore concentrate in a short interval after user copies and dilute elsewhere, complicating reconstruction by defenders that look only for polling density or sample arbitrary short windows. Listener registration, a hidden window, the post-change read, and the log remain available for long-horizon correlation, so the mechanism does not imply invisibility.
    evidence_keys:
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_VOLATILITY
    - T1115_REF_NIGHTSHADE
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 借正常粘贴消费者的进程与调用路径呈现内容读取
      en: Present content reads through a normal paste consumer process and call path
    analysis:
      paragraphs:
      - zh: 攻击者把 hook 放进会正常调用 GetClipboardData 的目标进程，并在返回值到达应用前复制内容。QBot 的注入模块在 Notepad 粘贴实验中记录到内容、进程路径和窗口标题，表面调用主体与正常粘贴消费者一致，而独立收集进程的重复读取可缺席。恶意实体借用了合法应用的进程身份和用户触发时机，降低只按进程名称或独立 API 调用者区分的能力；跨进程写入、异常模块、函数 detour、调用栈和加密日志仍能暴露寄生关系，具备代码来源关联时伪装会失效。
        en: The adversary places a hook in a target process that normally calls GetClipboardData and copies the content before the return reaches the application. QBot's injected module records content, process path, and window title during a Notepad paste experiment. The apparent caller is the normal paste consumer, while repeated reads from an independent collector can be absent. The malicious entity borrows the legitimate application's process identity and user-triggered timing, reducing discrimination based only on process name or a stand-alone API caller. Cross-process writes, anomalous modules, function detours, call stacks, and the encrypted log still expose the parasitic relationship, and the disguise fails where code provenance is correlated.
    evidence_keys:
    - T1115_REF_QBOT
    - REF-000362
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 建议两个 Niji 原生子项，分类变量分别是“实际读取是否由剪贴板变化事件触发”和“内容副本是否在正常粘贴消费者的调用返回路径内产生”。变化事件耦合把空闲轮询痕迹换成 listener 注册与变化后读取，需要变化序列和结果关联；消费者上下文截获把独立读取主体换成受控进程内 hook，需要代码来源、函数路径和内容结果关联。两项都要求实际内容取得，且对防御数据与正常反例的处理不同，因此具有稳定兄弟边界。
        en: Recommend two Niji-native children using the variables of whether an actual read is triggered by a clipboard-change event and whether the content copy is produced inside a normal paste consumer's return path. Change-event coupling replaces idle polling traces with listener registration and post-change reads and requires correlation of the change sequence and outcome. Consumer-context interception replaces an independent reader with an in-process hook and requires correlation of code provenance, function path, and content outcome. Both require actual content acquisition and need distinct defensive data and benign-comparator handling, giving them stable sibling boundaries.
      - zh: 文本、图像、凭据或地址等内容类型，Windows、macOS、X11 或 Wayland，PowerShell、pbpaste、xclip 或某个恶意软件家族均不作为子项边界。按内容谓词只保留目标值、低频轮询、剪贴板历史读取以及复用同步或远程支持主体都经过检视；前两项缺少 Collection 结果与独立检出差的结论级证据，历史读取需先裁决是服务访问还是 T1005 文件读取，主体复用则没有合格现场证据，故本轮暂缓。
        en: Content type such as text, images, credentials, or addresses; Windows, macOS, X11, or Wayland; PowerShell, pbpaste, xclip; and a malware family do not define children. Content-predicate retention, low-rate polling, clipboard-history reads, and reuse of synchronization or remote-support actors were examined. The first two lack conclusion-level evidence jointly showing a Collection outcome and independent detection difference. History access first needs a boundary decision between service access and T1005 file reading, while trusted-actor reuse lacks a qualified incident case. They remain deferred in this batch.
    proposed_child_keys:
    - T1115_CHILD_CHANGE_EVENT
    - T1115_CHILD_CONSUMER_INTERPOSITION
  evidence_keys:
  - T1115_REF_ATTACK
  - T1115_REF_NIGHTSHADE
  - T1115_REF_QBOT
  - T1115_REF_MS_CLIPBOARD
  - T1115_REF_VOLATILITY
  - T1115_REF_CORTEX
  - T1115_REF_APPLE_PASTEBOARD
  - T1115_REF_X11
  - T1115_REF_WAYLAND
  - REF-000362
  defense_strategy_keys:
  - T1115_DET_EVENT_CAPTURE
  - T1115_DET_CONSUMER_INTERPOSITION
  mitigation_keys:
  - T1115_MIT_EXPOSURE
  - MIT-000102
  limitations:
    paragraphs:
    - zh: 父级实际取得和两个子项主要由两个 Windows 样本支撑。NightshadeC2 与 QBot 分别提供变化事件和消费者 hook 的完整内容结果链，但来源没有量化匿迹设计相对替代实现的告警率，也不能证明其他平台或所有终端传感器具有同样观察差。因此正式对象应把父行为高置信度与机理 medium 置信度分开，后续若只有能力描述、监听注册或注入，不得追加已完成采集结论。
      en: The parent acquisition outcome and two children are supported chiefly by two Windows samples. NightshadeC2 and QBot respectively provide complete content-outcome chains for change events and consumer hooks, but the sources do not measure alert rates against alternative implementations and do not establish the same observation difference on other platforms or every endpoint sensor. The formal object should separate high confidence in the parent behavior from medium confidence in the mechanisms. Later evidence limited to capability, listener registration, or injection cannot be labeled completed collection.
    - zh: 剪贴板遥测具有隐私与凭据暴露风险，且平台默认日志未被证明能统一记录每次读取。合法密码管理器、clipboard history、DLP、RDP、远程支持、VM guest tools、无障碍与自动化会复用相同接口。检测必须先验证字段、采用最小化或不可逆对象键，并以精确软件来源、owner、会话和结果目的地处理反例；否则只能提供调查线索。
      en: Clipboard telemetry carries privacy and credential-exposure risk, and default platform logs are not established to record every read uniformly. Legitimate password managers, clipboard history, DLP, RDP, remote support, VM guest tools, accessibility, and automation reuse the same interfaces. Detection must first validate fields, use minimized or irreversible object keys, and handle comparators through exact software provenance, owner, session, and outcome destination. Otherwise it can provide only an investigative lead.
proposed_subtechniques:
- temporary_key: T1115_CHILD_CHANGE_EVENT
  formalization_recommendation: supported_medium_confidence
  name:
    zh: 剪贴板变化事件耦合获取
    en: Clipboard-Change-Event-Coupled Acquisition
  summary:
    zh: 攻击者在剪贴板变化通知到达后才读取新内容，使空闲期缺少持续轮询，而采集结果集中于用户复制后的短时窗口。
    en: An adversary reads new content only after clipboard-change notifications, removing continuous polling during idle periods and concentrating results shortly after user copy actions.
  definition_and_concept:
    paragraphs:
    - zh: 剪贴板变化事件耦合获取以读取触发条件为稳定变量：恶意组件先登记为 clipboard format listener、viewer 或平台等效观察者，收到内容变化通知后才打开或请求剪贴板并把成功返回的数据保存到攻击者控制的结果链。NightshadeC2 创建隐藏工具窗口、注册 AddClipboardFormatListener，接收 WM_CLIPBOARDUPDATE 后收集变化内容并写入隐藏日志，随后可由 C2 命令 150 上传，因而同时证明触发变量和实际内容结果。
      en: Clipboard-Change-Event-Coupled Acquisition uses the read trigger as its stable variable. A malicious component first registers as a clipboard format listener, viewer, or platform-equivalent observer, then opens or requests the clipboard only after a content-change notification and saves a successful result into an adversary-controlled outcome chain. NightshadeC2 creates a hidden tool window, registers AddClipboardFormatListener, harvests changed content after WM_CLIPBOARDUPDATE, writes a hidden log, and can upload it through C2 command 150, establishing both the trigger variable and an actual content outcome.
    - zh: 子项不要求某一种窗口类、API 名称或日志路径；关键是变化事件因果控制读取，未变化时相同采集读取不发生。单纯比较 sequence number 的轮询若仍按固定频率运行，不属于事件耦合；监听注册后从未取得数据也未达到完成点。剪贴板管理器、DLP 与远程支持同样采用变化事件，恶意性需由软件来源、授权范围和结果去向证明。
      en: The child does not require a particular window class, API name, or log path. The defining fact is that a change event causally controls the read and the same acquisition read does not occur without a change. Polling a sequence number at a fixed cadence is not event coupling, and a listener that never acquires data does not reach completion. Clipboard managers, DLP, and remote support also use change events, so maliciousness requires software provenance, authorization scope, and outcome destination.
  stealth_characteristics:
    paragraphs:
    - zh: 剪贴板变化事件耦合获取让长期驻留与实际读取在时间上分离。组件可在没有用户复制动作时保持安静，只有变化后出现读取和日志追加；相较每数百毫秒打开剪贴板的循环，它减少空结果调用、锁竞争和固定节奏。防守方若只看短时 API 计数或沙箱中没有触发复制操作，可能只看到隐藏消息窗口而看不到内容结果。该设计仍留下 listener/viewer 注册、窗口或消息对象、变化到读取的稳定短窗，以及结果文件或网络动作。
      en: Clipboard-Change-Event-Coupled Acquisition separates long-term residence from actual reads in time. The component can remain quiet when the user performs no copy action, producing reads and log appends only after changes. Compared with a loop that opens the clipboard every few hundred milliseconds, it reduces empty-result calls, lock contention, and fixed cadence. A defender examining only short-window API counts, or a sandbox that never triggers a copy, may see only a hidden message window and no content outcome. The design still leaves listener or viewer registration, a window or message object, a repeatable change-to-read interval, and a result file or network action.
  scope_boundary_definition:
    paragraphs:
    - zh: 判定须同时包含攻击者控制的变化订阅、通知后的成功内容读取以及内容进入其日志、内存或传输链的证据。只有 AddClipboardFormatListener、SetClipboardViewer、changeCount 或 selection 通知不够；只有用户复制事件也不够。固定间隔读取属于父级或暂缓的节奏轴，函数 hook 在正常粘贴消费者返回路径内复制数据属于兄弟项。若组件把持久 sequence、版本或时间边界用于约束后继自动收集轮次，可同时评估 NJS-0135-001；仅以当前变化事件作为一次读取触发不属于其检查点分类。事件之后的隐藏日志、压缩或上传可以补充 T1074、T1560 或外传技术，但不是本子项身份。
      en: Classification requires an adversary-controlled change subscription, a successful content read after notification, and evidence that the content entered its log, memory, or transfer chain. AddClipboardFormatListener, SetClipboardViewer, changeCount, a selection notification, or a user copy event alone is insufficient. Fixed-interval reading remains parent behavior or the deferred cadence axis. Copying a result inside a normal paste consumer's return path belongs to the sibling child. A component that persists a sequence, version, or time boundary to constrain later automated collection passes may also be assessed under NJS-0135-001; using the current change event only as a one-read trigger does not enter its checkpoint taxonomy. A hidden log, compression, or upload after the event may add T1074, T1560, or an exfiltration technique but does not define this child.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 信息窃取程序驻留在用户工作站的交互桌面，等待日常复制动作带来短驻的凭据、地址、文档片段或命令。每次变化后，它读取新内容并追加到不显眼的本地结果，稍后由命令或定时传输取回。NightshadeC2 所见隐藏窗口、变化通知、隐藏日志与命令式上传构成完整实例；若沙箱或调查时段没有复制动作，组件可以存在而不产生一次采集结果。
        en: An information stealer resides on a user's interactive desktop and waits for ordinary copy actions to expose short-lived credentials, addresses, document fragments, or commands. After each change, it reads the new content and appends it to an inconspicuous local result for later command-driven or scheduled retrieval. NightshadeC2's hidden window, change notification, hidden log, and command-driven upload form a complete instance. If no copy action occurs in a sandbox or investigation window, the component can exist without producing one acquisition result.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能在同一剪贴板会话注册长期观察对象、保持消息循环或等效事件订阅，并在通知后及时读取目标格式。其收益依赖用户产生感兴趣内容，且受到内容快速覆盖、应用清理、会话隔离及 compositor 权限限制。隐藏窗口可减少界面可见性，却不会自动隐藏进程、线程、窗口对象或 listener 注册；将内容持久化或上传还会增加文件与网络痕迹。
          en: The adversary must register a long-lived observer in the same clipboard session, maintain a message loop or equivalent subscription, and promptly read a target format after notification. Success depends on the user producing content of interest and is constrained by rapid overwrites, application clearing, session isolation, and compositor permissions. A hidden window can reduce UI visibility but does not automatically hide the process, thread, window object, or listener registration. Persisting or uploading content adds file and network traces.
      defender_model:
        paragraphs:
        - zh: 防守方需要经验证的 listener/viewer 注册或窗口对象遥测、剪贴板变化序列、成功读取结果以及文件或网络去向，并按主机、用户、登录会话、进程启动键和 sequence/change 标识关联。Volatility 证明 viewer 与剪贴板状态可以在内存中形成取证痕迹，但这不是持续实时审计。生产环境若没有剪贴板 API 传感器，应把隐藏窗口和变化后文件写入作为调查线索，不宣称已看到内容。合法剪贴板历史、密码管理器清理、VM guest tools、RDP、DLP 与远程支持必须纳入批准基线。
          en: Defenders need validated listener or viewer registration or window-object telemetry, a clipboard-change sequence, a successful read result, and a file or network destination joined by host, user, logon session, process-start key, and sequence or change identifier. Volatility establishes that viewer and clipboard state can leave memory-forensic artifacts, but this is not continuous real-time auditing. Where production lacks a clipboard API sensor, hidden windows and post-change file writes should remain investigative leads rather than claims that content was observed. Legitimate clipboard history, password-manager clearing, VM guest tools, RDP, DLP, and remote support must be included in the approved baseline.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 将剪贴板读取集中在变化通知后的短时窗口
      en: Concentrate clipboard reads in short windows after change notifications
    analysis:
      paragraphs:
      - zh: 恶意组件持续保留事件订阅，却只在用户改变剪贴板时执行内容读取。与固定轮询相比，空闲期不再出现重复 OpenClipboard/GetClipboardData 或同类调用，痕迹被分散到不规则的用户事件之后，短时计数与无交互沙箱更难重建整个驻留—触发—获取链。NightshadeC2 证明实际内容由这一通知路径收集；Windows 与 Volatility 资料说明通知和轮询的调用差异。listener、消息窗口、变化后读取和隐藏日志仍可通过长窗口关联，所以置信度为 medium 而非宣称全面规避。
        en: The malicious component keeps an event subscription resident but reads content only when the user changes the clipboard. Compared with fixed polling, idle periods no longer contain repeated OpenClipboard and GetClipboardData or equivalent calls, and traces disperse after irregular user events. Short-window counts and noninteractive sandboxes therefore struggle to reconstruct the full resident-to-trigger-to-acquisition chain. NightshadeC2 establishes actual collection through this notification path, while Windows and Volatility material establishes the call-pattern difference between notification and polling. The listener, message window, post-change read, and hidden log remain correlatable over a long window, supporting medium confidence rather than a claim of universal evasion.
    evidence_keys:
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_VOLATILITY
    - T1115_REF_NIGHTSHADE
    confidence: medium
  evidence_keys:
  - T1115_REF_NIGHTSHADE
  - T1115_REF_MS_CLIPBOARD
  - T1115_REF_VOLATILITY
  - T1115_REF_CORTEX
  defense_strategy_keys:
  - T1115_DET_EVENT_CAPTURE
  mitigation_keys:
  - T1115_MIT_EXPOSURE
  limitations:
    paragraphs:
    - zh: NightshadeC2 提供一个现场关联的 Windows 样本和完整结果链，却没有公开比较事件监听与轮询实现的告警率；时空释痕结论来自已证调用结构与防守模型。不同 Windows 版本、终端产品和内存取证工具对 listener、窗口与 API 的可见性不同。正常剪贴板管理器与安全产品会产生相同通知和读取，缺少软件来源、业务 owner 与内容去向时，本子项只能作为待调查行为，不能直接判恶。
      en: NightshadeC2 provides one incident-linked Windows sample and a complete outcome chain but publishes no alert-rate comparison between event-listener and polling implementations. The spatiotemporal-trace conclusion follows from the established call structure and defender model. Listener, window, and API visibility differs by Windows version, endpoint product, and memory-forensic tooling. Legitimate clipboard managers and security products generate the same notifications and reads. Without software provenance, business owner, and content destination, this child is investigative behavior rather than a malicious verdict.
- temporary_key: T1115_CHILD_CONSUMER_INTERPOSITION
  formalization_recommendation: supported_medium_confidence
  name:
    zh: 粘贴消费者上下文截获
    en: Paste-Consumer-Context Interception
  summary:
    zh: 攻击者在正常粘贴应用的进程内截获剪贴板读取结果，使内容副本沿既有调用返回路径产生并首先归因于合法消费者。
    en: An adversary intercepts clipboard results inside a normal paste-consuming process, creating the content copy on an existing return path and initially attributing it to the legitimate consumer.
  definition_and_concept:
    paragraphs:
    - zh: 粘贴消费者上下文截获以内容副本的执行位置为稳定变量：攻击者把代码注入或加载到会正常读取剪贴板的应用，在 GetClipboardData、消息转换或平台等效粘贴路径上设置 hook，并在原调用者取得返回值时把同一内容复制到恶意记录链。Fortinet 的 QBot 实验显示注入模块早于 Notepad 接收粘贴内容，记录实际文本、进程路径和窗口标题，再 RC4 加密写入本地文件并由核心模块的传输线程处理。
      en: Paste-Consumer-Context Interception uses the execution location of the content copy as its stable variable. The adversary injects or loads code into an application that normally reads the clipboard, hooks GetClipboardData, message translation, or a platform-equivalent paste path, and copies the same content into a malicious record chain as the original caller receives the return value. Fortinet's QBot experiment shows an injected module capturing the text before Notepad receives the paste, recording the actual text, process path, and window title, then RC4-encrypting it into a local file handled by the core module's transmission thread.
    - zh: 子项身份不是“使用进程注入”本身，也不是某个浏览器、邮件客户端或编辑器。必须证明受控代码位于正常剪贴板消费者内、对实际读取返回路径实施介入，并产生攻击者可用的内容副本。进程注入可另记 T1055，浏览器页面内容介入仍归 T1185；若只看到函数 detour 而没有剪贴板结果，则不达到本 Collection 子项完成点。
      en: The child is not process injection by itself and is not a browser, mail client, or editor. It requires proof that controlled code resided inside a normal clipboard consumer, interposed on an actual read return path, and produced an adversary-usable content copy. Process injection may be separately labeled T1055, while browser-page content interposition remains T1185. A function detour without a clipboard result does not reach this Collection child's completion point.
  stealth_characteristics:
    paragraphs:
    - zh: 粘贴消费者上下文截获让恶意读取与用户本来会触发的粘贴调用共享进程、线程时机和窗口上下文。仅按 GetClipboardData 调用者名称、签名或“是否为前台应用”判断时，活动看起来像编辑器、浏览器或其他合法应用自己的读取；独立剪贴板监视进程、listener 注册和固定轮询可以缺席。防守方必须检查调用栈、函数入口、模块或内存来源，并把返回内容的副本与后继日志相连。
      en: Paste-Consumer-Context Interception makes the malicious read share the process, thread timing, and window context of a paste call the user would have triggered anyway. Detection based only on the GetClipboardData caller name, signature, or foreground status sees what appears to be the editor, browser, or another legitimate application's own read. A stand-alone clipboard monitor, listener registration, and fixed polling can be absent. Defenders must inspect the call stack, function entry, module or memory provenance, and connect the copied return content to a downstream log.
    - zh: 寄生仍改变代码完整性和结果链。QBot 需要把注入模块放入多个目标进程并 hook GetClipboardData 与 TranslateMessage；采集内容带有被寄生进程路径和窗口标题，随后进入加密文件与传输线程。跨进程访问、内存写入、异常模块、inline/IAT detour、非预期返回地址或同一内容指纹的第二次写入均可揭示介入。安全软件、DLP、无障碍、输入法、调试器和兼容性 shim 也可能合法插桩，不能把任何 hook 直接判恶。
      en: Parasitism still changes code integrity and the outcome chain. QBot places an injected module into multiple target processes and hooks GetClipboardData and TranslateMessage. Captured content carries the parasitized process path and window title before entering an encrypted file and transmission thread. Cross-process access, memory writes, anomalous modules, inline or IAT detours, unexpected return addresses, or a second write with the same content fingerprint can reveal interposition. Security software, DLP, accessibility, input methods, debuggers, and compatibility shims may also instrument applications legitimately, so a hook alone is not a malicious verdict.
  scope_boundary_definition:
    paragraphs:
    - zh: 判定需要三段闭合：恶意或未批准代码进入正常剪贴板消费者并改变读取路径；用户或应用发生一次成功粘贴读取；返回内容被复制到攻击者控制的内存、日志或传输结果。仅有进程注入属于 T1055 前提，只有键盘或消息捕获属于 T1056，只有浏览器内页面或请求读取属于 T1185。若攻击者进程直接调用 GetClipboardData 而没有寄生正常消费者，则仍是父级但不是本子项。
      en: >-
        Classification requires a closed three-part chain: malicious or unapproved code enters a normal clipboard consumer and changes its read path; a user or application performs a successful paste read; and the returned content is copied into adversary-controlled memory, a log, or a transfer result. Process injection alone is a T1055 prerequisite, keyboard or message capture alone remains T1056, and in-browser page or request reading remains T1185. A stand-alone adversary process calling GetClipboardData directly remains parent behavior rather than this child.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 银行木马或信息窃取程序把模块注入用户经常粘贴账号、密码或业务文本的应用，并等待真实粘贴动作触发已有剪贴板读取。介入代码复制返回内容、附加进程与窗口上下文，再把记录交给核心模块。QBot 在 Notepad 中复制和粘贴“账户”和“密码”文本的实验直接显示内容在应用前被 hook 捕获，并进入后继加密文件与传输链，构成本子项的结论级实例。
        en: A banking trojan or information stealer injects a module into applications where the user commonly pastes account values, passwords, or business text and waits for a real paste action to trigger the existing clipboard read. Interposition code copies the return value, annotates it with process and window context, and passes the record to a core module. QBot's experiment copying and pasting account and password text into Notepad directly shows the hook capturing content before the application and placing it into an encrypted file and transfer chain, providing a conclusion-level instance of this child.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要对一个或多个剪贴板消费者拥有足够的写入、加载、插件或运行时控制权限，理解目标架构与函数路径，并让 hook 不破坏正常粘贴。它可以选择高价值应用或广泛注入，却承担模块不兼容、函数完整性检查、跨进程遥测和进程崩溃风险。用户不执行粘贴时不会产生内容结果；加密本地记录或交给核心模块还会留下跨进程、文件或 IPC 边。
          en: The adversary needs sufficient write, load, plug-in, or runtime control over one or more clipboard consumers, knowledge of target architecture and function paths, and a hook that preserves normal paste behavior. It can select high-value applications or inject broadly but incurs module incompatibility, function-integrity checks, cross-process telemetry, and crash risk. No content outcome occurs if the user never pastes. Encrypting a local record or passing it to a core module adds cross-process, file, or IPC edges.
      defender_model:
        paragraphs:
        - zh: 防守方需要不可变进程启动键、source-target 注入或模块加载谱系、目标进程内函数入口与调用栈完整性、成功剪贴板返回和后继写入。现有 DET-000100/NJA-000082 可证明跨进程写入与调度，却不单独证明剪贴板内容结果；本子项分析必须额外连接 GetClipboardData 或等效调用的返回状态与日志、IPC 或网络结果。没有内存或 call-stack 传感器时，可疑应用内部读取只能保持未解析。批准的 EDR、DLP、无障碍和调试工具例外必须绑定精确包、版本、owner、目标进程和用途。
          en: Defenders need an immutable process-start key, source-to-target injection or module-load lineage, function-entry and call-stack integrity inside the target, a successful clipboard return, and a downstream write. Existing DET-000100 and NJA-000082 can establish cross-process write and dispatch but do not by themselves prove a clipboard-content result. This child's analytic must additionally join GetClipboardData or an equivalent return with a log, IPC, or network outcome. Without memory or call-stack sensors, suspicious in-application reads remain unresolved. Exceptions for approved EDR, DLP, accessibility, and debugging tools must bind exact package, version, owner, target process, and purpose.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 让恶意内容副本继承正常粘贴应用的进程与交互特征
      en: Make the malicious content copy inherit a normal paste application's process and interaction features
    analysis:
      paragraphs:
      - zh: 攻击者不从独立监视程序发起重复读取，而在会正常读取剪贴板的应用内 hook 返回路径；内容副本因而与合法进程名、前台窗口和用户粘贴时机同时出现。QBot 的记录明确保存 Notepad 路径、窗口标题和实际内容，证明恶意复制寄生在正常消费者特征上。仅按签名、进程名或前台状态分类会降低区分力；跨进程来源、函数 detour、异常模块/私有内存和第二结果链仍可拆穿寄生，所以机理置信度为 medium。
        en: The adversary avoids repeated reads from a stand-alone monitor and instead hooks the return path inside an application that normally reads the clipboard. The malicious content copy therefore appears with a legitimate process name, foreground window, and user paste timing. QBot's record explicitly preserves the Notepad path, window title, and actual content, establishing parasitism on normal consumer features. Classification based only on signature, process name, or foreground status loses discrimination. Cross-process provenance, a function detour, an anomalous module or private memory, and a second outcome chain can still expose the parasite, supporting medium confidence.
    evidence_keys:
    - T1115_REF_QBOT
    - REF-000362
    confidence: medium
