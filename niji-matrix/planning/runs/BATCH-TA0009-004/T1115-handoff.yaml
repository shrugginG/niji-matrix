    source_type: standard
    confidence: high
    locator: Data sharing between clients
    supports:
      zh: Wayland 通过 wl_data_source、wl_data_offer、MIME 协商和文件描述符在客户端间转移复制粘贴数据，说明其观察键和权限面不同于 Windows；不自动提供进程级恶意判定。
      en: Wayland transfers copy-paste data through wl_data_source, wl_data_offer, MIME negotiation, and file descriptors, showing observation keys and permission surfaces different from Windows. It does not automatically supply process-level malicious attribution.
  claims:
  - temporary_key: T1115_CLM_PARENT_COMPLETION
    statement:
      zh: T1115 的 Collection 完成点是至少一项剪贴板内容进入攻击者控制的内存、日志、文件或传输链；监听、格式枚举、变化通知、修改或读取能力本身不足。
      en: T1115 reaches a Collection outcome when at least one clipboard item enters adversary-controlled memory, a log, a file, or a transfer chain; listening, format enumeration, change notification, modification, or read capability alone is insufficient.
    evidence_keys:
    - T1115_REF_ATTACK
    - T1115_REF_NIGHTSHADE
    - T1115_REF_QBOT
    confidence: high
  - temporary_key: T1115_CLM_EVENT_CHILD
    statement:
      zh: NightshadeC2 以隐藏窗口和 AddClipboardFormatListener 将实际内容收集绑定到 WM_CLIPBOARDUPDATE，并把结果写入隐藏日志后按命令上传；相较固定轮询，这一变量在空闲期消除重复打开与读取，同时保留 listener 和变化后结果痕迹。
      en: NightshadeC2 binds actual content collection to WM_CLIPBOARDUPDATE through a hidden window and AddClipboardFormatListener, writes results to a hidden log, and uploads them by command. Relative to fixed polling, the variable removes repeated opens and reads during idle periods while retaining listener and post-change outcome traces.
    evidence_keys:
    - T1115_REF_NIGHTSHADE
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_VOLATILITY
    confidence: medium
  - temporary_key: T1115_CLM_CONSUMER_CHILD
    statement:
      zh: QBot 在正常粘贴消费者进程内 hook GetClipboardData 与消息路径，实际复制返回内容并附加进程和窗口上下文，再进入加密文件与传输线程，证明内容副本可寄生在合法消费者身份下产生。
      en: QBot hooks GetClipboardData and message paths inside normal paste-consuming processes, copies actual returned content with process and window context, and places it into an encrypted file and transmission thread, establishing that a content copy can be produced under a legitimate consumer identity.
    evidence_keys:
    - T1115_REF_QBOT
    - REF-000362
    confidence: high
  - temporary_key: T1115_CLM_PLATFORM_LIMIT
    statement:
      zh: Windows、macOS、X11 与 Wayland 提供不同的变化与数据转移对象，平台文档支持访问前提而不自动证明默认集中审计能够记录每次进程内读取，因此防守实现必须验证本地传感器字段。
      en: Windows, macOS, X11, and Wayland expose different change and data-transfer objects. Platform documentation supports access prerequisites but does not automatically establish default centralized auditing of every in-process read, so defenders must validate local sensor fields.
    evidence_keys:
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_APPLE_PASTEBOARD
    - T1115_REF_X11
    - T1115_REF_WAYLAND
    confidence: high
  - temporary_key: T1115_CLM_EXPOSURE_CONTROL
    statement:
      zh: autofill、关闭不必要的自动复制、短清理、Endpoint DLP copy 控制、history/cloud 排除和远程会话重定向治理能减少敏感剪贴板暴露或传播，但均不能单独阻止清理前的本地实时读取。
      en: Autofill, disabling unnecessary automatic copying, short clearing, Endpoint DLP copy controls, history or cloud exclusion, and remote-session redirection governance reduce sensitive clipboard exposure or propagation, but none alone prevents a real-time local read before clearing.
    evidence_keys:
    - T1115_REF_BITWARDEN
    - T1115_REF_DLP
    - T1115_REF_MS_FORMATS
    - T1115_REF_RDP
    confidence: high
  cases:
  - temporary_key: T1115_CASE_NIGHTSHADE
    name:
      zh: NightshadeC2 变化事件驱动的剪贴板收集
      en: NightshadeC2 Change-Event-Driven Clipboard Collection
    event:
      zh: eSentire 在 2025 年事件关联样本中看到 NightshadeC2 建立隐藏工具窗口并注册 AddClipboardFormatListener，收到 WM_CLIPBOARDUPDATE 后收集剪贴板内容并写入隐藏日志，C2 命令 150 可上传捕获的键盘和剪贴板记录。
      en: In an incident-linked 2025 sample, eSentire observed NightshadeC2 create a hidden tool window, register AddClipboardFormatListener, collect clipboard content after WM_CLIPBOARDUPDATE, write a hidden log, and upload captured keyboard and clipboard records through C2 command 150.
    evidence_keys:
    - T1115_REF_NIGHTSHADE
  - temporary_key: T1115_CASE_QBOT
    name:
      zh: QBot 粘贴消费者进程内剪贴板截获
      en: QBot Clipboard Interception Inside a Paste Consumer
    event:
      zh: Fortinet 的 QBot 动态实验在 Notepad 粘贴时观察到注入模块通过 GetClipboardData 与 TranslateMessage hook 早于应用取得实际内容，记录进程路径、窗口标题和文本，随后 RC4 加密写入 mavrihvu32.dll 并由核心模块传输线程处理。
      en: Fortinet's dynamic QBot experiment observed an injected module use GetClipboardData and TranslateMessage hooks to acquire actual content before Notepad during paste, recording process path, window title, and text before RC4-encrypting it into mavrihvu32.dll for handling by the core module's transmission thread.
    evidence_keys:
    - T1115_REF_QBOT
  detection_strategies:
  - T1115_DET_EVENT_CAPTURE
  - T1115_DET_CONSUMER_INTERPOSITION
  detection_analytics:
  - T1115_NJA_EVENT_READ_OUTPUT
  - T1115_NJA_CONSUMER_HOOK_OUTCOME
  mitigations:
  - T1115_MIT_EXPOSURE
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: change_event_coupled_acquisition
      resolution: proposed-formal
      variable: clipboard change notification causally triggers actual content retrieval
      trace_change: idle fixed polling disappears while listener registration and short post-change reads remain
      defender_difference: correlate listener or window registration, change identifier, successful read, and content outcome over long residence
      evidence_keys:
      - T1115_REF_NIGHTSHADE
      - T1115_REF_MS_CLIPBOARD
      - T1115_REF_VOLATILITY
    - axis: paste_consumer_context_interception
      resolution: proposed-formal
      variable: content is copied from the clipboard return path inside a normal paste consumer
      trace_change: stand-alone reader and listener may be absent while injection, detour, altered call stack, and a second outcome appear under the consumer process
      defender_difference: require code-provenance and function-path integrity joined to successful paste and second content outcome
      evidence_keys:
      - T1115_REF_QBOT
      - REF-000362
    - axis: content_predicate_or_format_selection
      resolution: evidence-deferred
      variable: only clipboard values matching attacker-selected patterns or formats are retained
      trace_change: fewer stored or transmitted records and concentration on high-value formats would be expected
      defender_difference: content-aware or destination correlation would differ, but reviewed crypto-clipper reports center on replacement rather than a proven Collection result and retained original content
      evidence_keys: []
    - axis: target_application_or_window_gate_without_interposition
      resolution: evidence-deferred
      variable: a selected foreground application controls whether a direct clipboard reader acquires content
      trace_change: reads would be absent outside selected application contexts
      defender_difference: would require window-to-read correlation, but reviewed sources either hook the consumer itself or do not prove acquired content after an external app gate
      evidence_keys:
      - T1115_REF_QBOT
    - axis: low_rate_or_adaptive_polling
      resolution: evidence-deferred
      variable: polling interval or backoff controls clipboard reads
      trace_change: calls would disperse across time but risk missing short-lived content
      defender_difference: longer correlation would be required, yet no reviewed collection case ties a chosen cadence to stealth intent, threshold change, and actual captured content
      evidence_keys:
      - T1115_REF_VOLATILITY
    - axis: trusted_clipboard_manager_sync_or_remote_support_identity
      resolution: evidence-deferred
      variable: malicious collection executes through an approved manager, synchronization broker, RDP helper, or remote-support clipboard principal
      trace_change: listener and transfer events would inherit an approved actor and destination pattern
      defender_difference: code, session, or command provenance would become essential; platform and legitimate-tool sources prove capability and benign behavior, not an observed malicious content-acquisition chain under that identity
      evidence_keys:
      - T1115_REF_VOLATILITY
      - T1115_REF_RDP
    - axis: clipboard_history_or_snapshot_view
      resolution: adjacent-technique
      variable: historical items are obtained from a persisted database, cloud history, or clipboard-service API
      trace_change: service-mediated reads and direct file or database reads expose different telemetry
      defender_difference: service API access can remain parent behavior, while direct parsing of a local database belongs to T1005 and cloud-backed objects require source-specific review
      evidence_keys:
      - T1115_REF_MS_FORMATS
    - axis: platform_content_type_tool_or_malware_family
      resolution: not-stealth-distinct
      variable: operating system, API or utility, text versus image, credential versus address, or named family
      trace_change: none inherent without a separate attacker-controlled observation variable
      defender_difference: affects parser and platform implementation rather than defining a stable Niji child
      evidence_keys:
      - T1115_REF_ATTACK
      - T1115_REF_MS_CLIPBOARD
      - T1115_REF_APPLE_PASTEBOARD
      - T1115_REF_X11
      - T1115_REF_WAYLAND
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定版没有 ATT&CK 子项，只决定不触发高广度复核，并不免除开放搜索。本研究检视八个轴。NightshadeC2 同时证明变化通知、实际内容、隐藏日志和上传，QBot 同时证明消费者内 hook、实际返回内容、上下文记录和后继传输，因此建议两个子项。内容谓词、外部应用门控、低频轮询和可信同步主体缺少结论级 Collection 与独立观察差证据；历史视图需按服务或存储直接对象拆边界；平台、格式和工具不是子项。
      en: Zero fixed-baseline ATT&CK children avoids a high-breadth trigger but does not waive open taxonomy search. This research examined eight axes. NightshadeC2 jointly proves change notification, actual content, a hidden log, and upload. QBot jointly proves an in-consumer hook, actual returned content, contextual record, and downstream transfer. These support two children. Content predicates, external app gating, low-rate polling, and trusted synchronization actors lack conclusion-level evidence for both Collection and an independent observation difference. History views require a service-versus-storage direct-object boundary, while platform, format, and tool do not define children.
  evidence_coverage:
    parent_behavior_keys:
    - T1115_REF_ATTACK
    - T1115_REF_NIGHTSHADE
    - T1115_REF_QBOT
    boundary_keys:
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_APPLE_PASTEBOARD
    - T1115_REF_X11
    - T1115_REF_WAYLAND
    - T1115_REF_NIGHTSHADE
    - T1115_REF_QBOT
    - REF-000362
    mechanism_support:
    - mechanism_ref: NM-ST
      evidence_keys:
      - T1115_REF_MS_CLIPBOARD
      - T1115_REF_VOLATILITY
      - T1115_REF_NIGHTSHADE
      conclusion_level: notification-controlled collection and the polling-versus-listener trace difference are direct; lower alertability is a medium-confidence defender-model inference without measured alert rates
    - mechanism_ref: NM-FD
      evidence_keys:
      - T1115_REF_QBOT
      - REF-000362
      conclusion_level: injected in-consumer hooks, actual content, legitimate process and window context, encrypted result, and transfer are direct; classification difficulty is a medium-confidence defender-model inference
    child_existence_support:
    - child_key: T1115_CHILD_CHANGE_EVENT
      evidence_keys:
      - T1115_REF_NIGHTSHADE
      - T1115_REF_MS_CLIPBOARD
      - T1115_REF_VOLATILITY
      conclusion_level: direct event subscription, changed-content harvesting, hidden log, and upload, with platform-supported trigger semantics
    - child_key: T1115_CHILD_CONSUMER_INTERPOSITION
      evidence_keys:
      - T1115_REF_QBOT
      - REF-000362
      conclusion_level: direct injected hook, actual paste content captured before the consumer, process and window context, encrypted file, and transmission thread
    unsupported_or_deferred:
    - key: T1115_AXIS_CONTENT_PREDICATE
      reason:
        zh: 已审查的 crypto-clipper 资料证明模式匹配与原内容读取常用于替换，但没有同时证明原内容作为 Collection 结果被保留或外传，以及选择性对检测产生独立差异；不能把修改型样本提升为收集子项。
        en: Reviewed crypto-clipper material establishes pattern matching and original-content reads used for replacement but does not jointly prove retention or exfiltration as a Collection result and an independent detection difference. Modification-centered samples cannot be promoted into a collection child.
    - key: T1115_AXIS_LOW_RATE_POLL
      reason:
        zh: Volatility 资料提供高频轮询与事件监听的技术对照，却没有低频收集样本、实际取得结果和阈值变化；仅设置 Sleep 不能证明 NM-ST。
        en: Volatility supplies a technical comparison between frequent polling and event notification but no low-rate collection sample, acquired outcome, and threshold change. A Sleep interval alone cannot establish NM-ST.
    - key: T1115_AXIS_TRUSTED_SYNC
      reason:
        zh: RDP、VM 和远程支持确实合法同步剪贴板，但当前没有来源证明攻击者在受批准同步主体内取得并保存受害者内容；能力与正常反例不能充当恶意案例。
        en: RDP, VM, and remote-support tooling legitimately synchronize clipboards, but no reviewed source shows an adversary acquiring and retaining victim content inside an approved synchronization actor. Capability and benign comparators cannot substitute for a malicious case.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 草案分别覆盖实际内容完成点、短驻与会话属性、变化触发和消费者介入的痕迹差、T1056/T1119/T1185/T1005/T1074/T1560 边界、Windows/macOS/X11/Wayland 前提、密码管理器/DLP/远程支持等反例、攻击者与防守方遥测模型、结论级案例、可实施 DET/NJA/MIT 和产品特定审计限制。主 Agent 仍须与 T1005 研究结果收敛 clipboard history 直接文件读取边界，并对 MIT-000102 新增 Application 作共享库决议。
      en: The draft covers the actual-content completion point, short-lived and session properties, trace differences for change triggering and consumer interposition, boundaries with T1056, T1119, T1185, T1005, T1074, and T1560, Windows, macOS, X11, and Wayland prerequisites, password-manager, DLP, and remote-support comparators, attacker and defender telemetry models, conclusion-level cases, implementable DET, NJA, and MIT candidates, and product-specific audit limits. The primary agent still needs to converge the direct-file clipboard-history boundary with T1005 research and resolve a new target application under MIT-000102.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed ATT&CK workbook-derived inventory cross-check
    - exact URL and semantic library lookup
    - YAML syntax verification
  limitations:
    paragraphs:
    - zh: 结论级恶意样本主要来自 Windows。NightshadeC2 证明变化事件驱动的实际内容、日志和上传，QBot 证明消费者进程内 hook、内容和传输，但两份来源都没有量化检测率、阈值或与替代实现的告警对照。NM-ST 与 NM-FD 的防守影响因此采用 medium 置信度，不能把“使用原生 API”“隐藏窗口”或“运行在合法进程”单独描述成匿迹成功。其他家族只证明一般能力时不应扩展到子项案例。
      en: Conclusion-level malicious samples are primarily Windows-based. NightshadeC2 establishes change-event-driven content, logging, and upload, while QBot establishes an in-consumer hook, content, and transfer. Neither source measures detection rates, thresholds, or alert differences against an alternative implementation. Defensive effects for NM-ST and NM-FD therefore carry medium confidence. Use of a native API, a hidden window, or execution in a legitimate process cannot alone be described as successful stealth. Other families that prove only general capability should not be expanded into child cases.
    - zh: 平台文档说明 Windows listener/viewer、macOS changeCount、X11 selection 与 Wayland data offer 的数据前提，却不保证统一、默认且可集中导出的逐次读取审计。Cortex XDR 只证明某一产品可以观察异常 GetClipboardData 调用。正式分析必须在部署环境验证 API、窗口、调用栈、返回状态和对象键；否则输出降级为 listener、hook 或后继文件线索。明文剪贴板遥测具有显著隐私与凭据风险，应优先使用端点生成的短期不可逆 token、sequence、大小和目的地元数据。
      en: Platform documentation establishes Windows listener and viewer, macOS changeCount, X11 selection, and Wayland data-offer prerequisites but does not guarantee a uniform, default, centrally exportable event for each read. Cortex XDR only establishes that one product can observe unusual GetClipboardData calls. Formal analytics must validate API, window, call-stack, return-status, and object-key fields in the deployment environment or downgrade output to listener, hook, or downstream-file leads. Plaintext clipboard telemetry creates substantial privacy and credential risk and should be replaced where possible by endpoint-generated short-lived irreversible tokens, sequence, size, and destination metadata.
    - zh: autofill、DLP、短清理、history/cloud 排除与 RDP 重定向限制降低暴露或传播，却不能阻止清理前同会话的实时读取，也可能影响可用性和无障碍。合法剪贴板历史、密码管理器、DLP、远程支持、虚拟化和自动化与恶意行为共享接口，必须按精确版本、owner、会话、目的地和变更窗口调优。消费者介入的预防依赖 MIT-000102 等进程完整性控制；没有正式扩展 Application 前，不应声称新 MIT 单独覆盖 hook。
      en: Autofill, DLP, short clearing, history or cloud exclusion, and RDP-redirection restrictions reduce exposure or propagation but do not stop real-time reads in the same session before clearing and may affect usability and accessibility. Legitimate clipboard history, password managers, DLP, remote support, virtualization, and automation share interfaces with malicious behavior and require tuning by exact version, owner, session, destination, and change window. Prevention of consumer interposition depends on process-integrity controls such as MIT-000102. Until a formal target application is added, the new MIT must not claim to cover hooks by itself.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason:
      zh: NightshadeC2 的隐藏日志和 QBot 的 RC4 文件改变的是取得后内容的可检查性，可分别由 T1074/T1560 或外传链分析；它们不反向成为剪贴板内容取得本身的数据遮蔽机理。
      en: NightshadeC2's hidden log and QBot's RC4 file change post-acquisition inspectability and can be assessed under T1074, T1560, or an exfiltration chain. They do not retroactively become the data-obscuration mechanism of clipboard acquisition itself.
  - mechanism_ref: NM-BT
    reason:
      zh: 默认平台审计可能看不到每次进程内读取，但这是防守覆盖限制，当前两个正式变量已有更具体的 NM-ST 与 NM-FD 因果链；不以“缺日志”通用替代候选特有机理。若未来证明某个平台接口系统性绕过部署传感器，可另行复核。
      en: Default platform auditing may miss individual in-process reads, but that is a defensive coverage limitation. The two formal variables have more specific NM-ST and NM-FD causal chains, so missing logs should not substitute for a candidate-specific mechanism. A future platform path proven to systematically bypass deployed sensors can be reviewed separately.
  open_questions:
  - zh: 主 Agent 应与 T1005 研究者统一裁决 clipboard history：通过剪贴板服务或受管 history API 取得内容可保留在 T1115，直接解析本地数据库、缓存或同步文件则归 T1005；正式文本与防御对象不得重复覆盖同一读取事件。
    en: The primary agent should converge clipboard-history ownership with the T1005 researcher. Content obtained through the clipboard service or a managed history API can remain T1115, while direct parsing of a local database, cache, or synchronization file belongs to T1005. Canonical prose and defense objects must not duplicate one read event.
  - zh: MIT-000102 只在主 Agent 确认其 Measure 与新目标语义不变后扩展 Application；若目标需要剪贴板返回与敏感内容专有控制，则保留 MIT-000102 作为注入前置缓解，并用 T1115_MIT_EXPOSURE 承担内容暴露治理，不能合并成通用控制。
    en: Extend MIT-000102 only if the primary agent confirms its measures remain semantically unchanged for the new target. If the target needs clipboard-return or sensitive-content-specific controls, keep MIT-000102 as prerequisite injection mitigation and use T1115_MIT_EXPOSURE for content-exposure governance rather than merging them into a generic control.
integration:
  status: pending
  resolutions: []
