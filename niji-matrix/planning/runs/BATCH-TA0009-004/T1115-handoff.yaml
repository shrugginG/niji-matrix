  - temporary_key: T1115_DET_CONSUMER_INTERPOSITION
    name:
      zh: 剪贴板消费者代码完整性与截获结果关联
      en: Correlate Clipboard-Consumer Code Integrity With Intercepted Outcomes
    objective:
      zh: 在正常粘贴应用中连接未批准代码介入、被改变的剪贴板读取路径、成功返回与第二内容结果链，识别寄生于合法消费者的采集。
      en: Join unapproved code interposition, an altered clipboard-read path, a successful return, and a second content-outcome chain inside normal paste applications to identify collection parasitizing legitimate consumers.
    detects_keys:
    - T1115_PARENT
    - T1115_CHILD_CONSUMER_INTERPOSITION
    domains:
    - enterprise
    analytic_keys:
    - T1115_NJA_CONSUMER_HOOK_OUTCOME
    evidence_keys:
    - T1115_REF_QBOT
