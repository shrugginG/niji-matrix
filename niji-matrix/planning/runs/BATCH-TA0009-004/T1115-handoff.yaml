  detection_analytics:
  - temporary_key: T1115_NJA_EVENT_READ_OUTPUT
    strategy_key: T1115_DET_EVENT_CAPTURE
    name:
      zh: 变化通知后监听读取与结果链分析
      en: Post-Change Listener Read and Outcome-Chain Analytic
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 先在试点终端验证传感器能够记录 listener/viewer 注册、窗口或消息对象、clipboard sequence 或变化事件、读取 API、格式、返回状态和调用进程。以主机、用户、登录会话、不可变进程启动键、窗口句柄及 sequence/change 标识建立变化交易；在变化后五秒内查找同一注册主体的成功读取，再在三十秒内或同一持久缓冲中连接文件追加、IPC、压缩/读取或网络发送。只有注册、变化、成功读取和攻击者控制结果闭合时输出 event_coupled_clipboard_capture；缺结果时输出 listener_read_lead，只有隐藏窗口或注册时输出 listener_exposure。
        en: First validate on pilot endpoints that the sensor records listener or viewer registration, window or message objects, clipboard sequence or change events, read APIs, format, return status, and caller process. Build a change transaction by host, user, logon session, immutable process-start key, window handle, and sequence or change identifier. Within five seconds after a change, find a successful read by the same registered actor, then within thirty seconds or the same persistent buffer connect a file append, IPC, compression or read, or network send. Output event_coupled_clipboard_capture only when registration, change, successful read, and an adversary-controlled outcome close. Missing outcome produces listener_read_lead, while a hidden window or registration alone produces listener_exposure.
      - zh: 对长驻组件按二十四小时汇总变化到读取的重复比例、读取格式、写入路径和上传目的地，并与批准剪贴板工具清单比较。若内容隐私政策允许，可在端点生成短期、加盐或 tenant-scoped 的不可逆内容指纹，将读取结果与日志写入关联；禁止把明文剪贴板集中收集作为检测默认。NightshadeC2 类隐藏日志由后继命令上传时，分析应保留“采集已确认”和“外传已确认”的独立状态。
        en: For long-lived components, summarize the repeated change-to-read ratio, formats, write paths, and upload destinations over twenty-four hours and compare them with the approved clipboard-tool inventory. Where content-privacy policy permits, generate a short-lived salted or tenant-scoped irreversible content token on the endpoint to relate the read result to a log write. Central plaintext clipboard collection must not be the default. When a NightshadeC2-like hidden log is later uploaded by command, retain separate collection-confirmed and exfiltration-confirmed states.
    data_requirements:
    - source_type: validated-clipboard-listener-and-api-event
      name:
        zh: 经验证的剪贴板监听与 API 事件
        en: Validated clipboard-listener and API events
      channel: null
      required_fields:
      - timestamp
      - host_id
      - user_id
      - logon_session_id
      - process_start_key
      - pid
      - api_or_event
      - window_handle_or_listener_id
      - clipboard_sequence_or_change_id
      - format
      - return_status
      - returned_size_or_privacy_token
    - source_type: endpoint-process-module-window-lineage
      name:
        zh: 终端进程、模块与窗口谱系
        en: Endpoint process, module, and window lineage
      channel: verified EDR or memory-forensic sensor
      required_fields:
      - timestamp
      - host_id
      - process_start_key
      - parent_process_start_key
      - executable
      - hash
      - signer
      - loaded_module
      - window_class
      - window_style
      - window_visibility
    - source_type: endpoint-content-outcome
      name:
        zh: 终端内容结果与传输事件
        en: Endpoint content-outcome and transfer events
      channel: file, IPC, and network telemetry
      required_fields:
      - timestamp
      - host_id
      - process_start_key
      - destination_type
      - path_ipc_or_remote
      - operation
      - byte_count
      - result
      - content_privacy_token_or_sequence_ref
    - source_type: approved-clipboard-tool-context
      name:
        zh: 获批剪贴板工具与会话上下文
        en: Approved clipboard-tool and session context
      channel: asset and change-management inventory
      required_fields:
      - owner
      - package_hash
      - version
      - signer
      - approved_user_or_session_scope
      - approved_clipboard_function
      - expected_destinations
      - change_window
      - expiry
    observables:
    - zh: 非批准进程创建隐藏或仅消息窗口并注册长期剪贴板 listener/viewer
      en: An unapproved process creates a hidden or message-only window and registers a long-lived clipboard listener or viewer
    - zh: 同一注册主体在多个 sequence/change 事件后短时成功读取内容，空闲期没有固定轮询
      en: The same registered actor successfully reads content shortly after multiple sequence or change events and has no fixed polling while idle
    - zh: 读取结果随后进入隐藏或异常路径、IPC 缓冲或网络目的地
      en: Read results subsequently enter a hidden or anomalous path, IPC buffer, or network destination
    correlation:
      window:
        zh: 单次变化默认使用五秒变化到读取及三十秒读取到结果窗口；长驻 listener 按二十四小时汇总重复交易并保留七日基线。窗口值须由本地剪贴板负载与传感器延迟校准，不能把 NightshadeC2 的实现当作通用阈值。
        en: Use a default five-second change-to-read and thirty-second read-to-outcome window for one change. Summarize repeated transactions over twenty-four hours for a long-lived listener and retain a seven-day baseline. Calibrate values to local clipboard load and sensor delay rather than treating NightshadeC2's implementation as universal thresholds.
      dimensions:
      - host_id
      - user_id
      - logon_session_id
      - process_start_key
      - window_handle_or_listener_id
      - clipboard_sequence_or_change_id
      - format
      - content_privacy_token_or_sequence_ref
      - destination
      - time
    false_positives:
    - zh: 剪贴板历史和管理器会长期监听并保存变化内容
      en: Clipboard-history and manager tools listen persistently and save changed content
    - zh: 密码管理器可能读取或清理自己复制的值，DLP 和安全产品可能检查变化内容
      en: Password managers may read or clear values they copied, while DLP and security products may inspect changed content
    - zh: RDP、远程支持、虚拟机 guest tools、无障碍和自动化工具会同步或处理剪贴板
      en: RDP, remote support, virtual-machine guest tools, accessibility, and automation tools synchronize or process the clipboard
    blind_spots:
    - zh: 默认进程日志通常不记录每次编译进程内剪贴板 API 调用，未部署经验证传感器时无法确认读取
      en: Default process logs generally do not record every in-process clipboard API call, preventing read confirmation without a validated sensor
    - zh: 攻击者若注入已批准 listener 主体或直接在内存和加密通道保存内容，基于进程与文件的关联会减弱
      en: Injection into an approved listener actor or in-memory and encrypted retention weakens process- and file-based correlation
    - zh: 内容隐私限制、极短驻留和传感器丢失可能阻止读取结果与后继写入使用同一对象键
      en: Content-privacy limits, very short residence, and sensor loss may prevent one object key from linking a read to a later write
    tuning_guidance:
      paragraphs:
      - zh: 先在审计模式盘点合法 listener/viewer，并按精确包哈希、版本、owner、用户或会话范围、预期格式和结果目的地建立到期例外；不得按 Microsoft 签名、远程支持类别或窗口隐藏属性整体放行。以成功返回和后继结果作为确认门，API 名称或 listener 注册仅产生较低级线索。隐私敏感环境优先使用 sequence、大小、端点生成的不可逆 token 和目的地元数据，不收集明文。
        en: Inventory legitimate listeners and viewers in audit mode, then build expiring exceptions by exact package hash, version, owner, user or session scope, expected formats, and outcome destinations. Do not globally allow Microsoft-signed code, the remote-support category, or hidden-window properties. Use successful return and downstream outcome as the confirmation gate; an API name or listener registration produces only a lower-level lead. Privacy-sensitive environments should prefer sequence, size, an endpoint-generated irreversible token, and destination metadata over plaintext collection.
    evidence_keys:
    - T1115_REF_NIGHTSHADE
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_VOLATILITY
    - T1115_REF_CORTEX
  - temporary_key: T1115_NJA_CONSUMER_HOOK_OUTCOME
    strategy_key: T1115_DET_CONSUMER_INTERPOSITION
    name:
      zh: 粘贴消费者函数介入与第二结果链分析
      en: Paste-Consumer Function Interposition and Second-Outcome Analytic
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 以主机、登录会话和不可变 process-start key 版本化每个剪贴板消费者，保存可执行文件、签名、模块、函数入口或导入目标基线。连接 source 对 target 的访问与写入、模块或私有内存映射、GetClipboardData/TranslateMessage 或等效路径的 inline/IAT detour、调用栈偏移及实际粘贴返回。只有未批准代码来源进入调用链且一次成功返回被复制到另一缓冲、文件、IPC 或网络结果时输出 paste_consumer_interception_confirmed；只有注入或 hook 输出 interposition_exposure，只有成功粘贴而无第二结果保持 normal_or_unresolved。
        en: Version each clipboard consumer by host, logon session, and immutable process-start key and preserve executable, signer, module, function-entry, or import-target baselines. Join source-to-target access and writes, module or private-memory mapping, an inline or IAT detour on GetClipboardData, TranslateMessage, or an equivalent path, call-stack divergence, and an actual paste return. Output paste_consumer_interception_confirmed only when unapproved code provenance enters the call chain and one successful return is copied to another buffer, file, IPC, or network outcome. Injection or a hook alone produces interposition_exposure, while a successful paste without a second outcome remains normal_or_unresolved.
      - zh: 对 QBot 类链条，将被寄生应用的进程路径和窗口类别、剪贴板 sequence、读取线程、hook region、记录缓冲与加密文件写入连接，再追踪核心模块读取和传输。可复用 DET-000100/NJA-000082 的跨进程 source→write/map/load→dispatch 事实作为前置边，但本分析独立要求 clipboard return 与第二结果；不能从注入已确认自动提升为 T1115。对受信模块的合法 instrumentation 仅在 exact hash/version、owner、目标进程、函数用途、工单和到期窗口同时匹配时降噪。
        en: For a QBot-like chain, join the parasitized application's process path and window category, clipboard sequence, read thread, hooked region, record buffer, and encrypted file write, then follow the core module's read and transmission. Cross-process source-to-write, map, or load-to-dispatch facts from DET-000100 and NJA-000082 can serve as a prerequisite edge, but this analytic independently requires a clipboard return and second outcome. Confirmed injection cannot automatically become T1115. Suppress legitimate instrumentation in a trusted module only when exact hash or version, owner, target process, function purpose, ticket, and expiry window all match.
    data_requirements:
    - source_type: process-module-and-function-integrity
      name:
        zh: 进程、模块与函数路径完整性
        en: Process, module, and function-path integrity
      channel: validated EDR or memory-integrity sensor
      required_fields:
      - timestamp
      - host_id
      - logon_session_id
      - process_start_key
      - executable
      - hash
      - signer
      - module_or_region
      - backing_state
      - function_or_import_target
      - baseline_bytes_or_target
      - observed_bytes_or_target
      - call_stack
    - source_type: cross-process-write-load-dispatch
      name:
        zh: 跨进程写入、装载与调度谱系
        en: Cross-process write, load, and dispatch lineage
      channel: DET-000100/NJA-000082 compatible telemetry
      required_fields:
      - timestamp
      - source_start_key
      - target_start_key
      - requested_and_granted_rights
      - operation
      - address_or_module
      - content_hash_or_backing
      - dispatch_type
      - execution_result
    - source_type: validated-clipboard-return-and-paste-context
      name:
        zh: 经验证的剪贴板返回与粘贴上下文
        en: Validated clipboard return and paste context
      channel: null
      required_fields:
      - timestamp
      - host_id
      - process_start_key
      - thread_id
      - user_id
      - window_category
      - api_or_protocol
      - clipboard_sequence_or_change_id
      - format
      - return_status
      - returned_size_or_privacy_token
      - return_call_stack
    - source_type: second-content-outcome
      name:
        zh: 第二内容副本与后继处理
        en: Second content copy and downstream handling
      channel: memory, file, IPC, and network telemetry
      required_fields:
      - timestamp
      - producer_process_start_key
      - consumer_or_destination
      - operation
      - byte_count
      - content_privacy_token_or_sequence_ref
      - file_path_or_ipc_id_or_remote
      - result
    - source_type: approved-instrumentation-context
      name:
        zh: 获批进程内插桩上下文
        en: Approved in-process instrumentation context
      channel: asset and change-management inventory
      required_fields:
      - owner
      - package_hash
      - version
      - target_process_scope
      - approved_function_purpose
      - ticket
      - window_start
      - window_end
    observables:
    - zh: 未批准 source 向正常剪贴板消费者写入、加载模块或映射私有可执行区域
      en: An unapproved source writes to, loads a module into, or maps a private executable region in a normal clipboard consumer
    - zh: GetClipboardData、TranslateMessage 或等效粘贴路径的入口、导入目标或调用栈转入该代码来源
      en: The entry, import target, or call stack of GetClipboardData, TranslateMessage, or an equivalent paste path diverts into that code provenance
    - zh: 一次成功粘贴返回产生带同一 sequence 或隐私 token 的第二缓冲、加密文件、IPC 或网络结果
      en: One successful paste return produces a second buffer, encrypted file, IPC, or network result with the same sequence or privacy token
    correlation:
      window:
        zh: 注入或模块变更到进程终止保持同一 process-start key；单次粘贴返回到第二结果默认使用十秒紧凑窗口，第二结果到核心模块读取或传输可按稳定文件/IPC 键延伸三十分钟。长期应用不能只用宽时间邻近关联，必须有 region、module、thread、sequence、IPC 或内容隐私 token。
        en: Keep injection or module changes attached to the same process-start key until process termination. Use a ten-second tight window from one paste return to a second outcome, while a stable file or IPC key can extend the second outcome to core-module read or transfer for thirty minutes. A long-lived application cannot be joined by broad temporal proximity alone and requires a region, module, thread, sequence, IPC, or content-privacy token.
      dimensions:
      - host_id
      - logon_session_id
      - source_target_process_start_key
      - module_or_memory_region
      - function_or_import_target
      - thread_id
      - clipboard_sequence_or_change_id
      - content_privacy_token_or_sequence_ref
      - second_outcome_destination
      - time
    false_positives:
    - zh: EDR、DLP、防恶意软件或数据分类产品可在应用内合法 hook 读取与消息函数
      en: EDR, DLP, antimalware, or data-classification products may legitimately hook read and message functions in applications
    - zh: 无障碍、输入法、远程支持、自动化测试、调试器、profiler 和兼容性 shim 可改变消息或函数路径
      en: Accessibility, input methods, remote support, test automation, debuggers, profilers, and compatibility shims can alter message or function paths
    - zh: 应用自己的插件、崩溃处理和热补丁会产生模块、detour 或私有内存变化
      en: Application plug-ins, crash handling, and hot patching can create module, detour, or private-memory changes
    blind_spots:
    - zh: direct syscall、内核级 hook、硬件或传感器被篡改时，source 与函数完整性边可能丢失
      en: Direct syscalls, kernel-level hooks, hardware paths, or sensor tampering can erase source and function-integrity edges
    - zh: 只有周期性内存扫描时，短生命 detour、临时字节恢复或反射模块可能在两次扫描间消失
      en: With periodic memory scanning alone, a short-lived detour, temporary byte restoration, or reflective module can disappear between scans
    - zh: 没有返回结果或隐私安全对象键时，不能证明 hook 复制了内容而非只观察消息
      en: Without a returned result or privacy-safe object key, the analytic cannot prove that the hook copied content rather than merely observing messages
    tuning_guidance:
      paragraphs:
      - zh: 先按应用版本保存 GetClipboardData 和相关消息路径的预期入口、导入目标、模块与调用栈，并把批准 instrumentation 绑定 exact package/hash、owner、目标进程、用途、工单和到期窗口。不要按签名或进程名全局放行，也不要以单个 inline branch、IAT 变化或 RWX 区域直接确认。确认门必须同时包含未批准代码来源、成功 clipboard return 和第二结果；只有 T1055 前置边时保留注入告警而不追加本子项。
        en: Baseline expected entries, import targets, modules, and call stacks for GetClipboardData and related message paths by application version, and bind approved instrumentation to exact package or hash, owner, target process, purpose, ticket, and expiry. Do not globally allow by signature or process name and do not confirm from one inline branch, IAT change, or RWX region. The confirmation gate requires unapproved code provenance, a successful clipboard return, and a second outcome. Where only a T1055 prerequisite edge exists, retain the injection alert without adding this child.
    evidence_keys:
    - T1115_REF_QBOT
    - REF-000362
    - T1115_REF_MS_CLIPBOARD
    - T1115_REF_CORTEX
  mitigations:
  - temporary_key: T1115_MIT_EXPOSURE
    name:
      zh: 敏感剪贴板暴露与读取主体治理
      en: Sensitive-Clipboard Exposure and Reader Governance
    summary:
      zh: 减少敏感内容进入或长驻剪贴板的机会，限制未批准监听与跨会话同步，并为合法读取主体建立精确授权边界。
      en: Reduce opportunities for sensitive content to enter or persist in clipboards, restrict unapproved listeners and cross-session synchronization, and define exact authorization boundaries for legitimate readers.
    description:
      paragraphs:
      - zh: 剪贴板是大量业务流程依赖的共享会话能力，无法在所有终端整体禁用。本缓解先按数据敏感度和工作流减少暴露：优先使用与目标站点或应用绑定的密码管理器 autofill 或 passkey，关闭不必要的自动 TOTP 复制并设置短清理间隔；对受管敏感文件用 Endpoint DLP 审计、阻断或经批准覆盖“复制到剪贴板”；由应用写入的敏感项按平台能力排除历史与云同步。清理、history 和 cloud 标志缩短或限制持久化与传播，但不能阻止内容在清理前被实时 listener 读取。
        en: The clipboard is a shared session capability required by many business workflows and cannot be disabled universally. This mitigation first reduces exposure by data sensitivity and workflow. Prefer password-manager autofill or passkeys bound to the destination site or app, disable unnecessary automatic TOTP copying, and set a short clear interval. Use Endpoint DLP to audit, block, or allow approved override of copy-to-clipboard from managed sensitive files. Where applications write sensitive items, use platform capabilities to exclude them from history and cloud synchronization. Clearing, history, and cloud flags shorten or limit persistence and propagation but do not stop a real-time listener before clearing.
      - zh: 其次盘点剪贴板历史、密码管理器、DLP、远程支持、RDP、虚拟化 guest tools、无障碍与自动化组件，按精确包哈希、版本、owner、用户或会话范围、允许格式、数据方向和目的地授权；通过应用控制、受管安装和到期工单限制未知后台 listener。敏感远程桌面、VDI 与管理会话在无业务需要时禁用或按方向和类型收紧剪贴板重定向。对粘贴消费者进程内截获，应另由 MIT-000102 的最小跨进程访问、动态代码与模块来源完整性控制削弱注入前提。
        en: Next inventory clipboard history, password managers, DLP, remote support, RDP, virtualization guest tools, accessibility, and automation components, authorizing them by exact package hash, version, owner, user or session scope, allowed format, data direction, and destination. Use application control, managed installation, and expiring work orders to restrict unknown background listeners. Disable or directionally and type-restrict clipboard redirection in sensitive remote-desktop, VDI, and management sessions where no business need exists. For interception inside paste-consuming processes, separately apply MIT-000102's least cross-process access, dynamic-code, and module-provenance integrity controls to weaken injection prerequisites.
    domains:
    - enterprise
    measures:
    - key: sensitive-copy-minimization
      name:
        zh: 最小化敏感内容复制
        en: Minimize sensitive-content copying
      description:
        paragraphs:
        - zh: 对凭据与令牌优先部署目标绑定 autofill、passkey 或 broker 流程，关闭无必要的自动复制；对受管敏感文件配置 Endpoint DLP 的复制到剪贴板审计、阻断或经批准覆盖，并保留 policy、用户、源对象与结果。
          en: Prefer destination-bound autofill, passkeys, or brokered flows for credentials and tokens and disable unnecessary automatic copying. Configure Endpoint DLP copy-to-clipboard audit, block, or approved override for managed sensitive files and retain policy, user, source object, and result.
      control_type: exposure-reduction
    - key: clipboard-residence-history-and-sync-control
      name:
        zh: 剪贴板驻留、历史与同步控制
        en: Clipboard residence, history, and synchronization control
      description:
        paragraphs:
        - zh: 为密码管理器和敏感业务应用设置最短可用清理时间，并在支持的平台上把敏感项排除出 clipboard history 与 cloud clipboard；在无业务需求的受管终端关闭历史或跨设备同步，并记录例外。
          en: Set the shortest usable clear interval for password managers and sensitive business apps, and exclude sensitive items from clipboard history and cloud clipboard where supported. Disable history or cross-device synchronization on managed endpoints without a business need and record exceptions.
      control_type: exposure-reduction
    - key: approved-reader-and-listener-inventory
      name:
        zh: 精确登记读取与监听主体
        en: Precisely register readers and listeners
      description:
        paragraphs:
        - zh: 按 package/hash/version、owner、会话、允许格式、数据方向、输出目的地和到期窗口登记剪贴板管理器、DLP、远程支持、VM 工具与无障碍组件，通过受管安装或应用控制限制未批准后台 listener，签名或产品类别不能成为永久全局放行条件。
          en: Register clipboard managers, DLP, remote support, VM tools, and accessibility components by package or hash, version, owner, session, allowed format, data direction, output destination, and expiry. Restrict unapproved background listeners through managed installation or application control, and never use signature or product category as a permanent global allow condition.
      control_type: governance
    - key: remote-session-clipboard-boundary
      name:
        zh: 约束远程会话剪贴板边界
        en: Constrain remote-session clipboard boundaries
      description:
        paragraphs:
        - zh: 对管理、VDI 与高敏远程会话按业务需要禁用、单向化或限制剪贴板重定向的数据类型，并把本地端、session host 与 host-pool 等多层策略的最终生效结果纳入验证。
          en: Disable, make one-way, or restrict clipboard-redirection data types for administrative, VDI, and sensitive remote sessions according to business need, and validate the resultant policy across local device, session host, and host-pool layers.
      control_type: preventive
    applications:
    - target_key: T1115_PARENT
      use:
        zh: 对敏感复制工作流采用 autofill/passkey、DLP copy 控制、短清理和 history/cloud 排除；对能够读取剪贴板的后台程序建立精确授权与结果目的地清单，并在远程会话收紧重定向。
        en: Apply autofill or passkeys, DLP copy controls, short clearing, and history or cloud exclusion to sensitive-copy workflows. Maintain exact authorization and outcome-destination inventories for background clipboard readers and tighten redirection in remote sessions.
      expected_effect:
        zh: 减少高价值内容进入、长驻或跨设备传播的次数与时间，并缩小攻击者可伪装成合法 reader 的主体集合，使未批准读取更易区分。
        en: Reduce how often and how long high-value content enters, persists in, or propagates through clipboards, while narrowing the set of actors in which an adversary can masquerade as a legitimate reader and improving discrimination of unauthorized reads.
      limitations:
        zh: 业务复制粘贴无法全部取消，清理发生前的实时读取仍可能成功；history/cloud 与 RDP 控制不限制同一会话中所有本地 API，DLP 也只覆盖已纳管数据、应用与平台。
        en: Business copy and paste cannot be eliminated, and real-time reading can succeed before clearing. History, cloud, and RDP controls do not constrain every local API in the same session, while DLP covers only managed data, apps, and platforms.
    - target_key: T1115_CHILD_CHANGE_EVENT
      use:
        zh: 将后台 listener 许可收紧到确切的剪贴板管理器、密码管理器、DLP、远程支持与虚拟化组件，记录其用户或会话范围、格式、输出和到期时间；对其他长期隐藏 listener 阻断或隔离，并减少敏感内容可被变化事件触发读取的驻留时间。
        en: Restrict background-listener permission to exact clipboard managers, password managers, DLP, remote-support, and virtualization components with recorded user or session scope, formats, outputs, and expiry. Block or isolate other long-lived hidden listeners and shorten the residence of sensitive content available to change-triggered reads.
      expected_effect:
        zh: 减少未批准事件订阅者的执行机会，并让剩余变化后读取能够与有限的批准主体和目的地比较；短清理和 DLP 还降低 listener 命中高价值内容的概率。
        en: Reduce execution opportunities for unapproved event subscribers and make remaining post-change reads comparable to a small approved actor and destination set. Short clearing and DLP also lower the probability that a listener captures high-value content.
      limitations:
        zh: 注入批准 listener、内核控制或自带消息窗口的已放行程序仍可读取；签名应用也可能被劫持，且严格阻断会影响剪贴板历史、远程支持、无障碍和生产力工具。
        en: Injection into an approved listener, kernel control, or an allowed program with its own message window can still read content. Signed apps can be hijacked, and strict blocking can disrupt clipboard history, remote support, accessibility, and productivity tools.
    - target_key: T1115_CHILD_CONSUMER_INTERPOSITION
      use:
        zh: 用本缓解减少敏感内容进入剪贴板，并同时为正常粘贴消费者限定批准 reader 与输出；把防止进程内截获的代码写入、动态代码、模块来源和 callback 完整性措施交由 MIT-000102 的新增目标 Application 实施。
        en: Use this mitigation to reduce sensitive content entering the clipboard and to constrain approved readers and outputs for normal paste consumers. Apply process-write, dynamic-code, module-provenance, and callback-integrity controls against in-process interception through a new target application under MIT-000102.
      expected_effect:
        zh: 即使 hook 已进入消费者，攻击者可取得的高价值剪贴板内容更少；与 MIT-000102 联合实施时，还会提高进入并维持粘贴调用路径介入的成本。
        en: Even if a hook enters the consumer, less high-value clipboard content is available. Combined with MIT-000102, the control also raises the cost of entering and maintaining interposition on the paste call path.
      limitations:
        zh: 本缓解本身不验证函数入口或阻止所有进程注入；业务必须复制的普通文本仍可被截获，且受信 DLP 或辅助组件与恶意 hook 仍需代码来源和结果关联区分。
        en: This mitigation does not itself validate function entries or block every injection path. Ordinary text required by business workflows remains interceptable, and trusted DLP or accessibility components still require code-provenance and outcome correlation to distinguish them from malicious hooks.
    evidence_keys:
    - T1115_REF_DLP
    - T1115_REF_BITWARDEN
    - T1115_REF_MS_FORMATS
    - T1115_REF_RDP
    - T1115_REF_MS_CLIPBOARD
existing_library_reuse:
  reference_refs:
  - REF-000362
  claim_refs: []
  case_refs: []
  strategy_refs: []
  analytic_refs: []
  mitigation_refs:
  - MIT-000102
  relationship_refs: []
  extension_candidates:
  - existing_ref: MIT-000102
    resolution: extend
    target_key: T1115_CHILD_CONSUMER_INTERPOSITION
    use:
      paragraphs:
      - zh: 对经常消费剪贴板的浏览器、编辑器、邮件与业务应用，按 source-target pair 收紧跨进程写入、调试和模块装载权，按版本启用可兼容的动态代码、CIG/ACG/CFG 或等效运行时完整性策略，并把批准 DLP、EDR、无障碍和插件绑定到精确 hash、owner、目标进程、函数用途与到期窗口。保留 source→write/map/load→函数 detour 或 callback→成功 paste return→第二内容结果的谱系；仅见注入时仍按 MIT-000102 的进程上下文风险处理，闭合剪贴板结果后才归入本子项。
        en: For browsers, editors, mail clients, and business applications that commonly consume the clipboard, tighten cross-process write, debug, and module-load rights by source-target pair, enable compatible dynamic-code, CIG, ACG, CFG, or equivalent runtime-integrity policy by version, and bind approved DLP, EDR, accessibility, and plug-ins to exact hash, owner, target process, function purpose, and expiry. Preserve source-to-write, map, or load-to-function-detour or callback-to-successful-paste-return-to-second-content-outcome lineage. Injection alone remains a MIT-000102 process-context risk; classify this child only after the clipboard outcome closes.
    expected_effect:
      paragraphs:
      - zh: 未批准代码更难进入正常粘贴消费者或改变 GetClipboardData 与消息路径，受信进程名称不再覆盖异常模块、调用栈和第二结果。攻击者须另行突破跨进程权限与运行时完整性、劫持已批准 instrumentation，或转向会产生不同主体与痕迹的独立读取路径。
        en: Unapproved code has less ability to enter a normal paste consumer or alter GetClipboardData and message paths, and a trusted process name no longer masks an anomalous module, call stack, and second outcome. The adversary must separately defeat cross-process and runtime-integrity controls, hijack approved instrumentation, or move to a stand-alone read path with a different actor and trace pattern.
    limitations:
      paragraphs:
      - zh: DLP、EDR、无障碍、输入法、浏览器 sandbox、JIT、调试和热补丁可能合法需要进程内介入，严格策略有兼容性与可用性成本。内核级或已签名受陷组件可绕过用户态完整性，缺少 return 与第二结果时仍不能证明 T1115；本扩展也不减少必须复制到剪贴板的敏感内容，应与 T1115_MIT_EXPOSURE 联合实施。
        en: DLP, EDR, accessibility, input methods, browser sandboxes, JIT, debugging, and hot patching may legitimately need in-process interposition, so strict policy has compatibility and availability cost. Kernel-level or compromised signed components can bypass user-mode integrity, and missing return and second outcome still prevents a T1115 conclusion. This extension also does not reduce sensitive content that must be copied and should be combined with T1115_MIT_EXPOSURE.
    evidence_keys:
    - T1115_REF_QBOT
    - REF-000362
    - T1115_REF_MS_CLIPBOARD
  notes:
    zh: REF-000362 锚定 T1055 进程注入边界，可支持粘贴消费者子项的前置行为但不证明剪贴板结果。DET-000100/NJA-000082 能复用跨进程 source→write/map/load→dispatch 事实字段，现有策略身份与分析结论仍是进程注入而非内容获取，不能只扩展 detects_refs 代替 T1115 专有 Analytic。MIT-000102 的最小跨进程访问、动态代码、模块来源和 callback 完整性 Measure 与消费者上下文截获的预防动作相同，建议主 Agent 对 T1115_CHILD_CONSUMER_INTERPOSITION 增加目标特定 Application；它不能替代敏感内容暴露控制。MIT-000059 涉及剪贴板到 shell 的用户执行方向，与攻击者读取剪贴板的因果方向不同，不建议复用。
    en: REF-000362 anchors the T1055 process-injection boundary and can support a prerequisite for the paste-consumer child but does not prove a clipboard result. DET-000100 and NJA-000082 can supply cross-process source-to-write, map, or load-to-dispatch facts. Their existing strategy identity and conclusion remain process injection rather than content acquisition, so extending detects_refs alone cannot replace a T1115-specific analytic. MIT-000102's least cross-process access, dynamic-code, module-provenance, and callback-integrity measures match prevention of consumer-context interception. The primary agent should add a target-specific application for T1115_CHILD_CONSUMER_INTERPOSITION; it does not replace sensitive-content exposure controls. MIT-000059 addresses user execution from clipboard into a shell, which has the opposite causal direction from adversary reading, so reuse is not recommended.
library_candidates:
  references:
  - temporary_key: T1115_REF_ATTACK
    url: https://attack.mitre.org/versions/v19/techniques/T1115/
    source_type: framework
    confidence: high
    supports:
      zh: 固定 19.1 工作簿中 T1115 的父行为、TA0009 映射和零子项的版本化在线追溯；不独立证明 Niji 子项、匿迹机理或检测字段。
      en: Versioned online provenance for T1115's parent behavior, TA0009 mapping, and zero children in the fixed 19.1 workbook; it does not independently prove a Niji child, stealth mechanism, or detection field.
  - temporary_key: T1115_REF_MS_CLIPBOARD
    url: https://learn.microsoft.com/en-us/windows/win32/dataxchg/using-the-clipboard
    source_type: vendor-documentation
    confidence: high
    locator: Monitor the clipboard contents; Query the clipboard sequence number; Create a Clipboard Format Listener; Create a clipboard viewer window
    supports:
      zh: Windows 为剪贴板变化提供 sequence number、format listener 和 viewer 三类路径；listener 在变化时收到 WM_CLIPBOARDUPDATE，viewer 收到 WM_DRAWCLIPBOARD 并可读取数据。只支持平台前提与事件结构，不证明恶意取得。
      en: Windows supplies a sequence number, format listener, and viewer paths for clipboard changes. A listener receives WM_CLIPBOARDUPDATE on change, while a viewer receives WM_DRAWCLIPBOARD and can retrieve data. Supports platform prerequisites and event structure, not malicious acquisition.
  - temporary_key: T1115_REF_VOLATILITY
    url: https://volatilityfoundation.org/movp-1-2-window-stations-and-clipboard-malware/
    source_type: technical-analysis
    confidence: high
    locator: Clipboard Snooping Malware and memory-artifact walkthrough
    supports:
      zh: 高频 GetClipboardData 轮询需反复 OpenClipboard 并可能阻塞合法程序；listener/viewer 是变化触发路径，并在内存中留下 window station、viewer、格式和 serial 等取证痕迹；explorer、vmtoolsd、SnagIt 和 Clipboardic 提供正常反例。
      en: Frequent GetClipboardData polling repeatedly opens the clipboard and may block legitimate applications. Listener or viewer registration provides a change-triggered path and leaves memory-forensic window-station, viewer, format, and serial artifacts. explorer, vmtoolsd, SnagIt, and Clipboardic provide benign comparators.
  - temporary_key: T1115_REF_NIGHTSHADE
    url: https://www.esentire.com/blog/new-botnet-emerges-from-the-shadows-nightshadec2
    source_type: incident-and-sample-analysis
    confidence: high
    locator: Analysis of NightshadeC2 Payload; figures 19–23; clipboard harvesting and command 150
    supports:
      zh: 2025 年现场样本创建隐藏工具窗口、注册 AddClipboardFormatListener、在 WM_CLIPBOARDUPDATE 后收集内容、写入按权限变化的隐藏日志，并由命令 150 上传已捕获键盘与剪贴板内容，直接支持父行为、事件子项和结果链。
      en: The 2025 incident sample creates a hidden tool window, registers AddClipboardFormatListener, harvests content after WM_CLIPBOARDUPDATE, writes a privilege-dependent hidden log, and uploads captured keystrokes and clipboard contents through command 150. Directly supports the parent, event child, and outcome chain.
  - temporary_key: T1115_REF_QBOT
    url: https://www.fortinet.com/blog/threat-research/deep-analysis-qbot-campaign
    source_type: sample-analysis
    confidence: high
    locator: Injection-Modules at Work on a Victim's Device; GetClipboardData and TranslateMessage hooks; Notepad experiment; encrypted mavrihvu32.dll
    supports:
      zh: QBot 将注入模块放入目标进程并 hook GetClipboardData 与 TranslateMessage；Notepad 实验显示内容在应用前被捕获，记录进程路径、窗口标题和文本，随后 RC4 加密落入文件并由传输线程处理，直接支持消费者上下文截获。
      en: QBot places an injected module in target processes and hooks GetClipboardData and TranslateMessage. A Notepad experiment shows content captured before the application with process path, window title, and text, then RC4-encrypted into a file handled by a transmission thread. Directly supports consumer-context interception.
  - temporary_key: T1115_REF_CORTEX
    url: https://docs-cortex.paloaltonetworks.com/r/Cortex-XDR/Cortex-XDR-Analytics-Alert-Reference-by-Alert-name/Uncommon-GetClipboardData-API-function-invocation-of-a-possible-information-stealer
    source_type: vendor-detection-documentation
    confidence: medium
    supports:
      zh: 至少一种商业 EDR 能针对异常 GetClipboardData 调用提供分析告警，证明 API 级观察在特定产品中可实现；页面不证明默认 Windows 日志具有同等字段，正式 Analytic 必须先验证本地传感器。
      en: At least one commercial EDR exposes an analytic alert for unusual GetClipboardData invocation, establishing that API-level observation is feasible in a specific product. It does not establish equivalent fields in default Windows logs, so the formal analytic must validate the local sensor first.
  - temporary_key: T1115_REF_DLP
    url: https://learn.microsoft.com/en-us/purview/dlp-policy-reference
    source_type: vendor-documentation
    confidence: high
    locator: Supported actions for Devices; Copy to clipboard; Paste to supported browsers; restricted app activities
    supports:
