      en: Windows applications can use ExcludeClipboardContentFromMonitorProcessing, CanIncludeInClipboardHistory, and CanUploadToCloudClipboard to control whether written items enter history or cloud synchronization. These formats do not claim to prevent real-time local reads.
  - temporary_key: T1115_REF_RDP
