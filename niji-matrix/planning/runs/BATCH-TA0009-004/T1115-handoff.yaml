      en: Endpoint DLP can audit, block, or allow override for copy-to-clipboard from protected files and evaluate paste into supported browsers. Coverage depends on managed devices, apps, data, and configuration.
  - temporary_key: T1115_REF_BITWARDEN
    url: https://bitwarden.com/help/auto-fill-browser/
    source_type: vendor-documentation
