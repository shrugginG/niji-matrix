candidate:
  source_type: attack
  source_attack_id: T1530
  source_attack_version: '19.1'
  name:
    zh: 从云存储获取数据
    en: Data from Cloud Storage
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        固定 ATT&CK Enterprise 19.1 将 T1530 锚定为从 IaaS 对象存储、云盘或兼具存储用途的 SaaS 中访问数据，固定版没有 ATT&CK 子项。美国司法部在 Capital One 案中确认攻击者侵入云端存储数据，且搜查设备中存在数据副本；Microsoft 又记录 Storm-0501 窃取 Azure Storage 账户密钥并用 AzCopy 把账户中的数据外传；Mandiant 记录 APT42 浏览并下载受害者 OneDrive 文件到磁盘。三组来源均证明了内容实际取得，而不只证明桶、对象、权限或工具能力，因此父行为应保留。
      en: >-
        The fixed ATT&CK Enterprise 19.1 baseline anchors T1530 in accessing data from IaaS object storage, cloud drives, or SaaS with a storage role, and it has no ATT&CK children. The United States Department of Justice confirms intrusion into Capital One cloud-stored data and recovery of a copy on seized devices. Microsoft separately records Storm-0501 stealing Azure Storage account keys and using AzCopy to exfiltrate data from those accounts, while Mandiant records APT42 browsing and downloading victim OneDrive files to disk. These sources establish actual content acquisition rather than only a bucket, object, permission, or tool capability, so the parent behavior should remain.
    - zh: >-
        云位置本身不构成匿迹，故建议适配为“匿迹型云存储内容获取”。正式范围要求攻击者选择的读取路径、主体语境或授权载体改变痕迹归属和防守观察；AWS S3 对象数据事件、GCP Cloud Storage DATA_READ 与 Azure Blob 资源日志均需显式配置或路由，M365 云盘审计虽对多数租户默认启用，仍需用客户端、应用、对象和结果字段区分正常同步与恶意下载。开放检索后仅建议一项 Niji 原生子项“消费主体解绑的云对象读取”：公开权限、账户/共享密钥、SAS 或预签名/签名链接使成功读取无法从授权记录直接还原实际持有者。直接对象数据面与前端应用审计错位保留在父级机理和待证轴，因为 IaaS 直接接口常是父行为核心，按 GUI/API/CLI 拆分会违反分类规则。
      en: >-
        A cloud location is not stealth by itself, so adapt the candidate to Stealth-Oriented Cloud Storage Content Acquisition. Formal scope requires an attacker-selected read path, principal context, or authorization carrier that changes trace attribution and defender observation. AWS S3 object data events, GCP Cloud Storage DATA_READ, and Azure Blob resource logs all require explicit selection, enablement, or routing. Microsoft 365 cloud-drive auditing is enabled by default for most tenants, yet client, application, object, and outcome fields are still needed to separate normal synchronization from malicious download. The open search supports one Niji-native child, Consumer-Identity-Decoupled Cloud Object Retrieval: public permission, an account or shared key, SAS, or a presigned or signed link lets a successful read occur without authorization records identifying the actual holder. Direct data-plane versus front-end audit mismatch remains a parent mechanism and deferred axis because a direct IaaS interface is often parent-core behavior, and a GUI, API, or CLI partition would violate the taxonomy rule.
  scope_notes:
    zh: >-
      直接对象是云存储服务返回的对象或文件正文。T1619/NJT-0141 管理已知容器内键、前缀和清单元数据；ListObjects、ListBlobs、objects.list、HeadObject、对象元数据或成功授权不证明正文已取得。T1213/NJT-0143 管理协作、代码或业务信息库的查询驱动内容读取；已知云盘/对象路径的正文下载由 T1530 管理，若先在 SharePoint 等库内搜索再下载，可分别记录两个阶段。NJT-0086 管理持久应用集成和 service principal grant，NJT-0135 管理重复/增量收集轮次，NJT-0134 管理读取后的中间暂存。NJT-0196/T1537 管理同服务跨账户 grant、有效外部访问或独立副本，外送网络或外部服务结果归 TA0010；这些行为可与 T1530 同现，但证据不得互相替代。
    en: >-
      The direct object is an object or file body returned by a cloud storage service. T1619 and NJT-0141 own keys, prefixes, and inventory metadata inside a known container. ListObjects, ListBlobs, objects.list, HeadObject, object metadata, or successful authorization does not prove body acquisition. T1213 and NJT-0143 own query-led reading from collaboration, code, or business repositories. Downloading a known cloud-drive or object path belongs to T1530; a SharePoint search followed by a download can instantiate the two stages separately. NJT-0086 owns durable application integration and service-principal grants, NJT-0135 owns repeated or incremental collection passes, and NJT-0134 owns intermediate staging after the read. NJT-0196 and T1537 own same-service cross-account grants, effective external access, or independent replicas, while outbound network or external-service delivery belongs to TA0010. These behaviors may co-occur with T1530, but their evidence is not interchangeable.
proposed_content:
  temporary_key: T1530_PARENT
  name:
    zh: 匿迹型云存储内容获取
    en: Stealth-Oriented Cloud Storage Content Acquisition
  summary:
    zh: 攻击者从云对象或云盘实际取得内容，并借用正常数据平面、有效存储身份或弱归因授权载体，使恶意读取与同步、备份、分析或普通下载难在单一观察面区分。
    en: An adversary actually obtains content from a cloud object or cloud drive while using an ordinary data plane, a valid storage identity, or a weakly attributable authorization carrier, making malicious reads difficult to distinguish from synchronization, backup, analytics, or ordinary download at one observation point.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: >-
        匿迹型云存储内容获取是攻击者对 IaaS 对象、SaaS 云盘文件或等价云端存储实体发起读取，并使正文进入其控制的内存、磁盘、处理流或后继传输链，同时通过读取路径、主体语境或授权载体降低防守方从单条事件判断恶意目的的能力。概念锚是“存储账户/租户—容器或云盘—对象标识—授权上下文—成功内容返回”，不是厂商、工具、文件类型或界面。
      en: >-
        Stealth-Oriented Cloud Storage Content Acquisition occurs when an adversary reads an IaaS object, SaaS cloud-drive file, or equivalent cloud-stored entity and places its body into attacker-controlled memory, disk, processing, or a successor transfer chain, while the read path, principal context, or authorization carrier reduces what one event can reveal about malicious purpose. The conceptual anchor is storage account or tenant, container or drive, object identity, authorization context, and successful content return rather than vendor, tool, file type, or interface.
    - zh: >-
        完成度应分层。桶/站点存在、键列表、对象元数据、GetObject/GetBlob 调用能力、授权成功或下载工具存在仅说明发现、权限或能力；提供方记录 2xx/206、无错误且响应字节大于零，或 M365 记录成功 FileDownloaded/FileSyncDownloadedFull，可把结论提升为“服务已提供内容”，仍不能单独证明攻击者完整保留。现场报告确认复制、磁盘落地、后继处理、外传结果或取证设备中的副本，才支持更强的实际取得结论。
      en: >-
        Completion must be graded. Bucket or site existence, a key list, object metadata, GetObject or GetBlob capability, allowed authorization, or a download-capable tool establishes discovery, permission, or capability only. A provider-side 2xx or 206 result with no error and nonzero response bytes, or a successful Microsoft 365 FileDownloaded or FileSyncDownloadedFull record, raises the conclusion to provider-delivered content but does not alone prove complete adversary retention. An incident report confirming a copy, disk materialization, successor processing, exfiltration result, or a copy on seized media supports the stronger actual-acquisition conclusion.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        云对象读取通常不创建源端文件写入，且可由真实 IAM role、云盘用户、备份代理、同步客户端、分析任务或存储密钥发出。单条成功事件中的主体、对象和状态可以完全真实，却不表达该读取是否符合职责；若读取使用共享密钥、SAS、预签名链接或公开权限，审计还可能只保留签名者、认证类型、来源地址或匿名主体，而非实际持有者。攻击者借此把意图隐藏在获准读取的正常外观中。
      en: >-
        Cloud-object reads usually create no source-side file write and can originate from a real IAM role, cloud-drive user, backup agent, synchronization client, analytics job, or storage key. Principal, object, and status in one successful event can all be accurate while failing to express whether the read fits duty. With a shared key, SAS, presigned link, signed URL, or public permission, audit may retain only the signer, authentication type, source address, or an anonymous subject rather than the actual holder. The adversary can therefore conceal intent within the appearance of an allowed read.
    - zh: >-
        观察覆盖依赖平台与配置。CloudTrail 默认不记录 S3 对象数据事件，S3 server access log 需另行启用且尽力投递；GCP Data Access 默认关闭并且不记录公开对象访问，使用日志也需配置；Azure Blob 资源日志在创建 diagnostic setting 并路由前不被收集。Microsoft 365 Audit 对多数组织默认启用，但 FileAccessed 有抑制或聚合语义，ClientIP 可能是代理应用地址，应用或 service principal 可成为审计主体。缺日志是覆盖缺口，不能反推无读取。
      en: >-
        Observation depends on platform and configuration. CloudTrail does not log S3 object data events by default, while S3 server access logging is separately enabled and best effort. GCP Data Access is disabled by default and does not track public-object access, while usage logging also requires setup. Azure Blob resource logs are not collected until a diagnostic setting routes them. Microsoft 365 Audit is enabled by default for most organizations, but FileAccessed can be suppressed or aggregated, ClientIP can identify a proxy application, and an application or service principal can become the audit actor. Missing telemetry is a coverage gap and cannot prove that no read occurred.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求对象正文由云存储服务成功返回，并有攻击者控制的读取路径、主体语境或授权载体带来明确观察差。对 AWS、Azure 与 GCP，优先使用成功状态与响应字节；对 OneDrive 等云盘，使用成功下载/同步下载事件并结合对象路径、客户端和结果。只有列表、Head/metadata、权限检查、SAS/链接生成、账户密钥列取或工具枚举时，分别报告 discovery、exposure、credential access 或 capability，不得升级为内容取得。
      en: >-
        Include cases where the cloud storage service successfully returns an object body and an attacker-controlled read path, principal context, or authorization carrier creates a defined observation difference. For AWS, Azure, and GCP, prefer successful status plus response bytes. For cloud drives such as OneDrive, use successful download or sync-download records with object path, client, and result. Listing, Head or metadata, permission checks, SAS or link generation, account-key retrieval, or tool enumeration alone must remain discovery, exposure, credential access, or capability rather than content acquisition.
    - zh: >-
        云盘可能同时是信息库。若行为以检索词、仓库查询或协作上下文选择内容，NJT-0143 管理该选择轴；若对已知对象执行正文读取，本父级管理源读取。既有 app/service principal 的持续 grant 与 token 生命周期归 NJT-0086；合法同步或备份身份只是强反例，除非另有证据证明攻击者控制。跨账户权限或副本结果归 NJT-0196，读取后的归档、暂存与外传分别归 T1560、NJT-0134 与 TA0010。
      en: >-
        A cloud drive can also be an information repository. NJT-0143 owns selection through search terms, repository queries, or collaboration context, while this parent owns body retrieval for a known object. A durable grant and token lifecycle for an existing application or service principal belongs to NJT-0086. Legitimate synchronization or backup identities are strong counterexamples unless separately shown to be adversary-controlled. Cross-account entitlement or replica outcomes belong to NJT-0196, and later archiving, staging, and exfiltration belong to T1560, NJT-0134, and TA0010 respectively.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          在 IaaS 场景中，攻击者可利用过宽工作负载 role、账户密钥或存储共享载体直接读取对象。Capital One 案中，司法部确认云端存储数据被侵入并复制到攻击者设备；Storm-0501 在取得 Azure Owner 权限后读取 storage account keys、开放网络访问并用 AzCopy 完成数据外传。这些案例证明存储数据面能在没有源主机文件读取的情况下产生真实内容结果，但不能把其全部匿迹效果归因于单一工具。
        en: >-
          In IaaS, an adversary can use an overbroad workload role, account key, or storage authorization carrier to read objects directly. In the Capital One case, the Department of Justice confirms intrusion into cloud-stored data and a copy on attacker devices. After gaining Azure Owner authority, Storm-0501 retrieved storage-account keys, exposed network access, and used AzCopy to complete data exfiltration. These cases establish real storage-data-plane outcomes without source-host file reads, but their entire stealth effect cannot be attributed to one tool.
      - zh: >-
          在云盘场景中，攻击者以被盗账户或批准客户端浏览并下载对象。Mandiant 观察 APT42 浏览并把 OneDrive 文件下载到磁盘，同时使用内建 Microsoft 365 功能、公开工具和匿名化基础设施以降低识别；来源对 OneDrive 下载给出观察结论，却把向仿冒租户 OneDrive 的外传写成“尝试且可能成功”，两者置信度不得混同。
        en: >-
          In cloud drives, an adversary can browse and download objects through a stolen account or an approved client. Mandiant observed APT42 browsing and downloading OneDrive files to disk while relying on built-in Microsoft 365 features, public tools, and anonymized infrastructure to reduce detection. The source directly observes OneDrive downloads but describes transfer to a masquerading OneDrive tenant as attempted and possibly successful; these conclusions must retain different confidence.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要已知对象或能从 discovery 阶段得到对象标识，并拥有可读取正文的用户、role、应用 token、账户/共享密钥、SAS、签名链接或公开访问条件。其可控制请求来源、客户端、时间、对象集合和授权载体，却受对象级权限、条件访问、网络边界、密钥有效期、链接范围、加密密钥与日志保留约束。若只取得 List/Head 权限或链接已过期，无法完成父行为。
          en: >-
            The adversary needs a known object or an identifier obtained during discovery and a user, role, application token, account or shared key, SAS, signed link, or public-access condition that can read the body. The actor can control request origin, client, timing, object set, and authorization carrier but remains constrained by object permissions, conditional access, network boundaries, key lifetime, link scope, encryption keys, and audit retention. List or Head authority alone, or an expired link, cannot complete the parent behavior.
        - zh: >-
            使用正常同步、备份或管理员主体可提供较高访问范围，但会继承固定 client ID、user agent、调度、对象范围、目的地与错误重试；盗用持久集成时还会触及 NJT-0086。可转移授权载体子项能弱化实际消费主体归因，却可能暴露 QueryString/SAS/AccountKey/Anonymous 认证类型、异常来源、过长有效期或近期 listKeys/共享变更。
          en: >-
            A normal synchronization, backup, or administrator principal can provide broad access but inherits a stable client ID, user agent, schedule, object scope, destination, and retry behavior; co-opting a durable integration also invokes NJT-0086. The transferable-authorization child weakens attribution to the actual consumer but can expose QueryString, SAS, AccountKey, or Anonymous authentication, an unusual origin, excessive lifetime, or recent listKeys or sharing changes.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要分别保存控制面、身份面、应用面和存储数据面日志，并以 tenant/account、container/drive、object key/path、request/correlation ID、principal/client、source、authentication type、状态和响应字节关联。结论应区分 capability、attempt、provider-delivered 与 confirmed acquisition；只见 GetObject 名称或 200 元数据响应时不能声称完整正文已被攻击者保存。
          en: >-
            The defender needs separate control-plane, identity, application, and storage-data-plane logs joined by tenant or account, container or drive, object key or path, request or correlation ID, principal or client, source, authentication type, status, and response bytes. Conclusions should distinguish capability, attempt, provider-delivered content, and confirmed acquisition. A GetObject name or a 200 metadata response alone cannot establish that the adversary retained the complete body.
        - zh: >-
            防守方还需维护同步、备份、ETL、电子发现、DLP、迁移和管理员读取清单，记录 owner、主体、客户端、对象范围、计划、目的地与有效期。对象数据日志未启用、公开访问不被审计、共享密钥隐藏用户、代理应用替代客户端 IP、FileAccessed 聚合以及跨租户日志不可见都会留下盲区；任何缺层都应降低结论强度。
          en: >-
            The defender also needs an inventory of synchronization, backup, ETL, e-discovery, DLP, migration, and administrative reads, including owner, principal, client, object scope, schedule, destination, and validity. Disabled object-data logs, unaudited public access, a shared key hiding the user, a proxy application replacing client IP, FileAccessed aggregation, and invisible cross-tenant logs leave blind spots. Missing layers must reduce conclusion strength.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 让恶意对象读取呈现为获准同步备份或普通下载
      en: Make malicious object reads resemble authorized synchronization backup or ordinary download
    analysis:
      paragraphs:
      - zh: >-
          攻击者通过正常存储数据面和有效读取授权取得正文，服务记录的主体、对象、操作和成功状态与备份、同步、分析或用户下载使用相同结构。单一存储事件能证明谁或哪个载体获准读取，却不表达业务目的；防守方必须把对象敏感度、主体职责、客户端基线、批准作业和后继结果连接起来。Capital One、Storm-0501 与 APT42 证明真实内容取得可由云角色、密钥或普通云盘客户端完成，告警下降仍取决于本地基线，故置信度为 medium。
        en: >-
          The adversary obtains bodies through an ordinary storage data plane and valid read authority, producing the same principal, object, operation, and success structure used by backup, synchronization, analytics, or user download. One storage event can show who or which carrier was authorized but not business purpose. Defenders must join object sensitivity, principal duty, client baseline, approved work, and successor outcomes. Capital One, Storm-0501, and APT42 establish real acquisition through a cloud role, key, or ordinary cloud-drive client, while reduced alerting remains environment-dependent, so confidence is medium.
    evidence_keys:
    - T1530_REF_DOJ_THOMPSON_CASE
    - REF-000530
    - REF-000731
    - REF-000513
    - REF-000539
    - REF-000540
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 将授权身份应用与内容结果分散到不同云审计平面
      en: Distribute authorization identity application and content outcomes across cloud audit planes
    analysis:
      paragraphs:
      - zh: >-
          读取权限或密钥产生于控制/身份面，云盘会话或应用上下文位于应用面，正文返回位于存储数据面，后继落地或外传又处于端点和网络面；这些事件可由不同主体、客户端和时间记录。若 S3/GCP/Azure 数据面日志未显式启用，或授权使用可转移载体而缺实际消费主体，单一平面只看到 grant、listKeys 或普通 FileDownloaded 的一段。对象/请求标识、来源和短长窗口关联能恢复部分谱系，因此属于痕迹分散而非无痕。
        en: >-
          Read authority or key creation occurs in control and identity planes, a cloud-drive session or application context sits in the application plane, body return occurs in the storage data plane, and later materialization or exfiltration appears in endpoint and network planes. Different principals, clients, and times can record these events. If S3, GCP, or Azure data-plane logging is not explicitly enabled, or a transferable carrier omits the actual consumer, one plane sees only a grant, listKeys action, or ordinary FileDownloaded fragment. Object or request identity, origin, and short and long windows recover part of the lineage, so this is trace distribution rather than tracelessness.
    evidence_keys:
    - REF-000513
    - REF-000524
    - REF-000539
    - REF-000540
    - T1530_REF_MS365_ACTIVITY_SCHEMA
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: >-
          建议仅形式化“消费主体解绑的云对象读取”。稳定变量是正文请求的授权是否绑定到可审计的实际消费主体；公开访问、账户/共享密钥、SAS 和预签名/签名链接把读取权放入可转移载体，使持有者无需自身用户或 service principal 身份即可取回对象。该变量改变认证字段和控制面—数据面关联方式，并要求载体签发/暴露、来源和成功内容返回的专门检测。
        en: >-
          Recommend formalizing only Consumer-Identity-Decoupled Cloud Object Retrieval. The stable variable is whether body-request authority binds to the auditable identity of the actual consumer. Public access, account or shared keys, SAS, and presigned or signed links place read authority in a transferable carrier so a holder can retrieve an object without presenting its own user or service-principal identity. This changes authentication fields and control-to-data-plane correlation and requires detection specific to carrier issuance or exposure, origin, and successful content return.
      - zh: >-
          直接对象 API 与前端应用审计错位经过独立检索，但 IaaS 的直接对象数据面本来就是父行为核心，SaaS 现场资料又未证明同一对象因绕过前端而产生可重复的独立审计差，因此暂缓而不按 API/CLI/GUI 建子项。选择性对象读取交还 NJT-0143 或父级目标范围，低频/变化检查点归 NJT-0135，正常同步/备份主体属于反例或 NJT-0086 前提，跨账户 grant/副本归 NJT-0196，版本/快照读取缺少结论级恶意取得证据。数据事件默认关闭是环境条件，不是攻击者可控分类变量。
        en: >-
          Direct object APIs versus front-end application audit were researched separately, but a direct object data plane is parent-core in IaaS, and SaaS incident evidence does not establish a repeatable independent audit difference for the same object when bypassing the front end. That axis is deferred rather than divided by API, CLI, or GUI. Selective object reading returns to NJT-0143 or parent target scope, low-rate or change-checkpoint behavior belongs to NJT-0135, normal synchronization or backup principals are counterexamples or NJT-0086 prerequisites, cross-account grants or replicas belong to NJT-0196, and version or snapshot reads lack conclusion-level malicious-acquisition evidence. Data-event disablement is an environmental condition rather than an attacker-controlled taxonomy variable.
    proposed_child_keys:
    - T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED
proposed_subtechniques:
- temporary_key: T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED
  formalization_recommendation: proposed-formal
  confidence: medium
  name:
    zh: 消费主体解绑的云对象读取
    en: Consumer-Identity-Decoupled Cloud Object Retrieval
  summary:
    zh: 攻击者以公开权限、共享/账户密钥、SAS 或签名链接取回云对象，使服务验证授权载体而不验证或记录实际消费主体的独立身份。
    en: An adversary retrieves a cloud object through public permission, a shared or account key, SAS, or a signed link, causing the service to validate an authorization carrier without authenticating or recording the actual consumer's independent identity.
  definition_and_concept:
    paragraphs:
    - zh: >-
        消费主体解绑的云对象读取以“对象读取权是否绑定到发起者自身可审计身份”为控制变量。父级正文取得条件保持不变；子项要求服务根据公开权限或可转移秘密/链接完成读取，实际持有者不必以自身用户、role、service principal 或租户身份认证。AWS 预签名 URL、Azure storage account key/SAS 与 GCP signed URL 是不同实现，不形成兄弟项。
      en: >-
        Consumer-Identity-Decoupled Cloud Object Retrieval controls whether object-read authority is bound to the initiator's own auditable identity. The parent body-acquisition condition remains unchanged. The child requires the service to complete the read based on public permission or a transferable secret or link, without requiring the holder to authenticate as its own user, role, service principal, or tenant. An AWS presigned URL, Azure storage-account key or SAS, and GCP signed URL are implementations rather than sibling categories.
    - zh: >-
        “解绑”不表示完全没有痕迹。AWS server access log 可记录 requester、remote IP、QueryString 或匿名认证、状态与 bytes sent；Azure StorageBlobLogs 可记录 AuthenticationType、CallerIpAddress、ObjectKey/Uri、StatusCode 和 ResponseBodySize，但 AccountKey/SAS/Anonymous 通常不能提供实际人的 RequesterObjectId；GCP signed URL 绑定签名账户而非使用者，公开对象甚至不进入 Cloud Audit Logs，需另配 usage logs。分类依赖消费主体归因差，而不是链接或密钥名称。
      en: >-
        Decoupling does not mean no trace. AWS server access logs can retain requester, remote IP, QueryString or anonymous authentication, status, and bytes sent. Azure StorageBlobLogs can retain AuthenticationType, CallerIpAddress, ObjectKey or Uri, StatusCode, and ResponseBodySize, but AccountKey, SAS, or Anonymous use commonly lacks the actual person's RequesterObjectId. A GCP signed URL binds to the signing account rather than the holder, and public objects do not enter Cloud Audit Logs at all, requiring separately configured usage logs. Classification depends on the consumer-attribution gap rather than the name of a link or key.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        授权创建或暴露与正文消费可由不同主体、地址和时间完成。防守方可能看到管理员列取密钥、应用签发短期链接或对象被设为公开，随后只看到 AccountKey/SAS/QueryString/Anonymous 的成功读取；若未保存载体标识、签名者、有效期、对象范围和来源，便无法从数据面事件还原真实持有者。单纯按正常账户登录或用户下载检测会失去主体链。
      en: >-
        Authorization creation or exposure and body consumption can occur under different actors, addresses, and times. A defender may see an administrator list a key, an application issue a short-lived link, or an object become public, followed only by a successful AccountKey, SAS, QueryString, or Anonymous read. Without carrier identifier, signer, lifetime, object scope, and origin, the data-plane event cannot identify the actual holder. Detection based only on normal account sign-in or user download loses the subject chain.
    - zh: >-
        残余特征包括认证类型、无 RequesterObjectId、签名年龄/到期、SAS 策略状态、异常 source IP/user agent、公开策略变化、listKeys 或签名动作、对象敏感度和响应字节。合法 CDN、客户下载门户、软件分发、临时合作链接、灾备和支持取证会使用同类载体，因此载体类别本身不能判恶，必须同 owner、业务用途、受众、对象范围和签发记录比较。
      en: >-
        Residual features include authentication type, missing RequesterObjectId, signature age or expiry, SAS policy status, unusual source IP or user agent, public-policy changes, listKeys or signing actions, object sensitivity, and response bytes. Legitimate CDNs, customer download portals, software distribution, temporary collaboration links, disaster recovery, and support forensics use the same carriers. Carrier type alone cannot establish maliciousness and must be compared with owner, business purpose, audience, object scope, and issuance record.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入公开/匿名读取、使用共享或账户级存储密钥读取、SAS，以及可由任意持有者使用的预签名/签名链接，但只有对象正文成功返回时才完成。只创建链接、列取密钥、修改公开访问、取得 SAS、发送邀请或出现 GetObject/GetBlob 失败调用均是能力或暴露层；无成功状态/响应字节、成功 FileDownloaded 或现场内容结果时不得升级。
      en: >-
        Include public or anonymous reads, reads authorized by a shared or account-level storage key, SAS, and presigned or signed links usable by any holder, but only when an object body is successfully returned. Link creation, key listing, public-access mutation, SAS acquisition, invitation, or a failed GetObject or GetBlob remains capability or exposure. Do not promote it without a successful status and response bytes, a successful FileDownloaded outcome, or incident evidence of content.
    - zh: >-
        若读取以可解析的另一个账户/租户 principal 完成并源于跨账户 grant，则成功源读取可与本父级同现，但授权转移与外传由 NJT-0196 管理，不纳入本子项。以持久应用 token 或既有集成执行且能解析 app/service principal 的读取归父级，并由 NJT-0086 管理其持续授权；单次窃取的人类 session 也不是本子项。账户密钥或 bearer link 如何被窃取属于凭据访问，内容结果仍由本子项承担。
      en: >-
        When a resolvable principal in another account or tenant reads through a cross-account grant, the successful source read can co-occur with this parent, but NJT-0196 owns entitlement transfer and exfiltration and the event does not enter this child. A read by a durable application token or existing integration with a resolvable application or service principal remains at the parent, while NJT-0086 owns its continuing authorization. One stolen human session is also outside this child. Credential Access owns theft of an account key or bearer link, while this child owns the content outcome.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          Microsoft 记录 Storm-0501 在取得 Azure Owner 权限后调用 Microsoft.Storage/storageAccounts/listkeys/action 窃取存储账户密钥，随后开放网络访问并以 AzCopy 把账户数据外传。这一链证明攻击者真实使用主体解绑的账户级秘密取得并送出内容；公开资料未提供原始 StorageBlobLogs，因此 AuthenticationType、RequesterObjectId 缺失和响应字节应由部署侧日志验证，不能作为该事件已经观测到的字段陈述。
        en: >-
          Microsoft records Storm-0501 invoking Microsoft.Storage/storageAccounts/listkeys/action after obtaining Azure Owner authority, stealing storage-account keys, exposing network access, and then using AzCopy to exfiltrate account data. This chain establishes actual content acquisition and delivery through a principal-decoupled account secret. The public report does not publish raw StorageBlobLogs, so AuthenticationType, missing RequesterObjectId, and response bytes must be validated in deployment telemetry rather than presented as observed fields from that incident.
      - zh: >-
          公开对象与签名链接属于同一控制变量的其他实现。Google 明确说明 signed URL 可被任何持有者在有效期内用于读取对象，且 Cloud Audit Logs 不追踪 public objects；AWS 将预签名 URL 定义为 bearer token，并在 S3 server access log 中区分 QueryString 与未认证请求。这些文档证明可实施路径和观察差，不证明特定攻击者已用该实现成功取数，因此其案例强度低于 Storm-0501。
        en: >-
          Public objects and signed links are other implementations of the same control variable. Google explicitly states that any holder can use a signed URL to read an object during its validity and that Cloud Audit Logs does not track public objects. AWS characterizes presigned URLs as bearer tokens and distinguishes QueryString from unauthenticated requests in S3 server access logs. These documents establish an implementable path and observation difference, not a particular adversary's successful use, so their case strength is lower than Storm-0501.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要得到或诱使产生可读对象的公开权限、账户/共享密钥、SAS 或签名 URL，并在有效期、对象范围、网络条件和加密约束内发送请求。使用公开访问无需独立身份；使用 bearer link 不需获得签名账户本身；账户密钥通常权限更广但暴露后更易触发轮换和集中响应。若提供方要求 identity-bound OAuth 且禁用共享密钥/公开访问，攻击者失去本子项路径。
          en: >-
            The adversary needs to obtain or induce public read permission, an account or shared key, SAS, or a signed URL for a readable object, then send the request within lifetime, object scope, network conditions, and encryption constraints. Public access requires no independent identity, a bearer link does not require control of the signing account, and an account key is often broader but more likely to trigger rotation and centralized response once exposed. If the provider requires identity-bound OAuth and disables shared-key and public access, the child path is unavailable.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要保留 public access/ACL/policy 变化、listKeys/签名或 SAS 签发线索、载体策略与对象范围，并把它们连接到成功数据面读取。认证类型、签名者、来源、user agent、对象、状态、响应字节和到期是核心字段。对公开 GCP 对象需 usage logs，因为 Cloud Audit Logs 明确不记录该访问；对 Azure 需 diagnostic setting；对 AWS 应联合 CloudTrail 对象数据事件与 server access log，而不能假定任一默认存在。
          en: >-
            The defender needs public-access, ACL, or policy changes; listKeys, signing, or SAS issuance evidence; carrier policy and object scope; and successful data-plane reads. Authentication type, signer, origin, user agent, object, status, response bytes, and expiry are core fields. Public GCP objects require usage logs because Cloud Audit Logs explicitly omits those reads. Azure requires a diagnostic setting, and AWS benefits from joining CloudTrail object data events with server access logs without assuming either exists by default.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 让授权创建者与实际内容消费者分离在不同事件和主体中
      en: Separate authorization creator from the actual content consumer across events and subjects
    analysis:
      paragraphs:
      - zh: >-
          攻击者持有可转移载体后，无需以自己的云身份执行正文请求。授权平面记录签名者、key owner、SAS 或公开策略，数据面则记录匿名、QueryString、AccountKey/SAS 或来源地址；二者可相隔较长时间，且实际人不在任一身份字段中。Storm-0501 直接证明账户密钥与 AzCopy 内容外传链，AWS、Azure 与 GCP 官方资料证明残余字段和默认覆盖差；跨平面关联可恢复载体来源而未必恢复持有者，故置信度为 medium。
        en: >-
          Once the adversary holds a transferable carrier, the body request need not use the actor's own cloud identity. The authorization plane records a signer, key owner, SAS, or public policy, while the data plane records Anonymous, QueryString, AccountKey or SAS, or only an origin address. The events can be widely separated in time, and the actual person can be absent from every identity field. Storm-0501 directly establishes an account-key-to-AzCopy content-exfiltration chain, while AWS, Azure, and GCP documentation establishes residual fields and default coverage differences. Cross-plane correlation can recover carrier origin without necessarily recovering the holder, so confidence is medium.
