research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary-open-search
    coverage_resolutions:
    - source_cluster: T1530 parent behavior with no fixed ATT&CK children
      resolution: parent-core
      rationale:
        zh: 固定版只有父行为；IaaS 对象、Office Suite 云盘和 SaaS 存储用途是行为表面，不是可导入 NJS 的产品/平台分类。
        en: The fixed baseline has only the parent. IaaS objects, Office Suite drives, and SaaS storage roles are behavioral surface rather than product or platform partitions importable as NJS.
    candidate_stealth_axes_examined:
    - axis:
        zh: 直接对象数据面与前端应用审计错位
        en: Direct object data plane versus front-end application audit mismatch
      resolution: parent-core-and-evidence-deferred
      rationale:
        zh: >-
          AWS/GCP/Azure 证明数据面日志与控制/应用日志分离且默认覆盖不同，Capital One 与 Storm-0501 证明直接存储读取结果；但 IaaS 直接数据面本身是父行为核心，现有 SaaS 案例未给出同一对象经前端与后端两条路径的恶意对照。按 API/CLI/GUI 拆分不稳定，保留为父级 NM-ST 与待证轴。
        en: >-
          AWS, GCP, and Azure establish separate data-plane versus control or application logs and different default coverage, while Capital One and Storm-0501 establish direct storage-read outcomes. A direct IaaS data plane is parent-core, however, and current SaaS cases do not compare malicious front-end and back-end paths for the same object. An API, CLI, or GUI split is unstable, so retain this as parent NM-ST and a deferred axis.
    - axis:
        zh: 公开/共享密钥/SAS/签名链接使授权与实际消费主体解绑
        en: Public, shared-key, SAS, or signed-link authorization decouples authority from actual consumer
      resolution: formal-niji-child
      rationale:
        zh: >-
          变量跨厂商稳定、由攻击者选择、改变身份字段与控制面—数据面关联，并有 Storm-0501 账户密钥+AzCopy 的实际内容结果及官方日志/授权语义支持；检测和缓解均不同于 identity-bound OAuth。
        en: >-
          The variable is stable across providers, attacker-selectable, changes identity fields and control-to-data-plane joins, and has Storm-0501 account-key plus AzCopy content outcome and official logging and authorization support. Detection and mitigation differ from identity-bound OAuth.
    - axis:
        zh: 跨账户授权或目标账户副本
        en: Cross-account entitlement or destination-account replica
      resolution: adjacent-technique
      rationale:
        zh: >-
          NJT-0196/T1537 已按原对象跨账户授权和独立副本承接控制权转移；T1530 只保留源对象成功正文读取。一个事件可双标不同阶段，但不能为本批再建相同 NJS。
        en: >-
          NJT-0196 and T1537 already own control transfer through same-object cross-account entitlement and independent replicas. T1530 retains only successful source-object body retrieval. One event can instantiate separate stages, but this batch must not duplicate their NJS.
    - axis:
        zh: 借正常同步、备份、管理员或 service principal 主体读取
        en: Borrow normal synchronization, backup, administrator, or service-principal readers
      resolution: parent-core-counterexample-and-adjacent
      rationale:
        zh: >-
          正常作业身份是父级行为透明机理和强反例；若攻击者建立或挪用持久 app/service principal grant，由 NJT-0086 管理。仅按主体类别拆分没有稳定兄弟边界，检测应使用 owner/job/scope 基线。
        en: >-
          Normal job identities are a parent Behavioral Transparency mechanism and strong counterexample. NJT-0086 owns adversarial establishment or co-option of a durable application or service-principal grant. Principal type alone lacks a stable sibling boundary and belongs in owner, job, and scope baselining.
    - axis:
        zh: 选择性对象、低量或前缀读取
        en: Selective object, low-volume, or prefix-scoped reads
      resolution: parent-core-and-adjacent
      rationale:
        zh: >-
          已知对象的少量读取属于父级目标范围；查询驱动选择归 NJT-0143，跨轮变化检查点与低量增量归 NJT-0135。没有新的云对象特有变量证明独立子项。
        en: >-
          A small set of known objects is parent target scope. Query-led selection belongs to NJT-0143, while cross-pass change checkpoints and low-volume increments belong to NJT-0135. No new cloud-object-specific variable establishes a separate child.
    - axis:
        zh: 数据事件默认关闭或审计配置缺口
        en: Data events disabled by default or audit configuration gaps
      resolution: environment-condition-not-child
      rationale:
        zh: >-
          AWS/GCP/Azure 官方资料证明覆盖缺口，但默认状态由防守配置决定，不是攻击者稳定可控的行为变量；若攻击者主动禁用日志，应转交 TA0005 相邻技术。
        en: >-
          AWS, GCP, and Azure documentation establishes the coverage gap, but default state is a defender configuration rather than a stable attacker-controlled behavioral variable. Active adversarial logging disablement belongs to an adjacent TA0005 technique.
    - axis:
        zh: 非当前版本、快照或备份对象读取
        en: Noncurrent version, snapshot, or backup-object read
      resolution: evidence-deferred-and-adjacent
      rationale:
        zh: >-
          官方接口证明 versionId、generation、snapshot/backup 可读，但当前没有结论级事件证明攻击者用旧版本/快照取得非凭据内容并获得独立观察差。跨账户复制归 NJT-0196，原始卷/备份视图可能与 NJT-0108 相邻，暂不形式化。
        en: >-
          Official interfaces establish readable versionId, generation, snapshot, or backup objects, but no conclusion-level event shows an adversary acquiring noncredential content through an old version or snapshot with an independent observation difference. Cross-account copies belong to NJT-0196, and raw volume or backup views can border NJT-0108, so defer formalization.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定版零子项不降低开放检索责任。本轮检查七类轴，仅消费主体解绑授权载体同时通过稳定性、痕迹差、结论级恶意结果、兄弟边界和独立防御价值门禁；其余轴保留在父级、交还相邻对象或延迟。
      en: Zero fixed-baseline children does not reduce the open-search duty. Seven axes were examined; only a consumer-identity-decoupled authorization carrier passes stability, trace difference, conclusion-level malicious outcome, sibling boundary, and distinct defense value. The rest remain parent-core, return to adjacent objects, or are deferred.
  evidence_coverage:
    parent_behavior_keys:
    - T1530_REF_ATTACK19
    - T1530_REF_DOJ_THOMPSON_CASE
    - REF-000530
    - REF-000731
    boundary_keys:
    - REF-000535
    - REF-000513
    - REF-000540
    - T1530_REF_MS365_ACTIVITY_SCHEMA
    - NJT-0141
    - NJT-0143
    - NJT-0086
    - NJT-0135
    - NJT-0134
    - NJT-0196
    mechanism_support:
    - mechanism: NM-BT
      evidence_keys: [T1530_REF_DOJ_THOMPSON_CASE, REF-000530, REF-000731, REF-000513, REF-000539, REF-000540]
      confidence: medium
    - mechanism: NM-ST
      evidence_keys: [REF-000513, REF-000524, REF-000539, REF-000540, T1530_REF_MS365_ACTIVITY_SCHEMA]
      confidence: medium
    child_existence_support:
    - child_key: T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED
      evidence_keys: [REF-000530, T1530_REF_AZURE_SHARED_KEY_PREVENT, T1530_REF_AWS_PRESIGNED_URLS, T1530_REF_GCP_SIGNED_URLS, REF-000541, T1530_REF_AZURE_BLOB_LOG_SCHEMA]
      confidence: medium
    unsupported_or_deferred:
    - conclusion:
        zh: 仅有 List/Head/metadata、permission、link/key 生成或工具能力即可证明内容取得
        en: List, Head, metadata, permission, link or key creation, or tool capability alone proves content acquisition
      reason:
        zh: 这些证据至多达到 discovery、exposure、credential capability 或 attempt；需要成功状态/响应字节或现场结果。
        en: These facts reach only discovery, exposure, credential capability, or attempt; successful status and bytes or an incident outcome are required.
    - conclusion:
        zh: 所有 direct API/CLI 读取均构成独立 NJS
        en: Every direct API or CLI read forms an independent NJS
      reason:
        zh: 在 IaaS 中这是父行为核心；没有同对象前端/后端对照和稳定审计差，工具/界面也不允许定义 NJS。
        en: This is parent-core in IaaS, lacks same-object front-end versus back-end comparison and stable audit difference, and tool or interface cannot define NJS.
    - conclusion:
        zh: 公开、SAS 或 signed URL 能自动隐藏来源并逃避全部日志
        en: Public, SAS, or signed URLs automatically hide origin and evade all logs
      reason:
        zh: server/usage/resource logs仍可记录来源、user agent、认证类型、对象、状态和响应字节；覆盖和持有者归因依配置而异。
        en: Server, usage, or resource logs can retain origin, user agent, authentication type, object, status, and response bytes. Coverage and holder attribution vary by configuration.
    - conclusion:
        zh: GetObject/GetBlob 成功即证明完整文件被攻击者保留
        en: A successful GetObject or GetBlob proves the adversary retained the complete file
      reason:
        zh: Range/中断、代理与服务端写出语义限制该结论；应分 provider-delivered 与 confirmed acquisition。
        en: Range requests, interruption, proxying, and provider-write semantics limit that conclusion; provider-delivered and confirmed acquisition must remain separate.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级与子项分别覆盖定义、完成条件、匿迹特性、边界、两个应用场景、攻击者/防守方模型、因果机理和限制；每个防御分析按平台成功语义与字段独立写作。NJT-0001 仅用于核对字段问题覆盖与论证深度，没有复制其字数、机理或对象数量。
      en: >-
        Parent and child separately cover definition, completion condition, stealth characteristics, boundaries, two application scenarios, attacker and defender models, causal mechanisms, and limitations. Each defense analytic is independently written around platform success semantics and fields. NJT-0001 was used only to compare field-question coverage and argumentative depth, without copying its length, mechanisms, or object counts.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - 只读解析固定 ATT&CK 19.1 xlsx 中的 T1530、procedure、mitigation 与 DET0484/AN1328-1330 行
    - Read-only parsing of fixed ATT&CK 19.1 xlsx rows for T1530, procedures, mitigations, and DET0484 or AN1328-1330
    - 共享库文本检索与 YAML 解析校验
    - Shared-library text lookup and YAML parse validation
  limitations:
    paragraphs:
    - zh: >-
        固定 ATT&CK 页能证明广泛父行为和平台范围，不能证明每次云读取天然匿迹，也不能自动支持 Niji 子项。Capital One 司法资料证明云端存储数据被复制并在设备中发现副本，但未公开原始 CloudTrail、对象键、请求状态或字节；不能据此补造具体日志序列。APT42 报告直接观察 OneDrive 下载到磁盘，却没有逐对象 UAL 字段或总量；向仿冒 OneDrive 外传仅“尝试且可能成功”。
      en: >-
        The fixed ATT&CK page establishes broad parent behavior and platform scope but does not make every cloud read stealthy or automatically support a Niji child. Capital One court material establishes copied cloud-stored data and a copy on devices, but publishes no raw CloudTrail, object keys, request status, or bytes and cannot support an invented log sequence. The APT42 report directly observes OneDrive download to disk but gives no per-object UAL fields or total volume, while transfer to a masquerading OneDrive is only attempted and possibly successful.
    - zh: >-
        Storm-0501 是消费主体解绑子项的最强现场证据，直接连接 storage account key、AzCopy 和完成外传，但 Microsoft 没有发布 StorageBlobLogs、具体 AuthenticationType、RequesterObjectId 或 ResponseBodySize。官方字段只证明目标环境可实现检测，不能声称事件调查已经看见这些字段，也不能量化密钥路径比 OAuth 更少告警。
      en: >-
        Storm-0501 is the strongest field evidence for the consumer-identity-decoupled child, directly connecting a storage-account key, AzCopy, and completed exfiltration. Microsoft publishes no StorageBlobLogs, exact AuthenticationType, RequesterObjectId, or ResponseBodySize. Official fields establish implementable detection in a target environment, not that the incident investigation observed them, and do not quantify fewer alerts than OAuth.
    - zh: >-
        数据面日志的默认和成功语义不可跨平台机械等价。CloudTrail 对象 data events、GCP DATA_READ、Azure diagnostic routing 和 GCP usage logs 都需配置；S3 server/ GCP usage log 完整性不保证。M365 Audit 对多数组织默认开启，但许可、保留、应用代理 IP、app/service 主体与 FileAccessed 聚合会改变可见性。正式 Analytic 必须先用受控请求核对本地字段。
      en: >-
        Data-plane defaults and success semantics cannot be mechanically equated across platforms. CloudTrail object data events, GCP DATA_READ, Azure diagnostic routing, and GCP usage logs require configuration, while S3 server and GCP usage-log completeness is not guaranteed. Microsoft 365 Audit is enabled by default for most organizations, but licensing, retention, proxy application IP, application or service actors, and FileAccessed aggregation change visibility. A formal Analytic must first validate local fields with controlled requests.
    - zh: >-
        正常同步、备份、ETL、分析、CDN、客户下载、迁移、电子发现、灾备和管理员响应与本父级高度同形。最小权限与作业清单只能降低范围并改进归因，不能阻止被控批准主体在其合法范围内读数。成功响应字节证明服务端提供内容，不证明客户端完整保留；撤销 link/key 也不能追回已经复制的数据。
      en: >-
        Normal synchronization, backup, ETL, analytics, CDN, customer download, migration, e-discovery, disaster recovery, and administrative response closely resemble this parent. Least privilege and job inventories reduce scope and improve attribution but cannot stop a compromised approved principal from reading within its lawful range. Successful response bytes establish provider delivery rather than complete client retention, and revoking a link or key cannot recall copied data.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason:
      zh: 当前行为不改变对象内容或表示；加密、压缩或分块属于相邻处理或传输，不能从云位置推断数据遮蔽。
      en: The behavior does not change object content or representation. Encryption, compression, or chunking belongs to adjacent processing or transfer and cannot be inferred from cloud location.
  - mechanism_ref: NM-FD
    subject: T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED
    reason:
      zh: 子项核心是授权创建者与消费主体的事件分离，不是伪造对象或客户端特征；认证类型和来源仍可能显著，故使用 NM-ST。
      en: The child centers on event separation between authorization creator and consumer rather than falsifying object or client features. Authentication type and origin can remain conspicuous, so NM-ST is used.
  - candidate_axis: direct-object-api-versus-frontend
    reason:
      zh: 父级机理有支持，但没有稳定独立兄弟边界或恶意对照，且不得按 API/CLI/GUI 分类。
      en: The parent mechanism has support, but no stable independent sibling boundary or malicious comparison exists, and API, CLI, or GUI cannot define taxonomy.
  - candidate_axis: selective-version-or-range-read
    reason:
      zh: 官方接口支持 versionId/generation/Range，现无恶意成功内容案例或独立防御价值证明；选择性/增量还与 NJT-0143/NJT-0135 重叠。
      en: Official interfaces support versionId, generation, and Range, but no malicious successful-content case or independent defense value is established, while selectivity and increments overlap NJT-0143 and NJT-0135.
  open_questions:
  - 主 Agent 是否接受以 Storm-0501 一项强现场案例加跨平台官方语义支持统一“消费主体解绑”子项；若要求多平台现场案例，应降低 child confidence 或 defer，而不能按厂商拆分。
  - Should the primary agent accept one strong Storm-0501 field case plus cross-platform authoritative semantics for the unified consumer-identity-decoupled child? If multiple-provider field cases are required, lower confidence or defer rather than split by provider.
  - REF-000530 与 REF-000731 应扩展已有 locator/notes；CASE-000188 与 CASE-000238 的中心事实不同，建议为内容取得另建 Case。
  - Extend existing REF-000530 and REF-000731 locators and notes. CASE-000188 and CASE-000238 have different central facts, so create separate acquisition Cases.
  - MIT-000141 以对象列举为语义身份，建议为正文读取/载体治理新建 MIT；若主 Agent 选择 extend，必须重写名称、总体描述和 measures，避免仅添 application 造成对象身份失真。
  - MIT-000141 is semantically an object-listing mitigation. Create a new MIT for body reads and carrier governance. If the primary agent instead extends it, rename and revise its overall description and measures rather than adding an application that distorts object identity.
