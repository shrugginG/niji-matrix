  detection_analytics:
  - temporary_key: T1530_NJA_AWS_S3_DELIVERY
    strategy_key: T1530_DET_OBJECT_DELIVERY_PROVENANCE
    name:
      zh: S3 对象服务端返回与角色/载体来源关联
      en: S3 Server-Side Object Return and Role or Carrier Provenance Correlation
    platforms: [IaaS]
    logic:
      zh: >-
        仅对高价值桶启用并验证 CloudTrail S3 对象 data events，同时启用一条独立 S3 server access log 路径。先把 CloudTrail eventName=GetObject、eventCategory=Data、readOnly=true、requestParameters.bucketName/key、userIdentity、sourceIPAddress、userAgent、requestID 和 errorCode 规范化为对象读取请求；无 errorCode 只能说明 API 未报告失败。再以 bucket、key、request ID、来源和短窗关联 server access log 的 REST.GET.OBJECT，要求 HTTPStatus 为 200 或 206、ErrorCode 为 '-' 且 BytesSent 大于零，才输出 provider_delivered_object。只有 CloudTrail 时输出 successful_api_read_candidate；只有 HeadObject/List 或元数据事件时保持 discovery_or_metadata。

        将读取主体解析为用户、assumed role、服务或 anonymous，并解析 server log 的 Requester、RemoteIP、AuthenticationType、UserAgent、VersionId 和 ObjectSize。按 principal/session 或 QueryString/anonymous 载体、bucket/key、source IP、user agent 在三十分钟聚合对象数、响应字节和敏感度，与获批 ETL、备份、复制、扫描、灾备、分析和应用作业清单比较。对新来源、职责外前缀、异常版本、QueryString/anonymous、短时间高敏对象扇出及前序 AssumeRole/公开策略变化提高风险；后继文件落地、归档或外联只提高 confirmed_acquisition，不作为服务端返回的必要条件。
      en: >-
        Enable and validate CloudTrail S3 object data events only for high-value buckets and maintain an independent S3 server access-log path. Normalize CloudTrail eventName=GetObject, eventCategory=Data, readOnly=true, requestParameters.bucketName and key, userIdentity, sourceIPAddress, userAgent, requestID, and errorCode into an object-read request. Absence of errorCode means only that the API did not report failure. Join by bucket, key, request ID, origin, and a short window to REST.GET.OBJECT in the server access log. Require HTTPStatus 200 or 206, ErrorCode '-', and BytesSent greater than zero before emitting provider_delivered_object. Emit successful_api_read_candidate with CloudTrail alone, and retain HeadObject, List, or metadata events as discovery_or_metadata.

        Resolve the reader as user, assumed role, service, or anonymous, and parse Requester, RemoteIP, AuthenticationType, UserAgent, VersionId, and ObjectSize from the server log. Aggregate object count, response bytes, and sensitivity for thirty minutes by principal or session, or by QueryString or anonymous carrier, bucket and key, source IP, and user agent. Compare with approved ETL, backup, copy, scanning, disaster-recovery, analytics, and application jobs. Raise risk for a new origin, out-of-duty prefix, unusual version, QueryString or anonymous authentication, rapid sensitive-object fan-out, or preceding AssumeRole or public-policy change. Later file materialization, archiving, or egress raises the grade to confirmed_acquisition but is not required for provider-returned content.
    data_requirements:
    - source_type: aws-cloudtrail-s3-data-events
      channel: CloudTrail trail or event data store with S3 object read data events
      required_fields: [eventTime, eventCategory, eventName, readOnly, userIdentity.type, userIdentity.arn, userIdentity.accountId, userIdentity.sessionContext, sourceIPAddress, userAgent, requestParameters.bucketName, requestParameters.key, requestID, errorCode, resources.type, resources.ARN]
    - source_type: aws-s3-server-access-log
      channel: S3 server access logging to independently protected destination
      required_fields: [time, bucket, requester, remote_ip, request_id, operation, key, request_uri, http_status, error_code, bytes_sent, object_size, user_agent, version_id, authentication_type]
    - source_type: aws-storage-reader-and-job-inventory
      channel: IAM/session registry, object sensitivity, CMDB, and approved jobs
      required_fields: [principal_arn, role_session_name, client_or_job_id, owner, source_network, bucket_scope, prefix_scope, object_sensitivity, schedule, destination, valid_from, valid_to]
    observables: [s3_get_request, provider_delivered_object, querystring_or_anonymous_read, unexpected_role_or_origin, sensitive_object_fanout, successor_materialization_or_egress]
    correlation:
      window: CloudTrail-to-server-log join within 10m; read episode 30m; role, carrier, and job baseline 30d
      dimensions: [account_id, principal_arn, role_session_name, bucket_name, object_key, request_id, source_ip, user_agent, authentication_type, version_id, job_id, time]
    false_positives:
      zh: 批准备份/恢复、内容分发、数据湖查询、ETL、漏洞/恶意软件扫描、电子发现、对象迁移、灾备校验和客户预签名下载都会产生成功 GetObject 与高字节响应。
      en: Approved backup or restore, content delivery, data-lake queries, ETL, vulnerability or malware scanning, e-discovery, object migration, disaster-recovery validation, and customer presigned downloads all produce successful GetObject calls and nonzero responses.
    blind_spots:
      zh: CloudTrail 默认不记录对象 data events；server access log 需启用且尽力投递，可能延迟、缺失或重复。CloudTrail 的成功 GetObject 不保证包含 bytesTransferredOut，server log 的 BytesSent 也不证明客户端完整保存；预签名 URL 只能指向签名身份而不能识别实际持有者。
      en: CloudTrail does not record object data events by default. Server access logging requires enablement and is best effort, so records can be late, missing, or duplicated. A successful CloudTrail GetObject does not guarantee bytesTransferredOut, and server-log BytesSent does not prove complete client retention. A presigned URL can identify its signing identity without identifying the actual holder.
    tuning_guidance:
      zh: 先对一组测试 GetObject、Range GET、HeadObject、公开读取和预签名读取验证日志与成功分层，再按精确 role、bucket/prefix、source、user agent、作业 ID 和窗口建立例外；不得全局放行 backup role 或 aws-cli。
      en: First validate logging and success tiers with controlled GetObject, Range GET, HeadObject, public-read, and presigned-read tests. Define exceptions by exact role, bucket or prefix, origin, user agent, job ID, and window rather than globally allowing a backup role or aws-cli.
    evidence_keys: [REF-000513, REF-000524, REF-000538, REF-000541, T1530_REF_AWS_REQUEST_IDENTIFICATION]
  - temporary_key: T1530_NJA_AZURE_BLOB_CARRIER
    strategy_key: T1530_DET_OBJECT_DELIVERY_PROVENANCE
    name:
      zh: Azure Blob 成功读取与共享授权载体谱系
      en: Azure Blob Successful Read and Shared Authorization-Carrier Lineage
    platforms: [IaaS]
    logic:
      zh: >-
        对高价值 storage account 的 Blob 服务配置 diagnostic setting，将 StorageRead 资源日志送到独立 Log Analytics/Event Hub。筛选 OperationName=GetBlob 或等价正文读取，要求 StatusCode 为 200/206、StatusText 表示成功且 ResponseBodySize 大于零；以 AccountName、ObjectKey/Uri、RequestIdHeader/CorrelationId、TimeGenerated、CallerIpAddress 和 UserAgentHeader 形成 provider_delivered_blob。只见容器列举、GetBlobProperties、失败请求或控制面 listKeys 时分别保持 discovery、metadata、attempt 或 credential_capability。

        按 AuthenticationType 将 OAuth 与 AccountKey、SAS、Anonymous 分层。OAuth 路径连接 RequesterTenantId/ObjectId/AppId/Upn 与 Entra sign-in、RBAC 和批准工作负载；AccountKey/SAS/Anonymous 若缺 RequesterObjectId，则连接最近的 Microsoft.Storage/storageAccounts/listkeys/action、SAS/公开访问或 allowSharedKeyAccess/publicNetworkAccess 变化、来源网络与对象范围。对 Storm-0501 型序列，在一小时内出现 storageAccounts/write 或 listkeys 后从新公网来源以 AccountKey/SAS 大量读取敏感对象时提高优先级。正常 AzCopy、备份、迁移、恢复和 CDN 流量必须按 owner、job、目的地和时段排除。
      en: >-
        Configure a diagnostic setting for the Blob service on high-value storage accounts and route StorageRead resource logs to independent Log Analytics or Event Hub. Select OperationName=GetBlob or an equivalent body read and require StatusCode 200 or 206, successful StatusText, and ResponseBodySize greater than zero. Build provider_delivered_blob from AccountName, ObjectKey or Uri, RequestIdHeader or CorrelationId, TimeGenerated, CallerIpAddress, and UserAgentHeader. Container listing, GetBlobProperties, a failed request, or control-plane listKeys remains discovery, metadata, attempt, or credential_capability respectively.

        Separate OAuth from AccountKey, SAS, and Anonymous through AuthenticationType. Join OAuth to RequesterTenantId, RequesterObjectId, RequesterAppId, RequesterUpn, Entra sign-in, RBAC, and approved workload. When AccountKey, SAS, or Anonymous lacks RequesterObjectId, join recent Microsoft.Storage/storageAccounts/listkeys/action, SAS or public-access state, allowSharedKeyAccess or publicNetworkAccess changes, source network, and object scope. For a Storm-0501-like chain, raise priority when storageAccounts/write or listkeys is followed within one hour by high-volume sensitive-object reads through AccountKey or SAS from a new public origin. Exclude normal AzCopy, backup, migration, restore, and CDN traffic by owner, job, destination, and window.
    data_requirements:
    - source_type: azure-storagebloblogs
      channel: Azure Monitor resource logs, StorageBlobLogs via diagnostic setting
      required_fields: [TimeGenerated, AccountName, OperationName, AuthenticationType, RequesterTenantId, RequesterObjectId, RequesterAppId, RequesterUpn, AuthorizationDetails, CallerIpAddress, UserAgentHeader, ObjectKey, Uri, StatusCode, StatusText, ResponseBodySize, RequestIdHeader, CorrelationId, SasExpiryStatus]
    - source_type: azure-storage-control-and-identity
      channel: Azure Activity and Entra audit/sign-in logs plus storage configuration history
      required_fields: [timestamp, operation_name, result, actor_object_id, actor_tenant_id, subscription_id, storage_account_id, old_value, new_value, source_ip, correlation_id, role_assignment, allow_shared_key_access, public_network_access]
    - source_type: azure-approved-storage-work
      channel: CMDB, backup/migration/sync registry, sensitivity catalog
      required_fields: [storage_account_id, container_or_prefix, object_sensitivity, principal_or_key_owner, client_or_job_id, user_agent, source_network, destination, schedule, valid_from, valid_to]
    observables: [getblob_success_with_bytes, accountkey_sas_or_anonymous_auth, missing_requester_object, recent_listkeys_or_public_exposure, new_origin_sensitive_fanout]
    correlation:
      window: control or key event to reads 1h; read episode 30m; approved-work baseline 30d
      dimensions: [tenant_id, subscription_id, storage_account_id, requester_object_or_app_id, authentication_type, caller_ip, object_key, request_or_correlation_id, job_id, time]
    false_positives:
      zh: AzCopy 数据迁移、备份/恢复、媒体分发、静态网站、客户 SAS 下载、合法跨租户数据处理和应急取证均可形成相同成功读取；部分旧应用只能使用 Shared Key。
      en: AzCopy migration, backup or restore, media distribution, static websites, customer SAS downloads, legitimate cross-tenant processing, and incident-response forensics can produce the same successful reads. Some legacy applications can use only Shared Key.
    blind_spots:
      zh: Azure Blob 资源日志在 diagnostic setting 创建并路由前不被收集；Activity Log 不能替代数据面。日志把不同 SAS 都归为 SAS，AccountKey/SAS/Anonymous 可能没有实际人身份；ResponseBodySize 表示服务写出响应字节，不证明攻击者完整保留。
      en: Azure Blob resource logs are not collected until a diagnostic setting routes them, and Activity Log is not a data-plane substitute. Logs group different SAS types under SAS, AccountKey, SAS, or Anonymous can lack a human identity, and ResponseBodySize shows response bytes written by the service rather than complete adversary retention.
    tuning_guidance:
      zh: 用测试 OAuth、AccountKey、user-delegation SAS、service/account SAS、Range GetBlob 和匿名读验证 AuthenticationType、RequesterObjectId 与响应字段；例外必须绑定精确 storage account、container、source、client/job、有效期和 SAS policy，不按 AzCopy 名称全局放行。
      en: Validate AuthenticationType, RequesterObjectId, and response fields with controlled OAuth, AccountKey, user-delegation SAS, service or account SAS, Range GetBlob, and anonymous reads. Bind exceptions to exact storage account, container, origin, client or job, lifetime, and SAS policy rather than globally allowing AzCopy.
    evidence_keys: [REF-000539, T1530_REF_AZURE_BLOB_LOG_SCHEMA, REF-000530, T1530_REF_AZURE_SHARED_KEY_PREVENT, T1530_REF_AZURE_SAS_EXPIRY]
  - temporary_key: T1530_NJA_GCP_OBJECT_DELIVERY
    strategy_key: T1530_DET_OBJECT_DELIVERY_PROVENANCE
    name:
      zh: GCP 对象正文返回与公开/签名路径补偿关联
      en: GCP Object-Body Return and Public or Signed-Path Compensating Correlation
    platforms: [IaaS]
    logic:
      zh: >-
        对含敏感对象的项目显式启用 Cloud Storage Data Access DATA_READ，并另对需要公开或签名链接的桶配置 usage logs。把 audit log 的 protoPayload.methodName、resourceName、authenticationInfo.principalEmail、requestMetadata.callerIp/callerSuppliedUserAgent、authorizationInfo 和 status 作为身份/权限请求证据；由于对象 metadata 与 data read 均进入 DATA_READ，不单凭 storage.objects.get 权限名确认正文。以 usage log 的 cs_operation=GET_Object、sc_status=200/206、sc_bytes 大于零、cs_bucket/cs_object、cs_uri、cs_user_agent、c_ip 和 s_request_id 形成 provider_delivered_object，并按 request/object/time 与 audit 记录连接。

        对 Data Access 中可解析 principal 的读取，按 service account/user、来源和职责基线判断；对 public object，官方说明 Cloud Audit Logs 不记录访问，只能依赖 usage log、公开策略快照和对象敏感度。对 signed URL，连接 X-Goog-Credential/签名服务账户、签发工作流、到期和来源，但不把签名者等同实际持有者。对新来源、过期/过长链接、无批准门户记录、敏感对象扇出和前序 allUsers/public-access 变化提高风险；无 usage log 时只报告 audit_read_candidate 或 public_visibility_gap。
      en: >-
        Explicitly enable Cloud Storage Data Access DATA_READ for projects containing sensitive objects and separately configure usage logs for buckets that require public or signed-link access. Treat audit-log protoPayload.methodName, resourceName, authenticationInfo.principalEmail, requestMetadata.callerIp and callerSuppliedUserAgent, authorizationInfo, and status as identity and permission-request evidence. Because object metadata and data reads both enter DATA_READ, do not confirm a body from the storage.objects.get permission name alone. Build provider_delivered_object from usage-log cs_operation=GET_Object, sc_status 200 or 206, sc_bytes greater than zero, cs_bucket and cs_object, cs_uri, cs_user_agent, c_ip, and s_request_id, joining to audit records by request, object, and time.

        For reads with a resolvable Data Access principal, compare service account or user, origin, and duty baseline. Google states that public-object access is absent from Cloud Audit Logs, so public reads depend on usage logs, public-policy snapshots, and object sensitivity. For signed URLs, join X-Goog-Credential or signing service account, issuance workflow, expiry, and origin without treating the signer as the actual holder. Raise risk for a new origin, expired or excessive link lifetime, missing approved-portal record, sensitive-object fan-out, or preceding allUsers or public-access change. Without usage logs, emit only audit_read_candidate or public_visibility_gap.
    data_requirements:
    - source_type: gcp-cloud-storage-data-access
      channel: Cloud Audit Logs data_access with DATA_READ explicitly enabled
      required_fields: [timestamp, logName, protoPayload.serviceName, protoPayload.methodName, protoPayload.resourceName, protoPayload.authenticationInfo.principalEmail, protoPayload.requestMetadata.callerIp, protoPayload.requestMetadata.callerSuppliedUserAgent, protoPayload.authorizationInfo, protoPayload.status, insertId]
    - source_type: gcp-cloud-storage-usage-log
      channel: configured Cloud Storage usage logs
      required_fields: [time_micros, cs_operation, cs_bucket, cs_object, cs_uri, sc_status, sc_bytes, c_ip, cs_user_agent, s_request_id]
    - source_type: gcp-storage-policy-and-signer-inventory
      channel: IAM/public-access state, signer registry, approved download workflows, and sensitivity catalog
      required_fields: [project_id, bucket_name, object_or_prefix, visibility, public_access_prevention, signer_principal, signing_workflow_id, expiry, approved_audience_or_source, object_sensitivity, owner]
    observables: [data_read_candidate, get_object_success_with_bytes, public_read_without_audit_principal, signed_url_signer_holder_gap, new_origin_sensitive_fanout]
    correlation:
      window: audit-to-usage join 15m; read episode 30m; signer and public-policy history 30d
      dimensions: [project_id, bucket_name, object_name, principal_or_signer, source_ip, user_agent, request_id, signing_workflow_id, time]
    false_positives:
      zh: 静态网站、公开数据集、CDN/客户下载、临时签名链接、分析作业、备份/恢复、数据科学和合法 rsync 会产生同类读取。
      en: Static websites, public datasets, CDN or customer downloads, temporary signed links, analytics jobs, backup or restore, data science, and authorized rsync produce the same read shapes.
    blind_spots:
      zh: Data Access 默认关闭且公开对象访问不进入 Cloud Audit Logs；usage logs 需另行配置、按小时生成且完整性/及时性不保证。浏览器下载还可能对 principalEmail/callerIp 做脱敏；sc_bytes 只证明服务返回字节。
      en: Data Access is disabled by default, and public-object access does not enter Cloud Audit Logs. Usage logging requires separate setup, is generated hourly, and has no completeness or timeliness guarantee. Authenticated browser downloads can redact principalEmail and callerIp, and sc_bytes proves only that the service returned bytes.
    tuning_guidance:
      zh: 对敏感桶执行已认证 JSON/XML 下载、Range、signed URL 与 public object 测试，确认 audit 与 usage log 的实际字段和延迟。公开/签名例外绑定精确对象前缀、签名工作流、最长有效期、受众/来源和 owner，不能按 service account 或 GET_Object 全局抑制。
      en: Run authenticated JSON or XML downloads, Range requests, signed URLs, and public-object tests on sensitive buckets to verify actual audit and usage-log fields and latency. Bind public or signed exceptions to exact prefix, signing workflow, maximum lifetime, audience or origin, and owner rather than globally suppressing a service account or GET_Object.
    evidence_keys: [REF-000540, T1530_REF_GCP_USAGE_LOGS, T1530_REF_GCP_AUDIT_FORMAT, T1530_REF_GCP_SIGNED_URLS]
  - temporary_key: T1530_NJA_M365_CLOUD_DRIVE_DOWNLOAD
    strategy_key: T1530_DET_OBJECT_DELIVERY_PROVENANCE
    name:
      zh: Microsoft 365 云盘成功下载与客户端职责偏离
      en: Microsoft 365 Cloud-Drive Successful Download and Client-Duty Deviation
    platforms: [Office Suite, SaaS]
    logic:
      zh: >-
        从 Unified Audit Log/Management Activity API 提取 Workload=OneDrive/SharePoint 且 Operation=FileDownloaded 或 FileSyncDownloadedFull、ResultStatus=Succeeded 的事件，以 ObjectId 或 SiteUrl+SourceRelativeUrl+SourceFileName、UserId/UserType、ClientIP、UserAgent、CreationTime、CorrelationId、AppAccessContext.ClientAppId/Name/UniqueTokenId 构造 cloud_drive_content_returned。FileAccessed 与 FileAccessedExtended 仅作较弱的访问证据；后者可聚合同一人最长三小时的连续访问，不能按条数推断对象读取次数。

        对每个用户/应用/客户端按三十分钟聚合敏感对象、站点/云盘和扩展名，并同过去三十日职责站点、批准同步设备、备份/迁移/电子发现/合规工作流及工单比较。首次 PowerShell/脚本 user agent、陌生 ClientIP/地理、应用代理地址、职责外 OneDrive、短窗多敏感文件或同一身份紧邻异常登录时提高风险。若同时存在搜索事件，NJT-0143 可拥有 query-led 阶段；本分析只以成功下载确认 T1530 源读取。后继本地文件或外传可把结论提升为 confirmed_acquisition。
      en: >-
        Extract Workload=OneDrive or SharePoint with Operation=FileDownloaded or FileSyncDownloadedFull and ResultStatus=Succeeded from the Unified Audit Log or Management Activity API. Build cloud_drive_content_returned from ObjectId or SiteUrl plus SourceRelativeUrl and SourceFileName, UserId and UserType, ClientIP, UserAgent, CreationTime, CorrelationId, and AppAccessContext.ClientAppId, ClientAppName, and UniqueTokenId. Treat FileAccessed and FileAccessedExtended as weaker access evidence. FileAccessedExtended can aggregate continuing access by one person for up to three hours and cannot be counted as individual object reads.

        Aggregate sensitive objects, sites or drives, and extensions for thirty minutes by user, application, and client, then compare with the preceding thirty-day duty-site baseline, approved synchronization devices, backup, migration, e-discovery, or compliance workflows, and tickets. Raise risk for a first-seen PowerShell or scripted user agent, unfamiliar ClientIP or geography, proxy application address, out-of-duty OneDrive, short-window sensitive-file fan-out, or adjacent anomalous sign-in. When search events also exist, NJT-0143 can own the query-led stage; this analytic confirms only the T1530 source read through successful download. A later local file or exfiltration can raise the result to confirmed_acquisition.
    data_requirements:
    - source_type: microsoft365-cloud-drive-audit
      channel: Microsoft Purview Unified Audit Log or Office 365 Management Activity API
      required_fields: [CreationTime, Workload, Operation, ResultStatus, UserId, UserType, ClientIP, UserAgent, ObjectId, SiteUrl, SourceRelativeUrl, SourceFileName, SourceFileExtension, ItemType, CorrelationId, AppAccessContext.ClientAppId, AppAccessContext.ClientAppName, AppAccessContext.UniqueTokenId]
    - source_type: entra-signin-and-session
      channel: Microsoft Entra sign-in and risk telemetry
      required_fields: [timestamp, user_id, app_id, session_id, token_id, source_ip, device_id, location, authentication_result, risk_state]
    - source_type: m365-approved-reader-inventory
      channel: device management, app inventory, sync and compliance jobs, sensitivity labels
      required_fields: [user_or_app_id, device_id, client_app_id, user_agent, approved_sites_or_drives, object_sensitivity, workflow_or_job_id, owner, schedule, valid_from, valid_to]
    observables: [successful_file_download, successful_sync_download, first_seen_client_or_origin, out_of_duty_object, sensitive_object_fanout, adjacent_risky_signin]
    correlation:
      window: sign-in/session to downloads 8h; read episode 30m; user, app, and device baseline 30d
      dimensions: [tenant_id, user_id, user_type, app_or_client_id, token_or_session_id, client_ip, device_id, object_id, site_or_drive, workflow_id, time]
    false_positives:
      zh: OneDrive 正常同步、离线可用、迁移、备份、电子发现、合规导出、DLP/分类、用户换机和大量项目文件下载均可形成成功事件。
      en: Normal OneDrive synchronization, offline availability, migration, backup, e-discovery, compliance export, DLP or classification, device replacement, and large project downloads all produce successful events.
    blind_spots:
      zh: Audit Standard 仅对多数组织默认启用，保留和高带宽能力依许可不同；ClientIP 可是代表用户调用的受信应用地址，app@sharepoint 或 service principal 会替代人。FileAccessed 有抑制/聚合语义，FileDownloaded 仍不证明完整保留或恶意目的。
      en: Audit Standard is enabled by default only for most organizations, and retention and high-bandwidth access vary by licensing. ClientIP can identify a trusted application calling for the user, while app@sharepoint or a service principal can replace the person. FileAccessed has suppression or aggregation semantics, and FileDownloaded still does not prove complete retention or malicious purpose.
    tuning_guidance:
      zh: 先验证浏览器下载、Graph/PowerShell 下载、OneDrive full sync、按需文件与批准电子发现分别产生哪些 Operation 与 AppAccessContext 字段；例外绑定精确设备/app、站点、对象范围、工作流、owner 和有效期，保留来源或范围偏离。
      en: First validate which Operation and AppAccessContext fields appear for browser download, Graph or PowerShell download, OneDrive full sync, Files On-Demand, and approved e-discovery. Bind exceptions to exact device or application, site, object scope, workflow, owner, and validity while retaining origin or scope deviation.
    evidence_keys: [T1530_REF_MS365_ACTIVITY_SCHEMA, T1530_REF_MS365_AUDIT_ACTIVITIES, T1530_REF_MS365_AUDIT_SETUP, REF-000731]
  mitigations:
  - temporary_key: T1530_MIT_OBJECT_READ_AUTH_AUDIT
    name:
      zh: 云对象最小读取授权与成功返回问责
      en: Cloud Object Least Read Authorization and Successful-Return Accountability
    description:
      zh: >-
        以对象敏感度、业务职责和工作负载目的分别治理列举、正文读取、公开权限、密钥与 bearer link，并为高价值存储验证服务端成功返回日志。控制保留正常同步、备份、ETL、迁移、电子发现和管理员工作的 owner、主体、客户端、对象范围、目的地和有效期，使合法大范围读取不成为永久盲区。
      en: >-
        Govern listing, body reads, public permission, keys, and bearer links separately by object sensitivity, business duty, and workload purpose, and validate provider-side successful-return logging for high-value storage. Retain owner, principal, client, object scope, destination, and validity for normal synchronization, backup, ETL, migration, e-discovery, and administrative work so broad legitimate reads do not become permanent blind spots.
    measures:
    - key: least_object_body_read
      control_type: exposure-reduction
      description:
        zh: 将正文读取权限制到必要 account/project/tenant、container/drive、prefix/object 和时间；把 List/metadata 与 Get/download 权限分离，清理过宽 role、全账户 storage key 权限和无 owner 的云盘共享，并以独立敏感标签维护重点对象。
        en: Scope body-read authority to necessary account, project, or tenant; container or drive; prefix or object; and time. Separate List and metadata from Get and download, remove overbroad roles, full-account storage-key authority, and ownerless cloud-drive shares, and maintain priority objects through an independent sensitivity catalog.
    - key: identity_bound_access_and_bearer_guardrails
      control_type: preventive
      description:
        zh: 优先使用可撤销、可审计且受条件访问约束的 identity-bound 授权；对 Azure 在兼容时禁用 Shared Key 并使用最小范围 user-delegation SAS，对 AWS 保持 Block Public Access 并以 signatureAge、source network 与精确 object 约束预签名 URL，对 GCP 执行 Public Access Prevention 并限制签名者、方法、对象和有效期。载体必须有 owner、受众/来源、目的和到期。
        en: Prefer revocable, auditable, identity-bound authorization subject to conditional access. Disable Azure Shared Key where compatible and use minimally scoped user-delegation SAS; retain AWS Block Public Access and constrain presigned URLs by signatureAge, source network, and exact object; enforce GCP Public Access Prevention and restrict signer, method, object, and lifetime. Every carrier needs an owner, audience or origin, purpose, and expiry.
    - key: verified_data_plane_success_logging
      control_type: detective-support
      description:
        zh: 对高价值对象用受控 200/206 正文读取和失败/metadata 对照验证 AWS CloudTrail data events+server access log、Azure StorageBlobLogs、GCP DATA_READ+usage logs 与 M365 FileDownloaded/FileSyncDownloadedFull；监测配置漂移、路由失败、延迟、重复和保留，日志写入存储管理员不可修改的位置。
        en: Use controlled 200 or 206 body reads plus failed and metadata controls to validate AWS CloudTrail data events and server access logs, Azure StorageBlobLogs, GCP DATA_READ and usage logs, and Microsoft 365 FileDownloaded or FileSyncDownloadedFull on high-value objects. Monitor configuration drift, routing failure, delay, duplication, and retention, and write logs where storage administrators cannot modify them.
    - key: approved_reader_and_destination_registry
      control_type: governance
      description:
        zh: 登记同步、备份、恢复、ETL、分析、扫描、迁移、电子发现、DLP 和管理员读取的 principal/client、源网络、user agent、对象范围、调度、目的地、owner、工单与有效期；对 workload role、service principal、account key 和签名服务账户分别维护，不以“备份账号”全局放行。
        en: Register principal or client, source network, user agent, object scope, schedule, destination, owner, ticket, and validity for synchronization, backup, restore, ETL, analytics, scanning, migration, e-discovery, DLP, and administrative reads. Track workload roles, service principals, account keys, and signing service accounts separately rather than globally allowing a backup account.
    - key: carrier_exposure_response
      control_type: response
      description:
        zh: 发现公开权限、storage key、SAS 或签名 URL 异常后，先保全策略/ACL、签发、listKeys、数据面读取和目的地证据，再撤销链接/公开权限、轮换密钥、禁用 Shared Key 或签名主体并核查读取对象与响应字节。撤销只能阻止未来访问，不能证明此前未下载，应按对象敏感度处置潜在泄露。
        en: On abnormal public permission, storage key, SAS, or signed URL, preserve policy or ACL, issuance, listKeys, data-plane read, and destination evidence before revoking links or public permission, rotating keys, disabling Shared Key or signer, and assessing read objects and response bytes. Revocation blocks future access but cannot prove no prior download, so respond to potential exposure by object sensitivity.
    applications:
    - target_key: T1530_PARENT
      use:
        zh: 对匿迹型云存储内容获取，分别收紧对象正文权限和列举权限，对高价值存储验证成功内容返回日志，并把每次读取同批准主体/客户端、对象职责范围、来源和后继结果比较。
        en: For Stealth-Oriented Cloud Storage Content Acquisition, constrain object-body and listing permissions separately, validate successful-content-return logging on high-value storage, and compare each read with approved principal or client, duty-bound object scope, origin, and successor outcome.
      expected_effect:
        zh: 一个受陷身份可读取的对象集合缩小，且服务端实际返回内容会留下可验证状态、响应字节、主体/载体和对象谱系；攻击者须扩大权限、使用受控范围外载体或接受更多跨平面痕迹。
        en: The object set readable by one compromised identity shrinks, while provider-returned content leaves verifiable status, response bytes, principal or carrier, and object lineage. The adversary must broaden authority, use an out-of-policy carrier, or accept more cross-plane traces.
      limitations:
        zh: 已获批准且本来具有广泛读取权的备份、同步、管理员或分析主体被控后仍可取数；数据面日志有成本、容量、延迟和平台盲区，成功返回也不能追回数据或证明客户端完整保存。
        en: A compromised approved backup, synchronization, administrator, or analytics principal with broad read authority can still acquire data. Data-plane logs have cost, capacity, latency, and platform blind spots, and a successful return neither recalls data nor proves complete client retention.
    - target_key: T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED
      use:
        zh: 对消费主体解绑读取，默认阻止公开访问与共享账户密钥，bearer link 采用最小对象/动作、短到期、来源约束和可追溯签发工作流；把 public/key/SAS/signed 使用连接到服务端成功返回，并在撤销后按对象范围调查既往访问。
        en: For consumer-identity-decoupled retrieval, block public access and shared account keys by default, constrain bearer links to exact object and action, short expiry, source, and traceable issuance workflow, join public, key, SAS, or signed use to successful provider return, and investigate prior access by object scope after revocation.
      expected_effect:
        zh: 实际消费者更常被迫使用可解析且受条件访问约束的身份，必要 bearer 载体具有明确 owner、范围和到期；匿名或密钥型读取更容易表现为政策偏离并同签发/暴露事件关联。
        en: The actual consumer is more often forced to use a resolvable identity subject to conditional access, while necessary bearer carriers gain an owner, scope, and expiry. Anonymous or key-based reads become easier to identify as policy deviations and join to issuance or exposure events.
      limitations:
        zh: CDN、客户门户、软件分发、跨组织协作和旧式应用可能必须使用公开或 bearer 访问；来源 IP 可共享或被代理，签名者仍不等于持有者，短期链接在撤销前仍可复制完整内容。
        en: CDNs, customer portals, software distribution, cross-organization collaboration, and legacy applications can require public or bearer access. Source IP can be shared or proxied, the signer is still not the holder, and a short-lived link can copy complete content before revocation.
    evidence_keys: [REF-000513, REF-000538, REF-000541, REF-000539, T1530_REF_AZURE_BLOB_LOG_SCHEMA, REF-000540, T1530_REF_GCP_USAGE_LOGS, T1530_REF_MS365_ACTIVITY_SCHEMA, T1530_REF_AZURE_SHARED_KEY_PREVENT, T1530_REF_AZURE_SAS_EXPIRY, T1530_REF_AWS_PRESIGNED_URLS, T1530_REF_AWS_BLOCK_PUBLIC, T1530_REF_GCP_PUBLIC_ACCESS_PREVENTION]
