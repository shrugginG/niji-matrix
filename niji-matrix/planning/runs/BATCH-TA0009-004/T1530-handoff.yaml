  claims:
  - temporary_key: T1530_CLM_ADMISSION
    subject_keys: [T1530_PARENT]
    proposition:
      zh: T1530 只有在云存储服务实际返回对象正文，且读取路径、主体语境或授权载体改变防守观察时才符合匿迹矩阵准入；列举、权限或工具能力不足。
      en: T1530 enters the stealth matrix only when a cloud storage service actually returns an object body and the read path, principal context, or authorization carrier changes defender observation; listing, permission, or tool capability is insufficient.
    evidence_keys: [T1530_REF_ATTACK19, T1530_REF_DOJ_THOMPSON_CASE, REF-000530, REF-000731]
    evidence_mode: fixed_baseline_plus_incident_outcomes
    confidence: medium
  - temporary_key: T1530_CLM_OUTCOME_TIERS
    subject_keys: [T1530_PARENT]
    proposition:
      zh: List/Head/metadata、授权和 Get 能力分别停留在 discovery/capability；成功 200/206 加非零响应字节或成功 FileDownloaded 支持 provider-delivered，现场副本、磁盘落地或外传结果才支持 confirmed acquisition。
      en: List, Head, metadata, authorization, and Get capability remain discovery or capability. Successful 200 or 206 plus nonzero response bytes, or a successful FileDownloaded, supports provider-delivered content, while an incident copy, disk materialization, or exfiltration result supports confirmed acquisition.
    evidence_keys: [REF-000541, T1530_REF_AZURE_BLOB_LOG_SCHEMA, T1530_REF_GCP_USAGE_LOGS, T1530_REF_MS365_ACTIVITY_SCHEMA, T1530_REF_DOJ_THOMPSON_CASE]
    evidence_mode: official_field_semantics_plus_case_outcome
    confidence: high
  - temporary_key: T1530_CLM_AUDIT_DEFAULTS
    subject_keys: [T1530_PARENT]
    proposition:
      zh: S3 对象 data events 与 GCP Data Access 默认不启用，Azure Blob 资源日志在 diagnostic setting 路由前不收集，GCP 公开对象访问不进入 Cloud Audit Logs；M365 Audit Standard 对多数组织默认开启但仍有字段和聚合限制。
      en: S3 object data events and GCP Data Access are not enabled by default, Azure Blob resource logs are not collected before diagnostic routing, and GCP public-object access does not enter Cloud Audit Logs. Microsoft 365 Audit Standard is enabled by default for most organizations but retains field and aggregation limits.
    evidence_keys: [REF-000513, REF-000539, REF-000540, T1530_REF_GCP_AUDIT_FORMAT, T1530_REF_MS365_AUDIT_SETUP, T1530_REF_MS365_AUDIT_ACTIVITIES]
    evidence_mode: official_documentation
    confidence: high
  - temporary_key: T1530_CLM_CARRIER_CHILD
    subject_keys: [T1530_CHILD_CONSUMER_IDENTITY_DECOUPLED]
    proposition:
      zh: 公开权限、账户/共享密钥、SAS 与预签名/签名链接把对象读取权放入可转移载体，使服务可成功返回正文而不认证实际持有者的独立身份，留下不同于 identity-bound OAuth 的归因与防御要求。
      en: Public permission, an account or shared key, SAS, and presigned or signed links place object-read authority in a transferable carrier, allowing the service to return a body without authenticating the actual holder's independent identity and creating attribution and defense requirements distinct from identity-bound OAuth.
    evidence_keys: [REF-000530, T1530_REF_AZURE_SHARED_KEY_PREVENT, T1530_REF_AWS_PRESIGNED_URLS, T1530_REF_GCP_SIGNED_URLS, REF-000541, T1530_REF_AZURE_BLOB_LOG_SCHEMA]
