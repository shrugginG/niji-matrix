      zh: >-
        同一 Microsoft Storm-0501 来源已存在，但当前 locator/notes 只覆盖防护状态测绘。应扩展同一 Reference 的定位说明，加入 storageAccounts/write 开放网络、storageAccounts/listkeys/action 窃取账户密钥、AzCopy 外传完成及其结论边界；不得复制相同 URL。既有 CASE-000188 的中心事实是防护状态测绘，建议另建内容读取/外传 Case，而不是改变其语义身份。
      en: >-
        The same Microsoft Storm-0501 source already exists, but its current locator and notes cover only protection-state mapping. Extend that one Reference with storageAccounts/write network exposure, storageAccounts/listkeys/action account-key theft, completed AzCopy exfiltration, and conclusion limits rather than duplicating the URL. Existing CASE-000188 centers on protection-state mapping; create a separate content-read and exfiltration Case rather than changing its semantic identity.
  - existing_ref: REF-000731
    resolution: extend
    rationale:
      zh: >-
        同一 Mandiant APT42 来源当前仅定位仿冒登录与凭据结果。扩展 locator/notes 以覆盖 2022–2023 Microsoft 365 行动、OneDrive 浏览/下载到磁盘、内建功能/公开工具与匿名基础设施；保留“向仿冒 OneDrive 外传仅尝试且可能成功”的限定。既有 CASE-000238 是仿冒云登录页面，中心事实不同，需另建内容获取 Case。
      en: >-
        The same Mandiant APT42 source currently locates impersonated sign-in and credential outcomes only. Extend its locator and notes for the 2022–2023 Microsoft 365 operation, OneDrive browsing and download to disk, use of built-in features or public tools, and anonymized infrastructure. Preserve the qualification that transfer to a masquerading OneDrive was only attempted and possibly successful. Existing CASE-000238 concerns fake cloud sign-in pages and has different central facts, requiring a separate acquisition Case.
  notes:
    zh: >-
      REF-000513/524/538/541 可复用 AWS 对象数据事件、事件字段和 server access log 语义；REF-000539 可复用 Azure diagnostic 前提但不足以覆盖完整 StorageBlobLogs 字段，需新增字段表 Reference；REF-000540 可复用 GCP DATA_READ 默认关闭与公开访问例外，但 public/signed 成功字节需新增 usage-log 与 signed-URL Reference。MIT-000141、DET-000152/NJA-000160 聚焦对象列举，不能直接扩展为正文成功返回；DET-000148/NJA-000156 聚焦 T1119 跨轮自动读取，不能替代本候选逐次成功结果与授权载体谱系。MIT-000204 与 NJA-000284 管理跨账户 grant/访问，继续作为边界对象而非复用到本子项。
    en: >-
      REF-000513, REF-000524, REF-000538, and REF-000541 are reusable for AWS object data events, event fields, and server-access-log semantics. REF-000539 supplies the Azure diagnostic prerequisite but not the full StorageBlobLogs fields, requiring a new schema Reference. REF-000540 supplies GCP DATA_READ default-off and public-access exceptions, while public or signed successful-byte evidence requires new usage-log and signed-URL References. MIT-000141 and DET-000152 or NJA-000160 center on object listing and should not be stretched into body-return coverage. DET-000148 and NJA-000156 center on repeated T1119 passes and cannot replace per-read success and carrier lineage here. MIT-000204 and NJA-000284 own cross-account grants and access and remain boundary objects rather than being reused for this child.
