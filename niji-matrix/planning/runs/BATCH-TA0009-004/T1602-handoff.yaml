handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-004
work_item_ref: WORK-TA0009-T1602
temporary_key_prefix: T1602_
candidate:
  source_type: attack
  source_attack_id: T1602
  source_attack_version: "19.1"
  name:
    zh: 从配置存储库收集数据
    en: Data from Configuration Repository
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: 固定 ATT&CK Enterprise 19.1 工作簿将 T1602 列为 Collection 父技术并列出两个实现导向子项。NCSC 对 Jaguar Tooth 的逆向分析直接证明恶意程序执行 Cisco IOS 命令导出当前 running configuration，并将命令结果经 TFTP 外送；2025 年 CISA 等机构联合通告还记录网络设备配置从 provider script 输出或主动设备勘测与 TFTP 取得，并说明已收集配置可含弱散列或可逆口令。这些材料足以证明配置内容实际进入攻击者控制链，而不只是在认证、查询或枚举层停留，因此保留父行为。
        en: The fixed ATT&CK Enterprise 19.1 workbook places T1602 under Collection and lists two implementation-oriented children. NCSC's reverse engineering of Jaguar Tooth directly establishes that malware executed a Cisco IOS command to dump the current running configuration and exfiltrated command output over TFTP. A 2025 joint advisory led by CISA also reports acquisition of network-device configurations from provider-script output or active device survey and TFTP, and explains that collected configurations can contain weakly hashed or reversibly encoded passwords. This evidence establishes configuration content entering an attacker-controlled chain rather than stopping at authentication, a request, or enumeration, so the parent behavior is retained.
      - zh: Niji 需要适配父级，因为配置取得本身不天然匿迹。正式范围要求攻击者有意选择会改变防守观察的读取语境或副本位置，并把取得证明分为认证、请求、成功响应/返回量和配置内容导出四层。公开资料支持两个跨协议变量：借用正常配置管理/监控主体与来源取得内容，以及从已存在的归档、版本或 provider script 副本取得内容，使本次 Collection 不产生对应的实时设备读取。SNMP/MIB、完整导出、NETCONF、厂商或格式均不直接成为 NJS。
        en: >-
          Niji must adapt the parent because acquiring configuration is not inherently stealthy. Formal scope requires an attacker-selected retrieval context or replica location that changes defender observation, and it separates proof into authentication, request, successful response or returned quantity, and exported configuration content. Public evidence supports two cross-protocol variables: acquiring content through an ordinary configuration-management or monitoring principal and source, and acquiring content from an existing archive, version, or provider-script copy so the current Collection event creates no corresponding live-device read. SNMP/MIB, full dumps, NETCONF, vendors, and formats do not directly become NJS boundaries.
  scope_notes:
    zh: 直接对象是管理设备、网络或基础设施所用配置存储中的实际配置值、运行/启动配置、协议和拓扑参数或历史副本。仅认证成功、进入管理会话、发送查询、看到对象名称或列举设备属于前提、尝试或 Discovery；只有成功响应中返回可用配置值，或可验证导出/副本内容进入攻击者控制链，才完成本 Collection。T1213 管理一般协作、代码和业务信息库，T1530 管理通用云对象存储访问，NJT-0086 管理持久云应用授权，NJT-0135 管理跨轮自动化和检查点，NJT-0134/T1560 管理取得后的暂存和归档。合法 NMS 轮询、RANCID 或同类备份、灾备校验、合规扫描、故障排除和厂商支持均为反例。
    en: The direct object is actual configuration values, running or startup configuration, protocol and topology parameters, or historical copies from a repository used to manage devices, networks, or infrastructure. Successful authentication, entering a management session, sending a query, seeing object names, or enumerating devices is a prerequisite, attempt, or Discovery. This Collection behavior completes only when a successful response returns usable configuration values or verifiable export or replica content enters an attacker-controlled chain. T1213 owns general collaboration, code, and business repositories; T1530 owns generic cloud-object access; NJT-0086 owns durable cloud-app authorization; NJT-0135 owns cross-pass automation and checkpoints; and NJT-0134 or T1560 owns later staging and archiving. Legitimate NMS polling, RANCID or equivalent backup, disaster-recovery validation, compliance scans, troubleshooting, and vendor support are counter-examples.
proposed_content:
  temporary_key: T1602_PARENT
  name:
    zh: 匿迹型配置存储库收集
    en: Stealth-Oriented Configuration Repository Collection
  summary:
    zh: 攻击者取得设备或基础设施配置内容，并借受信管理语境或既有配置副本改变本次读取的主体归因和观察位置，使只看异常登录、实时设备命令或大规模导出的防守方难以确认收集。
    en: An adversary acquires device or infrastructure configuration content while using a trusted management context or a preexisting configuration copy to change attribution and the observation location of the read, frustrating defenders who inspect only anomalous logins, live-device commands, or bulk exports.
  definition_and_concept:
    paragraphs:
      - zh: 匿迹型配置存储库收集，是攻击者在已取得设备、管理系统、配置归档或相关身份访问能力后，从运行配置、启动配置、管理数据库、MIB/YANG 数据视图、自动化输出、备份或版本历史中取得实际配置内容，并有意选择使读取与正常管理活动难分或落到另一观察面的路径。配置内容可以包含接口、路由、访问控制、管理端点、协议参数、账户或凭据材料；其语义是设备或基础设施管理状态，而非文件扩展名或承载产品。
        en: Stealth-Oriented Configuration Repository Collection occurs after an adversary gains access to a device, management system, configuration archive, or relevant identity and acquires actual configuration content from running or startup configuration, a management database, a MIB or YANG data view, automation output, backup, or version history. The actor deliberately chooses a path that resembles ordinary management work or places the read on another observation surface. Content can include interfaces, routes, access controls, management endpoints, protocol parameters, accounts, or credential material. Its identity comes from device or infrastructure management state rather than a file extension or hosting product.
      - zh: 完成条件是内容结果而不是操作意图。认证成功仅证明主体进入，CLI、SNMP、NETCONF、RESTCONF、Smart Install 或文件请求仅证明尝试；无错误响应和返回字节证明服务端给出数据候选，但只有能解析的配置值、配置文件、保存的命令输出、对象版本或内容哈希与目标配置相符时，才可高置信度声明实际取得。Jaguar Tooth 的 running configuration 命令与外送结果满足该门槛；只观察到 SNMPwalk、get-config 或 copy 命令但没有响应/产物时不得越级。
        en: Completion depends on the content outcome rather than operational intent. Successful authentication proves entry only; a CLI, SNMP, NETCONF, RESTCONF, Smart Install, or file request proves an attempt. An error-free response and returned bytes establish a candidate server response, but high-confidence acquisition requires parseable configuration values, a configuration file, saved command output, an object version, or a content hash matching target configuration. Jaguar Tooth's running-configuration command and exfiltrated results meet this threshold. An observed SNMPwalk, get-config, or copy command without a response or artifact does not.
  stealth_characteristics:
    paragraphs:
      - zh: 当恶意读取由正常监控或配置归档主体、批准的管理来源和常用协议发起时，设备端仍会留下认证、请求和响应，却与例行轮询、备份或合规采集共享主体及网络路径。恶意性转移到“该作业是否获批、目标设备和对象是否在职责范围、实际返回是否符合任务”这些跨系统问题；把服务账户或管理网段整体列入白名单会抹掉差异。联合通告直接证明行为者使用配置归档服务凭据、既有监控工具及配置内容，未测量告警率，因此匿迹收益以中等置信度表达。
        en: >-
          When malicious reads originate from an ordinary monitoring or configuration-archive principal, approved manager source, and familiar protocol, the device still records authentication, request, and response but shares principal and network path with routine polling, backup, or compliance collection. Maliciousness moves to cross-system questions: whether the job was approved, whether devices and objects fell within assigned scope, and whether returned results matched the task. Globally allowlisting a service account or management subnet erases those differences. The joint advisory directly establishes use of configuration-archive credentials, existing monitoring tools, and configuration content but does not measure alert rates, so the stealth effect carries medium confidence.
      - zh: 从既有配置副本、版本历史或 provider script 输出取得内容时，本次恶意读取发生在配置管理服务器、文件系统或版本库；目标设备没有同时间的 show/get/export，设备侧只保留更早的合法备份采集。这不是无痕：副本存储会留下文件读取、clone/checkout/download、会话和返回字节，历史采集也能解释副本来源。若防守只保留设备 AAA 或命令记账，不连接副本对象与读取者，就会把当前取得误判为没有发生。
        en: >-
          When content comes from an existing configuration copy, version history, or provider-script output, the current malicious read occurs on a configuration-management server, filesystem, or version repository. The target device has no contemporaneous show, get, or export operation and retains only an earlier legitimate backup collection. This is not traceless: replica storage can expose file reads, clone, checkout, or download events, sessions, and returned bytes, while historical collection records explain replica provenance. A defender retaining only device AAA or command accounting and not joining replica objects to readers can mistake the current acquisition for no event.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入能证明配置内容成功返回或被读出的事件，并要求至少一个攻击者可控变量改变观察：管理主体/来源语境与正常作业重叠，或本次读取转到既有副本面。配置位于本地磁盘、版本库、云对象存储还是 NMS 数据库不单独决定分类；若对象的主要功能是设备或基础设施配置，T1602 负责内容来源，云存储访问路径可在确有独立行为时并列 T1530。一般文档、CRM、代码和聊天内容归 T1213，操作系统上偶然存在的普通本地配置文件若并非管理存储则按 T1005 评估。
        en: >-
          Include events that prove configuration content was successfully returned or read and require at least one attacker-controlled variable that changes observation: management principal or source context overlaps a normal job, or the current read moves to a preexisting replica plane. Local disk, version control, cloud object storage, or an NMS database does not independently determine classification. When an object's primary function is device or infrastructure configuration, T1602 owns the content source; a cloud-storage access path may be co-classified as T1530 when it has independent behavioral relevance. General documents, CRM, code, and chat belong to T1213, while ordinary local configuration files that are not part of a management repository should be evaluated under T1005.
      - zh: 排除仅探测 SNMP 服务、列举设备或 OID、查看路由器型号、获得凭据、登录管理会话、发送失败命令和只证明导出能力的事件；这些分别属于 Discovery、Credential Access、Remote Services/管理会话或未完成企图。按计划重复取得配置或只取变化版本可并列 NJT-0135；成功内容随后集中写入、压缩、加密或外送分别属于 T1074、T1560 和后续战术。修改配置、清理日志或关闭审计不是本 Collection 的定义，即使同一入侵中出现。
        en: Exclude merely probing SNMP, listing devices or OIDs, viewing a router model, obtaining credentials, entering a management session, sending a failed command, or showing only export capability. Those are Discovery, Credential Access, Remote Services or management-session activity, or incomplete attempts. Scheduled repeated acquisition or change-only retrieval can be co-classified with NJT-0135. Writing acquired content to one location, compressing or encrypting it, and sending it out belong to T1074, T1560, and later tactics. Configuration modification, log clearing, and audit disabling do not define this Collection behavior even when present in the same intrusion.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在受侵网络设备上，攻击者可经 CLI、SNMP、管理 API 或原生导出功能取得 running/startup configuration、路由、接口、MPLS、AAA 或访问控制内容。Jaguar Tooth 自动执行包含 running configuration 导出的命令并外送结果；联合通告中的行为者还从设备勘测、TFTP、provider script 输出和监控工具取得配置。协议只是入口，正式判断必须保留成功响应或内容产物以及与目标设备的连接。
          en: On a compromised network device, an adversary can use CLI, SNMP, a management API, or native export functionality to acquire running or startup configuration, routes, interfaces, MPLS, AAA, or access-control content. Jaguar Tooth automatically executed commands including a running-configuration dump and exfiltrated results. Actors in the joint advisory also acquired configurations through device survey, TFTP, provider-script output, and monitoring tools. Protocol is only an entry path; formal classification needs a successful response or content artifact linked to the target device.
        - zh: 在配置归档环境中，攻击者可能控制用于 RANCID 或同类作业的服务凭据，让目标设备把读取视为正常备份，也可能直接读取该系统已经提交到 Git/CVS/SVN 或备份目录的版本。前者在设备与 NMS 两侧都有当前事务但归因模糊，后者的当前事务只在副本存储面。合法备份、变更审核、灾备恢复、合规扫描和厂商故障排除会产生相同基础形态，必须通过任务、设备范围、对象范围、操作员和内容去向消歧。
          en: In a configuration-archive environment, an adversary may control service credentials used by RANCID or an equivalent job so the target device sees an ordinary backup read, or may directly read versions already committed to Git, CVS, SVN, or a backup directory. The first path creates a current transaction on device and NMS but weakens attribution; the second creates the current transaction only on replica storage. Legitimate backup, change review, disaster recovery, compliance scanning, and vendor troubleshooting have the same basic shape and require task, device scope, object scope, operator, and content destination to distinguish them.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者至少需要能成功读取配置值或副本的权限，以及把返回内容保存、解析或发送到其控制链的能力。受信管理语境路径还要求获得或劫持 NMS/备份主体、批准来源或运行作业；既有副本路径要求访问保存配置的主机、版本库或存储对象。攻击者可选择设备、配置视图、版本和时机，却受最小 MIB/YANG 视图、管理平面 ACL、强认证、作业范围和副本权限限制。只读权限不会消除泄露风险，但不能支持配置修改结论。
            en: The adversary needs permission that successfully reads configuration values or copies and a way to save, parse, or move returned content into an attacker-controlled chain. The trusted-management-context path additionally requires access to or control of an NMS or backup principal, approved source, or running job. The preexisting-copy path requires access to the host, version repository, or storage object that holds configuration. The actor can choose devices, configuration views, versions, and timing but is constrained by least-privilege MIB or YANG views, management-plane ACLs, strong authentication, job scope, and replica permissions. Read-only authority still permits disclosure but does not support a configuration-modification conclusion.
      defender_model:
        paragraphs:
          - zh: 防守方理想上同时拥有网络设备认证与 AAA、管理请求和完成状态、响应值数量或字节、NMS/备份作业清单、版本库/文件读取、对象与版本标识、配置敏感性和批准工单。现实中 CLI 命令记账可能不覆盖 NETCONF/XML/gRPC，SNMPv3 authPriv 与 NETCONF/SSH 会加密内容，部分设备只记录写操作，服务账户又可能共享；因此流量或认证不能单独证明内容取得。部署分析前必须验证每一通道能否给出主体、目标、请求、成功结果和对象键，并把缺失层级显式降级。
            en: Ideally, defenders have network-device authentication and AAA, management request and completion status, returned value count or bytes, NMS or backup job inventory, repository or file reads, object and version identifiers, configuration sensitivity, and approved work orders. In practice, CLI command accounting may not cover NETCONF, XML, or gRPC; SNMPv3 authPriv and NETCONF over SSH encrypt content; some devices log writes rather than reads; and service accounts may be shared. Traffic or authentication alone therefore cannot prove acquisition. Before deployment, an analytic must validate whether every channel supplies principal, target, request, successful result, and object key, explicitly downgrading when a layer is absent.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 借用已批准管理主体与来源使恶意配置读取呈现例行作业外观
        en: Borrow approved management principals and sources so malicious configuration reads resemble routine jobs
      analysis:
        paragraphs:
          - zh: 攻击者使用配置归档/监控服务凭据或控制既有管理工具，从常用管理来源对职责内外设备读取配置。设备侧可见身份、来源、协议和命令类型均与例行备份或轮询重叠，使只按未知账户、外部 IP 或失败认证分类的检测难以把恶意事务分离。作业 ID、批准范围、请求对象、成功返回和后继内容去向仍能恢复差异；联合通告直接证明这些主体与工具被使用，却没有给出告警命中率，故为 medium。
            en: The adversary uses configuration-archive or monitoring-service credentials, or controls an existing management tool, to read configuration from in-scope or out-of-scope devices through a familiar manager source. Device-visible identity, source, protocol, and command type overlap routine backup or polling, making rules based on unknown accounts, external IPs, or failed authentication poor classifiers. Job ID, approved scope, requested objects, successful return, and downstream content destination can still recover the difference. The joint advisory directly establishes use of these principals and tools but supplies no alert rate, so confidence is medium.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID]
      confidence: medium
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 从既有配置副本读取使当前 Collection 落在实时设备审计之外
        en: Read preexisting configuration copies so current Collection falls outside live-device audit
      analysis:
        paragraphs:
          - zh: 配置归档或 provider script 先在合法流程中把设备内容写到配置管理服务器、版本库或备份目录，攻击者稍后直接读取该副本。本次 Collection 不触发目标设备的 show、get-config、SNMP GET 或 export；若防守只查询设备 AAA 与命令日志，关键读取位于监控范围之外。副本对象、版本控制访问、文件读取和返回字节仍存在，连接历史采集与当前读取即可恢复链。CISA 直接证明从既有 provider 输出取得配置，Cisco 与 RANCID 文档证明副本/版本结构；告警差异为条件推断，因此为 medium。
            en: A legitimate configuration archive or provider script first writes device content to a configuration-management server, version repository, or backup directory, and the adversary later reads that copy directly. The current Collection event triggers no show, get-config, SNMP GET, or export on the target device; a defender querying only device AAA and command logs leaves the critical read outside coverage. Replica objects, version-control access, file reads, and returned bytes remain, and joining historical collection to current access restores the chain. CISA directly establishes acquisition from existing provider output, while Cisco and RANCID documentation establish the replica and version structure. Alert impact remains conditional, so confidence is medium.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_CISCO_VERSIONING, T1602_REF_RANCID]
      confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
        - zh: 建议两个 Niji 原生子项。受信管理语境配置取得按“本次读取是否由正常管理主体、批准来源或例行作业承载”划分，设备仍有当前读取但恶意归因需要跨 NMS 作业恢复；既有配置副本取得按“本次读取是否直接作用于此前生成的副本而不访问实时设备”划分，观察面转移到归档/版本存储。一个事件若先借正常作业生成新副本、再从副本读取，可以同时命中两个子项，但必须分别证明实时取得和副本读取结果。
          en: Two Niji-native children are proposed. Trusted-Management-Context Configuration Retrieval varies whether an ordinary management principal, approved source, or routine job carries the current read. The device still has a current transaction, but malicious attribution requires an NMS-job join. Preexisting Configuration-Copy Retrieval varies whether the current read targets a previously produced copy without accessing the live device, moving observation to archive or version storage. An event that first uses a routine job to create a fresh copy and then reads that copy can meet both children only when live acquisition and replica-read outcomes are independently proven.
        - zh: ATT&CK 的 SNMP/MIB 与网络设备配置导出仅为广度背景。SNMP、NETCONF、RESTCONF、CLI、TFTP、厂商、设备类型、running/startup、MIB/YANG 和配置格式均不得成为兄弟项。选择性配置投影和接口审计错位具有研究价值，但缺少同一事件中“过滤/接口选择—实际内容返回—防守观察差”的结论证据；分散或低频查询还与 NJT-0135 自动收集状态轴相邻，均暂不正式化。
          en: ATT&CK's SNMP/MIB and network-device configuration-dump children are breadth context only. SNMP, NETCONF, RESTCONF, CLI, TFTP, vendor, device type, running versus startup state, MIB or YANG, and configuration format cannot define siblings. Selective configuration projection and interface-audit mismatch are useful research leads but lack conclusion-level evidence joining filter or interface choice, actual returned content, and a defender-observation difference in one incident. Distributed or low-rate querying also borders NJT-0135's automated-collection state axis and remains deferred.
    proposed_child_keys: [T1602_CHILD_TRUSTED_CONTEXT, T1602_CHILD_PREEXISTING_COPY]
  evidence_keys:
    - REF-000625
    - REF-000792
    - T1602_REF_NCSC_JAGUAR
    - T1602_REF_RANCID
    - T1602_REF_CISCO_VERSIONING
    - T1602_REF_CISCO_COMMAND_ACCOUNTING
    - T1602_REF_CISCO_SNMP
    - T1602_REF_RFC6241
    - T1602_REF_RFC3416
  defense_strategy_keys: [T1602_DET_ACQUISITION_OUTCOME]
  mitigation_keys: [T1602_MIT_READ_PLANE]
  limitations:
    paragraphs:
      - zh: Jaguar Tooth 对 running configuration 命令及外送结果提供强结论级证据；联合通告对配置文件、provider script 输出、服务/自动化凭据和监控工具提供高可信聚合观察，但没有说明这些事实是否都来自同一受害者或同一事务，也未公开逐次响应内容、字节数和告警结果。因此父级实际取得为 high，两个匿迹变量及其机理为 medium，不能宣称所有 RANCID、SNMP 或 TFTP 活动均成功泄露配置。
        en: Jaguar Tooth provides strong conclusion-level evidence for a running-configuration command and exfiltrated results. The joint advisory provides high-credibility aggregated observations of configuration files, provider-script output, service or automation credentials, and monitoring tools, but does not say all facts came from one victim or transaction and does not publish per-request response content, byte counts, or alert outcomes. Actual parent acquisition is therefore high confidence, while the two stealth variables and mechanisms are medium. The draft cannot claim every RANCID, SNMP, or TFTP event successfully disclosed configuration.
      - zh: 配置读取遥测高度依赖平台与启用项。RFC 定义的成功响应说明协议语义，不保证企业传感器能看到解密值；Cisco 的命令记账缺口说明特定产品观察面，不应外推到所有厂商和版本。配置副本可能含凭据、拓扑和客户信息，测试与内容验证须采用脱敏样本并限制访问；没有内容级验证时只能输出响应候选或异常读取，不能把返回字节自动解释为目标配置。
        en: Configuration-read telemetry depends heavily on platform and enabled controls. Successful responses defined by RFCs establish protocol semantics but do not guarantee that an enterprise sensor sees decrypted values. Cisco's command-accounting gap establishes one product observation boundary and should not be generalized to every vendor and release. Configuration copies can contain credentials, topology, and customer data; testing and content validation should use redacted samples with restricted access. Without content-level validation, analytics can report a response candidate or anomalous read but cannot automatically interpret returned bytes as target configuration.
proposed_subtechniques:
  - temporary_key: T1602_CHILD_TRUSTED_CONTEXT
    formalization_recommendation: proposed-formal
    name:
      zh: 受信管理语境配置取得
      en: Trusted-Management-Context Configuration Retrieval
    summary:
      zh: 攻击者让配置读取由已登记的监控、配置归档或自动化主体及批准管理来源承载，使实际返回内容与正常轮询或备份共享身份和网络外观。
      en: An adversary has a registered monitoring, configuration-archive, or automation principal and approved manager source carry configuration reads, making actual returned content share identity and network appearance with ordinary polling or backup.
    definition_and_concept:
      paragraphs:
        - zh: 受信管理语境配置取得的稳定变量，是本次配置内容读取由组织已认可的管理主体、管理节点或例行作业语境发起，而攻击者控制了该主体、委派会话、任务参数或工具执行。子项要求证明管理请求得到成功响应并返回实际配置值或文件；仅偷到服务账户、从管理网段登录、启动 RANCID/NMS 或发出失败命令，都只证明暴露与企图。
          en: Trusted-Management-Context Configuration Retrieval varies whether the current configuration-content read originates from an organization-recognized management principal, manager node, or routine job context whose principal, delegated session, task parameters, or tool execution is controlled by the adversary. The child requires a management request that succeeds and returns actual configuration values or a file. Stealing a service account, logging in from a management subnet, starting RANCID or an NMS, or sending a failed command establishes exposure or attempt only.
        - zh: 语境可以是只读监控用户、配置归档服务身份、已批准 NMS 来源或合法备份作业内的额外目标，但协议与厂商不构成身份。攻击者若创建新的未知管理员或从外部地址直接导出配置，仍可归父级，却不满足本子项；若其建立持久云应用授权，应另评 NJT-0086，若按检查点重复取值则另评 NJT-0135。
          en: Context may be a read-only monitoring user, configuration-archive service identity, approved NMS source, or additional target inserted into a legitimate backup job, but protocol and vendor do not define the child. An adversary who creates an unknown administrator or exports configuration directly from an external address can remain at parent scope but does not meet this child. A durable cloud-app grant needs separate NJT-0086 assessment, and checkpointed repeated retrieval needs separate NJT-0135 assessment.
    stealth_characteristics:
      paragraphs:
        - zh: 该子项不会删除认证或配置读取痕迹，而是让其关键外观与正常任务一致：同一 service principal、同一管理主机、同一端口或 RPC、相似的读取对象和时间。若检测把这些特征当作永久可信，实际配置返回会被普通作业覆盖；需要把设备侧请求与 NMS job_id、操作员、工单、设备清单、允许对象集合和响应结果连接，才能识别职责外读取。
          en: This child does not remove authentication or configuration-read traces. It makes their key appearance match ordinary work through the same service principal, manager host, port or RPC, and similar object set or timing. If detection treats these features as permanently trusted, actual configuration returns disappear into routine jobs. Defenders must join device-side requests to NMS job ID, operator, work order, device inventory, allowed object set, and response outcome to identify out-of-duty reads.
        - zh: CISA 联合通告直接记录行为者使用配置归档系统（如 RANCID）的服务/自动化凭据访问其他网络设备，并使用环境内监控工具观察配置变化；同一通告也记录配置文件被取得。该来源是多事件聚合，不能断言每次凭据使用都取得配置，亦没有测量告警下降。因此正式案例只能在找到同主体、目标、成功返回或配置产物时归入子项。
          en: The joint CISA advisory directly reports actors using service or automation credentials from configuration-archive systems such as RANCID to access other network devices and using monitoring tools already present to observe configuration changes. The same advisory reports acquired configuration files. Because it aggregates multiple incidents, it does not show that every use of those credentials yielded configuration or measure alert reduction. A formal case qualifies for this child only when the same principal, target, and successful return or configuration artifact can be joined.
    scope_boundary_definition:
      paragraphs:
        - zh: 纳入经已认可管理身份或来源成功返回的配置内容，并要求任务授权、设备范围、对象范围或实际运行者至少一项与正常基线不符。排除只证明身份被盗但没有配置结果、合法 NMS 轮询/备份、经批准的应急排障和合规导出。SNMP read-only、NETCONF get-config、CLI show 或 REST API 均可承载本变量，但任何协议名称都不足以分类。
          en: Include configuration content successfully returned through a recognized management identity or source when at least one of job authorization, device scope, object scope, or actual operator differs from the normal baseline. Exclude a stolen identity without a configuration result, legitimate NMS polling or backup, approved emergency troubleshooting, and compliance export. SNMP read-only access, NETCONF get-config, CLI show, or a REST API can carry the variable, but no protocol name is sufficient for classification.
        - zh: 如果攻击者只读取归档系统中已存在的配置文件且没有对设备发起当前管理请求，应归 T1602_CHILD_PREEXISTING_COPY；若合法管理作业被控制并生成新副本，随后攻击者又读取该副本，可以在分别验证两次成功结果后同时标注。配置修改、SNMP SET 和日志关闭属于其他行为，不能用来补足本子项的内容取得证据。
          en: If an adversary reads an existing configuration file in the archive system without a current management request to the device, classify T1602_CHILD_PREEXISTING_COPY. If a controlled legitimate job creates a new copy and the adversary later reads that copy, both children may apply only after separately validating the two successful outcomes. Configuration modification, SNMP SET, and logging disablement are different behaviors and cannot substitute for content-acquisition evidence.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 攻击者取得配置备份服务账户后，从组织正常使用的管理节点登录一组路由器，让备份或监控工具读取比批准清单更广的 running configuration、路由、接口或 AAA 参数。设备看到熟悉来源和只读身份，配置管理平台则可能看到作业外设备、额外命令或不匹配工单。只有请求成功且结果保存到作业输出、客户端缓存或后继文件，才认定 Collection 完成。
            en: After gaining a configuration-backup service account, an adversary uses the organization's normal manager node to log into routers and has backup or monitoring tooling read running configuration, routes, interfaces, or AAA parameters beyond the approved inventory. Devices see a familiar source and read-only identity, while the management platform may expose out-of-job devices, extra commands, or no matching work order. Collection completes only when requests succeed and results are saved in job output, client cache, or a downstream file.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需控制一个已登记管理主体或其执行环境，了解正常设备范围、作业节奏和读取接口，并具有足以返回目标配置的 read view。其可以利用共享服务账户和固定管理地址弱化归因，但增加异常目标、额外对象或过大返回会暴露；严格的每作业凭据、设备清单、MIB/YANG 视图和双人审批会压缩空间。
              en: The adversary must control a registered management principal or execution environment, understand normal device scope, job cadence, and retrieval interface, and possess a read view that returns target configuration. Shared service accounts and fixed manager addresses weaken attribution, but extra targets, additional objects, or excessive returns can expose the operation. Per-job credentials, device inventory, MIB or YANG views, and two-person approval constrain it.
        defender_model:
          paragraphs:
            - zh: 防守方不能把管理网段或服务主体整体放行，而需获得每次 NMS/备份作业的 job_id、发起人、审批、设备与对象集合，并连接设备认证、RPC/命令、完成状态、返回量和结果保存。若产品只记登录或写操作，防守只能报告职责偏离的可疑会话；没有成功响应或配置产物时不能确认本子项。
              en: Defenders cannot globally allowlist the management subnet or service principal. They need each NMS or backup job's job ID, initiator, approval, device and object scope joined to device authentication, RPC or command, completion status, returned quantity, and result storage. If a product records only login or writes, defenders can report a suspicious out-of-duty session but cannot confirm this child without a successful response or configuration artifact.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 以正常管理主体和作业外观承载未经授权的配置返回
          en: Carry unauthorized configuration returns under an ordinary management principal and job appearance
        analysis:
          paragraphs:
            - zh: 已批准的监控/归档身份和管理节点发起真实配置请求，返回内容进入攻击者控制的作业或会话。认证、来源和协议特征与正常备份相同，恶意实体借用了合法管理任务的外观，形成 NM-FD；作业范围、请求对象、响应量和结果去向仍是区分点。CISA 对凭据、工具及配置目标给出直接观察，但事务级连接与检出率未公开，故为 medium。
              en: An approved monitoring or archive identity and manager node issue real configuration requests, and returned content enters an adversary-controlled job or session. Authentication, source, and protocol features match ordinary backup, so the malicious entity borrows a legitimate management task's appearance and creates NM-FD. Job scope, requested objects, response quantity, and result destination remain discriminators. CISA directly observes credentials, tools, and configuration targets but does not publish transaction-level joins or detection rates, leaving confidence medium.
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID]
        confidence: medium
    evidence_keys: [REF-000792, T1602_REF_RANCID, T1602_REF_RFC6241, T1602_REF_RFC3416]
    defense_strategy_keys: [T1602_DET_ACQUISITION_OUTCOME]
    mitigation_keys: [T1602_MIT_READ_PLANE]
    limitations:
      paragraphs:
        - zh: 公开通告把服务/自动化凭据、监控工具和配置取得列为同类行动中的已观察行为，却没有发布同一请求的主体、命令、响应与保存产物。该子项因此需要组织内日志或取证补足事务级证据；仅凭“RANCID 账户被使用”不得写成配置已取得或成功混入正常备份。
          en: Public reporting lists service or automation credentials, monitoring tools, and configuration acquisition among observed activity, but does not publish principal, command, response, and saved artifact for one request. The child therefore needs transaction-level evidence from organizational logs or forensics. Use of a RANCID account alone cannot be written as acquired configuration or successful blending with normal backup.
  - temporary_key: T1602_CHILD_PREEXISTING_COPY
    formalization_recommendation: proposed-formal
    name:
      zh: 既有配置副本取得
      en: Preexisting Configuration-Copy Retrieval
    summary:
      zh: 攻击者读取此前由备份、归档或 provider script 生成的配置副本或历史版本，使本次内容取得发生在副本存储面而没有对应的实时设备配置请求。
      en: An adversary reads a configuration copy or historical version previously produced by backup, archiving, or a provider script, so current content acquisition occurs on replica storage without a corresponding live-device configuration request.
    definition_and_concept:
      paragraphs:
        - zh: 既有配置副本取得的稳定变量，是攻击者把已经存在于配置管理服务器、版本库、备份目录、对象存储或 provider script 输出中的副本作为当前内容源，而不是向目标设备实时读取。副本必须能解析到特定设备、配置类型或版本，并证明读取、checkout、clone、download 或文件打开成功返回了内容；仅列目录、看到版本号或发现备份位置属于 Discovery。
          en: Preexisting Configuration-Copy Retrieval varies whether an adversary uses a copy already present on a configuration-management server, version repository, backup directory, object store, or provider-script output as the current content source rather than reading the live target device. The copy must resolve to a device, configuration type, or version, and a successful read, checkout, clone, download, or file open must return content. Listing a directory, seeing a version number, or discovering a backup location is Discovery only.
        - zh: “既有”指本次攻击者读取前已由另一采集事务生成，不要求副本陈旧或离线，也不按 Git、CVS、S3、文件系统或 NMS 产品拆分。若攻击者先命令设备导出到临时位置再立即取走，设备侧仍有本次读取/导出，应留在父级或与受信管理语境子项并列；只有当前 Collection 不需要实时设备事务时，才满足本子项观察差。
          en: Preexisting means another acquisition transaction produced the copy before the adversary's current read. It need not be stale or physically offline, and Git, CVS, S3, filesystem, or NMS products do not define partitions. If the adversary first commands a device to export to a temporary location and immediately retrieves it, the device still has a current read or export and the event stays at parent scope or co-classifies with the trusted-management-context child. This child's observation difference requires that current Collection need no live-device transaction.
    stealth_characteristics:
      paragraphs:
        - zh: 实时设备日志会显示“没有新的配置读取”，因为可用内容来自较早的正常备份、差异采集或版本提交；攻击者当前行为留在存储端的主体、文件或对象、版本、返回量和目的会话中。若设备团队与备份/版本库团队分开监控，或只把 Git/CVS/备份主机视为恢复设施，配置取得可能落在设备检测之外。副本读取并未消失，细粒度文件/对象审计与身份职责可恢复。
          en: Live-device logs show no new configuration read because usable content comes from an earlier normal backup, difference collection, or version commit. Current adversary behavior remains in storage-side principal, file or object, version, returned quantity, and destination session. If device and backup or repository teams monitor separately, or treat Git, CVS, or backup hosts only as recovery infrastructure, the acquisition can fall outside device-focused detection. Replica reads remain visible where fine-grained file or object audit and identity duty are available.
        - zh: CISA 联合通告明确配置文件可从网络内既有来源（例如 provider script 输出）取得；RANCID 官方资料说明设备配置被处理并提交到版本控制，Cisco 配置版本功能也保存运行配置的历史副本。这些材料共同证明副本面和实际攻击取得，但没有给出某一恶意副本读取的完整存储审计或实测告警差，因此匿迹机理保持 medium。
          en: The joint CISA advisory explicitly states that configuration files can be acquired from existing network sources such as provider-script output. Official RANCID material explains that device configuration is processed and committed to version control, and Cisco configuration versioning stores historical running-configuration copies. Together these sources establish the replica surface and actual adversary acquisition, but they do not provide complete storage audit for one malicious replica read or a measured alert difference, so the stealth mechanism remains medium confidence.
    scope_boundary_definition:
      paragraphs:
        - zh: 纳入对已生成配置副本或历史版本的成功内容读取，并要求该读取没有同时间目标设备管理请求。若副本存在云对象存储，可同时评估 T1530 的存储访问，但 T1602 仍由内容的配置管理用途决定；若仓库保存一般文档、源代码或业务数据，相关对象归 T1213。对副本的再压缩、加密和集中暂存属于 T1560/T1074。
          en: Include successful content reads of an already generated configuration copy or historical version when no contemporaneous management request reaches the target device. When the copy sits in cloud object storage, T1530 storage access may also apply, while T1602 remains determined by the content's configuration-management function. General documents, source code, and business data in the same repository belong to T1213. Recompression, encryption, and centralized staging of the copy belong to T1560 or T1074.
        - zh: 排除合法差异审查、备份完整性测试、灾备演练、合规扫描、授权恢复和厂商支持。只有 repository login、list、metadata get、版本号查询或失败 download 时，不得声明内容取得；只看到返回字节而不能确认对象为配置时，结论应保持“副本读取候选”。
          en: Exclude legitimate difference review, backup-integrity testing, disaster-recovery exercises, compliance scanning, authorized restore, and vendor support. Repository login, list, metadata get, version lookup, or failed download does not establish content acquisition. Returned bytes without confirmation that the object is configuration leave only a candidate replica read.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 网络运营商的 provider script 或配置归档系统定期把路由器配置保存到管理服务器和版本库。攻击者攻陷该服务器或复用其账户后，checkout 某设备历史版本或直接读取 configs 目录，从中恢复管理端点、ACL、路由和弱保护凭据；目标路由器本时段没有新命令。该场景也可出现在用于合规或灾备的配置备份对象，只要证明读取成功和对象语义。
            en: A provider script or configuration-archive system at a network operator periodically saves router configuration to a manager and version repository. After compromising that server or reusing its account, an adversary checks out a device's historical version or reads a configs directory to recover management endpoints, ACLs, routes, and weakly protected credentials. The target router has no new command during that interval. The same scenario can involve configuration backup objects used for compliance or disaster recovery when successful reading and object semantics are proven.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需能读取配置副本存储或控制有权读取的主体，知道文件/对象与设备及版本的映射，并能处理可能的加密、脱敏或 secret placeholder。选择历史副本可避开实时设备访问，却承担内容过期、关键秘密已轮换或副本访问审计更完整的风险；其不必拥有当前设备会话。
              en: The adversary needs read access to configuration-copy storage or control of an authorized reader, knowledge mapping files or objects to devices and versions, and a way to handle encryption, redaction, or secret placeholders. Choosing a historical copy avoids live-device access but risks stale content, rotated secrets, or stronger replica-store auditing. A current device session is unnecessary.
        defender_model:
          paragraphs:
            - zh: 防守方需要配置副本清单、device_id、snapshot/version_id、内容哈希与敏感性，以及版本库、对象存储或主机文件读取审计中的 principal、session、operation、outcome 和 bytes。再与合法备份生产者、允许消费者、恢复工单和历史设备采集连接；若本地文件系统未启用读取审计、Git 只记录仓库级 clone 或共享账户掩盖实际人，文件级归因会受限。
              en: Defenders need a configuration-copy inventory with device ID, snapshot or version ID, content hash, and sensitivity, plus principal, session, operation, outcome, and bytes from version-repository, object-store, or host file-read audit. They then join authorized backup producers, allowed consumers, restore work orders, and historical device acquisition. File-level attribution is limited when local filesystems lack read audit, Git records only repository-level clone, or a shared account obscures the human operator.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 将当前配置读取移到设备命令监控之外的既有副本面
          en: Move current configuration reading to a preexisting replica plane outside device-command monitoring
        analysis:
          paragraphs:
            - zh: 合法备份或 provider script 先生成配置副本，攻击者以后从副本存储成功读取内容，目标设备在当前时窗没有配置查询。若防守方的有效观察范围止于设备 AAA、命令和管理流量，关键行为不会进入该范围，形成 NM-BT；副本对象与读取审计仍能补齐。CISA、RANCID 与 Cisco 文档共同支持行为和架构，未提供检出率，故为 medium。
              en: A legitimate backup or provider script first creates a configuration copy, and the adversary later reads content successfully from replica storage without a current configuration query to the target device. If effective monitoring ends at device AAA, commands, and management traffic, the critical read remains outside that scope and creates NM-BT. Replica-object and access audit can close the gap. CISA, RANCID, and Cisco documentation jointly support behavior and architecture but provide no detection rate, leaving confidence medium.
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
        confidence: medium
    evidence_keys: [REF-000792, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
    defense_strategy_keys: [T1602_DET_ACQUISITION_OUTCOME]
    mitigation_keys: [T1602_MIT_READ_PLANE]
    limitations:
      paragraphs:
        - zh: 联合通告证明行为者从 provider script 输出等既有来源取得配置，却没有公开具体副本路径、存储主体或完整读取日志；RANCID 与 Cisco 文档证明正常系统如何保存副本，不证明某一产品部署中的恶意读取。正式案例需补充实际对象、版本和成功读取结果，不能从设备“无命令”单独反推本子项。
          en: The joint advisory establishes actor acquisition from existing sources such as provider-script output but does not publish a specific replica path, storage principal, or complete read audit. RANCID and Cisco documentation establish how normal systems preserve copies, not a malicious read in one deployment. A formal case needs an actual object, version, and successful read result; absence of a device command alone cannot prove this child.
defense_candidates:
  detection_strategies:
    - temporary_key: T1602_DET_ACQUISITION_OUTCOME
      name:
        zh: 配置读取结果与管理任务意图核对
        en: Configuration-Read Outcome and Management-Job Intent Reconciliation
      objective:
        zh: 对实时设备读取和既有配置副本读取分别建立“主体—请求—成功返回—配置对象/产物”链，再与已批准管理、备份、合规和恢复任务核对，区分未知来源、受信管理语境滥用及设备审计外副本取得。
        en: Build principal-to-request-to-successful-return-to-configuration-object or artifact chains for live-device and preexisting-copy reads, then reconcile them with approved management, backup, compliance, and restore jobs to distinguish unknown sources, abuse of trusted management context, and replica acquisition outside device audit.
      detects_keys: [T1602_PARENT, T1602_CHILD_TRUSTED_CONTEXT, T1602_CHILD_PREEXISTING_COPY]
      domains: [enterprise]
      analytic_keys: [T1602_NJA_LIVE_READ_OUTCOME, T1602_NJA_COPY_READ_OUTCOME]
      evidence_keys:
        - T1602_REF_NCSC_JAGUAR
        - T1602_REF_CISA_AA25
        - T1602_REF_RFC6241
        - T1602_REF_RFC3416
        - T1602_REF_CISCO_COMMAND_ACCOUNTING
        - T1602_REF_CISCO_VERSIONING
        - T1602_REF_RANCID
  detection_analytics:
    - temporary_key: T1602_NJA_LIVE_READ_OUTCOME
      strategy_key: T1602_DET_ACQUISITION_OUTCOME
      name:
        zh: 实时配置请求—响应—任务范围关联
        en: Live Configuration Request-Response-Job Scope Correlation
      platforms: [Network Devices, Network Management Systems]
      logic:
        paragraphs:
          - zh: 先为每种已部署管理接口验证可观测层级。按 device_id、principal_id、source_manager_id、session_id/request_id 和时间连接成功/失败认证、配置读取请求、服务端完成状态、response_bytes/value_count 及客户端保存的 output_object_id/content_hash。将结果分成 auth_only、request_only、successful_response、verified_configuration_content 四级：认证或请求不能升级为 Collection；无错误响应与非零返回只能成为返回候选；只有解析出的配置对象、命令输出、配置文件或与受控样本/设备快照匹配的哈希才能确认内容取得。
            en: First validate observable layers for every deployed management interface. Join successful or failed authentication, configuration-read request, server completion status, response bytes or value count, and client-saved output object ID or content hash by device ID, principal ID, source manager ID, session or request ID, and time. Classify results as auth_only, request_only, successful_response, or verified_configuration_content. Authentication or request cannot be upgraded to Collection. An error-free response with nonzero returned quantity is only a response candidate. Confirm content acquisition only through parsed configuration objects, command output, configuration files, or hashes matched to a controlled sample or device snapshot.
          - zh: 对 successful_response 和 verified_configuration_content 与 NMS/备份/合规任务清单核对 job_id、发起人、审批时段、允许设备、允许配置对象和预期结果目的地。未知外部来源是一个分支；对 T1602_CHILD_TRUSTED_CONTEXT，重点输出熟悉服务身份/管理节点下的无 job_id、职责外设备或对象、临时交互会话、返回量偏离或结果被写向非批准位置。若命令记账不覆盖所用 API，则改用 API/RPC 服务审计、NMS 客户端日志与流量元数据补齐，不把“没有 CLI 命令”当作无行为。
            en: Reconcile successful_response and verified_configuration_content with NMS, backup, or compliance job inventory using job ID, initiator, approval interval, allowed devices, allowed configuration objects, and expected result destination. Unknown external sources form one branch. For T1602_CHILD_TRUSTED_CONTEXT, prioritize a familiar service identity or manager with no job ID, out-of-duty device or object, ad hoc interactive session, deviating returned quantity, or output written to an unapproved location. When command accounting does not cover the API, use API or RPC service audit, NMS client logs, and traffic metadata instead of interpreting absence of a CLI command as absence of behavior.
      data_requirements:
        - source_type: network-device-authentication-and-session
          name:
            zh: 网络设备认证与管理会话
            en: Network-device Authentication and Management Session
          channel: Device AAA/TACACS+/RADIUS/syslog or vendor management-session audit validated per platform
          required_fields: [timestamp, device_id, principal_id, source_address, source_manager_id, session_id, protocol, authentication_result]
        - source_type: configuration-read-transaction
          name:
            zh: 配置读取请求与完成事务
            en: Configuration-read Request and Completion Transaction
          channel: Device CLI accounting, SNMP transaction sensor, NETCONF/RESTCONF service audit, or NMS client transaction log
          required_fields: [timestamp, device_id, principal_id, session_id, request_id, operation, target_datastore_or_object, filter_or_command, completion_status, error_code]
        - source_type: configuration-response-outcome
          name:
            zh: 配置响应与返回结果
            en: Configuration Response and Returned Outcome
          channel: Server or client transaction log; packet content only where lawful and not encrypted
          required_fields: [timestamp, device_id, request_id, completion_status, response_bytes, value_count, output_object_id, content_hash_or_parser_result]
        - source_type: approved-management-job
          name:
            zh: 批准的管理备份与合规任务
            en: Approved Management Backup and Compliance Job
          channel: NMS, configuration backup, scheduler, change-management, and ticket system
          required_fields: [job_id, initiator, principal_id, source_manager_id, approved_device_scope, approved_object_scope, approval_start, approval_end, expected_destination, owner]
      observables:
        - zh: 认证成功后出现配置读取请求但无成功响应或内容产物，仅构成企图层级
          en: A configuration-read request after successful authentication without a successful response or content artifact remains attempt level
        - zh: 熟悉管理主体和来源返回配置内容，却没有匹配 job_id 或超出批准设备/对象范围
          en: A familiar management principal and source return configuration content without a matching job ID or beyond approved device or object scope
        - zh: 返回量、对象集合或结果目的地偏离同设备角色与作业类型基线
          en: Returned quantity, object set, or result destination deviates from the same device role and job type
      correlation:
        window:
          zh: 单请求从认证前十五分钟到完成后三十分钟；管理主体、设备和作业基线至少三十日，并覆盖月度合规与灾备任务周期。
          en: Fifteen minutes before authentication through thirty minutes after completion for one request; at least thirty days for management-principal, device, and job baselines, extended to monthly compliance and recovery cycles.
        dimensions: [device_id, principal_id, source_manager_id, session_id, request_id, job_id, target_datastore_or_object, output_object_id, time]
      false_positives:
        - zh: 批准的配置备份、NMS 轮询、变更前后差异采集、设备上线、故障排除、合规扫描、应急恢复和厂商支持会读取相同内容，且应急任务可能先执行后补工单。
          en: Approved configuration backup, NMS polling, pre/post-change difference collection, device onboarding, troubleshooting, compliance scans, emergency recovery, and vendor support read the same content, and emergency work may precede ticket completion.
      blind_spots:
        - zh: 设备只记写操作、CLI 命令记账不覆盖 API、SNMPv3/SSH 加密正文、共享服务账户、NMS 不记录结果对象或仅有采样流量时，无法完成全部层级。response_bytes 不能证明其语义是配置，且 UDP SNMP 丢包会破坏请求响应连接。
          en: Full layering fails when devices log only writes, CLI command accounting excludes APIs, SNMPv3 or SSH encrypts content, service accounts are shared, NMS omits result objects, or traffic is sampled. Response bytes do not prove configuration semantics, and UDP SNMP loss can break request-response joins.
      tuning_guidance:
        paragraphs:
          - zh: 按设备角色、软件版本、管理接口、service principal、来源管理器、作业类型和批准对象集合建立版本化基线；允许项绑定具体 job_id、设备/对象范围、时间和结果位置，绝不永久放行“管理网段”“read-only”或备份账户。对无法内容验证的环境分别输出响应候选与确认内容，避免用大于零字节阈值制造确定性。
            en: Build versioned baselines by device role, software release, management interface, service principal, manager source, job type, and approved object set. Bind an exception to a specific job ID, device and object scope, time, and result destination, never permanently allowlist a management subnet, read-only label, or backup account. Where content cannot be validated, output response candidates separately from confirmed content rather than manufacture certainty from a nonzero-byte threshold.
      evidence_keys: [T1602_REF_NCSC_JAGUAR, T1602_REF_CISA_AA25, T1602_REF_RFC6241, T1602_REF_RFC3416, T1602_REF_CISCO_COMMAND_ACCOUNTING]
    - temporary_key: T1602_NJA_COPY_READ_OUTCOME
      strategy_key: T1602_DET_ACQUISITION_OUTCOME
      name:
        zh: 配置副本对象—版本—成功读取关联
        en: Configuration-Copy Object-Version-Successful-Read Correlation
      platforms: [Linux, Windows, Network Management Systems, Cloud Storage]
      logic:
        paragraphs:
          - zh: 建立配置副本清单，将 repository_id/path/object_id、version_or_snapshot_id、device_id、configuration_type、created_by_job_id、created_time、content_hash 和 sensitivity 关联。对每次 file_read、checkout、clone、download 或 object_get，先验证 outcome=success 与 bytes_returned>0，再确认读取范围中至少一个对象解析为配置内容或哈希匹配清单；只有登录、list、metadata 或失败请求时保持 Discovery/企图。
            en: Build a configuration-copy inventory joining repository ID, path or object ID, version or snapshot ID, device ID, configuration type, creating job ID, creation time, content hash, and sensitivity. For every file read, checkout, clone, download, or object get, first verify a successful outcome and positive returned bytes, then confirm that at least one object in scope parses as configuration or has a hash matching the inventory. Login, list, metadata, or failed requests remain Discovery or attempt.
          - zh: 将确认读取与允许消费者、备份验证、差异审查、合规扫描、灾备恢复及事件响应工单核对。对 T1602_CHILD_PREEXISTING_COPY，要求同一时窗没有目标 device_id 的对应实时配置读取，或能够证明当前内容来自 earlier created_time/version；输出异常主体、首次访问设备集合、历史版本批量、敏感配置、非批准目的进程/会话和仓库级 clone 的展开对象。没有文件级 Git 审计时，应以 clone 范围和本地 checkout 文件事件保留较低粒度结论。
            en: Reconcile confirmed reads with allowed consumers, backup verification, difference review, compliance scans, disaster recovery, and incident-response work orders. For T1602_CHILD_PREEXISTING_COPY, require no corresponding live configuration read for the target device in the same window or evidence that current content came from an earlier creation time or version. Output anomalous principal, first-seen device set, historical-version bulk access, sensitive configuration, unapproved destination process or session, and objects expanded from a repository-level clone. When Git lacks file-level audit, retain a lower-granularity conclusion based on clone scope and local checkout file events.
      data_requirements:
        - source_type: configuration-copy-inventory
          name:
            zh: 配置副本对象与版本清单
            en: Configuration-copy Object and Version Inventory
          channel: Configuration archive, backup catalog, version-control index, or CMDB
          required_fields: [repository_id, object_id_or_path, version_or_snapshot_id, device_id, configuration_type, created_by_job_id, created_time, content_hash, sensitivity]
        - source_type: repository-or-file-read-audit
          name:
            zh: 版本库对象存储或文件读取审计
            en: Version-repository Object-store or File-read Audit
          channel: Git/CVS/SVN server audit, object-storage data events, or host file-read audit validated in deployment
          required_fields: [timestamp, repository_id, principal_id, session_id, operation, object_id_or_path, version_or_snapshot_id, outcome, bytes_returned, source_address, destination_process_or_client]
        - source_type: approved-copy-consumer
          name:
            zh: 批准的配置副本消费者与恢复任务
            en: Approved Configuration-copy Consumer and Restore Job
          channel: Backup, compliance, disaster-recovery, change-management, and ticket system
          required_fields: [consumer_id, principal_id, approved_repository_scope, approved_device_scope, purpose, job_id, approval_start, approval_end, owner]
        - source_type: live-device-configuration-read
          name:
            zh: 实时设备配置读取对照
            en: Live-device Configuration-read Comparator
          channel: Normalized output of T1602_NJA_LIVE_READ_OUTCOME
          required_fields: [timestamp, device_id, principal_id, request_id, completion_status, output_object_id]
      observables:
        - zh: 历史配置对象或版本成功返回给不在允许消费者清单中的主体
          en: A historical configuration object or version is successfully returned to a principal outside the allowed-consumer inventory
        - zh: 当前副本读取覆盖敏感或首次接触设备，却没有同时间实时设备事务
          en: A current replica read covers sensitive or first-seen devices without contemporaneous live-device transactions
        - zh: repository clone 或 checkout 经对象清单展开后包含多个设备配置，结果进入非批准进程或会话
          en: A repository clone or checkout expands through the object inventory to multiple device configurations and enters an unapproved process or session
      correlation:
        window:
          zh: 单次读取前十五分钟至完成后一小时；版本库和对象访问基线至少九十日，以覆盖月度、季度灾备和审计流程。
          en: Fifteen minutes before a read through one hour after completion; at least ninety days for repository and object-access baselines to cover monthly and quarterly recovery or audit work.
        dimensions: [repository_id, object_id_or_path, version_or_snapshot_id, device_id, principal_id, session_id, job_id, destination_process_or_client, time]
      false_positives:
        - zh: 配置备份完整性检查、版本差异审查、灾备恢复、审计取证、批量设备迁移、密钥轮换验证、厂商支持和授权开发测试会合法读取历史或多设备配置。
          en: Backup-integrity checks, version-difference review, disaster recovery, audit forensics, bulk device migration, key-rotation validation, vendor support, and authorized development testing legitimately read historical or multi-device configuration.
      blind_spots:
        - zh: 本地文件系统未启用 read SACL/auditd、Git 仅记录 clone 不记录文件、缓存或备份被离线复制、共享账户或存储端只保留管理事件时，主体和对象粒度不足。加密副本或脱敏模板可能无法在线确认内容；设备无实时命令只是必要对照，不是独立证明。
          en: Principal and object resolution are weak when local filesystems lack read SACL or auditd, Git records clones rather than files, caches or backups are copied offline, accounts are shared, or storage retains management events only. Encrypted copies or redacted templates may resist online content confirmation. Absence of a live device command is a necessary comparator, not independent proof.
      tuning_guidance:
        paragraphs:
          - zh: 按配置仓库、设备组、版本年龄、敏感性、消费者职责和固定作业周期建立基线；例外绑定具体目的、对象集合、有效期和目标工具。对 Git clone 等仓库级操作必须展开当时 commit tree，而不是以 clone 次数阈值替代对象语义；应急恢复可提高范围但仍须保留批准人和结果位置。
            en: Baseline by configuration repository, device group, version age, sensitivity, consumer duty, and fixed job cycle. Bind exceptions to a purpose, object set, validity interval, and destination tool. For repository-level actions such as Git clone, expand the commit tree at that time instead of replacing object semantics with a clone-count threshold. Emergency recovery may broaden scope but must retain approver and result location.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
  mitigations:
    - temporary_key: T1602_MIT_READ_PLANE
      resolution: create-if-no-equivalent
      name:
        zh: 配置读取面与副本访问治理
        en: Configuration Read-Plane and Replica Access Governance
      description:
        zh: 将设备管理读取权限、自动化作业身份、配置响应审计和配置副本存储作为同一敏感内容链治理，限制谁能从哪些管理来源读取哪些配置对象，并让成功返回、保存副本及后续读取具备独立可核查记录。
        en: Govern device-management read authority, automation-job identity, configuration-response audit, and configuration-copy storage as one sensitive-content chain. Restrict who can read which configuration objects from which manager sources and preserve independently verifiable records of successful returns, saved copies, and later reads.
      measures:
        - key: isolate-and-authenticate-management-plane
          name:
            zh: 隔离并强认证管理平面
            en: Isolate and Strongly Authenticate the Management Plane
          description:
            zh: 将 SSH、HTTPS、NETCONF/RESTCONF、SNMP 和配置传输限制在专用 OOB/management VRF 与批准管理器；淘汰 Telnet、HTTP、FTP/TFTP 和 SNMPv1/v2c，优先 SNMPv3 authPriv、SSH/SFTP/SCP 及设备支持的强双向认证，并限制外部与横向设备可达性。
            en: Restrict SSH, HTTPS, NETCONF or RESTCONF, SNMP, and configuration transfer to dedicated out-of-band or management VRFs and approved managers. Retire Telnet, HTTP, FTP or TFTP, and SNMPv1 or v2c; prefer SNMPv3 authPriv, SSH, SFTP or SCP, and strong mutual authentication where supported, while limiting external and device-to-device reachability.
          control_type: exposure-reduction
        - key: scope-automation-identities-and-views
          name:
            zh: 按作业约束自动化身份与配置视图
            en: Scope Automation Identities and Configuration Views by Job
          description:
            zh: 为监控、备份、合规和应急任务使用独立可归因身份与短期委派，分别限制设备清单、MIB VACM read view、YANG/NACM 数据树、CLI 命令和导出目标；禁用共享默认 community 与无边界服务账户，并对职责外读取实施重新授权。
            en: Use distinct attributable identities and time-bounded delegation for monitoring, backup, compliance, and emergency work. Separately constrain device inventory, MIB VACM read views, YANG or NACM data trees, CLI commands, and export destinations. Disable shared default communities and unbounded service accounts, requiring reauthorization for out-of-duty reads.
          control_type: preventive
        - key: retain-request-response-and-job-lineage
          name:
            zh: 保留请求响应与管理作业谱系
            en: Retain Request Response and Management-job Lineage
          description:
            zh: 远程保存设备认证、命令/API/RPC、完成状态与返回量，并与 NMS job_id、发起人、审批、对象范围、结果路径和哈希连接。对 CLI 记账不覆盖的 NETCONF/XML/gRPC 等接口，启用对应服务或管理客户端审计和流量元数据；定期以脱敏配置测试从请求到内容产物的可见性。
            en: Remotely retain device authentication, command, API or RPC, completion status, and returned quantity, joined to NMS job ID, initiator, approval, object scope, result path, and hash. For interfaces such as NETCONF, XML, or gRPC not covered by CLI accounting, enable matching service or manager-client audit and traffic metadata. Periodically test request-to-content visibility with redacted configuration.
          control_type: detective-support
        - key: protect-and-audit-configuration-replicas
          name:
            zh: 保护并审计配置副本
            en: Protect and Audit Configuration Replicas
          description:
            zh: 将配置归档、provider script 输出、版本库与备份对象按高敏数据加密、分权、最小读取、不可篡改审计和保留策略管理；保存 device/version/hash 映射，对含口令或共享秘密的配置执行安全迁移、轮换与必要脱敏，且不让备份服务身份自动获得人工 checkout 权限。
            en: Treat configuration archives, provider-script output, version repositories, and backup objects as highly sensitive data with encryption, separation of duties, least read access, tamper-resistant audit, and retention policy. Preserve device, version, and hash mapping, securely migrate, rotate, and where appropriate redact passwords or shared secrets, and do not automatically grant human checkout authority to backup-service identities.
          control_type: exposure-reduction
      applications:
        - target_key: T1602_PARENT
          use:
            zh: 对所有能返回设备配置的接口和副本维护统一数据流清单，限制管理可达性与读取范围，远程记录请求、成功响应、输出对象及后续读取，并定期验证配置中弱口令或可逆秘密已轮换。
            en: Maintain one data-flow inventory for every interface and copy that can return device configuration. Restrict management reachability and read scope, remotely record requests, successful responses, output objects, and later reads, and periodically verify rotation of weak or reversible secrets present in configuration.
          expected_effect:
            zh: 减少攻击者直接取得配置的入口，使尝试、成功返回和已验证内容可分级，并降低配置泄露后横向移动与凭据恢复价值。
            en: Reduce entry paths for direct configuration acquisition, separate attempt, successful return, and verified content, and lower the lateral-movement and credential-recovery value of disclosed configuration.
          limitations:
            zh: 旧设备可能只支持弱协议或有限审计，紧急排障需要宽权限；已控制设备、NMS、身份与日志接收端的攻击者仍可伪造多层证据，必须以独立快照和重建恢复。
            en: Legacy devices may support only weak protocols or limited audit, and emergency troubleshooting needs broad authority. An adversary controlling the device, NMS, identity, and log receiver can still falsify multiple layers, requiring independent snapshots and rebuild for recovery.
        - target_key: T1602_CHILD_TRUSTED_CONTEXT
          use:
            zh: 将备份、监控和合规身份按作业拆分，绑定特定管理节点、设备/对象范围、有效期和结果位置；服务身份本身不进入全局白名单，职责外目标需要新审批并触发高保真审计。
            en: Separate backup, monitoring, and compliance identities by job and bind each to a manager node, device and object scope, validity period, and result location. Never globally allowlist a service identity; out-of-duty targets require fresh approval and high-fidelity audit.
          expected_effect:
            zh: 压缩攻击者借用正常身份与来源读取额外配置的空间，并把外观相同的合法与恶意任务转化为可比较的 job scope 差异。
            en: Constrain the adversary's ability to use an ordinary identity and source for extra configuration reads and turn visually similar legitimate and malicious work into a comparable job-scope difference.
          limitations:
            zh: 某些 NMS 只能使用共享长期凭据，设备可能不支持细粒度 read view；攻击者控制真正批准的作业或审批系统时仍能保持语境一致，需要内容去向和独立操作员证据。
            en: Some NMS products require shared long-lived credentials and devices may lack fine-grained read views. An adversary controlling a genuinely approved job or approval system can preserve context and requires output-destination and independent-operator evidence.
        - target_key: T1602_CHILD_PREEXISTING_COPY
          use:
            zh: 对配置归档与版本库分离生产者和消费者权限，禁止备份服务账户交互式读取全部历史，启用文件/对象 data event、仓库 clone 审计和 commit tree 展开，并把配置副本纳入凭据与敏感拓扑数据保护。
            en: Separate producer and consumer authority for configuration archives and version repositories. Prevent backup-service accounts from interactively reading all history, enable file or object data events and repository-clone audit with commit-tree expansion, and protect configuration copies as credential-bearing and topology-sensitive data.
          expected_effect:
            zh: 降低不访问实时设备即可取得配置的机会，并让当前副本读取在版本/对象面形成可归因记录。
            en: Reduce opportunities to acquire configuration without touching live devices and make current replica reads attributable on the version or object plane.
          limitations:
            zh: 文件读取审计可能带来性能和隐私成本，Git/CVS 常只提供仓库级事件；离线复制、管理员控制存储主机或在备份生成前已植入的攻击者仍会造成盲区。
            en: File-read audit can impose performance and privacy cost, and Git or CVS often supplies repository-level events only. Offline copy, administrator control of the storage host, or an adversary present before backup generation still creates blind spots.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_CISCO_SNMP, T1602_REF_CISCO_COMMAND_ACCOUNTING, T1602_REF_CISCO_VERSIONING, T1602_REF_RANCID]
