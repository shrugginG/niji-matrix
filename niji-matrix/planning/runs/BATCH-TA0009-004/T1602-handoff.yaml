library_candidates:
  references:
    - key: T1602_REF_NCSC_JAGUAR
      title:
        zh: Jaguar Tooth：收集设备信息并提供后门访问的 Cisco IOS 恶意软件
        en: "Jaguar Tooth: Cisco IOS Malware that Collects Device Information and Enables Backdoor Access"
      url: https://www.ncsc.gov.uk/sites/default/files/documents/NCSC-MAR-Jaguar-Tooth.pdf
      source_type: government-malware-analysis
      publisher: UK National Cyber Security Centre
      published: "2023-04-18"
      supports: NCSC reverse engineering states that Jaguar Tooth automatically executes a hard-coded command list, uses a Cisco IOS CLI command to dump current running configuration, and exfiltrates collected command results over TFTP; strongest actual-acquisition evidence.
      limitations: The sample covers one older Cisco IOS platform and malware implementation; it does not prove trusted-management-context or replica-plane stealth, and its TFTP egress is a later action.
    - key: T1602_REF_CISA_AA25
      resolution: reuse-and-extend
      existing_ref: REF-000792
      url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a
      source_type: joint-government-advisory
      supports: Actors acquired configuration files from existing provider-script output or active device survey and TFTP; used configuration-archive service or automation credentials to access devices; used monitoring tools already present; collected configurations could contain weakly protected credentials.
      limitations: Aggregates multiple actors, victims, and incidents. It does not prove every credential use returned configuration, link each request to one artifact, publish response bytes, or measure alert reduction.
    - key: T1602_REF_RANCID
      title:
        zh: RANCID 配置监控与版本历史
        en: RANCID Configuration Monitoring and Version History
      url: https://sea.shrubbery.net/rancid/
      source_type: official-project-documentation
      publisher: Shrubbery Networks
      published: null
      supports: RANCID logs into devices, runs commands, processes output, reports differences, and commits device configuration to CVS, Subversion, or Git, establishing legitimate automation context and preexisting versioned copies.
      limitations: Describes normal product operation, not a malicious incident, audit completeness, or a stealth benefit.
    - key: T1602_REF_CISCO_VERSIONING
      title:
        zh: Cisco 配置版本管理
        en: Cisco Configuration Versioning
      url: https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/system-management/system-management/m_cm-config-versioning.html
      source_type: vendor-documentation
      publisher: Cisco
      published: null
      supports: Cisco configuration versioning saves running-configuration copies locally or remotely under incremental versions and timestamps and exposes archive inventory, establishing snapshot objects and historical copies.
      limitations: Product capability only; it does not show an adversary read or guarantee storage access audit.
    - key: T1602_REF_CISCO_COMMAND_ACCOUNTING
      title:
        zh: Cisco IOS XR 命令记账方法
        en: Cisco IOS XR Command Accounting Methods
      url: https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r7-9/system-security/configuration/guide/b-system-security-cg-asr9000-79x/configuring-aaa-services.html
      source_type: vendor-documentation
      publisher: Cisco
      published: null
      supports: Local command accounting can record executed commands as syslog but is not supported for commands executed through NETCONF, XML, or gRPC, establishing a product-specific audit-surface mismatch.
      limitations: Applies to documented IOS XR releases and command-accounting mode, not every Cisco or other-vendor platform; it does not prove malicious acquisition through the gap.
    - key: T1602_REF_CISCO_SNMP
      title:
        zh: Cisco 安全 SNMP 指南
        en: Cisco Secure Simple Network Management Protocol
      url: https://www.cisco.com/c/en/us/support/docs/ip/simple-network-management-protocol-snmp/20370-snmpsecurity-20370.html
      source_type: vendor-documentation
      publisher: Cisco
      published: null
      supports: SNMPv3 authPriv, trusted manager ACLs, and MIB views can restrict which objects a management principal reads, supporting implementable mitigation scope.
      limitations: Configuration guidance, not incident or detection proof; view availability and OID names vary by platform and release.
    - key: T1602_REF_RFC6241
      title:
        zh: RFC 6241 网络配置协议
        en: RFC 6241 Network Configuration Protocol
      url: https://www.rfc-editor.org/rfc/rfc6241.html
      source_type: protocol-standard
      publisher: IETF / RFC Editor
      published: "2011-06"
      supports: NETCONF get-config retrieves configuration data, optional filters select portions, and a positive response returns a data element while errors use rpc-error, supporting request/response/outcome separation.
      limitations: Protocol semantics do not guarantee product logging, sensor visibility, attacker use, or plaintext inspection.
    - key: T1602_REF_RFC3416
      title:
        zh: RFC 3416 SNMPv2 协议操作
        en: RFC 3416 Protocol Operations for SNMPv2
      url: https://www.rfc-editor.org/rfc/rfc3416.html
      source_type: protocol-standard
      publisher: IETF / RFC Editor
      published: "2002-12"
      supports: GET and GETBULK requests produce Response-PDUs with request IDs, status, and variable bindings; successful bulk retrieval can return many name/value bindings, supporting query-versus-returned-value distinction.
      limitations: Protocol semantics do not establish that a particular OID is configuration, that a sensor records values, or that an incident completed acquisition.
  claims:
    - key: T1602_CLM_PARENT_COMPLETION
      proposition_zh: T1602 的 Collection 完成要求实际配置值、命令输出、文件或副本内容成功进入攻击者控制链；认证、查询或导出命令本身只能证明前提或企图。
      proposition_en: Completion of T1602 Collection requires actual configuration values, command output, file, or copy content to enter an attacker-controlled chain; authentication, a query, or an export command alone proves only prerequisite or attempt.
      evidence_keys: [REF-000625, T1602_REF_NCSC_JAGUAR, T1602_REF_RFC6241, T1602_REF_RFC3416]
    - key: T1602_CLM_JAGUAR_OUTCOME
      proposition_zh: Jaguar Tooth 自动执行 Cisco IOS 命令导出当前 running configuration，并将收集的命令结果经 TFTP 外送，直接证明网络设备配置内容取得。
      proposition_en: Jaguar Tooth automatically executed a Cisco IOS command to dump current running configuration and exfiltrated collected command results over TFTP, directly establishing acquisition of network-device configuration content.
      evidence_keys: [T1602_REF_NCSC_JAGUAR]
    - key: T1602_CLM_TRUSTED_CONTEXT
      proposition_zh: 联合通告记录行为者使用配置归档服务/自动化凭据和环境内监控工具访问网络设备，并记录配置文件取得；这支持受信管理语境变量，但不能把每次凭据使用推断为成功取得。
      proposition_en: The joint advisory reports actors using configuration-archive service or automation credentials and monitoring tools already in the environment to access network devices, and reports acquired configuration files. This supports a trusted-management-context variable but cannot turn every credential use into successful acquisition.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID]
    - key: T1602_CLM_PREEXISTING_COPY
      proposition_zh: 行为者可从 provider script 已生成的输出等既有网络内来源取得配置，而 RANCID/Cisco 正常功能会保存版本化配置副本；因此当前配置取得可以发生在副本面而没有同时间实时设备请求。
      proposition_en: Actors can acquire configuration from preexisting network sources such as provider-script output, while normal RANCID and Cisco functions preserve versioned configuration copies. Current configuration acquisition can therefore occur on a replica plane without a contemporaneous live-device request.
      evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
    - key: T1602_CLM_AUDIT_GAP
      proposition_zh: 特定 Cisco IOS XR 命令记账不覆盖 NETCONF、XML 或 gRPC，而 NETCONF get-config 可成功返回配置；仅依赖 CLI 命令历史会对这些读取接口形成条件性盲区。
      proposition_en: Some Cisco IOS XR command accounting does not cover NETCONF, XML, or gRPC, while NETCONF get-config can return configuration successfully; reliance on CLI command history alone creates a conditional blind spot for those read interfaces.
      evidence_keys: [T1602_REF_CISCO_COMMAND_ACCOUNTING, T1602_REF_RFC6241]
  cases:
    - key: T1602_CASE_JAGUAR_TOOTH
      name:
        zh: APT28 Jaguar Tooth 运行配置收集
        en: APT28 Jaguar Tooth Running-Configuration Collection
      event_zh: 2021 年相关行动中，APT28 经 SNMP 漏洞在部分 Cisco IOS 路由器部署 Jaguar Tooth；NCSC 恶意软件分析确认其执行硬编码 CLI/Tcl 命令，其中包括导出当前 running configuration，并把结果经 TFTP 外送。
      event_en: In associated 2021 activity, APT28 deployed Jaguar Tooth to some Cisco IOS routers through an SNMP vulnerability. NCSC malware analysis confirms hard-coded CLI and Tcl commands including a current running-configuration dump, with results exfiltrated over TFTP.
      status: candidate-formal
      subject_keys: [T1602_PARENT]
      limit: Proves parent configuration acquisition and later TFTP exfiltration, not trusted-management-context or preexisting-copy children and not all devices targeted in the campaign.
      evidence_keys: [T1602_REF_NCSC_JAGUAR]
    - key: T1602_CASE_PRC_PROVIDER_CONFIG
      name:
        zh: PRC 网络提供商配置与既有管理来源收集
        en: PRC Network-Provider Configuration Collection Through Existing Management Sources
      event_zh: CISA、NSA、FBI 及国际伙伴汇总自 2021 年以来的多起网络设备入侵，记录配置文件从 provider script 输出或主动设备勘测与 TFTP 取得，并记录行为者使用配置归档服务凭据和环境内监控工具。
      event_en: CISA, NSA, FBI, and international partners aggregated network-device intrusions since 2021 and reported configuration files acquired from provider-script output or active device survey and TFTP, along with actor use of configuration-archive service credentials and monitoring tools already in the environment.
      status: candidate-formal-aggregate
      subject_keys: [T1602_PARENT, T1602_CHILD_TRUSTED_CONTEXT, T1602_CHILD_PREEXISTING_COPY]
      limit: The advisory aggregates actors and incidents. Do not claim that service credentials, monitoring tools, provider output, and one configuration artifact occurred in one transaction or victim unless local evidence joins them.
      evidence_keys: [T1602_REF_CISA_AA25]
  detection_strategies: [T1602_DET_ACQUISITION_OUTCOME]
  detection_analytics: [T1602_NJA_LIVE_READ_OUTCOME, T1602_NJA_COPY_READ_OUTCOME]
  mitigations: [T1602_MIT_READ_PLANE]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids: [T1602.002, T1602.001]
    represented_dimensions:
      - full-running-startup-or-exported-device-configuration
      - snmp-mib-object-and-value-retrieval
    breadth_trigger: ordinary
    coverage_table_path: planning/runs/BATCH-TA0009-004/T1602-taxonomy-coverage.yaml
    coverage_resolutions:
      - attack_subtechnique_id: T1602.002
        resolution: parent-core
        imported_as_niji_child: false
      - attack_subtechnique_id: T1602.001
        resolution: niji-variable-candidate
        imported_as_niji_child: false
    candidate_stealth_axes_examined:
      - key: T1602_AXIS_TRUSTED_MANAGEMENT_CONTEXT
        resolution: formal
      - key: T1602_AXIS_OFFLINE_COPY
        resolution: formal
      - key: T1602_AXIS_INTERFACE_AUDIT_MISMATCH
        resolution: evidence-deferred
      - key: T1602_AXIS_SELECTIVE_CONFIGURATION_PROJECTION
        resolution: evidence-deferred
      - key: T1602_AXIS_DISTRIBUTED_QUERY
        resolution: evidence-deferred
      - key: T1602_AXIS_LOW_RATE_INCREMENTAL
        resolution: adjacent-technique
        owner_ref: NJT-0135
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两项 ATT&CK 子项均逐项覆盖且保持 planning-only。正式两个 NJS 的身份分别来自管理归因语境和当前读取观察面，而非把网络设备配置导出或 SNMP/MIB 改名。主 Agent 应再次审查受信管理语境与任何跨批次身份拟态对象是否重复，并只在共享案例能维持聚合限制时正式化 CISA 案例。
      en: Both ATT&CK children are covered individually and remain planning only. The two proposed NJS identities derive from management-attribution context and the observation plane of the current read rather than renaming a network-device dump or SNMP/MIB. The primary agent should recheck trusted management context against any cross-batch identity-disguise objects and formalize the CISA case only if its aggregate limitation remains explicit.
  acquisition_proof_model:
    levels:
      - level: authentication
        accepted_evidence: successful or failed login, SNMP security result, API authentication, or management-session establishment
        conclusion: Access attempt or session prerequisite only; no configuration request or content acquisition.
      - level: query_or_command
        accepted_evidence: CLI show/copy/export, SNMP GET/GETNEXT/GETBULK, NETCONF get-config, REST/API request, file download request, checkout, or clone invocation
        conclusion: Retrieval intent or attempt only; request success and returned content remain unproven.
      - level: successful_response_or_return_size
        accepted_evidence: no-error RPC/PDU or server result plus response bytes, value count, object count, or successful file transfer status tied to request ID
        conclusion: Server returned a data candidate; byte or value quantity supports outcome but does not prove that the payload is target configuration without semantic validation.
      - level: verified_configuration_export_or_read
        accepted_evidence: parseable configuration values, saved command output, configuration file, object or snapshot version, controlled parser classification, or hash matched to a device configuration
        conclusion: Completed T1602 acquisition when the content enters an attacker-controlled process, session, file, or subsequent transfer chain.
    enforcement_note:
      zh: DET/NJA 必须保留四级状态，不能用认证、命令名或非零字节直接替代已验证配置取得。只有 Jaguar Tooth 类命令结果和可解析配置副本满足最高层；CISA 聚合事件在未有本地事务数据时可支持案例背景和轴存在，但不能为每次请求指定最高层。
      en: DET and NJA must preserve all four states and cannot replace verified configuration acquisition with authentication, a command name, or nonzero bytes. Jaguar Tooth-like command results and parseable configuration copies satisfy the highest level. CISA's aggregate incidents support case background and axis existence, but without local transaction evidence they cannot assign the highest level to every request.
  boundary_review:
    - neighbor: NJT-0143/T1213
      decision:
        zh: 设备或基础设施的配置管理状态由 T1602 负责；一般协作、代码、CRM、数据库和消息内容由 T1213 负责。混合仓库按实际读取对象与功能逐对象划界。
        en: T1602 owns device or infrastructure configuration-management state; T1213 owns general collaboration, code, CRM, database, and messaging content. Mixed repositories are classified object by object according to content and function.
    - neighbor: T1530
      decision:
        zh: 云对象存储是位置/访问面，配置副本的语义来源仍归 T1602；若云存储 API 访问本身有独立行为，可并列而非替代。
        en: Cloud object storage is a location and access plane while the semantic source of a configuration copy remains T1602. A cloud-storage API behavior may be co-classified when independently supported rather than replacing T1602.
    - neighbor: Discovery
      decision:
        zh: 设备、接口、OID、路由或配置位置枚举属于 Discovery；T1602 要求实际值或配置内容返回。取得内容可随后用于 Discovery，但用途不能替代 Collection 结果证明。
        en: Enumerating devices, interfaces, OIDs, routes, or configuration locations is Discovery. T1602 requires returned values or configuration content. Acquired content may later support Discovery, but purpose does not substitute for a Collection outcome.
    - neighbor: credential-and-management-session
      decision:
        zh: 凭据取得、账户滥用、SNMP community、SSH/API token 和管理会话是前提；只有配置内容成功返回才进入 T1602。只读权限仍可支持 Collection，但不能支持修改。
        en: Credential acquisition, account abuse, SNMP communities, SSH or API tokens, and management sessions are prerequisites. T1602 begins only with successfully returned configuration content. Read-only authority can support Collection but cannot support modification.
    - neighbor: NJT-0135/T1119
      decision:
        zh: 跨轮重复、事件触发、变化检查点和增量状态属于自动收集编排；可与 T1602 来源并列，但不在 T1602 复制子项。
        en: Cross-pass repetition, event triggers, change checkpoints, and incremental state are automated-collection orchestration. They may co-classify with T1602 source behavior but do not become duplicated T1602 children.
    - neighbor: NJT-0134/T1074 and T1560
      decision:
        zh: 配置值或文件实际取得后，将其集中写到中间节点是暂存，压缩/加密是归档。保存响应以证明取得不自动等于多源暂存或归档转换。
        en: After actual acquisition, centralizing configuration values or files on an intermediate node is staging and compressing or encrypting them is archiving. Saving a response to prove acquisition does not automatically establish multi-source staging or archival transformation.
  evidence_coverage:
    parent_behavior_keys: [REF-000625, T1602_REF_NCSC_JAGUAR, T1602_REF_CISA_AA25]
    boundary_keys: [REF-000625, T1602_REF_RFC6241, T1602_REF_RFC3416, T1602_REF_CISA_AA25]
    mechanism_support:
      - mechanism_ref: NM-FD
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID]
        confidence: medium
      - mechanism_ref: NM-BT
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
        confidence: medium
    child_existence_support:
      - child_key: T1602_CHILD_TRUSTED_CONTEXT
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID]
        confidence: medium
      - child_key: T1602_CHILD_PREEXISTING_COPY
        evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
        confidence: medium
    defense_support: [T1602_REF_CISA_AA25, T1602_REF_CISCO_SNMP, T1602_REF_CISCO_COMMAND_ACCOUNTING, T1602_REF_RFC6241, T1602_REF_RFC3416, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
    unsupported_or_deferred:
      - No public transaction-level evidence joins one configuration-archive identity, one request, one successful response, and one saved configuration artifact in the aggregate CISA campaign.
      - No measured reduction in alerts or detection probability for either proposed Niji child.
      - No conclusion-level incident evidence supports NETCONF/XML/gRPC command-accounting mismatch as an exploited stealth axis.
      - No same-incident evidence joins a selective MIB/YANG filter, actual returned configuration values, and a defender-observation effect.
      - No evidence proves intentional distribution of one configuration collection task across sources or devices.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级和两个子项分别完成定义、匿迹特性、边界、场景、攻防模型、因果机理、证据及限制。正文以配置取得的结果门、管理任务归因与副本观察面为中心，没有把 NJT-0001 的子项数量或模板化句式复制过来。
      en: Parent and both children cover definition, stealth properties, boundaries, scenarios, attacker and defender models, causal mechanism, evidence, and limitations. Prose centers on configuration-acquisition outcome gates, management-job attribution, and replica observation planes without copying NJT-0001's child count or templated language.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - fixed-baseline workbook and inventory lookup
      - shared-library exact and semantic text lookup
      - YAML syntax validation
  limitations:
    paragraphs:
      - zh: 研究使用固定 19.1 工作簿决定候选与 ATT&CK 子项广度，不采用后续 live ATT&CK 新增案例改变范围。Jaguar Tooth 对父级内容取得最强，AA25-239A 对两项原生变量提供多事件高可信支持，但事务级证据不完整。因此主 Agent 若无法在跨候选收敛中接受 aggregate case 对变量存在性的支持，应保留父级 adapt，将一个或两个子项降为 deferred，而不应降低取得结果门。
        en: Research uses the fixed 19.1 workbook for candidate and ATT&CK-child breadth and does not change scope based on later live ATT&CK examples. Jaguar Tooth is strongest for parent content acquisition, while AA25-239A gives high-credibility multi-incident support for both native variables without complete transaction evidence. If cross-candidate convergence cannot accept an aggregate case as support for an axis's existence, the primary agent should retain parent adaptation and defer one or both children rather than lower the acquisition-outcome gate.
      - zh: 正常网络管理会规律读取大量敏感配置，导致简单的“高量/夜间/管理员”规则误报。具体 Analytic 因而要求作业授权和内容结果核对，并承认许多平台缺少逐读日志。任何部署都需先用合法 NMS、RANCID/备份、合规、灾备和厂商支持流量验证字段、保留期和基线；不得为获得通用覆盖而声明不存在的 channel 或字段。
        en: Normal network management regularly reads large amounts of sensitive configuration, making simple high-volume, nighttime, or administrator rules noisy. Proposed analytics therefore require job authorization and content-outcome reconciliation while acknowledging that many platforms lack per-read logs. Every deployment must first validate fields, retention, and baseline against legitimate NMS, RANCID or backup, compliance, disaster-recovery, and vendor-support flows. It must not claim nonexistent channels or fields to obtain generic coverage.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: No evidence shows configuration content is transformed or obscured during source acquisition; encryption, compression, or redaction are transport, storage, or post-acquisition properties.
    - mechanism_ref: NM-ST
      reason: Low-rate, incremental, or distributed querying lacks conclusion-level trace-dilution evidence here and overlaps NJT-0135 when driven by cross-pass state.
    - mechanism_ref: NM-FD
      candidate_axis: protocol-or-vendor-normality
      reason: Use of SNMP, NETCONF, CLI, or a vendor tool alone does not prove disguise; the formal NM-FD axis requires a recognized principal or manager and successful configuration outcome.
  open_questions:
    - Can local or additional primary evidence join one RANCID/NMS service identity to an unauthorized device/object request, successful response, and saved configuration artifact?
    - Which target network platforms expose read RPC completion and response quantity, and which require NMS-side instrumentation because device command accounting omits the interface?
    - Do deployed Git/CVS/SVN or backup systems expose file/object reads, or only repository clone and administrative events requiring checkout-side telemetry?
    - Should the aggregate AA25-239A campaign be a new configuration-specific CASE or a separate event slice related to existing CASE-000256 without merging central facts?
