      note:
        zh: AA25-239A 已存在且 URL/通告身份相同，应扩展 locator 与 notes 以覆盖配置文件从 provider script/设备勘测和 TFTP 取得、配置归档服务凭据及既有监控工具；原对象只定位抓包，不应再建重复 Reference。引用仍须注明通告聚合多个 actor/事件，不能把所有事实串成单一事务。
        en: AA25-239A already exists under the same URL and advisory identity. Extend locator and notes to cover configuration files acquired from provider-script output or device survey and TFTP, configuration-archive service credentials, and existing monitoring tools. Its current locator is packet-capture specific, so a duplicate Reference should not be created. Use must still note that the advisory aggregates actors and incidents and cannot turn all facts into one transaction.
