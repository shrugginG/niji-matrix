        en: The same fixed ATT&CK Enterprise 19.1 STIX identity can anchor T1602 parent behavior, TA0009 mapping, and planning-only breadth for its two ATT&CK children. Extend its locator without using it to prove Niji children or stealth effects.
    - object_ref: REF-000792
