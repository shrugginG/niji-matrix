coverage_resolutions:
  - attack_subtechnique_id: T1602.002
    attack_name_en: Network Device Configuration Dump
    represented_dimension:
      zh: 从运行配置、启动配置或导出文件取得较完整的网络设备配置内容
      en: Acquisition of relatively complete network-device configuration content from running, startup, or exported configuration
    resolution: parent-core
    rationale:
      zh: 该子项证明父级必须覆盖配置内容实际取得，并为 Jaguar Tooth 运行配置导出等事件提供行为背景；完整导出、协议、设备厂商和配置格式不是稳定匿迹变量，不能直接成为 Niji 子项。它分别为受信管理语境读取和离线副本读取提供场景证据，但不决定任一子项身份。
      en: This child establishes that the parent must cover actual acquisition of configuration content and supplies behavioral context for incidents such as Jaguar Tooth dumping a running configuration. A full dump, protocol, device vendor, or configuration format is not a stable stealth variable and cannot become a Niji child directly. It contributes scenarios to both trusted-management-context and offline-copy retrieval without defining either child.
    imported_as_niji_child: false
  - attack_subtechnique_id: T1602.001
    attack_name_en: SNMP (MIB Dump)
    represented_dimension:
      zh: 经 SNMP 读取 MIB 对象和值，包括设备、接口、路由和部分运行配置视图
      en: Reading MIB objects and values through SNMP, including device, interface, route, and some running-configuration views
    resolution: niji-variable-candidate
    rationale:
      zh: SNMP GET、GETNEXT 与 GETBULK 可返回对象值，适合检验选择性配置投影、只读监控身份和正常轮询语境是否改变观察；但 SNMP 本身只是协议载体。公开事件资料多能证明查询、枚举或目标 MIB，缺少逐次响应内容、返回大小与告警变化的同链证据，因此只为跨协议的受信管理语境轴提供背景，不能导入为 Niji 子项。
      en: SNMP GET, GETNEXT, and GETBULK can return object values and therefore help test whether selective configuration projection, read-only monitoring identities, or ordinary polling context changes observation. SNMP itself remains only a carrier. Public incident reporting usually establishes queries, enumeration, or targeting of MIB content without linking each response value, response size, and alert effect, so it contributes background to a cross-protocol trusted-management-context axis and is not imported as a Niji child.
    imported_as_niji_child: false
candidate_stealth_axes:
  - key: T1602_AXIS_TRUSTED_MANAGEMENT_CONTEXT
    title:
      zh: 受信管理语境配置取得
      en: Trusted-Management-Context Configuration Retrieval
    resolution: proposed-formal
    attacker_controlled_variable:
      zh: 攻击者使配置读取由已登记的只读监控、配置归档或其他自动化主体及其批准管理来源发起，或让恶意读取伴随正常轮询/备份作业出现。
      en: The adversary causes configuration reads to originate from a registered read-only monitoring, configuration-archive, or other automation principal and approved manager source, or places malicious reads alongside normal polling or backup work.
    trace_change:
      zh: 设备侧保留成功认证、管理请求与响应，但主体、来源和协议外观与正常管理活动相同；异常转移到作业授权、设备范围、对象范围和返回结果是否匹配。
      en: The device retains successful authentication, management requests, and responses, but principal, source, and protocol appearance match ordinary management activity; the anomaly moves to job authorization, device scope, object scope, and returned outcome.
    defender_observation_difference:
      zh: 只按未授权 IP、失败认证或未知账户检测会漏掉该路径，防守方必须连接身份委派、NMS 作业、请求、成功响应及实际配置产物。
      en: Detection based only on unauthorized IPs, failed authentication, or unknown accounts can miss this path; defenders must join identity delegation, NMS job intent, request, successful response, and actual configuration artifact.
    evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_RFC6241, T1602_REF_RFC3416]
    confidence: medium
  - key: T1602_AXIS_OFFLINE_COPY
    title:
      zh: 既有配置副本取得
      en: Preexisting Configuration-Copy Retrieval
    resolution: proposed-formal
    attacker_controlled_variable:
      zh: 攻击者从配置归档、版本库、备份目录或 provider script 已生成的输出读取所需配置，而不在目标设备上发起本次实时配置读取。
      en: The adversary reads needed configuration from an archive, version repository, backup directory, or output already produced by provider scripts without initiating a live configuration read on the target device for this acquisition.
    trace_change:
      zh: 本次 Collection 的读取与返回痕迹从设备管理面迁移到副本存储、版本库或配置管理服务器；设备最多保留较早的合法采集记录，当前攻击读取没有对应设备命令。
      en: The read and return traces for this Collection event move from the device management plane to replica storage, a version repository, or a configuration-management server. The device may retain only an earlier legitimate collection record, with no corresponding device command for the current adversary read.
    defender_observation_difference:
      zh: 只审查设备 AAA 和命令历史无法看到当前取得，需将副本对象、版本、读取者、成功返回和批准备份/合规消费者联查。
      en: Device AAA and command history alone cannot see the current acquisition; defenders need replica object, version, reader, successful return, and approved backup or compliance-consumer context.
    evidence_keys: [T1602_REF_CISA_AA25, T1602_REF_RANCID, T1602_REF_CISCO_VERSIONING]
    confidence: medium
  - key: T1602_AXIS_INTERFACE_AUDIT_MISMATCH
    title:
      zh: 配置读取接口与权威命令审计错位
      en: Configuration-Read Interface and Authoritative Command-Audit Mismatch
    resolution: evidence-deferred
    rationale:
      zh: Cisco 文档明确部分 IOS XR 命令记账不覆盖 NETCONF、XML 或 gRPC，证明观察面可能分裂；RFC 6241 也证明 get-config 能返回配置。但尚无公开事件同时证明攻击者经缺口接口实际取得配置并因此改变防守观察，故不正式化。
      en: Cisco documentation states that some IOS XR command accounting does not cover NETCONF, XML, or gRPC, establishing a possible split in observation. RFC 6241 establishes that get-config can return configuration. No public incident source yet proves actual adversary acquisition through such a gap and a resulting defender-observation change, so the axis remains deferred.
    evidence_keys: [T1602_REF_CISCO_COMMAND_ACCOUNTING, T1602_REF_RFC6241]
  - key: T1602_AXIS_SELECTIVE_CONFIGURATION_PROJECTION
    title:
      zh: 选择性配置投影读取
      en: Selective Configuration-Projection Reading
    resolution: evidence-deferred
    rationale:
      zh: NETCONF filter、SNMP MIB view 与 OID 读取可缩小返回集合，且与全量导出有不同响应形态；现有事件资料未把特定过滤条件、实际返回值和低可见性结果连成同一证据链。选择性不因返回量较小而自动成为匿迹子项，也不能复制 NJT-0143 的查询选择轴。
      en: NETCONF filters, SNMP MIB views, and OID reads can narrow returned data and differ from a full export, but incident reporting does not join a particular filter, actual returned values, and a lower-visibility outcome in one evidence chain. Selectivity does not become a stealth child merely because fewer values are returned, and it cannot copy NJT-0143's query-selection axis.
    evidence_keys: [T1602_REF_RFC6241, T1602_REF_RFC3416, T1602_REF_CISCO_SNMP]
  - key: T1602_AXIS_DISTRIBUTED_QUERY
    title:
      zh: 跨来源或跨设备分散查询
      en: Cross-Source or Cross-Device Distributed Querying
    resolution: evidence-deferred
    rationale:
      zh: 分散查询可能降低单源局部量，但当前来源只证明多个设备、多个主体或 actor-controlled hosts 参与活动，没有证明有意分配同一配置取得任务及其成功返回。自动化与跨轮状态还需交给 NJT-0135 独立判断。
      en: Distributed queries could reduce per-source local volume, but current sources establish activity across devices, principals, or actor-controlled hosts without proving intentional partition of one configuration-acquisition task and its successful returns. Automation and cross-pass state still require separate NJT-0135 assessment.
    evidence_keys: [T1602_REF_CISA_AA25]
  - key: T1602_AXIS_LOW_RATE_INCREMENTAL
    title:
      zh: 低频增量配置取得
      en: Low-Rate Incremental Configuration Acquisition
    resolution: adjacent-technique
    owner_ref: NJT-0135
    rationale:
      zh: 若行为按配置版本、变化检查点或轮次状态只取增量，其稳定变量是自动收集的跨轮状态和时序，而不是配置来源本身；应与 T1602 来源技术并列标注 NJT-0135，不在本父级重复建子项。
      en: When behavior uses configuration versions, change checkpoints, or cross-pass state to retrieve only increments, the stable variable is automated collection state and timing rather than the configuration source. NJT-0135 should be co-classified with T1602 instead of duplicating a child here.
prohibited_partitions:
  - SNMP versus NETCONF versus RESTCONF versus CLI versus file transfer
  - vendor, network-device type, operating system, or appliance model
  - running versus startup configuration as a format label without a defender-observation change
  - text, XML, JSON, YANG, MIB, binary, compressed, or encrypted configuration format
  - full dump versus individual OID based only on quantity
proposed_niji_child_count: 2
breadth_gap_explanation:
  zh: 两个 ATT&CK 子项按实现与内容粒度划分，而本研究按稳定匿迹变量收敛为两项跨协议子技术。T1602.002 的完整导出留在父级，T1602.001 的 SNMP/MIB 只为受信管理语境和选择性读取研究提供对照；正式 NJS 均不继承其名称、协议边界或编号。
  en: The two ATT&CK children partition implementation and content granularity, while this research converges on two cross-protocol Niji children defined by stable stealth variables. T1602.002 full dumps remain parent core, and T1602.001 SNMP/MIB supplies contrast for trusted-management-context and selective-reading research. Neither formal NJS inherits an ATT&CK name, protocol boundary, or identifier.
