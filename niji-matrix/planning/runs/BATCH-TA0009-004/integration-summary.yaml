review_notes_zh: 五个 ATT&CK Enterprise 19.1 父候选均先完成 adapt 准入，新增 NJT-0214 至 NJT-0218 及六个 Niji 原生子项。T1005 派生视图因证据不足保持 deferred；其余子项按变化事件、消费者介入、既有共享映射、云授权载体与消费主体解绑、受信管理语境及既有配置副本划分。质量、五份
  Bundle、127 项 Web 测试和 11 个对象双语 API QA 通过；TA0009 正式 15/17，剩余 2 项。对象保持 review，等待人工领域评审。
review_notes_en: All five ATT&CK Enterprise 19.1 parents received adapt admission, producing NJT-0214 through NJT-0218 and
  six Niji-native children. T1005's derivative-view hypothesis remains deferred for insufficient evidence. The admitted children
  separate change events, consumer interposition, preexisting share mappings, cloud authorization-carrier and consumer decoupling,
  trusted management context, and preexisting configuration copies. Quality, five bundles, 127 Web tests, and bilingual API
  QA for eleven objects passed. TA0009 has 15 of 17 formal parents with two remaining. Objects remain at review pending human
  domain approval.
