handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0009-005
work_item_ref: WORK-TA0009-T1025
temporary_key_prefix: T1025_
candidate:
  source_type: attack
  source_attack_id: T1025
  source_attack_version: '19.1'
  name: {zh: 从可移动介质获取数据, en: Data from Removable Media}
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        固定 ATT&CK Enterprise 19.1 将 T1025 置于 Collection，描述攻击者在已失陷计算机上从已连接的 USB 存储、光盘和其他可移动介质寻找并收集敏感数据；固定版没有 ATT&CK 子项。ESET 在 Turla 使用的 Crutch 工具集中分析出监视可移动驱动器、把匹配文件置入加密归档并在新版中自动上传本地和可移动驱动器文件的组件。Kaspersky 又在一处外交机构受害环境发现 TajMahal，并逆向出可在先前见过的 USB 再次接入时窃取指定文件的能力。这些来源足以保留介质内容取得这一父行为，但没有公开逐文件读取、稳定介质身份和取得内容的完整受害时间线，因此置信度为 medium。
      en: >-
        The fixed ATT&CK Enterprise 19.1 baseline places T1025 under Collection and describes adversaries searching and collecting sensitive data from USB storage, optical media, and other removable media connected to a compromised computer; the fixed version has no ATT&CK children. ESET analyzed a removable-drive monitor in the Turla Crutch toolset that placed matching files into an encrypted archive and, in a later version, automatically uploaded files from local and removable drives. Kaspersky separately found TajMahal in a diplomatic victim environment and reverse engineered the ability to steal a requested file when a previously seen USB returned. These sources justify retaining acquisition of media content, but do not publish a complete victim timeline joining per-file reads, stable media identity, and acquired content, so confidence is medium.
    - zh: >-
        建议适配为“匿迹型可移动介质内容获取”。介质位置本身不构成匿迹；正式范围要求攻击者利用正常接入、介质读取授权或跨接入状态，使恶意读取在进程来源、业务目的或时间谱系上难与用户导入、备份、取证、杀毒扫描和恢复区分，并证明内容进入攻击者控制的处理链。开放式分类搜索仅建议一项 Niji 原生子项“重接入门控目标回收”：先保存介质与目标对象知识，待同一介质后续接入才读取既定目标，把发现与取得分散到不同接入会话。TajMahal 直接支持能力设计，但无告警率或逐文件受害结果测量，故子项保持 medium。
      en: >-
        Adapt the parent as Stealth-Oriented Removable-Media Content Acquisition. Media location is not stealth by itself. Formal scope requires the adversary to exploit ordinary attachment, media-read authorization, or state across attachments so malicious reads are hard to distinguish from user import, backup, forensics, antimalware scanning, or recovery by process origin, business purpose, or temporal lineage, while proving that content entered an attacker-controlled processing path. Open taxonomy search supports only one Niji-native child, Reattachment-Gated Target Recall: retain media and target-object knowledge and read the selected target only when the same medium later returns, dispersing discovery and acquisition across sessions. TajMahal supports the capability design but provides no alert-rate or per-file victim-outcome measurement, so confidence remains medium.
  scope_notes:
    zh: >-
      直接对象是当前由可移动存储、光盘、可携设备对象存储或等价介质提供的文件正文或字节。T1120、卷枚举、盘符出现、mount、目录列表、文件名和属性只证明介质或候选对象；须以允许的 File Read、4663 ReadData、可信读取遥测、输出对象或等价内容结果补强。T1091/NJT-0058 负责恶意内容随介质进入另一主机并触发；T1005/NJT-0215 负责正常导入后的本地副本；T1074/NJT-0134 负责暂存；T1560/NJT-0133 负责归档；T1119/NJT-0135 负责自动选择、轮询和检查点；T1570/NJT-0130 负责内部送达；NJT-0194 负责写入介质并离域；NJT-0207 负责介质命令—结果闭环；NJT-0108 负责原始卷、隐藏分区和普通文件命名空间之外的读取。
    en: >-
      The direct object is a file body or bytes supplied by removable storage, optical media, a portable-device object store, or equivalent media. T1120, volume enumeration, a drive letter, mount, directory listing, filename, and attributes establish only a medium or candidate object and require an allowed File Read, event 4663 ReadData, validated read telemetry, an output object, or equivalent content result. T1091 and NJT-0058 own malicious content triggering another host; T1005 and NJT-0215 own local copies after normal import; T1074 and NJT-0134 own staging; T1560 and NJT-0133 own archiving; T1119 and NJT-0135 own automated selection, polling, and checkpoints; T1570 and NJT-0130 own internal delivery; NJT-0194 owns writing to media and departure; NJT-0207 owns media command-result loops; and NJT-0108 owns raw volumes, hidden partitions, and reads outside the ordinary file namespace.
proposed_content:
  temporary_key: T1025_PARENT
  name: {zh: 匿迹型可移动介质内容获取, en: Stealth-Oriented Removable-Media Content Acquisition}
  summary:
    zh: 攻击者从当前接入的可移动介质实际取得内容，并借用正常介质接入、读取授权或跨接入状态，使恶意读取与导入、备份、扫描、取证或恢复在单一观察面上难以区分。
    en: An adversary actually obtains content from currently attached removable media while borrowing ordinary attachment, read authorization, or state across attachments so one observation point poorly distinguishes malicious reads from import, backup, scanning, forensics, or recovery.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: >-
        匿迹型可移动介质内容获取是攻击者在已能控制主机进程、账户或本地植入后，从当时由可移动存储、光盘或可携设备对象存储提供的文件或数据流读取内容，并有意使用正常接入时机、既有读取授权或跨接入目标状态降低恶意目的的可见差异。完成条件是介质内容进入攻击者可处理的内存、文件、归档或传输链；检测到设备、分配盘符、列出目录、匹配扩展名、成功打开句柄或一次允许策略判定均不能单独证明内容已取得。
      en: >-
        Stealth-Oriented Removable-Media Content Acquisition occurs after an adversary can control a host process, account, or local implant and reads content from a file or data stream then supplied by removable storage, optical media, or a portable-device object store, deliberately using ordinary attachment timing, existing read authority, or target state across attachments to reduce visible differences in purpose. Completion requires media content to enter attacker-usable memory, a file, an archive, or a transfer chain. Device detection, drive-letter assignment, directory listing, extension matching, a successfully opened handle, or one allowing policy decision cannot alone establish acquisition.
    - zh: >-
        概念锚是“介质身份—接入会话与挂载点—读取主体和进程—介质对象路径—成功内容读取—后继处理”，不是 USB、CD、MTP、盘符、文件类型或复制工具。若合法应用已把对象导入内部磁盘，攻击者随后只接触内部副本，则当次获取归本地内容；若绕过普通文件命名空间读取物理设备或隐藏区域，则归原始存储视图。
      en: >-
        The conceptual anchor is media identity, attachment session and mount point, reading principal and process, media object path, successful content read, and subsequent processing rather than USB, CD, MTP, a drive letter, file type, or copy utility. If a legitimate application has imported an object to internal storage and the adversary touches only that copy, the acquisition is local content. Bypassing the ordinary file namespace to read a physical device or hidden region is raw-storage-view access.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        员工、导入程序、备份恢复工具、反恶意软件、电子取证工具和索引服务本来就会读取可移动介质。恶意程序等待用户或操作系统完成正常接入，再以同一用户或服务身份读取时，设备接入、卷挂载和允许 File Read 都可准确记录事实，却不表达业务目的。只以未知 DeviceID、新 mount、脚本名称或大量复制为判据会漏掉认可介质上的小量目标读取，也会误报常规扫描和导入。
      en: >-
        Employees, importers, backup and restore tools, antimalware, forensic tools, and indexing services routinely read removable media. When malware waits for ordinary attachment and reads through the same user or service authority, attachment, volume mount, and an allowed File Read can accurately record facts while failing to express business purpose. Detection based only on unknown DeviceID, a new mount, a script name, or bulk copying can miss sparse targeted reads from approved media and misclassify ordinary scanning and import.
    - zh: >-
        PnP 或 mount 只说明可达，设备控制允许或拒绝只说明策略处理了请求，4663 ReadData 说明对象访问权被实际使用；这些事件仍不保证完整文件被攻击者保留。进程谱系、对象路径、读后输出、归档输入或外联字节结果可提高结论强度。事件上限、隔离主机无代理、MTP 非盘符对象、加密介质及短保留会造成盲区。
      en: >-
        PnP or mount shows reachability, a device-control allow or deny shows policy handling, and event 4663 ReadData shows an exercised object right; none guarantees that the adversary retained a complete file. Process lineage, object path, post-read output, archive input, or egress bytes raises confidence. Event caps, agentless isolated hosts, non-drive-letter MTP objects, encrypted media, and short retention create blind spots.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求介质在读取当时仍是内容来源，并证明成功内容读取或等价结果。设备插入、PnpDeviceConnected、UsbDriveMounted、mount 命令、卷枚举、目录浏览、文件属性访问和策略允许只进入候选层；读取失败、仅 ReadAttributes、仅扫描文件名或内容未进入攻击者处理链均不完成父行为。普通文件系统、光盘和可携设备对象读取可同属父级；介质品牌、总线或协议不产生子项。
      en: >-
        Include behavior only when the medium remains the content source at read time and a successful content read or equivalent outcome is established. Device insertion, PnpDeviceConnected, UsbDriveMounted, mount, volume enumeration, directory browsing, file-attribute access, and policy allow remain candidate-level signals. A failed read, ReadAttributes alone, filename scanning alone, or content outside attacker control does not complete the parent. Ordinary filesystem, optical-disc, and portable-device object reads can belong to the parent; media brand, bus, and protocol do not form children.
    - zh: >-
        T1091/NJT-0058 以另一主机触发为结果；T1005/NJT-0215 接管导入后的本地副本；T1119/NJT-0135 接管自动编排；T1074/NJT-0134 与 T1560/NJT-0133 接管读后暂存和归档；T1570/NJT-0130 接管内部送达；NJT-0194 接管写介质离域；NJT-0207 要求命令、动作和结果闭环。用户导入、备份恢复、杀毒、迁移、电子发现、取证和合规复制须以批准设备、主体、签名、工单、路径、时间和去向排除。
      en: >-
        T1091 and NJT-0058 end in triggering another host; T1005 and NJT-0215 own imported local copies; T1119 and NJT-0135 own automation; T1074 and NJT-0134 plus T1560 and NJT-0133 own post-read staging and archiving; T1570 and NJT-0130 own internal delivery; NJT-0194 owns media departure; NJT-0207 requires a command-action-result loop. User import, backup restore, antimalware, migration, e-discovery, forensics, and compliance copying require exclusion by approved device, principal, signer, ticket, path, time, and destination.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          在外交、政府、研发和工业环境中，员工可将 USB、移动设备、光盘或维护介质接入已有植入的工作站。植入监视新卷、读取目标文档，再写入本地加密归档或直接上传。Crutch 早期版本暂存可移动驱动器文件，新版自动上传本地和可移动驱动器文件，说明源读取、暂存和外传虽连续发生仍需分别建模。TajMahal 还可先记住介质对象，待同一 USB 返回时窃取指定文件。
        en: >-
          In diplomatic, government, research, and industrial environments, employees may attach USB storage, mobile devices, discs, or maintenance media to a workstation already hosting an implant. The implant monitors new volumes, reads target documents, then writes a local encrypted archive or uploads directly. Early Crutch versions staged removable-drive files and the later version uploaded local and removable-drive files, showing that source read, staging, and exfiltration remain separate. TajMahal can instead remember a media object and steal the specified file when the same USB returns.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要在接入主机执行读取逻辑，或控制可代读的账户、服务或应用，并知道目标路径、格式或条件。操作系统须识别介质且策略允许文件级读取；加密卷需要解锁或密钥，MTP 等对象存储需要相应 API。重接入门控还需保存介质身份和目标状态，容忍盘符变化、离线、文件移动与序列号不可靠；等待降低主动扫描，却牺牲即时性并可能等不到介质。
          en: >-
            The adversary needs execution on the attachment host or control of an account, service, or application that can read, plus target path, format, or condition knowledge. The operating system must recognize the medium and permit file-level read; encrypted volumes need unlock or keys, and MTP object stores need an appropriate API. Reattachment gating also requires retained media identity and target state tolerant of drive-letter changes, offline periods, moved files, and unreliable serials. Waiting reduces active scanning but sacrifices immediacy and may never see the medium again.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需把 PnP、mount/unmount、介质序列号或组织资产号、卷和挂载点映射到主体会话、进程、对象路径和 ReadData，并以输出文件、归档或网络结果补强。还需维护批准介质、进程读取范围和业务作业，保存跨最长正常返回周期的介质—对象历史。设备事件上限、隔离端无代理、序列号复用和 MTP 字段差异均限制结论；USB 接入或一次读取不能独立归因。
          en: >-
            Defenders need to map PnP, mount and unmount, media serial or organizational asset identity, volume, and mount point to subject session, process, object path, and ReadData, strengthened by output file, archive, or network outcome. They also need approved media, process read scope, business jobs, and media-object history across the longest normal return cycle. Event caps, agentless isolated endpoints, reused serials, and MTP field differences limit conclusions; USB attachment or one read cannot independently establish maliciousness.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 介质读取借用正常导入扫描和恢复的主体与路径外观, en: Media reads borrow the principal and path appearance of ordinary import scanning and recovery}
    analysis:
      paragraphs:
      - zh: >-
          攻击者等待正常接入，再沿已允许的文件读取路径取得内容，使 DeviceID、用户、盘符和 ReadData 语义与导入、备份、杀毒或取证相似。痕迹没有消失，而是缺少业务目的；异常进程、未批准路径、对象敏感度、读后输出和目的地仍可揭示。Crutch 证明恶意介质读取，Microsoft 文档证明文件级读取可按介质、主体、进程和策略观察；未测告警效果，故置信度为 medium。
        en: >-
          The adversary waits for ordinary attachment and obtains content through an allowed file-read path, making DeviceID, user, drive path, and ReadData resemble import, backup, antimalware, or forensics. Traces remain but lack business purpose; anomalous process, unapproved path, sensitivity, output, and destination can expose them. Crutch establishes malicious media reads and Microsoft documentation supports observation by media, principal, process, and policy. Alert effect is unmeasured, so confidence is medium.
    evidence_keys: [REF-000914, REF-000597, T1025_REF_MS_DEVICE_CONTROL_POLICIES]
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: >-
          仅建议“重接入门控目标回收”。变量是介质—对象知识是否跨一次接入保存，并让后续取得由同一介质返回与既定目标匹配共同门控；反事实是在当前接入重新扫描并立即收集。它把发现、选择和读取分散到不同会话，防守需要关联介质身份、历史对象和当前成功读取。
        en: >-
          Recommend only Reattachment-Gated Target Recall. The variable is whether media-to-object knowledge persists beyond one attachment and later acquisition is gated by the same medium returning and a retained target match; the counterfactual rescans and collects in the current session. It disperses discovery, selection, and reading across sessions and requires joining media identity, historical objects, and current successful reads.
      - zh: >-
          接入触发、轮询、扩展名/关键词/年龄和增量归 T1119/NJT-0135 或父级；USB/CD/MTP、操作系统、API、盘符和文件类型只是实现。原始卷归 NJT-0108，命令—结果信箱归 NJT-0207，导入后副本归 NJT-0215。受信导入进程劫持与策略审计旁路因现场证据不足暂缓。
        en: >-
          Attachment triggers, polling, extension, keyword, age, and increments belong to T1119 and NJT-0135 or the parent. USB, CD, MTP, operating system, API, drive letter, and file type are implementations. Raw volumes belong to NJT-0108, command-result mailboxes to NJT-0207, and imported copies to NJT-0215. Trusted importer hijack and policy-audit bypass are deferred for insufficient field evidence.
    proposed_child_keys: [T1025_CHILD_REATTACHMENT_RECALL]
proposed_subtechniques:
- temporary_key: T1025_CHILD_REATTACHMENT_RECALL
  formalization_recommendation: proposed-formal
  confidence: medium
  name: {zh: 重接入门控目标回收, en: Reattachment-Gated Target Recall}
  summary:
    zh: 攻击者保存先前接入介质上的目标对象知识，待同一介质再次出现时才读取既定内容，使发现和取得分散到不同接入会话并缩小当前读取集合。
    en: An adversary retains target-object knowledge from an earlier media attachment and reads selected content only when the same medium returns, dispersing discovery and acquisition across sessions and narrowing the current read set.
  definition_and_concept:
    paragraphs:
    - zh: >-
        重接入门控目标回收以“取得是否依赖先前接入留下的介质—对象状态”为控制变量。攻击者在早期接入建立索引、记录对象或保存介质身份，随后选择目标；只有匹配介质再次接入且目标仍可定位时，植入才读取内容。完成仍要求后一次接入产生实际内容结果，早期索引、记住序列号、远程请求或等待状态都只证明准备。
      en: >-
        Reattachment-Gated Target Recall controls whether acquisition depends on media-to-object state retained from an earlier attachment. The adversary builds an index, records an object, or preserves media identity during an earlier session and later selects a target. The implant reads content only when the matching medium returns and the target remains locatable. Completion still requires a content result during the later attachment; an earlier index, remembered serial, remote request, or waiting state proves preparation only.
    - zh: >-
        “同一介质”应优先由组织资产标识、设备实例、卷 GUID、文件系统 ID 和可验证内容特征联合判定，不由盘符或序列号单独判定。“目标回收”不要求介质在两个已控主机间往返，也不要求命令—结果闭环；若整体存在闭环，通信另标 NJT-0207，本子项只描述特定内容从介质进入当前植入。
      en: >-
        The same medium should be established through organizational asset identity, device instance, volume GUID, filesystem identifier, and verifiable content features rather than a drive letter or serial alone. Target recall does not require shuttling between two compromised hosts or a task-result loop. If a loop exists, classify overall communication under NJT-0207 while this child describes selected content entering the current implant from media.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        重接入门控目标回收把广泛发现与成功读取置于不同接入会话。后一次接入可能只有一个或少数已知对象读取，没有紧邻的全盘枚举、关键词搜索或大量复制；短窗检测因而缺少同一进程内的“发现—读取”前缀。先前索引、目标请求或本地状态，当前介质身份、对象路径、ReadData 与读后输出仍能跨会话恢复链条。
      en: >-
        Reattachment-Gated Target Recall places broad discovery and successful reading in different attachment sessions. The later attachment may contain only one or a few known-object reads without adjacent full-drive enumeration, keyword search, or bulk copying, depriving a short-window detector of the discovery-to-read prefix. The earlier index, target request, or local state and the current media identity, object path, ReadData, and output can reconstruct the chain across sessions.
    - zh: >-
        TajMahal 的公开分析说明可对先前见过的 USB 请求指定文件并在下次接入时窃取，支持变量和痕迹变化；来源没有公开介质 ID、索引格式、逐文件审计或告警下降，因此不能声称普遍隐蔽。若实现每次仍全盘扫描，或只按修改时间跨轮读取，则分别退回父级/T1119 或 NJS-0135-001。
      en: >-
        Public TajMahal analysis states that a particular file can be requested from a previously seen USB and stolen on the next attachment, supporting the variable and trace change. It does not disclose media IDs, index format, per-file audit, or alert reduction, so universal stealth cannot be claimed. A full rescan on every return falls back to the parent and T1119; modification-time incremental reads belong to NJS-0135-001.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入需要四项事实：先前接入形成可归于该介质的对象知识；状态跨断开持续；匹配介质后续重接入；后续因既定目标匹配而成功读取内容。一次接入内立即扫描复制、按当前扩展名选择、普通最近文件历史、自动照片导入和合法恢复均排除。设备再次出现而没有目标读取，或读取无法与先前状态相连，也不能确认。
      en: >-
        Inclusion requires four facts: object knowledge attributable to the medium formed during an earlier attachment, state persisted across disconnection, a matching medium later reattached, and content was successfully read because a retained target matched. Immediate scan and copy, current extension selection, ordinary recent-file history, automatic photo import, and legitimate restore are excluded. Device return without a target read, or a read not joinable to prior state, cannot confirm the child.
    - zh: >-
        仅按最后扫描时间选择变化归 NJS-0135-001；介质主机信箱、任务号或跨角色标记归 NJS-0207-001/002；隐藏分区或原始扇区归 NJT-0108；合法导入后的内部缓存归 NJT-0215。文件类型、介质品牌、接入间隔和索引产品不形成兄弟项。
      en: >-
        Selection by last-scan time belongs to NJS-0135-001; media host mailboxes, task numbers, or cross-role markers belong to NJS-0207-001 or NJS-0207-002; hidden partitions or raw sectors belong to NJT-0108; internal caches after legitimate import belong to NJT-0215. File type, media brand, interval, and index product do not form siblings.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          外交或研发人员偶尔把高价值 USB 接入已受控工作站。植入首次建立对象知识，操作者随后选择某一文件；介质离开后无读取机会，直至同一介质数日后返回，植入仅取得指定对象并送入输出队列。Kaspersky 给出“先前见过—请求特定文件—下次接入窃取”的能力链，但未公开它在已知受害者上的逐文件运行证据。
        en: >-
          A diplomatic or research employee occasionally attaches a high-value USB to a compromised workstation. The implant first builds object knowledge, the operator later selects a file, and no read is possible until the medium returns days later, when the implant obtains only the selected object and queues it. Kaspersky supplies the previously seen, requested-file, next-attachment theft capability chain but not per-file execution evidence from the known victim.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要持久植入、可用介质识别、早期对象清单或索引、目标选择通道和跨重启/断开的状态，并能在盘符变化后解析路径。介质不再返回、对象删除或加密、文件系统重建和序列号重复都会使门控失败。越严格的目标选择越减少当前读取量，也越依赖准确历史和等待。
          en: >-
            The adversary needs a persistent implant, usable media identification, an earlier inventory or index, a target-selection channel, state surviving reboot and disconnection, and path resolution after drive-letter changes. A medium that never returns, a deleted or encrypted object, filesystem rebuild, or serial collision can defeat the gate. Stricter selection reduces current reads while increasing dependence on history and waiting.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需把每次接入规范化为稳定 media_id 与 attachment_session_id，保存先前枚举或索引进程、对象指纹、目标选择或植入状态，以及重接入时的 ReadData 和输出。历史短于返回周期会截断链，序列号复用须用卷或内容特征补强。照片目录、备份 catalog、取证清单和内容管理索引也跨接入记忆对象，须按批准进程、owner、工单、范围和输出排除。
          en: >-
            Defenders need stable media_id and attachment_session_id values, preserving earlier enumeration or index process, object fingerprints, target selection or implant state, and ReadData plus output on reattachment. History shorter than the return cycle severs the chain, and reused serials require volume or content features. Photo catalogs, backup catalogs, forensic manifests, and content indexes also remember objects across attachments and require exclusion by approved process, owner, ticket, scope, and output.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary: {zh: 跨接入状态把对象发现与目标读取分散到不同时间会话, en: Cross-attachment state disperses object discovery and targeted reading across sessions}
    analysis:
      paragraphs:
      - zh: >-
          攻击者在早期接入保存对象知识，在介质离线期间选择目标，并把实际读取推迟到匹配介质返回，使广泛发现、选择和取得分散到多个 attachment_session。当前会话只见小量既定读取时，短窗批量或“先枚举后复制”规则失去前缀；跨会话 media_id、对象指纹、植入状态和读后结果仍可反证。TajMahal 支持能力链但未测量告警变化，故置信度为 medium。
        en: >-
          The adversary preserves object knowledge during an earlier attachment, selects a target while the medium is offline, and defers reading until the matching medium returns, dispersing discovery, selection, and acquisition across attachment sessions. When the current session contains only sparse predetermined reads, short-window bulk or enumerate-then-copy rules lose their prefix. Cross-session media_id, object fingerprint, implant state, and output remain disconfirming. TajMahal supports the capability chain but not alert change, so confidence is medium.
    evidence_keys: [REF-001077]
    confidence: medium
  evidence_keys: [REF-001077, T1025_REF_ATTACK_V19, REF-000597, REF-000379]
  defense_strategy_keys: [T1025_DET_MEDIA_READ_OUTCOME]
  mitigation_keys: [T1025_MIT_MEDIA_READ_AUTHORIZATION]
  limitations:
    paragraphs:
    - zh: >-
        TajMahal 报告没有公开介质序列号、卷 GUID、对象索引、读取 API、逐文件事件、取得内容摘要或后继输出，且只确认一处受害环境；它证明能力设计与跨接入选择变量，不证明该模块在受害者上成功窃取某个 USB 文件或降低告警。若未来只证实每次重扫，应撤回子项并保留父技术。
      en: >-
        The TajMahal report does not publish media serials, volume GUIDs, object indexes, read APIs, per-file events, acquired-content hashes, or output, and confirms only one victim environment. It establishes capability design and the cross-attachment variable, not successful theft of a particular USB file on that victim or reduced alerting. If future evidence shows only rescanning, withdraw the child while retaining the parent.
defense_candidates:
  detection_strategies:
  - temporary_key: T1025_DET_MEDIA_READ_OUTCOME
    name: {zh: 可移动介质接入—成功内容读取—进程结果关联, en: Removable-Media Attachment to Successful Content Read and Process Outcome Correlation}
    objective:
      zh: 把设备接入、策略处理和对象枚举与实际文件级读取分层，再把成功读取连接到介质身份、进程、批准作业、历史对象状态和后继输出。
      en: Separate attachment, policy handling, and object enumeration from actual file-level reads, then join successful reads to media identity, process, approved work, historical object state, and output.
    detects_keys: [T1025_PARENT, T1025_CHILD_REATTACHMENT_RECALL]
    domains: [enterprise]
    analytic_keys: [T1025_NJA_WINDOWS_MEDIA_READ_LINEAGE, T1025_NJA_REATTACHMENT_TARGET_RECALL]
    evidence_keys: [REF-000597, REF-001070, REF-000379, REF-000906, T1025_REF_MS_DEVICE_CONTROL_POLICIES, REF-000914, REF-001077]
  detection_analytics:
  - temporary_key: T1025_NJA_WINDOWS_MEDIA_READ_LINEAGE
    strategy_key: T1025_DET_MEDIA_READ_OUTCOME
    name: {zh: Windows 可移动介质文件读取与进程结果谱系, en: Windows Removable-Media File Read and Process Outcome Lineage}
    platforms: [Windows]
    logic:
      zh: >-
        以 PnpDeviceConnected、UsbDriveMounted 或等价事件为每次接入生成 attachment_session_id，保存 DeviceId、MediaDeviceId、MediaInstanceId、MediaSerialNumber、卷/盘符、用户和时间。部署显式 Device Control AuditAllowed/AuditDenied；只把 RemovableStoragePolicyTriggered 中表示文件级读取、verdict 为允许、含 FolderPath、FileSize、InitiatingProcess 和介质字段的事件作为允许读取候选。Disk-level read、mount、目录/属性浏览和 deny 不升级为内容取得；达到每台设备每日高级搜寻上限时标记 telemetry_capped。
        
        启用 Audit Removable Storage，把同一接入会话、用户/LogonId、对象路径和短窗内的 4663 ReadData 连接到进程；4663 表示访问权被实际使用，但不保证完整文件留存。再连接进程启动、签名、父进程和网络，寻找同一进程或明确子进程产生的输出文件、归档成员或外联字节。按介质、进程、用户和十五分钟聚合，与批准的导入、备份、杀毒、取证、恢复和迁移比较。输出 attachment_only、access_policy_only、exercised_read 或 read_with_attacker_usable_outcome；只有后两级且来源未经批准时进入告警。
      en: >-
        Generate attachment_session_id from PnpDeviceConnected, UsbDriveMounted, or equivalent events and retain DeviceId, MediaDeviceId, MediaInstanceId, MediaSerialNumber, volume or drive, user, and time. Deploy explicit Device Control AuditAllowed and AuditDenied. Treat RemovableStoragePolicyTriggered as an allowed-read candidate only when it denotes file-level read, verdict is allowed, and FolderPath, FileSize, InitiatingProcess, and media fields exist. Disk-level read, mount, directory or attribute browsing, and deny do not become acquisition; mark telemetry_capped when the per-device daily advanced-hunting cap is reached.
        
        Enable Audit Removable Storage and join event 4663 ReadData in the same attachment session, user or LogonId, object path, and short window to its process. Event 4663 shows exercised access but not complete-file retention. Join process start, signer, parent, and network, then find output files, archive members, or egress bytes produced by the same process or explicit child. Aggregate by medium, process, user, and fifteen minutes and compare with approved import, backup, antimalware, forensics, restore, and migration. Emit attachment_only, access_policy_only, exercised_read, or read_with_attacker_usable_outcome; only the latter two with unapproved sources alert.
    data_requirements:
    - source_type: mde-device-control
      channel: DeviceEvents PnpDeviceConnected UsbDriveMounted UsbDriveUnmounted RemovableStoragePolicyTriggered
      required_fields: [timestamp, device_id, action_type, initiating_process_account, initiating_process_id, initiating_process_file_name, media_device_id, media_instance_id, media_serial_number, media_bus_type, media_class_name, folder_path, file_size, removable_storage_access, removable_storage_policy_verdict]
    - source_type: windows-removable-storage-audit
      channel: Security/4663 with Audit Removable Storage success auditing
      required_fields: [timestamp, device_id, subject_user_sid, subject_logon_id, object_name, process_id, process_name, access_mask, accesses]
    - source_type: endpoint-process-file-network
      channel: EDR process file archive and network telemetry
      required_fields: [timestamp, device_id, process_unique_id, parent_process_unique_id, user_id, image, signer, command_line, source_path, destination_path, bytes_written, archive_path, remote_endpoint, network_bytes]
    observables:
    - {zh: 介质接入后未经批准进程出现文件级读取允许与 4663 ReadData，并产生输出、归档或外联, en: An unapproved process produces file-level read allow and event 4663 ReadData after attachment followed by output archive or egress}
    - {zh: 只有 mount、目录或 ReadAttributes 时保持候选层, en: Mount directory access or ReadAttributes alone remains candidate-level}
    correlation:
      window: 15m per attachment session with history retained for the approved business cycle
      dimensions: [device_id, attachment_session_id, media_instance_id, media_serial_number, volume_id, mount_point, user_id, logon_id, process_unique_id, object_path, output_path, remote_endpoint]
    false_positives:
    - {zh: 照片导入、备份恢复、杀毒、索引、取证、DLP、迁移和离线补丁会合法读取介质, en: Photo import backup restore antimalware indexing forensics DLP migration and offline patching legitimately read media}
    - {zh: 用户经 Explorer 或 Finder 正常打开文件可能由通用 shell 发起, en: Ordinary user opens through Explorer Finder or peers can originate from a generic shell}
    blind_spots:
    - {zh: 未启用策略审计或 4663、事件达到上限、隔离端无代理或 EDR 不记录读取, en: Missing policy audit or 4663 event caps agentless isolated hosts or EDR without read telemetry}
    - {zh: MTP、PTP、加密容器、原始卷或设备缓存不一定呈现普通盘符 ReadData, en: MTP PTP encrypted containers raw volumes or device caches may not present ordinary drive ReadData}
    tuning_guidance:
      zh: >-
        先以审计模式验证 RemovableStorageAccess、FolderPath 覆盖和事件量，再按介质组、用户组和 File Read mask 8 收窄。例外绑定签名、用户/服务 SID、介质组、路径、工单和有效期，不按进程名或 DeviceID 永久放行。对象敏感度、非交互会话、异常父进程、隐藏输出和紧邻外联提高优先级；mount 或 denied event 只用于发现和策略诊断。
      en: >-
        Validate RemovableStorageAccess, FolderPath coverage, and event volume in audit mode, then narrow by media group, user group, and File Read mask 8. Bind exceptions to signer, user or service SID, media group, path, ticket, and expiry rather than process name or DeviceID alone. Sensitivity, noninteractive session, anomalous parent, hidden output, and proximate egress raise priority; mount and denied events support discovery and policy diagnostics only.
    evidence_keys: [REF-000597, REF-001070, REF-000379, REF-000906, T1025_REF_MS_DEVICE_CONTROL_POLICIES]
  - temporary_key: T1025_NJA_REATTACHMENT_TARGET_RECALL
    strategy_key: T1025_DET_MEDIA_READ_OUTCOME
    name: {zh: 跨介质接入历史目标—当前稀疏读取差分, en: Cross-Attachment Historical Target to Current Sparse-Read Differential}
    platforms: [Windows]
    logic:
      zh: >-
        为每次接入建立 media_id 和 attachment_session_id，以介质实例、卷 GUID、文件系统 ID、组织资产号和可选根目录摘要组合识别，避免只依赖序列号。保存介质枚举、索引数据库写入、对象路径和可用摘要，以及建立状态的进程；把植入配置、任务或对象选择规范化为含 media_id、路径、file_id/hash 和选择时间的 target_key，历史至少覆盖批准介质最长正常返回周期。
        
        后续匹配介质重接入时，以父 Analytic 的 exercised_read 或 read_with_attacker_usable_outcome 为结果门，检查读取对象是否匹配早期 target_key，并计算 discovery_to_read_session_gap、current_session_enumeration_count、targeted_read_count 和 post_read_outcome。同一非批准组件在不同接入会话先建立对象知识，后来没有相称当前枚举却只读少量既定目标并产生输出时，报告 reattachment_gated_target_recall。当前会话全盘重扫归父级/T1119；修改时间检查点归 NJS-0135-001；命令/结果信箱交 DET-000239。
      en: >-
        Build media_id and attachment_session_id for every attachment using a combination of media instance, volume GUID, filesystem ID, organizational asset number, and optional root digest rather than serial alone. Retain media enumeration, index-database writes, object path and available hash, and the process creating state. Normalize implant configuration, tasking, or selection into target_key containing media_id, path, file_id or hash, and selection time, retaining history for the longest normal return cycle.
        
        On matching-media reattachment, use exercised_read or read_with_attacker_usable_outcome from the parent analytic as the result gate, test the read against an earlier target_key, and calculate discovery_to_read_session_gap, current_session_enumeration_count, targeted_read_count, and post_read_outcome. Report reattachment_gated_target_recall when the same unapproved component builds object knowledge in one session and later reads a few predetermined targets without proportionate current enumeration and produces output. A current full rescan belongs to the parent and T1119; a modification-time checkpoint belongs to NJS-0135-001; a command or result mailbox goes to DET-000239.
    data_requirements:
    - source_type: normalized-media-session
      channel: device control PnP mount unmount and volume inventory
      required_fields: [timestamp, device_id, attachment_session_id, media_id, media_instance_id, media_serial_number, volume_guid, filesystem_id, organizational_asset_id, mount_point, user_id, event_type]
    - source_type: media-object-access-history
      channel: endpoint enumeration indexing and ReadData telemetry
      required_fields: [timestamp, device_id, attachment_session_id, media_id, process_unique_id, user_id, operation, object_path, file_id, content_hash, access_result, bytes_read]
    - source_type: implant-target-state
      channel: EDR file registry database or task configuration changes
      required_fields: [timestamp, device_id, process_unique_id, state_path, media_id, selected_object_path, selected_file_id, selected_hash, state_action]
    - source_type: endpoint-output-lineage
      channel: file archive process and network telemetry
      required_fields: [timestamp, device_id, process_unique_id, parent_process_unique_id, source_object_path, output_path, archive_path, remote_endpoint, bytes_written]
    observables:
    - {zh: 早期接入由同一组件建立介质对象知识，后续无广泛当前枚举却读取匹配的少量目标, en: The same component builds media-object knowledge earlier then reads a few matching targets later without broad current enumeration}
    - {zh: 匹配目标读取后出现输出队列、归档成员或外联结果, en: A matched target read is followed by an output queue archive member or egress outcome}
    correlation:
      window: one complete approved media return cycle with no universal fixed duration
      dimensions: [device_id, media_id, attachment_session_id, process_component_id, user_id, object_path, file_id, content_hash, target_key, output_path]
    false_positives:
    - {zh: 照片管理、备份 catalog、取证清单、媒体资产管理和电子发现会记住先前对象并在介质返回时读取, en: Photo management backup catalogs forensic manifests media asset management and e-discovery remember prior objects and read when media returns}
    - {zh: 最近文件列表或搜索索引可在重接入后打开一个已知文件, en: Recent-file lists or search indexes can open one known file after reattachment}
    blind_spots:
    - {zh: 历史短于返回周期、介质 ID 不稳、状态加密或仅存内存、读遥测缺失, en: History shorter than return cycle unstable media ID encrypted or memory-only state or missing read telemetry}
    - {zh: 攻击者每次全盘重扫或删除状态会失去子项特征但仍可能属于父级, en: Full rescans or deleted state remove the child signature while the parent may still apply}
    tuning_guidance:
      zh: >-
        按业务介质类别设置历史期限，不用任意固定天数。批准索引器例外绑定 media group、签名组件、数据库位置、owner、作业类型和输出库；未知持久进程在用户会话外创建索引或把目标写入隐藏队列时提高优先级。至少要求两个接入会话、稳定 media_id、先前对象知识、当前成功 ReadData 和后继结果，不因设备再次出现单独告警。
      en: >-
        Set retention by business media class rather than an arbitrary fixed duration. Bind approved indexer exceptions to media group, signed component, database location, owner, job type, and output repository. Raise priority when an unknown persistent process indexes outside an interactive session or queues targets in hidden output. Require two attachment sessions, stable media_id, prior object knowledge, current successful ReadData, and subsequent outcome; never alert on device return alone.
    evidence_keys: [REF-001077, REF-000597, REF-000379, REF-001070]
  mitigations:
  - temporary_key: T1025_MIT_MEDIA_READ_AUTHORIZATION
    action: create
    name: {zh: 可移动介质读取授权与对象谱系治理, en: Removable-Media Read Authorization and Object-Lineage Governance}
    description:
      zh: 按介质组、用户/服务、主机角色、签名进程、文件级操作和业务路径控制读取，并为每次接入保存稳定介质身份、批准作业和对象结果；正常导入、备份、取证和恢复使用有期限的细粒度例外。
      en: Control reads by media group, user or service, host role, signed process, file-level operation, and business path, retaining stable media identity, approved work, and object outcomes for every attachment, with time-bounded granular exceptions for import, backup, forensics, and recovery.
    domains: [enterprise]
    measures:
    - key: file-read-least-authority
      name: {zh: 文件级读取最小授权, en: File-Level Read Least Authority}
      description:
        zh: 默认拒绝不需要介质读取的主机和非批准进程；以设备组、SID、签名发布者、File Read、路径/文件类型、网络位置、工单和到期时间共同授权。未知介质先隔离扫描，敏感主机优先用只读、方向固定或专用介质。
        en: Deny reads by default on hosts and processes without business need; authorize through device group, SID, signed publisher, File Read, path or file type, network location, ticket, and expiry. Quarantine-scan unknown media and prefer read-only, direction-fixed, or dedicated media on sensitive hosts.
      control_type: exposure-reduction
    - key: attachment-object-lineage
      name: {zh: 接入会话与对象读取谱系, en: Attachment-Session and Object-Read Lineage}
      description:
        zh: 为每次接入记录 media_id、组织资产、保管人、来源、目的主机、mount/unmount、批准清单、读取主体/进程、对象路径和结果去向；对会返回的介质保留历史到业务轮转结束，并验证事件上限和隔离端补偿采集。
        en: Record media_id, asset, custodian, source, destination host, mount and unmount, approved manifest, reader, object path, and result destination for every attachment; retain returning-media history through the business cycle and validate event caps and isolated-endpoint compensating collection.
      control_type: detective-support
    - key: managed-import-separation
      name: {zh: 受管导入与输出分离, en: Managed Import and Output Separation}
      description:
        zh: 只允许受管导入器把内容写入检疫区，验证恶意代码、文件类型、敏感标签和批准清单后再发布；阻止导入器及非批准读取者把内容直送隐藏目录、个人归档或外部网络。
        en: Permit managed importers to write into quarantine, validating malware, file type, sensitivity, and manifest before release; prevent importers and unapproved readers from sending content directly to hidden directories, personal archives, or external networks.
      control_type: preventive
    applications:
    - target_key: T1025_PARENT
      use:
        zh: 按主机角色配置文件级读取规则并启用 AuditAllowed/AuditDenied 与可移动存储对象访问审计；将批准导入、备份、杀毒、取证和恢复绑定到签名进程、介质组、用户、路径、工单和输出库。未知进程读取敏感介质时阻断或检疫，并保存进程—对象—结果谱系。
        en: Configure file-level read rules by host role and enable AuditAllowed, AuditDenied, and removable-storage object auditing. Bind approved import, backup, antimalware, forensics, and restore to signed process, media group, user, path, ticket, and output repository. Block or quarantine sensitive-media reads by unknown processes and preserve process-object-outcome lineage.
      expected_effect:
        zh: 正常接入或认可设备不再自动授予无限读取权；允许读取可归因，未批准读取在暂存或外传前被阻断。
        en: Normal attachment or approved device no longer grants unlimited read authority; allowed reads are attributable and unapproved reads are blocked before staging or exfiltration.
      limitations:
        zh: 获批进程被注入、用户先复制到内部存储、MTP 字段缺失和隔离端无代理仍可削弱控制；严格默认拒绝影响恢复、取证和旧设备，需先审计试运行。
        en: Injection into approved processes, user copying to internal storage, missing MTP fields, and agentless isolated endpoints weaken control; strict default denial affects restore, forensics, and legacy devices and needs audit-mode rollout.
    - target_key: T1025_CHILD_REATTACHMENT_RECALL
      use:
        zh: 对往返介质使用组织资产标识和逐次清单，限定能创建介质索引或跨接入目标状态的进程；未批准进程保存对象目录、在重接入读取历史目标或写入非批准队列时阻断调查。合法照片、备份和取证 catalog 例外绑定数据库、owner、介质组和输出库。
        en: Use organizational asset identity and per-trip manifests for returning media and restrict processes that create indexes or cross-attachment target state. Block and investigate unapproved processes preserving catalogs, reading historical targets on return, or writing to unapproved queues. Bind legitimate photo, backup, and forensic catalog exceptions to database, owner, media group, and output.
      expected_effect:
        zh: 攻击者难以等待高价值介质返回而不产生持久状态和跨接入读取差分，防守方获得连接早期对象知识与后续读取的稳定键。
        en: The adversary has difficulty waiting for high-value media without durable state and a cross-attachment differential, while defenders gain stable keys joining earlier object knowledge to later reads.
      limitations:
        zh: 内存化或加密状态、被攻陷的获批索引器、不稳定介质身份和历史不足会降低效果；合法应用也会跨接入打开最近文件，不能只凭状态阻断。
        en: Memory-only or encrypted state, compromised approved indexers, unstable media identity, and insufficient history reduce effect; legitimate applications reopen recent files, so state alone cannot trigger blocking.
    evidence_keys: [REF-000597, T1025_REF_MS_DEVICE_CONTROL_POLICIES, REF-000906, REF-001077]
