research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - ATT&CK parent core spans sensitive-data search and collection from removable media on Linux Windows and macOS
    - ATT&CK procedures span USB optical media MTP ordinary files automated monitoring and later staging or exfiltration without child partitions
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: normal-attachment-context reuse
      resolution: parent-core
      reason: {zh: 等待用户或系统接入并沿已有读取授权执行是父级主要匿迹语境；Crutch 支持监视介质，但未建立独立兄弟边界。, en: Waiting for user or system attachment and reading through existing authority is the parent stealth context; Crutch supports monitoring but not a separate sibling boundary.}
    - axis: reattachment-gated retained target knowledge
      resolution: proposed-formal
      reason: {zh: TajMahal 明确支持先前见过的 USB、指定文件请求和下次接入窃取；变量跨接入保存目标状态，改变当前读取集合并要求跨会话检测。, en: TajMahal supports a previously seen USB a specified-file request and theft on next attachment; the variable retains target state changes the current read set and requires cross-session detection.}
    - axis: extension keyword age or sensitivity filtering
      resolution: adjacent-technique
      reason: {zh: 属于 T1119/NJT-0135 自动选择或父级目标条件。, en: Belongs to T1119 and NJT-0135 automated selection or parent target conditions.}
    - axis: time-checkpoint incremental collection
      resolution: adjacent-technique
      reason: {zh: 跨轮变化对象由 NJS-0135-001 覆盖；它按变化状态而非既定介质目标门控。, en: Cross-pass changed objects are covered by NJS-0135-001 and gated by change state rather than retained target.}
    - axis: raw hidden partition or device-native region
      resolution: adjacent-technique
      reason: {zh: 普通文件命名空间之外的物理卷、隐藏分区和原始区域由 NJT-0108 覆盖。, en: Physical volumes hidden partitions and raw regions outside ordinary file namespace are owned by NJT-0108.}
    - axis: media command-result mailbox and traversal marker
      resolution: adjacent-technique
      reason: {zh: 身份信箱、跨角色标记和双向循环由 NJT-0207 及其 NJS 覆盖。, en: Identity mailboxes cross-role markers and bidirectional loops are covered by NJT-0207 and its children.}
    - axis: trusted import process interposition
      resolution: evidence-deferred
      reason: {zh: 未找到恶意现场证据证明通过被劫持导入器成功取得介质内容并形成独立观察差。, en: No field evidence shows successful media acquisition through a hijacked importer with a distinct observation difference.}
    - axis: audit or policy bypass path
      resolution: evidence-deferred
      reason: {zh: 原始卷旁路归 NJT-0108；普通读取的产品审计缺口只是观察限制，缺少稳定攻击者控制轴。, en: Raw-volume bypass belongs to NJT-0108; ordinary-read product audit gaps are observation limitations without a stable attacker-controlled axis.}
    - axis: media type operating system API tool or file type
      resolution: not-stealth-distinct
      reason: {zh: USB、CD、MTP、平台、API、工具和文件类型是实现或目标差异，没有独立匿迹因果链。, en: USB CD MTP platform API tool and file type are implementation or target differences without an independent stealth chain.}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定版没有 ATT&CK 子项，但仍检验了正常接入、重接入状态、选择、增量、原始视图、命令信箱、受信进程、审计旁路和实现类型。只有跨接入保留特定介质对象并等待重接入读取同时满足稳定变量、痕迹变化、防守差异和直接来源四门；其余归父级、相邻技术或暂缓。零 ATT&CK 子项没有被用作停止搜索的理由。
      en: >-
        The fixed baseline has no ATT&CK children, but normal attachment, reattachment state, selection, increments, raw view, command mailbox, trusted process, audit bypass, and implementation axes were examined. Only retaining a specific media object and waiting for reattachment passes stable-variable, trace-change, defensive-difference, and direct-source gates. Others resolve to parent, adjacent techniques, or deferral. Zero ATT&CK children was not used to stop the search.
  evidence_coverage:
    parent_behavior_keys: [T1025_REF_ATTACK_V19, REF-000914]
    boundary_keys: [REF-000597, REF-000379, REF-000906, REF-000419, REF-000512, REF-000596]
    mechanism_support:
    - {mechanism_ref: NM-FD, subject_key: T1025_PARENT, evidence_keys: [REF-000914, REF-000597, T1025_REF_MS_DEVICE_CONTROL_POLICIES], confidence: medium}
    - {mechanism_ref: NM-ST, subject_key: T1025_CHILD_REATTACHMENT_RECALL, evidence_keys: [REF-001077], confidence: medium}
    child_existence_support:
    - child_key: T1025_CHILD_REATTACHMENT_RECALL
      evidence_keys: [REF-001077]
      confidence: medium
      limitation: Capability design in a field-deployed framework without public per-file victim outcome or measured alert reduction
    unsupported_or_deferred:
    - Trusted import process interposition lacks conclusion-level malicious media-read evidence
    - Product-specific audit bypass lacks a stable cross-platform variable outside NJT-0108
    - Attachment-triggered scanning is parent-core and T1119 automation without distinct stealth outcome
    - No source measures T1025 alert reduction false-negative rate or bytes retained per read
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级和拟议子项覆盖定义、完成门、匿迹特性、边界与正常反例、场景、攻防模型、机理、证据限制和可实施防御。内容把接入、策略允许、成功 ReadData 和攻击者可用结果分层，没有按 USB 类型、工具或文件类别扩写子项。
      en: >-
        Parent and child cover definition, completion gate, stealth, boundaries and benign counterexamples, scenarios, attacker and defender models, mechanisms, evidence limits, and implementable defense. Attachment, policy allow, exercised ReadData, and attacker-usable result are separated; children are not inflated by USB type, tool, or file class.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization and parse validation only]
  limitations:
    paragraphs:
    - zh: >-
        ATT&CK、Crutch 和 TajMahal 证明行为与能力，但没有一条完整公开时间线同时给出稳定介质身份、恶意进程、逐对象成功读取、取得内容和告警结果。匿迹收益是由正常介质流程、平台审计语义和恶意能力共同支持的有界推断；不得把接入、工具存在或可读权限升级为成功收集。
      en: >-
        ATT&CK, Crutch, and TajMahal establish behavior and capability, but no public timeline supplies stable media identity, malicious process, per-object successful read, acquired content, and alert result together. Stealth effects are bounded inferences from normal media workflows, platform audit semantics, and malicious capability. Attachment, tool presence, or readable authority cannot become successful collection.
    - zh: >-
        检测实现以 Windows 官方字段最具体；Linux 与 macOS 可按等价 mount、介质身份、进程读取和结果字段移植，但当前研究未证明各发行版或传感器字段相同。事件上限、MTP 对象模型、序列号质量、隔离端覆盖和合法取证/备份高读取量会改变效果，需在本地审计模式验证。
      en: >-
        Detection is most specific for official Windows fields. Linux and macOS can adapt equivalent mount, media identity, process-read, and outcome fields, but this research does not establish identical fields across distributions or sensors. Event caps, MTP models, serial quality, isolated-endpoint coverage, and legitimate high-volume forensics or backup change effectiveness and require local audit-mode validation.
  rejected_mechanisms:
  - mechanism_ref: NM-BT
    reason: {zh: 介质跨网络边界对 NJT-0194/NJT-0207 成立，但单主机从当前介质读文件不必然绕过观察边界。, en: Media crossing a network boundary supports NJT-0194 or NJT-0207 but one host reading a current medium does not inherently bypass an observation boundary.}
  - mechanism_ref: NM-ST
    subject_key: T1025_PARENT
    reason: {zh: 普通到达触发和轮询没有结论级证据证明刻意时间分散；NM-ST 仅用于有跨接入状态证据的拟议子项。, en: Ordinary arrival triggers and polling lack conclusion-level evidence of deliberate temporal dispersion; NM-ST is limited to the child with cross-attachment state evidence.}
  open_questions:
  - 主 Agent 是否接受 TajMahal 能力级证据支撑 medium 正式 NJS；若要求已确认逐文件受害结果，应将子项降为 deferred。
  - REF-001077 应扩展精确 locator，不应新建相同 URL 的 Reference。
  - REF-000906 可扩展同页 Audit Removable Storage locator；若坚持一 locator 一对象，应拆分但不得产生重复 URL 身份。
  - MIT-000053 可补充物理准入/保管应用；建议新建读取授权对象，因为其现有措施未覆盖文件级读权限与读后输出。
