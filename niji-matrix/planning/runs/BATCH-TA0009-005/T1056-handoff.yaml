candidate:
  source_type: attack
  source_attack_id: T1056
  source_attack_version: "19.1"
  name:
    zh: 输入捕获
    en: Input Capture
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: ATT&CK Enterprise 19.1 将 T1056 同时映射到 Collection 与 Credential Access，并以“取得凭据或收集信息”定义父行为。当前正式 NJT-0169“认证输入路径截获”及其三个子项已经完整表达口令、验证码和同类认证秘密在提交时被复制的 Credential Access 结果，但其决议、定义、证据和防御都明确把完成点收窄到认证输入。直接为 NJT-0169 增加 TA0009 会把非认证输入内容遗漏；把既有对象整体泛化又会改变其正式决议与登录、身份提供方和验证者绑定防御的语义。
        en: ATT&CK Enterprise 19.1 maps T1056 to both Collection and Credential Access and defines the parent as obtaining credentials or collecting information. The existing formal NJT-0169, Authentication-Input Path Interception, and its three children already express the Credential Access result in which passwords, verification codes, and comparable authentication secrets are copied during submission. Its decision, definition, evidence, and defenses deliberately narrow completion to authentication input. Adding TA0009 directly to NJT-0169 would omit non-authentication input content, while generalizing the existing object would change the semantics of its formal decision and its sign-in, identity-provider, and verifier-binding defenses.
      - zh: 因此建议为 TA0009 建立独立的 Collection 收窄对象，以用户正在形成的非认证内容或有意义交互事件实际进入攻击者可读结果为完成点，并沿用同一 ATT&CK 来源但不复制其四个子项。仓库对 T1557 已采用凭据路径 NJT-0136 与一般内容路径 NJT-0142 的结果导向拆分，该先例支持按直接对象而非按实现重复建模。DRBControl 直接证明全局输入流被写入带用户、进程和窗口语境的报告；Sucuri 对受侵 PrestaShop 的分析直接证明恶意代码在受信结账来源内覆盖表单、监视支付字段变化并把实际支付数据送入恶意处理链。这些证据支持消费者外输入流与受信来源数据入口两个原生变量。
        en: The recommendation is therefore a separate Collection-scoped object under TA0009, completed when non-authentication content being composed by a user or a meaningful interaction event actually reaches an attacker-readable result, while retaining the same ATT&CK source without copying its four children. The repository already splits T1557 by direct outcome into NJT-0136 for credential paths and NJT-0142 for ordinary content paths, supporting result-oriented separation rather than implementation duplication. DRBControl directly establishes a global input stream written into a report with user, process, and window context. Sucuri's analysis of a compromised PrestaShop site directly establishes malicious code overlaying a form within a trusted checkout origin, monitoring payment-field changes, and delivering actual payment data into a malicious processing chain. Those sources support consumer-external input streams and trusted-origin data entry as two native variables.
  scope_notes:
    zh: TA0009 对象只在非认证输入内容或有意义交互事件进入攻击者可读缓冲、文件、请求或等价结果时完成。口令、验证码、恢复秘密和认证证明仍归 NJT-0169；同一混合输入流只有在一般内容结果与认证秘密结果分别得到证明时才可双标。T1115 负责从剪贴板服务取得已经复制的内容，T1185/NJT-0145 负责浏览器已呈现或返回的页面内容，T1055 负责让代码进入另一进程，T1204 负责诱导用户执行，T1074/T1560 与 TA0010 负责取得后的暂存、归档和外传。合法无障碍、输入法、远程支持、自动化测试、质量监控和获批分析脚本是必须按主体、会话、任务与结果去向排除的反例。
    en: The TA0009 object completes only when non-authentication input content or a meaningful interaction event reaches an attacker-readable buffer, file, request, or equivalent outcome. Passwords, verification codes, recovery secrets, and authentication proofs remain under NJT-0169; a mixed input stream may carry both labels only when ordinary-content and authentication-secret outcomes are separately evidenced. T1115 owns content already obtained from a clipboard service, T1185 and NJT-0145 own page content already rendered or returned by a browser, T1055 owns placing code in another process, T1204 owns inducing user execution, and T1074, T1560, and TA0010 own later staging, archiving, and exfiltration. Accessibility, input methods, remote support, automated testing, quality monitoring, and approved analytics scripts are counter-examples that must be excluded by principal, session, task, and result destination.
proposed_content:
  temporary_key: T1056_COLLECTION_PARENT
  name:
    zh: 匿迹型交互输入内容取得
    en: Stealth-Oriented Interactive Input Acquisition
  summary:
    zh: 攻击者在用户形成文字、字段值或有意义交互事件时取得其实际内容，并通过移出预期消费者审计面或寄生受信数据入口改变防守方能够关联的采集痕迹。
    en: An adversary acquires actual text, field values, or meaningful interaction events as a user creates them and changes defender-visible collection traces by moving outside the intended consumer's audit surface or inhabiting a trusted data-entry origin.
  definition_and_concept:
    paragraphs:
      - zh: 匿迹型交互输入内容取得，是攻击者在用户输入尚未进入预期应用、正在被应用处理或正在通过数据入口提交时，复制非认证文字、表单字段、选择或具有信息价值的交互事件，并使结果进入攻击者可读的内存、文件、请求或传输链。直接目标是收集用户此刻正在形成的信息，例如文档片段、搜索、消息、业务字段、支付资料或操作意图，而不是读取已经静态保存的文件、页面正文或凭据库。
        en: Stealth-Oriented Interactive Input Acquisition occurs when an adversary copies non-authentication text, form fields, selections, or information-bearing interaction events before they reach the intended application, while the application processes them, or as a data-entry surface submits them, and causes the result to enter attacker-readable memory, a file, a request, or a transfer chain. The direct objective is information the user is creating at that moment, such as document fragments, searches, messages, business fields, payment details, or operational intent, rather than a previously stored file, page body, or credential vault.
      - zh: 完成点必须区分输入观察能力、实际输入结果、结果保留或送出以及后继使用。全局 Hook、Input Monitoring 权限、/dev/input 打开、表单脚本变化、覆盖层或提示框只证明暴露或准备；只有捕获内容、输入事件记录、成功表单请求、恶意服务端记录或与目标字段相符的后继结果，才能证明 Collection。防守分析不应为了证明这一点而集中保存真实用户输入，应使用权限、来源、字段模式摘要、字节、目的地和结果元数据。
        en: Completion must separate input-observation capability, an actual input outcome, retention or forwarding of that outcome, and later use. A global hook, Input Monitoring permission, an open on /dev/input, a changed form script, an overlay, or a prompt proves exposure or preparation only. Collection requires captured content, an input-event record, a successful form request, a malicious server-side record, or a downstream result matching target fields. Defensive analysis should not centrally retain actual user input to make that determination and should instead use authority, provenance, field-schema digests, byte counts, destinations, and outcome metadata.
  stealth_characteristics:
    paragraphs:
      - zh: 当复制发生在预期消费者之外时，目标应用仍接收并处理正常输入，却不会在自己的审计中记录第二份副本；痕迹转移到全局 Hook、输入设备读取、辅助功能或 Input Monitoring 权限、观察进程缓冲和外联。若防守只看应用事务或内容库访问，实际 Collection 会落在端点输入面。输入法、无障碍、远程支持和自动化也使用相同权限，攻击者因此还能借高基率合法行为削弱单一 API 或权限告警的判别力。
        en: When copying occurs outside the intended consumer, the target application continues to receive and process ordinary input but does not record the second copy in its own audit. Traces move to global hooks, input-device reads, accessibility or Input Monitoring authority, observer-process buffers, and egress. Defenders inspecting only application transactions or content-store access can miss the actual Collection event on the endpoint input plane. Input methods, accessibility tools, remote support, and automation use the same authority, allowing the adversary to exploit a high legitimate base rate that weakens a single API or permission alert.
      - zh: 当恶意接收逻辑寄生在用户预期访问的数据入口时，正确域名、TLS、品牌、导航与部分业务反馈可以保留，用户与网络边界看到的来源仍像合法服务。异常缩小为脚本、模板、控制器或运行态差异，新增或覆盖字段、表单接收目标、同源异常路径以及服务器的第二输出。受信来源不会令行为无痕；外部锚定的制品清单、浏览器实际渲染图、表单目标、服务端路由和外联仍可恢复接收者谱系。
        en: When malicious receiver logic inhabits a data-entry origin the user expects to visit, the correct domain, TLS, branding, navigation, and some business feedback can remain, so the user and network boundary still see a legitimate service. Anomalies narrow to script, template, controller, or runtime differences; added or overlaid fields; form destinations; unusual same-origin routes; and a second server output. A trusted origin does not make the behavior traceless. Externally anchored artifact inventories, the browser's rendered graph, form targets, server routes, and egress can reconstruct receiver lineage.
      - zh: 匿迹收益取决于观察面是否连接。端点没有输入权限或 API 传感器、Web 团队只校验仓库而不校验消费者浏览器实际接收内容、或网络策略把同源请求全部视为正常时，路径差更难识别；反之，能以用户、会话、进程、页面 origin、release、form_id、路由和时间连接输入暴露与结果，就能把普通相似行为排除。公开来源没有量化检出率或误报率，因此机理置信度不高于 medium。
        en: The stealth benefit depends on whether observation surfaces are joined. Path differences are harder to identify when endpoints lack input-authority or API sensors, web teams validate only a repository rather than what the consumer browser received, or network policy treats every same-origin request as ordinary. Conversely, joining exposure to outcome by user, session, process, page origin, release, form ID, route, and time permits legitimate lookalikes to be excluded. Public sources do not quantify detection or false-positive rates, so mechanism confidence does not exceed medium.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入对象是非认证输入内容或有意义的交互事件，并要求攻击者有意控制捕获位置或接收来源，使观察面与预期消费者不同。一般键盘、鼠标或表单事件只有在实际记录或结果证明其进入攻击者控制链时才成立；只发现 Hook、按键 API、输入权限、输入设备、可疑表单或登录页变化属于线索。操作系统、键盘、GUI、Web、API、字段种类和产品是实现面，不能单独定义子项。
        en: Included objects are non-authentication input content or meaningful interaction events, with an attacker-controlled capture position or receiver origin that differs from the intended consumer's observation surface. Keyboard, mouse, or form activity qualifies only when a record or outcome proves entry into an attacker-controlled chain. A hook, key-state API, input permission, input device, suspicious form, or changed sign-in page alone is a lead. Operating system, keyboard, GUI, web, API, field category, and product are implementation surfaces and do not independently define children.
      - zh: 口令、验证码、恢复秘密、认证证明以及以身份验证为直接目的的提示归 NJT-0169；同一键盘日志若同时含普通内容与真实认证秘密，必须分别证明两类结果后才可同时映射。T1115/NJT-0214 以从剪贴板服务成功返回内容为完成点，本技术以内容进入剪贴板或应用之前的输入流为对象。T1185/NJT-0145 读取浏览器已经呈现或返回的页面、文档与会话内容；本技术只处理用户正在形成和提交的值。
        en: Passwords, verification codes, recovery secrets, authentication proofs, and prompts whose direct purpose is authentication belong to NJT-0169. A key log containing both ordinary content and real authentication secrets may map to both only after each result class is evidenced. T1115 and NJT-0214 complete when content is successfully returned by a clipboard service; this technique covers the input stream before content enters a clipboard or application. T1185 and NJT-0145 read page, document, or session content already rendered or returned by a browser; this technique is limited to values the user is forming and submitting.
      - zh: 进程注入、API Hook 安装或浏览器扩展加载由 T1055 等执行技术解释其进入方式，不能替代输入结果。诱导用户打开文件、点击链接或启动程序归 T1204；只有其后的输入被实际取得时本技术才成立。页面或表单被改写还可单独评估 T1565.002，取得后写入暂存区、压缩、加密和外送分别归 T1074、T1560 与 TA0010。获批无障碍、输入法、远程支持、表单分析、反欺诈、自动化测试和质量回放须以签名、版本、工单、数据合同、字段最小化和目的地排除。
        en: Process injection, API-hook installation, or browser-extension loading is explained by execution techniques such as T1055 and does not substitute for an input outcome. Inducing a user to open a file, follow a link, or start a program belongs to T1204; this technique begins only when subsequent input is actually acquired. A changed page or form can also warrant T1565.002, while staging, compression, encryption, and sending after acquisition belong to T1074, T1560, and TA0010. Approved accessibility, input methods, remote support, form analytics, fraud controls, automated testing, and quality replay require exclusion through signer, version, ticket, data contract, field minimization, and destination.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在受控工作站或 RDP 会话中，攻击者可持续或按会话使用低层 Hook、事件 tap、输入设备读取或辅助功能权限，记录用户在文档、搜索、聊天、管理控制台和业务应用中的输入，并附加用户、进程或窗口语境。DRBControl 的公开分析直接展示每个 RDP 会话运行键盘记录逻辑，并把用户名、时间、进程、窗口标题和捕获输出写入混淆报告文件；该结果支持一般 Collection，但不能据此假定所有记录都是凭据。
          en: On a compromised workstation or RDP session, an adversary can use a low-level hook, event tap, input-device read, or accessibility authority continuously or by session to record input in documents, search, chat, administrative consoles, and business applications, adding user, process, or window context. Public analysis of DRBControl directly shows keylogging logic running in each RDP session and writing the username, time, process, window title, and captured output to an obfuscated report file. That outcome supports general Collection but does not establish that every record was a credential.
        - zh: 在受侵电商、客户门户或业务 Web 应用中，攻击者可修改脚本、模板或服务端控制器，让受信来源内的输入表单增加覆盖字段、监视值变化或把提交复制到恶意处理路径。Sucuri 的 PrestaShop 事件中，恶意 JavaScript 覆盖支付表单、另一个脚本监视支付字段并向站点自身路径发送数据，服务端代码识别请求并把窃取的支付资料外送。域名和结账语境保留，但实际字段结果和第二接收链已经成立。
          en: In a compromised commerce site, customer portal, or business web application, an adversary can change scripts, templates, or server controllers so a data-entry form within the trusted origin adds overlaid fields, observes value changes, or copies a submission into a malicious processing path. In Sucuri's PrestaShop case, malicious JavaScript overlaid a payment form, another script monitored payment fields and sent data to a path on the same site, and server-side code recognized the request and forwarded stolen payment details. The domain and checkout context remained, while actual field results and a second receiver chain were established.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 消费者外路径要求攻击者在目标交互会话运行代码或控制驱动、输入设备、全局 Hook、TCC/辅助功能权限或等价输入观察面，并能把原始事件映射为字符、窗口、用户或操作语义。攻击者可能等待目标应用出现或长期驻留，但布局差异、secure desktop、受保护输入、隔离桌面、硬件设备与缺少用户活动都会限制结果；管理员权限本身不保证读取所有输入面。
            en: The consumer-external path requires code in the target interactive session or control of a driver, input device, global hook, TCC or accessibility authority, or equivalent observation surface, plus the ability to map raw events to characters, windows, users, or operational meaning. The adversary may wait for a target application or remain resident, but layout differences, secure desktop, protected input, isolated desktops, hardware devices, and absent user activity constrain outcomes. Administrator rights alone do not guarantee access to every input surface.
          - zh: 受信来源路径要求攻击者能修改部署制品、第三方脚本依赖、模板、服务端控制器或应用运行态，并理解正常字段、提交路径和业务反馈。攻击者还需选择接收路径，使输入到达恶意逻辑并在必要时保留足够正常流程以避免用户立即停止。签名制品、外部黄金哈希、只读部署、严格 CSP/SRI、独立支付字段、出站限制和服务器端路由完整性都会压缩空间。
            en: The trusted-origin path requires authority to change deployment artifacts, third-party script dependencies, templates, server controllers, or application runtime, along with knowledge of expected fields, submission paths, and business feedback. The adversary must select a receiving path that delivers input to malicious logic and, where needed, preserve enough normal workflow to keep the user engaged. Signed artifacts, external golden hashes, read-only deployment, strict CSP and SRI, isolated payment fields, egress restriction, and server-route integrity constrain that path.
      defender_model:
        paragraphs:
          - zh: 防守方理想上拥有端点输入权限和设备访问、进程与模块、文件和网络结果、获批输入软件清单，以及应用发布制品、浏览器实际资源与表单图、CSP/SRI 报告、反向代理、服务端路由和出站网络。共同关联键包括设备、用户、交互 session、process_guid、页面 origin、release_id、asset_hash、form_id、route、目的地和时间。真实字段值不应作为集中检测数据，字段模式可用经治理的摘要或分类表示。
            en: Ideally the defender has endpoint input authority and device access, process and module, file and network outcomes, an approved-input-software inventory, plus application release artifacts, the browser's actual resource and form graph, CSP or SRI reports, reverse-proxy data, server routes, and outbound network telemetry. Common join keys include device, user, interactive session, process GUID, page origin, release ID, asset hash, form ID, route, destination, and time. Actual field values should not be centralized for detection; governed digests or classifications can represent field schemas.
          - zh: 现实中 Windows 默认日志不记录低层键盘 Hook，macOS Input Monitoring 主要证明权限，Linux auditd 需事先配置设备规则；未受管浏览器可能没有资源和表单目标遥测，同源恶意路径又可能绕开跨域规则。若只能看到权限、脚本差异或提示存在，防守只能输出 exposure；只有输入结果或经实验验证的结果链出现时才升级为 capture。合法无障碍、输入法、测试、标签管理、A/B 发布、反欺诈和支付服务集成必须按精确任务与版本消歧。
            en: In practice, default Windows logs do not record low-level keyboard hooks, macOS Input Monitoring primarily proves authority, and Linux auditd needs preconfigured device rules. Unmanaged browsers may lack resource and form-target telemetry, while a malicious same-origin path can evade cross-origin rules. If only permission, script drift, or a prompt is visible, defenders can report exposure only; capture requires an input outcome or a lab-validated outcome chain. Accessibility, input methods, testing, tag management, A/B releases, fraud controls, and payment-service integrations must be disambiguated by exact task and version.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 在预期消费者审计边界外形成输入副本
        en: Form the input copy outside the intended consumer's audit boundary
      analysis:
        paragraphs:
          - zh: 攻击者从全局 Hook、事件 tap、设备流或辅助功能面读取输入，使预期应用继续接收相同事件，却不生成“内容被第二读者复制”的应用记录。行为设计把采集痕迹从业务消费者转移到端点输入权限、设备访问和观察进程结果，造成观察面分离；只有把这些面与缓冲或外联连接，防守方才能从 exposure 走到 capture。平台文档和 DRBControl 结果支持该链，但没有检出率测量，置信度为 medium。
            en: The adversary reads input through a global hook, event tap, device stream, or accessibility surface, allowing the intended application to receive the same event without an application record that a second reader copied content. The design shifts collection traces from the business consumer to endpoint input authority, device access, and observer-process outcomes, separating observation planes. Defenders move from exposure to capture only by joining those surfaces to a buffer or egress. Platform documentation and the DRBControl outcome support the chain, but no detection-rate measurement is available, leaving medium confidence.
      evidence_keys: [REF-000726, REF-000727, REF-000728]
      confidence: medium
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 借受信数据入口身份掩盖恶意输入接收者
        en: Borrow a trusted data-entry identity to mask the malicious receiver
      analysis:
        paragraphs:
          - zh: 攻击者把覆盖表单、字段观察或接收处理逻辑放入用户预期访问的真实应用来源，使域名、TLS、品牌与导航继续指向合法服务，而输入又进入第二接收链。恶意实体借用受信来源的特征分布，令只比较域名或跨域目的地的检测失去区分力；制品哈希、浏览器实际表单图、同源路由和服务端外联仍会留下差异。PrestaShop 案例直接证明输入与恶意结果，泛化到其他应用的告警效果未测量，置信度为 medium。
            en: The adversary places an overlaid form, field observer, or receiving handler inside the genuine application origin the user expects to visit, preserving domain, TLS, branding, and navigation while input also enters a second receiver chain. The malicious entity borrows the trusted origin's feature distribution, weakening detections that compare only domain or cross-origin destinations. Artifact hashes, the browser's actual form graph, same-origin routes, and server egress still preserve differences. The PrestaShop case directly establishes input and malicious outcome, but alert effects across applications are unmeasured, leaving medium confidence.
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
      confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
        - zh: 建议两个 Niji 原生子项。消费者外输入流取得控制副本相对预期消费者的位置，使应用审计缺少第二读者并把检测责任转到端点输入权限、设备与观察进程结果。受信来源数据入口介入控制恶意接收者是否寄生在真实应用来源，使域名和会话外观保留并把检测责任转到发布制品、消费者表单图、同源路由与服务器第二输出。两项可以共现，但有独立完成证据、残余痕迹和防御对象。
          en: Two Niji-native children are proposed. Consumer-External Input-Stream Acquisition controls the copy's position relative to the intended consumer, leaving application audit without the second reader and moving defense to endpoint input authority, devices, and observer-process outcomes. Trusted-Origin Data-Entry Interposition controls whether the malicious receiver inhabits a genuine application origin, preserving domain and session appearance while moving defense to release artifacts, the consumer form graph, same-origin routes, and second server output. The two can coexist but have separate completion evidence, residual traces, and defense objects.
        - zh: ATT&CK 的 Credential API Hooking、GUI Input Capture、Keylogging 和 Web Portal Capture 只作为广度背景。API、键盘、鼠标、GUI、Web、操作系统、产品、字段类型和 Hook 方法均不成为兄弟项；凭据接收路径保持 NJT-0169，窗口或页面条件门控保持 NJS-0132-001，捕获后加密、缓存、暂存和发送保持后继对象。独立仿冒的非认证输入界面因缺少当前结果级证据和独立防御链而 deferred，不为接近 ATT&CK 数量正式化。
          en: ATT&CK Credential API Hooking, GUI Input Capture, Keylogging, and Web Portal Capture provide breadth context only. APIs, keyboards, mice, GUIs, web, operating systems, products, field types, and hook methods do not define siblings. Credential receiver paths remain under NJT-0169, window or page context gating under NJS-0132-001, and post-capture encryption, buffering, staging, and sending under successor objects. A stand-alone impersonated interface for non-authentication input remains deferred for lack of current outcome-level evidence and a distinct defense chain and is not formalized to approach the ATT&CK count.
    proposed_child_keys: [T1056_COLLECTION_CHILD_EXTERNAL_STREAM, T1056_COLLECTION_CHILD_TRUSTED_ENTRY]
  evidence_keys: [REF-000725, REF-000726, REF-000727, REF-000728, REF-000733, T1056_COLLECTION_REF_SUCURI_PRESTASHOP, T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI]
  defense_strategy_keys: [DET-000192, T1056_COLLECTION_DET_TRUSTED_ENTRY]
  mitigation_keys: [MIT-000173, T1056_COLLECTION_MIT_TRUSTED_ENTRY]
  limitations:
    paragraphs:
      - zh: ATT&CK、平台文档和 DRBControl 支持父行为及消费者外路径；Sucuri 的单一 PrestaShop 调查支持受信 Web 来源内覆盖、字段监视、同源接收和后继外送。它们来自不同平台和活动，不能拼成同一通用攻击链，也不能从能力推断某个受害者输入了特定内容。消费者外与受信来源机理均无跨环境告警率或误报率，正式结论需保留 medium 置信度。
        en: ATT&CK, platform documentation, and DRBControl support the parent and consumer-external path, while one Sucuri PrestaShop investigation supports overlay, field observation, same-origin receipt, and later forwarding within a trusted web origin. These sources concern different platforms and operations and cannot be combined into one universal intrusion chain or used to infer that a victim entered particular content from capability alone. Neither mechanism has cross-environment alert or false-positive measurements, so formal conclusions should retain medium confidence.
      - zh: 端点输入监控和浏览器表单遥测具有明显隐私风险。分析应保留权限、进程、字段模式摘要、资源哈希、目的地和字节等最小元数据，并以脱敏测试表单验证结果链；不得为了检测而记录员工实际按键、消息、支付资料或业务字段。若组织无法取得结果元数据，检测只能报告暴露和完整性失败，不能宣称成功采集。
        en: Endpoint input monitoring and browser form telemetry create material privacy risk. Analytics should retain minimized authority, process, field-schema digest, resource hash, destination, and byte metadata and validate outcome chains with redacted test forms. They must not record employees' actual keystrokes, messages, payment details, or business fields for detection. Where result metadata is unavailable, detection can report exposure or integrity failure but cannot claim successful acquisition.
proposed_subtechniques:
  - temporary_key: T1056_COLLECTION_CHILD_EXTERNAL_STREAM
    formalization_recommendation: proposed-formal
    name:
      zh: 消费者外输入流取得
      en: Consumer-External Input-Stream Acquisition
    summary:
      zh: 攻击者在输入到达预期应用前从全局事件、设备或辅助功能面复制实际内容，使应用继续正常处理而自身审计不含第二份结果。
      en: The adversary copies actual content from a global event, device, or accessibility surface before it reaches the intended application, allowing normal processing while the application's own audit lacks the second result.
    definition_and_concept:
      paragraphs:
        - zh: 消费者外输入流取得以“副本形成在预期应用或数据消费者之外”为稳定变量。攻击者通过全局键盘或鼠标 Hook、事件 tap、输入设备读取、驱动、辅助功能或等价观察面取得非认证文字和有意义交互，并把它保存到攻击者可读缓冲、文件或传输链。平台 API 或设备只是实现；实际输入结果与外部捕获位置共同构成子项。
          en: Consumer-External Input-Stream Acquisition uses formation of the copy outside the intended application or data consumer as its stable variable. Through a global keyboard or mouse hook, event tap, input-device read, driver, accessibility authority, or equivalent observation surface, the adversary acquires non-authentication text or meaningful interactions and saves them to an attacker-readable buffer, file, or transfer chain. A platform API or device is only an implementation; an actual input outcome and the external capture position together define the child.
        - zh: 结果可以同时带进程、窗口、用户和时间语境，以解释输入来自何处，但这些附加标签不另建子项。DRBControl 在每个 RDP 会话运行键盘记录逻辑并写出包含用户名、进程、窗口标题和捕获输出的混淆报告，直接证明了消费者外输入流及结果。若只看到 Hook 或权限而没有记录、缓冲、外联或经实验确认的输出，只能认定 exposure。
          en: The outcome can include process, window, user, and time context to explain where input originated, but those labels do not create additional children. DRBControl ran keylogging logic in every RDP session and wrote an obfuscated report containing username, process, window title, and captured output, directly establishing an external input stream and outcome. A hook or permission without a record, buffer, egress, or lab-confirmed output supports exposure only.
    stealth_characteristics:
      paragraphs:
        - zh: 消费者外输入流取得让真实应用继续接收原始输入并保持普通业务事务，因此应用日志无法说明同一事件是否被第二读者复制。痕迹集中在系统输入观察权限、设备访问、后台观察进程、字符或事件缓冲和随后的文件或网络结果；防守方若按应用孤立审查，会把 Collection 与正常交互分开存放。
          en: Consumer-External Input-Stream Acquisition allows the genuine application to receive the original input and preserve an ordinary business transaction, so application audit cannot say whether a second reader copied the same event. Traces concentrate in system input-observation authority, device access, a background observer process, character or event buffers, and later file or network outcomes. Application-siloed review stores the Collection event separately from the normal interaction.
        - zh: 合法输入法、屏幕阅读器、远程支持、游戏覆盖层、密码管理器、自动化测试和安全代理形成高基率反例；单独 API、TCC 授权或 /dev/input open 不具备足够判别力。仍可观察的差异是首次或职责外全局观察、后台服务进入交互 session、目标面偏离批准范围以及观察后同进程出现重复小写入或新外联。
          en: Legitimate input methods, screen readers, remote support, game overlays, password managers, automated tests, and security agents form high-base-rate counter-examples, so an API, TCC grant, or /dev/input open alone is weak. Residual differences include first-seen or out-of-duty global observation, a background service entering an interactive session, target surfaces outside approved scope, and repeated small writes or new egress from the observing process.
    scope_boundary_definition:
      paragraphs:
        - zh: 纳入要求输入副本形成在消费者之外并存在非认证内容或有意义事件结果。只获得输入权限、安装 Hook、加载驱动或打开设备但没有结果是准备或暴露；只读取剪贴板返回内容归 NJT-0214；只捕获屏幕像素归 NJT-0158；只发现活动窗口或用窗口状态门控后继动作归 NJT-0132 及 NJS-0132-001。按窗口选择采集时机可与本子项并列，但不能替代实际输入结果。
          en: Inclusion requires a copy outside the consumer and an outcome containing non-authentication content or a meaningful event. Obtaining input authority, installing a hook, loading a driver, or opening a device without an outcome is preparation or exposure. Clipboard-returned content belongs to NJT-0214, screen pixels to NJT-0158, and discovery of an active window or use of window state to gate a later action to NJT-0132 and NJS-0132-001. Window-conditioned timing can coexist with this child but cannot substitute for an actual input outcome.
        - zh: 若结果是口令、验证码或认证秘密，NJS-0169-001 拥有 Credential Access 结果；普通内容属于本子项。同一日志不能因“可能包含密码”就自动双标，必须有相匹配的秘密证据。输入捕获后的加密文件、批量上传或低频发送改变后继处理，不改变本子项的消费者外位置。
          en: NJS-0169-001 owns the Credential Access outcome when the result is a password, verification code, or authentication secret; ordinary content belongs here. A log cannot be dual-labeled merely because it may contain a password; matching secret evidence is required. An encrypted file, bulk upload, or low-rate transmission after capture changes successor processing rather than this child's consumer-external position.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 攻击者在长期受控终端、跳板机或 RDP 会话中启动后台输入观察，等待用户编写文档、输入搜索与命令、处理客户资料或发送消息，并用窗口和进程标签减少后续解释成本。输出可先写入本地报告，也可由同进程送出；本子项在结果形成时完成，后继暂存和外送独立分类。
            en: An adversary starts background input observation on a persistently compromised endpoint, jump host, or RDP session and waits while a user writes documents, enters searches and commands, handles customer data, or sends messages, using window and process labels to reduce later interpretation cost. Output may first enter a local report or leave from the same process. The child completes when the result forms, while later staging and sending are classified separately.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要进入目标交互 session 或控制能跨 session 观察的组件，获得足够的输入设备、辅助功能、TCC、Hook 或驱动权限，并将按键、鼠标或事件序列解析到字符和应用语境。其受隔离桌面、protected input、驱动签名、最小辅助功能权限、布局和语言差异以及用户未活动限制；广泛连续记录还会增加缓冲、文件和网络痕迹。
              en: The adversary needs access to the target interactive session or control of a component that observes across sessions, sufficient input-device, accessibility, TCC, hook, or driver authority, and the ability to resolve key, mouse, or event sequences into characters and application context. Isolated desktops, protected input, driver signing, least accessibility authority, layout and language differences, and absent user activity constrain the actor. Broad continuous recording also increases buffer, file, and network residue.
        defender_model:
          paragraphs:
            - zh: 防守方假定可验证至少一个输入观察通道，并能连接进程、用户、session、目标输入面、缓冲与外联，同时维护获批输入软件和任务清单。没有 API/设备传感器时，文件和网络结果只能表明可疑输出而不能说明其来自输入；只有权限时则只能表明暴露。分析应使用脱敏测试输入验证采集链，不收集生产按键内容。
              en: The defender is assumed to validate at least one input-observation channel and join process, user, session, target surface, buffer, and egress while maintaining approved input-software and task inventories. Without an API or device sensor, file and network outcomes can show suspicious output but not that it came from input; authority alone shows exposure. Analytics should validate the acquisition chain with redacted test input rather than collect production keystroke content.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 将输入副本移到业务消费者审计之外
          en: Move the input copy outside business-consumer audit
        analysis:
          paragraphs:
            - zh: 外部观察者先于或独立于预期应用复制输入，应用只记录正常事务，不记录第二读者。痕迹从业务审计转到端点权限、设备和观察进程结果，使未关联观察面时出现盲区；同一 host、user、session 与 process 上的权限或设备读取、缓冲及外联能够恢复链。DRBControl 提供实际结果证据，但跨环境检测差异未量化，故为 medium。
              en: An external observer copies input before or independently of the intended application, which records only the ordinary transaction and not the second reader. Traces move from business audit to endpoint authority, devices, and observer-process outcomes, creating a blind spot when those surfaces are not joined. Authority or device reads, buffers, and egress on the same host, user, session, and process reconstruct the chain. DRBControl provides actual-outcome evidence, but cross-environment detection difference is unquantified, leaving medium confidence.
        evidence_keys: [REF-000726, REF-000727, REF-000728]
        confidence: medium
    evidence_keys: [REF-000725, REF-000726, REF-000727, REF-000728, REF-000733]
    defense_strategy_keys: [DET-000192]
    mitigation_keys: [MIT-000173]
    limitations:
      paragraphs:
        - zh: 平台文档证明观察权限和调用位置，DRBControl 证明特定恶意程序在 RDP session 形成输出；公开报告未公开真实内容、逐次成功率或告警结果，也不能把所有 Hook、Input Monitoring 或设备读取视为恶意。正式案例需要结果链与批准前态，且不能从一般键盘日志自动推断其中包含认证秘密。
          en: Platform documentation establishes observation authority and call position, while DRBControl establishes output from one malware family in RDP sessions. Public reporting does not disclose actual content, per-attempt success, or alert outcomes, and not every hook, Input Monitoring grant, or device read is malicious. A formal case needs an outcome chain and approval pre-state, and a general key log cannot automatically establish that authentication secrets were present.
  - temporary_key: T1056_COLLECTION_CHILD_TRUSTED_ENTRY
    formalization_recommendation: proposed-formal
    name:
      zh: 受信来源数据入口介入
      en: Trusted-Origin Data-Entry Interposition
    summary:
      zh: 攻击者把恶意字段观察或接收逻辑置于用户预期的数据入口来源内，使实际输入进入第二结果链而域名、品牌和会话外观仍保持可信。
      en: The adversary places malicious field-observation or receiving logic inside an expected data-entry origin, sending actual input into a second outcome chain while domain, brand, and session appearance remain trusted.
    definition_and_concept:
      paragraphs:
        - zh: 受信来源数据入口介入以“恶意输入接收者寄生在用户预期访问的真实应用来源”为稳定变量。攻击者修改脚本、模板、组件、服务端控制器或运行态，在原页面或应用中观察真实字段、增加覆盖字段，或把提交复制到另一处理路径；域名、证书、品牌与导航仍可属于合法服务。子项要求实际非认证字段值进入恶意请求、服务端记录或后继结果，而不是只发现页面被改写。
          en: Trusted-Origin Data-Entry Interposition uses a malicious input receiver inhabiting the genuine application origin the user expects to visit as its stable variable. The adversary changes scripts, templates, components, server controllers, or runtime to observe real fields, add overlaid fields, or copy submissions into another processing path while domain, certificate, branding, and navigation can still belong to the legitimate service. The child requires actual non-authentication field values to enter a malicious request, server-side record, or downstream result rather than merely a changed page.
        - zh: 该变量不等于 Web 产品或表单类型。当前强证据来自受侵结账页面，但同一边界可用于受信桌面或业务应用内的恶意输入组件，只要来源身份保留、接收者控制权改变且内容结果成立。攻击者完全控制的陌生域或独立假页面没有借用受侵数据入口本身，可落入父级、社会工程或其他信息收集对象；认证页面和口令结果仍由 NJT-0169 处理。
          en: The variable is not a web product or form type. Current strong evidence comes from a compromised checkout page, but the same boundary can apply to a malicious input component within a trusted desktop or business application when origin identity remains, receiver control changes, and a content outcome is established. A wholly attacker-controlled unfamiliar origin or stand-alone fake page does not borrow the compromised data entry itself and may remain at parent scope, social engineering, or another information-gathering object. Authentication pages and password outcomes remain under NJT-0169.
    stealth_characteristics:
      paragraphs:
        - zh: 受信来源数据入口介入保留用户原本会访问的域名、TLS 和业务语境，恶意字段可以具有一致样式，提交还可先发往同源路径再由服务器外送。只按域名信誉、TLS 存在或跨域表单目标检测时，恶意输入接收者与正常结账、客户资料或工单流程难以分开；同源阶段还会把异常推迟到服务器制品、路由或出站面。
          en: Trusted-Origin Data-Entry Interposition preserves the domain, TLS, and business context the user already intended to visit. Malicious fields can match the expected style, and a submission can first go to a same-origin path before the server sends it onward. Detection based only on domain reputation, TLS presence, or cross-origin form destinations struggles to separate the malicious receiver from ordinary checkout, customer-profile, or ticket workflows, while a same-origin stage defers the anomaly to server artifacts, routes, or egress.
        - zh: 残余痕迹包括未批准脚本、模板或控制器哈希，消费者浏览器所见资源与发布清单不一致，新增或覆盖字段、异常 form action/connect 目的、同源陌生路由、服务端对特定参数的选择性处理，以及页面进程或服务器的第二输出。合法标签管理、A/B 测试、无障碍注入、反欺诈脚本、支付处理器和客服工具也会改变表单，因此必须把部署、数据合同、字段用途与接收方一起核对。
          en: Residual traces include unapproved script, template, or controller hashes; differences between the browser's received resources and the release manifest; added or overlaid fields; unusual form-action or connect destinations; unfamiliar same-origin routes; selective server processing of a parameter; and a second output from the page process or server. Tag management, A/B tests, accessibility injection, fraud scripts, payment processors, and support tooling also change forms, so deployment, data contract, field purpose, and receiver must be reconciled together.
    scope_boundary_definition:
      paragraphs:
        - zh: 纳入要求真实或组织认可的应用来源仍承载用户交互，而恶意组件取得实际非认证字段或交互结果。若页面只被篡改但用户未提交、只出现覆盖层、脚本只读取已经呈现的页面正文、或只向未知地址发出空请求，都不足以证明输入取得。T1185/NJT-0145 负责已呈现或返回的浏览器内容；本子项负责用户在入口中形成的值，二者在各自结果都成立时可以并列。
          en: Inclusion requires a genuine or organization-recognized application origin to continue carrying user interaction while a malicious component obtains actual non-authentication fields or interaction outcomes. A changed page without submission, an overlay alone, a script reading only rendered page text, or an empty request to an unknown address does not establish input acquisition. T1185 and NJT-0145 own browser content already rendered or returned, while this child owns values the user creates in the entry surface; both can apply when each result is supported.
        - zh: 认证登录字段、口令、OTP 和恢复秘密归 NJS-0169-002 或 NJS-0169-003，取决于真实消费者内镜像还是仿冒消费者；不能因同一站点还包含支付或个人资料就把凭据证据移给本子项。修改脚本或控制器的进入方式可另标供应链、Web 入侵、T1055 或 T1565.002；本子项只在输入结果链闭合时成立。后继服务器 curl、文件落地和外传属于后续动作。
          en: Authentication fields, passwords, OTPs, and recovery secrets belong to NJS-0169-002 or NJS-0169-003 depending on genuine-consumer shadowing or an impersonated consumer; credential evidence does not transfer here merely because the same site also contains payment or profile fields. The way scripts or controllers were changed can be separately classified as supply-chain compromise, web intrusion, T1055, or T1565.002. This child requires a closed input-outcome chain, while later server curl, file writes, and exfiltration are successor actions.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 攻击者控制电商或客户门户的部署文件、第三方依赖或服务端控制器后，在真实结账或资料页面插入看似正常的字段或字段观察逻辑。输入可以先提交到站点自身隐藏路径，再由受侵服务器转往攻击者，从而保持浏览器层同源外观；也可以在正常提交继续或错误提示出现前复制。正式案例应保留浏览器所见制品、表单或字段模式、成功请求、服务器处理与最终结果之间的同事件链。
            en: After controlling deployment files, a third-party dependency, or a server controller for a commerce site or customer portal, the adversary inserts plausible fields or field-observation logic into a genuine checkout or profile page. Input can first submit to a hidden path on the same site and then leave through the compromised server, preserving same-origin appearance in the browser, or it can be copied before normal submission continues or an error is shown. A formal case should preserve a same-event chain across browser-delivered artifact, form or field schema, successful request, server handling, and final outcome.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要修改或运行控制数据入口客户端或服务端组件的能力，以及足够的业务知识来匹配品牌、字段、验证和反馈。若使用同源接收，还需控制服务器路由或处理器并把结果送到其可读位置。严格的制品签名、只读部署、外部渲染监测、最小脚本清单、SRI/CSP、form-action/connect-src、服务出站限制和独立托管高价值字段会增加成本，但同源服务器失陷仍可能绕过部分浏览器策略。
              en: The adversary needs authority to change or runtime-control client or server components of the data-entry surface and enough business knowledge to match branding, fields, validation, and feedback. A same-origin receiver also requires control of a server route or handler and a path moving results to an attacker-readable location. Artifact signing, read-only deployment, external rendered-page monitoring, minimal script inventories, SRI and CSP, form-action and connect-src restrictions, service egress controls, and independently hosted high-value fields increase cost, although a compromised same-origin server can bypass some browser policy.
        defender_model:
          paragraphs:
            - zh: 防守方需要把 CI/CD 批准制品和脚本清单作为外部锚点，比较边缘或真实浏览器收到的资源哈希、DOM/字段模式摘要、form action、fetch/XHR 目的和 CSP/SRI 报告，并连接服务器文件完整性、请求路由、进程与出站网络。若只校验源代码仓库，运行态注入、CDN/第三方变化或服务器动态改写可能不可见；若只看浏览器跨域，则同源隐藏路径会形成盲区。
              en: The defender needs CI or CD approved artifacts and a script inventory as an external anchor, compares resource hashes, DOM or field-schema digests, form actions, fetch or XHR destinations, and CSP or SRI reports as received at the edge or a real browser, and joins server file integrity, request routes, processes, and outbound network. Validating only the source repository misses runtime injection, CDN or third-party drift, and dynamic server rewriting; inspecting only cross-origin browser traffic leaves a blind spot for hidden same-origin routes.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 以真实数据入口的来源特征承载恶意字段接收
          en: Carry malicious field receipt under a genuine data-entry origin's features
        analysis:
          paragraphs:
            - zh: 恶意脚本或处理器在真实应用来源内接收用户字段，保留域名、TLS、品牌和导航等正常特征，并可用同源路径隐藏浏览器到未知域的直接提交。恶意接收者因而借用合法入口的特征分布，改变防守方从域名异常转向制品、字段图、路由和服务器第二输出的观察责任。Sucuri 案例直接证明这一链，但只有一个具体电商实现且未测量告警率，故为 medium。
              en: A malicious script or handler receives user fields inside a genuine application origin, preserving ordinary domain, TLS, branding, and navigation features and optionally using a same-origin path to avoid a direct browser submission to an unknown domain. The malicious receiver therefore borrows the legitimate entry surface's feature distribution, moving defensive responsibility from domain anomaly to artifacts, field graph, routes, and a second server output. The Sucuri case directly establishes the chain, but it is one commerce implementation without measured alert rates, leaving medium confidence.
        evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
        confidence: medium
    evidence_keys: [REF-000725, T1056_COLLECTION_REF_SUCURI_PRESTASHOP, T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI]
    defense_strategy_keys: [T1056_COLLECTION_DET_TRUSTED_ENTRY]
    mitigation_keys: [T1056_COLLECTION_MIT_TRUSTED_ENTRY]
    limitations:
      paragraphs:
        - zh: 当前直接案例集中于支付页，并把覆盖表单、字段监视、同源路径、服务端处理和外送放在一个复杂感染中。它支持受信来源与输入结果，但不能证明所有业务应用、原生桌面组件或第三方脚本具有相同痕迹。CSP、SRI 与 PCI 指南支持控制设计，不证明某部署的检出率；正式 Analytic 必须用本地脱敏测试字段验证浏览器和服务器两端。
          en: Current direct case evidence centers on a payment page and combines an overlaid form, field observation, a same-origin path, server processing, and forwarding in one complex infection. It supports a trusted origin and input outcome but does not establish identical traces for every business application, native desktop component, or third-party script. CSP, SRI, and PCI guidance support control design rather than detection performance. A formal analytic must validate both browser and server branches with locally redacted test fields.
defense_candidates:
  detection_strategies:
    - temporary_key: T1056_COLLECTION_DET_EXTERNAL_STREAM_REUSE
      resolution: extend
      existing_ref: DET-000192
      target_keys: [T1056_COLLECTION_PARENT, T1056_COLLECTION_CHILD_EXTERNAL_STREAM]
      rationale:
        zh: DET-000192 的身份是把未批准全局输入观察、设备读取或事件 Hook 与同进程缓冲和外联相连，并显式区分 capability、exposure 与 capture。该目标、数据面、关联键、隐私约束和 NJA-000215 的实现对普通输入与认证输入完全相同，扩展 detects_refs 不改变策略或 Analytic 语义；应同时把其描述中“输入”保持为通用概念，不能新增仅换名称的对象。
        en: DET-000192 is defined by joining unapproved global input observation, device reads, or event hooks to same-process buffers and egress while explicitly separating capability, exposure, and capture. Its objective, data surfaces, join keys, privacy constraints, and NJA-000215 implementation are identical for ordinary and authentication input. Extending detects_refs does not change strategy or Analytic semantics and avoids a renamed duplicate.
    - temporary_key: T1056_COLLECTION_DET_TRUSTED_ENTRY
      resolution: create
      name:
        zh: 数据入口制品—表单—接收结果谱系
        en: Data-Entry Artifact-Form-Receiver Outcome Lineage
      summary:
        zh: 将受信数据入口的批准制品与消费者实际表单图、提交路径和服务器第二输出连接，区分完整性暴露与实际输入取得。
        en: Join approved artifacts for a trusted data-entry surface to the consumer's actual form graph, submission path, and second server output, separating integrity exposure from actual input acquisition.
      description:
        paragraphs:
          - zh: 本策略以外部保存的发布制品、脚本清单、字段模式和批准接收路径为前态，比较真实浏览器或边缘所接收的脚本、模板、表单字段、action、fetch/XHR 和 CSP/SRI 状态，再连接服务器文件或运行态、同源路由、请求成功、结果字节与非业务外联。只有资产或表单差异时标为 integrity exposure；出现成功输入提交和攻击者可控接收链时才提升为 suspected capture。
            en: This strategy uses externally retained release artifacts, script inventory, field schema, and approved receiver paths as pre-state; compares scripts, templates, form fields, actions, fetch or XHR destinations, and CSP or SRI state as received by a real browser or edge; and joins server files or runtime, same-origin routes, request success, outcome bytes, and nonbusiness egress. Artifact or form drift alone is integrity exposure. Elevation to suspected capture requires a successful input submission and an attacker-controlled receiver chain.
          - zh: 两项 Analytic 分别处理消费者实际渲染图与提交目标，以及同源隐藏接收路径到服务器第二输出。实现不记录真实支付或业务字段，只保存 release、hash、字段模式摘要、form_id、route、目的地、状态和字节。标签管理、A/B 测试、反欺诈、无障碍、支付处理器和客服组件必须用签名制品、变更单、数据合同和有效期排除。
            en: Two analytics cover the consumer's rendered graph and submission destination, and the path from a hidden same-origin receiver to a second server output. Implementation records no actual payment or business field values, retaining only release, hash, field-schema digest, form ID, route, destination, status, and bytes. Tag management, A/B testing, fraud controls, accessibility, payment processors, and support components require exclusion through signed artifacts, change records, data contracts, and expiry.
      detects_keys: [T1056_COLLECTION_PARENT, T1056_COLLECTION_CHILD_TRUSTED_ENTRY]
      domains: [enterprise]
      analytic_keys: [T1056_COLLECTION_NJA_RENDERED_ENTRY, T1056_COLLECTION_NJA_SAME_ORIGIN_RECEIVER]
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP, T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI]
  detection_analytics:
    - temporary_key: T1056_COLLECTION_NJA_RENDERED_ENTRY
      strategy_key: T1056_COLLECTION_DET_TRUSTED_ENTRY
      name:
        zh: 消费者渲染数据入口与提交目标差分
        en: Consumer-Rendered Data-Entry and Submission-Target Differential
      platforms: [Web Applications, Windows, Linux, macOS]
      logic:
        paragraphs:
          - zh: 对登记的数据入口生成批准图，将 app_id、release_id、origin、asset_path、expected_hash、script_id、form_id、field_schema_digest、approved_form_action、approved_connect_destination 和数据合同连接。通过受管浏览器、真实用户监测或独立合成浏览器取得实际资源哈希、脚本来源、DOM/form 摘要、覆盖层标志、form action、fetch/XHR 目的与 CSP/SRI 结果，识别未批准资源、字段、覆盖表单或接收目标；不记录字段值。
            en: Build an approved graph for registered data-entry surfaces joining application ID, release ID, origin, asset path, expected hash, script ID, form ID, field-schema digest, approved form action, approved connect destination, and data contract. Through managed-browser telemetry, real-user monitoring, or an independent synthetic browser, collect actual resource hashes, script origins, a DOM or form digest, overlay indicator, form action, fetch or XHR destination, and CSP or SRI outcome. Identify unapproved resources, fields, overlaid forms, or receivers without recording field values.
          - zh: 在发现差异后的二十四小时内，对每个 pseudonymous_session_id 和 form_id 关联成功的表单或字段事件元数据、HTTP outcome、bytes_out 以及页面或浏览器进程到非批准接收方的第二请求。只见制品、字段或策略差异输出 integrity exposure；只有差异表单发生成功提交且接收方或后继结果不在批准图中时输出 suspected capture。相同 origin 的请求交给第二项 Analytic 继续解析路由和服务器结果。
            en: During the twenty-four hours after drift, join each pseudonymous session ID and form ID to successful form or field-event metadata, HTTP outcome, bytes out, and a second request from the page or browser process to an unapproved receiver. Artifact, field, or policy drift alone yields integrity exposure. Suspected capture requires a successful submission through the changed form and a receiver or downstream outcome outside the approved graph. Same-origin requests pass to the second analytic for route and server-outcome resolution.
      data_requirements:
        - source_type: approved-data-entry-manifest
          name:
            zh: 批准的数据入口制品与接收图
            en: Approved Data-Entry Artifact and Receiver Graph
          channel: Externally retained CI or CD manifest, script inventory, form schema registry, and data-contract catalog
          required_fields: [app_id, release_id, origin, asset_path, expected_hash, script_id, script_source, form_id, field_schema_digest, approved_form_action, approved_connect_destination, data_contract_id, approval_start, approval_end]
        - source_type: consumer-rendered-entry-telemetry
          name:
            zh: 消费者实际渲染入口与策略遥测
            en: Consumer-Rendered Entry and Policy Telemetry
          channel: Managed browser, real-user monitor, or independent synthetic browser with privacy-safe schema collection
          required_fields: [timestamp, device_or_probe_id, pseudonymous_session_id, app_id, page_origin, release_hint, resource_url, observed_hash, script_source, form_id, field_schema_digest, overlay_indicator, form_action, connect_destination, csp_or_sri_result]
        - source_type: browser-or-edge-request-outcome
          name:
            zh: 浏览器或边缘请求结果元数据
            en: Browser or Edge Request-Outcome Metadata
          channel: Managed browser, reverse proxy, web application firewall, or edge request log
          required_fields: [timestamp, pseudonymous_session_id, app_id, page_origin, form_id, request_method, request_path, destination_origin, response_status, bytes_out, bytes_in]
      observables:
        - zh: 浏览器收到未在发布清单中的脚本或模板哈希
          en: Browser receives a script or template hash outside the release manifest
        - zh: 数据入口新增或覆盖字段且字段模式摘要未获批准
          en: Data entry adds or overlays fields whose schema digest is unapproved
        - zh: form action 或 fetch 目的偏离接收图
          en: Form action or fetch destination departs from the receiver graph
        - zh: 差异入口发生成功提交并产生第二请求
          en: A drifted entry surface receives a successful submission and produces a second request
      correlation:
        window:
          zh: 制品或表单差异后观察二十四小时；对单次输入交互，以同一 pseudonymous_session_id、form_id 和 page_origin 在前后十五分钟连接提交与第二请求。
          en: Observe for twenty-four hours after artifact or form drift; for one interaction, join submissions and second requests by pseudonymous session ID, form ID, and page origin within fifteen minutes.
        dimensions: [app_id, release_id, page_origin, asset_path, observed_hash, form_id, field_schema_digest, pseudonymous_session_id, destination_origin, request_path, time]
      false_positives:
        - zh: 批准发布、紧急修复、标签管理、A/B 测试、本地化、无障碍组件、反欺诈脚本、支付处理器更新、客服表单和合成测试会合法改变资源、字段与目的地。
          en: Approved releases, emergency fixes, tag management, A/B testing, localization, accessibility components, fraud scripts, payment-processor updates, support forms, and synthetic tests legitimately change resources, fields, and destinations.
      blind_spots:
        - zh: 未受管浏览器、动态内联脚本、运行态内存改写、服务端按用户或 Cookie 选择性返回、同源请求和已受侵监测探针会削弱可见性。浏览器提交成功只能证明接收候选，必须连接接收控制权或结果才能确认 capture。
          en: Unmanaged browsers, dynamic inline scripts, in-memory runtime rewriting, server-side responses selected by user or cookie, same-origin requests, and compromised monitoring probes reduce visibility. A successful browser submission establishes a receiver candidate only and must be joined to receiver control or outcome to confirm capture.
      tuning_guidance:
        paragraphs:
          - zh: 从构建与数据合同自动生成版本化允许图，按 release、租户、地区和实验 cohort 设到期例外；独立合成探针使用脱敏字段并覆盖不同 Cookie、会话和页面路径。对首次出现资源、未登记字段、未批准 action、策略违规以及差异后首次成功提交提高权重，不按域名或供应商整体放行。
            en: Generate a versioned allow graph from builds and data contracts, with expiring exceptions by release, tenant, region, and experiment cohort. Independent synthetic probes use redacted fields and vary cookies, sessions, and page paths. Raise weight for first-seen resources, unregistered fields, unapproved actions, policy violations, and the first successful submission after drift without globally allowlisting a domain or vendor.
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP, T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI]
    - temporary_key: T1056_COLLECTION_NJA_SAME_ORIGIN_RECEIVER
      strategy_key: T1056_COLLECTION_DET_TRUSTED_ENTRY
      name:
        zh: 同源输入接收路由到服务器第二输出关联
        en: Same-Origin Input Receiver Route to Second Server Output Correlation
      platforms: [Web Applications, Linux, Windows]
      logic:
        paragraphs:
          - zh: 将数据入口批准接收图与服务器 route/controller 清单连接，识别新建或被修改的同源 POST 路径、参数门控处理器、模板/控制器哈希漂移及非批准写入者。对每个成功请求以 app_id、request_id、pseudonymous_session_id、form_id 和 route 为键，在三十分钟内关联 Web 进程或子进程的新文件、加密小记录、curl/HTTP 客户端调用和非业务目的外联；不得保留请求正文或字段值。
            en: Join the approved data-entry receiver graph to the server route and controller inventory, identifying new or changed same-origin POST paths, parameter-gated handlers, template or controller hash drift, and unapproved writers. For each successful request, use application ID, request ID, pseudonymous session ID, form ID, and route to join new files, small encrypted records, curl or HTTP-client calls, and nonbusiness egress from the web process or child within thirty minutes, without retaining request bodies or field values.
          - zh: 新路由或控制器差异单独标为 server integrity exposure；同源请求成功但无结果链标为 receiver candidate；只有差异接收路径在用户交互后产生攻击者可读文件或非批准外联时标为 suspected capture。若服务器正常需要调用支付、反欺诈或 CRM 服务，必须用 data_contract_id、目的字段分类、证书身份、固定账户和变更单验证，而不能按目的域整体放行。
            en: A new route or controller difference alone is server integrity exposure. A successful same-origin request without an outcome chain is a receiver candidate. Suspected capture requires the changed receiver path to produce an attacker-readable file or unapproved egress after user interaction. Where the server legitimately calls payment, fraud, or CRM services, validate data-contract ID, destination field class, certificate identity, fixed account, and change record rather than allowlisting an entire destination domain.
      data_requirements:
        - source_type: server-route-and-controller-integrity
          name:
            zh: 服务端路由控制器与制品完整性
            en: Server Route Controller and Artifact Integrity
          channel: Externally anchored deployment manifest, file integrity monitoring, runtime route registry, or application inventory
          required_fields: [timestamp, app_id, release_id, route, method, controller_or_handler, expected_hash, observed_hash, writer_identity, deployment_id, result]
        - source_type: server-request-outcome
          name:
            zh: 服务端请求结果元数据
            en: Server Request-Outcome Metadata
          channel: Reverse proxy or application access log with privacy-safe request metadata
          required_fields: [timestamp, app_id, request_id, pseudonymous_session_id, form_id, route, method, response_status, bytes_in, bytes_out, server_process_id]
        - source_type: web-process-file-and-egress
          name:
            zh: Web 进程文件与外联结果
            en: Web-Process File and Egress Outcomes
          channel: EDR, application runtime, host audit, and network telemetry
          required_fields: [timestamp, host_id, server_process_id, child_process_id, file_path, bytes_written, destination, destination_certificate_or_account, bytes_out, command_or_library]
        - source_type: approved-server-data-contract
          name:
            zh: 批准的服务端数据接收合同
            en: Approved Server Data-Receiver Contract
          channel: Application architecture inventory, service catalog, and change management
          required_fields: [app_id, route, data_contract_id, approved_destination, field_classification, service_identity, approval_start, approval_end, owner]
      observables:
        - zh: 未批准同源 POST 路由或参数门控处理器
          en: Unapproved same-origin POST route or parameter-gated handler
        - zh: 模板或控制器哈希漂移与成功表单请求同现
          en: Template or controller hash drift coincides with a successful form request
        - zh: Web 进程在输入请求后形成隐藏记录或调用非业务 HTTP 客户端
          en: Web process forms a hidden record or invokes a nonbusiness HTTP client after an input request
        - zh: 同源接收后出现不匹配数据合同的第二输出
          en: Same-origin receipt is followed by a second output that does not match a data contract
      correlation:
        window:
          zh: 服务器制品差异后观察二十四小时；单次成功输入请求以 request_id、session、form_id、route 和 process 在后三十分钟连接文件与外联结果。
          en: Observe for twenty-four hours after server-artifact drift; join one successful input request to file and egress outcomes by request ID, session, form ID, route, and process during the following thirty minutes.
        dimensions: [app_id, release_id, deployment_id, route, request_id, pseudonymous_session_id, form_id, server_process_id, destination, data_contract_id, time]
      false_positives:
        - zh: 支付授权、反欺诈评分、CRM/工单提交、邮件通知、日志与指标代理、紧急修复和蓝绿部署会在表单请求后产生服务器第二输出。
          en: Payment authorization, fraud scoring, CRM or ticket submission, mail notification, log and metric agents, emergency fixes, and blue-green deployments create legitimate second server outputs after form requests.
      blind_spots:
        - zh: 攻击者控制应用、主机与日志接收端时可修改路由同时伪造本地审计；无 request_id、共享 Web 进程、多层队列、加密应用负载和 serverless 下游会削弱逐事务连接。同源静态资源完全在 CDN 边缘被改写时，服务器主机可能没有文件证据。
          en: An adversary controlling application, host, and log receiver can change routes and falsify local audit. Missing request IDs, shared web processes, multilayer queues, encrypted application payloads, and serverless downstreams weaken transaction-level joins. When same-origin static resources are rewritten entirely at a CDN edge, the origin host may contain no file evidence.
      tuning_guidance:
        paragraphs:
          - zh: 为每条数据入口路由维护调用图和接收合同，按 release 与 deployment_id 版本化；只允许具体服务身份、证书和字段分类，而非宽泛域名。使用脱敏合成提交定期验证 request_id 能穿过代理、应用与外联链，对无链路环境分别输出 integrity exposure、receiver candidate 和 suspected capture，避免越级。
            en: Maintain a call graph and receiver contract for each data-entry route, versioned by release and deployment ID. Allow exact service identities, certificates, and field classes rather than broad domains. Use redacted synthetic submissions to verify that request IDs cross proxy, application, and egress chains. In environments without that lineage, emit integrity exposure, receiver candidate, and suspected capture as separate levels rather than overstating certainty.
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP, T1056_COLLECTION_REF_PCI_PAYMENT_PAGE]
  mitigations:
    - temporary_key: T1056_COLLECTION_MIT_EXTERNAL_STREAM_REUSE
      resolution: extend
      existing_ref: MIT-000173
      target_keys: [T1056_COLLECTION_CHILD_EXTERNAL_STREAM]
      rationale:
        zh: MIT-000173 已包含按签名、版本、所有者、目标应用和 session 最小化全局 Hook、Input Monitoring、辅助功能及设备访问，并使用不含实际输入的元数据审计。措施本身对普通输入与认证输入一致，应新增一个针对本子项的 application，说明普通业务输入保护和无障碍/输入法影响，不修改既有认证 application。
        en: MIT-000173 already minimizes global hooks, Input Monitoring, accessibility, and device access by signer, version, owner, target application, and session and audits with metadata that excludes actual input. The measures are identical for ordinary and authentication input. Add a target-specific application describing protection of ordinary business input and impact on accessibility or input methods without changing the existing authentication application.
    - temporary_key: T1056_COLLECTION_MIT_TRUSTED_ENTRY
      resolution: create
      name:
        zh: 受信数据入口完整性与接收路径约束
        en: Trusted Data-Entry Integrity and Receiver-Path Constraint
      description:
        zh: 将数据入口发布制品、浏览器实际执行脚本、字段模式、表单与连接目标、服务端接收路由和第二输出作为一条受控数据流，减少未批准组件读取输入的机会，并在不记录真实字段值的前提下保留可核查谱系。
        en: Govern data-entry release artifacts, scripts actually executed by the browser, field schemas, form and connection destinations, server receiver routes, and second outputs as one controlled data flow, reducing opportunities for unapproved components to read input while preserving verifiable lineage without recording actual field values.
      measures:
        - key: externally-anchor-entry-artifacts
          name:
            zh: 外部锚定数据入口制品与字段模式
            en: Externally Anchor Data-Entry Artifacts and Field Schemas
          description:
            zh: 从受保护 CI/CD 保存签名制品、脚本清单、模板/控制器哈希、form_id、字段模式摘要和批准接收路径，并从独立边缘或真实浏览器校验实际接收内容；生产服务器自身报告不能作为唯一黄金基线。
            en: Retain signed artifacts, script inventory, template or controller hashes, form IDs, field-schema digests, and approved receiver paths in protected CI or CD and validate what an independent edge or real browser receives. A production server's self-report cannot be the only golden baseline.
          control_type: preventive
        - key: restrict-script-form-and-connect-targets
          name:
            zh: 约束脚本完整性、表单目标和浏览器连接目的
            en: Constrain Script Integrity Form Targets and Browser Connection Destinations
          description:
            zh: 对可固定的外部资源使用 SRI/Integrity-Policy，对脚本来源、connect-src 与 form-action 建最小 CSP，并接收 report-only/violation 报告；内联和同源动态代码仍须结合 nonce/hash、制品完整性和服务端控制，不能把 CSP 当作单一防线。
            en: Use SRI or Integrity-Policy for stable external resources, apply a minimal CSP to script sources, connect-src, and form-action, and collect report-only or violation reports. Inline and dynamic same-origin code still require nonces or hashes, artifact integrity, and server controls; CSP is not a sole defense.
          control_type: preventive
        - key: authorize-monitor-payment-page-scripts
          name:
            zh: 授权盘点并监测敏感数据入口脚本
            en: Authorize Inventory and Monitor Sensitive Data-Entry Scripts
          description:
            zh: 对支付、个人资料和高价值业务入口的每项脚本记录所有者、业务理由、字段分类、供应商、版本和到期时间，确保完整性并监测消费者浏览器实际接收的页面、脚本与安全相关响应头是否被未授权修改。
            en: For payment, profile, and high-value business entry surfaces, record owner, business justification, field classification, supplier, version, and expiry for every script, ensure integrity, and monitor the page, scripts, and security-relevant response headers as received by the consumer browser for unauthorized change.
          control_type: detective-support
        - key: minimize-and-isolate-sensitive-entry
          name:
            zh: 最小化敏感字段并隔离高价值输入接收者
            en: Minimize Sensitive Fields and Isolate High-Value Input Receivers
          description:
            zh: 只收集业务必需字段，并在可行时将支付或其他高价值输入置于独立治理的托管字段或隔离 origin；限制表单 action、服务端 route、应用身份和出站目的，验证请求模式但不在检测系统复制字段值。
            en: Collect only fields required for the business purpose and, where feasible, place payment or other high-value input in independently governed hosted fields or an isolated origin. Restrict form actions, server routes, application identities, and egress destinations and validate request schemas without copying field values into the detection system.
          control_type: exposure-reduction
      applications:
        - target_key: T1056_COLLECTION_PARENT
          use:
            zh: 对所有会接收非认证敏感输入的端点与应用维护观察者、制品、字段模式和接收方清单，减少全局输入权限，保护数据入口发布链，并用脱敏测试验证从输入到批准接收者的谱系。
            en: Maintain inventories of observers, artifacts, field schemas, and receivers for endpoints and applications that accept non-authentication sensitive input, minimize global input authority, protect the data-entry release chain, and validate input-to-approved-receiver lineage with redacted tests.
          expected_effect:
            zh: 缩小能读取交互输入的组件集合，使消费者外观察与受信来源介入分别在权限或制品面留下可比较前态，并减少不必要的敏感数据暴露。
            en: Reduce the set of components able to read interactive input, give consumer-external observation and trusted-origin interposition comparable pre-state on authority or artifacts, and reduce unnecessary sensitive-data exposure.
          limitations:
            zh: 已控制内核、浏览器、应用服务器、构建系统和日志接收端的攻击者可能同时绕过多层控制；严格限制会影响无障碍、分析、支付和支持流程，且旧应用可能不能使用 CSP、SRI 或独立托管字段。
            en: An adversary controlling the kernel, browser, application server, build system, and log receiver can bypass several layers at once. Strict controls can affect accessibility, analytics, payment, and support workflows, and legacy applications may not support CSP, SRI, or independently hosted fields.
        - target_key: T1056_COLLECTION_CHILD_TRUSTED_ENTRY
          use:
            zh: 对结账、客户资料和高价值业务表单外部保存批准制品与字段图，限制脚本、form action、connect 和同源接收路由，监测消费者实际页面与服务器第二输出，并把每项例外绑定数据合同、release 与有效期。
            en: For checkout, customer-profile, and high-value business forms, externally retain approved artifacts and field graphs; restrict scripts, form actions, connections, and same-origin receiver routes; monitor the actual consumer page and second server outputs; and bind each exception to a data contract, release, and expiry.
          expected_effect:
            zh: 减少攻击者把恶意接收者藏入受信来源的路径，并使新增字段、脚本漂移、同源隐藏路由和未批准第二输出更早形成高质量差异。
            en: Reduce paths for hiding a malicious receiver in a trusted origin and make added fields, script drift, hidden same-origin routes, and unapproved second outputs produce earlier high-quality differences.
          limitations:
            zh: 服务器自身失陷可返回带有效域名与 TLS 的恶意内容，同源请求可能通过严格 CSP；第三方脚本更新、A/B 测试和动态个性化会增加基线成本，必须以外部锚点和多会话探针补足。
            en: A compromised server can return malicious content under a valid domain and TLS, and same-origin requests can pass a strict CSP. Third-party updates, A/B tests, and dynamic personalization increase baseline cost and require external anchors and probes across multiple sessions.
      evidence_keys: [T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI, T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
existing_library_reuse:
  reference_refs: [REF-000725, REF-000726, REF-000727, REF-000728, REF-000733]
  claim_refs: []
  case_refs: [CASE-000235]
  strategy_refs: [DET-000192]
  analytic_refs: [NJA-000215]
  mitigation_refs: [MIT-000173]
  relationship_refs: []
  resolutions:
    - object_ref: NJT-0169
      resolution: boundary-only-no-reuse
      note:
        zh: 保持 TA0006 的认证秘密完成点、三个 NJS 和防御语义，不增加 TA0009 tactic_ref。新对象只收非认证输入结果；两者共享 ATT&CK 来源但按直接对象拆分，类似 T1557 的 NJT-0136/NJT-0142 先例。
        en: Preserve NJT-0169's authentication-secret completion, three children, and defense semantics under TA0006 without adding TA0009. The new object accepts only non-authentication input outcomes; the two share an ATT&CK source but split by direct object, paralleling the NJT-0136 and NJT-0142 precedent for T1557.
    - object_ref: DET-000192
      resolution: extend
      note:
        zh: 策略目标与 NJA-000215 对输入类型中立，可给父级和消费者外子项增加 detects_refs；不得复制策略或 Analytic。
        en: The objective and NJA-000215 are input-type neutral and can extend detects_refs to the parent and consumer-external child; do not copy the strategy or Analytic.
    - object_ref: MIT-000173
      resolution: extend-application
      note:
        zh: 复用其最小输入观察权限和隐私安全元数据措施，为消费者外子项增加普通业务输入专用 application；既有认证 application 保持原义。
        en: Reuse its least input-observation authority and privacy-safe metadata measures and add an ordinary-business-input application for the consumer-external child while preserving the existing authentication application.
    - object_ref: CASE-000235
      resolution: extend-subjects
      note:
        zh: 同一 DRBControl 事件已经说明每个 RDP session 的键盘记录结果及用户、进程、窗口语境，并明确不能推断所有输出都是认证秘密；应把新父级和消费者外子项加入 subject_refs，而不是新建重复案例。
        en: The same DRBControl event already records keylogging output in each RDP session with user, process, and window context and explicitly says not every output can be assumed to be an authentication secret. Extend subject_refs to the new parent and consumer-external child rather than creating a duplicate case.
    - object_ref: CLM-000831
      resolution: split
      note:
        zh: 既有命题包含“后继身份使用”并服务 NJT-0169，新的 Collection 证据阶段应另建不含身份结果的原子命题，避免用相似措辞掩盖直接结果差异。
        en: The existing proposition includes later identity use and serves NJT-0169. Create a separate Collection evidence-stage claim without an identity outcome rather than masking the direct-result difference with similar wording.
    - object_ref: CLM-000832
      resolution: split
      note:
        zh: 既有命题限定真实认证应用；新的消费者外输入流命题以非认证内容和业务消费者为对象，不能直接扩展 subject_refs。
        en: The existing claim is limited to a genuine authentication application; the new consumer-external input-stream claim concerns non-authentication content and business consumers, so subject_refs should not be extended.
    - object_ref: DET-000193
      resolution: no-reuse
      note:
        zh: DET-000193 与 NJA-000216/217 以登录资产、认证进程和凭据缓冲为身份，不能只替换名称覆盖支付或业务字段。
        en: DET-000193 and NJA-000216 or NJA-000217 are identified by sign-in assets, authentication processes, and credential buffers and cannot cover payment or business fields through name substitution.
    - object_ref: DET-000194
      resolution: no-reuse
      note:
        zh: DET-000194 的本地凭据提示和 IdP 事务差分只适合认证接收者；普通数据入口需要发布制品、字段图、表单目标、同源路由与服务端第二输出。
        en: DET-000194's local credential prompt and IdP-transaction differential applies to authentication receivers. Ordinary data entry requires release artifacts, a field graph, form destinations, same-origin routes, and a second server output.
  overlap_review:
    - existing_ref: NJT-0214
      resolution: boundary-only
      note: Clipboard service content returned after copying remains NJT-0214; input events or values before they enter the clipboard remain T1056 Collection.
    - existing_ref: NJT-0145
      resolution: boundary-and-co-classify
      note: NJT-0145 owns page or session content already rendered or returned; T1056 owns values the user is forming. Both require separate content outcomes when one malicious component does both.
    - existing_ref: NJT-0103
      resolution: adjacent-prerequisite
      note: Cross-process embedding or T1055 explains how code enters a consumer; actual input acquisition requires its own outcome.
    - existing_ref: NJT-0132
      resolution: adjacent-gating
      note: NJS-0132-001 owns window or page context used to gate later capture. T1056 does not recreate context gating and requires the input outcome.
    - existing_ref: T1204
      resolution: adjacent-user-action
      note: Opening, clicking, or launching is User Execution; typing or submitting becomes T1056 only when an attacker-controlled receiver obtains it.
    - existing_ref: NJT-0134
      resolution: adjacent-post-acquisition
      note: Consolidating captured input into a staging location occurs after source acquisition.
library_candidates:
  references:
    - key: T1056_COLLECTION_REF_SUCURI_PRESTASHOP
      resolution: create-if-no-equivalent
      title:
        zh: 隐藏在单页结账模块中的 PrestaShop 窃取程序
        en: PrestaShop Skimmer Concealed in One Page Checkout Module
      url: https://blog.sucuri.net/2022/07/prestashop-skimmer-concealed-in-one-page-checkout-module.html
      source_type: incident-analysis
      publisher: Sucuri
      published: "2022-07-19"
      supports: The investigation found a fake payment form overlaid within the legitimate checkout, malicious JavaScript in a legitimate one-page-checkout asset monitoring payment-form changes and sending payment data to a same-site path, server-side code recognizing the request, and harvested card data being sent to an attacker-controlled server.
      limitations: One compromised PrestaShop implementation. It does not establish prevalence, cross-platform fields, alert rates, or that every visitor submitted data. The attack combines overlay, field monitoring, same-origin handling, error feedback, and later egress, which must not be collapsed into one universal trace.
    - key: T1056_COLLECTION_REF_PCI_PAYMENT_PAGE
      resolution: create-if-no-equivalent
      title:
        zh: 支付页面安全与防止电子窃取指南
        en: Payment Page Security and Preventing E-Skimming Guidance
      url: https://blog.pcisecuritystandards.org/new-information-supplement-payment-page-security-and-preventing-e-skimming
      source_type: industry-standard-guidance
      publisher: PCI Security Standards Council
      published: "2025-03-10"
      supports: PCI SSC explains that payment-page scripts should be authorized, checked for integrity, and monitored for tampering, including pages, scripts, and security-impacting headers as received by the consumer browser; supports artifact, script-inventory, and rendered-page controls.
      limitations: Control and compliance guidance rather than a sensor schema or measured detection efficacy. Payment-page scope must not be presented as automatically covering every business form.
    - key: T1056_COLLECTION_REF_W3C_CSP
      resolution: create-if-no-equivalent
      title:
        zh: 内容安全策略第三级
        en: Content Security Policy Level 3
      url: https://www.w3.org/TR/CSP/
      source_type: technical-standard
      publisher: World Wide Web Consortium
      published: null
      supports: Defines script and connection source controls, report-only policy delivery, and form-action restriction of form-submission target URLs; supports receiver restrictions and policy metadata.
      limitations: A browser control specification, not evidence of malicious capture. Same-origin compromised code and server handlers can remain within allowed sources, and deployment support varies.
    - key: T1056_COLLECTION_REF_W3C_SRI
      resolution: create-if-no-equivalent
      title:
        zh: 子资源完整性
        en: Subresource Integrity
      url: https://www.w3.org/TR/sri/
      source_type: technical-standard
      publisher: World Wide Web Consortium
      published: null
      supports: Defines integrity metadata for script and link resources and Integrity-Policy reporting, supporting browser-side validation that a fetched resource matches an expected representation.
      limitations: Does not cover every inline, dynamic, or same-origin resource and does not prove input was captured; CORS and browser support affect applicability.
  claims:
    - temporary_key: T1056_COLLECTION_CLM_RESULT_STAGES
      resolution: create
      claim_type: technique-boundary
      proposition_zh: 输入观察权限或数据入口改动、实际非认证输入复制、攻击者保留与后继使用是必须分别证明的证据阶段
      proposition_en: Input-observation authority or data-entry modification, actual copying of non-authentication input, attacker retention, and later use are evidentiary stages that require separate proof
      evidence_keys: [REF-000725, REF-000726, REF-000728, T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    - temporary_key: T1056_COLLECTION_CLM_EXTERNAL_STREAM
      resolution: create
      claim_type: subtechnique-existence
      proposition_zh: 消费者外输入观察可让业务应用继续处理相同事件而把副本痕迹转移到端点输入权限、设备和观察进程结果
      proposition_en: Consumer-external input observation can let a business application process the same event while moving copy traces to endpoint input authority, devices, and observer-process outcomes
      evidence_keys: [REF-000726, REF-000727, REF-000728]
    - temporary_key: T1056_COLLECTION_CLM_TRUSTED_ENTRY
      resolution: create
      claim_type: subtechnique-existence
      proposition_zh: 受侵真实数据入口可以在保留合法域名与结账语境时覆盖或观察支付字段，并把实际输入送入恶意同源接收与第二输出链
      proposition_en: A compromised genuine data-entry origin can preserve its legitimate domain and checkout context while overlaying or observing payment fields and sending actual input through a malicious same-origin receiver and second-output chain
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    - temporary_key: T1056_COLLECTION_CLM_OUTCOME_SPLIT
      resolution: create
      claim_type: technique-boundary
      proposition_zh: 一般输入内容的 Collection 结果与认证秘密的 Credential Access 结果可共用捕获实现，但必须按直接对象分别证明和分类
      proposition_en: Collection of ordinary input content and Credential Access through authentication secrets may share a capture implementation but require separate proof and classification by direct object
      evidence_keys: [REF-000725, REF-000728, T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    - temporary_key: T1056_COLLECTION_CLM_ENTRY_CONTROLS
      resolution: create
      claim_type: mitigation
      proposition_zh: 外部锚定脚本与表单清单、资源完整性、CSP 表单与连接目标约束以及消费者侧篡改监测共同降低未批准数据入口接收者的暴露面并提高可观察性
      proposition_en: Externally anchored script and form inventories, resource integrity, CSP restrictions on form and connection targets, and consumer-side tamper monitoring jointly reduce exposure to unapproved data-entry receivers and improve observability
      evidence_keys: [T1056_COLLECTION_REF_PCI_PAYMENT_PAGE, T1056_COLLECTION_REF_W3C_CSP, T1056_COLLECTION_REF_W3C_SRI]
  cases:
    - temporary_key: T1056_COLLECTION_CASE_PRESTASHOP
      resolution: create
      name:
        zh: PrestaShop 单页结账输入窃取
        en: PrestaShop One-Page Checkout Input Skimming
      actor_or_campaign: Unattributed PrestaShop skimmer
      event: Sucuri found a compromised checkout loading malicious code in a legitimate one-page-checkout asset, an overlaid payment form, monitoring of payment-field changes, a same-site receiver path and server handler, and forwarding of stolen card data to an attacker-controlled server.
      target_keys: [T1056_COLLECTION_PARENT, T1056_COLLECTION_CHILD_TRUSTED_ENTRY]
      time_range: null
      target_sectors:
        zh: [电子商务与在线支付]
        en: [E-commerce and online payment]
      evidence_keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
      confidence: high
      limitations: Specific site, platform, and observed infection. Reporting does not provide affected-user count or alert-rate measurement and does not prove every visitor submitted payment data.
  detection_strategies:
    - temporary_key: T1056_COLLECTION_DET_TRUSTED_ENTRY
      resolution: create
      distinction: Trusted data-entry artifact and rendered-form integrity joined to successful submission, same-origin server receiver, and second output without collecting field values.
    - temporary_key: T1056_COLLECTION_DET_EXTERNAL_STREAM_REUSE
      resolution: extend
      existing_ref: DET-000192
      distinction: Exact reuse of global input-observation authority to output-chain objective for ordinary non-authentication input.
  detection_analytics:
    - temporary_key: T1056_COLLECTION_NJA_RENDERED_ENTRY
      resolution: create
      distinction: Release manifest and approved field or receiver graph compared with resources and forms actually received by consumers, elevated only with successful submission and unauthorized receiver.
    - temporary_key: T1056_COLLECTION_NJA_SAME_ORIGIN_RECEIVER
      resolution: create
      distinction: Same-origin input route and server artifact drift joined by request and process to an attacker-readable file or nonbusiness egress.
    - temporary_key: T1056_COLLECTION_NJA_EXTERNAL_STREAM_REUSE
      resolution: reuse
      existing_ref: NJA-000215
      distinction: Logic, data requirements, privacy constraint, window, false positives, blind spots, and tuning remain unchanged.
  mitigations:
    - temporary_key: T1056_COLLECTION_MIT_TRUSTED_ENTRY
      resolution: create
      distinction: External artifact and field-schema anchors, browser resource integrity and receiver restrictions, script authorization or tamper monitoring, sensitive-field minimization, and server-path governance.
    - temporary_key: T1056_COLLECTION_MIT_EXTERNAL_STREAM_REUSE
      resolution: extend-application
      existing_ref: MIT-000173
      distinction: Same observer-authority measures with a new target-specific application for non-authentication business input.
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1056.004, T1056.002, T1056.001, T1056.003]
    represented_dimensions:
      - zh: 凭据敏感 API 或认证进程中的函数截获位置
        en: Function interception within credential-sensitive APIs or authentication processes
      - zh: 仿冒本地图形界面与用户主动输入认证秘密
        en: Impersonated local graphical interfaces and user-entered authentication secrets
      - zh: 操作系统、设备或事件层的按键与交互流
        en: Keystroke and interaction streams at operating-system, device, or event layers
      - zh: 真实或仿冒 Web 门户中的表单输入接收位置
        en: Form-input receivers in genuine or impersonated web portals
    breadth_trigger: three-to-five-multi-axis-review
    coverage_resolutions:
      - attack_id: T1056.004
        resolution: adjacent-technique
        mapped_keys: [NJT-0169, NJS-0169-002]
        note_zh: 固定子项明确以凭据 API 和认证参数为对象，已由 TA0006 真实消费者内提交镜像处理；Hook 类型只是实现，不能导入 Collection 子项。
        note_en: The fixed child explicitly concerns credential APIs and authentication parameters and is already handled by genuine-consumer submission shadowing under TA0006. Hook type is an implementation and is not imported as a Collection child.
      - attack_id: T1056.002
        resolution: adjacent-technique
        mapped_keys: [NJT-0169, NJS-0169-003]
        note_zh: 当前 Enterprise 行为和高质量案例集中于凭据样式提示，已由仿冒消费者诱导取密覆盖。非认证 GUI 诱导缺少独立结果级证据，保持父级或 deferred，不复制标签。
        note_en: Current Enterprise behavior and high-quality cases center on credential-like prompts already covered by impersonated-consumer credential elicitation. Non-authentication GUI elicitation lacks independent outcome-level evidence and remains parent core or deferred rather than copying the label.
      - attack_id: T1056.001
        resolution: niji-variable-candidate
        mapped_keys: [T1056_COLLECTION_CHILD_EXTERNAL_STREAM, NJS-0132-001]
        note_zh: 设备/事件流的消费者外位置与实际一般输入结果支持正式子项；窗口或页面条件门控仍由 NJS-0132-001 拥有，按键介质不成为名称。
        note_en: Consumer-external device or event position plus an actual ordinary-input outcome supports the formal child. Window or page context gating remains owned by NJS-0132-001, and the keyboard medium does not define the name.
      - attack_id: T1056.003
        resolution: niji-variable-candidate
        mapped_keys: [T1056_COLLECTION_CHILD_TRUSTED_ENTRY, NJT-0169]
        note_zh: 认证门户输入仍归 NJT-0169；受侵真实站点内的非认证支付字段、覆盖表单、同源接收和结果链支持“受信来源”变量，Web 本身不是子项边界。
        note_en: Authentication-portal input remains under NJT-0169. Non-authentication payment fields, an overlaid form, same-origin receipt, and an outcome chain inside a compromised genuine site support the trusted-origin variable; web itself does not define the child.
    candidate_stealth_axes_examined:
      - axis: consumer_external_capture_plane
        disposition: formal
        why_zh: 副本在预期消费者审计之外形成，防御从业务事务转到端点输入权限、设备和观察进程结果。
        why_en: The copy forms outside intended-consumer audit, moving defense from business transactions to endpoint input authority, devices, and observer-process outcomes.
      - axis: trusted_origin_receiver_control
        disposition: formal
        why_zh: 用户仍在真实应用来源交互，而接收者控制权改变；防御需要外部制品、消费者表单图、同源路由与服务器第二输出。
        why_en: The user still interacts with a genuine application origin while receiver control changes, requiring external artifacts, a consumer form graph, same-origin routes, and second server output.
      - axis: impersonated_standalone_consumer
        disposition: adjacent-or-deferred
        why_zh: 认证提示与假登录页已由 NJS-0169-003 拥有；普通数据的独立假表单更接近社会工程或信息收集，当前缺少 TA0009 Enterprise 结果级证据与独立防御差。
        why_en: Authentication prompts and fake sign-in pages are already owned by NJS-0169-003. A stand-alone fake form for ordinary data is closer to social engineering or information gathering, and current TA0009 Enterprise evidence lacks an outcome-level case and independent defense difference.
      - axis: context_gated_capture
        disposition: adjacent-existing
        why_zh: 以活动窗口、焦点或页面状态决定何时捕获由 NJS-0132-001 拥有；T1056 只补充实际输入结果。
        why_en: NJS-0132-001 owns using active window, focus, or page state to decide when capture occurs; T1056 adds the actual input outcome.
      - axis: api_hook_gui_web_or_platform
        disposition: rejected
        why_zh: API Hook、GUI、Web、键盘、操作系统和产品是实现或介质，没有稳定的跨实现防守观察边界。
        why_en: API hook, GUI, web, keyboard, operating system, and product are implementations or media without a stable cross-implementation defender-observation boundary.
      - axis: encrypted_buffered_or_batched_output
        disposition: adjacent-successor
        why_zh: 加密、混淆、缓存、暂存和分批发送发生在输入结果形成后，属于产物处理、暂存或外传，不作为输入取得兄弟项。
        why_en: Encryption, obscuration, buffering, staging, and batching occur after the input result forms and belong to artifact handling, staging, or exfiltration rather than a sibling of input acquisition.
    second_pass_required: false
    second_pass_completed: true
    second_pass_method:
      zh: 第一轮逐项解析四个 ATT&CK 子项的直接对象、捕获位置、消费者身份和防御面；第二轮丢弃其名称，从相对消费者位置、来源控制权、结果类型、条件门控、输出路径和观察面重新测试稳定性、非认证结果证据、跨技术边界与防御差。该第二轮还对 NJT-0169 的三个 NJS 做逐项比较，拒绝把 Credential Access taxonomy 改名复制到 Collection。
      en: The first pass resolved each of four ATT&CK children by direct object, capture position, consumer identity, and defensive surface. The second pass discarded their labels and retested relative consumer position, origin control, result type, context gating, output path, and observation surface for stability, non-authentication outcome evidence, cross-technique boundary, and defense difference. It also compared every NJT-0169 child and rejected renaming the Credential Access taxonomy into Collection.
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两项子项分别以消费者审计边界外与真实数据入口来源内为变量，并拥有不同结果链和防御：前者精确复用端点输入权限到输出关联，后者新建制品—表单—同源路由—服务器第二输出关联。Credential API Hooking 与凭据 GUI 保持 TA0006，Web/键盘标签不被导入；四项广度已完整解析。
      en: The two children vary capture outside consumer audit and receipt inside a genuine data-entry origin and have distinct outcome and defense chains. The first exactly reuses endpoint input-authority-to-output correlation; the second creates artifact-to-form-to-same-origin-route-to-second-server-output correlation. Credential API hooking and credential GUI behavior remain under TA0006, while web and keyboard labels are not imported. All four breadth items are resolved.
  evidence_coverage:
    parent_behavior_keys: [REF-000725, REF-000728, T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    boundary_keys: [REF-000725, REF-000726, REF-000727, REF-000728, T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    mechanism_support:
      - mechanism: NM-BT
        keys: [REF-000726, REF-000727, REF-000728]
        limit: Platform sources prove observation position or authority and DRBControl proves output; no source measures alert reduction.
      - mechanism: NM-FD
        keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
        limit: One compromised-commerce investigation proves trusted origin and actual payment-data path but not cross-application detection efficacy.
    child_existence_support:
      - child_key: T1056_COLLECTION_CHILD_EXTERNAL_STREAM
        keys: [REF-000726, REF-000727, REF-000728]
      - child_key: T1056_COLLECTION_CHILD_TRUSTED_ENTRY
        keys: [T1056_COLLECTION_REF_SUCURI_PRESTASHOP]
    unsupported_or_deferred:
      - zh: 非认证独立假 GUI 或攻击者自有假页面缺少当前 Enterprise 结果级案例和独立防御链，不正式建立第三子项。
        en: A stand-alone fake GUI or attacker-owned fake page for non-authentication data lacks a current Enterprise outcome-level case and distinct defense chain and does not become a third child.
      - zh: Hook、权限、覆盖层或脚本差异没有输入结果时，只证明暴露或完整性失败。
        en: A hook, permission, overlay, or script difference without an input outcome establishes exposure or integrity failure only.
      - zh: 公开来源没有三段路径的检出率、误报率或受影响用户总数；机理与检测效果不得提升为 high。
        en: Public sources do not provide detection rates, false-positive rates, or total affected users for the paths; mechanism and detection efficacy cannot be raised to high.
      - zh: 页面内容读取、输入捕获、页面篡改、暂存与外传必须分别证明，不能以一个复杂 Web 感染自动互证。
        en: Page-content reading, input acquisition, page manipulation, staging, and exfiltration require separate proof and cannot automatically prove one another within a complex web infection.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父稿明确普通输入完成点、四级证据、两个观察面、隐私约束及与认证输入的结果拆分；两个子稿分别具有独立定义、残余痕迹、反例、攻防前提、机理、Analytic 和 Mitigation。正文没有按键盘、GUI、Web、API Hook、平台或字段类型建立子项，也没有把 NJT-0169 文本仅替换名称后复用。
      en: The parent fixes ordinary-input completion, four evidence stages, two observation planes, privacy constraints, and result separation from authentication input. Each child has an independent definition, residual traces, counter-examples, attacker and defender prerequisites, mechanism, analytic, and mitigation. No child is defined by keyboard, GUI, web, API hook, platform, or field type, and NJT-0169 prose is not reused through name substitution.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization and parse checking, duplicate-key checking, bilingual-pair audit, temporary-key reference audit, and punctuation checks only]
  limitations:
    paragraphs:
      - zh: DRBControl 和 PrestaShop 证据分别证明消费者外报告结果与受信来源支付字段结果，但来自不同活动、平台和攻击阶段，不能拼成同一普遍链。平台文档证明 API 位置或权限，不证明恶意行为；PCI、CSP 与 SRI 证明控制语义，不证明任何部署已检出攻击。两项 NJS 因此保持 medium 机理置信度，案例置信度按来源单独校准。
        en: DRBControl and PrestaShop evidence separately establish a consumer-external report outcome and trusted-origin payment-field outcome but concern different operations, platforms, and stages and cannot be combined into one universal chain. Platform documentation proves API position or authority rather than malicious use, while PCI, CSP, and SRI establish control semantics rather than detection in any deployment. Both NJS therefore retain medium mechanism confidence, with case confidence calibrated separately by source.
      - zh: 检测输入行为会接触高度敏感且可能受法律、隐私和劳资政策约束的数据。正式实现必须优先使用权限、进程、资源哈希、字段模式摘要、目标、状态和字节元数据，以脱敏合成事务验证链路，并对无障碍、输入法、远程支持、分析、反欺诈和测试制定精确且到期的例外。缺少结果层时只能报告 exposure，不得用采集能力代替成功 Collection。
        en: Detecting input behavior touches highly sensitive data and may be constrained by legal, privacy, and labor policy. Formal implementations must prefer authority, process, resource hash, field-schema digest, destination, status, and byte metadata, validate lineage with redacted synthetic transactions, and maintain exact expiring exceptions for accessibility, input methods, remote support, analytics, fraud controls, and testing. Where the outcome layer is absent, report exposure only and do not substitute capture capability for successful Collection.
  rejected_mechanisms:
    - mechanism: NM-ST
      reason_zh: 窗口、焦点或页面条件门控已由 NJS-0132-001 拥有，公开 T1056 Collection 证据没有独立量化低频或定时捕获的阈值规避；不在本父级重复。
      reason_en: Window, focus, or page-context gating is already owned by NJS-0132-001, and public T1056 Collection evidence does not independently quantify threshold evasion from low-rate or timed capture, so NM-ST is not duplicated here.
    - mechanism: NM-DO
      reason_zh: 捕获后加密、Base64、混淆报告或批量传输改变产物可检查性和外传，而不是输入如何被取得；相关行为留给暂存、归档或外传对象。
      reason_en: Encryption, Base64, obfuscated reports, or batching after capture changes artifact inspectability and egress rather than how input is acquired and remains with staging, archive, or exfiltration objects.
  open_questions:
    - zh: 主 Agent 应在正式写入前确认同一 ATT&CK T1056 采用 NJT-0169 与新 TA0009 对象的结果导向双对象模型，并在 duplicate resolution 中记录与 T1557 先例一致的理由。
      en: Before canonical writing, the primary agent should confirm the result-oriented two-object model for ATT&CK T1056 using NJT-0169 and the new TA0009 object and record the rationale, consistent with the T1557 precedent, in duplicate resolution.
    - zh: 若主 Agent 找到能够证明非认证独立仿冒 GUI 或假页面输入结果、且防御不同于受信来源介入与社会工程的结论级证据，可重新评估第三子项；当前不得为接近 ATT&CK 数量而正式化。
      en: If the primary agent finds conclusion-level evidence for a non-authentication stand-alone impersonated GUI or fake-page input outcome with defenses distinct from trusted-origin interposition and social engineering, a third child can be reassessed. It must not be formalized merely to approach the ATT&CK count.
integration:
  status: pending
  resolutions:
    - Adapt as a separate TA0009 Collection-scoped parent; do not extend NJT-0169 tactic ownership.
    - Propose two Niji-native children based on consumer-external capture plane and trusted-origin receiver control.
    - Extend DET-000192 and MIT-000173 for the consumer-external child; reuse NJA-000215 unchanged.
    - Create one trusted-entry DET with two distinct analytics and one target-specific mitigation.
    - Extend CASE-000235 for the same DRBControl event; create one PrestaShop case; create four nonduplicate references after exact URL and title lookup.
