  claims:
    - key: B10-T1029-CLM-ANCHOR
      proposition:
        zh: T1029 的固定父行为是控制实际数据外传的时刻或间隔，ATT&CK 19.1 不含子技术；C2 心跳或睡眠不能单独证明外传。
        en: The fixed T1029 parent behavior controls the time or interval of actual data exfiltration and has no ATT&CK children in 19.1; C2 heartbeats or sleep alone do not establish exfiltration.
      evidence_keys: [B10-T1029-REF-ATTACK]
      confidence: high
    - key: B10-T1029-CLM-QUEUE
      proposition:
        zh: Sedreco 将待传数据放在出站文件并通常每十分钟批量送出，较少网络联系可能降低注意，但固定节律仍可被长窗分析发现。
        en: Sedreco queues data in an outbound file and usually sends it in bulk every ten minutes; fewer contacts may reduce attention, while fixed recurrence remains observable over a long window.
      evidence_keys: [B10-T1029-REF-ESET-SEDNIT]
      confidence: medium
    - key: B10-T1029-CLM-WINDOW
      proposition:
        zh: LightNeuron 的代码可以把自动文件外传限制于工作或夜间时段，Carbon 的日志轮转也可按本地时窗和周期待发；现有来源不能证明该选择在野外产生了可量化的检测规避效果。
        en: LightNeuron code can restrict automatic file exfiltration to work or night periods and Carbon can queue log sends by local window and period; the sources do not prove quantified detection evasion from such choices in the wild.
      evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON]
      confidence: medium
    - key: B10-T1029-CLM-DETECTION
      proposition:
        zh: 以流量时间、出站字节和源—目的地周期为基础，并结合发起进程与授权作业基线，能测试定时外传；进程连接日志自身不提供可靠的外传体积。
        en: Flow time, originator bytes, and source-to-destination recurrence, joined to initiating process and authorized-job baselines, can test scheduled exfiltration; process connection logs alone do not provide a reliable exfiltration volume.
      evidence_keys: [B10-T1029-REF-ZEEK, B10-T1029-REF-MDE-NETWORK, B10-T1029-REF-ATTACK-DET]
      confidence: medium
    - key: B10-T1029-CLM-MITIGATION
      proposition:
        zh: 通过受管接口对出站目的地和主体执行默认拒绝、按例外允许，可限制即使落在正常时段的未授权外传路径；它不能阻止已授权路径被滥用。
        en: Default-deny, exception-allow egress control by principal and destination at managed interfaces can constrain unauthorized transfers even when timed to normal activity; it does not stop abuse of an approved path.
      evidence_keys: [B10-T1029-REF-NIST-53]
      confidence: medium
