handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-001
work_item_ref: WORK-TA0010-T1029
temporary_key_prefix: B10-T1029
candidate:
  source_type: attack
  source_attack_id: T1029
  name: {zh: 定时传输, en: Scheduled Transfer}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1029 以“只在特定时刻或间隔外传数据”为父行为，并把混入正常活动或满足可用性都列为可能目的。Niji 保留外传时机这个锚点，但把正式范围收紧到攻击者有意利用时间关系降低识别、关联或阻断机会的情形；只为作业可靠性设置时间表的普通自动外传不能据此称为匿迹技术。因此建议 adapt，而非原样 retain。ESET 对 Sedreco 的出站文件与独立外传计时器、Machete 的十分钟数据发送、LightNeuron 的文件外传时窗代码以及 Carbon 的日志时窗与周期提供了不同层级的直接支持。
        en: >-
          ATT&CK Enterprise 19.1 anchors T1029 in exfiltrating data only at chosen times or intervals and lists both blending with ordinary activity and availability as possible purposes. Niji keeps transfer timing as the parent behavior but narrows formal scope to attacker-controlled time relationships intended to reduce recognition, correlation, or interruption; an ordinary automated transfer scheduled solely for reliability does not become a stealth technique. Adapt is therefore recommended rather than unmodified retention. ESET's outbound file and distinct exfiltration timer in Sedreco, ten-minute data transfers in Machete, file-exfiltration time-window code in LightNeuron, and Carbon's log window and period support different parts of this conclusion at explicitly different evidence levels.
proposed_content:
  summary:
    zh: 攻击者有意控制数据离开受害环境的周期或时窗，使外传事件与数据产生过程分离，或在正常活动背景中更难辨识。
    en: Adversaries deliberately control the cadence or time window in which data leaves a victim environment, separating egress from data production or making transfers less distinguishable amid routine activity.
  definition_and_concept:
    paragraphs:
      - zh: >-
          定时传输是攻击者在已经取得待外传数据或能够持续产出数据后，为实际出站传输设置重复间隔、绝对时刻或允许时窗，让数据只在所选时间离开受害环境。它在 Exfiltration 战术中改变的是外传发生的时间关系，而不是数据如何取得、打包、分块、选择目的地或使用何种协议；同一外传可以同时落入自动化外传或某个通道技术。
        en: >-
          Scheduled Transfer occurs when an adversary who has obtained data or can continuously produce it imposes a recurring interval, absolute time, or allowed window on actual outbound transfer, so the data leaves the victim environment only at selected times. Within Exfiltration it changes the temporal relation of egress, not how data is acquired, archived, divided, addressed, or carried by a protocol. The same transfer can also satisfy Automated Exfiltration or a channel-specific technique.
      - zh: >-
          “定时”的判定对象必须是数据出站，而非植入体的心跳、命令轮询、普通睡眠或计划任务启动。攻击者可以在程序内部维护计时器，也可以使用系统调度器；这些实现形式本身不决定分类。只有证明数据传输被时间门控，且该时间选择具有可论证的匿迹作用，才进入 Niji 正式技术。
        en: >-
          The scheduled object must be data egress, rather than an implant heartbeat, command polling, generic sleep, or the launch of a scheduled task. An adversary may keep a timer inside a program or use a platform scheduler, but those implementation forms do not define the category. Formal Niji scope requires evidence that data transfer is time gated and that the choice of time has a defensible stealth effect.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          周期性释放先把待传数据留在本地队列，使收集、整理和网络传输不再紧邻发生，并把多次产出折叠为较少的外部联系。按业务时窗释放则改变事件所在的背景流量密度，让单次出站更像日常办公或邮件操作。这两种时间控制分别增加跨阶段关联和正常/恶意区分的难度，但不能把“有固定间隔”本身解释成隐蔽；过于整齐的节律反而可能形成可检测指纹。
        en: >-
          Periodic release first retains outbound data in a local queue, separating collection or preparation from network transfer and folding multiple outputs into fewer external contacts. Release in a business window changes the ambient traffic against which an egress event is judged, making one transfer resemble routine office or mail activity more closely. These controls challenge cross-stage correlation and benign-versus-malicious classification respectively, but a fixed interval is not inherently covert: an overly regular cadence can itself become a detection fingerprint.
      - zh: >-
          残余痕迹包括队列文件或日志的增长与清空、配置中的周期或时窗、按源和目的地重复出现的出站连接、较高的原发字节数，以及窗口开始或结束附近的聚集。若防守方同时保存网络流量、进程身份、数据访问和授权作业基线，定时所造成的局部稀释可以被长窗关联恢复；若传输落在低流量夜间，时窗选择甚至会提高异常显著性。
        en: >-
          Residual traces include growth and draining of queued files or logs, configured intervals or windows, recurring outbound connections by source and destination, elevated originator-side bytes, and clusters near window boundaries. When defenders retain flows, initiating processes, data access, and authorized-job baselines together, long-horizon correlation can recover locally diluted signals. A window placed in quiet nighttime traffic may instead make an anomaly more conspicuous.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入条件是攻击者控制外传时机，且有数据实际出站或清晰的、可执行的外传门控逻辑，并能说明时间选择如何改变防守观察。只有 C2 重连间隔、命令请求、植入体休眠或计划任务触发而没有数据外传证据时，不作 T1029 正式映射；ATT&CK 页面中的多项软件实例只达到该较低证据层级。合法备份、邮件队列重试、软件更新、批处理和带宽管理会产生相似周期，必须由目的地、数据对象、发起主体、配置来源或未授权行为补充判定。
        en: >-
          Inclusion requires attacker control over egress timing and either observed data leaving or clear executable gating logic for exfiltration, together with an explanation of how the time choice changes defender observation. C2 reconnect intervals, command requests, implant sleep, or task triggers without evidence of data egress do not establish formal T1029 mapping; several software entries on the ATT&CK page reach only that lower evidence level. Backups, mail-queue retries, updates, batch processing, and bandwidth management can have similar cadence, so destination, data object, initiating principal, configuration provenance, or other unauthorized behavior must complete the judgment.
      - zh: >-
          与 T1030 的边界是控制量：T1029 控制“何时发送”和两次外传之间的距离，T1030 控制每次或单位时间的传输规模；一个配置可同时具备两者，但不能把速率限制自动视为定时匿迹。T1020 负责自动触发与处理，T1041、T1048 和 T1567 等负责通道或服务，T1074 和 T1560 负责暂存和归档。平台调度器中有恶意任务时还可映射计划执行，但这里的研究对象仍是外传时序而非任务对象的隐藏或执行权限。
        en: >-
          The boundary with T1030 is the controlled quantity: T1029 controls when transfer occurs and the distance between transfers, whereas T1030 controls per-transfer or per-period volume. One configuration can express both without making rate limiting automatically a timing stealth mechanism. T1020 addresses automation and processing; T1041, T1048, and T1567 address channel or service; T1074 and T1560 address staging and archiving. A malicious platform task can additionally map to scheduled execution, while this candidate still studies egress timing rather than concealment or authority of the task object.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在长期情报收集或持续记录敏感输出的入侵中，攻击者可以先把键盘日志、命令结果或选定文件放到本地待发区，再按周期送至外部控制端；Sedreco 的独立出站计时器和 Machete 的重复数据发送说明这种场景成立。若环境中的日常通信具有明显的工作时段，攻击者还可把自动文件外传约束到该时段；LightNeuron 的代码支持这种能力，但其自动外传功能未被研究者在野外确认使用，不能把该能力写成已观察到的 Turla 事件。
          en: >-
            In a long-running intelligence operation or sustained capture of sensitive output, an adversary can retain keystroke logs, command results, or selected files locally and send them to an external controller on a timer; Sedreco's separate outbound timer and Machete's recurrent data sends support that scenario. Where ordinary communication has a pronounced workday pattern, the adversary can also constrain automatic file exfiltration to that window. LightNeuron code supports this capability, but researchers did not observe the automatic exfiltration feature used in the wild, so it must not be presented as an observed Turla event.
        - zh: >-
            时窗选择也可能是为了目标服务器可用或避免受害者发现，不能仅凭“夜间”或“工作时间”推断匿迹。若目标业务夜间备份流量最密集，夜间窗口可能与正常背景相合；若夜间几乎无外传，则相同选择会使活动突出。正式归类依赖目标局部基线和攻击者控制证据，而非固定的时钟标签。
          en: >-
            Window selection may also reflect server availability or avoidance of user discovery, so neither “night” nor “working hours” alone proves stealth. If the target's backups dominate nighttime traffic, a night window may match that background; if little egress normally occurs at night, the same selection may stand out. Formal classification depends on the victim's local baseline and evidence of attacker control, not on a universal clock label.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要已经具备读取或生成待外传数据、写入队列或调用传输通道的能力，并能控制计时器、时区、允许时段或外传作业。周期积压需要容忍数据暂存和延迟；时窗对齐需要了解目标业务节律，且可能面临主机离线、时钟偏差、队列膨胀、传输失败或会话过期。攻击者不需要控制特定协议或操作系统调度器，但必须维持至少一个可用的出站路径。
            en: >-
              The adversary needs the ability to read or produce data for exfiltration, queue it or invoke an outbound channel, and control a timer, time zone, allowed period, or transfer job. Periodic queuing requires tolerance for local retention and delay; window alignment requires knowledge of the victim's business rhythm and may face offline hosts, clock drift, queue growth, transfer failure, or expired sessions. Control of a particular protocol or OS scheduler is unnecessary, but at least one egress path must remain usable.
      defender_model:
        paragraphs:
          - zh: >-
              假定防守方可以在统一时间轴上汇合网关或 Zeek 流记录、端点发起进程、可用的数据访问或待发队列痕迹，以及批准的自动传输清单。网络流记录可显示时间、源、目的地、持续时间和原发字节，端点连接事件可提供进程归属但不一定提供传输字节；因此不能用单一 DeviceNetworkEvents 记录声称具体外传量。业务时窗分析还需要按资产角色、星期与当地时区维护合法基线。
            en: >-
              The defender is assumed to join gateway or Zeek flow records, initiating endpoint processes, available data-access or outbound-queue traces, and an approved transfer inventory on one time line. Network flows can expose time, source, destination, duration, and originator bytes; endpoint network events can supply process attribution but do not necessarily supply transferred byte counts. A single DeviceNetworkEvents record therefore cannot establish a specific exfiltration volume. Business-window analysis also needs legitimate baselines by asset role, weekday, and local time zone.
          - zh: >-
              加密可阻断内容识别，NAT、代理和共享服务可能削弱主机到目的地的连接，短日志保留会截断跨周期分析。反之，有足够长的流量保留和稳定的设备、进程、目的地关联键时，周期性与窗口边缘聚集仍可观察；定时并不消除网络外传事实。
            en: >-
              Encryption can prevent content identification, and NAT, proxies, or shared services can weaken the source-to-destination join; short retention cuts across cycles. Conversely, sufficiently long flow retention and stable device, process, and destination keys still expose recurrence and clustering near window boundaries. Timing does not erase the fact of network egress.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary: {zh: 将数据产生与出站传输分离并减少局部外联, en: Separate data production from egress and reduce local network contacts}
      analysis:
        paragraphs:
          - zh: >-
              攻击者先让待传数据在本地队列积累，再按较长周期统一释放，使数据访问与网络出站落入不同告警窗口，并减少持续收集期间的网络接触次数。ESET 对 Sedreco 的分析明确记录了待发文件、通常十分钟的独立外传计时器与批量发送，并谨慎指出较少接触“可能”降低注意；这是有依据的匿迹可能性，不是对所有周期值的效果保证。队列变化、固定节律及每次原发字节仍然可见。
            en: >-
              The adversary lets outbound data accumulate locally and releases it on a period, putting data access and network egress in different alert windows and reducing network contacts during continuous collection. ESET directly documented Sedreco's outbound file, usually ten-minute independent exfiltration timer, and bulk sends, and cautiously stated that fewer contacts might attract less attention. This is a supported stealth possibility, not a guarantee for every interval. Queue changes, fixed cadence, and originator bytes per send remain observable.
      evidence_keys: [B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ATTACK]
      confidence: medium
    - mechanism_ref: NM-FD
      role: secondary
      summary: {zh: 让出站时刻贴合目标常态活动时段, en: Make egress timing conform to the victim's ordinary activity window}
      analysis:
        paragraphs:
          - zh: >-
              攻击者把自动文件外传限制在目标有大量正常通信的本地时段，使其时间特征与合法邮件或办公传输更相似，降低按异常时段区分单次外传的能力。LightNeuron 的 SEND_TIME 与 SEND_AT_NIGHT 代码证实文件发送可被工作/夜间时窗门控，Carbon 的配置也支持限定日志待发时段；但两份资料都没有测量实际规避率，且 LightNeuron 的该自动外传功能未获野外使用确认。因此效果按环境推断，必须用目标局部基线校准。
            en: >-
              The adversary restricts automatic file egress to a local period rich in legitimate communication, making its temporal features more similar to ordinary mail or office transfers and weakening classification from unusual hour alone. LightNeuron's SEND_TIME and SEND_AT_NIGHT code confirms that file sends can be gated by workday or night windows, and Carbon's configuration supports a restricted log-send period. Neither source measures detection evasion, however, and LightNeuron's automatic exfiltration was not confirmed in use in the wild. The effect is therefore an environment-dependent inference that requires the victim's local baseline.
      evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON, B10-T1029-REF-ATTACK]
      confidence: low
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            两项建议子技术分别以“数据产生后到释放的周期距离”和“释放时刻相对目标正常活动时窗的位置”为稳定变量。前者的主要痕迹是队列增长、较少而重复的外联及收集—传输时差；后者的主要痕迹是出站事件集中于受选时窗并与本地流量基线重叠。二者可共存，但检测前者需要跨周期事件关联，检测后者需要资产局部的时段基线。按 FTP、邮件、云服务或 Windows/Linux 划分都无法解释这种防守观察差异。
          en: >-
            The two proposed children use the distance from data production to timed release and the position of release against the victim's ordinary activity window as stable variables. The first leaves queue growth, fewer yet recurring external contacts, and a collection-to-egress delay; the second concentrates egress in a chosen window overlapping local traffic baseline. They can coexist, but detection of the first needs cross-cycle event correlation whereas detection of the second needs an asset-local time-of-week baseline. Dividing by FTP, mail, cloud service, or Windows versus Linux would not explain that difference in defender observation.
    coverage: established
    proposed_child_keys: [B10-T1029-CH-QUEUE, B10-T1029-CH-WINDOW]
proposed_subtechniques:
  - temporary_key: B10-T1029-CH-QUEUE
    name: {zh: 周期积压外传, en: Periodic Queued Exfiltration}
    stable_variable: collection_to_egress_release_interval
    trace_change: local_queue_accumulates_then_drains_in_recurrent_outbound_contacts
    defender_effect: collection_and_egress_separate_across_short_windows_but_long_horizon_recurrence_remains
    prerequisites: attacker_controls_a_data_queue_and_egress_timer
    evidence_keys: [B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ESET-MACHETE]
    confidence: medium
    proposed_content:
      summary:
        zh: 先积累待传数据，再按攻击者设定的周期集中外传，减少即时外联并拉开收集与网络出站的时间距离。
        en: Accumulate data for exfiltration and release it on an attacker-set period, reducing immediate contacts and separating collection from network egress.
      definition_and_concept:
        paragraphs:
          - zh: >-
              周期积压外传是攻击者让日志、命令结果或文件先进入待发状态，再由独立计时条件按周期取出并向外发送。其直接目的仍是把数据转移到受害环境之外；区别于普通自动化外传之处在于可配置的释放周期有意改变收集与外传的时间关系。周期可以短到十分钟，也可以更长，不以固定数值、工具或通道定义。
            en: >-
              Periodic Queued Exfiltration places logs, command results, or files into a pending state before a separate timer periodically releases them outward. Its direct purpose remains moving data out of the victim environment. It differs from ordinary automated exfiltration because a configurable release period deliberately changes the temporal relation between collection and transfer. The period may be ten minutes or much longer and is not defined by a fixed number, tool, or channel.
          - zh: >-
              这一子项要求可识别的积压—释放关系；单纯每十分钟探测 C2、保持心跳或因网络失败而重试都不够。单次外传大小不受本子项定义，若还人为控制传输字节或速率，可与 T1030 对应技术并列标注。
            en: >-
              This child requires an identifiable queue-and-release relation. Merely probing C2 every ten minutes, keeping a heartbeat, or retrying after network failure is insufficient. The size of each release does not define this child; deliberate control of bytes or rate can additionally map to the T1030-derived technique.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              周期积压外传把连续产生的敏感输出转成较少的出站事件，使只覆盖数据读取后短时间的检测逻辑难以连接外部连接。Sedreco 的出站文件、独立外传计时器和批量发送直接展示了这一时间错位；ESET 仅将“更少联系可能降低注意”表述为可能性，因此不能把积压视为必然成功的规避。周期规律、队列清空和单次较大的上传量反而给长窗口检测提供了线索。
            en: >-
              Periodic Queued Exfiltration converts a continuing stream of sensitive output into fewer egress events, frustrating a detector that only relates network connections to the immediately preceding data read. Sedreco's outbound file, separate exfiltration timer, and bulk send directly show this displacement in time. ESET states only that fewer contacts might reduce attention, so queuing cannot be treated as assured evasion. Regular recurrence, queue draining, and potentially larger uploads instead give long-window detection usable signals.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              本子项纳入攻击者控制周期并把已产生数据从待发状态释放到外部目的地的行为，不要求系统级计划任务。排除仅有 C2 轮询、内部日志轮转而没有出站、失败重试与正常遥测批处理。检测到队列文件并不独立证明其恶意属性，必须结合文件内容或来源、出站目的地、非授权进程与重复释放关系。若只是限制每包大小或每秒带宽，归 T1030 的规模轴；若仅是自动触发上传，归 T1020 的自动化轴。
            en: >-
              This child includes attacker-controlled periodic release of already produced data from a pending state to an external destination and does not require an OS task. It excludes C2 polling alone, internal log rotation without egress, failure retry, and routine telemetry batching. A queue file alone does not prove malice; its content or provenance, outbound destination, unauthorized process, and recurring releases must be assessed together. Per-packet or per-second volume caps belong to T1030's size axis, and automatic upload without a timing variable belongs to T1020's automation axis.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                在持久驻留的主机上，收集模块持续写入键盘记录、命令结果或选定文档，通信模块仅到周期点才读取待发区并向 C2 或另一个外部接收端发送。Sedreco 是具有明确队列与发送计时器的实现例；Machete 证实真实被窃数据可以以十分钟节律送往 C2，但单独的 Machete 报告不足以证明其使用与 Sedreco 相同的队列结构。
              en: >-
                On a persistently compromised host, a collection component keeps writing keystrokes, command output, or selected documents, while the communication component reads the pending area and sends to C2 or another outside recipient only at release times. Sedreco is an implementation with an explicit queue and send timer. Machete confirms stolen data can be sent to C2 on a ten-minute rhythm, but its report alone does not establish the same queue structure as Sedreco.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要可写且可恢复的待发区、能够设定独立外传计时器的程序或服务，以及持续可用的外部路径。积压使其承担磁盘、内存、崩溃后恢复、清理与被扣押的风险；较长周期增加数据丢失和任务失败的代价，过短周期则无法明显降低外联密度。
                en: >-
                  The adversary needs a writable recoverable pending area, code or service able to set a distinct exfiltration timer, and a continuing outside path. Queuing adds disk or memory, crash recovery, cleanup, and seizure risk. A longer period increases loss and task-failure costs, while too short a period may not meaningfully lower contact density.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方能用时间戳、源/目的地、原发字节和连接持续时间形成长窗口流量序列，并在端点侧关联进程、文件创建或修改、访问敏感数据与队列清空。若只有短期网络摘要而没有进程或文件线索，可以发现重复周期却难以把它归为数据外传；若只有端点日志而没有网络字节，也不能判断外送规模。
                en: >-
                  Defenders can build long-window flow series from timestamps, source and destination, originator bytes, and duration, then correlate initiating process, file creation or modification, sensitive-data access, and queue draining at the endpoint. Short-lived network summaries without process or file evidence may reveal recurrence but cannot reliably classify it as exfiltration; endpoint events without network byte counts cannot establish transferred volume.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary: {zh: 待发积压拉开收集与外传并缩减外联频次, en: Queueing separates collection from egress and reduces contact frequency}
          analysis:
            paragraphs:
              - zh: >-
                  攻击者把敏感输出写入本地待发文件，等待周期计时器触发后再集中外送；防守方在单个短窗口内只看到孤立的数据访问或孤立的网络连接，必须跨窗口连接两者。Sedreco 的网络线程定期读取待发文件并批量传输，证明行为链存在；其十分钟节律也说明时间稀释不是无限的，保留足够长的时序仍可重构。
                en: >-
                  The adversary writes sensitive output to a local pending file and waits for a period timer before releasing it outward. A defender using one short window sees isolated data access or an isolated network connection and must join them across windows. Sedreco's network threads periodically read and send the outbound file in bulk, establishing the chain; its ten-minute rhythm also shows dilution is finite and can be reconstructed from sufficiently retained sequences.
          evidence_keys: [B10-T1029-REF-ESET-SEDNIT]
          confidence: medium
      defense_targets: [B10-T1029-DET-TEMPORAL, B10-T1029-MIT-EGRESS]
      research_limitations:
        paragraphs:
          - zh: >-
              Sedreco 的详细队列证据来自逆向分析，不能代表所有周期外传实现；Machete 仅独立证明定期发送被窃数据，而非相同的积压机理。未看到队列、数据对象或出站字节时，应把重复连接保留为“周期通信”线索，不可直接宣称外传。较大的批次也可能更易触发上传量阈值。
            en: >-
              Sedreco's detailed queue evidence comes from reverse engineering and cannot represent every periodic exfiltration implementation. Machete independently confirms recurrent sends of stolen data, not the same queuing mechanism. Without a queue, data object, or outbound byte evidence, recurring connections remain a periodic-communication lead rather than proof of exfiltration. Larger releases may also be easier to catch with upload-volume thresholds.
  - temporary_key: B10-T1029-CH-WINDOW
    name: {zh: 业务时窗对齐外传, en: Business-Window-Aligned Exfiltration}
    stable_variable: egress_time_relative_to_victim_activity_window
    trace_change: outbound_file_transfer_occurs_inside_attacker_selected_local_business_window
    defender_effect: temporal_feature_overlaps_legitimate_traffic_but_window_boundary_and_asset_role_remain_testable
    prerequisites: attacker_knows_local_time_and_can_gate_actual_file_egress
    evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON, B10-T1029-REF-ATTACK]
    confidence: low
    proposed_content:
      summary:
        zh: 将实际外传门控在目标正常业务通信密集的本地时段，降低按异常时刻识别单次传输的能力。
        en: Gate actual exfiltration to a victim-local period rich in ordinary business communication, weakening detection based on an unusual transfer time alone.
      definition_and_concept:
        paragraphs:
          - zh: >-
              业务时窗对齐外传是攻击者先选择与目标正常通信节律相符的本地时段，再使文件或日志外传只在该时段执行。它的直接目的仍是外送数据，独立变量是出站时刻相对业务活动的相位，而不是发送周期、传输大小、邮件或 Web 协议。ESET 所分析的 LightNeuron 代码允许在工作时段或夜间门控自动文件外传，但正式本子项只覆盖有根据地与目标正常业务活动相合的选择。
            en: >-
              Business-Window-Aligned Exfiltration selects a local period consistent with the victim's ordinary communication rhythm and permits file or log egress only within that period. Its direct purpose is still to send data out; the independent variable is the phase of egress relative to business activity, not period length, transfer size, mail, or web protocol. ESET's LightNeuron code can gate automatic file transfer to workday or night, but this formal child covers only a choice shown to fit the victim's normal activity.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              出站连接的时刻与办公、邮件或业务同步的高背景量重叠，单次流量不再因为发生在冷清时段而显著；这种特征伪装只改变时间维度，并不能隐藏未授权目的地、异常附件、敏感源文件或不合常态的发起进程。实际外传可能在时窗边缘聚集，或随着节假日和时区变化出现与合法业务不同的节律。若夜间才是低流量时段，夜间传输不应自动归入本子项。
            en: >-
              Egress coincides with high background volume from office, mail, or business synchronization, so one flow no longer stands out solely by occurring at a quiet hour. This feature disguise affects only the time dimension and cannot hide an unauthorized destination, unusual attachment, sensitive source file, or atypical initiating process. Egress may cluster at window edges or diverge from legitimate work on holidays and time-zone changes. If nighttime is the quiet period, night transfer is not automatically part of this child.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入时必须有外传行为或可执行的外传时窗代码、攻击者对该窗口的控制，以及目标业务背景使时窗具有可解释的匿迹意义。单纯工作时间 C2 心跳、值班便利、服务可用性、运维计划和邮件队列自然延迟不满足条件。若只是执行程序被计划任务唤醒而数据仍可随时发送，时窗变量不成立；若分批控制了字节量，另按 T1030 的规模轴判断。
            en: >-
              Inclusion needs outbound data behavior or executable window-gating code, attacker control of that window, and a victim business background that gives the window a defensible stealth meaning. Workday C2 heartbeats, operator convenience, service availability, maintenance plans, and natural mail-queue delays do not qualify. A scheduled task that wakes a program while data can still leave at any time does not establish this variable; control of batch bytes is assessed separately under T1030.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                当被侵入的是邮件服务器或办公主机，攻击者可让自动文件外传在目标使用者和合法应用大量发送邮件或 Web 请求的时段进行。LightNeuron 的配置可选择工作时间并发送匹配文件作为附件，Carbon 的日志线程默认只在本地 8–20 时段且按周期排队待发。两者证明技术能力和相位控制；不能从这些源码描述推导出所有部署都选择了与受害者业务完全吻合的窗口。
              en: >-
                On a compromised mail server or office host, an adversary can send selected files while users and legitimate applications generate abundant mail or web traffic. LightNeuron configuration can choose work hours and send matching files as attachments, while Carbon's log thread defaults to a local 08:00–20:00 gate and periodic queuing. Both establish technical capability and phase control; neither code description proves every deployment selected a window perfectly matched to the victim's business activity.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要知道或估计目标本地时区、工作日与正常出站高峰，且能配置实际传输而非仅控制植入体睡眠。工作时窗限制会推迟数据到达，遇到节假日、主机离线或大量待发文件时还可能在恢复传输的首个窗口形成异常突发；伪装程度依赖目标业务真实节律。
                en: >-
                  The adversary needs to know or estimate the victim's local time zone, workdays, and outbound peaks and must configure actual transfer rather than just implant sleep. A work-window gate delays receipt of data and can create an unusual burst at the first resumed window after holidays, offline periods, or large queue growth. Its camouflage depends on the victim's real business rhythm.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方需要以主机角色、用户、星期、当地时间及已批准传输作业构建分层基线，并用网络流量与端点发起进程连接外传事件。仅比较“办公时间内/外”会遗漏此子项，也会把合法夜间备份误报；可识别的残余包括新目的地、没有授权作业的持续发送、敏感文件读取，以及时窗开始时异常积压释放。
                en: >-
                  Defenders need baselines stratified by host role, user, weekday, local time, and approved transfer jobs and must join network flows to initiating endpoint processes. An in-hours versus out-of-hours rule alone misses this child and can flag legitimate overnight backups. Residuals include new destinations, sustained sends with no approved job, sensitive file reads, and unusual release of a backlog at the beginning of a window.
      stealth_mechanisms:
        - mechanism_ref: NM-FD
          role: primary
          summary: {zh: 出站时刻借用目标正常业务流量背景, en: Egress timing borrows the victim's ordinary business-traffic background}
          analysis:
            paragraphs:
              - zh: >-
                  攻击者以本地活动时窗作为数据发送门控，改变出站事件的时间特征而不改变其外部目的地和原发字节，使基于低背景时段的单事件异常判断失灵。LightNeuron 的文件发送代码和 Carbon 的受限日志时段证实门控可实施，ATT&CK 说明混入正常活动是这种父行为的可能目的；现有资料未测量具体规避效果，故必须以目标局部基线而非一般“工作时间较安全”的假设论证。
                en: >-
                  The adversary gates data sends on a local activity window, changing the temporal feature of egress without changing its external destination or originator bytes and undermining a one-event anomaly rule based on quiet hours. LightNeuron file-send code and Carbon's restricted log period show the gate is implementable, while ATT&CK identifies blending with normal activity as a possible purpose of the parent behavior. These sources do not measure a particular evasion outcome, so the effect must be argued from the victim's local baseline rather than a blanket assumption that work hours are safer.
          evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON, B10-T1029-REF-ATTACK]
          confidence: low
      defense_targets: [B10-T1029-DET-TEMPORAL, B10-T1029-MIT-EGRESS]
      research_limitations:
        paragraphs:
          - zh: >-
              LightNeuron 白皮书明确说研究者未观察到自动外传功能在野外使用，因而只能以它证明代码能力，不能创建该功能的野外案例。Carbon 的工作时段限制作用于日志轮转与待发，其他数据仍可另行发送；两者均未证明具体受害者的办公基线或检测规避率。本子项可以作为较低置信度的机制分类，但具体案例要等额外观察证据。
            en: >-
              The LightNeuron paper explicitly says researchers did not see automatic exfiltration used in the wild, so it establishes code capability only and cannot support a wild-use case for that feature. Carbon's work-hour restriction governs log rotation and queuing while other data may be sent separately; neither source establishes a particular victim's office baseline or a measured evasion rate. The child can be a lower-confidence mechanism category, but a specific case awaits additional observation.
