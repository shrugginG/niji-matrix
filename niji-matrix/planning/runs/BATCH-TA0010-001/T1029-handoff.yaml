  detection_strategies:
    - key: B10-T1029-DET-TEMPORAL
      name: {zh: 外传节律与业务时窗关联, en: Exfiltration Cadence and Business-Window Correlation}
      objective:
        zh: 在源、目的地、进程和授权作业维度连接重复出站与局部时段背景，以识别周期积压或业务时窗对齐的未授权外传。
        en: Join recurring egress and local time-window context by source, destination, process, and approved job to identify unauthorized queued or business-window-aligned exfiltration.
      detects_keys: [B10-T1029-PARENT, B10-T1029-CH-QUEUE, B10-T1029-CH-WINDOW]
      analytic_keys: [B10-T1029-NJA-CADENCE, B10-T1029-NJA-WINDOW]
      domains: [enterprise]
      evidence_keys: [B10-T1029-REF-ATTACK-DET, B10-T1029-REF-ZEEK, B10-T1029-REF-MDE-NETWORK]
  detection_analytics:
    - key: B10-T1029-NJA-CADENCE
      name: {zh: 待发—周期出站长窗关联, en: Queued-to-Periodic Egress Long-Window Correlation}
      strategy_key: B10-T1029-DET-TEMPORAL
      platforms: [Windows, Linux, macOS]
      logic:
        zh: >-
          在滚动 14–30 日内按源主机、外部目的地及可得的发起进程聚合出站流，计算有明显原发字节的上传事件间隔、周期稳定性、工作日模式和每次发送前的本地待发文件增长。优先报告至少三个相似周期及同一未批准目的地、同一可疑进程或敏感数据访问之一共同出现的序列；把“仅小字节心跳”保留为 C2 节律线索。若可见待发队列，检验先增长后上传及上传后收缩，不以固定的十分钟或固定字节阈值定义恶意。
        en: >-
          Over a rolling 14–30 days, group outbound flows by source host, external destination, and initiating process where available. Compute intervals, periodic stability, workday pattern, and local pending-file growth before upload events with meaningful originator bytes. Prioritize sequences with at least three comparable cycles plus one of an unapproved destination, suspicious process, or sensitive-data access; retain tiny-byte heartbeats as C2 cadence leads only. Where a pending queue is visible, test growth before upload and contraction afterward. Neither a ten-minute interval nor a fixed byte threshold defines malice.
      data_requirements:
        - source_type: network_flow
          name: {zh: Zeek 连接流日志, en: Zeek connection flow log}
          channel: conn.log
          required_fields: [ts, id.orig_h, id.resp_h, id.resp_p, duration, orig_bytes, resp_bytes]
        - source_type: endpoint_network_event
          name: {zh: 发起进程网络事件, en: Initiating-process network event}
          channel: Microsoft Defender XDR DeviceNetworkEvents
          required_fields: [Timestamp, DeviceId, RemoteIP, InitiatingProcessUniqueId, InitiatingProcessFileName]
      observables: [outbound_orig_bytes, recurrent_source_destination_interval, initiating_process, pending_file_growth_optional, sensitive_file_access_optional, approved_transfer_job_match]
      correlation: {window: 30d, dimensions: [source_device, destination, initiating_process, local_time_zone, approved_job_id]}
      false_positives:
        - {zh: 备份或复制工具按小时上传到外部存储, en: Backup or replication tools uploading to external storage hourly}
        - {zh: 软件遥测与运维日志周期批量发送, en: Software telemetry and operations logs sent in periodic batches}
        - {zh: 邮件队列与云同步在等待后成批排空, en: Mail queues or cloud sync draining batches after a wait}
      blind_spots:
        - {zh: NAT 或共享代理无法稳定回连到源进程, en: NAT or shared proxy cannot be reliably mapped back to a source process}
        - {zh: 加密与无文件遥测无法确认上传内容或本地队列, en: Encryption and missing file telemetry prevent confirmation of content or a local queue}
        - {zh: 观察期不足三个周期或攻击者改变间隔, en: Fewer than three observed cycles or adversary-changed intervals}
      tuning_guidance:
        zh: 按主机角色和已批准传输作业建立目的地、时段、进程及字节分布基线；允许列入白名单的作业继续接受异常新目的地或新数据源检查，不把整类备份进程完全排除。
        en: Baseline destinations, hours, processes, and byte distributions by host role and approved transfer job; even allowlisted jobs remain subject to new-destination and new-data-source checks rather than excluding all backup processes.
      evidence_keys: [B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ESET-MACHETE, B10-T1029-REF-ATTACK-DET, B10-T1029-REF-ZEEK, B10-T1029-REF-MDE-NETWORK]
    - key: B10-T1029-NJA-WINDOW
      name: {zh: 业务时段中的未授权外传相位差分, en: Unauthorized Egress Phase Differential Within Business Hours}
      strategy_key: B10-T1029-DET-TEMPORAL
      platforms: [Windows, Linux, macOS]
      logic:
        zh: >-
          先按主机角色、当地时区、星期和假日建立合法外传的时段、目的地与进程基线，再在滚动 30 日内识别特定源—目的地仅在高背景业务时窗持续上传的序列。只有时窗一致性与新或未批准目的地、未授权进程、敏感文件读取、窗口开始处待发积压释放中的至少一项同现时提升告警；否则仅记录相位事实。对夜间窗口使用该资产自身的高背景时段而非默认“夜间更隐蔽”。
        en: >-
          Build legitimate egress baselines by host role, local time zone, weekday, holiday, destination, and process, then identify source-to-destination sequences that keep uploading only inside the asset's high-background business window over 30 days. Elevate only when window conformity co-occurs with at least one new or unapproved destination, unauthorized process, sensitive-file read, or pending-queue release at window start; otherwise record timing as context. For night windows, use the asset's own high-background period rather than assuming night is covert.
      data_requirements:
        - source_type: network_flow
          name: {zh: Zeek 连接流日志, en: Zeek connection flow log}
          channel: conn.log
          required_fields: [ts, id.orig_h, id.resp_h, id.resp_p, orig_bytes]
        - source_type: asset_context
          name: {zh: 资产时区、角色与批准外传作业清单, en: Asset time zone, role, and approved transfer-job inventory}
          channel: null
          required_fields: [asset_id, time_zone, business_calendar, approved_destination, approved_process]
      observables: [local_hour_of_week, outbound_orig_bytes, source_destination_phase, destination_novelty, window_edge_cluster, approved_job_match]
      correlation: {window: 30d, dimensions: [asset_id, destination, process_if_available, local_hour_of_week, approved_job_id]}
      false_positives:
        - {zh: 真实工作时间运行的业务批处理、报表和邮件投递, en: Legitimate workday batch jobs, reporting, and mail delivery}
        - {zh: 时区、节假日或轮班变动使原有作业的相位改变, en: Time-zone, holiday, or shift changes moving an approved job's phase}
      blind_spots:
        - {zh: 受害资产基线不足或时区归属错误, en: Insufficient victim-asset baseline or incorrect time-zone assignment}
        - {zh: 共享服务把多租户上传汇合且看不到单个文件, en: Shared service aggregates multi-tenant uploads without per-file visibility}
        - {zh: 仅一两次外传不足以判断稳定时窗选择, en: One or two transfers cannot establish a stable selected window}
      tuning_guidance:
        zh: 基线按设备角色分层并保留工作日、假日和轮班例外；将业务时窗看作降低时刻异常度的上下文，始终结合目的地、主体或文件来源，避免仅按办公时间触发或抑制告警。
        en: Stratify baselines by device role and retain weekday, holiday, and shift exceptions. Treat business-window timing as context that reduces time-only anomaly, always combining destination, principal, or file provenance rather than alerting or suppressing solely by office hours.
      evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON, B10-T1029-REF-ZEEK, B10-T1029-REF-NIST-53]
  mitigations:
    - key: B10-T1029-MIT-EGRESS
      name: {zh: 受管外传路径与作业授权, en: Managed Egress Paths and Transfer-Job Authorization}
      description:
        zh: 通过受管出口对允许外送数据的主体、目的地和作业建立可审计的授权，使攻击者无法仅凭改变外传时刻获得合法传输通路。
        en: Establish auditable authorization for principals, destinations, and jobs permitted to send data through managed egress, so changing transfer time alone cannot confer a legitimate path.
      measures:
        - key: managed_egress
          control_type: preventive
          name: {zh: 默认拒绝与例外批准的受管出口, en: Default-deny managed egress with approved exceptions}
          description:
            zh: 对敏感网段、服务器和高价值工作站经代理或边界设备实施按主体、目的地和协议批准的出站规则，并记录所有拒绝及例外。
            en: Enforce principal-, destination-, and protocol-approved outbound rules through proxies or boundary devices for sensitive segments, servers, and high-value workstations, retaining denials and exceptions.
        - key: transfer_inventory
          control_type: governance
          name: {zh: 授权自动传输作业登记, en: Approved automated-transfer job inventory}
          description:
            zh: 登记合法批处理的所有者、源数据、目标、运行主体、周期、当地时窗和变更审批，复核长期未使用及突变的作业。
            en: Register owner, source data, destination, runtime principal, cadence, local window, and change approval for legitimate batch transfers; review dormant and abruptly changed jobs.
        - key: hold_unapproved_release
          control_type: containment
          name: {zh: 未授权周期外传的出站暂停, en: Hold unauthorized recurrent egress}
          description:
            zh: 对已确认的未授权目的地或作业撤销出站例外并保留流量、端点与队列证据，避免在下一释放周期继续外送。
            en: Revoke egress exceptions for confirmed unauthorized destinations or jobs and preserve flow, endpoint, and queue evidence before the next release cycle.
      applications:
        - target_key: B10-T1029-PARENT
          use: {zh: 将所有已批准的自动外传限定到受管出口，并使时间表成为可审核的授权属性。, en: Route approved automated egress through managed interfaces and make schedule an auditable authorization attribute.}
          expected_effect: {zh: 改变时刻不再足以绕过目的地和主体约束，未授权周期传输可在首次或后续放行前受阻。, en: A timing change no longer bypasses destination and principal controls, and unauthorized periodic sends can be blocked before first or later release.}
          limitations: {zh: 已批准的接收端、被盗作业身份和加密内容仍可能被滥用，时间表自身不能证明合法。, en: An approved recipient, stolen job identity, or encrypted content can still be abused; schedule alone does not prove legitimacy.}
        - target_key: B10-T1029-CH-QUEUE
          use: {zh: 将周期性批量出站与登记的源数据、目标和进程对照，对不匹配者暂停下一释放周期并保全待发区。, en: Compare recurrent batch egress with registered source data, destination, and process; hold the next release for mismatches and preserve the pending area.}
          expected_effect: {zh: 缩短攻击者在多个周期内持续外传的机会，并把队列—外联关系保留下来供调查。, en: Shorten the opportunity for continued exfiltration across cycles and preserve the queue-to-egress relation for investigation.}
          limitations: {zh: 首次外传可能已经完成，授权备份工具或代理的劫持需要文件级与身份级复核。, en: The first transfer may already have completed; abuse of an approved backup tool or proxy needs file- and identity-level review.}
        - target_key: B10-T1029-CH-WINDOW
          use: {zh: 对业务时窗中的外传仍要求同一主体、目标和源数据授权，不因落在办公时间而放宽策略。, en: Require the same principal, destination, and source-data authorization inside business hours instead of relaxing policy during the workday.}
          expected_effect: {zh: 消除通过时段合形直接获得出口放行的机会，使窗口内异常目标与作业变更仍可审计。, en: Remove the chance to gain egress permission merely by matching office hours and keep destination and job changes inside the window auditable.}
          limitations: {zh: 若攻击者借用合法邮件帐号和批准的外部接收端，出口规则可能看不到附件语义。, en: If an attacker borrows a legitimate mail account and approved outside recipient, boundary rules may lack attachment semantics.}
      evidence_keys: [B10-T1029-REF-NIST-53, B10-T1029-REF-ATTACK]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: collection_to_egress_release_interval
        resolution: formal_candidate
        supporting_keys: [B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ESET-MACHETE]
      - axis: relation_to_victim_business_window
        resolution: formal_candidate_low_confidence
        supporting_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON]
      - axis: randomized_jitter_of_beacon_or_c2_poll
        resolution: adjacent_command_and_control
        reason: C2 rhythm without actual data exfiltration is insufficient for this Exfiltration parent.
      - axis: nighttime_only_transfer
        resolution: deferred
        reason: Night is not a stable stealth variable without evidence that the victim has matching high-background traffic or a measurable defender-observation effect.
      - axis: per_interval_bytes_or_bandwidth
        resolution: adjacent_T1030
        reason: The controlled quantity is volume or rate, not release timing, even if one tool has a time-of-day rate table.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 19.1 无 T1029 子项，仍从周期距离、活动时窗、夜间选择、C2 jitter 与速率时间表五个轴开放搜索；仅前两项具有可辩护的外传行为和观察差异，正式低置信度时窗项仍需主 Agent 复核。
      en: ATT&CK 19.1 has no T1029 children; the review nevertheless searched cadence distance, activity window, nighttime selection, C2 jitter, and rate timetable. Only the first two have defensible data-egress behavior and observation differences; the lower-confidence window child still needs primary-agent review.
  evidence_coverage:
    parent_behavior_keys: [B10-T1029-REF-ATTACK, B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ESET-MACHETE]
    boundary_keys: [B10-T1029-REF-ATTACK, B10-T1029-REF-ESET-LIGHTNEURON]
    mechanism_support:
      - {mechanism_ref: NM-ST, evidence_keys: [B10-T1029-REF-ESET-SEDNIT], strength: direct_behavior_and_cautious_stealth_effect}
      - {mechanism_ref: NM-FD, evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON, B10-T1029-REF-ATTACK], strength: direct_gating_capability_environment_dependent_effect}
    child_existence_support:
      - {child_key: B10-T1029-CH-QUEUE, evidence_keys: [B10-T1029-REF-ESET-SEDNIT, B10-T1029-REF-ESET-MACHETE], strength: direct_actual_exfiltration}
      - {child_key: B10-T1029-CH-WINDOW, evidence_keys: [B10-T1029-REF-ESET-LIGHTNEURON, B10-T1029-REF-ESET-CARBON], strength: coded_capability_and_log_gate_not_confirmed_effect}
    unsupported_or_deferred:
      - LightNeuron automatic scheduled file exfiltration was not seen in wild by ESET; no LightNeuron wild-use CASE may be created for it.
      - Most ATT&CK T1029 procedure entries describe C2 polling or sleep, not data egress; do not upgrade them to exfiltration cases.
      - No source measures detection-rate reduction from business-hour alignment; NM-FD effect remains low-confidence and victim-baseline dependent.
  source_strength_audit:
    actual_exfiltration_observed_or_code_traced:
      - {source: ESET Sedreco, conclusion: outbound_file_and_periodic_bulk_send, level: direct_reverse_engineering}
      - {source: ESET Machete, conclusion: stolen_data_sent_every_ten_minutes, level: observed_campaign_report}
      - {source: ESET Carbon, conclusion: log_queue_period_and_local_hour_gate_plus_POST_sender, level: direct_reverse_engineering}
    capability_not_observed_wild_use:
      - {source: ESET LightNeuron, conclusion: SEND_TIME_and_SEND_AT_NIGHT_gate_file_email_exfiltration, level: reverse_engineered_capability_only}
    c2_only_examples_not_sufficient:
      - Chrommme
      - Cobalt Strike Beacon
      - ComRAT business-hour sleep
      - Dipsind working-hour communications
      - Flagpro
      - Higaisa identifier beacon
      - jRAT
      - Kazuar
      - Linfo
      - Ninja agent timeframe
      - POWERSTATS
      - Shark
      - ShimRat
      - TinyTurla
    ambiguous_without_primary_confirmation:
      - ShadowPad data-to-C2 every eight hours may include data exfiltration, but this research did not verify original data semantics; do not rely on it.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项及两项子项均给出定义、匿迹特性、纳入与排除、场景、分开的攻防模型、因果机理、证据层级和具体限制；主 Agent 应继续审查低置信度时窗项是否足以正式化。
      en: The parent and both proposed children cover definition, stealth characteristics, inclusion and exclusions, scenario, separate attacker and defender models, causal mechanism, evidence level, and specific limitations; the primary agent should still review whether the low-confidence window child merits formalization.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, local syntax validation]
  limitations:
    paragraphs:
      - zh: >-
          固定 ATT&CK 页面把若干 C2 睡眠或轮询也列作 T1029 实例，不能把所有条目当成已确认外传。Sedreco 与 Machete 支持实际周期外传；LightNeuron 的自动文件发送只证明代码能力且明确未见野外使用；Carbon 的时窗先作用于日志待发，不能推及所有文件。现有来源都没有给出定时外传相对未定时外传的量化漏检差异，正式内容应将匿迹效果限制为有条件的防守观察推断。
        en: >-
          The fixed ATT&CK page lists several C2 sleep or polling behaviors under T1029, so not every entry is confirmed exfiltration. Sedreco and Machete support actual periodic exfiltration; LightNeuron automatic file sends establish code capability only and were explicitly not observed in wild use; Carbon's window first governs log queuing and cannot be extended to every file. None of these sources quantifies missed detection against unscheduled exfiltration, so formal stealth effect must remain a conditional inference about defender observation.
      - zh: >-
          周期流量在合法备份、邮件队列、云同步和软件遥测中常见。网络原发字节只能说明数据向外发送的规模，不能证明其中包含敏感信息；端点网络事件通常可补足进程而不能独立提供体积。若不能连接未授权主体或目的地、待发数据来源与重复释放关系，调查结论应停留在“值得核查的周期出站”，不能升级为已确认数据渗出。业务时窗子项尤其依赖受害资产本地基线和时区准确性。
        en: >-
          Recurring traffic is common in backups, mail queues, cloud synchronization, and software telemetry. Originator bytes measure outbound data, not whether it is sensitive; endpoint network events can add process attribution but usually cannot independently establish volume. Without an unauthorized principal or destination, pending-data provenance, and repeated release relation, a finding remains recurrent egress requiring investigation rather than confirmed exfiltration. The business-window child especially depends on the victim asset's local baseline and correct time zone.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Compression, encryption, or PDF/JPG attachment packaging in the cited malware is separate data obscuration and is not caused by transfer timing.}
    - {mechanism_ref: NM-BT, reason: Using an existing C2 or mail channel may make behavior ordinary-looking, but the channel choice is not the T1029 timing variable.}
  open_questions:
    - Should the lower-confidence business-window child remain formal review, or be deferred pending observed victim-local baseline evidence? Parent behavior remains supported either way.
    - Cross-batch deduplication with T1030 should compare egress authorization mitigation identity but keep time and volume analytics separate.
