        en: ESET observed Machete activity against Latin American government and military environments and documented stolen data sent to C2 every ten minutes. This establishes actual scheduled exfiltration, not why the attackers chose ten minutes or whether a queue was used.
      evidence_keys: [B10-T1029-REF-ESET-MACHETE]
