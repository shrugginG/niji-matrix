      - {axis: short-window sent volume, resolution: formal-child-proposed, key: B10-T1030-CHILD-RATE}
      - {axis: clock schedule, resolution: adjacent-technique, owner: T1029}
      - {axis: transport or cloud service, resolution: adjacent-technique, owner: T1041/T1048/T1567}
      - {axis: protocol-required fragmentation, resolution: not-stealth-distinct}
      - {axis: pre-transfer compression or encryption, resolution: adjacent-technique, owner: NJT-0133}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: ATT&CK 19.1 无子项，仍独立检验了单元大小与时间窗体积两条轴；二者具有不同的检测数据与误报条件，并未按 ATT&CK 子项或工具划分。
      en: ATT&CK 19.1 has no children, yet unit size and time-window volume were tested independently; they require distinct detection data and have distinct false positives, without importing ATT&CK children or dividing by tool.
  evidence_coverage:
    parent_behavior_keys: [B10-T1030-REF-ATTACK, B10-T1030-REF-DFIR, B10-T1030-REF-STEALBIT]
    boundary_keys: [B10-T1030-REF-RCLONE, B10-T1030-REF-ESET, B10-T1030-REF-ZEEK-HTTP, B10-T1030-REF-ZEEK-CONN]
    mechanism_support: [B10-T1030-REF-STEALBIT, B10-T1030-REF-ESET, B10-T1030-REF-PLAY]
    child_existence_support: [B10-T1030-REF-ESET, B10-T1030-REF-PLAY, B10-T1030-REF-STEALBIT, B10-T1030-REF-DFIR]
    unsupported_or_deferred:
      - APT41 fixed-size exfiltration attribution is not confirmed by the cited Group-IB original, which discusses ingress payload writes rather than data exfiltration.
      - LuminousMoth 5 MB bypass may concern service compatibility, not defender evasion.
      - Neither Play nor LunarWeb source proves a specific alert threshold was bypassed.
      - A final Zeek conn.log cannot measure within-connection 15-second throughput without periodic counters.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项与两个子项分别覆盖定义、痕迹、残余观察、范围、场景及攻防条件；需要主 Agent 对照兄弟 T1029 定稿，交接不是正式审定稿。
      en: The parent and two children each cover definition, traces, residual observation, scope, scenario, and attacker/defender conditions; the primary agent must converge against sibling T1029 before canonical authoring.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization and parse check only]
  limitations:
    paragraphs:
      - zh: >-
          T1030 固定版提供父行为和可能的阈值规避机理，而多份原始案例只能证明切块或限速的发生，不能证明当地检测规则实际漏报。StealBit 的作者级逆向对速率规避意图最明确，DFIR 的 Rclone 事件则对真实使用最明确；因此速率子项的设计因果强于具体攻击效果，切块子项保持中等置信度。
        en: >-
          Fixed-version T1030 anchors parent behavior and a possible threshold-evasion mechanism, while several primary incidents establish chunking or rate capping without proving a local rule missed an alert. StealBit reverse engineering is clearest about rate-evasion design and the DFIR case about real use; the rate child's design causality is stronger than proof of operational effect, and the chunk child remains medium-confidence.
      - zh: >-
          APT41 的 ATT&CK 条目与其 Group-IB 引文存在可核对的语义差距，后者描述向受害主机分段写入 Beacon 载荷而非外传。分块检测若依赖对象边界需能见 HTTP 或服务审计，速率检测若依赖短桶需周期字节字段；任一前提不满足时应降低覆盖声称，不用连接数量或 DeviceNetworkEvents 单独替代字节证据。
        en: >-
          ATT&CK's APT41 example has a verifiable semantic gap with its Group-IB citation: the latter describes staged Beacon payload writes to the victim, not exfiltration. Chunk analytics require visible HTTP or service object boundaries, while rate analytics require periodic byte fields. When either prerequisite is absent, coverage claims should be reduced rather than substituting connection count or DeviceNetworkEvents alone for byte evidence.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Chunk size and rate change accounting, not the inherent interpretability of content; encryption or compression belongs to an adjacent behavior.}
    - {mechanism_ref: NM-FD, reason: Small or slow traffic may resemble legitimate activity but available sources do not prove intentional feature imitation distinct from volume dilution.}
  open_questions:
    - Primary agent should decide whether one DET with two NJA objects remains semantically distinct from T1029 detection after both handoffs converge.
    - Confirm a deployment-specific periodic byte source before promoting the proposed rate analytic; Zeek conn.log alone is insufficient for long-connection short buckets.
    - If the unit child requires direct evidence of an actor selecting chunk size for a detector threshold, keep medium confidence or defer formalization after review.
