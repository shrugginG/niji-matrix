  detection_analytics:
    - key: B10-2-T1011-NJA-ROUTED
      name: {zh: 次要接口—进程—旁路流量差分, en: Secondary Interface–Process–Bypass Flow Differential}
      strategy_key: B10-2-T1011-DET-ALT-PATH
      platforms: [Windows, Linux, macOS]
      logic:
        zh: >-
          为每台资产建立主要受管 interface/network/gateway 与批准故障切换清单。在 adapter 由 down 到 up、连接新的 public network、出现新 IP/default gateway 或默认路由优先级改变后，以 DeviceId、时间和 LocalIP 把进程网络事件映射到具体 adapter；在 30 分钟内寻找敏感文件读取/暂存和经该 interface 的发送字节。若目的地未批准且主要边界覆盖图在同时段没有对应流，输出 alternate-path-send；只有发送字节或接收结果成立时升级为 exfiltration-supported。主要边界缺失只能在 coverage_complete=true 时参与判断。
        en: >-
          Build a primary managed interface, network, and gateway baseline plus approved failover inventory for every asset. After an adapter changes from down to up, joins a new public network, receives a new IP or default gateway, or changes default-route preference, map process network events to the adapter by DeviceId, time, and LocalIP. Within 30 minutes, find sensitive-file reads or staging and sent bytes over that interface. When destination is unapproved and the verified primary-boundary coverage map has no corresponding flow, output alternate-path-send; elevate to exfiltration-supported only with sent bytes or receiver outcome. Absence at primary egress participates only when coverage_complete is true.
      data_requirements:
        - source_type: endpoint-network-configuration
          name: {zh: 端点网络适配器与连接网络快照, en: Endpoint adapter and connected-network snapshots}
          channel: Microsoft Defender XDR DeviceNetworkInfo or equivalent
          required_fields: [Timestamp, DeviceId, NetworkAdapterName, NetworkAdapterType, NetworkAdapterStatus, ConnectedNetworks, IPAddresses, DefaultGateways]
        - source_type: endpoint-network-event
          name: {zh: 发起进程网络事件, en: Initiating-process network event}
          channel: Microsoft Defender XDR DeviceNetworkEvents or equivalent
          required_fields: [Timestamp, DeviceId, LocalIP, LocalPort, RemoteIP, RemoteUrl, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName]
        - source_type: interface-flow-counter
          name: {zh: 按接口方向流量计数, en: Directional per-interface flow counters}
          channel: host firewall, eBPF, ETW/WFP, interface accounting, or equivalent
          required_fields: [timestamp, device_id, interface_id, local_ip, process_id_if_available, remote_address, bytes_sent, bytes_received, flow_id]
        - source_type: endpoint-file-event
          name: {zh: 敏感文件访问或暂存事件, en: Sensitive-file access or staging events}
          channel: Microsoft Defender XDR DeviceFileEvents or equivalent
          required_fields: [Timestamp, DeviceId, FileName, FolderPath, FileSize, InitiatingProcessUniqueId, ActionType]
        - source_type: egress-coverage-and-approval
          name: {zh: 主要出口覆盖与批准接口清单, en: Primary-egress coverage and approved-interface inventory}
          channel: asset, network, and change management
          required_fields: [device_id, primary_interface, approved_secondary_interface, approved_network_or_profile, valid_from, valid_to, owner, coverage_complete]
      observables:
        - secondary adapter becomes active and joins a first-seen public network
        - process LocalIP maps to the secondary adapter and sends to an unapproved destination
        - sensitive-file access precedes sent bytes on the secondary interface
        - no matching flow exists at a verified-complete primary boundary
      correlation:
        window: 30m high-confidence path; 24h for slow transfer
        dimensions: [device_id, adapter_name, local_ip, gateway, connected_network, process_unique_id, destination, flow_id, approval_id]
      false_positives:
        - approved WWAN or SD-WAN failover, travel hotspot, remote-work public Wi-Fi, captive portal, and emergency support connectivity
        - VPN or virtual adapter that still routes through a managed security service
      blind_spots:
        - sparse adapter snapshots or no per-interface byte accounting
        - long-lived socket predates interface transition or shared service hides initiating process
        - carrier, baseband, or firmware activity invisible to endpoint telemetry
        - incomplete enterprise-boundary coverage makes absence non-probative
      tuning_guidance:
        zh: 按资产角色固定主接口、允许的 failover profile、gateway 和服务身份；虚拟 tunnel 与物理/无线接口分开基线。不要只按 adapter 类型告警，必须连接未批准网络、发起进程、发送字节或敏感读取；仍保留对新目的地和未经批准的 profile 变化检查。
        en: Pin primary interface, approved failover profile, gateway, and service identity by asset role and baseline virtual tunnels separately from physical or radio interfaces. Do not alert on adapter type alone; require an unapproved network, initiating process, sent bytes, or sensitive read while retaining checks for new destinations and unapproved profile changes.
      evidence_keys: [B10-2-T1011-REF-MDE-NETINFO, REF-000604, REF-000475, B10-2-T1011-REF-NIST-APP30]
    - key: B10-2-T1011-NJA-PROXIMITY
      name: {zh: 敏感读取—近距 peer 发送关联, en: Sensitive Read–Proximity Peer Send Correlation}
      strategy_key: B10-2-T1011-DET-ALT-PATH
      platforms: [Windows, Linux, macOS]
      logic:
        zh: >-
          在 30 分钟内把非交互或未批准进程的敏感文件读取/暂存连接到 radio enable、scan/pair/connect/service 事件及 peer 方向字节。peer 未在资产外设清单、服务/profile 允许文件或自定义数据传输、发送字节明显超过该设备角色基线，或同一随机化 peer 在物理区域重复出现时提高严重度。输出 peer-discovered、session-established、outbound-bytes-observed 和 receipt-supported 四层；仅发现或 beacon 状态不报告外传。
        en: >-
          Within 30 minutes, join sensitive-file read or staging by a non-interactive or unapproved process to radio enable, scan, pair, connect, and service events plus directional peer bytes. Raise severity when the peer is absent from the asset's peripheral inventory, the service or profile permits files or custom data, sent bytes exceed the device-role baseline, or the same randomized peer recurs in one physical area. Output peer-discovered, session-established, outbound-bytes-observed, and receipt-supported separately; discovery or beacon status alone does not report exfiltration.
      data_requirements:
        - source_type: short-range-link-audit
          name: {zh: 短距链路生命周期与方向字节, en: Short-range link lifecycle and directional bytes}
          channel: OS Bluetooth/NFC/nearby-sharing logs, MDM telemetry, HCI audit, or equivalent
          required_fields: [timestamp, device_id, adapter_id, technology_class, operation, peer_identifier, pairing_state, service_or_profile, session_id, direction, bytes_sent, bytes_received, process_id_if_available, outcome]
        - source_type: endpoint-file-event
          name: {zh: 敏感文件访问或暂存事件, en: Sensitive-file access or staging events}
          channel: Microsoft Defender XDR DeviceFileEvents or equivalent
          required_fields: [Timestamp, DeviceId, FileName, FolderPath, FileSize, InitiatingProcessUniqueId, ActionType]
        - source_type: approved-peer-inventory
          name: {zh: 批准 peer、服务与设备角色清单, en: Approved peer, service, and device-role inventory}
          channel: MDM, asset, and physical-security management
          required_fields: [device_id, peer_identity_or_class, approved_service_or_profile, owner, role, location_scope, valid_from, valid_to]
        - source_type: proximity-context
          name: {zh: 可选 RF 与物理邻近上下文, en: Optional RF and physical-proximity context}
          channel: authorized RF sensor, access-control, or location system
          required_fields: [timestamp, area_id, observed_peer, signal_context, sensor_id]
      observables:
        - non-interactive process activates or uses a short-range data service after sensitive read
        - unapproved peer receives sustained outbound bytes
        - repeated peer presence aligns with outbound sessions in a restricted area
      correlation:
        window: 30m per session; 30d peer recurrence review
        dimensions: [device_id, adapter_id, peer_identifier_or_cluster, service_or_profile, session_id, process_id, area_id, time]
      false_positives:
        - approved file sharing, headset or wearable sync, MDM enrollment, accessibility devices, support transfer, and conference-room peripherals
      blind_spots:
        - peer address randomization or OS logs without process and directional bytes
        - passive advertisements decoded by an external receiver without a connection event
        - unmanaged BYOD receiver and no lawful RF or location telemetry
      tuning_guidance:
        zh: 按资产角色允许 peer class 与 service/profile，不把单一随机地址永久白名单；对服务器和固定工作站默认低容忍，对移动办公设备按用户交互和文件大小基线。RF/位置数据只在授权区域与明确保留政策下使用。
        en: Allow peer class and service or profile by asset role rather than permanently allowlisting one randomized address. Use low tolerance on servers and fixed workstations and baseline user interaction and file size on mobile work devices. Use RF or location data only in authorized areas with explicit retention policy.
      evidence_keys: [B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER, REF-000475]
  mitigations:
    - key: B10-2-T1011-MIT-PATH-GOV
      name: {zh: 次要网络路径与近距 peer 治理, en: Secondary Network Path and Proximity-Peer Governance}
      description:
        zh: 通过接口最小化、批准网络和路由固定、近距服务限制、按接口审计与外送策略一致化，减少未经监测的旁路网络外传机会。
        en: Reduce unmonitored bypass-network exfiltration through interface minimization, pinned approved networks and routes, restricted proximity services, per-interface audit, and consistent egress policy.
      domains: [enterprise]
      measures:
        - key: disable-unused-secondary-interfaces
          name: {zh: 禁用不需要的次要网络接口, en: Disable unnecessary secondary network interfaces}
          control_type: exposure-reduction
          description:
            zh: 通过固件、MDM、系统策略和设备管理禁用业务不需要的 Wi-Fi、WWAN、调制解调器、Bluetooth/NFC 数据服务和外接网络适配器，并防止普通用户重新启用或创建新 adapter。
            en: Use firmware, MDM, OS policy, and device management to disable unneeded Wi-Fi, WWAN, modem, Bluetooth or NFC data services, and external network adapters, preventing ordinary users from re-enabling or creating adapters.
        - key: pin-approved-networks-routes
          name: {zh: 固定批准网络、profile 与路由, en: Pin approved networks, profiles, and routes}
          control_type: preventive
          description:
            zh: 对需要多接口的资产固定 SSID/APN/eSIM/profile、网关、DNS、路由优先级、允许目的地和服务身份，禁止未批准热点及同时存在的独立默认路由；合法故障切换需时限和工单。
            en: For multi-interface assets, pin SSID, APN, eSIM, profile, gateway, DNS, route preference, allowed destinations, and service identity, denying unapproved hotspots and simultaneous independent default routes. Authorized failover requires expiry and a change record.
        - key: restrict-proximity-data-services
          name: {zh: 限制近距数据服务与 peer, en: Restrict proximity data services and peers}
          control_type: preventive
          description:
            zh: 按资产角色仅允许必要的 peer class 与 service/profile，关闭 discoverable、文件接收、PAN 和自定义 advertisement 数据功能，要求受管配对、用户可见确认与过期清理。
            en: Allow only necessary peer classes and services or profiles by asset role, disable discoverable, file receipt, PAN, and custom advertisement data functions, and require managed pairing, visible user confirmation, and expiration cleanup.
        - key: uniform-egress-and-interface-audit
          name: {zh: 跨接口一致外送控制与生命周期审计, en: Uniform egress control and interface lifecycle audit}
          control_type: detective-support
          description:
            zh: 将 DLP/主机防火墙和目的地策略应用到所有可用接口，集中 adapter/route/peer 生命周期、按接口方向字节和发起进程，并验证主要边界覆盖范围。
            en: Apply DLP, host firewall, and destination policy across every usable interface, centralize adapter, route, and peer lifecycle, directional bytes by interface, and initiating process, and verify primary-boundary coverage.
        - key: revoke-bypass-path
          name: {zh: 旁路路径撤销与证据保全, en: Bypass-path revocation and evidence preservation}
          control_type: containment
          description:
            zh: 确认未授权外送后保全 adapter/profile/route、peer/session、进程、字节与文件证据，再禁用接口、撤销 eSIM/APN/配对、阻断目的地并核查接收范围。
            en: After confirming unauthorized sending, preserve adapter, profile, route, peer, session, process, byte, and file evidence before disabling the interface, revoking eSIM, APN, or pairing, blocking destination, and assessing receipt scope.
      applications:
        - target_key: B10-2-T1011-PARENT
          use:
            zh: 盘点每台资产的全部联网与近距接口，明确主要出口、允许旁路、peer 数据服务和传感器覆盖，并将同一外送策略应用到所有路径。
            en: Inventory every network and proximity interface on each asset, define primary egress, allowed bypasses, peer data services, and sensor coverage, and apply one egress policy across all paths.
          expected_effect:
            zh: 未登记介质不能仅因绕开企业网关而获得外送通路，接口与 peer 变化留下可关联证据。
            en: An unregistered medium cannot gain an egress path merely by bypassing the enterprise gateway, and interface and peer changes leave correlatable evidence.
          limitations:
            zh: 基带/固件级行为、物理植入 radio 和第三方运营网络不可由端点策略完全控制，多接口业务会产生管理成本。
            en: Baseband or firmware behavior, physically implanted radios, and third-party carrier networks cannot be fully controlled by endpoint policy, and multi-interface business creates management cost.
        - target_key: B10-2-T1011-CH-ROUTED
          use:
            zh: 固定允许的次要 adapter、network profile、gateway 和服务身份，阻止并发独立默认路由，并对故障切换设置工单与自动到期。
            en: Pin allowed secondary adapters, network profiles, gateways, and service identities, prevent concurrent independent default routes, and place failover under tickets and automatic expiry.
          expected_effect:
            zh: 攻击者必须改变可审核配置或劫持批准身份才能通过外部网络发送，LocalIP—adapter—route 差分更明确。
            en: The adversary must change auditable configuration or hijack an approved identity to send through an outside network, creating a clearer LocalIP-to-adapter-to-route differential.
          limitations:
            zh: 合法应急连接和差旅场景需要例外；受控企业 WWAN 被劫持时仍可能符合 profile。
            en: Legitimate emergency and travel connectivity needs exceptions, and abuse of managed enterprise WWAN may still match its profile.
        - target_key: B10-2-T1011-CH-PROXIMITY
          use:
            zh: 在服务器和固定高价值终端关闭近距数据服务；确需使用时固定 peer class/service/profile、禁止未知文件/PAN、自定义广播数据，并记录配对和方向字节。
            en: Disable proximity data services on servers and fixed high-value endpoints. Where required, pin peer class, service or profile, deny unknown file, PAN, and custom advertisement data use, and record pairing and directional bytes.
          expected_effect:
            zh: 近距接收者必须进入批准关系或触发可见策略变化，发现/会话/发送三层更易关联。
            en: A nearby receiver must enter an approved relationship or trigger a visible policy change, making discovery, session, and send layers easier to join.
          limitations:
            zh: 地址随机化、被控批准 peer、被动 advertisement 接收和无操作系统可见性的 radio 固件会削弱控制。
            en: Address randomization, a compromised approved peer, passive advertisement receipt, and radio firmware outside OS visibility weaken the control.
      evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-MDE-NETINFO]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 1
    attack_subtechnique_ids: [T1011.001]
    represented_dimensions:
      - one_named_short_range_wireless_technology_and_proximity_requirement
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_child_id: T1011.001
        resolution: niji-variable-candidate
        explanation:
          zh: Flame 与近距接收资料支持“接收者由 peer 会话和物理范围限定”的变量；Bluetooth 名称、协议分类和 ATT&CK 父子关系不导入 Niji。
          en: Flame and proximity-receiver material support the variable of a receiver bounded by peer session and physical range; the Bluetooth name, protocol category, and ATT&CK parent-child relationship are not imported into Niji.
    candidate_stealth_axes_examined:
      - axis: independently_routed_secondary_interface
        resolution: formal_candidate
        evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-MDE-NETINFO]
      - axis: proximity_scoped_peer_receipt
        resolution: formal_candidate
        evidence_keys: [B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER]
      - axis: protocol_change_on_primary_medium
        resolution: adjacent-technique
        reason: 传感器路径未改变，归 T1048。
      - axis: control_plane_replica_to_collector
        resolution: adjacent-technique
        reason: 原数据路径保持，端点未选择替代介质，归 T1020 复制轴。
      - axis: offline_device_storage_and_custody
        resolution: adjacent-technique
        reason: 无在线网络会话、依赖断开搬运，归 T1052。
      - axis: radio_or_adapter_product
        resolution: not-stealth-distinct
        reason: Bluetooth、Wi-Fi、蜂窝和调制解调器可实现不同拓扑，名称不能稳定预测观察差异。
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线只有一个 Bluetooth 子项，但已跨可路由次要接口、近距 peer、协议替代、控制面复制、离线介质与产品名六个维度搜索；两项正式候选均按路径和传感器差异建立。
      en: The fixed baseline has one Bluetooth child, but the search covered routed secondary interfaces, proximity peers, protocol substitution, control-plane copying, offline media, and product names. Both formal candidates are defined by path and sensor difference.
  evidence_coverage:
    parent_behavior_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30]
    boundary_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-ATTACK-CHILD, B10-2-T1011-REF-NIST-APP30]
    mechanism_support:
      - mechanism_ref: NM-ST
        evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30]
        strength: direct_sensor_boundary_statement
      - mechanism_ref: NM-BT
        evidence_keys: [B10-2-T1011-REF-MDE-NETINFO, REF-000604]
        strength: implementable_endpoint_to_boundary_differential_with_coverage_condition
    child_existence_support:
      - child_key: B10-2-T1011-CH-ROUTED
        evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-MDE-NETINFO]
        strength: supported_behavior_and_observation_model_without_specific_enterprise_case
      - child_key: B10-2-T1011-CH-PROXIMITY
        evidence_keys: [B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER]
        strength: malicious_capability_plus_experimental_feasibility
    unsupported_or_deferred:
      - 没有公开证据证明 Flame 在具体受害事件中通过 Bluetooth 成功外传的字节量和接收设备，因此不创建正式 CASE。
      - 独立路由子项缺少公开 Enterprise 入侵案例，置信度保持 medium，具体实例必须补本地发送结果。
      - 主要边界“未见流量”只有在 coverage_complete 可证时才可支持旁路结论。
      - Bluetooth 名称不形成 Niji 子项，PAN 路由与本地 peer 传输须按拓扑分别判断。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项和两项子项完整覆盖定义、匿迹属性、残余、纳入/排除、T1020/T1048/T1052 边界、场景、攻防模型、机理、证据层级与不同限制。
      en: The parent and both children cover definition, stealth properties, residuals, inclusion and exclusion, T1020, T1048, and T1052 boundaries, scenarios, attacker and defender models, mechanism, evidence levels, and distinct limitations.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, syntax validation, temporary-key audit]
  limitations:
    paragraphs:
      - zh: >-
          T1011 的公开 Enterprise 事件证据稀少。固定 ATT&CK 页面直接证明父行为和传感器边界，Flame 证明 Bluetooth 恶意模块能力，BLEWhisperer 证明低速技术可行性，NIST APP-30 证明移动设备上的企业分析盲区；这些来源不能合并成某个已观察攻击者在 Windows/Linux/macOS 企业终端完成大规模旁路外传的事实。正式实例必须按本地 adapter/peer、发送字节和接收结果校准。
        en: >-
          Public Enterprise incident evidence for T1011 is sparse. The fixed ATT&CK page establishes the parent behavior and sensor boundary, Flame establishes malicious Bluetooth module capability, BLEWhisperer establishes low-rate technical feasibility, and NIST APP-30 establishes enterprise-analysis blind spots on mobile devices. These sources cannot be combined into a claim that an observed actor completed large-scale bypass exfiltration from Enterprise Windows, Linux, or macOS endpoints. Formal instances require local adapter or peer, sent-byte, and receipt evidence.
      - zh: >-
          网络接口与近距 radio 的日志质量跨平台差异大。DeviceNetworkInfo 是状态快照而非完整生命周期，DeviceNetworkEvents 的标准字段不提供发送字节，Bluetooth/NFC/AirDrop 也常缺少发起进程或稳定 peer。Analytic 必须允许 capability、session、send 和 receipt 分级，不能因发现新接口、未知 peer 或主要出口无记录就直接宣布外传。
        en: >-
          Logging quality for network interfaces and proximity radios varies substantially by platform. DeviceNetworkInfo is a state snapshot rather than a complete lifecycle, standard DeviceNetworkEvents fields do not provide sent bytes, and Bluetooth, NFC, or AirDrop often lacks initiating process or stable peer identity. Analytics must grade capability, session, send, and receipt rather than declaring exfiltration from a new interface, unknown peer, or absent primary-egress record.
      - zh: >-
          企业环境合法使用热点、蜂窝故障切换、外设、邻近共享与 BYOD，会产生强相似背景。按资产角色建立允许接口、网络、route、peer class、service/profile 与业务窗口比按技术名称封禁更可靠。物理邻近和 RF 数据受隐私与权限约束，仅应在明确授权区域使用。
        en: >-
          Enterprise use of hotspots, cellular failover, peripherals, nearby sharing, and BYOD creates strong benign background. Baselines of allowed interface, network, route, peer class, service or profile, and business window by asset role are more reliable than blocking by technology name. Physical-proximity and RF data carry privacy and authority constraints and should be used only in explicitly authorized areas.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: Encoding or encryption may accompany transfer but is a content transformation independent of the network-medium path.
    - mechanism_ref: NM-FD
      reason: Normal-looking SSID, peer name, or protocol use may camouflage features, but available evidence does not establish a stable medium-independent disguise variable.
  open_questions:
    - 主 Agent 应审查独立路由子项在缺少公开 Enterprise 事件案例时是否保持 medium formal candidate，或降为 deferred；父技术 retain 和防御策略不受影响。
    - 与 T1052 收敛时须以“连接期间网络会话交付”对“断开后的介质保管与搬运”作为权威边界，不能按设备外形判断。
