        en: Adapter state, address, and gateway, process LocalIP, sensitive-file access, per-interface sent counters, and primary-boundary coverage differential enable independently routed interface detection, while DeviceNetworkEvents alone cannot establish byte volume.
      evidence_keys: [B10-2-T1011-REF-MDE-NETINFO, REF-000604, REF-000475]
