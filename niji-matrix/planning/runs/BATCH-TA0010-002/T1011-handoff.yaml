        en: Proximity-peer exfiltration has no enterprise remote-IP destination and attributes the receiver through radio session, peer, and physical range; Flame and BLE research support malicious functionality and technical feasibility respectively, supporting an independent Niji child.
      evidence_keys: [B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER]
