handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-002
work_item_ref: WORK-TA0010-T1011
temporary_key_prefix: B10-2-T1011
candidate:
  source_type: attack
  source_attack_id: T1011
  name:
    zh: 经其他网络介质渗出
    en: Exfiltration Over Other Network Medium
recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1011 直接锚定通过不同于主要 C2/企业互联网路径的 Wi-Fi、调制解调器、蜂窝、Bluetooth 或其他 RF 网络介质外传，并明确指出这些连接没有经过同一企业网络，可能获得较弱的保护与监测。这个路径与传感器边界变化本身就是稳定的匿迹问题，因此保留父技术。正式 Niji 范围仍要求攻击者有意控制替代网络路径并证明数据离开受害环境，不能把设备具备第二块网卡或一次正常无线连接直接视为匿迹。
        en: >-
          ATT&CK Enterprise 19.1 anchors T1011 in exfiltration over Wi-Fi, modem, cellular, Bluetooth, or another RF network medium that differs from the primary C2 or enterprise Internet path and explicitly notes that such connections do not traverse the same enterprise network and may receive weaker protection and monitoring. That path and sensor-boundary change is itself a stable stealth problem, so the parent is retained. Formal Niji scope still requires attacker control of the alternate network path and evidence that data leaves the victim environment; possession of a second adapter or one normal wireless connection does not establish stealth.
      - zh: >-
          T1011.001 只作为 Bluetooth 实现广度参考。开放分类后，稳定差异收敛为“通过独立默认路由或公网出口直接外送”和“把数据交给近距对等接收者”两条轴：前者在端点仍保留可路由远端与次要接口痕迹，后者只在本地短距链路留下 peer、会话与发送字节，接收者身份还依赖物理邻近。两者使用不同关联键和控制措施，不按 Bluetooth、Wi-Fi、蜂窝或产品名称划分。
        en: >-
          T1011.001 is used only as breadth context for one Bluetooth implementation. Open taxonomy search converged on two stable axes: direct sending through an independently routed interface or public egress, and delivery to a proximity-scoped peer. The first retains a routable remote destination and secondary-interface traces at the endpoint; the second leaves only local short-range peer, session, and sent-byte traces, with receiver attribution dependent on physical proximity. They require different joins and controls and are not divided by Bluetooth, Wi-Fi, cellular, or product name.
proposed_content:
  summary:
    zh: 攻击者通过不受主要企业出口监测的独立网络接口或近距对等链路外送数据，使边界传感器看不到完整外传路径。
    en: Adversaries send data through an independently routed network interface or proximity peer link outside primary enterprise-egress monitoring, preventing boundary sensors from seeing the complete exfiltration path.
  definition_and_concept:
    paragraphs:
      - zh: >-
          经其他网络介质渗出是攻击者让数据从主要企业网络和既有 C2 网络路径之外的联网接口、无线承载或近距网络会话离开受害环境。直接目标是完成外传，概念重点是数据路径穿过不同的网络介质和管理域，导致原本覆盖主要出口的防守传感器不再处于转发路径上。
        en: >-
          Exfiltration Over Other Network Medium sends data out of the victim environment through a networked interface, wireless bearer, or proximity network session outside the primary enterprise and established C2 network path. The direct objective is exfiltration. Its conceptual focus is a data path crossing a different medium and administrative domain, leaving defenders that monitor the primary egress outside the forwarding path.
      - zh: >-
          网络介质表示仍有接口、地址/peer、会话或包/字节交付语义；可移动存储的复制、断开与人工携带归 T1052。改变应用或传输协议但仍走原企业出口归 T1048；在原路径上创建到 collector 的副本归 T1020；是否自动、定时或限速分别由 T1020、T1029 与 T1030 描述。具体协议和无线品牌不定义本技术。
        en: >-
          Network medium retains interface, address or peer, session, and packet or byte delivery semantics. Copying to removable storage, disconnecting, and physical carriage belong to T1052. Changing application or transport protocol while retaining the original enterprise egress belongs to T1048. Creating a collector copy on the original path belongs to T1020. Automation, scheduling, and rate or size limits are described by T1020, T1029, and T1030 respectively. A specific protocol or radio brand does not define this technique.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          替代介质把外传流从企业防火墙、代理、NDR、DNS 与 NetFlow 的主要视野中移走。独立路由接口仍在端点留下 adapter 状态、连接网络、IP、默认网关、本地地址与发起进程；近距对等链路则留下 radio enable、发现/配对、peer、服务/profile、会话方向和字节计数。防守方如果只验证主要出口“没有异常”，会把传感器未覆盖误当成没有外传。
        en: >-
          An alternate medium moves exfiltration out of the primary view of enterprise firewalls, proxies, NDR, DNS, and NetFlow. An independently routed interface still leaves adapter state, connected network, IP, default gateway, local address, and initiating process at the endpoint. A proximity peer link leaves radio enablement, discovery or pairing, peer, service or profile, session direction, and byte counters. A defender that verifies only that primary egress looks normal can mistake lack of sensor coverage for absence of exfiltration.
      - zh: >-
          匿迹效果取决于观察边界，而不是无线天然不可见。EDR、MDM、接口配置快照、操作系统连接日志、短距链路审计、RF 监测、运营商或访客网络记录仍可能恢复活动。新启用接口、非批准公网网络、敏感文件读取后持续发送、异常 peer 或默认路由变化都是残余；在受管 Wi-Fi 与有完整端点遥测的环境中，替代介质优势会明显下降。
        en: >-
          Stealth depends on the observation boundary rather than wireless being inherently invisible. EDR, MDM, adapter snapshots, OS connection logs, short-range link audit, RF monitoring, and carrier or guest-network records may recover activity. A newly enabled adapter, unapproved public network, sustained send after sensitive-file access, anomalous peer, or default-route change remains. The advantage falls sharply on managed Wi-Fi with complete endpoint telemetry.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入需要识别非主要网络介质或接口、实际外送或可执行会话、以及该路径绕开主要企业网络传感器的关系。合法 WWAN 故障切换、差旅热点、家庭/访客 Wi-Fi、外设配对、AirDrop/邻近共享与辅助无障碍设备会形成相似痕迹，必须用资产角色、批准网络/peer、用户上下文、数据来源、发送字节和外部结果排除正常行为。
        en: >-
          Inclusion requires an identifiable non-primary network medium or interface, actual outward transfer or an executable session, and a relationship showing that the path bypasses primary enterprise-network sensors. Authorized WWAN failover, travel hotspots, home or guest Wi-Fi, peripheral pairing, AirDrop or nearby sharing, and assistive devices produce similar traces and require exclusion using asset role, approved network or peer, user context, data source, sent bytes, and external outcome.
      - zh: >-
          若接口只是建立但没有数据外送，只能确认旁路能力；若数据仍经同一企业网关，仅使用了不同协议，则归 T1048。短距设备仅作为离线存储接收文件、之后被拔出携带时归 T1052；只有连接期间存在网络会话和 peer-to-peer 字节交付时才归本技术。网络控制面把原始流量镜像给 collector 而端点没有选择新介质时归 T1020 复制轴。
        en: >-
          An established interface without outward data confirms bypass capability only. Data using a different protocol over the same enterprise gateway belongs to T1048. A short-range device that receives files merely as offline storage and is later unplugged and carried belongs to T1052; this technique requires a network session and peer-to-peer byte delivery while connected. A network control plane that mirrors the original flow to a collector while the endpoint selects no new medium belongs to T1020's replica axis.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在同时具备受管以太网和蜂窝、未受管 Wi-Fi 或调制解调器的工作站上，攻击者可以启用次要接口、获得独立地址和默认/策略路由，再将已收集数据发送到外部地址。企业边界只看到原主要接口保持正常，端点却经另一个运营商或公共网络完成传输。NIST 的移动威胁目录明确指出蜂窝连接不能由企业网络安全机制直接分析，这一观察支持传感器边界差异，但不是 Enterprise 环境的具体攻击事件。
          en: >-
            On a workstation with managed Ethernet plus cellular, unmanaged Wi-Fi, or a modem, an adversary can enable the secondary interface, obtain an independent address and default or policy route, and send collected data to an external address. The enterprise boundary sees the original primary interface remain normal while the endpoint completes transfer through another carrier or public network. NIST's Mobile Threat Catalogue explicitly notes that cellular connections cannot be directly analyzed by enterprise network security mechanisms. That supports the sensor-boundary difference but is not a specific Enterprise incident.
        - zh: >-
            在需要近距离接收者的环境中，攻击者可让受控进程通过短距网络向附近设备交付编码信息。Flame 的 BeetleJuice 模块被公开分析为具备经 Bluetooth 从受感染系统传输编码信息、发布 beacon 和发现附近设备的功能；公开资料证明恶意能力，但未证明某一受害事件中已完成多少字节的外传。BLEWhisperer 的实验则证明 BLE advertisements 可以实现低速数据外传并受距离与吞吐限制。
          en: >-
            Where a nearby receiver is available, an adversary can have a controlled process deliver encoded information to a local device over a short-range network. Public analysis of Flame's BeetleJuice module describes capability to transmit encoded information from an infected system over Bluetooth, advertise a beacon, and discover nearby devices. The evidence establishes malicious capability but not the byte volume completed in a particular victim incident. BLEWhisperer experimentally establishes low-rate exfiltration through BLE advertisements under proximity and throughput constraints.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: >-
            独立路由接口需要攻击者控制适配器启用、网络关联、地址配置与进程绑定或路由，并维持一个不经受管出口的可用外部网络。近距对等传输需要短距 radio 权限、发现或已知 peer、兼容服务/profile，以及接收者在有效范围内。设备策略、物理射频环境、数据上限、带宽、功耗、配对提示和用户可见通知都会限制行动。
          en: >-
            Independently routed egress requires authority to enable an adapter, associate to a network, configure addressing, and bind process or route, plus a usable external network outside managed egress. Proximity transfer requires short-range radio authority, discovery or knowledge of a peer, a compatible service or profile, and a receiver within range. Device policy, physical RF environment, data caps, bandwidth, power, pairing prompts, and user-visible notifications constrain the operation.
        - zh: >-
            为保持低可见性，攻击者还需避免接口频繁切换、陌生 SSID/peer、异常默认路由、长时高字节发送和配对弹窗。独立介质失效时，数据可能积压或回落到受管网络并暴露；近距接收者离开范围时也会产生重试与连接失败。
          en: >-
            To remain less visible, the adversary must avoid frequent interface transitions, unfamiliar SSIDs or peers, anomalous default routes, long high-byte sends, and pairing prompts. Failure of the independent medium can cause backlog or fallback to the managed network, while a proximity receiver leaving range creates retries and connection failures.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定拥有资产级接口清单、连接网络/peer 基线、接口状态与默认网关快照、发起进程网络事件、按接口或本地地址的发送计数、敏感文件访问和主要边界流量覆盖图。Microsoft DeviceNetworkInfo 提供 adapter type/status、connected networks、IP 与 default gateway，DeviceNetworkEvents 提供 LocalIP 和发起进程；二者需按 DeviceId、时间和 LocalIP 连接，且常规 DeviceNetworkEvents 没有可依赖的发送字节字段。
            en: >-
              The defender is assumed to have an asset-level interface inventory, connected-network or peer baseline, adapter state and default-gateway snapshots, initiating-process network events, sent counters by interface or local address, sensitive-file access, and a map of primary-boundary coverage. Microsoft DeviceNetworkInfo exposes adapter type and status, connected networks, IPs, and default gateways, while DeviceNetworkEvents exposes LocalIP and initiating process. They require a join by DeviceId, time, and LocalIP, and standard DeviceNetworkEvents has no reliable sent-byte field.
          - zh: >-
              防守盲区包括适配器快照过稀、peer 地址随机化、操作系统不记录 Bluetooth/NFC/AirDrop 方向字节、共享用户设备不受 MDM、无线芯片或基带固件行为不进入 EDR，以及主要边界本身覆盖不完整。若无法证明主要出口在同一时间段有完整覆盖，“边界未见流量”只能是低置信度旁证。
            en: >-
              Blind spots include sparse adapter snapshots, peer-address randomization, OS logs without directional bytes for Bluetooth, NFC, or AirDrop, unmanaged personal devices, radio-chip or baseband behavior outside EDR, and incomplete primary-boundary coverage. When complete coverage of the primary egress cannot be established for the same interval, absence from that boundary is only low-confidence supporting evidence.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 将外传流量移出主要企业出口传感器并分散到端点与邻近网络
        en: Move exfiltration outside primary enterprise-egress sensors and distribute traces across endpoint and nearby networks
      analysis:
        paragraphs:
          - zh: >-
              攻击者选择独立路由接口或短距 peer，使本应集中于企业网关的外送痕迹转移到端点 adapter、公共/运营商网络或邻近接收设备。主要边界只能看到正常或缺失的原路径活动，完整链需要连接接口状态、本地地址、进程、peer 和外部接收。ATT&CK 与 NIST 均指出这些介质不通过或难由同一企业网络机制直接分析，支持时空释痕因果；这不代表替代介质没有其他传感器。
            en: >-
              The adversary selects an independently routed interface or short-range peer, moving egress traces that would otherwise concentrate at the enterprise gateway to endpoint adapters, a public or carrier network, or a nearby receiver. The primary boundary sees normal or absent original-path activity, and reconstruction requires joining interface state, local address, process, peer, and external receipt. ATT&CK and NIST both note that these media do not traverse or cannot be directly analyzed by the same enterprise mechanisms, supporting Spatiotemporal Trace Dilution without implying that the alternate medium has no sensors.
      evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 主要企业边界保持无异常结果而端点经旁路接口完成外送
        en: Keep the primary enterprise boundary apparently normal while endpoint egress completes over a bypass interface
      analysis:
        paragraphs:
          - zh: >-
              当进程绑定次要本地地址或短距会话时，主要企业出口没有对应远端连接，常规网络检测可能把“未观察到外传”当作正常。行为事实没有被删除，而是落在另一接口和管理域；用端点 adapter/peer 事件与主要边界覆盖差分能够恢复这种观察空白。其置信度依赖边界传感器在同一时段的覆盖证明。
            en: >-
              When a process binds a secondary local address or short-range session, the primary enterprise egress has no corresponding remote connection, and routine network detection may treat non-observation as normal. The behavior is not erased; it lands on another interface and administrative domain. A differential between endpoint adapter or peer events and verified primary-boundary coverage recovers the gap, with confidence dependent on proof of boundary coverage during the same interval.
      evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-MDE-NETINFO, REF-000604]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            两个子项按替代介质的路径拓扑和接收者归因划分。独立路由次要接口仍建立到可路由外部目的地的 IP 网络路径，关键痕迹是 adapter、connected network、local IP、gateway/route 与发起进程；近距对等接收把数据交给本地 radio 范围内的 peer，关键痕迹是发现/配对、peer、service/profile、方向字节与物理邻近。二者的传感器位置和缓解方法不同，可以组合但不能互相替代。
          en: >-
            The children are divided by alternate-medium path topology and receiver attribution. An independently routed secondary interface still establishes an IP path to a routable external destination, leaving adapter, connected network, local IP, gateway or route, and initiating-process traces. Proximity-scoped peer delivery hands data to a peer within local radio range, leaving discovery or pairing, peer, service or profile, directional bytes, and physical-proximity traces. Sensor placement and mitigations differ; the variables may combine but do not substitute for one another.
        - zh: >-
            Bluetooth 既可能承载 PAN 等可路由路径，也可能承担本地 peer 传输，因此协议名称不能决定子项。Wi-Fi、蜂窝和调制解调器同样只作为实现。固定基线 T1011.001 的 Flame 资料主要支持近距对等轴，原 ATT&CK 名称没有继承。
          en: >-
            Bluetooth may carry a routable PAN or a local peer transfer, so the protocol name cannot select a child. Wi-Fi, cellular, and modem are likewise implementations. Flame material under fixed-baseline T1011.001 mainly supports the proximity-peer axis, and the ATT&CK child name is not inherited.
    coverage: established
    proposed_child_keys: [B10-2-T1011-CH-ROUTED, B10-2-T1011-CH-PROXIMITY]
proposed_subtechniques:
  - temporary_key: B10-2-T1011-CH-ROUTED
    name:
      zh: 独立路由次要接口外传
      en: Independently Routed Secondary-Interface Egress
    stable_variable: outbound_path_uses_secondary_interface_and_independent_gateway_or_public_network
    trace_change: egress_disappears_from_primary_boundary_and_remains_in_endpoint_adapter_route_and_process_telemetry
    defender_effect: enterprise_perimeter_cannot_see_transfer_without_endpoint_to_interface_correlation
    prerequisites: attacker_controls_secondary_adapter_network_association_and_route
    evidence_keys: [B10-2-T1011-REF-ATTACK, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-MDE-NETINFO, REF-000604]
    confidence: medium
    proposed_content:
      summary:
        zh: 通过具有独立地址和网关的次要接口直接连接外部网络，使外传绕开主要企业出口并只在端点和外部网络留下完整路径。
        en: Connect directly to an external network through a secondary interface with independent addressing and gateway, bypassing primary enterprise egress and leaving the complete path only at the endpoint and outside network.
      definition_and_concept:
        paragraphs:
          - zh: >-
              独立路由次要接口外传是攻击者启用或利用目标上的第二网络接口，使外送流量通过不同于主要受管网络的地址、网关或策略路由到达外部目的地。稳定变量是独立路由路径；以太网、Wi-Fi、蜂窝、调制解调器、Bluetooth PAN 或虚拟适配器只是实现，只有实际映射到独立出口时才成立。
            en: >-
              Independently Routed Secondary-Interface Egress enables or uses a second network interface on the target so outbound traffic reaches an external destination through addressing, gateway, or policy routing distinct from the primary managed network. The stable variable is the independent routed path. Ethernet, Wi-Fi, cellular, modem, Bluetooth PAN, or virtual adapters are implementations and qualify only when mapped to an independent egress.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              企业防火墙、代理和 NDR 不再处于转发路径，因而主要出口没有与敏感读取对应的远端连接。端点仍可见新接口 up、公共 connected network、IP/default gateway 变化、进程 LocalIP 与外部目的地；运营商、热点或访客网络也可能留痕。若 EDR 不能把 LocalIP 映射回 adapter，网络事件会被错误地看作普通连接。
            en: >-
              Enterprise firewall, proxy, and NDR leave the forwarding path, so primary egress has no remote connection corresponding to sensitive access. The endpoint still exposes interface-up state, a public connected network, IP or default-gateway change, and the process LocalIP and external destination; carrier, hotspot, or guest network may also log activity. Without mapping LocalIP back to an adapter, EDR can misread the event as an ordinary connection.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求次要接口在相关时段具有独立出口，发起进程或路由把外送数据绑定到该路径，并有发送字节或接收结果。合法故障切换、差旅连接、企业 WWAN 与双链路 SD-WAN 必须按批准 profile、服务身份、目的地与变更工单排除。若接口仍把流量送入相同受管网关，不构成本子项；若变化只在协议层，归 T1048。
            en: >-
              Inclusion requires independent egress on the secondary interface during the relevant interval, process or routing binding outward data to that path, and sent bytes or receiver outcome. Authorized failover, travel connectivity, enterprise WWAN, and dual-link SD-WAN require exclusion by approved profile, service identity, destination, and change record. An interface that still feeds the same managed gateway does not qualify, and a protocol-only change belongs to T1048.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                攻击者可在有线企业工作站上启用内置 Wi-Fi 并连接未受管热点，或使用已存在的蜂窝/调制解调器接口建立独立公网路由，再让外传进程绑定该接口的 LocalIP。公开 Enterprise 事件证据有限；NIST 对蜂窝路径无法由企业网络机制直接分析的说明支持观察模型，而非证明某个已知行为者的实施。
              en: >-
                An adversary can enable built-in Wi-Fi on a wired enterprise workstation and join an unmanaged hotspot, or use an existing cellular or modem interface to create independent public routing and bind the exfiltration process to that interface's LocalIP. Public Enterprise incident evidence is limited. NIST's statement that cellular paths cannot be directly analyzed by enterprise network mechanisms supports the observation model rather than a known actor implementation.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要操作 adapter 或连接 profile 的权限、可用热点/蜂窝服务、地址与路由控制，以及能选择源地址或服从新默认路由的外传程序。接口策略、SIM/eSIM 管理、信号覆盖、门户认证、数据上限和防火墙会限制可行性。
                en: >-
                  The adversary needs authority over the adapter or connection profile, an available hotspot or cellular service, address and route control, and an exfiltration program that can select a source address or follow the new default route. Interface policy, SIM or eSIM management, radio coverage, captive authentication, data caps, and firewalling constrain feasibility.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方把 DeviceNetworkInfo 等 adapter 快照的 IPAddresses、ConnectedNetworks 和 DefaultGateways 与进程网络事件的 LocalIP 连接，并使用按接口流量计数或本地防火墙字节确认外送。主要边界的未见记录只有在覆盖完整时才作为差分。虚拟 VPN/tunnel adapter 需单独基线，避免误判为物理旁路。
                en: >-
                  Defenders join IPAddresses, ConnectedNetworks, and DefaultGateways from adapter snapshots such as DeviceNetworkInfo to LocalIP in process network events and use per-interface counters or local firewall bytes to confirm sending. Non-observation at primary egress is used only when coverage is known complete. Virtual VPN or tunnel adapters require separate baselines to avoid treating them as physical bypasses.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary:
            zh: 独立接口把外传痕迹从企业网关移到端点和外部网络
            en: An independent interface moves exfiltration traces from enterprise gateway to endpoint and outside network
          analysis:
            paragraphs:
              - zh: >-
                  外传进程选择次要接口地址或独立默认路由后，数据不穿过原企业出口，边界流量检测失去直接事件；痕迹改为分布在端点 adapter/route、进程 socket 和外部运营网络。NIST 明确指出蜂窝连接不能由企业网络机制直接分析，Microsoft 字段说明端点仍可保留 adapter 和 LocalIP 关系。跨这两个视点关联可恢复路径。
                en: >-
                  After the exfiltration process selects a secondary-interface address or independent default route, data does not traverse the original enterprise egress and boundary detection loses the direct event. Traces distribute across endpoint adapter and route, process socket, and outside carrier network. NIST explicitly notes that cellular connections cannot be directly analyzed by enterprise network mechanisms, while Microsoft fields show that endpoint adapter and LocalIP relationships remain. Correlation across those views recovers the path.
          evidence_keys: [B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-MDE-NETINFO, REF-000604]
          confidence: medium
      defense_targets: [B10-2-T1011-DET-ALT-PATH, B10-2-T1011-MIT-PATH-GOV]
      research_limitations:
        paragraphs:
          - zh: >-
              固定 ATT&CK 父页面与 NIST 威胁目录支持能力和观察盲区，但本研究未取得公开 Enterprise 入侵中经蜂窝或第二 Wi-Fi 完成敏感文件外传的结论级案例。因此该子项的行为与防御差异为 medium，具体归因必须有本地接口、发送字节和外部目的地证据。
            en: >-
              The fixed ATT&CK parent and NIST threat catalogue support capability and observation blind spots, but this research found no conclusion-level public Enterprise incident proving sensitive-file exfiltration through cellular or a second Wi-Fi path. Behavior and defense distinction remain medium confidence, and a specific attribution requires local interface, sent-byte, and external-destination evidence.
  - temporary_key: B10-2-T1011-CH-PROXIMITY
    name:
      zh: 近距对等接收外传
      en: Proximity-Scoped Peer-Receipt Exfiltration
    stable_variable: receiver_is_a_nearby_peer_on_a_local_short_range_network
    trace_change: no_enterprise_gateway_or_routable_remote_destination_and_receipt_is_bound_to_peer_session_and_physical_range
    defender_effect: attribution_requires_endpoint_link_audit_peer_identity_and_proximity_context
    prerequisites: attacker_controls_short_range_radio_sender_and_receiver_within_range
    evidence_keys: [B10-2-T1011-REF-ATTACK-CHILD, B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER]
    confidence: medium
    proposed_content:
      summary:
        zh: 将数据通过本地短距网络交给有效范围内的 peer，使企业 IP 出口没有远端连接，并把接收者归因分散到设备身份和物理邻近。
        en: Deliver data over a local short-range network to a peer within range, leaving no remote connection at enterprise IP egress and distributing receiver attribution across device identity and physical proximity.
      definition_and_concept:
        paragraphs:
          - zh: >-
              近距对等接收外传是受控进程经短距网络会话、广播或面向 peer 的服务把数据交给附近接收设备。稳定变量是接收者由本地 radio 范围和 peer 关系限定，而不是 Bluetooth 名称；Bluetooth、BLE advertisement、NFC 或平台邻近共享只有在承载网络式数据交付且接收者仍在线时才是实现。
            en: >-
              Proximity-Scoped Peer-Receipt Exfiltration uses a short-range network session, advertisement, or peer-oriented service to deliver data from a controlled process to a nearby receiver. The stable variable is a receiver bounded by local radio range and peer relation, not the Bluetooth name. Bluetooth, BLE advertisement, NFC, or platform nearby sharing are implementations only when carrying network-like data delivery while the receiver remains online.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              企业 IP 边界没有可路由远端目的地，短距 peer 地址还可能随机化或只在一次会话中存在，使接收者难以与长期攻击基础设施关联。残余包括 radio enable、discoverability、scan/pair/connect、service/profile、发起进程、方向字节和连接失败；有 RF 或物理位置记录时，可以把 peer 出现范围与发送者时间线连接。
            en: >-
              Enterprise IP egress has no routable remote destination, while short-range peer addresses may randomize or exist for one session, making the receiver difficult to connect to long-lived adversary infrastructure. Residuals include radio enablement, discoverability, scan, pair, connect, service or profile, initiating process, directional bytes, and failures. RF or physical-location records can join peer presence to the sender timeline.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求实际短距网络发送或有可执行发送链、未批准 peer，以及外传数据或字节结果。仅发现附近设备、发送 beacon 状态、连接耳机或键盘不证明外传。若设备被当作挂载存储并在断开后搬运，归 T1052；若 Bluetooth PAN 建立独立公网路由，则归兄弟“独立路由次要接口外传”；若只是协议变更而仍走主网，归 T1048。
            en: >-
              Inclusion requires an actual short-range network send or executable send chain, an unapproved peer, and exfiltrated data or byte outcome. Nearby-device discovery, status beaconing, or headset and keyboard connections do not establish exfiltration. A device used as mounted storage and carried after disconnect belongs to T1052. A Bluetooth PAN with independent public routing belongs to sibling Independently Routed Secondary-Interface Egress. A protocol change over the primary network belongs to T1048.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                Flame 的 BeetleJuice 模块能够识别附近 Bluetooth 设备、发布包含状态的 beacon，并被报告可从感染主机传输编码信息。该能力适合攻击者或受控设备在办公室、会议室、酒店或其他短距范围内接收小规模数据。BLEWhisperer 进一步以实验说明 advertisement 可构造低速外传，展示无传统连接流时的可行性与吞吐限制。
              en: >-
                Flame's BeetleJuice module can identify nearby Bluetooth devices, advertise a beacon carrying status, and was reported capable of transmitting encoded information from the infected host. The capability fits receipt by an attacker or controlled device within office, conference room, hotel, or another short-range location. BLEWhisperer experimentally shows that advertisements can form a low-rate exfiltration channel, establishing feasibility and throughput constraints without a conventional connection flow.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要控制发送进程和 radio API，准备兼容接收者并保持其在有效范围内；某些实现还需配对、用户确认或已批准 service/profile。距离、干扰、地址随机化、低吞吐、功耗和接收者暴露是主要限制，较大文件可能需要长时间或多次会话。
                en: >-
                  The adversary needs control of the sender process and radio API, a compatible receiver, and presence within effective range. Some implementations also require pairing, user confirmation, or an approved service or profile. Distance, interference, address randomization, low throughput, power use, and receiver exposure are primary limits, and larger files may require long or repeated sessions.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方假定能获得 adapter 状态、scan/pair/connect/service 日志、peer identity、发起进程、方向字节及批准外设清单，并在高价值区域可选地使用 RF 或物理接近记录。很多平台不会提供完整字节或 peer 稳定标识，因此需要把敏感文件读取、非交互进程和重复短距发送作为组合证据。
                en: >-
                  Defenders are assumed to obtain adapter state, scan, pair, connect, and service logs, peer identity, initiating process, directional bytes, and an approved-peripheral inventory, with optional RF or physical-proximity records in high-value areas. Many platforms lack complete bytes or stable peer identifiers, so sensitive-file reads, non-interactive processes, and repeated short-range sends must be combined.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary:
            zh: 把接收者和发送痕迹分散到短距 peer 会话与物理邻近范围
            en: Distribute receiver and send traces across a short-range peer session and physical proximity
          analysis:
            paragraphs:
              - zh: >-
                  数据通过本地 peer 链路离开主机时，企业网关没有远端 IP 流，接收端身份只出现在 radio 会话并受距离约束。NIST 指出 Bluetooth/NFC 需要邻近接收者且较少被企业机制监测，Flame 和 BLEWhisperer 分别支持恶意功能与技术可行性。防守方必须跨端点进程、peer、方向字节和位置恢复链，因此形成时空释痕。
                en: >-
                  When data leaves over a local peer link, the enterprise gateway has no remote IP flow and receiver identity appears only in a distance-bounded radio session. NIST notes that Bluetooth or NFC requires a nearby receiver and is less likely to be monitored by enterprise mechanisms, while Flame and BLEWhisperer support malicious functionality and technical feasibility respectively. Defenders must reconstruct the chain across endpoint process, peer, directional bytes, and location, producing Spatiotemporal Trace Dilution.
          evidence_keys: [B10-2-T1011-REF-FLAME, B10-2-T1011-REF-NIST-APP30, B10-2-T1011-REF-BLEWHISPERER]
          confidence: medium
      defense_targets: [B10-2-T1011-DET-ALT-PATH, B10-2-T1011-MIT-PATH-GOV]
      research_limitations:
        paragraphs:
          - zh: >-
              Flame 来源证明模块能力但公开文本未给出某起受害事件的发送量、接收设备和成功接收结果；BLEWhisperer 是实验研究而非野外攻击。Bluetooth/NFC/AirDrop 的审计字段在平台间差异很大，不能假定所有端点都有 peer、profile 与方向字节。正式案例证据应继续区分发现、会话、发送和接收四层。
            en: >-
              Flame material establishes module capability but does not provide victim-specific byte volume, receiver device, or successful receipt in the public text. BLEWhisperer is experimental research rather than an incident. Audit fields for Bluetooth, NFC, and AirDrop vary greatly by platform, so peer, profile, and directional bytes cannot be assumed everywhere. Formal case evidence must keep discovery, session, send, and receipt as separate levels.
