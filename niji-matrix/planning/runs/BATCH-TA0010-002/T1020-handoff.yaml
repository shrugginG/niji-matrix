  claims:
    - key: B10-2-T1020-CLM-ADMISSION
      proposition:
        zh: 自动处理只能证明无逐次人工命令的外传方式；若没有独立痕迹重排或观察差异，不能单凭脚本、守护进程或自动上传准入为匿迹子技术。
        en: Automated processing establishes exfiltration without per-item operator commands; without a distinct trace rearrangement or observation difference, a script, daemon, or automatic upload alone does not qualify as a stealth child.
      evidence_keys: [B10-2-T1020-REF-ATTACK, B10-2-T1020-REF-GAMAREDON]
      confidence: high
    - key: B10-2-T1020-CLM-HANDOFF
      proposition:
        zh: 用共享待发对象分离采集插件和上传插件，会把敏感数据访问与外部连接分配给不同进程，并要求以对象身份恢复生产者—消费者—网络谱系，构成独立 Niji 子项。
        en: Separating collection and uploader plugins with a shared pending object assigns sensitive access and external connection to different processes and requires producer-consumer-network lineage by object identity, supporting an independent Niji child.
      evidence_keys: [B10-2-T1020-REF-ATTOR]
      confidence: high
    - key: B10-2-T1020-CLM-REPLICA
      proposition:
        zh: 保持原交付不变而增加到独立 collector 的复制边，使端点没有第二次发送，检测必须关联事件时镜像资源、源流范围和 collector receipt，构成独立 Niji 子项。
        en: Adding a copy edge to an independent collector while preserving original delivery leaves no second endpoint send and requires event-time mirror, source-flow scope, and collector-receipt correlation, supporting an independent Niji child.
      evidence_keys: [REF-000792, REF-000795]
      confidence: medium
    - key: B10-2-T1020-CLM-DETECTION-HANDOFF
      proposition:
        zh: 文件事件的 writer/read process、object identity 与端点网络事件的 initiating process 和目的地可实现跨组件交接检测；只有文件写入或只有连接均不足以证明外传。
        en: Writer and reader process plus object identity from file events can be joined to initiating process and destination from endpoint network events to detect cross-component handoff; a file write or connection alone does not prove exfiltration.
      evidence_keys: [REF-000475, REF-000604, B10-2-T1020-REF-ATTOR]
      confidence: medium
    - key: B10-2-T1020-CLM-DETECTION-REPLICA
      proposition:
        zh: 镜像 create/patch/delete、source/filter/collector 与 collector 接收字节可实现复制外传分级检测；缺少接收证据时仅确认未授权复制能力。
        en: Mirror create, patch, delete, source, filter, collector, and collector receipt bytes enable graded detection of replica exfiltration; without receipt evidence, only unauthorized copy capability is confirmed.
      evidence_keys: [REF-000792, REF-000795]
      confidence: medium
  cases:
    - key: B10-2-T1020-CASE-ATTOR
      actor: Attor operators
      period: observed since at least 2013; report published 2019-10
      event:
        zh: ESET 逆向 Attor 后发现采集插件本身不与网络通信，统一向 Upload 目录写入结果，独立 File uploader 自动将文件上传到 C2；该案例证明跨组件自动交接，不能单独证明所有自动化都会降低检测率。
        en: ESET reverse engineering found that Attor collection plugins do not communicate over the network, write results to a common Upload folder, and rely on a separate File uploader to upload files automatically to C2. The case establishes cross-component automated handoff, not that all automation lowers detection rates.
      evidence_keys: [B10-2-T1020-REF-ATTOR]
      confidence: high
  detection_strategies:
    - key: B10-2-T1020-DET-HANDOFF
      name: {zh: 生产者—待发对象—上传者因果关联, en: Producer–Pending Object–Uploader Causality Correlation}
      objective:
        zh: 跨进程连接敏感数据生产、待发对象交接和外部网络发送，识别未登记的自动外传流水线。
        en: Join sensitive-data production, pending-object handoff, and external network sending across processes to identify unregistered automated exfiltration pipelines.
      detects_keys: [B10-2-T1020-PARENT, B10-2-T1020-CH-HANDOFF]
      analytic_keys: [B10-2-T1020-NJA-HANDOFF]
      domains: [enterprise]
      evidence_keys: [B10-2-T1020-REF-ATTOR, REF-000475, REF-000604]
    - key: B10-2-T1020-DET-REPLICA
      name: {zh: 未授权复制面—收集器接收关联, en: Unauthorized Replica Surface–Collector Receipt Correlation}
      objective:
        zh: 连接网络或云镜像生命周期、源流范围与 collector 接收，区分复制能力、实际接收和敏感内容确认。
        en: Join network or cloud mirror lifecycle, source-flow scope, and collector receipt while separating copy capability, actual receipt, and sensitive-content confirmation.
      detects_keys: [B10-2-T1020-PARENT, B10-2-T1020-CH-REPLICA]
      analytic_keys: [B10-2-T1020-NJA-REPLICA]
      domains: [enterprise]
      evidence_keys: [REF-000792, REF-000795]
  detection_analytics:
    - key: B10-2-T1020-NJA-HANDOFF
      name: {zh: 跨进程待发对象到外部流关联, en: Cross-Process Pending Object to External Flow Correlation}
      strategy_key: B10-2-T1020-DET-HANDOFF
      platforms: [Windows, Linux, macOS]
      logic:
        zh: >-
          以 object identity、path 或 hash 为中心，在 producer 写入后 15 分钟至 24 小时内寻找不同进程对同一对象的读取、移动、重命名或删除，并将 reader 的稳定 process identity 连接到外部网络事件。只有 writer 与 reader 不同、目标不在批准流水线内，且同时存在敏感源目录/采集进程、首次或未批准外部目的地、重复消费同一待发 namespace 中至少一项时升级。输出分为 pending-object-created、handoff-observed、external-send-observed 和 content-sensitive-confirmed，不以目录名或 uploader 名称直接定恶意。
        en: >-
          Center on object identity, path, or hash and, from 15 minutes to 24 hours after producer write, find read, move, rename, or delete of the same object by a different process, then join the reader's stable process identity to an external network event. Elevate only when writer and reader differ, the target is outside an approved pipeline, and at least one of sensitive source directory or collection process, first-seen or unapproved external destination, or repeated consumption from the same pending namespace is present. Output pending-object-created, handoff-observed, external-send-observed, and content-sensitive-confirmed separately; do not classify from directory or uploader name alone.
      data_requirements:
        - source_type: endpoint-file-event
          name: {zh: 端点文件或对象事件, en: Endpoint file or object events}
          channel: Microsoft Defender XDR DeviceFileEvents or equivalent
          required_fields: [Timestamp, DeviceId, ActionType, FileName, FolderPath, SHA1, FileSize, InitiatingProcessUniqueId, InitiatingProcessFileName]
        - source_type: endpoint-network-event
          name: {zh: 端点发起进程网络事件, en: Endpoint initiating-process network events}
          channel: Microsoft Defender XDR DeviceNetworkEvents or equivalent
          required_fields: [Timestamp, DeviceId, RemoteIP, RemoteUrl, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName]
        - source_type: approved-transfer-pipeline
          name: {zh: 批准自动传输流水线清单, en: Approved automated-transfer pipeline inventory}
          channel: change and asset management
          required_fields: [pipeline_id, owner, producer_identity, pending_namespace, uploader_identity, approved_destination, valid_from, valid_to, data_purpose]
      observables:
        - producer writes a pending object and a different reader later accesses it
        - reader process initiates an external connection after object access
        - repeated objects traverse the same unapproved namespace and destination
        - pending object is deleted or marked sent after the network event
      correlation:
        window: 24h with a 15m high-confidence branch
        dimensions: [device_id, object_identity_or_hash, writer_process, reader_process, pending_namespace, destination, pipeline_id]
      false_positives:
        - backup, cloud-sync, telemetry, print-spool, mail-queue, DLP quarantine, and log-shipping pipelines
        - approved security collectors that separate capture and export processes
      blind_spots:
        - memory-only IPC or encrypted containers without stable object identity
        - file-read telemetry disabled or reader hidden behind a system service or shared proxy
        - uploader sends through an already open connection lacking per-object attribution
      tuning_guidance:
        zh: 为合法流水线固定 writer、namespace、reader、目的地与 owner，按对象关系而非进程名白名单；新 writer、新目的地或源目录变化仍应触发复核。先用 15 分钟高置信窗口，按实际队列 SLA 扩展到 24 小时。
        en: Pin writer, namespace, reader, destination, and owner for legitimate pipelines and allowlist relationships rather than process names. A new writer, destination, or source-directory change remains reviewable. Start with a 15-minute high-confidence window and extend to 24 hours according to real queue SLAs.
      evidence_keys: [B10-2-T1020-REF-ATTOR, REF-000475, REF-000604]
    - key: B10-2-T1020-NJA-REPLICA
      name: {zh: 镜像生命周期—源流—收集器接收关联, en: Mirror Lifecycle–Source Flow–Collector Receipt Correlation}
      strategy_key: B10-2-T1020-DET-REPLICA
      platforms: [IaaS, Network Devices]
      logic:
        zh: >-
          对 mirror create、patch、enable、disable 和 delete 保存事件时 old/new state，规范 actor、source resources、filter、collector 与 request/mirror ID。将镜像有效期同源流目录相交，再连接 collector interface 的 packet/byte receipt。未经批准的镜像先报告 replica-capability；有匹配接收时升为 replica-received；只有受限内容评估或可证明的敏感源范围才报告 sensitive-replica-risk。对象删除后的空现态不能关闭历史告警。
        en: >-
          Preserve event-time old and new state for mirror create, patch, enable, disable, and delete and normalize actor, source resources, filter, collector, and request or mirror ID. Intersect mirror validity with source-flow inventory and join collector-interface packet and byte receipt. Report an unapproved mirror first as replica-capability, raise to replica-received on matching receipt, and report sensitive-replica-risk only with restricted content assessment or a demonstrably sensitive source scope. Empty current state after deletion does not close historical findings.
      data_requirements:
        - source_type: mirror-control-plane-audit
          name: {zh: 镜像控制面审计, en: Mirror control-plane audit}
          channel: cloud Admin Activity, switch AAA/configuration log, or equivalent
          required_fields: [timestamp, platform, tenant_or_network, request_id, actor_id, operation, mirror_id, source_resources, filter, collector_target, old_state, new_state, outcome]
        - source_type: mirror-collector-flow
          name: {zh: 镜像收集器接收流, en: Mirror collector receipt flow}
          channel: VPC flow, switch telemetry, collector interface counters, or equivalent
          required_fields: [timestamp, tenant_or_network, mirror_id_or_encapsulation_key, source_resource, collector_target, collector_interface, packet_count, byte_count, flow_id]
        - source_type: source-flow-inventory
          name: {zh: 源流范围目录, en: Source-flow scope inventory}
          channel: flow metadata and asset classification
          required_fields: [timestamp, source_resource, flow_id, source, destination, protocol_family, data_or_service_classification]
        - source_type: mirror-approval-inventory
          name: {zh: 批准镜像清单, en: Approved mirror inventory}
          channel: change management
          required_fields: [ticket_id, mirror_id, owner, source_scope, filter_scope, collector_target, valid_from, valid_to, data_purpose, retention_policy]
      observables:
        - mirror targets an unowned, cross-project, cross-network, or first-seen collector
        - source scope covers sensitive service or broad subnet beyond approved filter
        - collector receives matching encapsulated bytes during mirror validity
        - short-lived mirror is deleted after receipt without a matching ticket
      correlation:
        window: full mirror validity plus 7d after delete; 15m fallback when mirror ID is absent
        dimensions: [platform, tenant_or_network, request_id, mirror_id, actor_id, source_resource, filter, collector_target, flow_id, ticket_id]
      false_positives:
        - approved NDR or IDS, compliance monitoring, troubleshooting, capacity analysis, and migration validation
      blind_spots:
        - physical taps or provider-internal copies invisible to tenant audit
        - compromised control plane that deletes audit or an approved collector that is itself compromised
        - asymmetric routing or missing encapsulation key prevents source-to-collector join
      tuning_guidance:
        zh: 为每个批准镜像固定 owner、source/filter、collector、用途、到期和保留策略；跨项目目标、广源范围和无自动到期提高严重度。内容确认留在受限取证环境，通用分析只处理资源与流元数据。
        en: Pin owner, source and filter, collector, purpose, expiration, and retention for every approved mirror; raise severity for cross-project targets, broad source scope, and no automatic expiry. Keep content confirmation in a restricted forensic environment while general analytics process resource and flow metadata only.
      evidence_keys: [REF-000792, REF-000795]
  mitigations:
    - key: B10-2-T1020-MIT-AUTOMATED-EGRESS
      name: {zh: 自动外传流水线与复制面治理, en: Automated Egress Pipeline and Replica-Surface Governance}
      description:
        zh: 限制能够生产、消费和外送待发数据的关系，并对镜像复制边实施分权、固定 collector、到期和独立审计，使自动化不能静默跨越对象或控制面边界。
        en: Constrain relationships allowed to produce, consume, and send pending data and govern mirror copy edges with separated authority, pinned collectors, expiry, and independent audit so automation cannot silently cross object or control-plane boundaries.
      domains: [enterprise]
      measures:
        - key: approved-pipeline-manifest
          name: {zh: 自动传输流水线关系清单, en: Automated transfer pipeline relationship manifest}
          control_type: governance
          description:
            zh: 为合法备份、同步、日志和邮件流水线登记 owner、生产者、待发 namespace、消费者、目的地、数据类别、重试/删除语义与有效期，变更任一关系均需审批并进入审计。
            en: Register owner, producer, pending namespace, consumer, destination, data class, retry or deletion semantics, and validity for legitimate backup, sync, logging, and mail pipelines, requiring approval and audit for any relationship change.
        - key: pending-object-least-privilege
          name: {zh: 待发对象生产与消费最小权限, en: Least privilege for pending-object production and consumption}
          control_type: exposure-reduction
          description:
            zh: 将写入、读取、删除和外送权限分别授予指定服务身份，阻止普通采集进程直接访问外部目的地，并阻止未登记 uploader 读取敏感待发区。
            en: Grant write, read, delete, and egress permissions separately to named service identities, preventing ordinary collection processes from direct external access and unregistered uploaders from reading sensitive pending areas.
        - key: mirror-authority-separation
          name: {zh: 镜像权限分离与 collector 固定, en: Mirror authority separation and collector pinning}
          control_type: preventive
          description:
            zh: 将 mirror create/update/delete 与 collector 管理分权，采用 JIT、双人批准、固定安全项目或端口、最小 source/filter、自动到期并禁止未知跨项目目标。
            en: Separate mirror create, update, and delete from collector administration and use JIT, dual approval, pinned security projects or ports, minimum source and filter scope, automatic expiry, and denial of unknown cross-project targets.
        - key: independent-lifecycle-audit
          name: {zh: 独立流水线与镜像生命周期审计, en: Independent pipeline and mirror lifecycle audit}
          control_type: detective-support
          description:
            zh: 将文件/对象交接、服务身份、外部连接、网络设备 AAA 命令、镜像资源版本与 collector receipt 发送到相关执行主体不能同时修改的日志域，并保留已删除对象。
            en: Send file or object handoff, service identity, external connection, network-device AAA commands, mirror-resource versions, and collector receipt to a log domain that relevant execution principals cannot modify simultaneously, retaining deleted objects.
        - key: revoke-and-preserve
          name: {zh: 未授权流水线或复制面的撤销与保全, en: Revoke and preserve unauthorized pipelines or replica surfaces}
          control_type: containment
          description:
            zh: 确认未授权自动外传后先保全 object identity、配置版本、流量与 collector 证据，再撤销 uploader 令牌、待发读取权、镜像资源和 collector 路由，并核查已经发送的数据范围。
            en: After confirming unauthorized automated exfiltration, preserve object identity, configuration versions, flows, and collector evidence before revoking uploader tokens, pending-area read access, mirror resources, and collector routing, then assess the data already sent.
      applications:
        - target_key: B10-2-T1020-PARENT
          use:
            zh: 把所有合法自动外传表示为可审核的 producer/source—trigger—processor—destination 关系，并要求外部发送经受管出口或受管复制面。
            en: Represent every legitimate automated transfer as an auditable producer or source, trigger, processor, and destination relationship and require external sending through managed egress or managed replica surfaces.
          expected_effect:
            zh: 未登记的自动处理不能仅凭脚本、服务身份或业务时段获得外送权限，重复关系和配置变化保留可调查痕迹。
            en: Unregistered automated processing cannot gain egress solely through a script, service identity, or business hour, while recurring relationships and configuration changes retain investigable traces.
          limitations:
            zh: 已批准流水线或 collector 被攻陷后仍可能外传，且过严关系约束会影响弹性扩缩容与故障恢复。
            en: A compromised approved pipeline or collector can still exfiltrate, and strict relationship controls may impair elastic scaling and recovery.
        - target_key: B10-2-T1020-CH-HANDOFF
          use:
            zh: 固定允许写入待发区的 producer、允许读取的 uploader 和批准目的地，并为新增 writer、reader 或 destination 建立变更门与短期高强度审计。
            en: Pin producers allowed to write the pending area, uploaders allowed to read it, and approved destinations, with change gates and short-term heightened audit for every new writer, reader, or destination.
          expected_effect:
            zh: 攻击者必须破坏至少一个登记关系或服务身份才能把敏感对象交给外送组件，跨进程流水线更易形成确定性差分。
            en: The adversary must violate at least one registered relationship or service identity to hand sensitive objects to an egress component, creating a more deterministic cross-process differential.
          limitations:
            zh: 合法 uploader 被劫持或待发对象仅存在内存时控制效果下降；内容加密会限制数据类别判断。
            en: Effect falls when a legitimate uploader is hijacked or the pending object exists only in memory; encryption limits data-class judgment.
        - target_key: B10-2-T1020-CH-REPLICA
          use:
            zh: 将镜像创建与 collector 管理分权，只允许固定项目或端口接收副本，并为 source/filter、owner、用途和到期建立必填约束。
            en: Separate mirror creation from collector administration, allow copies only to pinned projects or ports, and require source and filter, owner, purpose, and expiration constraints.
          expected_effect:
            zh: 任意复制边更难被静默建立，短时镜像、广源范围和异常 collector 进入不可变控制面审计。
            en: Arbitrary copy edges become harder to establish silently, and short-lived mirrors, broad source scope, and anomalous collectors enter immutable control-plane audit.
          limitations:
            zh: 物理 TAP、固件级复制、云提供方内部行为或合法 collector 被控不受租户 IAM 充分阻止。
            en: Physical taps, firmware-level copying, provider-internal behavior, and compromise of an approved collector are not fully prevented by tenant IAM.
      evidence_keys: [REF-000792, REF-000795, REF-000475, REF-000604]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 1
    attack_subtechnique_ids: [T1020.001]
    represented_dimensions:
      - network_or_cloud_traffic_mirroring_that_automates_copy_delivery
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_child_id: T1020.001
        resolution: niji-variable-candidate
        explanation:
          zh: 其镜像资料支持“原路径不变而增加独立复制边”的 Niji 变量，但名称、父子结构和 ATT&CK 分类不被导入。
          en: Its mirroring material supports the Niji variable of an independent copy edge with unchanged original delivery; its name, parent-child structure, and ATT&CK taxonomy are not imported.
    candidate_stealth_axes_examined:
      - axis: producer_uploader_separation_by_pending_object
        resolution: formal_candidate
        evidence_keys: [B10-2-T1020-REF-ATTOR]
      - axis: original_path_preserving_replica_edge
        resolution: formal_candidate
        evidence_keys: [REF-000792, REF-000795]
      - axis: same_process_rule_matched_automatic_upload
        resolution: parent-core
        evidence_keys: [B10-2-T1020-REF-GAMAREDON, B10-2-T1020-REF-CRUTCH]
        reason: 自动规则证明触发效率，但未形成跨主体或跨观察面的稳定防守差异。
      - axis: scheduled_or_periodic_automation
        resolution: adjacent-technique
        reason: 时钟或周期变量属于 T1029；自动化可共存但不改变归属。
      - axis: size_or_rate_aware_automation
        resolution: adjacent-technique
        reason: 受控量为每次或单位时间字节，属于 T1030。
      - axis: channel_or_medium_selection
        resolution: adjacent-technique
        reason: C2、替代协议、Web 服务、其他网络与物理介质由对应外传候选负责。
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线只有一个 ATT&CK 子项，但开放检查了待发交接、复制边、同进程规则上传、周期、规模与通道六类轴；只有前两项同时通过稳定变量、痕迹变化、观察差异、证据和防御差异门禁。
      en: The fixed baseline has one ATT&CK child, but the review examined pending handoff, copy edge, same-process rule upload, cadence, volume, and channel axes. Only the first two pass stable-variable, trace-change, observation-difference, evidence, and defense-difference gates.
  evidence_coverage:
    parent_behavior_keys: [B10-2-T1020-REF-ATTACK, B10-2-T1020-REF-GAMAREDON, B10-2-T1020-REF-CRUTCH]
    boundary_keys: [B10-2-T1020-REF-GAMAREDON, B10-2-T1020-REF-ATTOR, REF-000792]
    mechanism_support:
      - mechanism_ref: NM-ST
        evidence_keys: [B10-2-T1020-REF-ATTOR]
        strength: direct_cross_component_architecture
      - mechanism_ref: NM-BT
        evidence_keys: [REF-000792, REF-000795]
        strength: observed_actor_mirroring_plus_auditable_platform_semantics
    child_existence_support:
      - child_key: B10-2-T1020-CH-HANDOFF
        evidence_keys: [B10-2-T1020-REF-ATTOR]
        strength: direct_reverse_engineering
      - child_key: B10-2-T1020-CH-REPLICA
        evidence_keys: [REF-000792, REF-000795]
        strength: incident_capability_plus_official_control_plane_semantics
    unsupported_or_deferred:
      - 自动化本身的匿迹效果没有统一证据，普通脚本或守护进程上传不得单独形成子项。
      - 同进程按扩展名、新文件或目录规则上传保留为父级核心，除非新增证据证明独立观察差异。
      - 镜像配置不等于完成外传；缺少 collector receipt 时只确认复制能力。
      - ATT&CK DET0397 把周期脚本作为自动外传检测线索，但周期归 T1029，不能作为 T1020 独立分类依据。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项和两项子项分别覆盖定义、匿迹特性、纳入/排除、相邻边界、场景、攻防模型、机理、证据与特定限制；未把工具、插件名、协议或 ATT&CK 子项作为 Niji 分类边界。
      en: The parent and both children cover definition, stealth properties, inclusion and exclusion, adjacent boundaries, scenario, attacker and defender models, mechanism, evidence, and specific limitations. Tools, plugin names, protocols, and the ATT&CK child are not used as Niji taxonomy boundaries.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, syntax validation, temporary-key audit]
  limitations:
    paragraphs:
      - zh: >-
          自动化与匿迹没有必然关系。Gamaredon 同时具备自动扫描和上传能力，却被研究者描述为追求快速扩散和外传而几乎不努力隐藏；因此正式判断必须证明痕迹跨边界分离，而不能从“automatic”“script”或“daemon”字样推断意图。Attor 提供强架构证据但不量化检测规避率，跨平台推广依赖通用对象交接语义。
        en: >-
          Automation has no necessary relationship to stealth. Gamaredon used automated scan and upload capabilities yet was described as prioritizing rapid spread and exfiltration with little effort to remain hidden. Formal judgment must therefore establish trace separation across boundaries rather than infer intent from the words automatic, script, or daemon. Attor provides strong architectural evidence but no measured evasion rate, and cross-platform extension relies on general object-handoff semantics.
      - zh: >-
          复制观察面证据必须区分配置、接收与内容结果。联合通告证明行为者在受侵网络设备使用 PCAP 和 SPAN/RSPAN/ERSPAN，Google 文档证明云镜像审计字段；二者不共同证明每次复制都向攻击者交付敏感明文。合法监控背景极强，严格准入需要未经批准的 actor/source/filter/collector 关系和实际接收，内容敏感度另行确认。
        en: >-
          Replica evidence must distinguish configuration, receipt, and content outcome. The joint advisory establishes actor use of PCAP and SPAN, RSPAN, and ERSPAN on compromised network devices, while Google documentation establishes cloud-mirror audit semantics. Together they do not prove that every copy delivered sensitive plaintext to an adversary. Authorized-monitoring background is strong, so strict admission needs an unapproved actor, source, filter, or collector relationship plus actual receipt, with content sensitivity confirmed separately.
      - zh: >-
          DeviceFileEvents 和 DeviceNetworkEvents 支持对象与发起进程字段，但具体产品覆盖、读取事件可用性和连接字节字段必须在部署中验证。共享代理、长期连接、内存队列与加密容器会降低文件到网络的归因。所有 Analytic 阈值需按合法队列 SLA 和镜像工单基线调整，不把单点变成外传结论。
        en: >-
          DeviceFileEvents and DeviceNetworkEvents support object and initiating-process fields, but product coverage, read-event availability, and connection-byte fields must be validated in deployment. Shared proxies, long-lived connections, memory queues, and encrypted containers weaken file-to-network attribution. Analytic windows and thresholds require tuning to legitimate queue SLAs and mirror approvals, and no point signal should become an exfiltration conclusion.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: Compression, encryption, file naming, and content transformation may accompany automation but are not caused by the automated trigger or handoff variable.
    - mechanism_ref: NM-FD
      reason: Use of Dropbox, FTP, C2, browser processes, or other legitimate-looking channels belongs to channel or execution camouflage unless timing-independent automation itself changes visible features.
  open_questions:
    - 主 Agent 需决定 CASE-000256 是否按不变事件语义 extend 到复制外传子项，或为 TA0010 拆分只描述交付结果的新案例。
    - 跨候选集成时应核对 T1041/T1048/T1567 是否已拥有出站许可或 DLP 缓解；只有控制概念与措施完全相同时复用，逐目标 application 必须另写。
integration:
  status: pending
  resolutions: []
