handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-002
work_item_ref: WORK-TA0010-T1020
temporary_key_prefix: B10-2-T1020
candidate:
  source_type: attack
  source_attack_id: T1020
  name:
    zh: 自动化数据渗出
    en: Automated Exfiltration
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 将 T1020 定义为在 Collection 后通过自动处理外传数据，并列出一个“Traffic Duplication”子项。自动化本身主要说明处理方式和规模能力，并不当然构成匿迹；ESET 对 Gamaredon 的研究既记录自动上传，也明确指出该组织几乎不努力保持低可见性。Niji 因此保留父行为但收紧为：自动选择、触发、交接或复制必须有意造成可论证的痕迹重排或防守观察差异，才能作为正式匿迹技术，故建议 adapt。
        en: >-
          ATT&CK Enterprise 19.1 defines T1020 as exfiltrating data through automated processing after Collection and lists one Traffic Duplication child. Automation by itself primarily describes processing and scale and does not inherently create stealth; ESET's Gamaredon research documents automatic upload while explicitly observing that the group made little effort to stay under the radar. Niji therefore keeps the parent behavior but narrows it to automated selection, triggering, handoff, or replication that deliberately creates a defensible change in traces or defender observation, supporting an adapt decision.
      - zh: >-
          现有证据支持两项独立 Niji 变量。Attor 将无网络能力的采集插件、共享 Upload 文件夹与独立 File uploader 串成自动流水线，使数据取得与外部连接落在不同进程和存储边界；国家机构联合通告与 Google Cloud 审计语义则支持不改变原通信交付、由网络或云控制面建立复制边并向独立收集器交付副本。按时间重复、传输大小以及通道或介质选择分别属于 T1029、T1030 与相邻通道候选，不能借“自动”合并。
        en: >-
          Available evidence supports two independent Niji variables. Attor joins collection plugins with no network capability, a shared Upload folder, and a separate File uploader into an automated pipeline, placing acquisition and external connection in different process and storage boundaries. A joint government advisory and Google Cloud audit semantics support a separate copy edge created in network or cloud control planes without changing delivery on the original path. Repetition by time, transfer size, and channel or medium choice belong to T1029, T1030, and adjacent channel candidates respectively and cannot be collapsed under automation.
proposed_content:
  summary:
    zh: 攻击者让数据选择、待发交接或流量复制自动驱动外传，并利用跨进程或跨控制面的痕迹分离降低完整外传链的可见性。
    en: Adversaries automate data selection, pending-data handoff, or traffic replication for exfiltration and use trace separation across processes or control planes to reduce visibility of the complete egress chain.
  definition_and_concept:
    paragraphs:
      - zh: >-
          自动化数据渗出是攻击者预置规则、状态条件或复制配置，使已经收集或正在经过受控基础设施的数据无需每次人工命令即可被选择、交接并发送到受害环境之外。直接目标是形成可持续的外传流程；Niji 关注的是自动流程如何把数据取得、待发状态、传输主体和外部接收分散到不同观察面，而不是把所有脚本上传都解释为匿迹。
        en: >-
          Automated Exfiltration uses preset rules, state conditions, or replication configuration so collected data or data traversing controlled infrastructure can be selected, handed off, and sent outside the victim environment without a fresh operator command for every item. Its direct goal is a sustainable egress process. Niji focuses on how automation distributes acquisition, pending state, transfer principal, and external receipt across observation planes rather than treating every scripted upload as stealth.
      - zh: >-
          “自动化”描述触发与处理关系，不决定 HTTP、FTP、C2、云服务、其他网络介质或物理介质，也不决定何时发送或每次发送多少。固定周期是 T1029 的时间变量，分块或速率是 T1030 的规模变量，具体通道仍归相应 Exfiltration 候选。操作系统计划任务、守护进程、插件或云 API 只是实现；若没有独立的痕迹与观察差异，留在父级核心而不形成 Niji 子项。
        en: >-
          Automation describes trigger and processing relationships; it does not determine HTTP, FTP, C2, cloud service, another network medium, or physical media, nor does it determine when or how much is sent. A fixed cadence is T1029's timing variable, chunking or rate is T1030's volume variable, and the concrete channel remains with its corresponding Exfiltration candidate. OS tasks, daemons, plugins, and cloud APIs are implementations. Without a distinct trace and observation difference, they remain parent-core rather than becoming Niji children.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          跨组件自动交接使采集进程只写本地待发区，由另一进程读取并产生网络连接；单看采集端看不到外传，单看上传端又可能看不到原始敏感数据访问。复制观察面则保留原流的目的地、响应和端点行为，同时从网络设备或云控制面增加到独立收集器的副本，源端点不产生第二次发送。两者都把完整因果链拆散到默认不相连的数据域。
        en: >-
          Cross-component automated handoff lets collection processes write only to a local pending area while another process reads it and creates the network connection. Collection telemetry lacks egress, while uploader telemetry may lack the original sensitive-data access. A replicated observation plane preserves the original flow's destination, response, and endpoint behavior while adding a copy from a network-device or cloud control plane to an independent collector, with no second send by the source endpoint. Both split one causal chain across data domains that are not joined by default.
      - zh: >-
          自动化并不消除痕迹。待发文件的创建、读取与清空，进程间稳定的目录或对象交接，上传进程到外部目的地的连接，镜像资源 create/patch/delete、源范围、过滤器、collector 目标和接收字节仍可关联。普通脚本还可能因规模、频率或错误重试变得更显眼；只有在防守方缺少跨进程对象谱系或跨控制面审计时，上述分离才产生匿迹优势。
        en: >-
          Automation does not erase traces. Creation, read, and draining of pending files; stable directory or object handoff between processes; uploader connections to external destinations; and mirror create, patch, delete, source scope, filters, collector target, and receipt bytes remain correlatable. Ordinary scripts may become more conspicuous through scale, frequency, or failed retries. The separation produces a stealth advantage only when defenders lack cross-process object lineage or cross-control-plane audit.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求存在攻击者控制的自动外传规则或状态转换、实际外送或可执行的外送链，以及自动化造成的痕迹位置变化或观察差异。仅使用批处理、脚本、守护进程或任务调度不够；合法备份、遥测、邮件投递、云同步、NDR 镜像和故障诊断都可能具有相同自动形态，必须结合未授权所有者、数据来源、目的地、配置变更、批准窗口与结果判断。
        en: >-
          Inclusion requires an attacker-controlled automated egress rule or state transition, actual outward transfer or an executable outward chain, and a trace-location or observation difference caused by automation. Use of a batch file, script, daemon, or scheduler alone is insufficient. Legitimate backup, telemetry, mail delivery, cloud synchronization, NDR mirroring, and troubleshooting can have the same automated form and must be distinguished using unauthorized ownership, data source, destination, configuration change, approval window, and outcome.
      - zh: >-
          发现文件后由同一脚本立即上传只证明父级自动化；如果没有跨主体、跨对象或跨观察面的独立差异，不单列子项。按十分钟运行的脚本同时可能属于 T1029，但周期不属于本候选；限制字节或带宽属于 T1030；经 C2、替代协议、Web 服务、其他网络或物理介质的实现分别归对应候选。镜像只有在副本被送至独立收集目标时才进入外传范围，本地诊断抓包而无外送只构成观察或收集能力。
        en: >-
          Immediate upload by the same script after finding a file establishes parent-level automation only. It does not form a child without a distinct cross-principal, cross-object, or cross-observation-plane difference. A script running every ten minutes may also map to T1029, but cadence is outside this candidate; byte or bandwidth limits belong to T1030; implementations over C2, alternative protocol, web service, another network, or physical media belong to their respective candidates. Mirroring enters Exfiltration only when the copy is delivered to an independent collection target. Local diagnostic capture without outward delivery establishes observation or collection capability only.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在端点间谍平台中，键盘记录、截图、音频或文档采集插件可以只把结果写入统一待发目录，由独立上传组件自动消费并经既定通道外送；Attor 直接展示了这种架构。攻击者也可在长期文件窃取中维护“已上传”状态，只处理新出现或匹配规则的文档，但这种筛选若仍由同一进程直接上传，属于父级核心，不能仅因规则自动化形成子项。
          en: >-
            In an endpoint espionage platform, keylogging, screenshot, audio, or document-collection plugins can write results only to a common pending directory while a separate uploader automatically consumes them over an established channel; Attor directly demonstrates this architecture. An adversary can also maintain uploaded-file state during long-running theft and process only new or rule-matching documents. When one process still performs direct upload, that filtering remains parent-core and does not become a child merely because the rule is automated.
        - zh: >-
            在受侵交换机、路由器或 IaaS 控制面中，攻击者可选择接口、实例、子网或过滤器，把经过原路径的流量复制到受控 collector。原业务会话继续成功，不需要端点植入体逐个读取并上传文件。联合机构通告记录了国家支持行为者在受侵设备上使用 SPAN/RSPAN/ERSPAN 与 PCAP 能力；Google Cloud 文档则证明镜像资源的生命周期和审计方法可实现。
          en: >-
            In a compromised switch, router, or IaaS control plane, an adversary can select interfaces, instances, subnets, or filters and copy traffic traversing the original path to a controlled collector. The business session continues successfully without an endpoint implant reading and uploading each file. A joint agency advisory records state-sponsored use of SPAN, RSPAN, ERSPAN, and PCAP capability on compromised devices, while Google Cloud documentation establishes implementable mirror-resource lifecycle and audit methods.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              跨组件交接要求攻击者能部署或控制至少一个数据生产组件、共享待发对象和上传组件，并维持对象命名、权限、重试与清理语义。若待发目录被隔离、生产者不能写入或上传者不能读取，流水线中断。复制观察面要求修改交换镜像、设备抓包/导出或云 Packet Mirroring 的权限、可接收副本的 collector，以及对源范围和路由的了解；加密流量还可能只能得到不可解释的密文。
            en: >-
              Cross-component handoff requires control of at least one data-producing component, a shared pending object, and an uploader, together with object naming, permissions, retry, and cleanup semantics. The pipeline fails if the pending area is isolated, producers cannot write, or the uploader cannot read. A replicated observation plane requires authority to change switch mirroring, device capture or export, or cloud Packet Mirroring; a collector able to receive copies; and knowledge of source scope and routing. Encrypted flows may yield only uninterpretable ciphertext.
          - zh: >-
              自动化减少逐次操作，但增加固定配置与重复关系。攻击者必须保护规则、队列、令牌、collector 和错误状态，避免积压、重复上传或异常字节放大。镜像若覆盖过宽会增加带宽和 collector 成本，跨项目或外部目标也更易被控制面审计发现。
            en: >-
              Automation reduces per-item operation but creates fixed configuration and recurring relationships. The adversary must protect rules, queues, tokens, collectors, and error state while avoiding backlog, duplicate upload, or anomalous byte amplification. An overly broad mirror increases bandwidth and collector cost, and cross-project or external targets are more visible in control-plane audit.
      defender_model:
        paragraphs:
          - zh: >-
              端点侧假定防守方能保留文件/对象创建与读取、进程身份和网络连接，并用稳定 process GUID、object identity、hash/path、时间和目的地连接生产者—待发区—上传者。网络与云侧假定保存镜像资源事件时版本、actor、source/filter、collector、批准工单及 collector receipt。没有原发字节或 collector 接收证据时，只能确认连接或复制能力，不能直接宣称数据已外传。
            en: >-
              On endpoints, defenders are assumed to retain file or object create and read events, process identity, and network connections and to join producer, pending area, and uploader using stable process GUID, object identity, hash or path, time, and destination. On network and cloud control planes, defenders retain event-time mirror versions, actor, source and filter, collector, approval record, and collector receipt. Without originator bytes or collector receipt evidence, a finding confirms connection or copy capability rather than completed exfiltration.
          - zh: >-
              EDR 未记录文件读取、临时对象只存在内存、共享代理抹去源进程、网络设备未启用 AAA 命令记账、控制面审计可被删除、物理 TAP 或云提供方内部复制都会形成盲区。合法备份、DLP、NDR 与同步服务造成高相似背景，因此基线必须记录 owner、源数据、可执行主体、目的地、生命周期和保留目的，而不能仅对白名单进程名放行。
            en: >-
              Blind spots include EDR without file-read events, memory-only pending objects, shared proxies that erase process provenance, network devices without AAA command accounting, deletable control-plane audit, physical taps, and provider-internal copies. Authorized backup, DLP, NDR, and synchronization services create highly similar background, so baselines must record owner, source data, executable principal, destination, lifecycle, and retention purpose rather than allowlisting process names alone.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 将数据取得与外部发送分散到不同组件和对象边界
        en: Distribute data acquisition and external sending across component and object boundaries
      analysis:
        paragraphs:
          - zh: >-
              攻击者让采集插件只写共享待发区，独立 uploader 再读取并外送，使敏感读取与网络连接不再由同一进程在同一短窗口内完成。Attor 的采集插件无网络能力，文件由中央 Upload 文件夹交给 File uploader 自动发送，直接支持这条链。痕迹没有消失，而是被拆成 producer write、uploader read 和 outbound flow；缺少跨进程对象谱系的防守方难以还原完整外传。
            en: >-
              The adversary makes collection plugins write only to a shared pending area and lets a separate uploader read and send it, so sensitive access and network connection no longer occur in one process and one short window. Attor's collection plugins lack network capability and place files in a central Upload folder for automatic sending by the File uploader, directly supporting this chain. Traces are split into producer write, uploader read, and outbound flow rather than erased; a defender without cross-process object lineage has difficulty reconstructing the complete exfiltration.
      evidence_keys: [B10-2-T1020-REF-ATTOR]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 复制分支外送数据而保持原通信端点行为与交付正常
        en: Send data over a copy branch while original endpoint behavior and delivery remain normal
      analysis:
        paragraphs:
          - zh: >-
              交换或云镜像增加一条到独立 collector 的复制边，原端点仍向原目的地发送并收到正常响应，因此端点进程、会话目标和应用结果没有第二次外传动作。异常痕迹转移到镜像控制面、封装流和 collector 接收。CISA 联合通告记录行为者使用 SPAN/RSPAN/ERSPAN，Google Cloud 明确记录 packetMirrorings insert、patch 与 delete；只有把这些数据域相连，才能从“业务路径正常”恢复额外复制结果。
            en: >-
              Switch or cloud mirroring adds a copy edge to an independent collector while the source endpoint continues sending to its original destination and receives a normal response. Endpoint process, session destination, and application result contain no second exfiltration action. Anomaly traces move to the mirror control plane, encapsulated flow, and collector receipt. The joint CISA advisory records actor use of SPAN, RSPAN, and ERSPAN, while Google Cloud explicitly logs packetMirrorings insert, patch, and delete. Only correlation across these domains recovers the extra copy from an otherwise normal business path.
      evidence_keys: [REF-000792, REF-000795]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            两个子项分别固定自动外传中的“数据生产者与外送主体是否由待发对象分离”和“原始数据路径是否保持不变而增加独立复制边”。前者的残余是跨进程文件/对象交接和上传者连接，需要 producer—object—consumer 谱系；后者的残余是镜像资源与 collector 接收，需要控制面—数据面关联。二者可同时存在，但其身份、数据和缓解控制不同，边界不按工具、协议、平台或 ATT&CK 子项名称建立。
          en: >-
            The two children fix whether a pending object separates data producer from egress principal and whether the original data path remains unchanged while an independent copy edge is added. The first leaves cross-process file or object handoff and uploader connections and needs producer-object-consumer lineage. The second leaves mirror resources and collector receipt and needs control-plane-to-data-plane correlation. They can coexist, but their identities, data, and mitigations differ. Boundaries do not follow tools, protocols, platforms, or ATT&CK child names.
        - zh: >-
            同进程按扩展名或“新文件”规则直接上传、普通批处理脚本及守护进程重复发送都留在父级核心，除非另有可证明的分离变量。按固定时刻释放归 T1029，按大小或速率调节归 T1030。固定基线的 T1020.001 被解析为复制边行为证据，其名称和分类没有导入 Niji。
          en: >-
            Direct same-process upload based on extension or new-file rules, ordinary batch scripts, and repeated daemon sends remain parent-core unless another supported separation variable exists. Fixed-time release belongs to T1029 and size or rate shaping to T1030. Fixed-baseline T1020.001 is resolved as evidence for copy-edge behavior; its name and taxonomy are not imported into Niji.
    coverage: established
    proposed_child_keys: [B10-2-T1020-CH-HANDOFF, B10-2-T1020-CH-REPLICA]
proposed_subtechniques:
  - temporary_key: B10-2-T1020-CH-HANDOFF
    name:
      zh: 跨组件待发交接
      en: Cross-Component Pending-Data Handoff
    stable_variable: producer_and_egress_principal_separated_by_pending_object
    trace_change: sensitive_access_ends_at_shared_object_and_separate_uploader_creates_external_flow
    defender_effect: no_single_process_contains_both_collection_and_egress_and_cross_process_object_lineage_is_required
    prerequisites: attacker_controls_producer_pending_namespace_and_uploader
    evidence_keys: [B10-2-T1020-REF-ATTOR]
    confidence: high
    proposed_content:
      summary:
        zh: 采集组件把数据写入共享待发对象，由独立上传组件自动消费并外送，使敏感访问与网络出站分属不同进程。
        en: Collection components write data to a shared pending object that a separate uploader automatically consumes and sends outward, placing sensitive access and network egress in different processes.
      definition_and_concept:
        paragraphs:
          - zh: >-
              跨组件待发交接是数据生产者完成采集后只写入目录、文件、数据库队列或等价对象，由另一个具有网络能力的组件基于对象出现或状态变化自动接管外送。直接目标是持续外传，稳定变量是生产主体与外送主体被待发对象分离，而不是目录名称、插件产品或使用的协议。
            en: >-
              Cross-Component Pending-Data Handoff occurs when a data producer completes collection by writing to a directory, file, database queue, or equivalent object, after which another network-capable component automatically takes over outward transfer based on object appearance or state. The direct goal is sustained exfiltration. Its stable variable is separation of producer and egress principal by a pending object, not directory name, plugin product, or protocol.
          - zh: >-
              单一脚本在同一执行流中扫描并上传文件不属于本子项，即使它完全自动；存在多个进程也不够，必须证明待发对象承担可重复的生产者—消费者交接。按时间才释放对象时可另映射 T1029，但本子项的触发边界是对象状态而非时钟。
            en: >-
              One script that scans and uploads within the same execution flow does not enter this child even when fully automatic. Multiple processes alone are also insufficient; a pending object must serve as a repeatable producer-consumer handoff. If release is additionally time gated, T1029 may apply, while this child's trigger boundary remains object state rather than the clock.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              跨组件待发交接使采集插件无需拥有外部 socket，上传组件也不必直接访问原始用户目录或捕获设备。短窗口或单进程检测因此只能看到“本地写入”或“后台上传”中的一半；Attor 还把网络相关功能分布到多个插件，进一步增加局部归因难度。共享对象的创建者、后继读取者、hash/大小、清空时间和上传连接仍是可恢复痕迹。
            en: >-
              Cross-Component Pending-Data Handoff removes the need for collection plugins to own an external socket and for the uploader to access original user directories or capture devices directly. A short-window or single-process detector therefore sees only a local write or a background upload. Attor further distributes network functions across several plugins, increasing local attribution difficulty. Creator, successor reader, hash or size, drain time, and uploader connection remain recoverable traces.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求生产者、待发对象和上传者三者关系可识别，且上传者把对象交付到受害环境之外。排除合法应用的 spool、备份、日志 shipper、云同步和 DLP quarantine，除非 owner、数据用途、目的地或变更关系支持恶意。内存管道和 IPC 可以是待发对象，但如果遥测无法证明其内容或交接，只能标为假设。打包、加密和 C2/FTP/Tor 通道属于相邻对象，不定义本子项。
            en: >-
              Inclusion requires an identifiable producer, pending object, and uploader relationship and delivery of that object outside the victim environment. Legitimate application spools, backup, log shippers, cloud sync, and DLP quarantine are excluded unless owner, data purpose, destination, or change relationship supports malice. Memory queues and IPC can be pending objects, but remain hypothetical when telemetry cannot establish content or handoff. Packaging, encryption, and C2, FTP, or Tor channels are adjacent objects and do not define this child.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                端点间谍框架可以让截图、音频、按键或文档插件将各自输出放入统一 Upload 目录，File uploader 按对象状态自动上传；Attor 的公开逆向分析就是直接案例。类似结构也可用本地数据库、消息队列或内存环形缓冲实现，只要防守观察仍跨生产与外送主体分离。
              en: >-
                An endpoint espionage framework can have screenshot, audio, keylogging, or document plugins place output in one Upload directory for automatic object-driven transfer by a File uploader; public Attor reverse engineering is a direct case. A local database, message queue, or memory ring can implement the same structure when defender observation remains split across producer and egress principal.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要让多个组件共享对象命名、权限与状态协议，并确保上传者能够判定完整写入、处理重试和删除或标记已发送对象。上传者或目录权限失效会造成可见积压；重复消费、部分文件和错误日志也会暴露流水线。
                en: >-
                  The adversary needs components to share object naming, permissions, and state protocol and must let the uploader identify complete writes, handle retries, and delete or mark sent objects. Failure of uploader or directory permissions produces visible backlog, while duplicate consumption, partial files, and error logs can expose the pipeline.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方保存文件/对象创建与读取、进程 start key、网络连接、目的地和批准流水线清单。检测不依赖读取敏感内容，可以按 object identity、path、hash、size 和时间把 writer、reader 与 outbound flow 连接。若只记录写入而不记录读取，或上传通过共享代理失去进程归属，结论置信度下降。
                en: >-
                  Defenders retain file or object creation and read, process start key, network connection, destination, and approved-pipeline inventory. Detection need not inspect sensitive content and can join writer, reader, and outbound flow by object identity, path, hash, size, and time. Confidence drops when reads are not logged or upload crosses a shared proxy that loses process attribution.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary:
            zh: 待发对象把敏感访问与网络出站拆到不同进程
            en: A pending object splits sensitive access and network egress across processes
          analysis:
            paragraphs:
              - zh: >-
                  生产者写入共享对象后结束本次采集，独立 uploader 在后续对象状态中读取并外送；行为、对象和时间由此被拆成多个局部信号。Attor 的 espionage plugins 不与 C2 通信，而 File uploader 自动消费中央 Upload 文件夹，直接证明因果链。防守方若按单进程追踪会错失一端，按 object lineage 跨进程连接则可恢复完整外传。
                en: >-
                  The producer ends its collection step after writing a shared object, and a separate uploader later reads and sends it based on object state, splitting behavior, object, and time into local signals. Attor's espionage plugins do not communicate with C2, while the File uploader automatically consumes the central Upload folder, directly establishing the causal chain. Per-process tracking misses one end; cross-process object lineage reconstructs the exfiltration.
          evidence_keys: [B10-2-T1020-REF-ATTOR]
          confidence: high
      defense_targets: [B10-2-T1020-DET-HANDOFF, B10-2-T1020-MIT-AUTOMATED-EGRESS]
      research_limitations:
        paragraphs:
          - zh: >-
              直接强证据集中于 Attor 的 Windows 插件架构；跨平台泛化依据生产者—消费者对象语义而非同等强度的 Linux/macOS 恶意案例。目录交接在正常日志、备份和同步软件中极常见，必须保留未授权目的地、主体或数据来源条件。来源证明架构与痕迹分离，不量化漏检率。
            en: >-
              Strong direct evidence is concentrated in Attor's Windows plugin architecture. Cross-platform generalization rests on producer-consumer object semantics rather than equally strong Linux or macOS malicious cases. Directory handoff is common in legitimate logging, backup, and synchronization and requires an unauthorized destination, principal, or data-source condition. The source establishes architecture and trace separation, not a measured miss rate.
  - temporary_key: B10-2-T1020-CH-REPLICA
    name:
      zh: 原路径保持型复制外传
      en: Original-Path-Preserving Replica Exfiltration
    stable_variable: independent_copy_edge_added_without_replacing_original_delivery
    trace_change: source_endpoint_emits_only_original_flow_while_control_plane_delivers_replica_to_collector
    defender_effect: endpoint_and_service_telemetry_remain_normal_and_detection_requires_mirror_lifecycle_to_collector_receipt
    prerequisites: attacker_controls_mirror_configuration_and_collector_reachability
    evidence_keys: [REF-000792, REF-000795]
    confidence: medium
    proposed_content:
      summary:
        zh: 在不替换原通信交付的情况下从网络或云控制面增加到独立收集器的复制边，使端点没有额外外传动作。
        en: Add a copy edge from a network or cloud control plane to an independent collector without replacing original delivery, leaving no additional egress action at the endpoint.
      definition_and_concept:
        paragraphs:
          - zh: >-
              原路径保持型复制外传是攻击者在交换、路由、虚拟网络或等价基础设施中选择源流量和过滤范围，并让平台自动将副本交付到独立 collector，同时原数据仍到达原目的地。直接变量是新增复制边且不改写原路径；SPAN、RSPAN、ERSPAN、Packet Mirroring 和具体云产品只是实现形式。
            en: >-
              Original-Path-Preserving Replica Exfiltration selects source traffic and filter scope in switching, routing, virtual network, or equivalent infrastructure and has the platform automatically deliver a copy to an independent collector while original data still reaches its original destination. The direct variable is an added copy edge without rewriting the original path. SPAN, RSPAN, ERSPAN, Packet Mirroring, and specific clouds are implementations.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              原端点继续连接预期服务，进程没有第二个目的地，服务响应与用户体验也可保持正常，因此端点 EDR 和应用审计可能完全看不到副本。残余集中在镜像资源生命周期、设备命令、源接口/实例/子网、过滤器、封装标识、collector 目标和接收计数。短时镜像删除后现态为空，仍应由事件时资源版本和历史流量恢复。
            en: >-
              The source endpoint continues connecting to the expected service, the process has no second destination, and service response and user experience can remain normal, so endpoint EDR and application audit may not see the copy. Residuals concentrate in mirror-resource lifecycle, device commands, source interfaces, instances or subnets, filters, encapsulation identifiers, collector target, and receipt counters. Current state is empty after a short-lived mirror is deleted, but event-time resource versions and historical flows can still recover it.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求存在到独立 collector 的复制边、源范围覆盖相关数据以及副本实际接收或可执行交付路径。设备本地 PCAP 而未导出不构成 Exfiltration；把原流改路到攻击者后再转发属于路径重定向或 AiTM；合法 NDR、合规监控、容量分析和故障诊断须按 owner、工单、源/过滤器、固定 collector、有效期和数据处理目的排除。内容加密可能让副本无利用价值，但不会消除未授权复制事实。
            en: >-
              Inclusion requires a copy edge to an independent collector, source scope covering relevant data, and actual receipt or an executable delivery path. Device-local PCAP without export does not establish Exfiltration. Rerouting the original flow through the adversary belongs to path redirection or adversary-in-the-middle. Authorized NDR, compliance monitoring, capacity analysis, and troubleshooting require exclusion by owner, ticket, source and filter, pinned collector, validity, and data-processing purpose. Encryption may make the copy unusable but does not erase unauthorized replication.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                行为者控制路由器或交换机管理面后可创建 SPAN/RSPAN/ERSPAN，将多个端口或 VLAN 的副本交给受控 collector；在 IaaS 中则可创建 Packet Mirroring，选择工作负载、子网和过滤器。联合通告记录国家支持行为者在受侵网络设备使用这些能力，但公开材料没有证明每个镜像会话都成功向攻击者外送可用内容。
              en: >-
                After controlling router or switch management, an actor can create SPAN, RSPAN, or ERSPAN and deliver copies of ports or VLANs to a controlled collector. In IaaS, the actor can create Packet Mirroring and select workloads, subnets, and filters. The joint advisory records state-sponsored use of these capabilities on compromised devices, but public material does not prove that every mirror session delivered usable content to an adversary.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要镜像 create/update/delete 或设备 monitor/capture/export 权限、collector 接收与存储能力、源范围知识及到 collector 的路由。跨项目或跨网络目标可能需要额外身份和连接权限；过宽镜像会造成带宽、丢包和资源费用，端到端加密还限制内容价值。
                en: >-
                  The adversary needs mirror create, update, and delete or device monitor, capture, and export authority; collector receipt and storage; source-scope knowledge; and routing to the collector. Cross-project or cross-network targets may need additional identity and connectivity permission. Broad mirrors incur bandwidth, loss, and resource cost, while end-to-end encryption limits content value.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方保存镜像对象的 event-time old/new state、actor、request ID、source/filter、collector、结果和批准工单，并把有效期连接到 collector interface 的 packet/byte receipt。端点日志用于证明原会话而不是发现副本。缺少 collector receipt 时只报告“未授权复制面已建立”，不能升级为完成的数据外传。
                en: >-
                  Defenders retain event-time old and new mirror state, actor, request ID, source and filter, collector, outcome, and approval record and join the validity interval to collector-interface packet and byte receipt. Endpoint logs establish the original session rather than discover the copy. Without collector receipt, report an unauthorized copy surface rather than completed data exfiltration.
      stealth_mechanisms:
        - mechanism_ref: NM-BT
          role: primary
          summary:
            zh: 复制分支保持原会话目的地、响应和端点行为不变
            en: A copy branch preserves original session destination, response, and endpoint behavior
          analysis:
            paragraphs:
              - zh: >-
                  平台自动复制经过的流量并交给独立 collector，原端点与服务仍完成原会话，因此常规端点和应用视图没有第二条恶意发送。痕迹被移到管理面和 collector。联合通告支持行为者使用镜像能力，Google 审计文档支持镜像 create/patch/delete 与权限记录；把资源有效期、源流范围和 collector receipt 相连可破坏这种行为透明。
                en: >-
                  The platform automatically copies traversing traffic to an independent collector while endpoint and service complete the original session, leaving no second malicious send in routine endpoint and application views. Traces move to management plane and collector. The joint advisory supports actor use of mirroring capability, and Google audit documentation supports mirror create, patch, delete, and permission records. Joining validity, source-flow scope, and collector receipt defeats this behavioral transparency.
          evidence_keys: [REF-000792, REF-000795]
          confidence: medium
      defense_targets: [B10-2-T1020-DET-REPLICA, B10-2-T1020-MIT-AUTOMATED-EGRESS]
      research_limitations:
        paragraphs:
          - zh: >-
              联合通告汇总多起活动，未把每个 SPAN/RSPAN/ERSPAN 配置逐一连接到攻击者 collector 的字节接收；Google 来源仅证明平台能力和审计方法。正式结论必须分开“复制配置存在”“collector 收到副本”和“副本含可用敏感数据”三层。物理 TAP、交换芯片或云提供方内部复制可能不留租户可见控制面日志。
            en: >-
              The joint advisory aggregates multiple activities and does not connect every SPAN, RSPAN, or ERSPAN configuration to byte receipt at an adversary collector. The Google source establishes platform capability and audit methods only. Formal conclusions must separate mirror configuration, collector receipt, and usable sensitive content. Physical taps, switch-silicon copies, or provider-internal replication may leave no tenant-visible control-plane audit.
