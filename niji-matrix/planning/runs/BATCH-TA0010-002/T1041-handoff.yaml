      - B10-2-T1041-REF-DET0348
      - REF-000230
      - REF-000632
      - REF-000634
    mechanism_support:
      - B10-2-T1041-REF-ATTACK
      - B10-2-T1041-REF-SOLARMARKER
      - B10-2-T1041-REF-HEADFAKE
    child_existence_support:
      - B10-2-T1041-REF-SOLARMARKER
      - B10-2-T1041-REF-HEADFAKE
      - B10-2-T1041-REF-DET0348
    unsupported_or_deferred:
      - Public incident reports do not establish that logical C2 reuse always preserves one TCP or TLS socket.
      - DET0348 supplies implementable detection leads but does not by itself prove an attacker-controlled stealth child or measured alert reduction.
      - Neither incident publishes false-positive rate, sensitivity, a universal threshold, or full packet capture.
      - Encryption and encoding are orthogonal content transformations and are not evidence that relationship reuse itself obscures data semantics.
      - A destination labeled as a C2 server does not prove the exfiltration reused a relationship that existed before the data transfer.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父项与子项分别覆盖逻辑关系复用和事务内嵌，均给出定义、变化痕迹、残余观察、正常反例、攻击与防守前提、证据层级及限制；防御对象分别处理关系相位和消息族，不以改名复用 T1030/T1029 内容。主 Agent仍需同 T1020、T1048、T1011 与 T1052 交接统一边界。
      en: >-
        The parent and child separately cover logical relationship reuse and transaction embedding, each addressing definition, changed traces, residual observation, benign counterexamples, attacker and defender assumptions, evidence level, and limitations. Defense objects separately address relationship phase and message family rather than renaming T1030 or T1029 content. The primary agent must still converge boundaries with the T1020, T1048, T1011, and T1052 handoffs.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - batch brief creation from primary-agent-approved constraints
      - library catalog generation and semantic duplicate lookup
      - YAML serialization and parse validation only
  limitations:
    paragraphs:
      - zh: >-
          ATT&CK 固定版能够锚定既有 C2 关系与相同协议，SolarMarker 对“existing C2 channel”的表述最直接，FakeUpdates 对重复请求族和数据类型的观察最具体；但“channel”在公开材料中多为逻辑关系，不能自动解释为一个持续 socket。为避免证据越级，正式定义允许重复短连接，子项只划分控制事务族内嵌，持久会话续用保持待补证据。
        en: >-
          The fixed ATT&CK page anchors an existing C2 relationship and the same protocol, SolarMarker is most explicit about an “existing C2 channel,” and FakeUpdates is most concrete about repeated request features and data types. Public sources generally use “channel” as a logical relationship and cannot be read automatically as one persistent socket. To avoid exceeding the evidence, the formal definition allows repeated short connections, the child is limited to control-transaction-family embedding, and persistent-session continuation remains deferred.
      - zh: >-
          DET0348、Zeek 与 Sysmon 说明可实施的字段和关联方向，不证明某阈值或查询具有普遍准确度。Sysmon Event 3 默认未必启用，Windows 对象访问依赖 SACL 与部署，Zeek conn.log 通常在连接结束后产生，TLS 和共享代理会隐藏应用事务或原主机。正式 Analytic 应在本地验证字段、留存、时间和连接身份，缺少源数据访问时不得仅凭出站字节声称已发生外传。
        en: >-
          DET0348, Zeek, and Sysmon establish implementable fields and correlation directions, not universal accuracy for a threshold or query. Sysmon Event 3 may be disabled, Windows object access depends on SACL and deployment, Zeek conn.log is generally emitted after connection close, and TLS or shared proxies can hide application transactions or originating hosts. A canonical Analytic must validate fields, retention, time, and connection identity locally and must not claim exfiltration from outbound bytes alone when source-data access is absent.
      - zh: >-
          出口限制与关系终止会降低继续外送机会，但可能影响使用共享云、CDN 或合法远程管理产品的业务。已经外送的数据无法由后续控制追回，且攻击者可切换备用 C2、协议或服务；因此缓解应用必须同时处置端点植入、凭据与重连路径，并把新路径交给相邻候选分析。
        en: >-
          Egress restriction and relationship termination reduce the opportunity for continued transfer but can disrupt business using shared cloud, CDN, or legitimate remote-management products. Controls cannot recover data already sent, and the attacker may switch to alternate C2, protocol, or service. Mitigation must therefore address the endpoint implant, credentials, and reconnection paths together and route any new path to the adjacent candidate analysis.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: Encoding, encryption, compression, or semantic opacity may coexist but belongs to T1132, T1573, NJT-0133, or NJT-0152; relationship reuse alone does not alter inherent content interpretability.
    - mechanism_ref: NM-FD
      reason: The reviewed cases show shared C2 request features but do not independently prove imitation of a legitimate entity; reduced differentiation between control and exfiltration functions is handled as an observation-coverage gap rather than benign-feature camouflage.
    - mechanism_ref: NM-ST
      reason: Relationship reuse does not inherently disperse traces across time or space; timing and volume shaping require separate evidence under NJT-0154 or NJT-0155.
  open_questions:
    - The primary agent should confirm that the one-child taxonomy remains distinct after convergence with T1020 and T1048, especially where an automated implant serializes results on a different protocol.
    - The exact persistent-socket axis should remain deferred unless packet capture or code-level evidence proves one live transport session, attacker control of phase reuse, and a defense difference beyond the parent.
    - The primary agent should review whether the proposed mitigation is best created as a new object or whether another newly proposed batch-wide egress containment object has identical measures after all five handoffs arrive; MIT-000156 and MIT-000136 are not exact matches on current evidence.
    - A canonical Detection Analytic must choose deployment-specific file-access telemetry and confirm process identifiers can be joined to the network source before claiming implemented coverage.
