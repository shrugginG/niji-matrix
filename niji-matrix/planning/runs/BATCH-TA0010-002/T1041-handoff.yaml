research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: logical C2 relationship reuse
        resolution: parent-core
        note: defines admission and remains broader than any one message or transport-session implementation
      - axis: exfiltration embedded in recurring callback registration or result transactions
        resolution: formal-child-proposed
        key: B10-2-T1041-CHILD-LOOP
      - axis: exact persistent transport-session continuation with a distinct bulk-transfer phase
        resolution: evidence-deferred
        note: DET0348 supplies an analytic lead, but reviewed incidents do not jointly prove socket continuity, attacker control, and a separate defense effect
      - axis: data encoding encryption or high entropy
        resolution: adjacent-technique
        owner: T1132/T1573/NJT-0152/NJT-0133
      - axis: alternative protocol selected for exfiltration
        resolution: adjacent-technique
        owner: T1048
      - axis: external web service selected as destination
        resolution: adjacent-technique
        owner: T1567/T1537
      - axis: C2 application protocol or intermediary topology
        resolution: adjacent-technique
        owner: NJT-0160 and other TA0011 candidates
      - axis: exfiltration timing or volume shaping
        resolution: adjacent-technique
        owner: NJT-0154/NJT-0155
      - axis: operating system data type or malware family
        resolution: not-stealth-distinct
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        ATT&CK 19.1 的 T1041 无子项，本轮仍检查了关系、事务内嵌、传输会话续用、内容表示、协议、服务、时序和体积等轴。只有控制回路内嵌同时具备稳定可控变量、两项事件证据和独立消息级检测价值；持久 socket 轴暂缓，其他轴已有相邻所有者或不形成匿迹分类。
      en: >-
        ATT&CK 19.1 T1041 has no children, but this pass examined relationship, transaction embedding, transport-session continuation, content representation, protocol, service, timing, and volume. Only control-loop embedding has a stable controllable variable, support from two incidents, and distinct message-level detection value. The persistent-socket axis is deferred, and the remaining axes have adjacent owners or do not form stealth classifications.
  evidence_coverage:
    parent_behavior_keys:
      - B10-2-T1041-REF-ATTACK
      - B10-2-T1041-REF-SOLARMARKER
      - B10-2-T1041-REF-HEADFAKE
    boundary_keys:
