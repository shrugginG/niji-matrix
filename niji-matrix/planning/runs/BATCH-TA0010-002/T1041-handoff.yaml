  claims:
    - temporary_key: B10-2-T1041-CLM-ADMISSION
      statement_zh: 既有 C2 关系可直接承载被盗数据，使外传不必建立独立目的关系，同时仍留下源数据读取与关系内方向字节变化。
      statement_en: An existing C2 relationship can directly carry stolen data, removing the need for a separate destination relationship while preserving source-data access and directional-byte changes inside the relationship.
      evidence_keys: [B10-2-T1041-REF-ATTACK, B10-2-T1041-REF-SOLARMARKER, B10-2-T1041-REF-HEADFAKE, B10-2-T1041-REF-DET0348]
      confidence: high
    - temporary_key: B10-2-T1041-CLM-LOOP
      statement_zh: SolarMarker 与 FakeUpdates 证明恶意客户端能在重复的 HTTP C2 事务族中回送主机信息或截图，但公开材料不证明所有事务复用同一 TCP/TLS socket。
      statement_en: SolarMarker and FakeUpdates show malicious clients returning host information or screenshots through recurring HTTP C2 transaction families, but public material does not establish that every transaction reused one TCP or TLS socket.
      evidence_keys: [B10-2-T1041-REF-SOLARMARKER, B10-2-T1041-REF-HEADFAKE]
      confidence: high
    - temporary_key: B10-2-T1041-CLM-DEFENSE
      statement_zh: 检测既有 C2 关系内外传需要把敏感访问与进程归属、方向字节或应用请求变化关联，不能把新连接作为必要条件。
      statement_en: Detecting exfiltration inside an existing C2 relationship requires joining sensitive access with process attribution and directional-byte or application-request change rather than requiring a new connection.
      evidence_keys: [B10-2-T1041-REF-DET0348, REF-000230, REF-000632, REF-000634]
      confidence: high
    - temporary_key: B10-2-T1041-CLM-MITIGATION
      statement_zh: 拒绝为默认的受管出口、关键出口监测和确认 C2 后的关系终止可减少同一控制关系继续承载数据的机会，但无法追回确认前已送出的内容。
      statement_en: Deny-by-default managed egress, monitoring at key egress points, and termination after C2 validation reduce the opportunity for the same control relationship to continue carrying data but cannot recover content sent before validation.
      evidence_keys: [REF-000646, B10-2-T1041-REF-CISA-EGRESS]
      confidence: medium
