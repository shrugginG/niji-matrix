research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1048.001, T1048.002, T1048.003]
    represented_dimensions:
      - T1048.001 partitions manual or protocol-layer symmetric content protection on a non-C2 path
      - T1048.002 partitions asymmetric or protocol-native protected transport such as HTTPS SFTP or SCP
      - T1048.003 partitions clear-text non-C2 protocols and also mixes encoding or field embedding inside them
    breadth_trigger: examine-at-least-two-materially-different-axes
    coverage_resolutions:
      - attack_child_id: T1048.001
        resolution: niji-variable-candidate
        notes_zh: 对称密钥类型不导入；只有检查点内容不可解释这一跨实现变量进入 B10-2-T1048-CHILD-OPAQUE。固定子项公开案例支撑较弱，不能按 ATT&CK 名称制造 NJS。
        notes_en: Symmetric key type is not imported. Only the cross-implementation variable of content being uninterpretable at the inspection point contributes to B10-2-T1048-CHILD-OPAQUE. Public fixed-child case support is weak, so the ATT&CK name cannot manufacture an NJS.
      - attack_child_id: T1048.002
        resolution: niji-variable-candidate
        notes_zh: HTTPS/SFTP/SCP 等实例同时支持不透明传输；Dark Halo 的 HTTPS 取回还支持受害服务拉取，但非对称握手本身不构成兄弟边界。
        notes_en: HTTPS, SFTP, and SCP examples support opaque transfer, and Dark Halo HTTPS retrieval also supports victim-service pull, while asymmetric key establishment itself does not define a sibling.
      - attack_child_id: T1048.003
        resolution: niji-variable-candidate
        notes_zh: 普通明文 FTP/HTTP/SMTP 留在 parent-core；当协议偏离角色路径时支持 ROLE 子项，当数据嵌入可解析事务时支持 CAMOUFLAGE 子项。
        notes_en: Ordinary clear-text FTP, HTTP, or SMTP remains parent-core. Role-path deviation contributes to ROLE, while data embedded in parsable transactions contributes to CAMOUFLAGE.
    candidate_stealth_axes_examined:
      - {axis: asset-role and managed-intermediary deviation, resolution: formal-child-proposed, key: B10-2-T1048-CHILD-ROLE}
      - {axis: protocol-semantic embedding and feature resemblance, resolution: formal-child-proposed, key: B10-2-T1048-CHILD-CAMOUFLAGE}
      - {axis: payload interpretability at the inspection point, resolution: formal-child-proposed, key: B10-2-T1048-CHILD-OPAQUE}
      - {axis: victim-service response direction and receiver attribution, resolution: formal-child-proposed, key: B10-2-T1048-CHILD-PULL}
      - {axis: symmetric versus asymmetric key model, resolution: not-stealth-distinct}
      - {axis: third-party web service product, resolution: adjacent-technique, owner: T1567}
      - {axis: reuse of existing C2 session, resolution: adjacent-technique, owner: T1041}
      - {axis: alternative network medium, resolution: adjacent-technique, owner: T1011}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 4
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        已检查四条实质不同轴，超过 3–5 子项触发所需的两条；正式数量来自防守数据和机理差异而非 ATT&CK 数量。主 Agent 应与 T1041/T1567 最终稿复核 receiver relation 和 Web 服务边界。
      en: >-
        Four materially different axes were examined, exceeding the two-axis inquiry required by the 3–5 child trigger. Formal count follows mechanism and defensive-data differences rather than ATT&CK count. The primary agent should converge receiver relationship and web-service boundaries against final T1041 and T1567 work.
  evidence_coverage:
    parent_behavior_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-SAURON, B10-2-T1048-REF-MIRRORFACE, REF-000509]
    boundary_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-OILRIG, REF-000509, B10-2-T1048-REF-RFC4253]
    mechanism_support:
      - {mechanism_ref: NM-BT, evidence_keys: [B10-2-T1048-REF-OILRIG, REF-000509], confidence: high}
      - {mechanism_ref: NM-FD, evidence_keys: [B10-2-T1048-REF-SAURON, REF-000509], confidence: high}
      - {mechanism_ref: NM-DO, evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253], confidence: medium}
    child_existence_support:
      - {child_key: B10-2-T1048-CHILD-ROLE, evidence_keys: [B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-NIST-FW]}
      - {child_key: B10-2-T1048-CHILD-CAMOUFLAGE, evidence_keys: [B10-2-T1048-REF-SAURON, B10-2-T1048-REF-DNS-LOW]}
      - {child_key: B10-2-T1048-CHILD-OPAQUE, evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253]}
      - {child_key: B10-2-T1048-CHILD-PULL, evidence_keys: [REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]}
    unsupported_or_deferred:
      - ATT&CK parent procedure rows that describe sending to a C2 server do not by themselves establish T1048; absent a distinct protocol or receiver relationship they should resolve to T1041.
      - T1048.001 has limited fixed-baseline malicious procedure evidence; symmetric encryption is not independently promoted.
      - No reviewed source measures alert reduction for OilRig FTP, MirrorFace SFTP, or Dark Halo OWA retrieval.
      - Generic alternate destination separation without a distinct protocol, service-response direction, or conclusion-level defender effect remains parent-core or deferred rather than a child.
      - Protocol tunneling used for command and control belongs to TA0011 unless a separately evidenced exfiltration relationship is present.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父项和四子项分别覆盖定义、痕迹变化、残余观察、反例、相邻边界、场景及攻防前提；每个子项具有不同 NJA 数据面和 MIT application。交接是研究稿，主 Agent 仍需与同批 T1041 及后续 T1567 收敛。
      en: >-
        The parent and four children separately cover definition, trace change, residual observation, counterexamples, adjacent boundaries, scenarios, and attacker and defender assumptions. Each child has a distinct NJA data plane and MIT application. This is a research draft; the primary agent must still converge it with same-batch T1041 and later T1567.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [Official STIX extraction, YAML serialization, parse check, shared-library lookup, duplicate audit]
  limitations:
    paragraphs:
      - zh: >-
          证据强度不均衡。ATT&CK 19.1 精确固定父行为和三个密码实现子项；OilRig 给出 DNS 控制到 FTP PUT 的跨协议链，ProjectSauron 直接给出正常流量伪装，MirrorFace 只证明 SFTP 外传，Dark Halo 给出 OWA 产物路径和取回 URL。公开资料均未提供受害者完整网络策略和告警前后对照，因此 ROLE、OPAQUE 与 PULL 的匿迹效果保持 medium 或以本地验证为条件。
        en: >-
          Evidence strength varies. ATT&CK 19.1 fixes the parent behavior and three cryptographic implementation children. OilRig provides a cross-protocol chain from DNS control to FTP PUT, ProjectSauron directly states regular-traffic camouflage, MirrorFace establishes only SFTP exfiltration, and Dark Halo provides the OWA artifact path and retrieval URL. None publishes the victim's complete network policy and before-and-after alert comparison, so stealth effect for ROLE, OPAQUE, and PULL remains medium or conditional on local validation.
      - zh: >-
          ATT&CK 父页部分 procedure 把数据送往 C2 服务器也列入 T1048，固定定义又要求不同于既有 C2 的协议；Niji 应优先遵守行为边界并逐案证明关系，不能把“curl、HTTPS、FTP 或 DNS 出现”当作自动准入。加密、归档、字段编码、第三方 Web 服务和介质变化均有相邻技术，组合使用允许多重标注但不得吞并边界。
        en: >-
          Some ATT&CK parent procedures describe data sent to a C2 server even though the fixed definition requires a protocol different from existing C2. Niji should prioritize the behavioral boundary and prove the relationship case by case rather than treating curl, HTTPS, FTP, or DNS as automatic admission. Encryption, archiving, field encoding, third-party web services, and medium changes have adjacent techniques; combined use can receive multiple tags without collapsing boundaries.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason: Protocol choice does not inherently dilute events across time or space; timing and volume changes belong to T1029/T1030 unless independently present.
    - mechanism_ref: NM-FD-for-role-deviation
      reason: A role-deviant direct connection can exploit a monitoring gap without imitating normal features; Feature Disguise is reserved for demonstrated protocol-semantic or service-response resemblance.
  open_questions:
    - The primary agent should compare T1041's definition of the existing C2 relationship against ATT&CK procedure examples that ambiguously label alternative-protocol endpoints as C2.
    - The primary agent should decide whether PULL remains under T1048 when the retrieval protocol matches C2 but the receiver path is independent; this handoff requires distinct protocol or receiver relation and documents the ambiguity.
    - T1567 work should confirm that victim-owned OWA or webroot retrieval is excluded from third-party web-service taxonomy.
    - Production use of the semantic analytic requires mail-gateway field validation; the proposed field set is implementation-neutral and must be mapped to the deployed product.
