batch_ref: BATCH-TA0010-002
work_item_ref: WORK-TA0010-T1048
temporary_key_prefix: B10-2-T1048-
candidate:
  source_type: attack
  source_attack_id: T1048
  name:
    zh: 经替代协议渗出
    en: Exfiltration Over Alternative Protocol
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: >-
          Enterprise ATT&CK 19.1 将 T1048 定义为使用不同于既有命令与控制通道的网络协议外传数据，并允许数据送往不同于主 C2 的网络位置。该父行为直接属于 TA0010，且 OilRig、ProjectSauron、MirrorFace 与 Dark Halo 资料分别证明攻击者会把外传移到 FTP、DNS、邮件、SFTP 或受害者 Web 服务路径，因此建议保留父语义。Niji 正式内容应要求能够说明既有 C2 关系与替代外传关系的差异；若同一会话同时承担命令、控制和回传而没有独立协议或接收路径，则应交给 T1041。
        en: >-
          Enterprise ATT&CK 19.1 defines T1048 as stealing data through a network protocol different from the existing command-and-control channel and permits delivery to a network location other than the main C2 server. The parent behavior directly serves TA0010, and OilRig, ProjectSauron, MirrorFace, and Dark Halo reporting demonstrates movement of exfiltration onto FTP, DNS, mail, SFTP, or a victim-hosted web path. Retain the parent semantics, while requiring canonical Niji content to establish the difference between the existing C2 relationship and the alternative exfiltration relationship. A single session carrying commands, control, and results without an independent protocol or receiver path belongs under T1041.
      - zh: >-
          固定版三个 ATT&CK 子项按对称加密、非对称加密和未加密划分密码实现。该划分不直接成为 Niji taxonomy：TLS 和 SSH 在握手后也使用对称加密，密钥类型本身不会稳定改变防守动作；未加密协议又可同时具有明文、编码、字段嵌入和独立接收端。Niji 应改按协议相对业务角色的偏离、载荷是否伪装为协议语义、检查点能否解释内容，以及是否由受害服务反向提供数据来划分。
        en: >-
          The three fixed-version ATT&CK children divide symmetric encryption, asymmetric encryption, and no encryption. That cryptographic implementation taxonomy is not imported into Niji. TLS and SSH use symmetric protection after key exchange, so key type does not create a stable defensive boundary, while an unencrypted protocol may carry clear text, encoding, field embedding, or a separate receiver. Niji should instead partition protocol deviation from workload role, camouflage of payload as protocol semantics, content interpretability at the inspection point, and victim-service delivery in response to an outside fetch.
  original_attack_subtechniques_imported: false
  scope_notes:
    zh: >-
      T1048 要求外传协议或接收路径与既有 C2 可区分。复用既有 C2 关系归 T1041；第三方 Web 服务作为目的地归 T1567；同一云服务内账户转移归 T1537；企业主网络之外的网络介质归 T1011；物理介质归 T1052。协议编码、加密、暂存和归档可伴随标注，但不改变直接行为对象。
    en: >-
      T1048 requires an exfiltration protocol or receiver path distinguishable from the existing C2 relationship. Reuse of that C2 relationship belongs to T1041; a third-party web service as destination belongs to T1567; same-service cloud account transfer belongs to T1537; a network medium outside the primary enterprise network belongs to T1011; and physical media belongs to T1052. Encoding, encryption, staging, and archiving may be co-tagged but do not change the direct behavioral object.
proposed_content:
  temporary_key: B10-2-T1048-PARENT
  name:
    zh: 经替代协议渗出
    en: Exfiltration Over Alternative Protocol
  summary:
    zh: 攻击者把数据外传移到不同于既有 C2 的协议或接收路径，以分割防守观察面，并可借协议外观、内容不透明或受害服务响应降低识别和归因能力。
    en: An adversary moves data theft onto a protocol or receiver path distinct from existing C2, splitting defensive observation and potentially reducing recognition or attribution through protocol appearance, opaque content, or victim-service responses.
  definition_and_concept:
    paragraphs:
      - zh: >-
          经替代协议渗出是攻击者在已经取得可外传数据后，选择不同于既有命令与控制关系的网络协议或独立接收路径，将数据送出受害环境的行为。替代关系可以表现为 C2 使用 DNS 而外传改用 FTP，也可以表现为植入保持一个控制端而数据由另一接收端、邮件系统或受害者 Web 服务提供。直接目标是完成数据泄露；协议和接收关系决定传输如何进入防守观测。
        en: >-
          Exfiltration Over Alternative Protocol occurs after an adversary has data available for theft and selects a network protocol or independent receiver path distinct from the existing command-and-control relationship. C2 may use DNS while exfiltration uses FTP, or an implant may retain one controller while data is delivered to another receiver, a mail system, or a victim-hosted web service. The direct objective is data loss; protocol and receiver relationships determine how delivery enters defensive observation.
      - zh: >-
          “替代”是相对于同一入侵的既有 C2 关系，而不是相对于某一组织最常见的协议。FTP、SMTP、HTTP/S、DNS、SFTP 与 SMB 都可能正常存在，也都可能成为替代外传载体；工具、端口、密码算法和云产品不能单独定义父项或子项。若没有可证明的既有 C2 对照，仍可记录可疑外传，但不能仅凭使用不同端口断言 T1048。
        en: >-
          “Alternative” is relative to the intrusion's existing C2 relationship, not merely to the protocol most common in an organization. FTP, SMTP, HTTP/S, DNS, SFTP, and SMB can all be legitimate and can all carry alternative exfiltration. A tool, port, cryptographic algorithm, or cloud product does not independently define the parent or a child. Without a demonstrable C2 comparator, suspicious egress may still be recorded, but a different port alone does not establish T1048.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          经替代协议渗出把控制活动与数据外送拆到不同日志面、解析器和策略边界。Web 代理可能只看到 C2，FTP 或 SFTP 流量出现在防火墙和流记录中，DNS 或邮件载荷则由解析器和邮件网关记录；任何单一系统都可能缺少完整攻击图像。协议选择还可避开按设备角色部署的中介，使原本可由代理检查的上传变成直接外联。
        en: >-
          Exfiltration Over Alternative Protocol splits control activity and data delivery across different logs, parsers, and policy boundaries. A web proxy may see C2 while FTP or SFTP appears in firewall and flow records and DNS or mail payloads appear at resolvers and mail gateways. Any one system can lack the complete attack picture. Protocol choice can also bypass role-specific intermediaries, turning a proxy-inspectable upload into direct egress.
      - zh: >-
          匿迹不等于痕迹消失。替代通道仍留下源主机、进程、目的地、方向字节、协议事务、证书、邮件或查询序列；加密只会移除内容解释，受害服务拉取还会留下文件写入与访问日志。防守方若能以设备、进程、文件、身份和时间跨观测面关联，就能恢复控制链与外传链之间的关系。合法备份、软件分发、邮件投递、管理 SFTP 与 DNS 服务会产生强反例。
        en: >-
          Stealth does not remove traces. The alternative channel still leaves source host, process, destination, directional bytes, protocol transactions, certificates, mail, or query sequences; encryption removes content interpretation, while victim-service retrieval leaves file-write and access logs. A defender that correlates devices, processes, files, identities, and time across observation surfaces can reconstruct the relationship between control and exfiltration. Authorized backup, software delivery, mail submission, administrative SFTP, and DNS services are strong counterexamples.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入通过不同于已建立 C2 的协议发送已收集数据，或在该协议变化中使用独立接收端、协议字段嵌入、加密内容或受害服务响应改变防守观察的行为。纳入判定至少需要外传对象或结果、协议/接收关系，以及与既有 C2 的对照；只有连接、工具存在或协议能力不足。若外传协议后来也承担命令控制，应分别标注相应 C2 行为，并说明当前事件的直接目的。
        en: >-
          Scope includes sending acquired data through a protocol different from established C2 and changes to defender observation through a separate receiver, protocol-field embedding, opaque content, or a victim-service response on that alternative path. Inclusion requires at least an exfiltrated object or result, the protocol or receiver relationship, and a comparator to existing C2; a connection, installed tool, or protocol capability is insufficient. If the exfiltration protocol later carries command and control, tag the relevant C2 behavior separately and state the direct purpose of the event under review.
      - zh: >-
          T1041 负责在既有 C2 关系中回传数据。T1567 以第三方 Web 服务作为外传目的地，T1537 以云账户间转移为对象；若这些行为也使用与 C2 不同的协议，可以并存，但服务或账户不能成为 T1048 子项。T1011 由替代网络介质定义，T1052 由物理承载定义。T1074 与 NJT-0133 分别负责暂存和外传前归档；把文件放入 Web 根目录是暂存，外部请求实际取回字节才完成本技术的传输。
        en: >-
          T1041 owns return of data through the existing C2 relationship. T1567 is defined by a third-party web service destination and T1537 by account-to-account cloud transfer. These may coexist with a protocol distinct from C2, but the service or account does not define a T1048 child. T1011 is defined by an alternative network medium and T1052 by physical carriage. T1074 and NJT-0133 own staging and pre-egress archiving. Writing a file into a web root is staging; the outside request that retrieves the bytes completes this transfer behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            攻击者在植入或交互式会话已经建立 C2 后，可以把大文件、凭据、邮件导出或命令结果移到另一协议，以避开 C2 带宽、内容检查或已知基础设施告警。OilRig 的 DNS 控制脚本接收了使用 FTP 上传侦察输出的命令；MirrorFace 入侵中使用 SFTP 取走已审阅的数据；ProjectSauron 使用 DNS 与合法邮件路径外送并把信息藏入正常流量。
          en: >-
            Once an implant or interactive session has established C2, an adversary can move large files, credentials, mailbox exports, or command results onto another protocol to avoid C2 bandwidth limits, content inspection, or known-infrastructure alerts. OilRig's DNS-controlled script received commands to upload reconnaissance output by FTP, MirrorFace intrusions used SFTP for reviewed data, and ProjectSauron used DNS and legitimate mail routes while disguising stolen information in regular traffic.
        - zh: >-
            另一情境是先把数据写入受害者对外服务，再由攻击者拉取。Dark Halo 把邮箱导出打成受口令保护的归档，置于 OWA 可访问目录并通过 HTTPS URL 取回。这里外传表现为受害 Web 服务向外部客户端响应，检测需连接服务器端产物创建、发布路径和访问日志，而不能只寻找内网主机主动上传。
          en: >-
            Another scenario stages data behind a victim-facing service for later retrieval. Dark Halo placed a password-protected mailbox-export archive in an OWA-accessible directory and retrieved it through an HTTPS URL. Exfiltration then appears as a victim web service responding to an external client. Detection must join server-side artifact creation, publication path, and access logs rather than look only for an internal host initiating an upload.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者须已经能够读取目标数据，并了解或控制至少一个不同于既有 C2 的发送实现或接收端。角色偏离需要进程能够直连外部协议端点；协议载荷伪装需要构造合法事务并在接收端重组；检查不透明需要协商受保护会话或在传输前形成密文；拉取式外传需要写入可对外服务的位置并知道可取回 URL。不同实现分别增加协议开发、密钥、接收基础设施和更长操作链成本。
            en: >-
              The attacker must already be able to read target data and know or control at least one sending implementation or receiver distinct from existing C2. Role deviation requires a process able to contact an external protocol endpoint directly. Protocol-payload camouflage requires valid transaction construction and receiver-side reconstruction. Inspection opacity requires negotiation of a protected session or ciphertext before transfer. Pull exfiltration requires writing to an externally served location and knowing the retrieval URL. These implementations add distinct protocol-development, key, receiver-infrastructure, and operational-chain costs.
      defender_model:
        paragraphs:
          - zh: >-
              防守方可能分别拥有 Web 代理、受管 DNS、邮件网关、NetFlow/IPFIX、Zeek 连接/DNS/TLS 日志、端点文件与进程网络事件，以及服务端访问日志。结论针对能够跨这些来源保留主机、进程、用户、目的地和时间关联键的环境；只保留端口或最终连接摘要时，协议语义、短事务和文件来源会丢失。TLS、SSH、DoH、共享递归器、NAT、CDN 与外部 SaaS 会进一步压缩可见性。
            en: >-
              Defenders may separately hold web-proxy, managed-DNS, mail-gateway, NetFlow or IPFIX, Zeek connection, DNS and TLS, endpoint file and process-network, and server access logs. The conclusion assumes an environment that preserves host, process, user, destination, and time join keys across those sources. Port-only or final connection summaries lose protocol semantics, short transactions, and file provenance. TLS, SSH, DoH, shared recursive resolvers, NAT, CDNs, and external SaaS further reduce visibility.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 把外传移出既有 C2 监控面并利用协议或服务路径覆盖缺口
        en: Move exfiltration outside existing C2 monitoring and exploit gaps in protocol or service-path coverage
      analysis:
        paragraphs:
          - zh: >-
              攻击者选择与既有 C2 不同的协议、进程或受害服务接收路径，使原本可在单一通道重建的控制与回传分布到代理、解析器、邮件、流量和服务日志。若组织只围绕 C2 协议部署深度检查或只寻找主动外联上传，替代传输可能不进入该逻辑；OilRig 的 DNS 控制与 FTP 上传、Dark Halo 的 OWA 响应式取回直接证明观察面发生分离。痕迹仍在其他来源中，因此效果取决于跨源关联是否存在。
            en: >-
              The adversary selects a protocol, process, or victim-service receiver path different from existing C2, distributing control and return traffic across proxy, resolver, mail, flow, and service logs rather than one channel. If deep inspection is deployed only around C2 or analytics look only for initiated uploads, the alternative transfer may fall outside that logic. OilRig's DNS control with FTP upload and Dark Halo's OWA response-based retrieval directly establish observation-surface separation. Traces remain elsewhere, so the effect depends on cross-source correlation.
      evidence_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-OILRIG, REF-000509]
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 让失窃数据以合法协议事务和常见服务响应的外观出现
        en: Present stolen data with the appearance of legitimate protocol transactions and common service responses
      analysis:
        paragraphs:
          - zh: >-
              攻击者把数据编码到 DNS 请求、邮件或其他协议字段，或让受害 Web 服务返回看似普通的静态资源。防守方可以观察事务，却难以仅凭协议名、端口或单次请求把它与正常解析、邮件和下载区分。ProjectSauron 报告明确说明失窃信息被隐藏在正常邮件和 DNS 流量中，Dark Halo 的归档则以 OWA 路径中的 Redir.png 名称提供取回；异常标签结构、文件生成谱系和敏感来源仍可作为反证。
            en: >-
              The adversary encodes data into DNS requests, mail, or other protocol fields, or causes a victim web service to return what looks like an ordinary static resource. Defenders can observe the transaction but cannot classify it reliably from protocol name, port, or one request alone. ProjectSauron reporting explicitly states that stolen information was disguised in regular mail and DNS traffic, while Dark Halo exposed an archive under a Redir.png name in an OWA path. Abnormal label structure, file-generation lineage, and sensitive source data remain counterevidence.
      evidence_keys: [B10-2-T1048-REF-SAURON, REF-000509]
      confidence: high
    - mechanism_ref: NM-DO
      role: secondary
      summary:
        zh: 使替代通道检查点只能看到受保护会话和不可直接解释的载荷
        en: Leave alternative-channel inspection points with a protected session and payload they cannot directly interpret
      analysis:
        paragraphs:
          - zh: >-
              攻击者使用 SSH/SFTP、TLS 或附加加密后，网络检查点仍能看到端点、时间、方向字节、握手与证书，却无法直接恢复所传文件内容。RFC 4253 说明 SSH 传输提供加密与完整性，JPCERT/CC 又确认 MirrorFace 使用 SFTP 外传；这支持内容可检查性变化，但没有证明某次事件实际绕过了特定产品。对称或非对称密钥协商只是实现，不形成两个 Niji 机理。
            en: >-
              When the adversary uses SSH or SFTP, TLS, or additional encryption, a network inspection point still sees endpoints, timing, directional bytes, handshakes, and certificates but cannot directly recover transferred file content. RFC 4253 specifies encryption and integrity for SSH transport, and JPCERT/CC confirmed MirrorFace using SFTP for exfiltration. Together they support a change in content inspectability, without proving that a particular product missed that incident. Symmetric or asymmetric key establishment is an implementation detail and does not form separate Niji mechanisms.
      evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议建立四个 Niji 原生子项。角色偏离协议出口按“谁本应使用何种受管协议路径”划界；协议语义载荷伪装按“数据是否藏在可解析的正常事务结构中”划界；检查不透明替代传输按“检查点能否解释内容”划界；受害服务拉取式外传按“外部请求是否触发受害服务把已暂存数据作为响应送出”划界。它们可以组合，但分别需要角色/路径基线、协议解析、元数据谱系和服务端文件—请求关联。
          en: >-
            Four Niji-native children are proposed. Role-Deviant Protocol Egress is bounded by which managed protocol path a workload should use. Protocol-Semantic Payload Camouflage is bounded by whether data is hidden inside a parsable normal transaction structure. Inspection-Opaque Alternative Transfer is bounded by whether an inspection point can interpret content. Victim-Service Pull Exfiltration is bounded by an external request causing a victim service to return staged data. They can co-occur, but respectively require role and path baselines, protocol parsing, metadata lineage, and server-side file-to-request joins.
        - zh: >-
            对称加密、非对称加密、明文协议、工具名、端口和目的服务均不得成为兄弟项。密码实现归并到检查状态；明文 FTP/HTTP/SMTP 的普通使用留在父级，只有业务角色偏离或语义载荷伪装才进入子项；第三方 Web 服务和云账户仍由 T1567/T1537 界定。该分类解释了三个 ATT&CK 子项的广度，但不复制其名称或数量。
          en: >-
            Symmetric encryption, asymmetric encryption, clear-text protocol, tool name, port, and destination service do not define siblings. Cryptographic implementations converge on inspection state. Ordinary clear-text FTP, HTTP, or SMTP remains parent-core unless role deviation or semantic payload camouflage is established. Third-party web services and cloud accounts remain bounded by T1567 and T1537. This taxonomy accounts for the breadth of all three ATT&CK children without importing their names or count.
proposed_subtechniques:
  - temporary_key: B10-2-T1048-CHILD-ROLE
    name:
      zh: 角色偏离协议出口
      en: Role-Deviant Protocol Egress
    confidence: medium
    summary:
      zh: 攻击者从不应直接使用某协议或外部端点的设备和进程发送数据，使外传离开受管解析器、代理、邮件中继或批准通道。
      en: An adversary sends data from a device or process that should not directly use that protocol or external endpoint, moving exfiltration outside a managed resolver, proxy, mail relay, or approved path.
    definition_and_concept:
      paragraphs:
        - zh: >-
            角色偏离协议出口是经替代协议渗出的一种实现，其中攻击者让受害工作负载直接发起超出其业务角色的外部 DNS、FTP、SFTP、SMTP、SMB 或其他协议会话，而不是经过该角色获准的中介或目的地。分类变量是资产/进程角色与实际出口路径之间的差异；协议名称、端口或工具只是观察属性。
          en: >-
            Role-Deviant Protocol Egress is an implementation of Exfiltration Over Alternative Protocol in which the adversary causes a victim workload to initiate external DNS, FTP, SFTP, SMTP, SMB, or another protocol outside its business role instead of using the role's approved intermediary or destination. The classification variable is the difference between asset or process role and actual egress path; protocol name, port, and tool are observed attributes.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            角色偏离协议出口把外传从组织重点检查的 Web/C2 路径移到另一政策和日志面。直接 FTP 可能只留下防火墙与流记录，直接 DNS 可能绕开受管递归器，脚本 SMTP 可能跳过邮件网关；单个传感器看到的是允许端口或普通连接而非敏感数据谱系。异常进程、未批准接收端、方向字节和源文件读取仍然可见，严格的角色基线会削弱匿迹收益。
          en: >-
            Role-Deviant Protocol Egress moves theft from the organization's closely inspected web or C2 path to another policy and logging surface. Direct FTP may leave only firewall and flow records, direct DNS may bypass managed recursion, and scripted SMTP may bypass the mail gateway. One sensor sees an allowed port or ordinary connection rather than sensitive-data lineage. The unusual process, unapproved receiver, directional bytes, and source-file reads remain visible, and a strong role baseline reduces the stealth benefit.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入需要证明设备或进程角色、批准中介/目的地、实际协议路径和外传结果之间的偏离。管理员批准的 SFTP、备份代理、邮件服务器、DNS 递归器和软件发布是正常反例；端口异常、首次连接或非浏览器进程本身不足。若外传仍复用既有 C2 关系归 T1041；通过不同网络介质归 T1011；仅改变时间或体积分别归 T1029/T1030。
          en: >-
            Inclusion requires evidence of workload or process role, approved intermediary or destination, the actual protocol path, and an exfiltration result. Authorized SFTP administration, backup agents, mail servers, DNS resolvers, and software distribution are normal counterexamples. An unusual port, first connection, or non-browser process alone is insufficient. Exfiltration that still reuses existing C2 belongs to T1041, a different network medium to T1011, and changes only to timing or volume to T1029 or T1030.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              OilRig 的 Helminth PowerShell 通过 DNS 接收任务和文件内容，研究人员捕获的命令又要求把 whoami、ipconfig 和 systeminfo 输出写入文件后直接 FTP PUT 到外部 IP。该链证明同一活动把控制留在 DNS 而把外传切换到 FTP，并提供文件、目标 IP 和协议差异；来源没有量化 FTP 是否绕过了某项防线，因此本子项保持 medium。
            en: >-
              OilRig's Helminth PowerShell received tasks and file content over DNS, while commands captured by researchers wrote whoami, ipconfig, and systeminfo output to a file and directly issued an FTP PUT to an external IP. The chain establishes control remaining on DNS while exfiltration moved to FTP, with a file, receiver IP, and protocol difference. The source does not quantify whether FTP bypassed a defensive control, so this child remains medium-confidence.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要从受害设备建立替代协议会话、准备接收端或滥用现有外部服务，并知道业务角色允许或未严格阻断的出口。直接路径可能需要凭据、协议客户端或防火墙例外，也可能因端口阻断、代理强制和服务端认证失败。攻击者接受增加一个接收基础设施和暴露新目标的成本。
              en: >-
                The attacker needs to establish the alternative protocol session from the victim, operate a receiver or abuse an external service, and identify egress that the workload role can reach or that policy does not strictly block. The direct path may require credentials, a protocol client, or a firewall exception and can fail under port blocking, forced proxies, or receiver authentication. The attacker accepts the cost of another receiving system and exposing another destination.
        defender_model:
          paragraphs:
            - zh: >-
                防守方具备资产/进程角色清单、批准解析器/代理/中继和网络流或端点连接事件。若只按端口允许而没有应用识别、进程键或直接/中介路径标记，偏离难以判断；NAT 和共享代理还会压缩发起身份。防守结论依赖本地角色基线，而不是跨环境通用协议黑名单。
              en: >-
                The defender has an asset and process role inventory, approved resolvers, proxies and relays, and network-flow or endpoint-connection events. Port-only allow rules without application identification, process keys, or direct-versus-mediated path markers make deviation hard to assess; NAT and shared proxies further compress origin identity. The defensive conclusion depends on local role baselines rather than a universal protocol blacklist.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 使外传进入该工作负载常规监控未覆盖的直接协议路径
          en: Place exfiltration on a direct protocol path outside routine monitoring for that workload
        analysis:
          paragraphs:
            - zh: >-
                攻击者从受控主机绕过受管中介并直接使用另一协议，使代理、邮件网关或递归器不生成预期事务，关键数据传输只存在于端点、流量或另一日志面。现有基于批准路径的检测逻辑可能看不见完整内容和主体；角色清单、方向字节与源文件读取仍可恢复。OilRig 的 DNS 控制与独立 FTP PUT 支持路径分离，具体告警损失属于待本地验证的强推断。
              en: >-
                The adversary bypasses a managed intermediary from a compromised host and uses another protocol directly, so the proxy, mail gateway, or resolver does not produce the expected transaction. The critical transfer exists only at the endpoint, flow layer, or another log surface. Analytics built around approved paths may lose content and identity, while role inventory, directional bytes, and source-file reads can recover the behavior. OilRig's DNS control and separate FTP PUT support path separation; actual alert loss remains a strong inference requiring local validation.
        evidence_keys: [B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-NIST-FW]
        confidence: medium
    evidence_keys: [B10-2-T1048-CLM-ROLE, B10-2-T1048-CASE-OILRIG, B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-NIST-FW]
    limitations:
      paragraphs:
        - zh: >-
            公开案例通常说明使用了替代协议，却不公开资产角色清单、实际代理策略或漏报对照。OilRig 证明 DNS 控制与 FTP 外传可分离，但不能证明受害者原本禁止 FTP。正式内容应把匿迹置信度与“是否违反批准路径”分开，角色与政策证据缺失时只能输出可疑 T1048 父行为。
          en: >-
            Public incidents commonly establish use of another protocol without publishing asset-role inventories, actual proxy policy, or missed-alert comparisons. OilRig proves separation of DNS control and FTP exfiltration but not that the victim prohibited FTP. Canonical content should separate stealth confidence from violation of an approved path; absent role and policy evidence, analysis can conclude only suspicious T1048 parent behavior.
  - temporary_key: B10-2-T1048-CHILD-CAMOUFLAGE
    name:
      zh: 协议语义载荷伪装
      en: Protocol-Semantic Payload Camouflage
    confidence: high
    summary:
      zh: 攻击者把失窃数据编码或嵌入正常协议事务结构，使查询、邮件或请求在局部上仍呈现合法协议外观。
      en: An adversary encodes or embeds stolen data inside normal protocol transaction structures so queries, mail, or requests retain a locally legitimate protocol appearance.
    definition_and_concept:
      paragraphs:
        - zh: >-
            协议语义载荷伪装是经替代协议渗出的一种实现：攻击者把数据拆解、编码并放入 DNS 标签、邮件字段/正文、HTTP 参数/首部或其他协议允许的事务位置，使中间设备能够解析外层协议却不能仅凭单次事务识别其外传语义。固定变量是“失窃数据被映射到正常协议语义位置”的选择，不是 DNS、SMTP 或某种编码算法本身。
          en: >-
            Protocol-Semantic Payload Camouflage is an implementation of Exfiltration Over Alternative Protocol in which the adversary segments and encodes data into DNS labels, mail fields or bodies, HTTP parameters or headers, or another protocol-permitted transaction location. An intermediary can parse the outer protocol but cannot identify exfiltration meaning from one transaction alone. The fixed variable is the mapping of stolen data into a normal semantic position, not DNS, SMTP, or any encoding algorithm itself.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            协议语义载荷伪装保留合法语法、请求方向和中介处理方式，使单个 DNS 查询、邮件或 HTTP 请求看似可接受；真实数据意义只有在跨事务解码、排序或与源文件关联后出现。残余痕迹包括异常标签长度与唯一率、重复序号、收件人与进程不匹配、首部体积、响应比例和同进程敏感读取。加密 DNS 或端到端邮件会进一步阻断语义检查。
          en: >-
            Protocol-Semantic Payload Camouflage preserves valid syntax, request direction, and intermediary handling, making one DNS query, message, or HTTP request look acceptable. The stolen-data meaning emerges only after decoding, ordering across transactions, or joining to source files. Residual traces include unusual label length and uniqueness, repeated sequence values, recipient-to-process mismatch, header volume, response ratio, and sensitive reads by the same process. Encrypted DNS or end-to-end mail can further block semantic inspection.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求外层协议事务有效、内部字段实际承载拟外传数据，并且该映射改变了防守分类或关联。普通 Base64、合法追踪标识、CDN 高熵标签、DKIM、邮件附件和 API 参数不因形态相似而纳入。只对内容加密而没有借用协议语义位置归检查不透明兄弟项；仅改变大小归 T1030；若同一事务属于既有 C2 回传则归 T1041。
          en: >-
            Inclusion requires a valid outer transaction, actual target data in its fields, and a resulting change to defensive classification or correlation. Ordinary Base64, legitimate tracking identifiers, high-entropy CDN labels, DKIM, mail attachments, and API parameters do not qualify from appearance alone. Content encryption without borrowing a protocol-semantic location belongs to the inspection-opaque sibling, size-only changes to T1030, and result transfer in the existing C2 transaction to T1041.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              ProjectSauron 具备 DNS 数据外传插件和多种 ICMP、UDP、TCP、DNS、SMTP、HTTP 通信能力；Kaspersky 明确说明其通过合法邮件和 DNS 路径外传，并把从受害者复制的信息伪装在常规流量中。该资料同时支持真实恶意使用、协议事务承载和降低局部可区分性的意图，比只列出工具能力更适合作为子项结论证据。
            en: >-
              ProjectSauron had a DNS data-exfiltration plug-in and communication capabilities spanning ICMP, UDP, TCP, DNS, SMTP, and HTTP. Kaspersky explicitly states that it used legitimate mail and DNS routes and disguised information copied from the victim within regular traffic. This supports real malicious use, carriage in protocol transactions, and intent to reduce local distinguishability, providing stronger child-level evidence than a capability list alone.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需实现协议有效的编码、分块、序列和接收端重组，并控制可接收 DNS 域、邮箱、Web 端点或等价基础设施。协议长度、字符集、速率、邮件反滥用和服务器验证限制吞吐；较低吞吐会延长暴露。若中介规范化、解码或对事务建长期基线，伪装成本显著增加。
              en: >-
                The attacker needs protocol-valid encoding, segmentation, sequencing, receiver-side reconstruction, and control of a receiving DNS domain, mailbox, web endpoint, or equivalent infrastructure. Protocol length and character sets, rate, mail anti-abuse, and server validation limit throughput, while lower throughput lengthens exposure. Intermediary normalization, decoding, and long-horizon transaction baselines raise the camouflage cost.
        defender_model:
          paragraphs:
            - zh: >-
                防守方可访问受管解析器、邮件网关或代理的事务级字段和原始载荷片段，并能按源设备、进程、注册域、收件人或 URI 长期聚合。若只保留流记录，或 DoH/DoT、TLS、外部邮件服务遮蔽事务，无法恢复载荷语义；即使字段可见，也需用正常服务基线过滤遥测、CDN、EDR、广告和软件更新。
              en: >-
                The defender can access transaction-level fields and raw payload fragments at managed resolvers, mail gateways, or proxies and aggregate by source device, process, registered domain, recipient, or URI over time. Flow-only records, DoH or DoT, TLS, and external mail services can hide transactions. Even with visible fields, normal-service baselines must filter telemetry, CDNs, EDR, advertising, and software updates.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 把失窃数据塑造成解析器仍接受的常规协议事务特征
          en: Shape stolen data into ordinary protocol-transaction features accepted by intermediaries
        analysis:
          paragraphs:
            - zh: >-
                攻击者把目标字节编码进合法字段并维持外层协议状态，使解析器、邮件中继或代理按正常事务转发。防守方看到的是 DNS 查询、邮件或 HTTP 请求，必须跨事件恢复隐藏负载后才能区分恶意。ProjectSauron 对“合法邮件和 DNS 路径”以及“隐藏于常规流量”的直接描述建立行为—痕迹—观察差异链；标签、收件人、序号和源进程仍可揭示不一致。
              en: >-
                The adversary encodes target bytes into valid fields and preserves outer protocol state, causing a resolver, mail relay, or proxy to forward an apparently normal transaction. The defender sees a DNS query, message, or HTTP request and must recover hidden payload across events before classifying it. ProjectSauron's directly reported use of legitimate mail and DNS routes with information disguised in regular traffic establishes the behavior-to-trace-to-observation chain; labels, recipients, sequence values, and source process remain available contradictions.
        evidence_keys: [B10-2-T1048-REF-SAURON, B10-2-T1048-REF-DNS-LOW]
        confidence: high
    evidence_keys: [B10-2-T1048-CLM-CAMOUFLAGE, B10-2-T1048-CASE-SAURON, B10-2-T1048-REF-SAURON, B10-2-T1048-REF-DNS-LOW, REF-000635]
    limitations:
      paragraphs:
        - zh: >-
            ProjectSauron 资料明确支持 DNS 和邮件外传及伪装意图，但公开内容未提供每次事务的完整 PCAP、接收端重组或本地误报统计。DNS 研究证明长期基线和合法服务过滤有用，也说明低吞吐更难识别；其评估数据不能直接移植为生产阈值。非 DNS 协议须使用各自语义解析，不能只复制熵规则。
          en: >-
            ProjectSauron reporting directly supports DNS and mail exfiltration and camouflage intent but does not publish complete PCAP, receiver reconstruction, or local false-positive statistics for every transaction. DNS research supports long-horizon baselining and legitimate-service filtering and also shows low-throughput detection is harder; its evaluation thresholds do not transfer directly to production. Non-DNS protocols need their own semantic parsers rather than copied entropy rules.
  - temporary_key: B10-2-T1048-CHILD-OPAQUE
    name:
      zh: 检查不透明替代传输
      en: Inspection-Opaque Alternative Transfer
    confidence: medium
    summary:
      zh: 攻击者让替代外传通道在防守检查点呈现为受保护会话或密文，使内容规则失去可解释输入。
      en: An adversary makes the alternative exfiltration channel appear at the defensive inspection point as a protected session or ciphertext, depriving content rules of interpretable input.
    definition_and_concept:
      paragraphs:
        - zh: >-
            检查不透明替代传输是经替代协议渗出的一种实现，其中攻击者使用 TLS、SSH/SFTP、协议外附加加密或等价保护，让选定检查点无法恢复外传内容。分类变量是防守方在该位置能否解释应用数据，而不是握手使用对称还是非对称算法；同一 SSH 或 TLS 会话通常同时包含公钥协商和对称内容保护。
          en: >-
            Inspection-Opaque Alternative Transfer is an implementation of Exfiltration Over Alternative Protocol in which the adversary uses TLS, SSH or SFTP, added encryption above a protocol, or equivalent protection so the chosen inspection point cannot recover exfiltrated content. The classification variable is whether the defender can interpret application data at that point, not whether the handshake uses symmetric or asymmetric cryptography. One SSH or TLS session commonly combines public-key establishment with symmetric content protection.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            检查不透明替代传输保留连接元数据、服务器名可见性、证书、握手、方向字节和进程归属，却把文件名、敏感内容和应用操作隐藏在加密边界后。只依赖 DLP 关键字或明文协议解析的控制无法判断内容；源文件访问、异常目的地、非典型进程、会话持续时间和出站字节仍可组成旁证。ECH、QUIC、复用连接和共享云端点会进一步减少元数据区分力。
          en: >-
            Inspection-Opaque Alternative Transfer preserves connection metadata, possible server-name visibility, certificates, handshake, directional bytes, and process attribution while hiding filenames, sensitive content, and application operations behind encryption. Keyword DLP or clear-text protocol parsing cannot judge the content. Source-file access, unusual destination, atypical process, duration, and outbound bytes remain corroborating evidence. ECH, QUIC, multiplexed connections, and shared cloud endpoints can further reduce metadata discrimination.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求替代外传关系和检查点内容不可解释同时成立。企业正常 HTTPS、SSH 管理、SFTP 备份、VPN 和同步并非恶意；加密连接、非浏览器进程或自签名证书单独不足。若不可解释性来自外传前的口令归档，可同时标注 NJT-0133，但传输通道自身仍需与 C2 不同；若只是把载荷编码进可解析字段，则归协议语义载荷伪装。
          en: >-
            Inclusion requires both an alternative exfiltration relationship and uninterpretable content at the inspection point. Ordinary enterprise HTTPS, SSH administration, SFTP backup, VPN, and synchronization are not malicious; encryption, a non-browser process, or a self-signed certificate alone is insufficient. Password-protected archives may additionally map to NJT-0133, but the transfer channel must still differ from C2. Payload merely encoded into parsable fields belongs to Protocol-Semantic Payload Camouflage.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              JPCERT/CC 在 MirrorFace 事件中确认攻击者审阅文件内容、用 WinRAR 准备数据并以 SFTP 外传。RFC 4253 规定 SSH 传输提供强加密、服务器认证和完整性，握手协商公钥与对称算法。二者共同证明真实恶意外传进入不透明 SSH 传输，但来源未说明受害防线是否因加密漏报，因此匿迹效果保持 medium。
            en: >-
              JPCERT/CC confirmed MirrorFace operators reviewing file content, preparing data with WinRAR, and exfiltrating by SFTP. RFC 4253 specifies strong encryption, server authentication, and integrity for SSH transport, with public-key and symmetric algorithms negotiated in the handshake. Together these establish real malicious exfiltration entering opaque SSH transport, while the incident does not say a victim control missed it because of encryption; stealth effect therefore remains medium-confidence.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要 SFTP/HTTPS 等客户端或自定义加密能力、接收端凭据/密钥以及可达目的地。保护内容会降低中间检查，但端点仍能在加密前读取数据，接收端与证书也可能被封锁。自建密钥管理、代理兼容性和握手指纹可能增加实施和暴露成本。
              en: >-
                The attacker needs an SFTP or HTTPS client or custom cryptographic capability, receiver credentials or keys, and a reachable destination. Content protection weakens intermediary inspection, but the endpoint still reads data before encryption and the receiver or certificate can be blocked. Custom key management, proxy compatibility, and handshake fingerprints can increase implementation and exposure costs.
        defender_model:
          paragraphs:
            - zh: >-
                防守方看到 Zeek conn/ssl、IPFIX 或防火墙元数据，并可用端点进程、文件访问与 DLP 在加密前建立谱系。若没有 TLS/SSH 元数据、端点文件审计或稳定进程键，只能得到目的地级候选；合法开发、备份和管理活动会产生相同会话。授权解密受隐私、证书固定和协议支持限制。
              en: >-
                The defender sees Zeek conn and ssl, IPFIX, or firewall metadata and can use endpoint process, file access, and pre-encryption DLP for lineage. Without TLS or SSH metadata, endpoint file audit, or stable process keys, only a destination-level candidate is possible. Legitimate development, backup, and administration create the same sessions. Authorized decryption is constrained by privacy, certificate pinning, and protocol support.
    stealth_mechanisms:
      - mechanism_ref: NM-DO
        role: primary
        summary:
          zh: 让中间检查点保留流量但无法解释外传文件和敏感内容
          en: Leave traffic visible while preventing an intermediary inspection point from interpreting files and sensitive content
        analysis:
          paragraphs:
            - zh: >-
                攻击者把替代外传数据放入加密会话，检查点从可解析文件或请求体退化为握手与密文字节。内容规则失去直接输入，检测必须转向敏感读取、进程、目的地和方向字节谱系。MirrorFace 的 SFTP 使用与 SSH 标准提供的加密能力支持该因果链；并未证明所有 SFTP 都服务匿迹或某产品被绕过。
              en: >-
                The adversary places alternative-channel exfiltration inside an encrypted session, reducing the inspection point from parsable files or request bodies to handshakes and ciphertext bytes. Content rules lose direct input, forcing detection onto sensitive-read, process, destination, and directional-byte lineage. MirrorFace's SFTP use and SSH's standardized encryption support the causal chain without proving that every SFTP session serves stealth or bypasses a product.
        evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253, B10-2-T1048-REF-ZEEK-SSL]
        confidence: medium
    evidence_keys: [B10-2-T1048-CLM-OPAQUE, B10-2-T1048-CASE-MIRRORFACE, B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253, B10-2-T1048-REF-ZEEK-SSL, REF-000634, REF-000604]
    limitations:
      paragraphs:
        - zh: >-
            SSH 与 TLS 的机密性是协议属性，不能证明攻击者主观匿迹目的。MirrorFace 资料证明 SFTP 外传，但不公开会话字节、证书、检测产品或告警结果。正式分析必须把“内容不可检查”与“外传已确认”分开，并以端点或数据谱系补足；只从加密流量反推数据失窃会产生大量误报。
          en: >-
            SSH and TLS confidentiality is a protocol property and does not prove adversary stealth intent. MirrorFace reporting establishes SFTP exfiltration but does not publish session bytes, certificates, detection products, or alert outcomes. Canonical analysis must keep “content opaque” separate from “exfiltration confirmed” and add endpoint or data lineage; inferring theft from encryption alone produces extensive false positives.
  - temporary_key: B10-2-T1048-CHILD-PULL
    name:
      zh: 受害服务拉取式外传
      en: Victim-Service Pull Exfiltration
    confidence: medium
    summary:
      zh: 攻击者把数据置于受害者对外服务路径，再从外部请求取回，使数据送出表现为服务响应而非内部主机主动上传。
      en: An adversary places data behind a victim-facing service and retrieves it from outside, making delivery appear as a service response rather than an internal host initiating an upload.
    definition_and_concept:
      paragraphs:
        - zh: >-
            受害服务拉取式外传是经替代协议渗出的一种实现：攻击者先把已收集数据写入受害 Web、邮件或等价对外服务能够返回的位置，再由外部客户端发起请求，使服务在正常响应方向上传输数据。分类变量是外部拉取和受害服务响应关系；暂存位置、文件扩展名和具体服务器产品不是子项边界。
          en: >-
            Victim-Service Pull Exfiltration is an implementation of Exfiltration Over Alternative Protocol in which the adversary first writes acquired data into a location that a victim-facing web, mail, or equivalent service can return, then initiates an outside request so the service transfers data in its normal response direction. The classification variable is the outside fetch and victim-service response relationship; staging location, extension, and server product do not define the child.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            受害服务拉取式外传使边界设备看到外部客户端访问组织自有服务以及服务发送响应，源主机不必建立面向攻击者的独立出站上传。基于“内部进程主动连接新外部目的地”的规则可能无匹配对象，目的 IP 归因也落在受害基础设施。服务端仍留下异常文件创建、发布路径、请求 URI、客户端 IP、响应字节、认证与清理记录；连接这些痕迹可恢复外传。
          en: >-
            Victim-Service Pull Exfiltration causes the perimeter to see an external client accessing an organization-owned service and the service returning a response, without a source workstation initiating a separate upload to the attacker. Rules based on an internal process connecting to a new outside destination may have no matching event, and destination attribution points to victim infrastructure. The service still leaves unusual file creation, served path, request URI, client IP, response bytes, authentication, and cleanup records that can reconstruct the theft.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入需要证明数据产物写入可服务位置、外部请求命中该产物并返回字节。只有 Web 根目录中的文件属于 T1074/NJT-0134 暂存，不足以确认外传；只有大响应或外部 GET 也不足。使用第三方代码库、云盘或文本站点由 T1567 负责；同一 C2 Web 会话取回结果归 T1041；合法发布、用户下载和管理员导出是强反例。
          en: >-
            Inclusion requires an artifact written into a served location and an outside request that hits it and returns bytes. A file in a web root is T1074 or NJT-0134 staging and does not alone confirm exfiltration; neither does a large response or outside GET. Third-party repositories, cloud drives, or text sites belong to T1567, retrieval through the same web C2 relationship to T1041, and authorized publishing, user downloads, and administrative exports are strong counterexamples.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              Dark Halo 在受害 OWA 服务器上导出目标邮箱、创建受口令保护的归档并命名为 Redir.png，随后使用公开 HTTPS URL 取回。Volexity 给出具体服务器路径和 URL，直接支持产物—服务路径—外部取回链；来源未量化异常响应告警或证明所有请求均逃过检查，因此匿迹效果保持 medium。
            en: >-
              Dark Halo exported target mailboxes on a victim OWA server, created a password-protected archive named Redir.png, and retrieved it through a public HTTPS URL. Volexity provides the server path and URL, directly supporting the artifact-to-service-path-to-outside-fetch chain. It does not quantify response anomaly alerts or establish that every request escaped inspection, so stealth effect remains medium-confidence.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要在对外服务主机写入或生成文件、预测外部可访问路径，并从外部请求取回。其可能需要高权限、服务配置知识和足够存储时间；WAF、发布目录 ACL、内容扫描、缓存和文件清理会影响成功。若服务通过 CDN 或反向代理提供内容，攻击者还需处理缓存与访问控制。
              en: >-
                The attacker needs to write or generate a file on a victim-facing service host, predict an externally reachable path, and retrieve it from outside. This may require privilege, service-configuration knowledge, and enough storage time. WAF, served-directory ACLs, content scanning, caching, and cleanup can affect success. A CDN or reverse proxy adds cache and access-control considerations.
        defender_model:
          paragraphs:
            - zh: >-
                防守方保留服务目录文件事件、生成进程/账号、IIS/W3C 或反向代理访问日志、响应字节和外部客户端信息，并能把物理路径映射到 URI。若内容在内存动态生成、日志不记响应字节、CDN 缓存或文件事件缺少进程键，关联会不完整。正常 Web 发布和大型下载必须由部署工单、内容来源和批准主体排除。
              en: >-
                The defender retains served-directory file events, creating process and account, IIS W3C or reverse-proxy access logs, response bytes, and external client information and can map physical paths to URIs. In-memory generation, logs without response bytes, CDN caching, or file events without process keys make the join incomplete. Normal web publishing and large downloads require deployment ticket, content provenance, and approved-principal exclusions.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 把外传改写为外部请求触发的受害服务响应以避开主动上传观察
          en: Recast exfiltration as a victim-service response triggered by an outside request to evade initiated-upload observation
        analysis:
          paragraphs:
            - zh: >-
                攻击者先把数据写入可服务位置，再由外部请求触发响应，网络方向从“内部主机主动上传”变为“服务器响应入站客户端”。只检测新外部目的地和上传进程的逻辑没有对应事件；文件写入与访问响应分处端点和 Web 日志。Dark Halo 提供了完整产物与取回链，实际漏报仍需本地验证。
              en: >-
                The adversary writes data into a served location and later triggers a response from outside, changing network direction from an internal host initiating an upload to a server responding to an inbound client. Logic that looks only for new outside destinations and uploader processes has no equivalent event, while the file write and response reside in endpoint and web logs. Dark Halo provides a complete artifact-and-retrieval chain, although actual alert loss needs local validation.
        evidence_keys: [REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]
        confidence: high
      - mechanism_ref: NM-FD
        role: secondary
        summary:
          zh: 让外传响应继承受害者公开服务和静态资源路径的合法外观
          en: Give the exfiltration response the legitimate appearance of the victim's public service and static-resource path
        analysis:
          paragraphs:
            - zh: >-
                由受害 OWA 或 Web 服务提供产物时，来源地址、TLS 服务身份与响应方向都属于受害组织；把归档命名为图片并置于现有静态目录进一步接近普通资源请求。防守方若仅依赖外部目的信誉或扩展名难以区分，仍可从创建进程、内容类型、响应体积和不常见客户端恢复异常。来源支持外观借用，不证明所有检查系统均受骗。
              en: >-
                When victim OWA or a web service serves the artifact, source address, TLS service identity, and response direction all belong to the victim organization. Naming the archive as an image in an existing static directory further resembles an ordinary resource request. Destination reputation or extension alone cannot distinguish it, while creating process, content type, response size, and unusual client can expose the mismatch. The source supports borrowed appearance but does not prove every inspection system was deceived.
        evidence_keys: [REF-000509]
        confidence: medium
    evidence_keys: [B10-2-T1048-CLM-PULL, CASE-000183, REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]
    limitations:
      paragraphs:
        - zh: >-
            Dark Halo 案例同时涉及邮箱导出、归档、暂存和清理；本子项只使用外部 HTTPS 请求从受害服务取回产物这一段。来源没有访问日志样本、响应字节或下载完成确认，但给出具体 URL 和服务器路径，足以支持拉取关系而不能量化检测效果。不同服务器和 CDN 的路径映射需要本地实现验证。
          en: >-
            The Dark Halo case also includes mailbox export, archiving, staging, and cleanup; this child uses only the outside HTTPS retrieval of the artifact from a victim service. The source does not publish the access-log record, response bytes, or download-completion confirmation, but the concrete URL and server path support the pull relationship without quantifying detection effect. Path mapping varies across servers and CDNs and requires local implementation validation.
defense_candidates:
  detection_strategies:
    - temporary_key: B10-2-T1048-DET-PROTOCOL
      name:
        zh: 替代协议角色、载荷与内容可见性关联
        en: Alternative-Protocol Role Payload and Content-Visibility Correlation
      summary:
        zh: 将资产角色、受管协议路径、事务语义、内容可见性和端点数据谱系关联，以识别不同于既有 C2 的外传。
        en: Join asset role, managed protocol path, transaction semantics, content visibility, and endpoint data lineage to identify exfiltration distinct from existing C2.
      description:
        zh: >-
          本策略用三项分析分工。角色偏离分析确认谁绕过了受管解析器、代理或中继；协议语义分析在 DNS、邮件和 HTTP 等事务内恢复隐藏载荷；不透明传输分析在无法读取内容时把敏感文件访问与 TLS/SSH 元数据、方向字节和接收端连接起来。三项都要求与已知 C2 关系比较，并保留普通管理、备份、更新、遥测和内容分发解释。
        en: >-
          Three analytics divide the work. Role deviation establishes who bypassed a managed resolver, proxy, or relay. Protocol semantics reconstructs hidden payload inside DNS, mail, HTTP, or another transaction. Opaque transfer joins sensitive-file access to TLS or SSH metadata, directional bytes, and receiver when content is unavailable. All three compare against the known C2 relationship and preserve administrative, backup, update, telemetry, and content-distribution explanations.
      detects_keys: [B10-2-T1048-PARENT, B10-2-T1048-CHILD-ROLE, B10-2-T1048-CHILD-CAMOUFLAGE, B10-2-T1048-CHILD-OPAQUE]
      domains: [enterprise]
      analytic_keys: [B10-2-T1048-NJA-ROLE, B10-2-T1048-NJA-SEMANTIC, B10-2-T1048-NJA-OPAQUE]
      evidence_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-SAURON, B10-2-T1048-REF-MIRRORFACE, REF-000634, REF-000635, REF-000604, B10-2-T1048-REF-ZEEK-SSL]
    - temporary_key: B10-2-T1048-DET-PULL
      name:
        zh: 受害服务产物—外部取回谱系
        en: Victim-Service Artifact-to-External-Retrieval Lineage
      summary:
        zh: 连接可服务目录中的异常产物、创建主体与外部成功响应，确认拉取式外传。
        en: Join an unusual artifact in a served location, its creator, and a successful external response to confirm pull-style exfiltration.
      description:
        zh: >-
          本策略以文件/对象到 URI 的发布关系为中心，不把一次大响应或 Web 根目录文件单独视为外传。分析需证明敏感产物由未批准进程或账号产生、进入可对外访问路径，并由外部客户端在相关窗口成功取回；部署、合法导出、公开下载和 CDN 发布须以工单及内容来源排除。
        en: >-
          This strategy centers on the publication relationship from file or object to URI and does not treat one large response or a web-root file as exfiltration alone. The analytic must establish that a sensitive artifact was generated by an unapproved process or account, entered an externally served path, and was successfully retrieved by an outside client in the relevant window. Deployment, authorized export, public download, and CDN publication require ticket and content-provenance exclusions.
      detects_keys: [B10-2-T1048-PARENT, B10-2-T1048-CHILD-PULL]
      domains: [enterprise]
      analytic_keys: [B10-2-T1048-NJA-PULL]
      evidence_keys: [REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]
  detection_analytics:
    - temporary_key: B10-2-T1048-NJA-ROLE
      strategy_key: B10-2-T1048-DET-PROTOCOL
      name:
        zh: 资产角色约束的直接协议出口差分
        en: Asset-Role-Constrained Direct Protocol Egress Differential
      summary:
        zh: 比较工作负载获准中介与实际协议路径，并用进程和数据访问确认异常直接外传。
        en: Compare a workload's approved intermediary with its actual protocol path and use process and data access to confirm anomalous direct exfiltration.
      logic:
        zh: >-
          建立 asset_id、process_role、network_zone、approved_protocol、approved_intermediary、approved_destination 和 exception_id 的版本化清单。将 Zeek conn、端点网络事件和可用 DNS/代理/邮件记录规范为 direct_or_mediated；识别终端直连外部 DNS/DoT、非邮件服务器直连 SMTP、非批准进程使用 FTP/SFTP/外部 SMB，或服务/端口与解析结果不一致。随后按 device_id、process_start_key、user、destination、protocol 在三十分钟至二十四小时内关联敏感文件读取、归档/暂存和方向字节，并与同一入侵已知 C2 的 protocol/destination 分开记录。只有策略偏离、外传谱系和不同于 C2 三者同时存在时输出 role_deviant_alternative_exfiltration；否则保留 policy_deviation 或 data_egress_candidate。
        en: >-
          Build a versioned inventory of asset_id, process_role, network_zone, approved_protocol, approved_intermediary, approved_destination, and exception_id. Normalize Zeek conn, endpoint network, and available DNS, proxy, or mail records into direct_or_mediated. Identify endpoints contacting external DNS or DoT directly, non-mail servers contacting SMTP directly, unapproved processes using FTP, SFTP, or external SMB, or service and port inconsistent with protocol parsing. Join sensitive-file reads, archive or staging activity, and directional bytes over thirty minutes to twenty-four hours by device_id, process_start_key, user, destination, and protocol, preserving the intrusion's known C2 protocol and destination separately. Emit role_deviant_alternative_exfiltration only when policy deviation, data lineage, and distinction from C2 all exist; otherwise retain policy_deviation or data_egress_candidate.
      data_requirements:
        - source_type: asset_egress_policy
          name: {zh: 资产与进程出口角色清单, en: Asset and process egress role inventory}
          channel: CMDB or network policy repository
          required_fields: [asset_id, process_role, network_zone, approved_protocol, approved_intermediary, approved_destination, policy_version, exception_id]
        - source_type: network_flow
          name: {zh: 方向连接与协议识别, en: Directional connection and protocol identification}
          channel: Zeek conn.log or equivalent flow sensor
          required_fields: [ts, uid, id.orig_h, id.resp_h, id.resp_p, proto, service, duration, orig_bytes, resp_bytes]
        - source_type: endpoint_process_network
          name: {zh: 端点进程网络归属, en: Endpoint process network attribution}
          channel: Microsoft DeviceNetworkEvents or equivalent EDR
          required_fields: [Timestamp, DeviceId, RemoteIP, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine]
      observables:
        - {zh: 工作负载绕过受管解析器、代理或中继直连外部协议端点, en: A workload bypasses its managed resolver proxy or relay and contacts an external protocol endpoint directly}
        - {zh: 同一进程的敏感读取或暂存后出现方向出站字节且协议不同于既有 C2, en: Sensitive reads or staging by the same process precede outbound bytes over a protocol distinct from existing C2}
      correlation:
        window: {zh: 三十分钟至二十四小时，按本地外传任务持续时间调优, en: Thirty minutes to twenty-four hours tuned to local exfiltration job duration}
        dimensions: [device_id, process_start_key, user, source_ip, destination_ip_or_service, protocol, c2_relationship_id, policy_version]
      false_positives:
        - {zh: 批准备份、管理员 SFTP、软件发布、邮件服务器投递、DNS 递归器与应急传输, en: Approved backup administrator SFTP software distribution mail-server delivery DNS resolvers and emergency transfer}
      blind_spots:
        - {zh: NAT 或共享代理丢失主机身份、端口复用或加密隐藏协议、缺失进程网络键和过期角色清单, en: NAT or shared proxies losing host identity protocol hidden by port reuse or encryption missing process-network keys and stale role inventory}
      tuning_guidance:
        zh: >-
          先按资产/进程角色定义允许路径，而不是全局封禁协议。对 DNS、邮件、备份和开发工具建立带所有者、目的地和到期时间的例外；新目的地、敏感读取和不匹配进程提高风险，但任何单项均不直接确认外传。保留 direct_or_mediated 及政策版本，避免网络改造后沿用旧基线。
        en: >-
          Define allowed paths by asset and process role instead of globally banning protocols. Give DNS, mail, backup, and development-tool exceptions an owner, destination, and expiry. New destinations, sensitive reads, and process mismatch raise risk, but no single feature confirms exfiltration. Retain direct_or_mediated and policy version so network redesign does not leave a stale baseline.
      evidence_keys: [B10-2-T1048-REF-OILRIG, B10-2-T1048-REF-NIST-FW, REF-000634, REF-000604]
    - temporary_key: B10-2-T1048-NJA-SEMANTIC
      strategy_key: B10-2-T1048-DET-PROTOCOL
      name:
        zh: 多协议载荷语义与源数据重组
        en: Cross-Protocol Payload Semantics and Source-Data Reconstruction
      summary:
        zh: 按协议解析隐藏字段并与源数据或进程谱系关联，识别看似正常事务中的外传载荷。
        en: Parse protocol-specific hidden fields and join them to source data or process lineage to identify exfiltration payloads inside apparently normal transactions.
      logic:
        zh: >-
          对 DNS 按 source_host、process、registered_domain 聚合 query、qtype、rcode、answers、标签长度、字符集、唯一率、序号和查询—响应比例，比较该域及软件的正常模型并尝试只在可逆规则明确时解码/重组。对邮件按 message_id、sender、recipient、client_process、attachment_hash、body_size 和 MIME 关联批准客户端与业务收件人；对可检查 HTTP 按 uid、method、host、uri、request_body_len、header_name/value_shape 与状态聚合。通用结果状态为 semantic_anomaly、reconstructible_payload 和 source_data_match；最后一级要求重组字节、敏感类型或同进程读取与载荷相符。熵、长域名、Base64 或单次大邮件只能产生低置信候选。
        en: >-
          For DNS, aggregate query, qtype, rcode, answers, label length, alphabet, uniqueness, sequence values, and query-to-response ratio by source_host, process, and registered_domain. Compare the domain and software's normal model and decode or reconstruct only when a reversible rule is established. For mail, join message_id, sender, recipient, client_process, attachment_hash, body_size, and MIME against approved clients and business recipients. For inspectable HTTP, aggregate uid, method, host, uri, request_body_len, header_name or value shape, and status. Emit semantic_anomaly, reconstructible_payload, and source_data_match separately; the last requires reconstructed bytes or sensitive type matching a source read by the same process. Entropy, long domains, Base64, or one large message yields only a low-confidence candidate.
      data_requirements:
        - source_type: dns_transaction
          name: {zh: DNS 请求与响应, en: DNS queries and responses}
          channel: managed resolver or Zeek dns.log
          required_fields: [ts, uid, id.orig_h, id.resp_h, query, qtype_name, rcode_name, answers]
        - source_type: mail_gateway
          name: {zh: 邮件提交与投递日志, en: Mail submission and delivery log}
          channel: managed SMTP or mail security gateway
          required_fields: [event_time, message_id, source_host, sender, recipient, client_process_or_auth, subject, body_size, attachment_name, attachment_hash, action]
        - source_type: http_transaction
          name: {zh: 可检查 HTTP 事务, en: Inspectable HTTP transaction}
          channel: proxy or Zeek http.log after authorized inspection
          required_fields: [ts, uid, id.orig_h, id.resp_h, method, host, uri, request_body_len, status_code]
      observables:
        - {zh: 跨多次协议事务形成可排序、可逆或与敏感源数据相符的载荷, en: Multiple protocol transactions form an ordered reversible payload or one matching sensitive source data}
        - {zh: 事务由不符合业务角色的进程产生并发往未批准域、收件人或 URI, en: Transactions originate from a role-incongruent process and target an unapproved domain recipient or URI}
      correlation:
        window: {zh: 一小时至七天，以覆盖低吞吐 DNS/邮件外传并受保留期限约束, en: One hour to seven days to cover low-throughput DNS or mail exfiltration subject to retention}
        dimensions: [source_host, process_start_key, registered_domain_or_recipient, protocol, message_or_transaction_id, sequence_value, time]
      false_positives:
        - {zh: CDN、EDR 与软件遥测、高熵服务发现、DKIM/邮件网关封装、合法 API 编码和自动报告, en: CDNs EDR and software telemetry high-entropy service discovery DKIM or gateway wrapping legitimate API encoding and automated reporting}
      blind_spots:
        - {zh: DoH/DoT、端到端加密邮件、TLS 未检查、递归器隐藏客户端、原始字段截断或缺少接收端日志, en: DoH or DoT end-to-end encrypted mail uninspected TLS resolvers hiding clients truncated raw fields or absent receiver logs}
      tuning_guidance:
        zh: >-
          按注册域、软件和业务功能训练正常事务，不使用全局熵阈值。DNS 低吞吐必须延长窗口并过滤已知合法交换；邮件按批准发件进程和收件人关系调优；HTTP 首部/参数只有与源数据或进程谱系结合才升级。解析器失败和不可逆编码应保留为盲区，而不是强行解码。
        en: >-
          Model normal transactions by registered domain, software, and business function rather than using a global entropy threshold. Low-throughput DNS requires longer windows and legitimate-exchange filtering. Tune mail by approved sending process and recipient relationship. Upgrade HTTP header or parameter candidates only with source-data or process lineage. Record parser failure and irreversible encoding as blind spots instead of forcing a decode.
      evidence_keys: [B10-2-T1048-REF-SAURON, B10-2-T1048-REF-DNS-LOW, REF-000635, REF-000632]
    - temporary_key: B10-2-T1048-NJA-OPAQUE
      strategy_key: B10-2-T1048-DET-PROTOCOL
      name:
        zh: 敏感读取至不透明替代会话谱系
        en: Sensitive Read to Opaque Alternative Session Lineage
      summary:
        zh: 在内容不可见时以文件读取、进程、TLS/SSH 元数据、方向字节和接收端确认替代外传。
        en: When content is unavailable, use file reads, process, TLS or SSH metadata, directional bytes, and receiver to confirm alternative exfiltration.
      logic:
        zh: >-
          先从敏感标签、文件路径、数据库导出、归档创建或大量读取形成 source_set_id；在五分钟至二十四小时内以 device_id、process_start_key 和 socket 关联 Zeek conn/ssl、IPFIX 与端点网络事件。记录 server_name、certificate/issuer、version、cipher、next_protocol、established、destination、orig_bytes、duration 和 approved_receiver，并与已知 C2 relationship_id 比较。只有源数据谱系、不同于 C2 的受保护会话和实际出站量同时存在时输出 opaque_alternative_exfiltration；只有 TLS/SSH、非浏览器进程或新证书分别保持 encrypted_egress_candidate。
        en: >-
          First derive source_set_id from sensitivity labels, file paths, database exports, archive creation, or high-volume reads. Over five minutes to twenty-four hours, join Zeek conn or ssl, IPFIX, and endpoint network events by device_id, process_start_key, and socket. Record server_name, certificate or issuer, version, cipher, next_protocol, established, destination, orig_bytes, duration, and approved_receiver and compare with known C2 relationship_id. Emit opaque_alternative_exfiltration only when source-data lineage, a protected session distinct from C2, and actual outbound volume all exist. TLS or SSH, a non-browser process, or a new certificate alone remains encrypted_egress_candidate.
      data_requirements:
        - source_type: endpoint_file
          name: {zh: 敏感文件访问与产物事件, en: Sensitive file access and artifact events}
          channel: DeviceFileEvents, Sysmon or equivalent EDR and DLP
          required_fields: [event_time, device_id, action_type, folder_path, file_name, file_size, sensitivity_label, initiating_process_unique_id, account]
        - source_type: tls_session
          name: {zh: TLS/SSH 会话元数据, en: TLS or SSH session metadata}
          channel: Zeek ssl.log plus conn.log or equivalent sensor
          required_fields: [ts, uid, id.orig_h, id.resp_h, version, cipher, server_name, next_protocol, established, cert_chain_fuids, orig_bytes, duration]
        - source_type: endpoint_process_network
          name: {zh: 端点进程网络归属, en: Endpoint process network attribution}
          channel: Microsoft DeviceNetworkEvents or equivalent EDR
          required_fields: [Timestamp, DeviceId, RemoteIP, RemoteUrl, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine]
      observables:
        - {zh: 敏感读取或归档产物后同进程向非 C2 接收端建立受保护会话并持续发送字节, en: The same process establishes a protected session to a non-C2 receiver and sends bytes after sensitive reads or archive creation}
        - {zh: 会话内容不可检查但目的地、进程或体积不符合资产角色和批准接收端, en: Session content is opaque while destination process or volume conflicts with asset role and approved receivers}
      correlation:
        window: {zh: 敏感读取前五分钟至后二十四小时, en: Five minutes before sensitive reads through twenty-four hours after}
        dimensions: [device_id, process_start_key, source_set_id, destination, server_name, certificate_id, c2_relationship_id, time]
      false_positives:
        - {zh: 备份、源代码推送、SFTP 管理、数据库复制、云同步和批准大文件上传, en: Backup source-code push SFTP administration database replication cloud sync and approved large uploads}
      blind_spots:
        - {zh: 文件读取未记录、QUIC/ECH 隐藏元数据、长连接复用、共享云端点和无法映射到进程的网络传感器, en: Unlogged file reads metadata hidden by QUIC or ECH long-connection multiplexing shared cloud endpoints and sensors without process mapping}
      tuning_guidance:
        zh: >-
          以批准接收端、进程签名、账号、资产角色和工单建立正向基线；不按“非浏览器 TLS”单独告警。对共享云目标提高源数据与身份权重，对自管 SFTP 要求固定主机密钥/证书、批准账号和维护窗口。无法证明不同于 C2 时降级为一般加密外联候选。
        en: >-
          Build a positive baseline from approved receivers, process signing, account, asset role, and ticket. Do not alert on non-browser TLS alone. Increase source-data and identity weight for shared cloud destinations. Require fixed host keys or certificates, approved accounts, and maintenance windows for managed SFTP. When distinction from C2 cannot be shown, downgrade to a general encrypted-egress candidate.
      evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253, B10-2-T1048-REF-ZEEK-SSL, REF-000634, REF-000604, B10-2-T1048-REF-MDE-FILE]
    - temporary_key: B10-2-T1048-NJA-PULL
      strategy_key: B10-2-T1048-DET-PULL
      name:
        zh: 可服务产物创建至外部成功响应关联
        en: Served Artifact Creation to Successful External Response Correlation
      summary:
        zh: 将服务路径中的敏感产物及其创建者与外部请求、响应字节和后续清理关联。
        en: Join a sensitive artifact and its creator in a served path to an outside request, response bytes, and later cleanup.
      logic:
        zh: >-
          建立服务实例的 physical_path_to_uri、deployment_principal、approved_content_source 和 expected_mime 清单。对 Web 根、静态目录、导出目录或对象存储的 FileCreated/FileRenamed 事件记录 file_id/hash/size/sensitivity、writer_process、account 和 deployment_id；随后在零至七十二小时内按 URI/path、host、size 与时间关联 IIS W3C、反向代理或对象访问日志中的外部 client_ip、method、status、sc_bytes、user_agent 和 auth_identity。若未批准主体生成敏感产物，外部 GET/下载返回成功且响应量与产物相容，则输出 pull_exfiltration_confirmed；只有文件或只有下载分别保持 staged_artifact 与 external_retrieval_candidate。删除与导出请求清理作为加权证据，不是必需条件。
        en: >-
          Inventory physical_path_to_uri, deployment_principal, approved_content_source, and expected_mime for each service instance. For FileCreated or FileRenamed events in web roots, static, export, or object-storage paths, record file_id or hash, size, sensitivity, writer_process, account, and deployment_id. Over zero to seventy-two hours, join by URI or path, host, size, and time to external client_ip, method, status, sc_bytes, user_agent, and auth_identity in IIS W3C, reverse-proxy, or object-access logs. Emit pull_exfiltration_confirmed when an unapproved principal creates a sensitive artifact and an outside GET or download succeeds with a response size compatible with the artifact. File-only and download-only states remain staged_artifact and external_retrieval_candidate. Deletion and export-request cleanup add weight but are not required.
      data_requirements:
        - source_type: endpoint_file
          name: {zh: 服务目录文件事件, en: Served-directory file events}
          channel: DeviceFileEvents, Sysmon Event ID 11 or equivalent EDR
          required_fields: [event_time, device_id, action_type, folder_path, file_name, file_size, sha1_or_file_id, sensitivity_label, initiating_process_unique_id, initiating_process_account]
        - source_type: web_access
          name: {zh: Web 服务访问与响应, en: Web service access and response}
          channel: IIS W3C, reverse proxy or object-access log
          required_fields: [event_time, server_id, client_ip, method, uri_stem_or_object_key, status, bytes_sent, user_agent, auth_identity]
        - source_type: service_publication_map
          name: {zh: 物理路径到公开 URI 映射, en: Physical path to public URI map}
          channel: web-server configuration and deployment inventory
          required_fields: [server_id, physical_path, uri_prefix, expected_mime, deployment_principal, approved_content_source, config_version]
      observables:
        - {zh: 未批准进程把敏感产物写入可服务路径，随后外部客户端成功取回相容字节, en: An unapproved process writes a sensitive artifact into a served path and an outside client later retrieves compatible bytes successfully}
        - {zh: 文件扩展名、MIME、创建主体或部署工单与公开请求不一致, en: Extension MIME creating principal or deployment ticket conflicts with the public request}
      correlation:
        window: {zh: 产物创建后零至七十二小时，并保留后续删除窗口, en: Zero to seventy-two hours after artifact creation plus a later deletion window}
        dimensions: [server_id, file_or_object_id, physical_path, uri, client_ip, writer_process_start_key, account, deployment_id, time]
      false_positives:
        - {zh: 正常网站部署、用户授权导出、公开下载、备份恢复、CDN 源站更新和安全团队取证取回, en: Normal website deployment user-authorized export public download backup restoration CDN origin update and security-team forensic retrieval}
      blind_spots:
        - {zh: 动态内存响应、CDN 只留边缘日志、响应字节未记录、路径重写未建模或文件事件缺少写入进程, en: Dynamic in-memory responses edge-only CDN logs missing response bytes unmodeled path rewriting or file events without writer process}
      tuning_guidance:
        zh: >-
          对可服务目录实行批准部署主体和变更窗口正向清单，并保留 path-to-URI 版本。优先调查敏感标签、归档/图片扩展不一致、新外部客户端与创建后短时取回；不能以扩展名或响应大小单独判定。对 CDN 场景引入源站对象 ID 与边缘请求 ID，无法联接时明确降低置信度。
        en: >-
          Positively inventory approved deployment principals and change windows for served locations and version the path-to-URI map. Prioritize sensitivity labels, archive or image extension mismatch, new outside clients, and retrieval shortly after creation; extension or response size alone is not decisive. For CDNs, add origin-object and edge-request IDs and explicitly lower confidence when they cannot be joined.
      evidence_keys: [REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]
  mitigations:
    - temporary_key: B10-2-T1048-MIT-PROTOCOL
      name:
        zh: 角色绑定协议中介与加密前数据控制
        en: Role-Bound Protocol Mediation and Pre-Encryption Data Control
      summary:
        zh: 按工作负载限定协议、中介和接收端，在数据进入不透明或响应式通道前实施敏感内容控制。
        en: Constrain protocol, intermediary, and receiver by workload and apply sensitive-data controls before content enters an opaque or response-based channel.
      description:
        zh: >-
          该控制把网络默认拒绝、受管 DNS/邮件/Web 中介、端点 DLP 与服务发布路径治理组成同一出口政策。协议只从获准角色和中介到达获准接收端；敏感文件在加密或协议字段嵌入之前由端点控制判断；对外服务目录只允许部署主体写入并保留文件到请求的关联。措施需要审计优先部署、带期限例外和业务连续性评估。
        en: >-
          This control combines network default-deny, managed DNS, mail and web intermediaries, endpoint DLP, and service-publication governance in one egress policy. Protocols reach approved receivers only from approved roles and intermediaries. Endpoint controls judge sensitive files before encryption or protocol-field embedding. Victim-facing served locations accept writes only from deployment principals and preserve file-to-request joins. Measures need audit-first rollout, time-bounded exceptions, and business-continuity review.
      measures:
        - key: role-bound-protocol-mediation
          name: {zh: 按角色绑定协议与中介, en: Role-Bound Protocol and Intermediary}
          control_type: preventive
          description:
            zh: 终端仅经受管解析器发起 DNS、仅经邮件中继发送邮件、仅经批准代理访问 Web，并按资产角色阻断不必要的外部 FTP、SFTP、SMB、SMTP、DNS/DoT 与非标准协议；每项例外绑定主体、目的地、协议、所有者和到期时间。
            en: Require endpoints to use managed resolvers for DNS, mail relays for mail, and approved proxies for web access, and block unnecessary external FTP, SFTP, SMB, SMTP, DNS or DoT, and nonstandard protocols by asset role. Bind each exception to principal, destination, protocol, owner, and expiry.
        - key: pre-encryption-sensitive-data-control
          name: {zh: 加密前敏感数据控制, en: Pre-Encryption Sensitive Data Control}
          control_type: preventive
          description:
            zh: 在端点文件访问、浏览器/应用上传和邮件提交处按敏感标签、目的域、应用与用户执行审计、警告或阻断，使 TLS、SSH 或自定义编码前仍有内容判定点。
            en: Audit, warn, or block at endpoint file access, browser or application upload, and mail submission by sensitivity label, destination domain, application, and user so content remains governable before TLS, SSH, or custom encoding.
        - key: served-path-publication-governance
          name: {zh: 对外服务发布路径治理, en: Victim-Facing Publication Path Governance}
          control_type: preventive
          description:
            zh: 将 Web 根、静态目录、导出路径和对象桶写权限限制给专用部署主体，禁止应用服务账号任意写入公开路径，并记录文件/对象 ID 到 URI、部署工单和访问请求的关系。
            en: Restrict writes to web roots, static directories, export paths, and object buckets to dedicated deployment principals, prevent service accounts from arbitrary publication, and record file or object ID to URI, deployment ticket, and access-request relationships.
        - key: cross-surface-retention
          name: {zh: 跨观察面关联字段保留, en: Cross-Surface Join-Field Retention}
          control_type: detective-support
          description:
            zh: 统一保留受管中介、端点进程/文件、连接/TLS 和服务访问日志中的设备、进程、身份、事务、对象和时间键，覆盖低吞吐与延迟拉取窗口。
            en: Retain device, process, identity, transaction, object, and time keys across managed intermediary, endpoint process and file, connection and TLS, and service-access logs for low-throughput and delayed-pull windows.
      applications:
        - target_key: B10-2-T1048-PARENT
          use:
            zh: 按工作负载列出允许协议、中介、应用和接收端，并在端点和网络同时拒绝未授权替代通道；外传调查跨 C2 与替代路径保留同一设备和数据对象。
            en: Inventory allowed protocols, intermediaries, applications, and receivers by workload and deny unauthorized alternative channels at both endpoint and network. Preserve device and data-object identity across C2 and alternative-path investigation.
          expected_effect:
            zh: 缩小攻击者可把外传迁移到另一观察面的路径集合，并使剩余例外具备可审计主体与目的地。
            en: Narrow the path set onto which an adversary can move exfiltration and give remaining exceptions auditable principals and destinations.
          limitations:
            zh: 已批准应用、服务账号和接收端被控时仍可外传；严格策略可能中断研发、备份和应急运维。
            en: Compromised approved applications, service accounts, and receivers can still exfiltrate data; strict policy can disrupt development, backup, and emergency operations.
        - target_key: B10-2-T1048-CHILD-ROLE
          use:
            zh: 仅允许终端访问企业解析器和代理，邮件只经中继，FTP/SFTP 等按角色和固定目的地授权，并记录直接连接拒绝。
            en: Allow endpoints to reach enterprise resolvers and proxies only, route mail through relays, authorize FTP or SFTP by role and fixed destination, and log direct-connection denials.
          expected_effect:
            zh: 直接协议偏离在建立会话前被阻断，或至少产生带政策版本和主体的明确拒绝证据。
            en: Block direct protocol deviation before session establishment or at least produce explicit denial evidence with policy version and principal.
          limitations:
            zh: DoH、协议隧道、被控中介和业务例外可绕过简单端口控制，必须结合应用识别和端点策略。
            en: DoH, protocol tunneling, compromised intermediaries, and business exceptions bypass simple port controls and require application identification and endpoint policy.
        - target_key: B10-2-T1048-CHILD-CAMOUFLAGE
          use:
            zh: 强制协议经可记录事务的受管中介，并在端点把敏感读取与 DNS、邮件或 Web 提交进程关联；对未知编码只限制接收端与应用，不依赖单一熵阈值。
            en: Force protocols through managed intermediaries with transaction logs and join sensitive reads at the endpoint to DNS, mail, or web-submission processes. For unknown encoding, constrain receiver and application rather than relying on one entropy threshold.
          expected_effect:
            zh: 缩小可隐藏载荷的协议路径，并保留跨事务重组和源数据核验所需字段。
            en: Reduce protocol paths available for hidden payload and preserve fields needed for cross-transaction reconstruction and source-data validation.
          limitations:
            zh: 低吞吐、小量凭据、加密 DNS 和外部邮件可能仍不可见；过度解析会增加成本和隐私风险。
            en: Low-throughput or small credential theft, encrypted DNS, and external mail may remain invisible; deep parsing adds cost and privacy risk.
        - target_key: B10-2-T1048-CHILD-OPAQUE
          use:
            zh: 在数据进入 TLS/SSH 前由端点 DLP 按文件标签、应用和目的地控制上传，并只允许受管 SFTP/HTTPS 接收端与账号。
            en: Apply endpoint DLP by file label, application, and destination before data enters TLS or SSH, and permit only managed SFTP or HTTPS receivers and accounts.
          expected_effect:
            zh: 内容不透明不再消除最后的内容判定点，未知接收端在网络层仍可被阻断。
            en: Content opacity no longer removes the last content decision point, while unknown receivers remain blockable at the network layer.
          limitations:
            zh: 内存生成内容、未受管设备、自定义客户端和已批准接收端滥用可绕过端点 DLP；TLS 检查并非普遍可行。
            en: In-memory content, unmanaged devices, custom clients, and abuse of approved receivers can bypass endpoint DLP; TLS inspection is not universally feasible.
        - target_key: B10-2-T1048-CHILD-PULL
          use:
            zh: 把对外目录写权限与应用运行身份分离，要求部署工单和内容扫描，并使新产物在外部可取回前完成审批；保留对象到访问请求的日志。
            en: Separate victim-facing directory write access from application runtime identity, require deployment tickets and content scanning, and approve new artifacts before external retrieval while retaining object-to-request logs.
          expected_effect:
            zh: 未授权进程难以把暂存产物直接发布，外部拉取即使发生也能连接到写入主体。
            en: Unapproved processes cannot readily publish staged artifacts, and an outside fetch that occurs can be joined back to its writer.
          limitations:
            zh: 应用漏洞、被盗部署凭据、动态响应和对象存储预签名 URL 仍可能提供取回路径；发布审核会增加运维延迟。
            en: Application vulnerabilities, stolen deployment credentials, dynamic responses, and object-store presigned URLs can still provide retrieval paths; publication review adds operational delay.
      evidence_keys: [B10-2-T1048-REF-NIST-FW, B10-2-T1048-REF-PURVIEW-DLP, REF-000514, B10-2-T1048-REF-MDE-FILE, B10-2-T1048-REF-SAURON]
    - existing_ref: MIT-000156
      resolution: extend
      name:
        zh: 受控出口与累计上传预算
        en: Governed Egress and Cumulative Upload Budget
      application_proposal:
        zh: >-
          现有 measures 的“批准上传路径”和“跨事件累计上传预算”语义不变，可为 T1048 父项、角色偏离和检查不透明子项增加 applications：按主体、应用和目的地限制替代接收端，并在内容不可见时保留方向字节累计。它不能替代新 MIT 的协议中介、端点加密前 DLP 或服务发布路径措施。
        en: >-
          The existing Approved Upload Paths and Across-Event Upload Budget measures retain their meaning and can gain applications for the T1048 parent, Role-Deviant Protocol Egress, and Inspection-Opaque Alternative Transfer: constrain alternative receivers by principal, application, and destination and preserve cumulative directional bytes when content is opaque. It does not replace the new mitigation's protocol mediation, endpoint pre-encryption DLP, or service-publication governance.
