  claims:
    - temporary_key: B10-2-T1048-CLM-ADMISSION
      statement_zh: 经替代协议渗出以不同于既有 C2 的协议或接收关系输送数据，分割控制与外传的防守观察面；同一 C2 会话回传不属于该边界。
      statement_en: Exfiltration Over Alternative Protocol delivers data through a protocol or receiver relationship distinct from existing C2, splitting defensive observation of control and exfiltration; return through the same C2 session is outside this boundary.
      evidence_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-OILRIG, REF-000509]
      confidence: high
    - temporary_key: B10-2-T1048-CLM-TAXONOMY
      statement_zh: 对称、非对称与未加密不是稳定 Niji 兄弟边界；防守差异更稳定地落在角色路径偏离、协议语义伪装、检查可解释性和受害服务拉取关系上。
      statement_en: Symmetric, asymmetric, and unencrypted are not stable Niji sibling boundaries; defender differences converge more stably on role-path deviation, protocol-semantic camouflage, inspection interpretability, and victim-service pull relationships.
      evidence_keys: [B10-2-T1048-REF-ATTACK19, B10-2-T1048-REF-RFC4253, B10-2-T1048-REF-SAURON, REF-000509]
      confidence: high
    - temporary_key: B10-2-T1048-CLM-ROLE
      statement_zh: OilRig 的 DNS 控制链收到独立 FTP PUT 命令，把侦察输出发送到外部 IP，直接证明控制协议与外传协议分离；对批准路径和告警效果的结论仍需本地证据。
      statement_en: OilRig's DNS control chain received separate FTP PUT commands sending reconnaissance output to external IPs, directly establishing separation of control and exfiltration protocols; approved-path and alert-effect conclusions still require local evidence.
      evidence_keys: [B10-2-T1048-REF-OILRIG]
      confidence: high
    - temporary_key: B10-2-T1048-CLM-CAMOUFLAGE
      statement_zh: ProjectSauron 使用 DNS 和合法邮件路径外传并把从受害者复制的信息伪装在常规流量中，支持协议语义载荷伪装作为独立匿迹变量。
      statement_en: ProjectSauron used DNS and legitimate mail routes and disguised victim-copied information in regular traffic, supporting protocol-semantic payload camouflage as an independent stealth variable.
      evidence_keys: [B10-2-T1048-REF-SAURON]
      confidence: high
    - temporary_key: B10-2-T1048-CLM-OPAQUE
      statement_zh: SFTP 外传使中间检查点只保留 SSH 加密会话与元数据，而文件内容不可直接解释；真实恶意使用已获证，但特定防线漏报未获证。
      statement_en: SFTP exfiltration leaves an intermediary inspection point with an encrypted SSH session and metadata while file content is not directly interpretable; real malicious use is supported, but bypass of a particular defense is not.
      evidence_keys: [B10-2-T1048-REF-MIRRORFACE, B10-2-T1048-REF-RFC4253]
      confidence: medium
    - temporary_key: B10-2-T1048-CLM-PULL
      statement_zh: 把敏感产物置入受害服务公开路径并由外部请求取回，会把主动上传痕迹改写为服务响应，且可通过文件创建—URI—外部响应谱系恢复。
      statement_en: Placing a sensitive artifact in a victim-service public path and retrieving it from outside changes an initiated-upload trace into a service response and can be recovered through file-creation-to-URI-to-external-response lineage.
      evidence_keys: [REF-000509, REF-000514, B10-2-T1048-REF-MDE-FILE]
      confidence: high
    - temporary_key: B10-2-T1048-CLM-DEFENSE
      statement_zh: 协议偏离、语义载荷、不透明会话和服务拉取需要不同字段与关联模型，单一端口、加密或大流量规则不能为四者提供可实施覆盖。
      statement_en: Protocol deviation, semantic payloads, opaque sessions, and service pull require different fields and correlation models; one port, encryption, or volume rule cannot implement coverage for all four.
      evidence_keys: [REF-000634, REF-000635, REF-000632, B10-2-T1048-REF-ZEEK-SSL, REF-000514, B10-2-T1048-REF-MDE-FILE]
      confidence: high
