      title: {zh: NIST SP 800-41 Rev.1 防火墙与出入站策略指南, en: NIST SP 800-41 Rev.1 Guidelines on Firewalls and Firewall Policy}
      url: https://doi.org/10.6028/NIST.SP.800-41r1
      supports: Explicit policy for inbound and outbound traffic by source, destination, protocol, application, and content; deny traffic not expressly permitted
