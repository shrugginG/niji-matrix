handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-002
work_item_ref: WORK-TA0010-T1052
temporary_key_prefix: B10-2-T1052-
candidate:
  source_type: attack
  source_attack_id: T1052
  name:
    zh: 通过物理介质外传
    en: Exfiltration Over Physical Medium
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: >-
          Enterprise ATT&CK 19.1 将 T1052 定义为通过可移动驱动器等物理介质外传数据，并明确介质既可成为最终外传点，也可在原本断开的系统之间跳转。该行为在 TA0010 中独立成立，但 Niji 准入需从“使用介质”收窄为可证明的数据与保管链：受害数据被写入或置于可携介质，介质随后断开并脱离原观察域，由攻击者、协作者或后继系统接续读取。ESET USBStealer 研究给出联网 A 与隔离 B 间同一介质往返、B 收集并在后续插入时写回介质、再由 A 侧取回的完整能力链；ProjectSauron 研究给出从隔离网向联网系统搬运数据的专用介质模块。
        en: >-
          Enterprise ATT&CK 19.1 defines T1052 as exfiltrating data through a physical medium such as a removable drive and explicitly states that the medium may be the final exfiltration point or a hop between otherwise disconnected systems. The behavior is independently relevant to TA0010, but Niji admission narrows “using media” to an evidenced data and custody chain: victim data is written to or placed on a carryable medium, the medium is disconnected and leaves the original observation domain, and an attacker, collaborator, or successor system later retrieves it. ESET's USBStealer research supplies a complete capability chain in which one drive moves between Internet-connected A and isolated B, B collects and writes data on a later insertion, and A-side operators retrieve it. ProjectSauron research documents a dedicated media module moving data from isolated to Internet-connected systems.
  original_attack_subtechniques_imported: false
  scope_notes:
    zh: >-
      固定基线唯一 ATT&CK 子项 T1052.001 仅表示 USB 设备实现，不继承为 Niji 子技术。正式判定需要连接数据复制或底层写入、介质断开、保管或物理跨区、以及接收侧取用中的相邻阶段；普通介质插入、本地备份或写入后介质始终留在原系统均不足。Bluetooth、蜂窝或其他设备在传输期间保持网络会话时归 T1011；介质只作为外传前本地汇聚点且未发生物理转运时归 T1074。
    en: >-
      The fixed baseline's sole ATT&CK child, T1052.001, represents a USB implementation and is not inherited as a Niji child. Formal classification needs adjacent stages among data copy or low-level write, media disconnection, custody or physical zone crossing, and receiver-side retrieval. Ordinary insertion, local backup, or a write to media that remains attached to the original system is insufficient. Bluetooth, cellular, or other devices that maintain a network session during transfer belong to T1011. Media used only as a local aggregation point before exfiltration, without physical transport, belongs to T1074.
proposed_content:
  name:
    zh: 物理介质保管链外传
    en: Physical-Media Custody-Chain Exfiltration
  summary:
    zh: 攻击者把受害数据写入可携介质并通过断开、保管和物理转运将其带离原观察域，使网络出口缺少对应会话，并把证据分散在设备、文件和接收侧事件中。
    en: An adversary writes victim data to carryable media and moves it beyond the original observation domain through disconnection, custody, and physical transport, leaving no corresponding network-egress session and dispersing evidence across device, file, and receiver-side events.
  definition_and_concept:
    paragraphs:
      - zh: >-
          物理介质保管链外传是攻击者把已取得的数据复制到可移动或可带离的数字存储介质，或把数据写入介质底层区域，随后让该介质脱离源系统并经人员或物流移动到攻击者能够读取的位置。直接目标是把受害数据带出受控环境；分类核心是介质上的数据状态与物理保管变化共同完成交付，而不是 USB、外置硬盘、手机或播放器等设备名称。
        en: >-
          Physical-Media Custody-Chain Exfiltration occurs when an adversary copies acquired data to removable or carryable digital storage, or writes it into a low-level media region, then has the medium leave the source system and move through people or logistics to a location accessible to the attacker. Its direct objective is delivery of victim data outside the controlled environment. The classification centers on data state on the medium plus physical custody change, not device names such as USB drive, external disk, phone, or media player.
      - zh: >-
          同一介质可以成为最终接收物，也可以先把数据从隔离系统带到另一台联网或低控制强度主机，再由后继通道继续外传。写入介质只是链中的一个阶段；只有断开、移交、出区或接收侧取用使数据越过原防守边界时，才完成本技术的 TA0010 结果。若攻击者直接带走原已存有数据的可拆介质，也需证明介质所含数据、保管变化和攻击者接收之间的关系。
        en: >-
          The same medium may be the final item received or may first carry data from an isolated system to another networked or less-controlled host before a successor channel continues exfiltration. Writing the medium is one stage only. The TA0010 outcome is completed when disconnection, handoff, zone exit, or receiver-side retrieval carries data across the original defensive boundary. If an attacker removes a detachable medium that already contains data, classification still requires a relationship among the data present, the custody change, and attacker receipt.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          本技术把数据路径从网络连接转成源文件读取、介质写入、设备卸载或拔出、保管间隔和后继接入。源侧网关因此没有目的地址、协议、连接字节或上传账号可用于判断，单机短窗也只能看到一次介质会话。痕迹仍存在于设备序列号或资产标识、卷与挂载信息、介质路径上的文件创建、源读取主体、弹出事件、转运台账以及接收侧读取或外联中。
        en: >-
          This technique changes the data path from a network connection into source-file access, media writes, device unmount or removal, a custody interval, and later attachment. The source-side gateway therefore has no destination address, protocol, connection byte count, or upload account to evaluate, and a short single-host window sees only one media session. Traces remain in device serial or asset identity, volume and mount data, file creation on media paths, the source-reading principal, ejection, transfer ledgers, and receiver-side reads or egress.
      - zh: >-
          匿迹收益取决于端点覆盖和保管治理。能够在介质离区前阻断写入、保存内容清单并在另一系统接入时连接同一介质的防守方，可以恢复原本缺失的路径；介质序列号可重复或伪造、隔离区可能无 EDR、攻击者控制的最终接收机通常不可见。ProjectSauron 还显示，认可设备身份上的宿主不可见区域可绕过只按 DeviceID 和普通文件对象执行的控制。
        en: >-
          The stealth benefit depends on endpoint coverage and custody governance. A defender that blocks writes before media leaves, retains a content manifest, and links the same medium on another system can recover the otherwise missing path. Media serials may be duplicated or spoofed, isolated zones may lack EDR, and the attacker-controlled final receiver is normally invisible. ProjectSauron further shows that a host-opaque region on a recognized device can bypass controls limited to DeviceID and ordinary file objects.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入需要证明受害数据到介质的写入或介质上既有数据的攻击者取用，并至少再证明断开、保管变化、物理出区或不同系统接续中的一个结果环节。介质插入、枚举、格式化、正常文件写入或一次弹出事件单独都不能证明外传；获批准的离线补丁、取证采集、备份恢复、数据交换和员工设备同步可能具有相同痕迹，必须以来源数据、审批内容、保管人、目标区和接收结果区分。
        en: >-
          Inclusion requires evidence of victim data written to media or attacker retrieval of data already present on it, plus at least one result stage among disconnection, custody change, physical zone exit, or continuation on a different system. Media insertion, enumeration, formatting, an ordinary file write, or one ejection event cannot establish exfiltration alone. Approved offline patching, forensic acquisition, backup restore, data exchange, and employee-device synchronization can produce the same traces and must be distinguished by source data, approved contents, custodian, destination zone, and receiver outcome.
      - zh: >-
          T1011 负责 Bluetooth、蜂窝或其他网络介质上的活动会话，T1048 负责网络路径所用替代协议；设备物理接近不把网络会话变成本项。T1074 负责外传前暂存位置及生命周期，只有暂存介质随后通过物理保管链越界时才同时满足本项。T1091/NJT-0058 负责介质把恶意内容带到另一主机并触发执行，T1025 负责从已接入介质收集数据；本项只负责受害数据随介质离开。NJT-0108 负责绕过文件系统的原始存储访问，可与宿主不可见介质区域子项并列，但不替代物理转运结果。
        en: >-
          T1011 owns active sessions over Bluetooth, cellular, or another network medium, and T1048 owns an alternative protocol on a network path; physical proximity does not turn a network session into this technique. T1074 owns the staging location and lifecycle before exfiltration and co-applies only when staged media later crosses a boundary through physical custody. T1091/NJT-0058 owns malicious content carried to another host and triggered there, while T1025 owns collecting data from attached media. This object owns victim data leaving with the medium. NJT-0108 owns raw storage access that bypasses a file system and may co-apply with the host-opaque-region child, but it does not replace the physical transport outcome.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在隔离网络仍需用维护盘交换文件的环境中，攻击者可让受控组件识别曾接入联网主机的介质，把选定文档或密钥复制到该介质，并等待其按正常流程回到联网侧。USBStealer 明确使用同一介质在 A 与 B 间往返，先在 B 本地聚合感兴趣文件，再在下一次插入 B 时写入介质并由 A 侧取回。更直接的内部人场景是把敏感目录复制到获准介质后将介质带离，但必须有数据和保管证据，不能从岗位或设备拥有权推定。
          en: >-
            In an isolated network that still exchanges files through maintenance media, an attacker-controlled component can identify a drive previously attached to an Internet-connected host, copy selected documents or keys to it, and wait for routine handling to return it to the connected side. USBStealer explicitly moved one drive between A and B, first aggregated interesting files locally on B, wrote them to the drive during a later B insertion, and enabled A-side retrieval. A more direct insider scenario copies a sensitive directory to approved media and carries it away, but it still needs data and custody evidence rather than inference from role or device ownership.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要读取目标数据、向介质文件系统或原始区域写入的权限，以及让介质离开源主机和受控区域的实际保管机会。跨区接续还需介质按可预测流程到达另一系统，或有协作者在外部取走；宿主不可见区域需要原始设备访问、布局知识和接收侧解析器。容量、介质损坏、写保护、审批检查和不可预测的转运周期会限制成功率，并可能延长证据暴露时间。
            en: >-
              The attacker needs access to target data, authority to write the media file system or raw region, and a real custody opportunity for the medium to leave the source host and controlled zone. Cross-zone continuation additionally requires the medium to reach another system through a predictable workflow or a collaborator to take it outside. A host-opaque region requires raw-device access, layout knowledge, and a receiver-side parser. Capacity, media damage, write protection, approval checks, and unpredictable transfer cycles constrain success and may lengthen evidence exposure.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定可在部分端点取得设备接入与卸载、驱动器标识、敏感对象访问、介质路径文件创建及发起进程，并维护介质资产、保管人、来源、目标和内容清单。跨区关联需日志保留覆盖数日或数周，并在检查站重新采集同一介质身份、布局与内容；最终攻击者接收机不可见时，只能把已证写入与出区保管记录作为交付证据。普通文件级 EDR 无法自动看到保留扇区或自定义 VFS，需原始介质扫描补足。
            en: >-
              The defender is assumed to obtain device attach and detach events, drive identity, sensitive object access, file creation on media paths, and initiating process on some endpoints, while maintaining media asset, custodian, source, destination, and content manifests. Cross-zone correlation requires retention spanning days or weeks and fresh acquisition of media identity, layout, and contents at checkpoints. Where the final attacker receiver is invisible, only evidenced writes plus custody records showing zone exit can support delivery. Ordinary file-level EDR does not automatically see reserved sectors or a custom VFS and needs raw-media inspection.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 物理保管路径绕开网络出口观察
        en: Physical custody bypasses network-egress observation
      analysis:
        paragraphs:
          - zh: >-
              攻击者把数据写入可携介质并让介质离开源系统，网络出口不产生对应的连接、目的端或上传事务；只部署 NDR、代理或防火墙分析的防守方看不到数据交付。观察痕迹转移到源读取、介质写入、设备断开和保管记录，必须由端点与物理流程恢复。ATT&CK 的父行为、USBStealer 的往返链和 ProjectSauron 的隔离网模块共同支持这一行为—痕迹变化；具体告警缺失仍取决于组织是否部署设备控制与介质检查。
            en: >-
              The attacker writes data to carryable media and has it leave the source system, producing no matching network connection, destination, or upload transaction at egress. A defender relying on NDR, proxies, or firewalls does not observe delivery. Traces move to source access, media writes, device disconnection, and custody records and must be recovered from endpoints and physical processes. The ATT&CK parent, USBStealer return chain, and ProjectSauron air-gap module jointly support this behavior-to-trace change; actual alert absence still depends on device control and media inspection in the organization.
      evidence_keys: [B10-2-T1052-REF-ATTACK-PARENT, REF-000596, B10-2-T1052-REF-SAURON]
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 写入与接收被保管间隔分散到不同系统
        en: Custody separates writing and receipt across systems
      analysis:
        paragraphs:
          - zh: >-
              介质从源主机断开后经历人工保管和转运，再在不同系统或域内接入，使源文件读取、介质写入与最终取用分布于不同主机和时间。单机短窗只能看到局部阶段，防守必须以介质资产、序列号、卷标识、内容摘要和台账跨域重建。USBStealer 的 A—B 往返直接展示该结构；实际转运时长和序列号可靠性未统一公开，故跨事件恢复效果保持中等置信。
            en: >-
              After disconnection, the medium passes through human custody and transport before attachment in another system or domain, distributing source access, media writing, and final retrieval across hosts and time. A short single-host window sees only a local stage, so defenders must reconstruct across domains using media asset, serial, volume identity, content digest, and transfer ledger. USBStealer directly demonstrates the A-to-B return structure. Transfer duration and serial reliability are not uniformly reported, so the reconstruction effect remains medium-confidence.
      evidence_keys: [REF-000596, REF-000597, REF-000475]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议建立两个 Niji 原生子项。跨观察域离线接续外传控制介质是否在不同系统或区域重新接入并继续交付，主要痕迹是源写入、断开、保管和接收侧读取的跨主机谱系；宿主不可见介质区域外传控制数据是否位于操作系统普通文件视图之外，主要痕迹是物理容量、分区布局、原始 I/O 与声明清单的差异。前者改变关联拓扑，后者改变可见存储对象，防御不可互换。
          en: >-
            Two Niji-native children are proposed. Cross-Observation-Domain Offline Relay Exfiltration controls whether the medium is reattached in a different system or zone to continue delivery; its primary traces are cross-host lineage among source writes, disconnection, custody, and receiver reads. Host-Opaque Media-Region Exfiltration controls whether data resides outside the operating system's ordinary file view; its traces are differences among physical capacity, partition layout, raw I/O, and the declared manifest. The first changes correlation topology and the second changes the visible storage object, so their defenses are not interchangeable.
        - zh: >-
            USB、外置硬盘、手机与播放器只是介质实现；ATT&CK T1052.001 解析为父级实现范围，不直接对应任何 NJS。短接入时长、自动复制、归档、隐藏文件属性与获准设备身份均已检查：短时长证据不足，自动化归 T1020，归档归 NJT-0133，普通隐藏文件缺少独立于现有工件可见性技术的防御差异；只有跨域接续与宿主不可见区域通过全部门槛。
          en: >-
            USB drives, external disks, phones, and media players are implementations. ATT&CK T1052.001 resolves to parent implementation coverage rather than a NJS. Short attachment duration, automated copying, archiving, hidden file attributes, and approved device identity were also examined. Duration lacks evidence, automation belongs to T1020, archiving to NJT-0133, and ordinary hidden files lack a defense difference independent of existing artifact-visibility techniques. Only cross-domain continuation and host-opaque regions pass every gate.
proposed_subtechniques:
  - temporary_key: B10-2-T1052-CHILD-RELAY
    name:
      zh: 跨观察域离线接续外传
      en: Cross-Observation-Domain Offline Relay Exfiltration
    confidence: high
    summary:
      zh: 同一介质在隔离或高控制源侧承载数据后断开，并在另一系统或区域重新接入继续交付，使任何单一观察域只看到外传链的一部分。
      en: The same medium carries data from an isolated or tightly controlled source, disconnects, and is reattached in another system or zone to continue delivery, leaving each observation domain with only part of the exfiltration chain.
    definition_and_concept:
      paragraphs:
        - zh: >-
            跨观察域离线接续外传是物理介质保管链外传的一种实现：介质在源系统或隔离区接收被盗数据，经历断开和物理转运，再在另一主机、网络区或攻击者接收点接入，数据由此继续复制、上传或取走。子项变量是写入与接收是否分属不同观察域，而不是介质型号、往返次数或接收侧所用网络协议。
          en: >-
            Cross-Observation-Domain Offline Relay Exfiltration is a form of physical-media custody exfiltration in which the medium receives stolen data on a source system or isolated zone, undergoes disconnection and physical transport, and is then attached at another host, network zone, or attacker receiver for continued copying, upload, or removal. The child variable is whether writing and receipt occur in different observation domains, not media model, trip count, or the receiver-side network protocol.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            跨观察域离线接续外传把源数据读取与最终接收之间的直接会话替换为介质往返和保管间隔。源区只见敏感读取、介质写入与断开，接收区只见后续介质接入、读取或外联；任一侧都不能单独证明完整路径。USBStealer 明确用同一介质在联网 A 与隔离 B 间往返，并在 B 写回感兴趣文件后由 A 侧取回，留下设备硬件 ID、主机名目录、复制文件和接续时间等残余关联键。
          en: >-
            Cross-Observation-Domain Offline Relay Exfiltration replaces a direct session from source access to receipt with media trips and a custody interval. The source zone sees sensitive access, media writes, and disconnection, while the receiving zone sees later attachment, reads, or egress; neither side alone establishes the full route. USBStealer explicitly used one medium between connected A and isolated B, wrote interesting files on B, and enabled A-side retrieval, leaving residual join keys such as hardware ID, host-named directories, copied files, and continuation time.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求同一介质或可信等价身份连接不同系统或区域，并把源侧数据写入与接收侧取用连接起来。攻击者直接把介质从源主机带到不可见接收者可由父项覆盖；只有观察域间接续产生独立关联问题时使用本子项。普通离线补丁、数据二极管流程、取证转运和获批跨区交换是反例，须用内容清单、保管人、方向、目标系统和后继用途排除。
          en: >-
            Inclusion requires the same medium or a credibly equivalent identity to connect different systems or zones and link source-side data writes to receiver-side retrieval. Direct carry-away from a source to an unobserved receiver remains parent coverage; use this child when continuation between observation domains creates a distinct correlation problem. Offline patching, data-diode workflows, forensic transport, and approved cross-zone exchange are counterexamples to exclude through content manifest, custodian, direction, destination system, and successor use.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              隔离 B 上的植入体可先按文件名、扩展名或命令收集敏感材料，待已标记为可回到联网侧的介质再次接入时写入；介质随后回到 A，操作者或另一组件读取内容并继续传送。ESET 对 USBStealer 的四步说明直接展示了这一往返与接续链，同时指出失败写入会先在 B 本地分组并等待下一枚可上网介质。
            en: >-
              An implant on isolated B can first collect sensitive material by filename, extension, or command and write it when a medium marked as able to return to the connected side is next attached. The medium then returns to A, where an operator or another component retrieves and may continue transferring the content. ESET's four-step USBStealer description directly demonstrates this return and continuation chain and states that failed writes are grouped locally on B until the next Internet-capable medium arrives.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需预测或影响介质跨域路线，并在源区写入和接收区读取至少各控制一端；若接收区不是攻击者直接控制的主机，还需协作者或后继恶意组件。长保管周期、介质更换、清洗检查、只读策略和单向介质会破坏链路；依赖序列号或标记文件的组件还可能因介质重新格式化而失去识别。
              en: >-
                The attacker must predict or influence the media route across domains and control at least one writer in the source zone and one reader in the receiving zone. If the receiving host is not directly attacker-controlled, a collaborator or successor malicious component is needed. Long custody periods, media replacement, sanitization, read-only policy, and one-way media break the path; components relying on serials or marker files may also lose recognition after reformatting.
        defender_model:
          paragraphs:
            - zh: >-
                防守方需要两侧的介质接入、文件和进程事件，加上跨区台账、介质资产标识与足够长留存，才能把 B 写入同 A 读取或外联连接起来。隔离 B 无代理、A 属第三方、序列号伪造、时钟漂移或内容在接收侧立即改名都会降低确定性；此时可用内容摘要、目录结构、容量变化和保管记录给出分级判断，不能声称看到了不可见接收者。
              en: >-
                The defender needs media, file, and process events on both sides plus a cross-zone ledger, media asset identity, and sufficient retention to join B-side writes to A-side reads or egress. No agent on isolated B, a third-party A, spoofed serials, clock drift, or immediate renaming on receipt lowers certainty. Content digest, directory structure, capacity change, and custody records can support graded findings but cannot justify a claim that an unobserved receiver was seen.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary:
          zh: 离线转运拆分源写入与接收侧动作
          en: Offline transport separates source writes from receiver actions
        analysis:
          paragraphs:
            - zh: >-
                攻击者让介质先在 B 承载数据、断开并经历保管，再在 A 接续读取，使一次外传被分散成不同主机和时间上的弱信号，且没有直接网络连接。单端点或短留存分析无法还原完整链；只有跨介质身份、内容和台账的关联才能重建。USBStealer 的往返步骤直接支持该结构，具体组织中的匿迹效果仍受双方日志覆盖和保管周期影响。
              en: >-
                The attacker has media carry data on B, disconnect and pass through custody, then continue with retrieval on A, dispersing one exfiltration into weaker signals across hosts and time without a direct network connection. Single-endpoint or short-retention analysis cannot reconstruct the chain; correlation across media identity, content, and ledger is required. USBStealer's return steps directly support this structure, while the stealth effect in an organization still depends on coverage on both sides and the custody interval.
        evidence_keys: [REF-000596, REF-000597, REF-000475]
        confidence: high
    evidence_keys: [B10-2-T1052-CLM-RELAY, B10-2-T1052-CASE-USBSTEALER, REF-000596, REF-000597, REF-000475]
    limitations:
      paragraphs:
        - zh: >-
            USBStealer 来源是详细样本逆向与攻击模型，不是同一组织端到端公开的设备台账和日志导出；其 A 侧另有组件及最终远程交付属于合理但未取得样本的环节。因此正式子项可以高置信定义跨域接续能力与痕迹结构，但具体事件确认仍需源写入、保管和接收侧结果三门证据。
          en: >-
            USBStealer is supported by detailed sample reverse engineering and an attack model rather than a public end-to-end device ledger and log export from one organization. Another A-side component and final remote delivery are reasonable but unsampled stages. The child can therefore define cross-domain continuation capability and trace structure with high confidence, while incident confirmation still requires source write, custody, and receiver-outcome gates.
  - temporary_key: B10-2-T1052-CHILD-OPAQUE
    name:
      zh: 宿主不可见介质区域外传
      en: Host-Opaque Media-Region Exfiltration
    confidence: high
    summary:
      zh: 攻击者把被盗数据写入操作系统普通文件视图不识别的介质区域，使认可设备仍可携带文件级 DLP 和清单看不到的内容。
      en: An adversary writes stolen data to a media region not recognized by the operating system's ordinary file view, allowing a recognized device to carry content invisible to file-level DLP and manifests.
    definition_and_concept:
      paragraphs:
        - zh: >-
            宿主不可见介质区域外传是物理介质保管链外传的一种实现：攻击者通过原始设备访问把数据放入声明分区之外的保留扇区、非标准分区或自定义虚拟文件系统，接收侧以专用解析器取回。直接目标仍是物理交付数据；子项变量是数据地址是否脱离宿主普通文件对象与声明布局，而不是使用加密、某一文件系统或某种 USB 控制器。
          en: >-
            Host-Opaque Media-Region Exfiltration is a form of physical-media custody exfiltration in which the attacker uses raw-device access to place data in reserved sectors outside declared partitions, a nonstandard partition, or a custom virtual file system, then retrieves it with a dedicated parser. The direct objective remains physical data delivery. The child variable is whether data addressing leaves ordinary host file objects and the declared layout, not encryption, one file system, or a particular USB controller.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            宿主不可见介质区域外传使介质总容量、分区边界与原始扇区发生变化，而普通目录列表、文件创建审计和按可见对象执行的 DLP 可能没有对应记录。ProjectSauron 缩小 USB 可见分区，在磁盘末端保留数百 MB 并建立 Windows 不识别的加密自定义 VFS；研究者还明确指出，真实认可 USB 的 DeviceID 会让只阻止未知设备的控制失效。残余痕迹包括原始磁盘句柄、异常分区差额、未声明区域的非零或高熵块、容量变化和专用解析代码。
          en: >-
            Host-Opaque Media-Region Exfiltration changes total capacity, partition boundaries, and raw sectors without necessarily creating corresponding directory entries, file-create audit, or visible-object DLP records. ProjectSauron reduced the visible USB partition, reserved hundreds of megabytes at the disk tail, and built an encrypted custom VFS unrecognized by Windows. Researchers also state that the genuine recognized USB DeviceID defeated controls blocking only unknown devices. Residual traces include raw-disk handles, anomalous partition gaps, nonzero or high-entropy blocks in undeclared regions, capacity change, and dedicated parser code.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求数据被写入普通宿主文件视图之外的介质区域，且该介质随后通过物理保管链离开或接续；隐藏属性文件、普通隐藏目录、加密容器和未分配空间中偶然残留内容不自动成立。若行为只进行原始卷读写以绕过文件系统而没有物理介质交付，由 NJT-0108 承担；若隐藏文件仍是可枚举文件对象，则检查工件可见性与数据遮蔽技术。
          en: >-
            Inclusion requires data written to a media region outside the ordinary host file view and later departure or continuation of that medium through physical custody. Hidden-attribute files, ordinary hidden directories, encrypted containers, and incidental remnants in unallocated space do not qualify automatically. Raw volume access without physical media delivery belongs to NJT-0108. Hidden content that remains an enumerable file object should be assessed under artifact-visibility and data-obscuration techniques.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者在可访问获准维护盘时，可先调整可见分区大小，在保留尾部区域建立自定义存储并让隔离区植入体写入被窃数据；介质仍以原设备身份进入和离开，接收侧工具再解析隐藏区域。ProjectSauron 的公开报告直接记录该设计用于把隔离网数据移动到联网系统，并指出普通操作系统和部分 DLP 看不到该区域。
            en: >-
              When an attacker can access an approved maintenance drive, they can reduce the visible partition, establish custom storage in a reserved tail region, and have an implant in the isolated zone write stolen data there. The medium enters and leaves under its original device identity, and receiver-side tooling later parses the hidden region. Public ProjectSauron reporting directly documents this design for moving air-gapped data to connected systems and states that the ordinary operating system and some DLP controls did not see the region.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要对物理磁盘或卷的原始写权限、介质几何和分区布局知识、不会破坏正常可见分区的写入逻辑，以及接收端兼容解析器。管理员权限、驱动或底层 API 访问可能成为前提；介质重建分区、完整擦除、只读硬件、容量和布局基线及原始区域扫描都会破坏或暴露该路径。
              en: >-
                The attacker needs raw write authority to the physical disk or volume, knowledge of media geometry and partition layout, write logic that preserves the normal visible partition, and a compatible receiver-side parser. Administrative authority, a driver, or low-level API access may be prerequisites. Repartitioning, full sanitization, read-only hardware, capacity and layout baselines, and raw-region inspection can destroy or expose the path.
        defender_model:
          paragraphs:
            - zh: >-
                防守方不能只依赖文件创建和目录清单，而需在受管检查站记录物理容量、扇区大小、分区起止、可见卷总量、未声明区域摘要和介质资产身份，并在跨区前后比较；端点 EDR 若能记录原始设备句柄、进程、偏移、长度与写入方向可提供源侧证据。硬件固件隐藏区、USB 桥接控制器谎报容量或没有原始 I/O 归因时会形成盲区。
              en: >-
                The defender cannot rely only on file creation and directory manifests. A managed checkpoint must record physical capacity, sector size, partition starts and ends, visible-volume total, undeclared-region digest, and media asset identity and compare them before and after zone crossing. Endpoint EDR can add source evidence when it records raw-device handle, process, offset, length, and write direction. Firmware-hidden areas, USB bridge controllers that misreport capacity, or raw I/O without process attribution create blind spots.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 声明布局外区域跨越文件级观察边界
          en: Regions outside the declared layout cross the file-level observation boundary
        analysis:
          paragraphs:
            - zh: >-
                攻击者以原始磁盘视图写入操作系统不挂载的区域，痕迹从文件路径和对象审计转成分区差额、扇区偏移与底层 I/O；文件级 DLP 即使允许或监视该设备，也没有被窃对象可判定。ProjectSauron 的隐藏 VFS 和公开的 DLP 绕过说明直接支持行为到观察缺口的链条。原始布局检查与进程归属可以恢复可见性，但不自动解释加密内容。
              en: >-
                The attacker writes through a raw disk view into a region the operating system does not mount, changing traces from file paths and object audit to partition gaps, sector offsets, and low-level I/O. File-level DLP has no stolen object to evaluate even when it allows or monitors the device. ProjectSauron's hidden VFS and documented DLP bypass directly support the behavior-to-observation-gap chain. Raw layout inspection and process attribution can restore visibility but do not automatically interpret encrypted content.
        evidence_keys: [B10-2-T1052-REF-SAURON, REF-000419]
        confidence: high
      - mechanism_ref: NM-FD
        role: secondary
        summary:
          zh: 认可设备身份掩盖声明布局外载荷
          en: Recognized device identity masks payload outside the declared layout
        analysis:
          paragraphs:
            - zh: >-
                攻击者保留一枚真实获认可 USB 的 DeviceID 和可见分区外观，却在未声明区域携带数据，使只按设备信誉或是否未知作判断的控制把它归为正常介质。ProjectSauron 报告明确指出这一身份复用绕过未知设备阻断；比较组织资产清单、物理容量、分区表和区域摘要可以破坏伪装。认可身份本身不是恶意，必须同布局差异和数据链结合。
              en: >-
                The attacker preserves the DeviceID and visible-partition appearance of a genuinely recognized USB while carrying data in an undeclared region, causing controls based only on device reputation or unknown-device status to classify it as normal media. ProjectSauron explicitly states that this identity reuse bypassed unknown-device blocking. Comparing asset inventory, physical capacity, partition table, and region digest can break the disguise. A recognized identity is not malicious by itself and must be joined to layout difference and the data chain.
        evidence_keys: [B10-2-T1052-REF-SAURON, REF-000597]
        confidence: high
    evidence_keys: [B10-2-T1052-CLM-OPAQUE, B10-2-T1052-CASE-SAURON, B10-2-T1052-REF-SAURON, REF-000419, REF-000597]
    limitations:
      paragraphs:
        - zh: >-
            ProjectSauron 提供已注册攻击、专用模块和存储布局的直接研究，并明确声称部分 DLP 绕过；公开材料未给出受害者原始扇区镜像、逐次介质转运日志或不同 DLP 产品的测试结果。子项可高置信定义隐藏区域与认可身份差异，但检测阈值、熵和布局规则必须在组织已知设备上本地验证。
          en: >-
            ProjectSauron provides direct research on registered attacks, the dedicated module, and storage layout and explicitly states bypass of some DLP controls. Public material does not provide victim raw-sector images, per-trip media logs, or comparative tests across DLP products. The child can define hidden-region and recognized-identity differentials with high confidence, while layout, entropy, and alert rules require local validation on known organizational devices.
defense_candidates:
  detection_strategies:
    - temporary_key: B10-2-T1052-DET-CUSTODY
      name:
        zh: 介质写入—断开—保管—接续谱系
        en: Media Write–Disconnect–Custody–Continuation Lineage
      objective:
        zh: 将敏感数据访问与介质文件或原始区域写入、设备断开、保管变化及另一系统取用连接起来，不把单次设备插入升级为外传。
        en: Join sensitive-data access to file or raw-region writes on media, device disconnection, custody change, and retrieval on another system without promoting a single device insertion to exfiltration.
      detects_keys: [B10-2-T1052-PARENT, B10-2-T1052-CHILD-RELAY, B10-2-T1052-CHILD-OPAQUE]
      domains: [enterprise]
      analytic_keys: [B10-2-T1052-NJA-LINEAGE, B10-2-T1052-NJA-LAYOUT]
      evidence_keys: [B10-2-T1052-REF-ATTACK-PARENT, B10-2-T1052-REF-DET0123, REF-000596, B10-2-T1052-REF-SAURON, REF-000597, REF-000475, REF-000604, REF-000419]
  detection_analytics:
    - temporary_key: B10-2-T1052-NJA-LINEAGE
      name:
        zh: 敏感读取到介质写入及跨系统接续分析
        en: Sensitive-Read to Media-Write and Cross-System Continuation Analytic
      logic:
        zh: >-
          将设备接入和断开规范化为组织介质资产、系统所见序列号或设备 ID、卷标识、盘符、主机与会话起止。介质挂载期间，把已配置 SACL 或 EDR 的敏感对象读取连接到同一进程或后继复制进程在该盘符上的文件创建、重命名和可得摘要；只有写入成功且随后出现卸载、拔出或批准台账之外的保管变化，才输出父项候选。对跨观察域子项，在数日到数周窗口内寻找同一资产或内容摘要于不同主机/区域再次接入，并连接接收侧读取、复制、代理上传或明确交付记录；缺少接收侧时保留“已写入并离区”的证据级别，不声称看见最终取用。
        en: >-
          Normalize device attachment and disconnection to organizational media asset, observed serial or device ID, volume identity, drive letter, host, and session bounds. During the mount session, join sensitive-object reads from configured SACL or EDR telemetry to file creation, rename, and available digest on that drive by the same or successor copy process. Produce a parent candidate only when a successful write is followed by unmount, removal, or custody change outside the approved ledger. For the cross-observation child, search over days to weeks for the same asset or content digest on a different host or zone and join receiver-side reads, copies, proxy uploads, or an explicit delivery record. If the receiver is absent, retain only the “written and exited the zone” evidence level rather than claiming final retrieval was observed.
      data_requirements:
        - source_type: media_device_event
          name: {zh: 介质接入、断开与设备身份, en: Media Attachment, Disconnection, and Device Identity}
          channel: Microsoft Defender Device Control/DeviceEvents or equivalent endpoint device telemetry
          required_fields: [timestamp, device_id, action_type, additional_fields.device_id, additional_fields.serial_number, additional_fields.drive_letter]
        - source_type: endpoint_sensitive_object_access
          name: {zh: 敏感对象读取, en: Sensitive Object Access}
          channel: EDR file-access telemetry or Windows Security Event 4663 with deployment-validated SACLs
          required_fields: [timestamp, device_id, process_id_or_unique_key, user_or_logon_id, object_name, access_type]
        - source_type: media_file_activity
          name: {zh: 介质路径文件活动, en: Media-Path File Activity}
          channel: Microsoft Defender XDR DeviceFileEvents or equivalent endpoint file telemetry
          required_fields: [timestamp, device_id, action_type, folder_path, file_name, initiating_process_file_name, initiating_process_unique_id]
        - source_type: receiver_network_or_upload
          name: {zh: 接收侧外联或上传, en: Receiver-Side Egress or Upload}
          channel: DeviceNetworkEvents plus proxy/upload audit where available
          required_fields: [timestamp, device_id, initiating_process_unique_id, remote_ip_or_url, action_type, upload_result]
        - source_type: media_transfer_ledger
          name: {zh: 介质保管与内容清单, en: Media Custody and Content Manifest}
          channel: null
          required_fields: [asset_id, observed_serial, custodian, source_host, destination_host_or_zone, checkout_time, checkin_time, approver, content_manifest]
      observables:
        zh: 敏感读取后同一进程向可移动卷写入、设备随即断开或离区，以及同一介质或内容在另一系统接续读取或上传。
        en: A process writes to a removable volume after sensitive access, the device then disconnects or leaves the zone, and the same medium or content is later read or uploaded on another system.
      correlation:
        window: local mount session from attachment to disconnection; cross-system continuation from same day to the maximum approved media-rotation period
        dimensions: [organizational_media_asset, observed_serial, volume_id, source_device_id, destination_device_id, content_digest_when_available, initiating_process_unique_id, custodian, transfer_record]
      false_positives:
        zh: 获批数据交换、离线补丁、备份恢复、取证镜像、媒体制作和员工移动设备同步会形成敏感读取、介质写入与跨主机接入。
        en: Approved data exchange, offline patching, backup restore, forensic imaging, media production, and employee-device synchronization can create sensitive reads, media writes, and cross-host attachment.
      blind_spots:
        zh: 隔离端点无 EDR、读取审计未启用、介质序列号重复或伪造、直接拔出事件缺失、最终接收机不可见及原始区域写入会破坏文件级链。
        en: No EDR on isolated endpoints, disabled read audit, duplicate or spoofed serials, missing surprise-removal events, an invisible final receiver, and raw-region writes can break the file-level chain.
      tuning_guidance:
        zh: 按介质资产、用户、源目标区和批准内容建立精确台账；对备份或取证例外限定工单、时间、进程、内容摘要和目的区，不因设备常用或序列号获准而永久忽略敏感读取后的新写入。至少保留到最长合法轮转周期结束。
        en: Baseline exact media asset, user, source and destination zones, and approved content. Scope backup or forensic exceptions to a ticket, time, process, content digest, and destination zone. Do not permanently suppress new post-sensitive-read writes because a device is common or its serial approved. Retain events through the longest legitimate rotation period.
      evidence_keys: [B10-2-T1052-REF-DET0123, REF-000596, REF-000597, REF-000475, REF-000604]
    - temporary_key: B10-2-T1052-NJA-LAYOUT
      name:
        zh: 声明介质布局与原始区域差分分析
        en: Declared Media Layout and Raw-Region Differential Analytic
      logic:
        zh: >-
          在受管检查站为每个批准介质记录物理容量、逻辑扇区大小、分区类型与起止、可见卷总量、分区表摘要、文件清单和声明外区域摘要。每次跨区前后重新采集，识别可见分区被缩小而物理容量不变、新增未声明尾部区域、异常分区偏移、声明外块由全零转为非零或高熵、或未批准进程打开物理磁盘/卷句柄并在断开前执行原始写入的情况。只有布局差异、原始写入或声明外内容与保管链相连时才升级，不能把加密盘、高熵或预留分区单独判为恶意。
        en: >-
          At a managed checkpoint, record each approved medium's physical capacity, logical sector size, partition types and extents, total visible volume, partition-table digest, file manifest, and digest of regions outside the declaration. Reacquire before and after every zone crossing. Identify a visible partition shrinking while physical capacity stays constant, a new undeclared tail, anomalous partition offsets, outside-declaration blocks changing from zero to nonzero or high entropy, or an unapproved process opening a physical disk or volume handle and performing raw writes before disconnection. Escalate only when layout difference, raw write, or undeclared content is linked to the custody chain; an encrypted disk, high entropy, or a reserved partition alone is not malicious.
      data_requirements:
        - source_type: raw_media_layout_inventory
          name: {zh: 原始介质布局与区域清单, en: Raw Media Layout and Region Inventory}
          channel: managed media inspection station
          required_fields: [timestamp, station_id, asset_id, observed_serial, physical_capacity_bytes, logical_sector_size, partition_table_hash, partition_extents, visible_volume_bytes, undeclared_region_hash, undeclared_region_nonzero_bytes]
        - source_type: raw_device_access
          name: {zh: 原始设备访问与写入, en: Raw Device Access and Writes}
          channel: EDR/minifilter/storage telemetry with deployment-validated raw-write attribution
          required_fields: [timestamp, device_id, process_id_or_unique_key, image, raw_device_path, access_type, byte_offset, byte_length]
        - source_type: media_transfer_ledger
          name: {zh: 介质保管与基线版本, en: Media Custody and Baseline Version}
          channel: null
          required_fields: [asset_id, custodian, source_zone, destination_zone, scan_time, baseline_version, approver]
      observables:
        zh: 认可介质的可见容量缩小、声明外尾部出现内容、分区表或区域摘要变化、未批准进程对物理磁盘执行原始写入后介质断开。
        en: Reduced visible capacity on a recognized medium, content in an undeclared tail, changed partition-table or region digest, and raw physical-disk writes by an unapproved process followed by disconnection.
      correlation:
        window: each media attachment and before/after every custody or zone transition
        dimensions: [organizational_media_asset, observed_serial, physical_capacity, partition_table_hash, undeclared_region_hash, writer_process, custody_record]
      false_positives:
        zh: 厂商恢复区、获批加密盘、合法重新分区、取证镜像、介质磨损管理和历史残留数据可产生未声明区域或高熵块。
        en: Vendor recovery areas, approved encrypted drives, authorized repartitioning, forensic imaging, media wear management, and historical remnants can create undeclared regions or high-entropy blocks.
      blind_spots:
        zh: 控制器固件隐藏区、谎报容量的 USB 桥、无法读取的硬件加密、缺少逐资产基线及无法归属进程的块 I/O 会使检查不完整。
        en: Controller-firmware hidden areas, USB bridges that misreport capacity, unreadable hardware encryption, absent per-asset baselines, and block I/O without process attribution make inspection incomplete.
      tuning_guidance:
        zh: 为每个批准资产和固件版本保存签名布局与区域摘要，并把合法重分区绑定到工单和重新基线；在隔离区入口与出口均扫描，优先调查布局变化与未批准原始写入同时出现的事件，不用全局熵阈值替代资产差分。
        en: Keep a signed layout and region digest for every approved asset and firmware version, binding legitimate repartitioning to a ticket and new baseline. Scan at both entry and exit of isolated zones, prioritize events combining layout change with unapproved raw writes, and use per-asset differences rather than a universal entropy threshold.
      evidence_keys: [B10-2-T1052-REF-SAURON, REF-000419, REF-000597]
  mitigations:
    - existing_ref: MIT-000053
      resolution: extend
      name:
        zh: 物理、介质与无线入口统一控制
        en: Unified Physical Media and Wireless Entry Controls
      applications:
        - target_key: B10-2-T1052-PARENT
          use:
            zh: 对可写介质实施设备组、用户和进程级准入，记录资产标识、保管人、来源、目的区、内容摘要和期限；介质离开敏感区前核对源读取与新增内容，在外部接收不可见时把经审批的出区记录作为交付门，并对未批准写入阻断或隔离。
            en: Enforce device-group, user, and process admission for writable media and record asset identity, custodian, source, destination zone, content digest, and expiry. Before media leaves a sensitive zone, reconcile source reads with newly added content. Where an external receiver is unobservable, use approved zone-exit custody as the delivery gate and block or isolate unapproved writes.
          expected_effect:
            zh: 未授权介质难以获得写权限，获准介质的数据与保管变化可审计，物理路径不再完全脱离数据控制。
            en: Unauthorized media has greater difficulty obtaining write access, data and custody changes on approved media become auditable, and the physical path no longer sits wholly outside data control.
          limitations:
            zh: 内部人可滥用获准介质，序列号可以伪造，紧急维护和取证需要例外；离区后无法控制攻击者接收机，控制必须在写入和出区前执行。
            en: Insiders can abuse approved media, serials can be spoofed, and emergency maintenance or forensics needs exceptions. The attacker receiver cannot be controlled after zone exit, so enforcement must occur before writing and departure.
        - target_key: B10-2-T1052-CHILD-RELAY
          use:
            zh: 对跨区交换采用独立检查站、方向固定或只读介质和逐次签发的内容清单，要求 A 卸载后、B 接入前和返回时核对同一介质、保管人及摘要；禁止一枚普通双向介质在高敏区和互联网区无检查往返。
            en: For cross-zone exchange, use independent inspection stations, direction-fixed or read-only media, and per-trip signed manifests. Reconcile medium, custodian, and digest after A unmounts, before B attaches, and on return. Prohibit unchecked round trips by one general-purpose writable medium between sensitive and Internet-connected zones.
          expected_effect:
            zh: 攻击者难以利用正常轮转建立隐蔽返回路径，源写入与接收侧内容可在跨区点被阻断或连接。
            en: The attacker has greater difficulty turning routine rotation into a covert return path, and source writes and receiver-side content can be blocked or joined at the zone boundary.
          limitations:
            zh: 无代理的隔离系统、第三方保管和长周期离线任务会使台账不完整；只读或单向流程也可能不适用于确需双向交换的业务。
            en: Agentless isolated systems, third-party custody, and long offline workflows can leave incomplete ledgers. Read-only or one-way handling may not fit business processes that require bidirectional exchange.
        - target_key: B10-2-T1052-CHILD-OPAQUE
          use:
            zh: 对认可介质不只校验 DeviceID 和可见文件清单，还在检查站比较物理容量、分区表、声明外区域摘要并在需要时完整重建或擦除介质；限制非批准进程取得物理磁盘/卷原始写权限。
            en: For recognized media, verify physical capacity, partition table, and undeclared-region digest in addition to DeviceID and the visible file manifest, fully rebuilding or sanitizing media when required. Restrict raw physical-disk or volume write access to approved processes.
          expected_effect:
            zh: 认可设备身份和宿主不可见区域不再自动绕过控制，隐藏存储需改变已签名布局或突破原始写权限。
            en: Recognized device identity and host-opaque regions no longer bypass control automatically; hidden storage must alter a signed layout or defeat raw-write restrictions.
          limitations:
            zh: 原始扫描增加处理时间并可能接触合法加密内容，固件级隐藏区仍可能不可见；完整擦除会破坏业务数据，必须配合保管和恢复流程。
            en: Raw scanning adds handling time and may encounter legitimate encrypted content, while firmware-level hidden areas may remain invisible. Full sanitization destroys business data and needs custody and recovery procedures.
      evidence_keys: [B10-2-T1052-REF-ATTACK-PARENT, REF-000596, B10-2-T1052-REF-SAURON, REF-000597, REF-000475, REF-000419]
