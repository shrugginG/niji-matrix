research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 1
    attack_subtechnique_ids: [T1052.001]
    represented_dimensions:
      - USB-connected removable storage as a device-class implementation
      - physical medium as final point or hop between disconnected systems
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_subtechnique_id: T1052.001
        resolution: parent-core
        note: USB supplies implementation evidence for file copy, device disconnection, and cross-system movement but is not a stable stealth variable
    candidate_stealth_axes_examined:
      - {axis: cross-observation-domain offline continuation, resolution: formal-child-proposed, key: B10-2-T1052-CHILD-RELAY}
      - {axis: host-opaque region outside declared media layout, resolution: formal-child-proposed, key: B10-2-T1052-CHILD-OPAQUE}
      - {axis: exact USB or other device class, resolution: parent-core, owner: T1052 implementation range}
      - {axis: short attachment or quick removal, resolution: evidence-deferred, note: reviewed sources do not prove a stable attacker-controlled dwell-time boundary with distinct defense}
      - {axis: automatic selection or copying, resolution: adjacent-technique, owner: T1020}
      - {axis: archive encryption or ordinary hidden files, resolution: adjacent-technique, owner: NJT-0133/NJT-0111/NJT-0152}
      - {axis: raw storage access without physical movement, resolution: adjacent-technique, owner: NJT-0108}
      - {axis: active Bluetooth cellular or other network session, resolution: adjacent-technique, owner: T1011}
      - {axis: device manufacturer model or operating system, resolution: not-stealth-distinct}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: T1052.001 仅按 USB 实现划分，解析为父级覆盖。开放搜索检查了路径拓扑、保管间隔、连接时长、自动化、存储可见性、设备身份与文件痕迹；只有跨观察域接续和宿主不可见区域同时满足稳定变量、结论级案例、痕迹变化及差异防御。
      en: T1052.001 is partitioned only by a USB implementation and resolves to parent coverage. Open search examined path topology, custody interval, connection duration, automation, storage visibility, device identity, and file traces. Only cross-observation continuation and host-opaque regions satisfy stable-variable, conclusion-level case, trace-change, and defense-difference gates together.
  evidence_coverage:
    parent_behavior_keys: [B10-2-T1052-REF-ATTACK-PARENT, B10-2-T1052-REF-ATTACK-USB, REF-000596, B10-2-T1052-REF-SAURON]
    boundary_keys: [REF-000091, REF-000596, REF-000419, B10-2-T1052-REF-DET0123]
    mechanism_support: [REF-000596, B10-2-T1052-REF-SAURON, REF-000597, REF-000475]
    child_existence_support: [REF-000596, B10-2-T1052-REF-SAURON, REF-000419]
    unsupported_or_deferred:
      - A USB insertion or mount without a successful data write and custody or receiver result does not establish exfiltration.
      - Public USBStealer research models a complete A/B return capability but does not publish one enterprise's end-to-end device logs or the unrecovered A-side delivery component.
      - ProjectSauron reporting states DLP bypass but does not publish raw-sector victim images or a cross-product performance benchmark.
      - Media serials and DeviceIDs can be duplicated, spoofed, or reused and are correlation hints rather than sole identity proof.
      - Short device dwell time and rapid copy remain hypotheses without conclusion-level stealth and defense-difference evidence.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项覆盖写入—断开—保管—接收结果链，两个子项分别覆盖跨观察域拓扑和声明布局外存储；每项均说明残余设备/文件痕迹、正常反例、攻防前提、邻接边界和证据限制。DET/NJA 分别处理文件与保管谱系和原始布局差分，MIT-000053 仅扩展不变 measures 的目标应用。
      en: The parent covers write, disconnection, custody, and receiver outcome. The children separately cover cross-observation topology and storage outside the declared layout. Each addresses residual device and file traces, benign counterexamples, attacker and defender assumptions, adjacent boundaries, and evidence limits. DET/NJA separately handle file/custody lineage and raw-layout difference, while MIT-000053 only gains target applications under unchanged measures.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [shared-library catalog and duplicate lookup, YAML serialization and parse validation only]
  limitations:
    paragraphs:
      - zh: >-
          固定版 ATT&CK 可以锚定父行为和 USB 子项广度，ESET 与 Kaspersky 提供两种结论级技术链，但都不能证明所有物理介质外传具有相同匿迹效果。USBStealer 的最终 A 侧外送组件未取得，ProjectSauron 的原始受害介质与 DLP 测试未公开；案例应分别限于跨域返回能力和宿主不可见区域设计。
        en: >-
          Fixed ATT&CK anchors the parent and USB-child breadth, while ESET and Kaspersky provide two conclusion-level technical chains. Neither shows that all physical-media exfiltration has the same stealth effect. USBStealer's final A-side delivery component was not recovered, and ProjectSauron's original victim media and DLP tests are not public. The cases must remain limited to cross-domain return capability and host-opaque-region design respectively.
      - zh: >-
          DET0123 与 Microsoft 文档支持挂载、文件、进程和网络字段，不证明跨系统关联会自动成功。读取审计需显式启用，DeviceFileEvents 摘要并非每条都有，DeviceID 也不是强身份；接收端通常位于组织外。正式 Analytic 必须验证字段、驱动器映射、保留期和介质台账，缺少出区或接收证据时只能报告可疑复制。
        en: >-
          DET0123 and Microsoft documentation support mount, file, process, and network fields but do not show that cross-system correlation succeeds automatically. Read audit must be enabled, DeviceFileEvents does not provide a digest on every event, DeviceID is not a strong identity, and the receiver often sits outside the organization. A canonical Analytic must validate fields, drive mapping, retention, and the media ledger and can report only suspicious copying when zone-exit or receiver evidence is absent.
      - zh: >-
          原始介质检查可发现声明布局差异，但厂商保留区、合法加密盘、历史残留和硬件控制器行为均可能相似。完整扫描和擦除增加时间、隐私和业务连续性成本；若固件向宿主隐藏真实容量，软件检查仍会失效。高置信判断必须将逐资产基线、原始写入进程和保管链结合。
        en: >-
          Raw-media inspection can find declared-layout differences, but vendor-reserved areas, legitimate encrypted disks, historical remnants, and hardware-controller behavior may look similar. Full scanning and sanitization add time, privacy, and continuity costs, and software inspection still fails when firmware hides true capacity. A high-confidence finding must join a per-asset baseline, raw-write process, and custody chain.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: ProjectSauron encryption coexists with the host-opaque region but is not the child boundary; content encryption belongs to adjacent data-obscuration or archival behaviors.}
    - {mechanism_ref: NM-FD, reason: Parent-level ordinary-media appearance is insufficient without an independently evidenced feature imitation; NM-FD is retained only on the opaque child where ProjectSauron explicitly reused a genuinely recognized device identity.}
  open_questions:
    - The primary agent should deduplicate B10-2-T1052-REF-SAURON against B10-2-T1048-REF-SAURON and preserve one canonical reference with both exact subject uses.
    - The primary agent should verify T1011 convergence keeps active network sessions out of T1052 even when a phone or adapter is physically carried.
    - Before formalizing the raw-layout analytic, select a deployment-specific inspection station or EDR source that exposes physical capacity, partition extents, raw writes, and stable asset identity.
    - MIT-000053 should be extended only after the new NJT/NJS IDs exist; its measures remain unchanged and applications must use canonical targets.
