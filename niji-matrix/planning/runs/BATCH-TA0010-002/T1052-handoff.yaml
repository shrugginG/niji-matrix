  notes:
    zh: >-
      REF-000596 的 ESET USBStealer 来源身份完全一致，可复用于外传阶段；CASE-000206 只记录 A—介质—B 传播与执行，加入 B→介质→A 数据回传会改变中心事实，因此新建独立外传案例。REF-000597、REF-000475、REF-000598、REF-000604 与 REF-000419 仅复用其字段或平台语义。DET-000167/NJA-000180 的目标是跨主机载荷传播和 B 端执行，不能通过增加 T1052 引用替代数据写入、离区和接收链。MIT-000053 的介质准入、跨主机台账、内容清单、只读介质和独立检查站 measures 保持不变，可增加三个精确 applications。
    en: >-
      REF-000596 has the identical ESET USBStealer source identity and can be reused for the exfiltration stage. CASE-000206 records A-to-media-to-B propagation and execution only; adding B-to-media-to-A data return would change its central fact, so a separate exfiltration case is proposed. REF-000597, REF-000475, REF-000598, REF-000604, and REF-000419 are reused only for fields or platform semantics. DET-000167/NJA-000180 target cross-host payload propagation and B-side execution and cannot replace data writing, zone exit, and receipt merely by adding T1052. MIT-000053 retains the same media admission, cross-host ledger, content manifest, read-only media, and independent checkpoint measures and can gain three precise applications.
