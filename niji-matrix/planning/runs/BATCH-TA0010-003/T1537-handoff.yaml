      objective:
        zh: 以对象和账户为中心连接外部 grant、accept/access、snapshot share、copy/restore、新对象与 revoke，区分暴露、内容交付和独立副本。
        en: Center on object and account to join external grant, accept or access, snapshot share, copy or restore, new object, and revoke, distinguishing exposure, content delivery, and independent replica.
      detects_keys: [B10-3-T1537-PARENT, B10-3-T1537-CH-ENTITLEMENT, B10-3-T1537-CH-REPLICA]
      analytic_keys: [B10-3-T1537-NJA-ENTITLEMENT, B10-3-T1537-NJA-REPLICA]
      domains: [enterprise]
      evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
  detection_analytics:
    - key: B10-3-T1537-NJA-ENTITLEMENT
      name: {zh: 原对象外部 grant—访问—撤销关联, en: Same-Object External Grant–Access–Revocation Correlation}
      strategy_key: B10-3-T1537-DET-CROSS-ACCOUNT
      platforms: [Office Suite, SaaS]
      logic:
        zh: >-
          规范 share/invite/link/permission/ownership 事件的 source tenant、acting principal、object ID、owner、target user/account/domain、old/new role/visibility、link/permission ID 和 result。将 grant 连接到 accept/redeem、FileAccessed/preview/download/export/sync，并在 grant 生命周期结束时连接 revoke/expire。目标不在批准 partner/account 清单且对象为敏感、批量分享、首次 target、service principal 异常使用或 grant 后立即访问之一成立时提高风险。输出 grant-created、effective-entitlement、external-access、content-delivery-supported 和 revoked；grant-only 不报告完成外传。
        en: >-
          Normalize source tenant, acting principal, object ID, owner, target user, account or domain, old and new role or visibility, link or permission ID, and result for share, invite, link, permission, and ownership events. Join grant to accept or redeem, FileAccessed, preview, download, export, or sync and join revoke or expire when the grant lifecycle ends. Raise risk when the target is absent from the approved partner or account registry and at least one of sensitive object, bulk sharing, first-seen target, anomalous service-principal use, or immediate post-grant access exists. Output grant-created, effective-entitlement, external-access, content-delivery-supported, and revoked; grant-only does not report completed exfiltration.
      data_requirements:
        - source_type: cloud-sharing-control-audit
          name: {zh: SaaS 分享与权限控制审计, en: SaaS sharing and entitlement control audit}
          channel: Microsoft Purview Audit, Google Drive audit, or equivalent
          required_fields: [timestamp, provider, source_tenant_or_domain, event_id, operation, acting_principal, acting_session_or_app, object_id, object_owner, target_principal, target_domain_or_account, old_role_or_visibility, new_role_or_visibility, link_or_permission_id, result]
        - source_type: cloud-object-access-audit
          name: {zh: 云对象外部访问与内容交付审计, en: Cloud-object external access and content-delivery audit}
          channel: FileAccessed/download/export/sync data-plane events
          required_fields: [timestamp, provider, tenant_or_domain, object_id, actor_or_target_principal, operation, session_or_link_id, source_ip_or_device, originating_app, bytes_or_object_count_if_available, result]
        - source_type: cloud-object-inventory
          name: {zh: 云对象 owner、敏感度与有效权限快照, en: Cloud-object owner, sensitivity, and effective-entitlement snapshot}
          channel: SaaS inventory and data classification
          required_fields: [object_id, owner, container_or_site, sensitivity, current_permissions, link_ids, retention_class, last_modified]
        - source_type: approved-collaboration-inventory
          name: {zh: 批准外部协作关系, en: Approved external collaboration inventory}
          channel: vendor, legal, B2B, and access governance
          required_fields: [partner_id, target_account_or_domain, sponsor, purpose, allowed_object_scope, allowed_role, valid_from, valid_to, ticket_id]
      observables:
        - sensitive object granted to first-seen or unapproved external account
        - target accepts or accesses the same object ID after grant
        - ownership or high privilege changes to an external principal
        - grant is revoked only after external access or download
      correlation:
        window: full grant validity plus 30d after revoke or expiry
        dimensions: [provider, source_tenant, object_id, link_or_permission_id, acting_principal, target_principal_or_account, session, partner_id]
      false_positives:
        - approved client or supplier collaboration, legal discovery, managed service, support case, merger integration, and temporary guest access
      blind_spots:
        - anonymous or forwarded bearer links and SAS with no stable target principal
        - destination account outside organizational logging and missing download or sync data events
        - shared service principals or preexisting guest objects obscure the ultimate operator
      tuning_guidance:
        zh: 以批准关系和对象敏感度而非 External/Guest 标签建立基线；分别设置 invitation、effective access、download 与 ownership 级别。对 service principal、批量分享、无到期、高权限和首次 domain 提高严重度，定期重建 current permission snapshot 以发现日志缺口。
        en: Baseline approved relationships and object sensitivity rather than External or Guest labels. Set separate tiers for invitation, effective access, download, and ownership. Raise severity for service principals, bulk sharing, no expiry, high privilege, and first-seen domains, and rebuild current permission snapshots periodically to find logging gaps.
      evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT, B10-3-T1537-REF-GDRIVE-REVOKE]
    - key: B10-3-T1537-NJA-REPLICA
      name: {zh: 源快照授权—目标副本物化关联, en: Source Snapshot Grant–Destination Replica Materialization Correlation}
      strategy_key: B10-3-T1537-DET-CROSS-ACCOUNT
      platforms: [IaaS]
      logic:
        zh: >-
          对 snapshot/image/backup create、share/permission、KMS grant、copy/restore/volume create 和 revoke/delete 事件保存 event-time 资源版本。按 source object/snapshot ID、target account、request/event ID、时间和 provider shared-resource event 连接 createVolumePermission 或等价授权到 SharedSnapshotCopyInitiated、SharedSnapshotVolumeCreated、CopySnapshot completion 或目标 new object ID。目标账户不在组织/DR/安全备份 allowlist 时先报告 cross-account-exposure；copy initiated 为 receipt-in-progress；new object/volume 或 provider completion 才为 durable-replica-confirmed。源 revoke/delete 不关闭已确认副本。
        en: >-
          Preserve event-time resource versions for snapshot, image, or backup create; share or permission; KMS grant; copy, restore, or volume create; and revoke or delete. Join createVolumePermission or equivalent authorization to SharedSnapshotCopyInitiated, SharedSnapshotVolumeCreated, CopySnapshot completion, or destination new object ID by source object or snapshot ID, target account, request or event ID, time, and provider shared-resource event. When the target account is absent from organization, DR, or security-backup allowlists, report cross-account-exposure first; copy initiated is receipt-in-progress; only a new object or volume or provider completion is durable-replica-confirmed. Source revoke or delete does not close a confirmed replica.
      data_requirements:
        - source_type: cloud-resource-control-audit
          name: {zh: snapshot、backup 与跨账户权限审计, en: Snapshot, backup, and cross-account permission audit}
          channel: AWS CloudTrail, Azure Activity, GCP Admin Activity, or equivalent
          required_fields: [timestamp, provider, source_account_or_tenant, actor_id, session_or_app, event_name, request_id, source_object_id, object_type, target_account_or_tenant, old_permissions, new_permissions, kms_key_or_grant, result]
        - source_type: provider-shared-resource-event
          name: {zh: 提供方共享资源复制或恢复结果, en: Provider shared-resource copy or restore outcome}
          channel: SharedSnapshotCopyInitiated, SharedSnapshotVolumeCreated, copy completion, or equivalent
          required_fields: [timestamp, provider, source_account, source_object_id, destination_account, destination_object_id_if_available, operation, request_or_event_id, completion_state, bytes_or_size_if_available]
        - source_type: cloud-resource-inventory
          name: {zh: 源与目标资源身份、owner 和敏感度清单, en: Source and destination resource identity, owner, and sensitivity inventory}
          channel: CSPM, asset inventory, backup catalog, and organization account registry
          required_fields: [provider, account_or_tenant, object_id, object_type, owner, source_lineage, encryption_key, sensitivity, tags, creation_time, state]
        - source_type: approved-cross-account-transfer
          name: {zh: 批准灾备、迁移和取证副本清单, en: Approved DR, migration, and forensic-copy inventory}
          channel: change, backup, legal, and security governance
          required_fields: [source_account, source_object_scope, destination_account, owner, purpose, kms_scope, valid_from, valid_to, ticket_id, expected_new_object_pattern]
      observables:
        - snapshot or backup is shared with an unapproved account
        - KMS grant or key access is added for the same destination
        - provider reports shared snapshot copy or volume creation
        - source share is revoked after destination replica materializes
      correlation:
        window: from source creation through share validity plus 30d after revoke; preserve lineage indefinitely for confirmed replicas
        dimensions: [provider, source_account, source_object_id, destination_account, destination_object_id, request_or_event_id, kms_key_or_grant, ticket_id]
      false_positives:
        - approved isolated backup, disaster recovery, account migration, merger, forensic acquisition, marketplace image distribution, and managed security operations
      blind_spots:
        - provider returns copy initiation but no destination object ID
        - destination account lies outside organization and provider does not expose successor use
        - encrypted snapshot key grants or tags are logged in separate services and not joined
        - audit retention expires before delayed copy or restore
      tuning_guidance:
        zh: 维护组织、DR、备份、取证和合作 account allowlist，并绑定 source resource scope、KMS 和 expected new-object pattern；未知目标账户、广源 snapshot、无工单、copy 后快速 revoke/delete 提高严重度。不要把所有跨账户备份列为误报，仍检查 owner、目的、标签和到期。
        en: Maintain organization, DR, backup, forensic, and partner account allowlists bound to source-resource scope, KMS, and expected new-object pattern. Raise severity for unknown target accounts, broad source snapshots, no ticket, and rapid revoke or delete after copy. Do not suppress all cross-account backup; continue checking owner, purpose, tags, and expiry.
      evidence_keys: [B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY, REF-000524, REF-000698, REF-000874]
  mitigations:
    - key: B10-3-T1537-MIT-CROSS-ACCOUNT
      name: {zh: 云数据跨账户授权与副本治理, en: Cloud-Data Cross-Account Entitlement and Replica Governance}
      description:
        zh: 限制可向外部账户授予云对象权利或创建独立副本的主体与目标，结合敏感度 DLP、账户 allowlist、密钥分权、到期复核和撤销后接收核查。
        en: Constrain principals and destinations permitted to grant cloud-object rights or create independent replicas, combining sensitivity-aware DLP, account allowlists, key separation, expiry review, and post-revocation receipt investigation.
      domains: [enterprise]
      measures:
        - key: external-account-entitlement-allowlist
          name: {zh: 外部账户、domain 与角色允许清单, en: External account, domain, and role allowlist}
          control_type: preventive
          description:
            zh: 默认禁止高价值站点、drive、bucket、snapshot 和 backup 向组织外分享；确需协作时绑定 target account/domain、sponsor、对象范围、最小 role、用途和到期，禁止匿名链接或未归属账户。
            en: Deny external sharing by default for high-value sites, drives, buckets, snapshots, and backups. Where collaboration is required, bind target account or domain, sponsor, object scope, minimum role, purpose, and expiry and deny anonymous links or unowned accounts.
        - key: sensitivity-aware-cross-account-dlp
          name: {zh: 敏感对象跨账户 DLP 门禁, en: Sensitivity-aware cross-account DLP gate}
          control_type: preventive
          description:
            zh: 对敏感标签、PII、凭据、源代码和受监管数据在 share/ownership/copy 前执行策略，阻止未批准 target principal 或 destination account，并把例外写入可审计工单。
            en: Evaluate sensitivity labels, PII, credentials, source code, and regulated data before share, ownership, or copy, blocking unapproved target principals or destination accounts and recording exceptions in auditable tickets.
        - key: replica-and-key-authority-separation
          name: {zh: 副本、跨账户权限与密钥分权, en: Separate replica, cross-account permission, and key authority}
          control_type: exposure-reduction
          description:
            zh: 分离 snapshot/backup create、跨账户 permission、copy/restore 与 KMS grant 权限，启用 public-sharing block、组织策略、JIT/双人批准和固定 DR/备份账户，避免单一 owner 身份完成整条链。
            en: Separate snapshot or backup create, cross-account permission, copy or restore, and KMS grant authority; enable public-sharing blocks, organization policies, JIT or dual approval, and pinned DR or backup accounts so one owner identity cannot complete the chain.
        - key: entitlement-replica-lifecycle-audit
          name: {zh: 授权与副本全生命周期审计, en: Full entitlement and replica lifecycle audit}
          control_type: detective-support
          description:
            zh: 远端保留 grant/accept/access/download/revoke 与 create/share/copy/restore/new-object/delete，并定期重建 current permission 和跨账户 resource registry；service principal 必须有 owner、workflow、源范围和到期。
            en: Retain grant, accept, access, download, revoke, create, share, copy, restore, new object, and delete remotely and rebuild current permissions and cross-account resource registries periodically. Every service principal requires owner, workflow, source scope, and expiry.
        - key: revoke-and-receipt-assessment
          name: {zh: 撤销、令牌密钥轮换与既有接收核查, en: Revoke, rotate tokens and keys, and assess prior receipt}
          control_type: containment
          description:
            zh: 确认未授权 transfer 后撤销 external grant/link/guest、SAS/token、snapshot permission 和 KMS grant，保全日志并核查 accept/access/download/copy/restore。对独立副本请求组织/提供方处置，不能把源侧 revoke 当作数据收回。
            en: After unauthorized transfer, revoke external grant, link, guest, SAS or token, snapshot permission, and KMS grant; preserve logs and assess accept, access, download, copy, and restore. Seek organization or provider action for independent replicas rather than treating source-side revoke as data recovery.
      applications:
        - target_key: B10-3-T1537-PARENT
          use:
            zh: 对所有云服务建立 source account/object—target account—effective right or new object 的登记与门禁，统一 SaaS 分享和 IaaS 副本的账户边界。
            en: Establish registration and gates for source account and object to target account to effective right or new object across all cloud services, unifying the account boundary for SaaS sharing and IaaS replicas.
          expected_effect:
            zh: 攻击者不能仅借用正常云 API 或服务身份把数据控制移出组织，跨账户操作获得可核查 owner、用途、到期和结果。
            en: An adversary cannot move data control outside the organization merely by borrowing normal cloud APIs or service identities, and cross-account operations gain verifiable owner, purpose, expiry, and outcome.
          limitations:
            zh: 被盗批准身份、目标账户被攻陷、匿名 bearer token 和提供方内部不可见行为仍会绕过部分控制；业务协作需要精细例外。
            en: A stolen approved identity, compromised destination account, anonymous bearer token, or provider-internal invisible behavior can bypass parts of the control, and business collaboration needs precise exceptions.
        - target_key: B10-3-T1537-CH-ENTITLEMENT
          use:
            zh: 对高价值对象限制 external domain/account 和最大 role，要求 specific target、sponsor 与到期，启用敏感度 DLP，并把 grant 与后继 access/download 和 revoke 连接。
            en: Restrict external domains and accounts and maximum role for high-value objects, require a specific target, sponsor, and expiry, enable sensitivity-aware DLP, and join grant to successor access or download and revoke.
          expected_effect:
            zh: 未批准主体难以获得原对象持续权利，正常分享界面仍留下 target、object 和访问结果以供快速撤销。
            en: Unapproved principals have greater difficulty gaining continuing rights to the original object, while ordinary sharing interfaces leave target, object, and access outcomes for rapid revocation.
          limitations:
            zh: 撤销不能收回已经下载的内容；Google 等服务的残余 permission 可能在上层策略重新放开后恢复访问，需清理底层 grant。
            en: Revocation cannot recover downloaded content, and residual permissions in services such as Google may restore access if a higher-level restriction is relaxed, requiring cleanup of the underlying grant.
        - target_key: B10-3-T1537-CH-REPLICA
          use:
            zh: 仅允许固定 DR/备份/迁移账户接收 snapshot 或 backup，分离 share/copy/KMS 权限，记录 source lineage 与 expected destination ID，并在 copy 后持续盘点目标副本。
            en: Allow only pinned DR, backup, or migration accounts to receive snapshots or backups, separate share, copy, and KMS authority, record source lineage and expected destination ID, and inventory destination replicas after copy.
          expected_effect:
            zh: 未知账户的跨账户 copy 在物化前被阻止或形成多控制点告警，完成副本也可按 lineage 定位并处置。
            en: Cross-account copy to unknown accounts is blocked before materialization or triggers multiple control points, and completed replicas remain locatable for response through lineage.
          limitations:
            zh: 提供方不向源侧公开目标新 ID、合法备份账户被控或目标离开组织权限时，副本删除依赖提供方和法律响应。
            en: When the provider does not expose the destination new ID, an approved backup account is compromised, or the destination leaves organizational authority, replica deletion depends on provider and legal response.
      evidence_keys: [B10-3-T1537-REF-MS-SHARE-CONTROL, B10-3-T1537-REF-MS-DLP-SHARE, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: same_object_cross_account_entitlement_projection
        resolution: formal_candidate
        evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT]
      - axis: cross_account_durable_replica_detachment
        resolution: formal_candidate
        evidence_keys: [B10-3-T1537-REF-DNC-CASE, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
      - axis: continuous_sync_or_backup_workflow
        resolution: parent-core
        reason: 工作流名称不稳定；若保留同一对象权利归授权轴，若物化独立对象归副本轴，自动/周期属性另由 T1020/T1029 处理。
      - axis: audit_subject_substitution_by_service_principal
        resolution: supporting-property
        reason: 服务身份可改变 actor 可见性，但没有独立对象/控制结果，不能单列子项；应进入两项 Analytic 的 owner/workflow 基线。
      - axis: anonymous_or_bearer_link
        resolution: adjacent-or-deferred
        reason: 无可识别另一账户/租户时不满足收紧后的 T1537 账户边界，交由 T1567 或战术级 gap review。
      - axis: same_account_staging_snapshot_or_backup
        resolution: not-stealth-distinct
        reason: 未发生跨账户控制权或数据接收，属于内部 staging/capability。
      - axis: download_then_upload
        resolution: adjacent-technique
        reason: 数据经主机/客户端离开并上传，归 T1567 或相应外传通道。
      - axis: product_or_operation_name
        resolution: not-stealth-distinct
        reason: 分享、同步、复制和备份可产生不同 object identity 与 revoke 结果，不能按产品动作名称分类。
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线无子项，开放检验了对象连续授权、独立副本、同步/备份工作流、审计主体替换、bearer link、同账户暂存、下载再上传与产品维度；仅两项对象/撤销轴通过稳定性、痕迹和防御差异门禁。
      en: The fixed baseline has no children. Open search examined same-object entitlement, independent replica, sync or backup workflow, audit-subject substitution, bearer links, same-account staging, download then upload, and product dimensions. Only the two object and revocation axes pass stability, trace, and defense-difference gates.
  evidence_coverage:
    parent_behavior_keys: [B10-3-T1537-REF-ATTACK, B10-3-T1537-REF-DNC-CASE]
    boundary_keys: [B10-3-T1537-REF-ATTACK, B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-AWS-SHARE]
    mechanism_support:
      - mechanism_ref: NM-BT
        evidence_keys: [B10-3-T1537-REF-ATTACK, B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-AWS-SHARE]
        strength: direct_same_service_control_plane_and_no_external_interface_semantics
      - mechanism_ref: NM-ST
        evidence_keys: [B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY, B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT]
        strength: direct_cross_account_identity_and_lifecycle_fields
    child_existence_support:
      - child_key: B10-3-T1537-CH-ENTITLEMENT
        evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT, B10-3-T1537-REF-GDRIVE-REVOKE]
        strength: authoritative_capability_and_audit_semantics_without_public_malicious_case
      - child_key: B10-3-T1537-CH-REPLICA
        evidence_keys: [B10-3-T1537-REF-DNC-CASE, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
        strength: real_event_summary_plus_authoritative_object_lifecycle
    unsupported_or_deferred:
      - ATT&CK 上 INC Ransom、RedCurl 与 Storm-0501 的简述未证明同服务账户间原生控制权转移，本交接不以其支撑 NJS。
      - 原对象授权轴缺少公开恶意事件，保持 medium 且不创建 Case。
      - 匿名 link/SAS 没有目标账户解析时不纳入 T1537 正式范围。
      - grant 或 snapshot creation 本身不等于外传；必须分级到 access/download 或 copy/restore/materialization。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父项与两项子项覆盖定义、匿迹特性、正常共享反例、T1567/同账户暂存/下载上传边界、攻防模型、机理、对象与撤销差异、证据层级和不同研究限制。
      en: The parent and two children cover definition, stealth properties, benign sharing counterexamples, T1567, same-account staging, and download-upload boundaries, attacker and defender models, mechanisms, object and revocation differences, evidence levels, and distinct limitations.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, syntax validation, temporary-key audit]
  limitations:
    paragraphs:
      - zh: >-
          固定 ATT&CK 页面的 procedure examples 并不都满足同服务跨账户语义：Mega 工具上传和 AzCopy 到自有基础设施可能只是 Web 服务或普通通道外传。正式范围以资源 owner/target account、object continuity 和 provider-native share/copy 为准，不用 ATT&CK 标签替代结论级证据。
        en: >-
          Procedure examples on the fixed ATT&CK page do not all satisfy same-service cross-account semantics. Mega utility uploads and AzCopy to actor infrastructure may be web-service or ordinary-channel exfiltration. Formal scope relies on resource owner and target account, object continuity, and provider-native share or copy rather than using an ATT&CK label as conclusion-level evidence.
      - zh: >-
          原对象授权资料来自权威产品文档而非公开恶意事件，因此证明可实施路径、字段和撤销语义，不证明实际规避率或攻击者意图。跨平台字段不能机械等价：Microsoft 的 ObjectId/link event、Google 的 target_user/visibility、AWS 的 snapshot/permission/copy 具有不同身份和保留期，Analytic 必须先规范化再关联。
        en: >-
          Same-object entitlement material comes from authoritative product documentation rather than a public malicious incident. It establishes an implementable path, fields, and revocation semantics, not measured evasion or attacker intent. Cross-platform fields are not mechanically equivalent: Microsoft ObjectId and link events, Google target_user and visibility, and AWS snapshot, permission, and copy have different identities and retention and require normalization before correlation.
      - zh: >-
          DNC 案例是法院诉状对 CrowdStrike 取证和政府归因的总结，没有原始审计记录，Case 置信度保持 medium。目标账户不在组织控制下时，copy 后访问、再分享和删除可能无法直接观察；provider 共享资源事件也不总返回 destination object ID。响应结论必须区分 exposure、effective access、content delivery、copy initiated 和 durable replica。
        en: >-
          The DNC case is a court filing summarizing CrowdStrike forensics and government attribution without raw audit, so Case confidence remains medium. When the destination account lies outside organizational control, post-copy access, resharing, and deletion may not be directly visible, and provider shared-resource events do not always return destination object IDs. Response conclusions must distinguish exposure, effective access, content delivery, copy initiated, and durable replica.
      - zh: >-
          合法外部协作和灾备产生极高相似背景。撤销 share、禁用 external setting 或删除 source snapshot 只能改变未来源侧权利，不能证明未下载，也不能收回独立副本。防御对象因此必须同时治理批准关系、内容敏感度、账户 allowlist、密钥权威、到期与撤销后接收核查。
        en: >-
          Legitimate external collaboration and disaster recovery create very strong benign background. Revoking a share, disabling an external setting, or deleting a source snapshot changes only future source-side rights; it cannot prove no download and cannot recall an independent replica. Defense must therefore govern approved relationships, content sensitivity, account allowlists, key authority, expiry, and post-revocation receipt assessment together.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: New object IDs and account namespaces complicate lineage, but the supported stealth effect is cross-account distribution of traces rather than transformation or concealment of the data object's content or representation.
    - mechanism_ref: NM-FD
      reason: Legitimate collaboration appearance supports NM-BT behavior transparency; available evidence does not establish a separate stable feature-disguise variable independent of the grant or replica outcomes.
  open_questions:
    - 主 Agent应与 T1567 交接统一裁定匿名 link/SAS bearer URI：无法解析同服务目标账户时不进入 T1537，避免双重归属。
    - 跨技术最终审查可评估 MIT-000166 的 snapshot authority measure 是否精确 extend 到副本子项；若 measures 不变可复用，否则保持本交接新 MIT。
