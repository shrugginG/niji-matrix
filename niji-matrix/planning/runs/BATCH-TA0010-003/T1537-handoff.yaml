handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-003
work_item_ref: WORK-TA0010-T1537
temporary_key_prefix: B10-3-T1537
candidate:
  source_type: attack
  source_attack_id: T1537
  name:
    zh: 向云账户转移数据
    en: Transfer Data to Cloud Account
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 将 T1537 锚定为利用共享、同步、复制或备份，把数据转移到同一云服务上攻击者控制的另一个账户；这种服务内控制权变化可以避开只观察外部网络接口或 C2 大流量的检测。固定页面同时列出匿名链接，以及仅说明用 Mega/AzCopy 向云或自有基础设施传输的实例，它们不都证明“同服务跨账户”结果。Niji 因此建议 adapt：正式范围要求另一账户/租户取得同一对象的有效权利或形成独立持久副本，且需证明攻击者控制或未获批准的外部主体。
        en: >-
          ATT&CK Enterprise 19.1 anchors T1537 in sharing, syncing, copying, or backing up data to another adversary-controlled account on the same cloud service, a service-internal change of control that can evade monitoring focused on external interfaces, C2, or large network transfers. The fixed page also lists anonymous links and examples that merely describe Mega or AzCopy transfer to cloud or actor infrastructure, which do not all establish a same-service cross-account result. Niji therefore recommends adapt: formal scope requires another account or tenant to gain effective rights to the same object or materialize an independent durable replica, with evidence that the recipient is attacker-controlled or otherwise unapproved.
      - zh: >-
          开放分类收敛为两项以对象身份和撤销结果为核心的 Niji 变量。原对象跨账户授权投射保留 object ID，只改变 owner、ACL、share、link 或外部主体权利；跨账户持久副本脱离则在目标账户生成新的对象/快照身份，使源侧撤销无法收回已经复制的数据。同步、备份、共享和复制不直接成为子项，授权工作流与服务身份也只有在改变上述对象/控制结果时才归入相应轴。
        en: >-
          Open taxonomy search converged on two Niji variables centered on object identity and revocation outcome. Same-Object Cross-Account Entitlement Projection preserves the object ID while changing owner, ACL, share, link, or external-principal rights. Cross-Account Durable Replica Detachment creates a new object or snapshot identity in the destination account, so source-side revocation cannot recover the copied data. Sync, backup, sharing, and copy are not children by themselves; delegated workflows and service identities enter an axis only when they produce the corresponding object and control outcome.
proposed_content:
  summary:
    zh: 攻击者借用云服务内建共享或复制机制，使另一受控账户获得同一对象的权利或独立副本，并把外传痕迹分散到不同账户和控制面。
    en: Adversaries use cloud-native sharing or replication so another controlled account obtains rights to the same object or an independent copy, distributing exfiltration traces across accounts and control planes.
  definition_and_concept:
    paragraphs:
      - zh: >-
          向云账户转移数据是攻击者在数据已经位于 IaaS、Office Suite 或 SaaS 服务中时，调用该服务原生的分享、授权、同步、快照、复制、导出或备份机制，让同一服务内另一个账户或租户取得可用数据控制权。直接目标是无需先把内容下载到攻击者主机并重新上传，就让数据进入攻击者可持续访问的权限域或对象域。
        en: >-
          Transfer Data to Cloud Account occurs when data already resides in an IaaS, Office Suite, or SaaS service and an adversary invokes native share, entitlement, sync, snapshot, copy, export, or backup mechanisms so another account or tenant on the same service obtains usable control over it. The direct objective is to place data in an attacker-accessible authorization or object domain without first downloading it to an attacker host and uploading it again.
      - zh: >-
          “控制权转移”既可表现为原对象对外部账户新增读取/拥有权，也可表现为目标账户生成独立副本；不要求底层存储块经过公网。仅在受害账户内部创建暂存、快照或备份不成立。若攻击者从受害服务下载后再上传到外部 Web 服务，外传由 T1567 或相应通道承担；匿名 bearer link 若没有可识别账户/租户获得权利，也不属于本候选收紧后的账户边界。
        en: >-
          Control transfer can grant an external account read or ownership over the original object or materialize an independent copy in the destination account; underlying storage blocks need not cross the public Internet. Staging, snapshot, or backup solely inside the victim account is insufficient. When an adversary downloads from the victim service and reuploads to an external web service, T1567 or another channel owns the exfiltration. An anonymous bearer link without an identifiable account or tenant gaining rights also falls outside this candidate's tightened account boundary.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          服务内转移把主要痕迹从网络数据面移到权限、对象和账户控制面。企业出口可能只看到已有云服务 API，甚至没有面向外部接口的文件流；原对象授权轴只留下 share/permission/ownership 与外部访问事件，副本轴则留下 snapshot/share/copy/restore 和跨账户资源身份。传统按上行字节、外部目的地或恶意协议检测会丢失直接信号。
        en: >-
          Service-internal transfer moves the primary traces from network data plane to entitlement, object, and account control planes. Enterprise egress may show only existing cloud-service APIs or no file stream over an external interface. The same-object entitlement axis leaves share, permission, ownership, and external-access events; the replica axis leaves snapshot, share, copy, restore, and cross-account resource identities. Detection based on uploaded bytes, external destinations, or malicious protocols loses its direct signal.
      - zh: >-
          痕迹仍然存在且通常比网络内容更结构化：acting user/service principal、源 tenant/account、object ID、target user/account/domain、old/new role/visibility、link ID、snapshot ID、createVolumePermission、SharedSnapshotCopyInitiated、目标 copy ID、KMS grant、访问/下载与撤销时间。难点是这些字段分散在受害和接收账户，某些目标账户日志不在防守方权限内，服务身份还会替代最终操作者成为审计主体。
        en: >-
          Traces remain and are often more structured than network content: acting user or service principal, source tenant or account, object ID, target user, account or domain, old and new role or visibility, link ID, snapshot ID, createVolumePermission, SharedSnapshotCopyInitiated, destination copy ID, KMS grant, access or download, and revocation time. The difficulty is that fields split between victim and recipient accounts, destination-account logs may be outside defender authority, and a service identity can replace the ultimate operator as the audit actor.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求源数据已存在于云服务、攻击者或未批准外部主体控制同服务另一账户/租户、云原生操作建立了有效访问或独立副本，并有外部访问、copy/restore、目标对象或等价结果证据。只创建 invitation、link、snapshot 或 backup 而没有权利生效或接收结果时，应分别报告为 exposure/capability，不能直接升级为完成外传。
        en: >-
          Inclusion requires source data already present in a cloud service, another account or tenant on that service controlled by the adversary or an unapproved external principal, a cloud-native operation establishing effective access or an independent copy, and evidence of external access, copy or restore, destination object, or equivalent outcome. An invitation, link, snapshot, or backup without effective rights or receipt is an exposure or capability tier rather than completed exfiltration.
      - zh: >-
          合法客户协作、供应商交付、灾备、跨账户安全备份、并购迁移、法律发现和托管服务都会产生相同控制面事件，必须用批准关系、对象敏感度、目标账户清单、owner、用途、有效期和后继访问排除。普通共享动作只有目标主体未获批准且实际获得数据权利时才纳入；“外部”或“Guest”标签本身不是恶意判据。
        en: >-
          Legitimate customer collaboration, vendor delivery, disaster recovery, cross-account security backup, merger migration, legal discovery, and managed services create the same control-plane events. They require exclusion through approved relationship, object sensitivity, destination-account inventory, owner, purpose, validity, and successor access. Ordinary sharing enters scope only when an unapproved target actually obtains data rights; an External or Guest label alone is not maliciousness.
      - zh: >-
          同账户内暂存、版本、备份与共享不发生跨账户控制权变化。下载后用 rclone、Mega、AzCopy 或浏览器上传到外部服务属于 T1567 或其他外传通道，除非能证明使用的是同服务账户间的原生 share/copy。匿名链接和 SAS bearer URI 只在可解析为另一个账户/租户并发生访问时纳入授权轴，否则保留给 T1567 或战术级缺口审查。
        en: >-
          Staging, versioning, backup, and sharing inside one account do not change cross-account control. Download followed by rclone, Mega, AzCopy, or browser upload to an external service belongs to T1567 or another exfiltration channel unless a native same-service account-to-account share or copy is established. Anonymous links and SAS bearer URIs enter the entitlement axis only when resolved to another account or tenant and followed by access; otherwise they remain for T1567 or tactic-level gap review.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在 Office Suite 或 SaaS 中，攻击者可用被盗用户或服务身份把敏感文件、文件夹或站点分享给外部账户，转移 ownership，或把外部主体加入特定 link。Microsoft 审计会区分 invitation created、accepted、AddedToSecureLink、FileAccessed 等阶段并保留 ObjectId；Google Drive 审计可记录 target_user、owner、visibility 和 shared_drive_id。这些字段支持原对象连续轴，但不能仅凭 capability 文档证明某个野外攻击者已经使用。
          en: >-
            In Office Suite or SaaS, an adversary can use a stolen user or service identity to share sensitive files, folders, or sites with an external account, transfer ownership, or add an external principal to a specific link. Microsoft audit separates invitation created, accepted, AddedToSecureLink, FileAccessed, and related stages while preserving ObjectId. Google Drive audit records target_user, owner, visibility, and shared_drive_id. These fields support the same-object continuity axis but capability documentation alone does not prove use by a particular observed adversary.
        - zh: >-
            在 IaaS 中，攻击者可为卷或实例创建 snapshot，把 createVolumePermission 授予其账户，再在目标账户 copy 或创建 volume。DNC 诉状所述取证发现行为者制作云虚拟服务器的精确 snapshots 并移到其在同一服务上的其他账户；AWS 文档说明共享 snapshot 可由获授权账户复制，copy 获得唯一资源 ID，CloudTrail 还能记录 SharedSnapshotCopyInitiated 和 SharedSnapshotVolumeCreated。
          en: >-
            In IaaS, an adversary can snapshot a volume or instance, grant its account createVolumePermission, then copy the snapshot or create a volume in the destination account. The DNC complaint describes forensic findings that actors made exact snapshots of cloud virtual servers and moved them to other accounts they controlled on the same service. AWS documentation states that an authorized account can copy a shared snapshot, that the copy receives a unique resource ID, and that CloudTrail can record SharedSnapshotCopyInitiated and SharedSnapshotVolumeCreated.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: >-
            攻击者需要在源租户拥有分享、修改 ACL/ownership、创建快照/备份、授予跨账户权限或调用复制流程的有效身份，并准备同服务目标账户。加密 snapshot 还可能需要共享或使用 KMS key；SaaS 受 domain allowlist、B2B、DLP、敏感度标签、下载限制和 guest 到期约束。权限不足时可能只能创建 invitation 而无法实现访问。
          en: >-
            The adversary needs a valid identity in the source tenant with authority to share, modify ACL or ownership, create snapshots or backups, grant cross-account rights, or invoke copy workflows, plus a destination account on the same service. Encrypted snapshots may also require sharing or using a KMS key. SaaS is constrained by domain allowlists, B2B, DLP, sensitivity labels, download restrictions, and guest expiry. Insufficient authority may produce only an invitation without effective access.
        - zh: >-
            原对象授权便于持续读取更新，但依赖源侧 grant 保持有效并暴露 target identity；独立副本在 materialize 后抵抗源侧撤销，却需要更多控制面操作、目标存储与可能的密钥重加密。自动 sync 或 backup 会增加固定 workflow、service principal、频率和错误重试痕迹，攻击者必须控制这些残余。
          en: >-
            Same-object entitlement supports continuing access to updates but depends on the source grant remaining valid and exposes target identity. An independent copy resists source-side revocation after materialization but requires more control-plane operations, destination storage, and possibly key re-encryption. Automated sync or backup adds fixed workflow, service principal, cadence, and retry traces that the adversary must manage.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定集中保存云控制面和数据面审计、目录/账户注册、对象敏感度、批准合作关系、资源 owner/ID、share/copy/restore 与撤销状态。原对象轴按 object ID 连接 grant→accept→access/download→revoke；副本轴按 source object/snapshot、target account、provider copy event 与 new object ID 建立 lineage。目的账户不受组织控制时，只能依赖提供方返回给源账户的共享资源事件或法律/响应协作。
            en: >-
              The defender is assumed to centralize cloud control-plane and data-plane audit, directory and account registry, object sensitivity, approved collaboration, resource owner and ID, share, copy, restore, and revocation state. The same-object axis joins grant to accept, access or download, and revoke by object ID. The replica axis builds lineage from source object or snapshot, target account, provider copy event, and new object ID. When the destination account is outside organizational control, the defender depends on shared-resource events returned by the provider to the source or on legal and incident-response cooperation.
          - zh: >-
              日志盲区包括匿名/bearer link、共享密钥或 SAS 造成主体不明、目标租户日志不可见、数据面日志未启用、审计保留短于 grant 生命周期、sync/backup 由服务身份执行，以及 copy 后目标对象 ID 未返回源侧。移除 grant 不证明数据未被读取，删除源 snapshot 也不能删除目标账户已复制的对象。
            en: >-
              Blind spots include anonymous or bearer links, shared keys or SAS obscuring the actor, invisible destination-tenant logs, disabled data-plane audit, retention shorter than grant lifetime, sync or backup performed by a service identity, and destination object IDs not returned to the source after copy. Removing a grant does not prove data was never read, and deleting a source snapshot cannot delete an object already copied into the destination account.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 借用同服务正常分享和备份控制面避免独立外部文件流
        en: Borrow normal same-service sharing and backup control planes to avoid a distinct external file flow
      analysis:
        paragraphs:
          - zh: >-
              攻击者调用云服务原生 grant、share、sync、snapshot 或 copy，使服务内部完成权利或对象交付；企业出口只见常见 API，甚至不见外部网络传输，传统大流量告警保持正常。ATT&CK 明确说明同提供商 API 和内部地址可混入正常流量或避开外部接口；结构化 share/copy 审计仍可恢复差异，因此属于行为透明而非痕迹消失。
            en: >-
              The adversary invokes native grant, share, sync, snapshot, or copy so the cloud service performs entitlement or object delivery internally. Enterprise egress sees common APIs or no external transfer, leaving traditional large-transfer alerts normal. ATT&CK explicitly states that same-provider APIs and internal address space can blend with normal traffic or avoid external interfaces. Structured share and copy audit still recovers the difference, so this is Behavioral Transparency rather than trace erasure.
      evidence_keys: [B10-3-T1537-REF-ATTACK, B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-AWS-SHARE]
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 将授权、接收、复制和后继访问分散到源与目标账户
        en: Distribute grant, receipt, copy, and successor access across source and destination accounts
      analysis:
        paragraphs:
          - zh: >-
              源账户记录 grant、share 或 snapshot 权限，目标账户执行 accept、copy、restore 或后继访问；独立副本还获得新对象 ID，使单租户调查只看到链的一部分。AWS 共享 snapshot 事件与 copy 唯一 ID，以及 Microsoft/Google 的 acting/target 主体字段，证明跨账户关联键存在。没有组织级或提供方视角时，链被分散到不同管理域，形成时空释痕。
            en: >-
              The source account records grant, share, or snapshot permission, while the destination account performs accept, copy, restore, or successor access. An independent replica also receives a new object ID, so a single-tenant investigation sees only part of the chain. AWS shared-snapshot events and unique copy IDs plus Microsoft and Google acting and target principal fields establish available cross-account join keys. Without organization-wide or provider visibility, the chain is distributed across administrative domains, producing Spatiotemporal Trace Dilution.
      evidence_keys: [B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY, B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT]
      confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            两项子技术按跨账户交付后对象身份和撤销效果划分。原对象跨账户授权投射保留源 object ID，目标账户的控制依赖源 grant，撤销可阻止未来访问但不能证明未下载；跨账户持久副本脱离生成目标账户新 object/snapshot ID，copy 完成后源侧 revoke/delete 不能回收副本。它们分别需要 grant-access-revoke 与 source-share-copy-new-object 检测链。
          en: >-
            The two children divide by object identity and revocation outcome after cross-account delivery. Same-Object Cross-Account Entitlement Projection preserves the source object ID, and destination control depends on the source grant; revocation stops future access but cannot prove no prior download. Cross-Account Durable Replica Detachment generates a new object or snapshot ID in the destination account, and source revoke or delete cannot recover the replica after copy. They require grant-access-revoke and source-share-copy-new-object detection chains respectively.
        - zh: >-
            分享、同步、复制、导出和备份是实现，不决定分类：同步若只让外部账户持续读取同一对象，归授权轴；若在目标账户形成独立对象，归副本轴。同样，service principal 或批准 workflow 只改变审计 actor，不足以成为第三子项。匿名 link、同账户暂存、下载再上传与普通未使用共享分别按边界或证据层级处理。
          en: >-
            Share, sync, copy, export, and backup are implementations rather than taxonomy. Sync that gives another account continuing access to the same object belongs to the entitlement axis; sync that materializes an independent destination object belongs to the replica axis. A service principal or approved workflow changes the audit actor but is not a third child by itself. Anonymous links, same-account staging, download then upload, and unused ordinary shares are handled by boundary or evidence tier.
    coverage: established
    proposed_child_keys: [B10-3-T1537-CH-ENTITLEMENT, B10-3-T1537-CH-REPLICA]
proposed_subtechniques:
  - temporary_key: B10-3-T1537-CH-ENTITLEMENT
    name:
      zh: 原对象跨账户授权投射
      en: Same-Object Cross-Account Entitlement Projection
    stable_variable: source_object_identity_remains_while_external_account_gains_effective_rights
    trace_change: no_content_copy_or_external_file_flow_and_evidence_concentrates_in_grant_target_and_successor_access_events
    defender_effect: detection_requires_acting_to_target_principal_resolution_and_grant_accept_access_revoke_lifecycle
    prerequisites: attacker_controls_source_sharing_authority_and_identifiable_destination_account
    evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT, B10-3-T1537-REF-GDRIVE-REVOKE, B10-3-T1537-REF-MS-SHARE-CONTROL]
    confidence: medium
    proposed_content:
      summary:
        zh: 保留云对象身份并向另一账户投射读取、编辑或拥有权，使数据控制变化表现为正常共享而非新文件传输。
        en: Preserve cloud-object identity while projecting read, edit, or ownership rights to another account, making the change of data control appear as ordinary sharing rather than a new file transfer.
      definition_and_concept:
        paragraphs:
          - zh: >-
              原对象跨账户授权投射是攻击者不复制内容对象，而是在同一服务中把另一账户、guest、外部 domain 或 account principal 加入原对象的 ACL、specific-people link、shared drive/site membership 或 ownership，使该主体能够读取或控制相同 object ID。稳定变量是身份连续的对象与新增的跨账户权利。
            en: >-
              Same-Object Cross-Account Entitlement Projection does not copy the content object. Within the same service it adds another account, guest, external domain, or account principal to the original object's ACL, specific-people link, shared drive or site membership, or ownership so that principal can read or control the same object ID. The stable variable is a continuous object identity with new cross-account rights.
          - zh: >-
              创建 invitation 或 link 但没有 acceptance/access 时只属于 exposure。匿名 Anyone link 无法解析到另一个账户时不符合本子项；若 specific-people/guest link 记录 target account 并发生 FileAccessed/download，则成立。ownership transfer 只有实际 source/target owner 状态变化时才纳入。
            en: >-
              Creating an invitation or link without acceptance or access is exposure only. An anonymous Anyone link that cannot resolve to another account does not qualify. A specific-people or guest link with a recorded target account followed by FileAccessed or download can qualify. Ownership transfer enters only when source and target owner state actually changes.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              内容没有新建副本，企业网络和对象创建监测看不到大文件外送；同一 object ID 继续位于原站点或 drive，访问由云服务完成。残余集中在 acting user、target user/domain、old/new role/visibility、link ID、acceptance、FileAccessed/download 和 revoke。服务身份或合法协作界面会降低单个分享事件的可区分性，但目标主体与后继访问仍可恢复。
            en: >-
              No new content copy is created, so enterprise network and object-creation monitoring sees no large transfer. The same object ID remains in its original site or drive and the cloud service performs access. Residuals concentrate in acting user, target user or domain, old and new role or visibility, link ID, acceptance, FileAccessed or download, and revoke. Service identities and legitimate collaboration interfaces reduce the distinguishability of one share event, but target principal and successor access remain recoverable.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求敏感源对象、同服务外部账户/租户、有效 grant 与后继访问或 ownership 结果。批准客户/供应商协作须按合同、owner、domain/account allowlist、对象范围和到期排除；一个外部 guest 不自动表示攻击者。若目标主体只下载后在其他服务上传，后续行为归 T1567；若共享后目标账户 copy 成独立对象，则同时或转入副本兄弟项。
            en: >-
              Inclusion requires a sensitive source object, an external account or tenant on the same service, an effective grant, and successor access or ownership outcome. Approved customer or vendor collaboration requires exclusion by contract, owner, domain or account allowlist, object scope, and expiry; an external guest is not automatically an adversary. If the target merely downloads and later uploads to another service, the successor behavior belongs to T1567. If the target copies the shared object into an independent object, the replica sibling additionally or subsequently applies.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                攻击者控制受害用户后，可在 SharePoint/OneDrive 为外部账户创建 specific-people link 或 invitation，或在 Google Drive 把 target_user 加入文件/共享盘。Microsoft 审计可连接 SharingInvitationCreated→Accepted 或 SecureLinkCreated/AddedToSecureLink→FileAccessed；Google 记录 target_user、owner、visibility_change 与 shared_drive_id。合法 UI 和 API 都可产生同样流程。
              en: >-
                After controlling a victim user, an adversary can create a specific-people link or invitation in SharePoint or OneDrive for an external account or add target_user to a file or shared drive in Google Drive. Microsoft audit can join SharingInvitationCreated to Accepted or SecureLinkCreated and AddedToSecureLink to FileAccessed. Google records target_user, owner, visibility_change, and shared_drive_id. Legitimate UI and API produce the same workflow.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要源对象分享/ownership 权限和可接收邀请或访问的目标账户，并绕过 domain allowlist、guest policy、DLP 与敏感标签。持续访问依赖 grant、link、guest 或 shared-drive membership 保持有效；owner 审查、到期或重新认证会中断。
                en: >-
                  The adversary needs source-object sharing or ownership authority and a destination account able to accept or access, while bypassing domain allowlists, guest policy, DLP, and sensitivity labels. Continuing access depends on the grant, link, guest, or shared-drive membership remaining effective; owner review, expiry, or reauthentication can interrupt it.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方按稳定 object ID 维护 owner、sensitivity、acting principal、target principal/domain、link/permission ID、old/new state、accept/access/download 和 revoke，并与批准合作清单连接。若 target account 不在目录或使用 bearer token，主体归因下降；若未启用数据面访问日志，只能确认 exposure 不能确认内容交付。
                en: >-
                  Defenders maintain owner, sensitivity, acting principal, target principal or domain, link or permission ID, old and new state, accept, access or download, and revoke by stable object ID and join these to approved collaboration. Attribution drops when the target account is absent from the directory or uses a bearer token. Without data-plane access logs, evidence establishes exposure rather than content delivery.
      stealth_mechanisms:
        - mechanism_ref: NM-BT
          role: primary
          summary:
            zh: 用正常协作授权替代可见文件传输并保持对象身份不变
            en: Substitute ordinary collaboration entitlement for visible file transfer while preserving object identity
          analysis:
            paragraphs:
              - zh: >-
                  攻击者只改变原对象的 target rights，云服务随后向外部账户提供内容；网络传输、文件复制和本地 uploader 都不出现，单个 share 事件与日常协作相同。Microsoft 和 Google 审计字段仍可连接 acting/target principal、object ID 和 access outcome。只有目标账户未批准且完成访问时，正常外观才形成可证行为透明。
                en: >-
                  The adversary changes only target rights on the original object, after which the cloud service serves content to the external account. No local uploader, visible network transfer, or content-copy event appears, and one share event resembles daily collaboration. Microsoft and Google audit fields still join acting and target principal, object ID, and access outcome. The normal appearance becomes supported Behavioral Transparency only when the target account is unapproved and access completes.
          evidence_keys: [B10-3-T1537-REF-MS-SHARE-AUDIT, B10-3-T1537-REF-GDRIVE-AUDIT]
          confidence: medium
      defense_targets: [B10-3-T1537-DET-CROSS-ACCOUNT, B10-3-T1537-MIT-CROSS-ACCOUNT]
      research_limitations:
        paragraphs:
          - zh: >-
              官方文档证明授权、审计、访问和撤销语义，但本研究未取得明确记录攻击者通过 external share 向其同服务账户完成数据窃取的公开事件报告。因此子项为 medium，正式案例为空。Link forwarding、guest 预存在目录和未记录 download 都会削弱 target-account 结论。
            en: >-
              Official documentation establishes entitlement, audit, access, and revocation semantics, but this research found no public incident report explicitly documenting an adversary completing theft to its same-service account through external sharing. The child remains medium confidence with no formal case. Link forwarding, preexisting guest identities, and unlogged download weaken target-account conclusions.
  - temporary_key: B10-3-T1537-CH-REPLICA
    name:
      zh: 跨账户持久副本脱离
      en: Cross-Account Durable Replica Detachment
    stable_variable: destination_account_materializes_new_object_identity_and_control_independent_of_source_grant
    trace_change: source_share_or_copy_event_precedes_destination_object_with_new_id_and_post_copy_revoke_does_not_recall_data
    defender_effect: lineage_and_containment_require_cross_account_source_to_destination_object_mapping
    prerequisites: attacker_controls_snapshot_copy_or_backup_authority_and_destination_account
    evidence_keys: [B10-3-T1537-REF-DNC-CASE, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
    confidence: high
    proposed_content:
      summary:
        zh: 把 snapshot、backup 或云对象复制到另一账户并形成新对象身份，使副本脱离源账户撤销和删除控制。
        en: Copy a snapshot, backup, or cloud object into another account under a new object identity, detaching the replica from source-account revocation and deletion.
      definition_and_concept:
        paragraphs:
          - zh: >-
              跨账户持久副本脱离是攻击者先让同服务目标账户获得复制/恢复权，再在目标账户 materialize 新 snapshot、image、volume、backup 或等价对象。稳定变量是新对象 ID 和独立 owner/control domain；源对象可以保持不变，也可以随后删除，但不能回收已完成的目标副本。
            en: >-
              Cross-Account Durable Replica Detachment first gives a destination account on the same service copy or restore authority and then materializes a new snapshot, image, volume, backup, or equivalent object in that account. The stable variable is a new object ID and independent owner or control domain. The source may remain unchanged or later be deleted, but the completed destination replica cannot be recalled.
          - zh: >-
              仅创建源 snapshot、backup 或 export job 属于 capability；必须有 SharedSnapshotCopyInitiated、目标 copy/volume、provider completion 或等价接收结果。若 copy 仍在受害账户内部，不构成跨账户外传；如果内容先下载到主机再上传，不属于本子项。
            en: >-
              A source snapshot, backup, or export job alone is capability. SharedSnapshotCopyInitiated, a destination copy or volume, provider completion, or equivalent receipt outcome is required. A copy remaining inside the victim account is not cross-account exfiltration, and content downloaded to a host before upload does not belong to this child.
      stealth_characteristics:
        paragraphs:
          - zh: >-
              云提供商内部复制不一定产生企业外部网络流，source snapshot 的数据可在内部存储平面成为目标账户新资源。源账户可能只看到 share/permission 和 provider 共享资源事件，目标账户的 new object、attach/read 和后继使用则位于另一审计域。copy ID、owner、KMS key 与 tag 变化是残余；AWS 明确说明 copy 有唯一资源 ID。
            en: >-
              Provider-internal copying need not create enterprise external network flow; source snapshot data can become a new resource in the destination account within the storage plane. The source account may see only share or permission and provider shared-resource events, while the destination account holds the new object, attach or read, and successor use in another audit domain. Copy ID, owner, KMS key, and tag changes remain; AWS explicitly states that the copy has a unique resource ID.
      scope_boundary_definition:
        paragraphs:
          - zh: >-
              纳入要求源对象/快照、未批准目标账户、cross-account permission、复制或恢复结果以及数据敏感度可连接。合法隔离备份、灾备、多账户安全架构、并购迁移和取证副本必须按 account registry、owner、KMS、工单和保留目的排除。源 share 被撤销但目标 copy 仍存在时，本子项持续成立；只共享未复制的 snapshot 仍停留在授权暴露层。
            en: >-
              Inclusion requires joinable source object or snapshot, unapproved destination account, cross-account permission, copy or restore outcome, and data sensitivity. Legitimate isolated backup, disaster recovery, multi-account security architecture, merger migration, and forensic copies require exclusion by account registry, owner, KMS, ticket, and retention purpose. The child remains after source sharing is revoked if the destination copy persists. A shared but uncopied snapshot remains entitlement exposure.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
            - zh: >-
                DNC 法院文件描述 CrowdStrike 取证发现未授权用户制作云虚拟服务器精确 snapshots，并在 2016 年 9 月把多个副本移动到其控制的同服务账户。AWS 的现行语义允许 owner 把 createVolumePermission 加给特定 account，目标账户复制 shared snapshot 或创建 volume；SharedSnapshotCopyInitiated/VolumeCreated 为源侧提供部分后继证据。
              en: >-
                The DNC court filing describes CrowdStrike forensic findings that unauthorized users made exact snapshots of cloud virtual servers and moved multiple replicas in September 2016 to accounts they controlled on the same service. Current AWS semantics let an owner add createVolumePermission for a specific account, after which the destination account can copy the shared snapshot or create a volume. SharedSnapshotCopyInitiated and SharedSnapshotVolumeCreated provide the source account partial successor evidence.
        threat_model:
          attacker_model:
            paragraphs:
              - zh: >-
                  攻击者需要创建或读取源 snapshot/backup、修改跨账户 permission、使用必要 KMS key/grant，并在目标账户执行 copy/restore 的权限。加密默认 key、block public access、组织策略、copy quota、region 限制和服务事件监控会提高成本；为抵抗撤销，目标账户需在源 grant 有效期内完成独立 copy。
                en: >-
                  The adversary needs authority to create or read the source snapshot or backup, modify cross-account permission, use required KMS keys or grants, and copy or restore in the destination account. Default encryption keys, block-public-access, organization policies, copy quotas, Region constraints, and provider-event monitoring raise cost. To resist revocation, the destination account must finish an independent copy while the source grant remains valid.
          defender_model:
            paragraphs:
              - zh: >-
                  防守方保存 create/share/copy/restore/delete、source and destination account、source snapshot/object ID、new copy/volume ID、KMS grant/key、request ID、completion、tags 和批准记录。若 provider 只向源账户返回 copy initiated 而不返回目标 new ID，应保留 destination account 和时间并请求组织级/提供方协查；未确认 copy 时只能报告 exposure。
                en: >-
                  Defenders retain create, share, copy, restore, and delete; source and destination account; source snapshot or object ID; new copy or volume ID; KMS grant or key; request ID; completion; tags; and approval. When the provider returns only copy initiated to the source without the destination new ID, preserve destination account and time for organization-wide or provider investigation. Without confirmed copy, report exposure only.
      stealth_mechanisms:
        - mechanism_ref: NM-ST
          role: primary
          summary:
            zh: 源授权与目标副本分散在不同账户并切断单租户对象谱系
            en: Source authorization and destination replica split across accounts and break single-tenant object lineage
          analysis:
            paragraphs:
              - zh: >-
                  源账户执行 snapshot share/permission，目标账户执行 copy/restore 并获得新 ID；网络出口没有文件流，单租户日志无法看到完整因果和副本后继。DNC 事件证明真实跨账户 snapshot 窃取，AWS 文档证明 share→copy、新 ID 与 shared-resource events 的可实现关联。需要组织/提供方层的 source ID—destination account—copy outcome 连接才能恢复完整链。
                en: >-
                  The source account performs snapshot sharing or permission, while the destination account copies or restores and receives a new ID. No file flow appears at enterprise egress, and one tenant's logs cannot see the complete causality and successor replica. The DNC event establishes real cross-account snapshot theft, while AWS documentation establishes implementable share-to-copy, new-ID, and shared-resource event joins. Organization or provider-level source-ID-to-destination-account-to-copy-outcome correlation is required to reconstruct the chain.
          evidence_keys: [B10-3-T1537-REF-DNC-CASE, B10-3-T1537-REF-AWS-SHARE, B10-3-T1537-REF-AWS-COPY]
          confidence: high
      defense_targets: [B10-3-T1537-DET-CROSS-ACCOUNT, B10-3-T1537-MIT-CROSS-ACCOUNT]
      research_limitations:
        paragraphs:
          - zh: >-
              DNC 文件是诉讼陈述并总结取证结论，不公开原始 CloudTrail、snapshot IDs 或 API 顺序；正式 Case 必须保留此证据性质。AWS 语义不能自动推广到所有提供商，某些平台不会把目标 copy ID 或后继访问返回源租户。加密 snapshot 的 KMS grant 与 copy 完成需分别验证。
            en: >-
              The DNC filing is a litigation statement summarizing forensic conclusions and does not publish raw CloudTrail, snapshot IDs, or API order; a formal Case must preserve that evidence character. AWS semantics cannot be projected automatically to every provider, and some platforms do not return destination copy IDs or successor access to the source tenant. KMS grant and completed copy for encrypted snapshots require separate verification.
