      statement_en: Shai-Hulud created public GitHub data.json objects from endpoint secrets, separating upload and later retrieval through a persistent service object while leaving repository-creation, visibility, and object-audit traces.
      evidence_keys: [B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-GITHUB-AUDIT]
      confidence: high
    - temporary_key: B10-3-T1567-CLM-WORKFLOW
      statement_zh: 攻击者可在受害 SaaS 配置 Webhook/集成，使服务端工作流在敏感事件发生后向外部端点发送；关键痕迹从端点连接转移到配置和 delivery 审计。
      statement_en: An adversary can configure a webhook or integration in victim SaaS so a server-side workflow sends to an outside endpoint after sensitive events, moving critical traces from endpoint connections into configuration and delivery audit.
      evidence_keys: [B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-M365-AUDIT]
      confidence: medium
    - temporary_key: B10-3-T1567-CLM-BOUNDARY
      statement_zh: 同一合法云服务账号同时承载命令、控制和回传时，服务合法性只提供实现外观，直接关系仍是 T1041；同服务对象跨账户/租户所有权转移则由 T1537 承担。
      statement_en: When one legitimate-cloud account carries commands, control, and return data, service legitimacy is implementation appearance while T1041 owns the direct relationship; same-service object ownership transfer across accounts or tenants belongs to T1537.
      evidence_keys: [B10-3-T1567-REF-ESET-OILRIG-BOUNDARY, REF-000625]
      confidence: high
    - temporary_key: B10-3-T1567-CLM-GAP
      statement_zh: 受害者自有 Web 服务响应外部请求并送出本地暂存数据，不使用合法外部 Web 服务，也不稳定依赖替代协议，因此不归 T1567，保留为 TA0010 原生缺口候选。
      statement_en: A victim-owned web service returning locally staged data to an outside request uses no legitimate external web service and does not stably depend on an alternative protocol, so it is outside T1567 and remains a TA0010 native-gap candidate.
      evidence_keys: [REF-000509, REF-000514]
      confidence: high
    - temporary_key: B10-3-T1567-CLM-DEFENSE
      statement_zh: Web 服务外传检测必须把提供方与接收命名空间分开，并将端点源数据、服务对象生命周期和工作流投递作为三种不同关联任务；域名或 HTTPS 单点不能实现覆盖。
      statement_en: Detection of web-service exfiltration must separate provider from receiver namespace and treat endpoint source data, service-object lifecycle, and workflow delivery as three different correlation tasks; a domain or HTTPS point signal cannot implement coverage.
