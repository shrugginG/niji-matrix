handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0010-003
work_item_ref: WORK-TA0010-T1567
temporary_key_prefix: B10-3-T1567-
candidate:
  source_type: attack
  source_attack_id: T1567
  name:
    zh: 经 Web 服务渗出
    en: Exfiltration Over Web Service
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: >-
          Enterprise ATT&CK 19.1 将 T1567 定义为利用既有合法外部 Web 服务而非主要 C2 通道外传数据；服务常已被组织访问并获防火墙允许，TLS 又会降低网络侧内容可见性。真实事件中，Bazar/Conti 将共享目录送入 MEGA，InvisibleFerret 使用 Telegram API bot token 把归档上传到聊天，Shai-Hulud 将本机收集的秘密写入公开 GitHub 仓库并经 Webhook 服务发送。该行为直接服务 TA0010，建议保留父语义。
        en: >-
          Enterprise ATT&CK 19.1 defines T1567 as using an existing legitimate external web service to exfiltrate data rather than the primary C2 channel. Organizations commonly already reach the service and permit it through firewalls, while TLS reduces network-content visibility. In observed incidents, Bazar or Conti sent a network share to MEGA, InvisibleFerret used a Telegram API bot token to upload an archive to a chat, and Shai-Hulud wrote locally harvested secrets into public GitHub repositories and sent them through a webhook service. The behavior directly serves TA0010, so retain the parent semantics.
      - zh: >-
          固定版四个 ATT&CK 子项按代码仓库、云存储、文本存储和 Webhook 这种服务或承载实现划分，不能导入 Niji。跨这些实现更稳定的匿迹变量是：接收者账号、聊天、仓库或端点被共享服务域名遮蔽；数据被保存为服务对象后由攻击者异步取回；以及服务端 Webhook/集成代表受害租户把数据主动转交给外部端点。这三项改变不同痕迹、归因键和防御动作，适合作为 Niji 分类。
        en: >-
          The four fixed-version ATT&CK children divide code repositories, cloud storage, text storage, and webhooks, which are service or carriage implementations and are not imported into Niji. More stable cross-service stealth variables are an account, chat, repository, or endpoint hidden behind a shared service domain; data persisted as a service object for later adversary retrieval; and a server-side webhook or integration that delivers victim-tenant data to an outside endpoint on the tenant's behalf. These change different traces, attribution keys, and defensive actions and therefore form suitable Niji axes.
  original_attack_subtechniques_imported: false
  scope_notes:
    zh: >-
      T1567 的直接对象是合法外部 Web 服务作为接收或转交媒介。若数据已在同一云服务并通过共享、复制、同步、导出或备份改变到账户/租户所有权，归 T1537；若复用既有逻辑 C2 关系，归 T1041；只有协议或接收关系相对 C2 改变但服务身份不是核心时归 T1048。把数据放入受害者自有 Web 根目录后由外部取回不使用外部服务，继续作为 TA0010 原生缺口候选。
    en: >-
      T1567 directly concerns a legitimate external web service as receiver or relay. If data already resides in the same cloud service and sharing, copying, synchronization, export, or backup changes account or tenant control, T1537 owns the behavior. Reuse of the existing logical C2 relationship belongs to T1041. A protocol or receiver change relative to C2 belongs to T1048 when service identity is not the defining object. Data placed in a victim-owned web root and fetched from outside uses no external service and remains a TA0010 native-gap candidate.
proposed_content:
  temporary_key: B10-3-T1567-PARENT
  name:
    zh: 经 Web 服务渗出
    en: Exfiltration Over Web Service
  summary:
    zh: 攻击者把失窃数据提交给合法外部 Web 服务或由该服务转交，借用已获准的服务身份、共享基础设施和服务工作流降低网络侧识别与接收者归因能力。
    en: An adversary submits stolen data to a legitimate external web service or has that service relay it, borrowing an allowed service identity, shared infrastructure, and service workflows to reduce network-side recognition and receiver attribution.
  definition_and_concept:
    paragraphs:
      - zh: >-
          经 Web 服务渗出是攻击者在获得目标数据后，通过已有合法 SaaS、云存储、代码协作、文本发布、即时通信或 Webhook/API 服务，把数据送入攻击者可访问的服务对象、账号、聊天、仓库或回调端点。直接目标是让数据离开受害控制范围；服务负责接收、保存或转交，HTTPS、官方客户端、API 和自动化工作流只是实现。
        en: >-
          Exfiltration Over Web Service occurs after an adversary obtains target data and uses an existing legitimate SaaS, cloud-storage, code-collaboration, text-publication, messaging, or webhook and API service to deliver it into a service object, account, chat, repository, or callback endpoint the adversary can access. The immediate objective is to move data outside victim control. The service receives, stores, or relays it; HTTPS, official clients, APIs, and automation workflows are implementations.
      - zh: >-
          “Web 服务”在这里要求外部提供方参与传输语义，而非仅使用 HTTP/S。攻击者自建 HTTPS 服务器属于相应协议或 C2 技术；受害者自有 Web 服务返回本地暂存产物属于另一个拉取式缺口；同一服务内部从受害账户转到攻击者账户则由 T1537 判断。代码、云盘、文本和 Webhook 产品类型不构成 Niji 子项。
        en: >-
          “Web service” here requires an outside provider to participate in the transfer semantics, rather than merely using HTTP or HTTPS. An attacker-operated HTTPS server belongs to the applicable protocol or C2 technique. A victim-owned web service returning a locally staged artifact belongs to a separate pull-style gap. Movement inside one service from a victim account to an attacker account is judged under T1537. Code, drive, text, and webhook product types do not define Niji children.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          经 Web 服务渗出让网络侧看到已知 SaaS 域名、有效证书、标准 443 流量和组织中原本存在的访问背景。共享服务域与地址只归属提供方，通常不显示具体接收账号、聊天、仓库、对象或 Webhook；目的信誉、域名允许清单和单次 TLS 会话因而难以区分恶意接收者。端点进程、API URI、令牌/应用身份、服务对象和租户审计仍可提供更细粒度证据。
        en: >-
          Exfiltration Over Web Service presents the network with a known SaaS domain, valid certificate, standard port 443 traffic, and access already common in the organization. A shared service domain and address identify the provider but often not the receiving account, chat, repository, object, or webhook. Destination reputation, domain allowlists, and one TLS session therefore struggle to distinguish the malicious receiver. Endpoint process, API URI, token or application identity, service object, and tenant audit remain finer-grained evidence.
      - zh: >-
          服务对象和工作流还会把上传、保存、转交及攻击者取回分散到不同主体和时间。受害端只看到上传，攻击者读取发生在服务端；Webhook 由 SaaS 自身向外部发送，端点没有相应连接。匿迹收益受服务审计、CASB、端点 DLP、对象可见性政策和接收者注册表限制。合法开发提交、备份、协作聊天、支持工单、监控 Webhook 与用户云同步构成高相似背景。
        en: >-
          Service objects and workflows also distribute upload, storage, relay, and adversary retrieval across principals and time. The victim endpoint sees only the upload while adversary access occurs at the provider, and a webhook sends from SaaS without a corresponding endpoint connection. Service audit, CASB, endpoint DLP, object-visibility policy, and receiver registries constrain the stealth benefit. Legitimate development commits, backups, collaboration chat, support tickets, monitoring webhooks, and user cloud sync create highly similar background.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求已收集数据被提交给合法外部 Web 服务、API 或 Webhook，或由受害租户中的服务工作流向攻击者端点实际转交；同时需要可证明的服务接收对象、接收者命名空间或交付结果。只有访问 SaaS、持有令牌、安装 Rclone、创建 Webhook 或出现 HTTPS 连接不足。服务仍可被同时用于 C2，但若同一逻辑服务关系承担命令、控制和回传，当前外传事件归 T1041，不能仅因提供方合法而改标 T1567。
        en: >-
          Inclusion requires acquired data to be submitted to a legitimate outside web service, API, or webhook, or actually relayed from a victim-tenant service workflow to an attacker endpoint. A service object, receiver namespace, or delivery result must be demonstrable. SaaS access, possession of a token, installation of Rclone, webhook creation, or an HTTPS connection alone is insufficient. A service may also carry C2, but when the same logical service relationship carries commands, control, and return data, the current exfiltration event belongs to T1041 and does not become T1567 merely because the provider is legitimate.
      - zh: >-
          如果源数据已在云/SaaS 内，并通过共享、同步、复制、导出或备份转入另一账户/租户而没有端点重新上传，T1537 是直接对象；若先下载到端点再上传外部服务，则收集与 T1567 可并存。T1048 在协议或接收路径区别于 C2 时可伴随标注，但 Web 服务身份必须是本技术的核心。受害 Web 根拉取、企业外其他网络介质和物理介质分别留给原生缺口、T1011 和 T1052。
        en: >-
          If source data already resides in cloud or SaaS and sharing, synchronization, copying, export, or backup moves it into another account or tenant without endpoint re-upload, T1537 is the direct object. Download to an endpoint followed by upload to an outside service can receive both collection and T1567 tags. T1048 may accompany a protocol or receiver path distinct from C2, but web-service identity must remain central here. Victim-web-root retrieval, another network medium, and physical media remain with the native gap, T1011, and T1052 respectively.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            勒索与间谍活动常在归档或暂存后把大量文件交给云盘或文件共享服务。DFIR Report 观察到 Bazar/Conti 入侵者通过 Rclone 将共享目录送入 MEGA。开发与 CI/CD 环境中，Shai-Hulud 从本机和环境变量收集秘密，创建公开 GitHub 仓库并写入 data.json；网络看到的是 GitHub API 访问，服务审计则保留仓库创建、可见性与对象活动。
          en: >-
            Ransomware and espionage operations commonly send archived or staged files to cloud drives or file-sharing services. The DFIR Report observed Bazar or Conti intruders using Rclone to send a network share into MEGA. In development and CI/CD environments, Shai-Hulud harvested local and environment secrets, created public GitHub repositories, and wrote data.json. The network sees GitHub API access while service audit preserves repository creation, visibility, and object activity.
        - zh: >-
            信息窃取程序也可把较小归档直接交给共享通信服务。InvisibleFerret 在自建 HTTP/TCP C2 之外，使用 Telegram API 和 bot token 把浏览器扩展、密码管理器与钱包数据归档上传到聊天。服务端工作流场景则由攻击者在受害 SaaS 配置 Webhook 或集成，让新邮件、文件或聊天事件由服务持续推送给外部端点；这种转交无需受害端点为每个对象建立连接。
          en: >-
            Information stealers can send smaller archives directly into a shared communication service. Separate from its self-hosted HTTP or TCP C2, InvisibleFerret used the Telegram API and a bot token to upload archives containing browser-extension, password-manager, and wallet data into a chat. In a service-workflow scenario, the adversary configures a webhook or integration in victim SaaS so new mail, file, or chat events are continually pushed by the service to an outside endpoint, without the victim endpoint creating a connection for each object.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者必须能读取拟外传数据，并获得外部服务的接收命名空间、API/客户端能力及令牌、bot token、仓库权限或 Webhook URL。对象会合需要创建或写入服务对象并在以后访问；工作流转交需要在受害租户创建/修改集成、选择事件范围并控制回调端点。服务配额、上传限制、恶意内容扫描、账号冻结、API 速率和审计保留会提高成本或中断行动。
            en: >-
              The attacker must read the target data and obtain a receiving namespace, API or client capability, and token, bot token, repository permission, or webhook URL for the outside service. Object rendezvous requires creating or writing a service object and accessing it later. Workflow relay requires creating or modifying an integration in the victim tenant, selecting event scope, and controlling the callback endpoint. Service quotas, upload limits, malicious-content scanning, account suspension, API rate limits, and audit retention raise cost or interrupt the operation.
      defender_model:
        paragraphs:
          - zh: >-
              防守方可能拥有端点文件/进程事件、代理或 CASB 事务、服务提供方审计、应用与 OAuth 同意日志、对象生命周期和批准接收者/集成清单。有效观察需把设备、进程、用户、应用、令牌、租户、接收账号/聊天/仓库、对象和请求 ID 连起来；只见域名或 IP 时无法完成租户级归因。个人账号、外部租户、TLS、服务端内部转交、短审计保留和缺少源文件读取会形成盲区。
            en: >-
              Defenders may have endpoint file and process events, proxy or CASB transactions, provider audit, application and OAuth-consent logs, object lifecycle, and approved receiver and integration inventories. Effective observation joins device, process, user, application, token, tenant, receiving account or chat or repository, object, and request IDs. Domain or IP alone cannot establish tenant-level attribution. Personal accounts, outside tenants, TLS, provider-internal relay, short audit retention, and missing source-file reads create blind spots.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 借用已获准 Web 服务的域名证书和正常业务流量外观
        en: Borrow an allowed web service domain certificate and normal business-traffic appearance
      analysis:
        paragraphs:
          - zh: >-
              攻击者把失窃数据提交给组织已经访问的合法服务，外层连接继承提供方信誉、证书、标准 API 和普通协作/存储流量形态。域名或 IP 规则只能识别 GitHub、Telegram、MEGA 等提供方，不能区分攻击者的账号、聊天、仓库或对象。ESET 明确指出 OilRig 选择常见 Office 365 API 可更容易混入常规网络流，InvisibleFerret 与 Shai-Hulud 又证明相同服务抽象可承载真实外传；端点进程、接收命名空间和服务审计仍可揭示异常。
            en: >-
              The adversary submits stolen data to a legitimate service already used by the organization, inheriting provider reputation, certificate, standard APIs, and ordinary collaboration or storage traffic shape. Domain and IP rules identify only providers such as GitHub, Telegram, or MEGA and cannot distinguish an attacker account, chat, repository, or object. ESET explicitly states that OilRig selected common Office 365 APIs to blend more readily into regular network traffic, while InvisibleFerret and Shai-Hulud establish that the same service abstraction carries real exfiltration. Endpoint process, receiver namespace, and service audit remain anomalous evidence.
      evidence_keys: [B10-3-T1567-REF-ESET-INVISIBLE, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-ESET-OILRIG-BOUNDARY]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 把接收者对象和转交结果移入提供方控制面而缩减端点网络可见性
        en: Move receiver objects and relay outcomes into provider control planes reducing endpoint-network visibility
      analysis:
        paragraphs:
          - zh: >-
              服务保存对象或执行 Webhook 后，受害端网络只记录到提供方的一段 HTTPS；攻击者读取和 SaaS 到外部端点的第二段发生在提供方侧，端点没有完整接收者或结果。若组织未接入服务审计或外部租户日志，关键行为不进入常规观测。Wiz 的 GitHub 仓库/工作流事件和 Push Security 对 SaaS Webhook 的分析支持这条观察域转移；对象、集成和请求审计仍可恢复。
            en: >-
              After a service stores an object or runs a webhook, the victim network records only one HTTPS leg to the provider. Adversary retrieval and the second leg from SaaS to an outside endpoint occur provider-side, leaving the endpoint without the complete receiver or result. When service audit or outside-tenant logs are not connected, critical behavior remains outside routine observation. Wiz's GitHub repository and workflow events and Push Security's SaaS-webhook analysis support this shift in observation domain, while object, integration, and request audit can recover it.
      evidence_keys: [B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-GITHUB-AUDIT]
      confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议建立三个 Niji 原生子项。共享服务接收者归因遮蔽改变网络可见的提供方身份与真实接收账号/聊天/仓库/端点之间的关系；服务对象会合式外传把上传与攻击者读取分成持久对象的两段生命周期；服务工作流转交外传让 SaaS 集成或 Webhook 成为发送主体。三者可组合，但分别要求接收者命名空间解析、对象生命周期审计和工作流配置—交付关联。
          en: >-
            Three Niji-native children are proposed. Shared-Service Receiver Attribution Obscuration changes the relationship between the provider identity visible on the network and the real receiving account, chat, repository, or endpoint. Service-Object Rendezvous Exfiltration splits upload and adversary retrieval into two legs of a persistent object's lifecycle. Service-Workflow Delegated Exfiltration makes a SaaS integration or webhook the sending principal. They can co-occur but respectively require receiver-namespace resolution, object-lifecycle audit, and workflow-configuration-to-delivery correlation.
        - zh: >-
            代码仓库、云存储、文本存储、即时通信和 Webhook 产品类型不得成为兄弟项。同一代码仓库既可遮蔽接收者，也可保存对象或执行工作流；云盘、聊天和文本服务也可能落入同一变量。手工 POST 到 Webhook 仅属于父级或共享接收者子项，只有服务端触发/转交才进入工作流子项。T1537 的同服务账户所有权转移不纳入本 taxonomy。
          en: >-
            Code repository, cloud storage, text storage, messaging, and webhook product types do not define siblings. One code repository can obscure a receiver, retain an object, or execute a workflow, while drives, chats, and text services can express the same variables. A manual POST to a webhook remains parent-core or Shared-Service Receiver Attribution Obscuration; only server-side triggering or relay enters the workflow child. T1537 same-service account-ownership transfer is outside this taxonomy.
proposed_subtechniques:
  - temporary_key: B10-3-T1567-CHILD-RECEIVER
    name:
      zh: 共享服务接收者归因遮蔽
      en: Shared-Service Receiver Attribution Obscuration
    confidence: high
    summary:
      zh: 攻击者把接收账号、聊天、仓库或 Webhook 置于多租户服务后，使网络只显示可信提供方身份而不显示真实接收者。
      en: An adversary places a receiving account, chat, repository, or webhook behind a multi-tenant service so the network shows a trusted provider identity rather than the real receiver.
    definition_and_concept:
      paragraphs:
        - zh: >-
            共享服务接收者归因遮蔽是经 Web 服务渗出的一种实现：攻击者选择由多租户合法服务托管的接收命名空间，并使用账号、bot token、仓库、频道、对象路径或 Webhook ID 把数据送到攻击者可访问的位置。稳定变量是“网络提供方身份与服务内接收者身份分离”，而不是 Telegram、GitHub、MEGA 或其他产品名称。
          en: >-
            Shared-Service Receiver Attribution Obscuration is an implementation of Exfiltration Over Web Service in which the adversary selects a receiving namespace hosted by a legitimate multi-tenant service and uses an account, bot token, repository, channel, object path, or webhook ID to deliver data to a location the adversary can access. The stable variable is separation between network-visible provider identity and service-internal receiver identity, not Telegram, GitHub, MEGA, or another product name.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            共享服务接收者归因遮蔽使 DNS、TLS 和防火墙记录只呈现常见服务域、共享地址和有效证书；同一外层身份服务大量合法租户。若代理未记录 API 路径/账号，或组织无权访问攻击者租户审计，防守方难以从连接判断数据送给谁。bot token、chat/repo/object ID、应用身份、上传者进程、请求体积和服务审计仍是残余，允许清单细化到命名空间会显著降低效果。
          en: >-
            Shared-Service Receiver Attribution Obscuration leaves DNS, TLS, and firewall records showing only a common service domain, shared address, and valid certificate serving many legitimate tenants. If a proxy lacks API path or account detail, or the organization cannot access an attacker tenant's audit, a connection does not reveal who received the data. Bot token, chat, repository or object ID, application identity, uploader process, request size, and service audit remain residuals, and namespace-level allowlisting sharply reduces the effect.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求合法共享服务、可区分但未批准的服务内接收命名空间、实际数据上传和接收者归因差异。只有连接到知名 SaaS、官方客户端或有效 OAuth token 不足；批准的团队聊天、开发仓库、备份账号和支持门户是正常反例。若同一服务关系同时承担 C2 与回传，归 T1041；若源数据已在同一服务并转移到账户/租户，归 T1537。
          en: >-
            Inclusion requires a legitimate shared service, a distinguishable but unapproved service-internal receiver namespace, actual data upload, and a receiver-attribution difference. Connection to well-known SaaS, an official client, or a valid OAuth token alone is insufficient. Approved team chat, development repositories, backup accounts, and support portals are normal counterexamples. The same service relationship carrying C2 and return belongs to T1041, while data already in the service moved into another account or tenant belongs to T1537.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              InvisibleFerret 的主要 HTTP/TCP C2 位于自建基础设施；更新的 ssh_zcp 命令另外收集浏览器扩展、密码管理器和钱包数据，形成归档后以 Telegram API 和 bot token 上传到聊天，同时还送往 FTP。该事件直接证明多租户服务接收命名空间与既有 C2 分离，网络提供方身份不能表示真实聊天接收者。
            en: >-
              InvisibleFerret's primary HTTP and TCP C2 used dedicated infrastructure. Its updated ssh_zcp command separately gathered browser-extension, password-manager, and wallet data, archived it, and uploaded it to a Telegram chat through the Telegram API and bot token, as well as to FTP. The incident directly establishes a multi-tenant service receiver namespace separate from existing C2, while the network provider identity does not identify the receiving chat.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要创建、窃取或取得一个服务账号、bot、频道、仓库、远端或 Webhook，并获得可从受害环境使用的凭据或 URL。其必须处理 API 限额、文件大小、服务内容扫描和账号冻结；令牌泄露、公开对象和平台滥用检测可能暴露接收者。共享服务降低基础设施建设成本，但使行动受提供方控制。
              en: >-
                The attacker needs to create, steal, or obtain a service account, bot, channel, repository, remote, or webhook and credentials or a URL usable from the victim environment. API quotas, file-size limits, provider content scanning, and account suspension constrain the operation. Token exposure, public objects, and provider abuse detection can reveal the receiver. Shared service lowers infrastructure cost while placing the operation under provider control.
        defender_model:
          paragraphs:
            - zh: >-
                防守方能看到端点进程与文件、代理/CASB 请求以及自身租户的服务审计，并维护批准服务接收者清单。若 API URI 和授权首部被 TLS 遮蔽、bot token 不记录、个人账号位于外部租户或服务不返回接收对象 ID，只能在域名层判断。调查需把 provider 与 receiver 分开保存，避免把整个服务全局放行或全局封禁。
              en: >-
                The defender can see endpoint process and file events, proxy or CASB requests, and service audit for owned tenants and maintains an approved receiver registry. If TLS hides API URI and authorization, bot tokens are not recorded, personal accounts reside outside the tenant, or the service does not return receiver object IDs, analysis remains at domain level. Investigation must store provider and receiver separately rather than globally allowing or blocking the whole service.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 让恶意接收者继承多租户服务的可信网络身份和业务外观
          en: Give a malicious receiver the trusted network identity and business appearance of a multi-tenant service
        analysis:
          paragraphs:
            - zh: >-
                攻击者通过服务内命名空间接收数据，外层流量与合法用户共享域名、证书、地址和 API。网络规则看见提供方而非 bot/chat/repo/account，恶意接收者与正常业务难以仅凭目的信誉区分。InvisibleFerret 的独立自建 C2 与 Telegram bot-token 上传建立了这种身份借用；服务命名空间、端点源数据和令牌仍能推翻伪装。
              en: >-
                The adversary receives data through a service-internal namespace whose outer traffic shares domain, certificate, address, and API with legitimate users. Network rules see the provider rather than the bot, chat, repository, or account and cannot distinguish the malicious receiver from business use using destination reputation alone. InvisibleFerret's dedicated C2 and separate Telegram bot-token upload establish this borrowed identity, while service namespace, endpoint source data, and token evidence can disprove the disguise.
        evidence_keys: [B10-3-T1567-REF-ESET-INVISIBLE, REF-000923]
        confidence: high
    evidence_keys: [B10-3-T1567-CLM-RECEIVER, B10-3-T1567-CASE-INVISIBLE, B10-3-T1567-REF-ESET-INVISIBLE, REF-000923, REF-000924, REF-000604]
    limitations:
      paragraphs:
        - zh: >-
            InvisibleFerret 来源给出 bot token、Telegram chat、归档与独立 C2，足以证明行为和归因分层，但没有公开服务端 chat ID、完整请求日志或告警对照。共享域名产生的匿迹效果依赖组织是否具备 CASB、TLS 检查或服务审计；如果代理已解析接收命名空间，置信度应下降。正式规则不能把所有 Telegram/GitHub/云盘访问视为恶意。
          en: >-
            InvisibleFerret reporting gives a bot token, Telegram chat, archive, and distinct C2, sufficient to establish behavior and attribution layers but not the server-side chat ID, complete request logs, or alert comparison. The stealth effect of a shared domain depends on CASB, TLS inspection, and service audit. Confidence should fall when a proxy already resolves the receiver namespace. Production rules cannot treat every Telegram, GitHub, or drive access as malicious.
  - temporary_key: B10-3-T1567-CHILD-OBJECT
    name:
      zh: 服务对象会合式外传
      en: Service-Object Rendezvous Exfiltration
    confidence: high
    summary:
      zh: 攻击者把失窃数据保存为持久 Web 服务对象，使受害端上传与攻击者读取在身份和时间上分离。
      en: An adversary stores stolen data as a persistent web-service object, separating victim-side upload from adversary retrieval in identity and time.
    definition_and_concept:
      paragraphs:
        - zh: >-
            服务对象会合式外传是经 Web 服务渗出的一种实现：攻击者把数据写成仓库文件、云对象、粘贴文本、聊天附件或等价持久对象，服务返回稳定 object/repo/message ID，攻击者随后从另一身份、位置或时间读取。分类变量是服务对象作为上传者与接收者之间的会合点，而不是对象所在的代码、存储或文本产品类别。
          en: >-
            Service-Object Rendezvous Exfiltration is an implementation of Exfiltration Over Web Service in which the adversary writes data as a repository file, cloud object, pasted text, chat attachment, or equivalent persistent object. The service returns a stable object, repository, or message ID that the adversary later reads from another identity, location, or time. The classification variable is the service object as rendezvous between uploader and receiver, not whether the object resides in a code, storage, or text product.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            服务对象会合式外传把端点上传和攻击者取回拆为两条服务事务。受害网络只看到向可信服务写入，读取发生在外部租户或匿名访问；短窗连接关联和直接 attacker-IP 归因失效。对象创建、写入、可见性、共享、读取、下载、删除、actor/app/token、hash/size 和端点源文件仍可连接。公开对象更可见但便于匿名取回，私有对象需要凭据却可能保留更强身份审计。
          en: >-
            Service-Object Rendezvous Exfiltration divides endpoint upload and adversary retrieval into two service transactions. The victim network sees only a write to a trusted service, while reading occurs in an outside tenant or anonymously, defeating short-window connection joins and direct attacker-IP attribution. Object creation, write, visibility, share, read, download, delete, actor or app or token, hash or size, and endpoint source file remain joinable. Public objects are more visible but enable anonymous retrieval; private objects require credentials but may retain stronger identity audit.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求端点/攻击者把已收集数据创建或写入持久服务对象，并存在攻击者可取回性或实际读取证据。普通开发提交、用户云同步、备份、公开文档发布和支持附件是正常反例；只有对象存在而无敏感来源或外传意图不足。把服务内既有私有仓库迁移到攻击者账户属于 T1537；Shai-Hulud 从本机秘密生成新的 data.json 并上传公开仓库属于本子项。
          en: >-
            Inclusion requires creation or writing of a persistent service object from acquired data plus adversary retrievability or actual read evidence. Ordinary development commits, user cloud sync, backup, public document publication, and support attachments are normal counterexamples. Object existence without sensitive source or exfiltration intent is insufficient. Migrating an existing private service repository into an attacker account belongs to T1537; Shai-Hulud generating a new data.json from local secrets and uploading it to a public repository belongs here.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              Shai-Hulud 恶意 npm 包执行后用 TruffleHog 和环境变量收集秘密，创建名为 Shai-Hulud 的公开 GitHub 仓库并写入双重 Base64 的 data.json。Wiz 观察到 36 个用户的秘密被暴露，并指出 CreateEvent、PublicEvent、仓库/可见性和审计日志可用于调查。这直接证明本机源数据—服务对象—外部可取回链。
            en: >-
              After malicious Shai-Hulud npm packages executed, they used TruffleHog and environment variables to harvest secrets, created public GitHub repositories named Shai-Hulud, and wrote double-Base64 data.json objects. Wiz observed secrets exposed for 36 users and identified CreateEvent, PublicEvent, repository and visibility, and audit logs as investigation evidence. This directly establishes a local-source-to-service-object-to-outside-retrieval chain.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要对服务对象具有 create/write 权限，并能选择公开、共享或私有可读状态以及以后读取的身份。公开对象无需长期凭据但更易被发现和索引；私有对象依赖令牌、共享链接或外部账号。对象大小、秘密扫描、恶意内容检测、保留策略和 API 配额会限制操作，删除对象也不保证审计或缓存消失。
              en: >-
                The attacker needs create or write permission for a service object and can choose public, shared, or privately readable state plus an identity for later access. Public objects need no persistent credential but are easier to discover and index; private objects depend on a token, sharing link, or outside account. Object size, secret scanning, malicious-content detection, retention, and API quotas constrain the operation, and deletion does not guarantee removal from audit or caches.
        defender_model:
          paragraphs:
            - zh: >-
                防守方能导出组织拥有服务的 object/repo/message 审计，包含 action、actor、app/token、tenant/org、object/repository、visibility、request ID 和时间，并与端点文件 hash/size/标签及进程连接。个人外部账号、匿名读取、对象内容转换和供应商短保留会阻断端到端谱系；只在网络层看到 HTTPS 不能判断对象生命周期。
              en: >-
                The defender can export object, repository, or message audit from organization-owned services with action, actor, application or token, tenant or organization, object or repository, visibility, request ID, and time and join it to endpoint file hash, size, label, process, and connection. Personal outside accounts, anonymous reads, object transformation, and short provider retention break end-to-end lineage. HTTPS at the network layer alone cannot establish object lifecycle.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary:
          zh: 以持久服务对象分离受害上传与攻击者读取的时间和主体
          en: Use a persistent service object to separate victim upload and adversary retrieval across time and principal
        analysis:
          paragraphs:
            - zh: >-
                攻击者把数据写入服务对象后结束受害端会话，后续从其他身份或匿名位置取回。原本直接的 victim-to-receiver 流被拆为 upload-to-object 与 read-from-object，局部日志难以关联完整交付。Shai-Hulud 的公开 data.json 仓库和观察到的暴露用户直接支持这种两段链；对象 ID、可见性变化与内容 hash 仍可跨段恢复。
              en: >-
                After writing data into a service object, the adversary ends the victim-side session and later retrieves it under another identity or anonymously. A direct victim-to-receiver flow becomes upload-to-object and read-from-object, making the complete delivery difficult to correlate in local logs. Shai-Hulud's public data.json repositories and observed exposed users directly support this two-leg chain, while object ID, visibility change, and content hash can reconnect the legs.
        evidence_keys: [B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-GITHUB-AUDIT]
        confidence: high
      - mechanism_ref: NM-BT
        role: secondary
        summary:
          zh: 让攻击者读取发生在服务控制面而不产生受害端后继连接
          en: Move adversary retrieval into the service control plane without a successor victim-endpoint connection
        analysis:
          paragraphs:
            - zh: >-
                服务承担保存和提供对象，攻击者读取由提供方基础设施处理，受害端 EDR 和网络传感器没有第二段连接。缺少服务审计时，取回行为完全落在组织常规端点观察之外；GitHub 审计和仓库事件证明服务侧仍存在 actor、repo、visibility、request 和 token 痕迹。
              en: >-
                The service stores and serves the object, so provider infrastructure handles adversary retrieval and victim EDR and network sensors see no second-leg connection. Without service audit, retrieval remains outside ordinary organizational endpoint observation. GitHub audit and repository events show that actor, repository, visibility, request, and token traces still exist provider-side.
        evidence_keys: [B10-3-T1567-REF-GITHUB-AUDIT, B10-3-T1567-REF-WIZ-SHAI]
        confidence: high
    evidence_keys: [B10-3-T1567-CLM-OBJECT, B10-3-T1567-CASE-SHAI-OBJECT, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-GITHUB-AUDIT, REF-000924]
    limitations:
      paragraphs:
        - zh: >-
            Shai-Hulud 事件对公开仓库、data.json、双重 Base64、暴露用户、CreateEvent/PublicEvent 与审计建议均有直接资料，证据强。该事件同时迁移私有仓库到攻击者个人账号；那一部分改变同服务所有权，应留给 T1537，不能用于扩大本子项。其他服务的对象字段和匿名访问日志差异很大，正式 NJA 必须做产品映射而不是假设 GitHub 字段普遍存在。
          en: >-
            Shai-Hulud directly documents public repositories, data.json, double Base64, exposed users, CreateEvent and PublicEvent, and audit guidance, providing strong evidence. The campaign also migrated private repositories into attacker personal accounts; that portion changes ownership inside the same service and belongs to T1537 rather than expanding this child. Object fields and anonymous-read logs vary widely across providers, so a canonical NJA must map products rather than assume GitHub fields universally exist.
  - temporary_key: B10-3-T1567-CHILD-WORKFLOW
    name:
      zh: 服务工作流转交外传
      en: Service-Workflow Delegated Exfiltration
    confidence: medium
    summary:
      zh: 攻击者配置 Webhook 或集成，使受害租户的 SaaS 在事件发生时代表攻击者把数据推送到外部端点。
      en: An adversary configures a webhook or integration so victim-tenant SaaS pushes data to an outside endpoint on the adversary's behalf when events occur.
    definition_and_concept:
      paragraphs:
        - zh: >-
            服务工作流转交外传是经 Web 服务渗出的一种实现：攻击者在受害 SaaS、仓库、邮件、聊天或自动化平台中创建/修改 Webhook、订阅或集成，选择数据事件和回调端点，之后由服务进程持续发送。稳定变量是“服务端工作流成为外传主体”，不是 Webhook 产品名，也不是端点脚本手工 POST 到一个 Webhook URL。
          en: >-
            Service-Workflow Delegated Exfiltration is an implementation of Exfiltration Over Web Service in which the adversary creates or modifies a webhook, subscription, or integration in victim SaaS, a repository, mail, chat, or automation platform, selects data events and a callback endpoint, and then lets the service process send continuously. The stable variable is the server-side workflow becoming the exfiltration principal, not a webhook product name or an endpoint script manually posting to a webhook URL.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            服务工作流转交外传使新邮件、文件、聊天或仓库事件从 SaaS 提供方直接到攻击者端点；受害端 EDR、代理和设备网络日志没有对应上传进程。服务端请求继承集成/应用身份及提供方地址，可能被视为正常自动化。残余痕迹包括 webhook/integration create/update/enable、actor/service principal、授权 scopes、触发器、source scope、callback 域、secret/token、delivery request ID、状态和字节。
          en: >-
            Service-Workflow Delegated Exfiltration sends new mail, files, chat, or repository events directly from the SaaS provider to an attacker endpoint. Victim EDR, proxy, and device-network logs contain no corresponding uploader process. The service-side request inherits integration or application identity and provider addresses and may look like ordinary automation. Residual traces include webhook or integration create, update, and enable; actor or service principal; authorization scopes; trigger; source scope; callback domain; secret or token; delivery request ID; status; and bytes.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求受害租户中存在攻击者控制的服务工作流配置、敏感事件/对象范围及向外部接收端的实际或可验证交付。只有 Webhook URL、一次端点 POST、合法 CI/CD 通知或无后继请求的配置不足。自动重复可同时标注 T1020，但本子项由服务主体和控制面痕迹定义；同服务内复制到账户/租户归 T1537；同一 Web 服务关系作为 C2 控制回路归 T1041。
          en: >-
            Inclusion requires attacker-controlled service-workflow configuration in a victim tenant, sensitive event or object scope, and actual or verifiable delivery to an outside receiver. A webhook URL, one endpoint POST, legitimate CI/CD notification, or configuration without a successor request is insufficient. Automated repetition may also map to T1020, but this child is defined by the service principal and control-plane traces. Same-service copying into another account or tenant belongs to T1537, and the same web-service relationship functioning as a C2 control loop belongs to T1041.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              Push Security 记录 SaaS 可在新邮件、文件或聊天事件发生时执行 Webhook 回调，攻击者可用其持续提取新数据；请求由 SaaS 向攻击者应用发出，而不是请求进入 SaaS，因此面向入站用户操作的检测可能不记录完整链。Shai-Hulud 又把恶意 GitHub Actions 工作流提交到仓库并使其将仓库秘密发送到 webhook.site，真实事件支持工作流—外部端点链，但服务因免费配额停用了端点，交付结果并非始终成功。
            en: >-
              Push Security documents SaaS webhook callbacks on new mail, file, or chat events and explains how an adversary can use them for continual extraction. Requests leave SaaS for the adversary application rather than entering SaaS, so detection centered on inbound user actions may miss the complete chain. Shai-Hulud also committed a malicious GitHub Actions workflow that sent repository secrets to webhook.site, supporting a real workflow-to-outside-endpoint chain. The service later disabled the endpoint due to free-tier limits, so delivery was not always successful.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要足以创建/修改集成的租户权限、可接收回调的端点、所需 OAuth scopes 或 webhook secret，并能选择包含敏感数据的触发事件。工作流可以长期运行但依赖服务配额、目标可达性、集成健康检查和管理员变更。过宽 scope、外部 callback 和新 service principal 会增加暴露。
              en: >-
                The attacker needs tenant permission to create or modify an integration, an endpoint able to receive callbacks, necessary OAuth scopes or webhook secret, and trigger events containing sensitive data. A workflow can run for a long time but depends on service quota, receiver reachability, integration health checks, and administrator changes. Broad scope, external callbacks, and a new service principal increase exposure.
        defender_model:
          paragraphs:
            - zh: >-
                防守方能导出 SaaS/身份控制面的 integration、connector、webhook、app consent 与 delivery 事件，并维护批准 callback、scope、owner 和到期时间。若服务不审计 Webhook 配置、只记录创建不记录投递、外部应用隐藏最终接收或攻击者滥用既有批准集成，覆盖降低。检测需要长期保存配置版本，而非只看当前状态。
              en: >-
                The defender can export integration, connector, webhook, application-consent, and delivery events from SaaS and identity control planes and maintains approved callback, scope, owner, and expiry. Coverage falls when a service does not audit webhook configuration, records creation but not delivery, hides the final receiver behind an outside application, or when the adversary abuses an existing approved integration. Detection needs configuration-version history rather than current state alone.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 由 SaaS 工作流在端点网络观察之外持续发送敏感事件
          en: Have a SaaS workflow continuously send sensitive events outside endpoint network observation
        analysis:
          paragraphs:
            - zh: >-
                攻击者把外传条件固化在服务端，触发后由 SaaS 代表租户向外部应用发送。端点没有读取—连接链，网络传感器只在提供方侧看到第二段；关键痕迹移动到 Webhook/集成控制面。Push Security 直接说明这种请求方向会避开只记录进入 SaaS 请求的检测，Shai-Hulud 提供恶意 GitHub Actions 到 webhook.site 的实例；配置与 delivery 审计仍可恢复。
              en: >-
                The adversary persists exfiltration conditions in the service, which sends from SaaS to an outside application on the tenant's behalf after a trigger. The endpoint has no read-to-connection chain, and the second leg is visible only provider-side; critical traces move into webhook and integration control planes. Push Security directly explains how this request direction evades detection limited to requests entering SaaS, while Shai-Hulud provides a malicious GitHub Actions to webhook.site example. Configuration and delivery audit remain recoverable.
        evidence_keys: [B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-M365-AUDIT]
        confidence: medium
      - mechanism_ref: NM-FD
        role: secondary
        summary:
          zh: 让恶意转交继承已批准集成和自动化任务的服务身份
          en: Make malicious relay inherit the service identity of an approved integration and automation job
        analysis:
          paragraphs:
            - zh: >-
                Webhook 或集成以服务账号、应用或工作流身份发送，外观与 CI/CD、通知、Zapier、SIEM 和工单自动化相同；只验证提供方地址或已批准应用名称难以区分恶意 scope 和 callback。actor、owner tenant、权限、目标 URL、配置时间与事件范围仍能揭示差异。现有证据支持服务身份借用，但没有量化生产误报或漏报。
              en: >-
                A webhook or integration sends as a service account, application, or workflow and resembles CI/CD, notifications, Zapier, SIEM, or ticket automation. Provider address or an approved application name alone cannot distinguish malicious scope and callback. Actor, owner tenant, permissions, target URL, configuration time, and event scope remain differentiators. Available evidence supports borrowed service identity but does not quantify production false negatives or positives.
        evidence_keys: [B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-M365-AUDIT]
        confidence: medium
    evidence_keys: [B10-3-T1567-CLM-WORKFLOW, B10-3-T1567-CASE-SHAI-WORKFLOW, B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-M365-AUDIT]
    limitations:
      paragraphs:
        - zh: >-
            Push Security 为行为、请求方向与观察差异提供明确研究结论，但不是逐事件入侵报告。Shai-Hulud 证明恶意工作流向 webhook.site 发送秘密，Wiz 同时说明免费配额导致端点被停用、部分 Webhook 外传失效；因此工作流存在和尝试为 high，稳定交付和实测匿迹效果保持 medium。不同 SaaS 对 Webhook scope、投递日志和回调身份的字段差异需要产品级映射。
          en: >-
            Push Security provides explicit research conclusions about behavior, request direction, and observation difference but is not a per-event incident report. Shai-Hulud establishes a malicious workflow sending secrets to webhook.site, while Wiz also reports that free-tier limits disabled the endpoint and made some webhook exfiltration nonfunctional. Workflow presence and attempt are high-confidence; reliable delivery and measured stealth effect remain medium. SaaS products require product-level mapping for webhook scope, delivery logs, and callback identity.
defense_candidates:
  detection_strategies:
    - temporary_key: B10-3-T1567-DET-RECEIVER
      name:
        zh: 端点源数据—服务接收者—对象生命周期关联
        en: Endpoint Source Data to Service Receiver and Object Lifecycle Correlation
      summary:
        zh: 将端点敏感读取和上传与服务内接收命名空间及对象生命周期连接，识别可信域后的真实外传接收者。
        en: Join endpoint sensitive reads and uploads to service-internal receiver namespaces and object lifecycles to identify the real exfiltration receiver behind a trusted domain.
      description:
        zh: >-
          本策略用两项分析分工。接收者分析把 provider 与 tenant/account/chat/repo/webhook 分开，要求未批准命名空间与端点敏感源数据同时成立；对象分析跟踪 create/write/visibility/share/read/download/delete，将上传和攻击者读取恢复为同一对象链。服务域、TLS、官方客户端或单次对象事件均不能独立确认外传。
        en: >-
          Two analytics divide the work. Receiver analysis separates provider from tenant, account, chat, repository, and webhook and requires both an unapproved namespace and sensitive endpoint source data. Object analysis follows create, write, visibility, share, read, download, and delete to reconstruct uploader and adversary retrieval as one object chain. Service domain, TLS, an official client, or one object event does not independently confirm exfiltration.
      detects_keys: [B10-3-T1567-PARENT, B10-3-T1567-CHILD-RECEIVER, B10-3-T1567-CHILD-OBJECT]
      domains: [enterprise]
      analytic_keys: [B10-3-T1567-NJA-RECEIVER, B10-3-T1567-NJA-OBJECT]
      evidence_keys: [B10-3-T1567-REF-ESET-INVISIBLE, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-GITHUB-AUDIT, REF-000924, REF-000604, REF-000632]
    - temporary_key: B10-3-T1567-DET-WORKFLOW
      name:
        zh: SaaS 工作流配置—敏感触发—外部交付谱系
        en: SaaS Workflow Configuration to Sensitive Trigger and External Delivery Lineage
      summary:
        zh: 连接 Webhook/集成的版本化配置、敏感事件范围与服务端外部交付，确认由 SaaS 代理的外传。
        en: Join versioned webhook or integration configuration, sensitive event scope, and service-side external delivery to confirm SaaS-mediated exfiltration.
      description:
        zh: >-
          本策略要求配置、授权和结果三层证据。分析先判断谁创建或修改工作流、获得哪些 scopes、指向何处，再核对敏感事件或对象触发及 SaaS 到外部端点的 request/delivery。只有配置而无交付保持 exposure，只有外部请求而无租户配置保持 receiver-side candidate；两者与敏感 scope 同时成立才确认。
        en: >-
          This strategy requires configuration, authorization, and outcome evidence. The analytic first determines who created or modified the workflow, which scopes it obtained, and where it points, then checks a sensitive event or object trigger and the SaaS-to-outside request or delivery. Configuration without delivery remains exposure, and an outside request without tenant configuration remains a receiver-side candidate. Confirmation requires both plus sensitive scope.
      detects_keys: [B10-3-T1567-PARENT, B10-3-T1567-CHILD-WORKFLOW]
      domains: [enterprise]
      analytic_keys: [B10-3-T1567-NJA-WORKFLOW]
      evidence_keys: [B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-M365-AUDIT]
  detection_analytics:
    - temporary_key: B10-3-T1567-NJA-RECEIVER
      strategy_key: B10-3-T1567-DET-RECEIVER
      name:
        zh: 共享 Web 服务接收命名空间与端点源数据关联
        en: Shared Web-Service Receiver Namespace and Endpoint Source-Data Correlation
      summary:
        zh: 解析可信服务域后的账号、聊天、仓库或 Webhook，并与上传进程和敏感源文件连接。
        en: Resolve the account, chat, repository, or webhook behind a trusted service domain and join it to the uploader process and sensitive source file.
      logic:
        zh: >-
          维护 service_provider、receiver_type、tenant/account/chat/repo/webhook_id、approved_principal、approved_process、allowed_data_class、owner、expiry 和 policy_version 的接收者注册表。把 DeviceFileEvents 的敏感读取/创建/归档与 DeviceNetworkEvents、代理/CASB 和服务 API 审计按 device_id、initiating_process_unique_id、user/app、request_id 和时间连接；从 URI、对象路径、审计 target 或 token hash 解析 receiver_namespace。分别输出 provider_only、receiver_resolved、unapproved_receiver 和 source_linked_exfiltration。最后一级要求未批准接收者、敏感源数据和服务写入/消息发送结果，不把整个 SaaS 域视为恶意。
        en: >-
          Maintain a receiver registry containing service_provider, receiver_type, tenant or account or chat or repository or webhook ID, approved_principal, approved_process, allowed_data_class, owner, expiry, and policy_version. Join sensitive read, create, or archive events from DeviceFileEvents to DeviceNetworkEvents, proxy or CASB, and service API audit by device_id, initiating_process_unique_id, user or app, request_id, and time. Resolve receiver_namespace from URI, object path, audit target, or token hash. Emit provider_only, receiver_resolved, unapproved_receiver, and source_linked_exfiltration separately. The last requires an unapproved receiver, sensitive source data, and a successful service write or message-send result and never treats an entire SaaS domain as malicious.
      data_requirements:
        - source_type: endpoint_file
          name: {zh: 端点敏感文件与产物事件, en: Endpoint sensitive-file and artifact events}
          channel: Microsoft DeviceFileEvents, EDR or endpoint DLP
          required_fields: [Timestamp, DeviceId, ActionType, FolderPath, FileName, FileSize, SHA1, SensitivityLabel, InitiatingProcessUniqueId, InitiatingProcessAccountName]
        - source_type: endpoint_process_network
          name: {zh: 端点进程到 Web 服务连接, en: Endpoint process to web-service connection}
          channel: Microsoft DeviceNetworkEvents or equivalent
          required_fields: [Timestamp, DeviceId, RemoteUrl, RemoteIP, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine]
        - source_type: service_transaction
          name: {zh: 代理、CASB 或服务 API 事务, en: Proxy CASB or service API transaction}
          channel: inspectable HTTP proxy, CASB or provider audit
          required_fields: [event_time, provider, tenant_id, actor_or_app_id, action, receiver_type, receiver_id, object_or_message_id, request_id, status, bytes_out]
        - source_type: receiver_registry
          name: {zh: 批准服务接收者清单, en: Approved service receiver registry}
          channel: SaaS governance inventory
          required_fields: [provider, receiver_type, receiver_id, approved_principal, approved_process, allowed_data_class, owner, expiry, policy_version]
      observables:
        - {zh: 敏感读取或归档后同进程向常用 SaaS 的未批准账号、聊天、仓库或 Webhook 成功写入, en: The same process successfully writes to an unapproved account chat repository or webhook in a common SaaS after sensitive reads or archiving}
        - {zh: 网络目的显示可信提供方，但服务审计或 API 路径解析到陌生接收命名空间, en: Network destination shows a trusted provider while service audit or API path resolves to an unfamiliar receiver namespace}
      correlation:
        window: {zh: 敏感读取前十五分钟至上传后二十四小时, en: Fifteen minutes before sensitive read through twenty-four hours after upload}
        dimensions: [device_id, process_start_key, user_or_app_id, provider, tenant_id, receiver_id, object_or_message_id, request_id, source_file_hash, time]
      false_positives:
        - {zh: 批准的开发提交、团队聊天上传、备份同步、支持工单附件、事件响应样本提交和个人业务云盘, en: Approved development commits team-chat uploads backup sync support-ticket attachments incident-response sample submission and sanctioned personal business drives}
      blind_spots:
        - {zh: 外部个人租户不提供审计、TLS 隐藏 API 路径、token 在请求体内不可见、内存生成数据无文件事件或服务不返回接收者 ID, en: External personal tenants without audit TLS-hidden API paths tokens invisible in request bodies memory-generated data without file events or services not returning receiver IDs}
      tuning_guidance:
        zh: >-
          按提供方和业务流程维护 receiver 级正向清单，禁止只对白名单域名放行。对开发、备份和聊天分别建立进程、账号、路径、数据标签和时间基线；新 receiver 与敏感 source 同时存在才升级。令牌不得以明文入日志，可记录稳定 hash 以关联撤销和重复使用。
        en: >-
          Maintain provider-specific receiver-level positive allowlists rather than allowing a domain alone. Build separate process, account, path, data-label, and time baselines for development, backup, and chat. Escalate when a new receiver and sensitive source coexist. Never log tokens in clear text; retain a stable hash for revocation and reuse joins.
      evidence_keys: [B10-3-T1567-REF-ESET-INVISIBLE, REF-000923, REF-000924, REF-000604, REF-000632]
    - temporary_key: B10-3-T1567-NJA-OBJECT
      strategy_key: B10-3-T1567-DET-RECEIVER
      name:
        zh: 服务对象创建—可见性—读取生命周期关联
        en: Service Object Creation Visibility and Read Lifecycle Correlation
      summary:
        zh: 把端点源数据与服务对象的创建、公开/共享、读取和删除连接为两段外传链。
        en: Join endpoint source data to service-object creation, publication or sharing, read, and deletion as a two-leg exfiltration chain.
      logic:
        zh: >-
          规范 service audit 中的 create/upload/write、visibility/share/link、read/download 和 delete 事件，保留 actor、app/token、tenant/org、repo/object/message、visibility、request_id、source_ip、bytes 和时间。以 SHA1/内容指纹、文件名/大小、对象 ID、创建进程和短时顺序把端点 source_set_id 连接到服务对象；再在一小时至三十日内寻找外部身份、匿名访问或不同来源读取。输出 object_written、object_exposed、retrieval_observed 与 rendezvous_exfiltration_confirmed；确认级要求敏感源、未批准对象/可见性和可取回或实际读取。对 CreateEvent 紧接 PublicEvent、公开 data.json、秘密扫描命中等提高置信度，但不硬编码 Shai-Hulud 名称。
        en: >-
          Normalize create, upload, or write; visibility, share, or link; read or download; and delete events from service audit, retaining actor, application or token, tenant or organization, repository or object or message, visibility, request_id, source_ip, bytes, and time. Join endpoint source_set_id to the service object through SHA1 or content fingerprint, filename and size, object ID, creating process, and short sequence. Over one hour to thirty days, seek reads by an outside identity, anonymous access, or another origin. Emit object_written, object_exposed, retrieval_observed, and rendezvous_exfiltration_confirmed. Confirmation requires sensitive source, unapproved object or visibility, and retrievability or actual read. CreateEvent followed by PublicEvent, public data.json, and secret-scanning hits raise confidence without hardcoding Shai-Hulud names.
      data_requirements:
        - source_type: endpoint_file
          name: {zh: 端点源数据与上传产物, en: Endpoint source data and upload artifacts}
          channel: DeviceFileEvents, EDR or DLP
          required_fields: [Timestamp, DeviceId, FolderPath, FileName, FileSize, SHA1, SensitivityLabel, InitiatingProcessUniqueId, InitiatingProcessAccountName]
        - source_type: service_object_audit
          name: {zh: Web 服务对象生命周期审计, en: Web-service object lifecycle audit}
          channel: provider audit API or streamed audit log
          required_fields: [event_time, provider, action, actor, actor_id, app_or_token_id, tenant_or_org_id, object_type, object_id, repository_or_container_id, visibility, request_id, source_ip, bytes]
        - source_type: object_policy_inventory
          name: {zh: 对象可见性与共享政策, en: Object visibility and sharing policy inventory}
          channel: SaaS configuration management
          required_fields: [provider, tenant_or_org_id, object_type, allowed_visibility, allowed_external_sharing, approved_creator, retention, policy_version]
      observables:
        - {zh: 敏感本机数据被写为新服务对象并迅速公开、外部共享或由另一身份读取, en: Sensitive local data is written as a new service object and rapidly made public externally shared or read by another identity}
        - {zh: 对象创建者、应用/token、可见性或容器不符合批准策略，且服务对象与端点 source_set 可连接, en: Object creator application or token visibility or container violates approved policy and the service object joins to an endpoint source set}
      correlation:
        window: {zh: 创建前一小时至后三十日，按服务审计保留和业务对象寿命调优, en: One hour before creation through thirty days after tuned to provider retention and business-object lifetime}
        dimensions: [source_set_id, provider, tenant_or_org_id, object_id, repository_or_container_id, actor_or_app_id, visibility, request_id, reader_identity, time]
      false_positives:
        - {zh: 正常开源发布、公开数据集、客户交付、支持 paste、备份对象、CI 制品、跨团队共享和安全研究样本, en: Normal open-source publication public datasets customer delivery support pastes backup objects CI artifacts cross-team sharing and security-research samples}
      blind_spots:
        - {zh: 外部个人账号、匿名读取不记录身份、对象被压缩或重编码导致 hash 不同、审计仅保留创建无读取、供应商删除历史事件, en: External personal accounts anonymous reads without identity compression or re-encoding breaking hashes audit retaining create but not read and provider deletion of historical events}
      tuning_guidance:
        zh: >-
          按对象类型、组织、创建者和可见性建立正向政策；对公开仓库、粘贴和共享链接要求业务理由及到期。结合敏感标签和秘密扫描，但不把任何公开对象当成外传。将 T1537 的 same-service transfer 另标：若既有云对象直接移动或共享到账户而非端点新建对象，本 NJA 只输出 adjacent_account_transfer。
        en: >-
          Build positive policy by object type, organization, creator, and visibility and require business justification and expiry for public repositories, pastes, and share links. Combine sensitivity labels and secret scanning without treating every public object as exfiltration. Mark T1537 same-service transfer separately: when an existing cloud object moves or is shared into another account rather than a new endpoint upload, emit adjacent_account_transfer only.
      evidence_keys: [B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-GITHUB-AUDIT, B10-3-T1567-REF-GITHUB-POLICY, REF-000924]
    - temporary_key: B10-3-T1567-NJA-WORKFLOW
      strategy_key: B10-3-T1567-DET-WORKFLOW
      name:
        zh: Webhook/集成配置至服务端交付关联
        en: Webhook or Integration Configuration to Service-Side Delivery Correlation
      summary:
        zh: 版本化工作流配置和授权，并将敏感触发事件连接到 SaaS 发出的外部请求结果。
        en: Version workflow configuration and authorization and join sensitive trigger events to outside request results emitted by SaaS.
      logic:
        zh: >-
          记录 webhook/integration/connector/app create、update、enable、disable、consent 与 credential 事件的 actor/user/service_principal、owner_tenant、app_id、scopes、source_object_scope、trigger、callback_url/domain、secret_hash、old/new state、request/correlation ID、approval_id 和时间。与批准集成注册表比较，随后把敏感 mail/file/chat/repo event_id 连接到 provider delivery/callback 的 destination、status、bytes、retry 和 receiver request ID。输出 workflow_exposure、unauthorized_workflow、sensitive_trigger 与 delivery_confirmed；最后一级要求未经批准的配置或 scope、敏感触发和成功外部交付。配置与投递缺一时保留较低状态。
        en: >-
          Record actor or user or service principal, owner tenant, app_id, scopes, source-object scope, trigger, callback URL or domain, secret hash, old and new state, request or correlation ID, approval_id, and time for webhook, integration, connector, or application create, update, enable, disable, consent, and credential events. Compare them with an approved-integration registry, then join sensitive mail, file, chat, or repository event_id to provider delivery or callback destination, status, bytes, retry, and receiver request ID. Emit workflow_exposure, unauthorized_workflow, sensitive_trigger, and delivery_confirmed. The last requires unapproved configuration or scope, a sensitive trigger, and successful outside delivery. Missing configuration or delivery preserves a lower state.
      data_requirements:
        - source_type: saas_configuration_audit
          name: {zh: SaaS Webhook、集成与应用审计, en: SaaS webhook integration and application audit}
          channel: provider audit API, Microsoft 365 Unified Audit Log or equivalent
          required_fields: [event_time, tenant_id, action, actor_id, actor_type, app_or_service_principal_id, owner_tenant_id, scopes, source_object_scope, trigger, callback_url_or_domain, secret_hash, old_state, new_state, request_or_correlation_id]
        - source_type: saas_delivery_audit
          name: {zh: 服务端 Webhook 投递结果, en: Service-side webhook delivery results}
          channel: provider webhook delivery log or receiver log
          required_fields: [event_time, tenant_id, integration_or_webhook_id, trigger_event_id, source_object_id, destination, request_id, status, bytes, retry_count]
        - source_type: integration_registry
          name: {zh: 批准集成与回调清单, en: Approved integration and callback registry}
          channel: SaaS governance inventory
          required_fields: [tenant_id, integration_or_webhook_id, owner, approved_app_id, approved_scopes, approved_source_scope, approved_callback_domain, approval_id, expiry, policy_version]
      observables:
        - {zh: 新建或扩权的 Webhook/集成指向外部未知域并订阅敏感邮件、文件、聊天或仓库事件, en: A new or expanded webhook or integration points to an unknown outside domain and subscribes to sensitive mail file chat or repository events}
        - {zh: SaaS 代表租户向回调端点成功发送敏感事件，受害端无对应网络连接, en: SaaS successfully sends a sensitive event to a callback endpoint on the tenant's behalf without a corresponding victim-endpoint connection}
      correlation:
        window: {zh: 配置前七日至后九十日，并按触发事件到单次投递使用二十四小时子窗口, en: Seven days before configuration through ninety days after with a twenty-four-hour subwindow from trigger to each delivery}
        dimensions: [tenant_id, actor_or_service_principal, integration_or_webhook_id, app_id, source_object_scope, trigger_event_id, callback_domain, request_id, approval_id, time]
      false_positives:
        - {zh: 批准 CI/CD、SIEM、监控通知、CRM/工单集成、备份自动化、Zapier/Power Automate 和开发测试 Webhook, en: Approved CI CD SIEM monitoring notifications CRM or ticket integrations backup automation Zapier or Power Automate and development test webhooks}
      blind_spots:
        - {zh: 提供方不记录 Webhook 配置或投递、攻击者滥用既有批准集成、外部应用继续转发而不可见、callback 经 CDN/代理、secret 无稳定 hash, en: Providers without webhook configuration or delivery audit abuse of an existing approved integration invisible forwarding by an outside app callbacks behind CDN or proxy and secrets without stable hashes}
      tuning_guidance:
        zh: >-
          以 owner、业务用途、精确 source scope、callback 域、应用发布者和到期建立批准基线；对 scope 扩大和 callback 改变视为新审批，不按应用名称全局放行。配置事件立即产生 exposure，只有 provider delivery 或接收端请求确认才升级结果；保留失败与重试，因为它们证明工作流仍在尝试。
        en: >-
          Baseline owner, business purpose, exact source scope, callback domain, application publisher, and expiry. Treat scope expansion and callback changes as new approval and never globally allow an application name. Configuration immediately creates exposure, while only provider delivery or receiver-request confirmation upgrades outcome. Retain failures and retries because they establish continuing workflow attempts.
      evidence_keys: [B10-3-T1567-REF-PUSH-WEBHOOKS, B10-3-T1567-REF-WIZ-SHAI, B10-3-T1567-REF-M365-AUDIT]
  mitigations:
    - temporary_key: B10-3-T1567-MIT-SERVICE
      name:
        zh: Web 服务接收者、对象与工作流治理
        en: Web-Service Receiver Object and Workflow Governance
      summary:
        zh: 把 Web 服务访问细化到接收命名空间、对象生命周期与工作流授权，并持续导出可关联审计。
        en: Govern web-service access at receiver-namespace, object-lifecycle, and workflow-authorization levels and continuously export joinable audit.
      description:
        zh: >-
          该控制不把知名 SaaS 域名视为完整信任边界。组织为每个服务登记允许的 tenant/account/chat/repo/webhook、应用、数据类别与所有者；限制对象公开/外部共享和秘密发布；对 Webhook/集成实行最小 scope、批准回调、签名、到期和凭据轮换；把服务审计与端点源数据长期关联。端点加密前 DLP 和累计上传预算由 MIT-000200/MIT-000156 补充。
        en: >-
          This control does not treat a well-known SaaS domain as a complete trust boundary. For each service, the organization registers permitted tenants, accounts, chats, repositories, and webhooks plus applications, data classes, and owners; restricts public or external object sharing and secret publication; governs webhooks and integrations with least scope, approved callbacks, signing, expiry, and credential rotation; and joins service audit to endpoint source data over time. MIT-000200 and MIT-000156 supplement it with pre-encryption endpoint DLP and cumulative upload budgets.
      measures:
        - key: receiver-namespace-authorization
          name: {zh: 接收命名空间授权, en: Receiver Namespace Authorization}
          control_type: preventive
          description:
            zh: 对允许的 Web 服务按 tenant、account、chat/channel、repository/container、webhook ID、应用和数据类别建立正向清单；代理/CASB、端点 DLP 或服务策略对未知接收者审计、警告或阻断，并给例外设置所有者与到期。
            en: Positively inventory allowed web services by tenant, account, chat or channel, repository or container, webhook ID, application, and data class. Have proxy or CASB, endpoint DLP, or service policy audit, warn, or block unknown receivers and give exceptions an owner and expiry.
        - key: object-lifecycle-policy
          name: {zh: 服务对象生命周期与可见性政策, en: Service Object Lifecycle and Visibility Policy}
          control_type: preventive
          description:
            zh: 限制公开仓库、匿名链接、外部共享、粘贴和个人存储；要求秘密/敏感内容扫描、批准创建者、默认私有、保留/删除策略及 object ID 级审计，防止新对象成为匿名会合点。
            en: Restrict public repositories, anonymous links, external sharing, pastes, and personal storage. Require secret and sensitive-content scanning, approved creators, private-by-default state, retention and deletion policy, and object-ID-level audit so a new object cannot become an anonymous rendezvous.
        - key: workflow-webhook-governance
          name: {zh: 工作流与 Webhook 授权治理, en: Workflow and Webhook Authorization Governance}
          control_type: governance
          description:
            zh: 仅允许批准主体创建或修改集成，精确限制事件/对象 scope 与 callback 域，验证签名和发布者，记录 secret hash、old/new state 与投递结果，并实行定期复核、自动到期和快速撤销。
            en: Permit only approved principals to create or modify integrations, narrowly constrain event or object scope and callback domain, validate signing and publisher, record secret hash, old and new state, and delivery results, and enforce periodic review, automatic expiry, and rapid revocation.
        - key: provider-audit-export
          name: {zh: 提供方审计持续导出与保留, en: Continuous Provider Audit Export and Retention}
          control_type: detective-support
          description:
            zh: 持续导出 actor/app/token、tenant、receiver、object、visibility、workflow、request/correlation 和 delivery 字段，并与端点设备、进程、用户和 source set 对齐，保留期覆盖异步读取与长期 Webhook。
            en: Continuously export actor or application or token, tenant, receiver, object, visibility, workflow, request or correlation, and delivery fields and align them with endpoint device, process, user, and source set, retaining them across asynchronous reads and long-lived webhooks.
      applications:
        - target_key: B10-3-T1567-PARENT
          use:
            zh: 对所有批准 Web 服务登记具体接收者、应用、对象类型与数据类别，并把未知账号/仓库/聊天/Webhook 或公共发布置于审计和阻断。
            en: Register concrete receivers, applications, object types, and data classes for every approved web service and audit or block unknown accounts, repositories, chats, webhooks, or public publication.
          expected_effect:
            zh: 服务域名允许不再等于任意租户/对象允许，攻击者需取得受管接收命名空间或产生明确审计偏差。
            en: Allowing a service domain no longer allows arbitrary tenants or objects, forcing the adversary to obtain a governed receiver namespace or create an explicit audit deviation.
          limitations:
            zh: 外部个人租户、服务 API 字段差异和无法检查的客户端可能阻断 namespace 解析；过严政策会影响协作和客户交付。
            en: Outside personal tenants, provider API differences, and opaque clients can prevent namespace resolution, while strict policy can disrupt collaboration and customer delivery.
        - target_key: B10-3-T1567-CHILD-RECEIVER
          use:
            zh: 将 provider 与 receiver 分别授权，bot token、chat/repo/account/webhook ID 使用稳定 hash 或对象 ID 管理，禁止只对白名单域放行。
            en: Authorize provider and receiver separately, manage bot-token, chat, repository, account, and webhook IDs through stable hashes or object IDs, and prohibit domain-only allowlisting.
          expected_effect:
            zh: 可信服务外观不能自动掩护陌生接收者，端点或 CASB 可在首个上传时警告或阻断。
            en: Trusted service appearance no longer automatically covers an unfamiliar receiver, allowing endpoint or CASB warning or blocking on the first upload.
          limitations:
            zh: 服务不暴露接收者、token 动态轮换或共享频道业务复杂时需要人工例外和服务端审计。
            en: Services that hide receivers, rotate tokens dynamically, or support complex shared-channel business require human exceptions and provider-side audit.
        - target_key: B10-3-T1567-CHILD-OBJECT
          use:
            zh: 限制公开/匿名对象和可见性变更，开启秘密与敏感数据扫描，要求对象所有者、业务理由、读取者和到期，并阻止未批准主体把私有对象公开。
            en: Restrict public and anonymous objects and visibility changes, enable secret and sensitive-data scanning, require object owner, business reason, readers, and expiry, and prevent unapproved principals from making private objects public.
          expected_effect:
            zh: 服务对象更难成为长期匿名会合点，创建—公开—读取链可被审计并在读取前撤销。
            en: Service objects become harder to use as long-lived anonymous rendezvous, and creation-to-publication-to-read chains can be audited and revoked before retrieval.
          limitations:
            zh: 外部个人仓库或存储不受租户政策控制，内容编码可能绕过扫描，匿名读取日志也可能缺失。
            en: Outside personal repositories or storage escape tenant policy, encoded content can evade scanning, and anonymous-read logs may be absent.
        - target_key: B10-3-T1567-CHILD-WORKFLOW
          use:
            zh: 对 Webhook/集成实行管理员或审批工作流、最小事件 scope、callback 域清单、签名验证、凭据轮换、自动到期和投递日志；scope/URL 改变触发重新审批。
            en: Require administrator or approval workflow, minimum event scope, callback-domain allowlist, signature validation, credential rotation, automatic expiry, and delivery logs for webhooks and integrations, with scope or URL changes forcing reapproval.
          expected_effect:
            zh: 攻击者不能静默把服务变成长期发送主体，未经批准的配置或首次投递会产生可操作证据。
            en: The adversary cannot silently turn the service into a long-lived sender, and unapproved configuration or first delivery creates actionable evidence.
          limitations:
            zh: 被控既有集成、供应商内部转发和无投递日志的服务仍可隐藏最终端点；撤销可能中断业务自动化。
            en: Compromised existing integrations, provider-internal forwarding, and services without delivery logs can hide the final endpoint; revocation can interrupt business automation.
      evidence_keys: [B10-3-T1567-REF-GITHUB-POLICY, B10-3-T1567-REF-GITHUB-AUDIT, B10-3-T1567-REF-M365-AUDIT, REF-000923, B10-3-T1567-REF-PUSH-WEBHOOKS]
    - existing_ref: MIT-000156
      resolution: extend
      application_proposal:
        zh: >-
          “批准上传路径”和“跨事件累计预算” measures 保持不变，可为 T1567 父项、共享接收者和对象会合子项增加 applications：把 destination 细化为 provider+receiver namespace，并跨对象/请求累计同一主体的上传量。该 MIT 不替代服务对象可见性和 Webhook 配置治理。
        en: >-
          The Approved Upload Paths and Across-Event Upload Budget measures remain unchanged and can gain applications for the T1567 parent, Shared-Service Receiver Attribution Obscuration, and Service-Object Rendezvous Exfiltration. Destination is refined to provider plus receiver namespace, and upload volume is accumulated across objects and requests for one principal. This MIT does not replace service-object visibility and webhook-configuration governance.
    - existing_ref: MIT-000200
      resolution: extend
      application_proposal:
        zh: >-
          “加密前敏感数据控制”和“跨观察面关联字段保留” measures 可原义用于 T1567 父项与共享接收者：在 HTTPS/API 前按标签、应用和接收命名空间阻断敏感上传，并连接端点与服务审计。角色绑定协议和受害服务发布路径 measures 不作为 T1567 专有动作，新 MIT 负责对象与工作流治理。
        en: >-
          The Pre-Encryption Sensitive Data Control and Cross-Surface Join-Field Retention measures apply unchanged to the T1567 parent and shared receiver: block sensitive upload before HTTPS or API by label, application, and receiver namespace and join endpoint to service audit. Role-bound protocol and victim-service publication measures are not T1567-specific actions; the new MIT governs objects and workflows.
