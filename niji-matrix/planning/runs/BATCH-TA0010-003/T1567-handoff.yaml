      statement_en: A legitimate external web service acting as receiver or relay gives exfiltration an allowed service identity and shared infrastructure, and real incidents establish the behavior separately from primary C2, supporting formal admission of T1567.
      evidence_keys: [REF-000625, REF-000640, B10-3-T1567-REF-ESET-INVISIBLE, B10-3-T1567-REF-WIZ-SHAI]
