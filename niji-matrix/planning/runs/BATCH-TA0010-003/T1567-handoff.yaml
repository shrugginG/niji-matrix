research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1567.001, T1567.002, T1567.003, T1567.004]
    represented_dimensions:
      - T1567.001 partitions code-repository services and API access
      - T1567.002 partitions cloud-storage and file-sharing services
      - T1567.003 partitions text-storage and paste-style services
      - T1567.004 partitions direct webhook posts and service-linked webhook workflows
    breadth_trigger: examine-at-least-two-materially-different-axes
    coverage_resolutions:
      - attack_child_id: T1567.001
        resolution: niji-variable-candidate
        notes_zh: 代码仓库产品维度不导入；攻击者仓库/namespace 支持 RECEIVER，新建持久 repo/file 支持 OBJECT，仓库 Actions/Webhook 可支持 WORKFLOW。
        notes_en: Code repository is not imported as a product dimension. Attacker repository namespace contributes to RECEIVER, a persistent repository or file to OBJECT, and repository Actions or webhook to WORKFLOW.
      - attack_child_id: T1567.002
        resolution: niji-variable-candidate
        notes_zh: 云存储产品维度不导入；MEGA/Dropbox 等账号与共享域支持 RECEIVER，持久对象与异步读取支持 OBJECT。若同服务已有对象转移到账户则相邻 T1537。
        notes_en: Cloud-storage product type is not imported. Accounts and shared domains such as MEGA or Dropbox contribute to RECEIVER and persistent objects with asynchronous reads to OBJECT. Transfer of an existing same-service object into another account is adjacent T1537.
      - attack_child_id: T1567.003
        resolution: niji-variable-candidate
        notes_zh: 文本服务只是一种对象实现；账号/链接可支持 RECEIVER，持久 paste 支持 OBJECT。缺少独立稳定变量时普通上传留在 parent-core。
        notes_en: Text service is an object implementation. Account or link can contribute to RECEIVER and a persistent paste to OBJECT. Ordinary upload remains parent-core without another stable variable.
      - attack_child_id: T1567.004
        resolution: niji-variable-candidate
        notes_zh: 手工 POST 到共享 Webhook 支持 RECEIVER 或父级核心；只有在受害 SaaS 配置事件触发/转交时支持 WORKFLOW，不直接继承 Webhook 名称。
        notes_en: Manual POST to a shared webhook contributes to RECEIVER or parent-core. Only event-triggered relay configured in victim SaaS contributes to WORKFLOW; the webhook name is not inherited.
    candidate_stealth_axes_examined:
      - {axis: provider identity versus service-internal receiver namespace, resolution: formal-child-proposed, key: B10-3-T1567-CHILD-RECEIVER}
      - {axis: persistent service object separating upload and retrieval, resolution: formal-child-proposed, key: B10-3-T1567-CHILD-OBJECT}
      - {axis: service-side workflow or webhook becoming the sending principal, resolution: formal-child-proposed, key: B10-3-T1567-CHILD-WORKFLOW}
      - {axis: service product category, resolution: not-stealth-distinct}
      - {axis: same-service account or tenant ownership transfer, resolution: adjacent-technique, owner: T1537}
      - {axis: same logical web-service relationship carrying C2 and results, resolution: adjacent-technique, owner: T1041}
      - {axis: protocol different from C2 without service-identity dependency, resolution: adjacent-technique, owner: T1048}
      - {axis: victim-owned service response to outside pull, resolution: adjacent-niji-gap-deferred, owner: TA0010 gap review}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        四个 ATT&CK 子项全部按实现簇解析，检验了三条不同观察轴，超过 3–5 子项触发所需两条。正式数量来自 receiver/object/workflow 数据与防御差异，不是按代码、云盘、文本和 Webhook 合并改名。
      en: >-
        All four ATT&CK children are resolved as implementation clusters, and three different observation axes were tested, exceeding the two-axis requirement for the 3–5 trigger. Formal count follows receiver, object, and workflow data and defensive differences rather than renamed groupings of code, drives, text, and webhooks.
