    paragraphs:
      - zh: >-
          证据层级不均。InvisibleFerret 直接证明 Telegram bot-token 服务上传并明确区分自建 C2；Shai-Hulud 直接证明公开仓库对象和恶意 GitHub Actions/Webhook，但 Webhook 免费配额导致部分交付失败；Push Security 明确给出服务端 Webhook 请求方向及检测缺口，却不是逐事件受害案例。因此 RECEIVER 与 OBJECT 可为 high，WORKFLOW 的稳定交付与实测匿迹效果保持 medium。
        en: >-
          Evidence levels vary. InvisibleFerret directly establishes Telegram bot-token service upload and distinguishes dedicated C2. Shai-Hulud directly establishes public repository objects and malicious GitHub Actions or webhook behavior, but free-tier quota caused some delivery failure. Push Security explicitly establishes server-side webhook direction and a detection gap but is not a victim incident report. RECEIVER and OBJECT can therefore be high-confidence, while reliable WORKFLOW delivery and measured stealth effect remain medium.
      - zh: >-
          服务审计的覆盖和字段高度依赖提供方、许可与租户所有权。GitHub actor/repo/request/token 字段不能原样推广到 Telegram、MEGA 或粘贴站；Microsoft 365 actor/app/token/correlation 字段也不能证明第三方平台存在相同日志。正式 Analytic 必须维护产品映射并标记 provider_only、receiver_unknown 和 delivery_unobserved 状态，不能用域名、TLS 或“合法服务”标题填补缺失证据。
        en: >-
          Service-audit coverage and fields depend heavily on provider, license, and tenant ownership. GitHub actor, repository, request, and token fields do not transfer unchanged to Telegram, MEGA, or paste sites, and Microsoft 365 actor, application, token, and correlation fields do not prove equivalent third-party logs. A canonical analytic must maintain product mappings and states such as provider_only, receiver_unknown, and delivery_unobserved rather than fill missing evidence with domain, TLS, or a legitimate-service label.
      - zh: >-
          ATT&CK 固定版的一些过程同时包含 C2、Web 服务和云账户语义。Niji 不能从 provider 名称决定归属：必须先判断同一逻辑 C2 关系、外部服务接收/转交、还是同服务账户控制权变化。受害服务拉取在本候选下被明确排除，待两个父候选完成后由主 Agent作 TA0010 原生 gap 决议。
        en: >-
          Some fixed ATT&CK procedures combine C2, web-service, and cloud-account semantics. Niji cannot assign ownership from provider name. It must first decide whether the direct relationship is the same logical C2, an outside service receiving or relaying data, or a same-service account-control change. Victim-service pull is explicitly excluded here and awaits a TA0010 native-gap decision by the primary agent after both parents complete.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: TLS or content encryption may accompany Web services but inspectability is already handled by NJS-0191-003 and is not a service-native child variable.
    - mechanism_ref: NM-ST-for-receiver
      reason: Shared receiver attribution changes identity resolution rather than necessarily dispersing events; NM-ST is reserved for the two-leg persistent-object lifecycle.
  open_questions:
    - The primary agent should compare T1537 ownership of Shai-Hulud private-repository migration and ensure only locally harvested data uploaded into a new service object remains here.
    - The primary agent should decide whether to create the deferred Victim-Service Pull Exfiltration as a TA0010 Niji-native parent after both T1567 and T1537 reject ownership.
    - Provider mappings must identify which services expose receiver IDs, object read events, webhook delivery logs, and token hashes before canonical analytics claim available coverage.
    - MIT-000156 and MIT-000200 extensions should be retained only if new applications use unchanged measures and do not duplicate B10-3-T1567-MIT-SERVICE service-governance actions.
