  limitations:
    paragraphs:
      - zh: "Mandiant 的 SUNBURST 样本提供三种可核实的通信变换，但单案例不能证明它们在所有网络或所有产品中具有相同效果。Unit 42 对 RDAT 的 BMP 收发功能有代码级解释，明确表示未观察到 C2 实际使用该路径发送命令，因此入站命令能力不能写成现场事实。来源没有给出本手交付 Analytic 的灵敏度、误报率或可通用阈值；Zeek 文档只支持字段可用性，不能证明具体告警逻辑的有效率。"
        en: "The SUNBURST sample gives three verifiable communication transformations, but one case does not establish the same effect in every network or product. Unit 42 explains RDAT's BMP send and receive logic at code level while explicitly stating that C2 use of this path to send commands was not observed, so inbound command capability must not be written as a field observation. The sources do not provide sensitivity, false-positive rates, or universal thresholds for the proposed analytics; Zeek documentation supports field availability, not alert effectiveness."
      - zh: "ATT&CK 19.1 的三个子项只支持研究广度，不支撑正式 NJS 数量。本文将服务契约检查、内容提取后的端点关联和预防控制作为可实施设计建议，其因果基础来自来源与字段文档；具体阈值、内容留存、合法服务画像和代理映射须在本地测试，不能先验定为高置信检测。"
        en: "The three ATT&CK 19.1 children establish research breadth, not a formal NJS count. This handoff offers service-contract checks, endpoint correlation after extraction, and preventive controls as implementable designs grounded in case evidence and field documentation. Thresholds, content retention, legitimate-service profiles, and proxy mapping require local tests and cannot be presumed high-confidence detections."
