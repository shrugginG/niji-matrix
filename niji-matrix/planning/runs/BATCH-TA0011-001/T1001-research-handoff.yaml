handoff_schema_version: '2.0.0'
type: "technique-research-handoff"
batch_ref: "BATCH-TA0011-001"
work_item_ref: "WORK-TA0011-T1001"
temporary_key_prefix: "TMP-TA0011-T1001"
candidate:
  source_type: "attack"
  source_attack_id: "T1001"
  name: {zh: 数据混淆, en: Data Obfuscation}
recommendation:
  decision: "adapt"
  confidence: "high"
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: "保留 T1001 所指向的命令控制通信遮蔽问题，但将正式范围收紧到攻击者有意改变 C2 消息的可见内容、承载结构或服务会话表征，从而使防守方错读消息语义或误认通信角色。Mandiant 对 SUNBURST 的逆向分析同时确认可选垃圾字节、XML/GUID 中的命令、貌似合法 OIP 遥测的 JSON；Unit 42 对 RDAT 的逆向分析确认 BMP 附件中的双向数据隐藏。这些行为共同支持以通信观察差异为核心的准入，而不支持将一切编码、加密或正常协议选择并入本项。"
        en: "Retain the ATT&CK T1001 problem of concealing command-and-control communication, but narrow the formal scope to deliberate changes in the visible content, carrier structure, or apparent service conversation of C2 messages that cause defenders to misread message semantics or misidentify the communicating role. Mandiant's SUNBURST reverse engineering directly documents optional junk bytes, commands embedded in XML GUIDs, and JSON resembling legitimate OIP telemetry; Unit 42's RDAT analysis documents bidirectional data concealed in BMP attachments. Together these support admission around a communication-observation differential, not inclusion of every encoding, encryption, or ordinary protocol choice."
      - zh: "TA0005 的 NJT-0115 已覆盖不限定阶段的内容表示遮蔽，因此 T1001 不能简单重写该项。T1001 的独立分析对象是具有往返和时序的 C2 会话：消息边界、请求与响应配对、声明服务与真实目的、网络传感器所见和端点进程所为。相同字节变换可以同时满足两个技术，但只有出现 C2 功能及会话层观察差时才进入本项；单纯隐藏静态载荷或脚本不进入 TA0011。"
        en: "TA0005 NJT-0115 already covers content-representation obscuration without a phase constraint, so T1001 cannot merely restate it. T1001 has a separate analytic unit: a bidirectional, timed C2 conversation with message boundaries, request-response pairs, claimed service versus actual purpose, network-sensor view, and endpoint-process behavior. The same byte transformation may satisfy both techniques, but it enters this TA0011 scope only when C2 function and a conversation-level observation differential are established; static payload or script concealment alone stays outside TA0011."
proposed_content:
  summary:
    zh: "攻击者改变命令控制消息的可见形态、载体或服务语义，使真实指令或控制目的难以从常规通信观察中辨认。"
    en: "Adversaries change the visible form, carrier, or service semantics of command-and-control messages so routine communication observation is less able to reveal the actual commands or control purpose."
  definition_and_concept:
    paragraphs:
      - zh: "本候选指攻击者在已建立或正在建立的 C2 通信中，刻意让防守传感器所见消息与接收端实际解析的控制语义分离。它可以改变帧中的有效与无效字节比例、把命令嵌入可独立解析的良性载体，或让整段请求与响应呈现为某项预期服务。直接目的不是建立通道，而是让已经存在的控制交换不易被内容检查、协议分类或基线审计识别。"
        en: "This candidate covers deliberate separation between the message seen by a defender sensor and the control semantics parsed by the receiver in an established or establishing C2 exchange. The actor may alter the ratio of meaningful to inert bytes in a frame, embed commands in an independently parseable benign carrier, or make the request-response conversation resemble an expected service. Its direct purpose is to reduce recognition of an existing control exchange by content inspection, protocol classification, or baseline audit, rather than to establish the channel itself."
      - zh: "判定必须连接具体通信行为、攻击者控制的变换或伪装以及接收端的提取或后继命令执行。孤立的 JSON、图像、Base64、TLS、压缩或高熵不构成本项；合法遥测、媒体邮件、测试流量和私密通信也可能具有相似外观。研究时须同时保存原始流量与还原后的消息/结果，不能把某种格式名称当作匿迹机理。"
        en: "Classification requires a link among a concrete communication, an actor-controlled transformation or disguise, and receiver-side extraction or subsequent command execution. JSON, images, Base64, TLS, compression, or high entropy alone do not establish this candidate; legitimate telemetry, media mail, testing traffic, and private communication can look similar. Research should preserve both raw traffic and recovered messages or outcomes, rather than treating a format name as a stealth mechanism."
  stealth_characteristics:
    paragraphs:
      - zh: "噪声会移动稳定特征和消息长度，载体嵌入会让外层解析器得到貌似无害的 XML、JSON 或图像，服务仿真会使请求路径、字段、客户端标识或时序贴近批准业务。其共同效果是降低单条流量在默认解析层上的可疑程度，而不是消除痕迹。帧长分布、无效字段比例、原始与重编码载体差异、外层字段的功能关系、进程身份、目的地主体和命令后的端点结果仍可恢复偏差。"
        en: "Noise moves stable signatures and message lengths; carrier embedding lets an outer parser see apparently harmless XML, JSON, or images; service emulation aligns paths, fields, client identity, or timing with an approved application. Their common effect is to reduce the apparent suspiciousness of individual traffic at the default parse layer, not to erase traces. Frame-length distribution, inert-field proportion, differences between raw and re-encoded carriers, functional relationships among outer fields, process identity, destination ownership, and endpoint outcomes after a command remain available for investigation."
      - zh: "防守观察效果取决于可见层。只有五元组或未解密 TLS 时通常只能提出流量形态异常；能够取得 HTTP 内容、附件和端点关联时，才可验证载体与服务语义差异。SUNBURST 的 OIP 外观与真实 SolarWinds 软件进程共存，说明仅凭可信进程名或相似 User-Agent 不能排除恶意，需将服务许可的目的地、消息字段关系和后继执行共同校验。"
        en: "The defender effect depends on observation depth. Five-tuples or opaque TLS alone normally support only traffic-shape suspicion; access to HTTP content, attachments, and endpoint correlation permits tests of carrier and service-semantic differences. SUNBURST combined an OIP appearance with a real SolarWinds process context, showing that a trusted process name or similar User-Agent cannot rule out abuse; allowed destination, field relationships, and successor execution must be checked together."
  scope_boundary_definition:
    paragraphs:
      - zh: "T1132 负责把数据编码到另一表示，T1573 负责以密码变换保护通信；单独 Base64、XOR 或 TLS 不满足本候选。只有额外的无意义字段、伪装载体或伪造服务契约改变防守方对 C2 的观察时，才记为 T1001。T1071 按实际承载的应用协议划分，HTTP 或邮件的使用本身不等于混淆；T1572 关注把一种协议会话封装在另一通道中以穿越边界，若只是消息外观仿真而无内层协议会话，不归隧道。"
        en: "T1132 owns recoding data into another representation and T1573 owns cryptographic protection of communication; Base64, XOR, or TLS alone does not meet this candidate. T1001 applies when additional inert fields, a deceptive carrier, or a forged service contract changes defenders' observation of C2. T1071 describes the application protocol actually carrying traffic, so HTTP or mail use by itself is not obfuscation. T1572 describes an inner protocol session encapsulated in another channel to cross a boundary; a message that merely looks like a service without an inner protocol session is not tunneling."
      - zh: "与 TA0005 NJT-0115 的交集按研究对象处理：静态代码、下载载荷和一般工件即使藏在图像中仍归该技术；用于持续收发指令的图像、JSON 或邮件消息还可作为本候选的 C2 证据。若正式子项只重复 NJT-0115 的内外摘要谱系或 NJT-0114 的 User-Agent 模仿，主 Agent 应拆除该子项并复用既有对象；只有会话层检测分工明确且有独立证据时才建立新的 NJS。"
        en: "Resolve overlap with TA0005 NJT-0115 by analytic subject: static code, downloaded payloads, and general artifacts remain there even when hidden in images, while images, JSON, or mail messages used for ongoing command exchange also provide C2 evidence here. If a proposed child only repeats NJT-0115's outer-to-inner digest lineage or NJT-0114's User-Agent imitation, the primary agent should remove that child and reuse existing objects; create a new NJS only when a conversation-level detection role and independent evidence are clear."
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: "在有互联网出口但进行网络内容审查的受害环境，后门可在正常 HTTP 请求中加入噪声，并把命令拼入 XML 的 GUID 字段或使用貌似产品遥测的 JSON 交换。另一个场景是已能访问组织邮箱的植入体借 EWS 收发附带 BMP 的邮件，在图像像素中藏入命令或结果；邮件服务在此是通信媒介，像素内外语义差才是本候选的匿迹点。"
          en: "In a victim environment with Internet egress and network-content inspection, an implant may add noise to ordinary HTTP requests, assemble commands from GUID fields in XML, or exchange JSON resembling product telemetry. In another scenario, an implant with access to an organizational mailbox may use EWS to send and receive BMP attachments that hide commands or results in pixel values. Mail is the transport in that example; the semantic differential between the image and embedded data is the stealth feature examined here."
    threat_model:
      attacker_model:
        paragraphs:
          - zh: "攻击者需要控制至少一端 C2 生成与另一端解析逻辑，或掌握能让现有客户端读取隐藏字段的格式；服务仿真还要求了解目标软件正常请求、允许的出口和校验规则。增加噪声与复杂载体会消耗带宽、增大解析失败和格式损坏风险，且容易在样本与实际业务之间留下可比较的异常。"
            en: "The actor needs control of at least one C2 message generator and the corresponding parser, or a format the existing client can read for hidden fields. Service emulation also requires knowledge of normal application requests, permitted egress, and validation rules. Noise and complex carriers consume bandwidth, increase parser and format-failure risk, and may leave anomalies visible when samples are compared with genuine business traffic."
      defender_model:
        paragraphs:
          - zh: "防守方假定可从代理、NDR 或邮件审计获得会话时间、源目的、HTTP 方法与主机/路径、请求响应长度、附件或文件标识，并在部分主机上把流量连接到进程、软件安装清单和后继执行。若能依法取得内容，可重建载体结构和服务字段约束；若 TLS 未解密、邮件加密、CDN 或代理汇聚隐藏真实目的地，结论只能降低为形态或来源异常，不能声称已看到隐藏命令。"
            en: "The defender is assumed to obtain session time, endpoints, HTTP method and host/path, request-response lengths, attachment or file IDs from a proxy, NDR, or mail audit, and to join some traffic to process, installed-product inventory, and successor execution. Where content is lawfully available, carrier structure and service-field constraints can be reconstructed. With opaque TLS, encrypted mail, or a CDN or proxy that hides the final destination, the conclusion must be limited to shape or provenance anomaly, not a claim that hidden commands were observed."
  stealth_mechanisms:
    - mechanism_ref: "NM-DO"
      role: "primary"
      summary: {zh: 外层通信内容隐藏实际控制语义, en: Outer communication content conceals actual control semantics}
      analysis:
        paragraphs:
          - zh: "攻击者将控制字节分散在图像像素、XML GUID 或貌似遥测的 JSON 字段中，并让植入体按专用规则复原；默认解析层只得到图像或业务数据，真实指令须经过提取才能出现。因此可见痕迹与控制语义分离，形成数据遮蔽。RDAT 的 BMP 与 SUNBURST 的 XML/JSON 为不同承载实现，均要求防守保留外层与内层的因果链。"
            en: "The actor distributes control bytes across image pixels, XML GUIDs, or telemetry-like JSON fields and has the implant reconstruct them by private rules. A default parser sees an image or business data, while the command appears only after extraction. This separates visible traces from control semantics and yields Data Obscuration. RDAT BMP and SUNBURST XML/JSON are different carrier implementations but each requires defenders to retain the outer-to-inner causal chain."
      evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST, TMP-TA0011-T1001-REF-UNIT42-RDAT]
      confidence: "high"
    - mechanism_ref: "NM-FD"
      role: "secondary"
      summary: {zh: 伪造服务外观改变流量归类, en: Forged service appearance changes traffic classification}
      analysis:
        paragraphs:
          - zh: "攻击者让 C2 请求复制正常软件的遥测形态、字段和会话上下文，使只看外层标签的防守规则把流量归入允许服务；真实目的地或字段内容与批准服务不一致时，跨层核对又能识别差异。这是服务角色的特征伪装，不能从单一 User-Agent 推出完整仿真成功。"
            en: "The actor copies a legitimate application's telemetry shape, fields, and conversation context into C2 requests, causing rules that only inspect outer labels to classify them as allowed service traffic. Cross-layer checks reveal differences when destination ownership or field contents diverge from the approved service. This is service-role Feature Disguise; a single User-Agent does not prove complete emulation succeeded."
      evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST]
      confidence: "high"
proposed_subtechniques:
  - temporary_key: "TMP-TA0011-T1001-CHILD-MESSAGE-DILUTION"
    name: {zh: 控制消息有效语义稀释, en: Control-Message Semantic Dilution}
    disposition: "candidate-formal"
    stable_variable: "每一 C2 消息中有意义字节与可丢弃字节的比例和布局，由攻击者控制，跨 HTTP、DNS 和自定义帧存在。"
    trace_change: "同一命令在原始流量中长度、位置和字节序列变化；需保留帧边界、内容与还原结果，不能仅按高熵判断。"
    defender_observation_difference: "签名和直接解码受噪声干扰，长度及字段关系、同端点多次交换的规范化比较仍可检测。"
    sibling_boundary: "关注非语义数据占比，不以良性载体或服务身份为核心；编码本身由 T1132 负责。"
    prerequisite_scenario: "攻击者控制发送端与去噪解析器，且 C2 不受严格长度与格式限制。"
    evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST]
    defense_difference: "保留原始帧和长度分布，对可解析结构逐层剔除未消费字段，比较还原消息与进程结果。"
    caution: "Mandiant 证明 SUNBURST 可选 junk bytes，但未量化它在各环境降低检出率的实际幅度；不可写成普适规避效果。"
  - temporary_key: "TMP-TA0011-T1001-CHILD-CARRIER-SPLIT"
    name: {zh: 控制语义载体分离, en: Control-Semantics Carrier Separation}
    disposition: "conditional-formal-after-cross-tactic-review"
    stable_variable: "外层有效业务或媒体对象与内层控制语义之间的提取边界，跨图像、XML 和 JSON 存在。"
    trace_change: "网络和邮件层见合法结构，植入体却从像素或字段序列重建命令；外层摘要、内层恢复及后继执行可形成谱系。"
    defender_observation_difference: "仅按 MIME 或外层 schema 分类会漏读，内容级提取与端点解析器行为可重建。"
    sibling_boundary: "重点是独立可解释载体与专用提取，不是可丢弃填充；与 NJT-0115/NJS-0115-003 高度交叉，应要求 C2 往返与消息级 Analytic 才能保留此子项。"
    prerequisite_scenario: "双端知道嵌入及提取规则，载体在传输与转码后仍保真。"
    evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST, TMP-TA0011-T1001-REF-UNIT42-RDAT, REF-000431]
    defense_difference: "以会话中的文件/附件 ID 关联接收、提取、回传和命令结果，区别于 TA0005 的单对象外内摘要谱系。"
    caution: "若主 Agent 认为此防御差不足，应归 parent-core 并复用 NJT-0115 对象，不应为凑数量建 NJS。"
  - temporary_key: "TMP-TA0011-T1001-CHILD-SERVICE-CONTRACT"
    name: {zh: 服务会话契约伪装, en: Service-Conversation Contract Camouflage}
    disposition: "candidate-formal"
    stable_variable: "C2 会话借用某一合法软件/服务的请求响应形态及角色声明，而真实目的与批准服务分离。"
    trace_change: "路径、User-Agent、JSON 字段或事件名称貌似允许服务，目的地主体、进程到目的地关系、字段依赖或命令后行为不匹配。"
    defender_observation_difference: "简单协议/域名分类被良性外观降低优先级；跨层服务契约检查可发现违约。"
    sibling_boundary: "关注服务级请求响应契约，不以单一客户端 User-Agent 为子项；单字段仿真仍属既有 NJS-0114-004 的证据或父级实现。"
    prerequisite_scenario: "攻击者掌握预期服务格式和出口规则，能控制 C2 请求与服务端响应。"
    evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST]
    defense_difference: "校验软件版本、来源进程、批准服务目的地和遥测字段约束，并连接异常后继执行；不只做通用 payload 解码。"
    caution: "SUNBURST 证明 OIP 仿真，但没有证明单个字段能绕过何种特定产品规则；分析阈值需本地校准。"
defense_candidates:
  detection_strategies:
    - temporary_key: "TMP-TA0011-T1001-DET-C2-SEMANTIC-DIFFERENTIAL"
      objective: "跨原始会话、外层载体/服务声明与端点结果，识别 C2 消息被噪声稀释、载体隐藏或服务角色伪装。"
      subjects: [parent, TMP-TA0011-T1001-CHILD-MESSAGE-DILUTION, TMP-TA0011-T1001-CHILD-CARRIER-SPLIT, TMP-TA0011-T1001-CHILD-SERVICE-CONTRACT]
      domain: "enterprise"
      analytic_keys: [TMP-TA0011-T1001-NJA-FRAME-CARRIER, TMP-TA0011-T1001-NJA-SERVICE-CONTRACT]
      reuse_resolution: "create-or-split; DET-000112 concerns general content normalization and execution, while this objective requires C2 request-response and authorized-service baseline."
  detection_analytics:
    - temporary_key: "TMP-TA0011-T1001-NJA-FRAME-CARRIER"
      covered_axes: [message-dilution, carrier-split]
      implementation: "在代理或 NDR 的 HTTP 会话中按 uid 和 trans_depth 配对请求/响应，关联文件 fuid 或邮件 attachment_id；保存原始内容摘要与长度、检测到的 MIME、外层 schema/图像尺寸及格式完整性。仅在获内容授权的流量上，对 XML GUID、JSON 非消费字段或 BMP 像素开展格式专属提取与规范化，计算原始/有效字节比、重复交换中的字段依赖、同源/同目的会话变化。高置信需可复原的控制语义或与同主机端点命令/文件动作在 5 分钟内关联；单独高熵、较大文件或异常长度仅作候选。"
      data_requirements:
        - source_type: "network_http; channel: Zeek http.log; required_fields: [ts, uid, id.orig_h, id.resp_h, method, host, uri, request_body_len, response_body_len, orig_fuids, resp_fuids]"
        - source_type: "network_file; channel: Zeek files.log plus configured file extraction; required_fields: [ts, fuid, uid, mime_type, seen_bytes, total_bytes, missing_bytes, extracted]"
        - source_type: "endpoint_network_process; channel: EDR or host connection audit; required_fields: [event_time, device_id, process_id, process_path, remote_ip, remote_port]"
      correlation: {window: '5 minutes for network-to-endpoint result; 24 hours for per-process baseline', dimensions: [device_id, uid, fuid, destination, process_id]}
      observables: [recoverable non-display bytes or fields, inert-to-semantic byte ratio, repeated C2 framing, carrier-to-inner-command transition, process action following extracted message]
      false_positives: [software telemetry with optional fields, image processing and mail automation, test harnesses, proxy rewriting]
      blind_spots: [opaque TLS or encrypted mail, no full payload retention, lossy image transcoding, unknown extraction algorithm, absent endpoint lineage]
      tuning: "先按应用/文件类型建立长度与非消费字段基线；采样原始内容需遵守保留和隐私边界；以解出命令及端点后果提高置信度，不以固定熵阈值直接阻断。"
      evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST, TMP-TA0011-T1001-REF-UNIT42-RDAT, TMP-TA0011-T1001-REF-ZEEK-HTTP, TMP-TA0011-T1001-REF-ZEEK-FILES]
    - temporary_key: "TMP-TA0011-T1001-NJA-SERVICE-CONTRACT"
      covered_axes: [service-contract]
      implementation: "为允许外联的产品建立经批准的进程/签名、目的地主体、Host/SNI、URI 模板、方法、字段依赖和版本画像。对宣称 OIP 或类似产品遥测的会话，在 30 分钟窗口内比对源软件、代理认证、目标域与证书所有权、字段约束及响应后进程行为；同一会话出现至少两个独立违约且紧随远程命令/下载时提升为高置信。仅异常 User-Agent、单个 URI 或目的地域名只进入调查队列。"
      data_requirements:
        - source_type: "network_http; channel: Zeek http.log or equivalent proxy; required_fields: [ts, uid, id.orig_h, id.resp_h, method, host, uri, user_agent, request_body_len, response_body_len]"
        - source_type: "dns_tls; channel: DNS and TLS telemetry; required_fields: [event_time, source_ip, destination_ip, query_or_sni, certificate_fingerprint]"
        - source_type: "endpoint_network_process; channel: EDR or host connection audit; required_fields: [event_time, device_id, process_id, process_path, process_hash, remote_ip]"
        - source_type: "approved_service_inventory; channel: CMDB/proxy policy; required_fields: [software_id, version, approved_process, approved_domain, expected_request_schema]"
      correlation: {window: '30 minutes', dimensions: [device_id, process_id, uid, destination, claimed_service]}
      observables: [claimed service inconsistent with approved destination, request fields that fail product invariants, process role mismatched to service, command-like endpoint action after response]
      false_positives: [product upgrades, regional CDNs, support proxies, legitimate third-party telemetry endpoints, TLS interception]
      blind_spots: [no content visibility, inventory drift, attacker using actual approved service endpoint, compromised signed process and matching service contract]
      tuning: "版本化批准画像并先记录再阻断；CDN 例外限定软件版本、目标证书和字段约束，不能把整个进程或供应商域永久豁免。"
      evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST, TMP-TA0011-T1001-REF-ZEEK-HTTP]
  mitigations:
    - temporary_key: "TMP-TA0011-T1001-MIT-EGRESS-SERVICE-VALIDATION"
      purpose: "将有网络权限的软件绑定到实际服务目的地和可验证协议形态，并对高风险 C2 载体进行受控内容解析。"
      measures:
        - {key: product-egress-bind, action: 对管理软件与服务账号按进程/签名、版本、目的域/证书及代理身份限制外联；拒绝未知目的地且记录被拒会话, control_type: preventive}
        - {key: structured-content-inspection, action: 对允许内容检查的 HTTP 与邮件按实际格式验证外层对象，保留原件与解析结果；对非法字段关系或异常嵌入数据隔离复核, control_type: detective-support}
        - {key: media-transform, action: 对不需要保留原字节的邮件图像在投递前安全转码或清除非业务元数据，并隔离无法解析的大对象, control_type: exposure-reduction}
      applications:
        - {target: parent, use: 管理软件外联按真实服务白名单绑定并记录会话与进程，内容可见时解析 C2 载体, expected_effect: 服务伪装不能单凭外观借用批准出口，嵌入内容留下解析差分, limitation: 受信更新进程被植入或真实批准服务被攻陷时需端点行为关联}
        - {target: message-dilution, use: 在允许的协议字段内设格式与尺寸上界，对无用字段异常增长隔离并保留原始消息, expected_effect: 限制噪声扩展空间并保留规范化比较所需痕迹, limitation: 合法可选字段和大体量遥测需版本化例外}
        - {target: carrier-split, use: 对 EWS 附件及 HTTP 图像/XML/JSON 进行格式校验、无损留样与必要时转码, expected_effect: 消除部分像素隐写或显露内外语义差, limitation: 转码会损害合法业务数据且加密附件不可检}
        - {target: service-contract, use: 产品出站流量绑定经批准的目的域、证书和请求 schema，偏离时隔离连接并记录进程, expected_effect: 伪造 OIP 式请求仍需满足独立的目的与内容契约, limitation: 供应商 CDN、升级和受损合法端点会降低精度}
      reuse_resolution: "review MIT-000113 for carrier parsing, but create or split product-egress binding because existing measure is general content normalization."
      evidence_keys: [TMP-TA0011-T1001-REF-MANDIANT-SUNBURST, TMP-TA0011-T1001-REF-UNIT42-RDAT]
