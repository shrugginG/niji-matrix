  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父候选各字段已覆盖定义与直接目的、切换的残余痕迹、相邻边界、攻防条件和条件性匿迹结论。两个子项目前只有分类与因果研究摘要；主 Agent 正式写入时仍需按 NJT-0001 为每个 NJS 补齐独立双语定义、特性、范围、场景、攻防模型、机理、防御与限制，不能把本摘要直接当成完整正式子项正文。
      en: Parent draft sections cover definition and purpose, residual handoff traces, adjacent boundaries, attacker and defender conditions, and conditional stealth conclusions. The two child records are taxonomy and causal research summaries only. The primary agent must author each NJS's full paired definition, characteristics, boundary, scenario, threat models, mechanism, defense, and limitations against NJT-0001, rather than treating these summaries as complete canonical child prose.
  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [manual_staging_yaml_serialization]}
  limitations:
    paragraphs:
      - zh: 直接样本证据证明了备用路径的实现与切换条件，但未提供防守方真实监控布局、告警阈值、流量基线或处置后的逐端点效果。因此，目的地计数被拆分、Web 规则遗漏 DNS 后继活动等匿迹结论都以观察边界为前提，应在具体环境中复测。特别是 QUADAGENT 的 DNS 仍有可见查询，TinyTurla 的新连接仍可由进程级日志关联。
        en: Direct sample evidence establishes reserve paths and switch conditions but does not provide a defender's actual sensor layout, alert thresholds, traffic baseline, or per-endpoint postresponse outcomes. Stealth conclusions about split destination counters or web rules missing later DNS activity therefore depend on an observation boundary and require local validation. QUADAGENT's DNS queries remain visible, and TinyTurla's new connections remain joinable through process telemetry.
      - zh: 失败信号可能由拥塞、CDN 调度、合法灾备、代理配置或更新器镜像切换造成，单凭多个域名、端口或 DNS 查询不能判别攻击。当前建议的两个子项以样本级通信逻辑和可实施防御差异成立，检测窗口与阈值只为工程设计初值；正式共享对象需按实际数据质量、组织服务目录和人工领域评审调整。可信服务、长延时与 DGA 变体仍保留研究状态。
        en: Congestion, CDN steering, legitimate disaster recovery, proxy configuration, and updater mirrors can produce similar failure sequences. Multiple domains, ports, or DNS queries alone cannot classify an attack. The two proposed children rest on sample level communication logic and implementable defensive differences; analytic windows and thresholds are engineering starting points requiring local data quality, service catalog, and human domain review. Trusted service, long delay, and DGA variants remain research items.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: 'Changing path does not itself obscure the content or meaning of captured command data; DNS tunneling encoding belongs to its own technique analysis.'}
    - {mechanism_ref: NM-FD, reason: 'Trusted-service camouflage is plausible for Crutch but insufficiently tied to an observed conditional handoff; ordinary HTTP or DNS choice is not proof of disguise.'}
  open_questions:
