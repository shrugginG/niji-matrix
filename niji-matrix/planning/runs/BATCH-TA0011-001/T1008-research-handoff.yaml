    - 'Is there an independently observed trusted-service failover sequence with old-path failure, activation, and later C2 through the service?'
    - 'Can local telemetry supply ProcessGuid-equivalent identity across Windows, Linux, and ESXi, and retain failure logs over callback intervals?'
    - 'Does primary review prefer classifying simultaneous endpoint and protocol change solely under cross-telemetry child or allowing two direct child links?'
