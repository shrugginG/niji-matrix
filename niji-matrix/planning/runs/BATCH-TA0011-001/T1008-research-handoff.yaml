type: technique-research-handoff
batch_ref: BATCH-TA0011-001
work_item_ref: WORK-TA0011-T1008
temporary_key_prefix: B1-T1008
candidate:
  source_type: attack
  source_attack_id: T1008
  name: {zh: 条件式备用指挥控制通道, en: Conditional Fallback C2 Channels}
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: ATT&CK 19.1 的 T1008 把主要通道受损或不可达时使用替代通信路径列为命令与控制行为，并提到规避单一路径的数据传输阈值。应保留这一父行为锚点，但在 Niji 中限定为攻击者预设或控制切换条件，且切换实际改变目的地、协议遥测面或可检查的服务上下文，使同一植入的控制活动更难被单点规则持续观察或关联。DustySky、TinyTurla、QUADAGENT 和 ISMAgent 的原始分析证明了失败后的条件式切换；匿迹收益是结合传感器边界的审慎推断，并非这些样本自动证明所有备用通道都有匿迹效果。
        en: ATT&CK Enterprise 19.1 anchors T1008 in use of an alternate communication path when the primary path is compromised or unavailable and mentions avoiding a single path's transfer threshold. Preserve that parent behavior, but narrow Niji admission to an attacker configured or controlled switch whose actual destination, protocol telemetry surface, or inspectable service context changes, making one implant's C2 harder to follow with a single point rule. Original analyses of DustySky, TinyTurla, QUADAGENT, and ISMAgent establish conditional failover after failure. The stealth benefit is a calibrated inference about defender sensor boundaries; those samples do not establish that every backup channel is stealthy.
      - zh: 本准入不把多目的地配置、普通网络重试、负载均衡、灾备或正常代理故障切换本身作为匿迹证据。还需取得同一植入或稳定进程身份、旧路径失败或不可达、以及替代路径上持续控制通信的组合证据。若攻击者只是改变防火墙策略，直接对象归 NJT-0124；若只是为不同载荷阶段或功能设置独立通道，则优先审查 T1104。暂不把依赖服务信誉、延时激活或 DGA 的模式独立定为 Niji 子项，除非后续来源证明切换条件及独立观察差异。
        en: A list of destinations, ordinary network retries, load balancing, disaster recovery, or legitimate proxy failover is not by itself evidence of stealth. Admission also requires a consistent implant or process identity, an unavailable or failed former path, and continued control communication on the alternate path. An adversary's firewall policy change directly belongs to NJT-0124, while separate channels for payload stages or functions first require T1104 review. Service reputation, delayed activation, and DGA based patterns are not independent Niji children until further sources establish their switch conditions and distinct observation effects.
proposed_content:
  summary:
    zh: 植入在原指挥控制路径失效后按预设条件转向备用路径，并使同一控制活动跨目的地或遥测面分散。
    en: An implant conditionally moves C2 from a failed primary path to a reserve path, dispersing the same control activity across destinations or telemetry surfaces.
  definition_and_concept:
    paragraphs:
      - zh: 条件式备用指挥控制通道是攻击者在植入中预先配置、远程下发或由程序计算的路径选择行为。当主要 C2 路径不可用、被阻断或符合预设换路条件时，同一植入尝试另一条能够接收指令或回传结果的路径。这里的直接目标是维持控制会话与任务连续性；备用路径可以改变服务器、协议或服务环境，但单纯存在多个地址不说明发生了切换。
        en: Conditional Fallback C2 Channels is an attacker configured, remotely supplied, or programmatically calculated path selection behavior in an implant. When the primary C2 path becomes unavailable, is blocked, or reaches a configured handoff condition, the same implant tries another path capable of receiving instructions or returning results. Its direct goal is continuity of control and tasking. The reserve path may change server, protocol, or service environment, but the mere presence of multiple addresses does not show a switch.
      - zh: 作为匿迹对象，关键不在通道数量，而在攻击者利用条件式切换改变防守方可见的会话谱系。例如，原先被目的地规则标记的流量移到另一服务器，或者原先由 Web 代理观察的会话转到 DNS 查询；两种方式都只有在监控、保留或关联存在对应边界时才产生隐蔽收益。通信协议、DNS 算法、代理链和载荷阶段仍可作为并行技术事实描述，不替代这里的路径切换概念。
        en: As a stealth object, the important fact is the attacker controlled conditional change in the defender visible session lineage, rather than the number of channels. Traffic marked by a destination rule may move to another server, or a session watched at a web proxy may move into DNS queries. Either yields a concealment benefit only where collection, retention, or correlation has the corresponding boundary. Protocol choice, DNS algorithms, proxy chains, and payload stages can be parallel technique facts but do not replace the path switch concept here.
  stealth_characteristics:
    paragraphs:
      - zh: 备用通道的匿迹特性是把同一植入的连续控制活动拆成表面不连续的网络序列。在同一传输面更换端点时，旧目的地的连接或流量阈值计数停止，而新端点从低历史量开始；改变传输面时，原 Web/连接日志中的活动消失，DNS 等另一类日志开始出现。若告警仅按目的地、端口、协议或短时间窗口汇总，就可能分别看到旧路径故障与新路径正常通信，却无法还原同一操作。
        en: The stealth property is a seemingly discontinuous network sequence produced by one continuous implant. With endpoint failover on the same transport, counters for the old destination stop while the new destination begins with little local history. With transport failover, activity disappears from web or connection logs and appears in another source such as DNS. Rules aggregating only by destination, port, protocol, or short window may see a failed old path and an apparently separate new path without reconstructing the same operation.
      - zh: 切换仍留有可观察残迹：原路径的超时、拒绝或错误，继而同一主机/进程对新端点的解析、连接、响应和周期性回传。若终端进程身份与网络/DNS 遥测能够长窗关联，或者所有出站路径都经同一受控网关，匿迹效果显著下降。没有原路径失败证据时，不能从新目的地单独推断备用通道；没有新路径上的双向或持续控制迹象时，也不能把普通故障恢复断言为 C2。
        en: >-
          The handoff leaves observable residue: timeouts, denials, or errors on the former path followed by resolution, connection, response, and recurrent callback by the same host or process on a new endpoint. Long window joins between endpoint process identity and network or DNS telemetry, or a common controlled gateway for every outbound path, reduce the stealth effect. A new destination alone does not prove fallback without failure evidence, and ordinary recovery must not be called C2 without bidirectional or sustained control indications on the new path.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入的最小序列是同一植入或进程的原 C2 路径、可验证的失败/不可达或受控触发、替代路径的启用，以及后继控制通信。仅向同一目的地重复 SYN、重发 HTTP 请求、轮询多个镜像地址、正常客户端按 DNS 答案连接、或合法服务故障切换，若缺少攻击者控制及匿迹观察差异，均在范围外。端点变化但传输面不变与传输面变化是两条候选子轴；两者同时发生时以导致主要防守观察变化的传输面切换为分类优先。
        en: The minimum included sequence contains the same implant or process, a former C2 path, verifiable failure or an attacker controlled trigger, activation of an alternate path, and subsequent control communication. Repeated SYNs to one endpoint, retransmitted HTTP requests, polling mirror addresses, normal DNS answer selection, and legitimate service failover are out of scope without adversary control and a changed defender observation. Endpoint change within the same transport and change of transport surface are candidate child axes. When both occur, classify by the transport switch if that is the dominant change to defender observation.
      - zh: T1104 的直接对象是不同阶段或功能的 C2 分工，即使并无故障也可依次发生；T1568 的直接对象是算法或 DNS 将 C2 地址动态求出，只有失效后启用解析路径才与本技术相交；T1090 的直接对象是通过中介转发，只有原路径失败后改走代理才同时涉及本技术。NJT-0124 关注防火墙有效策略遭攻击者改写，本技术关注植入选择哪条 C2 路径；单纯配置更改、基础设施迁移或防火墙正常故障转移都不能替代植入切换证据。
        en: T1104 concerns division of C2 by payload stage or function and may occur sequentially without any failure. T1568 concerns dynamic computation or DNS resolution of C2 addresses and overlaps only when a failed primary causes that resolution path to be used. T1090 concerns intermediary forwarding and overlaps only when failover chooses a proxy route. NJT-0124 concerns adversary impairment of effective firewall policy, while this object concerns which C2 path an implant chooses. A configuration change, infrastructure migration, or ordinary firewall failover cannot substitute for evidence of an implant handoff.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 长驻植入在原域名被封锁、服务器失联、代理拒绝或网络环境不允许原协议后，需要恢复任务拉取和结果回传。DustySky 的健康检查失败后尝试第二硬编码域名，TinyTurla 遍历可响应的 C2 地址；QUADAGENT 和 ISMAgent 在 HTTP 类请求失效后改用 DNS。此类活动常发生在已建立立足点后的持续控制或处置对抗期间，可能与协议选用、代理、动态解析并存。
          en: A persistent implant may need to restore task retrieval and result return after its original domain is blocked, server stops responding, proxy denies access, or the network disallows the original protocol. DustySky tries a second hardcoded domain after a health check fails, and TinyTurla traverses configured C2 addresses until one responds. QUADAGENT and ISMAgent use DNS after HTTP family requests fail. These behaviors occur during continued control after a foothold or during defender disruption and may coexist with protocol selection, proxying, or dynamic resolution.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需控制植入的路径选择逻辑，事先配置可用备用端点或通信方法，并维持能识别该植入的后端或可重建会话的协议状态。端点迁移要求备用服务器或域名仍可达；跨传输面迁移还要求植入与服务端都支持第二种协议及其编码、认证和任务格式。攻击者不必控制防火墙，但通常需要预判目标出站政策并接受切换检测、延迟与备用基础设施成本。
            en: The attacker must control path selection in the implant, preconfigure usable reserve endpoints or communication methods, and maintain a backend that recognizes the implant or can reconstitute session state. Endpoint migration requires a reachable reserve server or domain. Cross transport migration also requires both implant and server to support the second protocol and its encoding, authentication, and task format. The attacker need not control the firewall, but normally must anticipate target egress policy and accept health check traces, delay, and reserve infrastructure cost.
      defender_model:
        paragraphs:
          - zh: 防守方可以拥有终端进程网络事件、DNS 查询、网络连接状态、Web 代理/防火墙阻断日志及必要的时间同步，但并非每个部署都同时具备。终端侧 ProcessGuid 可把同一进程的多目的地串起；Zeek 的 conn、dns、http 日志可通过 uid、主机和时间复原不同协议片段。DNS 递归器、代理、NAT 与进程重启会改变关联键，因此应保留设备身份、进程谱系、前后地址和原始时间戳，至少覆盖正常回连周期与一次切换窗口。
            en: The defender may have endpoint process network events, DNS queries, network connection state, web proxy or firewall deny logs, and synchronized time, but deployments do not always collect all of them. A process GUID can join multiple destinations of one process; Zeek conn, dns, and http logs can reconstruct protocol fragments through uid, host, and time. Recursive DNS, proxies, NAT, and process restarts change join keys, so device identity, process lineage, pre and post translation addresses, and original timestamps should be retained over at least a normal callback cycle and one switch window.
          - zh: 这种观察模型不假设任何新目的地都是恶意，也不假设拒绝后换路必然是攻击。合法客户端、浏览器、更新器、CDN 和灾备代理都有相似序列；防守方需要进程/服务身份、批准的故障切换设计和新路径上的控制样式来区分。若只保留成功会话或只收一个协议，旧路径失败或新路径活动可能不可见；加密 DNS、终端覆盖缺口和短保留期还会削弱关联。
            en: This model does not assume that every new destination is malicious or that every handoff after a denial is adversarial. Legitimate clients, browsers, updaters, CDNs, and disaster recovery proxies have similar sequences. The defender needs process or service identity, approved failover design, and control like behavior on the new path to distinguish them. If only successful sessions or one protocol are retained, the old failure or new activity may be missing; encrypted DNS, endpoint coverage gaps, and short retention further weaken correlation.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary: {zh: 按失败条件把同一控制谱系分散到不同目的地或日志面, en: Disperse one control lineage across destinations or log surfaces after failure}
      analysis:
        paragraphs:
          - zh: 植入先在原路径留下健康检查、拒绝或超时，随后改向新端点或新协议恢复任务通信；这一设计把原本连续的控制操作分割到不同目的地计数器和日志类别。只按单目的地、单协议或短窗口汇总的防守方会将两段活动分开，降低各局部序列的量与连续性，从而增加重建攻击链的成本。DustySky、TinyTurla、QUADAGENT 和 ISMAgent 证明切换序列存在；“低于阈值”只能在具体检测窗口和背景流量下验证，不得由切换本身普遍推出。
            en: The implant leaves a health check, denial, or timeout on its old path and then resumes task communication at a new endpoint or over a new protocol. This design splits one continuous control operation across destination counters and log categories. A defender aggregating by one destination, protocol, or short window sees separate fragments with less local volume and continuity, increasing reconstruction cost. DustySky, TinyTurla, QUADAGENT, and ISMAgent establish the switch sequence; falling below a threshold requires validation against a specific rule window and background traffic and cannot be generalized from switching alone.
      evidence_keys: [B1-T1008-REF-ATTACK, B1-T1008-REF-DUSTYSKY, B1-T1008-REF-TINYTURLA, B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT]
      confidence: medium
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 从只监控原协议的传感器视野切到另一通信面, en: Shift from a sensor watching only the original protocol into another communication surface}
      analysis:
        paragraphs:
          - zh: 当植入在 Web 请求失败后改用 DNS 承载同一任务流时，Web 代理不再是完整观察点，后续片段转入 DNS 查询和响应。若组织对 DNS 仅保留解析摘要、没有终端进程对应关系，原来的代理规则可能不再触发，形成覆盖盲区；若 DNS 与终端遥测完整采集并能关联，这一机理不成立。QUADAGENT 与 ISMAgent 支持协议切换，Zeek 与 Sysmon 文档支持日志面差异，特定组织的监控缺口仍需本地验证。
            en: When an implant changes from failed web requests to carrying the same task stream in DNS, a web proxy ceases to be a complete observation point and later fragments enter DNS queries and responses. If the organization retains only summary DNS or lacks process joins, the former proxy rule may no longer fire, creating a coverage blind spot. Where DNS and endpoint telemetry are complete and correlated, this mechanism does not hold. QUADAGENT and ISMAgent support protocol switching, and Zeek and Sysmon document the distinct log surfaces; any particular organization's gap still needs local validation.
      evidence_keys: [B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT, B1-T1008-REF-ZEEK-DNS, B1-T1008-REF-SYSMON]
      confidence: low
proposed_subtechniques:
  - temporary_key: B1-T1008-SUB-ENDPOINT
    proposed_status: formal-candidate
    name: {zh: 条件式端点迁移, en: Conditional Endpoint Migration}
    stable_switch_variable: {zh: 原路径失败后选择另一预置 C2 端点，同时保持主要通信协议不变, en: Selection of another preconfigured C2 endpoint after primary failure while the main communication protocol remains the same}
    sibling_boundary: {zh: 若主要协议或日志类别改变，以跨遥测面切换项为主；DNS 计算新地址本身归 T1568，代理转发本身归 T1090, en: If the main protocol or log category changes, classify under cross telemetry failover; DNS computation of addresses itself belongs to T1568 and proxy forwarding itself to T1090}
    prerequisite: {zh: 同一植入保存有可用备用端点及响应判据，并可在失败后维持或重建会话, en: The same implant holds usable reserve endpoints and a response criterion and can maintain or rebuild its session after failure}
    scenario: {zh: 首选域名或 IP 对植入不可达，程序尝试另一个硬编码地址并继续收取指令, en: A preferred domain or IP becomes unreachable and the program tries another hardcoded address to continue receiving commands}
    causal_chain:
      zh: 失败触发的端点选择 → 旧域名或 IP 的连接停止并在另一个端点重现相似控制节律 → 单目的地规则和封锁只覆盖旧端点 → 同一植入的会话谱系被拆散；若已按进程跨端点关联，则匿迹收益消失。
      en: Failure driven endpoint selection → connections to the old domain or IP stop and a similar control cadence reappears at another endpoint → single destination rules and blocks cover only the old endpoint → one implant's session lineage fragments; process based cross endpoint joins remove the stealth benefit.
    evidence_keys: [B1-T1008-REF-DUSTYSKY, B1-T1008-REF-TINYTURLA]
    confidence: medium
    direct_defense_keys: [B1-T1008-DET-ENDPOINT, B1-T1008-MIT-CONTINUITY]
    content_scope_note:
      zh: DustySky 明确要求第一次健康检查没有 OK 才尝试第二域名；TinyTurla 逐一探测配置主机直至有响应。它们证明端点切换，不单独证明任何未知组织的检测阈值被规避。
      en: DustySky explicitly tries a second domain after the first health check lacks OK, and TinyTurla traverses configured hosts until one answers. These establish endpoint handoff, not evasion of an unknown organization's detection threshold.
  - temporary_key: B1-T1008-SUB-SURFACE
    proposed_status: formal-candidate
    name: {zh: 跨遥测面切换, en: Cross-Telemetry Failover}
    stable_switch_variable: {zh: 原通信方法失败后改用会进入另一类防守日志与解析管线的协议, en: Selection after primary failure of a protocol entering a different defender log and analysis pipeline}
    sibling_boundary: {zh: 协议只是变化但未用于 C2 恢复时不属此项；DNS 隧道实现归 T1572，协议种类归 T1071/T1095，条件式换路归本项, en: A changed protocol without restored C2 is outside this child; DNS tunneling mechanics belong to T1572, protocol choice to T1071 or T1095, and conditional handoff to this child}
    prerequisite: {zh: 植入和后端均实现两套通信方法，并能在替代协议上保留任务与身份状态, en: Both implant and backend implement two methods and can preserve task and identity state over the alternate protocol}
    scenario: {zh: HTTP 或 HTTPS 通道无法获得回应后，植入改用 DNS 查询承载任务和结果, en: After HTTP or HTTPS cannot obtain a response, the implant carries tasking and results in DNS queries}
    causal_chain:
      zh: Web 路径失败后的协议切换 → 原代理会话结束而 DNS 查询与应答承载控制数据 → 只在 Web 代理观察的规则失去后继流量 → 防守方必须跨协议和进程身份重建谱系；完整 DNS 检测会限制隐蔽性。
      en: Protocol handoff after web failure → the proxy session ends while DNS queries and answers carry control data → a rule confined to the web proxy loses subsequent traffic → the defender must reconstruct lineage across protocol and process identity; complete DNS monitoring limits concealment.
    evidence_keys: [B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT, B1-T1008-REF-ZEEK-DNS, B1-T1008-REF-SYSMON]
    confidence: medium
    direct_defense_keys: [B1-T1008-DET-SURFACE, B1-T1008-MIT-CONTINUITY]
    content_scope_note:
      zh: QUADAGENT 的 HTTPS→HTTP→DNS 顺序及 ISMAgent 的 HTTP→DNS 备用路径均由样本分析直接说明；“DNS 在防守方不可见”并非样本事实，而是须逐环境证明的条件。
      en: Sample analyses directly establish QUADAGENT's HTTPS to HTTP to DNS order and ISMAgent's HTTP to DNS backup path. DNS invisibility to a defender is an environmental condition to prove, not a fact established by the malware samples.
  - temporary_key: B1-T1008-SUB-TRUST
    proposed_status: defer
    name: {zh: 可信服务备用路径, en: Trusted-Service Reserve Path}
    stable_switch_variable: {zh: 失效后从自有基础设施转向正常业务常见的第三方服务, en: Failover from owned infrastructure into a third party service common in legitimate activity}
    causal_chain:
      zh: 备用服务上的流量可能获得不同的信誉与策略处理，但 Crutch 来源只说明存在 GitHub 恢复通道，尚未完整证明切换触发、实际使用和独立检测路径。
      en: Traffic on a reserve service could receive different reputation and policy treatment, but the Crutch source only establishes a GitHub recovery channel, not the complete activation trigger, observed use, and distinct detection path.
    evidence_keys: [B1-T1008-REF-CRUTCH]
    confidence: hypothesis
  - temporary_key: B1-T1008-SUB-TIME
    proposed_status: defer
    name: {zh: 延时备用激活, en: Delayed Reserve Activation}
    stable_switch_variable: {zh: 原控制中断后等待较长期限再启用另一路径, en: Waiting for a long interval after loss of control before enabling another path}
    causal_chain:
      zh: 延时可能打断短窗关联，但 Ebury 的三天无联络后启动 DGA 仅是一个样本线索，当前不足以划定与 T1568 独立、可复核的子类。
      en: Delay could defeat short window joins, but Ebury's DGA after three days without contact is one sample clue and does not yet define a reproducible child independent of T1568.
    evidence_keys: [B1-T1008-REF-ATTACK]
    confidence: hypothesis
defense_candidates:
  detection_strategies:
    - temporary_key: B1-T1008-DET-ENDPOINT
      name: {zh: 失败后同进程 C2 端点接续, en: Same-Process C2 Endpoint Continuity after Failure}
      objective:
        zh: 识别同一植入在原端点不可达之后通过另一端点恢复相似控制节律的序列，并关联旧、新端点，而非仅告警多个目的地。
        en: Identify one implant resuming a similar control cadence at a different endpoint after the former endpoint becomes unavailable, joining old and new endpoints rather than alerting on destination plurality.
      targets: [B1-T1008-PARENT, B1-T1008-SUB-ENDPOINT]
      domain: enterprise
      analytic_keys: [B1-T1008-NJA-ENDPOINT]
      evidence_keys: [B1-T1008-REF-DUSTYSKY, B1-T1008-REF-TINYTURLA, B1-T1008-REF-ZEEK-CONN, B1-T1008-REF-SYSMON]
    - temporary_key: B1-T1008-DET-SURFACE
      name: {zh: 失败后跨协议控制接续, en: Cross-Protocol Control Continuity after Failure}
      objective:
        zh: 将失败的 Web 类 C2 尝试与同一进程随后承载控制样式的 DNS 请求关联，确认通信面转换而非单独的 DNS 异常。
        en: Join failed web C2 attempts to DNS requests with control like shape from the same process, confirming a transport handoff rather than an isolated DNS anomaly.
      targets: [B1-T1008-PARENT, B1-T1008-SUB-SURFACE]
      domain: enterprise
      analytic_keys: [B1-T1008-NJA-SURFACE]
      evidence_keys: [B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT, B1-T1008-REF-ZEEK-CONN, B1-T1008-REF-ZEEK-DNS, B1-T1008-REF-SYSMON]
  detection_analytics:
    - temporary_key: B1-T1008-NJA-ENDPOINT
      strategy_key: B1-T1008-DET-ENDPOINT
      name: {zh: 旧端点失败到新端点回连的进程级关联, en: Process-Level Join from Failed to New C2 Endpoint}
      logic:
        zh: 对非浏览器、非已批准多端点客户端的同一 device_id 与 process_guid，在 24 小时历史中先确立重复访问的主端点；当该端点出现至少两次 TCP 拒绝/超时、代理拒绝或明确健康检查失败后，在 10 分钟内寻找新的非等价端点，要求新端点有响应字节且在随后 30 分钟出现再次回连或任务响应。输出原端点、失败证据、新端点、同一进程身份及节律相似度；没有可确认的 C2 语义时标为调查线索，不自动定性攻击。
        en: For the same device_id and process_guid outside browsers and approved multi endpoint clients, establish a recurrent primary endpoint in the preceding 24 hours. After at least two TCP rejects or timeouts, proxy denials, or explicit failed health checks against it, seek a non equivalent endpoint within 10 minutes. Require response bytes on the new endpoint and a further callback or task response within the next 30 minutes. Emit former endpoint, failure evidence, new endpoint, process identity, and cadence similarity. Without confirmable C2 semantics, label this an investigation lead rather than automatically calling it malicious.
      data_requirements:
        - source_type: endpoint_network
          name: {zh: 终端进程网络事件, en: Endpoint Process Network Events}
          channel: Sysmon Event ID 3 or equivalent EDR
          required_fields: [timestamp, device_id, process_guid, image, destination_ip, destination_port, protocol]
        - source_type: network_connection
          name: {zh: 网络连接状态, en: Network Connection State}
          channel: Zeek conn.log or equivalent flow
          required_fields: [ts, id.orig_h, id.resp_h, id.resp_p, proto, conn_state, orig_bytes, resp_bytes]
        - source_type: web_proxy_or_firewall
          name: {zh: Web 代理或防火墙决策, en: Web Proxy or Firewall Decision}
          channel: null
          required_fields: [timestamp, device_id_or_source_ip, destination, action_or_status]
      observables: [previously_recurrent_endpoint, failed_primary_connection, same_process_new_endpoint, response_bytes_on_new_endpoint, repeated_new_endpoint_callback]
      correlation: {window: '24h baseline; 10m switch; 30m confirmation', dimensions: [device_id, process_guid, process_image, destination_ip, destination_port, protocol, timestamp]}
      false_positives: [approved_application_failover, CDN_address_rotation, software_update_mirrors, browser_parallel_origins, proxy_health_recovery]
      blind_spots: [Sysmon_Event_3_disabled_by_default, no_process_identity_for_network_only_logs, NAT_or_proxy_breaks_host_join, long_sleep_exceeds_window, endpoint_event_gaps]
      tuning_guidance:
        zh: 从组织批准的应用—端点故障切换表建立精确例外，按进程家族和正常周期调节 10 分钟窗口；不要因为使用同一 CDN、云厂商或 HTTP 状态码就全局排除。失败证据缺失时降级为多端点调查线索。
        en: Build precise exceptions from approved application to endpoint failover maps and tune the 10 minute window by process family and normal callback interval. Do not globally suppress a CDN, cloud provider, or HTTP status code. Downgrade to a multi endpoint lead when failure evidence is missing.
      evidence_keys: [B1-T1008-REF-DUSTYSKY, B1-T1008-REF-TINYTURLA, B1-T1008-REF-ZEEK-CONN, B1-T1008-REF-SYSMON]
      logic_status: implementable_design_not_validated_on_local_data
    - temporary_key: B1-T1008-NJA-SURFACE
      strategy_key: B1-T1008-DET-SURFACE
      name: {zh: Web 失败后 DNS 控制形态的跨日志关联, en: Cross-Log Join of DNS Control Shape after Web Failure}
      logic:
        zh: 在同一 device_id 与 process_guid 上识别此前重复的 HTTP/HTTPS C2 候选连接，要求代理拒绝、TCP 失败或目标无响应；随后 15 分钟内查找该进程对相同注册域或经调查建立关系的域名发出的 DNS 查询。DNS 侧要求多次非单纯 A/AAAA 解析、异常长标签或重复编号标签以及有响应的双向序列，并输出 HTTP/DNS 的时间顺序、域名关系、查询类型与响应。固定阈值仅作为待校准初值，不能把长标签或 TXT 查询单独认定为隧道。
        en: On the same device_id and process_guid, identify a previously recurrent candidate HTTP or HTTPS C2 connection with proxy denial, TCP failure, or nonresponse. Within 15 minutes, seek DNS queries by that process to the same registrable domain or a domain whose relation has been established in investigation. Require multiple queries beyond ordinary A or AAAA resolution, unusually long or sequenced labels, and a response bearing sequence. Emit the HTTP to DNS timeline, domain relation, query types, and responses. Any fixed count is a tuning seed, and neither a long label nor TXT alone proves a tunnel.
      data_requirements:
        - source_type: endpoint_network_dns
          name: {zh: 终端进程网络与 DNS 事件, en: Endpoint Process Network and DNS Events}
          channel: Sysmon Event IDs 3 and 22 or equivalent EDR
          required_fields: [timestamp, device_id, process_guid, image, destination_ip, destination_port, protocol, query_name, query_result]
        - source_type: network_http
          name: {zh: Web 会话结果, en: Web Session Result}
          channel: Zeek http.log or enterprise proxy
          required_fields: [ts, id.orig_h, host, uri, status_code, uid]
        - source_type: network_dns
          name: {zh: DNS 查询与响应, en: DNS Query and Response}
          channel: Zeek dns.log or resolver log
          required_fields: [ts, id.orig_h, query, qtype_name, rcode_name, answers, uid]
      observables: [failed_web_path, same_process_dns_after_web_failure, related_dns_domain, repeated_or_sequenced_dns_labels, dns_answer_sequence]
      correlation: {window: '24h baseline; 15m switch; 30m DNS sequence', dimensions: [device_id, process_guid, source_ip, registrable_domain, timestamp, zeek_uid]}
      false_positives: [browser_captive_portal_probe, enterprise_proxy_failover_test, DNS_diagnostics, application_connectivity_checks, CDN_or_service_discovery]
      blind_spots: [encrypted_DNS_or_external_resolver, central_resolver_hides_original_process, HTTPS_status_unavailable_without_proxy, DNS_cache_suppresses_queries, non_Windows_process_join_not_covered]
      tuning_guidance:
        zh: 先按业务进程和批准域建立 DNS 查询基线；仅在 Web 失败与同进程 DNS 序列同时满足时提高优先级。针对 DNS over HTTPS、递归器和代理路径另接遥测；对普通浏览器只在明确异常进程谱系或非法服务身份下启用高危告警。
        en: Baseline DNS by business process and approved domains, and raise priority only when web failure and same process DNS sequence coexist. Add separate telemetry for DNS over HTTPS, recursive resolvers, and proxy paths. For ordinary browsers, require anomalous process lineage or unauthorized service identity before high severity alerting.
      evidence_keys: [B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT, B1-T1008-REF-ZEEK-DNS, B1-T1008-REF-ZEEK-HTTP, B1-T1008-REF-SYSMON]
      logic_status: implementable_design_not_validated_on_local_data
  mitigations:
    - temporary_key: B1-T1008-MIT-CONTINUITY
      name: {zh: 跨备用路径的出站约束与阻断连续性, en: Egress Constraint and Block Continuity across Reserve Paths}
      control_purpose:
        zh: 对设备/工作负载限定经批准的 Web、DNS 与其他外联路径，并在处置疑似 C2 时让阻断和调查作用于同一植入的所有可用路径，而非只封一个域名。
        en: Bound each device or workload to approved web, DNS, and other outbound paths, and during suspected C2 response apply containment and investigation to every usable path of the same implant rather than one domain.
      measures:
        - key: role_scoped_egress
          control_type: preventive
          action:
            zh: 按工作负载身份允许必要的外联协议与目的地；普通终端 DNS 只能使用受管递归器，受管递归器记录查询并对未经批准域执行策略，Web 走受控代理或等效端点策略。
            en: Permit necessary outbound protocols and destinations by workload identity. Ordinary endpoints use managed recursive resolvers only; those resolvers log queries and apply policy to unapproved domains, while web access traverses a controlled proxy or equivalent endpoint policy.
        - key: incident_scope_continuity
          control_type: containment
          action:
            zh: 当发现原 C2 路径时，联查该进程/设备近期已联系及失败后新联系的端点与协议；按设备隔离或精准进程/目的地规则同步处置备用路径，并验证 DNS 与代理日志中是否继续回连。
            en: On discovery of an original C2 path, join endpoints and protocols recently or subsequently contacted by the same process or device. Isolate the device or apply precise process and destination rules to reserve paths, then verify in DNS and proxy logs whether callbacks continue.
        - key: blocked_path_audit
          control_type: detective-support
          action:
            zh: 保留阻断决策、失败连接、DNS 查询与进程身份以核查封锁后换路；只保存允许会话会丢失切换触发证据。
            en: Retain block decisions, failed connections, DNS queries, and process identity to verify handoff after a block; retaining only allowed sessions loses the triggering evidence.
      applications:
        - target_key: B1-T1008-PARENT
          use: {zh: 以同一设备和植入谱系统一管理主、备用通道的出站许可与处置, en: Manage outbound permission and response for primary and reserve channels by the same device and implant lineage}
          expected_effect: {zh: 限制可用备用路径并使封锁后的切换进入共同审计, en: Reduce usable reserve paths and bring postblock switches into shared audit}
          limitations: {zh: 合法 SaaS 与浏览器访问需要细粒度例外；被盗受管进程或加密 DNS 仍可绕过部分控制, en: Legitimate SaaS and browser access needs precise exceptions; a compromised managed process or encrypted DNS can evade parts of the control}
        - target_key: B1-T1008-SUB-ENDPOINT
          use: {zh: 对单个植入的备用端点集合和失败后新目的地同步执行外联策略, en: Apply egress policy to the reserve endpoint set and postfailure new destinations of one implant together}
          expected_effect: {zh: 减少只封旧端点后成功恢复 C2 的机会, en: Reduce chances of restoring C2 after only the former endpoint is blocked}
          limitations: {zh: 未发现的备用端点不会被按 IoC 预封锁；基于进程的隔离需防止误伤合法多端点客户端, en: Unknown reserve endpoints cannot be preblocked by IoC and process based isolation must avoid disrupting legitimate multi endpoint clients}
        - target_key: B1-T1008-SUB-SURFACE
          use: {zh: 同时约束 Web 出口与直连 DNS，并在 Web 处置后检查 DNS 查询和结果回传, en: Constrain both web egress and direct DNS, then inspect DNS queries and result return after web containment}
          expected_effect: {zh: 阻断仅靠从 HTTP 切到 DNS 绕过 Web 控制的机会，并保留换路证据, en: Limit bypass of web controls by switching from HTTP to DNS and preserve handoff evidence}
          limitations: {zh: DNS 是必需基础服务，不能一概封闭；受管递归器也未必能看到 DNS over HTTPS 或应用层加密内容, en: DNS is necessary infrastructure and cannot simply be closed; managed resolvers may still miss DNS over HTTPS or encrypted application content}
      evidence_keys: [B1-T1008-REF-ATTACK, B1-T1008-REF-QUADAGENT, B1-T1008-REF-ISMAGENT, B1-T1008-REF-AWS-DNS-FW, B1-T1008-REF-MDE-NETWORK]
