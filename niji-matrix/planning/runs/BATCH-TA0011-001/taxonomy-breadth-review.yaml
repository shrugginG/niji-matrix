- source_attack_id: T1008
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: endpoint_identity_after_failure
      result: formal_candidate
      reason: DustySky and TinyTurla establish failure-driven endpoint selection; destination keyed detection has
        a distinct cross-endpoint join
    - axis: protocol_and_log_surface_after_failure
      result: formal_candidate
      reason: QUADAGENT and ISMAgent establish HTTP to DNS switch; web and DNS require different fields and controls
    - axis: third_party_service_trust_context
      result: deferred
      reason: Crutch shows GitHub recovery option but not sufficient trigger and actual handoff trace; T1102 overlap
        must be resolved
    - axis: delayed_activation_time
      result: deferred
      reason: Ebury summary suggests a long inactivity trigger but second original source and independent T1568
        boundary are missing
    - axis: proxy_route_selection
      result: adjacent_technique
      reason: Intermediary routing itself is T1090; if failure drives a switch, parent T1008 may co-occur without
        a proxy-named child
    - axis: dga_generated_endpoint
      result: adjacent_technique
      reason: Address generation is T1568; failover condition, if independently shown, stays with T1008 parent or
        observed child axis
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线没有 ATT&CK 子项，但仍从端点身份、协议遥测面、服务信誉、时间、代理路由与动态解析六个方向开放搜索。建议两个有样本级失败触发和独立防御差异的正式候选，其余延迟或归相邻技术，不按 ATT&CK
        子项数量反推 NJS。
      en: The baseline has no ATT&CK children, yet the search considered endpoint identity, protocol telemetry surface,
        service trust, time, proxy routing, and dynamic resolution. Two formal candidates have sample level failure
        triggers and distinct defense methods; others are deferred or belong to adjacent techniques. No NJS count
        is inferred from the ATT&CK inventory.
  primary_resolution: Two formal children NJS-0153-001/002; trusted service and delayed/DGA variants deferred.
