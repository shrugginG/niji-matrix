research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 5
    attack_subtechnique_ids: [T1071.001, T1071.002, T1071.003, T1071.004, T1071.005]
    represented_dimensions: [web_request_response, file_transfer_transaction, mailbox_delivery_and_client_access, dns_query_answer, publish_subscribe_broker_and_topic]
    breadth_trigger: examine_two_materially_different_axes
    coverage_resolutions:
      - {attack_id: T1071.001, resolution: parent-core, reason: 'HTTP application exchange is parent behavior; service-contract imitation is NJT-0152 and provider resource abuse is T1102; no web-named NJS'}
      - {attack_id: T1071.002, resolution: evidence-deferred, reason: 'Fixed ATT&CK inventory establishes FTP family but reviewed original material did not demonstrate a repeatable FTP task queue and a separate stealth axis; file delivery or exfil alone is insufficient'}
      - {attack_id: T1071.003, resolution: parent-core, adjacent: NJT-0152, reason: 'Outlook MAPI email command capability supports parent; hidden PDF content is message obfuscation; no separate mail-named NJS, and actual inbound command PDF was not captured'}
      - {attack_id: T1071.004, resolution: niji-variable-candidate, child_key: B2-T1071-SUB-MEDIATED, reason: 'Pisloader TXT query-answer plus DNS recursion illustrates split victim-side connection and downstream authoritative source; full qname still visible'}
      - {attack_id: T1071.005, resolution: niji-variable-candidate, child_keys: [B2-T1071-SUB-MEDIATED, B2-T1071-SUB-RECIPIENT], reason: 'Two original MQTT analyses show broker-separated controller and unique recipient topic; one WailingCrab version comparison establishes shared-topic visibility change'}
    candidate_stealth_axes_examined:
      - {axis: application_intermediary_controller_separation, result: formal_candidate, trace: 'Victim connects to resolver or broker; operator is on another service-side session', defense_difference: 'Requires resolver/broker transaction and endpoint join rather than direct C2 IP match'}
      - {axis: recipient_scoped_logical_addressing, result: formal_candidate, trace: 'One shared campaign topic replaced by per-client topics; subscription/publication graph fragments', defense_difference: 'Requires cross-topic graph and ACL audit rather than one topic monitor'}
      - {axis: victim_established_receive_session, result: parent-core, trace: 'DNS query or broker connection is victim originated', reason: 'Too general to stand alone; ordinary applications do this and distinct effects in supported examples derive from mediation or routing partition'}
      - {axis: service_contract_or_message_shape, result: adjacent-technique, owner: NJT-0152, reason: 'HTTP telemetry appearance, PDF hidden bytes, JSON/base64/XOR are message semantics or encoding, not protocol session topology'}
      - {axis: failure_triggered_protocol_change, result: adjacent-technique, owner: NJT-0153, reason: 'Switch after primary failure is the controlled variable there; T1071 may co-occur on each actual application session'}
      - {axis: public_service_reputation, result: adjacent-technique, owner: T1102, reason: 'Public broker trust can coexist but does not define protocol-native mediation; a private broker has the same route structure'}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 五个 ATT&CK 子项按媒介而非匿迹变量划分。已从会话方向、中介身份、接收地址、服务契约、换路和公共服务信誉检验至少两条性质不同的轴；仅中介分离与接收者地址分区具有样本级痕迹变化及差异化防御。FTP 暂无经本次独立审查足以建立子项的任务队列来源，不用数量配额补齐。
      en: ATT&CK's five children divide media rather than stealth variables. The search examined session direction, intermediary identity, recipient addressing, service contract, failover, and public-service reputation; only intermediary separation and recipient address partition have sample-level trace changes and distinct defenses. The reviewed material did not establish a separate FTP command-queue child, and a numerical quota must not fill the gap.
  evidence_coverage:
    parent_behavior_keys: [B2-T1071-REF-ATTACK-REUSE, B2-T1071-REF-WEKBY, B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-TURLA]
    boundary_keys: [B2-T1071-REF-T1102, B2-T1071-REF-T1095, B2-T1071-REF-T1572, B2-T1071-REF-TURLA]
    mechanism_support:
      - {mechanism: NM-BT, keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-RFC1034, B2-T1071-REF-WEKBY], level: direct_route_facts_plus_sensor_model_inference}
      - {mechanism: NM-ST, keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG], level: direct_version_visibility_statement_plus_independent_unique_topic_implementation}
    child_existence_support:
      - {child_key: B2-T1071-SUB-MEDIATED, keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-RFC1034, B2-T1071-REF-WEKBY]}
      - {child_key: B2-T1071-SUB-RECIPIENT, keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-MQTT5]}
    unsupported_or_deferred:
      - 'Pisloader displayed commands were sent by a mock DNS server; do not present them as captured actor tasking.'
      - 'Turla Outlook researchers obtained no actual incoming command PDF; capability and sample logic are not a field-observed command.'
      - 'MQsTTang attribution was revised by ESET in July 2025; avoid unqualified Mustang Panda actor labels.'
      - 'No cited source measures detection sensitivity, false-positive rate, or local threshold; analytic windows are starting hypotheses.'
      - 'FTP as a distinct stealth child remains deferred pending original repeatable tasking evidence and observation differential.'
      - 'Public third-party broker logs may be unavailable to a tenant; full publisher-subscriber correlation then cannot be claimed.'
      - 'EMQX Log Trace is scoped and time-limited; prospective full-topic analytics require configured Rule Engine exports, not just an ad hoc trace.'
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父与两个子候选均按定义、痕迹、正常反例与邻接边界、场景、攻防模型、机理和限制逐项撰写。主 Agent 应在正式写入前决定是否保留两子项，并按正式 Schema 和共享库复用决议重排字段；本暂存文本不能直接当作已经质量验收的正式对象。
      en: Parent and both child candidates address definition, traces, normal counterexamples and adjacent boundaries, scenarios, attacker and defender models, mechanism, and limitations separately. The primary agent should decide whether both children survive and reorder content to the formal schema and shared-library resolutions; this staging text is not an already validated canonical object.
  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [manual_staging_yaml_serialization, yaml_syntax_check]}
  limitations:
    paragraphs:
      - zh: 样本和事件分析证明这些协议交互或程序逻辑存在，并在 WailingCrab 中提供共享主题到私有主题的可见性比较；它们不提供本地网络的许可清单、日志完整度、告警阈值或实际被规避的防守产品。中介控制端分离与跨主题关联成本因此是有条件的传感器模型推断，须在目标部署中验证。MQTT 在不使用 IoT 的办公网可能比普通 Web 更显眼。
        en: Sample and incident analyses establish these protocol exchanges and program logic, and WailingCrab provides a direct shared-to-private-topic visibility comparison. They do not provide a local network's allowlist, log completeness, alert thresholds, or a measured evaded defensive product. Intermediary controller separation and cross-topic correlation cost are therefore conditional sensor-model inferences requiring validation in the target deployment. MQTT may stand out more than web traffic in an office network without IoT use.
      - zh: Zeek、Sysmon、EMQX 与 AWS 文档只证明字段和控制功能的条件性可获得性；EMQX 持续图谱需预配置 Rule Engine 事件导出，Log Trace 只能按指定客户端或主题限时取证；Sysmon Event 3 默认关闭，外部 broker 通常不给租户完整发布者日志，递归器缓存和加密 DNS 会改变可见层。研究中的数字主题、TXT 答案、时序窗口和 24 小时图谱均不可作为跨组织固定阈值；授权设备主题、软件更新、邮件业务和系统遥测必须进入本地误报评估。
        en: Zeek, Sysmon, EMQX, and AWS documentation only establish conditional availability of fields and controls. Continuous EMQX graph analysis requires preconfigured Rule Engine event exports; Log Trace is scoped and time-limited. Sysmon Event 3 is off by default, external brokers often do not provide tenants complete publisher logs, and resolver caching or encrypted DNS changes visibility. Numeric topics, TXT answers, timing windows, and the 24-hour graph are not cross-organization fixed thresholds; authorized device topics, software updates, mail business, and system telemetry require local false-positive assessment.
  rejected_mechanisms:
