handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-002
work_item_ref: WORK-TA0011-T1071
temporary_key_prefix: B2-T1071
candidate:
  source_type: attack
  source_attack_id: T1071
  name: {zh: 应用层协议, en: Application Layer Protocol}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: ATT&CK Enterprise 19.1 的 T1071 锚定以应用层协议承载命令和结果的 C2 行为；Wekby pisloader 的 DNS 请求与 TXT 回复、WailingCrab 和 MQsTTang 的 MQTT 发布订阅，以及 Turla 的 Outlook 邮件控制均有原始分析支持。Niji 应保留该行为锚，但将正式范围收窄至攻击者有意借用环境中可达的应用会话、协议中介或协议地址空间，使 C2 的网络入口、控制者归属或跨受害者关联发生可说明的观察差。协议名称、端口或普通 TLS 本身不足以证明匿迹。
        en: Enterprise ATT&CK 19.1 anchors T1071 in application-protocol carriage of C2 commands and results. Original analyses document DNS request and TXT response in Wekby pisloader, MQTT publish and subscribe in WailingCrab and MQsTTang, and Outlook mail control in Turla. Niji should preserve that behavior anchor while restricting formal scope to deliberate use of a reachable application session, protocol intermediary, or protocol address space that changes the defender's view of entry direction, controller attribution, or correlation across victims. A protocol name, port, or ordinary TLS alone does not establish stealth.
      - zh: 选择 adapt 的原因是 ATT&CK 的五个子项按协议族划分，而这些族并不等于五种独立的匿迹变量。现有 NJT-0152 已覆盖消息内容与服务契约伪装，NJT-0153 覆盖故障触发换路。本候选只处理持续命令交换的应用会话组织方式；共享库和正式子项在主 Agent 复核后才能确定。
        en: Adapt is appropriate because ATT&CK's five children divide protocol families, which are not five independent stealth variables. NJT-0152 already owns message content and service-contract camouflage, while NJT-0153 owns failure-triggered path changes. This candidate concerns the organization of application sessions for continuing command exchange. Final shared-library and child decisions remain for primary-agent review.
  scope_notes:
    zh: 未经独立 C2 任务或结果证据确认的正常 HTTP、DNS、邮件、FTP、MQTT 事件不准入；单次恶意文件下载或纯外传不作为本项 C2。正式候选不依赖公共服务信誉，公共 broker 的服务滥用可与 T1102 并列记录。
    en: Ordinary HTTP, DNS, mail, FTP, and MQTT events without independent tasking or result evidence are not admitted; a one-time malicious download or pure exfiltration does not by itself establish this C2 object. The formal candidate does not depend on a public service's reputation; abuse of a public broker may be recorded concurrently under T1102.
proposed_content:
  name: {zh: 应用会话承载指挥控制, en: Application-Session C2 Carriage}
  summary:
    zh: 攻击者利用可达的应用协议会话交换命令及结果，并通过会话方向或协议中介改变防守方可见的控制关系。
    en: An adversary exchanges commands and results through reachable application-protocol sessions while session direction or protocol mediation changes the control relationship visible to defenders.
  definition_and_concept:
    paragraphs:
      - zh: 应用会话承载指挥控制指植入体和控制端按实际应用协议的交互规则收发任务、载荷指令或执行结果。受害端可能先发出 Web 请求或 DNS 查询，先连接到消息 broker 并订阅主题，或在邮件客户端可读取的邮箱中处理指令。其直接目的在可到达的应用服务路径上维持双向或分阶段控制，而不是仅把任意字节放在 80、443 或 53 端口。
        en: Application-Session C2 Carriage covers an implant and controller exchanging tasks, payload instructions, or execution results according to a real application protocol's interaction rules. The victim may issue a web request or DNS query, connect to a message broker and subscribe to a topic, or process instructions in a mailbox accessible to a mail client. Its direct purpose is continuing bidirectional or staged control on a reachable application-service path, rather than merely placing arbitrary bytes on ports 80, 443, or 53.
      - zh: 本概念的匿迹成立条件是应用层交换改变了防守方通常能看到的关系。受害主机只连到递归解析器或消息 broker 时，单凭五元组不能还原后端控制者；控制消息借受害端已建立的会话进入时，单纯筛查外部主动入站连接也会遗漏。需要把协议事务、进程或设备身份、消息方向和后继命令执行结合起来，才可从普通服务流量中判别 C2。
        en: Stealth in this concept requires the application exchange to change a relationship normally visible to a defender. When a victim contacts only a recursive resolver or message broker, a five-tuple alone cannot reconstruct the back-end controller. When commands arrive through a victim-established session, checks limited to unsolicited inbound connections also miss them. Protocol transactions must be joined to process or device identity, message direction, and subsequent command execution to distinguish C2 from normal service traffic.
  stealth_characteristics:
    paragraphs:
      - zh: 应用协议会产生真实而非伪造的请求、回复、订阅、发布或邮件投递记录，因此外层协议验证可以通过。其可控变量是会话由谁建立、控制者是否经协议中介分离、收件或主题地址是否按受害者分区。WailingCrab 的公共 broker 使受害端连接到 broker 而非操作者，后续从共享活动主题转为每客户端主题又削弱了只监视共享主题的关联能力；MQsTTang 独立显示了控制端和植入体通过不同主题交换命令与结果。
        en: Application protocols produce real requests, replies, subscriptions, publications, or mail deliveries, so outer protocol validation may pass. The controllable variables are who establishes the session, whether the controller is separated by a protocol intermediary, and whether recipient or topic addresses are partitioned by victim. WailingCrab's public broker puts the victim in contact with the broker rather than the operator, and its later move from a shared campaign topic to per-client topics weakens correlation that watches only the shared topic. Independently, MQsTTang shows a controller and implant exchanging commands and results over different topics.
      - zh: 匿迹并不意味着无线索。DNS 问题名、类型和答案、Web 请求路径、邮件消息 ID 与附件、broker 的客户端 ID 和主题、以及端点上的进程和执行结果可形成残余链。协议默认允许的环境与监测位置决定收益：在不使用 MQTT 的办公网，新的 broker 连接反而显眼；受管解析器记录完整问题名时，DNS 中介只隐藏直连 IP，不能隐藏可疑域名或负载形态。
        en: Stealth does not remove evidence. DNS question names, types, and answers; web paths; mail message IDs and attachments; broker client IDs and topics; and endpoint processes and execution outcomes leave a residual chain. Benefit depends on which protocols are allowed and where sensors sit. A new broker connection can stand out in an office network with no MQTT use. A managed resolver that records full question names leaves suspicious domains and payload shapes visible even though the victim does not connect directly to an authoritative server IP.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入需要同时证明实际应用协议事务、持续或可重复的控制任务/结果关系，以及该事务如何改变防守观察。仅以 curl 或 FTP 下载一次可执行文件属于交付或暂存；只有文件被周期性读作命令队列并据此执行，才进入本项。仅把原始 TCP 包放在常见端口而不遵循应用语义应归 T1095；将完整内层协议会话封装在外层协议以跨越边界应另评 T1572。
        en: Inclusion requires a real application-protocol transaction, a continuing or repeatable task-and-result relationship, and an explanation of how that transaction changes defender observation. A single executable fetched by curl or FTP is delivery or staging; a file periodically read as a command queue and acted upon may qualify. Raw TCP placed on a common port without application semantics belongs with T1095, while encapsulation of an intact inner protocol session across a boundary calls for separate T1572 analysis.
      - zh: T1102 以滥用现成外部 Web 服务及其资源为中心，本项以应用协议事务和中介路由关系为中心；公共 MQTT broker 同时满足两者时可并列标注，不能以服务信誉作为本项子技术定义。NJT-0152 负责命令字节在图像、JSON、PDF 或服务字段内的表征与伪装；T1132/T1573 分别负责编码与密码保护；NJT-0153 负责在失败条件后换目的地或协议。正常浏览、解析、邮件、文件传输及 IoT 遥测是必须用进程、授权服务和后继执行排除的反例。
        en: T1102 centers on an existing external Web service and its resources; this object centers on application transactions and protocol routing relationships. A public MQTT broker can satisfy both, but service reputation cannot define this object's child taxonomy. NJT-0152 owns representation or disguise of command bytes inside images, JSON, PDFs, or service fields; T1132 and T1573 own encoding and cryptographic protection; NJT-0153 owns destination or protocol changes after failure conditions. Normal browsing, resolution, mail, file transfer, and IoT telemetry are counterexamples that must be excluded using process identity, approved service context, and subsequent execution.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在只允许受管 DNS 出口的环境中，植入体可向攻击者控制的域发送查询，并从 TXT 答案取得任务；Wekby pisloader 的样本逻辑和研究者搭建的模拟 DNS 服务器展示了这种往返。若环境允许消息 broker，植入体可向 broker 发布登记或结果并订阅接收任务的主题；IBM 的 WailingCrab 分析和 ESET 的 MQsTTang 分析说明了不同的主题结构与后继执行。Turla 的 Outlook 案例表明邮件客户端及其邮箱也可承载控制，但其 PDF 内隐藏命令应并行交由 NJT-0152 分析。
          en: In an environment limited to managed DNS egress, an implant may query an actor-controlled domain and obtain tasks from TXT answers; Wekby pisloader sample logic and a researcher-built DNS server demonstrate the round trip. Where a message broker is reachable, an implant can publish registration or results to the broker and subscribe to a task topic; IBM's WailingCrab and ESET's MQsTTang analyses show different topic structures and subsequent execution. Turla's Outlook case shows that a mail client and mailbox can also carry control, while concealed commands in its PDFs should be analyzed concurrently under NJT-0152.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需控制植入体的协议客户端行为及可下发任务的一侧，并掌握目标环境至少一条可达应用服务路径。DNS 需要受控域及可返回指定记录的权威端；broker 模式需要可发布和订阅相应主题的账户或匿名权限，并协调植入与控制端的主题标识；邮件模式需要可投递或读取目标邮箱的路径。所选中介若实施鉴权、主题 ACL、速率约束或日志留存，会提高攻击成本并留下可核查记录。
            en: The actor must control the implant's protocol-client behavior and a tasking endpoint, with at least one reachable application-service path in the target environment. DNS needs an actor-controlled domain and authoritative responses; broker operation needs accounts or anonymous permission to publish and subscribe to matching topics and a way to coordinate their identifiers; mail needs a route for delivery to or reading from a target mailbox. Intermediary authentication, topic ACLs, rate limits, and retained logs raise cost and create reviewable records.
      defender_model:
        paragraphs:
          - zh: 防守方可能有端点进程与网络连接事件、Zeek DNS/HTTP/连接日志，以及自营解析器、邮件平台或 broker 的事务日志。能把设备和进程映射到 DNS 问题、邮件项目或 broker 客户端/主题，并追踪响应后的子进程与文件变化时，可以重建命令谱系。只有流量五元组、外部公共 broker 不共享日志、TLS 未解密或被劫持的合法进程时，结论分别限于路径异常、关联猜测或需结合主机取证；不得声称已见操作者身份或命令内容。
            en: A defender may have endpoint process and network events, Zeek DNS, HTTP, and connection logs, and transaction logs from managed resolvers, mail platforms, or brokers. Joining devices and processes to DNS questions, mail items, or broker clients and topics, then tracing child processes and file changes after replies, can reconstruct task lineage. With only five-tuples, an external public broker that does not share logs, opaque TLS, or a compromised legitimate process, conclusions are limited to route anomalies, tentative correlation, or host forensics; the operator's identity or command content must not be claimed.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 应用事务使控制端脱离常规直连观察, en: Application transactions move the controller beyond direct-link observation}
      analysis:
        paragraphs:
          - zh: 攻击者让受害端按真实协议向解析器或 broker 请求、订阅或发布，再由服务返回或转发控制信息。受害端网关看到的是批准或可到达的应用服务，单一连接目的地不能证明真实下令者；只检查外部主动入站连接或直连恶意 IP 的规则因观察层不足而漏掉控制关系。DNS 完整问题名和 broker 主题仍可保留归属线索，故该机理只在相应监控缺口存在时成立。
            en: The actor has the victim request, subscribe, or publish through a real protocol to a resolver or broker, which returns or forwards control information. A victim-side gateway sees a reachable application service, and one connection destination cannot identify the actual issuer. Rules limited to unsolicited inbound connections or direct malicious IP contact miss the control relationship at that observation layer. Full DNS questions and broker topics can still preserve attribution clues, so the mechanism depends on a real monitoring gap.
      evidence_keys: [B2-T1071-REF-WEKBY, B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-RFC1034]
      confidence: medium
    - mechanism_ref: NM-ST
      role: secondary
      summary: {zh: 按接收者划分的地址拆散共享控制痕迹, en: Recipient-scoped addresses fragment shared control traces}
      analysis:
        paragraphs:
          - zh: 攻击者将原可在共享主题观察的控制流量改为每受害者独立主题，使单一主题订阅和按主题汇总不再看到全部客户端。IBM 报告直接比较了 WailingCrab 前后版本的观察差，ESET 报告则独立描述 MQsTTang 的唯一客户端主题。痕迹仍在 broker 的主题、客户端和发布订阅记录中，但防守需要跨主题、客户端与进程重建，而不能将一条公共主题当成全体控制活动。
            en: The actor moves activity previously visible on a shared topic to recipient-specific topics, so one topic subscription or topic-keyed aggregate no longer sees every client. IBM directly compares observer visibility across WailingCrab versions, while ESET independently documents MQsTTang's unique client topic. Broker topic, client, and publish-subscribe records retain traces, but defenders must reconstruct across topics, clients, and processes rather than treat one public topic as the whole control operation.
      evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-MQTT5]
      confidence: medium
  subtechnique_taxonomy:
    coverage: established
    proposed_child_keys: [B2-T1071-SUB-MEDIATED, B2-T1071-SUB-RECIPIENT]
    narrative:
      paragraphs:
        - zh: 拟议两个原生子项以不同可控变量区分：协议中介分离改变受害端网关所见目的地与实际控制端之间的关系，需要跨服务端或主机日志恢复控制谱系；按接收者分区控制地址改变多个受害者是否汇入同一可见主题或队列，需要跨地址空间聚合。二者可在同一 MQTT 案例共存，但前者即使只有一个共享主题仍成立，后者即使 broker 身份已知仍使共享主题观察失效。
          en: Two proposed native children use distinct controllable variables. Protocol intermediary separation changes the relationship between the destination visible at the victim gateway and the actual controller, requiring cross-service or host-log lineage recovery. Recipient-scoped control addressing changes whether multiple victims share one observable topic or queue, requiring aggregation across an address space. Both can coexist in an MQTT case, but the first applies even with one shared topic, while the second can defeat shared-topic observation even when the broker's identity is known.
        - zh: 不建议再按 Web、文件传输、邮件、DNS、发布订阅各建 NJS；它们是实现媒介。受害端发起会话曾作为第三轴检验，但大量正常应用同样如此，若没有额外中介或方向观察差，它只是父级的连接事实；编码、加密、消息伪装和失败后的协议切换已有邻接对象，不以本技术子项重复。
          en: Web, file transfer, mail, DNS, and publish-subscribe should not each become a Niji child; they are implementation media. Victim-originated sessions were examined as a third axis, but ordinary applications use the same role, and without an additional intermediary or direction-specific observation gap it is a parent-level connection fact. Encoding, encryption, message disguise, and post-failure protocol switches already have adjacent owners and should not be duplicated as children here.
proposed_subtechniques:
  - key: B2-T1071-SUB-MEDIATED
    name: {zh: 协议中介分离控制端, en: Protocol-Intermediary Controller Separation}
    summary:
      zh: 攻击者经应用协议规定或支持的解析器、broker 或消息路由节点收发控制，使受害端所连服务与实际下令者分离。
      en: An actor exchanges control through a resolver, broker, or message-routing node supported by the application protocol, separating the service contacted by the victim from the actual task issuer.
    stable_variable: whether_the_application_session_terminates_at_an_intermediary_before_reaching_the_controller
    trace_change: victim_side_five_tuple_names_intermediary_while_controller_side_exists_in_other_logs
    defender_observation_difference: direct_destination_rules_lose_controller_identity_and_require_cross_vantage_correlation
    prerequisites: reachable_resolver_broker_or_mail_route_and_actor_control_of_downstream_tasking
    evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-WEKBY, B2-T1071-REF-RFC1034]
    confidence: medium
    definition_and_concept:
      paragraphs:
        - zh: 协议中介分离控制端是攻击者让植入体与解析器、broker 或消息路由节点完成应用层会话，再由该节点取回或转送攻击者的命令和结果。植入体无需知道控制端的直连 IP；定义重点是会话终点与实际下令者被中介分开，而不是中介是否有信誉或是否为公共云服务。IBM 和 ESET 分别在 WailingCrab 与 MQsTTang 中观察到植入只连公共 MQTT broker，而控制端通过主题发布任务。
          en: Protocol-Intermediary Controller Separation occurs when an actor has the implant complete its application session with a resolver, broker, or message-routing node that retrieves or forwards commands and results. The implant need not know the controller's direct IP. The defining point is separation between session endpoint and task issuer, regardless of the intermediary's reputation or whether it is a public cloud service. IBM and ESET independently observed WailingCrab and MQsTTang implants connect to a public MQTT broker while the controller issued tasks through topics.
    stealth_characteristics:
      paragraphs:
        - zh: 受害端网络日志中的目的地是中介，攻击者真实控制端的地址、账户或发布会话位于另一观察域，因而只按受害端五元组关联恶意控制 IP 会遗漏关系。DNS 经递归解析器取 TXT 的情形也有此分层，但问题名仍可能指向攻击者控制域；不能把 IP 分离夸写成域名或命令内容完全不可见。broker 的客户端 ID、主题和消息方向以及端点执行仍是残余线索。
          en: Victim-side network logs name the intermediary as destination, while the actor's controller address, account, or publishing session sits in another observation domain. Correlation based only on victim five-tuples and malicious controller IPs therefore misses the relationship. DNS TXT retrieval through a recursive resolver has a similar layering, but the question name may still identify an actor domain; IP separation must not be overstated as complete concealment of the domain or command. Broker client IDs, topics, message direction, and endpoint execution remain as residual evidence.
    scope_boundary_definition:
      paragraphs:
        - zh: 本子项要求实际协议中介在控制交换链中终止或转送事务，且防守方所见目的地与下令端不同。普通企业代理仅转发内层通道时应核对 T1090/T1572；第三方网站内容或 API 资源本身承担死信箱时应核对 T1102；公共 broker 可与 T1102 并列，但这里的判断不依赖服务知名度。只在 HTTP 请求中伪造客户端头字段归 NJT-0152，DNS 查询名称本身也不能单独证明控制。
          en: This child requires a real protocol intermediary to terminate or forward a transaction in the control exchange, with the defender-visible destination differing from the task issuer. An ordinary enterprise proxy forwarding an inner channel calls for T1090 or T1572 review; a third-party website's content or API resource serving as a dead drop calls for T1102 review. A public broker can coexist with T1102, but this classification does not depend on service popularity. Forging client headers inside an HTTP request belongs to NJT-0152, and a DNS question name alone does not prove control.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 在允许 MQTT 的设备网中，植入体连接 broker、订阅任务主题并发布心跳或结果；控制端另连 broker 发送命令。另一种受限网络中，植入经受管解析器发送查询并从攻击者权威 DNS 的答案获得指令。两种场景都须确认命令后的进程或设备动作，避免把正常事件总线与 DNS 配置查询误判为 C2。
            en: On a device network permitting MQTT, an implant connects to a broker, subscribes to a task topic, and publishes keepalives or results while the controller separately connects to the broker to send commands. In another restricted network, an implant queries through a managed resolver and receives instructions from an actor-controlled authoritative DNS answer. Both scenarios require confirmation of process or device action after task delivery, so ordinary event buses and DNS configuration lookups are not mistaken for C2.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要可达中介和可控制下游答案或发布的一侧；若使用公共 broker，可不运维 broker，但需协调主题及权限。若受害方管理 broker 或解析器、限制非批准客户端并保留路由日志，操作者会留下身份和时间关联。被封的中介可能直接中断控制，且源端并非必然被遮蔽。
              en: The actor needs a reachable intermediary and control of downstream answers or publications. A public broker avoids operating the broker but still requires coordinated topics and permissions. When the defender manages the broker or resolver, limits unauthorized clients, and retains routing logs, the operator leaves identity and timing links. Blocking the intermediary can interrupt control, and source identity is not necessarily hidden.
        defender_model:
          paragraphs:
            - zh: 防守方至少可见受害设备、进程、目的地、时间和连接方向；若掌握 broker 的发布订阅事件或解析器的完整查询与答案，可把中介两侧用主题、事务 ID、时间和设备身份连接起来。对外部公共 broker 没有服务日志时，只能根据不合业务角色的进程连接、会话形态及后继执行提出候选，不应声称恢复了发布者。
              en: The defender at minimum sees victim device, process, destination, time, and connection direction. With broker publish-subscribe events or full resolver queries and answers, the two sides of mediation can be linked by topic, transaction ID, time, and device identity. Without service logs from an external public broker, process-to-service mismatch, session shape, and subsequent execution support a candidate finding but not a claim to have identified the publisher.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary: {zh: 中介服务遮断受害端到控制端的直连, en: Intermediary service breaks the victim-to-controller direct link}
        analysis:
          paragraphs:
            - zh: 植入体仅与协议中介建连，中介按查询、订阅或邮箱投递把任务送回；网关因此只显示中介 IP，原以直连恶意端点或外部主动入站为边界的检测缺少实际下令者。broker 或解析器日志若保留路由键仍可恢复控制谱系，因此收益依赖日志边界而非协议名称。
              en: The implant connects only to the protocol intermediary, which returns tasks by query, subscription, or mailbox delivery. The gateway therefore shows the intermediary IP, leaving detectors keyed to direct malicious endpoints or unsolicited inbound connections without the actual issuer. Broker or resolver logs can restore the lineage when routing keys are retained, so the benefit depends on a logging boundary rather than a protocol name.
        evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-WEKBY, B2-T1071-REF-RFC1034]
        confidence: medium
    research_limitations:
      paragraphs:
        - zh: 两个原始 MQTT 案例确证 broker 分离控制端，但并未测量任一具体防守网络的告警遗漏率；Wekby 案例中的 DNS 问题名和 TXT 数据仍可能可见。邮件基础设施可能保留完整发件人与消息 ID，不应假设每种中介都隐匿操作者。外部 broker 无日志共享时，提出的跨两侧关联分析不能完整实施。
          en: Two original MQTT cases establish controller separation by a broker but do not measure missed-alert rates in any specific defender network. DNS question names and TXT data in Wekby can remain visible. Mail infrastructure may retain sender and message IDs, so intermediary use cannot be assumed to hide the operator in every case. Cross-side correlation cannot be fully implemented when an external broker does not share logs.
  - key: B2-T1071-SUB-RECIPIENT
    name: {zh: 按接收者分区控制地址, en: Recipient-Scoped Control Addressing}
    summary:
      zh: 攻击者把命令投送地址从共享频道划分为每植入独立的主题或收件标识，使单地址观察无法聚合整组控制活动。
      en: An actor divides command-delivery addresses from a shared channel into per-implant topics or recipient identifiers, preventing one-address observation from aggregating the whole control set.
    stable_variable: shared_versus_recipient_specific_logical_delivery_address
    trace_change: one_campaign_wide_topic_is_replaced_by_many_client_specific_topic_and_subscribe_records
    defender_observation_difference: single_topic_monitoring_loses_campaign_coverage_and_cross_topic_graph_join_becomes_necessary
    prerequisites: addressable_application_bus_and_coordinated_recipient_identifiers
    evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-MQTT5]
    confidence: medium
    definition_and_concept:
      paragraphs:
        - zh: 按接收者分区控制地址指攻击者让每个植入体在应用层消息路由空间使用独立的接收地址，并把下发命令与回传结果映射到这些地址，而非让所有植入共享一条可监视的频道。地址可以是 broker 主题或具备同等投递语义的队列/收件标识；子项定义的是分区变量和跨受害者观察差，而不是 MQTT 名称。IBM 直接记录 WailingCrab 从活动共享主题转向三个每客户端主题，ESET 独立记录 MQsTTang 的唯一客户端任务主题。
          en: Recipient-Scoped Control Addressing means the actor gives each implant a separate receive address in an application message-routing space and maps tasking and result return to those addresses rather than a single observable channel shared by every implant. The address may be a broker topic or an equivalent queue or recipient identifier; the child is defined by partitioning and cross-victim observation difference, not by MQTT. IBM directly reports WailingCrab's shift from a shared campaign topic to three per-client topics, and ESET independently reports MQsTTang's unique client task topic.
    stealth_characteristics:
      paragraphs:
        - zh: 分区后每条主题的局部记录仍可完整，但只订阅旧共享主题或以共享主题为检索键的研究者看不到其他植入的下发与回传，活动被散到多个逻辑地址。WailingCrab 报告明确指出新版本移除了公共主题而降低外部观察者覆盖；MQsTTang 的客户端主题与服务器主题分开，提供了另一种角色分区。broker 层如有全量主题、客户端 ID 和发布时间，仍可恢复图关系；单凭随机数字主题不能判断恶意。
          en: Each local topic record may remain intact, but an investigator subscribed only to an old shared topic or searching by that topic misses delivery and return for other implants; activity is distributed across logical addresses. IBM explicitly notes that WailingCrab's newer version removed the communal topic and reduced outside observer visibility. MQsTTang separates client and server topics, providing another routing partition. Full broker topic, client ID, and publication-time data can still restore the graph. A random numeric topic by itself does not establish malice.
    scope_boundary_definition:
      paragraphs:
        - zh: 本子项要求有受害者特定接收地址与共享频道、宽泛订阅或跨受害者汇总之间的可比较观察差；普通 IoT 每设备主题、邮件个人邮箱和正常作业队列均是反例。仅用 broker 隐藏真实控制 IP 属兄弟“协议中介分离控制端”；更改主题中的 Base64/XOR 或消息字段归 T1132/T1573/NJT-0152；故障后切到另一个 broker 属 NJT-0153。若来源只证明独立地址而无降低共享观察的推断基础，正式置信度应降为 hypothesis。
          en: This child requires a victim-specific receive address and a demonstrable observation difference from a shared channel, broad subscription, or cross-victim aggregate. Legitimate per-device IoT topics, personal mailboxes, and ordinary job queues are counterexamples. Hiding the controller IP through a broker belongs to the sibling Protocol-Intermediary Controller Separation. Base64, XOR, or field disguise in topic messages belongs to T1132, T1573, or NJT-0152; switching brokers after failure belongs to NJT-0153. If a source proves only unique addresses without a defensible shared-visibility difference, formal confidence should fall to hypothesis.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 当植入规模从单机扩大到多机时，操作者可让注册阶段为每设备生成主题，控制端按标识向各主题发布任务。WailingCrab 新版在 HTTP 注册阶段共享三个标识，随后用不同主题收命令、发心跳和报告结果；MQsTTang 使用唯一客户端主题收命令并经服务器主题回报。分析必须把注册事件、主题订阅、入站发布与后继进程动作接成同一设备谱系。
            en: As an implant set grows beyond one host, the operator can assign a topic per device during registration and publish tasks by identifier. Newer WailingCrab shares three identifiers during HTTP registration, then uses different topics for command receipt, check-in, and results. MQsTTang receives commands on a unique client topic and reports through a server topic. Analysis needs to join registration, topic subscription, inbound publication, and subsequent process action into one device lineage.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需在植入与控制端协调唯一地址，可能经预置、HTTP 注册或 broker 元数据传递；地址越多，运营和授权管理越复杂，也增加 broker 侧异常图谱。随机主题名称只提高未知观察者发现其他植入的成本，不能阻止持有全量 broker 日志或宽泛订阅权限的防守方，也不替代加密。
              en: The actor must coordinate unique addresses between implants and the controller, through preconfiguration, HTTP registration, or broker metadata. More addresses complicate operation and authorization and create a larger anomalous graph at the broker. Random topic names raise the cost for an uninformed outside observer to find other implants, but do not defeat defenders with complete broker logs or broad subscription rights and do not replace encryption.
        defender_model:
          paragraphs:
            - zh: 防守方能取得受管 broker 的 client_id、username、source_ip、topic、action、timestamp 与授权决策，最好还能取得 HTTP 注册的连接 uid 和主机进程 GUID。以设备/进程和注册标识关联跨主题操作，再在命令发布后的本机执行和结果发布上确认控制关系。若 broker 在外部且无可用事件日志，主题分区通常无法在网关 TLS 元数据中区分，只能用端点与服务许可异常作为弱信号。
              en: The defender can obtain client_id, username, source_ip, topic, action, timestamp, and authorization decisions from a managed broker, ideally alongside HTTP registration connection UID and host process GUID. Joining cross-topic operations by device, process, and registration identifier, then confirming execution after task publication and result publication, establishes the control relationship. If the broker is external and event logs are unavailable, gateway TLS metadata usually cannot distinguish topic partitioning; endpoint and service-authorization anomalies remain weak signals.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 接收地址分区削弱共享频道关联, en: Recipient partitioning weakens shared-channel correlation}
        analysis:
          paragraphs:
            - zh: 注册时分配每植入地址，操作者把命令从共同主题移到这些地址；旧主题不再呈现全局活动，按单主题统计或采样只能看到局部。防守方须在 broker 全量日志中按客户端、注册标识和时间跨主题重建，因而逻辑空间分散提高关联成本；若拥有全量图谱且按设备关联，收益就会收缩。
              en: Registration assigns per-implant addresses and the operator moves tasks from a communal topic to those addresses. The old topic no longer represents global activity, so single-topic counting or sampling sees only a fragment. Defenders must reconstruct across topics by client, registration identifier, and time in complete broker logs; logical-space dispersion raises correlation cost. The benefit shrinks when a defender has the full graph and device-based joins.
        evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-MQTT5]
        confidence: medium
    research_limitations:
      paragraphs:
        - zh: WailingCrab 的版本差直接支持共享主题覆盖缩减，MQsTTang 支持独立客户端主题，但尚未证明该分区在任何被入侵组织中实际绕过告警。协议允许正常每设备主题，故没有业务设备目录、全量 broker 审计与后继执行时，随机或唯一主题只能作为调查线索。邮箱或其他队列的同类分区仍需独立样本，不以 MQTT 两例自动推广。
          en: WailingCrab's version change directly supports loss of shared-topic coverage, and MQsTTang supports unique client topics, but neither proves the partition bypassed an alert in a particular victim organization. The protocol permits legitimate per-device topics, so random or unique topics are leads only without a device inventory, complete broker audit, and subsequent execution. Similar partitioning in mailboxes or other queues needs independent samples and cannot be generalized automatically from two MQTT cases.
defense_candidates:
  detection_strategies:
    - key: B2-T1071-DET-SESSION
      name: {zh: 应用事务到控制结果的谱系, en: Application Transaction to Control Outcome Lineage}
      detects_keys: [B2-T1071-PARENT, B2-T1071-SUB-MEDIATED]
      objective: {zh: 将受害端应用事务、中介回复或发布与同设备后继执行和结果回报关联，确认控制而非以协议名告警。, en: Join victim application transactions and intermediary replies or publications to subsequent execution and results on the same device, confirming control rather than alerting on protocol names.}
      analytic_keys: [B2-T1071-NJA-DNS, B2-T1071-NJA-BROKER]
    - key: B2-T1071-DET-ADDRESS
      name: {zh: 接收者分区地址图重建, en: Recipient-Partitioned Address Graph Reconstruction}
      detects_keys: [B2-T1071-SUB-RECIPIENT]
      objective: {zh: 跨主题关联注册、订阅、命令发布和结果回报，以恢复单共享主题观察遗漏的受害者集合。, en: Correlate registrations, subscriptions, task publications, and results across topics to recover victim sets missed by one shared-topic monitor.}
      analytic_keys: [B2-T1071-NJA-GRAPH]
  detection_analytics:
    - key: B2-T1071-NJA-DNS
      strategy_key: B2-T1071-DET-SESSION
      name: {zh: DNS 答案到同进程执行关联, en: DNS Answer to Same-Process Execution Join}
      target_keys: [B2-T1071-PARENT, B2-T1071-SUB-MEDIATED]
      logic:
        zh: 从受管解析器或 Zeek dns.log 按设备、query、qtype_name、answers、ts 和 uid 重建请求—答案；用 Sysmon Event 22 的 ProcessGuid、QueryName 和时间映射发起进程，再查最初 1–10 分钟内同进程或子进程执行与后续同域结果查询。只有可重复的答案—动作关系或内容证实命令时才提高到 C2；TXT、长子域名或熵值单独只是线索。若 Zeek 的源为递归器，必须用其客户端查询日志映射主机。窗口为本地调参初值。
        en: Reconstruct request and answer from managed-resolver or Zeek dns.log by device, query, qtype_name, answers, ts, and uid. Map Sysmon Event 22 ProcessGuid, QueryName, and time to the initiating process, then inspect execution by that process or descendants and later same-domain result queries in an initial 1–10 minute window. Elevate to C2 only for repeatable answer-to-action relationships or confirmed command content; TXT, long labels, or entropy alone are leads. If Zeek sees the recursive resolver as source, map its client-query log back to hosts. The window is a local tuning starting point.
      data_requirements:
        - {source_type: dns_transaction, channel: 'Zeek dns.log or managed resolver', required_fields: [ts, uid, id.orig_h, query, qtype_name, answers, rcode_name]}
        - {source_type: endpoint_dns, channel: 'Sysmon Event 22 or equivalent EDR', required_fields: [utc_time, computer, process_guid, image, query_name]}
        - {source_type: endpoint_process, channel: 'Sysmon Event 1 or equivalent EDR', required_fields: [utc_time, computer, process_guid, parent_process_guid, image]}
      joins: [resolver_client_ip_to_host, normalized_query_and_time_to_process_guid, process_guid_to_child_process, dns_uid_to_conn_uid_when_available]
      correlation_window: 'Initial 1–10 minutes from answer to execution; retain a full local callback cycle for recurrence'
      false_positives: [software_updates_using_TXT, SPF_DKIM_DMARC_and_service_discovery, legitimate_admin_scripts]
      blind_spots: [DNS_over_HTTPS_outside_managed_resolver, resolver_cache, missing_process_DNS_or_answer_log, in_process_execution_without_child_process]
      tuning: {zh: 按获批进程、设备角色和域名用途建立基线；勿将所有 TXT 或受管解析器整体白名单，无后继动作时维持低置信。, en: Baseline approved processes, device roles, and domain purpose; do not allowlist all TXT or managed resolvers wholesale, and retain low confidence without successor action.}
      evidence_keys: [B2-T1071-REF-WEKBY, B2-T1071-REF-RFC1034, B2-T1071-REF-SYSMON-REUSE, B2-T1071-REF-ZEEK-DNS-REUSE]
    - key: B2-T1071-NJA-BROKER
      strategy_key: B2-T1071-DET-SESSION
      name: {zh: broker 发布订阅与端点执行双侧关联, en: Broker Publish-Subscribe and Endpoint Execution Bilateral Join}
      target_keys: [B2-T1071-PARENT, B2-T1071-SUB-MEDIATED]
      logic:
        zh: 对受管 broker 收集 connect、subscribe、publish、disconnect，按 topic、client_id、username、source_ip 和时间建发布者到订阅者边；用端点 Event 3 的 ProcessGuid、目的 IP/端口与进程身份关联订阅者，再看命令发布后短时是否启动解释器或新代码并向另一主题发结果。只有设备业务角色、发布权限与后继动作不符时升级调查。公共 broker 无服务日志时只能报告未批准设备/进程连接及本地执行，不能声称找到发布者。
        en: On a managed broker, collect connect, subscribe, publish, and disconnect events and build publisher-to-subscriber edges by topic, client_id, username, source_ip, and time. Join endpoint Event 3 ProcessGuid, destination IP and port, and process identity to the subscriber, then check whether an interpreter or new code starts soon after task publication and results appear on another topic. Escalate when device role, publication authority, and successor action conflict. Without service logs from a public broker, report only unapproved device or process contact and local execution, not a recovered publisher.
      data_requirements:
        - {source_type: broker_event, channel: 'EMQX rule-engine MQTT publish and $events/session/subscribed + $events/message/delivered exports; scoped log trace for investigation', required_fields: [timestamp, clientid, topic, peerhost, event_type]}
        - {source_type: endpoint_network, channel: 'Sysmon Event 3 or equivalent EDR', required_fields: [utc_time, computer, process_guid, image, destination_ip, destination_port]}
        - {source_type: endpoint_process, channel: 'Sysmon Event 1 or equivalent EDR', required_fields: [utc_time, computer, process_guid, parent_process_guid, image]}
      joins: [topic_publish_to_subscription, broker_source_ip_to_device, client_id_to_authorized_device_inventory, process_guid_to_network_and_child_process]
      correlation_window: 'Initial 0–10 minutes from publication to action; 24 hours broker event retention for repeated pairs'
      false_positives: [ordinary_IoT_commands, OTA_updates, remote_administration, broker_testing]
      blind_spots: [external_broker_without_events, MQTT_over_TLS_without_broker_logs, NAT_and_rotating_client_id, in_process_execution]
      tuning: {zh: 先登记设备、进程、broker 与 topic 的批准映射，按角色违例和任务后继执行排序；数字 topic 和端口号不可单独定性。, en: Inventory approved device, process, broker, and topic relationships, then rank role violations with post-task execution; numeric topics and ports alone are not verdicts.}
      evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-EMQX-FIELDS, B2-T1071-REF-EMQX-TRACE, B2-T1071-REF-EMQX-SUBSCRIPTIONS, B2-T1071-REF-SYSMON-REUSE]
    - key: B2-T1071-NJA-GRAPH
      strategy_key: B2-T1071-DET-ADDRESS
      name: {zh: 每客户端主题注册—收令—回报图, en: Per-Client Topic Registration–Task–Result Graph}
      target_keys: [B2-T1071-SUB-RECIPIENT]
      logic:
        zh: 提取 broker 中每个 client_id 的订阅与发布 topic 集合；若注册请求可见，再用其中设备标识联结不同 topic。寻找一名发布者向多个仅单设备订阅的地址送任务、这些设备再向其他地址回报，并用发布后的端点动作验证。按设备和标识跨初始 24 小时聚合，不用 WailingCrab 的数字主题或 MQsTTang 的固定字符串作通用正则。普通设备也用私有 topic，因此图谱与后继动作均是必要条件。
        en: Extract each broker client_id's subscribe and publish topic sets and, where visible, join device identifiers from registration requests across topics. Find a publisher delivering tasks to addresses each subscribed by one device, with those devices returning results to other addresses, and confirm endpoint action after publication. Aggregate by device and identifier across an initial 24 hours; do not make WailingCrab's numeric topics or MQsTTang's strings universal regexes. Normal devices also use private topics, so both graph structure and successor action are necessary.
      data_requirements:
        - {source_type: broker_event, channel: 'EMQX rule-engine MQTT publish and $events/session/subscribed + $events/message/delivered exports; scoped log trace for investigation', required_fields: [timestamp, clientid, topic, peerhost, event_type]}
        - {source_type: broker_subscription, channel: 'EMQX subscription inventory or equivalent', required_fields: [clientid, topic]}
        - {source_type: endpoint_process, channel: 'Sysmon Event 1 or equivalent EDR', required_fields: [utc_time, computer, process_guid, parent_process_guid, image]}
      optional_data_requirements:
        - {source_type: http_registration, channel: 'Zeek http.log or reverse proxy if content visible', fields: [ts, uid, host, uri, registration_identifier]}
      joins: [client_id_to_topic, publisher_to_subscriber_by_topic_and_time, source_ip_to_device, registration_identifier_to_topic_where_visible, device_to_successor_process]
      correlation_window: 'Initial 24 hours for topic graph and 0–10 minutes for publication-to-outcome; calibrate locally'
      false_positives: [per_device_IoT_topics, fleet_OTA_dispatch, legitimate_job_queues]
      blind_spots: [broker_log_sampling, external_broker, encrypted_registration, commands_without_new_process]
      tuning: {zh: 对照受权设备目录和 topic 所有权，优先调查跨角色或未登记客户端的收令—执行链；唯一 topic 数量不能单独告警。, en: Compare with authorized device inventory and topic ownership, prioritizing task-to-execution chains involving cross-role or unregistered clients; unique-topic counts alone cannot alert.}
      evidence_keys: [B2-T1071-REF-WAILINGCRAB, B2-T1071-REF-MQSTTANG, B2-T1071-REF-EMQX-FIELDS, B2-T1071-REF-EMQX-TRACE, B2-T1071-REF-EMQX-SUBSCRIPTIONS]
  mitigations:
    - key: B2-T1071-MIT-PATH
      name: {zh: 应用协议出口与中介受管化, en: Managed Application Egress and Intermediaries}
      measures:
        - {key: route_control, control_type: preventive, zh: 按设备和进程角色限制 DNS、Web、邮件和消息协议到获批服务路径。, en: Restrict DNS, web, mail, and messaging protocols to approved service paths by device and process role.}
        - {key: route_audit, control_type: detective-support, zh: 保留受管解析器的客户端查询/答案及 broker 客户端与主题路由日志。, en: Retain managed resolver client-query and answer records plus broker client and topic-routing logs.}
      applications:
        - target_key: B2-T1071-PARENT
          use: {zh: 将应用协议出口按业务角色落实到受管网关和端点进程策略, en: Bind application egress by business role to managed gateways and endpoint process policy}
          expected_effect: {zh: 减少未批准 C2 路径并保留事务到设备的关联键, en: Reduce unapproved C2 paths and retain transaction-to-device join keys}
          limitations: {zh: 已批准应用或被盗账户仍可承载控制；TLS 和外部日志缺口仍需端点关联, en: Approved applications or stolen accounts can still carry control; TLS and external log gaps still require endpoint joins}
        - target_key: B2-T1071-SUB-MEDIATED
          use: {zh: 禁止非批准直连外部 broker 和解析器，要求自营中介保存客户端与路由映射, en: Block unapproved external brokers and resolvers and require managed intermediaries to retain client and routing maps}
          expected_effect: {zh: 缩小分离控制端的中介集合并可恢复双侧路由关系, en: Shrink the intermediary set that separates controllers and enable reconstruction of bilateral routes}
          limitations: {zh: 业务必需的公共 broker 若不共享日志，或客户端使用加密 DNS，仍可能无法归属发布者, en: A business-required public broker without shared logs or encrypted DNS can still prevent issuer attribution}
      evidence_keys: [B2-T1071-REF-AWS-DNS-FW, B2-T1071-REF-EMQX-AUTHZ, B2-T1071-REF-SYSMON-REUSE]
    - key: B2-T1071-MIT-TOPIC
      name: {zh: 消息主题按身份授权与审计, en: Identity-Bound Topic Authorization and Audit}
      measures:
        - {key: topic_acl, control_type: preventive, zh: 对受管 broker 按设备身份分别授权 publish 与 subscribe 到特定 topic，拒绝匿名和宽泛权限。, en: Authorize publish and subscribe separately for each device identity and specific topic on managed brokers, rejecting anonymous and broad grants.}
        - {key: topic_audit, control_type: detective-support, zh: 记录 client_id、topic、动作、结果和时间并核对未登记主题。, en: Record client_id, topic, action, outcome, and time and review unregistered topics.}
      applications:
        - target_key: B2-T1071-SUB-RECIPIENT
          use: {zh: 把每设备任务与回报主题绑定设备 ID 和受权发布端，拒绝未登记客户端的私有主题。, en: Bind each device's task and result topics to its device ID and authorized publisher, rejecting private topics from unregistered clients.}
          expected_effect: {zh: 提高任意分配私有地址的成本并保留跨主题图谱, en: Raise the cost of arbitrary private-address assignment and preserve a cross-topic graph}
          limitations: {zh: 被盗合法设备凭据仍可用获批主题，外部公共 broker 不受本组织 ACL 控制，过严规则会中断正常 IoT 业务。, en: Stolen legitimate device credentials can use approved topics, external public brokers are outside local ACL control, and overly strict rules can interrupt legitimate IoT work.}
      evidence_keys: [B2-T1071-REF-EMQX-AUTHZ, B2-T1071-REF-EMQX-TRACE, B2-T1071-REF-WAILINGCRAB]
