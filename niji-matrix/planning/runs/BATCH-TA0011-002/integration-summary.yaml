review_notes_zh: T1071 经 adapt 准入正式写入 NJT-0160、NJS-0160-001/002，分别按协议中介分离控制端与按接收者分区控制地址划分，不导入五个 ATT&CK 协议子项。Unit
  42 Wekby、IBM WailingCrab、ESET MQsTTang 与 Turla 原始来源各按样本和现场证据层级使用。EMQX Enterprise 三条失效文档 URL 改用可访问的 EMQX Cloud
  事件字段、订阅 API 和授权文档；持续事件导出是 broker Analytic 的前提，Log Trace 不充当全量历史。共享库查重与 ID 同步完成，make quality 0 错误 0 警告、12 项单元测试、Bundle、91
  项 Web 测试及中英文页面检查均通过。保持 review，待人工领域评审。TA0011 正式矩阵现有 3/18 个父技术，剩余 15。
review_notes_en: T1071 was adapted as NJT-0160 with NJS-0160-001/002, partitioned by protocol-intermediary controller
  separation and recipient-scoped control addressing rather than importing five ATT&CK protocol children. Original
  Unit 42 Wekby, IBM WailingCrab, and ESET MQsTTang and Turla sources are used at their supported sample and field-evidence
  levels. Three broken EMQX Enterprise documentation URLs were replaced with reachable EMQX Cloud event-field, subscription-API,
  and authorization pages; continuous event export is required for broker analytics and Log Trace is not treated
  as full history. Shared-library deduplication and ID sync are complete. make quality has zero errors or warnings,
  twelve unit tests pass, the bundle is built, and all 91 Web tests and bilingual page checks pass. Status remains
  review pending human domain review. TA0011 formal matrix is 3/18 parents with 15 remaining.
