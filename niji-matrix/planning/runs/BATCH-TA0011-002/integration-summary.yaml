deferred_hypotheses:
- T1071.002 file-transfer command queues lacked original repeatable tasking and an independent stealth-observation
  differential in this review.
- Wekby published command round trips were mock-server demonstrations, and its actual recursive resolver path was
  not documented for every victim.
- Turla Outlook researchers obtained no actual inbound command PDF; this remains code-level capability evidence.
- Recipient-address partition outside MQTT needs independent evidence; public brokers without service logs prevent
  bilateral publisher attribution.
- No case establishes a universal threshold, measured customer alert evasion, or transferable analytic sensitivity.
