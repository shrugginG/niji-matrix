batch_ref: BATCH-TA0011-002
original_attack_subtechniques_imported: false
candidate_reviews:
- source_attack_id: T1071
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 5
    attack_subtechnique_ids:
    - T1071.001
    - T1071.002
    - T1071.003
    - T1071.004
    - T1071.005
    represented_dimensions:
    - web_request_response
    - file_transfer_transaction
    - mailbox_delivery_and_client_access
    - dns_query_answer
    - publish_subscribe_broker_and_topic
    breadth_trigger: examine_two_materially_different_axes
    coverage_resolutions:
    - attack_id: T1071.001
      resolution: parent-core
      reason: HTTP application exchange is parent behavior; service-contract imitation is NJT-0152 and provider
        resource abuse is T1102; no web-named NJS
    - attack_id: T1071.002
      resolution: evidence-deferred
      reason: Fixed ATT&CK inventory establishes FTP family but reviewed original material did not demonstrate a
        repeatable FTP task queue and a separate stealth axis; file delivery or exfil alone is insufficient
    - attack_id: T1071.003
      resolution: parent-core
      adjacent: NJT-0152
      reason: Outlook MAPI email command capability supports parent; hidden PDF content is message obfuscation;
        no separate mail-named NJS, and actual inbound command PDF was not captured
    - attack_id: T1071.004
      resolution: niji-variable-candidate
      reason: Pisloader TXT query-answer plus DNS recursion illustrates split victim-side connection and downstream
        authoritative source; full qname still visible
      child_ref: NJS-0160-001
    - attack_id: T1071.005
      resolution: niji-variable-candidate
      reason: Two original MQTT analyses show broker-separated controller and unique recipient topic; one WailingCrab
        version comparison establishes shared-topic visibility change
      child_refs:
      - NJS-0160-001
      - NJS-0160-002
    candidate_stealth_axes_examined:
    - axis: application_intermediary_controller_separation
      result: formal_candidate
      trace: Victim connects to resolver or broker; operator is on another service-side session
      defense_difference: Requires resolver/broker transaction and endpoint join rather than direct C2 IP match
    - axis: recipient_scoped_logical_addressing
      result: formal_candidate
      trace: One shared campaign topic replaced by per-client topics; subscription/publication graph fragments
      defense_difference: Requires cross-topic graph and ACL audit rather than one topic monitor
    - axis: victim_established_receive_session
      result: parent-core
      trace: DNS query or broker connection is victim originated
      reason: Too general to stand alone; ordinary applications do this and distinct effects in supported examples
        derive from mediation or routing partition
    - axis: service_contract_or_message_shape
      result: adjacent-technique
      owner: NJT-0152
      reason: HTTP telemetry appearance, PDF hidden bytes, JSON/base64/XOR are message semantics or encoding, not
        protocol session topology
    - axis: failure_triggered_protocol_change
      result: adjacent-technique
      owner: NJT-0153
      reason: Switch after primary failure is the controlled variable there; T1071 may co-occur on each actual application
        session
    - axis: public_service_reputation
      result: adjacent-technique
      owner: T1102
      reason: Public broker trust can coexist but does not define protocol-native mediation; a private broker has
        the same route structure
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 主 Agent 按五个协议簇逐项审查后保留两个跨媒介的稳定匿迹变量。Web 与邮件归父级及相邻对象，FTP 独立匿迹轴证据不足而延期；DNS 只在具备递归路径证据时支持中介轴，MQTT 两份原始样本支持中介与地址分区。正式
        NJS 数量不由 ATT&CK 子项数决定。
      en: After reviewing all five protocol clusters, the primary agent retained two stable cross-medium stealth
        variables. Web and mail remain parent or adjacent behavior, an independent FTP stealth axis is evidence-deferred,
        DNS supports mediation only with verified resolver path, and two original MQTT samples support mediation
        and address partition. ATT&CK child count does not determine formal NJS count.
  primary_resolution: Adapt as NJT-0160 with NJS-0160-001 and NJS-0160-002; FTP-specific axis evidence-deferred.
