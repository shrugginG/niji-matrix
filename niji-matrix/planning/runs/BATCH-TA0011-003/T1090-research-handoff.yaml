    parent_behavior_keys: [REF-000625, REF-000025, B3-T1090-REF-RFC1928]
    boundary_keys: [REF-000625, B3-T1090-REF-RFC1928, B3-T1090-REF-RFC7239, B3-T1090-REF-MANDIANT-APT29-FRONTING]
    mechanism_support:
      - mechanism: NM-FD
        evidence_keys: [REF-000073, REF-000074, B3-T1090-REF-MANDIANT-APT29-FRONTING, B3-T1090-REF-AWS-CLOUDFRONT]
      - mechanism: NM-ST
        evidence_keys: [B3-T1090-REF-TOR-OVERVIEW, B3-T1090-REF-TOR-PATH, B3-T1090-REF-MANDIANT-APT29-FRONTING]
    child_existence_support:
      - child_key: B3-T1090-NJS-COMPROMISED-EGRESS-PROVENANCE
