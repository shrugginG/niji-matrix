        en: When a compromised SOHO or edge device serves as egress, the target sees genuine third-party network provenance rather than the operator's original location, while device integrity and cross-vantage flows can still recover linkage.
      evidence_keys: [REF-000073, REF-000074, CASE-000045]
      evidence_mode: directly-observed
