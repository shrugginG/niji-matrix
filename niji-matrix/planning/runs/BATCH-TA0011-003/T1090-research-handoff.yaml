  claims:
    - temporary_key: B3-T1090-CLM-TWO-LEG
      statement:
        zh: 代理中介把客户端到目标的一条逻辑通信实现为客户端—代理和代理—目标两段网络关系，目标通常只把最后跳识别为直接来源。
        en: A proxy intermediary implements one logical client-to-target communication as client-to-proxy and proxy-to-target network relationships, with the target normally identifying only the last hop as its direct origin.
