research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1090.001, T1090.002, T1090.003, T1090.004]
    represented_dimensions:
      - 中介相对受害网络边界的位置：内部或外部
      - 代理链节点数量与追踪深度
      - CDN/TLS/HTTP 名称层参与的后端路由方式
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
      - attack_subtechnique_id: T1090.001
        attack_name: Internal Proxy
        resolution: parent-core
        notes:
          zh: 内部位置支持汇聚受限主机、越过分区和缩减直接外联，但位置本身不产生唯一匿迹变量；CISA PRTG/FRP 支持父级两段转发与检测设计。
          en: Internal placement supports aggregating restricted hosts, crossing zones, and reducing direct egress, but location itself does not produce a unique stealth variable. CISA PRTG and FRP activity supports parent-level two-leg forwarding and defense design.
      - attack_subtechnique_id: T1090.002
        attack_name: External Proxy
        resolution: parent-core
        notes:
          zh: 外部位置通常替代目标可见来源，但租赁 VPS、VPN、公共代理和被攻陷出口的痕迹不同；普通外部代理归父级，被攻陷真实第三方出口贡献第一个 Niji 变量。
          en: External placement commonly substitutes the target-visible origin, but rented VPS, VPN, public proxy, and compromised egress leave different traces. Ordinary external proxying remains parent-core, while compromised genuine third-party egress contributes the first Niji variable.
      - attack_subtechnique_id: T1090.003
        attack_name: Multi-hop Proxy
        resolution: niji-variable-candidate
        notes:
          zh: 跳数不是变量；只有各中继属于不同观察责任域、只保留相邻关系且端到端链无法由单点恢复时，贡献“分舱中继观察链断裂”。
          en: Hop count is not the variable. Multi-hop contributes Compartmented-Relay Observation-Chain Break only when relays occupy separate observation-custody domains, retain adjacent relationships only, and no one point recovers the end-to-end chain.
      - attack_subtechnique_id: T1090.004
        attack_name: Domain Fronting
        resolution: niji-variable-candidate
        notes:
          zh: 不继承“域前置”名称；其稳定贡献是同一会话外层 TLS 身份与解密后路由权威分离，形成跨层一致性分析和提供方控制。
          en: The Domain Fronting label is not inherited. Its stable contribution is separation between outer TLS identity and decrypted routing authority within one session, enabling cross-layer congruence analysis and provider enforcement.
    candidate_stealth_axes_examined:
      - 被攻陷第三方出口的真实网络归属借用
      - 多管理域中继对端到端观察责任的分舱
      - TLS/HTTP/提供方账户之间的跨层路由权威分离
      - 内部与外部位置差异（拒绝为独立子项）
      - 代理链长度（拒绝为独立子项）
      - 代理端点轮换（交给 TA0042 NJS-0044-002 或 NJT-0153，视直接对象而定）
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        四个 ATT&CK 子项全部获得 planning-only 决议。三个建议 Niji 子项跨越 ATT&CK 的位置/工具分类：被攻陷出口可存在于 external 或 multi-hop，分舱观察可由 Tor 或自建链实现，路由权威差可由不同共享边缘服务实现。主 Agent 应重点复核第一个子项与 TA0042 NJS-0044-002 的双重归类是否保持“资源准备”与“实际 C2 转发”边界。
      en: >-
        All four ATT&CK children have planning-only resolutions. The three proposed Niji children cut across ATT&CK's placement and implementation categories: compromised egress may be external or multi-hop, compartmented observation may use Tor or a private chain, and routing-authority divergence may use different shared edge services. The primary agent should specifically review dual classification of the first child with TA0042 NJS-0044-002 so resource preparation remains distinct from actual C2 forwarding.
