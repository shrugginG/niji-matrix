        zh: Mandiant 观察 APT29 以 Tor 和 meek 建立后门，TLS 外观指向 Google 服务，HTTP 指定 reflection server，Tor hidden service 再把流量转发到本地 139、445 和 3389 端口；案例同时支持分舱中继与跨层路由权威分离，并与隧道并列。
        en: Mandiant observed APT29 establishing a backdoor with Tor and meek, presenting Google-service TLS appearance, naming a reflection server in HTTP, and using a Tor hidden service to forward traffic to local ports 139, 445, and 3389. The case supports both compartmented relay custody and cross-layer routing-authority divergence and coexists with tunneling.
      evidence_keys: [B3-T1090-REF-MANDIANT-APT29-FRONTING]
      confidence: high
