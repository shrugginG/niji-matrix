      - child_key: B3-T1090-NJS-ROUTING-AUTHORITY-DIVERGENCE
        evidence_keys: [B3-T1090-REF-MANDIANT-APT29-FRONTING, B3-T1090-REF-AWS-CLOUDFRONT, B3-T1090-REF-AZURE-FRONTDOOR, B3-T1090-REF-AZURE-FRONTDOOR-MONITOR]
    unsupported_or_deferred:
      - 从住宅/本地 ASN 单独推断代理或真实控制者
      - 从安装 FRP、Tor、VPN 或 PortProxy 配置单独推断成功 C2 转发
      - 将两个代理或任何固定跳数自动认定为观察链分舱
      - 把所有 SNI/Host 差异认定为域前置攻击
      - 在无提供方或中介日志时宣称已恢复完整控制路径
      - 将代理轮换、失败换路或内层协议封装直接吸收到 T1090 子项
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级提案分别覆盖行为与目的、观察差、残余痕迹、正常反例、五项相邻边界、两类场景、攻击者成本、三档防守置信和证据限制；没有以工具或 ATT&CK 子项名称代替分类。
      en: The parent proposal separately covers behavior and purpose, observation differential, residual traces, normal counterexamples, five adjacent boundaries, two scenario classes, actor cost, three defender confidence levels, and evidence limits. Tool or ATT&CK child names do not substitute for taxonomy.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML syntax validation, local library lookup, exact-URL duplicate search]
  limitations:
    paragraphs:
      - zh: >-
          Volt Typhoon 来源直接证明内部 PortProxy/FRP 状态和被攻陷 SOHO 出口用途，但公开材料没有提供可供独立复算的逐流入出站 session ID、字节对称性或目标结果。CASE-000045 已把同一 SOHO 事实用于 TA0042 资源准备；扩展到本候选只能支持“实际出口转发与来源归属替代”，不能把设备攻陷步骤或出口池轮换整体搬入 TA0011。CISA/Microsoft/DOJ 对主体归因和用途的高置信不等于每条目标侧住宅 IP 都能归为 Volt Typhoon。
        en: >-
          Volt Typhoon sources directly establish internal PortProxy or FRP state and compromised SOHO egress purpose, but public material does not publish per-flow ingress and egress session IDs, byte symmetry, or target outcomes that an independent analyst can recompute. CASE-000045 already uses the same SOHO facts for TA0042 resource preparation. Extending them here supports actual egress forwarding and source-provenance substitution only; it does not move the device-compromise step or egress-pool rotation wholesale into TA0011. High-confidence actor attribution and purpose from CISA, Microsoft, and DOJ do not make every residential target-side IP Volt Typhoon.
      - zh: >-
          Mandiant 的 APT29 报告是多跳和跨层路由权威分离的强案例，但 Tor 与 meek 同时包含代理、隧道、加密、域前置和远程服务，因此正式案例必须按直接事实分别支持各对象，不能把一次命中当作全部分类的互证。Tor 文档、RFC 1928/7239、AWS 和 Azure 文档证明架构、字段与控制可能性，不证明提出的 Analytic 在任何环境的检出率。SNI/Host 可见性还受 TLS 解密、ECH、QUIC 和提供方日志权限限制。
        en: >-
          Mandiant's APT29 report is strong evidence for layered relays and cross-layer routing-authority divergence, but Tor plus meek simultaneously contains proxying, tunneling, encryption, domain fronting, and remote services. A formal case must support each object with its direct facts rather than treat one hit as proof of every classification. Tor documentation, RFC 1928 and 7239, and AWS and Azure documentation establish architecture, fields, and feasible controls, not detection rates for the proposed analytics in every environment. SNI and Host visibility is further constrained by TLS decryption, ECH, QUIC, and provider-log authority.
      - zh: >-
          双侧流量配对中的十秒、五分钟和字节容差是工程起点而非来源给出的通用阈值。长驻代理、复用连接、多路复用、缓存和异步中继会破坏简单一对一匹配；企业代理、服务网格、远程维护、CDN Host 重写和灾备又会产生强正常相似行为。正式 NJA 应在受控转发测试和本地基线中校准，并将不完整路径作为较低结论，而不是因日志缺口提高恶意置信。
        en: >-
          Ten-second and five-minute windows and byte tolerances for bilateral flow pairing are engineering starting points rather than universal thresholds supplied by sources. Long-lived proxies, connection reuse, multiplexing, caching, and asynchronous relays break simple one-to-one matching, while enterprise proxies, service meshes, remote maintenance, CDN Host rewriting, and disaster recovery create strong legitimate lookalikes. A formal NJA should calibrate against controlled relay tests and local baselines and report an incomplete path at lower confidence rather than increase malicious confidence because logs are missing.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 代理转发不必改变或隐藏 C2 消息语义；内容加密、编码或封装由相邻技术证明，不能从中介存在自动推出数据遮蔽。
        en: Proxy forwarding need not transform or conceal C2 message semantics. Adjacent techniques establish encryption, encoding, or encapsulation, so Data Obscuration cannot be inferred from an intermediary alone.
    - mechanism_ref: NM-BT
      reason:
        zh: 当前证据核心是来源/目的身份替代与跨节点痕迹分布；“像正常行为”只在具体出口信誉或业务基线下成立，尚不足作为父级独立普遍机理。
        en: Current evidence centers on origin or destination identity substitution and cross-node trace distribution. Appearing normal depends on concrete egress reputation or business baselines and is insufficient as an independent universal parent mechanism.
  open_questions:
    - 主 Agent 是否将“被攻陷网络出口归属借用”保留为正式 T1090 子项，并通过双重主体扩展 CASE-000045；若与 NJS-0044-002 防御差不足，应保留父级案例而非复制资源子项。
    - REF-000025 的 locator/notes 当前主要记录侦查和 NTDS 行为，正式复用 T1090 前应扩展同一参考对象以准确定位 PRTG PortProxy、FRP 和 multi-hop 段落。
    - 正式域路由 Analytic 应同时引用 Azure FAQ 的 mismatch 阻断语义和 monitor 文档的 OriginName、OriginIP、OriginURL、Sni、requestUri、ErrorInfo 字段；平台字段仍需按实际 Front Door 层级与诊断配置验证。
    - 受管代理使用 RFC 7239 时，必须区分由受信第一跳生成的元素与客户端提供的伪造 Forwarded；正式逻辑不应把未验证 header 当作源地址事实。
