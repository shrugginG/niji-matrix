        en: A multi-relay path whose relays know only adjacent nodes distributes end-to-end observation custody across nodes and administrative domains, preventing one point log from independently recovering both source and destination.
      evidence_keys: [B3-T1090-REF-TOR-OVERVIEW, B3-T1090-REF-TOR-PATH, B3-T1090-REF-MANDIANT-APT29-FRONTING]
      evidence_mode: architecture-plus-field-observation
