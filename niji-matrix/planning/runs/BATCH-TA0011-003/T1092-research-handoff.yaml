handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-003
work_item_ref: WORK-TA0011-T1092
temporary_key_prefix: B3-T1092
candidate:
  source_type: attack
  source_attack_id: T1092
  name:
    zh: 可移动介质存储转发指挥控制
    en: Removable-Media Store-and-Forward C2
recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1092 直接描述两端已受控后，利用可移动介质在可能断连的系统之间传递命令，并把文件从隔离端中继回攻击者可直接访问的联网端。ESET 对 USBStealer 的逆向分析展示了联网 A、隔离 B、按 B 计算机名寻址的加密命令文件、B 上连续执行命令以及文件返回；ESET 对 GoldenDealer 的现场工具集分析又展示了按在线状态分工、经同一介质向隔离端传递执行文件并把系统信息带回联网端。因此父行为、TA0011 目的和往返控制链均有结论级支持，建议 retain。
        en: >-
          ATT&CK Enterprise 19.1 directly defines T1092 as passing commands through removable media between already compromised systems on potentially disconnected networks and relaying files from the disconnected side to an Internet-connected system directly reachable by the operator. ESET's reverse engineering of USBStealer shows connected host A, isolated host B, encrypted command files addressed by B's computer name, consecutive command execution on B, and file return. ESET's observed GoldenDealer toolset independently shows online-role selection, executable delivery to an isolated host through the same medium, and system information returning to the connected side. The parent behavior, TA0011 purpose, and round-trip control chain therefore have conclusion-level support, so retain is recommended.
      - zh: >-
          准入必须使用严格结果门。仅把载荷送达另一主机、首次通过介质触发感染、把受害数据带离、人工搬运文件、离线补丁或一次性物理交付均不构成本技术。正式范围至少要求两端已受控，并证明命令或任务包由控制侧写入介质、受限侧读取和执行、结果或状态写回并在控制侧取用；若公开证据无法覆盖完整闭环，则至少应证明同一工具具备可重复的双向任务周期，并把事件结论降为能力而非已观察全链。
        en: >-
          Admission requires a strict outcome gate. Delivering a payload to another host, first infection through media, carrying victim data outward, human file transport, offline patching, or one physical delivery does not establish this technique. Canonical scope should require both sides to be compromised and should show a command or task package written by the control side, read and acted on by the restricted side, and a result or status written back and consumed on the control side. If public evidence does not cover the complete observed loop, it must at least establish that the same tooling implements a repeatable bidirectional task cycle, and the case conclusion must remain a capability rather than a fully observed incident chain.
proposed_content:
  summary:
    zh: 攻击者让可移动介质在联网控制端与隔离或受限主机间往返，以异步传递定向任务并带回结果，从而在没有端到端网络会话时维持可重复指挥控制。
    en: An adversary shuttles removable media between a connected control-side host and an isolated or restricted host to asynchronously deliver targeted tasks and return results, sustaining repeatable C2 without an end-to-end network session.
  definition_and_concept:
    paragraphs:
      - zh: >-
          可移动介质存储转发指挥控制是两端主机已经受控后，攻击者把介质作为异步队列使用的通信行为。联网或较低限制的一端从远程操作者取得任务，把命令、执行文件或任务描述写入介质；介质到达隔离或受限端后，本地植入取出并执行任务，再把结果、主机状态或待回传文件写回介质；介质返回控制侧后，另一组件取用并向操作者报告，以支持后续任务。
        en: >-
          Removable-Media Store-and-Forward C2 is a communication behavior in which an adversary uses media as an asynchronous queue after both endpoint hosts are compromised. The connected or less restricted side obtains tasking from the remote operator and writes commands, executables, or task descriptions to the medium. An implant on the isolated or restricted side retrieves and acts on the task, then writes results, host state, or return files to the medium. When the medium returns, a control-side component consumes and reports them to support later tasking.
      - zh: >-
          这个概念以可重复控制回路为核心，而不是以 USB、外置磁盘、文件名或物理搬运本身为核心。介质承担的是不能实时连通时的消息持久化与跨边界交付，往返的命令和结果共同把若干离散文件操作组成 C2。若只有一次文件到达、单向数据离区或尚未建立另一端控制，相关行为应分别归入工具传输、物理介质外传或可移动介质传播，而不扩大 T1092。
        en: >-
          The concept is anchored in a repeatable control loop rather than USB, an external disk, a filename, or physical carriage itself. The medium persists messages and crosses a boundary where real-time connectivity is unavailable; commands and returning results combine otherwise discrete file actions into C2. A single arriving file, one-way departure of data, or a destination not yet under control belongs respectively to tool transfer, physical-media exfiltration, or removable-media propagation and does not enlarge T1092.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          本技术把通常会形成端到端网络连接、会话标识和连续时序的控制流，改写为联网端文件写入、介质卸载和保管间隔、隔离端读取与执行、隔离端结果写回以及联网端再次读取。网络边界传感器看不到跨隔离边界的共同五元组、协议事务或实时往返时延；只观察单台主机或一次挂载的防守方容易把每一段归为普通离线文件处理，而不能识别其消息方向和闭环关系。
        en: >-
          The technique replaces a control flow that would normally produce an end-to-end network connection, session identity, and continuous timing with a connected-side file write, unmount and custody interval, restricted-side read and execution, restricted-side result write, and connected-side read on return. A network-boundary sensor sees no common five-tuple, protocol transaction, or real-time round-trip delay across the isolation boundary. A defender observing one host or one mount can misclassify each fragment as ordinary offline file handling and miss its direction and closed-loop relationship.
      - zh: >-
          匿迹并非无痕。残迹包括介质序列号或组织资产号、设备实例和卷身份、接入与卸载、每次行程前后的内容摘要、命令包和结果包的创建或读取进程、隔离端的执行链、联网端随后对外通信，以及可能位于启动扇区、隐藏目录或属性中的遍历标记。若组织用同一介质身份、逐次内容清单和跨区保管台账覆盖完整轮转周期，就可以把离散痕迹恢复成控制回路；序列号伪造、隔离端无代理、长轮转和加密包会降低结论强度。
        en: >-
          The behavior is not traceless. Residue includes media serial or organizational asset identity, device instance and volume identity, attachment and unmount, content digests before and after each trip, processes that create or read command and result packages, execution lineage on the restricted side, subsequent external communication on the connected side, and traversal markers that may reside in a boot sector, hidden directory, or file attribute. A defender covering the complete rotation with a common media identity, per-trip manifest, and cross-zone custody ledger can reconstruct the control loop. Spoofed serials, an agentless isolated endpoint, long rotations, and encrypted packages reduce confidence.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入的最小事实集合是两个已受控主机或主机角色、同一介质或可验证的介质内容谱系、控制侧到受限侧的任务方向、受限侧实际动作，以及结果或状态的返回方向。确认具体事件应观察一条命令—动作—返回闭环或两次以上可复核任务周期；只有代码能力时可以支持技术存在，但不能宣称某次行动完成了远程闭环。获批离线发布、取证采集、许可证交换、备份恢复和数据二极管出口会产生相似写读序列，须以批准任务、签名清单、源目标角色和结果用途区分。
        en: >-
          The minimum included facts are two compromised hosts or host roles, the same medium or verifiable media-content lineage, task direction from control side to restricted side, an actual restricted-side action, and a result or status returning in the opposite direction. A specific-event confirmation should observe one command-to-action-to-return loop or at least two reproducible task cycles. Code capability can establish that the technique exists but cannot prove that one operation completed a remote loop. Approved offline release, forensic acquisition, license exchange, backup restoration, and data-diode export can produce similar write and read sequences and require approved tasking, signed manifests, source and destination roles, and result purpose for distinction.
      - zh: >-
          NJT-0058/T1091 负责介质把恶意内容带到另一主机并产生首次执行或控制，范围在另一主机成为受控节点时结束；本技术从两端均已受控后的任务往返开始。NJT-0194/T1052 负责受害数据随介质离开及接收结果，单向返回文件可与本技术重叠，但只有向内任务和后继向外结果构成控制循环。T1105 负责工具或文件到达，文件到达受限端可以是本技术的一步，却不能替代返回与后续任务。物理投递和普通离线复制只描述保管或业务传输，未证明攻击者控制的消息语义。
        en: >-
          NJT-0058 and T1091 own carriage of malicious content to another host and its first execution or control, ending when the other host becomes controlled; this technique begins with task exchange after both sides are compromised. NJT-0194 and T1052 own victim data leaving on media and its receipt. A one-way return file can overlap, but only inward tasking followed by outward results creates a control loop. T1105 owns arrival of a tool or file. Arrival on the restricted side can be one step here but cannot replace return and later tasking. Physical delivery and ordinary offline copy describe custody or business transfer without establishing attacker-controlled message semantics.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在联网维护工作站与隔离业务主机按日常流程共用介质的环境中，联网端植入可接收操作者下发的目标任务并等待指定介质。介质随后被带入隔离区，隔离端植入根据主机身份或介质状态取出任务、执行文件搜索、进程启动或配置更新，并把结果写回；介质回到联网端后，结果被上传，操作者据此选择下一轮命令。USBStealer 的 COMPUTER_NAME.in 往返链和 GoldenDealer 的执行文件—系统信息交换分别证明这种异步控制结构。
          en: >-
            In an environment where a connected maintenance workstation and an isolated business host routinely share media, an implant on the connected side can receive target tasking and wait for a selected medium. The medium then enters the isolated zone, where a local implant retrieves a task according to host identity or media state, performs file search, process execution, or configuration update, and writes a result back. When the medium returns to the connected side, the result is uploaded and guides the operator's next command. USBStealer's COMPUTER_NAME.in round trip and GoldenDealer's executable-to-system-information exchange independently establish this asynchronous control structure.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者必须已控制至少一个联网或可由远程操作者到达的中继主机，以及一个隔离或受限主机上的植入；还需预知或诱导同一可写介质在两种角色之间轮转。实现者要为离线延迟、重复插拔、消息去重、目标寻址、任务状态和结果回收设计持久队列，并能在介质丢失、轮转顺序变化或写保护时容错。目标身份越精确、门控越严格，误执行越少，但对介质状态、主机标识和配套组件的依赖越强。
            en: >-
              The adversary must already control at least one connected relay host reachable by the remote operator and an implant on an isolated or restricted host, and must predict or induce rotation of the same writable medium between those roles. The implementation needs persistent queues for offline delay, repeated insertion, message deduplication, target addressing, task state, and result recovery, with tolerance for lost media, altered rotation order, or write protection. Precise targeting and strict gating reduce collateral execution but increase dependence on media state, host identity, and companion components.
      defender_model:
        paragraphs:
          - zh: >-
              防守方的充分观察模型包括两端设备接入与卸载事件、稳定的组织介质资产标识、介质路径文件活动与摘要、写入和读取进程、隔离端执行谱系、联网端网络事件，以及记录保管人、源区、目的区、行程和批准内容的台账。所有事件需规范化为同一介质会话和行程，并保留到最长合法轮转周期结束。只有接入日志而没有文件/进程，或者只有文件事件而没有盘符到介质身份映射，都不能可靠构建消息方向。
            en: >-
              A sufficient defender model includes attach and unmount events on both sides, a stable organizational media asset identity, file activity and available digests on media paths, writer and reader processes, restricted-side execution lineage, connected-side network activity, and a ledger recording custodian, source zone, destination zone, trip, and approved content. Events must be normalized into common media sessions and trips and retained through the longest legitimate rotation. Attachment logs without file or process data, or file events without a mapping from drive path to media identity, cannot reliably establish message direction.
          - zh: >-
              隔离端可能没有 EDR，介质序列号可能缺失、复用或被伪造，文件内容可能被加密，设备控制报告还可能延迟。此时检查站的逐次内容清单、卷和启动区域摘要、隐藏属性以及人工台账成为关键补偿控制。即使检测到同一介质跨区，也必须保留合法补丁、取证、生产配方和离线批处理的正常反例；高置信判断来自命令、执行和结果的语义与顺序，而不是 USB 使用本身。
            en: >-
              The isolated endpoint may lack EDR, the media serial may be absent, reused, or spoofed, file content may be encrypted, and device-control reports may be delayed. Per-trip content manifests, volume and boot-region digests, hidden attributes, and manual custody records at a checkpoint become essential compensating controls. Even when the same medium is seen crossing zones, legitimate patching, forensics, production recipes, and offline batch processing remain normal counterexamples. High-confidence classification comes from command, execution, and result semantics and order rather than USB use itself.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 介质往返使控制循环避开端到端网络观察
        en: Media rotation moves the control loop outside end-to-end network observation
      analysis:
        paragraphs:
          - zh: >-
              攻击者把远程任务写成介质上的持久对象，由人工轮转跨越隔离边界，再在另一端写回结果；这一设计消除了跨边界的共同网络会话、目的地址和实时请求响应。只部署 NDR、代理或防火墙的防守方无法观察任务交付，隔离端本地文件动作也不会自动进入联网端的检测逻辑。USBStealer 和 GoldenDealer 直接支持行为链；实际告警缺失仍取决于端点和检查站覆盖，因此机理置信度为高，但部署效果需本地验证。
            en: >-
              The adversary writes remote tasking as persistent objects on media, moves it across an isolation boundary through human rotation, and writes results back on the other side. This removes a common cross-boundary network session, destination address, and real-time request-response exchange. A defender relying on NDR, proxies, or firewalls cannot observe task delivery, and local file activity on the isolated endpoint does not automatically enter connected-side detection. USBStealer and GoldenDealer directly support the behavior chain. Actual alert absence still depends on endpoint and checkpoint coverage, so confidence in the mechanism is high while deployment effect requires local validation.
      evidence_keys:
        - REF-000625
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 保管间隔把命令与结果分散到不同主机和时间
        en: Custody intervals disperse commands and results across hosts and time
      analysis:
        paragraphs:
          - zh: >-
              介质先在控制侧写入，经历卸载、保管和转运，再在受限侧读取；结果按相反路径于后续接入返回，使一个控制周期分布到多个主机、多个挂载会话和数日乃至数周。短窗单机分析只能看到局部写入、执行或读取，必须用介质资产、卷身份、内容摘要、行程和消息方向跨域关联。USBStealer 的四步链和 GoldenDealer 的双角色线程支持这一结构，但来源没有量化真实轮转间隔或告警阈值，故置信度为中等。
            en: >-
              The medium is written on the control side, passes through unmount, custody, and transport, and is then read on the restricted side. Results return along the reverse path on later attachment, distributing one control cycle across hosts, mount sessions, and potentially days or weeks. A short single-host window sees only a local write, execution, or read and requires cross-zone correlation by media asset, volume identity, content digest, trip, and message direction. USBStealer's four-step chain and GoldenDealer's role-specific threads support the structure, but the sources do not quantify real rotation intervals or alert thresholds, so confidence is medium.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
        - REF-000597
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议建立两个 Niji 原生子项。身份定向介质信箱控制任务和结果是否按受限主机身份、用户标识或执行状态寻址，使介质只在目标端暴露少量任务对象；其防御重点是把收件标识、内容摘要、执行状态和返回包连接起来。跨角色遍历状态门控控制介质是否只有在先后访问联网端与隔离端后才启用中继；其残迹是角色标记、启动扇区微小变化、隐藏目录和严格的接入顺序，需原始介质差分与保管台账。
          en: >-
            Two Niji-native children are proposed. Identity-Addressed Media Mailboxes control whether tasks and results are addressed by restricted-host identity, user identifier, or execution state, exposing only a small set of task objects at the intended endpoint; defense must join recipient identity, content digest, execution state, and return package. Cross-Role Traversal-State Gating controls whether a medium becomes an active relay only after visiting connected and isolated roles in sequence; its residue lies in role markers, small boot-sector changes, hidden directories, and ordered attachments, requiring raw-media differences and custody lineage.
        - zh: >-
            两个变量可以同时出现，但并不等价。目标寻址回答“哪个受控主机应处理哪项任务”，遍历门控回答“这枚介质是否经过所需角色并允许处理中继”。USB、外置硬盘、文件扩展名、加密算法、命令编号、手工或自动搬运均只是实现细节。多次行程和延时是父级异步通信的固有结构；宿主不可见 VFS 目前只有外传证据；单向任务投递不满足本批要求的结果回路，均不另设正式子项。
          en: >-
            The two variables can coexist but answer different questions. Target addressing decides which compromised host should process a task, while traversal gating decides whether the medium has visited the required roles and may participate in the relay. USB, external disks, extensions, encryption algorithms, command numbers, and manual versus automatic carriage are implementations. Multiple trips and delay are inherent in the parent's asynchronous exchange. Host-opaque VFS currently has exfiltration evidence only, and one-way task delivery fails this batch's result-loop gate, so none becomes another formal child.
    coverage: established
    proposed_subtechnique_keys:
      - B3-T1092-SUB-MAILBOX
      - B3-T1092-SUB-TRAVERSAL
proposed_subtechniques:
  - temporary_key: B3-T1092-SUB-MAILBOX
    proposed_status: formal-candidate
    name:
      zh: 身份定向介质信箱
      en: Identity-Addressed Media Mailboxes
    stable_switch_variable:
      zh: 攻击者是否按目标主机或用户身份及执行状态选择介质上的任务与返回对象
      en: Whether the adversary selects task and return objects on the medium by target host or user identity and execution state
    trace_change:
      zh: 介质不产生面向所有主机的通用载荷，而出现少量以计算机名、用户标识、目标列表或已执行摘要关联的命令包与回传包
      en: The medium carries a small set of command and return packages keyed by computer name, user identifier, target list, or executed-content digest rather than a generic payload for every host
    defender_observation_effect:
      zh: 广泛查找固定文件名或多主机同时执行的规则信号减弱，防守方必须解析或推断收件身份，并把唯一任务包与目标端执行及返回包关联
      en: Rules looking for a fixed filename or simultaneous execution on many hosts lose signal, and defenders must recover recipient identity and join a unique task package to target-side execution and its return package
    sibling_boundary:
      zh: 本项控制消息寻址，不要求介质具有连接角色标记；若关键差异是只有经过两种区域角色才处理介质，则归跨角色遍历状态门控
      en: This child controls message addressing and does not require a connectivity-role marker; classify under traversal-state gating when processing depends on visits to two zone roles
    adjacent_boundaries:
      zh: 按计算机名投递一次载荷但无结果回传属于 T1105 或 NJT-0058 的支持步骤；文件加密或编码分别由数据遮蔽或编码技术研究，不能替代信箱往返
      en: One computer-name-targeted payload delivery without a result return is a supporting step for T1105 or NJT-0058; file encryption or encoding belongs to its own data-obscuration or encoding analysis and does not replace mailbox exchange
    prerequisites:
      zh: 两端组件共享可稳定计算或登记的目标身份，介质反复轮转，并有任务去重与返回对象管理
      en: Components on both sides share a stable computable or registered target identity, media rotates repeatedly, and task deduplication and return-object management exist
    application_scenario:
      zh: USBStealer 先让 B 用计算机名登记，再由操作者写入 COMPUTER_NAME.in；GoldenDealer 的服务器以 tpik 用户标识列表限定可执行文件，并用已执行哈希避免重复运行
      en: USBStealer has B register by computer name before operators write COMPUTER_NAME.in, while GoldenDealer limits executables through a tpik user-ID list and tracks executed hashes to prevent reruns
    causal_chain:
