    unsupported_or_deferred:
      - Public sources do not provide one organization-wide end-to-end timeline joining every media serial, both endpoints, all command files, all result files, and final operator action.
      - ESET did not recover USBStealer's companion A-side operator component and did not observe GoldenDealer's unknown general-file return component.
      - ProjectSauron's host-opaque VFS is supported for exfiltration, not for repeated bidirectional C2, so it is deferred here.
      - Analytic windows, task/result thresholds, and normalized field availability are engineering designs requiring local validation.
      - Linux and macOS platform fields remain a detection gap; the parent can apply, but the proposed endpoint analytic is Windows-specific and the checkpoint analytic is platform-neutral.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级提案分别回答行为、直接目的、概念边界、残余痕迹、正常反例、攻击者队列能力、防守跨区观察和证据限制。两个子项目前是分类与因果研究摘要；主 Agent 正式写入时仍须按 NJT-0001 为每个 NJS 独立补齐定义、匿迹特性、范围、场景、攻防模型、机理、防御和限制，不能把摘要直接当作正式全文。
      en: >-
        The parent proposal separately covers behavior, direct purpose, concept boundary, residual traces, normal counterexamples, attacker queue capabilities, defender cross-zone observation, and evidence limits. The two child records are taxonomy and causal research summaries. The primary agent must independently author full definitions, stealth characteristics, boundaries, scenarios, threat models, mechanisms, defenses, and limitations for each NJS against NJT-0001 rather than using these summaries as canonical prose.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - staging YAML serialization
      - YAML parse verification
      - shared-library lookup
  limitations:
    paragraphs:
      - zh: >-
          USBStealer 来源以样本逆向重建完整四步模型，但明确指出 A 上还需要未恢复的恶意组件；GoldenDealer 来源来自实际受害环境并逆向了双角色线程，却没有观察未知播种组件和一般文件回传组件。因此两者共同强力支持可重复介质 C2 的存在及两条分类轴，却不能证明每一个文件或每一次物理行程都在现场完成，也不能把缺失组件的行为写成直接观察。
        en: >-
          The USBStealer source reconstructs a complete four-step model from samples but explicitly says another malicious component on A is required and was not recovered. The GoldenDealer source comes from a real victim environment and reverse engineers dual-role threads, but it did not observe the unknown seeding component or the general file-return component. Together they strongly support repeatable media C2 and both taxonomy axes, but they do not prove that every file or physical trip completed in the field and must not turn missing-component behavior into direct observation.
      - zh: >-
          介质接入、文件写入、离线执行和日志返回也广泛存在于合法补丁、取证、生产和备份流程。Microsoft 文档证明字段与报告限制，不证明跨主机关联或恶意判别会自动成功；序列号不是强身份，SHA256 通常不保证填充，设备控制事件有上限和延迟。正式 Analytic 必须在部署数据上验证盘符映射、进程唯一键、摘要覆盖、网络事件、台账质量和最长轮转期，并把缺少命令、动作或返回门的结果降级。
        en: >-
          Media attachment, file writes, offline execution, and returned logs are common in legitimate patching, forensics, production, and backup. Microsoft documentation establishes fields and reporting limits, not automatic cross-host correlation or malicious classification. Serials are not strong identity, SHA256 is often unpopulated, and device-control events have caps and delay. A canonical analytic must validate drive mapping, process unique keys, digest coverage, network events, ledger quality, and maximum rotation in deployed data and downgrade any result missing the command, action, or return gate.
      - zh: >-
          原始介质检查可以发现 GoldenDealer 式启动区域标记，却可能与合法引导修复、分区工具和加密介质元数据冲突；固件隐藏区还可能不可见。完整成像、重建和方向固定介质会增加维护时延并影响必须双向交换的业务。控制应按资产与行程基线，结合隐藏信箱和任务—结果谱系，不把任一 MBR 差分、隐藏文件或高熵对象单独当作攻击。
        en: >-
          Raw-media inspection can expose GoldenDealer-like boot-region markers but can conflict with legitimate boot repair, partition tools, and encrypted-media metadata, while firmware-hidden regions may remain invisible. Full imaging, rebuilding, and direction-fixed media add maintenance delay and may disrupt workflows that require bidirectional exchange. Controls need asset and trip baselines joined to hidden mailboxes and task-result lineage rather than treating any MBR difference, hidden file, or high-entropy object as malicious.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 命令包可被加密或编码，但这不是 T1092 父行为必需的痕迹变化；内容遮蔽应在有独立证据时由相关对象承担。
        en: Task packages can be encrypted or encoded, but that is not a trace change required by the T1092 parent and belongs to the relevant content-obscuration object when independently supported.
    - mechanism_ref: NM-FD
      reason:
        zh: 隐藏属性和伪装文件在 USBStealer/GoldenDealer 中存在，却主要支持传播或工件隐蔽；父级介质 C2 不必模仿正常对象，故不作为父级正式机理。
        en: Hidden attributes and disguised files occur in USBStealer and GoldenDealer but primarily support propagation or artifact concealment; media C2 does not require normal-object mimicry, so Feature Disguise is not a parent mechanism.
  open_questions:
    - Can a second independent incident provide complete media-serial, command, execution, result, and connected-side upload telemetry for one observed round trip?
    - Should the primary reviewer classify a GoldenDealer event under both children when target addressing and traversal gating are simultaneously direct, or choose the dominant observation difference per analytic?
    - Can the managed checkpoint reliably hash the full boot region without changing media state, and does its ledger expose direction and zone role as queryable fields?
    - What Linux udev/auditd and macOS Endpoint Security or Disk Arbitration channels can supply equivalent attach, file, and process lineage in supported deployments?
