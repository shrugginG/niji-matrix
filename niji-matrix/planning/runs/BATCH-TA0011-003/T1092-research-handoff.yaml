      observables:
        - zh: 同一介质的启动区域在联网与受限角色接入后发生互补的小范围变化，随后隐藏目录出现命令与结果文件
          en: The same medium's boot region undergoes complementary small changes after connected- and restricted-role attachment, followed by command and result files in a hidden directory
        - zh: 标记满足前无处理中继，标记满足后由固定进程读取任务、执行并更新返回对象
          en: No relay processing occurs before markers qualify, while a stable process reads tasking, executes, and updates return objects after qualification
      correlation:
        window:
          zh: 每个检查站事件与本次行程严格绑定；跨区比较覆盖完整行程，默认四十五日，不把不同资产或重新基线后的摘要混合。
          en: Bind every checkpoint event to its trip; compare across one complete rotation, forty-five days by default, without mixing different assets or post-rebaseline digests.
        dimensions:
          - media_asset_id
          - observed_serial
          - trip_id
          - ordered_zone_role
          - boot_region_hash
          - raw_region_delta
          - file_manifest_delta
          - raw_writer_process
          - task_result_object_lineage
      false_positives:
        - zh: 获批准的启动盘制作、引导修复、介质初始化、分区调整和加密卷元数据更新
          en: Approved boot-media creation, boot repair, media initialization, repartitioning, and encrypted-volume metadata update
        - zh: 合法同步工具、离线补丁系统或防病毒检查站写入隐藏状态和处理清单
          en: Legitimate synchronization, offline patch systems, or antivirus checkpoints write hidden state and processing manifests
      blind_spots:
        - zh: 固件隐藏区域不响应标准原始读取，检查站无法获得完整介质或扫描破坏了原状态
          en: Firmware-hidden regions evade standard raw reads, the checkpoint lacks full-media acquisition, or scanning destroys prior state
        - zh: 介质直接绕过检查站、角色台账错误或原始写入未关联到进程
          en: Media bypasses the checkpoint, zone-role records are wrong, or raw writes lack process attribution
        - zh: 文件系统或控制器的合法小型启动区更新频繁，导致字节差分无稳定资产基线
          en: Frequent legitimate small boot-region updates by the file system or controller prevent a stable per-asset baseline
      tuning_guidance:
        paragraphs:
          - zh: >-
              为每个资产型号和合法用途保存签名启动区域、分区和文件清单，所有重分区或启动修复必须绑定工单并重新基线。优先调查“有序双角色差分、隐藏信箱、任务执行和返回”四项组合；不得使用全局熵阈值、任一 MBR 变化或隐藏属性单独阻断。对不能原始成像的介质，将结论标为文件级门控线索。
            en: >-
              Keep signed boot-region, partition, and file manifests by asset and approved use, requiring a ticket and new baseline for every repartition or boot repair. Prioritize the combination of ordered dual-role difference, hidden mailbox, task execution, and return. Do not block from a universal entropy threshold, any MBR change, or a hidden attribute alone. Where raw imaging is unavailable, label the result a file-level gating lead.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
        - REF-000419
        - REF-000597
      logic_status: implementable_design_not_validated_on_local_data
  mitigations:
    - temporary_key: B3-T1092-MIT-EXTEND-MIT000053
      resolution_recommendation: extend
      existing_ref: MIT-000053
      name:
        zh: 扩展物理、介质与无线入口统一控制以覆盖 C2 往返
        en: Extend Unified Physical Media and Wireless Entry Controls for C2 Round Trips
      rationale:
        zh: MIT-000053 已拥有介质默认拒绝、批准介质跨主机谱系、内容清单、只读介质与检查站等同一控制概念；无需为 T1092 创建同义 MIT，应增加以下逐目标 applications，并保持既有 measures 不变。
        en: MIT-000053 already owns the same control concept through default denial, approved cross-host media lineage, content manifests, read-only media, and inspection stations. Do not create a synonymous MIT for T1092; add the following target applications while keeping existing measures unchanged.
      applications:
        - target_key: B3-T1092-PARENT
          use:
            zh: 对联网区与隔离区禁止同一枚通用可写介质无检查往返；确需双向业务时，以独立检查站签发每次行程，记录源/目的角色、保管人和内容摘要，并优先使用入站只读介质与独立出站介质。控制侧和受限侧只允许批准进程读写指定目录，隔离端禁止介质上的非签名执行内容。
            en: Prohibit unchecked round trips by one general-purpose writable medium between connected and isolated zones. Where business requires bidirectional exchange, issue each trip at an independent checkpoint with source and destination roles, custodian, and content digest, preferring read-only inbound media and separate outbound media. Permit only approved processes and directories on both sides and prohibit unsigned executable content from media on the restricted endpoint.
          expected_effect:
            zh: 攻击者难以把正常轮转变成未审计的命令—结果队列，且每次方向变化都会产生可核对的清单和保管记录。
            en: An adversary has greater difficulty turning routine rotation into an unaudited command-result queue, and each direction change produces a reconcilable manifest and custody record.
          limitations:
            zh: 紧急维护、取证和旧系统可能确需双向可写介质；隔离端无代理、第三方保管和长周期任务仍会造成证据缺口，检查站也不能解释所有加密业务包。
            en: Emergency maintenance, forensics, and legacy systems may require bidirectional writable media. Agentless isolated endpoints, third-party custody, and long rotations still leave evidence gaps, and a checkpoint cannot interpret every encrypted business package.
        - target_key: B3-T1092-SUB-MAILBOX
          use:
            zh: 对离线任务包实施签名、明确收件主机、单调任务号、到期时间和回传目录，并将批准摘要写入逐次清单；受限端仅由专用代理验证后执行，返回结果也须绑定原任务号。阻断收件身份、签名、任务号或目录偏离批准定义的对象。
            en: Require offline task packages to carry a signature, explicit recipient host, monotonic task number, expiry, and return directory, recording approved digests in the per-trip manifest. A dedicated agent on the restricted side executes only after verification, and returned results bind to the originating task number. Block objects whose recipient, signature, task number, or directory differs from approval.
          expected_effect:
            zh: 攻击者的低量定向信箱必须伪造受控任务系统的身份与状态，未知命令和无来源结果会在执行或出区前暴露。
            en: The adversary's sparse addressed mailbox must forge the managed task system's identity and state; unknown commands and unprovenanced results become visible before execution or zone exit.
          limitations:
            zh: 业务系统若没有端到端签名和任务编号，控制只能依赖摘要与人工审批；获准签名密钥或专用代理被攻陷时仍可生成表面合规包。
            en: Without end-to-end package signatures and task numbers, control falls back to digests and manual approval. A compromised approved signing key or dedicated agent can still generate apparently compliant packages.
        - target_key: B3-T1092-SUB-TRAVERSAL
          use:
            zh: 检查站除 DeviceID 与可见文件外，还比较启动区域、分区表、隐藏/系统属性和声明外区域摘要；离开每个安全域前重新生成或彻底清理介质，限制非批准进程打开物理磁盘/卷执行原始写入。无法原始检查的介质不得在联网与高敏区间双向复用。
            en: At checkpoints, compare boot region, partition table, hidden or system attributes, and undeclared-region digest in addition to DeviceID and visible files. Rebuild or sanitize media before departure from each security zone and restrict unapproved processes from raw physical-disk or volume writes. Media that cannot be inspected raw must not be reused bidirectionally between connected and high-sensitivity zones.
          expected_effect:
            zh: 小型 MBR/启动区状态门和隐藏信箱不再因设备获准而自动通过，攻击者必须突破原始写权限或改变签名基线。
            en: Small MBR or boot-region gates and hidden mailboxes no longer pass merely because the device is approved; the adversary must defeat raw-write controls or alter a signed baseline.
          limitations:
            zh: 原始扫描增加处理时间，完整清理会破坏业务数据，固件隐藏区仍可能不可见；合法启动盘或加密卷需要按资产维护独立基线。
            en: Raw scanning adds handling time, complete sanitization destroys business data, and firmware-hidden regions may remain invisible. Legitimate boot media and encrypted volumes need separate per-asset baselines.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
        - REF-000597
        - REF-000419
        - REF-000646
