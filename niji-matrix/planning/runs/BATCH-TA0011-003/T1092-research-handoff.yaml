    zh: >-
      REF-000625 应扩展 locator 以包含 T1092 父行为、TA0011 映射和零子项广度事实；REF-000646 是同一 NIST SP 800-53 Rev.5 出版物，建议扩展 locator 至 MP-7，而非按 PDF URL 重复建 REF。REF-000596、597、598、475、604、419 可直接复用。MIT-000053 的控制概念与 T1092 同义，应 extend applications。DET-000167/NJA-000180 只确认 A 播种到 B 首次执行，DET-000225/NJA-000279/280 只确认外传保管和隐藏区域；把它们扩展为双向 C2 会改变目标、结果门和逻辑，因此新 DET/NJA 应 split/create。
    en: >-
      Extend REF-000625's locator for the T1092 parent, TA0011 mapping, and zero-child breadth fact. REF-000646 is the same NIST SP 800-53 Rev.5 publication and should extend its locator to MP-7 instead of creating a PDF-URL duplicate. REF-000596, 597, 598, 475, 604, and 419 are direct reuse candidates. MIT-000053 has the same control concept and should extend applications for T1092. DET-000167 and NJA-000180 stop at A seeding and B first execution, while DET-000225 and NJA-000279/280 stop at custody exfiltration and hidden media regions. Extending them to bidirectional C2 would change objectives, outcome gates, and logic, so the new DET and NJAs should be split and created.
library_candidates:
  references:
    - key: B3-T1092-REF-GOLDENJACKAL
      title:
        zh: GoldenJackal 隔离网工具集技术分析
        en: Mind the Air Gap, GoldenJackal Gooses Government Guardrails
      source_type: sample-and-incident-analysis
      publisher: ESET Research
      author: Matias Porolli
      published: '2024-10-07'
      url: https://www.welivesecurity.com/en/eset-research/mind-air-gap-goldenjackal-gooses-government-guardrails/
      locator: GoldenDealer overview; network-connectivity thread; downloader thread; connected and air-gapped USB monitoring threads; Table 7 T1092 mapping
      credibility: high
      evidence_limit:
        zh: ESET 观察了目标环境中的工具并逆向 GoldenDealer；未知播种组件和把文件从隔离端复制到 USB 的另一组件未被观察，因此案例可确认 GoldenDealer 的执行文件—系统信息双向机制，不能把整个文件外传链都写成直接观察。
        en: ESET observed tooling in the victim environment and reverse engineered GoldenDealer. The unknown seeding component and another component copying files from the isolated side to USB were not observed, so the case can establish GoldenDealer's executable-to-system-information bidirectional mechanism but not treat the whole file-exfiltration chain as directly observed.
    - key: B3-T1092-REF-ATTACK-DET0090
      title:
        zh: ATT&CK DET0090 可移动介质跨主机 C2 中继
        en: ATT&CK DET0090 Cross-Host C2 via Removable Media Relay
      source_type: official-documentation
      publisher: MITRE ATT&CK
      url: https://attack.mitre.org/detectionstrategies/DET0090/
      locator: AN0247 to AN0249 general mount-write-read-or-execute sequence and mutable time windows
      credibility: high
      evidence_limit:
        zh: 用于检测设计线索；页面的通用跨主机序列不自动证明 Niji 的往返结果门、字段可用性或生产阈值。
        en: Use as a detection-design clue. Its generic cross-host sequence does not establish Niji's round-trip outcome gate, field availability, or production thresholds.
  claims:
    - key: B3-T1092-CLM-PARENT
      statement:
        zh: T1092 的父行为是在两端已受控后，以反复轮转的可移动介质把任务送入断连/受限系统并把结果或文件中继回控制侧，从而维持异步 C2。
        en: T1092 uses repeatedly rotated removable media after both sides are compromised to carry tasks into a disconnected or restricted system and relay results or files to the control side, sustaining asynchronous C2.
      evidence_keys:
        - REF-000625
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
      evidence_mode: direct-parent-and-sample-analysis
    - key: B3-T1092-CLM-MAILBOX
      statement:
        zh: USBStealer 用计算机名命令文件寻址 B，GoldenDealer 用用户标识目标列表和已执行哈希限制任务处理，支持身份定向信箱为稳定变量。
        en: USBStealer addresses B through a computer-name command file, while GoldenDealer limits task processing through a user-ID target list and executed-content hashes, supporting identity-addressed mailboxes as a stable variable.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
      evidence_mode: direct-sample-analysis
    - key: B3-T1092-CLM-TRAVERSAL
      statement:
        zh: USBStealer 以联网接入标记和硬件 ID 识别返回路径，GoldenDealer 以两个角色分别写入的 BOOTMGR 字节门控隐藏信箱，支持跨角色遍历状态为稳定变量。
        en: USBStealer identifies a return path through an Internet-contact marker and remembered hardware ID, while GoldenDealer gates hidden mailboxes through BOOTMGR bytes written separately by the two roles, supporting cross-role traversal state as a stable variable.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
      evidence_mode: direct-sample-analysis
    - key: B3-T1092-CLM-OBSERVATION
      statement:
        zh: 介质中继把命令与结果分散到不同主机、挂载会话和保管时间，网络传感器没有端到端会话，需以介质资产、内容、进程与行程恢复控制闭环。
        en: Media relay disperses commands and results across hosts, mount sessions, and custody time, leaving network sensors without an end-to-end session and requiring media-asset, content, process, and trip lineage to reconstruct the control loop.
      evidence_keys:
        - REF-000596
        - B3-T1092-REF-GOLDENJACKAL
        - REF-000597
      evidence_mode: bounded-inference-from-direct-sequences-and-telemetry-semantics
  cases:
    - key: B3-T1092-CASE-USBSTEALER-C2
      name:
        zh: USBStealer 按主机寻址的介质命令—文件返回链
        en: USBStealer Host-Addressed Media Command and File-Return Chain
      actor_or_campaign: Sednit or APT28 USBStealer sample family
      central_facts:
        zh: A 端操作者读取 B 登记的计算机名并写入加密 COMPUTER_NAME.in；介质回到 B 后命令被连续执行，文件或清单被写回介质，再由 A 侧取用。
        en: Operators on A obtain B's registered computer name and write encrypted COMPUTER_NAME.in; when the medium returns to B, commands execute consecutively, files or listings are written back, and A later retrieves them.
      evidence_keys:
        - REF-000596
      scope_limit:
        zh: ESET 逆向证明能力和四步模型，但 A 上另一个操作者组件未恢复，不能声称获得完整受害组织遥测。
        en: ESET reverse engineering establishes capability and the four-step model, but the companion operator component on A was not recovered and full victim-environment telemetry is unavailable.
      duplicate_resolution_note:
        zh: 与 CASE-000277 同源但中央事实不同；CASE-000277 只记录外传返回路径，本案例需 split 以保存向内命令和闭环含义。
        en: It shares a source with CASE-000277 but has a different central fact; CASE-000277 records the exfiltration return path only, so split is required to preserve inward tasking and loop meaning.
    - key: B3-T1092-CASE-GOLDENDEALER
      name:
        zh: GoldenDealer 双角色介质执行文件—系统信息交换
        en: GoldenDealer Dual-Role Media Executable and System-Information Exchange
      actor_or_campaign: GoldenJackal 2019 South Asian embassy campaign
      central_facts:
        zh: GoldenDealer 根据联网状态运行不同线程，以两枚 BOOTMGR 字节确认介质经过联网与隔离角色，把按用户标识选定的执行文件送入隔离端，并把隔离端系统信息带回联网端发送至 C2。
        en: GoldenDealer selects threads by network state, uses two BOOTMGR bytes to confirm visits to connected and isolated roles, delivers executables selected by user ID to the isolated side, and returns isolated-host information to the connected side for transmission to C2.
      evidence_keys:
        - B3-T1092-REF-GOLDENJACKAL
      scope_limit:
        zh: ESET 未观察负责把一般文件从隔离端复制到 USB 的未知组件；案例只覆盖 GoldenDealer 已逆向的执行文件和系统信息通道。
        en: ESET did not observe the unknown component responsible for copying general files from the isolated side to USB; the case is limited to GoldenDealer's reverse-engineered executable and system-information channel.
