defense_candidates:
  detection_strategies:
    - temporary_key: B3-T1092-DET-ROUNDTRIP
      resolution_recommendation: create
      name:
        zh: 可移动介质命令—结果往返谱系
        en: Removable-Media Command-to-Result Round-Trip Lineage
      objective:
        zh: 以同一介质行程重建控制侧任务写入、受限侧读取/执行、结果写回、控制侧取用和后继外联，区分 C2 闭环与传播、单向外传及正常离线交换。
        en: Reconstruct control-side task write, restricted-side read or execution, result write, control-side consumption, and subsequent egress through the same media trips, separating a C2 loop from propagation, one-way exfiltration, and normal offline exchange.
      targets:
        - B3-T1092-PARENT
        - B3-T1092-SUB-MAILBOX
        - B3-T1092-SUB-TRAVERSAL
      domains:
        - enterprise
      analytic_keys:
        - B3-T1092-NJA-ROUNDTRIP
        - B3-T1092-NJA-STATE
      evidence_keys:
