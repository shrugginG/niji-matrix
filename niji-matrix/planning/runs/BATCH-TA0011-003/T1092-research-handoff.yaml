research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: target_identity_and_execution_state_addressing
        result: formal-candidate
        reason: USBStealer and GoldenDealer independently implement target-specific task selection, sparse traces, and identity/content lineage defense
      - axis: connected_restricted_role_traversal_state
        result: formal-candidate
        reason: both families gate media use with attacker-controlled prior-contact state, while GoldenDealer directly moves the gate into raw boot-record bytes
      - axis: host_opaque_storage
        result: evidence-deferred
        reason: ProjectSauron supports hidden VFS exfiltration but not a repeatable inward-command and outward-result mailbox
      - axis: trip_timing_and_delay
        result: parent-core
        reason: custody delay is inherent to store-and-forward exchange and sources do not support a separately controlled stealth cadence
      - axis: one_way_task_delivery
        result: adjacent-technique
        reason: without result return or repeatable tasking it resolves to propagation, tool transfer, or physical delivery rather than T1092 C2
      - axis: USB_or_external_disk_type
        result: not-stealth-distinct
        reason: medium type alone does not change the command-result observation model
      - axis: manual_or_automatic_carriage
        result: not-stealth-distinct
        reason: carrier automation is not independently evidenced and does not itself define message lineage or defense
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线无 ATT&CK 子项，但开放检验了寻址、遍历状态、宿主可见性、时间、方向、介质类型和搬运方式。只有身份寻址和遍历门控同时通过稳定性、痕迹变化、观察差异、独立证据与防御差异门。
      en: The fixed baseline has no ATT&CK children, but the open search tested addressing, traversal state, host visibility, time, direction, media type, and carriage method. Only identity addressing and traversal gating pass stability, trace-change, observation-difference, independent-evidence, and defense-difference gates.
