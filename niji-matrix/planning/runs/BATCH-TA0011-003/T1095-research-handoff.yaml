      author: Intel
      url: https://software.intel.com/sites/manageability/AMT_Implementation_and_Reference_Guide/WordDocuments/enablingauditing.htm
      locator: audit records contain initiating user and time; remote-control/redirection event groups and audit collection requirements
      support: official_management_audit_fields_and_limitations
  claims:
    - key: B3-T1095-CLM-ADMISSION
      proposition_zh: 固定基线 T1095 覆盖没有真实应用事务的低层或平台通信；Niji 仅准入能证明持续任务/结果与观察差的实现
      proposition_en: Fixed-baseline T1095 covers lower-layer or platform communication without a real application transaction; Niji admits only implementations with proven continuing task or result exchange and observation difference
      evidence_keys: [B3-T1095-REF-ATTACK-REUSE, B3-T1095-REF-PINGPULL, B3-T1095-REF-VMCI-REUSE]
      mode: baseline_plus_original_evidence
    - key: B3-T1095-CLM-DATAGRAM
      proposition_zh: PingPull ICMP 与 ShadowPad UDP 都在无连接承载上自定义标识、角色和序列字段来恢复任务会话
      proposition_en: PingPull ICMP and ShadowPad UDP each use custom identity, role, and sequencing fields to restore a task session over connectionless carriage
      evidence_keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD]
      mode: independent_original_sample_analyses
    - key: B3-T1095-CLM-VMCI
      proposition_zh: UNC3886 的 VMCI 后门把宿主—来宾控制留在同一裸机且默认网络工具不可见，从而绕过网络分段与开放端口审查
      proposition_en: UNC3886 VMCI backdoors keep host-to-guest control on one bare-metal machine and invisible to default network tools, bypassing network segmentation and open-port review
      evidence_keys: [B3-T1095-REF-VMCI-REUSE]
      mode: directly_observed_incidents
    - key: B3-T1095-CLM-SOL
      proposition_zh: PLATINUM 使用 AMT SOL 的文件传输由管理引擎处理，主机防火墙与网络监视应用不可见，但来源不确定攻击者如何配置 AMT
      proposition_en: PLATINUM file transfer over AMT SOL is handled by the management engine and invisible to host firewall and network-monitoring applications, while the source is uncertain how the actor provisioned AMT
      evidence_keys: [B3-T1095-REF-PLATINUM]
      mode: original_vendor_observation_with_explicit_uncertainty
    - key: B3-T1095-CLM-BOUNDARY
      proposition_zh: 端口配对、完整内层协议封装、魔术激活、编码和加密分别属于 T1571、T1572、T1205、T1132 和 T1573；它们不能代替 T1095 的持续直接承载证据
      proposition_en: Port pairing, intact inner-protocol encapsulation, magic activation, encoding, and encryption belong respectively to T1571, T1572, T1205, T1132, and T1573 and cannot substitute for evidence of continuing direct T1095 carriage
      evidence_keys: [B3-T1095-REF-ATTACK-REUSE]
      mode: fixed_baseline_semantic_boundary
    - key: B3-T1095-CLM-DEFENSE
      proposition_zh: 分组字段、Linux socket 系统调用、VMCI CID/port 与 AMT SOL 审计可实施差异化关联，但文档不证明任何告警阈值或检测精度
      proposition_en: Packet fields, Linux socket syscalls, VMCI CIDs and ports, and AMT SOL audit enable distinct correlation, but documentation does not establish any alert threshold or detection accuracy
      evidence_keys: [B3-T1095-REF-SURICATA-ICMP, B3-T1095-REF-LINUX-AUDIT, B3-T1095-REF-OPENVMTOOLS, B3-T1095-REF-INTEL-AUDIT]
      mode: official_field_documentation_plus_bounded_design_inference
  cases:
    - key: B3-T1095-CASE-PINGPULL
      name: PingPull ICMP and raw TCP control variants
      central_fact: Examined samples implement Echo Request polling, Echo Reply commands, sequenced and length-tracked result packets, and a separate raw TCP length-framed round trip
      evidence_keys: [B3-T1095-REF-PINGPULL]
      scope_limit: Command and file-read examples were issued in Unit 42's analysis environment; do not present them as captured operator commands or measured sensor evasion
    - key: B3-T1095-CASE-SHADOWPAD
      name: ShadowPad custom UDP session protocol
      central_fact: Samples contain an eight-byte UDP header with request/response type and source/destination session IDs; protocol emulation validated live server responses
      evidence_keys: [B3-T1095-REF-SHADOWPAD]
      scope_limit: Active scanning proves protocol/server behavior, not compromise of a particular victim or bypass of a deployed detector
    - key: B3-T1095-CASE-VMCI
      name: UNC3886 VMCI backdoors across ESXi and guests
      central_fact: Mandiant confirmed malicious VIB backdoors using VMCI to reconnect between any guest and compromised ESXi without traversing external networking
      evidence_keys: [B3-T1095-REF-VMCI-REUSE]
      scope_limit: Public reporting describes capability and multiple investigations but does not publish every VMCI command or standardized socket event
    - key: B3-T1095-CASE-PLATINUM
      name: PLATINUM AMT Serial-over-LAN file transfer
      central_fact: Microsoft's research observed an evolved file-transfer tool using AMT SOL outside host firewall and host network-monitor visibility
      evidence_keys: [B3-T1095-REF-PLATINUM]
      scope_limit: Source is uncertain whether the actor provisioned AMT or reused already enabled management; file transfer is direct evidence while broader interactive C2 should not be inferred
  detection_strategies: [B3-T1095-DET-PACKET-SESSION, B3-T1095-DET-ALTPLANE]
  detection_analytics: [B3-T1095-NJA-ICMP, B3-T1095-NJA-UDP, B3-T1095-NJA-VSOCK, B3-T1095-NJA-SOL]
  mitigations: [B3-T1095-MIT-LOWERLAYER, B3-T1095-MIT-ALTPLANE]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [network_control_messages, raw_transport_streams, connectionless_datagrams, platform_local_socket_families, firmware_management_channels]
    breadth_trigger: ordinary_open_ended_search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: connectionless_task_state_externalization
        result: formal_candidate
        child_key: B3-T1095-SUB-DATAGRAM
        reason: PingPull and ShadowPad independently show custom sequence/identity fields replacing transport session state; packet reconstruction and egress controls differ from stream C2
      - axis: host_stack_observation_plane_displacement
        result: formal_candidate
        child_key: B3-T1095-SUB-ALTPLANE
        reason: VMCI and AMT SOL independently move communication outside host IP telemetry and require platform management/integrity defenses
      - axis: application_parser_absence_over_raw_TCP
        result: parent-core
        reason: Custom TCP length framing directly expresses the adapted parent but retains ordinary connection state and lacks another stable child variable
      - axis: diagnostic_or_control_message_name
        result: not-stealth-distinct
        reason: ICMP, UDP, TCP, VMCI and SOL are carrier names; formal axes derive from session-state and observation-plane effects
      - axis: shared_open_port_and_magic_authentication
        result: adjacent-technique
        owner: T1205
        reason: Signal-controlled activation or packet interception is owned by Traffic Signaling; continuing raw transport may co-occur only after independent proof
      - axis: intact_inner_session
        result: adjacent-technique
        owner: T1572
        reason: Encapsulation of SSH, TCP or another intact session is tunneling rather than direct custom command carriage
      - axis: atypical_port_pairing
        result: adjacent-technique
        owner: T1571
        reason: Port selection changes parser expectations but does not define the communication layer or a T1095 child
      - axis: encoding_or_encryption
        result: adjacent-technique
        owner: T1132/T1573
        reason: Base64, AES and custom transformations affect content inspectability, not connection state or observation plane
      - axis: SOCKS_or_generic_proxy
        result: adjacent-technique
        owner: T1090/NJT-0160
        reason: A real SOCKS transaction or forwarding relationship is proxy/application behavior despite historical inclusion in the ATT&CK parent description
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定基线没有 ATT&CK 子项，但父级实现面横跨 raw TCP/UDP/ICMP、平台局部 VMCI 和管理引擎，因此研究未停在协议名称。两个候选轴分别改变会话状态位置与传感器所在平面，具有独立样本、痕迹和防御；raw TCP 留在父级，魔术信号、隧道、端口、编码和代理按相邻对象收敛。
      en: >-
        The fixed baseline has no ATT&CK children, but its implementation surface spans raw TCP, UDP, ICMP, platform-local VMCI, and management engines, so research did not stop at protocol names. Two candidate axes respectively move session state and the sensor observation plane and have independent samples, traces, and defenses. Raw TCP stays parent core, while magic signaling, tunneling, ports, encoding, and proxies converge to adjacent objects.
  evidence_coverage:
    parent_behavior_keys: [B3-T1095-REF-ATTACK-REUSE, B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD, B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM]
    boundary_keys: [B3-T1095-REF-ATTACK-REUSE, B3-T1095-REF-PINGPULL]
    mechanism_support:
      - {mechanism: NM-BT, keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD, B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM], level: direct_carrier_and_visibility_facts}
      - {mechanism: NM-ST, keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD], level: direct_custom_sequence_and_state_fields}
    child_existence_support:
      - {child_key: B3-T1095-SUB-DATAGRAM, keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD, B3-T1095-REF-RFC792]}
      - {child_key: B3-T1095-SUB-ALTPLANE, keys: [B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM, B3-T1095-REF-VSOCK, B3-T1095-REF-OPENVMTOOLS]}
    unsupported_or_deferred:
      - PingPull task/result examples are laboratory-issued commands, not captured operator tasking in a victim environment.
      - ShadowPad active protocol emulation identifies server behavior but not actual victim traffic or alert evasion.
      - The PLATINUM source is uncertain how AMT was provisioned and directly supports file transfer rather than arbitrary interactive shell claims.
      - Mandiant confirms VMCI backdoors and visibility gaps but does not publish a standardized VMCI event stream or every command.
      - No source supplies universal ICMP/UDP sizes, entropy, timing, or false-positive rates; all windows are engineering starting points.
      - Linux audit syscall arguments expose family/type for socket but peer CID/port needs sockaddr-aware eBPF or equivalent enrichment.
      - An attacker controlling a hypervisor, firmware manager, or packet sensor path may tamper with the very telemetry required for detection.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级与两项子候选分别覆盖行为定义、直接目的、痕迹、残余、正常反例、相邻边界、场景、攻击前提、防守观察、机理、证据和限制。主 Agent 仍需统一复核批内 T1090/T1102/T1104 边界，并决定两个子项及共享对象的正式去留；暂存对象不是已验收的正式 YAML。
      en: >-
        The parent and two child candidates separately cover behavior definition, direct purpose, traces, residuals, normal counterexamples, adjacent boundaries, scenarios, attacker prerequisites, defender observation, mechanism, evidence, and limitations. The primary agent must still converge boundaries with batch T1090, T1102, and T1104 and decide the formal fate of both children and shared objects; staging objects are not validated canonical YAML.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [manual_staging_yaml_serialization, fixed_STIX_query, YAML_and_evidence_key_validation]
  limitations:
    paragraphs:
      - zh: >-
          直接来源证明样本或事件采用低层/替代平面通信，并明确描述部分报文结构和观察缺口，但没有给出受害组织完整传感器布局、许可基线、告警阈值或漏报率。无连接分组“难关联”和替代平面“不可见”必须相对具体传感器陈述；完整 PCAP、socket-family 审计、虚拟化清单或 AMT 固件审计可显著降低匿迹效果。
        en: >-
          Direct sources establish lower-layer or alternate-plane communication in samples or incidents and describe packet structures and observation gaps, but do not provide a victim organization's complete sensor layout, allow baseline, alert threshold, or miss rate. Claims that connectionless packets are hard to join or an alternate plane is invisible must name the relevant sensor. Full PCAP, socket-family audit, virtualization inventory, or AMT firmware audit can materially reduce the stealth effect.
      - zh: >-
          正常网络和平台行为非常宽泛：ICMP 诊断、UDP 实时业务、QUIC、虚拟化代理、备份、VMware Tools、AMT 维护和已批准自定义设备协议均会产生相似信号。检测设计因此要求身份、结构和结果联合，不能依赖协议号、端口、随机填充、VIB 接受级别或 SOL 开启状态单点判定。控制措施也需按业务验证，禁用 VMCI/SOL 或广泛阻断 ICMP/UDP 会造成实质运营影响。
        en: >-
          Normal network and platform behavior is broad: ICMP diagnostics, real-time UDP, QUIC, virtualization agents, backup, VMware Tools, AMT maintenance, and approved custom device protocols can look similar. Detection therefore requires identity, structure, and outcome together rather than one protocol number, port, random padding, VIB acceptance level, or enabled SOL state. Controls also need business validation because disabling VMCI or SOL or broadly blocking ICMP or UDP can materially affect operations.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Encoding, encryption and content hiding are adjacent T1132/T1573/NJT-0152 concerns; lower-layer carriage alone does not establish obscured content.}
    - {mechanism_ref: NM-FD, reason: A protocol number or port may be misclassified, but the supported formal axes concern missing state and observation plane rather than imitation of a legitimate service contract.}
  open_questions:
    - Can the primary agent obtain a second original non-VMware hypervisor or firmware case for the alternate-plane child beyond PLATINUM SOL?
    - Which deployed endpoint sensor, if any, exports sockaddr_vm peer CID and port on ESXi/Linux without relying on a compromised hypervisor?
    - Does the organization collect full ICMP payloads and UDP datagram boundaries, or only sampled flow summaries?
    - Should raw IP protocols without ICMP/UDP receive a separate research pass if an original sample provides a defense distinction beyond connectionless sequencing?
    - During batch convergence, ensure T1090 owns forwarding topology and T1104 owns functional channel staging rather than reusing the two axes proposed here.
