  analytic_refs: []
  mitigation_refs: []
  relationship_refs: []
  duplicate_search_note:
    zh: >-
      已用 library_lookup 和精确 URL/关键词检查 raw protocol、ICMP、VMCI、vsock、Serial-over-LAN 与 PingPull。REF-000625 应复用并由主 Agent 将 locator 扩展到 T1095 及边界对象；REF-000053 与 Mandiant 2023 VMCI URL 完全相同，应扩展 locator/notes，而非重复建 REF；REF-000634 可支持 TCP/UDP/ICMP 流字段。CASE-000072 与 CLM-000404 描述 Guest Operations/跨层进程来源，不是 VMCI 持续套接字 C2，不能仅凭 UNC3886 名称复用。REF-000440 和 DET-000117 等 SYNful Knock 对象属于 T1205 激活信号，不能复用为持续无连接任务会话。
    en: >-
      Library lookup and exact URL or keyword searches covered raw protocol, ICMP, VMCI, vsock, Serial-over-LAN, and PingPull. Reuse REF-000625 and have the primary agent extend its locator to T1095 and adjacent boundaries. REF-000053 has the exact Mandiant 2023 VMCI URL and should receive locator and notes extension rather than a duplicate REF. REF-000634 can support TCP, UDP, and ICMP flow fields. CASE-000072 and CLM-000404 describe Guest Operations or cross-layer process provenance rather than continuing VMCI socket C2 and must not be reused solely because UNC3886 appears. REF-000440, DET-000117, and related SYNful Knock objects concern T1205 activation signaling and are not the same as a continuing connectionless task session.
