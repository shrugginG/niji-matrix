handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-003
work_item_ref: WORK-TA0011-T1095
temporary_key_prefix: B3-T1095
candidate:
  source_type: attack
  source_attack_id: T1095
  name: {zh: 非应用层协议, en: Non-Application Layer Protocol}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          >-
          ATT&CK Enterprise 19.1 的 T1095 明确覆盖以网络层、传输层、会话层或平台局部通信机制在受害主机与控制端之间交换数据。PingPull 的 ICMP Echo 请求/回复及 raw TCP 变体、ShadowPad 的 UDP 自定义会话、UNC3886 的 VMCI 后门和 PLATINUM 的 AMT Serial-over-LAN 均提供原始技术分析，证明这种行为在现实样本或事件中存在，并造成应用解析缺失或观察平面迁移。
        en: >-
          >-
          Enterprise ATT&CK 19.1 T1095 explicitly covers exchange between a victim and controller through network-layer, transport-layer, session-layer, or platform-local communication mechanisms. Original technical analyses of PingPull's ICMP Echo and raw TCP variants, ShadowPad's custom UDP session, UNC3886's VMCI backdoors, and PLATINUM's AMT Serial-over-LAN establish this behavior in samples or incidents and show either absent application parsing or movement of the observation plane.
      - zh: >-
          >-
          Niji 应作 adapt，因为固定基线描述同时列出 SOCKS、重定向/隧道协议及各种仅凭 TCP/UDP 名称的案例，容易与真实应用事务、代理和隧道对象重叠。正式父级应收敛为“持续任务与结果直接承载在非应用事务通道上”，要求说明攻击者可控的承载方式、痕迹变化和防守观察差。端口选择、协议名称、加密或编码都不能单独构成准入或子技术。
        en: >-
          >-
          Niji should adapt the source because the fixed baseline also lists SOCKS, redirected or tunneled protocols, and many cases described only by TCP or UDP names, creating overlap with real application transactions, proxies, and tunneling. The formal parent should converge on continuing task and result carriage directly over a channel without an application transaction and require an attacker-controlled carrier choice, trace change, and defender-observation differential. Port selection, protocol name, encryption, or encoding alone cannot establish admission or a child.
  scope_notes:
    zh: >-
      >-
      父级以有证据的持续 C2 为必要条件。单次魔术包激活归 T1205；完整内层协议封装归 T1572；真实 HTTP、DNS、MQTT、SSH 或 SOCKS 事务按实际行为归 NJT-0160、T1090 或其他相邻对象。并列归类仅在持续后继通信本身仍满足本父级时成立。
    en: >-
      >-
      Evidence of continuing C2 is required. A one-time magic-packet activation belongs to T1205; intact inner-protocol encapsulation belongs to T1572; real HTTP, DNS, MQTT, SSH, or SOCKS transactions map by actual behavior to NJT-0160, T1090, or another adjacent object. Concurrent classification is appropriate only where continuing successor communication independently satisfies this parent.
proposed_content:
  name: {zh: 无应用事务控制通道, en: Applicationless Control Channels}
  summary:
    zh: >-
      >-
      攻击者把任务和结果直接组织在网络、传输或平台局部通道中，使通信缺少常规应用事务语义或移出主机网络观察面。
    en: >-
      >-
      Adversaries organize tasks and results directly in network, transport, or platform-local channels, leaving communication without ordinary application-transaction semantics or moving it outside host network observation.
  definition_and_concept:
    paragraphs:
      - zh: >-
          >-
          无应用事务控制通道指植入体与控制端不按 HTTP、DNS、邮件、消息 broker 或其他真实应用协议的事务规则交互，而是直接在 ICMP 消息、TCP/UDP 字节或数据报、VMCI/vsock、Serial-over-LAN 等低层或平台专用通道中定义自己的登记、任务、分片和结果格式。其直接目的仍是维持可重复的命令执行、载荷投送或结果回传；“无应用事务”描述承载层的语义边界，并不表示通信没有攻击者自定义协议。
        en: >-
          >-
          Applicationless Control Channels covers an implant and controller that do not transact according to HTTP, DNS, mail, message-broker, or another real application protocol. They instead define their own registration, tasking, fragmentation, and result formats directly in ICMP messages, TCP or UDP byte streams and datagrams, VMCI or vsock, Serial-over-LAN, or another lower-layer or platform-specific channel. The direct purpose remains repeatable command execution, payload delivery, or result return. Applicationless describes the carrier's semantic boundary and does not mean the exchange lacks an attacker-defined protocol.
      - zh: >-
          >-
          该概念必须由消息往返或代码级客户端/服务端逻辑确认。端口 443 上的自定义 TCP 仍可能属于本项，因为没有 HTTPS 事务；相反，53 端口上的真实 DNS 查询属于 NJT-0160，即使数据可疑。单纯看到 TCP、UDP、ICMP、VMCI 或一个 raw socket 不足以证明 C2，正常诊断、集群、虚拟化代理、实时媒体、游戏、VPN 和设备管理都能产生相似痕迹。
        en: >-
          >-
          Classification requires confirmed message exchange or code-level client and server logic. Custom TCP on port 443 can remain here when no HTTPS transaction exists, whereas a real DNS query on port 53 belongs to NJT-0160 even if its data is suspicious. TCP, UDP, ICMP, VMCI, or a raw socket alone does not establish C2; diagnostics, clustering, virtualization agents, real-time media, games, VPNs, and device management can produce similar traces.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          >-
          常规代理和 NDR 常以应用解析器生成方法、主机名、URI、事务 ID 或用户身份。本技术让相同设备只留下五元组、ICMP 类型/代码、字节量、数据报序列或非 IP 地址族标识，防守方因此失去标准事务字段，必须从原始分组、进程套接字和后继执行重建控制关系。PingPull 在 ICMP Echo 数据段中维护序列号及 total/current 长度，ShadowPad 在 UDP 头中自行维护源/目标会话 ID，显示攻击者必须补回底层承载没有提供的任务会话语义。
        en: >-
          >-
          Proxies and NDR systems commonly rely on application parsers to produce methods, hostnames, URIs, transaction IDs, or user identity. This technique leaves only a five-tuple, ICMP type and code, byte counts, datagram sequence, or non-IP address-family identifiers, requiring defenders to rebuild the control relationship from raw packets, process sockets, and successor execution. PingPull keeps sequence and total or current lengths inside ICMP Echo data, while ShadowPad maintains source and destination session IDs in its own UDP header, showing the actor must replace session semantics absent from the carrier.
      - zh: >-
          >-
          某些实现进一步把通信移出主机 IP 栈或外部网络链路。Mandiant 记录的 VMCI 只在同一裸机的 ESXi 与来宾之间路由，默认 tcpdump、netstat、nmap 和 Wireshark 看不到；PLATINUM 的 AMT SOL 由独立管理引擎处理，主机防火墙与网络监视应用不见该流量。残余痕迹转移到虚拟化/固件配置、替代地址族套接字、管理会话、恶意 VIB、设备驱动及命令后的进程或文件结果。
        en: >-
          >-
          Some implementations move communication beyond the host IP stack or external network path. Mandiant documents VMCI routing only between ESXi and guests on one bare-metal host and being invisible to default tcpdump, netstat, nmap, and Wireshark. PLATINUM's AMT SOL traffic is handled by a separate management engine and is absent from host firewall and network-monitoring applications. Residual evidence moves to virtualization or firmware configuration, alternate-address-family sockets, management sessions, malicious VIBs, device drivers, and process or file outcomes after commands.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          >-
          纳入对象必须持续或可重复地在没有真实应用事务的通道中承载命令、结果或控制载荷，并有报文结构、代码或事件链证明接收端会解析并采取行动。仅一次数据传输、单向扫描、网络错误、健康检查或正常基础设施通信不满足条件。协议类型和端口是实现证据，不能成为 Niji 子技术边界；自定义 TCP、UDP 和 ICMP 可处于同一父级，分类取决于会话状态与观察平面等稳定变量。
        en: >-
          >-
          Included behavior must repeatedly or continuously carry commands, results, or control payloads through a channel without a real application transaction, with packet structure, code, or an event chain showing receiver parsing and action. One data transfer, one-way scanning, network errors, health checks, or normal infrastructure communication does not qualify. Protocol type and port are implementation evidence rather than Niji child boundaries. Custom TCP, UDP, and ICMP can share this parent, with classification based on stable variables such as session state and observation plane.
      - zh: >-
          >-
          NJT-0160 要求真实应用事务，T1571 负责应用协议与非典型端口配对，故端口 443 上的 raw TCP 不会仅因端口成为 HTTPS。T1572 要求把完整内层会话封装在另一协议中；直接在 ICMP 或 UDP 中定义命令格式仍属于本项。T1205 负责魔术值或序列激活功能；若信号后另建通道则只把后继直接通信评为本项。T1132/T1573 分别负责编码与加密，不能把 PingPull 的 Base64/AES 或 ShadowPad 的编码算法当作本技术子项。
        en: >-
          >-
          NJT-0160 requires a real application transaction, while T1571 owns atypical protocol-to-port pairings; raw TCP on 443 does not become HTTPS because of the port. T1572 requires encapsulation of an intact inner session in another protocol, whereas commands defined directly in ICMP or UDP remain here. T1205 owns magic values or sequences that activate functionality; where signaling opens another channel, only the continuing direct communication is evaluated here. T1132 and T1573 own encoding and encryption, so PingPull's Base64 and AES or ShadowPad's encoding algorithm cannot define children of this technique.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            >-
            在允许 ICMP 诊断但代理只记录 Web 事务的边界，植入体可以 Echo Request 轮询并从 Echo Reply 接收命令，再用自定义序列与长度字段回传结果。在允许广泛 UDP 的网络，植入体可用自定义数据报握手和会话 ID 维持控制，而不产生应用解析记录。在已攻陷 ESXi 或具备 AMT 的设备上，攻击者还可选择 VMCI 或 SOL，让同裸机来宾、宿主或管理控制台之间的控制避开通常的主机 IP 监控。
          en: >-
            >-
            At a boundary permitting ICMP diagnostics while proxies record only web transactions, an implant can poll with Echo Requests, receive commands in Echo Replies, and return results using custom sequence and length fields. On a network allowing broad UDP, an implant can maintain control with a custom datagram handshake and session IDs without application-parser records. On compromised ESXi or AMT-capable devices, an actor can instead select VMCI or SOL so control among guests, host, or management console avoids ordinary host IP monitoring.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              >-
              攻击者需要在植入与控制端实现相同的低层报文或套接字逻辑，并拥有创建 raw socket、使用 UDP、安装/调用 VMCI 组件或访问 AMT SOL 所需的权限与平台知识。无连接实现须处理丢包、乱序、分片和重传；替代控制平面实现通常要求先取得管理员、root、ESXi 或管理凭据。低层通道减少现成应用基础设施的掩护，也可能因环境中罕见而更加显眼。
            en: >-
              >-
              The actor needs matching low-level packet or socket logic in implant and controller, plus permissions and platform knowledge to create raw sockets, use UDP, install or invoke VMCI components, or access AMT SOL. Connectionless designs must handle loss, reordering, fragmentation, and retransmission. Alternate-control-plane designs normally require administrator, root, ESXi, or management credentials first. A lower-layer channel also loses cover from ordinary application infrastructure and may stand out where rare.
      defender_model:
        paragraphs:
          - zh: >-
              >-
              防守方可在网络边界取得完整分组或至少包含协议、方向、分组数、字节数和时间的双向流，在部分端点取得进程、套接字地址族/类型、系统调用和子进程。虚拟化与带外管理环境还需保存 VM/宿主/CID 清单、VIB 与 Secure Boot 状态、AMT 配置及管理会话。若只有采样 NetFlow、没有 ICMP 负载、没有 raw/vsock 系统调用或管理平面日志，结论只能是未解析流量异常，不能声称已还原命令。
            en: >-
              >-
              Defenders may obtain full packets at network boundaries or at least bidirectional flows with protocol, direction, packet counts, bytes, and time, and may obtain process, socket address family and type, system calls, and child-process outcomes on some endpoints. Virtualization and out-of-band management environments additionally need VM, host, and CID inventory, VIB and Secure Boot state, AMT configuration, and management sessions. With sampled NetFlow, no ICMP payload, no raw or vsock syscall telemetry, or no management-plane logs, the conclusion is limited to unparsed-flow anomaly and cannot claim command recovery.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 低层承载绕开应用事务与常规观察平面, en: Lower-layer carriage bypasses application transactions and ordinary observation planes}
      analysis:
        paragraphs:
          - zh: >-
              >-
              攻击者直接在网络/传输报文或平台专用套接字中定义控制协议，使 Web、DNS 或消息解析器没有可输出的事务；选择 VMCI 或 SOL 时，通信甚至不进入通常的主机 IP 监控。行为仍发生，但落在应用分析或主机网络传感器覆盖之外，形成行为透明。完整分组、socket family 事件、虚拟化/固件配置和后继执行可重新建立观察，因此匿迹效果取决于这些低层数据是否实际采集。
            en: >-
              >-
              The actor defines a control protocol directly in network or transport packets or platform-specific sockets, leaving web, DNS, or messaging parsers with no transaction to emit. With VMCI or SOL, communication may not enter ordinary host IP monitoring at all. The behavior occurs outside application analytics or host network sensor coverage, producing Behavioral Transparency. Full packets, socket-family events, virtualization or firmware configuration, and successor execution can restore observation, so the stealth effect depends on whether those lower-layer data are actually collected.
      evidence_keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD, B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM]
      confidence: high
  subtechnique_taxonomy:
    coverage: established
    proposed_child_keys: [B3-T1095-SUB-DATAGRAM, B3-T1095-SUB-ALTPLANE]
    narrative:
      paragraphs:
        - zh: >-
            >-
            两个候选子项按防守需要恢复的缺失关系划分。无连接分组序列控制移除传输连接生命周期，把任务会话放进攻击者自定义序列、长度和角色字段，防守需在原始分组/数据报上重建状态；主机栈旁路控制平面把通信从主机 IP 路径迁到 VMCI、管理引擎或同类平面，防守需转向虚拟化、固件和替代 socket family。两者可同时使用，但前者仍在网络分组传感器上可见，后者可完全缺席该观察面。
          en: >-
            >-
            The two candidate children are separated by which missing relationship defenders must restore. Connectionless Packet-Sequence Control removes transport connection lifecycle and places the task session in attacker-defined sequence, length, and role fields, requiring state reconstruction from packets or datagrams. Host-Stack-Bypassing Control Plane moves communication from the host IP path into VMCI, a management engine, or an equivalent plane, requiring virtualization, firmware, and alternate-socket-family observation. They can coexist, but the first remains visible to packet sensors while the second may be absent from that plane entirely.
        - zh: >-
            >-
            raw TCP 的自定义长度帧保留连接状态，作为父级核心而不另建“TCP”子项。ICMP Echo 与 UDP 只是无连接轴的实现证据；VMCI 与 SOL 只是观察平面轴的实现证据。共享开放端口的内核截获、魔术认证值与后继反向 shell 已检验为 T1205 邻接变量；完整 SSH/TCP 隧道归 T1572；仅换端口归 T1571。
          en: >-
            >-
            Custom length-framed raw TCP retains connection state and remains parent core rather than becoming a TCP child. ICMP Echo and UDP are implementation evidence for the connectionless axis, while VMCI and SOL are implementation evidence for the observation-plane axis. Kernel interception on a shared open port, magic authentication values, and a successor reverse shell were examined as adjacent T1205 variables. An intact SSH or TCP tunnel belongs to T1572, and port changes alone belong to T1571.
proposed_subtechniques:
  - key: B3-T1095-SUB-DATAGRAM
    name: {zh: 无连接分组序列控制, en: Connectionless Packet-Sequence Control}
    summary:
      zh: >-
        >-
        攻击者在无传输连接状态的分组或数据报中自行维护任务序列，使按连接与应用事务组织的监控难以重建命令往返。
      en: >-
        >-
        Adversaries maintain their own task sequence in packets or datagrams without transport connection state, complicating command reconstruction by monitoring organized around connections and application transactions.
    stable_variable: attacker_defined_task_session_over_connectionless_packet_or_datagram_carriage
    trace_change: transport_handshake_and_connection_lifecycle_are_replaced_by_per_packet_identifiers_sequences_lengths_and_roles
    defender_observation_difference: packet_level_bidirectional_state_reconstruction_is_required_instead_of_connection_or_application_transaction_join
    prerequisites: bidirectional_ICMP_or_datagram_reachability_and_implant_controller_logic_for_loss_ordering_and_reassembly
    evidence_keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD, B3-T1095-REF-RFC792]
    confidence: high
    definition_and_concept:
      paragraphs:
        - zh: >-
            >-
            无连接分组序列控制是攻击者不依赖 TCP 连接或应用事务的共享状态，而在每个网络控制消息或数据报中保存客户端标识、请求/回复角色、序列、长度或分片位置，并用这些字段维持可重复的任务和结果交换。直接目的不是简单“使用 ICMP/UDP”，而是让植入与控制端在没有传输连接生命周期的条件下自建 C2 会话。
          en: >-
            >-
            Connectionless Packet-Sequence Control means the actor does not rely on shared TCP connection or application-transaction state. Instead, client identity, request or response role, sequence, length, or fragment position is carried in each network-control message or datagram and used to sustain repeatable task and result exchange. The direct purpose is not simply to use ICMP or UDP, but to construct a C2 session without a transport connection lifecycle.
        - zh: >-
            >-
            PingPull 的 ICMP 变体以 Echo Request 轮询、Echo Reply 下发命令，并用递增序列、total/current 和 PROJECT 标识重组结果；ShadowPad 的 UDP 变体在八字节头中保存 type、session_src_id 和 session_dst_id，并验证回复目标 ID。两个实现的字段不同，却都证明“应用自行补充无连接承载缺失的状态”是跨协议稳定变量。
          en: >-
            >-
            PingPull's ICMP variant polls with Echo Requests, receives commands in Echo Replies, and reassembles results with an incrementing sequence, total or current lengths, and a PROJECT identifier. ShadowPad's UDP variant stores type, session_src_id, and session_dst_id in an eight-byte header and validates the destination ID in replies. Their fields differ, but both demonstrate the cross-protocol variable of an application supplying state absent from a connectionless carrier.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            >-
            无连接分组序列控制把一次任务往返拆成独立分组，网络侧没有 SYN/FIN、持久 socket 会话或标准事务 ID 可直接连接命令与结果。只保存按五元组聚合的短流或只检查单包签名，可能把轮询、命令、分片结果视为无关诊断或 UDP 数据报。防守方仍可观察双向端点、ICMP type/code/id/sequence、UDP 载荷长度、定时和攻击者自定义的重复结构，并可通过长窗口重建。
          en: >-
            >-
            Connectionless Packet-Sequence Control divides a task round trip into independent packets without SYN or FIN, a persistent socket session, or a standard transaction ID linking command and result. Short-flow aggregation or single-packet signatures can treat polls, commands, and fragmented results as unrelated diagnostics or UDP datagrams. Defenders can still observe bidirectional endpoints, ICMP type, code, ID, and sequence, UDP payload length, timing, and repeated attacker-defined structures and reconstruct them over a longer window.
        - zh: >-
            >-
            匿迹收益高度依赖环境基线。在禁止外部 ICMP 或仅允许批准 UDP 服务的网络，流量会立即突出；完整 PCAP 和进程套接字数据也能恢复关联。Base64、AES、随机填充及端口 53/443 会进一步改变内容或分类，但分别属于编码、加密、消息外观或端口邻接事实，不是本子项的成立条件。
          en: >-
            >-
            The stealth benefit depends heavily on local baseline. Traffic is immediately conspicuous where external ICMP is prohibited or UDP is limited to approved services, and full packet capture plus process-socket data can restore correlation. Base64, AES, random padding, and ports 53 or 443 further change content or classification, but are encoding, encryption, message-appearance, or port facts rather than conditions of this child.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            >-
            纳入需要无连接网络/传输承载、攻击者自定义会话字段以及持续命令—结果证据同时存在。正常 ping、traceroute、路由控制、QUIC、VoIP、游戏、监控心跳与批准 UDP 设备协议均为反例；仅凭高熵、固定长度或周期性不能定性。raw TCP 因拥有连接生命周期留在父级核心；若 ICMP/UDP 内封装完整 TCP、SSH 或其他内层会话，则归 T1572。
          en: >-
            >-
            Inclusion requires a connectionless network or transport carrier, attacker-defined session fields, and evidence of continuing task and result exchange. Normal ping, traceroute, routing control, QUIC, VoIP, games, monitoring heartbeats, and approved UDP device protocols are counterexamples. Entropy, fixed size, or periodicity alone is insufficient. Raw TCP retains a connection lifecycle and stays parent core. ICMP or UDP carrying an intact TCP, SSH, or other inner session belongs to T1572.
        - zh: >-
            >-
            若一个特殊分组只唤醒植入、打开端口或切换功能，激活变量归 T1205；只有相同无连接分组系列继续承载任务与结果时才并列本项。端口与协议的非典型配对归 T1571，命令字节的 Base64/AES 归 T1132/T1573，不能以这些邻接属性代替无连接会话证据。
          en: >-
            >-
            If a special packet only wakes an implant, opens a port, or changes functionality, the activation variable belongs to T1205. This child applies concurrently only when the same connectionless packet series continues to carry tasks and results. An atypical protocol-to-port pairing belongs to T1571, while Base64 or AES command bytes belong to T1132 or T1573; those adjacent attributes cannot substitute for connectionless-session evidence.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              >-
              攻击者进入允许诊断流量的电信或企业边界后，可让植入定期发 Echo Request 作为轮询，由控制端用 Echo Reply 下发命令，并将较长结果分段回传。另一个场景是在允许广泛 UDP 出站的服务器上使用短数据报握手和客户端/服务器会话 ID 维持控制，绕开仅分析代理事务或 TCP 连接的检测。
            en: >-
              >-
              After reaching a telecommunications or enterprise boundary that permits diagnostic traffic, an actor can have the implant poll with Echo Requests, receive commands in Echo Replies, and return longer results in fragments. On a server with broad UDP egress, the actor can instead maintain control through a short datagram handshake and client or server session IDs, bypassing detection limited to proxy transactions or TCP connections.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                >-
                攻击者需要双向可达性和能发送/接收自定义 ICMP 或 UDP 的植入权限，并须实现超时、丢包、乱序、重复分组与最大载荷处理。raw ICMP 通常需要特权或 CAP_NET_RAW；UDP 权限较低但更容易与批准业务冲突。对大结果进行分片会增加包数与异常长度分布，也使分析者获得重复结构。
              en: >-
                >-
                The actor needs bidirectional reachability and implant permission to send and receive custom ICMP or UDP and must implement timeout, loss, reordering, duplication, and maximum-payload handling. Raw ICMP commonly needs privilege or CAP_NET_RAW. UDP needs less privilege but is more likely to collide with approved business traffic. Fragmenting large results raises packet counts and creates unusual length distributions and repeated structure for analysts.
        defender_model:
          paragraphs:
            - zh: >-
                >-
                防守方假定至少有边界 PCAP、Suricata/同类分组元数据或未采样的双向流，并在关键 Linux 主机上审计 socket 系统调用及进程。检测需要保留 ICMP type/code/id/sequence、方向、payload/dsize、UDP 源/目的端口、时间、flow_id/Community ID 与端点进程；只有 NetFlow 协议号和总字节时，难以确认攻击者自定义会话字段。
              en: >-
                >-
                The defender is assumed to have boundary PCAP, Suricata or equivalent packet metadata, or unsampled bidirectional flow, plus socket-syscall and process audit on critical Linux hosts. Detection needs ICMP type, code, ID, sequence, direction, payload or dsize, UDP source and destination ports, time, flow_id or Community ID, and endpoint process. With only a NetFlow protocol number and total bytes, attacker-defined session fields are difficult to confirm.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 自定义序列把控制往返拆散到无连接分组, en: Custom sequencing disperses control round trips across connectionless packets}
        analysis:
          paragraphs:
            - zh: >-
                >-
                攻击者以每包序列、长度、角色和客户端标识代替连接状态，使命令与结果成为分散的弱信号；按单包或短流窗口观察时，防守方难以恢复完整任务。PingPull 的递增序列与 total/current、ShadowPad 的源/目标会话 ID 直接支持这一因果链。若防守按端点、方向和自定义字段跨足够时间重组，分散效应会降低。
              en: >-
                >-
                The actor replaces connection state with per-packet sequence, length, role, and client identifiers, leaving commands and results as dispersed weak signals. Single-packet or short-flow views cannot readily restore the task. PingPull's incrementing sequence and total or current fields and ShadowPad's source and destination session IDs directly support this causal chain. The dispersion benefit shrinks when defenders reassemble by endpoint, direction, and custom fields over sufficient time.
        evidence_keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SHADOWPAD]
        confidence: high
    research_limitations:
      paragraphs:
        - zh: >-
            >-
            Unit 42 的 PingPull 命令与文件读取结果来自分析环境中的测试命令，证明样本能力及完整往返，但不等于在受害网络捕获的操作者命令。VMware TAU 对 ShadowPad 的主动协议仿真发现服务器并验证 UDP 头关联，但没有给出某一组织中被绕过的检测。两个来源都支持状态结构，不支持通用包长、熵或时间阈值。
          en: >-
            >-
            Unit 42's PingPull command and file-read result came from a test command in the analysis environment, establishing sample capability and a complete round trip rather than captured operator tasking in a victim network. VMware TAU's active ShadowPad protocol emulation found servers and validated UDP header relationships but does not identify a detector bypassed in a particular organization. Both sources support state structure, not universal packet-length, entropy, or timing thresholds.
  - key: B3-T1095-SUB-ALTPLANE
    name: {zh: 主机栈旁路控制平面, en: Host-Stack-Bypassing Control Plane}
    summary:
      zh: >-
        >-
        攻击者把控制移入 VMCI、固件管理引擎或同类平台平面，使通信不经过主机 IP 栈或常规网络传感器。
      en: >-
        >-
        Adversaries move control into VMCI, a firmware management engine, or an equivalent platform plane so communication bypasses the host IP stack or ordinary network sensors.
    stable_variable: communication_plane_relative_to_the_monitored_host_IP_stack
    trace_change: ordinary_host_socket_firewall_and_network_flow_records_are_absent_while_alternate_family_or_management_plane_state_appears
    defender_observation_difference: virtualization_firmware_and_platform_inventory_are_required_instead_of_only_host_or_perimeter_network_telemetry
    prerequisites: compromised_or_usable_hypervisor_management_firmware_or_platform_channel_and_matching_endpoint_component
    evidence_keys: [B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM, B3-T1095-REF-VSOCK, B3-T1095-REF-OPENVMTOOLS]
    confidence: high
    definition_and_concept:
      paragraphs:
        - zh: >-
            >-
            主机栈旁路控制平面是攻击者让植入通过独立于主机常规 IP 网络配置与安全控制的地址族、虚拟化通道或固件管理路径收发任务。VMCI/vsock 在宿主与来宾间使用 CID 与端口，AMT SOL 由管理引擎把网络通信映射到虚拟串口；直接目的都是在主机操作系统仍能执行或处理结果的同时，让控制传输不进入其正常网络栈。
          en: >-
            >-
            Host-Stack-Bypassing Control Plane means an actor sends and receives tasks through an address family, virtualization channel, or firmware-management path independent of the host's ordinary IP network configuration and controls. VMCI or vsock uses CIDs and ports between host and guests, while AMT SOL maps network communication to a virtual serial port through the management engine. Each keeps control transport out of the ordinary host network stack while the operating system still executes or processes outcomes.
        - zh: >-
            >-
            Mandiant 在多起调查中确认 UNC3886 部署 VIRTUALGATE/VIRTUALPITA VMCI 后门，并明确说明外部网络和默认工具不可见；Microsoft 原研究记录 PLATINUM 文件传输工具使用 AMT SOL 且主机防火墙/监视应用不可见。两类平台不同，但攻击者控制的稳定变量相同，即把通信面从被监控的主机 IP 路径迁到另一个平台平面。
          en: >-
            >-
            Mandiant confirmed UNC3886 deploying VIRTUALGATE and VIRTUALPITA VMCI backdoors in multiple investigations and states that external networks and default tools cannot see the traffic. Microsoft's original research documents a PLATINUM file-transfer tool using AMT SOL outside host firewall and monitoring visibility. The platforms differ, but the stable attacker-controlled variable is the same: moving communication from the monitored host IP path into another platform plane.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            >-
            主机栈旁路控制平面不产生该主机预期的 TCP/UDP/ICMP socket、Windows 防火墙连接或外部交换机流记录。VMCI 流量只在同一裸机范围内，SOL 的网络部分由独立管理引擎处理；因此按开放端口、NetFlow、主机代理或来宾网络隔离验证控制面的规则会出现空白。可见性转移而非消失：VMCI 的 CID/端口、AF_VSOCK 调用、`.vmx` 配置、VMCI 驱动、AMT/SOL 配置、管理端会话以及命令后进程仍可调查。
          en: >-
            >-
            Host-Stack-Bypassing Control Plane does not produce the expected host TCP, UDP, or ICMP socket, Windows Firewall connection, or external-switch flow record. VMCI stays within one bare-metal host, while SOL's network portion is handled by a separate management engine. Controls based on open ports, NetFlow, host proxies, or guest network isolation therefore have a blind spot. Visibility moves rather than disappears: VMCI CIDs and ports, AF_VSOCK calls, `.vmx` configuration, VMCI drivers, AMT or SOL configuration, management-console sessions, and post-command processes remain investigable.
        - zh: >-
            >-
            该轴在替代平面未部署或严格停用时没有匿迹收益。已集中采集虚拟化/固件审计、限制 CID/端口并监控 vsock 的环境可以比 IP 流量更准确地限定使用者。合法 VMware Tools、宿主来宾代理、备份、服务发现和远程管理会使用相同平面，故不能把存在 VMCI/AMT 直接等同恶意。
          en: >-
            >-
            This axis provides no stealth where the alternate plane is absent or strictly disabled. Environments that centrally collect virtualization or firmware audit, constrain CIDs and ports, and monitor vsock can attribute users more precisely than IP-flow analysis. Legitimate VMware Tools, host-guest agents, backup, service discovery, and remote management use the same planes, so VMCI or AMT presence cannot be treated as malicious by itself.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            >-
            纳入要求通信明确绕过被评估主机的常规 IP 栈或外围网络传感器，并持续承载 C2 任务/结果。只有管理 API 执行而没有持续通道的 Guest Operations 可属于其他技术；只有合法 VMCI、virtio-vsock 或 AMT 管理也不是攻击。互联网代理或第三方 broker 仍经过主机 IP 栈，应分别评估 T1090 或 NJT-0160，而非本子项。
          en: >-
            >-
            Inclusion requires communication that clearly bypasses the evaluated host's ordinary IP stack or perimeter network sensor and continually carries C2 tasks or results. Guest Operations execution without a continuing channel can belong to other techniques, and legitimate VMCI, virtio-vsock, or AMT management is not adversary behavior. Internet proxies and third-party brokers still traverse the host IP stack and should be evaluated under T1090 or NJT-0160 rather than this child.
        - zh: >-
            >-
            如果 SOL 或 VMCI 仅承载一条完整 SSH/TCP 会话，T1572 可与本项并列描述封装关系；如果一个特殊管理分组只激活后门，则 T1205 拥有信号变量。恶意 VIB 安装、Secure Boot 绕过或固件配置修改是前置/持久化事实，不能替代持续控制通道证据。
          en: >-
            >-
            If SOL or VMCI carries an intact SSH or TCP session, T1572 may coexist to describe encapsulation. If one special management packet only activates a backdoor, T1205 owns the signaling variable. Malicious VIB installation, Secure Boot bypass, or firmware configuration changes are prerequisite or persistence facts and cannot replace evidence of a continuing control channel.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              >-
              攻击者控制 ESXi 后可安装带 VMCI listener 的恶意 VIB；随后只需控制同一宿主上的任一来宾，就能以 VMCI CID/端口重新连到宿主后门，不经过来宾网络分段。另一个场景是在已经启用或可由管理员权限配置 AMT SOL 的终端，用本地恶意进程读写虚拟串口，远端管理端通过管理引擎传输文件或控制数据。
            en: >-
              >-
              After compromising ESXi, an actor can install a malicious VIB with a VMCI listener, then reconnect to the host backdoor from any guest on the same host using a VMCI CID and port without traversing guest network segmentation. On an endpoint with AMT SOL enabled or configurable through administrator privilege, local malware can read and write the virtual serial port while a remote management endpoint transfers files or control data through the management engine.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                >-
                攻击者通常需要先取得 ESXi/root、管理员或管理控制台能力，部署两端兼容组件并了解 CID、VM 归属、SOL 配置和平台版本。该前提高于普通出站连接，但一旦建立，通道可跨过现有主机防火墙与分段检查。Secure Boot、签名 VIB、未配置的 AMT/SOL、受限 VMCI 及完整资产审计都会提高建立或维持成本。
              en: >-
                >-
                The actor normally needs prior ESXi or root, administrator, or management-console capability, compatible components at both ends, and knowledge of CIDs, VM ownership, SOL configuration, and platform version. This prerequisite is higher than an ordinary outbound connection, but once established the channel can cross existing host firewall and segmentation checks. Secure Boot, signed VIBs, unprovisioned AMT or SOL, restricted VMCI, and complete asset audit raise setup and persistence costs.
        defender_model:
          paragraphs:
            - zh: >-
                >-
                防守方假定能从 vCenter/ESXi 和配置管理获得 host、VM UUID、CID、`.vmx`、VIB 名称/签名/接受级别和 Secure Boot 状态，并在 Linux 来宾或宿主以增强系统调用/eBPF 记录 socket family、type、peer CID/port、pid、exe 与时间。AMT 场景需固件配置和管理控制台会话。若 hypervisor 已被完全控制或平台没有导出 socket/会话事件，网络传感器无法补足缺口，只能依赖完整性检查与结果侧取证。
              en: >-
                >-
                The defender is assumed to obtain host, VM UUID, CID, `.vmx`, VIB name, signature and acceptance level, and Secure Boot state from vCenter, ESXi, and configuration management, plus enriched syscall or eBPF records for socket family, type, peer CID and port, pid, executable, and time on Linux guests or hosts. AMT additionally needs firmware configuration and management-console sessions. If the hypervisor is fully controlled or the platform exports no socket or session events, network sensors cannot fill the gap and defenders must rely on integrity checks and outcome-side forensics.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary: {zh: 替代控制平面使通信缺席主机网络遥测, en: An alternate control plane removes communication from host network telemetry}
        analysis:
          paragraphs:
            - zh: >-
                >-
                攻击者把控制字节交给 VMCI 地址族或独立管理引擎，主机常规 IP 栈、开放端口清单、主机防火墙和外围流量采集没有相应会话，关键行为落在既有监控范围之外。Mandiant 对 VMCI 可见性和 Microsoft 对 SOL 的主机旁路描述直接支持该因果链。增加 AF_VSOCK/VMCI、VIB、固件与管理会话审计可将行为重新纳入观察。
              en: >-
                >-
                The actor hands control bytes to the VMCI address family or an independent management engine, leaving no corresponding session in the host's ordinary IP stack, open-port inventory, host firewall, or perimeter flow collection. Mandiant's VMCI visibility findings and Microsoft's host-bypass description of SOL directly support this causal chain. AF_VSOCK or VMCI, VIB, firmware, and management-session audit can bring the behavior back into observation.
        evidence_keys: [B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM]
        confidence: high
    research_limitations:
      paragraphs:
        - zh: >-
            >-
            Mandiant 直接确认多种 UNC3886 VMCI 后门与跨来宾/宿主能力，但公开材料没有提供每条实际 VMCI 命令内容或标准化 socket 日志。Microsoft 的 PLATINUM 原文记录 SOL 文件传输及主机监控缺口，但对 AMT 是攻击者自行配置还是复用既有配置并不确定。两例支持观察平面迁移，不支持把所有 VMCI/SOL 活动视为 C2。
          en: >-
            >-
            Mandiant directly confirms multiple UNC3886 VMCI backdoors and guest or host reachability but the public report does not provide every actual VMCI command or a standardized socket log. Microsoft's original PLATINUM report documents SOL file transfer and a host-monitoring gap but is uncertain whether the actor provisioned AMT or reused existing configuration. The cases support observation-plane displacement, not treating all VMCI or SOL activity as C2.
defense_candidates:
  detection_strategies:
    - key: B3-T1095-DET-PACKET-SESSION
      name: {zh: 无连接控制分组状态重建, en: Connectionless Control Packet State Reconstruction}
      detects_keys: [B3-T1095-PARENT, B3-T1095-SUB-DATAGRAM]
      objective:
        zh: >-
          >-
          从 ICMP/UDP 原始分组、双向流与进程套接字重建攻击者自定义会话，把轮询、命令、分片结果和后继执行连接为控制往返。
        en: >-
          >-
          Reconstruct attacker-defined sessions from raw ICMP or UDP packets, bidirectional flows, and process sockets, linking polls, tasks, fragmented results, and successor execution into a control round trip.
      analytic_keys: [B3-T1095-NJA-ICMP, B3-T1095-NJA-UDP]
    - key: B3-T1095-DET-ALTPLANE
      name: {zh: 替代控制平面端点与结果关联, en: Alternate-Control-Plane Endpoint and Outcome Correlation}
      detects_keys: [B3-T1095-SUB-ALTPLANE]
      objective:
        zh: >-
          >-
          对 VMCI/vsock 与 AMT SOL 等不进入主机 IP 栈的通道，连接平台配置、会话主体、宿主/来宾身份和命令后结果，识别未授权控制。
        en: >-
          >-
          For VMCI or vsock and AMT SOL channels outside the host IP stack, join platform configuration, session principal, host or guest identity, and post-command outcomes to identify unauthorized control.
      analytic_keys: [B3-T1095-NJA-VSOCK, B3-T1095-NJA-SOL]
  detection_analytics:
    - key: B3-T1095-NJA-ICMP
      strategy_key: B3-T1095-DET-PACKET-SESSION
      name: {zh: ICMP Echo 任务—结果序列重建, en: ICMP Echo Task–Result Sequence Reconstruction}
      target_keys: [B3-T1095-PARENT, B3-T1095-SUB-DATAGRAM]
      logic:
        zh: >-
          >-
          以 source/destination、ICMP type/code、id、sequence 与时间将 Echo Request/Reply 配对；在最初 30 分钟窗口内查找周期性空/小请求后出现带负载回复、随后请求方向出现分片结果的交替。对 PCAP 或启用 packet capture 的告警提取 dsize、payload 前缀/哈希和重复标识，检验是否存在跨包递增序列、总长/当前长度或客户端标识，并用主机 socket 系统调用/进程事件确认非批准进程创建 AF_INET/SOCK_RAW 或 CAP_NET_RAW 后发生后继命令执行。PingPull 的 `R[sequence].PROJECT...total/current` 只作家族验证，不作全局正则。
        en: >-
          >-
          Pair Echo Requests and Replies by source and destination, ICMP type and code, ID, sequence, and time. In an initial 30-minute window, seek alternation in which periodic empty or small requests receive payload-bearing replies and subsequent request-direction packets return fragmented results. From PCAP or packet-enabled alerts, extract dsize, payload prefix or hash, and repeated identifiers to test for incrementing cross-packet sequence, total or current lengths, or a client identifier. Join host socket-syscall and process events to confirm an unapproved process created AF_INET and SOCK_RAW or used CAP_NET_RAW before successor execution. PingPull's `R[sequence].PROJECT...total/current` is a family confirmation, not a universal regex.
      data_requirements:
        - {source_type: packet_sensor, channel: 'Suricata EVE plus PCAP or equivalent', required_fields: [timestamp, flow_id, src_ip, dest_ip, proto, icmp_type, icmp_code, icmp_id, icmp_seq, direction, dsize, payload_or_packet_ref]}
        - {source_type: endpoint_syscall, channel: 'Linux Audit/eBPF or equivalent enriched socket telemetry', required_fields: [timestamp, host_id, pid, ppid, exe, auid, syscall, address_family, socket_type, protocol, success]}
        - {source_type: endpoint_process, channel: null, required_fields: [timestamp, host_id, process_entity_id, parent_entity_id, executable, command_line]}
      observables: [echo_request_reply_role_alternation, repeated_custom_identifier, cross_packet_sequence_or_length_relation, raw_socket_by_unapproved_process, post_reply_execution]
      correlation:
        window: 'Initial 30 minutes and at least two complete poll-task-result cycles; tune to local diagnostics cadence'
        dimensions: [host_id, src_ip, dest_ip, icmp_id, custom_identifier, process_entity_id, time]
      false_positives: [availability_monitoring_with_payloads, network_path_measurement, vendor_diagnostics, authorized_ICMP_tunnels_or_overlay_tools]
      blind_spots: [packet_sampling_or_truncation, NAT_without_host_mapping, encrypted_payload_without_repeated_outer_fields, kernel_implant_without_user_socket_event, one_way_or_very_long_latency_tasking]
      tuning_guidance:
        zh: >-
          >-
          先按监控工具、目标、payload 模式和设备角色建立 ICMP 基线，再要求角色交替、结构关系与进程/结果至少两类信号；不得将所有大 ICMP、固定周期或高熵负载直接告警。保留获批诊断的精确主体例外，不对白名单网段整体排除。
        en: >-
          >-
          Baseline ICMP by monitoring tool, destination, payload pattern, and device role, then require at least two signal classes among role alternation, structural relationship, and process or outcome. Do not alert on all large ICMP packets, fixed periodicity, or high entropy. Use precise principal exceptions for approved diagnostics rather than excluding whole network ranges.
      evidence_keys: [B3-T1095-REF-PINGPULL, B3-T1095-REF-SURICATA-ICMP, B3-T1095-REF-SURICATA-EVE, B3-T1095-REF-LINUX-AUDIT]
    - key: B3-T1095-NJA-UDP
      strategy_key: B3-T1095-DET-PACKET-SESSION
      name: {zh: 未解析 UDP 自定义会话关联, en: Unparsed UDP Custom-Session Correlation}
      target_keys: [B3-T1095-PARENT, B3-T1095-SUB-DATAGRAM]
      logic:
        zh: >-
          >-
          从未被批准应用解析器识别的双向 UDP 流中，按 Community ID/五元组、方向和时间保留每个数据报的长度及可见头部。寻找客户端首次短握手后服务端回复引用客户端随机 ID、后续 type/sequence 递增且有效负载往返的序列，并把发起设备映射到创建 SOCK_DGRAM 的进程与后继执行。ShadowPad 的 8 字节 type/session_src_id/session_dst_id 关系可作协议确认；端口 53/443、固定 16 字节初包或随机填充均不可单独定性。
        en: >-
          >-
          For bidirectional UDP flows not identified by an approved application parser, retain each datagram's length and visible header keyed by Community ID or five-tuple, direction, and time. Seek a sequence where a short client handshake receives a server reply referencing the client's random ID, followed by incrementing type or sequence and bidirectional payloads. Map the initiating device to the SOCK_DGRAM process and successor execution. ShadowPad's eight-byte type, session_src_id, and session_dst_id relationship can confirm that protocol; port 53 or 443, a fixed 16-byte first packet, or random padding cannot establish C2 alone.
      data_requirements:
        - {source_type: flow_and_packet_sensor, channel: 'Zeek conn.log plus packet metadata/PCAP or equivalent', required_fields: [ts, uid_or_community_id, src_ip, src_port, dest_ip, dest_port, proto, direction, datagram_len, packet_ref, app_proto]}
        - {source_type: endpoint_socket, channel: 'Linux Audit/eBPF or EDR socket telemetry', required_fields: [timestamp, host_id, pid, exe, address_family, socket_type, local_endpoint, remote_endpoint, success]}
        - {source_type: endpoint_process, channel: null, required_fields: [timestamp, host_id, process_entity_id, parent_entity_id, executable, command_line]}
      observables: [unparsed_bidirectional_UDP, reply_echoes_client_identifier, custom_type_or_sequence_progression, unapproved_process_socket, post_datagram_execution]
      correlation:
        window: 'Initial 30 minutes or two application-specific polling cycles; retain 24 hours for low-frequency recurrence'
        dimensions: [host_id, uid_or_community_id, endpoint_pair, custom_session_id, process_entity_id, time]
      false_positives: [QUIC_or_new_protocol_not_enabled_in_parser, games_and_VoIP, VPN_and_overlay_networks, cluster_discovery_and_replication, custom_industrial_or_IoT_telemetry]
      blind_spots: [encrypted_or_padded_headers, asymmetric_routing, parser_version_gaps, sampled_flow_without_datagram_boundaries, shared_service_process, kernel_space_socket]
      tuning_guidance:
        zh: >-
          >-
          用软件清单、签名、设备角色、批准目的地和可验证协议握手建立允许画像；未知 UDP 首先进入协议识别队列，只有自定义双向状态加端点结果才提升。更新解析器后重新评估“未解析”条件，防止将新合法协议长期视为异常。
        en: >-
          >-
          Build approved profiles from software inventory, signature, device role, destination, and verifiable protocol handshake. Route unknown UDP first to protocol identification and elevate only with custom bidirectional state plus endpoint outcome. Reassess the unparsed condition after parser updates so a new legitimate protocol is not treated as permanently anomalous.
      evidence_keys: [B3-T1095-REF-SHADOWPAD, B3-T1095-REF-ZEEK-CONN-REUSE, B3-T1095-REF-LINUX-AUDIT]
    - key: B3-T1095-NJA-VSOCK
      strategy_key: B3-T1095-DET-ALTPLANE
      name: {zh: VMCI/vsock 套接字—虚拟化资产—结果关联, en: VMCI or vsock Socket–Virtualization Asset–Outcome Join}
      target_keys: [B3-T1095-SUB-ALTPLANE]
      logic:
        zh: >-
          >-
          从 vCenter/ESXi 清单解析 host_id、VM UUID、VMCI CID、vmci0.present/unrestricted 与批准服务，周期性核对 VIB 名称、vendor、version、acceptance level、install date、签名和 Secure Boot 状态。对支持的 Linux 来宾/宿主用 eBPF 或能解析 sockaddr_vm 的传感器记录 socket/bind/connect/accept 的 AF_VSOCK、SOCK_STREAM/DGRAM、local/peer CID 和 port，并以 host/CID 将进程连接到 VM。告警条件要求未批准可执行文件或服务标签使用 VMCI、异常 VIB/配置变化，或该通道时间后出现 shell/文件传输结果；普通 auditd 的 a0–a3 若未解引用 sockaddr 只能发现 address family，不能声称看见 peer CID。
        en: >-
          >-
          Parse host_id, VM UUID, VMCI CID, vmci0.present or unrestricted, and approved services from vCenter or ESXi inventory, and periodically compare VIB name, vendor, version, acceptance level, install date, signature, and Secure Boot state. On supported Linux guests or hosts, use eBPF or another sensor that decodes sockaddr_vm to record AF_VSOCK, SOCK_STREAM or DGRAM, local and peer CID, and port for socket, bind, connect, and accept, then map the process to a VM by host and CID. Alerting requires an unapproved executable or service label using VMCI, an anomalous VIB or configuration change, or shell or file-transfer outcomes after the channel. Plain auditd a0–a3 without sockaddr dereference can reveal the address family but cannot claim peer CID visibility.
      data_requirements:
        - {source_type: virtualization_inventory, channel: 'vCenter/ESXi and configuration management', required_fields: [timestamp, host_id, vm_uuid, vm_name, vmci_cid, vmci_present, vmci_unrestricted, approved_vmci_services]}
        - {source_type: platform_integrity, channel: 'ESXi VIB inventory and Secure Boot validation', required_fields: [timestamp, host_id, vib_name, vendor, version, acceptance_level, install_date, signature_status, secure_boot_status]}
        - {source_type: vsock_syscall, channel: 'eBPF or enriched syscall sensor', required_fields: [timestamp, host_id, vm_uuid, pid, exe, syscall, address_family, socket_type, local_cid, local_port, peer_cid, peer_port, result]}
        - {source_type: endpoint_process_file, channel: null, required_fields: [timestamp, host_id, vm_uuid, process_entity_id, parent_entity_id, executable, command_line, file_path, operation]}
      observables: [unapproved_AF_VSOCK_process, unexpected_CID_port_pair, malicious_or_unsigned_VIB, VMCI_configuration_change, shell_or_file_outcome_without_IP_session]
      correlation:
        window: 'Configuration and VIB baseline daily; socket-to-outcome 0–10 minutes; retain 30 days for rare reconnection'
        dimensions: [host_id, vm_uuid, vmci_cid, peer_cid, peer_port, process_entity_id, vib_name, time]
      false_positives: [VMware_Tools_and_guest_agents, backup_or_monitoring_agents, approved_host_guest_RPC, hypervisor_upgrade_or_partner_VIB, laboratory_vsock_proxy]
      blind_spots: [compromised_hypervisor_tampering_with_inventory, no_sockaddr_enrichment, Windows_or_ESXi_lacking_socket_sensor, short_lived_connection_between_poll_intervals, legitimate_process_injection]
      tuning_guidance:
        zh: >-
          >-
          为每个集群维护 VMCI 业务服务、CID/port、VIB 发布者和升级窗口；任何未知 VMCI 使用先核验平台变更，再以结果侧进程/文件提高置信。CommunitySupported/unsigned VIB 是完整性风险但不是单独 C2 结论。
        en: >-
          >-
          Maintain VMCI business services, CID and port, VIB publisher, and upgrade windows for each cluster. Verify platform change before escalating unknown VMCI use and use outcome processes or files to raise confidence. A CommunitySupported or unsigned VIB is an integrity risk rather than a standalone C2 conclusion.
      evidence_keys: [B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-VSOCK, B3-T1095-REF-OPENVMTOOLS, B3-T1095-REF-LINUX-AUDIT, B3-T1095-REF-BROADCOM-VIB]
    - key: B3-T1095-NJA-SOL
      strategy_key: B3-T1095-DET-ALTPLANE
      name: {zh: AMT SOL 会话与本地串口消费者关联, en: AMT SOL Session and Local Serial Consumer Join}
      target_keys: [B3-T1095-SUB-ALTPLANE]
      logic:
        zh: >-
          >-
          从资产与 AMT 管理系统取得 device_uuid、provisioning state、SOL enabled、授权管理员/控制台及维护窗口；读取 AMT Access Monitor/Audit Log 的 event group/application ID、event ID、initiating user 与 time，并关联 LMS Windows Application 日志的 Intel ME App/Remote Diagnostics 1201（SOL 建立）和 1202（结束）。在同一设备和会话时段查找未批准进程打开 AMT SOL 虚拟 COM 端口、异常文件读写或执行。来源无法保证所有版本或部署都把会话送入 Windows 日志，故没有固件审计时只能报告配置风险，不能否定隐藏会话。
        en: >-
          >-
          Obtain device_uuid, provisioning state, SOL enabled state, authorized administrator or console, and maintenance windows from asset and AMT management systems. Read AMT Access Monitor or Audit Log application or event group, event ID, initiating user, and time and correlate Intel ME App or Remote Diagnostics events 1201 for SOL established and 1202 for SOL ended from the LMS Windows Application log. On the same device and session interval, seek an unapproved process opening the AMT SOL virtual COM port, unusual file activity, or execution. Sources do not guarantee every version or deployment forwards sessions to Windows logs, so without firmware audit the result is a configuration risk rather than proof that no hidden session occurred.
      data_requirements:
        - {source_type: amt_inventory, channel: 'Intel AMT management console/asset inventory', required_fields: [device_uuid, provisioning_state, sol_enabled, authorized_principal, management_console, policy_version]}
        - {source_type: amt_audit, channel: 'Intel AMT Access Monitor/Audit Log', required_fields: [timestamp, device_uuid, application_id_or_event_group, event_id, initiating_user, result]}
        - {source_type: local_amt_event, channel: 'Windows Application log via Intel LMS when deployed', required_fields: [timestamp, computer, provider, event_id, message]}
        - {source_type: endpoint_process_file, channel: null, required_fields: [timestamp, computer, process_entity_id, executable, device_path_or_com_port, file_path, operation]}
      observables: [SOL_enabled_outside_policy, event_1201_without_change_ticket, unknown_AMT_principal, unapproved_virtual_serial_consumer, file_transfer_or_execution_during_SOL]
      correlation:
        window: 'Exact SOL start-to-finish session plus 10 minutes; retain firmware audit at least through the organization change-review period'
        dimensions: [device_uuid, computer, initiating_user, management_console, event_id, process_entity_id, time]
      false_positives: [authorized_remote_repair, BIOS_or_OS_deployment, incident_recovery, vendor_support_session]
      blind_spots: [AMT_unprovisioned_or_audit_not_collected, local_LMS_absent, compromised_management_console_or_stolen_admin, local_process_access_without_process_device_telemetry]
      tuning_guidance:
        zh: >-
          >-
          对 SOL 使用者、控制台、设备组和维护票据做精确允许；保留 1201/1202 与固件审计，即使本地用户无提示。紧急维护允许需限时并复核文件/进程结果，不能长期白名单全部 IT 管理账户。
        en: >-
          >-
          Allow SOL precisely by user, console, device group, and maintenance ticket and retain events 1201 and 1202 plus firmware audit even when no local user prompt exists. Emergency-maintenance allowances should expire and be reviewed against file and process outcomes rather than permanently allowing every IT administrator.
      evidence_keys: [B3-T1095-REF-PLATINUM, B3-T1095-REF-INTEL-AMT, B3-T1095-REF-INTEL-LMS, B3-T1095-REF-INTEL-AUDIT]
  mitigations:
    - key: B3-T1095-MIT-LOWERLAYER
      name: {zh: 低层协议出口与套接字能力最小化, en: Lower-Layer Protocol Egress and Socket-Capability Minimization}
      description:
        zh: >-
          >-
          按设备和进程角色控制 ICMP 类型、UDP 目的地与 raw socket 能力，同时保留必要诊断和业务协议的精确例外。
        en: >-
          >-
          Control ICMP types, UDP destinations, and raw-socket capabilities by device and process role while preserving precise exceptions for required diagnostics and business protocols.
      measures:
        - key: packet_egress_policy
          control_type: preventive
          description: {zh: 在出口仅允许设备角色所需的 ICMP 类型/方向和 UDP 服务—目的地组合，阻断无法归属的外部无连接往返并记录拒绝。, en: At egress, allow only ICMP types and directions and UDP service-to-destination pairs required by the device role, blocking and logging unattributed external connectionless exchanges.}
        - key: raw_socket_privilege
          control_type: exposure-reduction
          description: {zh: 从普通服务账户和容器移除 CAP_NET_RAW/等效 raw socket 权限，并监控特权授予与 socket 系统调用。, en: Remove CAP_NET_RAW or equivalent raw-socket privilege from ordinary service accounts and containers and monitor privilege grants and socket syscalls.}
      applications:
        - target_key: B3-T1095-PARENT
          use: {zh: 将没有批准应用事务的 TCP/UDP/ICMP 出口绑定到明确软件、目标和变更审批，并让未知流进入协议识别。, en: Bind TCP, UDP, and ICMP egress without an approved application transaction to explicit software, destination, and change approval and route unknown flows to protocol identification.}
          expected_effect: {zh: 减少可建立无应用事务 C2 的路径，并让剩余流量有进程与策略归属。, en: Reduce paths available for applicationless C2 and give remaining traffic process and policy attribution.}
          limitations: {zh: 不能简单封锁所有 ICMP/UDP；内核级植入、已获批高权限进程或主机栈旁路平面仍可规避。, en: ICMP and UDP cannot simply be blocked wholesale; kernel implants, approved privileged processes, and host-stack-bypassing planes can still evade the control.}
        - target_key: B3-T1095-SUB-DATAGRAM
          use: {zh: 对允许的 ICMP/UDP 按进程、设备角色与目的地限权，保留双向分组并限制普通进程 raw socket。, en: Scope permitted ICMP and UDP by process, device role, and destination, retain bidirectional packets, and restrict raw sockets for ordinary processes.}
          expected_effect: {zh: 阻断多数任意无连接控制路径，并把剩余会话压缩到可重建的批准集合。, en: Block most arbitrary connectionless control paths and reduce remaining sessions to an approved set that can be reconstructed.}
          limitations: {zh: 合法诊断、实时媒体和自定义设备协议需要例外；共享系统服务或被盗特权仍可承载恶意分组。, en: Diagnostics, real-time media, and custom device protocols need exceptions; shared system services or stolen privilege can still carry malicious packets.}
      evidence_keys: [B3-T1095-REF-RFC792, B3-T1095-REF-LINUX-AUDIT, B3-T1095-REF-PINGPULL]
    - key: B3-T1095-MIT-ALTPLANE
      name: {zh: 替代控制平面缩减与完整性约束, en: Alternate-Control-Plane Reduction and Integrity Enforcement}
      description:
        zh: >-
          >-
          关闭不需要的 VMCI/vsock、AMT SOL 与类似管理通道，对保留平面限制主体和服务，并保护 hypervisor/固件组件完整性。
        en: >-
          >-
          Disable unnecessary VMCI or vsock, AMT SOL, and similar management channels, constrain principals and services on retained planes, and protect hypervisor and firmware-component integrity.
      measures:
        - key: plane_inventory_and_disable
          control_type: exposure-reduction
          description: {zh: 盘点每台宿主/终端所需 VMCI 与 AMT 功能；不需要时停用，保留时记录 CID/port、SOL 管理员、控制台和维护用途。, en: Inventory required VMCI and AMT features per host or endpoint; disable them when unnecessary and otherwise record CID and port, SOL administrators, consoles, and maintenance purpose.}
        - key: hypervisor_integrity
          control_type: preventive
          description: {zh: 在支持的 ESXi 启用 Secure Boot，验证 VIB 签名与接受级别，审计安装及 `--force/--no-sig-check` 类绕过。, en: Enable Secure Boot on supported ESXi, validate VIB signature and acceptance level, and audit installation and bypasses such as `--force` or `--no-sig-check`.}
        - key: management_audit
          control_type: detective-support
          description: {zh: 集中保存 VMCI/vsock 使用、AMT Access Monitor/Audit Log、SOL 1201/1202 及平台配置变更。, en: Centrally retain VMCI or vsock use, AMT Access Monitor or Audit Log, SOL events 1201 and 1202, and platform-configuration changes.}
      applications:
        - target_key: B3-T1095-SUB-ALTPLANE
          use: {zh: 对集群和设备逐项批准替代地址族/管理会话，关闭未用功能并把平台审计与命令结果联查。, en: Approve alternate address-family and management sessions per cluster and device, disable unused functions, and join platform audit with command outcomes.}
          expected_effect: {zh: 减少主机网络传感器看不到的可用通道，并为保留通道建立独立可见性与完整性边界。, en: Reduce channels invisible to host network sensors and create independent visibility and integrity boundaries for retained channels.}
          limitations: {zh: 禁用 VMCI 或 SOL 可能破坏 VMware Tools、备份或远程运维；已获 root/hypervisor/管理控制台权限的攻击者可能篡改日志，Secure Boot 也不检测所有内存态滥用。, en: Disabling VMCI or SOL can break VMware Tools, backup, or remote administration. An actor with root, hypervisor, or management-console control can tamper with logs, and Secure Boot does not detect every in-memory abuse.}
      evidence_keys: [B3-T1095-REF-VMCI-REUSE, B3-T1095-REF-PLATINUM, B3-T1095-REF-BROADCOM-VIB, B3-T1095-REF-BROADCOM-VMCI, B3-T1095-REF-INTEL-AUDIT]
