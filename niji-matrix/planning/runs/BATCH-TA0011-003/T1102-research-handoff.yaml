research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1102.001, T1102.002, T1102.003]
    represented_dimensions: [service object stores later C2 location, same service carries command and result directions, service carries one control direction]
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
      - attack_subtechnique_id: T1102.001
        attack_name: Dead Drop Resolver
        resolution: adjacent-technique
        notes:
          zh: 合法 service object 存 locator 的事实保留在父级；动态生成、选择或轮换后端地址归 T1568。若对象还保存任务/载荷并被轮询，则贡献对象会合轴。
          en: Parent scope retains legitimate service-object storage of a locator; dynamic generation, selection, or rotation of backend addresses belongs to T1568. If the object also stores tasks or payloads and is polled, it contributes to object rendezvous.
      - attack_subtechnique_id: T1102.002
        attack_name: Bidirectional Communication
        resolution: niji-variable-candidate
        notes:
          zh: 双向本身不是子项；OilRig/Graphite 的同一命名空间和对象承载 task/result，支持命名空间间接化与对象会合。
          en: Bidirectionality is not a child. The same namespace and objects in OilRig and Graphite carry tasks and results and support namespace indirection and object rendezvous.
      - attack_subtechnique_id: T1102.003
        attack_name: One-Way Communication
        resolution: niji-variable-candidate
        notes:
          zh: 单向本身不是子项；ComRAT/HAMMERTOSS command read 支持两个服务资源变量，输出另路传输按 T1567/T1041 判断。
          en: One-way is not a child. ComRAT and HAMMERTOSS command read supports the two service-resource variables, while separate output is judged under T1567 or T1041.
    candidate_stealth_axes_examined:
      - provider identity versus real control namespace
      - persistent object task-state lifecycle
      - dynamic locator and address rotation assigned to T1568
      - victim or recipient partition assigned to NJS-0160-002
      - one-way versus bidirectional rejected as taxonomy variable
      - provider-side workflow callback deferred for lack of independent field C2 evidence
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        三个 ATT&CK 子项均有 planning-only 决议。两个原生子项跨越方向标签：OilRig/Graphite 双向和 ComRAT/HAMMERTOSS 单向 command read 可表达相同服务资源变量。主 Agent 应复核控制命名空间项与 TA0010 NJS-0195-001 的跨战术边界，以 C2 task/outcome 对敏感数据 receiver 区分；MIT-000203 可扩展，DET/NJA 应拆分。
      en: >-
        All three ATT&CK children have planning-only resolutions. The two native children cross direction labels: OilRig and Graphite bidirectional relationships and ComRAT or HAMMERTOSS one-way command reads express the same service-resource variables. The primary agent should review the cross-tactic boundary with TA0010 NJS-0195-001, distinguishing C2 task or outcome from sensitive-data receiver. MIT-000203 can be extended while DET and NJA should split.
  evidence_coverage:
    parent_behavior_keys: [REF-000625, REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS]
    boundary_keys: [REF-000625, REF-000431, REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-MANDIANT-HAMMERTOSS]
    mechanism_support:
      - {mechanism: NM-FD, evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT]}
      - {mechanism: NM-ST, evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-MANDIANT-HAMMERTOSS]}
      - {mechanism: NM-BT, evidence_keys: [REF-000833, REF-000944, B3-T1102-REF-GRAPH-DRIVE-DELTA]}
    child_existence_support:
      - {child_key: B3-T1102-NJS-CONTROL-NAMESPACE, evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT]}
      - {child_key: B3-T1102-NJS-OBJECT-RENDEZVOUS, evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS]}
    unsupported_or_deferred:
      - provider domain access alone proves C2
      - OAuth or Graph API use alone identifies attacker account or task semantics
      - operator write/read/delete claimed where outside-tenant audit is unavailable
      - one-time payload hosting or legitimate sync treated as sustained C2
      - products APIs HTTP methods message fields or direction labels used as children
      - dynamic locator variable absorbed from T1568
      - victim-specific addressing duplicated from NJS-0160-002
      - provider-workflow delegated C2 without field evidence
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级覆盖服务资源定义、控制结果、provider/namespace 差、对象生命周期、残余字段、正常反例、相邻边界、场景、攻击成本、防守日志权限和限制；两个子项均有独立痕迹、观察差与防御。
      en: The parent covers service-resource definition, control outcome, provider-to-namespace differential, object lifecycle, residual fields, normal counterexamples, adjacent boundaries, scenarios, actor cost, defender log authority, and limitations. Both children have independent traces, observation differentials, and defense.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML syntax validation, temporary-reference closure validation, exact-URL local duplicate search]
  limitations:
    paragraphs:
      - zh: >-
          OilRig、Graphite、ComRAT 和 HAMMERTOSS 证据层级不同。OilRig 有多受害环境遥测与详细逆向；Graphite 明确给出 check/update/delete，但无 resource-tenant audit；ComRAT 支持 Gmail command receipt，结果通路不完整；HAMMERTOSS 同时包含动态 handle、隐写、加密、云外传和时间门控，不能整案只归 T1102。正式 Case/Claim 必须保留这些限制。
        en: >-
          OilRig, Graphite, ComRAT, and HAMMERTOSS evidence has different levels. OilRig combines multiple-victim telemetry and detailed reverse engineering. Graphite clearly documents check, update, and delete but no resource-tenant audit. ComRAT supports Gmail command receipt with incomplete result-path detail. HAMMERTOSS simultaneously contains dynamic handles, steganography, encryption, cloud exfiltration, and time gating and cannot be assigned wholesale to T1102. Formal cases and claims must retain these limits.
      - zh: >-
          官方 Microsoft 文档证明 Graph/M365 字段可用，但只覆盖 resource tenant、许可、诊断和保留允许的事件。Graph activity 不能显示多租户应用在另一 tenant 的活动，drive delta 只给最新状态并遗漏部分属性；个人 Gmail/Twitter/GitHub 或攻击者 OneDrive 通常不受受害管理员控制。Analytic 必须输出 provider_only、external_tenant_unresolved、object_only、partial_loop 等中间状态。
        en: >-
          Official Microsoft documentation establishes available Graph and Microsoft 365 fields but only for events allowed by resource tenant, licensing, diagnostics, and retention. Graph activity cannot show multitenant-application activity in another tenant, and drive delta exposes latest state while omitting some properties. Personal Gmail, Twitter, GitHub, or attacker OneDrive is normally outside victim administration. Analytics must emit intermediate states such as provider_only, external_tenant_unresolved, object_only, and partial_loop.
      - zh: >-
          三十分钟、二十四小时和三十日窗口是工程起点，来源没有通用阈值、灵敏度或误报率。合法同步、邮件、CI/CD、备份、bot 和自动化也会产生轮询、读写和删除；扩展名、目录名、API 与 User-Agent 会变化。正式 NJA 应按服务/应用/流程受控校准，并以 endpoint outcome 和未批准 namespace 共同提高置信。
        en: >-
          Thirty-minute, twenty-four-hour, and thirty-day windows are engineering starting points; sources provide no universal thresholds, sensitivity, or false-positive rates. Legitimate sync, mail, CI/CD, backup, bots, and automation also produce polling, reads, writes, and deletion, while extensions, directory names, APIs, and User-Agent change. A formal NJA needs controlled service, application, and workflow calibration and should raise confidence through endpoint outcome plus an unapproved namespace.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 服务 C2 不必隐藏对象内容；标准 JSON 或普通文件也可承载任务。编码、加密与隐写分别由 T1132、T1573、NJT-0152 证明，不能从 T1102 自动推出数据遮蔽。
        en: Service C2 need not conceal object content; standard JSON or ordinary files can carry tasks. Encoding, encryption, and steganography are separately established by T1132, T1573, and NJT-0152 and cannot be inferred from T1102.
  open_questions:
    - 主 Agent 复核控制命名空间与 NJS-0195-001：前者要求 task/endpoint outcome，后者要求 sensitive source/receiver result；共享 MIT-000203，拆分 DET/NJA。
    - REF-000945 可复用，但其 T1567 外传结论不能直接替代 T1102 task 结论。
    - REF-000431 若正式使用 PolyglotDuke 公共服务 URL 行为，应扩展同一 REF locator/notes，不重复 URL。
    - service-workflow delegated C2 若要建项，须新增真实事件/样本证明 provider workflow 主动分发命令并产生独立防御数据。
