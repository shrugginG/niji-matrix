      name: {zh: OilRig 共享 Outlook/Exchange/OneDrive 控制资源, en: OilRig Shared Outlook Exchange and OneDrive Control Resources}
      central_facts:
        zh: ESET 在多个以色列受害环境中观察共享云邮箱/OneDrive 下载任务或载荷并上传结果，草稿、属性、victim 目录和对象类型承载控制状态。
