    - temporary_key: B3-T1102-CLM-ADMISSION
      statement:
        zh: 多个现场与样本来源证明合法外部服务的账号和对象可反复承载命令、载荷与结果，形成独立于自建 HTTPS 服务器的 C2 资源关系。
        en: Multiple field and sample sources establish that accounts and objects in legitimate external services can repeatedly carry commands, payloads, and results, creating a C2 resource relationship distinct from an attacker-operated HTTPS server.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS]
      confidence: high
    - temporary_key: B3-T1102-CLM-NAMESPACE
      statement:
        zh: 多租户 provider 网络身份不能表示真实控制 account/tenant/app/token/resource；资源审计与批准命名空间是恢复控制归属的必要补充。
        en: A multi-tenant provider network identity does not identify the real controller account, tenant, application, token, or resource; resource audit and approved namespace are necessary supplements for recovering control ownership.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, REF-000833, REF-000944]
      confidence: high
    - temporary_key: B3-T1102-CLM-OBJECT
      statement:
        zh: 服务对象可把任务发布、植入读取、端点执行和结果回写拆为异步生命周期；object ID/path/version、request/token 与 endpoint outcome 可重新连接该循环。
        en: A service object can split task publication, implant retrieval, endpoint execution, and result write-back into an asynchronous lifecycle; object ID, path or version, request or token, and endpoint outcome can reconnect the loop.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-MANDIANT-HAMMERTOSS, REF-000944, B3-T1102-REF-GRAPH-DRIVE-DELTA]
      confidence: high
    - temporary_key: B3-T1102-CLM-DIRECTION
      statement:
        zh: 单向和双向只是控制消息方向；相同服务命名空间和对象生命周期可承载 command read、result write 或两者，方向不应形成 Niji 子项。
        en: One-way and bidirectional are control-message directions; the same service namespace and object lifecycle can carry command read, result write, or both, so direction should not define Niji children.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS]
      confidence: high
  cases:
