handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-003
work_item_ref: WORK-TA0011-T1102
temporary_key_prefix: B3-T1102
candidate:
  source_type: attack
  source_attack_id: T1102
  name: {zh: Web 服务, en: Web Service}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          保留 T1102 的独立问题：攻击者可让合法外部服务的账号、API、邮箱、云存储或发布对象承担任务、载荷和结果交换，使受害网络只看到通常获准的提供方，而真实控制命名空间和对象生命周期位于服务内部。ESET 在多个 OilRig 受害环境中观察到共享 OneDrive、Outlook 与 Exchange 账户承载命令和结果；Trellix 对 Graphite 的逆向确认 OneDrive 任务读取、结果上传与任务删除；ESET 又独立观察到 ComRAT 通过 Gmail Web UI 获取命令附件。
        en: >-
          Retain the independent T1102 problem: an adversary can make accounts, APIs, mailboxes, cloud storage, or publication objects of a legitimate external service carry tasks, payloads, and results. The victim network sees a normally allowed provider while the real control namespace and object lifecycle reside inside the service. ESET observed shared OneDrive, Outlook, and Exchange accounts carrying commands and results across multiple OilRig victim environments; Trellix reverse engineered Graphite task retrieval, result upload, and task deletion in OneDrive; and ESET independently observed ComRAT obtaining command attachments through Gmail Web UI.
      - zh: >-
          采用 adapt，因为 ATT&CK 的 Dead Drop Resolver、Bidirectional Communication 和 One-Way Communication 按用途与方向分组，不能直接成为 Niji 子项。正式父项要求重复或可持续控制关系、攻击者控制的服务命名空间或对象，以及端点控制结果；单次托管载荷下载、普通 SaaS 访问或只解析一个地址不自动成立。子项按共享提供方身份与真实控制命名空间分离，以及持久服务对象分隔操作者写入、植入读取和结果回写这两类稳定变量划分。
        en: >-
          Adapt because ATT&CK Dead Drop Resolver, Bidirectional Communication, and One-Way Communication partition by use and direction rather than Niji stealth variables. The formal parent requires a repeatable or sustained control relationship, an attacker-controlled service namespace or object, and an endpoint control outcome. One hosted-payload download, ordinary SaaS access, or one address lookup is insufficient. Children instead partition by separation between shared provider identity and the real control namespace, and by persistent service objects separating operator write, implant read, and result write-back.
proposed_content:
  summary:
    zh: 攻击者借合法外部服务的账号、API 和持久资源交换指令与结果，使提供方身份遮蔽真实控制命名空间，并把控制活动拆入服务对象生命周期。
    en: Adversaries exchange commands and results through accounts, APIs, and persistent resources of a legitimate external service, allowing provider identity to obscure the real control namespace and splitting control activity into service-object lifecycles.
  aliases: [Legitimate Web Service C2, Cloud Service C2]
  classification:
    tactic_refs: [TA0011]
    origin: {kind: attack-adapted, source_attack_id: T1102, source_attack_version: '19.1'}
    decision_key: B3-T1102-DECISION
  definition_and_concept:
    paragraphs:
      - zh: >-
          外部服务资源中介指挥控制是攻击者让植入体和操作者通过合法多租户 Web、云存储、邮箱、内容发布或社交服务中的账号、目录、草稿、文件、帖子或消息对象交换任务、载荷与执行结果的行为。提供方不仅承载 TLS，还验证令牌、解析资源标识并保存或提供服务对象。直接目的在于借用允许服务的可达性和网络身份维持控制，同时避免在受害边界直接暴露攻击者自建 C2 域和服务器。
        en: >-
          External-Service C2 Resource Mediation is adversary use of an account, directory, draft, file, post, or message object in a legitimate multi-tenant Web, cloud-storage, mailbox, content-publication, or social service to exchange tasks, payloads, and execution results between implant and operator. The provider does more than carry TLS: it validates tokens, resolves resource identifiers, and stores or serves service objects. The direct purpose is to maintain control through the reachability and network identity of an allowed service while avoiding direct exposure of an attacker-operated C2 domain and server at the victim boundary.
      - zh: >-
          判定锚点是服务内真实控制命名空间、任务或控制对象、端点读取/处理和后继执行结果。提供方域名、443 端口、官方 API、OAuth 令牌或云盘客户端本身都不是充分证据；必须把服务资源操作连接到异常端点进程和命令、载荷执行、结果回写或持续心跳。服务品牌、产品类别、API 方法和单个消息字段只是实现，不能替代匿迹变量。
        en: >-
          Classification anchors are a real control namespace inside the service, a task or control object, endpoint retrieval or processing, and a subsequent execution outcome. Provider domain, port 443, official API, OAuth token, or cloud-drive client is insufficient by itself. Service-resource operations must join to an anomalous endpoint process and command or payload execution, result write-back, or sustained heartbeat. Service brand, product class, API method, and one message field are implementations and cannot replace a stealth variable.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          共享服务让外层 DNS、IP、TLS 证书和域名稳定归属于真实提供方；网络日志通常不能从这一身份区分攻击者 account、tenant、app/token、mailbox、drive、repo 或 object。OilRig 报告明确说明 Office 365 在组织中常见，因此下载器更容易混入正常网络流。端点进程、OAuth client、resource tenant、API URI、对象路径、token ID 和服务审计仍可恢复更细粒度身份。
        en: >-
          A shared service keeps outer DNS, IP, TLS certificate, and domain genuinely attributable to the provider. Network logs normally cannot distinguish an attacker account, tenant, application or token, mailbox, drive, repository, or object from that identity. The OilRig report explicitly states that Office 365 is common in organizations and therefore lets the downloaders blend more readily into regular network traffic. Endpoint process, OAuth client, resource tenant, API URI, object path, token ID, and provider audit can still recover finer identity.
      - zh: >-
          持久对象会把操作者发布命令、植入轮询读取、端点执行和结果写回分散到不同时间与主体。Graphite 从 check 目录读取任务、向 update 写结果并在处理后删除任务；OilBooster 以受害者子目录和对象类型区分命令与结果；SC5k 使用未实际发送的草稿。单个端点会话只显示一次提供方 API 操作，完整控制循环须从对象 ID/路径/版本、actor/app/token 和端点后果恢复。
        en: >-
          Persistent objects distribute operator task publication, implant polling and retrieval, endpoint execution, and result write-back across time and principals. Graphite reads tasks from check, writes results to update, and deletes tasks after processing. OilBooster separates commands and results through victim directories and object types. SC5k uses drafts that are never sent. One endpoint session shows only one provider API operation; the full control loop requires object ID, path or version, actor or application or token, and endpoint outcome.
      - zh: >-
          匿迹收益取决于服务归属和日志权限。攻击者使用个人或外部 tenant 时，受害管理员通常不能查询资源 tenant 的 Graph/邮箱对象审计；资源位于受害 tenant 或提供方协助调查时，命名空间、对象和请求日志可缩小盲区。API 限额、令牌更新、对象删除、账号封禁和内容扫描也会留下成本与残迹。
        en: >-
          Stealth benefit depends on service ownership and log authority. When the actor uses a personal or outside tenant, victim administrators generally cannot query Graph or mailbox object audit in that resource tenant. Namespace, object, and request logs reduce the blind spot when resources reside in the victim tenant or the provider assists. API limits, token refresh, object deletion, account suspension, and content scanning also create cost and residual evidence.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求合法外部提供方的服务语义实际参与 C2：植入访问攻击者控制或滥用的命名空间/资源以取得任务、载荷、配置或控制地址，或者回写结果/心跳，并能连接到端点控制后果。自建 HTTPS 服务器、一次文件托管、合法同步与协作均在范围外，除非另有重复任务关系。纯粹把已窃数据送走归 TA0010 NJT-0195/T1567。
        en: >-
          Inclusion requires service semantics of a legitimate outside provider to participate in C2: an implant accesses an attacker-controlled or abused namespace or resource for tasks, payloads, configuration, or control addresses, or writes back results or heartbeats, and activity joins to an endpoint control outcome. An attacker-operated HTTPS server, one-time file hosting, and legitimate sync or collaboration are outside scope absent a repeatable task relationship. Pure movement of stolen data belongs to TA0010 NJT-0195 or T1567.
      - zh: >-
          NJT-0160 拥有应用事务和中介拓扑，包括 broker/解析器如何终止、路由及按收件者寻址；本项拥有合法外部服务资源和共享 provider 身份。公共 broker/邮箱可并列，但按 victimID、主题或收件地址分区由 NJS-0160-002 判断。T1090 拥有两段网络代理转发；CDN 只按 Host 路由字节归 T1090，OneDrive/Gmail 保存任务对象归本项。
        en: >-
          NJT-0160 owns application transactions and intermediary topology, including broker or resolver termination, routing, and recipient addressing. This object owns the legitimate external service resource and shared provider identity. A public broker or mailbox may co-classify, but partitioning by victim ID, topic, or recipient is judged under NJS-0160-002. T1090 owns two-leg network proxy forwarding: a CDN routing bytes by Host belongs there, while OneDrive or Gmail storing task objects belongs here.
      - zh: >-
          NJT-0152 分析 C2 消息或服务契约的外观；本项可使用完全标准 API 和对象结构，仅因真实 provider 身份遮蔽控制资源而成立。T1568 负责动态求出或轮换 C2 地址：服务对象只保存当前域名/IP 时，T1102 父级记录资源参与，地址算法与变化归 T1568。T1104 要求不同通道按阶段/功能分工；多个服务、对象或读写方向不能自动证明多阶段，失败换服务还需 NJT-0153。
        en: >-
          NJT-0152 analyzes appearance of C2 messages or service contracts. This object may use fully standard APIs and object structures and still apply because genuine provider identity obscures the control resource. T1568 owns dynamic computation or rotation of C2 addresses: when a service object stores only a current domain or IP, T1102 parent records resource participation while the address algorithm and change belong to T1568. T1104 requires channels divided by stage or function; multiple services, objects, or read and write directions do not automatically establish multi-stage behavior, and failure-driven service switching also requires NJT-0153.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在允许 Microsoft 365 的政府、医疗、制造和外交网络中，下载器可携带攻击者账号凭据或刷新令牌，周期访问 Graph、Outlook 或 EWS。OilRig 下载器从共享邮箱或 OneDrive 下载命令/载荷并上传结果；Graphite 从 OneDrive check 读取任务、向 update 写结果，随后转入 Empire；ComRAT 通过 Gmail Web UI 附件接收命令。网络侧均可只见知名服务端点。
          en: >-
            In government, healthcare, manufacturing, and diplomatic networks where Microsoft 365 is allowed, a downloader can carry attacker-account credentials or refresh tokens and periodically access Graph, Outlook, or EWS. OilRig downloaders retrieve commands or payloads and upload results through a shared mailbox or OneDrive. Graphite reads OneDrive check tasks, writes update results, and later transitions to Empire. ComRAT receives commands through Gmail Web UI attachments. The network can see only well-known service endpoints.
        - zh: >-
            公共内容服务也可提供只读任务对象。HAMMERTOSS 每日生成 Twitter handle，从帖子取得位置与解密材料，再从 GitHub 或被攻陷站点取得带命令的图像；PolyglotDuke 从 Twitter、Reddit、Imgur 获取 C2 URL。前者支持对象会合，后者若只返回地址还应以 T1568 为动态解析直接对象。输出另走云存储时按 T1567/T1041 判断，不建方向子项。
          en: >-
            Public-content services can also provide read-only task objects. HAMMERTOSS derives a daily Twitter handle, obtains location and decryption material from a post, and retrieves a command-bearing image from GitHub or a compromised site. PolyglotDuke obtains a C2 URL from Twitter, Reddit, and Imgur. The former supports object rendezvous; where the latter only returns an address, T1568 is also the direct dynamic-resolution object. Output using separate cloud storage is assessed under T1567 or T1041 rather than a direction child.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要取得或创建可由植入访问的 service account、mailbox、drive、repository 或发布对象，控制 token/credential 和对象规则，并在 API 变化、令牌到期、内容扫描与账号处置下维持可用性。共享账号常以目录、扩展属性或类别区分受害者和任务类型，这会增加复杂度并留下稳定资源关系。外部 tenant 扩大受害日志盲区，也把控制集中到可被提供方冻结的账号和应用。
            en: >-
              The actor needs a service account, mailbox, drive, repository, or publication object accessible to the implant, control of token or credential and object rules, and resilience against API change, token expiry, content scanning, and account enforcement. Shared accounts often distinguish victims and task types through directories, extended properties, or categories, increasing complexity and leaving stable resource relationships. An outside tenant expands the victim's audit blind spot but concentrates control in an account and application the provider can suspend.
      defender_model:
        paragraphs:
          - zh: >-
              防守方可能拥有端点进程/网络/文件事件、代理元数据、OAuth/Entra 登录、Graph 请求、M365/GitHub 等服务审计、对象 delta/版本及批准资源清单。分析需连接 device、process start、user、AppId/service principal、token、resource tenant/account、container/object、request ID、operation 和 endpoint outcome。只有 provider 域/IP 时只能输出 provider_only。
            en: >-
              The defender may have endpoint process, network, and file events; proxy metadata; OAuth or Entra sign-ins; Graph requests; Microsoft 365 or GitHub service audit; object delta or versions; and an approved-resource registry. Analysis must join device, process start, user, AppId or service principal, token, resource tenant or account, container or object, request ID, operation, and endpoint outcome. Provider domain or IP alone supports only provider_only.
          - zh: >-
              日志权限必须显式建模。Graph 活动日志只覆盖 resource tenant，不能显示多租户应用在另一个 tenant 的活动；个人 Gmail、Twitter、GitHub 账号通常也不在受害审计范围。合法 OneDrive 同步、邮件、CI/CD、机器人、备份和社交访问是强相似行为，需按资源命名空间和端点后果排除。日志缺失降低结论而不提高风险。
            en: >-
              Log authority must be explicit. Graph activity logs cover the resource tenant and do not show multitenant-application activity in another tenant. Personal Gmail, Twitter, or GitHub accounts are also generally outside victim audit. Legitimate OneDrive sync, mail, CI/CD, bots, backup, and social access are strong lookalikes and require namespace and endpoint-outcome exclusion. Missing logs reduce confidence rather than increase risk.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: 真实提供方身份替代攻击者控制命名空间的网络可见身份, en: Genuine provider identity substitutes for the network-visible identity of the attacker-controlled namespace}
      analysis:
        paragraphs:
          - zh: >-
              植入访问真实服务域、证书和 API，网络侧看到 provider，而控制权属于服务内攻击者 account/tenant/app/token/resource。域名信誉将提供方属性误作控制端属性；只有资源 tenant、应用、令牌和对象审计能恢复差异。OilRig、Graphite 与 ComRAT 独立证明该链，形成特征伪装。
            en: >-
              The implant accesses genuine service domains, certificates, and APIs, so the network sees the provider while control belongs to an attacker account, tenant, application, token, or resource inside the service. Domain reputation substitutes provider attributes for controller attributes. Resource tenant, application, token, and object audit recover the differential. OilRig, Graphite, and ComRAT independently establish this chain, producing Feature Disguise.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT]
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary: {zh: 持久对象把任务发布植入读取和结果回写分散到不同时间与主体, en: Persistent objects distribute task publication implant retrieval and result write-back across time and principal}
      analysis:
        paragraphs:
          - zh: >-
              操作者先写 task object，植入稍后轮询读取，执行后再写 result object；直接控制会话变为多个对象事件与 API 请求。单会话或短窗只见片段，需用 object ID/path/version、token 和 endpoint outcome 长窗重建。Graphite、OilRig 与 HAMMERTOSS 支持该时空分布，形成时空释痕。
            en: >-
              The operator writes a task object, the implant polls and reads it later, and a result object is written after execution. A direct control session becomes several object events and API requests. One session or short window sees fragments and needs long-window reconstruction through object ID, path or version, token, and endpoint outcome. Graphite, OilRig, and HAMMERTOSS support this spatiotemporal distribution, producing Spatiotemporal Trace Dilution.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-MANDIANT-HAMMERTOSS]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 服务控制面保留关键对象状态而端点网络只留下提供方事务, en: The service control plane retains key object state while endpoint networking leaves only provider transactions}
      analysis:
        paragraphs:
          - zh: >-
              对象作者、resource tenant、操作者读取和服务端删除发生在 provider control plane，受害 EDR/边界可能没有这些事件。Graph/M365 文档证明 provider 侧仍可记录 AppId、tenant、request、token、ObjectId 和 actor；扩大观察面可恢复差异，形成行为透明。
            en: >-
              Object author, resource tenant, operator retrieval, and service-side deletion occur in the provider control plane and may be absent from victim EDR or boundary logs. Graph and Microsoft 365 documentation establishes provider-side AppId, tenant, request, token, ObjectId, and actor records. Broader observation recovers the differential, producing Behavioral Transparency.
      evidence_keys: [REF-000833, REF-000944, B3-T1102-REF-GRAPH-DRIVE-DELTA]
      confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议两个原生子项。共享服务控制命名空间间接化改变 provider 与实际 controller account/tenant/app/token/resource 的身份关系；服务对象任务状态会合改变控制循环的时间与主体结构，跟踪 task object 的 create/update/read/delete、端点执行和 result object。二者可组合，但“谁控制资源”和“状态如何跨对象生命周期流转”需要不同数据与处置。
          en: >-
            Two native children are proposed. Shared-Service Control-Namespace Indirection changes the identity relationship between provider and actual controller account, tenant, application, token, or resource. Service-Object Task-State Rendezvous changes the temporal and principal structure of the control loop by tracking task-object create, update, read, and delete, endpoint execution, and result object. They can coexist, but who controls the resource and how state moves through an object lifecycle require different data and response.
        - zh: >-
            单向/双向只是消息方向，不构成子项；产品、API、HTTP 方法、目录和字段也不是边界。仅保存 C2 地址的对象对父级有证据价值，但动态地址变量归 T1568；victim/recipient 分区归 NJS-0160-002；跨阶段换通道归 T1104。服务端 workflow 主动回调缺少独立现场 C2 证据，defer。
          en: >-
            One-way and bidirectional are message directions and do not define children; product, API, HTTP method, directory, and field are not boundaries either. An object storing only a C2 address supports the parent, while the dynamic-address variable belongs to T1568. Victim or recipient partitioning belongs to NJS-0160-002 and cross-stage channel change to T1104. Provider-side workflow callback lacks independent field C2 evidence and is deferred.
    coverage: proposed
    temporary_subtechnique_keys: [B3-T1102-NJS-CONTROL-NAMESPACE, B3-T1102-NJS-OBJECT-RENDEZVOUS]
proposed_subtechniques:
  - temporary_key: B3-T1102-NJS-CONTROL-NAMESPACE
    name: {zh: 共享服务控制命名空间间接化, en: Shared-Service Control-Namespace Indirection}
    summary:
      zh: 植入只连接合法多租户提供方，而真实控制者位于服务内的外部 account、tenant、app/token、mailbox、drive 或 repository 命名空间。
      en: The implant connects only to a legitimate multi-tenant provider while the real controller resides in an outside account, tenant, application or token, mailbox, drive, or repository namespace inside the service.
    stable_variable:
      zh: provider 网络身份与 controller 服务命名空间身份分离；产品与消息方向变化不改变该变量。
      en: Provider network identity is separated from controller service-namespace identity; product and message direction do not change the variable.
    trace_change:
      zh: DNS/TLS/代理记录归属于 provider，控制 account/tenant/app/token/resource 只在认证、API 请求或服务审计出现；外部 tenant 时可能仅提供方可见。
      en: DNS, TLS, and proxy records attribute traffic to the provider, while controller account, tenant, application, token, or resource appears only in authentication, API request, or service audit and may be provider-visible only for an outside tenant.
    defender_observation_difference:
      zh: 域名/IP allowlist 不能区分控制者；tenant/account/app/token/resource 清单和 endpoint process—outcome 关联可以恢复，外部 tenant 不可见时必须降级。
      en: Domain and IP allowlists cannot distinguish the controller. Tenant, account, application, token, and resource inventory plus endpoint-process-to-outcome joins can recover it, with confidence reduced when the outside tenant is invisible.
    sibling_boundary:
      zh: 本项回答谁拥有控制资源，即使命令由 API 直接返回且没有持久对象也可成立；对象会合项回答任务如何通过持久对象跨时间和主体流转。
      en: This child asks who owns the control resource and can apply when an API returns a command without a persistent object. The rendezvous child asks how tasks move through a persistent object across time and principals.
    adjacent_boundaries:
      zh: victim-specific 目录/主题/地址寻址归 NJS-0160-002；provider 前端向隐藏后端路由字节归 T1090；伪造服务内容归 NJT-0152；账号取得或攻陷另按资源开发技术记录。
      en: Victim-specific directory, topic, or address routing belongs to NJS-0160-002. A provider front end routing bytes to a hidden backend belongs to T1090. Forged service content belongs to NJT-0152. Account acquisition or compromise is separately recorded under resource-development techniques.
    prerequisites_and_scenario:
      zh: 攻击者拥有外部服务账号和 token/credential，植入可访问 provider，组织对 provider 有允许背景；OilRig、Graphite 和 ComRAT 提供独立案例。
      en: The actor has an outside service account and token or credential, the implant can reach the provider, and the organization normally permits it. OilRig, Graphite, and ComRAT provide independent cases.
    evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT]
    confidence: high
    defense_value:
      zh: provider 与 resource namespace 分层授权，限制未知 tenant/consumer login、app/token/object scope，并关联端点进程与服务认证/请求日志。
      en: Authorize provider and resource namespace separately, restrict unknown tenants or consumer login, application, token, and object scope, and join endpoint process with service authentication and request logs.
  - temporary_key: B3-T1102-NJS-OBJECT-RENDEZVOUS
    name: {zh: 服务对象任务状态会合, en: Service-Object Task-State Rendezvous}
    summary:
      zh: 攻击者以 draft、file、post、event 或 attachment 等持久对象保存任务与结果，把操作者写入、植入读取和端点执行拆成异步生命周期。
      en: The actor stores tasks and results in persistent objects such as drafts, files, posts, events, or attachments, splitting operator write, implant retrieval, and endpoint execution into an asynchronous lifecycle.
    stable_variable:
      zh: 控制状态物化为具有稳定 object ID/path/version/lifecycle 的服务对象，而不是消息为单向或双向。
      en: Control state materializes as a service object with stable ID, path, version, and lifecycle; one-way or bidirectional flow is not the variable.
    trace_change:
      zh: 直接操作者—植入会话变为 task create/update、poll/list/read、endpoint outcome、result create/update 和 delete/ack 分离事件。
      en: A direct operator-to-implant session becomes separated task create or update, poll or list or read, endpoint outcome, result create or update, and delete or acknowledgment events.
    defender_observation_difference:
      zh: endpoint/proxy 只见 API 片段，operator write/read 可能在服务端或外部 tenant；对象生命周期与端点后果长窗关联可重建控制循环。
      en: Endpoint and proxy see API fragments while operator write or read may occur provider-side or in an outside tenant. Long-window object lifecycle and endpoint-outcome correlation can reconstruct the loop.
    sibling_boundary:
      zh: 即使 service account 已知且批准，只要对象承担异步任务会合仍成立；命名空间子项不要求任务持久化。
      en: This child can apply even when the service account is known and approved if objects provide asynchronous task rendezvous. Namespace indirection does not require task persistence.
    adjacent_boundaries:
      zh: 对象只存新 C2 地址时地址求解/轮换归 T1568；对象内容隐写/编码归 NJT-0152/T1132；victim 目录寻址归 NJS-0160-002；阶段换通道需 T1104 证据。
      en: If the object stores only a new C2 address, address resolution or rotation belongs to T1568. Concealment or encoding inside the object belongs to NJT-0152 or T1132. Victim-directory addressing belongs to NJS-0160-002. Stage channel change requires T1104 evidence.
    prerequisites_and_scenario:
      zh: 操作者与植入能访问同一对象空间并约定 task/result/delete/ack 语义；Graphite、OilRig、ComRAT 与 HAMMERTOSS 提供不同服务与方向的独立证据。
      en: Operator and implant can access the same object space and share task, result, delete, or acknowledgment semantics. Graphite, OilRig, ComRAT, and HAMMERTOSS provide independent evidence across services and directions.
    evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS]
    confidence: high
    defense_value:
      zh: 检测需要 object ID/path/version、actor/app/token、create/read/delete 和 endpoint outcome；控制需限制个人 tenant、对象范围与应用权限并持续导出审计。
      en: Detection requires object ID or path or version, actor or application or token, create, read, delete, and endpoint outcome. Controls restrict personal tenants, object scope, and application permissions and continuously export audit.
defense_candidates:
  detection_strategies:
    - temporary_key: B3-T1102-DET-SERVICE-NAMESPACE-OBJECT-OUTCOME
      name: {zh: 服务控制命名空间—对象生命周期—端点结果关联, en: Service Control Namespace to Object Lifecycle and Endpoint Outcome Correlation}
      objective:
        zh: 将端点 API 请求解析到真实 service tenant/account/app/token/resource，并连接任务对象生命周期与命令/载荷执行，识别合法 provider 背后的 C2。
        en: Resolve endpoint API requests to the real service tenant, account, application, token, and resource and join task-object lifecycle to command or payload execution, identifying C2 behind a legitimate provider.
      subjects: [parent, B3-T1102-NJS-CONTROL-NAMESPACE, B3-T1102-NJS-OBJECT-RENDEZVOUS]
      domains: [enterprise]
      analytic_keys: [B3-T1102-NJA-NAMESPACE-OUTCOME, B3-T1102-NJA-OBJECT-CONTROL-LOOP]
      candidate_resolution: split-from-DET-000226
      reuse_notes:
        zh: DET-000226、NJA-000281 与 NJA-000282 的 receiver/object 字段可借鉴，但其确认条件是敏感源与外传结果；T1102 需要 task read、endpoint execution 和 result/heartbeat，故 DET/NJA 身份不同。MIT-000203 措施同义，可扩展 Applications。
        en: DET-000226, NJA-000281, and NJA-000282 provide useful receiver and object fields, but their confirmation condition is sensitive source and exfiltration result. T1102 requires task read, endpoint execution, and result or heartbeat, so DET and NJA identities differ. MIT-000203 measures remain synonymous and can be extended with applications.
  detection_analytics:
    - temporary_key: B3-T1102-NJA-NAMESPACE-OUTCOME
      name: {zh: 服务提供方到真实控制命名空间与端点结果分析, en: Service Provider to Real Control Namespace and Endpoint Outcome Analytic}
      purpose:
        zh: 区分 provider_only、namespace_resolved、unapproved_namespace 和与端点命令结果相连的高置信 C2。
        en: Distinguish provider_only, namespace_resolved, unapproved_namespace, and high-confidence C2 joined to an endpoint command outcome.
      raw_to_normalized_fields:
        - source: endpoint-process-network
          channel: Sysmon Event 3, EDR, or endpoint proxy
          raw_fields: [UtcTime, ProcessGuid, ProcessId, Image, User, DestinationHostname, DestinationIp, DestinationPort, Protocol]
          normalized_fields: [event_time, device_id, process_start_key, process_id, process_image, principal_id, provider_host, provider_ip, provider_port, transport]
        - source: microsoft-graph-activity
          channel: MicrosoftGraphActivityLogs
          raw_fields: [TimeGenerated, AadTenantId, AppId, ClientAuthMethod, DeviceId, IPAddress, OperationId, RequestId, RequestMethod, RequestUri, ResponseStatusCode, Scopes, ServicePrincipalId, SessionId, SignInActivityId, UniqueTokenId, UserAgent, UserId]
          normalized_fields: [event_time, resource_tenant_id, client_app_id, auth_method, device_id, source_ip, operation_group_id, provider_request_id, service_action, resource_uri, result_status, granted_scopes, service_principal_id, auth_session_id, signin_activity_id, token_id, client_fingerprint, service_user_id]
        - source: microsoft-365-service-audit
          channel: Office 365 Management Activity API or equivalent provider audit
          raw_fields: [Id, CreationTime, Operation, OrganizationId, UserType, UserKey, Workload, ResultStatus, ObjectId, UserId, ClientIP, AppAccessContext.APIId, AppAccessContext.ClientAppId, AppAccessContext.CorrelationId, AppAccessContext.UniqueTokenId]
          normalized_fields: [provider_event_id, event_time, service_action, resource_tenant_id, actor_type, actor_id, service_name, result_status, resource_object_id, service_user_id, source_ip, service_api_id, client_app_id, correlation_id, token_id]
        - source: approved-service-resource-registry
          channel: SaaS governance, CASB, OAuth, and tenant inventory
          raw_fields: [provider, tenant_or_account_id, app_id, service_principal_id, token_owner, allowed_resource_prefix, approved_process, approved_user, allowed_actions, owner, expiry, policy_version]
          normalized_fields: [provider, resource_namespace_id, approved_app_id, approved_service_principal, approved_token_owner, approved_resource_scope, approved_process, approved_principal, approved_actions, namespace_owner, approval_expiry, policy_version]
        - source: endpoint-outcome
          channel: EDR process, file, module, and command telemetry
          raw_fields: [timestamp, deviceid, processuniqueid, parentprocessuniqueid, actiontype, filename, folderpath, commandline, sha256]
          normalized_fields: [event_time, device_id, process_start_key, parent_process_start_key, outcome_type, object_name, object_path, command_line, object_hash]
      logic:
        zh: >-
          先把 provider_host 映射到 provider，仅输出 provider_only。以 device/source IP、AppId、SessionId、SignInActivityId、RequestId/CorrelationId 或 token hash 解析 resource tenant、account/app 与 resource URI，同批准 registry 比较得到 namespace_resolved 或 unapproved_namespace。随后在相同 process_start_key/父子谱系三十分钟内寻找成功 read 后的子进程、模块、命令、文件执行或心跳。未批准命名空间、成功服务读取和控制样式端点结果同时成立才输出 namespace_c2_confirmed；外部 tenant 无日志时保留 external_tenant_unresolved。
        en: >-
          Map provider_host to a provider first and emit only provider_only. Resolve resource tenant, account or application, and resource URI by device or source IP, AppId, SessionId, SignInActivityId, RequestId or CorrelationId, or token hash, and compare with the approved registry to produce namespace_resolved or unapproved_namespace. Then seek a child process, module, command, file execution, or heartbeat within thirty minutes in the same process_start_key or lineage after a successful read. Emit namespace_c2_confirmed only when an unapproved namespace, successful service read, and control-like endpoint outcome coexist; retain external_tenant_unresolved when outside-tenant logs are absent.
      correlation:
        window: 30 minutes for read-to-outcome; 24 hours for recurring use; 30 days for app/token history
        dimensions: [device_id, process_start_key, provider, resource_namespace_id, resource_tenant_id, client_app_id, service_principal_id, token_id, auth_session_id, provider_request_id, resource_object_id, endpoint_outcome_id, time]
      observables: [unknown tenant/account/app accessed by nonapproved process, low-history app/token repeatedly reading resources, successful read followed by command or payload execution, provider allowed but namespace absent from registry]
      false_positives: [official sync and mail clients, approved personal accounts, CI/CD and backup, admin scripts, third-party SaaS integrations, browser public-content access]
      blind_spots: [outside attacker tenant, opaque URI, Graph logging disabled or unlicensed, personal-account audit unavailable, shared legitimate token, missing endpoint process key]
      tuning_guidance:
        zh: provider 分别维护 tenant/account/app/resource 正向清单，不对白名单域整体豁免；开发、备份、邮件和浏览器使用独立基线。token 只保留 hash/UniqueTokenId。外部 tenant 先观察并结合端点后果，日志缺失只降置信。
        en: Maintain provider-specific tenant, account, application, and resource allowlists rather than exempting an allowed domain. Use separate baselines for development, backup, mail, and browsers. Retain only token hash or UniqueTokenId. Observe outside tenants and combine with endpoint outcome; missing logs only lower confidence.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, REF-000833, REF-000944, REF-000986, REF-000230]
      confidence: high
    - temporary_key: B3-T1102-NJA-OBJECT-CONTROL-LOOP
      name: {zh: 服务任务对象生命周期—端点执行—结果回写分析, en: Service Task-Object Lifecycle to Endpoint Execution and Result Write-Back Analytic}
      purpose:
        zh: 从对象 create/update/read/delete 与端点后果恢复异步 C2 循环，将只读命令投递和含结果回写作为同一轴不同完成度。
        en: Recover an asynchronous C2 loop from object create, update, read, and delete plus endpoint outcomes, treating read-only task delivery and result write-back as different completion levels on one axis.
      raw_to_normalized_fields:
        - source: service-object-audit
          channel: provider audit API, M365, GitHub, mailbox, or service export
          raw_fields: [event_time, provider, tenant_or_account_id, actor_or_app_id, token_id, action, object_type, object_id, parent_container_id, object_path, object_version_or_etag, request_id, source_ip, result, bytes]
          normalized_fields: [event_time, provider, resource_namespace_id, object_actor_id, token_id, object_action, object_type, object_id, container_id, object_path, object_version, provider_request_id, source_ip, result_status, object_bytes]
        - source: graph-drive-delta
          channel: Microsoft Graph driveItem delta or provider change API
          raw_fields: [id, name, parentReference.driveId, parentReference.id, size, eTag, cTag, createdDateTime, lastModifiedDateTime, createdBy, lastModifiedBy, deleted, '@odata.nextLink', '@odata.deltaLink']
          normalized_fields: [object_id, object_name, drive_id, container_id, object_bytes, object_version, content_version, created_at, modified_at, creator_id, modifier_id, deletion_state, page_cursor, delta_cursor]
        - source: endpoint-service-request
          channel: EDR network plus proxy/CASB
          raw_fields: [timestamp, deviceid, processuniqueid, user, request_method, request_uri, response_status, response_bytes, request_id]
          normalized_fields: [event_time, device_id, process_start_key, principal_id, service_action, resource_uri, result_status, response_bytes, provider_request_id]
        - source: endpoint-outcome
          channel: EDR process, file, module, script, and command events
          raw_fields: [timestamp, deviceid, processuniqueid, parentprocessuniqueid, actiontype, filename, folderpath, commandline, sha256]
          normalized_fields: [event_time, device_id, process_start_key, parent_process_start_key, endpoint_action, object_name, object_path, command_line, object_hash]
      logic:
        zh: >-
          按 provider、namespace、container/object ID 与 version 建立 operator_or_unknown_write、implant_list_or_read、endpoint_control_outcome、implant_result_write、operator_or_unknown_read、delete_or_ack 状态机。以 request ID、token、对象路径/版本和 process 连接服务与端点。task read 加 endpoint outcome 输出 one_way_task_confirmed；另有 result/heartbeat write 则输出 control_loop_confirmed。只有轮询或只有对象写分别保持 poll_only/object_only；外部 tenant 无 audit 时只输出 partial_loop。
        en: >-
          Build operator_or_unknown_write, implant_list_or_read, endpoint_control_outcome, implant_result_write, operator_or_unknown_read, and delete_or_ack states by provider, namespace, container or object ID, and version. Join service and endpoint events with request ID, token, object path or version, and process. Task read plus endpoint outcome emits one_way_task_confirmed; a result or heartbeat write emits control_loop_confirmed. Polling-only and object-write-only remain poll_only or object_only, and an outside tenant without audit supports partial_loop only.
      correlation:
        window: 30 minutes read-to-outcome; 24 hours task-to-result; 30 days object/token history
        dimensions: [provider, resource_namespace_id, drive_id, container_id, object_id, object_version, object_path, object_actor_id, token_id, provider_request_id, device_id, process_start_key, endpoint_outcome_id, time]
      observables: [operator write to implant read and delete sequence, periodic list/read by nonsync process followed by execution, task read followed by result/heartbeat object, task object rapid deletion after consumption]
      false_positives: [cloud sync and collaboration, software artifact delivery, mail attachment processing, automation job queues, backup/restore, calendar and bot workflows]
      blind_spots: [outside-tenant object audit unavailable, delta shows latest state not every change, rapid deletion without audit, encrypted task semantics, API batching/caching, in-memory outcome unobserved]
      tuning_guidance:
        zh: 为同步、CI/CD、邮件和作业队列登记 app、tenant、container、对象前缀、动作和时间；轮询只作候选。优先 object ID/version，不把 .doc/.json/check/update 作为通用签名；保留 delete 与 delta cursor，窗口覆盖正常轮询周期。
        en: Register application, tenant, container, object prefix, action, and time for sync, CI/CD, mail, and job queues. Polling is only a candidate. Prefer object ID and version and do not treat .doc, .json, check, or update as universal signatures. Retain delete and delta cursor and cover normal polling cycles.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, B3-T1102-REF-MANDIANT-HAMMERTOSS, REF-000944, B3-T1102-REF-GRAPH-DRIVE-DELTA, REF-000942]
      confidence: high
  mitigations:
    - temporary_key: B3-T1102-MIT-EXTEND-MIT000203
      candidate_resolution: extend
      target_object: MIT-000203
      name: {zh: 扩展 Web 服务接收者、对象与工作流治理至 C2 控制资源, en: Extend Web-Service Receiver Object and Workflow Governance to C2 Control Resources}
      reuse_basis:
        zh: MIT-000203 的 receiver namespace authorization、object lifecycle policy 和 provider audit export 与本项控制概念和措施同义，不应复制新 MIT；新增 Applications 将外传条件替换为控制命名空间、任务对象和端点后果。
        en: MIT-000203 receiver-namespace authorization, object-lifecycle policy, and provider-audit export are semantically identical controls and measures, so a duplicate MIT is unwarranted. New applications replace exfiltration conditions with control namespace, task object, and endpoint outcome.
      supplemental_implementation:
        - measure: receiver-namespace-authorization
          t1102_use:
            zh: 对每个 provider 登记允许 tenant/account/mailbox/drive/repo/bot、AppId/service principal、token owner、对象前缀、调用进程和动作；限制 consumer login 与未知 tenant，例外有所有者和到期。
            en: For each provider, register permitted tenant, account, mailbox, drive, repository, bot, AppId or service principal, token owner, object prefix, calling process, and action. Restrict consumer login and unknown tenants, with owner and expiry on exceptions.
        - measure: object-lifecycle-policy
          t1102_use:
            zh: 保留对象 create/update/read/delete/version，限制匿名/公共任务资源、个人存储和未批准 app scopes，并审计短时 create—read—delete 序列。
            en: Retain object create, update, read, delete, and version records, restrict anonymous or public task resources, personal storage, and unapproved application scopes, and audit short create-to-read-to-delete sequences.
        - measure: provider-audit-export
          t1102_use:
            zh: 持续导出 app/token、resource tenant、request/session、object/container、actor、operation、result 和 delta cursor，并以 device/process/request ID 对齐端点后果。
            en: Continuously export application or token, resource tenant, request or session, object or container, actor, operation, result, and delta cursor and align them to endpoint outcome by device, process, and request ID.
      applications:
        - target: parent
          use:
            zh: 把 provider 允许拆分为命名空间、app/token、对象范围和端点进程允许；确认任务资源后撤销 token、隔离账号、删除对象并阻断进程。
            en: Decompose provider allowance into namespace, application or token, object scope, and endpoint-process authorization. After confirming a task resource, revoke token, isolate account, delete object, and block the process.
          expected_effect:
            zh: 知名域名不再授权任意控制资源，攻击者须滥用已批准命名空间或产生 tenant/app/object 审计差。
            en: A well-known domain no longer authorizes arbitrary control resources, forcing abuse of an approved namespace or an auditable tenant, application, or object deviation.
          limitations:
            zh: 外部个人 tenant、隐藏资源 ID、客户端加密和许可不足会限制控制；严格 tenant 政策可能影响合作伙伴与个人账号业务。
            en: Outside personal tenants, hidden resource IDs, client encryption, and licensing gaps limit controls; strict tenant policy can disrupt partner and personal-account business.
        - target: control-namespace
          use:
            zh: 绑定 provider 到批准 tenant/account/app/token/object prefix 与进程，最小化 OAuth scopes，禁止 provider 域整体豁免。
            en: Bind each provider to approved tenant, account, application, token, object prefix, and process, minimize OAuth scopes, and prohibit provider-domain-wide exemption.
          expected_effect:
            zh: 外部控制命名空间在首次认证/API 请求形成策略差，可隔离真实账号/应用而不封禁整个服务。
            en: An outside control namespace creates a policy differential on first authentication or API request, allowing isolation of the real account or application without blocking the whole service.
          limitations:
            zh: 浏览器个人账号、多租户应用和被窃批准账号仍需对象行为与端点后果。
            en: Browser personal accounts, multitenant applications, and stolen approved accounts still require object behavior and endpoint outcome.
        - target: object-rendezvous
          use:
            zh: 保留任务对象与删除事件，限制公共帖子/仓库/匿名链接/个人 drive，以 actor/app/object ID、版本和端点后果定位并移除对象。
            en: Retain task-object and deletion events, restrict public posts, repositories, anonymous links, and personal drives, and use actor, application, object ID, version, and endpoint outcome to locate and remove objects.
          expected_effect:
            zh: 对象难以成为无审计任务队列，publish—read—execute—result 链可被恢复和打断。
            en: Objects become harder to use as unaudited task queues, and the publish-to-read-to-execute-to-result chain can be recovered and interrupted.
          limitations:
            zh: 攻击者外部资源不受组织政策控制，公共读取可能无身份日志，快速删除和编码减少证据；提供方协作仍关键。
            en: Actor-owned outside resources do not obey organizational policy, public reads may lack identity logs, and rapid deletion and encoding reduce evidence. Provider cooperation remains critical.
      evidence_keys: [REF-000945, B3-T1102-REF-TRELLIX-GRAPHITE, B3-T1102-REF-ESET-COMRAT, REF-000833, REF-000944, REF-000986, B3-T1102-REF-GRAPH-DRIVE-DELTA, REF-000942]
