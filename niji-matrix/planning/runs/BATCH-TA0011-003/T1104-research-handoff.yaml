  claims:
    - key: B3-T1104-CLM-ADMISSION
      proposition_zh: T1104 只有在多个逻辑 C2 通道被赋予不同阶段/功能且可证明交接时才构成 Niji 正式对象
      proposition_en: T1104 forms a formal Niji object only where multiple logical C2 channels have distinct stage or functional roles and a provable handoff
      evidence_keys: [B3-T1104-REF-ATTACK-REUSE, B3-T1104-REF-APT30, B3-T1104-REF-BLACKWATER]
      mode: fixed_baseline_plus_original_evidence
    - key: B3-T1104-CLM-BOOTSTRAP
      proposition_zh: BACKSPACE 自动第一阶段通过地址与选择文件只让被选主机连接交互式第二控制器，形成非失败触发的能力阶段交接
      proposition_en: BACKSPACE's automated first stage uses address and selection files so only selected hosts connect to the interactive second controller, creating a capability-stage handoff not triggered by failure
      evidence_keys: [B3-T1104-REF-APT30]
      mode: direct_tool_analysis
    - key: B3-T1104-CLM-JUNIPER
      proposition_zh: Juniper oemd 先从本地 UDP 通道取得 C2 地址/端口，再建立承担命令功能的 TCP 通道
      proposition_en: Juniper oemd first obtains a C2 address and port on a local UDP channel and then establishes a TCP channel that carries commands
      evidence_keys: [B3-T1104-REF-JUNIPER]
      mode: direct_code_analysis
    - key: B3-T1104-CLM-FUNCTION
      proposition_zh: BlackWater 从一台服务器取得枚举组件并在本地执行，再向不同 C2 回传数据，直接证明任务取得与结果通道分工
      proposition_en: BlackWater retrieves an enumeration component from one server, executes it locally, and returns data to a different C2, directly establishing task-acquisition and result-channel roles
      evidence_keys: [B3-T1104-REF-BLACKWATER]
      mode: direct_script_and_campaign_analysis
    - key: B3-T1104-CLM-LUNAR-LIMIT
      proposition_zh: LunarWeb 将首次联系与命令 URL 分开且 output URL 可由命令指定，但有限实测命令包使用同一 command/output URL，不能作为已观察的任务—结果分离
      proposition_en: LunarWeb separates first-contact and command URLs and permits a command-specified output URL, but limited observed command packages used the same command and output URL and do not establish observed task-result separation
      evidence_keys: [B3-T1104-REF-LUNARWEB-REUSE]
      mode: sample_capability_with_explicit_observation_limit
    - key: B3-T1104-CLM-BOUNDARY
      proposition_zh: 失败换路、代理多跳、多个合法 Web 资源、应用协议选择与普通载荷阶段分别不等于 T1104 角色交接
      proposition_en: Failure-driven switching, proxy hops, multiple legitimate Web resources, application-protocol choice, and ordinary payload stages are not equivalent to a T1104 role handoff
      evidence_keys: [B3-T1104-REF-ATTACK-REUSE, B3-T1104-REF-APT30]
      mode: fixed_baseline_and_case_boundary
    - key: B3-T1104-CLM-DEFENSE
      proposition_zh: 网络事务、端点网络/进程/文件和脚本字段能实施跨通道谱系，但文档不证明通用窗口、阈值或检测精度
      proposition_en: Network transactions, endpoint network, process and file events, and script fields enable cross-channel lineage, but documentation does not establish universal windows, thresholds, or detection accuracy
      evidence_keys: [B3-T1104-REF-ZEEK-HTTP-REUSE, B3-T1104-REF-ZEEK-CONN-REUSE, B3-T1104-REF-MDE-NET-REUSE, B3-T1104-REF-MDE-PROC-REUSE, B3-T1104-REF-MDE-FILE-REUSE, B3-T1104-REF-POWERSHELL-REUSE]
      mode: official_field_documentation_plus_bounded_design_inference
  cases:
    - key: B3-T1104-CASE-APT30
      name: BACKSPACE automated first stage and selected interactive controller
      central_fact: First-stage HTTP supplies second-stage address and selected-host connect material; only selected victims establish full interactive controller sessions
      evidence_keys: [B3-T1104-REF-APT30]
      scope_limit: Report documents tooling and long-running campaigns, but does not establish that every sample or every victim entered stage two; backup first-stage behavior is a separate fallback variable
    - key: B3-T1104-CASE-OEMD
      name: Juniper oemd UDP bootstrap to TCP task channel
      central_fact: Malware binds a local UDP socket to receive a C2 address and port and then establishes a new TCP connection supporting upload, download, and shell commands
      evidence_keys: [B3-T1104-REF-JUNIPER]
      scope_limit: Code-level behavior is direct, while the public report does not state that every transition was captured in live actor activity
    - key: B3-T1104-CASE-BLACKWATER
      name: BlackWater enumeration component and separate result C2
      central_fact: PowerShell stager retrieves an enumeration component from one actor server and sends the resulting data in URL fields to a different C2
      evidence_keys: [B3-T1104-REF-BLACKWATER]
      scope_limit: Talos attributes the campaign to MuddyWater with moderate confidence and does not measure product detection failure
    - key: B3-T1104-CASE-LUNARWEB
      name: LunarWeb first-contact and command URL roles
      central_fact: One URL uploads host information at first contact while two other URLs obtain commands; command packages can name an output URL
      evidence_keys: [B3-T1104-REF-LUNARWEB-REUSE]
      scope_limit: Observed output URLs in the limited recovered command packages matched command URLs, so do not claim observed task-result channel separation
  detection_strategies: [B3-T1104-DET-STAGE, B3-T1104-DET-FUNCTION]
  detection_analytics: [B3-T1104-NJA-ARTIFACT, B3-T1104-NJA-INTERACTIVE, B3-T1104-NJA-TASK-RESULT]
  mitigations: [B3-T1104-MIT-HANDOFF, B3-T1104-MIT-FUNCTION]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [automated_bootstrap, victim_selection, operational_controller, task_or_component_acquisition, result_return, protocol_or_endpoint_transition]
    breadth_trigger: ordinary_open_ended_search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: bootstrap_to_operational_stage_state
        result: formal_candidate
        child_key: B3-T1104-SUB-BOOTSTRAP
        reason: BACKSPACE, oemd and LunarWeb show explicit first-contact/configuration-to-operation roles; detection bridges handoff material to a successor session
      - axis: task_acquisition_result_return_function_split
        result: formal_candidate
        child_key: B3-T1104-SUB-FUNCTION
        reason: BlackWater directly shows a component server, local enumeration and a different result C2; defense joins task, execution and return
      - axis: primary_failure_to_backup
        result: adjacent-technique
        owner: NJT-0153
        reason: failure or blocking preserves the same channel role; BACKSPACE backup first-stage URLs are distinct from its selected second stage
      - axis: multiple_forwarding_hops
        result: adjacent-technique
        owner: T1090
        reason: proxy nodes can relay one logical session without assigning stage or functional roles
      - axis: multiple_web_resources_or_brands
        result: adjacent-technique
        owner: T1102
        reason: provider resource use and reputation are service-resource variables; role handoff requires additional evidence
      - axis: cross_protocol_choice
        result: adjacent-technique
        owner: NJT-0160
        reason: HTTP, UDP, TCP or mail choice defines each channel carrier, not the relationship between them
      - axis: payload_or_process_stage_number
        result: not-stealth-distinct
        reason: loader-to-payload or process injection without a new role-assigned C2 channel is execution staging only
      - axis: multiple_destinations
        result: not-stealth-distinct
        reason: mirrors, load balancing, CDN and redundancy produce multiple domains without stage/function handoff
      - axis: request_response_direction
        result: not-stealth-distinct
        reason: inbound command and outbound result in one logical session are ordinary bidirectional C2 rather than separate channels
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定基线无 ATT&CK 子项，但研究覆盖阶段状态、目标选择、任务/结果角色、失败换路、代理路径、服务资源、协议与普通载荷阶段。两个正式候选都有明确交接、同一受害者谱系、原始证据与差异化防御；其余归相邻对象或非匿迹区分。
      en: >-
        The fixed baseline has no ATT&CK children, but research covered stage state, victim selection, task and result roles, failure switching, proxy path, service resources, protocols, and ordinary payload stages. Both formal candidates have an explicit handoff, same-victim lineage, original evidence, and distinct defenses; the remaining axes belong to adjacent objects or are not stealth distinctions.
  evidence_coverage:
    parent_behavior_keys: [B3-T1104-REF-ATTACK-REUSE, B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-BLACKWATER, B3-T1104-REF-LUNARWEB-REUSE]
    boundary_keys: [B3-T1104-REF-ATTACK-REUSE, B3-T1104-REF-APT30, B3-T1104-REF-LUNARWEB-REUSE]
    mechanism_support:
      - {mechanism: NM-ST, keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-BLACKWATER], level: direct_role_and_handoff_facts_plus_cross_sensor_effect}
    child_existence_support:
      - {child_key: B3-T1104-SUB-BOOTSTRAP, keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-LUNARWEB-REUSE]}
      - {child_key: B3-T1104-SUB-FUNCTION, keys: [B3-T1104-REF-BLACKWATER, B3-T1104-REF-LUNARWEB-REUSE]}
    unsupported_or_deferred:
      - BACKSPACE tooling supports selected stage two, but the public report does not establish that every victim entered stage two.
      - Juniper oemd behavior is code-level capability; the report does not say every UDP-to-TCP handoff was captured during active use.
      - LunarWeb output URL is controllable, but observed limited commands used the same command/output URL and do not prove field task-result separation.
      - BlackWater attribution to MuddyWater is moderate confidence; the channel-role behavior remains directly described regardless of actor label.
      - No source measures alert miss rate or supplies universal handoff windows, flow thresholds or false-positive rates.
      - Content-hidden TLS and process injection can remove the address/config/process bridges required by the proposed analytics.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级与两项子候选均分别覆盖定义、角色、交接痕迹、残余、正常反例、批内/既有边界、场景、攻击前提、防守观察、机理、防御和证据限制。主 Agent 仍需与 T1090/T1102 研究结果统一资源/路径边界，并决定正式子项及共享对象。
      en: >-
        The parent and both child candidates separately cover definition, roles, handoff traces, residuals, normal counterexamples, batch and existing boundaries, scenarios, attacker prerequisites, defender observation, mechanism, defense, and evidence limits. The primary agent must still converge resource and path boundaries with T1090 and T1102 research and decide the formal children and shared objects.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [manual_staging_yaml_serialization, fixed_STIX_query, YAML_and_evidence_key_validation]
  limitations:
    paragraphs:
      - zh: >-
          原始报告支持通道角色和交接逻辑，但案例证据层级不同：APT30 包含工具和控制器工作流，oemd 是代码能力，BlackWater 是脚本/活动观察，LunarWeb 同时含样本能力与有限现场命令包。研究没有把样本能力一律写成现场成功交接，也没有把活动归因强度升级为通道行为置信度。
        en: >-
          Original reports support channel roles and handoff logic, but case evidence levels differ. APT30 includes tool and controller workflow, oemd is code capability, BlackWater is script and activity observation, and LunarWeb combines sample capability with limited field command packages. The research does not turn every sample capability into successful field handoff and does not upgrade actor-attribution strength into channel-behavior confidence.
      - zh: >-
          合法软件普遍使用引导、配置、命令与遥测端点，且云服务/CDN 会动态改变地址。高质量检测必须连接内容/文件、进程与结果，不能以目的地数量、顺序、字节量或“新域名”单点告警。0–60 分钟、24 小时和 7 天均为工程初值，需按产品任务周期和日志保留调优；TLS、共享代理、内存注入和长延时会降低可实施性。
        en: >-
          Legitimate software commonly uses bootstrap, configuration, command, and telemetry endpoints, and cloud services or CDNs change addresses dynamically. High-quality detection must join content or files, processes, and outcomes rather than alert on destination count, order, byte volume, or a new domain alone. The 0–60 minute, 24-hour, and seven-day windows are engineering starting points requiring tuning to product task cycles and retention. TLS, shared proxies, in-memory injection, and long delays reduce implementability.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Encryption, image embedding and hidden configuration may coexist but are owned by content-obscuration techniques; stage-role dispersion does not itself obscure bytes.}
    - {mechanism_ref: NM-FD, reason: Service or header imitation in LunarWeb is NJT-0152 territory; the T1104 variable is channel role and handoff rather than appearance.}
  open_questions:
    - During primary convergence, should bootstrap location-only dead drops remain parent-core here while T1102 owns the Web resource, or become a narrower T1102 child only?
    - Can endpoint telemetry preserve ProcessUniqueId across process injection or service restart for the expected stage delay?
    - Which legitimate management agents in the target environment intentionally use separate task and result providers, and what stable device/task identifiers do they expose?
    - Does local proxy retention preserve response file IDs or content references long enough to bridge selective activation?
    - If T1090 uses separate entry/exit infrastructure with no stage role, ensure path topology does not become a T1104 child by destination count alone.
