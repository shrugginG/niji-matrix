  duplicate_search_note:
    zh: >-
      已用 library_lookup、关键词及精确 URL 检查 multi-stage、handoff、BACKSPACE、LunarWeb、BlackWater 和 Juniper。REF-000639 与 LunarWeb URL 完全相同，应由主 Agent 扩展 locator 至首次联系/命令/output URL 段而非重复建 REF；REF-000625、632、634、604、598、475、463、637、772 可按现有语义复用。没有发现检测目标和关联逻辑同义的 DET/NJA/MIT；“投放阶段”“备用通道”或“多跳代理”只在词面相近，不能复用为 C2 角色交接对象。
    en: >-
      Library lookup, keyword, and exact URL searches covered multi-stage, handoff, BACKSPACE, LunarWeb, BlackWater, and Juniper. REF-000639 has the exact LunarWeb URL and should have its locator extended by the primary agent to first-contact, command, and output-URL sections rather than creating a duplicate REF. REF-000625, 632, 634, 604, 598, 475, 463, 637, and 772 are reusable at their current semantic level. No DET, NJA, or MIT with the same detection objective and correlation logic was found. Objects about payload staging, reserve channels, or multihop proxies overlap only lexically and should not be reused for C2 role handoff.
