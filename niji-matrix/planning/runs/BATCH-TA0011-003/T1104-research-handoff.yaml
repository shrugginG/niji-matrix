handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-003
work_item_ref: WORK-TA0011-T1104
temporary_key_prefix: B3-T1104
candidate:
  source_type: attack
  source_attack_id: T1104
  name: {zh: 多阶段通道, en: Multi-Stage Channels}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1104 锚定在不同条件或功能下使用多个 C2 阶段。APT30 BACKSPACE 的自动化第一阶段只向被选主机提供第二阶段位置和连接指令，Juniper oemd 从 UDP 接收目标后才建立 TCP 操作通道，LunarWeb 将首次主机登记与命令 URL 分离，BlackWater 从一个服务器取得枚举组件后向另一 C2 回传结果；这些原始分析证明角色化通道和交接不是单纯多域名推断。
        en: >-
          Enterprise ATT&CK 19.1 T1104 is anchored in multiple C2 stages used under different conditions or for different functions. APT30 BACKSPACE uses an automated first stage that supplies second-stage location and connection instructions only to selected hosts. Juniper oemd receives a target over UDP before establishing an operational TCP channel. LunarWeb separates first-contact host registration from command URLs. BlackWater retrieves an enumeration component from one server and returns results to another C2. These original analyses establish role-assigned channels and handoffs rather than an inference from multiple domains alone.
      - zh: >-
          Niji 应作 adapt，因为固定定义还提及备用第一阶段和“上传第二 RAT”等可能分别属于 NJT-0153 或普通载荷执行的事实。正式父级只纳入至少两个逻辑 C2 通道被攻击者赋予不同阶段/功能，且能证明交接触发、同一受害者/植入谱系及跨通道控制结果。协议、域名、工具组件或载荷阶段本身不构成准入或子技术。
        en: >-
          Niji should adapt the source because the fixed definition also mentions backup first-stage callbacks and uploading a second RAT, facts that may belong respectively to NJT-0153 or ordinary payload execution. The formal parent should require at least two logical C2 channels assigned different stage or functional roles by the actor, plus evidence of the handoff trigger, the same victim or implant lineage, and a control outcome across channels. Protocols, domains, tool components, or payload stages alone do not establish admission or a child.
  scope_notes:
    zh: >-
      阶段交接须由配置/地址下发、主机选择、通道角色字段、进程谱系或命令—结果因果链支持。主通道失败后启用备用路径归 NJT-0153；同一会话的请求/响应、下载后执行但没有新 C2、多个镜像域名及多跳转发均不满足本候选。
    en: >-
      A stage handoff must be supported by configuration or address delivery, host selection, channel-role fields, process lineage, or a command-to-result causal chain. Reserve paths activated after primary failure belong to NJT-0153. Request and response in one session, payload execution without new C2, multiple mirror domains, and multihop forwarding do not satisfy this candidate.
proposed_content:
  name: {zh: 角色化多通道控制编排, en: Role-Segmented Multi-Channel Control}
  summary:
    zh: >-
      攻击者让多个 C2 通道分别承担引导、操作、任务或结果角色，通过有条件交接拆散完整控制链的可见痕迹。
    en: >-
      Adversaries assign bootstrap, operational, tasking, or result roles to separate C2 channels and conditionally hand off among them, fragmenting the visible control chain.
  definition_and_concept:
    paragraphs:
      - zh: >-
          角色化多通道控制编排指同一植入或其直接后继组件使用两个以上逻辑通道完成一条 C2 控制链，每个通道承担预先设计的阶段或功能。例如自动化引导端只返回第二阶段地址和被选主机列表，随后完整控制器才建立交互会话；或者一个端点只提供任务/枚举组件，另一个端点接收执行结果。直接目的是让低风险引导、完整操作与数据回传不集中在同一会话或基础设施上。
        en: >-
          Role-Segmented Multi-Channel Control means one implant or its direct successor component uses two or more logical channels to complete one C2 control chain, with each channel assigned a designed stage or function. An automated bootstrap endpoint may return the second-stage address and selected-host list before a full controller establishes an interactive session. Alternatively, one endpoint can supply tasking or an enumeration component while another receives execution results. The direct purpose is to keep low-risk bootstrap, full operation, and data return from concentrating in one session or infrastructure set.
      - zh: >-
          “通道”以独立端点、服务资源、协议会话或能单独阻断/审计的逻辑路径为单位；同一 TCP/HTTP 请求中的发送和响应不是两个通道。判定需要识别共同 host/victim ID、同一进程或父子进程、第一通道下发的地址/令牌/文件以及第二通道的后继连接或结果。只有加载器下载了程序而没有证据表明新程序建立另一个角色化 C2 时，属于载荷执行链而不是本项。
        en: >-
          A channel is an independent endpoint, service resource, protocol session, or logical path that can be blocked or audited separately; sending and receiving in one TCP or HTTP request are not two channels. Classification requires a shared host or victim ID, the same process or parent-child process, an address, token, or file delivered by the first channel, and a successor connection or result on the second. A loader that merely downloads a program, without evidence that the new program establishes another role-assigned C2, is a payload execution chain rather than this technique.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          角色分工把可疑度分散到不同时间、目的地和遥测对象。第一阶段可以只进行低带宽自动轮询、版本检查或目标筛选，第二阶段只在被选主机上出现交互命令；功能分离时，指令来源与结果出口也不会出现在同一连接历史中。按单域名、单进程会话或单传感器生成的告警因此只看到半条链，难以把低噪声引导与后续高能力活动归为同一控制操作。
        en: >-
          Role assignment distributes suspicion across time, destinations, and telemetry objects. A first stage may perform only low-bandwidth automated polling, version checks, or victim selection, while interactive commands appear on a second stage only for selected hosts. With functional separation, the task source and result destination do not share one connection history. Alerts keyed to one domain, one process session, or one sensor therefore see only half the chain and struggle to attribute low-noise bootstrap and later high-capability activity to one control operation.
      - zh: >-
          分散不会消除交接痕迹。第一阶段回复中的目标地址/端口、connect/host 列表、配置或新载荷摘要，第二阶段连接的时间、同一 victim ID、相同 ProcessGuid 或父子进程，以及任务后的脚本/文件/出站结果均可形成桥接键。若通道共用进程和清晰标识、TLS 被解密或端点网络事件完整，交接反而能被精确恢复；若长延时、内存注入或不同传感器保留期造成断点，结论必须降低。
        en: >-
          Dispersion does not erase handoff traces. A target address and port, connect or host list, configuration, or new-payload digest in the first-stage response can bridge to the second-stage connection time, the same victim ID, the same ProcessGuid or a child process, and scripts, files, or outbound results after tasking. Complete endpoint network events, decrypted TLS, or clear shared identifiers can reconstruct the handoff precisely. Long delays, in-memory injection, or mismatched sensor retention create gaps and require lower-confidence conclusions.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入需要至少两个可独立识别的通道、稳定的阶段/功能角色、攻击者控制的交接条件，以及同一受害者上的后继控制结果。多个域名、IP、URL、CDN 节点或 RAT 组件不足以证明本项；负载均衡、灾备、软件更新、CDN 重定向、微服务控制面/数据面和合法远程管理也会产生相似痕迹，须用交接内容、进程谱系和批准服务目录排除。
        en: >-
          Inclusion requires at least two independently identifiable channels, stable stage or functional roles, an actor-controlled handoff condition, and a successor control outcome on the same victim. Multiple domains, IPs, URLs, CDN nodes, or RAT components are insufficient. Load balancing, disaster recovery, software updates, CDN redirection, microservice control and data planes, and legitimate remote administration can look similar and must be excluded using handoff content, process lineage, and an approved-service catalog.
      - zh: >-
          NJT-0153 以主路径失败/被阻断触发备用路径为变量；本项的交接由目标选择、阶段就绪、能力升级或功能角色触发，BACKSPACE 中备用第一阶段仍单独归 NJT-0153。T1090 多跳代理是在同一逻辑会话中改变转发路径，不自动产生阶段角色。T1102 负责合法 Web 服务资源的中继，多个 Web 资源只有在承担不同阶段/功能时才可并列本项。NJT-0160 负责各通道的应用协议事务，本项只负责通道之间的角色与交接。
        en: >-
          NJT-0153 uses primary-path failure or blocking as the variable that activates a reserve path. This technique uses victim selection, stage readiness, capability escalation, or functional role to trigger handoff; BACKSPACE's backup first stage still belongs separately to NJT-0153. T1090 multihop proxying changes a forwarding path within one logical session and does not automatically create stage roles. T1102 owns relay through legitimate Web-service resources, and multiple Web resources coexist here only when they carry different stages or functions. NJT-0160 owns each channel's application transaction, while this technique owns roles and handoffs between channels.
      - zh: >-
          一次请求和对应响应属于普通会话，不因上下行方向不同而成为任务/结果分离；命令包内指定同一 URL 回传也仍是单通道。加载器、Stage 1/2 文件、进程注入或模块下载只有在后继组件建立不同角色的 C2 时才形成通道交接。第一通道只发布地址的死信箱可同时属于 T1102，但服务品牌或资源数量不是本项子技术分类。
        en: >-
          One request and its response remain an ordinary session and do not become task and result separation merely because directions differ. A command package that names the same URL for result return remains one channel. A loader, Stage 1 or 2 file, process injection, or module download creates a channel handoff only when the successor establishes a differently assigned C2 channel. A dead-drop first channel that only publishes an address may also satisfy T1102, but service brand or resource count does not define this taxonomy.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            长期驻留行动可让所有主机只访问自动化第一阶段，取得版本、基础指令与第二阶段配置；操作者仅把高价值主机加入 connect 列表，才允许其连接完整控制器。另一场景是脚本化植入从下载服务器取得枚举逻辑，在本地执行 WMI/系统查询，再向不同结果服务器上传数据，使查封一个端点不能同时暴露任务来源和回传路径。
          en: >-
            A long-running intrusion can have every host contact only an automated first stage for versioning, basic instructions, and second-stage configuration. The operator adds only high-value hosts to a connect list before they reach the full controller. In another scenario, a scripted implant obtains enumeration logic from a download server, executes WMI or system queries locally, and uploads data to a different result server, preventing seizure of one endpoint from revealing both task source and return path.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要在植入中保存通道角色和状态，控制第一阶段内容或选择列表，并协调第二阶段基础设施、令牌、地址或后继组件。顺序交接要求处理阶段超时、版本不一致和目标选择；功能分离要求在任务与结果通道之间维持 victim ID、密钥或任务 ID。更多通道增加运营成本、配置错误和可关联桥接痕迹，且每个通道都可能成为阻断点。
            en: >-
              The actor must preserve channel role and state in the implant, control first-stage content or selection lists, and coordinate second-stage infrastructure, tokens, addresses, or successor components. Sequential handoff must handle stage timeout, version mismatch, and victim selection. Functional separation must carry a victim, key, or task identifier between task and result channels. More channels increase operational cost, configuration errors, and bridgeable traces, and each channel becomes another possible blocking point.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定至少可从代理/Zeek 取得每次连接的时间、设备、目的地、URI、方法、状态、请求/响应长度与文件 ID，并从端点取得网络发起进程、ProcessUniqueId、父子进程、文件来源/摘要和脚本执行。在内容不可见时可按进程—目的地序列和后继执行提出候选；只有恢复配置地址、selection/token/task ID 或明确任务—结果关系时，才能高置信声明多阶段角色。
            en: >-
              The defender is assumed to obtain time, device, destination, URI, method, status, request and response lengths, and file IDs for each connection from a proxy or Zeek, plus initiating process, ProcessUniqueId, parent-child process, file origin or digest, and script execution from endpoints. With opaque content, process-to-destination sequences and successor execution support a candidate finding. A high-confidence multi-stage role requires recovered configuration addresses, selection, token, or task IDs, or an explicit task-to-result relationship.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary: {zh: 阶段与功能分工把完整控制链分散到多个通道, en: Stage and function roles disperse the complete control chain across channels}
      analysis:
        paragraphs:
          - zh: >-
              攻击者让第一通道只暴露自动引导或任务取得，让第二通道只暴露交互控制或结果回传；任何单一目的地/时间窗口中的信号因此比完整 C2 更弱，跨事件重建成本上升。BACKSPACE 的选择列表和第二控制器、oemd 的 UDP 地址接收后 TCP 连接、BlackWater 的组件服务器与结果 C2 直接支持这条行为—痕迹—观察因果链。若防守以设备/进程和交接内容跨通道关联，释痕收益会收缩。
            en: >-
              The actor exposes only automated bootstrap or task acquisition on one channel and only interactive control or result return on another. Signals at one destination or in one time window are therefore weaker than the complete C2 chain and cross-event reconstruction becomes harder. BACKSPACE's selection list and second controller, oemd's UDP address receipt followed by TCP, and BlackWater's component server and result C2 directly support this behavior-to-trace-to-observation chain. The dilution benefit shrinks when defenders correlate across channels by device, process, and handoff content.
      evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-BLACKWATER, B3-T1104-REF-LUNARWEB-REUSE]
      confidence: high
  subtechnique_taxonomy:
    coverage: established
    proposed_child_keys: [B3-T1104-SUB-BOOTSTRAP, B3-T1104-SUB-FUNCTION]
    narrative:
      paragraphs:
        - zh: >-
            两项候选子技术按通道角色之间的关系划分。引导—操作通道交接是顺序状态机：第一通道下发地址、选择或能力材料，触发同一植入/后继组件建立操作通道；任务—结果通道功能分离是并行或循环角色分工：一个通道提供指令/组件，另一个接收由这些任务产生的数据。前者的检测桥是 handoff artifact 与后继连接，后者的检测桥是 task ID/进程执行与结果出口。
          en: >-
            The two candidate children are separated by the relationship among channel roles. Bootstrap-to-Operational Channel Handoff is a sequential state machine: a first channel supplies an address, selection, or capability material that causes the same implant or successor to establish an operational channel. Task–Result Functional Channel Separation is a parallel or recurring role split: one channel supplies instructions or components and another receives data produced by those tasks. The first is bridged by a handoff artifact and successor connection; the second by a task ID or process execution and result egress.
        - zh: >-
            HTTP、UDP、TCP、邮件或 Web 服务名称不能成为子项，多个同角色镜像也不构成分类。失败触发备用、代理多跳、合法服务资源、多协议选择与载荷进程阶段分别由 NJT-0153、T1090、T1102、NJT-0160 和执行/传输对象拥有；只有角色化通道及其可证交接保留在本 taxonomy。
          en: >-
            HTTP, UDP, TCP, mail, or Web-service names cannot define a child, and multiple mirrors with the same role do not form a taxonomy. Failure-triggered reserve paths, proxy hops, legitimate service resources, protocol choice, and payload process stages remain with NJT-0153, T1090, T1102, NJT-0160, and execution or transfer objects respectively. Only role-assigned channels and their provable handoffs remain in this taxonomy.
proposed_subtechniques:
  - key: B3-T1104-SUB-BOOTSTRAP
    name: {zh: 引导—操作通道交接, en: Bootstrap-to-Operational Channel Handoff}
    summary:
      zh: >-
        攻击者让低能力引导通道下发选择、地址或组件，仅在条件满足后建立完整操作通道，从而分离普遍轮询与高价值控制。
      en: >-
        Adversaries use a lower-capability bootstrap channel to deliver selection, address, or component material and establish a full operational channel only after a condition is met, separating broad polling from high-value control.
    stable_variable: actor_controlled_stage_state_transition_from_bootstrap_channel_to_operational_channel
    trace_change: low_volume_automated_stage_precedes_a_new_destination_session_or_successor_process_only_after_selection_configuration_or_readiness
    defender_observation_difference: detection_requires_joining_handoff_artifact_process_lineage_and_successor_session_across_time_and_destinations
    prerequisites: implant_stage_state_bootstrap_content_control_and_reachable_operational_infrastructure
    evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-LUNARWEB-REUSE]
    confidence: high
    definition_and_concept:
      paragraphs:
        - zh: >-
            引导—操作通道交接是攻击者先让植入使用自动化、低能力或低暴露的通道获取第二阶段位置、选择状态、令牌、配置或后继组件，并只在这些条件成立后建立承担交互命令、文件操作或完整 RAT 功能的另一通道。直接目标是把广泛长期存在的引导基础设施与只为被选主机暴露的操作基础设施分离。
          en: >-
            Bootstrap-to-Operational Channel Handoff means an actor first has an implant use an automated, lower-capability, or lower-exposure channel to obtain second-stage location, selection state, token, configuration, or a successor component, then establishes another channel for interactive commands, file operations, or full RAT capability only after those conditions are met. The direct goal is separating broadly and persistently exposed bootstrap infrastructure from operational infrastructure revealed only to selected hosts.
        - zh: >-
            BACKSPACE 第一阶段不支持操作者互动，而是自动获取 dizhi/connect 配置并只让名单中的主机连接第二控制器；Juniper oemd 先在 UDP socket 接收 C2 地址/端口，再建立 TCP 命令通道；LunarWeb 则将首次主机信息上送 URL 与命令 URL 分开。这些不同实现共同证明顺序交接变量，不要求使用相同协议、进程或文件格式。
          en: >-
            BACKSPACE's first stage does not support operator interaction; it automatically retrieves dizhi and connect configuration and only listed hosts reach the second controller. Juniper oemd first receives a C2 address and port over a UDP socket and then establishes a TCP command channel. LunarWeb separates its first-contact host-information URL from command URLs. These distinct implementations establish a sequential handoff variable without requiring the same protocol, process, or file format.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            引导—操作通道交接让绝大多数观察只看到稳定、自动化、低带宽的第一阶段，而交互式第二阶段仅出现在操作者选择的少数主机和较短时间段。按第一阶段基础设施查封可能找不到完整控制器，按第二阶段倒查也会漏掉尚未升级的植入。痕迹仍包括引导回复中的地址/端口、选择列表、配置文件或下载摘要，以及紧随其后的新连接、子进程和能力变化。
          en: >-
            Bootstrap-to-Operational Channel Handoff leaves most observations with a stable, automated, low-bandwidth first stage while interactive second-stage activity appears only on operator-selected hosts and for shorter intervals. Seizing bootstrap infrastructure may not reveal the full controller, while pivoting from the second stage misses implants not yet upgraded. Residual traces include addresses and ports, selection lists, configuration files, or download digests in bootstrap responses and the new connection, child process, and capability change that follows.
        - zh: >-
            匿迹不来自“第二域名”本身，而来自有条件状态转换。若防守能解密第一阶段内容、保留下载文件来源并用 ProcessUniqueId 跨足够窗口关联新目的地，交接会非常显眼。若第二阶段延迟数天、以进程注入继承原进程身份、使用同一 CDN 或只在内存中保存地址，桥接难度上升。
          en: >-
            Stealth comes from a conditional state transition rather than the mere existence of a second domain. If defenders decrypt bootstrap content, retain download provenance, and correlate new destinations by ProcessUniqueId over a sufficient window, the handoff can be conspicuous. A delay of days, process injection that preserves the original identity, the same CDN, or in-memory-only address storage raises bridge difficulty.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求第一通道角色受限、存在可识别的选择/配置/能力交接，并在同一植入或直接后继组件上出现第二操作通道和控制结果。普通软件安装后首次联网、加载器执行载荷、同服务的登录后会话、OAuth 重定向、CDN 地址变化或仅下载文件都不是本项，除非能证明后继通道承担独立 C2 角色。
          en: >-
            Inclusion requires a role-limited first channel, an identifiable selection, configuration, or capability handoff, and a second operational channel plus control outcome on the same implant or direct successor. Ordinary first launch after installation, loader execution, an authenticated session within one service, OAuth redirection, CDN address changes, or file download alone do not qualify without proof that a successor channel has an independent C2 role.
        - zh: >-
            第一阶段因失败切换主/备服务器属于 NJT-0153，BACKSPACE 的 bak.txt 便是并行邻接事实；选择目标后进入第二控制器则属于本项。若多个节点只转发同一操作会话，归 T1090；若第一阶段在 TechNet、GitHub 等服务发布位置，服务资源滥用归 T1102，而位置到操作通道的阶段交接仍可并列本项。
          en: >-
            A first stage switching between primary and backup servers after failure belongs to NJT-0153; BACKSPACE's bak.txt is a concurrent adjacent fact. Entering a second controller after victim selection belongs here. Multiple nodes merely forwarding one operational session belong to T1090. If a first stage publishes location through TechNet, GitHub, or another service, T1102 owns the service-resource abuse while the location-to-operational-stage handoff can coexist here.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              在大规模长期情报行动中，植入可每天轮询第一阶段获取版本、更新和 run/hide 状态；当操作者确认主机价值后，将 victim ID 放入 selection 文件并发布第二阶段地址，植入才开启完整控制会话。网络设备上的被动后门也可先通过本地 UDP 接收目标，再从设备发起 TCP 连接，避免长期暴露固定操作控制器。
            en: >-
              In a large, long-running intelligence operation, implants can poll a first stage daily for versions, updates, and run or hide state. After an operator confirms host value, the victim ID is placed in a selection file and a second-stage address is published before the implant opens a full control session. A passive backdoor on a network device can similarly receive a target over local UDP before initiating TCP from the device, avoiding continuous exposure of a fixed operational controller.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需控制第一阶段内容和第二阶段基础设施，维护 victim ID/配置格式并让植入保存阶段状态。目标选择降低第二阶段暴露，却要求可靠发布 selection/address 并处理错误或版本漂移。操作员若误配地址、名单或令牌，会产生失败连接、重复下载和更明显的交接痕迹。
              en: >-
                The actor needs control of first-stage content and second-stage infrastructure, must maintain victim IDs and configuration formats, and must have the implant preserve stage state. Victim selection reduces second-stage exposure but requires reliable publication of selections and addresses and handling of errors or version drift. Misconfigured addresses, lists, or tokens create failed connections, repeated downloads, and more visible handoff traces.
        defender_model:
          paragraphs:
            - zh: >-
                防守方能把代理/HTTP 响应、文件创建、端点进程和新网络连接以 DeviceId、ProcessUniqueId、文件摘要、URL/RemoteIP 和时间连接起来，并至少保留一个完整的引导周期。内容可见时解析地址/端口/列表；内容不可见时以同进程/后继进程突然改变目的地、流量方向和交互强度作为较低置信线索。
              en: >-
                The defender can join proxy or HTTP responses, file creation, endpoint processes, and new network connections by DeviceId, ProcessUniqueId, file digest, URL or RemoteIP, and time, retaining at least one complete bootstrap cycle. Where content is visible, addresses, ports, and lists can be parsed. With opaque content, sudden changes in destination, direction, and interaction intensity by the same or successor process are lower-confidence leads.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 选择式交接把低噪声引导与完整操作分置, en: Selective handoff separates low-noise bootstrap from full operation}
        analysis:
          paragraphs:
            - zh: >-
                攻击者让所有植入在第一阶段只留下自动化弱信号，并仅为选中主机生成第二阶段连接，完整控制活动在主机集合、时间和基础设施上被稀释。BACKSPACE 的 connect/dizhi 交接和 oemd 的 UDP 目标到 TCP 会话直接证明状态转换。防守若保留交接材料并按同一设备/进程连接两个阶段，可重新集中这些信号。
              en: >-
                The actor leaves only weak automated first-stage signals across all implants and creates second-stage connections only for selected hosts, dispersing full control across host population, time, and infrastructure. BACKSPACE's connect and dizhi handoff and oemd's UDP target to TCP session directly establish the state transition. Defenders can reconcentrate the signals by retaining handoff material and joining both stages on the same device and process.
        evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER]
        confidence: high
    research_limitations:
      paragraphs:
        - zh: >-
            APT30 报告详细描述工具配置和控制器工作流，但公开资料不能证明每个已知 BACKSPACE 样本都实际进入第二阶段。Juniper oemd 的代码级分析证明 UDP→TCP 能力，但 Mandiant 没有宣称在事件中捕获该样本的每次实际交接。LunarWeb 的首次联系与命令 URL 分工为样本逻辑，两个命令 URL 之间是否按选择或备用使用未完全说明。
          en: >-
            The APT30 report details tool configuration and controller workflow but does not establish that every known BACKSPACE sample entered stage two in the field. Juniper oemd code analysis establishes UDP-to-TCP capability, but Mandiant does not claim every actual handoff was captured during an incident. LunarWeb's first-contact and command-URL roles are sample logic, while selection or fallback behavior between its two command URLs is not fully explained.
  - key: B3-T1104-SUB-FUNCTION
    name: {zh: 任务—结果通道功能分离, en: Task–Result Functional Channel Separation}
    summary:
      zh: >-
        攻击者从一个通道取得任务或执行组件，再通过另一通道回传由该任务产生的结果，使任一通道只呈现控制链的一侧。
      en: >-
        Adversaries obtain tasking or execution components through one channel and return the resulting data through another, leaving each channel with only one side of the control chain.
    stable_variable: assignment_of_task_acquisition_and_result_return_to_distinct_channels
    trace_change: inbound_instruction_or_component_and_outbound_result_are_separated_by_destination_resource_or_session
    defender_observation_difference: detection_requires_linking_task_channel_local_execution_and_result_channel_instead_of_request_response_within_one_session
    prerequisites: local_task_execution_and_shared_victim_task_or_process_identity_across_channels
    evidence_keys: [B3-T1104-REF-BLACKWATER, B3-T1104-REF-LUNARWEB-REUSE]
    confidence: medium
    definition_and_concept:
      paragraphs:
        - zh: >-
            任务—结果通道功能分离是攻击者让植入通过第一通道取得脚本、枚举逻辑或命令，再把执行生成的信息通过不同端点、资源或会话发送出去。直接目标是使任务来源和结果去向不共享一个可观察请求—响应链；只看任务通道可能只见组件下载，只看结果通道可能只见单向数据。
          en: >-
            Task–Result Functional Channel Separation means an actor has an implant obtain a script, enumeration logic, or command through one channel and send information produced by execution through a different endpoint, resource, or session. The direct goal is preventing task source and result destination from sharing one observable request-response chain. The task channel may show only a component download, while the result channel may show only one-way data.
        - zh: >-
            BlackWater 的 PowerShell stager 从一台攻击者服务器取得 FruityC2 枚举组件，执行后把数据通过另一 C2 的 URL 字段发送；LunarWeb 的命令包可以指定 output URL，表明任务与结果目的地是显式可控字段，但 ESET 在有限观测包中看到 output URL 与 command URL 相同。因此 BlackWater 是正式存在性的直接证据，LunarWeb 仅支持变量的实现能力与边界。
          en: >-
            BlackWater's PowerShell stager retrieves a FruityC2 enumeration component from one actor server and, after execution, sends data in the URL field to a different C2. LunarWeb command packages can specify an output URL, showing destination is an explicitly controllable task field, but ESET's limited observed packages used the same output and command URL. BlackWater therefore provides direct existence evidence, while LunarWeb supports implementation capability and its boundary only.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            任务—结果通道功能分离破坏了单会话内的因果完整性。下载端点可能表现为短小文本/脚本取得且没有明显回传，结果端点可能只接收编码后的系统信息且没有可见命令；按目的地或单一代理事务判断时，两者都低于完整 RAT 会话的可疑度。残余桥接痕迹是同一 DeviceId/ProcessUniqueId、组件摘要、脚本块/WMI 枚举、任务 ID/victim ID、执行时间与随后结果请求长度。
          en: >-
            Task–Result Functional Channel Separation breaks causal completeness within one session. The download endpoint may show a short text or script retrieval with no obvious return traffic, while the result endpoint only receives encoded system information without a visible command. Destination- or transaction-local analysis therefore sees less suspicion than a complete RAT session. Residual bridges include the same DeviceId or ProcessUniqueId, component digest, script block or WMI enumeration, task or victim ID, execution time, and the length of the later result request.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入必须证明第一通道内容导致本地执行/收集，第二通道承载该执行结果，并由共同进程、任务/victim ID、数据内容或紧密时序连接。普通 REST 请求后响应、同一 URL 的 POST 回传、浏览器下载后用户另行上传、微服务控制/遥测分离和备份代理均为反例。不同目的地和相反流向只是线索，不是结论。
          en: >-
            Inclusion requires evidence that first-channel content causes local execution or collection and a second channel carries the resulting output, joined by process, task or victim ID, data content, or tight timing. An ordinary REST request and response, POST return to the same URL, a user uploading after a browser download, microservice control and telemetry separation, and backup agents are counterexamples. Different destinations and opposite directions are leads rather than conclusions.
        - zh: >-
            T1102 可描述任务或结果通道使用的合法 Web 资源，NJT-0160 描述实际 HTTP/邮件等事务；本项描述二者之间的功能因果。若第二目的地只是在第一目的地失效后接替相同任务，归 NJT-0153；若两个目标是代理链上的相邻跳点，归 T1090。
          en: >-
            T1102 can describe a legitimate Web resource used by either task or result channel, while NJT-0160 describes actual HTTP, mail, or other transactions. This child describes functional causality between channels. A second destination that assumes the same role only after the first fails belongs to NJT-0153. Two destinations that are adjacent hops in a proxy chain belong to T1090.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              轻量 PowerShell stager 可从只提供枚举模块的服务器取得脚本并执行 WMI/系统查询，再把编码结果放入另一服务器的 URL 或 POST 正文。防守若只封下载端点，已加载脚本仍可向结果端点工作；只发现结果端点时，又难从该流量直接恢复任务来源。
            en: >-
              A lightweight PowerShell stager can retrieve an enumeration module from a server dedicated to supplying it, execute WMI or system queries, and place encoded results in another server's URL or POST body. Blocking only the download endpoint leaves a loaded script able to use the result endpoint, while discovering only the result endpoint makes the task source difficult to recover from that traffic alone.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需让第一通道提供可执行任务/组件，并在第二通道中携带足以归属受害者或任务的标识，同时协调密钥、字段与重试。功能分离增加基础设施和状态管理成本，且本地执行会产生 WMI、PowerShell、子进程或文件痕迹。若结果通道被 DLP/代理严格审计，分离本身不能隐藏结果内容。
              en: >-
                The actor needs executable task or component delivery on the first channel and enough victim or task identity on the second, with coordinated keys, fields, and retries. Functional separation increases infrastructure and state-management cost, while local execution leaves WMI, PowerShell, child-process, or file traces. If DLP or proxy inspection closely monitors the result channel, separation alone does not hide output content.
        defender_model:
          paragraphs:
            - zh: >-
                防守方假定有 DeviceNetworkEvents/代理连接、DeviceProcessEvents、DeviceFileEvents 和需要时的 PowerShell 4104，并可用 DeviceId、ProcessUniqueId/InitiatingProcessUniqueId、文件 SHA1、RemoteUrl/IP、脚本时间与任务后结果关联。没有内容或脚本日志时，跨目的地序列只能形成中等/低置信候选。
              en: >-
                The defender is assumed to have DeviceNetworkEvents or proxy connections, DeviceProcessEvents, DeviceFileEvents, and PowerShell 4104 where needed, joinable by DeviceId, ProcessUniqueId or InitiatingProcessUniqueId, file SHA1, RemoteUrl or IP, script time, and post-task result. Without content or script logs, a cross-destination sequence supports only medium- or low-confidence candidacy.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 任务取得与结果回传分置使单通道因果不完整, en: Separating task acquisition and result return leaves each channel causally incomplete}
        analysis:
          paragraphs:
            - zh: >-
                攻击者把任务或组件的入站痕迹放在第一目的地，把任务结果的出站痕迹放在第二目的地；局部规则看不到命令与结果闭环，跨目的地/进程重构成本提高。BlackWater 的组件取得—本地枚举—不同 C2 回传直接支持该因果链。以同一设备/进程和执行结果联接可恢复闭环。
              en: >-
                The actor places inbound task or component traces at one destination and outbound task results at another. Local rules cannot see a closed command-result loop and cross-destination or process reconstruction becomes harder. BlackWater's component retrieval, local enumeration, and return to a different C2 directly support this causal chain. Joining on the same device or process and execution outcome restores the loop.
        evidence_keys: [B3-T1104-REF-BLACKWATER]
        confidence: medium
    research_limitations:
      paragraphs:
        - zh: >-
            Talos 直接描述 BlackWater 从一个服务器取得组件并向不同 C2 回传枚举数据，同时对 MuddyWater 归因只给出中等置信。报告没有测量具体产品漏报率。LunarWeb 的 output URL 是可控能力，但有限观察的命令包使用同一 command/output URL，故不能把它写成已观察的功能分离案例。
          en: >-
            Talos directly describes BlackWater retrieving a component from one server and returning enumeration data to a different C2, while attributing the campaign to MuddyWater only with moderate confidence. The report does not measure a product miss rate. LunarWeb has a controllable output URL capability, but the limited observed command packages used the same command and output URL, so it cannot be written as an observed functional-separation case.
defense_candidates:
  detection_strategies:
    - key: B3-T1104-DET-STAGE
      name: {zh: 引导材料到操作通道的交接谱系, en: Bootstrap Material to Operational Channel Handoff Lineage}
      detects_keys: [B3-T1104-PARENT, B3-T1104-SUB-BOOTSTRAP]
      objective:
        zh: >-
          将第一阶段响应中的地址、选择、配置或载荷，与同一设备/进程谱系上的第二目的地连接和操作结果关联，识别非失败触发的能力阶段转换。
        en: >-
          Join addresses, selection, configuration, or payloads from a first-stage response to a second-destination connection and operational outcome on the same device or process lineage, identifying capability-stage transitions not triggered by failure.
      analytic_keys: [B3-T1104-NJA-ARTIFACT, B3-T1104-NJA-INTERACTIVE]
    - key: B3-T1104-DET-FUNCTION
      name: {zh: 任务取得—本地执行—结果回传跨通道闭环, en: Cross-Channel Task Acquisition–Execution–Result Loop}
      detects_keys: [B3-T1104-PARENT, B3-T1104-SUB-FUNCTION]
      objective:
        zh: >-
          把任务/组件取得、本地脚本或进程结果与另一目的地的结果回传连接成闭环，发现单通道分析缺失的功能分工。
        en: >-
          Close the loop among task or component acquisition, local script or process outcomes, and result return to another destination, exposing functional roles missed by single-channel analysis.
      analytic_keys: [B3-T1104-NJA-TASK-RESULT]
  detection_analytics:
    - key: B3-T1104-NJA-ARTIFACT
      strategy_key: B3-T1104-DET-STAGE
      name: {zh: 引导响应材料到新目的地/进程关联, en: Bootstrap Response Material to New Destination or Process Join}
      target_keys: [B3-T1104-PARENT, B3-T1104-SUB-BOOTSTRAP]
      logic:
        zh: >-
          从代理/Zeek HTTP 记录识别低频自动化第一阶段响应，并在内容可见时提取返回的 IP/port、URL、victim selection、配置文件 ID 或载荷摘要；用 DeviceNetworkEvents 的 DeviceId/InitiatingProcessUniqueId、DeviceFileEvents 的 FileOriginUrl/SHA1、DeviceProcessEvents 的 ProcessUniqueId/InitiatingProcessUniqueId 构造谱系。在最初 0–60 分钟窗口内查找同进程或直接后继进程连接新目的地并出现命令解释器、文件操作或长双向会话；对于低频植入扩展至 7 天。内容不透明时只把“同进程/后继进程在第一响应后首次连接新端点”作为候选，不能声称恢复了 handoff artifact。
        en: >-
          Identify low-frequency automated first-stage responses from proxy or Zeek HTTP data and, where content is visible, extract returned IP and port, URL, victim selection, configuration file ID, or payload digest. Build lineage using DeviceId and InitiatingProcessUniqueId from DeviceNetworkEvents, FileOriginUrl and SHA1 from DeviceFileEvents, and ProcessUniqueId and InitiatingProcessUniqueId from DeviceProcessEvents. In an initial 0–60 minute window, look for the same process or a direct successor connecting to a new destination and producing a command interpreter, file operations, or a long bidirectional session; extend to seven days for low-frequency implants. With opaque content, a first new endpoint after the response on the same or successor process is only a candidate and cannot be described as recovered handoff material.
      data_requirements:
        - {source_type: http_transaction, channel: 'Zeek http.log or secure web proxy', required_fields: [ts, uid, host, uri, method, status_code, request_body_len, response_body_len, resp_fuids, content_or_response_ref]}
        - {source_type: endpoint_network, channel: 'Microsoft Defender XDR DeviceNetworkEvents or equivalent', required_fields: [Timestamp, DeviceId, RemoteIP, RemotePort, RemoteUrl, Protocol, InitiatingProcessUniqueId, ActionType]}
        - {source_type: endpoint_file, channel: 'Microsoft Defender XDR DeviceFileEvents or equivalent', required_fields: [Timestamp, DeviceId, ActionType, FileName, FolderPath, SHA1, FileOriginUrl, FileOriginIP, InitiatingProcessUniqueId]}
        - {source_type: endpoint_process, channel: 'Microsoft Defender XDR DeviceProcessEvents or equivalent', required_fields: [Timestamp, DeviceId, ProcessUniqueId, InitiatingProcessUniqueId, FileName, FolderPath, SHA1, ProcessCommandLine]}
      observables: [returned_endpoint_or_selection, bootstrap_response_file, first_new_destination, successor_process_network_session, operational_command_or_file_outcome]
      correlation:
        window: '0–60 minutes initially; retain at least 7 days for delayed selective activation'
        dimensions: [DeviceId, InitiatingProcessUniqueId, ProcessUniqueId, SHA1, returned_endpoint, RemoteIP, RemoteUrl, uid, time]
      false_positives: [software_updater_fetching_manifest_then_CDN_payload, package_manager_and_installer, legitimate_remote_management_bootstrap, VPN_or_SASE_client_discovery, cloud_agent_registration]
      blind_spots: [opaque_TLS_without_response_ref, in_memory_config_or_injection, child_process_identity_loss, long_delay_beyond_retention, CDN_or_shared_destination, sensor_clock_skew]
      tuning_guidance:
        zh: >-
          按签名发布者、软件产品、清单 URL、批准后继域和正常首次运行窗口建立谱系白名单，仍保留同一批准进程联系未登记新目的地的覆盖。把“下载后联网”与明确返回地址/选择、非正常子进程或操作结果组合，不使用固定 60 分钟作为跨环境事实。
        en: >-
          Baseline lineage by signed publisher, software product, manifest URL, approved successor domain, and normal first-run window while retaining coverage when an approved process contacts an unregistered new destination. Combine post-download networking with an explicitly returned address or selection, abnormal child process, or operational outcome rather than treating 60 minutes as a universal fact.
      evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-LUNARWEB-REUSE, B3-T1104-REF-ZEEK-HTTP-REUSE, B3-T1104-REF-MDE-NET-REUSE, B3-T1104-REF-MDE-PROC-REUSE, B3-T1104-REF-MDE-FILE-REUSE]
    - key: B3-T1104-NJA-INTERACTIVE
      strategy_key: B3-T1104-DET-STAGE
      name: {zh: 自动化轮询到选择式交互会话转换, en: Automated Polling to Selective Interactive Session Transition}
      target_keys: [B3-T1104-SUB-BOOTSTRAP]
      logic:
        zh: >-
          按 DeviceId/进程和第一阶段目标建立长期轮询序列，计算方向、orig/resp bytes、packet count、duration、间隔和应用事务数；在收到 selection/config 后，寻找同一主机首次连接独立目的地且会话从短周期自动轮询变为长持续、双向字节接近或与 shell/文件命令同步的交互形态。BACKSPACE 的 connect/dizhi 文件和 victim host ID 可作家族确认。正常第一阶段失败后改用同角色端点应送 NJT-0153 分析，不在本 analytic 作为阶段转换。
        en: >-
          Build a long-lived polling sequence by DeviceId or process and first-stage destination, measuring direction, orig and resp bytes, packet count, duration, interval, and application-transaction count. After a selection or configuration response, seek the same host's first connection to an independent destination where short periodic automated polling becomes a long-lived session, more balanced bidirectional bytes, or activity synchronized with shell or file commands. BACKSPACE connect and dizhi files and victim host ID are family confirmations. A same-role endpoint used after first-stage failure should be routed to NJT-0153 analysis rather than counted as a stage transition here.
      data_requirements:
        - {source_type: network_flow, channel: 'Zeek conn.log or equivalent unsampled flow', required_fields: [ts, uid, id.orig_h, id.orig_p, id.resp_h, id.resp_p, proto, service, duration, orig_bytes, resp_bytes, orig_pkts, resp_pkts, conn_state]}
        - {source_type: http_transaction, channel: 'Zeek http.log or proxy', required_fields: [ts, uid, host, uri, method, status_code, request_body_len, response_body_len]}
        - {source_type: endpoint_process_network, channel: 'Defender XDR or equivalent', required_fields: [Timestamp, DeviceId, InitiatingProcessUniqueId, ProcessUniqueId, RemoteIP, RemotePort, RemoteUrl, ProcessCommandLine]}
      observables: [stable_automated_stage_one_polling, selection_or_configuration_event, first_independent_stage_two_destination, session_shape_change, interactive_process_or_file_activity]
      correlation:
        window: 'At least 7 days for stage-one baseline; 0–24 hours from selection to stage-two session, calibrated to sample and environment'
        dimensions: [DeviceId, process_lineage, victim_id, stage_one_destination, stage_two_destination, uid, time]
      false_positives: [remote_support_agent_escalating_to_live_session, monitoring_agent_opening_remediation_session, software_update_then_admin_control, cloud_management_agent_activation]
      blind_spots: [stage_two_same_destination_or_CDN, encrypted_selection_content, no_process_identity_on_network_device, sparse_activation_beyond_retention, attacker_shaping_interactive_flow_as_polling]
      tuning_guidance:
        zh: >-
          为合法管理工具明确登记轮询端点、人工会话端点、操作员身份与工单触发；只有无批准选择事件或后继目的地不属于产品时提升。流量“更大/更长”只用于同设备同产品相对差，不设置未知本地基线的通用阈值。
        en: >-
          Register polling endpoints, live-session endpoints, operator identities, and ticket triggers for legitimate management tools and elevate only when the selection event is unapproved or the successor destination is outside the product. Larger or longer traffic is a within-device and within-product differential rather than a universal threshold without a local baseline.
      evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-ZEEK-CONN-REUSE, B3-T1104-REF-ZEEK-HTTP-REUSE, B3-T1104-REF-MDE-NET-REUSE, B3-T1104-REF-MDE-PROC-REUSE]
    - key: B3-T1104-NJA-TASK-RESULT
      strategy_key: B3-T1104-DET-FUNCTION
      name: {zh: 任务/组件取得到异目的地结果回传关联, en: Task or Component Acquisition to Cross-Destination Result Return Join}
      target_keys: [B3-T1104-PARENT, B3-T1104-SUB-FUNCTION]
      logic:
        zh: >-
          从第一通道识别脚本/组件响应、命令包或明显入站任务，在同一 DeviceId 和 InitiatingProcessUniqueId/后继 ProcessUniqueId 上关联 PowerShell 4104、WMI/系统枚举、子进程或文件读取，然后在最初 0–30 分钟内寻找向不同 RemoteUrl/IP 的 URL 参数、POST 或单向大出站结果。内容可见时比较任务字段、victim/task ID 和结果结构；内容不可见时必须同时具备第一通道取得、对应本地执行和第二目的地回传三段，不能用两个域名和相反流向替代因果。
        en: >-
          Identify script or component responses, command packages, or clear inbound tasking on the first channel. On the same DeviceId and InitiatingProcessUniqueId or successor ProcessUniqueId, correlate PowerShell 4104, WMI or system enumeration, child processes, or file reads, then seek URL parameters, POSTs, or predominantly outbound result traffic to a different RemoteUrl or IP within an initial 0–30 minute window. Where content is visible, compare task fields, victim or task ID, and result structure. With opaque content, require all three segments—first-channel acquisition, matching local execution, and second-destination return—rather than substituting two domains and opposite flow direction for causality.
      data_requirements:
        - {source_type: network_http, channel: 'Zeek/proxy and Defender DeviceNetworkEvents', required_fields: [timestamp, DeviceId, uid, RemoteUrl, RemoteIP, method, uri, status_code, request_body_len, response_body_len, InitiatingProcessUniqueId]}
        - {source_type: endpoint_script, channel: 'Windows PowerShell Operational 4104 when enabled', required_fields: [timestamp, computer, event_id, script_block_id, script_block_text, process_id]}
        - {source_type: endpoint_process, channel: 'Defender DeviceProcessEvents or equivalent', required_fields: [Timestamp, DeviceId, ProcessUniqueId, InitiatingProcessUniqueId, FileName, ProcessCommandLine, SHA1]}
        - {source_type: endpoint_file, channel: 'Defender DeviceFileEvents or equivalent', required_fields: [Timestamp, DeviceId, FileName, FolderPath, SHA1, FileOriginUrl, InitiatingProcessUniqueId, ActionType]}
      observables: [task_or_component_response, matching_script_or_enumeration, distinct_result_destination, victim_or_task_identifier_reuse, encoded_result_parameter_or_body]
      correlation:
        window: '0–30 minutes initially; extend to one full configured task cycle and retain 24 hours for delayed collection'
        dimensions: [DeviceId, ProcessUniqueId, InitiatingProcessUniqueId, script_block_id, SHA1, victim_or_task_id, task_destination, result_destination, time]
      false_positives: [enterprise_agent_fetching_job_then_uploading_telemetry, CI_CD_worker, vulnerability_scanner, backup_or_inventory_agent, browser_download_followed_by_user_upload]
      blind_spots: [PowerShell_logging_disabled_or_bypassed, in_memory_or_native_enumeration, TLS_and_URL_parameters_hidden, process_injection_breaking_lineage, task_and_result_under_same_shared_service, long_delay]
      tuning_guidance:
        zh: >-
          为批准 agent 定义任务端、结果端、软件签名、脚本/命令类别和执行周期，并要求任务/结果服务属于同一批准产品。白名单应绑定版本与进程摘要；发现未知 task endpoint 或执行超出批准类别时仍保留回传检测。不要仅凭 POST 大小或 Base64 判定。
        en: >-
          Define task endpoint, result endpoint, software signature, script or command classes, and execution cycle for approved agents, requiring task and result services to belong to the same approved product. Bind allowlists to version and process digest and retain return-channel detection when task endpoints are unknown or execution exceeds the approved class. Do not decide from POST size or Base64 alone.
      evidence_keys: [B3-T1104-REF-BLACKWATER, B3-T1104-REF-LUNARWEB-REUSE, B3-T1104-REF-POWERSHELL-REUSE, B3-T1104-REF-MDE-NET-REUSE, B3-T1104-REF-MDE-PROC-REUSE, B3-T1104-REF-MDE-FILE-REUSE]
  mitigations:
    - key: B3-T1104-MIT-HANDOFF
      name: {zh: 引导材料验证与后继出口门控, en: Bootstrap Material Validation and Successor-Egress Gating}
      description:
        zh: >-
          对能下发地址、配置或后继代码的第一阶段建立来源/内容验证，并按进程谱系限制材料消费后的新目的地与新代码执行。
        en: >-
          Validate provenance and content for first stages that deliver addresses, configuration, or successor code, and restrict new destinations and new-code execution after consumption by process lineage.
      measures:
        - key: bootstrap_content_governance
          control_type: preventive
          description: {zh: 让受管代理/更新器只从签名清单和批准服务取得配置或代码，校验摘要/签名/产品版本，未知 selection/address 进入隔离。, en: Require managed agents and updaters to obtain configuration or code only from signed manifests and approved services, validate digest, signature, and product version, and quarantine unknown selection or address material.}
        - key: lineage_egress_gate
          control_type: exposure-reduction
          description: {zh: 按 ProcessUniqueId/签名软件角色限定引导进程及后继进程可访问的目的地，未登记的新端点需短时审批并记录触发材料。, en: Constrain destinations available to bootstrap and successor processes by ProcessUniqueId or signed software role, requiring short-lived approval and trigger-material recording for unregistered new endpoints.}
        - key: successor_code_control
          control_type: preventive
          description: {zh: 用应用控制阻止未批准后继二进制/脚本，保留下载来源、摘要和首次执行/联网。, en: Use application control to stop unapproved successor binaries or scripts and retain download origin, digest, and first execution or network use.}
      applications:
        - target_key: B3-T1104-PARENT
          use: {zh: 对所有会改变 C2 角色的配置、地址和组件保留消费谱系，并在阶段转换时重新执行出口与代码策略。, en: Retain consumption lineage for configuration, addresses, and components that change C2 role and reevaluate egress and code policy at each stage transition.}
          expected_effect: {zh: 限制攻击者用低噪声通道任意授权新操作通道，并使交接材料成为可审计控制点。, en: Limit an actor's ability to authorize arbitrary operational channels through a low-noise stage and turn handoff material into an auditable control point.}
          limitations: {zh: TLS/内存配置和合法动态服务可能难以验证；过严门控会破坏更新器、远程管理和云代理，已被盗签名/管理端仍可通过策略。, en: TLS or in-memory configuration and legitimate dynamic services can be difficult to validate. Overly strict gating can break updaters, remote management, and cloud agents, while stolen signing or management authority can satisfy policy.}
        - target_key: B3-T1104-SUB-BOOTSTRAP
          use: {zh: 把第一阶段的选择/地址/组件与允许的第二阶段端点和软件摘要绑定；未匹配时阻断新连接或隔离后继进程。, en: Bind first-stage selection, address, or component to permitted second-stage endpoints and software digests, blocking the new connection or isolating the successor process when unmatched.}
          expected_effect: {zh: 缩小选择式第二阶段的可达集合并保留准确交接证据。, en: Reduce the reachable set for selectively activated second stages and preserve precise handoff evidence.}
          limitations: {zh: 同进程内存交接和共享 CDN 会降低绑定精度，紧急支持/灾备需受控例外。, en: In-process memory handoff and shared CDNs reduce binding precision, and emergency support or disaster recovery needs controlled exceptions.}
      evidence_keys: [B3-T1104-REF-APT30, B3-T1104-REF-JUNIPER, B3-T1104-REF-NETWORK-CONTROL-REUSE, B3-T1104-REF-APP-CONTROL-REUSE]
    - key: B3-T1104-MIT-FUNCTION
      name: {zh: 任务与结果通道角色约束, en: Task and Result Channel Role Confinement}
      description:
        zh: >-
          为合法自动化/管理代理登记任务端、结果端和允许动作，限制跨角色传输并在结果通道执行内容与数据控制。
        en: >-
          Register task endpoints, result endpoints, and allowed actions for legitimate automation and management agents, constrain cross-role transfer, and enforce content and data controls on result channels.
      measures:
        - key: service_role_catalog
          control_type: governance
          description: {zh: 为每个 agent 维护签名软件、设备组、任务服务、结果服务、victim/device ID、允许脚本类别、流量方向和周期。, en: Maintain signed software, device group, task service, result service, victim or device ID, permitted script class, direction, and cadence for each agent.}
        - key: result_channel_controls
          control_type: preventive
          description: {zh: 对结果端点实施目的地允许、身份验证、DLP/大小与字段策略，并拒绝未知脚本进程向未登记服务回传。, en: Enforce destination allow, authentication, DLP or size and field policy on result endpoints and reject result return from unknown script processes to unregistered services.}
        - key: cross_channel_audit
          control_type: detective-support
          description: {zh: 保存任务 ID、配置/组件摘要、本地执行和结果请求的统一 lineage，以便一个通道被阻断后仍能定位另一个。, en: Retain unified lineage for task ID, configuration or component digest, local execution, and result request so the other channel remains discoverable after one is blocked.}
      applications:
        - target_key: B3-T1104-SUB-FUNCTION
          use: {zh: 要求任务取得与结果回传匹配批准的同一产品角色和设备身份；不匹配时阻断结果端并隔离执行进程。, en: Require task acquisition and result return to match an approved product role and device identity, blocking the result endpoint and isolating the executing process when they do not.}
          expected_effect: {zh: 降低攻击者把恶意任务与结果拆到任意服务的自由度，并让回传端保留任务来源上下文。, en: Reduce the actor's freedom to split malicious tasks and results across arbitrary services and preserve task-source context at the return channel.}
          limitations: {zh: 合法 SaaS/代理可能使用不同供应商端点且内容加密；DLP 看不到端到端加密，进程注入可冒用批准 agent，严格限制会影响运维自动化。, en: Legitimate SaaS or agents may use different provider endpoints with encrypted content. DLP cannot inspect end-to-end encryption, process injection can impersonate an approved agent, and strict restrictions can disrupt operational automation.}
      evidence_keys: [B3-T1104-REF-BLACKWATER, B3-T1104-REF-MDE-NET-REUSE, B3-T1104-REF-POWERSHELL-REUSE, B3-T1104-REF-NETWORK-CONTROL-REUSE]
