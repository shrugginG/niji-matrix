batch_ref: BATCH-TA0011-003
original_attack_subtechniques_imported: false
candidate_reviews:
- source_attack_id: T1090
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 4
    attack_subtechnique_ids:
    - T1090.001
    - T1090.002
    - T1090.003
    - T1090.004
    represented_dimensions:
    - 中介相对受害网络边界的位置：内部或外部
    - 代理链节点数量与追踪深度
    - CDN/TLS/HTTP 名称层参与的后端路由方式
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
    - attack_subtechnique_id: T1090.001
      attack_name: Internal Proxy
      resolution: parent-core
      notes:
        zh: 内部位置支持汇聚受限主机、越过分区和缩减直接外联，但位置本身不产生唯一匿迹变量；CISA PRTG/FRP 支持父级两段转发与检测设计。
        en: Internal placement supports aggregating restricted hosts, crossing zones, and reducing direct egress, but
          location itself does not produce a unique stealth variable. CISA PRTG and FRP activity supports parent-level
          two-leg forwarding and defense design.
    - attack_subtechnique_id: T1090.002
      attack_name: External Proxy
      resolution: parent-core
      notes:
        zh: 外部位置通常替代目标可见来源，但租赁 VPS、VPN、公共代理和被攻陷出口的痕迹不同；普通外部代理归父级，被攻陷真实第三方出口贡献第一个 Niji 变量。
        en: External placement commonly substitutes the target-visible origin, but rented VPS, VPN, public proxy, and
          compromised egress leave different traces. Ordinary external proxying remains parent-core, while compromised
          genuine third-party egress contributes the first Niji variable.
    - attack_subtechnique_id: T1090.003
      attack_name: Multi-hop Proxy
      resolution: niji-variable-candidate
      notes:
        zh: 跳数不是变量；只有各中继属于不同观察责任域、只保留相邻关系且端到端链无法由单点恢复时，贡献“分舱中继观察链断裂”。
        en: Hop count is not the variable. Multi-hop contributes Compartmented-Relay Observation-Chain Break only when
          relays occupy separate observation-custody domains, retain adjacent relationships only, and no one point recovers
          the end-to-end chain.
    - attack_subtechnique_id: T1090.004
      attack_name: Domain Fronting
      resolution: niji-variable-candidate
      notes:
        zh: 不继承“域前置”名称；其稳定贡献是同一会话外层 TLS 身份与解密后路由权威分离，形成跨层一致性分析和提供方控制。
        en: The Domain Fronting label is not inherited. Its stable contribution is separation between outer TLS identity
          and decrypted routing authority within one session, enabling cross-layer congruence analysis and provider enforcement.
    candidate_stealth_axes_examined:
    - 被攻陷第三方出口的真实网络归属借用
    - 多管理域中继对端到端观察责任的分舱
    - TLS/HTTP/提供方账户之间的跨层路由权威分离
    - 内部与外部位置差异（拒绝为独立子项）
    - 代理链长度（拒绝为独立子项）
    - 代理端点轮换（交给 TA0042 NJS-0044-002 或 NJT-0153，视直接对象而定）
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 四个 ATT&CK 子项全部获得 planning-only 决议。三个建议 Niji 子项跨越 ATT&CK 的位置/工具分类：被攻陷出口可存在于 external 或 multi-hop，分舱观察可由 Tor
        或自建链实现，路由权威差可由不同共享边缘服务实现。主 Agent 应重点复核第一个子项与 TA0042 NJS-0044-002 的双重归类是否保持“资源准备”与“实际 C2 转发”边界。
      en: 'All four ATT&CK children have planning-only resolutions. The three proposed Niji children cut across ATT&CK''s
        placement and implementation categories: compromised egress may be external or multi-hop, compartmented observation
        may use Tor or a private chain, and routing-authority divergence may use different shared edge services. The
        primary agent should specifically review dual classification of the first child with TA0042 NJS-0044-002 so resource
        preparation remains distinct from actual C2 forwarding.'
  primary_resolution: Adapt as NJT-0206 with three path-observation children.
- source_attack_id: T1092
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: target_identity_and_execution_state_addressing
      result: formal-candidate
      reason: USBStealer and GoldenDealer independently implement target-specific task selection, sparse traces, and
        identity/content lineage defense
    - axis: connected_restricted_role_traversal_state
      result: formal-candidate
      reason: both families gate media use with attacker-controlled prior-contact state, while GoldenDealer directly
        moves the gate into raw boot-record bytes
    - axis: host_opaque_storage
      result: evidence-deferred
      reason: ProjectSauron supports hidden VFS exfiltration but not a repeatable inward-command and outward-result mailbox
    - axis: trip_timing_and_delay
      result: parent-core
      reason: custody delay is inherent to store-and-forward exchange and sources do not support a separately controlled
        stealth cadence
    - axis: one_way_task_delivery
      result: adjacent-technique
      reason: without result return or repeatable tasking it resolves to propagation, tool transfer, or physical delivery
        rather than T1092 C2
    - axis: USB_or_external_disk_type
      result: not-stealth-distinct
      reason: medium type alone does not change the command-result observation model
    - axis: manual_or_automatic_carriage
      result: not-stealth-distinct
      reason: carrier automation is not independently evidenced and does not itself define message lineage or defense
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线无 ATT&CK 子项，但开放检验了寻址、遍历状态、宿主可见性、时间、方向、介质类型和搬运方式。只有身份寻址和遍历门控同时通过稳定性、痕迹变化、观察差异、独立证据与防御差异门。
      en: The fixed baseline has no ATT&CK children, but the open search tested addressing, traversal state, host visibility,
        time, direction, media type, and carriage method. Only identity addressing and traversal gating pass stability,
        trace-change, observation-difference, independent-evidence, and defense-difference gates.
  primary_resolution: Retain as NJT-0207 with two media-state children; opaque mailbox deferred and one-way delivery
    adjacent.
- source_attack_id: T1095
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - network_control_messages
    - raw_transport_streams
    - connectionless_datagrams
    - platform_local_socket_families
    - firmware_management_channels
    breadth_trigger: ordinary_open_ended_search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: connectionless_task_state_externalization
      result: formal_candidate
      child_key: B3-T1095-SUB-DATAGRAM
      reason: PingPull and ShadowPad independently show custom sequence/identity fields replacing transport session state;
        packet reconstruction and egress controls differ from stream C2
    - axis: host_stack_observation_plane_displacement
      result: formal_candidate
      child_key: B3-T1095-SUB-ALTPLANE
      reason: VMCI and AMT SOL independently move communication outside host IP telemetry and require platform management/integrity
        defenses
    - axis: application_parser_absence_over_raw_TCP
      result: parent-core
      reason: Custom TCP length framing directly expresses the adapted parent but retains ordinary connection state and
        lacks another stable child variable
    - axis: diagnostic_or_control_message_name
      result: not-stealth-distinct
      reason: ICMP, UDP, TCP, VMCI and SOL are carrier names; formal axes derive from session-state and observation-plane
        effects
    - axis: shared_open_port_and_magic_authentication
      result: adjacent-technique
      owner: T1205
      reason: Signal-controlled activation or packet interception is owned by Traffic Signaling; continuing raw transport
        may co-occur only after independent proof
    - axis: intact_inner_session
      result: adjacent-technique
      owner: T1572
      reason: Encapsulation of SSH, TCP or another intact session is tunneling rather than direct custom command carriage
    - axis: atypical_port_pairing
      result: adjacent-technique
      owner: T1571
      reason: Port selection changes parser expectations but does not define the communication layer or a T1095 child
    - axis: encoding_or_encryption
      result: adjacent-technique
      owner: T1132/T1573
      reason: Base64, AES and custom transformations affect content inspectability, not connection state or observation
        plane
    - axis: SOCKS_or_generic_proxy
      result: adjacent-technique
      owner: T1090/NJT-0160
      reason: A real SOCKS transaction or forwarding relationship is proxy/application behavior despite historical inclusion
        in the ATT&CK parent description
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线没有 ATT&CK 子项，但父级实现面横跨 raw TCP/UDP/ICMP、平台局部 VMCI 和管理引擎，因此研究未停在协议名称。两个候选轴分别改变会话状态位置与传感器所在平面，具有独立样本、痕迹和防御；raw
        TCP 留在父级，魔术信号、隧道、端口、编码和代理按相邻对象收敛。
      en: The fixed baseline has no ATT&CK children, but its implementation surface spans raw TCP, UDP, ICMP, platform-local
        VMCI, and management engines, so research did not stop at protocol names. Two candidate axes respectively move
        session state and the sensor observation plane and have independent samples, traces, and defenses. Raw TCP stays
        parent core, while magic signaling, tunneling, ports, encoding, and proxies converge to adjacent objects.
  primary_resolution: Adapt as NJT-0208 with connectionless-session and host-stack-bypass children.
- source_attack_id: T1102
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 3
    attack_subtechnique_ids:
    - T1102.001
    - T1102.002
    - T1102.003
    represented_dimensions:
    - service object stores later C2 location
    - same service carries command and result directions
    - service carries one control direction
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
    - attack_subtechnique_id: T1102.001
      attack_name: Dead Drop Resolver
      resolution: adjacent-technique
      notes:
        zh: 合法 service object 存 locator 的事实保留在父级；动态生成、选择或轮换后端地址归 T1568。若对象还保存任务/载荷并被轮询，则贡献对象会合轴。
        en: Parent scope retains legitimate service-object storage of a locator; dynamic generation, selection, or rotation
          of backend addresses belongs to T1568. If the object also stores tasks or payloads and is polled, it contributes
          to object rendezvous.
    - attack_subtechnique_id: T1102.002
      attack_name: Bidirectional Communication
      resolution: niji-variable-candidate
      notes:
        zh: 双向本身不是子项；OilRig/Graphite 的同一命名空间和对象承载 task/result，支持命名空间间接化与对象会合。
        en: Bidirectionality is not a child. The same namespace and objects in OilRig and Graphite carry tasks and results
          and support namespace indirection and object rendezvous.
    - attack_subtechnique_id: T1102.003
      attack_name: One-Way Communication
      resolution: niji-variable-candidate
      notes:
        zh: 单向本身不是子项；ComRAT/HAMMERTOSS command read 支持两个服务资源变量，输出另路传输按 T1567/T1041 判断。
        en: One-way is not a child. ComRAT and HAMMERTOSS command read supports the two service-resource variables, while
          separate output is judged under T1567 or T1041.
    candidate_stealth_axes_examined:
    - provider identity versus real control namespace
    - persistent object task-state lifecycle
    - dynamic locator and address rotation assigned to T1568
    - victim or recipient partition assigned to NJS-0160-002
    - one-way versus bidirectional rejected as taxonomy variable
    - provider-side workflow callback deferred for lack of independent field C2 evidence
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 三个 ATT&CK 子项均有 planning-only 决议。两个原生子项跨越方向标签：OilRig/Graphite 双向和 ComRAT/HAMMERTOSS 单向 command read 可表达相同服务资源变量。主
        Agent 应复核控制命名空间项与 TA0010 NJS-0195-001 的跨战术边界，以 C2 task/outcome 对敏感数据 receiver 区分；MIT-000203 可扩展，DET/NJA 应拆分。
      en: 'All three ATT&CK children have planning-only resolutions. The two native children cross direction labels:
        OilRig and Graphite bidirectional relationships and ComRAT or HAMMERTOSS one-way command reads express the same
        service-resource variables. The primary agent should review the cross-tactic boundary with TA0010 NJS-0195-001,
        distinguishing C2 task or outcome from sensitive-data receiver. MIT-000203 can be extended while DET and NJA
        should split.'
  primary_resolution: Adapt as NJT-0209 with service-namespace and persistent-object rendezvous children.
- source_attack_id: T1104
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - automated_bootstrap
    - victim_selection
    - operational_controller
    - task_or_component_acquisition
    - result_return
    - protocol_or_endpoint_transition
    breadth_trigger: ordinary_open_ended_search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: bootstrap_to_operational_stage_state
      result: formal_candidate
      child_key: B3-T1104-SUB-BOOTSTRAP
      reason: BACKSPACE, oemd and LunarWeb show explicit first-contact/configuration-to-operation roles; detection bridges
        handoff material to a successor session
    - axis: task_acquisition_result_return_function_split
      result: formal_candidate
      child_key: B3-T1104-SUB-FUNCTION
      reason: BlackWater directly shows a component server, local enumeration and a different result C2; defense joins
        task, execution and return
    - axis: primary_failure_to_backup
      result: adjacent-technique
      owner: NJT-0153
      reason: failure or blocking preserves the same channel role; BACKSPACE backup first-stage URLs are distinct from
        its selected second stage
    - axis: multiple_forwarding_hops
      result: adjacent-technique
      owner: T1090
      reason: proxy nodes can relay one logical session without assigning stage or functional roles
    - axis: multiple_web_resources_or_brands
      result: adjacent-technique
      owner: T1102
      reason: provider resource use and reputation are service-resource variables; role handoff requires additional evidence
    - axis: cross_protocol_choice
      result: adjacent-technique
      owner: NJT-0160
      reason: HTTP, UDP, TCP or mail choice defines each channel carrier, not the relationship between them
    - axis: payload_or_process_stage_number
      result: not-stealth-distinct
      reason: loader-to-payload or process injection without a new role-assigned C2 channel is execution staging only
    - axis: multiple_destinations
      result: not-stealth-distinct
      reason: mirrors, load balancing, CDN and redundancy produce multiple domains without stage/function handoff
    - axis: request_response_direction
      result: not-stealth-distinct
      reason: inbound command and outbound result in one logical session are ordinary bidirectional C2 rather than separate
        channels
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线无 ATT&CK 子项，但研究覆盖阶段状态、目标选择、任务/结果角色、失败换路、代理路径、服务资源、协议与普通载荷阶段。两个正式候选都有明确交接、同一受害者谱系、原始证据与差异化防御；其余归相邻对象或非匿迹区分。
      en: The fixed baseline has no ATT&CK children, but research covered stage state, victim selection, task and result
        roles, failure switching, proxy path, service resources, protocols, and ordinary payload stages. Both formal
        candidates have an explicit handoff, same-victim lineage, original evidence, and distinct defenses; the remaining
        axes belong to adjacent objects or are not stealth distinctions.
  primary_resolution: Adapt as NJT-0210 with bootstrap-to-operational handoff and task-result separation children.
