handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-004
work_item_ref: WORK-TA0011-T1105
temporary_key_prefix: B4-T1105
candidate:
  source_type: attack
  source_attack_id: T1105
  name: {zh: 入站工具传输, en: Ingress Tool Transfer}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  resulting_technique_recommendation:
    action: reuse-and-extend
    technique_ref: NJT-0130
    canonical_change: generalize parent from internal lateral arrival to tool-or-file arrival across TA0008 and TA0011; preserve independent DEC-TA0011-T1105
  rationale:
    paragraphs:
      - zh: >-
          T1105 与现有 NJT-0130 共享同一个直接结果门：攻击者控制的独立工具或文件在已受控目标上实际到达，并且源、目标和内容或等价谱系能够被指认。T1570 的源位于受害环境内另一主机，T1105 的源位于外部系统、C2 或替代路径；来源拓扑决定不同的防守数据，却不改变“目标文件到达”这一行为对象。矩阵已有不同 ATT&CK 候选映射到同一 NJT 的先例，因此建议为 TA0011 保留独立 adapt 决策，扩展 NJT-0130 的名称、战术引用和双语范围，而不复制父技术。
        en: >-
          T1105 and existing NJT-0130 share the same direct outcome gate: an adversary-controlled independent tool or file actually arrives on an already controlled destination, with identifiable source, destination, and content or equivalent lineage. T1570 starts from another host inside the victim environment; T1105 starts from an outside system, C2, or alternate path. Source topology requires different defensive data but does not change the behavior object of destination file arrival. The matrix already permits different ATT&CK candidates to resolve to one NJT, so TA0011 should retain an independent adapt decision and extend NJT-0130 name, tactic references, and bilingual scope rather than duplicate the parent.
      - zh: >-
          现有 DET-000139/NJA-000143 与 MIT-000127 只覆盖内部 SMB 到达，不能宣称覆盖 T1105。共享父技术后仍需新增外部请求/响应—目标文件创建 Analytic 与外部入站控制；这属于同一 Technique 下按来源观察面拆分防御，不构成新 Technique 的理由。Mandiant 对 UNC2975 使用重命名 curl 下载 MSI/AutoIt 文件、Microsoft 对 sLoad 经 BITS 下载编码文件再解码执行，以及 BazaCall 经重命名 certutil 下载 BazaLoader 的研究均证明外部响应到目标文件和后继执行链。
        en: >-
          Existing DET-000139, NJA-000143, and MIT-000127 cover internal SMB arrival only and cannot claim T1105 coverage. A shared parent still needs a new external request-or-response-to-destination-file analytic and external-ingress controls. That is a defense split by source observation plane under one Technique, not a reason for another Technique. Mandiant reporting on UNC2975 using renamed curl to download MSI or AutoIt files, Microsoft reporting on sLoad downloading encoded files through BITS before decoding and execution, and BazaCall using renamed certutil to download BazaLoader each establish an external-response-to-destination-file-to-successor-execution chain.
proposed_content:
  name: {zh: 工具或文件传输到达, en: Tool or File Transfer Arrival}
  summary:
    zh: 攻击者使工具或操作文件从外部来源或另一受害主机实际到达已受控目标，并可能借常见传输客户端、来源或路径降低到达来源的可区分性。
    en: An adversary causes a tool or operational file to actually arrive on an already controlled destination from an outside source or another victim host, potentially reducing delivery-provenance distinctiveness through a familiar transfer client, source, or path.
  aliases: [Ingress Tool Transfer, Lateral Tool Transfer, T1105, T1570]
  classification:
    tactic_refs: [TA0008, TA0011]
    origin: {kind: attack-adapted, source_attack_id: T1570, source_attack_version: '19.1'}
    decision_ref: DEC-TA0008-T1570
    reuse_decision_key: B4-T1105-DECISION
    lineage_note:
      zh: 规范 origin 保留最初建立父级的 T1570；独立 T1105 决策复用同一 NJT，与已有多候选映射先例一致。
      en: Canonical origin retains T1570, which established the parent first; an independent T1105 decision reuses the same NJT, consistent with existing multiple-candidate mappings.
  definition_and_concept:
    paragraphs:
      - zh: >-
          工具或文件传输到达是攻击者在已取得目标控制之后，使扫描器、脚本、模块、载荷、配置或其他操作文件从另一系统实际写入该目标的行为。来源可以是攻击者外部基础设施、既有 C2、合法服务资源或受害环境内另一主机。技术完成点是目标上独立文件对象的可验证创建或修改，必须能指认来源关系、目标设备和内容、大小、摘要或其他等价谱系；网络请求、传输命令、远程会话和后继执行都不能单独替代到达。
        en: >-
          Tool or File Transfer Arrival occurs after the adversary controls a destination and causes a scanner, script, module, payload, configuration, or other operational file to be written there from another system. The source may be outside attacker infrastructure, an existing C2 relationship, a legitimate service resource, or another host inside the victim environment. Completion is verifiable creation or modification of an independent file object on the destination, with an identifiable source relationship, destination device, and content, size, digest, or equivalent lineage. A network request, transfer command, remote session, or later execution does not independently substitute for arrival.
      - zh: >-
          在 Niji 中，文件到达是行为锚点，匿迹结论还要求攻击者选择的客户端、来源、通道或落点改变防守方对投递来源或授权性的判断。内部分支可让目标只见熟悉共享和内部源；外部分支可经 BITS、curl、certutil、浏览器、同步客户端、包管理器或既有控制会话产生普通下载/缓存写入外观。工具与协议是实现，不形成子项；若来源和写入均明显异常，仍可记录父行为，但不能夸大匿迹效果。
        en: >-
          Within Niji, file arrival anchors the behavior, while a stealth conclusion additionally requires an attacker-chosen client, source, channel, or destination placement to change defender judgment of delivery provenance or authorization. The internal branch can leave a destination seeing a familiar share and internal source. The external branch can create ordinary download or cache-write appearance through BITS, curl, certutil, a browser, a sync client, a package manager, or an existing control session. Tools and protocols are implementations and do not define children. If source and write are conspicuously anomalous, the parent behavior still applies but its stealth effect must not be overstated.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          共同的匿迹属性是目标侧文件创建可继承传输主体的正常角色，而不直接显示最初操作者。内部复制呈现为管理员/共享写入；外部下载可由签名系统工具、后台传输服务、常见浏览器或获准更新路径写入临时、缓存或应用目录。单点若只按 writer 签名、内部地址、知名域或正常下载目录判断，可能将恶意到达解释为运维或软件获取。该效果需要实际角色与环境基线验证，不能由工具签名或端口自动推出。
        en: >-
          The shared stealth property is that destination file creation can inherit the ordinary role of a transfer principal without directly exposing the original operator. Internal copying looks like administration or share writing. External retrieval may be written by a signed system utility, background-transfer service, common browser, or approved update path into temporary, cache, or application directories. A local view using only writer signature, internal address, known domain, or normal download directory can interpret malicious arrival as operations or software acquisition. This effect requires real role and environmental baseline validation and cannot be inferred from tool signature or port alone.
      - zh: >-
          到达仍留下可连接的残迹。外部分支可从端点 network event、代理/HTTP response、Zeek uid/fuid、FileOriginUrl/IP/Referrer、initiating process、文件大小与摘要恢复；内部分支保留共享请求、登录、路径、摘要和源—目标关系。后继执行、模块加载或安全产品命中提高优先级但不证明先前未观测传输。TLS、内存直送、内容分块、缓存/同步代写和缺失摘要会降低谱系置信。
        en: >-
          Arrival still leaves joinable residue. The external branch can be reconstructed from endpoint network events, proxy or HTTP responses, Zeek uid and fuid, FileOriginUrl, IP, and Referrer, initiating process, file size, and digest. The internal branch retains share requests, logons, paths, digests, and source-to-destination relationships. Later execution, module load, or security-product detection raises priority but does not prove an earlier unobserved transfer. TLS, direct memory streaming, content chunking, cache or sync delegated writes, and missing digests lower lineage confidence.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入外部来源到已受控目标和受害环境内跨主机的独立文件实际到达；同一 NJT 用 source_boundary 标记 ingress_external 或 lateral_internal，并分别调用防御分支。一次 Web 下载只要目标文件到达得到确认即可满足父项，它不需要持续 C2，也不能单独证明 T1071 应用会话。只有 GET、curl/wget/certutil 命令、代理响应或远端文件存在而没有目标创建证据时保持 attempted_transfer，不完成本技术。直接把网络字节流送入解释器且没有独立文件对象也在本范围外。
        en: >-
          Scope includes actual independent-file arrival from an outside source onto an already controlled destination and cross-host arrival inside a victim environment. The same NJT records source_boundary as ingress_external or lateral_internal and invokes separate defense branches. A one-time Web download qualifies when destination file arrival is confirmed; it does not require sustained C2 and does not independently establish a T1071 application session. A GET, curl, wget, or certutil command, proxy response, or remote file existence without destination creation remains attempted_transfer and does not complete the technique. Streaming network bytes directly into an interpreter without an independent file object is also outside this scope.
      - zh: >-
          T1071 负责真实应用协议事务维持控制，T1105 只负责其中某个工具/文件物化到目标；二者可并列。T1102 负责合法外部服务的 account/object 参与控制，若从该 object 下载文件并落地可与本项并列。T1132 负责 C2 数据可逆表示，编码文件的到达和随后解码是两个相邻事实，不按编码算法建本项子技术。T1104 负责通道按阶段/功能分工，每个阶段组件的到达可记录 T1105，但多个组件或先后下载不能自动证明多阶段通道。
        en: >-
          T1071 owns real application-protocol transactions that sustain control, while T1105 owns materialization of a particular tool or file on the destination; both may coexist. T1102 owns an account or object of a legitimate outside service participating in control, and a file downloaded from that object may co-classify here when it lands. T1132 owns reversible C2 data representation; arrival of an encoded file and later decoding are adjacent facts and do not create children by encoding algorithm. T1104 owns channels divided by stage or function. Arrival of each stage component can receive T1105, but several components or sequential downloads do not automatically prove multi-stage channels.
      - zh: >-
          T1072/NJT-0078 由企业部署 job→agent→首次执行事务定义；文件只到达 agent cache 而未执行时由本项承担，到达并被受管 agent 执行时可并列。初次钓鱼附件、供应链包或 drive-by 文件若发生在取得控制之前，应由初始访问/用户执行/供应链对象判断，不能因为文件存在就倒推 T1105。文件编码、伪装名称、隐藏路径和下载后执行各有相邻技术，均不改变到达结果门。
        en: >-
          T1072 and NJT-0078 are defined by an enterprise deployment job-to-agent-to-first-execution transaction. A file only arriving in an agent cache belongs here; arrival followed by managed-agent execution may co-classify. An initial phishing attachment, supply-chain package, or drive-by file before control is established is judged under Initial Access, User Execution, or Supply Chain objects and cannot be backfilled as T1105 merely because the file exists. Encoding, a disguised name, hidden placement, and post-download execution have adjacent techniques and do not change the arrival outcome gate.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            已受控主机需要新增载荷时，攻击者可用现有 C2 指令调用 curl、certutil、PowerShell 或 BITS，从外部 Web/C2 下载工具。sLoad 创建 BITS job 下载编码文件、复制并以 certutil 解码为 PE；BazaCall 通过重命名 certutil 下载 BazaLoader；Mandiant 观察两条 UNC2975 投递链用重命名 curl 把 MSI 或 AutoIt 组件写入临时目录并执行。这些案例直接支持外部响应、目标文件和后继动作。
          en: >-
            When an already controlled host needs another payload, an actor may use existing C2 tasking to invoke curl, certutil, PowerShell, or BITS and retrieve a tool from outside Web or C2 infrastructure. sLoad creates BITS jobs to download an encoded file, copies it, and decodes it into a PE with certutil. BazaCall uses renamed certutil to download BazaLoader. Mandiant observed two UNC2975 delivery chains using renamed curl to write MSI or AutoIt components into a temporary directory and execute them. These cases directly support external response, destination file, and successor action.
        - zh: >-
            已取得内部源后，攻击者也可把同一类工具复制到其他主机。SAFEPAY 经 SMB 在多目标暂存 NETSCAN，LOCKBIT.WARLOCK 从域控制器向多主机复制批处理文件。内部与外部分支都以目标到达为完成点，但前者需共享/登录/跨主机证据，后者需远端请求/响应/写入进程证据。一个行动可先从外部把工具送入首台主机，再横向复制；若内容谱系可连，应记录同一父级的两个 source_boundary 实例。
          en: >-
            After obtaining an internal source, an actor can copy the same kinds of tools to other hosts. SAFEPAY staged NETSCAN on multiple destinations over SMB, and LOCKBIT.WARLOCK copied a batch file from a domain controller to many hosts. Both internal and external branches complete at destination arrival, but the former needs share, logon, and cross-host evidence while the latter needs remote request, response, and writer-process evidence. One operation may first bring a tool from outside to one host and later copy it laterally. Where content lineage joins, record two source_boundary instances under the same parent.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要已控制目标或可使其发起/接受传输的会话，拥有可达源和写入权限，并理解代理、DNS、认证、路径、空间、内容过滤与终端安全限制。外部入站可借已安装客户端或 C2 writer，内部传输需可写共享/文件服务。使用 BITS、curl、同步或包管理降低新工具需求，却产生 job、命令行、URL、缓存和文件元数据；改变摘要、分块或延迟写入增加维护成本且仍需最终物化对象。
            en: >-
              The actor needs an already controlled destination or a session able to initiate or accept transfer, a reachable source, and write authority, plus knowledge of proxy, DNS, authentication, path, space, content-filtering, and endpoint-security constraints. External ingress can use an installed client or C2 writer; internal transfer needs a writable share or file service. BITS, curl, sync, or package management reduces new tooling but creates jobs, command lines, URLs, cache, and file metadata. Digest changes, chunking, or delayed writes add operational cost and still require a final materialized object.
      defender_model:
        paragraphs:
          - zh: >-
              外部分支假定至少有端点 network/file telemetry，理想情况下还有代理/HTTP 请求响应和网络文件标识；内部分支使用共享/登录/目标文件事件。稳定字段包括 device、process start、user、remote URL/IP、HTTP uid/fuid、response bytes、FileOriginUrl/IP/Referrer、path、size、digest、source boundary 和 approval。分析必须先证明到达，再评价来源、writer、目录、内容和批准范围；request_only、response_observed 与 arrival_confirmed 分级输出。
            en: >-
              The external branch assumes at least endpoint network and file telemetry, ideally with proxy or HTTP request-response and network-file identifiers. The internal branch uses share, logon, and destination-file events. Stable fields include device, process start, user, remote URL or IP, HTTP uid and fuid, response bytes, FileOriginUrl, IP, and Referrer, path, size, digest, source boundary, and approval. Analysis proves arrival first and then evaluates source, writer, directory, content, and approved scope, emitting request_only, response_observed, and arrival_confirmed separately.
          - zh: >-
              TLS 不解密、端点不采 FileOrigin、直接 socket writer、后台服务与调用进程分离、缓存/同步代写、文件快速删除、摘要缺失和跨传感器时钟偏差都会断开关联。合法浏览器下载、软件更新、包安装、备份还原、应急响应和管理员取证会产生同形序列；正向清单必须同时限定主体、进程、来源、内容/签名、目标路径和时间，不能永久放行 curl、BITS、浏览器或知名 CDN。
            en: >-
              Opaque TLS, absent endpoint file-origin data, direct socket writers, separation between background service and caller, cache or sync delegated writes, rapid deletion, missing digests, and sensor clock skew break correlation. Legitimate browser downloads, software updates, package installs, backup restore, emergency response, and administrator forensics create the same shape. Positive allowlists must jointly constrain principal, process, source, content or signature, destination path, and time rather than permanently allow curl, BITS, browsers, or a known CDN.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: 常见传输客户端来源或路径替代恶意文件到达的显著来源特征, en: A familiar transfer client source or path substitutes for conspicuous provenance of malicious file arrival}
      analysis:
        paragraphs:
          - zh: >-
              攻击者让正常共享、签名下载工具、后台传输服务、浏览器或获准服务路径写入恶意文件，目标侧痕迹先显示熟悉 source/writer/path，而非最初操作者。单点规则若把该外观当成授权，会降低恶意到达的可区分性，形成特征伪装。sLoad BITS、BazaCall certutil、UNC2975 curl 和 NJT-0130 内部 SMB 案例证明这些写入链存在；来源没有量化所有环境的规避率，故父级置信度 medium。网络响应—writer—file—approval 关联可恢复差异。
            en: >-
              The actor has an ordinary share, signed downloader, background-transfer service, browser, or allowed service path write the malicious file, leaving a familiar source, writer, or path at the destination rather than the original operator. A local rule that treats this appearance as authorization reduces distinguishability of malicious arrival and creates Feature Disguise. sLoad BITS, BazaCall certutil, UNC2975 curl, and NJT-0130 internal SMB cases establish these write chains. Sources do not measure evasion rates across all environments, so parent confidence is medium. Network-response-to-writer-to-file-to-approval correlation restores the difference.
      evidence_keys: [REF-000139, REF-000084, B4-T1105-REF-MICROSOFT-BAZACALL, REF-000473]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            已完成零子项开放搜索。内部/外部来源边界改变数据源但不改变到达对象，也没有稳定匿迹差，作为 source_boundary 字段和独立 Analytic 分支。BITS、curl、certutil、浏览器、同步客户端、包管理器、SMB、FTP 与文件类型是实现；按产品/协议/文件类别拆分会复制 ATT&CK 例表而非 Niji 变量。
          en: >-
            A zero-child open search is complete. Internal versus external source boundary changes data sources but not the arrival object and has no stable stealth differential, so it is recorded as source_boundary with separate Analytic branches. BITS, curl, certutil, browsers, sync clients, package managers, SMB, FTP, and file types are implementations. Partitioning by product, protocol, or file category would copy procedure lists rather than define Niji variables.
        - zh: >-
            “受信客户端代写”可能产生来源翻译，但当前证据主要绑定 BITS/同步产品，并与 NJT-0078 的 agent 代理、TA0005 的可见身份替代及父级机理重叠，暂不建项。“分块/低慢下载”“下载后延时执行”缺少结论级攻击者选择证据；落点名称/隐藏路径属于伪装或隐藏；内存直送没有独立文件到达。以上分别 defer、adjacent 或 exclude，父级先使用两种到达防御。
          en: >-
            Trusted-client delegated writing may translate provenance, but current evidence is mainly product-bound to BITS or sync and overlaps NJT-0078 agent brokerage, TA0005 visible-identity substitution, and the parent mechanism, so no child is established. Chunked or low-and-slow download and delayed post-download execution lack conclusion-level evidence of attacker choice. Placement name or hidden path belongs to masquerading or hiding, while memory-only streaming lacks independent file arrival. These candidates are deferred, adjacent, or excluded, and the parent uses two arrival-defense branches.
    coverage: deferred
    temporary_subtechnique_keys: []
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
    - temporary_key: B4-T1105-DET-EXTERNAL-ARRIVAL
      name: {zh: 外部来源响应—目标文件到达谱系, en: External Source Response to Destination File Arrival Lineage}
      objective:
        zh: 将外部请求与响应、发起进程、网络文件标识、目标文件创建和批准下载范围连接，确认入站工具/文件实际到达并区分异常 provenance。
        en: Join external requests and responses, initiating process, network file identity, destination file creation, and approved-download scope to confirm actual ingress arrival and distinguish abnormal provenance.
      subjects: [NJT-0130]
      domains: [enterprise]
      analytic_keys: [B4-T1105-NJA-EXTERNAL-ARRIVAL]
      candidate_resolution: create
      reuse_notes:
        zh: DET-000139/NJA-000143 继续覆盖 lateral_internal SMB 分支；其 5145/4624/共享路径逻辑不能扩展成 external ingress。新 Strategy 与既有 Strategy 可同时被 NJT-0130 引用。
        en: DET-000139 and NJA-000143 continue to cover the lateral_internal SMB branch. Their 5145, 4624, and share-path logic cannot be stretched into external ingress. The new Strategy and existing Strategy can both be referenced by NJT-0130.
  detection_analytics:
    - temporary_key: B4-T1105-NJA-EXTERNAL-ARRIVAL
      name: {zh: 外部网络响应与目标文件创建关联分析, en: External Network Response and Destination File Creation Correlation Analytic}
      purpose:
        zh: 分别输出 request_only、response_observed、arrival_confirmed 与 arrival_executed，避免从下载命令或网络流量倒推未证实文件到达。
        en: Emit request_only, response_observed, arrival_confirmed, and arrival_executed separately, avoiding inference of unverified file arrival from a download command or network flow.
      raw_to_normalized_fields:
        - source: endpoint-network
          channel: Microsoft Defender XDR DeviceNetworkEvents or Sysmon Event 3
          raw_fields: [Timestamp, DeviceId, ActionType, RemoteIP, RemotePort, RemoteUrl, LocalIP, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName]
          normalized_fields: [event_time, device_id, network_action, remote_ip, remote_port, remote_url, local_ip, transport, process_start_key, process_image, command_line, principal_id]
        - source: http-transaction
          channel: Zeek http.log or inspectable proxy
          raw_fields: [ts, uid, id.orig_h, id.resp_h, method, host, uri, user_agent, request_body_len, response_body_len, status_code, resp_fuids, resp_mime_types]
          normalized_fields: [event_time, network_session_id, client_ip, server_ip, request_method, remote_host, request_path, client_fingerprint, request_bytes, response_bytes, response_status, network_file_ids, response_types]
        - source: network-file
          channel: Zeek files.log or proxy extraction
          raw_fields: [ts, fuid, uid, source, mime_type, seen_bytes, total_bytes, missing_bytes, extracted, extracted_cutoff, sha1, sha256]
          normalized_fields: [event_time, network_file_id, network_session_id, transfer_protocol, detected_type, observed_bytes, expected_bytes, missing_bytes, extracted_name, extraction_complete, network_sha1, network_sha256]
        - source: endpoint-file
          channel: Microsoft Defender XDR DeviceFileEvents
          raw_fields: [Timestamp, DeviceId, ActionType, FileName, FolderPath, SHA1, SHA256, FileOriginUrl, FileOriginReferrerUrl, FileOriginIP, FileSize, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine, RequestProtocol, RequestSourceIP]
          normalized_fields: [event_time, device_id, file_action, file_name, file_path, file_sha1, file_sha256, origin_url, referrer_url, origin_ip, file_size, process_start_key, writer_image, writer_command_line, request_protocol, request_source_ip]
        - source: approved-ingress-record
          channel: software catalog, update policy, package repository, change management, and incident-response approvals
          raw_fields: [approval_id, principal_id, device_role, allowed_process, source_url_or_owner, artifact_hash_or_signer, destination_path, valid_from, valid_to, purpose, policy_version]
          normalized_fields: [approval_id, approved_principal, device_role, approved_writer, approved_source, approved_artifact, approved_path, valid_from, valid_to, approved_purpose, policy_version]
      logic:
        zh: >-
          先按 device/process_start_key 将 outbound request 和成功 response 连接；有 Zeek/proxy file extraction 时以 uid→fuid 获取响应对象、大小和摘要。随后在默认五分钟内寻找同一 process_start_key 写入的 DeviceFileEvents，优先用 FileOriginUrl/IP、network SHA1/SHA256、size 与路径确认；若后台服务代写，则通过 origin URL、job/request ID、父进程或文件元数据建立弱连接并降置信。只有目标创建/修改得到证实才输出 arrival_confirmed；后续启动、模块载入或恶意内容命中只提升 priority。再与批准记录比较 source、writer、artifact、path 和 time，形成 authorized_arrival 或 anomalous_arrival。
        en: >-
          First join an outbound request and successful response by device and process_start_key. Where Zeek or proxy file extraction exists, use uid to fuid to obtain response object, size, and digest. Then seek DeviceFileEvents written by the same process_start_key within a default five minutes, preferring FileOriginUrl or IP, network SHA1 or SHA256, size, and path for confirmation. Where a background service performs the write, use origin URL, job or request ID, parent process, or file metadata as a weaker join and reduce confidence. Emit arrival_confirmed only after destination create or modification is established; later launch, module load, or malicious-content detection only raises priority. Compare source, writer, artifact, path, and time with the approved record to produce authorized_arrival or anomalous_arrival.
      correlation:
        window: 5 minutes request/response-to-file by default; 24 hours for background jobs, sync clients, and later execution
        dimensions: [device_id, process_start_key, network_session_id, network_file_id, remote_url, origin_ip, file_path, file_size, file_sha1, file_sha256, approval_id, time]
      observables:
        - uncommon or role-inconsistent process receives external bytes and writes an independent file
        - network fuid hash or size matches a destination file
        - signed transfer utility writes an unapproved artifact or path from an unapproved source
        - file origin URL or IP maps to the preceding connection and later execution
      false_positives: [browser and email downloads, software updates, package managers, CI/CD artifacts, security-tool and IR downloads, backup restore, cloud sync, administrator troubleshooting]
      blind_spots: [opaque TLS without endpoint origin fields, direct memory streaming, service process writes on behalf of caller, missing file hashes, range/chunked downloads, cache rename, sync delay, rapid deletion, clock skew]
      tuning_guidance:
        zh: 按设备角色分别维护浏览器、更新器、包管理器、BITS/同步客户端和管理脚本的 source/writer/path/artifact 清单。curl、certutil、BITS、签名、知名 CDN 或临时目录都不能永久放行或单独告警。FileOrigin 字段或 network hash 缺失时，以 process/time/URL/size 关联但降低置信；一个 request 或 200 response 不得升级为 arrival。
        en: Maintain source, writer, path, and artifact allowlists by device role separately for browsers, updaters, package managers, BITS or sync clients, and administration scripts. Curl, certutil, BITS, a signature, known CDN, or temporary directory must never be permanently allowed or alerted on alone. When FileOrigin or network hash is missing, correlate by process, time, URL, and size at lower confidence. A request or 200 response must not be promoted to arrival.
      evidence_keys: [REF-000084, REF-000139, B4-T1105-REF-MICROSOFT-BAZACALL, REF-000604, REF-000924, REF-000632, REF-000633, REF-000230]
      confidence: high
  mitigations:
    - temporary_key: B4-T1105-MIT-EXTERNAL-INGRESS
      name: {zh: 外部工具入站路径与制品治理, en: External Tool Ingress Path and Artifact Governance}
      candidate_resolution: create
      description:
        zh: 对外部文件取得按设备角色限定来源、客户端、内容和落点，先经受管检查/隔离并保留网络到文件谱系；与 MIT-000127 的内部共享治理共同覆盖复用后的 NJT-0130。
        en: Bound external file acquisition by device role, source, client, content, and destination, route it through managed inspection or quarantine, and retain network-to-file lineage. Together with MIT-000127 internal-share governance, this covers reused NJT-0130.
      measures:
        - key: role-bound-external-retrieval
          name: {zh: 按角色限定外部文件取得, en: Role-Bound External File Retrieval}
          control_type: preventive
          implementation:
            zh: 服务器、工作站、网络设备与 ESXi 分别定义可用浏览器/下载器/包管理器、代理、源域/仓库、认证身份和目标路径；默认阻断未知直连与个人云同步，紧急例外有 owner、目的和到期。
            en: Define permitted browsers, downloaders, package managers, proxies, source domains or repositories, authentication identities, and destination paths separately for servers, workstations, network devices, and ESXi. Deny unknown direct retrieval and personal cloud sync by default, with owner, purpose, and expiry on emergency exceptions.
        - key: ingress-artifact-verification-quarantine
          name: {zh: 入站制品校验与隔离, en: Ingress Artifact Verification and Quarantine}
          control_type: preventive
          implementation:
            zh: 对取得文件保存来源、签名/发布者、摘要、大小和批准记录，在执行前进行内容检查、沙箱或隔离；未知/不匹配制品不得因 writer 签名或来源域知名而放行。
            en: Retain source, signature or publisher, digest, size, and approval for acquired files and perform content inspection, sandboxing, or quarantine before execution. Unknown or mismatched artifacts are not allowed because the writer is signed or source domain is well known.
        - key: network-to-file-lineage-retention
          name: {zh: 网络响应到文件谱系保留, en: Network Response to File Lineage Retention}
          control_type: detective-support
          implementation:
            zh: 保留 endpoint process/network、代理 request/response、network file ID/hash、FileOrigin 和 file create/delete，并同步时钟；后台 job/sync 记录 caller、job、最终 writer 和目标对象。
            en: Retain endpoint process and network, proxy request and response, network file ID and hash, FileOrigin, and file create and delete with synchronized clocks. Background jobs and sync record caller, job, final writer, and destination object.
        - key: post-arrival-execution-control
          name: {zh: 到达后执行控制, en: Post-Arrival Execution Control}
          control_type: containment
          implementation:
            zh: 对用户/临时/缓存/新下载路径应用应用控制、脚本策略和最低权限，在完成来源与内容验证前阻止新文件执行或载入。
            en: Apply application control, script policy, and least privilege to user, temporary, cache, and newly downloaded paths, preventing execution or load until source and content validation completes.
      applications:
        - target_ref: NJT-0130
          scope: TA0011 ingress_external branch
          use:
            zh: 对 external ingress 强制经受管代理/仓库取得、登记 source/writer/artifact/path 并在文件到达后执行前隔离；内部 lateral 分支继续使用 MIT-000127。
            en: For external ingress, require managed proxy or repository retrieval, register source, writer, artifact, and path, and quarantine after arrival and before execution. The internal lateral branch continues to use MIT-000127.
          expected_effect:
            zh: 攻击者难以从任意外部端点把未知文件直接送入受控主机；已到达文件保留可审查来源并在执行前提供处置窗口。
            en: The actor has greater difficulty bringing an unknown file directly from any outside endpoint into a controlled host. Landed files retain reviewable provenance and create a response window before execution.
          limitations:
            zh: 被攻陷批准仓库、内存直送、合法签名恶意包、加密内容和无法代理的网络设备通道仍可绕过；严格下载控制可能影响更新、构建与事件响应。
            en: Compromised approved repositories, memory-only streaming, malicious legitimately signed packages, encrypted content, and network-device channels that cannot be proxied can bypass controls. Strict retrieval policy may disrupt updates, builds, and incident response.
      evidence_keys: [REF-000084, REF-000139, B4-T1105-REF-MICROSOFT-BAZACALL, REF-000924, REF-000632, REF-000633]
