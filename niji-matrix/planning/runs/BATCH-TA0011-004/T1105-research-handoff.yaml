  claims:
    - temporary_key: B4-T1105-CLM-REUSE
      statement:
        zh: T1570 与 T1105 的直接完成点都是攻击者控制的独立文件在已受控目标上可验证到达；内部/外部来源决定防御分支而非不同父行为，因此 T1105 应独立准入后扩展 NJT-0130。
        en: T1570 and T1105 share the direct completion point of verifiable arrival of an adversary-controlled independent file on an already controlled destination. Internal versus external source determines a defense branch rather than a different parent behavior, so T1105 should independently admit and extend NJT-0130.
      evidence_keys: [REF-000625, REF-000472, REF-000084, REF-000139, B4-T1105-REF-MICROSOFT-BAZACALL]
      confidence: high
    - temporary_key: B4-T1105-CLM-ARRIVAL-GATE
      statement:
        zh: 下载命令、网络请求、成功响应或远端对象存在不能单独证明 T1105；必须见目标文件创建/修改或网络提取对象与目标对象的等价谱系。
        en: A download command, network request, successful response, or remote object existence does not independently establish T1105; destination file creation or modification, or equivalent lineage between a network-extracted object and destination object, is required.
      evidence_keys: [REF-000632, REF-000633, REF-000924, REF-000475]
      confidence: high
    - temporary_key: B4-T1105-CLM-EXTERNAL-OBSERVATION
      statement:
        zh: 外部入站检测需连接 remote request/response、writer process 和 destination file；FileOrigin 与 uid/fuid/hash 可提供强关联，缺失时必须降低置信。
        en: External ingress detection needs a join among remote request or response, writer process, and destination file. FileOrigin plus uid, fuid, and hash can provide strong linkage, and confidence must fall when they are absent.
      evidence_keys: [REF-000604, REF-000924, REF-000632, REF-000633, REF-000230]
      confidence: high
    - temporary_key: B4-T1105-CLM-TAXONOMY
      statement:
        zh: 当前证据不支持按内部/外部来源、传输工具、协议、文件类型、落点或分块/时序建立 T1105 NJS；这些分别是父级上下文、实现、相邻技术或待证假设。
        en: Current evidence does not support T1105 NJS partitioning by internal or external source, transfer tool, protocol, file type, placement, or chunking and timing. They are parent context, implementations, adjacent techniques, or unproven hypotheses.
      evidence_keys: [REF-000625, REF-000084, REF-000139, REF-000473]
      confidence: medium
  cases:
    - temporary_key: B4-T1105-CASE-WHOOP-ADS
      name: {zh: UNC2975 重命名 curl 下载 MSI 与 AutoIt 组件, en: UNC2975 Renamed curl Downloads MSI and AutoIt Components}
      actor_or_campaign: UNC2975 malvertising campaign
      central_facts:
        zh: Mandiant 观察两条投递链复制/重命名系统 curl，并把 MSI 或 AutoIt executable/script 下载到用户临时目录，随后分别由 msiexec 或 AutoIt 执行。该案例提供 writer、URL、目标路径和后继执行，不证明受害在下载前已完全受控，因此只用于传输/防御链，不单独锚定 post-compromise 边界。
        en: Mandiant observed two delivery chains copying or renaming system curl and downloading MSI or AutoIt executable and script files into a user temporary directory before execution by msiexec or AutoIt. The case provides writer, URL, destination path, and successor execution, but does not independently establish that the victim was fully controlled before download, so it supports transfer and defense mechanics rather than the post-compromise boundary alone.
      evidence_keys: [REF-000084]
      confidence: high
    - temporary_key: B4-T1105-CASE-SLOAD-BITS
      name: {zh: sLoad BITS 编码载荷下载与落地恢复, en: sLoad BITS Encoded Payload Download and On-Disk Recovery}
      actor_or_campaign: sLoad downloader activity
      central_facts:
        zh: Microsoft 记录 sLoad 创建 BITS job 下载载荷，把新下载编码文件复制后用 certutil 解码为 PE，并运行或继续下载其他文件。案例直接支持后台响应、目标文件和后继恢复/执行；编码由相邻 T1132/内容表示对象判断。
        en: Microsoft records sLoad creating BITS jobs to download a payload, copying the newly downloaded encoded file, decoding it into a PE with certutil, and executing or downloading more files. The case directly supports background response, destination file, and successor recovery or execution; encoding is separately judged under T1132 or content-representation objects.
      evidence_keys: [REF-000139]
      confidence: high
    - temporary_key: B4-T1105-CASE-BAZACALL
      name: {zh: BazaCall 重命名 certutil 下载 BazaLoader, en: BazaCall Renamed certutil Downloads BazaLoader}
      actor_or_campaign: BazaCall / BazaLoader campaign
      central_facts:
        zh: Microsoft 观察宏将 certutil 复制并重命名，再连接攻击者基础设施下载 BazaLoader；案例证明受信系统工具成为 writer，但不能从签名本身推断授权或匿迹成功。
        en: Microsoft observed a macro copying and renaming certutil before connecting to attacker infrastructure to download BazaLoader. The case establishes a trusted system utility as writer but does not make its signature proof of authorization or successful stealth.
      evidence_keys: [B4-T1105-REF-MICROSOFT-BAZACALL]
