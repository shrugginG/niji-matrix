research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [parent has no fixed-baseline ATT&CK children]
    breadth_trigger: ordinary-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: internal-versus-external-source-boundary
        resolution: parent-core
        reason: Changes sensors and tactic context but not file-arrival behavior or a stable stealth effect.
      - axis: trusted-client-or-background-service-delegated-write
        resolution: evidence-deferred
        reason: Strong BITS evidence exists, but the generalization overlaps the parent mechanism and NJT-0078 or TA0005 provenance objects and is product-bound beyond BITS.
      - axis: chunked-or-time-spaced-download
        resolution: evidence-deferred
        reason: No reviewed incident directly proves attacker-selected chunking or timing as an independent detection-evasion variable with distinct defense.
      - axis: destination-path-or-file-type
        resolution: adjacent-technique
        reason: Placement camouflage or hiding belongs to masquerading or hide-artifact objects; path and file type alone are not stable children.
      - axis: protocol-or-transfer-tool
        resolution: not-stealth-distinct
        reason: HTTP FTP SMB BITS curl certutil wget sync and package managers are implementations, not taxonomy variables.
      - axis: memory-only-stream
        resolution: not-stealth-distinct
        reason: No independent destination file object arrives, so it fails the parent result gate and belongs to execution or in-memory objects.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子项未停止开放搜索；六条候选轴分别按结果门、相邻所有权、证据与防御差异收敛为父级、defer、adjacent 或排除。正式父级复用 NJT-0130，不新建 NJT/NJS；来源边界通过事件字段与双防御分支表达。
      en: Zero ATT&CK children did not stop the open search. Six candidate axes converged to parent, deferred, adjacent, or excluded based on result gate, adjacent ownership, evidence, and defense difference. The formal parent reuses NJT-0130 without a new NJT or NJS, while source boundary is represented by event fields and two defense branches.
  evidence_coverage:
    parent_behavior_keys: [REF-000625, REF-000472, REF-000084, REF-000139, B4-T1105-REF-MICROSOFT-BAZACALL, REF-000473]
    boundary_keys: [REF-000625, REF-000472, REF-000632, REF-000633, REF-000924, REF-000139]
    mechanism_support:
      - mechanism: NM-FD
        evidence_keys: [REF-000084, REF-000139, B4-T1105-REF-MICROSOFT-BAZACALL, REF-000473]
    child_existence_support: []
    unsupported_or_deferred:
      - request or command treated as successful arrival without target file evidence
      - signed transfer utility treated as authorization or proof of evasion
      - later execution used to backfill an unobserved transfer
      - direct memory streaming forced into independent-file arrival
      - protocol tool file type or path used as NJS
      - low-and-slow chunking asserted without conclusion-level incident evidence
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 泛化父级覆盖统一到达定义、来源边界、条件性匿迹、内部/外部残迹、范围与正常反例、六项相邻边界、双场景、攻防模型、机理、零子项收敛和不同防御分支。
      en: The generalized parent covers the unified arrival definition, source boundary, conditional stealth, internal and external residue, scope and normal counterexamples, six adjacent boundaries, both scenarios, attacker and defender models, mechanism, zero-child convergence, and distinct defense branches.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML syntax validation, temporary-reference closure validation, canonical-reference resolution]
  limitations:
    paragraphs:
      - zh: >-
          三个外部案例证明不同 writer 的文件到达链，但操作阶段不完全相同。sLoad 是已运行 downloader 的后续载荷，最直接支持 post-compromise T1105；BazaCall 和 UNC2975 下载处于交付/执行链较早位置，主要支持响应—文件—后继事件和受信 writer 的防御模型，不能单独证明每个下载前已建立控制。NJT-0130 内部案例则不支持外部字段。正式父级应组合而不混淆这些结论层级。
        en: >-
          The three external cases establish file-arrival chains with different writers but occur at different operational phases. sLoad is a later payload fetched by an already running downloader and most directly supports post-compromise T1105. BazaCall and UNC2975 downloads occur earlier in delivery or execution chains and mainly support response-to-file-to-successor telemetry and the trusted-writer defense model; they do not independently prove established control before every download. NJT-0130 internal cases do not support external fields. The formal parent should combine rather than conflate these conclusion levels.
      - zh: >-
          DeviceFileEvents 的 FileOrigin 与摘要、Zeek 的 fuid/extraction 以及 DeviceNetworkEvents 的 process/URL 均取决于部署；SHA256 常为空，TLS 会使 http.log 不可用，后台服务可能把 caller 与 writer 分离，文件也可能在记录前删除。五分钟与二十四小时是工程起点，没有来源提供通用灵敏度、误报率或阈值。缺少目标创建时只能保持 attempted/partial，不得因 malicious URL 或执行告警升级为 confirmed arrival。
        en: >-
          DeviceFileEvents FileOrigin and hashes, Zeek fuid and extraction, and DeviceNetworkEvents process and URL depend on deployment. SHA256 is often absent, TLS can remove http.log visibility, background services can separate caller from writer, and files may be deleted before recording. Five minutes and twenty-four hours are engineering starting points with no universal sensitivity, false-positive rate, or threshold supplied by sources. Without destination creation, conclusions remain attempted or partial and must not become confirmed arrival because of a malicious URL or execution alert.
      - zh: >-
          跨战术复用要求主 Agent 重写 NJT-0130 的名称、definition、scope、scenario、defender model、taxonomy narrative、evidence 和 limitations，并新增 TA0011 decision；只把 tactic_ref 加进去而保留“initial download excluded”的旧正文会自相矛盾。现有 DET/MIT 保持内部语义，新对象覆盖外部，不得互相夸大覆盖。
        en: >-
          Cross-tactic reuse requires the primary agent to revise NJT-0130 name, definition, scope, scenarios, defender model, taxonomy narrative, evidence, and limitations and add an independent TA0011 decision. Adding a tactic_ref while leaving old text that excludes initial external download would be contradictory. Existing DET and MIT retain internal semantics and new objects cover external ingress without overstating each other's coverage.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 文件传输不必改变内容表示；编码、加密、压缩或隐写由 T1132、T1573、NJT-0115/NJT-0152 等相邻对象证明。
        en: File transfer need not change content representation; encoding, encryption, compression, or steganography is established by adjacent objects such as T1132, T1573, NJT-0115, and NJT-0152.
    - mechanism_ref: NM-ST
      reason:
        zh: 多目标 fan-out、分块或时间间隔可能分散痕迹，但当前 T1105 外部来源没有足够结论级证据证明其作为独立普遍机理；内部 fan-out 已在其他对象中条件讨论。
        en: Multi-target fan-out, chunking, or timing gaps may distribute traces, but current external T1105 sources lack conclusion-level evidence for an independent general mechanism; internal fan-out is conditionally discussed elsewhere.
    - mechanism_ref: NM-BT
      reason:
        zh: BITS/同步客户端可改变观察主体，但证据仍绑定实现并与 agent/utility 代理对象重叠，暂不提升为父级机理。
        en: BITS or sync clients can change the visible principal, but evidence remains implementation-bound and overlaps agent or utility brokerage objects, so it is not promoted to a parent mechanism.
  open_questions:
    - 主 Agent确认是否接受跨不同 ATT&CK IDs 的 NJT-0130 扩展；矩阵已有 NJT-0077/NJT-0113 多候选映射先例。
    - REF-000084 现有 locator/notes 只记录 cloaking；正式用于 T1105 时需扩展到 renamed curl、MSI/AutoIt target files 和 successor execution，不重复 URL。
    - REF-000625 locator 需扩展 T1105 固定 19.1 父行为；不新建同一 STIX URL。
    - 若未来取得跨 BITS/sync/package-manager 的独立来源，重新审查 trusted transfer-client delegated write 是否能脱离父机制和相邻 NJT-0078 成为 NJS。
