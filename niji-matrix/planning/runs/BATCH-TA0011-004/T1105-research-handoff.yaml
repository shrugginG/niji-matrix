      title: {zh: BazaCall 虚假呼叫中心到勒索攻击链, en: 'BazaCall: Phony Call Centers Lead to Exfiltration and Ransomware'}
      url: https://www.microsoft.com/en-us/security/blog/2021/07/29/bazacall-phony-call-centers-lead-to-exfiltration-and-ransomware/
