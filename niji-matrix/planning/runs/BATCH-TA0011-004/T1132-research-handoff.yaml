        en: Unit 42 reverse engineering finds data encrypted and then represented through a custom Base64 alphabet; decoding and decryption recover a tick command, the sample executes system reconnaissance, and results are uploaded to C2.
      evidence_keys:
        - B4-T1132-REF-TDROP2
      scope_limit:
        zh: 单个样本支持自定义实现与结果链，不证明自定义编码普遍优于标准编码或跨产品防御效果。
        en: One sample supports a custom implementation and outcome chain but does not establish that custom encoding generally outperforms standard encoding or has uniform effects across defensive products.
