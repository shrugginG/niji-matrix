      Extend `REF-000625`'s locator to the T1132 parent, T1132.001/.002, and TA0011 mapping. `CLM-000749` already establishes the deduplication principle between carrier or representation obscuration and NJT-0115 and can support the boundary. `CASE-000199` can serve as a conditional co-classification case, but its central facts are SUNBURST semantic dilution and service emulation and it does not replace a plain-encoding case. Extend DET-000112 detects_refs and evidence_refs; reuse NJA-000100 because logic, data, correlation, and tuning remain unchanged; extend MIT-000113 with one application. Carry DET-000163 and MIT-000150 only when NJT-0152 conditions are met rather than extending them globally.
