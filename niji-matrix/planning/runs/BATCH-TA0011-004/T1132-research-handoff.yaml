        en: The documentation establishes decoding standard Base64 at selected buffers and offsets before further matching. It does not support unknown custom alphabets, recursive chains, malicious classification, or universal thresholds.
  claims:
    - key: B4-T1132-CLM-PARENT
      statement:
        zh: 攻击者对 C2 命令或结果施加可逆表示变换，使防守在规范化前缺少原始控制语义，而接收端逆变换后执行或回传。
        en: Adversaries apply reversible representation transforms to C2 commands or results so defenders lack original control semantics before normalization while receivers inverse-transform and execute or return them.
      evidence_keys:
        - REF-000625
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
      evidence_mode: direct-parent-and-sample-analysis
    - key: B4-T1132-CLM-OWNERSHIP
      statement:
        zh: T1132 的标准与非标准实现共享 NJS-0115-001 已拥有的可重放可逆表示链，不支持按字母表或算法再建 NJS；T1132 独立保留 TA0011 父语境。
        en: Standard and non-standard T1132 implementations share the replayable reversible representation chain already owned by NJS-0115-001 and do not support new alphabet- or algorithm-based NJS; T1132 retains an independent TA0011 parent context.
      evidence_keys:
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
        - B4-T1132-REF-RFC4648
        - REF-000400
      evidence_mode: cross-technique-taxonomy-inference
    - key: B4-T1132-CLM-BOUNDARY
      statement:
        zh: 纯可逆编码不满足 NJT-0152；只有额外噪声、载体选择或服务契约伪装改变会话观察时才并列，密码机密性由 T1573 独立拥有。
        en: Plain reversible encoding does not satisfy NJT-0152; co-classification requires additional noise, carrier selection, or service-contract disguise changing conversation observation, while T1573 separately owns cryptographic confidentiality.
      evidence_keys:
        - REF-000626
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
      evidence_mode: boundary-inference-from-direct-samples
    - key: B4-T1132-CLM-NORMALIZATION
      statement:
        zh: 检测应保存原始 C2 对象并对每层变换记录输入、参数和输出，在恢复语义后再连接端点结果；Base64、压缩或高熵单独不足以定性。
        en: Detection should preserve the raw C2 object, record input, parameters, and output at each transform layer, and join recovered semantics to endpoint outcomes; Base64, compression, or high entropy alone is insufficient.
      evidence_keys:
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-SNORT-BASE64
        - REF-000632
        - REF-000633
      evidence_mode: implementable-design-supported-by-sample-and-field-documentation
  cases:
