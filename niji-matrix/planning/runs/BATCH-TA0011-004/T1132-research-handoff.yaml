research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
      - T1132.001
      - T1132.002
    represented_dimensions:
      - compliance of encoding scheme with public or protocol specifications
      - standard versus modified alphabet or representation rule
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_id: T1132.001
        attack_dimension: standard encoding such as Base-N, hexadecimal, character encoding, MIME, or gzip-related representation
        resolution: adjacent-technique
        owner_ref: NJS-0115-001
        reason:
          zh: 有意 C2 编码保留在 T1132 父级；可逆变换变量和规范化防御由 NJS-0115-001 唯一拥有。协议强制的正常编码排除。
          en: Deliberate C2 encoding stays at the T1132 parent; NJS-0115-001 uniquely owns the reversible-transform variable and normalization defense. Protocol-required normal encoding is excluded.
      - attack_id: T1132.002
        attack_dimension: non-standard or modified representation such as a custom Base64 alphabet
        resolution: adjacent-technique
        owner_ref: NJS-0115-001
        reason:
          zh: 自定义字母表改变解析参数但仍是同一可重放链；标准解析失败应作为恢复链中的失败层，而非 Niji 子项身份。
          en: A custom alphabet changes parser parameters but remains the same replayable chain; standard-parser failure is a failed recovery layer rather than a Niji child identity.
    candidate_stealth_axes_examined:
      - axis: reversible_transform_chain
        result: cross-technique-reuse
        owner_ref: NJS-0115-001
      - axis: transform_depth_and_order
        result: owner-parameter
        owner_ref: NJS-0115-001
      - axis: semantic_distribution_across_fields
        result: adjacent-technique
        owner_ref: NJS-0152-001
      - axis: standardness_or_custom_alphabet
        result: not-stealth-distinct
      - axis: protocol_required_encoding
        result: excluded-normal-behavior
      - axis: cryptographic_confidentiality
        result: adjacent-technique
        owner: T1573
      - axis: ordinary_compression
        result: excluded-normal-behavior-unless-deliberate-recovery-chain
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        两个 ATT&CK 子项已逐项覆盖，但其区别只是编码规则是否标准，不满足独立痕迹、观察和防御门。开放检验了层深、字段分布、协议要求、密码机密性和压缩；相应变量已由既有对象拥有或属于正常行为。父级 `none-justified` 是跨技术去重结果，不是停止分类搜索。
      en: >-
        Both ATT&CK children are covered, but their distinction is only whether the encoding rule is standard and does not pass separate trace, observation, and defense gates. The open search also tested depth, field distribution, protocol requirements, cryptographic confidentiality, and compression; each variable is already owned or is normal behavior. Parent `none-justified` is a cross-technique deduplication result rather than an early stop.
  cross_technique_ownership:
    reversible_representation_variable:
      unique_owner: NJS-0115-001
      t1132_role:
        zh: 记录该变量用于 C2 命令或结果时的 TA0011 父语境与结果门
        en: Record the TA0011 parent context and outcome gate when the variable applies to C2 commands or results
      default_classification:
        zh: 恢复链和 C2 后果均可证时，T1132 父级与 NJS-0115-001 并列
        en: Co-classify the T1132 parent and NJS-0115-001 when both recovery chain and C2 outcome are evidenced
      parent_only_condition:
        zh: 来源只证明 C2 内容被编码，但没有足够结论级材料恢复变换链、参数或真实输出时，仅保留 T1132 父级并降低置信度
        en: Keep only the T1132 parent at reduced confidence when a source establishes encoded C2 but lacks conclusion-level material to recover the chain, parameters, or real output
    c2_message_obfuscation:
      owner: NJT-0152
      co_classification_condition:
        zh: 编码之外存在控制字节比例/位置稀释、载体选择或产品服务契约伪装，并造成独立的会话观察差
        en: A separate conversation-observation differential exists through control-byte share or position dilution, carrier selection, or forged product-service contract in addition to encoding
      no_co_classification_condition:
        zh: 仅对一个完整 C2 字段执行可逆编码，外层服务角色和字段语义未被额外伪装
        en: One complete C2 field is reversibly encoded without additional disguise of the outer service role or field semantics
  evidence_coverage:
    parent_behavior_keys:
      - REF-000625
      - B4-T1132-REF-SPECCOM
      - B4-T1132-REF-TDROP2
    boundary_keys:
      - REF-000400
      - REF-000626
      - B4-T1132-REF-RFC4648
      - B4-T1132-REF-SPECCOM
      - B4-T1132-REF-TDROP2
    mechanism_support:
      - mechanism: NM-DO
        keys:
          - B4-T1132-REF-SPECCOM
          - B4-T1132-REF-TDROP2
        level: direct-transform-recovery-and-outcome
    child_existence_support: []
    defense_field_support:
      - source: B4-T1132-REF-SNORT-BASE64
        support: standard Base64 decoding at selected buffer, offset, and length followed by matching on decoded data
      - source: REF-000632
        support: HTTP session fields and uid transaction linkage, not payload visibility by itself
      - source: REF-000633
        support: network file fuid, uid, MIME, size, and extraction linkage, not semantic recovery by itself
      - source: B4-T1132-REF-SPECCOM
        support: concrete layer order, keys, input representation, recovered task, and returned output
    unsupported_or_deferred:
      - No source provides a universal threshold for encoded-string length, entropy, recursion depth, or expansion ratio that distinguishes malicious C2 from protocol-required encoding.
      - ATT&CK standard and non-standard labels do not establish separate Niji stealth variables or separate defensive objectives.
      - Opaque TLS and absent content retention prevent network-side semantic recovery; metadata alone cannot establish T1132.
      - A custom alphabet may be recoverable from a sample, but unknown variants and missing keys remain lower-confidence candidates.
      - The proposed parent-only formal package and reuse of DET-000112/NJA-000100/MIT-000113 require primary-agent schema and cross-tactic integration review.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级提案完整覆盖变换对象、直接目的、恢复边界、残余痕迹、协议正常反例、相邻所有权、C2 场景、攻防能力和传感器限制。无正式 NJS 是已审查结论；若主 Agent 决定创建子项，必须重新证明其变量不由 NJS-0115-001 或 NJS-0152-001/002 拥有，并提交独立防御差异，不能从本研究的算法名称直接生成。
      en: >-
        The parent proposal covers transformed object, direct purpose, recovery boundary, residual traces, protocol-normal counterexamples, adjacent ownership, C2 scenario, attacker and defender capabilities, and sensor limits. No formal NJS is a reviewed conclusion. If the primary agent creates a child, it must newly prove that NJS-0115-001 or NJS-0152-001/002 does not own the variable and supply an independent defense difference rather than derive a child from algorithm names in this research.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - staging YAML serialization
      - YAML parse verification
      - evidence-key consistency check
      - shared-library URL and semantic lookup
  limitations:
    paragraphs:
      - zh: >-
          SpecCom 与 TDrop2 都是结论级样本逆向，分别证明多层标准表示与自定义字母表能够在接收端恢复控制语义；二者没有公开生产网络中的检测命中率、漏报率或正常业务基线。TDrop2 同时加密和编码，必须分别归入 T1573 与 T1132，不能把密码效果归功于自定义 Base64。SpecCom 同时使用 HTML 注释载体和 XOR，只有各层证据明确时才能进一步并列 NJT-0152。
        en: >-
          SpecCom and TDrop2 are conclusion-level sample analyses establishing receiver recovery of control semantics through layered standard representation and a custom alphabet respectively. Neither provides production-network sensitivity, miss rates, or normal-business baselines. TDrop2 both encrypts and encodes, so T1573 and T1132 must be classified separately and cryptographic effect cannot be attributed to custom Base64. SpecCom also uses an HTML-comment carrier and XOR, and further NJT-0152 co-classification requires evidence for each independent layer.
      - zh: >-
          RFC 4648 说明 Base-N 本来服务于互操作，并允许因 URL、文件名或协议约束选择不同字母表；因此“标准 Base64”“去掉填充”或“字符替换”不自动代表攻击。Snort 文档只证明标准 Base64 可被指定位置解码，Zeek 文档只证明事务和文件关联字段；未知自定义表、压缩炸弹、嵌套编码、内容不可见和端点进程缺失仍需专用分析与本地资源限制。
        en: >-
          RFC 4648 shows that Base-N normally serves interoperability and that URLs, filenames, or protocol constraints can require different alphabets. Standard Base64, omitted padding, or character substitution therefore does not automatically indicate attack. Snort documentation only establishes standard Base64 decoding at selected locations, and Zeek documentation only establishes transaction and file linkage fields. Unknown custom tables, decompression bombs, nested encoding, opaque content, and missing endpoint process identity still require specialized analysis and local resource limits.
      - zh: >-
          `NJT-0115` 的范围包含文件、脚本、命令和传输内容，直接复用可避免变量重复，但 T1132 仍需独立 TA0011 父级以表达 C2 结果门。这个双层建模依赖人工评审确认页面导航、证据引用和战术计数不会把 NJT-0115 的其他三个子项错误带入 TA0011；在正式写入前应由主 Agent 检查 schema 与 Web 展示。
        en: >-
          `NJT-0115` covers files, scripts, commands, and in-transit content, so reuse prevents duplicate variables, while T1132 still needs an independent TA0011 parent to express the C2 outcome gate. This two-level model needs human review to ensure navigation, evidence references, and tactic counts do not pull NJT-0115's other three children into TA0011 incorrectly. The primary agent should verify schema and Web presentation before canonical writing.
  rejected_mechanisms:
    - mechanism_ref: NM-FD
      reason:
        zh: 纯编码改变可解释性，不必让 C2 模仿另一良性实体；只有额外服务或载体外观时由 NJT-0152/NJS-0115-003 处理。
        en: Plain encoding changes interpretability without necessarily imitating another benign entity; additional service or carrier appearance belongs to NJT-0152 or NJS-0115-003.
    - mechanism_ref: NM-ST
      reason:
        zh: 编码本身不在时间或来源上分散消息；分块与多请求分布需独立证据并优先审查 NJT-0152-001。
        en: Encoding itself does not distribute a message across time or sources; chunking across requests needs independent evidence and first requires NJT-0152-001 review.
    - mechanism_ref: NM-BT
      reason:
        zh: 可见内容仍在传感器观察内，只是规范化前不可解释；这属于 NM-DO 而非监控覆盖外行为。
        en: Visible content remains within sensor observation but is uninterpretable before normalization, making this NM-DO rather than behavior outside monitoring coverage.
  open_questions:
    - Does the technique schema and review UI permit a parent with none-justified child coverage to document cross-technique variable ownership without adding a formal relationship object?
    - Should the primary agent add an explicit relationship from the new T1132 parent to NJS-0115-001, and if so which existing relationship type preserves variable ownership without implying parentage?
    - Can production content-retention legally preserve the raw C2 fields needed for recursive normalization, and which protocols remain opaque?
    - Which bounded recursion depth, per-layer output, and total expansion values are safe in the deployment while retaining coverage for observed transform chains?
