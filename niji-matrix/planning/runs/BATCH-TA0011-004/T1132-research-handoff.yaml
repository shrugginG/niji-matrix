      scope_limit:
        zh: 样本和沙箱证明实现能力，不提供真实组织中每次任务的完整 PCAP、漏报统计或所有版本的一致性。
        en: Sample and sandbox analysis establish implementation capability but provide no complete PCAP for every real-organization task, miss statistics, or consistency across all versions.
