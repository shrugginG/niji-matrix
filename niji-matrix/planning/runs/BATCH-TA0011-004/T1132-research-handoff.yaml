  notes:
    zh: >-
      `REF-000625` 应扩展 locator 到 T1132 父项、T1132.001/.002 和 TA0011 映射。`CLM-000749` 已确定载体/表示遮蔽与 NJT-0115 的去重原则，可复用作边界支持；`CASE-000199` 可作为条件并列案例，但其中心事实是 SUNBURST 的消息稀释和服务仿真，不替代纯编码案例。DET-000112 应 extend detects_refs 与 evidence_refs，NJA-000100 逻辑/data/correlation/tuning 不变可 reuse，MIT-000113 仅 extend application。DET-000163 与 MIT-000150 只在 NJT-0152 条件成立时沿用，不做全局扩展。
