      name:
        zh: SpecCom 多层 C2 表示恢复链
        en: SpecCom Layered C2 Representation-Recovery Chain
      actor_or_campaign: SpecCom sample family
      central_facts:
        zh: NCSC 记录 SpecCom 在 HTTP 参数和 HTML 注释中传递任务，依次使用 UTF-16、两层 XOR、Base64 和 URL 编码；样本逆向可恢复 `dir C:\` 命令，命令输出通过另一端点回传。
        en: NCSC documents SpecCom passing tasking through HTTP parameters and HTML comments using UTF-16, two XOR layers, Base64, and URL encoding; reverse engineering recovers a `dir C:\` command and command output returns through another endpoint.
      evidence_keys:
