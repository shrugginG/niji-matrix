handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-004
work_item_ref: WORK-TA0011-T1132
temporary_key_prefix: B4-T1132
candidate:
  source_type: attack
  source_attack_id: T1132
  name:
    zh: C2 可逆表示编码
    en: Reversible C2 Representation Encoding
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1132 将对命令控制数据施加字符或二进制到文本表示变换，以降低内容在规范化前的可检测性，明确限定于 TA0011。NCSC 对 SpecCom 的代码级报告展示了 C2 请求、入站任务和回传输出经过 UTF-16、XOR、Base64 与 URL 编码的可逆链；Unit 42 对 TDrop2 的逆向分析展示了加密后使用自定义 Base64 字母表、接收端解码并恢复命令、执行后回传结果。父行为和“可见表示—恢复语义”因果链均获一手证据支持，因此不应 exclude。
        en: >-
          ATT&CK Enterprise 19.1 defines T1132 as applying character or binary-to-text representation transforms to command-and-control data so the content is harder to detect before normalization, specifically within TA0011. NCSC's code-level SpecCom report shows a reversible chain of UTF-16, XOR, Base64, and URL encoding for C2 requests, inbound tasking, and returned output. Unit 42's reverse engineering of TDrop2 shows encryption followed by a custom Base64 alphabet, receiver-side decoding to recover commands, execution, and result upload. The parent behavior and visible-representation-to-recovered-semantics causal chain have direct evidence, so exclusion is unwarranted.
      - zh: >-
          需要 adapt 的原因是 Niji 现有 `NJT-0115` 及 `NJS-0115-001` 已经覆盖跨战术的可逆语义变换，`NJT-0152` 又已覆盖 C2 消息中的噪声、载体和服务契约观察差。T1132 不能成为第三个拥有 Base64、十六进制、自定义字母表、多层编码或压缩恢复变量的分类。建议只保留一个 TA0011 父级对象，明确其直接对象是 C2 命令或结果在传输中的可逆表示，以及规范化前后的语义差；正式子项为 `none-justified`，变量级归类复用 `NJS-0115-001`，会话层额外混淆按条件与 `NJT-0152` 并列。
        en: >-
          Adaptation is required because existing `NJT-0115` and `NJS-0115-001` already cover reversible semantic transformation across tactics, while `NJT-0152` already owns C2 observation differences created by noise, carriers, and service contracts. T1132 must not become a third owner of Base64, hexadecimal, custom alphabets, layered encoding, or decompression variables. Keep one TA0011 parent whose direct object is reversible representation of commands or results in transit and the semantic difference before and after normalization. Its formal child coverage should be `none-justified`; variable-level classification reuses `NJS-0115-001`, while additional conversation-level obfuscation co-classifies with `NJT-0152` only when present.
proposed_content:
  summary:
    zh: 攻击者将 C2 命令或结果转换为可逆的字符或二进制表示，使防守方在完成正确规范化前无法直接使用原始控制语义。
    en: An adversary transforms C2 commands or results into a reversible character or binary representation so defenders cannot directly use the original control semantics before correct normalization.
  definition_and_concept:
    paragraphs:
      - zh: >-
          C2 可逆表示编码是攻击者对正在传输的命令、任务参数、主机标识或执行结果施加一个或多个可重放变换，使接收端能够按对应逆变换恢复原字节，而防守传感器首先看到 Base-N、十六进制、转义文本、修改字母表、压缩流或其组合。直接目的是把可解释的控制语义推迟到恢复边界之后，而不是建立通道、保护通信机密性或改变消息所属服务。
        en: >-
          Reversible C2 Representation Encoding is the application of one or more replayable transforms to commands, task parameters, host identifiers, or execution results in transit, allowing the receiver to restore original bytes through corresponding inverse transforms while the defender first sees Base-N, hexadecimal, escaped text, a modified alphabet, a compressed stream, or a combination. Its direct purpose is to postpone interpretable control semantics until after the recovery boundary, rather than establish a channel, protect communication confidentiality, or change the service role claimed by the message.
      - zh: >-
          概念锚是原始 C2 语义、传输中表示、按确定顺序执行的变换链、接收端恢复结果和控制后果。Base64、十六进制、gzip、XOR 或自定义表只是实现名称；标准或非标准并不改变根本行为。只有来源证明攻击者有意对 C2 内容施加变换，并能把可见表示连接到恢复命令或结果时，才进入本技术。协议为互操作强制执行的编码以及没有恶意控制语义的压缩不属于本项。
        en: >-
          The conceptual anchors are original C2 semantics, in-transit representation, an ordered transform chain, receiver-side recovery, and a control outcome. Base64, hexadecimal, gzip, XOR, and custom tables are implementation names; whether an encoding is standard does not change the behavior. Classification requires evidence that the adversary deliberately transformed C2 content and a link from visible representation to a recovered command or result. Encoding mandated by a protocol for interoperability and compression without malicious control semantics are outside scope.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          表示变换会移除或重排原命令关键字、路径、参数、文件头和结果文本，使只对原始网络缓冲区运行字符串、正则或文件签名的规则不能直接命中。多层链还让一次规范化只得到中间表示，自定义字母表会使默认 Base64 解析失败。防守方看到的长度、字符分布和格式标识仍然存在，但若没有正确的层序、参数或字母表，这些痕迹不能直接还原控制语义。
        en: >-
          Representation transforms remove or rearrange original command keywords, paths, parameters, file headers, and result text, preventing string, regular-expression, or file signatures applied only to the raw network buffer from matching directly. Layered chains leave an intermediate representation after one normalization pass, and a custom alphabet can defeat a default Base64 parser. Length, character distribution, and format markers remain visible, but without the correct layer order, parameters, or alphabet they do not directly recover control semantics.
      - zh: >-
          残余痕迹包括编码字母表约束、填充和长度关系、解码/解压例程、变换参数、输入输出摘要、网络对象与端点进程的连接，以及恢复后立即出现的命令执行、文件动作或回传。保存原始对象并递归记录每层输入输出的防守方可以恢复语义；TLS 不可见、内容未留存、密钥缺失、专有变换或资源上限会形成盲区。高熵或长 Base64 字符串单独只支持待规范化对象，不能证明恶意。
        en: >-
          Residual traces include alphabet constraints, padding and length relationships, decode or decompression routines, transform parameters, input and output digests, linkage between the network object and endpoint process, and command execution, file activity, or return traffic immediately after recovery. A defender preserving the original and recording every layer's input and output can restore semantics. Opaque TLS, absent content retention, missing keys, proprietary transforms, or resource limits create blind spots. High entropy or a long Base64 string alone supports only a normalization candidate, not a malicious conclusion.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求同时具备 C2 语境、攻击者控制的可逆表示变换、接收端恢复能力以及恢复后的命令或结果证据。标准库调用与自定义解码器均可成立，算法是否公开不是判定条件。合法邮件 MIME、HTTP URL 编码、JSON 转义、协议规定的二进制到文本转换、备份压缩、软件更新包和性能型 Content-Encoding 是正常反例；只有当相同表示被攻击者用于隐藏恶意控制语义，并形成恢复结果链时才分类。
        en: >-
          Inclusion requires a C2 context, an attacker-controlled reversible representation transform, receiver recovery capability, and evidence of the recovered command or result. A standard library call and a custom decoder can both qualify; public availability of the algorithm is not a criterion. Legitimate mail MIME, HTTP URL encoding, JSON escaping, protocol-required binary-to-text conversion, backup compression, software-update packages, and performance-oriented Content-Encoding are normal counterexamples. Classification applies only when the adversary uses the representation to conceal malicious control semantics and a recovery-outcome chain exists.
      - zh: >-
          `NJS-0115-001` 唯一拥有“可重放可逆表示链”这一原生变量；当证据能够恢复 C2 编码链时，事件应同时归入本父级和该跨战术子项，而不在 T1132 下复制子项。`NJT-0152` 只在攻击者额外加入无意义字节、把语义分散到载体字段或伪造产品服务契约时并列；纯编码不满足消息混淆子项。`T1573` 负责密码变换带来的机密性，即使密文随后 Base64 化也应把加密和编码分别归类。`T1001` 的噪声、载体和服务伪装，及普通压缩和协议编码，均不能由“存在 Base64”推定。
        en: >-
          `NJS-0115-001` uniquely owns the Niji-native variable of a replayable reversible representation chain. When evidence recovers a C2 encoding chain, the event should co-classify under this parent and that cross-tactic child without duplicating a T1132 child. `NJT-0152` co-applies only when the actor additionally inserts inert bytes, distributes semantics across carrier fields, or forges a product-service contract; plain encoding does not satisfy its children. `T1573` owns confidentiality from cryptographic transformation, so encryption and later Base64 representation are classified separately. Noise, carrier or service camouflage under `T1001`, ordinary compression, and protocol encoding cannot be inferred from the mere presence of Base64.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在 HTTP C2 中，植入可以先把主机标识转为 UTF-16，按流量密钥和样本密钥执行 XOR，再 Base64 与 URL 编码后放入表单参数；服务端按逆序恢复。入站响应可在 HTML 注释中携带另一条多层编码任务，植入恢复出 `dir` 等命令并执行，再对输出执行同一类链后 POST 回传。SpecCom 提供完整实例。TDrop2 则说明自定义 Base64 字母表只是另一实现，仍须解码并解密才出现 `tick` 命令和参数。
          en: >-
            In HTTP C2, an implant can convert a host identifier to UTF-16, apply XOR with traffic and sample keys, then Base64- and URL-encode it into a form parameter for inverse recovery by the server. An inbound response can carry another layered task inside an HTML comment; the implant recovers a command such as `dir`, executes it, and applies a similar chain to returned output. SpecCom provides a complete instance. TDrop2 shows that a custom Base64 alphabet is another implementation: decoding and decryption are still required before `tick` commands and parameters appear.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需控制发送端变换与接收端逆变换，选择能通过承载字段字符、长度和解析约束的表示，并处理填充、分块和错误。多层或专有变换可能增加带宽、CPU、实现缺陷和互操作失败；解码器、固定字母表、流量密钥及恢复顺序也会成为稳定分析点。若真正目标是机密性，还必须另行管理密码密钥并承担 T1573 的成本，编码本身不提供该性质。
            en: >-
              The adversary must control the sender transform and receiver inverse, choose a representation compatible with carrier character, length, and parsing constraints, and handle padding, chunking, and errors. Multiple or proprietary layers increase bandwidth, CPU, implementation defects, and interoperability failures. Decoders, fixed alphabets, traffic keys, and recovery order also become stable analytic points. If confidentiality is the real objective, the actor must separately manage cryptographic keys and accept T1573 costs because encoding itself does not provide that property.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定可在合法授权下取得原始 HTTP、DNS、邮件或其他消息对象，保留会话与对象标识，并把网络内容连接到发起/接收进程和后继动作。规范化流水线能够识别候选表示、限制递归深度与总展开量、记录每层输入输出摘要和失败原因，并把恢复对象重新送入内容检测。若只能看到五元组或 TLS 元数据，最多能报告字符/长度形态，不能声称已恢复编码命令。
            en: >-
              The defender is assumed to lawfully obtain raw HTTP, DNS, mail, or other message objects, retain session and object identifiers, and join network content to sending or receiving processes and successor actions. A normalization pipeline identifies candidate representations, limits recursion depth and total expansion, records every layer's input and output digests plus failure reason, and resubmits recovered objects to content detection. If only five-tuples or TLS metadata are visible, the defender can report character or length shape at most and cannot claim a recovered encoded command.
          - zh: >-
              协议解析器应先给出字段的合法编码要求和内容边界，再对不需要编码或恢复后含控制语义的对象提高优先级。Snort 的 Base64 解码缓冲区证明可以把检测游标放到规范化结果，Zeek 的 uid/fuid 可连接 HTTP 事务和文件对象；这些文档只证明实现字段与操作，不证明阈值、误报率或未知字母表自动恢复。生产策略必须保留正常 MIME、认证头和业务压缩基线。
            en: >-
              Protocol parsers should first supply legitimate encoding requirements and content boundaries, then prioritize representations not required by the protocol or whose recovered content contains control semantics. Snort's Base64 decoded buffer shows that a detection cursor can operate on normalized output, and Zeek uid or fuid can join HTTP transactions and file objects. These documents establish implementable fields and operations, not thresholds, false-positive rates, or automatic recovery of unknown alphabets. Production policy must preserve baselines for normal MIME, authentication headers, and business compression.
  stealth_mechanisms:
    - mechanism_ref: NM-DO
      role: primary
      summary:
        zh: 传输表示在恢复前不直接揭示控制语义
        en: In-transit representation does not directly reveal control semantics before recovery
      analysis:
        paragraphs:
          - zh: >-
              攻击者按确定链把命令或结果从可解释字节转换成编码、转义或压缩表示，网络和日志痕迹首先保存变换后对象；防守方若只检查这一层，原关键词和结构不存在，必须重放逆变换才能理解。接收端恢复后执行或回传完成从表示差到控制结果的因果链，形成数据遮蔽。SpecCom 与 TDrop2 均提供可复核输入、恢复步骤和恶意结果；具体产品是否漏报未被测量。
            en: >-
              The adversary converts commands or results from interpretable bytes into encoded, escaped, or compressed representations through an ordered chain, causing network and log traces to retain the transformed object first. Original keywords and structure are absent for a defender inspecting only that layer, and inverse transforms are required for interpretation. Receiver recovery followed by execution or return completes the causal chain from representation difference to control outcome, producing Data Obscuration. SpecCom and TDrop2 provide reproducible inputs, recovery steps, and malicious results; no source measures a particular product miss.
      evidence_keys:
        - REF-000625
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
      confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            T1132 在 Niji 中建议保持父级处理，不建立正式 NJS。固定基线的“标准编码”和“非标准编码”按算法是否符合既有规范区分，但两者共享同一个攻击者可控变量：可重放的表示变换链；痕迹差异都是规范化前缺少真实语义，防守动作都是识别变换、逆向恢复、记录每层摘要并校验结果。SpecCom 的标准 Base64 与 TDrop2 的自定义字母表说明实现不同，却没有产生稳定的兄弟边界或不同防御目标。
          en: >-
            T1132 should remain parent-only in Niji with no formal NJS. The fixed baseline separates standard and non-standard encoding by conformance to an existing specification, but both share one attacker-controlled variable: a replayable representation-transform chain. In both cases, real semantics are absent before normalization and defense identifies the transform, performs inverse recovery, records each layer's digest, and validates the outcome. Standard Base64 in SpecCom and a custom alphabet in TDrop2 show different implementations without a stable sibling boundary or a distinct defensive objective.
        - zh: >-
            原生变量的唯一所有者是 `NJS-0115-001`。递归层数、Base-N 类型、字母表、是否 URL 转义、压缩器和平台都属于该变量的参数，不在 T1132 再拆分。若控制字节还被无意义对象稀释，归 `NJS-0152-001`；若完整会话伪装成批准服务，归 `NJS-0152-002`；若只把编码块放入某字段而没有额外会话观察差，保持 T1132 父级并与 `NJS-0115-001` 并列。只有来源笼统称“编码 C2”却未给恢复链时，出于证据层级可暂时只保留父级。
          en: >-
            `NJS-0115-001` uniquely owns the native variable. Recursion depth, Base-N family, alphabet, URL escaping, compressor, and platform are parameters of that variable and do not justify new T1132 children. Inert-object dilution additionally maps to `NJS-0152-001`; an entire conversation forged as an approved service maps to `NJS-0152-002`. Placing an encoded block in a field without another conversation-level differential remains at the T1132 parent and co-classifies with `NJS-0115-001`. Where a source merely says encoded C2 without a recoverable chain, evidence calibration may temporarily support the parent only.
    coverage: none-justified
    proposed_subtechnique_keys: []
proposed_subtechniques: []
taxonomy_candidates_examined:
  - temporary_key: B4-T1132-AXIS-REVERSIBLE-CHAIN
    proposed_status: cross-technique-reuse
    owner_ref: NJS-0115-001
    name:
      zh: 可重放可逆表示链
      en: Replayable Reversible Representation Chain
    stable_variable:
      zh: 发送端选择的变换序列及接收端可按逆序恢复的链
      en: The sender-selected transform sequence and receiver's inverse recovery chain
    trace_and_observation:
      zh: 原始控制语义从可见内容消失，逐层规范化恢复中间及最终对象；该差异不因 C2 阶段改变，已由 NJS-0115-001 拥有。
      en: Original control semantics disappear from visible content and layered normalization recovers intermediate and final objects; the differential does not change merely because it occurs in C2 and is already owned by NJS-0115-001.
    evidence_keys:
      - B4-T1132-REF-SPECCOM
      - B4-T1132-REF-TDROP2
      - REF-000400
    defense_value:
      zh: 直接复用 DET-000112/NJA-000100 的原始—逐层恢复—结果谱系与 MIT-000113 的递归规范化，不需复制对象。
      en: Reuse DET-000112 and NJA-000100 original-to-layered-recovery-to-outcome lineage and MIT-000113 recursive normalization without duplicate objects.
  - temporary_key: B4-T1132-AXIS-LAYER-DEPTH
    proposed_status: owner-parameter
    owner_ref: NJS-0115-001
    name:
      zh: 变换层深与顺序
      en: Transform Depth and Order
    stable_variable:
      zh: 编码、转义、压缩或其他可逆步骤的层数和执行顺序
      en: The number and order of encoding, escaping, compression, or other reversible steps
    trace_and_observation:
      zh: 单次解码只得到中间表示，资源与递归预算影响恢复；这是可逆链的量化参数，不形成新的兄弟边界。
      en: One decode yields only an intermediate representation and recovery depends on recursion and resource budgets; this is a quantitative parameter of the reversible chain, not a sibling boundary.
    evidence_keys:
      - B4-T1132-REF-SPECCOM
      - REF-000626
    defense_value:
      zh: 同一 Analytic 记录每层输入输出摘要并施加深度与展开量上限。
      en: The same analytic records every layer's input and output digest and enforces depth and expansion limits.
  - temporary_key: B4-T1132-AXIS-FIELD-DISTRIBUTION
    proposed_status: adjacent-technique
    owner_ref: NJS-0152-001
    name:
      zh: 编码块跨字段稀释
      en: Encoded-Block Dilution across Fields
    stable_variable:
      zh: 控制字节是否与无意义字段或片段混合，使消息恢复不仅依赖解码还依赖选择有效片段
      en: Whether control bytes are mixed with inert fields or fragments so recovery requires selecting meaningful parts in addition to decoding
    trace_and_observation:
      zh: 防守需要重建有效字段比例和位置，属于控制消息语义稀释；SUNBURST 的随机 steps 与 GUID 拼接是证据，不应在 T1132 重复。
      en: Defense must reconstruct the position and share of meaningful fields, which belongs to Control-Message Semantic Dilution; SUNBURST random steps and GUID assembly provide evidence and should not be duplicated under T1132.
    evidence_keys:
      - REF-000626
    defense_value:
      zh: 仅在并列归类时使用 DET-000163/NJA-000174 和 MIT-000150。
      en: Use DET-000163, NJA-000174, and MIT-000150 only when co-classification applies.
  - temporary_key: B4-T1132-AXIS-STANDARDNESS
    proposed_status: not-stealth-distinct
    name:
      zh: 标准或自定义编码
      en: Standard or Custom Encoding
    stable_variable:
      zh: 字母表或编码规则是否符合公开规范
      en: Whether the alphabet or encoding rule conforms to a public specification
    trace_and_observation:
      zh: 影响解析器识别方式，却不改变“可见表示—逆变换—恢复语义”的因果链；已知自定义表可配置，同一规范化框架仍适用。
      en: It affects parser recognition but not the visible-representation-to-inverse-transform-to-recovered-semantics causal chain; a known custom table is configurable and the same normalization framework applies.
    evidence_keys:
      - B4-T1132-REF-RFC4648
      - B4-T1132-REF-TDROP2
    defense_value:
      zh: 解析失败作为失败层保留并转入样本/端点解码器恢复，不另建 NJS。
      en: Preserve parse failure as a failed layer and recover through sample or endpoint decoder analysis without a new NJS.
  - temporary_key: B4-T1132-AXIS-PROTOCOL-REQUIRED
    proposed_status: excluded-normal-behavior
    name:
      zh: 协议要求的合法表示
      en: Protocol-Required Legitimate Representation
    stable_variable:
      zh: 编码是否由承载协议或业务格式为互操作所要求
      en: Whether encoding is required by the carrier protocol or business format for interoperability
    trace_and_observation:
      zh: MIME、URL 转义和合法 Base64 可能完全正常，不能从表面形态推断攻击者意图；需恶意恢复结果才进入本父级。
      en: MIME, URL escaping, and legitimate Base64 can be entirely normal, so adversary intent cannot be inferred from surface shape; a malicious recovered outcome is required for this parent.
    evidence_keys:
      - B4-T1132-REF-RFC4648
    defense_value:
      zh: 作为协议/应用基线和误报排除，不产生技术对象。
      en: Use as protocol and application baseline and a false-positive exclusion rather than a technique object.
defense_candidates:
  detection_strategies:
    - temporary_key: B4-T1132-DET-EXTEND-DET000112
      resolution_recommendation: extend
      existing_ref: DET-000112
      name:
        zh: 扩展内容规范化—恢复—结果关联以覆盖 C2 编码
        en: Extend Content Normalization–Recovery–Outcome Correlation for C2 Encoding
      rationale:
        zh: DET-000112 的检测目标、域和 Analytic 集合已经完整覆盖可逆表示链；T1132 只增加 C2 主体，不改变策略目标。建议把新父级加入 detects_refs，并增加 C2 样本与网络内容字段证据，不创建同义 DET。
        en: DET-000112's objective, domain, and analytic set already cover the reversible representation chain. T1132 adds a C2 subject without changing that objective. Add the new parent to detects_refs and add C2 sample and network-content evidence rather than create a synonymous DET.
      detects_keys:
        - B4-T1132-PARENT
      analytic_refs:
        - NJA-000100
      evidence_additions:
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
        - B4-T1132-REF-SNORT-BASE64
        - REF-000632
        - REF-000633
  detection_analytics:
    - temporary_key: B4-T1132-NJA-REUSE-NJA000100
      resolution_recommendation: reuse
      existing_ref: NJA-000100
      name:
        zh: 复用可逆变换恢复谱系
        en: Reuse Reversible-Transform Recovery Lineage
      reuse_identity:
        zh: T1132 所需逻辑仍是保存原始对象、递归重放解码/解压/规范化、记录每层输入输出摘要，并把恢复语义连接到后继动作；数据要求、窗口、维度、误报和调优与 NJA-000100 完全相同。
        en: >-
          T1132 uses the same logic: preserve the original object, recursively replay decoding, decompression, or normalization, record every layer's input and output digest, and join recovered semantics to a successor action. Data requirements, window, dimensions, false positives, and tuning are unchanged from NJA-000100.
      c2_implementation_profile:
        logic:
          zh: 从代理、NDR、邮件网关或内容留存面取得原始消息对象，按协议字段边界生成 object.id；依次尝试协议声明的解码，再执行受限的 Base-N、十六进制、URL、压缩和已知自定义字母表恢复。每层记录成功、失败和原因，将最终命令/结果与同一端点进程在短窗内的执行、文件或回传连接。识别到编码但未恢复结果时只输出 normalization_candidate。
          en: Obtain raw message objects from a proxy, NDR, mail gateway, or authorized content-retention layer and derive object.id from protocol field boundaries. Apply protocol-declared decoding first, followed by bounded Base-N, hexadecimal, URL, compression, and known custom-alphabet recovery. Record success, failure, and reason for every layer and join a final command or result to execution, file activity, or return traffic by the same endpoint process in a short window. If encoding is recognized without recovery, emit normalization_candidate only.
        raw_to_normalized_fields:
          - raw: Zeek http.log ts or equivalent proxy time
            normalized: event.timestamp
          - raw: endpoint device identity joined from source address and process network telemetry
            normalized: asset.id
          - raw: Zeek uid plus HTTP trans_depth and request-or-response direction, or equivalent transaction and field ID
            normalized: object.id
          - raw: SHA-256 of retained raw header, parameter, body, attachment, or extracted file
            normalized: original.hash and transform.input_hash for layer zero
          - raw: Content-Type, protocol field name, transfer encoding, and parser result
            normalized: format
          - raw: computed byte or character distribution
            normalized: entropy
          - raw: decoder identifier such as base64, base64url, hex, URL percent, gzip, or recovered custom table
            normalized: transform.type
          - raw: hash of alphabet, key reference, offset, padding policy, decompression limit, and layer order
            normalized: transform.parameters_hash
          - raw: SHA-256 of each decoded or decompressed buffer
            normalized: transform.output_hash and next layer transform.input_hash
          - raw: EDR or Sysmon process GUID, process unique ID, or process start tuple
            normalized: process.start_key
          - raw: recovered command execution, file action, child process, configuration change, or result upload
            normalized: successor.action
        observables:
          - zh: 原始 C2 字段经两层以上变换后恢复为命令或结果，并由相同进程立即消费或回传
            en: A raw C2 field recovers into a command or result after two or more transforms and is immediately consumed or returned by the same process
          - zh: 标准解析失败，但从样本解码器恢复的自定义字母表产生可重放输出与控制后果
            en: Standard parsing fails, while a custom alphabet recovered from the sample produces replayable output and a control outcome
        correlation_window:
          zh: 单个网络对象内保持严格层序；从最终恢复到端点结果默认五分钟，并按植入回连周期调节。
          en: Preserve strict layer order within one network object; use five minutes by default from final recovery to endpoint outcome and tune to the implant's callback cadence.
        false_positives:
          - legitimate MIME and mail attachments
          - HTTP authentication or API fields using required Base64
          - software-update manifests and telemetry
          - negotiated HTTP compression
          - backup, archive, and privacy-preserving application content
        blind_spots:
          - opaque TLS or encrypted mail without lawful content access
          - unretained raw bodies or truncated fields
          - unknown proprietary alphabet or missing decryption key
          - normalization bombs exceeding safe depth or expansion budget
          - process-to-network identity unavailable behind proxy or NAT
        tuning_guidance:
          zh: 先应用协议声明与应用 schema，保留正常字段白名单；对非必需编码、异常层深、标准解析失败和恢复后控制语义提高优先级。限制深度、单层输出和总展开量，但保存失败层与原始摘要。不要以 Base64、熵或压缩本身告警为恶意。
          en: Apply protocol declarations and application schemas first and retain allowlists for normal fields. Prioritize unnecessary encoding, unusual depth, standard-parse failure, and recovered control semantics. Bound depth, per-layer output, and total expansion while preserving failed layers and original digests. Do not call Base64, entropy, or compression malicious by itself.
      evidence_keys:
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
        - B4-T1132-REF-SNORT-BASE64
        - REF-000632
        - REF-000633
      logic_status: existing_analytic_reuse_with_deployment_profile_unvalidated_on_local_data
  mitigations:
    - temporary_key: B4-T1132-MIT-EXTEND-MIT000113
      resolution_recommendation: extend
      existing_ref: MIT-000113
      name:
        zh: 扩展内容规范化与运行时检查以覆盖 C2 编码
        en: Extend Content Normalization and Runtime Inspection for C2 Encoding
      rationale:
        zh: MIT-000113 已拥有递归内容规范化与隔离运行措施，控制动作与 T1132 完全同义。保持现有 measures，不创建新 MIT，只增加新父级 application。
        en: MIT-000113 already owns recursive content normalization and isolated-runtime measures, which are semantically identical for T1132. Keep existing measures, create no new MIT, and add one application for the new parent.
      applications:
        - target_key: B4-T1132-PARENT
          use:
            zh: 在合法可见的 C2 风险出口对 HTTP 参数、头、正文、DNS 载荷、邮件附件和其他消息字段先按协议规范化，再进行受限递归解码、解压和自定义表恢复；记录每层摘要并把恢复内容重新送入签名、语义和端点结果检查。对标准解析失败、超过安全预算或恢复出可执行控制语义的对象隔离或阻断，同时保留原始证据。
            en: At lawfully visible C2-risk egress points, normalize HTTP parameters, headers, bodies, DNS payloads, mail attachments, and other message fields according to protocol before bounded recursive decoding, decompression, and custom-table recovery. Record every layer's digest and resubmit recovered content to signature, semantic, and endpoint-outcome checks. Isolate or block objects that fail standard parsing, exceed safe budgets, or recover executable control semantics while preserving original evidence.
          expected_effect:
            zh: 标准和自定义字母表、单层和多层变换均不能永久移除命令或结果语义，检测在规范化缓冲区而非只在原始表示上运行。
            en: Standard and custom alphabets and single- or multi-layer transforms no longer permanently remove command or result semantics, because detection runs on normalized buffers rather than only raw representation.
          limitations:
            zh: TLS 或端到端加密可能使网关无内容可处理，专有变换和缺失密钥会阻止恢复，递归规范化还面临资源消耗和解析器攻击。合法 MIME、认证字段、压缩和隐私数据要求字段级基线、保留期限与访问控制，不能默认全部解码和留存。
            en: TLS or end-to-end encryption may leave gateways without content, proprietary transforms and missing keys can prevent recovery, and recursive normalization introduces resource-exhaustion and parser-attack risk. Legitimate MIME, authentication fields, compression, and private data require field-level baselines, retention limits, and access controls rather than universal decoding and retention.
      evidence_keys:
        - B4-T1132-REF-SPECCOM
        - B4-T1132-REF-TDROP2
        - B4-T1132-REF-SNORT-BASE64
        - B4-T1132-REF-RFC4648
