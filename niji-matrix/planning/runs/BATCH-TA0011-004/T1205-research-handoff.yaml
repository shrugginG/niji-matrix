handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-004
work_item_ref: WORK-TA0011-T1205
temporary_key_prefix: B4-T1205
candidate:
  source_type: attack
  source_attack_id: T1205
  name: {zh: 流量信令, en: Traffic Signaling}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  disposition: reuse_and_extend_existing_cross_tactic_technique
  resulting_existing_technique_ref: NJT-0120
  rationale:
    paragraphs:
      - zh: >-
          Enterprise ATT&CK 19.1 将 T1205 同时映射到 Stealth、Persistence 与 Command and Control，并要求魔术值或信号序列触发隐藏端口、任务或控制功能。既有 NJT-0120“网络信号门控功能暴露”已经以攻击者控制的信号、匹配状态、隐藏→激活状态转变及后继监听/重定向/进程/控制会话为父行为，其内容直接覆盖 TA0011，不需要复制技术。
        en: >-
          Enterprise ATT&CK 19.1 maps T1205 to Stealth, Persistence, and Command and Control and requires a magic value or signal sequence to activate a hidden port, task, or control function. Existing NJT-0120 Network-Signal-Gated Function Exposure already defines the parent through an attacker-controlled signal, match state, hidden-to-active transition, and successor listener, diversion, process, or control session. Its content directly covers TA0011 and should not be duplicated.
      - zh: >-
          TA0011 应独立作 `adapt` 决策并复用 NJT-0120，因为 Niji 已有意把 ATT&CK 的产品/实现式 Port Knocking 与 Socket Filters 重构为“有状态信号序列激活”和“内容模式数据包激活”两个稳定 matcher 变量。对 TA0011 的额外门禁是后继结果必须建立可重复的 C2 监听、反向/入站会话或命令功能；只维持持久化、唤醒主机或执行一次本地任务的隐藏功能仍可属于 TA0005/Persistence，但不形成 TA0011 结论。
        en: >-
          TA0011 should record an independent `adapt` decision and reuse NJT-0120 because Niji deliberately rebuilt ATT&CK's implementation-shaped Port Knocking and Socket Filters into the stable matcher variables Stateful Signal-Sequence Activation and Content-Pattern Packet Activation. The additional TA0011 gate is a successor outcome establishing a repeatable C2 listener, reverse or inbound session, or command function. Hidden functionality that only preserves persistence, wakes a host, or executes one local task may remain relevant to TA0005 or Persistence but does not establish a TA0011 conclusion.
  scope_notes:
    zh: >-
      不改变父级或子级身份。正式集成应扩展 NJT-0120 的 tactic_refs，保留其创建设计 decision_ref，并新增 TA0011 自身的交叉战术决策指向同一 NJT。没有信号→匹配→C2 结果的连续链时，不得仅凭稀有包、开放端口、BPF/WFP 对象或魔术字符串标记 TA0011。
    en: >-
      Parent and child identities remain unchanged. Canonical integration should extend NJT-0120 tactic_refs, preserve its founding decision_ref, and add a separate TA0011 cross-tactic decision pointing to the same NJT. Without a continuous signal-to-match-to-C2-outcome chain, a rare packet, open port, BPF or WFP object, or magic string cannot establish TA0011.
reuse_assessment:
  parent:
    existing_ref: NJT-0120
    decision: reuse_extend_tactic_mapping
    content_revision: none_required
    classification_change:
      add_tactic_ref: TA0011
      preserve_decision_ref: DEC-TA0005-T1205
      reason:
        zh: >-
          现有定义、匿迹特性、范围、场景、攻防模型、机理和限制已经显式包含反向/入站控制会话与后继命令；TA0011 的窄门由新 tactic decision 表达，避免把父级中合法的持久化/本地动作范围删除。
        en: >-
          Existing definition, characteristics, scope, scenarios, threat models, mechanism, and limitations already cover reverse or inbound control sessions and successor commands. The narrower TA0011 gate belongs in the new tactic decision so valid persistence or local-action scope is not removed from the shared parent.
  children:
    - existing_ref: NJS-0120-001
      name: {zh: 有状态信号序列激活, en: Stateful Signal-Sequence Activation}
      decision: reuse_extend_evidence
      stable_variable: matcher_state_accumulated_across_ordered_network_events
      trace_change: individual_failed_or_dropped_attempts_precede_a_short_lived_listener_firewall_change_or_callback
      defender_observation_difference: requires_cross_packet_finite_state_reconstruction_then_host_and_session_join
      direct_c2_applicability:
        zh: >-
          cd00r 源码分析显示多个 TCP SYN 按预设端口顺序累计后启动 inetd root shell 并开放 5002/tcp；这直接满足信号后监听和交互 C2 结果，不只是持久化。
        en: >-
          cd00r source analysis shows several TCP SYN packets accumulating in a configured port order before starting an inetd root shell on TCP 5002. This directly establishes a post-signal listener and interactive C2 outcome rather than persistence alone.
      revision_needed:
        zh: >-
          taxonomy 和正文无需修改；现有证据仅有固定 ATT&CK 页面，应新增 cd00r 原始代码分析 REF/CASE，扩展本子项、CLM-000651、DET-000117、NJA-000105 与 MIT-000118 的证据引用。
        en: >-
          Taxonomy and reader prose need no change. Existing evidence is limited to the fixed ATT&CK page; add the original cd00r source analysis as a REF and CASE and extend evidence on this child, CLM-000651, DET-000117, NJA-000105, and MIT-000118.
    - existing_ref: NJS-0120-002
      name: {zh: 内容模式数据包激活, en: Content-Pattern Packet Activation}
      decision: reuse_extend_evidence
      stable_variable: one_packet_header_magic_or_payload_pattern_satisfies_the_initial_hidden_function_match
      trace_change: ordinary_or_closed_port_traffic_is_diverted_or_followed_by_a_listener_reverse_shell_or_command_path_only_after_match
      defender_observation_difference: requires_packet_content_or_header_to_filter_to_socket_or_callback_lineage
      direct_c2_applicability:
        zh: >-
          SYNful Knock 和 SprySOCKS 已直接证明字段/内容命中后暴露模块化 C2 或隐藏后门端口；BPFDoor 样本还显示魔术包可启动 bind shell、反向 shell 或来源限定重定向，因此 TA0011 结果门已经成立。
        en: >-
          SYNful Knock and SprySOCKS already establish modular C2 or a hidden backdoor port after a header or content match. BPFDoor additionally shows a magic packet starting a bind shell, reverse shell, or source-scoped redirection, satisfying the TA0011 outcome gate.
      revision_needed:
        zh: >-
          taxonomy 和正文无需修改；复用 REF-000453 并扩展其 locator/notes 到 BPF magic packet→shell，扩展 CASE-000170 subject_refs 以及本子项、CLM-000652、DET-000117、NJA-000126 与 MIT-000118 的证据引用。
        en: >-
          Taxonomy and reader prose need no change. Reuse REF-000453 and extend its locator and notes to BPF magic-packet-to-shell behavior, extend CASE-000170 subject_refs, and extend evidence on this child, CLM-000652, DET-000117, NJA-000126, and MIT-000118.
  fixed_attack_child_coverage:
    - attack_id: T1205.001
      attack_name: Port Knocking
      resolution: niji-variable-candidate
      niji_ref: NJS-0120-001
      reasoning:
        zh: >-
          ATT&CK 名称按实现表述；Niji 子项以跨多个事件的匹配状态为边界，可覆盖端口、标志或数据包序列而不复制 Port Knocking。
        en: >-
          ATT&CK's label is implementation-shaped. The Niji child is bounded by match state across multiple events and can cover port, flag, or packet sequences without copying Port Knocking.
    - attack_id: T1205.002
      attack_name: Socket Filters
      resolution: niji-variable-candidate
      niji_ref: NJS-0120-002
      reasoning:
        zh: >-
          ATT&CK 名称按实现组件表述；Niji 子项以一个包的头字段、魔数或载荷模式完成初始匹配为边界，不限定 libpcap、BPF、WFP 或 raw socket。
        en: >-
          ATT&CK's label is implementation-component-shaped. The Niji child is bounded by an initial match completed by one packet's header, magic value, or payload pattern and is not limited to libpcap, BPF, WFP, or raw sockets.
  taxonomy_conclusion:
    formal_child_count: 2
    new_children_required: 0
    narrative:
      zh: >-
        两个既有 NJS 由 matcher 是否跨事件保存状态决定，兄弟边界稳定且防御不可互换。C2 结果类型、协议、端口、过滤产品、listener 位置或正向/反向 shell 均为结果/实现属性，不应新增子项。TA0011 复用不会改变 taxonomy。
      en: >-
        The two existing NJS objects are separated by whether the matcher retains state across events, creating stable sibling boundaries and non-interchangeable defenses. C2 outcome type, protocol, port, filter product, listener location, and bind or reverse shell are outcome or implementation properties and should not create new children. TA0011 reuse does not change the taxonomy.
cross_technique_boundaries:
  - adjacent: T1095
    owner:
      zh: >-
        魔术/序列只拥有隐藏→激活；激活后持续 ICMP、raw TCP/UDP 或其他低层命令会话归 T1095，可并列但不把后继所有包纳入 T1205。
      en: >-
        The magic value or sequence owns only hidden-to-active transition. Continuing ICMP, raw TCP or UDP, or other lower-layer command sessions after activation belong to T1095 and may coexist, but all successor packets do not become T1205.
  - adjacent: T1571
    owner:
      zh: >-
        服务或 C2 使用非典型端口的配对归 T1571；被敲击的端口、隐藏 shell 高位端口或表面 443 端口都不是 T1205 子项。
      en: >-
        T1571 owns atypical protocol-to-port pairing. Knocked ports, a hidden shell's high port, or an apparent port 443 do not define a T1205 child.
  - adjacent: T1090
    owner:
      zh: >-
        匹配后把流量重定向至隐藏 socket 是激活结果；若后继通过一个或多个中间节点转发到控制端，路径中介关系归 T1090。
      en: >-
        Diverting matched traffic to a hidden socket is an activation result. If the successor path forwards through one or more intermediary nodes to a controller, T1090 owns the path-intermediary relationship.
  - adjacent: T1104
    owner:
      zh: >-
        信号后建立另一操作通道只有在第一信号通道与后继通道被赋予不同阶段角色时才可并列 T1104；普通激活包和其 C2 会话不是自动的多阶段编排。
      en: >-
        A separate operational channel after signaling coexists with T1104 only where the signal channel and successor channel have distinct stage roles. An ordinary activation packet plus its C2 session is not automatically multistage orchestration.
  - adjacent: persistence_only_hidden_function
    owner:
      zh: >-
        只唤醒主机、执行一次本地任务、改变植入模块或维持隐藏后门可用性而没有可重复 C2 会话时，保留 TA0005/Persistence 适用性但不扩展到 TA0011。
      en: >-
        Waking a host, executing one local task, changing an implant module, or preserving hidden-backdoor availability without a repeatable C2 session remains applicable to TA0005 or Persistence and does not extend to TA0011.
defense_reuse_decisions:
  strategy:
    existing_ref: DET-000117
    decision: reuse_extend_evidence_only
    semantic_assessment:
      zh: >-
        现有目标已经要求信号流量、过滤/防火墙状态、隐藏功能激活与后继反向/入站会话形成链，正是 TA0011 所需的 C2 结果门。detects_refs 指向共享 NJT/NJS，无需按战术新增 Strategy。
      en: >-
        The existing objective already requires a chain among signal traffic, filter or firewall state, hidden-function activation, and a successor reverse or inbound session, exactly the C2 outcome gate needed by TA0011. Its detects_refs point to shared NJT and NJS objects, so no tactic-specific Strategy is needed.
    proposed_extension:
      add_evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP]
      logic_change: none
  analytics:
    - existing_ref: NJA-000105
      decision: reuse_extend_evidence_and_source_mapping
      semantic_assessment:
        zh: >-
          有限状态机、完整顺序后 ACL/监听/进程/反向或入站会话的判定已直接覆盖端口序列触发 C2；无需新 Analytic。
        en: >-
          Its finite-state machine and decision on ACL, listener, process, reverse, or inbound session after a complete sequence directly cover sequence-triggered C2; no new Analytic is needed.
      source_mapping_extensions:
        - source: Zeek_conn_log
          fields: [ts, uid, id.orig_h, id.orig_p, id.resp_h, id.resp_p, proto, conn_state, history, orig_pkts, resp_pkts]
          use: Retain failed or rejected connection attempts and order them by source and target; `sequence.state` and `sequence.position` are derived analytic fields rather than raw Zeek fields.
        - source: Windows_WFP_events_5152_5157_5154_5158
          fields: [TimeCreated, EventID, ProcessID, Application, Direction, SourceAddress, SourcePort, DestAddress, DestPort, Protocol, FilterRTID, LayerName, LayerRTID]
          use: Preserve blocked packet/connection and later listen/bind or allowed connection state; WFP auditing must be enabled and filter IDs can change.
        - source: endpoint_process_network
          fields: [timestamp, asset_id, process_start_key, parent_process_start_key, executable, local_address, local_port, remote_address, remote_port, direction, session_id]
          use: Join state completion to listener or callback and command outcome.
      proposed_extension:
        add_evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP, B4-T1205-REF-SYSMON-REUSE]
    - existing_ref: NJA-000126
      decision: reuse_extend_evidence_and_source_mapping
      semantic_assessment:
        zh: >-
          现有逻辑已要求单包头/内容、filter、重定向 socket/进程和响应/命令闭环，并明确不能从魔数单独定性；直接适用于 SYNful Knock、SprySOCKS 与 BPFDoor。
        en: >-
          Existing logic already closes the loop among one-packet header or content, filter, diverted socket or process, and response or commands, and explicitly rejects verdicts based on a magic value alone. It directly applies to SYNful Knock, SprySOCKS, and BPFDoor.
      source_mapping_extensions:
        - source: Suricata_or_full_packet_capture
          fields: [timestamp, flow_id, src_ip, src_port, dest_ip, dest_port, proto, tcp_flags, tcp_seq, tcp_ack, icmp_type, icmp_code, icmp_id, icmp_seq, dsize, payload_or_packet_ref]
          use: Parse raw signal fields and retain the triggering packet. `payload.magic_value` and `options_hash` are derived from packet bytes, not assumed native EVE fields.
        - source: WFP_or_BPF_filter_inventory_and_audit
          fields: [timestamp, host_id, filter_id, filter_origin, layer_id, action, writer_or_module, source_selector, destination_selector, target_socket_or_redirect]
          use: Join a content match or filter change to a hidden receiver; availability varies and a kernel adversary may conceal it.
        - source: firewall_NAT_and_socket_lineage
          fields: [timestamp, rule_id, conntrack_id, source_ip, pre_nat_destination, post_nat_destination, process_start_key, executable_hash, session_result]
          use: Distinguish ordinary service from source-scoped redirection and prove the C2 receiver.
      proposed_extension:
        add_evidence_keys: [B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-SURICATA-REUSE, B4-T1205-REF-WFP]
  mitigation:
    existing_ref: MIT-000118
    decision: reuse_extend_evidence_only
    semantic_assessment:
      zh: >-
        既有限制 filter/firewall/listener 写入、保存丢弃和未建立包、关联规则/监听/进程并隔离未批准短暂会话的措施，同时适用于 Stealth 与 C2 结果，不需新增 tactic-specific Application，因为目标仍是同一 NJT/NJS。
      en: >-
        Existing measures restrict filter, firewall, and listener writes, preserve dropped and non-established packets, join rules, listeners, and processes, and isolate unauthorized transient sessions. They apply to both stealth and C2 outcomes. No tactic-specific Application is needed because the targets remain the same NJT and NJS objects.
    proposed_extension:
      add_evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-WFP]
      measure_change: none
  false_positives:
    - zh: >-
        合法 knockd/SPA、动态防火墙自动化、远程支持唤醒、健康检查、负载均衡/DPI/WFP/BPF 安全产品、扫描和网络测量
      en: >-
        Legitimate knockd or SPA, dynamic firewall automation, remote-support wakeup, health checks, load balancing, DPI, WFP or BPF security products, scanning, and network measurement
  blind_spots:
    - zh: >-
        边界提前丢弃、只保留成功连接、NAT 合并来源、分组采样、加密/分片、硬件卸载、无 filter/socket 清单、内核植入篡改证据
      en: >-
        Edge pre-drop, successful-connection-only retention, NAT source collapse, packet sampling, encryption or fragmentation, hardware offload, absent filter or socket inventory, and kernel implants tampering with evidence
  tuning_principle:
    zh: >-
      信号稀有度只用于检索。高置信必须至少包含信号匹配、同目标隐藏→激活变化以及后继可重复 C2 会话/命令结果。窗口取自实现 matcher 超时和合法自动化，而非固定通用值；合法例外绑定 owner、目标、序列/内容、用途和到期。
    en: >-
      Signal rarity is only a search aid. High confidence requires signal match, a hidden-to-active change on the same target, and a successor repeatable C2 session or command outcome. Windows come from matcher timeout and legitimate automation rather than a universal constant. Legitimate exceptions bind owner, target, sequence or content, purpose, and expiry.
shared_library_resolutions:
  existing_reuse:
    reference_refs: [REF-000408, REF-000440, REF-000441, REF-000453, REF-000634, REF-000230, REF-001040]
    claim_refs: [CLM-000615, CLM-000616, CLM-000651, CLM-000652]
    case_refs: [CASE-000162, CASE-000163, CASE-000170]
    strategy_refs: [DET-000117]
    analytic_refs: [NJA-000105, NJA-000126]
    mitigation_refs: [MIT-000118]
  candidates:
    references:
      - key: B4-T1205-REF-ATTACK-REUSE
        reuse_ref: REF-000408
        title: Traffic Signaling Technique T1205
        url: https://attack.mitre.org/versions/v19/techniques/T1205/
        locator: Fixed 19.1 parent, T1205.001/.002 coverage, TA0011 mapping, procedures and detection
        resolution: reuse
      - key: B4-T1205-REF-SYNFUL-REUSE
        reuse_ref: REF-000440
        title: SYNful Knock A Cisco Router Implant Part I
        url: https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/
        locator: crafted SYN, sequence/ack differential, successor command packet and modular C2
        resolution: reuse
      - key: B4-T1205-REF-SPRYSOCKS-REUSE
        reuse_ref: REF-000441
        title: FishMonger's Arsenal Upgraded SprySOCKS for Windows
        url: https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/
        locator: WFP content filter, crafted pattern, hidden random backdoor port and protocol magic values
        resolution: reuse
      - key: B4-T1205-REF-BPFDOOR-REUSE
        reuse_ref: REF-000453
        title: BPFDoor An Evasive Linux Backdoor Technical Analysis
        url: https://sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis
        locator_extension: BPF filter and magic packet; bind-shell or connect-back choice; iptables source-scoped redirect; RC4-disabled demonstration limitation
        resolution: extend_existing_reference
      - key: B4-T1205-REF-CD00R
        title: Get a Handle on cd00r The Invisible Backdoor
        author: Greg Hartrell GIAC SANS
        url: https://www.giac.org/paper/gcih/342/handle-cd00r-invisible-backdoor/103631
        locator: source-code analysis; configurable ordered TCP SYN ports; sentinel reset on wrong order; successful sequence starts inetd root shell on TCP 5002
        resolution: create_reference
      - key: B4-T1205-REF-ZEEK-CONN-REUSE
        reuse_ref: REF-000634
        title: Zeek conn.log
        url: https://docs.zeek.org/en/v6.0.9/logs/conn.html
        locator: ts, uid, tuple, proto/service, conn_state, history, packet and byte counts
        resolution: reuse
      - key: B4-T1205-REF-SYSMON-REUSE
        reuse_ref: REF-000230
        title: Sysmon System Activity
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        locator: Event 1 ProcessGuid and parent, Event 3 process network connection; Event 3 disabled by default
        resolution: reuse
      - key: B4-T1205-REF-SURICATA-REUSE
        reuse_ref: REF-001040
        title: Suricata packet header keywords
        url: https://docs.suricata.io/en/latest/rules/header-keywords.html
        locator_extension: ICMP type/code/id/sequence and dsize plus TCP flags/seq/ack packet matching where documented
        resolution: extend_existing_reference
      - key: B4-T1205-REF-WFP
        title: Windows Filtering Platform Auditing and Event 5157 Fields
        author: Microsoft
        url: https://learn.microsoft.com/en-us/windows/win32/fwp/auditing-and-logging
        locator: WFP 5152/5153 packet drops, 5154/5155 listen, 5156/5157 connections and 5158/5159 bind; pair with event-5157 field documentation for Application, Direction, addresses, ports, Protocol, FilterRTID and LayerRTID
        supporting_url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5157
        resolution: create_reference
    cases:
      - key: B4-T1205-CASE-CD00R
        name: cd00r ordered SYN sequence opening a root shell
        central_fact: Source analysis shows ordered SYN packets to configurable ports 200, 80, 22, 53 and 3 update a sentinel and, when complete, spawn inetd with an unrestricted root shell on TCP 5002
        target_existing_refs: [NJT-0120, NJS-0120-001]
        evidence_keys: [B4-T1205-REF-CD00R]
        confidence: high
        scope_limit: Source-code analysis and a worked hypothetical incident demonstrate capability; they do not establish a named in-the-wild victim or measured alert bypass
        resolution: create_case
      - existing_ref: CASE-000170
        resolution: extend_subject_refs
        add_subject_refs: [NJT-0120, NJS-0120-002]
        reason: The existing case already records BPFDoor magic-packet match, hidden shell activation and source-scoped redirect, so a duplicate T1205 case is unnecessary
    claims:
      - existing_ref: CLM-000651
        resolution: extend_evidence
        add_evidence_keys: [B4-T1205-REF-CD00R]
        reason: cd00r directly supports the existing stateful-sequence proposition and C2 outcome
      - existing_ref: CLM-000652
        resolution: extend_evidence
        add_evidence_keys: [B4-T1205-REF-BPFDOOR-REUSE]
        reason: BPFDoor directly supports one-packet magic matching, filter activation and hidden socket/shell outcome
    defenses:
      - {existing_ref: DET-000117, resolution: extend_evidence, evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP]}
      - {existing_ref: NJA-000105, resolution: extend_evidence_and_document_source_mapping, evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP, B4-T1205-REF-SYSMON-REUSE]}
      - {existing_ref: NJA-000126, resolution: extend_evidence_and_document_source_mapping, evidence_keys: [B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-SURICATA-REUSE, B4-T1205-REF-WFP]}
      - {existing_ref: MIT-000118, resolution: extend_evidence, evidence_keys: [B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-WFP]}
canonical_change_plan_for_primary_agent:
  create_tactic_decision:
    tactic_ref: TA0011
    source_attack_id: T1205
    decision: adapt
    resulting_technique_ref: NJT-0120
    confidence: high
    lifecycle_status: review
    rationale:
      zh: >-
        TA0011 复用现有攻击适配父级；只有信号匹配后出现可重复 C2 监听、反向/入站会话或命令功能时计入 Command and Control。
      en: >-
        TA0011 reuses the existing attack-adapted parent and counts it as Command and Control only when signal matching produces a repeatable C2 listener, reverse or inbound session, or command function.
    scope_notes:
      zh: >-
        persistence-only 隐藏功能、Wake-on-LAN 和一次本地任务不形成 TA0011；失败备用、后继低层会话、非标准端口、代理和多阶段角色分别交给相邻对象。
      en: >-
        Persistence-only hidden functionality, Wake-on-LAN, and one local task do not establish TA0011. Failure fallback, continuing lower-layer sessions, non-standard ports, proxies, and multistage roles remain with adjacent objects.
    evidence_keys: [B4-T1205-REF-ATTACK-REUSE, B4-T1205-REF-CD00R, B4-T1205-REF-SYNFUL-REUSE, B4-T1205-REF-SPRYSOCKS-REUSE, B4-T1205-REF-BPFDOOR-REUSE]
