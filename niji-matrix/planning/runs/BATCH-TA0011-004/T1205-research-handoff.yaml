    en: >-
      Mark the TA0011 candidate complete and point it to reused NJT-0120. Keep every extended object at review after quality, bundle, and Web gates pending human domain review.
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids: [T1205.001, T1205.002]
    represented_dimensions: [ordered_closed_port_or_packet_sequence, socket_or_packet_filter_content_match]
    breadth_trigger: ordinary_with_itemized_fixed_child_coverage
    coverage_resolutions:
      - {attack_id: T1205.001, resolution: niji-variable-candidate, niji_ref: NJS-0120-001, reason: Existing child generalizes port knocking into any ordered multi-event matcher state and is not a copied ATT&CK label.}
      - {attack_id: T1205.002, resolution: niji-variable-candidate, niji_ref: NJS-0120-002, reason: Existing child generalizes socket-filter implementations into one-packet field/content matching and filter-to-socket lineage.}
    candidate_stealth_axes_examined:
      - axis: matcher_state_cardinality_and_memory
        result: established_existing_taxonomy
        children: [NJS-0120-001, NJS-0120-002]
        reason: Multiple-event state and one-packet content matching change traces and require different analytics; cd00r versus SYNful/SprySOCKS/BPFDoor directly support the split.
      - axis: successor_C2_outcome_type
        result: parent-core_and_tactic_gate
        reason: Listener, reverse shell, inbound shell, traffic diversion and command function prove TA0011 applicability but do not alter the signal matcher.
      - axis: packet_protocol_or_port
        result: not-stealth-distinct
        reason: TCP, UDP, ICMP, open/closed/common/high ports are implementations and can appear under either matcher state.
      - axis: filter_product_or_technology
        result: not-stealth-distinct
        reason: libpcap, BPF, WFP, raw sockets and router image hooks implement observation or diversion without changing the initial match variable.
      - axis: continuing_lower_layer_session
        result: adjacent-technique
        owner: T1095
        reason: After activation, ongoing raw protocol task/result traffic is a separate communication-carriage variable.
      - axis: failure_or_block_triggered_path
        result: adjacent-technique
        owner: NJT-0153
        reason: Failure-driven path selection is different from matching a secret network signal to expose functionality.
      - axis: stage_role_handoff
        result: adjacent-technique
        owner: T1104
        reason: Signaling plus successor session is not multistage unless distinct channel roles and a deliberate stage transition are evidenced.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    new_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定两项子技术已由现有 Niji matcher 状态 taxonomy 完整覆盖，且新补 cd00r/BPFDoor 证据直接确认两边的 C2 结果。协议、端口、产品和后继结果类型不会成为新 NJS。
      en: >-
        The two fixed children are fully covered by the existing Niji matcher-state taxonomy, and added cd00r and BPFDoor evidence directly confirms C2 outcomes on each side. Protocol, port, product, and successor-outcome type do not become new NJS objects.
  evidence_coverage:
    parent_behavior_keys: [B4-T1205-REF-ATTACK-REUSE, B4-T1205-REF-CD00R, B4-T1205-REF-SYNFUL-REUSE, B4-T1205-REF-SPRYSOCKS-REUSE, B4-T1205-REF-BPFDOOR-REUSE]
    boundary_keys: [B4-T1205-REF-ATTACK-REUSE, B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE]
    mechanism_support:
      - {mechanism: NM-BT, keys: [B4-T1205-REF-CD00R, B4-T1205-REF-SYNFUL-REUSE, B4-T1205-REF-SPRYSOCKS-REUSE, B4-T1205-REF-BPFDOOR-REUSE], level: direct_source_or_sample_analysis_of_hidden_to_active_gate}
    child_existence_support:
      - {child_ref: NJS-0120-001, keys: [B4-T1205-REF-ATTACK-REUSE, B4-T1205-REF-CD00R]}
      - {child_ref: NJS-0120-002, keys: [B4-T1205-REF-SYNFUL-REUSE, B4-T1205-REF-SPRYSOCKS-REUSE, B4-T1205-REF-BPFDOOR-REUSE]}
    defense_support:
      - {object_ref: DET-000117, keys: [B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP, B4-T1205-REF-SURICATA-REUSE, B4-T1205-REF-SYSMON-REUSE]}
      - {object_ref: NJA-000105, keys: [B4-T1205-REF-CD00R, B4-T1205-REF-ZEEK-CONN-REUSE, B4-T1205-REF-WFP, B4-T1205-REF-SYSMON-REUSE]}
      - {object_ref: NJA-000126, keys: [B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-SURICATA-REUSE, B4-T1205-REF-WFP]}
      - {object_ref: MIT-000118, keys: [B4-T1205-REF-CD00R, B4-T1205-REF-BPFDOOR-REUSE, B4-T1205-REF-WFP]}
    unsupported_or_deferred:
      - The cd00r paper directly analyzes source and demonstrates logic through a worked scenario, but does not document a named in-the-wild victim.
      - Sandfly reverse-engineers BPFDoor and reproduces shell activation; RC4 was disabled for one plaintext demonstration, which is not an operational network signature.
      - REF-000441 is post-baseline Niji evidence for the stable content-match variable and does not change the fixed Enterprise 19.1 child inventory.
      - No source supplies universal sequence timeout, packet size, port set, magic value or false-positive rate.
      - WFP audit availability depends on policy and does not expose every malicious kernel filter; a compromised kernel can conceal filters or socket lineage.
      - Zeek conn.log and flow telemetry can preserve failed attempts but cannot recover packet content required by the one-packet analytic without PCAP or packet sensor data.
  content_depth_review:
    compared_with_njt_0001: true
    parent_field_responsibilities_complete: true
    child_field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    no_content_rewrite_required: true
    notes:
      zh: >-
        NJT-0120 与两项 NJS 已覆盖定义、状态/内容变量、残余痕迹、正常反例、场景、攻防模型、机理、防御和限制。TA0011 的差异是战术结果门而非技术/子技术语义差，写入独立 decision 即可；补充证据修复 NJS-0120-001 只有 ATT&CK 基线的弱点。
      en: >-
        NJT-0120 and both NJS objects already cover definition, state or content variables, residual traces, normal counterexamples, scenarios, threat models, mechanism, defense, and limitations. TA0011 differs through a tactic outcome gate rather than Technique or child semantics, so an independent decision is sufficient. Added evidence fixes the weakness that NJS-0120-001 relied only on the ATT&CK baseline.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [fixed_STIX_query, existing_object_inventory, exact_URL_duplicate_search, YAML_and_evidence_key_validation]
  limitations:
    paragraphs:
      - zh: >-
          此交接确认复用语义与需要扩展的证据，不等于已经对正式 NJT/DET/NJA/MIT 执行写入或测试。主 Agent 必须在五候选边界收敛后统一扩展 tactic_refs、DEC、REF/CASE/Claim 和 defense evidence，并重新通过 Schema、共享库查重、Bundle 与双语 Web。
        en: >-
          This handoff confirms reuse semantics and evidence extensions but does not write or test canonical NJT, DET, NJA, or MIT objects. After five-candidate boundary convergence, the primary agent must centrally extend tactic_refs, the tactic decision, REF, CASE, Claim, and defense evidence and rerun schema, shared-library duplicate, bundle, and bilingual Web gates.
      - zh: >-
          流量信令的正常反例和观察盲区很大，尤其是合法 knockd/SPA、WFP/BPF 安全软件、负载均衡、动态防火墙和网络测量。TA0011 结论必须保留后继控制会话/命令结果；仅从端口序列、magic bytes、过滤器存在或 listener 短暂出现不能推断 C2，也不能从一次 bind/reverse shell 样本推广通用阈值。
        en: >-
          Traffic signaling has broad normal counterexamples and observation gaps, especially legitimate knockd or SPA, WFP or BPF security software, load balancing, dynamic firewalls, and network measurement. TA0011 conclusions must retain a successor control session or command outcome. A port sequence, magic bytes, filter presence, or brief listener alone cannot establish C2, and one bind or reverse-shell sample cannot supply universal thresholds.
  rejected_new_objects:
    - type: technique
      reason: Existing NJT-0120 fully owns the parent behavior and already maps to ATT&CK T1205 19.1.
    - type: evasion-subtechnique
      reason: Existing matcher-state children remain stable, non-overlapping and directly C2-applicable after evidence extension.
    - type: detection-strategy
      reason: DET-000117 already has the exact signal→activation→session objective and shared target subjects.
    - type: detection-analytic
      reason: NJA-000105 and NJA-000126 already split cross-packet state versus one-packet content/filter logic; only source mappings/evidence need extension.
    - type: mitigation
      reason: MIT-000118 already governs filter/listener integrity and full-traffic-to-process lineage for the same subjects.
  open_questions:
    - Does primary review prefer extending REF-000453 locator/notes in place or preserving its current firewall/history locator and citing the same REF with source section details in review notes?
    - Can the deployed packet sensor retain closed-port and dropped-packet sequences for the matcher lifetime without sampling away sequence elements?
    - Are WFP 5152/5157 and listen/bind audits enabled on relevant Windows servers, and is there an equivalent BPF/filter inventory on Linux and network appliances?
    - Should CASE-000170's existing firewall-impairment subjects be extended to NJT-0120/NJS-0120-002, or should a narrower activation-only CASE be split to avoid an overly broad central fact?
