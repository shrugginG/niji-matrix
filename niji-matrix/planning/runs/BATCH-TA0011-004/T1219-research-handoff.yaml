    parent_behavior_keys: [REF-000625, B4-T1219-REF-DIGITAL-EYE, B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031, B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM]
    boundary_keys: [REF-000625, REF-000031, B4-T1219-REF-VSCODE-TUNNELS, B4-T1219-REF-QUICK-ASSIST-DOC, B4-T1219-REF-CISA-REMOTE-ACCESS-GUIDE]
    mechanism_support:
      - {mechanism: NM-FD, evidence_keys: [B4-T1219-REF-DIGITAL-EYE, B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031]}
      - {mechanism: NM-BT, evidence_keys: [B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM]}
    child_existence_support:
      - {child_key: B4-T1219-NJS-CONTROLLER-REBIND, evidence_keys: [B4-T1219-REF-DIGITAL-EYE, REF-000031, B4-T1219-REF-DEVTUNNEL-POLICY]}
      - {child_key: B4-T1219-NJS-WORKFLOW-DETACHED, evidence_keys: [B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031, B4-T1219-REF-QUICK-ASSIST-DOC]}
      - {child_key: B4-T1219-NJS-OOB-OBSERVATION, evidence_keys: [B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM]}
    unsupported_or_deferred:
      - signed binary vendor domain or installed agent alone proves malicious remote control
      - missing ticket or user consent alone proves attack
      - valid account or risky sign-in substitutes for remote-control session outcome
      - existing-session owner transition absorbed from NJT-0151
      - tunnel or proxy path absorbed from T1090 or T1572
      - product vendor GUI CLI or hardware model used as a Niji child
      - HID or KVM presence without remote controller session and outcome
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级覆盖交互 session 结果门、可信产品外观、三平面残迹、五组相邻边界、软件/IDE/Quick Assist/KVM 场景、攻防前提、日志权限和普通 helpdesk/IDE/KVM 反例；三项子候选各有独立变量、观察差和 defense。
      en: The parent covers the interactive-session outcome gate, trusted-product appearance, three-plane residue, five adjacent boundary groups, software, IDE, Quick Assist, and KVM scenarios, attacker and defender prerequisites, log authority, and ordinary help desk, IDE, and KVM counterexamples. Each child has an independent variable, observation differential, and defense.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML syntax validation, temporary-reference closure validation, canonical-reference resolution]
  limitations:
    paragraphs:
      - zh: >-
          证据强度不均。Digital Eye 直接观察 VS Code tunnel 建立、GitHub 认证和浏览器访问，但未公开 provider session audit；Quick Assist 报告直接连接 social engineering、真实 consent、session 与后继 RMM/ransomware，但产品文档说明 endpoint 不保留详细 session/action 日志；Scattered Spider 公告支持 helpdesk/RMM 工作流却未逐 session 展示 controller ID。正式 Analytic 必须保留 provider_only、session_candidate、controller_unresolved 等中间结论。
        en: >-
          Evidence strength varies. Digital Eye directly observes VS Code tunnel creation, GitHub authentication, and browser access but publishes no provider-session audit. Quick Assist reporting directly connects social engineering, real consent, session, and later RMM or ransomware, while product documentation states that endpoints retain no detailed session or action logs. Scattered Spider reporting supports help desk and RMM workflow but does not disclose controller ID per session. Formal analytics must retain intermediate states such as provider_only, session_candidate, and controller_unresolved.
      - zh: >-
          DPRK IT worker 来源直接证明 IP-KVM/laptop farm/远管工具组合与一次 Microsoft 数据窃取案例，但没有公开完整 hardware serial—USB attributes—MAC/switch—KVM controller/session—host action 链。host 可能只见 HID，HDMI capture 可能完全不可见，device identity 也可伪造。因此 OOB high 只表示变量与现场行为成立，不表示单个 PnP/OUI 足以归因；检测必须组合 hardware/network/identity/custody/outcome。
        en: >-
          DPRK IT-worker sources directly establish IP-KVM, laptop-farm, and remote-tool combinations plus one Microsoft data-theft case, but publish no complete hardware-serial-to-USB-attributes-to-MAC-or-switch-to-KVM-controller-or-session-to-host-action chain. A host may see only HID, HDMI capture may be entirely invisible, and device identity can be spoofed. OOB high confidence establishes the variable and field behavior rather than making one PnP or OUI sufficient for attribution; detection requires hardware, network, identity, custody, and outcome together.
      - zh: >-
          所提 provider audit 字段是跨 vendor 规范模型，不保证每个 RMM/IDE/hardware 平台全部提供。Quick Assist 只短期保留少量 health 数据，GitHub/Microsoft 或 attacker RMM tenant 也可能不受受害组织控制。24 小时、30 日和 180 日窗口是工程起点，来源无通用阈值/误报率。正式 NJA 应为每个 provider 建 verified field map，缺失数据降低结论，不用 ticket absence 或 signed-agent execution 填补。
        en: >-
          Proposed provider-audit fields are a cross-vendor normalized model and are not guaranteed on every RMM, IDE, or hardware platform. Quick Assist retains only small health data briefly, and GitHub, Microsoft, or an attacker RMM tenant may be outside victim control. Twenty-four-hour, thirty-day, and 180-day windows are engineering starting points with no universal thresholds or false-positive rates in sources. A formal NJA must maintain a verified field map per provider, lower conclusions when data is absent, and never fill gaps with ticket absence or signed-agent execution.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason:
        zh: vendor relay/tunnel 会分离操作者与 target 网络来源，但该路径变量由 T1090/T1572 研究；T1219 正式机理聚焦 trusted product/workflow 和 host observation gap，避免重复。
        en: Vendor relays or tunnels separate operator from target network origin, but that path variable is studied under T1090 or T1572. T1219 formal mechanisms focus on trusted product or workflow and the host-observation gap to avoid duplication.
    - mechanism_ref: NM-DO
      reason:
        zh: 远控通道不必改变消息/内容表示；加密、编码或内容隐藏由相邻技术承担。
        en: A remote-control channel need not change message or content representation; encryption, encoding, or content concealment belongs to adjacent techniques.
  open_questions:
    - 主 Agent决定是否保留三个 formal NJS；若 OOB 轴与 T1200/NJS-0071-003 防御差无法清晰保留，应维持 parent-core，但不能按 hardware 标签机械导入。
    - MIT-000155 与 DET-000094 已完成不复用决议；只在真实 existing-session hijack 或 session-state replay 事件中并列。
    - REF-000031 已含 Scattered Spider RMM/helpdesk locator，可直接复用；其 case/claim 若扩展必须保持 identity/social-engineering 与 T1219 session outcome 的层级差。
    - provider/RMM audit schema 应在正式写入前为选定产品建立字段映射；当前 generic model 不能伪装成所有供应商的保证字段。
