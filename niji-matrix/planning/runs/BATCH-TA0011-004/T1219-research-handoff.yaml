handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-004
work_item_ref: WORK-TA0011-T1219
temporary_key_prefix: B4-T1219
candidate:
  source_type: attack
  source_attack_id: T1219
  name: {zh: 远程访问工具, en: Remote Access Tools}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          保留 T1219，因为真实事件证明攻击者会用合法远控软件、IDE 远程开发服务和 IP-KVM 建立具交互能力的控制通道。SentinelLabs/Tinexta 在 Operation Digital Eye 直接观察攻击者以 Microsoft 签名的 VS Code 和 GitHub 账号建立 dev tunnel 并从 vscode.dev 控制目标；Microsoft 观察 Storm-1811 冒充帮助台诱使用户批准 Quick Assist 后投放更多 RMM 与勒索组件；Mandiant 和 Microsoft 的 DPRK IT worker 调查又记录 IP-KVM 与多种远管工具控制公司设备。这些行为共享“合法远控能力承载未授权操作者”的父语义。
        en: >-
          Retain T1219 because field incidents establish adversaries using legitimate remote-control software, IDE remote-development services, and IP-KVM devices to create interactive control channels. SentinelLabs and Tinexta directly observed Operation Digital Eye actors establishing a dev tunnel with Microsoft-signed VS Code and GitHub accounts and controlling targets from vscode.dev. Microsoft observed Storm-1811 impersonating help desk staff to obtain Quick Assist approval before deploying additional RMM and ransomware components. Mandiant and Microsoft DPRK IT-worker investigations separately record IP-KVM and multiple remote-management tools controlling corporate devices. These behaviors share a parent meaning of legitimate remote-control capability carrying an unauthorized operator.
      - zh: >-
          采用 adapt，因为固定 T1219.001/.002/.003 按 IDE、桌面软件和硬件实现分组，而 Niji 子项应跨实现按控制归属、批准工作流和观察面划分。正式范围要求远控产品/服务/硬件形成实际交互会话或持续控制能力，并把 controller、target 与结果连接；只安装工具、登录 vendor portal、存在 KVM 或使用有效账号不足。建议三项原生变量：控制端命名空间重绑定、批准工作流脱离的受信会话、以及控制平面移出宿主 OS 的观察置换。
        en: >-
          Adapt because fixed T1219.001, .002, and .003 group IDE, desktop software, and hardware implementations, while Niji children should cut across implementations by controller ownership, approval workflow, and observation plane. Formal scope requires the remote-control product, service, or hardware to form an actual interactive session or continuing control capability and join controller, target, and outcome. Tool installation, vendor-portal login, KVM presence, or a valid account alone is insufficient. Three native variables are proposed: controller-namespace rebinding, a trusted session detached from approval workflow, and observation displacement when the control plane sits outside the host OS.
proposed_content:
  summary:
    zh: 攻击者滥用合法远控软件、开发隧道或带外控制设备建立交互通道，使受信代理、服务工作流或宿主外控制平面掩盖真实操作者。
    en: Adversaries abuse legitimate remote-control software, development tunnels, or out-of-band control devices to establish interactive channels in which a trusted agent, service workflow, or off-host control plane obscures the real operator.
  aliases: [Remote Access Software, Remote Desktop Software, IDE Tunneling, Remote Access Hardware, T1219]
  classification:
    tactic_refs: [TA0011]
    origin: {kind: attack-adapted, source_attack_id: T1219, source_attack_version: '19.1'}
    decision_key: B4-T1219-DECISION
  definition_and_concept:
    paragraphs:
      - zh: >-
          合法远控通道滥用是攻击者让商业/开源远程支持代理、IDE tunnel、远程开发服务、浏览器协助工具、EDR 响应功能或网络 KVM 等真实管理能力，在目标与攻击者控制端之间建立可查看、输入、终端、文件或调试操作的交互关系。工具可以既有、便携安装、由用户启动、作为服务持久化或位于宿主之外。直接目的在于以产品原生会话持续操控目标，而不是仅转发任意字节或完成一次命令。
        en: >-
          Legitimate Remote-Control Channel Abuse is adversary use of a genuine management capability such as a commercial or open-source remote-support agent, IDE tunnel, remote-development service, browser assistance tool, EDR response feature, or network KVM to establish an interactive relationship for viewing, input, terminal, file, or debugging operations between target and attacker controller. The capability may be preexisting, portably installed, user-started, service-persistent, or located outside the host. Its direct purpose is continuing control through a product-native session rather than merely forwarding arbitrary bytes or completing one command.
      - zh: >-
          判定至少需要 target、remote-control capability、controller/session 和可核查结果。agent/service/tunnel/device 的安装或注册只是暴露或准备；vendor 登录只证明控制面访问；外联到知名远控域只证明网络关系；必须进一步看到 session 建立、输入/terminal/file/debug 功能被启用或由该 session 产生的目标动作。产品签名、合法 vendor 和真实用户同意均不是自动授权，需与组织控制命名空间及工单/同意流程比较。
        en: >-
          Classification requires at least a target, remote-control capability, controller or session, and a reviewable outcome. Installation or registration of an agent, service, tunnel, or device is exposure or preparation; vendor login establishes control-plane access only; egress to a known remote-tool domain establishes a network relationship only. A session must then be established, an input, terminal, file, or debug capability enabled, or a target action produced by that session. Product signature, legitimate vendor, and real user consent do not automatically establish organizational authorization and must be compared with approved controller namespaces and ticket or consent workflow.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          合法远控通道保留真实签名、vendor relay、加密协议和常见支持/开发进程，因此端点与边界可把会话解释为帮助台、MSP、开发或设备运维。攻击者若把目标绑定到其 GitHub/Microsoft/RMM tenant、使用一次性 Quick Assist code 或控制 IP-KVM，实际操作者不会直接呈现为恶意 C2 域。粗粒度 application allowlist、vendor reputation 和 agent 进程白名单失去区分，真实 controller account/tenant/device 与 workflow approval 才是关键差异。
        en: >-
          A legitimate remote-control channel preserves real signatures, vendor relays, encrypted protocols, and common support or development processes, so endpoint and boundary views may interpret it as help desk, MSP, development, or device operations. When an actor binds a target to an attacker GitHub, Microsoft, or RMM tenant, uses a one-time Quick Assist code, or controls an IP-KVM, the real operator does not appear as a malicious C2 domain. Coarse application allowlists, vendor reputation, and agent-process exclusions lose discrimination; real controller account, tenant, or device plus workflow approval provide the critical difference.
      - zh: >-
          残余痕迹分布在不同平面。软件/IDE 分支留下安装或 portable execution、service/autorun、agent/device/tunnel ID、controller identity、provider session、outbound relay、子进程、文件和终端动作；硬件分支可能没有宿主远控进程，却会留下新 HID/video/USB/EDID、IP/MAC/交换端口、KVM 管理登录及看似本地的输入结果。若 provider 只短期保留或不向客户暴露 controller/session，宿主日志只见签名代理，会形成重要盲区。
        en: >-
          Residual evidence is distributed across planes. Software and IDE branches leave install or portable execution, service or autorun, agent, device, or tunnel ID, controller identity, provider session, outbound relay, child process, file, and terminal action. The hardware branch may have no host remote-control process but leaves a new HID, video, USB, or EDID device, IP and MAC and switch port, KVM-management login, and input outcomes that look local. Where a provider retains data briefly or does not expose controller or session information, host logs show only a signed agent and a material blind spot remains.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入合法远控能力实际建立未授权交互控制，并要求 agent/tunnel/device、controller/session 与 target outcome 的可连接证据。合法帮助台、MSP、IDE 开发、实验室 KVM、灾备控制和安全响应是强反例；应按批准 tenant/account、工具/设备、目标、ticket/change、用户同意、访问模式、时间与动作排除。未知远控进程或设备本身只形成 exposure，未看到 session/outcome 时不完成父项。
        en: >-
          Scope includes actual unauthorized interactive control established through a legitimate remote-control capability and requires joinable evidence among agent, tunnel, or device, controller or session, and target outcome. Approved help desk, MSP, IDE development, laboratory KVM, disaster-recovery control, and security response are strong counterexamples and must be excluded by approved tenant or account, tool or device, target, ticket or change, user consent, access mode, time, and action. An unknown remote-control process or device is exposure only and does not complete the parent without session or outcome.
      - zh: >-
          T1133/NJT-0055 的直接对象是受害组织远程服务接受并建立入口或重入会话，并研究 token/session 与风险情境；T1219 的直接对象是合法远控产品工作流/控制能力成为 C2。某远控平台既是外部入口又承担交互控制时可并列，但产品名不替代 T1133 的服务接受结果。有效账户、OAuth token、GitHub/Microsoft/RMM account 及地理/设备情境分别是身份或会话前提；只有远控 session 和目标动作完成 T1219。
        en: >-
          T1133 and NJT-0055 directly concern a victim remote service accepting and establishing an ingress or reentry session and analyze token or session state and risk context. T1219 directly concerns a legitimate remote-control product workflow or capability becoming C2. A remote-access platform that serves both as external entry and interactive control may co-classify, but product name cannot replace T1133's service-acceptance outcome. A valid account, OAuth token, GitHub or Microsoft or RMM account, and geography or device context are identity or session prerequisites; only a remote-control session plus target action completes T1219.
      - zh: >-
          T1563/NJT-0151 要求攻击者接入另一主体已经认证并维持的传输/桌面，控制者与原 session owner 分离；T1219 通常由攻击者创建或使用其控制的合法工具 session。若攻击者劫持现有帮助台/IDE/RMM session，两个对象可并列，MIT-000155 只治理该所有权转换，不覆盖 T1219 的新 enrollment 与批准工作流偏差。DET-000094 的 session replay/风险情境同样不等于合法工具工作流滥用。
        en: >-
          T1563 and NJT-0151 require an adversary to enter another principal's already authenticated and maintained transport or desktop, separating current controller from original session owner. T1219 normally uses a legitimate tool session created or controlled by the attacker. Hijacking an existing help desk, IDE, or RMM session can co-classify. MIT-000155 governs that ownership transition only and does not cover T1219's new enrollment or approval-workflow deviation. DET-000094 session replay and risk context likewise do not equal legitimate-tool workflow abuse.
      - zh: >-
          T1090 负责代理节点转发并改变网络路径，T1572 负责内层协议封装；IDE tunnel、RMM vendor relay 或 KVM VPN 可并列，但 T1219 要求交互控制语义。T1021/NJT-0183 等 remote service 对象拥有新认证连接到目标和横向动作；NJT-0078 拥有 fleet job→agent 执行；单次 remote script/command 归相应远程管理执行。T1219 只拥有持续或可交互工具通道，不能吞并每个会话内命令、文件传输、权限改变或影响结果。
        en: >-
          T1090 owns proxy relays and network-path change, while T1572 owns inner-protocol encapsulation. An IDE tunnel, RMM vendor relay, or KVM VPN may co-classify, but T1219 requires interactive-control semantics. Remote-service objects such as T1021 and NJT-0183 own a new authenticated connection to a target and lateral action. NJT-0078 owns fleet job-to-agent execution, and a one-shot remote script or command belongs to the relevant remote-administration execution object. T1219 owns only the continuing or interactive tool channel and does not absorb every in-session command, file transfer, permission change, or impact result.
      - zh: >-
          T1200/硬件入口负责外设被引入并产生首次访问，NJS-0071-003 负责 HID 自动输入冒充用户并产生 Execution；带外远控子项要求远端 controller、宿主外控制平面和持续/交互输入—视频关系。一个 PiKVM 可同时涉及三者，但物理存在、一次键盘序列或网络 KVM 登录不能互相替代证据。
        en: >-
          T1200 or hardware-entry objects own introduction of a peripheral and first access, while NJS-0071-003 owns automated HID input impersonating a user and producing Execution. The out-of-band remote-control child requires a remote controller, a control plane outside the host, and a continuing or interactive input-to-video relationship. One PiKVM may involve all three, but physical presence, one keyboard sequence, and a network KVM login cannot substitute for one another's evidence.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            已入侵 Windows 主机上，Operation Digital Eye 以 service 启动 Microsoft 签名 code.exe tunnel，使用 GitHub 账号注册 tunnel，再从 vscode.dev 浏览器访问终端和文件系统。另一类活动中，Storm-1811 冒充支持人员取得用户 Quick Assist 许可，随后部署 ScreenConnect、NetSupport、AnyDesk、Qakbot、Cobalt Strike 或 ransomware。两者都借真实服务与工具，却分别突出 controller binding 和批准 workflow 偏差。
          en: >-
            On compromised Windows hosts, Operation Digital Eye starts Microsoft-signed code.exe tunnel as a service, registers the tunnel with a GitHub account, and accesses terminal and filesystem through vscode.dev in a browser. In another pattern, Storm-1811 impersonates support staff to obtain Quick Assist approval and then deploys ScreenConnect, NetSupport, AnyDesk, Qakbot, Cobalt Strike, or ransomware. Both borrow genuine services and tools but respectively foreground controller binding and approval-workflow deviation.
        - zh: >-
            在远程雇佣/设备托管场景，DPRK IT worker 让公司 laptop 位于 facilitator 的 laptop farm，接入 IP-KVM 和多种远管工具，从境外操作者持续控制设备。Mandiant 在多起响应中观察 IP-KVM 与 GoToRemote、Chrome Remote Desktop、AnyDesk、TeamViewer、RustDesk 等组合；Microsoft 后续案例记录四个 compromised accounts 连接 PiKVM 并出现数据窃取。这类控制可能绕过宿主远控进程检测，却仍留下硬件、网络与身份痕迹。
          en: >-
            In remote-employment and device-hosting scenarios, DPRK IT workers place corporate laptops in facilitator laptop farms, attach IP-KVM and several remote-management tools, and maintain control from an overseas operator. Mandiant observed IP-KVM together with GoToRemote, Chrome Remote Desktop, AnyDesk, TeamViewer, and RustDesk across incident responses. A later Microsoft case records four compromised accounts connecting PiKVM and data theft. Such control may bypass host remote-control process detection but still leaves hardware, network, and identity traces.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              软件/IDE 路径需要在目标启动或保留合法 agent/tunnel、控制 vendor/GitHub/Microsoft account 或 session code，并维持出站 relay；workflow 滥用还需取得用户同意、被盗 operator 身份或能避开工单核验。硬件路径需要物理安装/托管者协助、独立网络和 KVM controller 凭据。攻击者须处理 MFA、tenant restriction、agent approval、session timeout、用户提示、vendor 处置和设备枚举，工具越持久越容易留下 enrollment/service/asset 关系。
            en: >-
              Software and IDE paths require starting or retaining a legitimate agent or tunnel on the target, controlling a vendor, GitHub, or Microsoft account or session code, and maintaining outbound relay. Workflow abuse also needs user consent, a stolen operator identity, or an ability to evade ticket validation. The hardware path requires physical installation or facilitator assistance, separate networking, and KVM-controller credentials. The actor must handle MFA, tenant restriction, agent approval, session timeout, user prompts, vendor enforcement, and device enumeration. More persistent tooling leaves stronger enrollment, service, and asset relationships.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要四类视角：端点上的 process/service/extension/agent/device events 和子进程；vendor/IDE 控制面的 tenant/account/controller/agent/tunnel/session/action 审计；身份提供方的 sign-in/MFA/device/source；工单/变更/同意与批准 inventory。硬件还需 USB/HID/video/EDID、DHCP/NAC/switch-port、KVM 管理登录与物理保管。稳定关联键为 device、agent/tunnel/hardware ID、controller account/tenant、session/request、ticket、target、access mode 和 time。
            en: >-
              Defenders need four vantage classes: endpoint process, service, extension, agent, and device events plus child processes; vendor or IDE control-plane audit for tenant, account, controller, agent, tunnel, session, and action; identity-provider sign-in, MFA, device, and source; and ticket, change, consent, and approved inventory. Hardware additionally needs USB, HID, video, and EDID, DHCP, NAC, switch port, KVM-management login, and physical custody. Stable keys are device, agent, tunnel, or hardware ID, controller account or tenant, session or request, ticket, target, access mode, and time.
          - zh: >-
              日志能力差异巨大。Quick Assist 官方说明 host 两端不创建详细日志，provider 仅短期保留少量 session health 数据且不记录按键/动作；外部 RMM tenant 和 GitHub account 也可能不向受害组织开放完整审计。此时只能把 agent/tunnel lifecycle、identity、network 和 endpoint outcome 形成分级推断，不得将签名工具或无工单自动定性。合法支持、MSP、多租户开发、实验室 KVM、灾备和事件响应必须按明确 owner/scope/window 排除。
            en: >-
              Logging varies sharply. Official Quick Assist documentation states that neither endpoint creates detailed logs, the provider keeps a small amount of session-health data briefly, and keystrokes or actions are not recorded. Outside RMM tenants and GitHub accounts may likewise withhold complete audit from the victim organization. In those conditions, agent or tunnel lifecycle, identity, network, and endpoint outcome support graded inference only; a signed tool or missing ticket is not automatically malicious. Legitimate support, MSP, multi-tenant development, laboratory KVM, disaster recovery, and incident response require explicit owner, scope, and window as counterexamples.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: 真实远控产品身份与支持开发外观替代攻击者控制通道特征, en: Genuine remote-control product identity and support or development appearance substitute for attacker control-channel features}
      analysis:
        paragraphs:
          - zh: >-
              攻击者通过签名 agent、vendor relay、GitHub/Microsoft dev tunnel 或用户批准的 Quick Assist 建立控制，端点进程、证书、域名和交互形式均属于真实产品。粗粒度分类把合法产品特征当作会话授权，恶意 controller 和目标动作被支持/开发工作流包裹，形成特征伪装。Operation Digital Eye、Storm-1811 和 Scattered Spider 直接支持；controller tenant、agent binding、ticket、consent 与 action 可恢复差异。
            en: >-
              The actor establishes control through a signed agent, vendor relay, GitHub or Microsoft dev tunnel, or user-approved Quick Assist, leaving endpoint process, certificate, domain, and interaction form genuine to the product. Coarse classification treats legitimate product features as session authorization, wrapping a malicious controller and target action in support or development workflow and producing Feature Disguise. Operation Digital Eye, Storm-1811, and Scattered Spider directly support the chain; controller tenant, agent binding, ticket, consent, and action recover the difference.
      evidence_keys: [B4-T1219-REF-DIGITAL-EYE, B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 带外控制将远程操作者活动移出宿主进程与网络观察面, en: Out-of-band control moves remote-operator activity outside host process and network observation}
      analysis:
        paragraphs:
          - zh: >-
              IP-KVM 在宿主外获取视频并模拟键盘/鼠标，操作者网络连接终止于 KVM 而非 corporate endpoint；宿主可能只见本地 HID 与普通用户动作，没有 remote-control process 或 vendor egress。依赖 EDR 进程/网络的分析因此不触发，形成行为透明。Mandiant 与 Microsoft 现场观察支持该差；USB/HID/video、MAC/IP/switch port、KVM login 和 identity outcome 仍可恢复。
            en: >-
              An IP-KVM captures video and emulates keyboard and mouse outside the host, with the operator network connection terminating at the KVM rather than the corporate endpoint. The host may see only local HID and ordinary user actions with no remote-control process or vendor egress. Analytics dependent on EDR process and network therefore do not fire, creating Behavioral Transparency. Mandiant and Microsoft field observations support the differential; USB, HID, video, MAC, IP, switch port, KVM login, and identity outcome remain recoverable.
      evidence_keys: [B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM]
      confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            建议三项 Niji 子技术。未批准控制端命名空间重绑定以 agent/tunnel/device 被绑定到攻击者 tenant/account/controller 为变量，重点检查 enrollment；批准工作流脱离会话以 session 与 ticket/operator/target/consent/window 不匹配为变量，重点检查每次使用；带外控制观察置换以交互控制平面处于宿主 OS 之外、宿主只见本地输入为变量，重点检查硬件/网络。三者可组合但数据与处置不同。
          en: >-
            Three Niji children are proposed. Unapproved Controller-Namespace Rebinding uses an agent, tunnel, or device bound to an attacker tenant, account, or controller as the variable and focuses on enrollment. Approval-Detached Trusted Remote-Control Session uses mismatch among session, ticket, operator, target, consent, and window and focuses on each use. Out-of-Band Control Observation Displacement uses an interactive control plane outside the host OS, leaving the host with local-looking input, and focuses on hardware and network evidence. They can combine but require different data and response.
        - zh: >-
            IDE/desktop/hardware、vendor、GUI/CLI、协议、端口和功能不是子项。IDE 与 RMM 都可被绑定到攻击者 account，也都可能在批准 workflow 外使用；KVM 同样可有 controller account 和工单，同时额外产生带外观察差。会话所有权劫持、有效账户情境、代理路径和具体远程命令由相邻对象承担。
          en: >-
            IDE, desktop, hardware, vendor, GUI or CLI, protocol, port, and function do not define children. IDE and RMM can both bind to attacker accounts and be used outside approved workflow. A KVM can likewise have a controller account and ticket while additionally producing the out-of-band observation differential. Session-ownership hijack, valid-account context, proxy path, and individual remote commands remain with adjacent objects.
    coverage: proposed
    temporary_subtechnique_keys: [B4-T1219-NJS-CONTROLLER-REBIND, B4-T1219-NJS-WORKFLOW-DETACHED, B4-T1219-NJS-OOB-OBSERVATION]
proposed_subtechniques:
  - temporary_key: B4-T1219-NJS-CONTROLLER-REBIND
    name: {zh: 未批准控制端命名空间重绑定, en: Unapproved Controller-Namespace Rebinding}
    summary:
      zh: 攻击者把目标 agent、IDE tunnel 或远控设备绑定到其控制的 vendor tenant、账号或 controller ID，使合法产品通道归属外部操作者。
      en: The actor binds a target agent, IDE tunnel, or remote-control device to an actor-controlled vendor tenant, account, or controller ID, making a legitimate product channel belong to an outside operator.
    stable_variable:
      zh: endpoint capability 与 controller namespace 的绑定从批准组织/账号变为攻击者控制实体；安装产品和工具名称不是变量。
      en: Binding between endpoint capability and controller namespace changes from an approved organization or account to an actor-controlled entity; product installation and tool name are not the variable.
    trace_change:
      zh: endpoint 新增 agent/service/tunnel/device registration 和 provider outbound，provider 侧出现新 tenant/account/controller、agent/tunnel ID 与首次 session；目标后继动作落在签名 agent/IDE 下。
      en: The endpoint gains an agent, service, tunnel, or device registration and provider egress; the provider sees a new tenant, account, or controller, agent or tunnel ID, and first session; target actions occur under a signed agent or IDE.
    defender_observation_difference:
      zh: software allowlist 只见合法 binary/vendor，无法判断控制归属；control-plane enrollment、identity sign-in 和 approved namespace registry 可恢复。
      en: Software allowlists see a legitimate binary or vendor but cannot determine controller ownership; control-plane enrollment, identity sign-in, and an approved namespace registry recover it.
    sibling_boundary:
      zh: 本项在 session 前改变 capability 所属控制端；workflow 子项可使用已批准绑定但产生未批准 session。带外子项由宿主观察位置定义，不要求 binding 变化。
      en: This child changes the capability's controller before session use. The workflow child can use an approved binding but create an unauthorized session. The out-of-band child is defined by host observation location and does not require binding change.
    adjacent_boundaries:
      zh: account/token 获取归身份技术，agent 安装可另记 T1105/执行/持久化，tunnel path 可另记 T1090/T1572；本项完成需要 binding 加 session/outcome。
      en: Account or token acquisition belongs to identity techniques, agent installation may separately receive T1105, execution, or persistence, and tunnel path may receive T1090 or T1572. This child completes only with binding plus session or outcome.
    prerequisites_and_scenario:
      zh: 攻击者可在目标运行/配置合法 capability 并拥有外部 controller identity；Operation Digital Eye 的 GitHub-authenticated VS Code tunnel 为直接案例，Scattered Spider/RMM 提供跨工具支持。
      en: The actor can run or configure a legitimate capability on the target and owns an outside controller identity. Operation Digital Eye's GitHub-authenticated VS Code tunnel is a direct case and Scattered Spider RMM use supplies cross-tool support.
    evidence_keys: [B4-T1219-REF-DIGITAL-EYE, REF-000031, B4-T1219-REF-VSCODE-TUNNELS, B4-T1219-REF-DEVTUNNEL-POLICY]
    confidence: high
    defense_value:
      zh: 需要 agent/tunnel/device enrollment、controller tenant/account 和 first session 关联，并以 tenant allowlist、应用控制和快速 unregister/revoke 处置。
      en: Defense joins agent, tunnel, or device enrollment to controller tenant or account and first session, then uses tenant allowlists, application control, and rapid unregister or revoke.
  - temporary_key: B4-T1219-NJS-WORKFLOW-DETACHED
    name: {zh: 批准工作流脱离的受信远控会话, en: Approval-Detached Trusted Remote-Control Session}
    summary:
      zh: 攻击者建立技术上有效的合法远控 session，但其 operator、target、ticket、consent、access mode 或时间不匹配组织批准流程。
      en: The actor establishes a technically valid legitimate remote-control session whose operator, target, ticket, consent, access mode, or time does not match organizational approval workflow.
    stable_variable:
      zh: session-to-approval 关系缺失、过期或属性不匹配，而不是产品是否批准或用户是否真实点击同意。
      en: The session-to-approval relationship is missing, expired, or attribute-mismatched; product approval or a real user click is not the variable.
    trace_change:
      zh: vendor/provider/agent 保留真实 session，端点产生远控动作，但工单/变更中没有相同 helper/operator、target、scope、mode、start/end 或 consent evidence。
      en: Vendor, provider, or agent retains a real session and the endpoint produces remote-control actions, but no ticket or change contains the same helper or operator, target, scope, mode, start or end, and consent evidence.
    defender_observation_difference:
      zh: 仅看签名 agent、成功认证或用户 consent 会认为正常；session audit 与 ticket/consent/target outcome 精确核对才能揭示偏差。
      en: Signed agent, successful authentication, or user consent alone looks normal; exact correlation of session audit to ticket, consent, and target outcome reveals the deviation.
    sibling_boundary:
      zh: 与 rebinding 不同，本项可在 organization-owned tenant 和既有批准 agent 上发生；与 OOB 不同，本项不依赖宿主日志缺失。
      en: Unlike rebinding, this child can occur in an organization-owned tenant and through a preapproved agent. Unlike OOB displacement, it does not depend on missing host telemetry.
    adjacent_boundaries:
      zh: 欺骗用户点击批准可并列 user execution/social engineering；被盗 valid account 可并列身份技术；接管他人已有 session 才是 NJT-0151，MIT-000155 不自动适用新 session。
      en: Deceiving a user into approval can coexist with user execution or social engineering, a stolen valid account with identity techniques, and takeover of another principal's existing session with NJT-0151. MIT-000155 does not automatically apply to a newly created session.
    prerequisites_and_scenario:
      zh: 攻击者可获得 helper/operator 身份或诱使 target consent，并能建立 session；Storm-1811 Quick Assist 与 CISA Scattered Spider helpdesk/RMM 为独立案例。
      en: The actor can obtain a helper or operator identity or induce target consent and establish a session. Storm-1811 Quick Assist and CISA Scattered Spider helpdesk and RMM activity are independent cases.
    evidence_keys: [B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031, B4-T1219-REF-CISA-REMOTE-ACCESS-GUIDE, B4-T1219-REF-QUICK-ASSIST-DOC]
    confidence: high
    defense_value:
      zh: 检测/控制围绕 JIT ticket、实名 operator、phishing-resistant MFA、target/scope、双向同意、session recording 与到期，不靠 tool denylist。
      en: Detection and control center on JIT tickets, named operators, phishing-resistant MFA, target and scope, bilateral consent, session recording, and expiry rather than a tool denylist.
  - temporary_key: B4-T1219-NJS-OOB-OBSERVATION
    name: {zh: 带外远控观察置换, en: Out-of-Band Remote-Control Observation Displacement}
    summary:
      zh: 攻击者通过宿主 OS 外的 KVM 或等价控制平面取得视频和注入输入，使宿主把远程操作呈现为本地外设/用户行为。
      en: The actor obtains video and injects input through a KVM or equivalent control plane outside the host OS, causing the host to present remote operation as local peripheral or user behavior.
    stable_variable:
      zh: controller network/session 终止于独立设备或管理平面，宿主 OS 不承载 remote-control process/connection；hardware product name 不是变量。
      en: The controller network or session terminates at an independent device or management plane and the host OS carries no remote-control process or connection; hardware product name is not the variable.
    trace_change:
      zh: 远程网络流和 video 位于 KVM，宿主只见新 HID/video/USB/EDID 与本地输入/画面；KVM 有独立 IP/MAC/switch port、账号和 session。
      en: Remote network flow and video reside on the KVM while the host sees a new HID, video, USB, or EDID device and local-looking input or display. The KVM has its own IP, MAC, switch port, account, and session.
    defender_observation_difference:
      zh: EDR 的 remote agent/process/network 规则为空白，需端点 PnP 与网络/NAC/资产/物理保管多视点；仅 HID 事件不能证明远端 controller。
      en: EDR remote-agent, process, and network rules are blank, requiring endpoint PnP plus network, NAC, asset, and physical-custody views. A HID event alone does not prove a remote controller.
    sibling_boundary:
      zh: rebinding 与 workflow 项可在 host-based software 上成立；本项只由控制平面与宿主观察分离定义，即使 KVM 账号和工单均已知也可能发生。
      en: Rebinding and workflow children can occur in host software. This child is defined only by separation between control plane and host observation, even when KVM account and ticket are known.
    adjacent_boundaries:
      zh: 物理引入/首次访问归 T1200，自动 HID 事件导致 execution 归 NJS-0071-003，controller VPN/proxy 归 T1090；本项要求持续/交互远控 session 与结果。
      en: Physical introduction or first access belongs to T1200, automated HID events producing execution to NJS-0071-003, and controller VPN or proxy to T1090. This child requires a continuing or interactive remote-control session and result.
    prerequisites_and_scenario:
      zh: 攻击者/协助者可物理连接设备、提供独立网络并掌握 controller credentials；Mandiant UNC5267 laptop farms 与 Microsoft Jasper Sleet PiKVM 提供独立现场证据。
      en: The actor or facilitator can physically connect a device, provide separate networking, and control controller credentials. Mandiant UNC5267 laptop farms and Microsoft Jasper Sleet PiKVM provide independent field evidence.
    evidence_keys: [B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM, B4-T1219-REF-DEVICEEVENTS]
    confidence: high
    defense_value:
      zh: 需要批准 hardware/USB/HID/video inventory、NAC/switch/MAC/IP、KVM admin/session、physical custody 与 host identity/action 关联，并隔离 OOB 网络。
      en: Defense joins approved hardware, USB, HID, and video inventory; NAC, switch, MAC, and IP; KVM administrator and session; physical custody; and host identity or actions, with OOB network isolation.
defense_candidates:
  detection_strategies:
    - temporary_key: B4-T1219-DET-REMOTE-CONTROL-WORKFLOW
      name: {zh: 远控绑定—会话批准—目标结果关联, en: Remote-Control Binding to Session Approval and Target Outcome Correlation}
      objective:
        zh: 分别重建远控 capability 的 controller 绑定、每次 session 的批准 workflow 和带外设备控制路径，并连接目标动作。
        en: Separately reconstruct controller binding of a remote-control capability, approval workflow of each session, and an out-of-band device control path, then join target actions.
      subjects: [parent, B4-T1219-NJS-CONTROLLER-REBIND, B4-T1219-NJS-WORKFLOW-DETACHED, B4-T1219-NJS-OOB-OBSERVATION]
      domains: [enterprise]
      analytic_keys: [B4-T1219-NJA-CONTROLLER-BINDING, B4-T1219-NJA-SESSION-WORKFLOW, B4-T1219-NJA-OOB-CONTROL]
      candidate_resolution: create
      reuse_notes:
        zh: DET-000094 处理 token/session replay 和 risk context；现有 NJT-0151 Detection 与 MIT-000155 处理已有 session 的 owner/controller transition。T1219 需要新 capability enrollment、新 session approval 和 OOB observation，逻辑/字段/处置不同，不复用 DET/NJA/MIT；若事件实际 hijack existing session，则并列引用相邻对象。
        en: DET-000094 handles token or session replay and risk context. Existing NJT-0151 detection and MIT-000155 handle owner or controller transitions of an existing session. T1219 requires new capability enrollment, new session approval, and OOB observation with different logic, fields, and response, so DET, NJA, and MIT are not reused. If an event actually hijacks an existing session, adjacent objects coexist.
  detection_analytics:
    - temporary_key: B4-T1219-NJA-CONTROLLER-BINDING
      name: {zh: 远控能力控制端绑定与首次会话分析, en: Remote-Control Capability Controller Binding and First-Session Analytic}
      raw_to_normalized_fields:
        - source: endpoint-capability-lifecycle
          channel: EDR process/service/registry/extension events
          raw_fields: [timestamp, device_id, action_type, process_unique_id, process_path, process_hash, signer, command_line, service_name, persistence_object, user_id]
          normalized_fields: [event_time, target_device_id, lifecycle_action, agent_process_key, agent_path, agent_hash, publisher, launch_arguments, agent_service_id, persistence_id, local_principal_id]
        - source: provider-or-ide-control-plane
          channel: vendor admin/audit API, Dev Tunnels, GitHub/Microsoft identity
          raw_fields: [timestamp, provider, tenant_or_org_id, controller_account_id, agent_or_tunnel_id, target_device_name, enrollment_action, access_mode, session_id, source_ip, auth_method, result]
          normalized_fields: [event_time, provider, controller_namespace_id, controller_principal_id, capability_id, target_device_id, binding_action, access_mode, remote_session_id, controller_source_ip, controller_auth_method, result_status]
        - source: approved-remote-control-inventory
          channel: software asset, vendor tenant, IDE and support-tool registry
          raw_fields: [provider, approved_tenant_or_org, approved_controller, approved_agent_or_tunnel, target_device, allowed_mode, owner, valid_from, valid_to, policy_version]
          normalized_fields: [provider, approved_namespace_id, approved_controller_id, approved_capability_id, target_device_id, approved_mode, capability_owner, valid_from, valid_to, policy_version]
        - source: endpoint-outcome
          channel: EDR process/file/network/terminal events
          raw_fields: [timestamp, device_id, parent_process_unique_id, process_unique_id, action_type, process_path, command_line, file_path, remote_url, user_id]
          normalized_fields: [event_time, target_device_id, remote_agent_process_key, outcome_process_key, outcome_type, outcome_image, command_line, object_path, remote_target, effective_principal]
      logic:
        zh: >-
          先按 device 与 capability ID 建 agent/tunnel lifecycle，连接 create/install/service/`code tunnel`/register 到 provider binding。将 provider tenant/org、controller account 与批准 inventory 比较，输出 approved_binding、unknown_binding 或 external_controller_binding；只有 capability 随后建立 remote session 并产生 terminal/file/process outcome 时输出 controller_rebind_confirmed。仅 code.exe/AnyDesk 安装、vendor egress 或登录 portal 保持 exposure。portable agent 无 install 时从 process+provider session 建临时 capability ID；provider audit 不可得时标记 controller_unresolved。
        en: >-
          Build agent or tunnel lifecycle by device and capability ID, joining create, install, service, code tunnel, or register to provider binding. Compare provider tenant or organization and controller account with approved inventory to emit approved_binding, unknown_binding, or external_controller_binding. Emit controller_rebind_confirmed only when the capability later creates a remote session and a terminal, file, or process outcome. Code.exe or AnyDesk installation, vendor egress, or portal login alone remains exposure. For a portable agent without installation, derive a temporary capability ID from process and provider session. Mark controller_unresolved when provider audit is unavailable.
      correlation:
        window: 24 hours binding-to-first-session; 90 days capability/account history
        dimensions: [target_device_id, agent_process_key, provider, controller_namespace_id, controller_principal_id, capability_id, remote_session_id, policy_version, outcome_process_key, time]
      observables: [new tunnel/agent bound to external tenant or account, portable signed remote agent followed by provider session, first session produces terminal or filesystem action, persistent service reconnects to attacker namespace]
      false_positives: [approved developer tunnels, MSP onboarding, replacement remote agent, break-glass support, lab devices, temporary vendor troubleshooting]
      blind_spots: [external vendor audit unavailable, portable agent no stable ID, stolen approved controller account, encrypted provider traffic, endpoint agent excluded from EDR, short provider retention]
      tuning_guidance:
        zh: inventory 必须到 tenant/org/controller/capability 而非产品名；按 developer、helpdesk、MSP、server 与 workstation 角色分基线。签名 binary 和 vendor domain 不可整体豁免；unknown binding 需 target outcome 或独立 incident context 才升级。
        en: Inventory must reach tenant, organization, controller, and capability rather than product name. Baseline developer, help desk, MSP, server, and workstation roles separately. Signed binaries and vendor domains cannot receive blanket exemption. Unknown binding requires target outcome or independent incident context before escalation.
      evidence_keys: [B4-T1219-REF-DIGITAL-EYE, REF-000031, B4-T1219-REF-VSCODE-TUNNELS, B4-T1219-REF-DEVTUNNEL-POLICY, REF-000986, REF-000230]
      confidence: high
    - temporary_key: B4-T1219-NJA-SESSION-WORKFLOW
      name: {zh: 远控会话与批准工单同意结果关联, en: Remote-Control Session to Approval Ticket Consent and Outcome Correlation}
      raw_to_normalized_fields:
        - source: remote-control-session-audit
          channel: vendor/RMM/IDE/helpdesk audit or session export
          raw_fields: [timestamp, provider, session_id, controller_account, controller_tenant, source_ip, target_agent_or_device, access_mode, start_time, end_time, auth_method, consent_state, session_action, result]
          normalized_fields: [event_time, provider, remote_session_id, controller_principal_id, controller_namespace_id, controller_source_ip, target_capability_id, access_mode, session_start, session_end, controller_auth_method, user_consent_state, remote_action, result_status]
        - source: approval-workflow
          channel: helpdesk/change/JIT/support/IDE access system
          raw_fields: [ticket_id, requester, assigned_operator, target_device, approved_tool_or_provider, approved_mode, reason, consent_evidence, approver, valid_from, valid_to, status]
          normalized_fields: [approval_id, requestor_id, approved_controller_id, target_device_id, approved_provider, approved_mode, approved_reason, consent_reference, approver_id, valid_from, valid_to, approval_status]
        - source: identity-signin
          channel: IdP/Entra/GitHub/vendor identity
          raw_fields: [createdDateTime, userId, appId, resourceId, ipAddress, correlationId, deviceDetail, authenticationRequirement, conditionalAccessStatus, status]
          normalized_fields: [event_time, controller_principal_id, client_app_id, service_resource_id, controller_source_ip, identity_correlation_id, controller_device, auth_strength, policy_result, sign_in_result]
        - source: endpoint-session-outcome
          channel: endpoint agent/process/network/file and user report
          raw_fields: [timestamp, device_id, agent_process_unique_id, session_id, action_type, child_process, command_line, file_path, network_target, user_id]
          normalized_fields: [event_time, target_device_id, agent_process_key, remote_session_id, outcome_type, outcome_process, command_line, object_path, remote_target, effective_principal]
      logic:
        zh: >-
          对每个 actual session 用 provider/session/target/controller/time 寻找唯一 approval。比较 operator、tenant、target、tool、mode、window、consent 和 status，输出 matched_approved、unmatched_session、expired_or_scope_mismatch。仅当有效 session 产生目标动作且 approval 缺失或多个关键属性不符时输出 workflow_detached_confirmed。用户真实点击 Quick Assist Allow 只代表 product consent，若无组织 ticket/helper 验证仍是 mismatch evidence；Quick Assist 无详细 endpoint log 时以进程/网络/后果和用户报告构造 session_candidate 并降低置信。
        en: >-
          For every actual session, seek one approval by provider, session, target, controller, and time. Compare operator, tenant, target, tool, mode, window, consent, and status to emit matched_approved, unmatched_session, or expired_or_scope_mismatch. Emit workflow_detached_confirmed only when a valid session produces a target action and approval is absent or several material attributes disagree. A real Quick Assist Allow click establishes product consent only and remains mismatch evidence without an organizational ticket or helper verification. Where Quick Assist exposes no detailed endpoint session log, construct session_candidate from process, network, outcome, and user report at lower confidence.
      correlation:
        window: session start/end plus 30 minutes; 30 days approval and operator history
        dimensions: [provider, remote_session_id, controller_principal_id, controller_namespace_id, target_device_id, approval_id, access_mode, consent_reference, identity_correlation_id, outcome_id, time]
      observables: [real remote session lacks ticket, controller differs from assigned operator, full-control mode exceeds view-only approval, session outside window or on wrong target, post-session child process/file/action]
      false_positives: [emergency support with retrospective ticket, approved MSP cross-tenant operation, on-call handoff, developer self-support, disaster recovery, security incident response]
      blind_spots: [provider does not expose helper/session identity, Quick Assist three-day minimal retention, ticket data incomplete, shared operator accounts, user consent undocumented, endpoint outcomes indistinguishable from user]
      tuning_guidance:
        zh: ticket 是组合证据而非恶意判据；紧急流程须 owner/expiry/retrospective approval。provider mappings 逐产品验证，不假定统一字段。无 controller/session ID 时输出 unresolved，不用 signed agent、user consent 或 lack of ticket 单点定性。
        en: A ticket is combined evidence rather than a maliciousness verdict. Emergency workflows need owner, expiry, and retrospective approval. Validate provider mappings per product and do not assume uniform fields. Without controller or session ID, emit unresolved and do not classify on signed agent, user consent, or missing ticket alone.
      evidence_keys: [B4-T1219-REF-QUICK-ASSIST-INCIDENT, REF-000031, B4-T1219-REF-CISA-REMOTE-ACCESS-GUIDE, B4-T1219-REF-QUICK-ASSIST-DOC, REF-000986]
      confidence: high
    - temporary_key: B4-T1219-NJA-OOB-CONTROL
      name: {zh: 带外远控设备—网络会话—宿主动作关联, en: Out-of-Band Remote-Control Device to Network Session and Host Action Correlation}
      raw_to_normalized_fields:
        - source: endpoint-pnp-device
          channel: Microsoft Defender XDR DeviceEvents, OS PnP/USB/HID inventory
          raw_fields: [Timestamp, DeviceId, ActionType, AdditionalFields, AccountName, InitiatingProcessUniqueId, RemoteIP, RemoteUrl]
          normalized_fields: [event_time, host_device_id, device_action, peripheral_attributes, local_principal_id, initiator_process_key, observed_remote_ip, observed_remote_url]
        - source: network-access-control
          channel: DHCP/NAC/switch/Wi-Fi/EDR network inventory
          raw_fields: [timestamp, mac_address, ip_address, dhcp_hostname, vendor_or_oui, switch_id, switch_port, vlan, first_seen, last_seen, auth_identity]
          normalized_fields: [event_time, oob_device_id, oob_mac, oob_ip, device_name, device_vendor, network_device_id, network_port, network_segment, first_seen, last_seen, network_identity]
        - source: kvm-controller-audit
          channel: IP-KVM or remote-hardware management log
          raw_fields: [timestamp, hardware_id, controller_account, source_ip, session_id, target_port_or_host, auth_method, video_state, input_state, start_time, end_time, result]
          normalized_fields: [event_time, oob_device_id, controller_principal_id, controller_source_ip, remote_session_id, target_device_id, controller_auth_method, video_channel_state, input_channel_state, session_start, session_end, result_status]
        - source: hardware-approval-and-custody
          channel: CMDB, asset, USB/device control, shipping and physical access records
          raw_fields: [hardware_id, serial_or_fingerprint, owner, target_device, approved_network, approved_controller, purpose, location, custody_actor, valid_from, valid_to]
          normalized_fields: [oob_device_id, device_fingerprint, hardware_owner, target_device_id, approved_segment, approved_controller_id, approved_purpose, physical_location, custody_actor, valid_from, valid_to]
      logic:
        zh: >-
          将 endpoint 新 HID/video/USB/EDID/PnP attributes 与同时间首次出现的 network MAC/IP/port 聚合为 oob_device_id，并与 CMDB/custody 比较。若有 KVM audit，连接 controller/session/target/input+video；再在 target identity/resource/process/file events 中寻找 session 窗口内的可控动作。只有 unapproved hardware 或 controller、interactive input/video session 和 target outcome 同时成立才输出 oob_control_confirmed。仅新键盘、dock、capture card、MAC/OUI 或 remote login 分别输出 device_candidate/session_candidate。
        en: >-
          Combine new endpoint HID, video, USB, EDID, or PnP attributes with a newly seen network MAC, IP, and switch port in the same interval to derive oob_device_id, then compare with CMDB and custody. Where KVM audit exists, join controller, session, target, input, and video, then seek controllable target identity, resource, process, or file actions during the session. Emit oob_control_confirmed only when unapproved hardware or controller, an interactive input and video session, and target outcome coexist. A new keyboard, dock, capture card, MAC or OUI, or remote login alone yields device_candidate or session_candidate.
      correlation:
        window: 24 hours device appearance-to-first-session; session start/end plus 30 minutes for outcome; 180 days asset history
        dimensions: [host_device_id, oob_device_id, device_fingerprint, oob_mac, oob_ip, network_port, controller_principal_id, remote_session_id, target_device_id, custody_actor, outcome_id, time]
      observables: [new composite HID/video device paired with new network appliance, KVM controller session from unapproved identity or geography, host actions during KVM session without remote agent process, hardware location/custody inconsistent with assigned worker]
      false_positives: [approved data-center KVM, docking stations, capture cards, accessibility devices, lab automation, remote-work equipment, break-glass OOB management]
      blind_spots: [USB identity spoofing, no PnP action details, KVM on separate unmanaged network, no KVM audit, HDMI capture invisible to host, shared switch port, facilitator falsifies custody]
      tuning_guidance:
        zh: 以 serial/fingerprint+MAC+switch port+owner 组合，而非 vendor/OUI 单点识别；批准 hardware 必须绑定 target、controller、segment、purpose 和 expiry。DeviceEvents AdditionalFields parser 需本地样本验证；无 input/video 或 target outcome 时不确认远控。
        en: Identify by serial or fingerprint plus MAC, switch port, and owner rather than vendor or OUI alone. Approved hardware must bind target, controller, segment, purpose, and expiry. Validate DeviceEvents AdditionalFields parsing with local samples. Without input and video or target outcome, do not confirm remote control.
      evidence_keys: [B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM, B4-T1219-REF-DEVICEEVENTS]
      confidence: high
  mitigations:
    - temporary_key: B4-T1219-MIT-REMOTE-CONTROL-GOVERNANCE
      name: {zh: 合法远控能力绑定与使用工作流治理, en: Legitimate Remote-Control Capability Binding and Use-Workflow Governance}
      candidate_resolution: create
      description:
        zh: 把批准远控细化到 controller namespace、agent/tunnel/hardware ID、operator、target、mode、ticket/consent 和时限，保留 provider/endpoint/OOB 审计并快速撤销未授权控制。
        en: Govern approved remote control at controller namespace, agent, tunnel, or hardware ID, operator, target, mode, ticket or consent, and time, retain provider, endpoint, and OOB audit, and rapidly revoke unauthorized control.
      measures:
        - key: controller-namespace-and-capability-inventory
          name: {zh: 控制端命名空间与远控能力清单, en: Controller Namespace and Remote-Control Capability Inventory}
          control_type: preventive
          implementation:
            zh: 按 vendor tenant/org/account、agent/tunnel/device ID、target、software/hash/signer、service/extension 与 owner 建正向清单；禁用不需要的远控/IDE tunnel，Dev Tunnels 只允许批准 Entra tenant，portable/anonymous/consumer controller 默认阻断。
            en: Build a positive inventory by vendor tenant, organization, or account; agent, tunnel, or device ID; target; software, hash, and signer; service or extension; and owner. Disable unneeded remote control and IDE tunnels, allow Dev Tunnels only for approved Entra tenants, and deny portable, anonymous, or consumer controllers by default.
        - key: jit-session-approval-and-consent
          name: {zh: 即时会话批准与同意, en: JIT Session Approval and Consent}
          control_type: preventive
          implementation:
            zh: 每次 session 绑定实名 operator、phishing-resistant MFA、ticket/change、target、purpose、access mode、start/end、approver 和可核查 user consent；scope/mode/target 改变强制重批，emergency 有 owner/expiry/retrospective review。
            en: Bind every session to a named operator, phishing-resistant MFA, ticket or change, target, purpose, access mode, start and end, approver, and verifiable user consent. Scope, mode, or target change forces reapproval, while emergency access has owner, expiry, and retrospective review.
        - key: provider-endpoint-session-audit-export
          name: {zh: Provider—Endpoint 会话审计导出, en: Provider-to-Endpoint Session Audit Export}
          control_type: detective-support
          implementation:
            zh: 导出 controller identity/tenant/source、agent/tunnel/device、session、mode、action、file/terminal、start/end/result，并与 endpoint agent lifecycle、process/file/network、identity sign-in 和 ticket 对齐；不把 signed agent 放入遥测排除。
            en: Export controller identity, tenant and source, agent, tunnel or device, session, mode, action, file or terminal, start and end, and result, aligning them with endpoint agent lifecycle, process, file, network, identity sign-in, and ticket. Do not exclude a signed agent from telemetry.
        - key: out-of-band-hardware-custody-and-segmentation
          name: {zh: 带外硬件保管与网络隔离, en: Out-of-Band Hardware Custody and Network Segmentation}
          control_type: exposure-reduction
          implementation:
            zh: 未需 KVM 的 endpoint 禁止相关 USB/video/HID 组合；批准设备记录 serial/fingerprint、MAC/IP、switch port、target、controller、位置、custody 与时限，置于专用 OOB network、强 MFA/JIT、独立日志和 physical inspection。
            en: Prohibit KVM-related USB, video, and HID combinations on endpoints without need. Approved devices record serial or fingerprint, MAC and IP, switch port, target, controller, location, custody, and validity and reside on a dedicated OOB network with strong MFA, JIT, independent logs, and physical inspection.
        - key: rapid-remote-control-revocation
          name: {zh: 远控能力快速撤销, en: Rapid Remote-Control Revocation}
          control_type: containment
          implementation:
            zh: 发现 unapproved binding/session/device 时同时 terminate session、unregister/revoke agent/tunnel/token、disable controller account、isolate target 与 OOB device，并保留 provider/ticket/endpoint evidence；只杀本地进程不足。
            en: On unapproved binding, session, or device, terminate the session, unregister or revoke agent, tunnel, and token, disable controller account, isolate target and OOB device, and preserve provider, ticket, and endpoint evidence. Killing only the local process is insufficient.
      applications:
        - target: parent
          use:
            zh: 所有远控 capability 必须同时满足 inventory binding 与 per-session workflow，endpoint/software、provider/controller 和 OOB hardware 三平面至少保留可连接 ID。
            en: Every remote-control capability must satisfy both inventory binding and per-session workflow, with joinable IDs retained across endpoint or software, provider or controller, and OOB hardware planes.
          expected_effect:
            zh: 合法工具身份不再等于任意操作者授权，新 enrollment、workflow mismatch 或 OOB device 会产生可处置差分。
            en: Legitimate tool identity no longer equals authorization for any operator, and new enrollment, workflow mismatch, or OOB device creates an actionable differential.
          limitations:
            zh: vendor 不开放日志、外部 tenant、紧急支持、隐私和多 MSP 运营会限制精度；严格阻断可能妨碍支持和开发。
            en: Providers without audit, outside tenants, emergency support, privacy, and multi-MSP operations limit precision; strict blocking can impair support and development.
        - target: controller-rebind
          use:
            zh: 只允许批准 tenant/org/controller 创建/注册 agent、IDE tunnel 或 device，首次 session 前验证 target/owner 并自动撤销未知 binding。
            en: Allow only approved tenants, organizations, or controllers to create or register agents, IDE tunnels, or devices, verify target and owner before first session, and automatically revoke unknown bindings.
          expected_effect:
            zh: 攻击者难以仅凭合法 binary/vendor 建立其自有控制命名空间，registration 与 first use 都留痕。
            en: The actor cannot establish an owned controller namespace merely through a legitimate binary or vendor, and registration and first use both leave evidence.
          limitations:
            zh: 被盗批准 controller 或 self-created tunnel 绕过弱政策，需 identity/device/outcome 补充。
            en: A stolen approved controller or self-created tunnel can bypass weak policy and needs identity, device, and outcome controls.
        - target: workflow-detached
          use:
            zh: 每次 full-control/view/file/terminal session 按 exact operator/target/mode/window/ticket/consent 授权并记录，异常立即终止和调查后继动作。
            en: Authorize and record every full-control, view, file, or terminal session by exact operator, target, mode, window, ticket, and consent, terminating anomalies and investigating successor actions.
          expected_effect:
            zh: 用户点击 Allow 或 signed agent 不再替代组织批准，帮助台仿冒和被盗 operator session 更早暴露。
            en: A user Allow click or signed agent no longer substitutes for organizational approval, exposing help-desk impersonation and stolen-operator sessions earlier.
          limitations:
            zh: Quick Assist 等产品详细日志短缺，共享 operator 和紧急流程需要额外 endpoint/user evidence。
            en: Products such as Quick Assist lack detailed logs, and shared operators and emergency workflows need additional endpoint and user evidence.
        - target: oob-observation
          use:
            zh: 以 hardware fingerprint+MAC+port+custody+controller 管理 KVM，专用 OOB segment 禁止直达生产身份面，定期现场核查和撤销未知设备。
            en: Manage KVM through hardware fingerprint plus MAC, port, custody, and controller, prevent a dedicated OOB segment from directly reaching production identity planes, and periodically inspect and revoke unknown devices.
          expected_effect:
            zh: 宿主 EDR 外的控制仍产生资产、网络、身份与保管差分，未知 KVM 可在远端操作前隔离。
            en: Control outside host EDR still creates asset, network, identity, and custody differentials, allowing an unknown KVM to be isolated before remote operation.
          limitations:
            zh: HDMI 与仿真身份可对 host 隐形/伪造，facilitator 可隐藏物理设备；需要 NAC、switch 和实物核查。
            en: HDMI and emulated identities can be invisible or spoofed to the host and a facilitator can hide hardware, requiring NAC, switch, and physical inspection.
      evidence_keys: [B4-T1219-REF-CISA-REMOTE-ACCESS-GUIDE, B4-T1219-REF-DEVTUNNEL-POLICY, B4-T1219-REF-QUICK-ASSIST-DOC, B4-T1219-REF-MANDIANT-DPRK-KVM, B4-T1219-REF-MICROSOFT-PIKVM]
reuse_and_nonreuse_decisions:
  - object: MIT-000155
    resolution: do-not-extend-for-T1219
    reason:
      zh: MIT-000155 固定 existing authenticated transport/desktop 的 original owner 和 later controller transition；T1219 新 enrollment、新 session workflow 与 OOB hardware 不是同一控制概念。只有事件实际 hijack existing session 时并列复用。
      en: MIT-000155 fixes original owner and later controller transition for an existing authenticated transport or desktop. T1219 new enrollment, new-session workflow, and OOB hardware are different control concepts. Reuse it concurrently only when an existing session is actually hijacked.
  - object: DET-000094
    resolution: do-not-extend-for-T1219
    reason: It detects remote-session state replay and risk-context mimicry rather than legitimate-tool controller binding or support-workflow authorization.
  - object: NJT-0055/NJT-0061/NJT-0151/NJT-0183
    resolution: adjacent-only
    reason: Remote entry, identity use, existing-session takeover, and remote-service target relationships can co-occur but have separate outcome gates.
