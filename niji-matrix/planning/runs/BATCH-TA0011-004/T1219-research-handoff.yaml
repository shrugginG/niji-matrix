research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1219.001, T1219.002, T1219.003]
    represented_dimensions: [IDE remote-development and tunnel implementation, desktop support and RMM software implementation, out-of-band KVM hardware implementation]
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
      - attack_subtechnique_id: T1219.001
        attack_name: IDE Tunneling
        resolution: niji-variable-candidate
        notes:
          zh: IDE 产品类别不导入；Operation Digital Eye 支持 controller namespace rebinding 与 workflow mismatch。SSH/port forwarding/encapsulation 另评 T1090/T1572，victim-specific GitHub/Microsoft identity 是绑定证据。
          en: The IDE product category is not imported. Operation Digital Eye supports controller-namespace rebinding and workflow mismatch. SSH, port forwarding, and encapsulation are separately assessed under T1090 or T1572, while victim-specific GitHub or Microsoft identity is binding evidence.
      - attack_subtechnique_id: T1219.002
        attack_name: Remote Desktop Software
        resolution: niji-variable-candidate
        notes:
          zh: Desktop/RMM software不导入；Quick Assist、Scattered Spider/RMM 支持 workflow-detached session，portable/install enrollment 也可贡献 controller rebinding。
          en: Desktop and RMM software is not imported. Quick Assist and Scattered Spider RMM use support workflow-detached sessions, while portable or installed enrollment can also contribute to controller rebinding.
      - attack_subtechnique_id: T1219.003
        attack_name: Remote Access Hardware
        resolution: niji-variable-candidate
        notes:
          zh: Hardware 标签不导入；IP-KVM 贡献 control plane outside host 的 observation displacement，也可同时出现 controller binding 和 workflow mismatch。物理引入与 HID execution 分别属相邻技术。
          en: The hardware label is not imported. IP-KVM contributes observation displacement from a control plane outside the host and can also show controller binding and workflow mismatch. Physical introduction and HID execution belong to adjacent techniques.
    candidate_stealth_axes_examined:
      - controller namespace rebinding across agent tunnel and device
      - session detached from ticket operator target consent mode and time approval
      - off-host control-plane observation displacement
      - signed product or vendor reputation retained at parent mechanism
      - GUI versus CLI rejected as interface implementation
      - IDE versus desktop versus hardware rejected as product taxonomy
      - long-lived or unattended mode deferred absent independent stealth evidence beyond enrollment/workflow
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        三项固定 ATT&CK 子项均只作 evidence coverage。三个 Niji 轴跨实现：VS Code/RMM/KVM 均可被绑定到外部 controller；任一产品会话都可脱离工单；只有控制平面在宿主外时进入 observation displacement。主 Agent 应检查第三项与 T1200/NJS-0071-003 的并列边界，并保持 MIT-000155 只服务 existing-session takeover。
      en: >-
        All three fixed ATT&CK children serve evidence coverage only. The three Niji axes cut across implementations: VS Code, RMM, and KVM can bind to an outside controller; any product session can detach from a ticket; only a control plane outside the host enters observation displacement. The primary agent should review the third child's co-classification boundary with T1200 and NJS-0071-003 and keep MIT-000155 limited to existing-session takeover.
