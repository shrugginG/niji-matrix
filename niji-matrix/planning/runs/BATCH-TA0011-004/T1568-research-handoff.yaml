    - {key: B4-T1568-REF-ZEEK-TLS-REUSE, reuse_ref: REF-000920, title: 'Zeek SSL and TLS Log Fields', url: 'https://docs.zeek.org/en/current/reference/logs/ssl.html', locator: 'uid, endpoints, version, cipher, server_name, established and certificate-chain file IDs; TLS 1.3/ECH limits'}
    - {key: B4-T1568-REF-DNS-FIREWALL-REUSE, reuse_ref: REF-000636, title: 'AWS Route 53 Resolver DNS Firewall', url: 'https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall.html', locator: 'Outbound DNS query policy for traffic passing through the VPC Resolver only'}
  claims:
    - {key: B4-T1568-CLM-ADMISSION, proposition_zh: 'T1568 只有在攻击者控制的运行时解析/计算值被同一植入消费为后继 C2 endpoint 时准入', proposition_en: 'T1568 is admitted only when an attacker-controlled runtime resolution or calculation value is consumed by the same implant as a successor C2 endpoint', evidence_keys: [B4-T1568-REF-ATTACK-REUSE, B4-T1568-REF-GAMAREDON, B4-T1568-REF-POSHSPY, B4-T1568-REF-NUMBERED-PANDA], mode: fixed_baseline_plus_original_evidence}
    - {key: B4-T1568-CLM-ANSWER-ROTATION, proposition_zh: 'Gamaredon 工具解析频繁变化的硬编码域并直接使用所得 IP 联系 C2，支持解析应答端点轮换', proposition_en: 'Gamaredon tools resolve frequently changing hardcoded domains and directly use the resulting IP for C2, supporting Resolver-Answer Endpoint Rotation', evidence_keys: [B4-T1568-REF-GAMAREDON], mode: original_sample_and_infrastructure_analysis}
    - {key: B4-T1568-CLM-GENERATION, proposition_zh: 'POSHSPY 从共享词表组合运行时派生 C2 URL 并在事件中使用被攻陷站点，支持共享状态定位符生成', proposition_en: 'POSHSPY derives runtime C2 URLs from shared word-list combinations and uses compromised sites in incidents, supporting Shared-State Locator Generation', evidence_keys: [B4-T1568-REF-POSHSPY], mode: original_incident_and_sample_analysis}
    - {key: B4-T1568-CLM-SYNTHESIS, proposition_zh: 'Numbered Panda 使用一个 DNS 应答 IP 的 octet 计算另一个 C2 连接端口，支持解析响应参数合成', proposition_en: 'Numbered Panda uses octets from one DNS answer IP to calculate the port for another C2 connection, supporting Resolver-Response Parameter Synthesis', evidence_keys: [B4-T1568-REF-NUMBERED-PANDA], mode: original_adversary_analysis}
    - {key: B4-T1568-CLM-BOUNDARY, proposition_zh: '失败触发、服务对象、引导角色、多跳路径与 DNS carriage 分别由 NJT-0153、NJT-0209、NJT-0210、NJT-0206 和 NJT-0160 拥有；T1568 只拥有 endpoint derivation 与 consumption', proposition_en: 'Failure trigger, service object, bootstrap role, multihop path, and DNS carriage belong respectively to NJT-0153, NJT-0209, NJT-0210, NJT-0206, and NJT-0160; T1568 owns endpoint derivation and consumption only', evidence_keys: [B4-T1568-REF-ATTACK-REUSE], mode: fixed_and_canonical_boundary_review}
    - {key: B4-T1568-CLM-DEFENSE, proposition_zh: '递归/端点 DNS、网络连接、被动 DNS、RDAP 和证书字段能恢复求值—消费链，但文档不证明通用阈值或检测准确率', proposition_en: 'Recursive and endpoint DNS, network connection, passive DNS, RDAP, and certificate fields can reconstruct evaluation-to-consumption, but documentation does not establish universal thresholds or detection accuracy', evidence_keys: [B4-T1568-REF-ZEEK-DNS-REUSE, B4-T1568-REF-SYSMON-REUSE, B4-T1568-REF-MDE-NET-REUSE, B4-T1568-REF-PDNS, B4-T1568-REF-RDAP-REUSE, B4-T1568-REF-CT-REUSE, B4-T1568-REF-ZEEK-TLS-REUSE], mode: official_fields_plus_bounded_design_inference}
  cases:
    - {key: B4-T1568-CASE-GAMAREDON, name: 'Gamaredon rotating DNS answers consumed as C2 IPs', central_fact: 'C2 server IPs changed several times daily and tools resolved hardcoded domains themselves and used the resulting IP to contact C2', evidence_keys: [B4-T1568-REF-GAMAREDON], scope_limit: 'Not every tool used domains; some variants used hardcoded IPs, and no universal TTL is reported'}
    - {key: B4-T1568-CASE-POSHSPY, name: 'POSHSPY word-list generated C2 URLs', central_fact: 'Incident-identified fileless backdoor derives C2 URLs from multiple word lists; analyzed options permit 550 URLs and actual C2 used compromised legitimate sites', evidence_keys: [B4-T1568-REF-POSHSPY], scope_limit: 'Source does not show queries to every candidate or a universal lexical/NXDOMAIN threshold'}
    - {key: B4-T1568-CASE-NUMBERED, name: 'Numbered Panda DNS-answer-derived C2 port', central_fact: 'Malware uses one DNS name for C2 and another answer as numeric material for a port formula such as (A*B)+C', evidence_keys: [B4-T1568-REF-NUMBERED-PANDA], scope_limit: 'Public report lacks a full PCAP and states multiple algorithm variants exist; one formula is not universal'}
  detection_strategies: [B4-T1568-DET-ANSWER-CONSUMPTION, B4-T1568-DET-GENERATED-CANDIDATE]
  detection_analytics: [B4-T1568-NJA-ANSWER-ROTATION, B4-T1568-NJA-GENERATED-CANDIDATE, B4-T1568-NJA-RESPONSE-SYNTHESIS]
  mitigations: [B4-T1568-MIT-RESOLUTION-EGRESS, B4-T1568-MIT-GENERATED-NAMESPACE]
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1568.001, T1568.002, T1568.003]
    represented_dimensions: [changing_resolver_answer_pool, shared_candidate_generation, resolver_answer_parameter_calculation]
    breadth_trigger: examine_at_least_two_materially_different_axes
    coverage_resolutions:
      - {attack_id: T1568.001, resolution: niji-variable-candidate, child_key: B4-T1568-SUB-ANSWER-ROTATION, reason: 'Contributes direct evidence for changing answer-set state consumed as endpoints; record type and fast-flux label are not imported'}
      - {attack_id: T1568.002, resolution: niji-variable-candidate, child_key: B4-T1568-SUB-SHARED-GENERATION, reason: 'Contributes shared algorithm/state synchronization and successful candidate consumption; DGA label and domain form are not imported'}
      - {attack_id: T1568.003, resolution: niji-variable-candidate, child_key: B4-T1568-SUB-RESPONSE-SYNTHESIS, reason: 'Contributes answer-to-private-transform-to-socket mapping; DNS record and formula name are not imported'}
    candidate_stealth_axes_examined:
      - {axis: resolver_answer_set_mutation, result: formal_candidate, child_key: B4-T1568-SUB-ANSWER-ROTATION, defense_difference: time-versioned answer history plus connection consumption}
      - {axis: shared_generation_state, result: formal_candidate, child_key: B4-T1568-SUB-SHARED-GENERATION, defense_difference: candidate family/algorithm plus successful endpoint}
      - {axis: response_material_private_transformation, result: formal_candidate, child_key: B4-T1568-SUB-RESPONSE-SYNTHESIS, defense_difference: answer-transform-socket reconstruction}
      - {axis: primary_failure_activation, result: adjacent-technique, owner: NJT-0153, reason: 'Failure selects when a derivation method is used, not how the endpoint is derived'}
      - {axis: service_object_locator, result: adjacent-technique, owner: NJT-0209, reason: 'Provider account/object identity owns locator publication; dynamic computation/rotation and consumption remain here'}
      - {axis: bootstrap_to_operational_role, result: adjacent-technique, owner: NJT-0210, reason: 'A distinct stage-role handoff requires more than one endpoint derivation transaction'}
      - {axis: resolved_proxy_or_relay_path, result: adjacent-technique, owner: NJT-0206, reason: 'The routing relationship behind an answer is independent of resolver-state mutation'}
      - {axis: DNS_command_or_result_carriage, result: adjacent-technique, owner: NJT-0160, reason: 'DNS carrying task data differs from DNS deriving a later endpoint'}
      - {axis: domain_randomness_record_type_or_TTL, result: not-stealth-distinct, reason: 'Implementation features and ranking signals do not define stable children without consumption'}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        三项固定 ATT&CK 子项被分别解析为应答状态、共享生成状态和响应变换三个 Niji 变量，并有不同消费证据与防御。没有复制 Fast Flux/DGA/DNS Calculation 名称，亦未按域、算法或记录类型拆分。
      en: >-
        The three fixed ATT&CK children resolve into Niji variables for answer state, shared generation state, and response transformation, each with distinct consumption evidence and defense. Fast Flux, DGA, and DNS Calculation names are not copied, and no split uses domain, algorithm, or record type.
  evidence_coverage:
    parent_behavior_keys: [B4-T1568-REF-ATTACK-REUSE, B4-T1568-REF-GAMAREDON, B4-T1568-REF-POSHSPY, B4-T1568-REF-NUMBERED-PANDA]
    boundary_keys: [B4-T1568-REF-ATTACK-REUSE, B4-T1568-REF-GAMAREDON, B4-T1568-REF-POSHSPY, B4-T1568-REF-NUMBERED-PANDA]
    mechanism_support:
      - {mechanism: NM-ST, keys: [B4-T1568-REF-GAMAREDON, B4-T1568-REF-POSHSPY], level: direct_rotation_and_candidate_generation_facts}
      - {mechanism: NM-BT, keys: [B4-T1568-REF-NUMBERED-PANDA, B4-T1568-REF-POSHSPY], level: direct_private_derivation_semantics}
    child_existence_support:
      - {child_key: B4-T1568-SUB-ANSWER-ROTATION, keys: [B4-T1568-REF-GAMAREDON]}
      - {child_key: B4-T1568-SUB-SHARED-GENERATION, keys: [B4-T1568-REF-POSHSPY]}
      - {child_key: B4-T1568-SUB-RESPONSE-SYNTHESIS, keys: [B4-T1568-REF-NUMBERED-PANDA]}
    unsupported_or_deferred:
      - Gamaredon evidence lacks complete per-victim DNS-to-socket logs and some tools used hardcoded IPs.
      - POSHSPY supports up to 550 generated URLs but does not prove every candidate was queried or supply a generic lexical threshold.
      - Numbered Panda public reporting gives the formula and intent but no full PCAP, sample hash, or universal variant formula.
      - Passive DNS coverage is provider- and sensor-dependent; CIRCL access is restricted and historical absence is not proof of non-use.
      - CT does not cover non-TLS endpoints or every certificate, while TLS 1.3 and ECH reduce passive visibility.
      - Sysmon Event 3 is disabled by default and DoH/DoQ can bypass managed recursive logs.
      - No source supplies universal TTL, answer-count, NXDOMAIN, entropy, generation-window or mapping-pair thresholds.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级及三项候选分别覆盖定义、消费门、痕迹变化、残余、正常反例、相邻边界、应用场景、攻防模型、机理、防御和证据限制。主 Agent 应统一复核与 NJT-0209/0210、NJT-0153/0160/0206 的并列规则，并在正式写入时保留消费门。
      en: >-
        The parent and three candidates separately cover definition, consumption gate, trace change, residuals, normal counterexamples, adjacent boundaries, scenarios, threat models, mechanism, defense, and evidence limits. The primary agent should converge coexistence rules with NJT-0209, NJT-0210, NJT-0153, NJT-0160, and NJT-0206 and preserve the consumption gate in canonical writing.
  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [fixed_STIX_query, exact_URL_duplicate_search, manual_staging_YAML_serialization, YAML_and_evidence_key_validation]}
  limitations:
    paragraphs:
      - zh: >-
          本研究把 infrastructure-side 动态状态与 endpoint-side 实际消费分开；只有前者时不升级为完成的 C2。原始来源对样本/活动有不同可见度，未提供同一种日志集，检测方案因此是由来源事实和官方字段组成的受限工程设计，须以本地日志验证。
        en: >-
          This research separates infrastructure-side dynamic state from endpoint-side actual consumption and does not upgrade infrastructure evidence alone to completed C2. Original sources have different visibility into samples and activity and do not provide one common log set. The detection design is therefore a bounded engineering design built from source facts and official fields and requires validation on local telemetry.
      - zh: >-
          CDN、SaaS、DDNS、灾备、服务发现、租户分片和证书自动化会产生应答轮换、生成名称和解析到连接的合法关系。高质量结论必须包含攻击者可控状态、进程消费和 C2 结果，不能以新域、低 TTL、高熵、多个 ASN 或未知端口单独定性。防护措施若错误封禁动态基础设施会造成广泛业务影响。
        en: >-
          CDNs, SaaS, DDNS, disaster recovery, service discovery, tenant sharding, and certificate automation produce legitimate answer rotation, generated names, and resolution-to-connection relationships. High-quality conclusions require attacker-controlled state, process consumption, and C2 outcome and cannot rely on a new domain, low TTL, high entropy, multiple ASNs, or unknown port alone. Incorrect blocking of dynamic infrastructure can cause broad business impact.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Encoding or encryption of locator material is separate from runtime endpoint derivation and belongs to T1132/T1573 or NJT-0152 where applicable.}
    - {mechanism_ref: NM-FD, reason: Legitimate provider/domain appearance can coexist but is owned by NJT-0209/NJT-0152; the formal children use state location and consumption mapping.}
  open_questions:
    - Can local endpoint telemetry map every resolver query to a stable process identity and later connection across cache hits?
    - Does the organization retain recursive answers and TTLs or only query names and response codes?
    - Which approved CDN, GSLB, DDNS, SaaS and service-discovery patterns require owner-specific baselines?
    - Can samples or memory provide generator/transform versions, and how should candidate predictions expire across clock skew?
    - During primary convergence, ensure a Web dead drop or bootstrap URL is not duplicated here unless the locator is dynamically derived and consumed.
