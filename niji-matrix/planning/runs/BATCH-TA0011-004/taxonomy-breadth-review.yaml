candidate_reviews:
- source_attack_id: T1105
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - parent has no fixed-baseline ATT&CK children
    breadth_trigger: ordinary-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: internal-versus-external-source-boundary
      resolution: parent-core
      reason: Changes sensors and tactic context but not file-arrival behavior or a stable stealth effect.
    - axis: trusted-client-or-background-service-delegated-write
      resolution: evidence-deferred
      reason: Strong BITS evidence exists, but the generalization overlaps the parent mechanism and NJT-0078 or TA0005
        provenance objects and is product-bound beyond BITS.
    - axis: chunked-or-time-spaced-download
      resolution: evidence-deferred
      reason: No reviewed incident directly proves attacker-selected chunking or timing as an independent detection-evasion
        variable with distinct defense.
    - axis: destination-path-or-file-type
      resolution: adjacent-technique
      reason: Placement camouflage or hiding belongs to masquerading or hide-artifact objects; path and file type alone
        are not stable children.
    - axis: protocol-or-transfer-tool
      resolution: not-stealth-distinct
      reason: HTTP FTP SMB BITS curl certutil wget sync and package managers are implementations, not taxonomy variables.
    - axis: memory-only-stream
      resolution: not-stealth-distinct
      reason: No independent destination file object arrives, so it fails the parent result gate and belongs to execution
        or in-memory objects.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子项未停止开放搜索；六条候选轴分别按结果门、相邻所有权、证据与防御差异收敛为父级、defer、adjacent 或排除。正式父级复用 NJT-0130，不新建 NJT/NJS；来源边界通过事件字段与双防御分支表达。
      en: Zero ATT&CK children did not stop the open search. Six candidate axes converged to parent, deferred, adjacent,
        or excluded based on result gate, adjacent ownership, evidence, and defense difference. The formal parent reuses
        NJT-0130 without a new NJT or NJS, while source boundary is represented by event fields and two defense branches.
  primary_resolution: Adapt and reuse generalized NJT-0130; no formal NJS, taxonomy deferred.
- source_attack_id: T1132
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1132.001
    - T1132.002
    represented_dimensions:
    - compliance of encoding scheme with public or protocol specifications
    - standard versus modified alphabet or representation rule
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_id: T1132.001
      attack_dimension: standard encoding such as Base-N, hexadecimal, character encoding, MIME, or gzip-related representation
      resolution: adjacent-technique
      owner_ref: NJS-0115-001
      reason:
        zh: 有意 C2 编码保留在 T1132 父级；可逆变换变量和规范化防御由 NJS-0115-001 唯一拥有。协议强制的正常编码排除。
        en: Deliberate C2 encoding stays at the T1132 parent; NJS-0115-001 uniquely owns the reversible-transform variable
          and normalization defense. Protocol-required normal encoding is excluded.
    - attack_id: T1132.002
      attack_dimension: non-standard or modified representation such as a custom Base64 alphabet
      resolution: adjacent-technique
      owner_ref: NJS-0115-001
      reason:
        zh: 自定义字母表改变解析参数但仍是同一可重放链；标准解析失败应作为恢复链中的失败层，而非 Niji 子项身份。
        en: A custom alphabet changes parser parameters but remains the same replayable chain; standard-parser failure
          is a failed recovery layer rather than a Niji child identity.
    candidate_stealth_axes_examined:
    - axis: reversible_transform_chain
      result: cross-technique-reuse
      owner_ref: NJS-0115-001
    - axis: transform_depth_and_order
      result: owner-parameter
      owner_ref: NJS-0115-001
    - axis: semantic_distribution_across_fields
      result: adjacent-technique
      owner_ref: NJS-0152-001
    - axis: standardness_or_custom_alphabet
      result: not-stealth-distinct
    - axis: protocol_required_encoding
      result: excluded-normal-behavior
    - axis: cryptographic_confidentiality
      result: adjacent-technique
      owner: T1573
    - axis: ordinary_compression
      result: excluded-normal-behavior-unless-deliberate-recovery-chain
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两个 ATT&CK 子项已逐项覆盖，但其区别只是编码规则是否标准，不满足独立痕迹、观察和防御门。开放检验了层深、字段分布、协议要求、密码机密性和压缩；相应变量已由既有对象拥有或属于正常行为。父级 `none-justified`
        是跨技术去重结果，不是停止分类搜索。
      en: Both ATT&CK children are covered, but their distinction is only whether the encoding rule is standard and does
        not pass separate trace, observation, and defense gates. The open search also tested depth, field distribution,
        protocol requirements, cryptographic confidentiality, and compression; each variable is already owned or is normal
        behavior. Parent `none-justified` is a cross-technique deduplication result rather than an early stop.
  primary_resolution: Adapt as NJT-0211; none-justified because NJS-0115-001 uniquely owns reversible representation.
- source_attack_id: T1205
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1205.001
    - T1205.002
    represented_dimensions:
    - ordered_closed_port_or_packet_sequence
    - socket_or_packet_filter_content_match
    breadth_trigger: ordinary_with_itemized_fixed_child_coverage
    coverage_resolutions:
    - attack_id: T1205.001
      resolution: niji-variable-candidate
      niji_ref: NJS-0120-001
      reason: Existing child generalizes port knocking into any ordered multi-event matcher state and is not a copied
        ATT&CK label.
    - attack_id: T1205.002
      resolution: niji-variable-candidate
      niji_ref: NJS-0120-002
      reason: Existing child generalizes socket-filter implementations into one-packet field/content matching and filter-to-socket
        lineage.
    candidate_stealth_axes_examined:
    - axis: matcher_state_cardinality_and_memory
      result: established_existing_taxonomy
      children:
      - NJS-0120-001
      - NJS-0120-002
      reason: Multiple-event state and one-packet content matching change traces and require different analytics; cd00r
        versus SYNful/SprySOCKS/BPFDoor directly support the split.
    - axis: successor_C2_outcome_type
      result: parent-core_and_tactic_gate
      reason: Listener, reverse shell, inbound shell, traffic diversion and command function prove TA0011 applicability
        but do not alter the signal matcher.
    - axis: packet_protocol_or_port
      result: not-stealth-distinct
      reason: TCP, UDP, ICMP, open/closed/common/high ports are implementations and can appear under either matcher state.
    - axis: filter_product_or_technology
      result: not-stealth-distinct
      reason: libpcap, BPF, WFP, raw sockets and router image hooks implement observation or diversion without changing
        the initial match variable.
    - axis: continuing_lower_layer_session
      result: adjacent-technique
      owner: T1095
      reason: After activation, ongoing raw protocol task/result traffic is a separate communication-carriage variable.
    - axis: failure_or_block_triggered_path
      result: adjacent-technique
      owner: NJT-0153
      reason: Failure-driven path selection is different from matching a secret network signal to expose functionality.
    - axis: stage_role_handoff
      result: adjacent-technique
      owner: T1104
      reason: Signaling plus successor session is not multistage unless distinct channel roles and a deliberate stage
        transition are evidenced.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    new_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定两项子技术已由现有 Niji matcher 状态 taxonomy 完整覆盖，且新补 cd00r/BPFDoor 证据直接确认两边的 C2 结果。协议、端口、产品和后继结果类型不会成为新 NJS。
      en: The two fixed children are fully covered by the existing Niji matcher-state taxonomy, and added cd00r and BPFDoor
        evidence directly confirms C2 outcomes on each side. Protocol, port, product, and successor-outcome type do not
        become new NJS objects.
  primary_resolution: Adapt and reuse NJT-0120 with NJS-0120-001/002; no new NJT/NJS.
- source_attack_id: T1219
  attack_baseline: enterprise-attack 19.1
  research:
    attack_subtechnique_count: 3
    attack_subtechnique_ids:
    - T1219.001
    - T1219.002
    - T1219.003
    represented_dimensions:
    - IDE remote-development and tunnel implementation
    - desktop support and RMM software implementation
    - out-of-band KVM hardware implementation
    breadth_trigger: examine-at-least-two-materially-distinct-axes
    coverage_resolutions:
    - attack_subtechnique_id: T1219.001
      attack_name: IDE Tunneling
      resolution: niji-variable-candidate
      notes:
        zh: IDE 产品类别不导入；Operation Digital Eye 支持 controller namespace rebinding 与 workflow mismatch。SSH/port forwarding/encapsulation
          另评 T1090/T1572，victim-specific GitHub/Microsoft identity 是绑定证据。
        en: The IDE product category is not imported. Operation Digital Eye supports controller-namespace rebinding and
          workflow mismatch. SSH, port forwarding, and encapsulation are separately assessed under T1090 or T1572, while
          victim-specific GitHub or Microsoft identity is binding evidence.
    - attack_subtechnique_id: T1219.002
      attack_name: Remote Desktop Software
      resolution: niji-variable-candidate
      notes:
        zh: Desktop/RMM software不导入；Quick Assist、Scattered Spider/RMM 支持 workflow-detached session，portable/install enrollment
          也可贡献 controller rebinding。
        en: Desktop and RMM software is not imported. Quick Assist and Scattered Spider RMM use support workflow-detached
          sessions, while portable or installed enrollment can also contribute to controller rebinding.
    - attack_subtechnique_id: T1219.003
      attack_name: Remote Access Hardware
      resolution: niji-variable-candidate
      notes:
        zh: Hardware 标签不导入；IP-KVM 贡献 control plane outside host 的 observation displacement，也可同时出现 controller binding
          和 workflow mismatch。物理引入与 HID execution 分别属相邻技术。
        en: The hardware label is not imported. IP-KVM contributes observation displacement from a control plane outside
          the host and can also show controller binding and workflow mismatch. Physical introduction and HID execution
          belong to adjacent techniques.
    candidate_stealth_axes_examined:
    - controller namespace rebinding across agent tunnel and device
    - session detached from ticket operator target consent mode and time approval
    - off-host control-plane observation displacement
    - signed product or vendor reputation retained at parent mechanism
    - GUI versus CLI rejected as interface implementation
    - IDE versus desktop versus hardware rejected as product taxonomy
    - long-lived or unattended mode deferred absent independent stealth evidence beyond enrollment/workflow
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 三项固定 ATT&CK 子项均只作 evidence coverage。三个 Niji 轴跨实现：VS Code/RMM/KVM 均可被绑定到外部 controller；任一产品会话都可脱离工单；只有控制平面在宿主外时进入
        observation displacement。主 Agent 应检查第三项与 T1200/NJS-0071-003 的并列边界，并保持 MIT-000155 只服务 existing-session takeover。
      en: 'All three fixed ATT&CK children serve evidence coverage only. The three Niji axes cut across implementations:
        VS Code, RMM, and KVM can bind to an outside controller; any product session can detach from a ticket; only a
        control plane outside the host enters observation displacement. The primary agent should review the third child''s
        co-classification boundary with T1200 and NJS-0071-003 and keep MIT-000155 limited to existing-session takeover.'
  primary_resolution: Adapt as NJT-0212 with three cross-implementation native children.
