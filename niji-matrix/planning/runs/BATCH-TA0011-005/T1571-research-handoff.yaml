    paragraphs:
      - zh: >-
          FlawedGrace、Winnti 与 PseudoManuscrypt 直接证明 actual protocol semantics、selected port 和 successor C2，但没有公开各受害组织的 firewall policy、proxy expectation 或 parser output。因此它们不能单独证明“bypass filtering”或“log misclassification”已经在具体现场发生；正式判定必须补 local policy/rule/action 与 analyzer result。没有该部署证据时只记录 protocol-port mismatch candidate，而非完整 stealth effect。
        en: >-
          FlawedGrace, Winnti, and PseudoManuscrypt directly establish actual protocol semantics, selected port, and successor C2, but they do not publish each victim organization's firewall policy, proxy expectation, or parser output. They therefore do not independently prove that filtering was bypassed or logs were misclassified at a particular site. Formal classification must add local policy, rule and action, and analyzer result. Without that deployment evidence, record only a protocol-port mismatch candidate rather than a complete stealth effect.
      - zh: >-
          Zeek、Suricata 与 PAN-OS 文档证明字段和控制可实施，不证明检测率或任何恶意意图。Zeek analyzer failure 可由协议升级/错误服务产生，Suricata failed/skipped 可由短流和单向流产生，App-ID 可在 session 中变化且受解密/签名覆盖限制。所列 15 分钟/24 小时窗口是工程起点；需要以当地 canary、PCAP replay 和 legitimate custom services 校准。
        en: >-
          Zeek, Suricata, and PAN-OS documentation establishes implementable fields and controls, not detection rates or malicious intent. Zeek analyzer failure can arise from protocol upgrades or misconfigured services, Suricata failed or skipped can arise from short and one-direction flows, and App-ID can change during a session and depends on decryption and signature coverage. The stated fifteen-minute and twenty-four-hour windows are engineering starting points requiring calibration with local canaries, PCAP replay, and legitimate custom services.
      - zh: >-
          2012 study directly demonstrates port-based malware/TLS misclassification and content-validation value, but its samples, TLS ecosystem and IDS are old;只用于 causal support，不用于 current prevalence/threshold。Proprietary encryption may prevent actual semantics recovery; protocol emulation can prove a known family response but probing live C2 has legal/operational constraints and cannot be assumed available. Absence of semantic parse never proves absence or presence of T1571.
        en: >-
          The 2012 study directly demonstrates port-based malware and TLS misclassification and the value of content validation, but its samples, TLS ecosystem, and IDS are old. It supports causality rather than current prevalence or thresholds. Proprietary encryption may prevent recovery of actual semantics. Protocol emulation can prove a known-family response, but probing live C2 has legal and operational constraints and cannot be assumed available. Absence of semantic parsing proves neither absence nor presence of T1571.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason:
        zh: 改变 port 不必在时间/空间分散 trace；多端点/轮换由其他技术研究，当前无独立释痕证据。
        en: Changing port does not inherently distribute traces across time or space. Multiple endpoints and rotation belong elsewhere and current evidence lacks an independent dilution mechanism.
    - mechanism_ref: NM-DO
      reason:
        zh: Port mismatch 不必改变 payload representation；encoding/encryption/encapsulation 由 T1132/T1573/T1572 负责。
        en: Port mismatch need not change payload representation; encoding, encryption, and encapsulation belong to T1132, T1573, and T1572.
  open_questions:
    - 主 Agent在正式 integration 中保持 subtechnique_taxonomy.coverage=none-justified；不要用 deferred 表示已经完成且无 formal child 的结论。
    - REF-000625 locator 需扩展 T1571 固定 19.1 parent；不得重复 STIX URL。
    - REF-001041 可复用 EVE common flow fields；app_proto_expected/orig/ts/tc 应由 B5 新 Suricata schema REF 支持，避免过度扩展原 locator。
    - 若正式 Web 页面把“非标准端口”理解为 rare numeric port，应在 bilingual definition 中显著展示 environment expected_service 与 four-layer gate，防止回退到 port-number IOC。
