    reason: Ordinary one-inner-to-one-outer tunneling defines the parent but lacks a further stable observation differential
defense_candidates:
  detection_strategies:
    - temporary_key: B5-T1572-DET-CROSSLAYER
      resolution_recommendation: create
      name:
        zh: 内外层会话解封装与结果关联
        en: Inner-to-Outer Session Decapsulation and Outcome Correlation
      objective:
        zh: 从端点 socket、隧道控制状态和外层事务中恢复内层端点、流或消息，并把它连接到未授权 C2、服务访问或跨边界结果。
        en: Recover inner endpoints, streams, or messages from endpoint sockets, tunnel-control state, and outer transactions and join them to unauthorized C2, service access, or cross-boundary outcomes.
      targets:
        - B5-T1572-PARENT
        - B5-T1572-SUB-ENDPOINT
        - B5-T1572-SUB-MULTIPLEX
        - B5-T1572-SUB-TRANSACTION
      domains:
        - enterprise
      analytic_keys:
        - B5-T1572-NJA-ENDPOINT
        - B5-T1572-NJA-MULTIPLEX
        - B5-T1572-NJA-TRANSACTION
      evidence_keys:
        - REF-001024
        - B5-T1572-REF-BRICKSTORM
        - B5-T1572-REF-TRICKBOT-DNS
        - B5-T1572-REF-DNSCAT2
        - B5-T1572-REF-ZEEK-TUNNEL
        - REF-000230
        - REF-000632
        - REF-000634
        - REF-000635
  detection_analytics:
    - temporary_key: B5-T1572-NJA-ENDPOINT
      strategy_key: B5-T1572-DET-CROSSLAYER
      resolution_recommendation: create
      name:
        zh: 内层服务 socket—隧道进程—外层流关联
        en: Inner-Service Socket–Tunnel Process–Outer Flow Correlation
      platforms:
        - Windows
        - Linux
        - macOS
        - Network Devices
      logic:
        paragraphs:
          - zh: >-
              以 endpoint_id 和 process_start_key 为隧道实例建立 socket 图：记录隧道进程/服务、启动参数或配置、监听端点、接受的本地/内部连接及外部连接。把 RDP、SMB、数据库、Tor 或其他已批准/禁止的内层服务会话，以 source/destination socket、时间、字节方向和可得协议指纹连接到同一进程或 tunnel_id 的外层流；再连接服务端登录、远程桌面、文件访问、命令或载荷结果。内层服务、隧道绑定、外层连接和后继结果四门齐全才输出 confirmed_inner_service_tunnel。
            en: >-
              Build a socket graph for each tunnel instance using endpoint_id and process_start_key. Record the tunnel process or service, launch arguments or configuration, listeners, accepted local or internal connections, and external connections. Join RDP, SMB, database, Tor, or another approved or prohibited inner service session to an outer flow owned by the same process or tunnel_id through source and destination sockets, time, byte direction, and available protocol fingerprints. Then join service login, remote desktop, file access, command, or payload outcome. Emit confirmed_inner_service_tunnel only when inner service, tunnel binding, outer connection, and successor outcome all pass.
          - zh: >-
              若只有转发配置和双侧 flow 而无法证明内层协议，降级为 overlay relay 并交给 DET-000191/NJA-000214；若只有外层 SSH/TLS/VPN 或命令行工具，保留 tunnel_exposure。合法路径必须同时匹配批准 owner、identity、binary/config hash、inner service、outer peer、domain pair、工单和有效期；只按 ssh/plink/ngrok 进程名或端口告警不合格。
            en: >-
              If forwarding configuration and bilateral flows exist without proof of inner protocol, downgrade to overlay relay and hand off to DET-000191 and NJA-000214. If only outer SSH, TLS, VPN, or a command-line tool exists, retain tunnel_exposure. A legitimate path must match approved owner, identity, binary or configuration hash, inner service, outer peer, domain pair, ticket, and validity. Alerts based only on an ssh, plink, or ngrok process name or port are insufficient.
      data_requirements:
        - source_type: endpoint-process-and-service
          name:
            zh: 隧道进程、服务与配置
            en: Tunnel Process, Service, and Configuration
          channel: EDR, Sysmon Event 1, auditd or equivalent
          required_fields:
            - event_time
            - endpoint_id
            - process_start_key
            - process_id
            - image
            - binary_hash
            - signer
            - parent_process_key
            - command_line
            - service_or_unit_name
            - tunnel_config_hash_or_arguments
            - principal_id
        - source_type: endpoint-socket-ownership
          name:
            zh: 监听、接受与外联 socket 归属
            en: Listener, Accepted, and Outbound Socket Ownership
          channel: EDR or eBPF socket telemetry, Sysmon Event 3 where applicable, network-device process telemetry
          required_fields:
            - event_time
            - endpoint_id
            - process_start_key_or_tunnel_id
            - direction
            - local_ip
            - local_port
            - remote_ip
            - remote_port
            - protocol
            - socket_or_flow_id
            - bytes_in
            - bytes_out
            - interface_or_namespace
        - source_type: network-connection
          name:
            zh: 外层连接与协议元数据
            en: Outer Connection and Protocol Metadata
          channel: Zeek conn.log, TLS/HTTP log, firewall or flow telemetry
          required_fields:
            - ts
            - uid
            - id.orig_h
            - id.orig_p
            - id.resp_h
            - id.resp_p
            - proto
            - service
            - duration
            - orig_bytes
            - resp_bytes
            - conn_state
        - source_type: inner-service-outcome
          name:
            zh: 内层服务会话与结果
            en: Inner Service Session and Outcome
          channel: RDP, SMB, authentication, application, file, and endpoint action logs
          required_fields:
            - event_time
            - endpoint_or_service_id
            - session_or_request_id
            - principal
            - source
            - destination
            - service
            - action
            - result
        - source_type: approved-tunnel-inventory
          name:
            zh: 批准隧道与服务映射
            en: Approved Tunnel and Service Mapping
          channel: asset, change, VPN, service-mesh, and remote-administration inventory
          required_fields:
            - owner
            - identity
            - endpoint_id
            - binary_or_config_hash
            - inner_service
            - inner_destination
            - outer_peer
            - domain_pair
            - ticket
            - valid_from
            - valid_to
      raw_to_normalized_fields:
        - raw: Sysmon Event 1 UtcTime, ProcessGuid, Image, CommandLine, ParentProcessGuid
          normalized: event_time, process_start_key, image, command_line, parent_process_key
        - raw: Sysmon Event 3 UtcTime, ProcessGuid, SourceIp, SourcePort, DestinationIp, DestinationPort, Protocol
          normalized: event_time, process_start_key, local_socket, remote_socket, protocol
        - raw: eBPF or EDR bind, listen, accept, connect identifiers
          normalized: direction, socket_or_flow_id and listener_to_accepted_socket
        - raw: Zeek conn.log uid and id tuple
          normalized: outer_flow_id and outer_five_tuple
        - raw: tunnel command or config local/remote forwards
          normalized: tunnel_id, inner_listener, inner_destination and outer_peer
        - raw: service audit session and action
          normalized: inner_session_id and successor_outcome
      observables:
        - zh: 同一隧道实例一侧接受本地/内部服务连接，另一侧建立允许外层流，并在内层服务产生成功会话或动作
          en: One tunnel instance accepts a local or internal service connection on one side, establishes an allowed outer flow on the other, and produces a successful inner-service session or action
        - zh: 边界没有内层服务端口，但端点 socket 图显示该服务字节与外层流存在稳定方向和寿命关系
          en: The boundary lacks the inner service port while the endpoint socket graph shows stable direction and lifetime relationships between that service's bytes and the outer flow
      correlation:
        window:
          zh: 从隧道进程/服务创建前十五分钟覆盖外层连接全寿命及终止后四十八小时；长连接按滚动五分钟配对内外 socket，配置 ID 可跨完整生命周期。
          en: Start fifteen minutes before tunnel process or service creation and span the outer connection lifetime plus forty-eight hours after termination; pair inner and outer sockets in rolling five-minute windows while configuration IDs join the full lifecycle.
        dimensions:
          - endpoint_id
          - tunnel_id
          - process_start_key
          - listener
          - inner_socket_or_session
          - outer_flow_id
          - inner_service
          - outer_peer
          - principal
          - ticket
          - time
      false_positives:
        - zh: 获批堡垒机、SSH 端口转发、企业 VPN、服务网格 sidecar、数据库代理、IDE 开发隧道和灾备管理路径
          en: Approved bastions, SSH forwarding, enterprise VPNs, service-mesh sidecars, database proxies, IDE development tunnels, and disaster-recovery paths
      blind_spots:
        - zh: 内核或设备级隧道无进程归属，边缘设备无 EDR，外层代理改写对端，第三方平台不共享 session，或内外层均加密
          en: Kernel or device tunnels lack process ownership, edge devices lack EDR, an outer proxy rewrites the peer, third-party platforms do not share sessions, or both layers are encrypted
        - zh: Sysmon Event 3 默认关闭且不记录所有监听/接受事件，单独依赖它无法构建完整 socket 图
          en: Sysmon Event 3 is disabled by default and does not record every listen or accept event, so it cannot build the complete socket graph alone
      tuning_guidance:
        paragraphs:
          - zh: >-
              按工作负载登记精确 inner service、outer peer、identity、binary/config 和期限；高置信以四门闭合及未批准路径为条件。合法工具不能按进程名永久放行，异常进程也不能在缺少 inner outcome 时直接定性。对 NAT、代理和容器 namespace 保存映射，并对边缘设备使用独立 flow 与服务日志补偿。
            en: >-
              Register exact inner service, outer peer, identity, binary or configuration, and validity by workload. Require all four gates plus an unapproved path for high confidence. Do not permanently allow a legitimate tool by process name, and do not classify an anomalous process without an inner outcome. Retain NAT, proxy, and container-namespace mappings and compensate for edge appliances with independent flows and service logs.
      evidence_keys:
        - REF-001024
        - REF-000230
        - REF-000634
        - B5-T1572-REF-OPENSSH-FORWARD
      logic_status: implementable_design_not_validated_on_local_data
    - temporary_key: B5-T1572-NJA-MULTIPLEX
      strategy_key: B5-T1572-DET-CROSSLAYER
      resolution_recommendation: create
      name:
        zh: 外层连接多流 fan-in 与内层结果分析
        en: Outer-Connection Multi-Stream Fan-In and Inner-Outcome Analytic
      platforms:
        - Windows
        - Linux
        - macOS
        - ESXi
      logic:
        paragraphs:
          - zh: >-
              为每个长期外层连接生成 outer_session_id，并从合法隧道控制日志、内存/样本解析、端点 socket 或可见 framing 中取得 stream_id、open/close、direction、inner destination 和 byte count。计算同时活动流数、每流寿命、流到本地 socket/任务的映射及一个外层连接的 fan_in_count。若一个未批准 outer session 在重叠时间内承载两个以上独立内层服务/任务，并产生文件管理、网络访问、shell 或 C2 结果，则输出 multiplexed_inner_sessions。
            en: >-
              Generate outer_session_id for every long-lived outer connection and obtain stream_id, open or close state, direction, inner destination, and byte count from legitimate tunnel-control logs, memory or sample parsing, endpoint sockets, or visible framing. Calculate concurrent stream count, per-stream lifetime, stream-to-local-socket or task mapping, and fan_in_count for one outer connection. Emit multiplexed_inner_sessions when an unapproved outer session carries at least two independent inner services or tasks during overlapping time and produces file-management, network-access, shell, or C2 outcomes.
          - zh: >-
              没有 stream ID 时，可用多个本地 socket 同时映射到同一 tunnel process 与 outer_flow_id 作为中置信 fan-in；只有长连接、流量突发或高字节数不能证明多路复用。HTTP/2、QUIC、企业 VPN、服务网格和远管平台本来会多路复用，必须与批准 controller/workload/peer 及内层结果对照。
            en: >-
              Without stream IDs, concurrent mapping of multiple local sockets to one tunnel process and outer_flow_id provides medium-confidence fan-in. A long connection, burst, or high byte count alone does not prove multiplexing. HTTP/2, QUIC, enterprise VPNs, service meshes, and remote-management platforms legitimately multiplex and require comparison with approved controller, workload, peer, and inner outcomes.
      data_requirements:
        - source_type: tunnel-stream-control
          name:
            zh: 多路流控制与解复用字段
            en: Multiplexed Stream Control and Demultiplexing Fields
          channel: tunnel server/client audit, decapsulator, memory capture, or validated sample parser
          required_fields:
            - event_time
            - endpoint_id
            - tunnel_id
            - outer_session_id
            - stream_id
            - stream_event
            - direction
            - inner_destination_or_service
            - byte_count
            - result
        - source_type: endpoint-socket-ownership
          name:
            zh: 本地 socket 至外层连接映射
            en: Local Socket to Outer Connection Mapping
          channel: EDR or eBPF socket telemetry
          required_fields:
            - event_time
            - endpoint_id
            - process_start_key_or_tunnel_id
            - local_socket_id
            - local_peer
            - outer_flow_id
            - bytes_in
            - bytes_out
            - duration
        - source_type: outer-network-flow
          name:
            zh: 外层长连接流量
            en: Outer Long-Lived Connection Flow
          channel: Zeek conn.log, firewall or flow telemetry
          required_fields:
            - ts
            - uid
            - source
            - destination
            - protocol
            - service
            - duration
            - orig_bytes
            - resp_bytes
            - packets
        - source_type: inner-task-or-service-outcome
          name:
            zh: 每流内层任务或服务结果
            en: Per-Stream Inner Task or Service Outcome
          channel: endpoint, application, file, shell, and remote-service audit
          required_fields:
            - event_time
            - endpoint_id
            - stream_or_session_id_when_available
            - action
            - target
            - result
        - source_type: approved-multiplexed-session-inventory
          name:
            zh: 批准多路会话清单
            en: Approved Multiplexed Session Inventory
          channel: VPN, service mesh, HTTP2 or QUIC, IDE, and remote-management governance
          required_fields:
            - owner
            - workload
            - controller_or_peer
            - outer_protocol
            - permitted_inner_services
            - max_streams
            - ticket
            - valid_from
            - valid_to
      raw_to_normalized_fields:
        - raw: tunnel library or decoder connection identifier
          normalized: outer_session_id
        - raw: Yamux, smux, HTTP2, QUIC, or equivalent stream identifier
          normalized: stream_id
        - raw: stream open, data, close, reset and window-update events
          normalized: stream_event and stream_lifetime
        - raw: process socket ID and Zeek uid
          normalized: local_socket_id and outer_flow_id
        - raw: concurrent active stream count
          normalized: fan_in_count
        - raw: file-manager call, network-tunnel destination, shell, or service audit
          normalized: inner_destination_or_service and inner_outcome
      observables:
        - zh: 一个外层会话在重叠时间内承载多个可分别打开/关闭的内层流并连接不同服务或任务
          en: One outer session carries several independently opened and closed inner streams during overlapping time and maps them to different services or tasks
        - zh: 多个本地 socket 的字节与寿命汇入同一 process/outer uid，后继结果证明不是独立无关连接
          en: Bytes and lifetimes from multiple local sockets fan into one process and outer uid, with successor outcomes proving they are not unrelated connections
      correlation:
        window:
          zh: 覆盖外层连接全寿命；流并发在滚动一分钟内计算，外层终止后保留四十八小时连接后继结果。
          en: Cover the full outer-connection lifetime, calculate stream concurrency in rolling one-minute windows, and retain successor outcomes for forty-eight hours after termination.
        dimensions:
          - endpoint_id
          - tunnel_id
          - outer_session_id
          - outer_flow_id
          - stream_id
          - local_socket_id
          - inner_destination_or_service
          - controller_or_peer
          - time
      false_positives:
        - zh: 正常 HTTP/2、QUIC、企业 VPN、服务网格、远控平台、数据库连接池和应用网关会在单连接中承载多流
          en: Normal HTTP/2, QUIC, enterprise VPNs, service meshes, remote-control platforms, database pools, and application gateways carry multiple streams in one connection
      blind_spots:
        - zh: 多路 framing 在加密内层且无端点 stream telemetry，只能用 socket fan-in 推断
          en: Multiplex framing inside encryption without endpoint stream telemetry leaves only socket-fan-in inference
        - zh: 内核或设备实现不暴露 per-stream ID，连接迁移或重连改变 outer flow 标识
          en: Kernel or device implementations do not expose per-stream IDs, and connection migration or reconnect changes outer-flow identity
      tuning_guidance:
        paragraphs:
          - zh: >-
              为每类批准多路协议记录 owner、workload、peer、允许 inner service 和预期流数，不用固定“两个流”作为恶意阈值。高置信要求未批准关系、可分辨的独立内层流及至少一个恶意结果；加密场景保留 fan-in 证据但标注推断级别。
            en: >-
              Record owner, workload, peer, permitted inner services, and expected stream count for every approved multiplexed protocol rather than using a fixed two-stream malicious threshold. High confidence requires an unapproved relationship, distinguishable independent inner streams, and at least one malicious outcome. Preserve fan-in evidence in encrypted cases but label it inferential.
      evidence_keys:
        - B5-T1572-REF-BRICKSTORM
        - REF-000634
      logic_status: implementable_design_not_validated_on_local_data
    - temporary_key: B5-T1572-NJA-TRANSACTION
      strategy_key: B5-T1572-DET-CROSSLAYER
      resolution_recommendation: create
      name:
        zh: 外层事务分片—内层会话重组分析
        en: Outer-Transaction Fragment–Inner-Session Reassembly Analytic
      platforms:
        - Windows
        - Linux
        - macOS
        - ESXi
      logic:
        paragraphs:
          - zh: >-
              按 endpoint/process、外层目的域或服务、协议 transaction ID 和时间收集 DNS/HTTP 等请求响应原件。在合法授权的解析环境中，从候选字段提取 session ID、packet type、fragment index/total、offset、declared size 和 payload，按 session 与方向去重、排序、重组并记录每步输入输出摘要。只有重组结果呈现可识别内层状态机、与已知另一承载版本同构的命令结构或可重复 SYN/MSG/FIN 会话，并连接端点命令/文件/C2 结果时，才输出 transactionized_inner_tunnel。
            en: >-
              Collect original DNS, HTTP, or equivalent requests and responses by endpoint or process, outer destination domain or service, protocol transaction ID, and time. In an authorized analysis environment, extract session ID, packet type, fragment index and total, offset, declared size, and payload from candidate fields; deduplicate, order, and reassemble by session and direction while recording input and output digests for every step. Emit transactionized_inner_tunnel only when the reassembled result exposes a recognizable inner state machine, a command structure isomorphic to a known alternate-carrier version, or a repeatable SYN, MSG, and FIN session, and it joins to endpoint command, file, or C2 outcome.
          - zh: >-
              仅长 DNS 标签、高熵、TXT/AAAA 频率、HTTP polling 或 NXDOMAIN 不足以证明隧道。解析器无法恢复 session/fragment 关系时输出 tunnel_shape_candidate；DoH 只能看到 HTTPS 时需端点 DNS API、受管 resolver 或客户端配置补足。TrickBot 的 C2 已下线且研究者用模拟服务端生成响应，因此正式案例把请求结构与客户端重组逻辑列为直接证据，把服务端现场行为标为实验复现。
            en: >-
              Long DNS labels, high entropy, TXT or AAAA frequency, HTTP polling, or NXDOMAIN alone do not prove a tunnel. Emit tunnel_shape_candidate when the parser cannot recover session or fragment relationships. Where DoH exposes only HTTPS, use endpoint DNS API, a managed resolver, or client configuration as compensation. TrickBot's C2 was offline and the researcher generated responses with a simulated server, so its request structure and client reassembly logic are direct evidence while server-side field behavior is experimental reproduction.
      data_requirements:
        - source_type: outer-protocol-transactions
          name:
            zh: DNS、HTTP 或其他外层事务
            en: DNS, HTTP, or Other Outer Transactions
          channel: Zeek dns.log/http.log, managed resolver or proxy, full packet capture where authorized
          required_fields:
            - event_time
            - endpoint_or_source
            - process_key_when_available
            - transaction_or_uid
            - direction
            - query_or_uri_or_field
            - qtype_or_method
            - rcode_or_status
            - answers_or_response_field
            - raw_object_hash
        - source_type: tunnel-fragment-parser
          name:
            zh: 隧道字段提取与重组记录
            en: Tunnel Field Extraction and Reassembly Record
          channel: sandbox, network decapsulator, protocol parser, or forensic script
          required_fields:
            - event_time
            - parser_id_and_version
            - input_object_hash
            - outer_transaction_id
            - tunnel_session_id
            - packet_type
            - fragment_index
            - fragment_total
            - offset
            - declared_size
            - direction
            - payload_hash
            - reassembled_object_hash
            - parse_result
        - source_type: endpoint-network-and-outcome
          name:
            zh: 进程网络、DNS API 与后继结果
            en: Process Network, DNS API, and Successor Outcome
          channel: EDR, Sysmon Events 3 and 22, process/file/action audit
          required_fields:
            - event_time
            - endpoint_id
            - process_start_key
            - image
            - destination
            - protocol
            - query_name_when_available
            - action
            - result
        - source_type: approved-transaction-tunnel-inventory
          name:
            zh: 批准事务隧道与 DoH 清单
            en: Approved Transaction Tunnel and DoH Inventory
          channel: network, endpoint, application, and privacy governance
          required_fields:
            - owner
            - workload
            - process_or_client
            - outer_service
            - tunnel_purpose
            - permitted_inner_semantics
            - parser_or_inspection_point
            - ticket
            - valid_from
            - valid_to
      raw_to_normalized_fields:
        - raw: Zeek dns.log ts, uid, query, qtype_name, rcode_name, answers
          normalized: event_time, outer_transaction_id, request_field, outer_type, response_status and response_field
        - raw: Zeek http.log ts, uid, method, host, uri, status_code, body object
          normalized: event_time, outer_transaction_id, outer_service, request_field, response_status and raw_object_hash
        - raw: malware or tunnel parser packet UUID/session ID
          normalized: tunnel_session_id
        - raw: fragment index, total fragments, byte offset and declared length
          normalized: fragment_index, fragment_total, offset and declared_size
        - raw: sorted or decoded fragment bytes
          normalized: payload_hash and reassembled_object_hash
        - raw: recovered command header, SYN/MSG/FIN or alternate-carrier command structure
          normalized: inner_protocol_or_state_machine
        - raw: process execution, file operation, result upload or persistent callback
          normalized: successor_outcome
      observables:
        - zh: 多个外层事务共享隧道 session ID 和互补片号/offset，重组后出现可执行命令或稳定内层状态机
          en: Multiple outer transactions share a tunnel session ID and complementary fragment indexes or offsets, reconstructing an executable command or stable inner state machine
        - zh: 请求与响应方向分别携带内层任务和结果，且端点同一进程消费重组对象并产生后继动作
          en: Request and response directions carry inner tasking and results, and the same endpoint process consumes the reassembled object and produces a successor action
      correlation:
        window:
          zh: 依据合法 resolver/proxy 保留与隧道重传设置，默认每 session 两小时，低速隧道可扩展至二十四小时；严格保留 direction、index 和 offset 顺序。
          en: Set by resolver or proxy retention and tunnel retransmission behavior, two hours per session by default and up to twenty-four hours for low-rate tunnels; preserve direction, index, and offset ordering strictly.
        dimensions:
          - endpoint_id
          - process_start_key
          - outer_service_or_domain
          - outer_transaction_id
          - tunnel_session_id
          - direction
          - fragment_index
          - offset
          - reassembled_object_hash
          - inner_protocol_or_state_machine
          - time
      false_positives:
        - zh: 合法 DoH、DNSSEC、CDN/遥测、邮件或 Web 分块上传、企业 DNS 隧道、监控代理和低带宽设备协议
          en: Legitimate DoH, DNSSEC, CDN or telemetry, chunked mail or web upload, enterprise DNS tunnels, monitoring agents, and low-bandwidth device protocols
      blind_spots:
        - zh: DoH/DoT 内容不可见、递归器缓存与重排、采样 flow 无原始字段、未知加密/编码、session ID 随包变化或低速周期超过保留期
          en: Opaque DoH or DoT, resolver caching and reordering, sampled flow without raw fields, unknown encryption or encoding, per-packet-changing session IDs, or low-rate cycles beyond retention
      tuning_guidance:
        paragraphs:
          - zh: >-
              先按批准 resolver、应用和域基线排除合法编码，再以可复核 session/fragment/offset 和重组结果作为硬门。查询长度、熵、记录类型和频率只用于候选排序。解析器需限制 session 数、内存、总重组字节和超时，并保存失败片段，不对未知内容强行解码或按域名永久白名单。
            en: >-
              Baseline approved resolvers, applications, and domains before treating encoding as suspicious, then use reproducible session, fragment, offset, and reassembled outcome as hard gates. Query length, entropy, record type, and frequency only prioritize candidates. Bound parser session count, memory, total reassembled bytes, and timeout while preserving failed fragments; do not force unknown content through a decoder or permanently allowlist a domain.
      evidence_keys:
        - B5-T1572-REF-TRICKBOT-DNS
        - B5-T1572-REF-DNSCAT2
        - REF-000635
        - REF-000632
        - REF-000230
      logic_status: implementable_design_not_validated_on_local_data
  mitigations:
    - temporary_key: B5-T1572-MIT-EXTEND-MIT000172
      resolution_recommendation: extend
      existing_ref: MIT-000172
      name:
        zh: 扩展独立网络分段与中继路径治理以覆盖隧道
        en: Extend Independent Network Segmentation and Relay-Path Governance for Tunnels
      rationale:
        zh: MIT-000172 已拥有批准 path graph、隧道/port forward/VPN 最小权限、双侧 flow 和独立分段控制，同义于 T1572 的路径准入与端点治理。保持 measures 不变，增加逐目标 applications。
        en: MIT-000172 already owns approved path graphs, least authority for tunnels, port forwards, and VPNs, bilateral flows, and independent segmentation controls, matching T1572 path admission and endpoint governance. Keep measures unchanged and add target applications.
      applications:
        - target_key: B5-T1572-PARENT
          use:
            zh: 为每条批准隧道登记 owner、identity、binary/config hash、两端、inner protocol/service、outer protocol/peer、domain pair、用途和到期；默认阻断未批准 listener、port forward、VPN、服务网格和隧道客户端，并在独立边界重复限制。发现异常时同时撤销两端身份/配置并验证内外 flow 终止。
            en: Register owner, identity, binary or configuration hash, both endpoints, inner protocol or service, outer protocol or peer, domain pair, purpose, and expiry for every approved tunnel. Deny unapproved listeners, forwards, VPNs, service meshes, and tunnel clients by default and repeat restrictions at an independent boundary. On anomaly revoke identity and configuration at both endpoints and verify termination of inner and outer flows.
          expected_effect:
            zh: 攻击者不能仅选择一个允许外层协议就获得任意内层路径，未登记内外映射和双侧流量会显著暴露。
            en: Selecting an allowed outer protocol no longer grants arbitrary inner paths, and unregistered inner-to-outer mappings plus bilateral flows become conspicuous.
          limitations:
            zh: 自定义用户态隧道可改名，内核/设备隧道可能无进程，动态服务网格和 MSP 路径维护复杂；严格默认拒绝会影响远程运维和业务连续性。
            en: Custom user-space tunnels can be renamed, kernel or device tunnels may lack processes, and dynamic service-mesh or MSP paths are difficult to inventory. Strict default denial can disrupt remote administration and business continuity.
        - target_key: B5-T1572-SUB-ENDPOINT
          use:
            zh: 对 SSH 等受管入口使用 DisableForwarding、AllowTcpForwarding、PermitOpen/PermitListen 或等效策略限制转发方向与目标；对其他隧道限制监听权限、可访问内层服务和 outer peer，并把本地 socket—outer flow 映射外送审计。
            en: On managed SSH entry points use DisableForwarding, AllowTcpForwarding, PermitOpen or PermitListen, or equivalent policy to constrain forwarding direction and destination. For other tunnels restrict listener authority, reachable inner services, and outer peers and export local-socket-to-outer-flow mapping for audit.
          expected_effect:
            zh: 未批准本地服务无法被任意绑定进允许隧道，内层服务目标和外层出口必须同时符合策略。
            en: Unauthorized local services cannot be arbitrarily bound into an allowed tunnel, and inner service destination plus outer egress must both satisfy policy.
          limitations:
            zh: OpenSSH 官方说明仅禁用 forwarding 对仍有 shell 的用户并非完整安全边界；攻击者可上传自定义 forwarder，因此还需应用控制、网络分段和端点 socket 检测。
            en: OpenSSH documentation notes that disabling forwarding alone is not a complete boundary for users who retain a shell because they can install another forwarder; application control, segmentation, and endpoint socket detection remain necessary.
        - target_key: B5-T1572-SUB-MULTIPLEX
          use:
            zh: 对批准多路协议限定 controller/peer、允许 inner service、最大并发流和 session 生命周期，并在网关或端点输出 per-stream ID 与目标；未知加密多路连接不能仅因外层协议获准而整体放行。
            en: For approved multiplexed protocols constrain controller or peer, permitted inner services, maximum concurrent streams, and session lifetime and export per-stream IDs and destinations at gateway or endpoint. Do not allow an unknown encrypted multiplexed connection solely because its outer protocol is approved.
          expected_effect:
            zh: 单外层连接不能无限承载未登记的并发控制流，异常 fan-in 和内层目标可被审计或阻断。
            en: One outer connection cannot carry unlimited unregistered concurrent control streams, and anomalous fan-in plus inner destinations become auditable or blockable.
          limitations:
            zh: HTTP/2、QUIC、VPN 和服务网格本身需要高并发，固定流数阈值会误报；没有 per-stream telemetry 时只能限制 peer/workload 并依赖 endpoint fan-in。
            en: HTTP/2, QUIC, VPN, and service meshes legitimately need high concurrency, so fixed stream thresholds create false positives. Without per-stream telemetry controls are limited to peer and workload plus endpoint fan-in.
      evidence_keys:
        - REF-001024
        - B5-T1572-REF-BRICKSTORM
        - B5-T1572-REF-OPENSSH-FORWARD
        - REF-000230
    - temporary_key: B5-T1572-MIT-EXTEND-MIT000200
      resolution_recommendation: extend
      existing_ref: MIT-000200
      name:
        zh: 扩展角色绑定协议中介与跨面保留以覆盖事务化隧道
        en: Extend Role-Bound Protocol Mediation and Cross-Surface Retention for Transactionized Tunnels
      rationale:
        zh: MIT-000200 已拥有受管 DNS/Web 中介、按角色限制协议和跨观察面字段保留；T1572 事务重组需要相同控制概念。保持 measures 不变，仅增加事务化子项 application。
        en: MIT-000200 already owns managed DNS and web intermediaries, role-bound protocol restriction, and cross-surface field retention, the same control concept needed for transactionized T1572. Keep measures unchanged and add one child application.
      applications:
        - target_key: B5-T1572-SUB-TRANSACTION
          use:
            zh: 强制终端只使用受管 DNS resolver 和 Web proxy，阻断直接外部 DNS/DoT/未经批准 DoH 与不登记 polling 服务；在隐私和权限允许范围内保留原始 query/answer、HTTP 字段、uid、进程键和方向，使专用解析器能按 session/fragment/offset 重组。对合法事务隧道绑定应用、域、inner semantic、用途和到期。
            en: Force endpoints through managed DNS resolvers and web proxies and block direct external DNS, DoT, unapproved DoH, and unregistered polling services. Within privacy and authorization limits retain raw query and answer, HTTP fields, uid, process key, and direction so a purpose-built parser can reassemble by session, fragment, and offset. Bind legitimate transaction tunnels to application, domain, inner semantic, purpose, and expiry.
          expected_effect:
            zh: 攻击者可用的外层事务路径收窄，跨事务关联字段保留，内层会话不再因单查询/响应观察而永久丢失。
            en: Available outer transaction paths narrow, cross-transaction join fields are retained, and inner sessions are no longer permanently lost to single-query or response observation.
          limitations:
            zh: 外部网络、移动设备、证书固定和隐私要求可能阻止中介检查；受管 resolver 被控、域名获准或未知加密 framing 时仍需端点解析与结果检测。
            en: External networks, mobile devices, certificate pinning, and privacy requirements may prevent intermediary inspection. A compromised managed resolver, approved domain, or unknown encrypted framing still requires endpoint parsing and outcome detection.
      evidence_keys:
        - B5-T1572-REF-TRICKBOT-DNS
        - B5-T1572-REF-DNSCAT2
        - REF-000635
        - REF-000632
