        en: The sample, client code, and request structure are direct reverse-engineering evidence. The original C2 was offline and the researcher simulated responses with a Python server, so server response behavior and throughput are experimental reproduction rather than field observation.
    - key: B5-T1572-REF-DNSCAT2
      title:
