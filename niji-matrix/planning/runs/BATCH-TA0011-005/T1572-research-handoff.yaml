    defense_field_support:
      - source: REF-000230
        support: process GUID, process creation, command line, TCP or UDP network connection and endpoint fields; Event 3 disabled by default
      - source: REF-000634
        support: connection uid, endpoint tuple, protocol, service, duration, bytes, packets and tunnel_parents when populated
      - source: REF-000635
        support: DNS uid, query, type, response code and answers for transaction grouping
      - source: REF-000632
        support: HTTP uid, host, URI, method, status and lengths for outer transaction grouping
      - source: B5-T1572-REF-ZEEK-TUNNEL
