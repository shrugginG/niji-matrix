        zh: 文档证明 Zeek 对支持的 IP/GRE/Teredo 等封装可输出内外关联；不能自动解析任意 SSH、TLS、WebSocket、Yamux 或自定义 DNS 隧道。
        en: The documentation establishes inner-to-outer linkage for supported IP, GRE, Teredo, and similar encapsulation. It does not automatically parse arbitrary SSH, TLS, WebSocket, Yamux, or custom DNS tunnels.
    - key: B5-T1572-REF-OPENSSH-FORWARD
      title:
        zh: OpenSSH sshd_config 转发控制
        en: OpenSSH sshd_config Forwarding Controls
      source_type: official-documentation
      publisher: OpenBSD
      url: https://man.openbsd.org/sshd_config
      locator: DisableForwarding, AllowTcpForwarding, AllowStreamLocalForwarding, PermitOpen, PermitListen, GatewayPorts and documented limitations
      credibility: high
      evidence_limit:
        zh: 文档证明受管 sshd 可限制转发目标和方向，也明确指出保留 shell 的用户可安装自有 forwarder；它不证明所有隧道可由 SSH 配置控制。
        en: The documentation establishes that managed sshd can restrict forwarding targets and directions and explicitly notes that users retaining a shell can install their own forwarder. It does not establish control over every tunneling implementation.
  claims:
    - key: B5-T1572-CLM-PARENT
      statement:
        zh: T1572 要求完整或可重建的内层会话语义由另一外层协议/连接承载，并在解封装后产生 C2、远程访问或跨边界结果。
        en: T1572 requires an intact or reconstructable inner session semantic carried by another outer protocol or connection and a C2, remote-access, or cross-boundary outcome after decapsulation.
      evidence_keys:
        - REF-000625
        - REF-001024
        - B5-T1572-REF-BRICKSTORM
        - B5-T1572-REF-TRICKBOT-DNS
      evidence_mode: direct-parent-and-incident-or-sample-analysis
    - key: B5-T1572-CLM-ENDPOINT
      statement:
        zh: APT29 的 meek/Tor 链把外层 Google 形态 HTTPS 与受害主机本地 NetBIOS、SMB 和 Terminal Services 端点分离，支持内层服务端点解耦为独立变量。
        en: APT29's meek and Tor chain separates a Google-like HTTPS outer flow from local victim NetBIOS, SMB, and Terminal Services endpoints, supporting inner-service endpoint decoupling as an independent variable.
      evidence_keys:
        - REF-001024
      evidence_mode: field-observation
    - key: B5-T1572-CLM-MULTIPLEX
      statement:
        zh: BRICKSTORM 使用 Yamux/smux 在一个嵌套外层连接中创建多个并发 C2 与网络隧道流，并再次多路复用，支持外层会话多流汇聚变量。
        en: BRICKSTORM uses Yamux or smux to create multiple concurrent C2 and network-tunnel streams inside one nested outer connection and multiplexes again, supporting outer-session multi-stream convergence.
      evidence_keys:
        - B5-T1572-REF-BRICKSTORM
      evidence_mode: direct-sample-analysis
    - key: B5-T1572-CLM-TRANSACTION
      statement:
        zh: TrickBot 以 session ID、分片序号、总片数、大小与 offset 跨 DNS 请求/响应重组与 HTTP 版本同构的命令结构，支持事务化内层流重组变量。
        en: TrickBot uses session IDs, fragment index and count, size, and offsets to reconstruct an HTTP-isomorphic command structure across DNS requests and responses, supporting transactionized inner-stream reassembly.
      evidence_keys:
        - B5-T1572-REF-TRICKBOT-DNS
      evidence_mode: direct-client-analysis-plus-lab-response-reproduction
    - key: B5-T1572-CLM-BOUNDARY
      statement:
        zh: 两段中介转发、应用事务直接 C2、直接低层 C2、加密和合法远控工作流均不能替代内外层封装证据；可并列但各自结果门独立。
        en: Two-leg intermediary relaying, direct application-transaction C2, direct lower-layer C2, encryption, and legitimate remote-control workflows cannot substitute for inner-to-outer encapsulation evidence; they can co-classify but retain independent outcome gates.
      evidence_keys:
        - REF-001024
        - B5-T1572-REF-TRICKBOT-DNS
        - B5-T1572-REF-BRICKSTORM
      evidence_mode: cross-technique-boundary-inference
    - key: B5-T1572-CLM-DEFENSE
      statement:
        zh: 高置信检测需从端点 socket、隧道控制字段或支持的解封装日志恢复内层关系，并与后继结果连接；外层长连接、DNS 形态或工具名只可生成候选。
        en: High-confidence detection must recover an inner relationship from endpoint sockets, tunnel-control fields, or supported decapsulation logs and join it to a successor outcome; an outer long connection, DNS shape, or tool name creates a candidate only.
      evidence_keys:
        - B5-T1572-REF-ZEEK-TUNNEL
        - REF-000230
        - B5-T1572-REF-TRICKBOT-DNS
        - B5-T1572-REF-BRICKSTORM
      evidence_mode: implementable-design-supported-by-field-and-protocol-documentation
  cases:
    - key: B5-T1572-CASE-BRICKSTORM
      name:
        zh: BRICKSTORM 嵌套连接与 Yamux 多流 C2
        en: BRICKSTORM Nested Connection and Yamux Multi-Stream C2
      actor_or_campaign: BRICKSTORM-related espionage activity
      central_facts:
        zh: NVISO 逆向样本恢复 HTTPS→WebSocket→嵌套 TLS→认证→Yamux 的层链，操作者为网络隧道和文件管理打开并发 multiplexed sessions，并在后续层再次汇聚多个会话。
        en: NVISO reverse engineering recovers an HTTPS-to-WebSocket-to-nested-TLS-to-authentication-to-Yamux chain, with operators opening concurrent multiplexed sessions for network tunnels and file management and converging multiple sessions again in a later layer.
      evidence_keys:
        - B5-T1572-REF-BRICKSTORM
      scope_limit:
        zh: 报告未确定部分更深 TLS 在二级还是三级基础设施终止，也未提供每个受害者的生产流量完整解密；案例限于样本 framing 和报告所述活动能力。
        en: The report does not establish where some deeper TLS layers terminate in second- or third-tier infrastructure and provides no complete production decryption for every victim. The case is limited to sample framing and reported operational capabilities.
    - key: B5-T1572-CASE-TRICKBOT-DNS
      name:
        zh: TrickBot DNS 事务中的内层命令会话重组
        en: TrickBot Inner Command-Session Reassembly across DNS Transactions
      actor_or_campaign: TrickBot DNS-tunneling sample family
      central_facts:
        zh: FortiGuard 逆向客户端恢复 session ID、0x30 分片请求、0x31 大小查询、0x32 offset 应答和 IP 排序重组，最终命令结构与 HTTP 版本相同。
        en: FortiGuard reverse engineering recovers client session IDs, fragmented 0x30 requests, 0x31 size queries, 0x32 offset responses, and IP sorting and reassembly, yielding the same command structure as the HTTP version.
      evidence_keys:
        - B5-T1572-REF-TRICKBOT-DNS
      scope_limit:
        zh: 服务端已下线，响应由研究者实验脚本模拟；客户端结构为直接证据，完整服务端交互与吞吐为实验复现。
        en: The server was offline and responses were simulated by the researcher's lab script. Client structure is direct evidence, while full server interaction and throughput are experimental reproduction.
