    unsupported_or_deferred:
      - Outer TLS, SSH, VPN, WebSocket, DNS shape, long duration, or a tunneling tool alone does not establish an inner protocol.
      - No source provides universal byte-ratio, stream-count, label-length, entropy, or duration thresholds for malicious tunnels.
      - BRICKSTORM inner multiplexing may be opaque on production wire without keys or endpoint telemetry; NVISO sample analysis does not guarantee enterprise decapsulation.
      - TrickBot server behavior and throughput were reproduced in a lab because the original server was offline.
      - Legitimate VPNs, service meshes, development tunnels, and administration forwarding can reproduce every coarse outer-flow feature and need exact governance context.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级提案覆盖内外层定义、残余痕迹、四门结果、五项相邻边界、两类实际场景、攻防能力和传感器限制。三个子项目前为分类与因果研究摘要；主 Agent 正式写入时仍需按 NJT-0001 为每个 NJS 独立补齐完整双语字段，不能把摘要直接当正式子项正文。
      en: >-
        The parent proposal covers inner and outer definitions, residual traces, the four-gate outcome, five adjacent boundaries, two operational scenarios, attacker and defender capabilities, and sensor limits. The three child records are taxonomy and causal research summaries. The primary agent must independently author every NJS's complete bilingual fields against NJT-0001 rather than use these summaries as canonical child prose.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - staging YAML serialization
      - YAML parse verification
      - evidence-key consistency check
      - shared-library URL and semantic lookup
  limitations:
    paragraphs:
      - zh: >-
          三项主证据处于不同层级。APT29/meek 是 Mandiant 现场观察，能证明外层 HTTPS/Tor 与本地服务关系，但同时含域前置、中介路由和双层加密，不能把所有匿迹效果只归因于隧道。BRICKSTORM 是多个样本和事件响应材料的逆向，可证明多路 framing，生产网络若无密钥仍可能不可解。TrickBot 是捕获样本与模拟服务端的实验链，应把客户端结构和实验响应严格区分。
        en: >-
          The three primary sources have different evidence levels. APT29 and meek are Mandiant field observations proving an outer HTTPS or Tor to local-service relationship, but the event also includes domain fronting, intermediary routing, and layered encryption, so stealth effect cannot be attributed solely to tunneling. BRICKSTORM combines multiple samples and incident-response material and establishes multiplex framing, while production traffic may remain undecodable without keys. TrickBot combines captured samples with a simulated server and requires strict separation between direct client structure and experimental responses.
      - zh: >-
          Zeek tunnel.log 只对支持的网络层封装提供可靠 tunnel_parent，不能普遍解出 SSH、TLS、WebSocket、Yamux 或自定义 DNS。Sysmon Event 3 默认关闭且只记录连接，不完整覆盖 listen/accept；端点 socket 图通常需要 EDR/eBPF 或平台专用审计。缺少这些字段时，长连接、fan-in、字节比和 DNS 形态只支持候选，不满足正式 T1572 结果门。
        en: >-
          Zeek tunnel.log supplies reliable tunnel_parent linkage only for supported network-layer encapsulation and does not generally decode SSH, TLS, WebSocket, Yamux, or custom DNS. Sysmon Event 3 is disabled by default and records connections without complete listen or accept coverage; endpoint socket graphs usually need EDR, eBPF, or platform-specific audit. Without those fields, a long connection, fan-in, byte ratio, or DNS shape supports a candidate only and does not pass the formal T1572 outcome gate.
      - zh: >-
          生产环境广泛使用合法 VPN、服务网格、SSH forwarding、IDE tunnels、远控 relay、数据库代理和 HTTP/2/QUIC 多路复用。缓解措施若仅按工具、端口、加密或并发数阻断会产生显著业务影响，也可被改名绕过。必须以批准 path graph、身份、inner service、outer peer、配置摘要和期限实施；OpenSSH 控制不能阻止有 shell 权限的用户安装另一 forwarder。
        en: >-
          Production environments widely use legitimate VPNs, service meshes, SSH forwarding, IDE tunnels, remote-control relays, database proxies, and HTTP/2 or QUIC multiplexing. Controls based only on tool, port, encryption, or concurrency cause significant business impact and are bypassed by renaming. Enforcement needs an approved path graph, identity, inner service, outer peer, configuration digest, and expiry. OpenSSH controls cannot stop a user retaining shell access from installing another forwarder.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 封装改变解析层，但内层语义可经解封装恢复；内容是否因编码或加密不可理解分别由 T1132/T1573 处理，不能由隧道自动推出。
        en: Encapsulation changes parse layers while inner semantics remain recoverable through decapsulation; encoding- or encryption-based unintelligibility belongs to T1132 or T1573 and cannot be inferred from tunneling.
    - mechanism_ref: NM-FD
      reason:
        zh: 某些隧道模仿正常服务或借可信域，但服务外观由 NJT-0152 或 NJT-0206-003 拥有；普通隧道不必伪造外观。
        en: Some tunnels imitate normal services or borrow trusted domains, but service appearance belongs to NJT-0152 or NJT-0206-003 and ordinary tunneling need not disguise appearance.
    - mechanism_ref: NM-ST
      reason:
        zh: 事务分片和多流汇聚分别在子项中可形成时空关联差，但普通父级单流封装不必分散痕迹，故不作为父级机理。
        en: Transaction fragmentation and stream convergence can create correlation differences in their children, but ordinary parent-level single-stream encapsulation need not disperse traces, so NM-ST is not a parent mechanism.
  open_questions:
    - Can production tooling expose per-stream Yamux or equivalent identifiers without decrypting sensitive payload content?
    - Which endpoint products provide complete bind, listen, accept, connect, and socket-to-process lifecycle on Windows, Linux, macOS, ESXi, and network appliances?
    - Should CASE-000298 extend to both the T1572 parent and endpoint-decoupling child, or only the parent because domain fronting and routing authority are co-dominant?
    - Can managed DNS and proxy retention legally preserve the raw fields needed for transaction reassembly, and what limits apply by jurisdiction and workload?
