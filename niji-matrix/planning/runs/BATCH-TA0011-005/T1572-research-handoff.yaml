  relationship_refs: []
  notes:
    zh: >-
      REF-000625 应扩展 locator 到 T1572 父行为、TA0011 映射和零子项广度。REF-001024 与 CASE-000298 可直接复用，并把新父级和内层服务端点解耦子项加入 CASE subject_refs；中央事实不变。DET-000191/NJA-000214 只证明 overlay relay 的双侧会话与禁止路径，不要求内层/外层协议语义，因此不能 extend 为 T1572；新 DET/NJA 应 split/create，并在缺少内层证据时降级交接给 NJA-000214。MIT-000172 与 MIT-000200 的措施语义分别覆盖隧道准入/双侧治理和受管事务中介/跨面保留，应 extend applications，不创建同义 MIT。
    en: >-
      Extend REF-000625's locator to T1572 parent behavior, TA0011 mapping, and zero-child breadth. REF-001024 and CASE-000298 are direct reuse candidates; add the new parent and Inner-Service Endpoint Decoupling child to CASE subject_refs without changing its central fact. DET-000191 and NJA-000214 establish bilateral overlay relay and prohibited paths but do not require inner and outer protocol semantics, so they cannot be extended to T1572. Split and create the new DET and NJAs, downgrading and handing off to NJA-000214 when inner evidence is absent. MIT-000172 and MIT-000200 already own tunnel admission or bilateral governance and managed transaction mediation or cross-surface retention respectively, so extend applications rather than create synonymous mitigations.
library_candidates:
  references:
    - key: B5-T1572-REF-BRICKSTORM
      title:
        zh: NVISO BRICKSTORM 后门详细分析
        en: NVISO BRICKSTORM Backdoor Detailed Analysis
      source_type: incident-and-sample-analysis
      publisher: NVISO Incident Response
      published: '2025-04-01'
      url: https://blog.nviso.eu/wp-content/uploads/2025/04/NVISO-BRICKSTORM-Report.pdf
      locator: pages 9 to 13 WebSocket, nested TLS, authentication, Yamux or smux multiplexing, concurrent network-tunnel and file-manager sessions
      credibility: high
      evidence_limit:
        zh: 报告逆向多个 BRICKSTORM 样本并重建 framing，但部分基础设施层终止位置不明；多层 TLS 的检测规避结论来自传感器模型，未提供统一生产漏报率。
        en: The report reverse engineers multiple BRICKSTORM samples and reconstructs framing, but termination location for some infrastructure layers remains unknown. Detection-evasion conclusions for layered TLS follow a sensor model and no universal production miss rate is provided.
    - key: B5-T1572-REF-TRICKBOT-DNS
