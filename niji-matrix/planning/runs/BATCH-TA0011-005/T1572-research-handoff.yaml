research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - axis: inner_service_to_outer_endpoint_decoupling
        result: formal-candidate
        reason: APT29 field evidence and endpoint socket versus boundary five-tuple defense distinction
      - axis: multiple_inner_streams_to_one_outer_session
        result: formal-candidate
        reason: BRICKSTORM sample-level Yamux and smux evidence with per-stream or endpoint fan-in defense
      - axis: one_inner_stream_across_outer_transactions
        result: formal-candidate
        reason: TrickBot session, fragment, offset, and reassembly evidence with cross-transaction decoder defense
      - axis: single_stream_encapsulation
        result: parent-core
        reason: defines T1572 but lacks an additional stable observation differential
      - axis: outer_encryption
        result: adjacent-technique
        owner: T1573
      - axis: intermediary_hop_count
        result: adjacent-technique
        owner_ref: NJT-0206
      - axis: direct_application_transaction
        result: adjacent-technique
        owner_ref: NJT-0160
      - axis: direct_lower_layer_carriage
        result: adjacent-technique
        owner_ref: NJT-0208
      - axis: trusted_IDE_or_remote_tool_workflow
        result: adjacent-technique
        owner_ref: NJT-0212
      - axis: protocol_or_tool_name
        result: not-stealth-distinct
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线无 ATT&CK 子项，但开放检验了端点、连接基数、事务连续性、加密、路径跳数、承载层、远控工作流和协议/工具名。三个正式候选分别改变不同关联问题并具有独立一手证据与防御；其余归父级、相邻或非匿迹变量。
      en: The fixed baseline has no ATT&CK children, but the open search tested endpoint relationship, connection cardinality, transaction continuity, encryption, path hops, carriage layer, remote-control workflow, and protocol or tool name. The three formal candidates change different correlation problems and have independent primary evidence and defenses; the rest are parent-core, adjacent, or non-stealth variables.
  evidence_coverage:
    parent_behavior_keys:
      - REF-000625
      - REF-001024
      - B5-T1572-REF-BRICKSTORM
      - B5-T1572-REF-TRICKBOT-DNS
    boundary_keys:
      - REF-001024
      - B5-T1572-REF-BRICKSTORM
      - B5-T1572-REF-TRICKBOT-DNS
      - B5-T1572-REF-DNSCAT2
      - B5-T1572-REF-OPENSSH-FORWARD
    mechanism_support:
