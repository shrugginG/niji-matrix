      notes:
        zh: 为可复用 secret 和运行时生成的 bulk key 提供实现证据；不按 symmetric 标签直接成为 NJS。
        en: Supplies implementation evidence for reusable secrets and runtime-generated bulk keys and does not become an NJS
          by the symmetric label.
    - attack_id: T1573.002
      attack_name: Asymmetric Cryptography
      resolution: planning-reference-only
      notes:
        zh: 为 runtime key agreement、message-key wrapping 和嵌套 carrier 场景提供实现证据；不按 asymmetric/TLS 标签直接成为 NJS。
        en: Supplies implementation evidence for runtime key agreement, message-key wrapping, and nested-carrier scenarios
          and does not become an NJS by the asymmetric or TLS label.
    candidate_stealth_axes_examined:
    - axis: key_lifetime_reusable
      resolution: formal-candidate
