      resolution: adjacent-T1572
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两个 ATT&CK 子项只覆盖算法家族，不能直接复制。开放搜索以 key lifetime 与 inspection location 收敛出三项候选：前两项在所评估 traffic secret scope 上互斥，第三项为可组合的正交检查轴；Cyclops
        Blink 直接支持 runtime+nested，本批不直接支持 reusable+nested。
      en: The two ATT&CK children cover algorithm families and cannot be copied. Open search converged on key lifetime and
        inspection location. The first two candidates are mutually exclusive at the evaluated traffic-secret scope, while
        the third is an orthogonal combinable inspection axis. Cyclops Blink directly supports runtime plus nested; this batch
        does not directly support reusable plus nested.
