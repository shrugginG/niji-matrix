      zh: 3PARA 的固定字符串派生 DES/XOR 路径跨任务和结果复用，并由已恢复命令集闭合 C2 结果。
      en: 3PARA reuses a fixed-string-derived DES or XOR path across tasking and results, with the recovered command set closing
        the C2 outcome.
    evidence_keys:
    - B5-T1573-REF-3PARA
    confidence: high
  - key: B5-T1573-CLAIM-RUNTIME
    claim:
      zh: Snake 的 PSK+DH 会话秘密和 Cyclops Blink 的每消息随机 secret 均使 key recovery 限定于运行时 scope，区别于样本内跨会话固定 secret。
      en: Snake's PSK plus Diffie-Hellman session secret and Cyclops Blink's random per-message secret scope recovery to runtime,
        unlike a sample-resident cross-session fixed secret.
    evidence_keys:
    - B5-T1573-REF-SNAKE
    - B5-T1573-REF-CYCLOPS
    confidence: high
  - key: B5-T1573-CLAIM-NESTED
    claim:
      zh: Cyclops Blink 的每消息封套位于 TLS 内，证明 carrier TLS 解密和 attacker-layer 解密是两个独立观察边界；其同一案例也与运行时秘密子项组合。
      en: Cyclops Blink's per-message envelope sits beneath TLS, establishing separate carrier-TLS and attacker-layer decryption
        boundaries; the same case also combines with the runtime-secret child.
    evidence_keys:
    - B5-T1573-REF-CYCLOPS
    - B5-T1573-REF-TLS13
    - B5-T1573-REF-OPENSSL-SEAL
    confidence: high
  - key: B5-T1573-CLAIM-DEFENSE
    claim:
      zh: 可实施检测需将 flow/message、key/material scope、receiver-compatible decrypt、明文 command/result 与 endpoint outcome 连接；API/TLS/flow
        文档只提供字段语义，不能单独定性。
      en: Implementable detection must join flow or message, key or material scope, receiver-compatible decryption, plaintext
        command or result, and endpoint outcome. API, TLS, and flow documentation supplies field semantics but cannot classify
        activity by itself.
    evidence_keys:
    - B5-T1573-REF-NIST-KEYS
    - B5-T1573-REF-OPENSSL-SEAL
    - B5-T1573-REF-CNG-DH
    - B5-T1573-REF-TLS-KEYLOG
    - B5-T1573-REF-ZEEK-TLS-REUSE
    - B5-T1573-REF-MDE-NET-REUSE
    - B5-T1573-REF-MDE-PROC-REUSE
    confidence: medium
  cases:
  - key: B5-T1573-CASE-3PARA
    name: 3PARA RAT reusable derived-key task and result channel
    summary:
      zh: CrowdStrike 逆向出固定字符串 MD5 派生 DES-CBC key、失败时的 8-byte XOR key、任务解密和结果加密后 HTTP POST 的完整路径，并列出命令能力。
      en: CrowdStrike reversed the fixed-string MD5-derived DES-CBC key, eight-byte XOR fallback, task decryption, and encrypted
        HTTP POST result path and enumerated command capability.
    evidence_keys:
    - B5-T1573-REF-3PARA
    supports_children:
    - B5-T1573-SUB-REUSABLE-KEY
    observation_status: reverse_engineered_sample_logic_and_protocol
  - key: B5-T1573-CASE-SNAKE
    name: Snake PSK and Diffie-Hellman session protection
    summary:
      zh: 联合政府分析恢复 Snake 队列内 PSK/RSA/CAST material、12-step DH 会话建立、command header/inner payload 保护和解密命令参数，证明会话范围 secret 与
        receiver recovery。
      en: Joint-government analysis recovered Snake queue PSK, RSA, and CAST material, its 12-step Diffie-Hellman session
        establishment, protected command headers and inner payloads, and decrypted command parameters, establishing session-scoped
        secrets and receiver recovery.
    evidence_keys:
    - B5-T1573-REF-SNAKE
    supports_children:
    - B5-T1573-SUB-RUNTIME-SECRET
    observation_status: reverse_engineering_and_operational_hunt_report
  - key: B5-T1573-CASE-CYCLOPS
    name: Cyclops Blink per-message envelope beneath TLS
    summary:
      zh: NCSC 追踪到 TLS 下的 custom protocol 每消息生成随机 AES-256-CBC key/IV，经硬编码 RSA public key 封套，并恢复接收端格式与更新 C2、调整 beacon、加载模块等命令路径。
      en: NCSC traced a custom protocol beneath TLS that generated a random AES-256-CBC key and IV per message, enveloped
        them with a hardcoded RSA public key, and recovered receiver format and command paths for updating C2, changing beacon
        intervals, and loading modules.
    evidence_keys:
    - B5-T1573-REF-CYCLOPS
    - B5-T1573-REF-OPENSSL-SEAL
    supports_children:
    - B5-T1573-SUB-RUNTIME-SECRET
    - B5-T1573-SUB-NESTED-BOUNDARY
    observation_status: reverse_engineered_sample_logic_and_protocol
