NJS-0052-001:
  definition_and_concept:
    paragraphs:
    - zh: 目标与请求门控注入是攻击者在受控在线传输路径上读取来源、路由或请求上下文，只对满足预设条件的 DNS、HTTP、SMB 等事务插入或替换响应。直接目的可是在未受控主机上建立首次入口，也可向已受控植入体反复交付任务与插件；门控条件使源站与大多数不匹配用户保持正常。稳定变量是注入选择条件，不是其取值或所用协议。
      en: Target-and-Request-Gated Injection reads source, route, or request context on a controlled online transfer path and inserts or replaces DNS, HTTP, SMB, or equivalent responses only for matching transactions. It can establish first access on an uncompromised host or repeatedly deliver tasking and plug-ins to an existing implant. The gate keeps the origin and most unmatched users normal. The stable variable is the injection selector, not its value or protocol.
    - zh: Citizen Lab 记录 PacketLogic 根据来源 IP 与下载行为选择性注入 HTTP 307；ESET 记录 MoustachedBouncer 仅在目标网络路径注入，且植入后经同一路径反复取得 SMB 命令。两类证据分别支持入口门控与持续 C2 门控；单个目标访问异常仍不足以证明攻击者掌握传输路径。
      en: Citizen Lab documented PacketLogic selectively injecting HTTP 307 responses by source IP and download behavior. ESET documented MoustachedBouncer injecting only on target-network paths and repeatedly supplying SMB commands to installed implants through that path. These sources support entry gating and continuing C2 gating respectively. One anomalous target visit still does not prove adversary control of the transfer path.
  stealth_characteristics:
    paragraphs:
    - zh: 目标与请求门控注入使同一源站对象在匹配目标处包含恶意响应，而非目标、普通研究探针和真实源站仍返回正常内容。短时、单视点采样因此容易复现失败；持续 C2 时，任务文件与输出只在少数受控路由和植入轮询周期中出现。
      en: Target-and-Request-Gated Injection makes the same origin object contain an adversarial response for a matching target while other users, ordinary research probes, and the true origin remain normal. Short or single-vantage sampling can fail to reproduce the event. During continuing C2, task files and outputs appear only on selected routes and implant polling cycles.
    - zh: 匹配请求的目标响应摘要、独立出口与源站应答差、注入设备命中规则、植入体轮询和命令结果仍可观察。扩大来源、路径和时间视角可恢复差异；合法地域化、个性化、企业代理改写和 CDN 缓存必须先做基线，避免把正常差分等同恶意。
      en: The matching target's response digest, differences from independent egress and origin replies, injector match rules, implant polling, and command results remain observable. Broadening source, route, and time vantages can recover the difference. Legitimate localization, personalization, enterprise-proxy changes, and CDN caching require baselines before a difference can be called malicious.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需有攻击者控制路径的证据、稳定选择条件、匹配与不匹配响应差、目标接受内容，以及首次入口或持续控制结果。没有路径注入而只是 C2 前端只向有效 Beacon 请求开放时，归 NJT-0224 的请求资格门；即使两者都按请求分支，也不能混淆中间伪造响应和控制端自身服务暴露。
      en: Inclusion requires evidence of an actor-controlled path, a stable selector, matching and nonmatching response differences, target acceptance, and either first-entry or continuing-control outcome. A C2 front that only opens to valid Beacon requests without path injection belongs to NJT-0224's request-qualified child. Both can branch by request, but a forged in-path response is distinct from controller service exposure.
    - zh: NJS-0052-002 由先到的伪造响应竞争真实源站拥有，NJS-0052-003 由目标路由视图中独有的解析与服务结果拥有；门控可与它们并列但不代表竞速或幻影服务。合法 captive portal、A/B 测试和安全代理只有在可证明被攻击者接管并产生相应结果时才进入本项。
      en: NJS-0052-002 owns a forged response racing the origin, while NJS-0052-003 owns resolution and service results existing only in the target routing view. Gating can coexist with either but does not itself establish a race or phantom service. A captive portal, A/B test, or security proxy enters scope only with proof of adversary control and the corresponding outcome.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 外交机构主机访问普通更新或共享服务时，上游路径仅对其网络注入假更新完成入口；植入建立后按固定共享路径轮询时，同一选择性路径提供命令、截图插件和输出回收。攻击者由此把受害网络作为唯一可见控制视点，而公开源站仍像正常服务。
        en: When a diplomatic host visits an ordinary update or shared service, an upstream path can inject a fake update only for that network to establish entry. After implantation, polling a stable share path lets the same selective path provide commands, screenshot plug-ins, and output return. The victim network becomes the visible control vantage while the public origin remains normal.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须观察目标请求、控制在源站响应前可改写内容的路径设备，并维护来源、路由或请求选择器。持续 C2 还需目标按可预测周期发请求并处理回复；VPN、强认证加密、路由改变、提供方处置或选择器失配会破坏门控。
          en: The actor must observe target requests, control a path device able to alter content before the origin reply, and maintain source, route, or request selectors. Continuing C2 also requires a target that requests on a predictable cadence and processes replies. VPNs, authenticated encryption, route changes, provider enforcement, or selector mismatch can break the gate.
      defender_model:
        paragraphs:
        - zh: 防守方需要目标请求与响应、真实源站收据、不同出口的相同请求、路由和 DNS 视图，以及端点任务/结果。以请求指纹、响应摘要、来源网络、路由、进程与时间配对；没有独立视点时只能判断目标接收异常，不能归因为路径注入。
          en: Defenders need target requests and responses, true-origin receipts, the same request from another egress, route and DNS views, and endpoint task and result data. Join request fingerprint, response digest, source network, route, process, and time. Without an independent vantage they can identify unusual receipt but cannot attribute it to path injection.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary: {zh: 选择性注入把入口或控制痕迹局限于少数目标路径, en: Selective injection confines entry or control traces to a small set of target paths}
    analysis:
      paragraphs:
      - zh: 攻击者只对命中选择器的请求生成伪造响应，正常用户和源站没有对应任务或恶意对象；同一行动痕迹分布在少数目标路径、注入设备和端点结果中。短窗单视点调查只能看到局部，必须重建跨来源和跨轮询周期的响应谱系，因而形成时空释痕。
        en: The actor forges responses only for selected requests, leaving ordinary users and the origin without the matching task or malicious object. Traces of one action spread among a small target path set, injector, and endpoint outcomes. A short single-vantage investigation sees fragments and must reconstruct response lineage across sources and polling cycles, producing Spatiotemporal Trace Dilution.
    evidence_keys: [REF-000096, REF-000097]
    confidence: high
  research:
    limitations:
      paragraphs:
      - zh: Citizen Lab 的 PacketLogic 案例证明选择性 HTTP 注入但聚焦入口；ESET 的 MoustachedBouncer 案例直接连接路径注入与植入后 SMB 控制。两者未公开完整 ISP 规则和所有目标请求，故门控粒度与漏报率不能泛化。
        en: Citizen Lab's PacketLogic case establishes selective HTTP injection focused on entry, while ESET's MoustachedBouncer case directly joins path injection to post-compromise SMB control. Neither publishes complete ISP rules or every target request, so gate granularity and miss rates cannot be generalized.
NJS-0052-002:
  definition_and_concept:
    paragraphs:
    - zh: 竞速式伪造响应注入是攻击者从传输路径旁观察真实客户端请求，构造可被客户端接受的同会话响应，并让它先于真实源站应答到达。直接目标是使接收端处理攻击者内容，而源站不必被修改。稳定变量是先到响应对真实响应的竞争及客户端接受状态；所用网页、工具或载荷名称不构成边界。
      en: Racing Forged-Response Injection observes a real client request from beside the transfer path, constructs a same-session response the client can accept, and gets it to the client before the true origin replies. Its direct purpose is having the receiver process actor content without changing the origin. The stable variable is the competition between arriving responses and client acceptance state, not a webpage, tool, or payload name.
    - zh: Fox-IT 对 QUANTUM INSERT 的技术复现证明旁路选择器、有效序列状态及先到伪造响应如何改变客户端接收内容，并提出相同 TCP 序号异载荷的证据。现有公开来源足以支持入口匿迹变量；将该竞速用于已植入主机的持续 C2 仍缺直接事件证据，不能因为父级加入 TA0011 就视为已证实。
      en: Fox-IT's technical reproduction of QUANTUM INSERT shows how off-path selectors, valid TCP sequence state, and an earlier forged response alter client receipt and identifies duplicate sequence numbers with different payloads as evidence. Public evidence supports the entry evasion variable. Its use for continuing C2 on an implanted host lacks a direct incident and does not become established merely because the parent also maps to TA0011.
  stealth_characteristics:
    paragraphs:
    - zh: 竞速式伪造响应注入让客户端只处理先到的攻击者响应，源站随后仍可能正常回复并保有干净内容。只取客户端最终页面或源站文件都可能漏掉“同一请求得到两个不同有效载荷”的瞬间。竞争成功受路径延迟、序列状态、完整性验证和连接重传影响。
      en: Racing Forged-Response Injection has the client process the actor's earlier response while the origin may later reply normally and retain clean content. Collecting only the client's final page or the origin file can miss the moment when one request acquired two different payloads. Success depends on path latency, sequence state, integrity checks, and retransmission.
    - zh: 重复 TCP 序号与不同载荷、到达顺序、请求指纹、客户端处理结果和真实源站摘要仍是残余。完整抓包或不同视点镜像可恢复竞速；TLS 正确认证或任务签名会削弱伪造，缺少原始序列日志时只能按结果提出候选。
      en: Duplicate TCP sequence numbers with different payloads, arrival order, request fingerprint, client outcome, and true-origin digest remain residuals. Full packet capture or mirrors at separate vantages can reconstruct the race. Properly authenticated TLS or signed tasking weakens forgery, while missing raw sequence records limits classification to a candidate.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求同一请求、可接受的伪造响应、竞争到达顺序和目标处理结果。路径中直接改写单一响应但没有竞争属于父级或其他子项；按目标条件选择何时注入属于 NJS-0052-001；只在目标路由存在服务则属于 NJS-0052-003。它们可以组合，但竞速证据不能由“页面内容不同”替代。
      en: Inclusion requires one request, an acceptable forged response, competing arrival order, and target processing outcome. In-path alteration of a single response without a race remains parent behavior or another child. Selecting which targets receive injection belongs to NJS-0052-001, while a service existing only in the target route belongs to NJS-0052-003. They can combine, but a different page alone does not prove a race.
    - zh: 已建立的 TA0001 入口情形可正式归类；TA0011 只有观察到已受控端经竞速回复取得任务并产生结果时才纳入，目前作为研究假设。合法重传、CDN 多路径、缓存不一致和网络故障可能生成相近包序列，需凭攻击者响应内容和源站对照排除。
      en: Documented TA0001 entry cases qualify. TA0011 requires an already compromised endpoint obtaining tasking through the racing reply and producing a result; this remains a research hypothesis. Legitimate retransmission, CDN paths, cache inconsistency, and faults can create similar packet sequences and require exclusion through actor response content and origin comparison.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者在受害者浏览明文网页或请求更新时，从旁路看到请求并抢先回复，引导浏览器或更新进程处理恶意内容，真实站点稍后正常响应。若未来在植入后轮询中观察到同样手法提供命令，它才构成 C2 应用；当前不把该可能性写成现场事实。
        en: When a victim browses a plaintext site or requests an update, an actor observing from the side can reply first and make the browser or updater process malicious content while the real site responds later. The same method would count for C2 only if observed delivering commands during post-compromise polling; that possibility is not treated as a field fact here.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要低延迟地观察请求、构造同会话序列与确认状态，并掌握可使客户端接受的响应格式。强制 HTTPS、端到端签名、路径距离与源站更快响应会降低成功率；伪造包可能暴露异常 TTL、时序或重置。
          en: The actor needs low-latency visibility of requests, valid same-session sequence and acknowledgment state, and response formatting acceptable to the client. Mandatory HTTPS, end-to-end signatures, path distance, or a faster origin reduces success, while forged packets can expose unusual TTL, timing, or resets.
      defender_model:
        paragraphs:
        - zh: 防守方需保存请求和双向 TCP 序列、不同视点的响应载荷摘要、接收端实际处理对象及真实源站收据。只有 DNS/URL 信誉或最终落地文件时，可怀疑注入但不能证明“竞速”；调查窗口必须覆盖同一请求的两个响应。
          en: Defenders retain the request and bidirectional TCP sequence state, response payload digests from different vantages, the object the receiver actually processed, and true-origin receipts. DNS or URL reputation and the final file alone can suggest injection but not establish a race; the investigation window must cover both responses to one request.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 真实源站保持正常而客户端先处理路径旁伪造响应, en: The origin remains normal while the client first processes an off-path forged response}
    analysis:
      paragraphs:
      - zh: 攻击者以有效序列状态抢先送达伪造响应，客户端把它并入合法请求处理，源站随后仍呈现干净内容。只看源站或最终业务记录的模型缺失关键替换动作；跨视点抓包和重复序号异载荷关联可恢复竞速，形成有条件的行为透明。
        en: The actor races a forged response with valid sequence state into a legitimate request, and the client processes it while the origin later remains clean. A model seeing only origin or final business records misses the substitution. Multivantage capture joined by duplicate sequence numbers and differing payloads reconstructs the race, producing conditional Behavioral Transparency.
    evidence_keys: [REF-000098]
    confidence: high
  research:
    limitations:
      paragraphs:
      - zh: Fox-IT 给出可复现技术链与检测残迹，但不是 TA0011 持续命令交换的直接事件记录。当前子项对入口行为的置信度高；对 C2 用途仅保留假设，不能用一般 T1659 父级陈述替代子项级证据。
        en: Fox-IT provides a reproducible technical chain and residual signal but not a direct incident of continuing TA0011 command exchange. Confidence is high for entry behavior; C2 use remains a hypothesis and cannot be inferred from the general T1659 parent description.
NJS-0052-003:
  definition_and_concept:
    paragraphs:
    - zh: 路径局部幻影服务投射是攻击者在受控路由中合成解析与服务响应，使某个域名、地址或共享服务只对目标路径显得存在，真实公共源站或其他网络并不提供相同内容。直接目的可为首次诱导安装，也可让已植入主机按稳定路径取得任务、插件并写回结果；变量是目标路由视图中的服务存在性差，而不是 SMB、DNS 或具体 IP。
      en: Path-Local Phantom Service Projection synthesizes resolution and service replies on a controlled route so a domain, address, or share appears to exist only for the target path while the public origin or other networks do not provide the same content. It can induce first installation or let an implanted host retrieve tasking and plug-ins and write results through a stable path. The variable is service-existence difference in the target routing view, not SMB, DNS, or a particular IP.
    - zh: ESET 对 MoustachedBouncer 的研究记录公共 IP 实际不由攻击者控制，却在目标路径被投射为可读写 SMB 共享；恶意组件持续读取命令文件、写输出并形成反向 shell。该链直接连接路径局部服务、持续 C2 与目标结果。
      en: ESET reports that the public IPs used by MoustachedBouncer were not actually controlled by the actor yet appeared as readable and writable SMB shares on target paths. Malicious components repeatedly read command files, wrote output, and formed a reverse shell. This chain directly joins path-local service projection, continuing C2, and target outcome.
  stealth_characteristics:
    paragraphs:
    - zh: 路径局部幻影服务投射让目标端把本地可达的共享路径当作普通远端服务，而不在目标路由的研究者得到空服务、其他内容或正常解析。服务身份与实际提供者分离，按公共 IP 归属或源站扫描建立的基础设施画像因此可能完全错误。
      en: Path-Local Phantom Service Projection makes a share reachable to the target as if it were an ordinary remote service, while a researcher outside that route obtains no service, different content, or normal resolution. Service identity separates from the real provider, so infrastructure maps based on public IP ownership or origin scans can be wrong.
    - zh: 残余包括目标解析/路由、SMB/HTTP 请求与注入回复、共享文件时间序列、计划任务、插件加载和命令输出。对比目标与独立出口的相同解析和服务请求，再核对真实 IP 所有者和端点处理结果，可恢复幻影；VPN、split DNS 与合法私有服务需要严格对照。
      en: Residuals include target resolution and route, SMB or HTTP requests and injected replies, share-file timelines, scheduled tasks, plug-in loads, and command output. Comparing the same resolution and service requests from target and independent egress, then checking true IP ownership and endpoint outcomes, can recover the phantom. VPNs, split DNS, and legitimate private services require careful baselines.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求目标路径独有的解析或服务响应、真实源站/其他路径缺失、攻击者控制注入点，以及目标接受内容并形成入口或持续控制。只把真实 C2 origin 藏在代理后面属于 NJT-0206；只在控制端按请求资格分支属于 NJT-0224；普通 CDN、内网共享和 split DNS 不因视图不同自动恶意。
      en: Inclusion requires a resolution or service response unique to the target path, absence at the true origin or other routes, actor control of the injection point, and target acceptance producing entry or continuing control. Hiding a real C2 origin behind a proxy belongs to NJT-0206. Branching at the controller by request qualification belongs to NJT-0224. Ordinary CDNs, private shares, and split DNS are not malicious merely because views differ.
    - zh: 目标与请求门控注入控制哪些请求获得伪造内容，竞速式注入控制先到响应；本项控制“目标路径是否存在这个服务”。三者可组合，但必须分别证明选择条件、竞速状态或路径局部服务差，不能从一个现象推断全部。
      en: Target-and-request gating controls which requests receive forged content, and racing controls which response arrives first. This child controls whether the service exists in the target route. The three can combine, but selectors, race state, and path-local service differences need separate proof rather than being inferred from one symptom.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 外交机构植入体访问看似在公共互联网的 SMB 共享，受控 ISP 路径实时生成回复，让它定期取得命令文件并写回输出。操作者不必维持可被全球扫描发现的公开 SMB 服务；路径控制一旦失效，幻影共享与任务回路也会消失。
        en: A diplomatic-organization implant reaches an apparently public Internet SMB share, but a controlled ISP path generates replies in real time so it can poll command files and write output. The operator need not maintain a globally scannable public SMB service. Loss of path control removes the phantom share and task loop.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须控制目标解析或传输路径中的中间设备，并保持 DNS、地址、共享协议和读写状态一致。目标离开受控网络、启用可信 VPN、协议端到端认证或路径设备被取证会削弱效果；持续 C2 还增加可关联的周期性请求。
          en: The actor must control an intermediary on the target resolution or transfer path and keep DNS, addressing, share protocol, and read-write state consistent. Leaving the controlled network, using a trusted VPN, enforcing end-to-end protocol authentication, or investigating the path device weakens the effect. Continuing C2 also adds correlatable periodic requests.
      defender_model:
        paragraphs:
        - zh: 防守方需同时取得目标路径与另一运营商/可信 VPN 的解析和服务结果、真实地址归属、SMB/HTTP 内容摘要、端点任务文件与命令结果。只有目标本地连接记录可证明访问，不能证明服务由路径注入；跨视点差与真实源站收据是关键。
          en: Defenders need resolution and service outcomes from the target route and another carrier or trusted VPN, true address ownership, SMB or HTTP content digests, endpoint task files, and command results. A local connection record proves access but not path injection; cross-vantage differences and true-origin receipts are decisive.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 路径生成的服务借用公共地址和熟悉共享外观, en: A path-generated service borrows a public address and familiar share appearance}
    analysis:
      paragraphs:
      - zh: 攻击者在目标路由内合成解析与共享回复，让植入体看到可用公共服务并持续交换命令，而真实地址所有者没有该服务。公共地址和熟悉协议替代了真实提供者特征，使单点基础设施信誉与扫描失真；跨路径比较和端点结果可恢复来源差，形成特征伪装。
        en: The actor synthesizes resolution and share replies within the target route, letting an implant see an available public service and exchange commands while the true address owner has no such service. Public addressing and familiar protocol appearance substitute for the real provider, defeating single-vantage reputation and scanning. Cross-route comparison joined to endpoint results recovers provenance, producing Feature Disguise.
    evidence_keys: [REF-000096]
    confidence: high
  research:
    limitations:
      paragraphs:
      - zh: ESET 对目标网络和路径局部 SMB 的分析直接支持持续控制，但部分 ISP 设备归属和所有请求包未公开。合法分视图解析、私有共享、灾备和运营商缓存会产生相近表面，须以攻击者控制证据和源站/路径对照提高置信。
        en: ESET's analysis of target networks and path-local SMB directly supports continuing control, but some ISP-device attribution and every request packet are not public. Legitimate split-view resolution, private shares, disaster recovery, and carrier caching can resemble the surface; actor-control evidence and origin-to-route comparison strengthen confidence.
