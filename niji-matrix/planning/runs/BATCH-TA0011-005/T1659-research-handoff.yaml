defense_candidates:
  detection_strategies:
    - temporary_key: B5-T1659-DET-C2-INJECTION
      resolution_recommendation: create
      name:
        zh: 注入响应—持续 C2 结果多视点关联
        en: Injected-Response–Continuing-C2 Multivantage Correlation
      objective:
        zh: 比较目标、独立出口与真实源站对同一请求的响应，识别门控、竞速或路径局部服务注入，并连接已受控端的重复任务、插件和命令—结果回路。
        en: Compare target, independent-egress, and true-origin responses to the same request, identify gated, racing, or path-local service injection, and join it to repeated tasking, plug-ins, and command-result loops on an already compromised endpoint.
      targets:
        - NJT-0052
        - NJS-0052-001
        - NJS-0052-002
        - NJS-0052-003
      domains:
        - enterprise
      analytic_keys:
        - B5-T1659-NJA-C2-INJECTION
      evidence_keys:
        - REF-000085
        - REF-000096
        - REF-000097
        - REF-000098
        - REF-000632
        - REF-000634
        - REF-000474
        - REF-000475
        - REF-000598
      duplicate_resolution:
        zh: DET-000051/NJA-000025 以浏览器入口和首个结果为身份，并同时覆盖 NJT-0053；把其扩展为持续 C2 会改变目标、窗口、结果门和误报。保留原对象用于 TA0001，create 新 DET/NJA 并在同一 NJT/NJS 上并列引用。
        en: DET-000051 and NJA-000025 are identified by browser entry and first outcome and also cover NJT-0053. Extending them to continuing C2 would change objective, window, outcome gates, and false positives. Keep them for TA0001 and create a new DET and NJA referenced by the same NJT and NJS objects.
  detection_analytics:
    - temporary_key: B5-T1659-NJA-C2-INJECTION
      strategy_key: B5-T1659-DET-C2-INJECTION
      resolution_recommendation: create
      name:
        zh: 多视点响应差—目标接受—C2 循环分析
        en: Multivantage Response Differential–Target Acceptance–C2 Loop Analytic
      platforms:
        - Windows
        - Linux
        - macOS
        - Network
      logic:
        paragraphs:
          - zh: >-
              为目标端每次 DNS、HTTP、SMB 或等价请求生成 request_fingerprint，包含客户端/进程、host/path/share、方法/操作、事务或 TCP 状态及时间。将目标收到的 response_hash、status、headers、DNS answer 或 SMB object 与同窗独立出口探针、真实源站 receipt/response、代理/路径记录比较。若目标响应与源站不一致且源站无 matching receipt，保留 path_response_differential；若端点进程实际读取/执行该对象，提升为 accepted_injected_response。
            en: >-
              Generate request_fingerprint for every DNS, HTTP, SMB, or equivalent target request from client or process, host, path or share, method or operation, transaction or TCP state, and time. Compare the target's response_hash, status, headers, DNS answer, or SMB object with an independent-egress probe, true-origin receipt and response, and proxy or path records in the same window. Retain path_response_differential when the target response differs and the origin has no matching receipt. Raise to accepted_injected_response when the endpoint process reads or executes the object.
          - zh: >-
              对目标/请求门控，计算同资源在目标群、路由、Cookie/参数及时间上的差异并要求注入只稳定命中特定集合；对竞速，寻找同五元组和请求的重复 TCP sequence/ack 或 transaction ID 异载荷、到达顺序及目标实际接受者；对幻影服务，要求目标解析/连接的服务在开放互联网或独立路径不存在、请求未到达声称源站，而路径侧仍返回可用内容。随后关联同一 device/process/task 在二十四小时内的命令文件读取、输出写回、插件/子进程和重复轮询。
            en: >-
              For target or request gating, calculate resource differences across target population, route, cookie or parameter, and time and require stable injection only into a selected set. For racing, find different payloads with duplicate TCP sequence and acknowledgment state or transaction ID for the same flow and request, arrival order, and which response the target accepted. For phantom service, require resolution or service reachable from the target but absent through an open-Internet or independent path, no request at the claimed origin, and usable content returned on-path. Then join command-file reads, output writes, plug-ins or child processes, and repeated polling by the same device, process, or task within twenty-four hours.
          - zh: >-
              高置信 TA0011 输出要求 path_response_differential、target acceptance 与 continuing C2 outcome 三门齐全，并观察至少一次命令—结果闭环或两次方向一致的任务/插件周期。只有恶意文件首次执行时交给 DET-000051/NJA-000025 作为入口；只有新文件到达时并列 T1105；只有响应差异而无端点结果时保持完整性异常。NJS-0052-002 在没有真实 C2 竞速案例前不得由形态阈值自动映射。
            en: >-
              High-confidence TA0011 output requires all three gates: path_response_differential, target acceptance, and continuing C2 outcome, plus at least one command-result loop or two directionally consistent task or plug-in cycles. A first malicious execution hands off to DET-000051 and NJA-000025 as entry. A new file arrival alone co-classifies with T1105. A response difference without endpoint outcome remains an integrity anomaly. NJS-0052-002 must not be automatically mapped from shape thresholds while no real C2 racing case is available.
      data_requirements:
        - source_type: target-request-response
          name:
            zh: 目标端请求、响应与接收对象
            en: Target Request, Response, and Received Object
          channel: packet capture, proxy, Zeek HTTP/DNS/SMB, browser or application telemetry where authorized
          required_fields:
            - event_time
            - vantage_id
            - device_id
            - process_start_key_when_available
            - flow_or_transaction_id
            - source_and_destination
            - request_host_or_name
            - request_path_or_share
            - request_method_or_operation
            - tcp_seq_ack_when_available
            - response_status_or_dns_rcode
            - response_headers_or_answers
            - response_object_hash
            - response_arrival_order
        - source_type: origin-and-independent-vantage
          name:
            zh: 真实源站与独立出口对照
            en: True-Origin and Independent-Egress Comparison
          channel: origin access logs, provider receipt, independent probe, alternate egress or trusted VPN
          required_fields:
            - event_time
            - vantage_id
            - request_fingerprint
            - origin_receipt
            - origin_response_hash
            - response_status
            - dns_answer_or_service_reachability
            - certificate_or_server_identity
            - route_or_provider
        - source_type: endpoint-command-and-result
          name:
            zh: 注入对象消费、命令与结果
            en: Injected-Object Consumption, Command, and Result
          channel: EDR, process/file/task audit, Windows Event 5145 for SMB where enabled
          required_fields:
            - event_time
            - device_id
            - process_start_key
            - image
            - parent_process_key
            - scheduled_task_or_service
            - object_path
            - object_hash_when_available
            - read_write_execute_action
            - command_or_plugin_identity
            - result_path_or_hash
            - successor_network_destination
        - source_type: path-control-and-route
          name:
            zh: 代理、ISP、路由与解析路径
            en: Proxy, ISP, Route, and Resolution Path
          channel: managed proxy, resolver, router, VPN, ISP or provider audit where available
          required_fields:
            - event_time
            - path_or_device_id
            - client_or_route_scope
            - request_match_condition_when_available
            - upstream_destination
            - response_source
            - policy_or_config_version
            - actor_or_owner
        - source_type: legitimate-content-variation-baseline
          name:
            zh: 合法内容差异和安全注入清单
            en: Legitimate Content Variation and Security-Injection Inventory
          channel: CDN, application, captive portal, proxy, security and change management
          required_fields:
            - owner
            - service
            - variant_condition
            - expected_response_hash_or_schema
            - security_injector
            - change_ticket
            - valid_from
            - valid_to
      raw_to_normalized_fields:
        - raw: Zeek or proxy ts, uid, client, host, uri or SMB share and operation
          normalized: event_time, flow_or_transaction_id, client_id and request_fingerprint
        - raw: TCP sequence and acknowledgment plus packet payload hash
          normalized: session_state_key, response_variant_hash and arrival_order
        - raw: HTTP response status, headers, body or file hash
          normalized: response_status, response_metadata and response_object_hash
        - raw: DNS query, answer, rcode and resolver identity
          normalized: request_name, response_endpoint and response_source_vantage
        - raw: origin access log receipt and response object
          normalized: origin_receipt and origin_response_hash
        - raw: DeviceFileEvents or Event 5145 path, hash, action and process/user
          normalized: injected_object_consumption and command_or_result_object
        - raw: DeviceProcessEvents process unique key, command line and parent
          normalized: process_start_key and successor_action
        - raw: scheduled task/service cycle and repeated file accesses
          normalized: c2_cycle_id, cycle_direction and cycle_count
      observables:
        - zh: 目标收到与真实源站/独立视点不同的响应，且声称源站没有对应请求或对象
          en: The target receives a response differing from true origin or independent vantage and the claimed origin lacks the matching request or object
        - zh: 同请求存在有效会话状态的异载荷竞速响应，目标接受伪造版本
          en: The same request receives racing different-payload responses with valid session state and the target accepts the forged version
        - zh: 只在目标路径存在的 DNS/SMB/HTTP 服务反复传递任务并接收结果
          en: A DNS, SMB, or HTTP service existing only on the target path repeatedly delivers tasks and receives results
      correlation:
        window:
          zh: 单请求竞速使用完整 TCP/事务寿命；独立视点比较默认五分钟；C2 循环默认二十四小时并按植入轮询延长至七日，原始摘要至少保留三十日。
          en: Use the full TCP or transaction lifetime for one race, five minutes by default for independent-vantage comparison, and twenty-four hours for the C2 loop with extension to seven days based on implant polling; retain raw digests for at least thirty days.
        dimensions:
          - device_id
          - process_start_key
          - request_fingerprint
          - session_state_key
          - flow_or_transaction_id
          - host_url_or_share
          - response_variant_hash
          - vantage_id
          - route_or_provider
          - command_or_result_object
          - c2_cycle_id
          - time
      false_positives:
        - zh: CDN/Anycast、A/B 测试、动态个性化、captive portal、企业代理/防病毒注入、缓存重验证、split DNS、合法 SMB 镜像和灾备
          en: CDN or Anycast, A/B testing, dynamic personalization, captive portals, enterprise proxy or antivirus injection, cache revalidation, split DNS, legitimate SMB mirrors, and disaster recovery
      blind_spots:
        - zh: TLS 或 SMB 加密且没有合法终止视角、攻击者控制信任根/终止点、无源站日志、门控窗口短于探针、ISP 不共享日志或端点代理缺失
          en: TLS or SMB encryption without a lawful termination vantage, adversary control of trust root or termination, absent origin logs, a gate shorter than probe cadence, unavailable ISP logs, or missing endpoint agent
        - zh: CDN 合法个性化无稳定响应摘要，NAT/代理破坏客户端身份，命令在内存消费不落盘或结果走另一通道
          en: Legitimate CDN personalization lacks a stable response digest, NAT or proxy breaks client identity, commands are consumed in memory without files, or results use another channel
      tuning_guidance:
        paragraphs:
          - zh: >-
              以服务 owner、发布版本、CDN 规则、代理注入、目标群和变更期限建立 response-variant 基线。高置信必须闭合三门并排除合法 variation；域名信誉、单个 hash 差异、重复序号或浏览后执行均只触发复核。对隐私敏感正文优先保存摘要、schema 和签名验证结果，必要的原件按最小权限和期限隔离保留。
            en: >-
              Baseline response variants by service owner, release version, CDN rule, proxy injection, target population, and change validity. High confidence requires all three gates and exclusion of legitimate variation. Domain reputation, one hash difference, duplicate sequence numbers, or post-browse execution only starts review. For privacy-sensitive content, prefer digests, schemas, and signature-validation results and isolate necessary originals under least privilege and retention limits.
      evidence_keys:
        - REF-000096
        - REF-000097
        - REF-000098
        - REF-000632
        - REF-000634
        - REF-000474
        - REF-000475
        - REF-000598
      logic_status: implementable_design_not_validated_on_local_data
  mitigations:
    - temporary_key: B5-T1659-MIT-C2-RESPONSE-INTEGRITY
      resolution_recommendation: create
      name:
        zh: 持续响应真实性与独立路径验证
        en: Continuing Response Authenticity and Independent-Path Validation
      control_purpose:
        zh: 让已受控端只接受可验证来源、会话状态和新鲜度的任务/载荷，并通过不受同一路径控制的出口或源站证据验证关键响应。
        en: Make compromised endpoints accept tasking or payloads only with verifiable origin, session state, and freshness and validate critical responses through an egress or origin evidence outside the same controlled path.
      measures:
        - key: authenticated-task-and-result-objects
          control_type: preventive
          action:
            zh: 对管理、更新、代理和离线任务通道使用端到端 TLS/mTLS 或应用层签名，并把任务号、nonce、目标身份、到期与结果引用纳入签名验证；验证失败时不执行内容并保留证据。
            en: Use end-to-end TLS or mTLS and application-layer signatures for management, update, agent, and task channels, signing task number, nonce, target identity, expiry, and result reference. Do not execute content after validation failure and preserve evidence.
        - key: independent-path-and-origin-validation
          control_type: exposure-reduction
          action:
            zh: 关键外联经受信 VPN/代理/resolver 离开本地高风险路径，或使用不同运营商/云探针与真实源站比较解析、证书、响应摘要和 receipt；禁止从互联网或未认证路径使用明文 SMB/HTTP 管理任务。
            en: Route critical egress through a trusted VPN, proxy, or resolver outside the local high-risk path, or compare resolution, certificate, response digest, and receipt through another carrier or cloud probe and the true origin. Prohibit plaintext SMB or HTTP management tasking from Internet or unauthenticated paths.
        - key: response-integrity-and-cycle-audit
          control_type: detective-support
          action:
            zh: 为每个任务/响应保留 request fingerprint、源站 receipt、目标响应摘要、验证结果、端点消费和结果对象，使用 canary/独立视点定期检测选择性注入，并覆盖最长合法轮询周期。
            en: Retain request fingerprint, origin receipt, target response digest, validation result, endpoint consumption, and result object for every task or response. Use canary or independent vantages to test selective injection and retain through the longest legitimate polling cycle.
      applications:
        - target_ref: NJT-0052
          use:
            zh: 对已受控端的任务、插件和控制数据要求端到端来源验证与新鲜度，禁止把目的域/IP 或熟悉协议当作内容授权；关键路径同时保留独立视点和源站 receipt。首次入口仍并列使用 MIT-000050 的浏览器/TLS/SRI 控制。
            en: Require end-to-end origin and freshness validation for tasking, plug-ins, and control data on compromised endpoints and never treat destination domain or IP or a familiar protocol as content authorization. Retain independent-vantage and origin receipt for critical paths. Continue using MIT-000050 browser, TLS, and SRI controls for first entry.
          expected_effect:
            zh: 路径设备即使能生成语法正确响应，也需伪造端到端任务身份或控制独立验证路径，注入内容在执行前可被拒绝并可审计。
            en: A path device generating syntactically valid responses must also forge end-to-end task identity or control the independent validation path; injected content can be rejected and audited before execution.
          limitations:
            zh: 旧植入和通用协议可能没有签名机制，密钥或更新基础设施被控会失效；VPN、独立运营商和正文留存增加成本、隐私和可用性风险。
            en: Legacy implants and generic protocols may lack signatures, and compromise of keys or update infrastructure defeats validation. VPNs, independent carriers, and content retention add cost, privacy, and availability risk.
        - target_ref: NJS-0052-001
          use:
            zh: 用不同来源/路由的 canary 与目标群定期发起相同请求，比较响应摘要和源站 receipt；任务签名绑定 target ID 和 nonce，避免攻击者仅对命中目标生成可执行响应。
            en: Issue the same requests from canaries and target populations using different origins or routes, comparing response digests and origin receipts. Bind task signatures to target ID and nonce so the adversary cannot generate executable responses only for matched targets.
          expected_effect:
            zh: 选择性门控不再让所有非目标视点保持无证据，目标专属内容与签名/发布清单不符时暴露。
            en: Selective gating no longer leaves every non-target vantage without evidence, and target-only content becomes visible when it conflicts with signatures or release manifests.
          limitations:
            zh: 极短门控、对 canary 识别、合法个性化和区域 CDN 可能绕过或混淆比较；需要真实用户隐私保护和路由多样性。
            en: Very short gates, canary identification, legitimate personalization, and regional CDNs can evade or confuse comparison; real-user privacy protection and route diversity are required.
        - target_ref: NJS-0052-002
          use:
            zh: 强制使用正确验证的 TLS/QUIC 或消息签名，使先到但未认证的响应不可消费；在可见明文路径保存重复 seq/ack 异载荷和到达顺序，并在边界阻断无签名任务。
            en: Enforce correctly validated TLS or QUIC or message signatures so an earlier unauthenticated response cannot be consumed. On visible plaintext paths preserve different-payload duplicate sequence and acknowledgment state plus arrival order and block unsigned tasking at the boundary.
          expected_effect:
            zh: 竞速优势不再等同内容接受，伪造响应必须同时突破会话真实性。
            en: Winning a race no longer means content acceptance because the forged response must also defeat session authenticity.
          limitations:
            zh: 攻击者控制信任根、TLS 终止代理或端点时仍可签发/修改内容；UDP/旧协议可能没有内置真实性，公开 C2 竞速案例证据仍不足。
            en: An adversary controlling a trust root, TLS termination proxy, or endpoint can still issue or alter content. UDP and legacy protocols may lack native authenticity, and public C2 racing-case evidence remains insufficient.
        - target_ref: NJS-0052-003
          use:
            zh: 关键解析使用受管 resolver 与受信 VPN，服务端必须通过证书、应用签名或固定身份验证；把解析答案、路由、真正源站 receipt 与 SMB/HTTP 内容摘要绑定，禁止从开放互联网使用未认证 SMB 任务路径。
            en: Use managed resolvers and a trusted VPN for critical resolution and require service certificates, application signatures, or pinned identities. Bind resolution answer, route, true-origin receipt, and SMB or HTTP content digest and prohibit unauthenticated SMB task paths from the open Internet.
          expected_effect:
            zh: 仅在目标路径存在的幻影服务无法凭可达性与熟悉协议获得信任，解析和内容必须通过独立身份验证。
            en: A phantom service existing only on the target path cannot gain trust through reachability and familiar protocol alone; resolution and content must pass independent identity validation.
          limitations:
            zh: split DNS、私有服务、灾备和代理本来可能只在局部路径存在，需要按 owner 与变更清单建立基线；VPN 端或 resolver 被控仍会失败。
            en: Split DNS, private services, disaster recovery, and proxies can legitimately exist only on a local path and need owner and change baselines. Compromise of the VPN endpoint or resolver still defeats the control.
      evidence_keys:
        - REF-000085
        - REF-000096
        - REF-000097
        - REF-000098
        - REF-000632
        - REF-000634
