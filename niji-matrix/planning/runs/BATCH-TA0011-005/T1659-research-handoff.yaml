        本交接提供完整父级双语替换稿和父/子逐字段审计，但未把三个子项的完整正式正文复制到 staging；主 Agent 正式复用时必须逐 NJS 独立重写审计列出的八个字段，并保持各变量不同场景、威胁模型、机理和限制。现有跨候选换名模板正文不能只做字符串替换。
      en: >-
        This handoff provides a complete bilingual parent replacement and a parent or child field audit, but does not duplicate all three complete canonical child texts in staging. During formal reuse, the primary agent must independently rewrite the eight audited fields for every NJS with variable-specific scenarios, threat models, mechanisms, and limitations. Existing name-substitution prose cannot be repaired through string replacement alone.
