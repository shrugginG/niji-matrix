handoff_schema_version: '2.0.0'
type: technique-research-handoff
batch_ref: BATCH-TA0011-005
work_item_ref: WORK-TA0011-T1659
temporary_key_prefix: B5-T1659
candidate:
  source_type: attack
  source_attack_id: T1659
  name:
    zh: 在线路径内容注入
    en: Online-Path Content Injection
recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  canonical_resolution_recommendation: reuse-and-rewrite-existing
  resulting_technique_reuse_ref: NJT-0052
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 将同一 T1659 父技术同时映射到 TA0001 与 TA0011，并明确写明受控在线传输路径既可用于首次访问，也可向已经受控系统持续投递额外载荷和其他数据。ESET 对 MoustachedBouncer 的现场研究不仅记录按目标网络注入 DNS、HTTP 与 SMB 响应完成首次感染，还记录植入后的定时任务持续从路径局部的 SMB share 读取命令文件、把输出写回 share、取得插件并形成约一秒延迟的反向 shell。父行为与稳定路径变量未因战术阶段改变，因此 TA0011 应 retain 并复用 NJT-0052，而非复制父技术。
        en: >-
          ATT&CK Enterprise 19.1 maps the same T1659 parent to both TA0001 and TA0011 and explicitly states that compromised online transfer paths can provide initial access and continuously deliver additional payloads or other data to already compromised systems. ESET's field research on MoustachedBouncer documents not only target-network injection of DNS, HTTP, and SMB responses for first compromise, but also post-compromise scheduled tasks repeatedly reading command files from path-local SMB shares, writing output back to those shares, retrieving plugins, and forming a reverse shell with roughly one-second latency. The parent behavior and stable path variables do not change with tactic phase, so TA0011 should retain and reuse NJT-0052 rather than duplicate it.
      - zh: >-
          复用必须伴随父级与三个子项的逐字段重写。现有正式正文把 definition、scope、scenario、attacker/defender model、mechanism analysis 和 limitations 全部锚定在“首个入口”，并在 scope 中明确排除 C2；只增加 TA0011 tactic_ref 会制造自相矛盾。建议把父级改为阶段中性的“攻击者在受控传输路径中按请求注入内容，使接收端接受源站未发送的对象/回复”，再分别以首次立足点或持续命令/结果作为战术结果。三个既有 Niji 变量继续唯一拥有分类；新增 C2-only 子项未发现独立缺口。
        en: >-
          Reuse requires field-by-field rewriting of the parent and all three children. Current canonical definition, scope, scenario, attacker and defender models, mechanism analyses, and limitations all anchor on first entry, and the scope explicitly excludes C2. Adding only a TA0011 tactic reference would create a contradiction. Rewrite the parent as stage-neutral adversary injection of request-specific content on a controlled transfer path that causes a receiver to accept an object or response not sent by the origin, with either first foothold or continuing command-and-result exchange as the tactic outcome. The three existing Niji variables remain unique owners of the taxonomy; research found no independently supported C2-only child gap.
proposed_content:
  summary:
    zh: 攻击者在受控在线传输路径中动态注入源站未发送的内容，使目标接收伪造响应，并用于建立入口或持续传递命令、载荷与结果。
    en: An adversary dynamically injects origin-unsent content on a controlled online transfer path so a target accepts a forged response used either to establish access or to continue commands, payloads, and results.
  definition_and_concept:
    paragraphs:
      - zh: >-
          在线路径内容注入是攻击者观察或控制客户端与合法服务之间的数据传输，在不要求持久修改源站的情况下，合成、替换或插入针对当前请求的 DNS、HTTP、SMB 或等价响应，使接收端把攻击者内容当作该在线事务的一部分处理。直接行为对象是请求与接收响应之间被操纵的传输路径及响应差分，而不是恶意网站、单个载荷或后继执行本身。
        en: >-
          Online-Path Content Injection is adversary observation or control of data transfer between a client and a legitimate service, followed by synthesis, replacement, or insertion of a DNS, HTTP, SMB, or equivalent response for the current request without requiring persistent origin modification. The direct behavioral object is the manipulated transfer path and the difference between the requested and received response, rather than a malicious website, one payload, or successor execution itself.
      - zh: >-
          同一行为可产生两个战术结果。若注入响应使原本未受控主机首次执行、认证或建立通信，则属于 TA0001；若接收主机已经受控，注入路径反复提供任务、插件、数据或承载命令—结果回路，则属于 TA0011。判断锚点包括原始请求、源站/独立视点应答、目标实际收到的对象、攻击者控制条件以及目标处理结果。产品、ISP、DPI 设备、协议与文件类型只是实现条件。
        en: >-
          The same behavior can produce two tactic outcomes. An injected response causing the first execution, authentication, or communication on a previously uncontrolled host belongs to TA0001. Where the receiving host is already compromised and the injected path repeatedly supplies tasks, plug-ins, data, or a command-result loop, it belongs to TA0011. Classification anchors are the original request, origin or independent-vantage response, object actually received by the target, attacker-controlled condition, and target processing outcome. Product, ISP, DPI device, protocol, and file type are implementation conditions.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          内容注入使恶意对象的可见来源与真实生成者分离。目标端仍访问熟悉 URL、IP 或共享路径，源站可能完全正常且没有对应日志；选择性门控让未匹配的探针和多数用户得到正常响应，竞速注入让目标只接受先到的伪造包，幻影服务又使某个 DNS/SMB/HTTP 端点只存在于受控路由视图。单视点信誉、源站取证或一次复现因此可能全部为阴性。
        en: >-
          Content injection separates the visible source of a malicious object from its real generator. The target still accesses a familiar URL, IP, or share path, while the origin can remain normal and hold no matching log. Selective gating gives unmatched probes and most users a normal response, racing injection causes the target to accept only the forged packet that arrives first, and phantom-service projection makes a DNS, SMB, or HTTP endpoint exist only in the controlled routing view. Reputation, origin forensics, or one-vantage reproduction can therefore all be negative.
      - zh: >-
          残余痕迹包括相同请求在目标、独立出口和源站之间的响应摘要差异，重复 TCP 序号但不同载荷，异常 DNS/HTTP/SMB 响应时间与路径，只在目标视图出现的解析/服务结果，以及目标收到内容后的文件、计划任务、命令读取、输出写回和插件执行。持续 C2 会在多轮请求与结果中重复这些关系，比首次注入提供更长的关联机会；TLS、攻击者控制终止点、短时门控和缺少独立视点仍会形成盲区。
        en: >-
          Residual traces include response-digest differences for the same request across target, independent egress, and origin, duplicate TCP sequence numbers with different payloads, anomalous timing and path for DNS, HTTP, or SMB responses, resolution or service results present only in the target view, and files, scheduled tasks, command reads, output writes, and plug-in execution after target receipt. Continuing C2 repeats these relationships across task and result cycles and offers a longer correlation opportunity than first injection. TLS, adversary-controlled termination, short-lived gating, and absent independent vantage remain blind spots.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求证明客户端发出在线请求、攻击者控制的路径产生源站未发送或不一致的响应、目标接受或处理该响应，并形成首次入口或持续控制结果。TA0011 的高置信门还要求已经受控的目标通过注入路径取得任务/插件/控制数据，或至少一次可复核命令—结果回路；只有新文件到达时属于 T1105 的到达结果并可并列，不能仅凭下载认定持续 C2。合法 captive portal、CDN/Anycast、A/B 测试、个性化响应、企业安全代理和故障页是反例。
        en: >-
          Inclusion requires an online client request, an attacker-controlled path producing a response not sent by or inconsistent with the origin, target acceptance or processing of that response, and either a first-entry or continuing-control outcome. High-confidence TA0011 additionally requires an already compromised target to obtain tasking, plug-ins, or control data through the injected path, or at least one reproducible command-result loop. A newly arrived file can co-classify as T1105 outcome but does not by itself establish continuing C2. Legitimate captive portals, CDN or Anycast variation, A/B testing, personalized responses, enterprise security proxies, and error pages are counterexamples.
      - zh: >-
          T1090/NJT-0206 负责中介转发和路径对端变化，T1572 负责完整内层会话封装；仅有代理或隧道而没有伪造响应不属本项。T1102 负责外部 Web 服务资源本身承担命令交换，T1105 负责工具到达，NJT-0152 负责可见消息内容的噪声、载体或服务契约伪装；这些可与注入并列但不能替代“源站未发送的路径响应”。普通 CDN 修改、压缩、缓存和合法反恶意软件注入需按所有者、策略、签名与变更记录排除。
        en: >-
          T1090 and NJT-0206 own intermediary forwarding and changed path peers, while T1572 owns encapsulation of an intact inner session. A proxy or tunnel without a forged response is outside this technique. T1102 owns external Web-service resources used for command exchange, T1105 owns tool arrival, and NJT-0152 owns noise, carrier, or service-contract disguise in visible messages. They can coexist with injection but do not replace proof of a path response not sent by the origin. Ordinary CDN modification, compression, caching, and legitimate security injection require exclusion by owner, policy, signature, and change record.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            初始访问场景中，ISP 或上游路径只对匹配组织/来源的 captive-portal 请求注入假更新页面并把用户导向恶意安装包。持续 C2 场景中，已安装的 MoustachedBouncer/Disco 组件每分钟读取一个看似互联网 SMB share 的命令文件并写回输出；ESET 判断这些 IP 不由攻击者实际控制，SMB 回复在受控 ISP 路径上即时注入。相同路径还投递截图、PowerShell 和代理插件，使内容注入从入口延伸到重复任务与结果交换。
          en: >-
            In Initial Access, an ISP or upstream path injects a fake update page only for captive-portal requests from selected organizations and redirects users to a malicious installer. In continuing C2, installed MoustachedBouncer or Disco components read command files every minute from an apparently Internet-hosted SMB share and write output back. ESET assesses that the public IPs are not actually controlled by the actor and that SMB responses are injected on the controlled ISP path. The same path delivers screenshot, PowerShell, and proxy plug-ins, extending content injection from entry into repeated task-and-result exchange.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要持续观察目标请求并在响应到达前控制路径中的注入点，或控制能合成 DNS/HTTP/SMB 服务视图的中间设备。目标/请求门控还需要来源、路由、URL、Cookie 或抽样选择器；竞速需要及时获知序列/事务状态并先于源站应答；幻影服务需要同时控制解析和服务响应的一致性。持续 C2 还需让植入按稳定路径轮询、处理任务并回传结果，且承受路径变化、加密、VPN、提供方处置和独立视点探测。
            en: >-
              The adversary needs continuing observation of target requests and an injection point that can alter the path before the response arrives, or an intermediary able to synthesize a DNS, HTTP, or SMB service view. Target or request gating additionally needs source, route, URL, cookie, or sampling selectors. Racing requires timely sequence or transaction state and a reply preceding the origin. Phantom service requires consistent control of resolution and service responses. Continuing C2 also requires an implant to poll the stable path, process tasking, and return results while tolerating path change, encryption, VPNs, provider enforcement, and independent-vantage probes.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要目标端原始请求/响应与进程结果、独立网络出口的相同请求、真实源站或供应方访问日志、DNS/路由/代理记录，以及业务个性化基线。TA0011 还需连接反复轮询、共享文件读写、命令/输出对象、计划任务和插件执行。稳定关联键包括 device/process、request fingerprint、TCP seq/ack 或 transaction ID、URL/host/share path、response hash、vantage、route、command/result object 和 time。
            en: >-
              Defenders need the target's raw request and response plus process outcome, the same request from an independent network egress, true-origin or provider access logs, DNS, route, and proxy records, and a baseline for legitimate personalization. TA0011 additionally needs joins across repeated polling, share-file reads and writes, command and output objects, scheduled tasks, and plug-in execution. Stable keys include device or process, request fingerprint, TCP sequence and acknowledgment or transaction ID, URL, host, or share path, response hash, vantage, route, command or result object, and time.
          - zh: >-
              没有源站/独立视点时，浏览器/端点只能证明接收和后继结果，不能证明内容是在路径中注入；没有端点时，多视点差分只能证明响应完整性异常，不能证明 C2。加密流量只有在攻击者不控制终止点且证书/信任正确验证时才能阻止中间注入；被控根证书、合法拦截代理、终端代理和明文 SMB/HTTP 会改变观察。结论应按“路径差分”“目标接受”“C2 结果”三个证据级别输出。
            en: >-
              Without origin or independent vantage, browser or endpoint telemetry proves receipt and successor outcome but not path injection. Without endpoint evidence, a multivantage difference proves response-integrity anomaly but not C2. Encryption blocks middle injection only where the attacker lacks termination control and certificates or trust are correctly validated; compromised roots, authorized intercepting proxies, endpoint agents, and plaintext SMB or HTTP alter observation. Findings should retain separate evidence levels for path difference, target acceptance, and C2 outcome.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 选择性路径注入把同一控制链分散到少数目标和视点
        en: Selective path injection disperses one control chain across a small target and vantage set
      analysis:
        paragraphs:
          - zh: >-
              攻击者只在匹配来源、路由或请求条件时注入任务/服务响应，使源站、非目标用户和普通研究探针继续看到正常内容；C2 命令、结果和插件痕迹仅出现在少数目标路径与时段。单视点或短窗无法复现，同一控制链被分散到 ISP、目标端点、伪造服务和源站日志，需要跨视点重建，形成时空释痕。MoustachedBouncer 对少数使馆网络的门控及多轮 SMB 控制直接支持该链。
            en: >-
              The adversary injects tasking or service responses only when source, route, or request conditions match, leaving the origin, non-target users, and ordinary research probes with normal content. C2 command, result, and plug-in traces appear only on a small set of target paths and times. One vantage or short window cannot reproduce the event, and the control chain is dispersed across ISP, endpoint, phantom service, and origin logs, producing Spatiotemporal Trace Dilution. MoustachedBouncer gating to a few embassy networks and repeated SMB control directly support the chain.
      evidence_keys:
        - REF-000085
        - REF-000096
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 源站视角缺失被路径生成的命令与服务响应
        en: The origin vantage lacks commands and service responses generated on the path
      analysis:
        paragraphs:
          - zh: >-
              路径设备在源站之外合成响应，目标接受并处理命令或插件，而源站及其日志没有对应对象；只依赖源站完整性和信誉的防守逻辑看不到关键控制动作。目标、路径和端点仍有请求响应、内容和结果痕迹，扩大观察面可恢复差异，形成行为透明。ESET 所述不实际控制公共 IP 却经注入 SMB 提供反向 shell 的情形是直接实例。
            en: >-
              A path device synthesizes a response outside the origin, the target accepts and processes commands or plug-ins, and the origin and its logs have no matching object. Defensive logic relying on origin integrity and reputation misses the critical control action. Target, path, and endpoint still retain request-response, content, and outcome traces recoverable through a broader observation model, producing Behavioral Transparency. ESET's injected SMB reverse shell through public IPs not actually controlled by the actor is a direct instance.
      evidence_keys:
        - REF-000096
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 合法请求目标与路径局部服务外观掩盖攻击者生成内容
        en: Legitimate requested targets and path-local service appearance conceal attacker-generated content
      analysis:
        paragraphs:
          - zh: >-
              注入响应沿用用户或植入体原本请求的域名、IP、URL 或共享路径，并可呈现为更新、DNS 解析或 SMB 服务；粗粒度规则把目标信誉和熟悉协议当作内容来源，误将攻击者响应归为正常服务。证书、响应摘要、真实源站 receipt、路径路由和后继动作可以破坏这种特征伪装。该机理只在响应确实借用合法/常见服务外观时成立，不由注入本身自动推出。
            en: >-
              An injected response reuses the domain, IP, URL, or share path originally requested by a user or implant and can appear as an update, DNS resolution, or SMB service. Coarse rules treat destination reputation and familiar protocol as content provenance and misclassify the adversary response as normal service. Certificates, response digests, true-origin receipt, path routing, and successor action can break the disguise. This mechanism applies only where the response actually borrows legitimate or common service appearance and is not automatic for every injection.
      evidence_keys:
        - REF-000096
        - REF-000097
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            继续复用三个 Niji 原生变量，但把正文改为战术中性。目标与请求门控注入控制“哪些目标/请求收到攻击者响应”，适用于入口和持续 C2；竞速式伪造响应注入控制“伪造包是否以有效会话状态抢先于源站”，变量本身阶段中性，但当前独立 C2 事件证据不足；路径局部幻影服务投射控制“恶意解析/服务是否只在目标路由视图存在”，MoustachedBouncer 的注入 SMB reverse shell 为直接 C2 证据。三者分别需要群体/视点差分、包序列竞速和解析—服务—路由一致性防御。
          en: >-
            Reuse the three Niji-native variables but rewrite them as tactic-neutral. Target-and-Request-Gated Injection controls which targets or requests receive the adversary response and applies to both entry and continuing C2. Racing Forged-Response Injection controls whether a forged packet with valid session state precedes the origin; the variable is stage-neutral, but independent C2 incident evidence remains insufficient. Path-Local Phantom Service Projection controls whether malicious resolution or service exists only in the target routing view, with MoustachedBouncer's injected SMB reverse shell providing direct C2 evidence. They require population or vantage differential, packet-sequence race, and resolution-to-service-to-route consistency defenses respectively.
        - zh: >-
            不新增 C2-only 子项。命令与结果是否持续属于父级 TA0011 结果门，而非新的匿迹变量；额外载荷到达可并列 T1105，消息编码/加密/伪装、代理转发和协议隧道由相邻对象拥有。父级及 NJS-0052-001/002/003 必须全部删除“截止首个立足点/排除后续通信”的硬边界，改为根据 tactic outcome 分流，同时保留产品、协议和 ISP 名称不得定义子项。
          en: >-
            Create no C2-only child. Continuing commands and results are the parent's TA0011 outcome gate rather than another stealth variable. Additional payload arrival can co-classify as T1105, while message encoding, encryption or disguise, proxy forwarding, and protocol tunneling remain with adjacent objects. The parent and NJS-0052-001/002/003 must all remove hard boundaries ending at first foothold or excluding later communication and instead branch by tactic outcome, while retaining the rule that product, protocol, and ISP name do not define children.
    coverage: established
    reused_subtechnique_refs:
      - NJS-0052-001
      - NJS-0052-002
      - NJS-0052-003
proposed_subtechniques: []
cross_tactic_child_applicability:
  - child_ref: NJS-0052-001
    ta0011_status: supported
    confidence: high
    c2_evidence:
      zh: ESET 记录只对少数目标网络注入 DNS/HTTP/SMB；同一受控路径在植入后按稳定 share/path 反复投递插件与命令并回收输出。
      en: ESET documents DNS, HTTP, and SMB injection for a small set of target networks; after compromise the same controlled path repeatedly delivers plug-ins and commands and retrieves output through stable shares and paths.
    required_rewrite:
      zh: 所有 first-entry/foothold/entry-condition 表述改为接收目标或请求条件，并允许 TA0001 首次结果或 TA0011 持续控制结果。
      en: Replace every first-entry, foothold, and entry-condition statement with receiver or request conditions and allow either TA0001 first-result or TA0011 continuing-control outcome.
  - child_ref: NJS-0052-002
    ta0011_status: evidence-deferred
    confidence: hypothesis
    c2_evidence:
      zh: REF-000098 技术复现选择器、有效 TCP 序列和竞速伪造响应，充分支持变量与入口应用；当前研究未找到结论级公开事件证明该竞速机制被用于已受控植入的重复命令—结果交换。
      en: REF-000098 technically reproduces selectors, valid TCP sequence state, and a racing forged response and adequately supports the variable and its entry use. This research found no conclusion-level public incident proving repeated command-result exchange for an already compromised implant through that race.
    required_rewrite:
      zh: 正文改为阶段中性，但 TA0011 场景必须标为研究假设；正式事件只有恢复注入 C2 响应与后继命令结果时才可映射本子项。
      en: Rewrite prose as stage-neutral but keep the TA0011 scenario explicitly hypothetical; map an event only after recovering an injected C2 response and successor command outcome.
  - child_ref: NJS-0052-003
    ta0011_status: supported
    confidence: high
    c2_evidence:
      zh: ESET 记录不存在于开放互联网的解析/SMB 服务在目标路径中被合成，已受控主机的任务每分钟读写命令/输出文件并形成反向 shell。
      en: ESET documents resolution and SMB services absent from the open Internet but synthesized in the target path, with tasks on compromised hosts reading and writing command and output files every minute to form a reverse shell.
    required_rewrite:
      zh: 定义、范围、场景、攻防模型和机理改为路径局部服务/解析结果可服务首次投递或持续 C2，不再排除立足点后的通信。
      en: Rewrite definition, boundary, scenario, threat models, and mechanisms so path-local service or resolution can support first delivery or continuing C2 and no longer exclude post-foothold communication.
reuse_rewrite_audit:
  parent_ref: NJT-0052
  parent_fields:
    summary:
      action: revise
      reason:
