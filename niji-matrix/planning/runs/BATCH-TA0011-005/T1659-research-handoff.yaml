    - Should the reused NJT-0052 decision_ref remain DEC-TA0001-T1659 while DEC-TA0011-T1659 points to it, or does the classification schema require a relationship or provenance extension?
    - Can ESET or another primary source provide packet-level evidence that a forged racing response carried post-compromise C2 rather than first-stage payload delivery?
    - Which origin/provider systems expose request receipts and response hashes at retention lengths sufficient for repeated C2 polling?
