  baseline_summary:
    zh: >-
      Enterprise 19.1 固定 STIX 把 T1665 定义为操纵网络流量以隐藏 C2 基础设施，列举防守工具流量过滤、恶意域掩蔽、代理/VPN、按 User-Agent、IP 或地域过滤，以及资源准备支撑。固定对象无 ATT&CK 子项。其八条 procedure relationship 还混入住宅代理、ORB/jump host、公共云、域名伪装、主机名/地域相似与错误页命令等实现，因此只作为父级问题和相邻边界依据，不能据此复制 Niji 子项。
    en: >-
      The fixed Enterprise 19.1 STIX object defines T1665 as manipulating network traffic to hide C2 infrastructure and cites defensive-tool traffic filtering, malicious-domain masking, proxies or VPNs, filtering by user agent, IP, or geography, and supporting resource development. The fixed object has no ATT&CK sub-techniques. Its eight procedure relationships also mix residential proxies, ORB or jump hosts, public cloud, domain masquerading, hostname or geographic similarity, and commands in error pages. They anchor the parent problem and adjacent boundaries only and cannot be copied into Niji children.
