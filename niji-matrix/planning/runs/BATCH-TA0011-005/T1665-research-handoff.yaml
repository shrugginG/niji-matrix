recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          保留 T1665 的运行时基础设施隐藏问题，但把宽泛的代理、可信托管、域名伪装和资源取得剥离，改写为“选择性 C2 基础设施暴露”：攻击者控制正在运行的 C2 front、redirector、listener、WAF/CDN rule 或 origin，使同一基础设施只向具备 implant 请求资格的会话暴露实际 C2，或专门对扫描器、研究员与已知防守来源拒绝、重定向、返回良性外观或关闭服务，同时受害端仍完成 tasking、result、payload/config retrieval 或持续控制。Unit 42 在与 24 个柬埔寨政府组织保持持久通信的 C2 上观察到屏蔽 Palo Alto、云/VPS、大型科技及其他安全公司地址，并只在攻击者活动时段开放 C2 端口；IronNet 在乌克兰相关 Cobalt Strike C2 集群中观察到用于 Nginx redirector 的 profile，并说明只有特定 Beacon 流量被转发而其余流量被导向合法 server。这些材料直接支持独立于路径中继和资源准备的运行时暴露差。
        en: >-
          Retain T1665's runtime infrastructure-hiding problem, but remove broad proxying, trusted hosting, domain masquerading, and resource acquisition and adapt it as Selective C2 Infrastructure Exposure. The actor controls a running C2 front, redirector, listener, WAF or CDN rule, or origin so that the infrastructure exposes real C2 only to sessions carrying an implant-qualified request, or specifically denies, redirects, serves a benign facade to, or closes service for scanners, researchers, and known defensive sources while the victim still completes tasking, result return, payload or configuration retrieval, or continuing control. Unit 42 observed C2 maintaining persistent communications with 24 Cambodian government organizations while blocking Palo Alto Networks, cloud or VPS, Big Tech, and other security-company ranges and opening C2 ports only during actor activity. IronNet observed a profile for an Nginx redirector in a Cobalt Strike C2 cluster tied to attacks on Ukraine and explains that only specific Beacon traffic is forwarded while remaining traffic is sent to a legitimate server. These materials directly support a runtime exposure differential independent of path relaying and resource preparation.
      - zh: >-
          正式准入必须有隐藏基础设施的后继结果，不能从 CDN/WAF、404、honeypot、geo rule、关闭端口或研究地址被拒单点推断攻击。最低证据链是：受害端或原始事件材料证明 candidate endpoint 支撑 C2；攻击者可控的请求资格、观察者分类或 exposure policy；在尽量同时间、同 endpoint/protocol 下的响应、origin route、listener state 或连接结果差；以及被排除观察者看不到而合格 implant/受害者仍获得的 C2 结果。普通 anti-bot、DDoS、地域合规、mTLS/API allowlist、维护窗口和内部管理入口都是强反例。固定 T1665 的代理、ORB、公共云和域名伪装内容由相邻 Niji 技术拥有，不能因为 ATT&CK 父级宽泛而在这里重复。
        en: >-
          Formal admission requires a successor result from the hidden infrastructure and cannot infer attack from a CDN or WAF, a 404, a honeypot, a geographic rule, a closed port, or rejection of a research address alone. The minimum chain is a candidate endpoint established as supporting C2 by victim-side telemetry or original incident evidence; an attacker-controlled request qualification, observer classification, or exposure policy; a response, origin-route, listener-state, or connection-result differential under a matched endpoint and protocol and as close in time as possible; and a C2 result still obtained by a qualified implant or victim while the excluded observer cannot see it. Ordinary anti-bot, DDoS defense, geographic compliance, mTLS or API allowlists, maintenance windows, and internal administration entries are strong counterexamples. Proxy, ORB, public-cloud, and domain-masquerading material in the fixed T1665 object is owned by adjacent Niji techniques and must not be duplicated merely because the ATT&CK parent is broad.

proposed_content:
  name: {zh: 选择性 C2 基础设施暴露, en: Selective C2 Infrastructure Exposure}
  summary:
    zh: 攻击者让运行中的 C2 基础设施依据 implant 请求资格或观察者身份选择是否暴露真实服务，使受害端继续受控而扫描器和研究者只见拒绝、良性外观或关闭表面。
    en: An adversary makes running C2 infrastructure decide whether to expose the real service from implant request qualification or observer identity, allowing victim control to continue while scanners and researchers see denial, a benign facade, or a closed surface.
  aliases: [Hide Infrastructure, Runtime C2 Exposure Gating, T1665]
  classification:
    tactic_refs: [TA0011]
    origin: {kind: attack-adapted, source_attack_id: T1665, source_attack_version: '19.1'}
    decision_key: B5-T1665-DECISION
  definition_and_concept:
    paragraphs:
      - zh: >-
          选择性 C2 基础设施暴露是攻击者在 C2 已投入运行后，以 front/redirector/listener/origin 的规则或代码读取 request path、header、cookie/token、TLS/client fingerprint、source IP/ASN/organization、geography 或已知 defender set，并据此决定 forward-to-origin、return-command、deny/reset、benign redirect、decoy/404 或 listener availability。其直接对象是基础设施对不同观察上下文的可达和响应状态，不是 client 端消息内容、网络路径本身或域名怎样计算。攻击者的目标是让感染端保持可靠控制，同时让外部扫描、IR 和威胁研究错判 endpoint 为普通、空闲、失效或不存在。
        en: >-
          Selective C2 Infrastructure Exposure is adversary behavior after C2 is operational in which rules or code at a front, redirector, listener, or origin read a request path, header, cookie or token, TLS or client fingerprint, source IP, ASN or organization, geography, or known defender set and decide whether to forward to origin, return commands, deny or reset, benignly redirect, serve a decoy or 404, or make a listener available. Its direct object is infrastructure reachability and response state across observation contexts, not client-side message content, the network path itself, or how a domain is computed. The actor seeks to keep infected endpoints under reliable control while causing Internet scans, incident responders, and threat researchers to classify the endpoint as ordinary, idle, inactive, or nonexistent.
      - zh: >-
          证据必须把 exposure differential 与 C2 结果连接。可接受的 C2 结果包括同一 destination 上由已确认恶意 process 形成的持续 callback、由 server 下发的 task/config/payload、由 endpoint 产生的 command/result lineage，或原始事件报告对受害组织持久 C2 的明确结论。比较记录应保存 endpoint、timestamp、request_variant、vantage class、TLS/session fingerprint、response status/hash/length、redirect、reset/timeout、edge action、origin reached 和 listener state。只有外部 banner 差或 blocklist 命中不能完成技术。
        en: >-
          Evidence must join the exposure differential to a C2 result. Acceptable C2 results include continuing callbacks from a confirmed malicious process to the same destination, a task, configuration, or payload returned by the server, endpoint command or result lineage, or an explicit original incident finding of persistent C2 with victim organizations. Comparative records should retain endpoint, timestamp, request variant, vantage class, TLS or session fingerprint, response status, hash, and length, redirect, reset or timeout, edge action, origin-reached state, and listener state. An external banner difference or block-list hit alone does not complete the technique.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          单视点扫描通常发送 generic TLS/HTTP probe、空 cookie、已知 crawler User-Agent 或来自数据中心/安全厂商地址。正向门只把与 implant profile 一致的 path/header/token/handshake 转到 C2 origin；负向门则识别已知 defender/scanner 来源并阻止或伪装。未满足规则的观察者会得到与普通站点相似的 200/404、良性 redirect、honeypot banner、TCP reset/timeout 或 closed port，因而不会获得真实 server fingerprint、stager、command response 或 origin address。普通 web/CDN 噪声进一步降低单个差分的判别力。
        en: >-
          Single-vantage scans commonly send generic TLS or HTTP probes, empty cookies, known crawler user agents, or traffic from data-center and security-vendor addresses. A positive gate forwards only paths, headers, tokens, or handshakes congruent with the implant profile to the C2 origin. A negative gate recognizes known defender or scanner sources and blocks or disguises them. An observer failing the rule receives an ordinary-looking 200 or 404, a benign redirect, a honeypot banner, TCP reset or timeout, or a closed port and therefore cannot recover the real server fingerprint, stager, command response, or origin address. Ordinary web and CDN noise further reduces the value of any single differential.
      - zh: >-
          残余痕迹来自受害端成功 C2 与外部观察失败之间的矛盾、同一 endpoint 在 request/vantage/time 变化下的稳定响应簇、edge/WAF matched rule 和 action、edge-to-origin route、origin access、规则变更审计、listener open/closed 时序，以及恶意 process 的 downstream command/result。Unit 42 的材料直接证明 security-company address blocking、C2 victim communication 与 activity-window port state；IronNet 和 Mandiant 证明 redirector/profile 可按请求只转发 Beacon 流量。来源不公开完整 edge rule，因此具体 rule expression 和当地采集能力仍须由 provider、被接管 server 或受害部署证据补足。
        en: >-
          Residue appears in the contradiction between successful victim C2 and failed external observation, stable response clusters when request, vantage, or time changes at one endpoint, edge or WAF matched rules and actions, edge-to-origin routing, origin access, rule-change audit, listener open or closed timing, and downstream commands or results from the malicious process. Unit 42 directly establishes security-company address blocking, victim C2 communications, and activity-window port state. IronNet and Mandiant establish that redirectors and profiles can forward only Beacon-congruent requests. The sources do not disclose complete edge rules, so exact rule expressions and local collection capability still require provider, seized-server, or victim-deployment evidence.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入运行中的 C2 front/listener/origin 依据请求资格或观察者类别改变真实服务暴露，并有后继 C2 结果的行为。请求资格可以是多字段 profile、secret path、cookie/token、valid checksum、client fingerprint 或协议序列；观察者类别可以是 known scanner/security IP/ASN、organization、geography 或相同功能的 defender set。端口只在活动窗口开放可作为父级 supporting axis，但当前仅一个直接事件来源，暂不单列 NJS。产品、云厂商、域名、端口、封锁名单、HTTP status 与攻入/租用方式均不是分类轴。
        en: >-
          Scope includes behavior in which a running C2 front, listener, or origin changes exposure of the real service according to request qualification or observer class and a successor C2 result exists. Request qualification can be a multi-field profile, secret path, cookie or token, valid checksum, client fingerprint, or protocol sequence. Observer class can be a known scanner or security IP or ASN, organization, geography, or an equivalent defender set. A port exposed only during activity windows remains a supporting parent axis, but presently has only one direct incident source and is not proposed as a separate NJS. Product, cloud provider, domain, port, block list, HTTP status, and whether infrastructure was bought or compromised are not classification axes.
      - zh: >-
          普通 CDN cache/routing、WAF/anti-bot/DDoS、rate limit、geo compliance、search crawler handling、mTLS/API allowlist、blue-green release、maintenance window 与批准的 admin interface 会产生相同 differential。除非存在 attacker control、C2 linkage 和 qualified-victim success，不准入。client 在本地检测 VM/sandbox 后停止执行属于 T1497/Niji 环境门控；server 根据来源/请求隐藏 C2 才属于本技术。信号序列打开隐藏 listener 的 activation 归 T1205，后续 runtime exposure policy 有独立证据时才并列。
        en: >-
          Ordinary CDN caching or routing, WAF, anti-bot and DDoS controls, rate limits, geographic compliance, search-crawler handling, mTLS or API allowlists, blue-green releases, maintenance windows, and approved administration interfaces create the same differential. Do not admit them without attacker control, C2 linkage, and qualified-victim success. A client that detects a VM or sandbox locally and stops belongs to T1497 or Niji environment gating. A server that hides C2 according to source or request belongs here. Activation of a hidden listener by a signal sequence belongs to T1205 and co-classifies only when separate evidence establishes a later runtime exposure policy.
      - zh: >-
          TA0042 NJT-0051/NJT-0044 拥有取得、老化、预置或攻陷资源并继承 reputation/provenance 的准备对象；本技术从 infrastructure serving C2 后的每次暴露决策开始。NJT-0206/T1090 拥有 relay、last hop、origin concealment 与 domain-fronting routing authority；仅有 CDN/redirector/path 不足，本技术要求该 front 对不同请求/观察者选择 forward/deny/decoy。NJT-0213/T1568 拥有 endpoint locator 的生成、解析与轮换；本技术要求请求已到达候选 endpoint 后仍出现 exposure differential。NJT-0209/T1102 拥有合法 service account/resource 的 task-state 或 namespace；使用 service/CDN 名称不自动构成本技术。
        en: >-
          TA0042 NJT-0051 and NJT-0044 own preparation objects that acquire, age, preposition, or compromise resources and inherit reputation or provenance. This technique begins with each exposure decision after infrastructure starts serving C2. NJT-0206 and T1090 own relaying, last hops, origin concealment, and domain-fronting routing authority. A CDN, redirector, or path alone is insufficient here; the front must choose forward, deny, or decoy across requests or observers. NJT-0213 and T1568 own generation, resolution, and rotation of endpoint locators. This technique requires an exposure differential after a request reaches a candidate endpoint. NJT-0209 and T1102 own task state or namespaces in legitimate service accounts and resources. A service or CDN name does not automatically constitute this technique.
      - zh: >-
          T1659/NJT-0052 的直接对象是在线流中插入/替换受害者接收的内容，NJS-0052-001 的 request gate 决定是否注入；本技术的正向 gate 决定请求是否被转到真实 C2 origin 或暴露控制服务，不要求向无关 victim flow 注入内容。一次 gate 可同时过滤和注入时按两个直接对象并列。NJT-0152/T1001 拥有已发生 C2 事务内的 message/carrier/service camouflage；error page 中承载命令可并列，但没有跨观察者 exposure differential 时只属于 message camouflage。DET-000032/NJA-000006 识别 Web host profiling 与选择性内容，主体是被画像 visitor/page；本技术检测基础设施是否对不同 vantages 隐藏 C2，并要求 victim C2 outcome，因此不能直接复用。
        en: >-
          T1659 and NJT-0052 directly own content inserted into or substituted within an online flow received by a victim, and NJS-0052-001 uses a request gate to decide whether to inject. The positive gate here decides whether a request is forwarded to the real C2 origin or exposes the control service and does not require content injection into an unrelated victim flow. If one gate both filters and injects, classify both direct objects. NJT-0152 and T1001 own message, carrier, or service camouflage inside an established C2 transaction. Commands carried in an error page may coexist, but without a cross-observer exposure differential they remain message camouflage. DET-000032 and NJA-000006 identify Web host profiling and selective content with the visitor or page as subject. This technique detects infrastructure hiding C2 across vantages and requires a victim C2 outcome, so those objects cannot be directly reused.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在 Cobalt Strike 场景，攻击者把 Nginx 或其他 front 放在 Beacon 和 team server 之间，只把符合 malleable profile 的 URI/header/User-Agent/sequence 转到 origin，其余请求转到合法站点。IronNet 在与 CERT-UA Ukraine 指标相关的 C2 servers 中观察 `/apiv8/getStatus` profile，判断其意图是位于 Nginx redirector 后避免 fingerprint；该报告说明 redirector 通常只转发特定 Beacon 流量。Mandiant 进一步记录 valid checksum stager request、blacklisted curl/wget、allowlisted user agents 和 team-server web log，为可实施字段和机制提供 capability 证据，但不单独证明某次攻击使用每项设置。
          en: >-
            In a Cobalt Strike scenario, the actor places Nginx or another front between Beacon and the team server and forwards only URI, header, user-agent, or sequence values congruent with the malleable profile while directing all other requests to a legitimate site. IronNet observed an `/apiv8/getStatus` profile on C2 servers related to CERT-UA Ukraine indicators, assessed it was intended to sit behind an Nginx redirector to resist fingerprinting, and explains that redirectors commonly forward only specific Beacon traffic. Mandiant additionally documents valid-checksum stager requests, blacklisted curl or wget, allowlisted user agents, and team-server web logs. This supports implementable fields and capability but does not independently prove that every setting appeared in one intrusion.
        - zh: >-
            在 defender-suppression 场景，攻击者按 known security ranges、cloud/VPS 或 researcher infrastructure 拒绝连接，而受害机构继续 C2。Unit 42 对六个 target-facing IP 的研究明确观察 Palo Alto、部分 VPS/cloud、Big Tech 与其他安全公司地址被屏蔽，并在 24 个柬埔寨政府组织看到持续通信；同一基础设施只在 actor activity time 打开 C2 ports。该现场材料把 observer exclusion、listener time 和 hidden C2 successor 连起来，但未公开 filter configuration、每次探测 payload 或 provider audit，所以不能反推具体 rule syntax。
          en: >-
            In a defender-suppression scenario, the actor rejects known security ranges, cloud or VPS sources, or researcher infrastructure while victim organizations continue C2. Unit 42 explicitly observed six target-facing IPs blocking Palo Alto Networks, some VPS or cloud, Big Tech, and other security-company ranges while 24 Cambodian government organizations maintained communications. The same infrastructure opened C2 ports only during actor activity times. This field evidence joins observer exclusion, listener time, and a hidden C2 successor, but does not publish filter configuration, every probe payload, or provider audit and therefore cannot establish exact rule syntax.
        - zh: >-
            XLoader 展示边缘案例：真实 C2 check-in 通常表现为普通 404，只有 server 准备下发 bot command 时返回 200/encrypted command；panel 对错误 account 也生成伪 404，研究者必须用 campaign/account 和长时运行恢复基础设施。它支持 response facade 和残余差分，但 decoy domain 选择、延迟与 error-page message camouflage 分别与 NJT-0213、时间规避和 NJT-0152 相邻，不能用该案例单独建立 observer-suppression 子项。
          en: >-
            XLoader illustrates an edge case. A real C2 check-in usually looks like an ordinary 404 and returns 200 with an encrypted command only when the server is ready to task a bot. The panel also emits a fake 404 for an incorrect account, so researchers needed campaign and account knowledge plus longer execution to recover the infrastructure. It supports response facades and residual differentials, but decoy-domain selection, delay, and error-page message camouflage are adjacent to NJT-0213, timing evasion, and NJT-0152 and cannot establish the observer-suppression child by themselves.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者须控制或配置 front/listener/origin 的 exposure decision，知道 implant 会携带的 profile/token/sequence，或维护 defender/scanner classification。正向门增加 implant/front 同步、token 泄露与误拒合法 bot 的成本；负向门需要持续更新研究地址并可能被 residential/mobile/distributed probes 绕过。关闭端口或短窗口降低发现面但也损害 C2 reliability。CDN/WAF/provider 可保留 rule、request 和 origin route，使过度复杂的 gate 反而形成稳定 cluster。
            en: >-
              The actor must control or configure the exposure decision at a front, listener, or origin, know the profile, token, or sequence carried by the implant, or maintain a defender and scanner classification. Positive gating adds implant-to-front synchronization, token-leakage, and accidental-rejection costs. Negative gating requires continual updates to research addresses and may be bypassed by residential, mobile, or distributed probes. Closing ports or using short windows reduces discovery but harms C2 reliability. A CDN, WAF, or provider can retain rules, requests, and origin routes, causing an elaborate gate to become a stable cluster.
      defender_model:
        paragraphs:
          - zh: >-
              防守方优先从 victim endpoint/proxy/DNS 得到 candidate C2 与 process/outcome，再在已授权、provider-coordinated、owned、sinkholed 或 seized 环境中进行多视角/多变体比较。单视点 public scanner 不足；应固定 endpoint/protocol/time，一次只改变 request profile、source ASN/organization/geography 或 time，并记录 edge action 与 origin reach。若无法主动测试，可由多个受害者、第三方被动观测和 provider logs 建立同样 differential。不得把感染端 token、cookie 或组织秘密发送到未受控第三方。
            en: >-
              Defenders should first derive a candidate C2 and process or outcome from victim endpoint, proxy, and DNS telemetry, then perform multi-vantage and multi-variant comparison in authorized, provider-coordinated, owned, sinkholed, or seized environments. One public-scanner view is insufficient. Hold endpoint, protocol, and time stable, vary only request profile, source ASN, organization, geography, or time, and record edge action and origin reach. When active testing is unavailable, multiple victims, third-party passive observation, and provider logs can establish the same differential. Never transmit infected-endpoint tokens, cookies, or organizational secrets to an uncontrolled third party.
          - zh: >-
              provider/hosting defender 能看到 strongest evidence：request ID、client identity、matched rule/version/action、edge response、origin IP/status、listener/config change 和 tenant/account。victim defender 通常只有 successful side，必须把 malicious process、destination、repeated bidirectionality 与 downstream command/result 连接后才请求 provider 协助。没有 origin/provider access 时结论保持 probabilistic；TLS/ECH、one-time token、cache、GeoDNS、NAT 和合法 personalization 会造成盲区。
            en: >-
              A provider or hosting defender sees the strongest evidence: request ID, client identity, matched rule, version and action, edge response, origin IP and status, listener or configuration change, and tenant or account. A victim defender usually sees only the successful side and should join the malicious process, destination, repeated bidirectionality, and downstream command or result before requesting provider assistance. Without origin or provider access the conclusion remains probabilistic. TLS or ECH, one-time tokens, caching, GeoDNS, NAT, and legitimate personalization create blind spots.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 未合格或被识别为防守者的观察者看不到真实 C2 行为, en: Unqualified or defender-classified observers do not see real C2 behavior}
      analysis:
        paragraphs:
          - zh: >-
              Request gate 或 observer deny policy 在 front/listener 处分支，合格 implant 到达 origin 并取得 task/config/result，而 scanner/researcher 得到 deny/reset/timeout/closed 或 benign redirect。对后者而言同一基础设施的核心控制行为透明消失，形成 Behavioral Transparency。Unit 42 直接连接被屏蔽 security ranges、仅活动时开放端口与 persistent victim C2；IronNet/Mandiant 连接 specific Beacon forwarding 与 scanner-incongruent requests。多视角与 edge-origin join 可恢复，置信度 high。
            en: >-
              A request gate or observer-deny policy branches at the front or listener. A qualified implant reaches the origin and obtains a task, configuration, or result, while a scanner or researcher receives deny, reset, timeout, closed service, or benign redirect. Core control behavior becomes absent to the latter observer, producing Behavioral Transparency. Unit 42 directly joins blocked security ranges and activity-only open ports to persistent victim C2. IronNet and Mandiant connect specific Beacon forwarding to scanner-incongruent requests. Multi-vantage comparison and edge-to-origin joins recover it, supporting high confidence.
      evidence_keys: [B5-T1665-REF-UNIT42-CAMBODIA, B5-T1665-REF-IRONNET-UKRAINE-CS, B5-T1665-REF-MANDIANT-CS-COMPONENTS]
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary: {zh: 良性站点错误页或 honeypot 外观替代真实 C2 服务身份, en: A benign site error page or honeypot facade substitutes for the real C2 service identity}
      analysis:
        paragraphs:
          - zh: >-
              未合格请求可被导向 legitimate server、普通 404 或 honeypot，令 banner/status/body 看起来属于正常 Web 错误或公开诱捕服务，真实 C2 origin/function 被替代表征。IronNet 说明非 Beacon 流量被导向 legitimate server；Unit 42 观察 Cowrie honeypot cover；Check Point 区分 XLoader script 404、server 404 和有 task 时 200/encrypted command。Facade 单独不能证明攻击，必须与跨观察者差及 C2 outcome 结合，置信度 medium-high。
            en: >-
              An unqualified request can be directed to a legitimate server, ordinary 404, or honeypot, making banner, status, and body resemble a normal Web error or public decoy service while substituting for the real C2 origin and function. IronNet explains that non-Beacon traffic is directed to a legitimate server. Unit 42 observed a Cowrie honeypot cover. Check Point distinguishes XLoader script-generated 404, server-generated 404, and 200 with an encrypted command when a task exists. A facade alone does not establish attack and must be joined to a cross-observer difference and C2 outcome, supporting medium-high confidence.
      evidence_keys: [B5-T1665-REF-IRONNET-UKRAINE-CS, B5-T1665-REF-UNIT42-CAMBODIA, B5-T1665-REF-XLOADER-C2]
      confidence: medium-high

  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: >-
            已完成固定零子项的开放搜索，保留两条正式轴。第一条稳定变量是 positive request qualification：front 判断请求是否与 implant secret/profile/protocol congruent，合格才 forward/expose；第二条是 negative observer classification：front/listener 判断来源是否属于 defender/scanner set，命中才 suppress/decoy。二者虽然都产生 differential，但 trace 和防守不同：前者要从 sample/victim traffic 恢复有效请求并连接 edge-origin route，后者要用相同请求跨 neutral/defender vantages 比较并审计 deny rule。两者有各自直接证据和独立 defense value。
          en: >-
            The open search required for a fixed zero-child candidate is complete and retains two formal axes. The first stable variable is positive request qualification: the front decides whether a request is congruent with an implant secret, profile, or protocol and forwards or exposes only on a match. The second is negative observer classification: the front or listener decides whether a source belongs to a defender or scanner set and suppresses or decoys only on a match. Although both produce a differential, traces and defense differ. The former requires recovery of a valid request from a sample or victim traffic and an edge-to-origin route join. The latter requires comparison of the same request across neutral and defender vantages and audit of deny rules. Each has direct evidence and independent defensive value.
        - zh: >-
            time-window listener exposure 是稳定且有防守价值的第三候选变量，Unit 42 直接观察 actor activity 时开放、其他时间关闭；其检测需要 longitudinal availability 与 victim activity join，而非 request/vantage A/B。然而当前只有一个公开事件来源同时证明隐藏目的和后继 C2，无法排除维护/运营窗口并建立足够独立 evidence breadth，因此父级保留、标记 defer，不立即分配 NJS。source geography、IP/ASN/user-agent/cookie/path/token、HTTP status、CDN/WAF 产品、端口、honeypot 类型都只是 predicate fields/response actions，不单独成子项。
          en: >-
            Time-window listener exposure is a stable third candidate variable with distinct defensive value. Unit 42 directly observed ports open during actor activity and closed otherwise, and its detection would require longitudinal availability joined to victim activity rather than request or vantage A/B testing. Presently, however, only one public incident source establishes both concealment purpose and successor C2, which is insufficient to exclude maintenance or operating windows and establish independent evidence breadth. Retain it at the parent and defer a separate NJS. Source geography, IP, ASN, user agent, cookie, path, token, HTTP status, CDN or WAF product, port, and honeypot type are predicate fields or response actions and do not form children by themselves.
    coverage: two-formal-one-deferred
    temporary_subtechnique_keys:
      - B5-T1665-NJS-REQUEST-QUALIFIED
      - B5-T1665-NJS-DEFENDER-SUPPRESSION
    deferred_axes:
      - key: B5-T1665-AXIS-TEMPORAL-EXPOSURE
        name: {zh: 操作时窗基础设施暴露, en: Operational-Window Infrastructure Exposure}
        reason:
          zh: 变量和检测差异成立，但只有 Unit 42 一个直接公开事件同时证明 C2、open/closed 时序和隐藏评估；保留父级内容，等待独立现场证据。
          en: The variable and detection difference are coherent, but only the Unit 42 incident directly establishes C2, open or closed timing, and concealment assessment. Retain at the parent pending independent field evidence.

proposed_subtechniques:
  - temporary_key: B5-T1665-NJS-REQUEST-QUALIFIED
    name: {zh: 请求资格门控 C2 暴露, en: Request-Qualified C2 Exposure}
    summary:
      zh: front 仅把与 implant secret、profile 或协议序列一致的请求转到真实 C2 或返回控制结果，其他请求进入良性/错误表面。
      en: A front sends only requests congruent with an implant secret, profile, or protocol sequence to real C2 or returns control results, sending other requests to a benign or error surface.
    stable_stealth_variable:
      zh: 攻击者控制的 positive qualification predicate 是否与 implant request congruent，而非具体 header/path/token 名称。
      en: Whether an attacker-controlled positive qualification predicate is congruent with the implant request, independent of the specific header, path, or token name.
    definition_and_concept:
      zh: >-
        攻击者在 redirector/origin 上保存一组只有 implant 能稳定产生的 request constraint，例如组合 URI、header、cookie/token、checksum、TLS/client fingerprint 或消息序列。全部或阈值匹配时请求被 forward 到 team server/listener 或返回 task；不匹配时由 normal site、404、redirect 或 decoy 终止。资格可以来自 sample config，但正式认定还必须观察 qualified branch 产生 C2 result。
      en: >-
        The actor stores at a redirector or origin a set of request constraints that the implant can reliably produce, such as a combined URI, header, cookie or token, checksum, TLS or client fingerprint, or message sequence. A complete or threshold match forwards the request to the team server or listener or returns a task, while mismatch terminates at a normal site, 404, redirect, or decoy. Qualification may be recovered from sample configuration, but formal classification also requires observation of a C2 result on the qualified branch.
    trace_change:
      zh: 同一 endpoint/time/vantage 下，request_variant 改变会稳定改变 edge action、origin_reached、upstream status、response hash/length 或 command outcome；invalid/generic probe 不产生 origin/server fingerprint。
      en: At the same endpoint, time, and vantage, changing request_variant stably changes edge action, origin_reached, upstream status, response hash or length, or command outcome; an invalid or generic probe does not expose an origin or server fingerprint.
    defender_observation_difference:
      zh: 防守必须从 sample/victim telemetry 恢复最小安全 request profile，在受控环境逐字段变体测试并连接 edge request ID 到 origin log；仅换扫描来源不足。泄漏有效 token 可能改变 actor behavior，测试须使用合成/过期值或 provider-side replay。
      en: Defense must recover a minimum safe request profile from a sample or victim telemetry, vary fields one at a time in a controlled environment, and join edge request ID to origin logs. Merely changing scanner source is insufficient. A valid token may alter actor behavior, so testing should use synthetic or expired values or provider-side replay.
    scope_and_sibling_boundary:
      zh: >-
        本子项只拥有 positive allow/forward predicate。若所有请求都到同一 origin 但 C2 bytes 伪装为 Web，归 NJT-0152；若只是 front 隐藏 origin 且无请求分支，归 NJT-0206；若 server 明确拒绝已知 security sources 而无需 implant profile，归兄弟 defender-suppression。NJS-0052-001 要求向 victim flow 注入内容，本子项要求 qualified branch 暴露 C2 service/result。
      en: >-
        This child owns only a positive allow or forward predicate. If every request reaches the same origin but C2 bytes mimic Web, classify NJT-0152. If a front hides the origin without a request branch, classify NJT-0206. If the server explicitly rejects known security sources without needing an implant profile, classify the defender-suppression sibling. NJS-0052-001 requires content injection into a victim flow, whereas this child requires the qualified branch to expose a C2 service or result.
    application_scenario:
      zh: IronNet 在 Ukraine 相关 Cobalt Strike server 上观察 intended-for-Nginx minimal defender bypass profile，并说明 redirector 只把 specific Beacon traffic 转到 C2、其余流量转到 legitimate server；Mandiant 说明 valid checksum stager request、UA black/allow list 和 web log。前者提供 incident-linked evidence，后者提供 capability/telemetry evidence。
      en: IronNet observed an Nginx-intended minimal defender-bypass profile on Ukraine-related Cobalt Strike servers and explains redirectors forwarding specific Beacon traffic to C2 while sending remaining traffic to a legitimate server. Mandiant documents valid-checksum stager requests, user-agent deny and allow lists, and web logs. The former supplies incident-linked evidence and the latter capability and telemetry evidence.
    mechanism:
      mechanism_ref: NM-BT
      role: primary
      summary: {zh: generic probe 因不满足 implant 资格而看不到 origin C2 行为, en: A generic probe cannot see origin C2 behavior because it fails implant qualification}
    defense_difference:
      zh: 检测以 request variant 与 edge-to-origin join 为核心；缓解以 provider rule audit、secret/profile rotation 后的 comparison 和 tenant/origin isolation 为核心。
      en: Detection centers on request variants and edge-to-origin joins. Mitigation centers on provider rule audit, comparison after secret or profile rotation, and tenant or origin isolation.
    evidence_keys: [B5-T1665-REF-IRONNET-UKRAINE-CS, B5-T1665-REF-MANDIANT-CS-COMPONENTS]
    evidence_limitations:
      zh: IronNet 把 profile 与已知 C2 cluster 连接，但未发布每个 request 的 redirector log；Mandiant 描述 product capability 而非独立 intrusion。因此 formal case 应保持 incident-observed configuration plus supported routing behavior，不声称已取得完整生产 rule。
      en: IronNet links the profile to a known C2 cluster but does not publish per-request redirector logs. Mandiant describes product capability rather than an independent intrusion. A formal case should therefore state incident-observed configuration plus supported routing behavior and not claim acquisition of a complete production rule.
    confidence: medium-high
  - temporary_key: B5-T1665-NJS-DEFENDER-SUPPRESSION
    name: {zh: 防守观察者选择性抑制, en: Defender-Observer Selective Suppression}
    summary:
      zh: front/listener 识别扫描器、研究机构或安全厂商来源并对其拒绝、伪装或关闭，同时允许受害端继续 C2。
      en: A front or listener identifies scanner, research, or security-vendor sources and denies, disguises, or closes to them while allowing victim C2 to continue.
    stable_stealth_variable:
      zh: 观察来源是否命中 attacker-maintained defender/scanner classification，而非具体 IP、ASN、厂商、地域或封锁名单。
      en: Whether the observing source matches an attacker-maintained defender or scanner classification, independent of the specific IP, ASN, vendor, geography, or block list.
    definition_and_concept:
      zh: >-
        攻击者根据 source IP/ASN/organization、known security range、cloud/VPS/research network、crawler fingerprint 或等价 defender identity 执行 negative predicate；命中者被 drop/reset/redirect/decoy，不命中且来自 victim context 的请求仍到达 C2。与普通 anti-bot 的区别不是 rule 字段，而是该 policy 隐藏 attacker C2 且 qualified victim 已产生后继控制结果。
      en: >-
        The actor evaluates a negative predicate from source IP, ASN or organization, known security ranges, cloud, VPS or research networks, crawler fingerprints, or equivalent defender identity. A match is dropped, reset, redirected, or decoyed, while a nonmatching request from victim context still reaches C2. The difference from ordinary anti-bot is not the rule field but that the policy hides attacker C2 and a qualified victim has produced a successor control result.
    trace_change:
      zh: 在固定 request_variant、endpoint/protocol/time 下，defender-class vantage 得到 block/reset/timeout/decoy，而 neutral/victim-aligned vantage 得到 origin response 或 C2 session；provider rule/action 或 server deny log 能直接解释差。
      en: With request variant, endpoint, protocol, and time fixed, a defender-class vantage receives block, reset, timeout, or decoy while a neutral or victim-aligned vantage receives an origin response or C2 session. Provider rule and action or server deny logs can directly explain the difference.
    defender_observation_difference:
      zh: 防守要从至少两个 source classes 运行相同安全 probe，使用 request ID/response fingerprint 比较，并通过 provider/hosting audit 确认 matched deny rule；单纯轮换 User-Agent 会混入正向门。长期 distributed/residential observation 可降低公开 scanner range 被定向抑制的盲区。
      en: Defense should run the same safe probe from at least two source classes, compare request IDs and response fingerprints, and confirm the matched deny rule through provider or hosting audit. Merely rotating user agent can mix in the positive-gate sibling. Long-horizon distributed or residential observation reduces blindness caused by targeting known scanner ranges.
    scope_and_sibling_boundary:
      zh: >-
        本子项只拥有 negative observer classification。只有合格 secret/profile 才通过属于 request-qualified sibling；按工作时间开放但不识别 observer 暂留父级 temporal axis；client 本地识别 sandbox 属 T1497。合法 WAF blocking security scans、rate limit 和 DDoS source suppression 是反例，除非与 malicious C2 tenant/origin 和 victim result 连接。
      en: >-
        This child owns only negative observer classification. A requirement for a qualified secret or profile belongs to the request-qualified sibling. Exposure by work hours without observer classification remains the deferred temporal axis at the parent. Client-side sandbox recognition belongs to T1497. Legitimate WAF blocking of security scans, rate limiting, and DDoS source suppression are counterexamples unless joined to a malicious C2 tenant or origin and a victim result.
    application_scenario:
      zh: Unit 42 在明确评为 C2 的 target-facing infrastructure 上观察 known Palo Alto ranges、部分 VPS/cloud providers、Big Tech 与其他 cybersecurity company ranges 被阻断，同时 24 个柬埔寨政府组织长期通信。该案例直接证明 source-class suppression 和 successor C2。
      en: Unit 42 observed known Palo Alto Networks ranges, some VPS and cloud providers, Big Tech, and other cybersecurity-company ranges blocked on target-facing infrastructure explicitly assessed as C2 while 24 Cambodian government organizations communicated over time. The case directly establishes source-class suppression and successor C2.
    mechanism:
      mechanism_ref: NM-BT
      role: primary
      summary: {zh: attacker 识别防守观察者后移除可被其测得的 C2 行为, en: The actor removes measurable C2 behavior after identifying a defensive observer}
    defense_difference:
      zh: 检测以 same-request cross-vantage comparison 和 deny-rule attribution 为核心；缓解以 provider 识别针对研究/安全来源的恶意规则、暂停 tenant/origin 并保留规则历史为核心。
      en: Detection centers on same-request cross-vantage comparison and deny-rule attribution. Mitigation centers on provider identification of malicious rules targeting research or security sources, suspension of the tenant or origin, and rule-history preservation.
    evidence_keys: [B5-T1665-REF-UNIT42-CAMBODIA]
    evidence_limitations:
      zh: Unit 42 未公开完整扫描方法和 server/provider rule，因此直接支持 observed blocking 与 C2 linkage，rule ownership/表达式仍是高可信评估而非日志级复现。
      en: Unit 42 does not publish complete scan methodology or server and provider rules. It directly supports observed blocking and C2 linkage, while rule ownership and expression remain a high-confidence assessment rather than log-level reproduction.
    confidence: high

defense_candidates:
  detection_strategies:
    - temporary_key: B5-T1665-DET-VICTIM-EXPOSURE-DIFFERENTIAL
      name: {zh: 受害端 C2 结果与基础设施暴露差关联, en: Victim C2 Outcome and Infrastructure Exposure Differential Correlation}
      candidate_resolution: create
      description:
        zh: >-
          先由受害端 process/network/outcome 确立 candidate C2，再把同一 endpoint 的受控 request variants、neutral/defender vantages、edge/WAF decision、origin route 和 longitudinal listener state 关联，识别合格请求可达、研究者不可见的选择性基础设施。策略必须分别输出 request-qualified、defender-suppressed 和 temporal-supporting 分支；普通 CDN/WAF differential 只有与 attacker-controlled C2 successor 连接才升级。
        en: >-
          Establish candidate C2 first from victim process, network, and outcome telemetry, then correlate controlled request variants, neutral and defender vantages, edge or WAF decisions, origin routing, and longitudinal listener state for the same endpoint to identify infrastructure reachable by qualified requests but hidden from researchers. The strategy should emit separate request-qualified, defender-suppressed, and temporal-supporting branches. An ordinary CDN or WAF differential escalates only when joined to an attacker-controlled C2 successor.
      candidate_resolution_notes:
        zh: DET-000032 的 subject 是 visitor/page profiling 且依赖 browser/script/property collection；DET-000047 的 subject 是 TA0042 staged resource 与 downstream object execution。新策略的 subject 是已投入使用的 C2 endpoint/front、success side 来自 victim C2，不能仅扩展 detects_refs 而复用。两者的多视角比较方法可借鉴，但 semantic identity 必须分开。
        en: DET-000032 concerns visitor and page profiling and depends on browser, script, and property collection. DET-000047 concerns a TA0042 staged resource and downstream object execution. The new strategy concerns an operational C2 endpoint or front whose successful side comes from victim C2 and cannot be reused merely by extending detects_refs. Their multi-vantage comparison method is reusable as design precedent, but semantic identities must remain separate.
  detection_analytics:
    - temporary_key: B5-T1665-NJA-VICTIM-EXPOSURE-DIFFERENTIAL
      name: {zh: 受害端 C2 成功与多视角暴露差分析, en: Victim C2 Success and Multi-Vantage Exposure Differential Analytic}
      purpose:
        zh: 以 victim_success 为必要锚点，区分 positive request gate、negative defender suppression、仅时间差和普通 CDN/WAF policy，并保留 rule/provider 证据等级。
        en: Require victim_success as the anchor, separate a positive request gate, negative defender suppression, time-only difference, and ordinary CDN or WAF policy, and preserve rule and provider evidence levels.
      raw_to_normalized_fields:
        - source: victim-endpoint-network
          channel: EDR process and network events
          raw_fields: [Timestamp, DeviceId, RemoteUrl, RemoteIP, RemotePort, Protocol, InitiatingProcessUniqueId, InitiatingProcessFileName, InitiatingProcessCommandLine, ActionType, LocalIP, LocalPort]
          normalized_fields: [event_time, device_id, destination_host, destination_ip, destination_port, transport, process_start_key, process_image, process_command_line, network_action, source_ip, source_port]
        - source: victim-c2-outcome
          channel: EDR, NDR, sandbox, incident lineage, or validated protocol emulation
          raw_fields: [timestamp, device_id, process_start_key, network_session_id, malware_family, callback_state, task_id, task_type, response_hash, child_process_id, file_hash, result_direction, confidence]
          normalized_fields: [event_time, device_id, process_start_key, network_session_id, malware_identity, c2_callback_state, c2_task_id, c2_task_type, c2_response_hash, outcome_process_id, outcome_object_hash, c2_result_direction, outcome_confidence]
        - source: controlled-multivantage-probe
          channel: Authorized active measurement or provider-side replay
          raw_fields: [probe_timestamp, probe_id, authorization_scope, vantage_id, source_ip, source_asn, source_org, source_country, vantage_class, request_variant_id, destination_host, destination_ip, destination_port, protocol, tls_client_fingerprint, sni, http_method, request_path, request_header_hash, cookie_or_token_presence, response_status, response_header_hash, response_body_hash, response_bytes, redirect_target, tcp_result, latency_ms, certificate_fingerprint]
          normalized_fields: [event_time, probe_id, authorization_scope, vantage_id, probe_source_ip, probe_source_asn, probe_source_org, probe_source_country, vantage_class, request_variant_id, destination_host, destination_ip, destination_port, application_protocol, client_fingerprint, tls_server_name, request_method, request_path, request_feature_hash, credential_material_present, response_status, response_header_hash, response_body_hash, response_bytes, redirect_target, connection_result, response_latency, certificate_fingerprint]
        - source: aws-waf-edge
          channel: AWS WAF web ACL log
          raw_fields: [timestamp, webaclId, httpSourceId, requestId, httpRequest.clientIp, clientAsn, country, httpRequest.httpMethod, httpRequest.uri, httpRequest.args, httpRequest.headers, ja3Fingerprint, ja4Fingerprint, action, terminatingRuleId, terminatingRuleType, nonTerminatingMatchingRules, labels, responseCodeSent]
          normalized_fields: [event_time, edge_policy_id, edge_resource_id, request_id, client_ip, client_asn, client_country, request_method, request_path, request_query, request_headers, client_fingerprint_ja3, client_fingerprint_ja4, edge_action, matched_rule_id, matched_rule_type, additional_rule_matches, edge_labels, edge_response_status]
        - source: cloudflare-http-edge
          channel: Cloudflare HTTP requests Logpush
          raw_fields: [EdgeStartTimestamp, RayID, ClientIP, ClientASN, ClientCountry, ClientIPClass, ClientRequestHost, ClientRequestMethod, ClientRequestPath, ClientRequestURI, ClientRequestUserAgent, JA3Hash, JA4, BotScore, MatchedRules, SecurityAction, SecurityRuleID, EdgeResponseStatus, EdgeResponseContentType, EdgeResponseBodyBytes, OriginIP, OriginResponseStatus, WorkerScriptName, WorkerStatus]
          normalized_fields: [event_time, request_id, client_ip, client_asn, client_country, client_class, request_host, request_method, request_path, request_uri, user_agent, client_fingerprint_ja3, client_fingerprint_ja4, bot_score, matched_rules, edge_action, matched_rule_id, edge_response_status, edge_response_content_type, edge_response_bytes, origin_ip, origin_response_status, edge_script_name, edge_script_status]
        - source: reverse-proxy-origin
          channel: Nginx, Apache, Envoy, load balancer, or equivalent front and origin logs
          raw_fields: [timestamp, request_id, remote_addr, forwarded_for, host, method, uri, user_agent, cookie_names, tls_fingerprint, status, body_bytes_sent, upstream_addr, upstream_status, upstream_response_time, route_name, matched_rule, connection_termination]
          normalized_fields: [event_time, request_id, client_ip, forwarded_client_chain, request_host, request_method, request_path, user_agent, cookie_name_set, client_fingerprint, edge_response_status, edge_response_bytes, origin_ip, origin_response_status, origin_latency, origin_route, matched_rule_id, connection_result]
        - source: exposure-policy-audit
          channel: CDN, WAF, reverse proxy, firewall, security group, listener, and tenant audit log
          raw_fields: [eventTime, tenantId, actorId, resourceId, policyId, ruleId, ruleVersion, conditionExpression, action, routeTarget, enabled, validFrom, validTo, changeRequestId, sourceIp, previousValue, newValue]
          normalized_fields: [event_time, tenant_id, policy_actor_id, infrastructure_resource_id, edge_policy_id, matched_rule_id, rule_version, rule_condition, edge_action, origin_route, rule_enabled, rule_valid_from, rule_valid_to, change_request_id, policy_actor_ip, previous_rule_value, new_rule_value]
        - source: longitudinal-service-observation
          channel: Approved port, TLS, HTTP, and protocol health observations
          raw_fields: [timestamp, vantage_id, destination_host, destination_ip, destination_port, protocol, tcp_result, tls_result, certificate_fingerprint, application_banner_hash, response_status, response_hash]
          normalized_fields: [event_time, vantage_id, destination_host, destination_ip, destination_port, application_protocol, connection_result, tls_result, certificate_fingerprint, service_surface_hash, response_status, response_body_hash]
      logic:
        zh: >-
          第一步从 victim telemetry 建立 candidate endpoint：已确认恶意/未授权 process 在同一 destination 上产生 repeated bidirectional callback，或出现 task/config/payload、command/result、protocol-emulated C2 response；只凭 reputation/IOC 不设 victim_success。第二步按 endpoint+protocol+15-minute bucket 规范化 probe/edge/origin events，建立 response_variant=(connection_result,status,header/body hash,length,redirect,certificate,edge_action,origin_reached,origin_status)。request-qualified 分支要求同 vantage/time 只改变 request_variant 后，implant-congruent 变体稳定 origin_reached/C2-like response，而 generic/invalid 变体进入 benign/error surface，至少重复两次或有 provider rule/audit。defender-suppressed 分支要求固定 request_variant/time，defender/scanner class 被 deny/reset/decoy，而 neutral/victim-aligned class 成功，至少两个 source classes 且有 matched rule/server deny 或两个独立重复。temporal-supporting 分支在 7–30 天窗口比较 listener/service open state 与 victim/actor activity；因当前 taxonomy defer，它提高 parent confidence 而不自动映射 NJS。最终只有 victim_success 与 exposure branch 同 endpoint/campaign 且差异不能由 approved policy 解释时输出 selective_c2_exposure_confirmed。
        en: >-
          First establish a candidate endpoint from victim telemetry: a confirmed malicious or unauthorized process creates repeated bidirectional callbacks to one destination, or a task, configuration, payload, command or result, or protocol-emulated C2 response appears. Reputation or an IOC alone does not set victim_success. Second, normalize probe, edge, and origin events by endpoint, protocol, and 15-minute bucket and construct response_variant from connection result, status, header and body hashes, length, redirect, certificate, edge action, origin-reached state, and origin status. The request-qualified branch requires a stable origin-reached or C2-like response for an implant-congruent variant and a benign or error surface for a generic or invalid variant while vantage and time remain fixed, repeated at least twice or supported by provider rule or audit evidence. The defender-suppressed branch holds request variant and time fixed and requires denial, reset, or decoy for a defender or scanner class and success for a neutral or victim-aligned class across at least two source classes, plus a matched rule or server deny record or two independent repetitions. The temporal-supporting branch compares listener and service-open state with victim or actor activity across seven to thirty days. Because its taxonomy is deferred, it raises parent confidence without mapping an NJS. Emit selective_c2_exposure_confirmed only when victim_success and an exposure branch share endpoint and campaign and approved policy does not explain the difference.
      correlation:
        window: 15 minutes for matched request or vantage A/B; 24 hours for victim outcome linkage; 7 to 30 days for listener exposure timing; policy version must be valid at event time
        dimensions: [destination_host, destination_ip, destination_port, application_protocol, certificate_fingerprint, request_variant_id, vantage_class, client_asn, client_org, client_country, request_id, matched_rule_id, rule_version, edge_action, origin_ip, origin_reached, response_variant, device_id, process_start_key, network_session_id, c2_task_id, campaign_cluster, time]
      output_states:
        - candidate_c2_without_exposure_evidence
        - ordinary_or_approved_differential
        - request_qualified_exposure_candidate
        - defender_suppression_candidate
        - temporal_exposure_supporting
        - selective_c2_exposure_confirmed
      observables:
        - Confirmed malicious process succeeds to an endpoint that generic safe probes see only as ordinary 404, redirect, reset, timeout, or closed
        - Implant-congruent request variant reaches an origin while a generic variant is handled at the edge
        - Identical request from a known security or scanner source is blocked or decoyed while a neutral source reaches origin
        - WAF or reverse-proxy rule explicitly matches security ranges, scanner classes, or implant-specific fields and selects deny, decoy, or origin route
        - Listener is available only in windows containing victim C2 activity across repeated days
      false_positives:
        - Legitimate anti-bot, DDoS, abuse prevention, vulnerability-scan blocking, and rate limits
        - Geographic compliance, data residency, export control, or licensed regional content
        - mTLS, webhook secret, signed URL, private API, health-check, and tenant authorization gates
        - CDN cache, edge function, A/B testing, canary, blue-green release, maintenance, and disaster recovery
        - Approved honeypots, deception platforms, research sinks, and provider abuse controls
        - NAT, mobile carrier, proxy, or reputation service classifying one vantage differently
      blind_spots:
        - No victim endpoint or process lineage and no independent proof that the endpoint is C2
        - One-time or per-victim tokens that cannot be safely replayed
        - TLS, ECH, proprietary protocols, packet loss, and response-body collection prohibited by privacy policy
        - CDN, WAF, provider, reverse-proxy, or origin logs unavailable to the victim defender
        - Actor recognizes every available probe vantage or changes rules immediately after probing
        - Cache, Anycast, GeoDNS, backend health, or route changes prevent matched observations
        - Short-lived listener windows outside collection or probes
      tuning_guidance:
        zh: >-
          为 approved external services 保存 owner、tenant/resource、purpose、allowed source classes、condition fields、rule ID/version、origin set、release window 和 expiry。不要按 CDN/provider/domain 永久 allow，也不要把 security-vendor block 单独定性。先以 victim_success、provider rule/audit 或 repeated matched A/B 提升置信；一次只改变一个 request/vantage factor。对 body/cookie/token 先 hash/redact，禁止把活跃 victim credential 放入外部 probe。主动测量只在授权、owned、sinkholed、seized 或 provider-coordinated 范围内运行；其余使用被动/多组织 evidence。定期用批准 canary 验证 request ID、edge action 与 origin route 字段能关联。
        en: >-
          For approved external services, retain owner, tenant and resource, purpose, allowed source classes, condition fields, rule ID and version, origin set, release window, and expiry. Do not permanently allow a CDN, provider, or domain and do not classify a security-vendor block alone. Raise confidence first from victim_success, provider rule or audit, or repeated matched A/B observations, changing one request or vantage factor at a time. Hash or redact bodies, cookies, and tokens and never place an active victim credential into an external probe. Run active measurement only in authorized, owned, sinkholed, seized, or provider-coordinated scope; otherwise use passive and multi-organization evidence. Regularly use approved canaries to verify that request ID, edge action, and origin route fields join correctly.
      evidence_keys: [REF-000625, REF-000975, B5-T1665-REF-UNIT42-CAMBODIA, B5-T1665-REF-IRONNET-UKRAINE-CS, B5-T1665-REF-MANDIANT-CS-COMPONENTS, B5-T1665-REF-CLOUDFLARE-HTTP-LOGS, B5-T1665-REF-XLOADER-C2]
      confidence: high
  mitigations:
    - temporary_key: B5-T1665-MIT-RUNTIME-EXPOSURE-GOVERNANCE
      name: {zh: C2 暴露策略审计与基础设施处置, en: C2 Exposure-Policy Audit and Infrastructure Enforcement}
      candidate_resolution: create
      reuse_review:
        zh: >-
          MIT-000046 已拥有“多视角投放验证与条件规则治理”，但其 subject、措施和 applications 都限定 TA0042 staged resource 与 content publication。运行时 C2 需要 victim-success anchor、edge-origin route、listener state、provider tenant suspension 和 origin isolation；建议创建独立 MIT，而不是只给 MIT-000046 增加名字替换式 application。可复用其授权多视角方法，不复用对象身份。
        en: >-
          MIT-000046 already owns multi-vantage staging validation and conditional-rule governance, but its subject, measure, and applications are limited to TA0042 staged resources and content publication. Runtime C2 requires a victim-success anchor, edge-to-origin routing, listener state, provider tenant suspension, and origin isolation. Create a separate MIT rather than adding a name-substituted application to MIT-000046. Its authorized multi-vantage method is reusable, not its object identity.
      description:
        zh: >-
          hosting/CDN/WAF/provider 与企业 IR 联合保留请求—规则—origin 谱系，审计针对 scanner/security classes 或 implant-only predicates 的选择性规则，从授权多视点复现差分；对证据确认的恶意 tenant/front/origin 暂停服务、隔离 origin、撤销 credential 并阻断受害端 egress，同时保存规则版本和请求证据。
        en: >-
          Hosting, CDN, WAF, and other providers cooperate with enterprise incident response to retain request-to-rule-to-origin lineage, audit selective rules targeting scanner or security classes or implant-only predicates, and reproduce differences from authorized multiple vantages. For evidence-confirmed malicious tenants, fronts, or origins, suspend service, isolate the origin, revoke credentials, and block victim egress while preserving rule versions and request evidence.
      measures:
        - key: request-rule-origin-lineage
          name: {zh: 请求、规则与 origin 谱系留存, en: Request Rule and Origin Lineage Retention}
          control_type: detective-support
          implementation:
            zh: 在 edge/WAF/reverse proxy 记录不可重复 request ID、client class/IP/ASN/country、经脱敏的 path/header/cookie-name 或 feature hash、matched rule/version/action、edge response、origin target/status 和 tenant/account；policy audit 保留 condition expression、actor、before/after、validity 与 change request。日志独立写入受限 SIEM/object lock，retention 覆盖调查窗口。
            en: At the edge, WAF, and reverse proxy, record a unique request ID, client class, IP, ASN and country, redacted path, header and cookie-name or feature hashes, matched rule, version and action, edge response, origin target and status, and tenant or account. Policy audit retains condition expression, actor, before and after values, validity, and change request. Write logs independently to a restricted SIEM or object-locked store and retain them across the investigation window.
        - key: authorized-exposure-differential-validation
          name: {zh: 授权暴露差复现, en: Authorized Exposure Differential Validation}
          control_type: detective-support
          implementation:
            zh: 从 neutral、defender-class 与 victim-aligned 的批准视点，以固定 endpoint/protocol/time 的 safe probes 一次改变 request profile 或 source class；比较 status/hash/redirect/reset、edge action 和 origin reach。使用 provider-side replay、合成/过期 token 和速率限制，不把 active victim secret 发送出受控边界。
            en: From approved neutral, defender-class, and victim-aligned vantages, hold endpoint, protocol, and time stable and change one request profile or source class at a time with safe probes. Compare status, hash, redirect, reset, edge action, and origin reach. Use provider-side replay, synthetic or expired tokens, and rate limits and do not send active victim secrets outside controlled boundaries.
        - key: malicious-selective-rule-review
          name: {zh: 恶意选择规则审查, en: Malicious Selective Rule Review}
          control_type: governance
          implementation:
            zh: provider 对新建/变更的 rules 评估是否仅针对 security/research ASNs、known scanner classes、secret implant paths/headers 或短时 listener activation，并与 tenant abuse、malware/C2 reports、origin reputation 和 victim success 关联。合法 anti-bot/DDoS/geo/mTLS rule 绑定 owner/purpose/change ticket/expiry；无 owner 或与 C2 相连的 rule 进入人工 abuse review。
            en: Providers evaluate new or changed rules for targeting only security or research ASNs, known scanner classes, secret implant paths or headers, or short-lived listener activation and correlate them with tenant abuse, malware or C2 reports, origin reputation, and victim success. Legitimate anti-bot, DDoS, geographic, and mTLS rules bind owner, purpose, change ticket, and expiry. Ownerless rules or rules linked to C2 enter human abuse review.
        - key: tenant-front-origin-containment
          name: {zh: tenant、front 与 origin 联合处置, en: Tenant Front and Origin Coordinated Containment}
          control_type: responsive
          implementation:
            zh: 在 combined evidence 达阈值后，provider 保存 snapshot/log/rule history，暂停恶意 tenant/worker/edge route，移除 origin access、rotate provider credentials 并通知 registrar/hosting；受害组织按 destination+process+campaign 阻断 egress、隔离 endpoint 并继续收集 task/result。处置使用短时 reversible quarantine 到人工确认，避免仅凭 404/差分误封共享服务。
            en: After combined evidence reaches threshold, the provider preserves snapshots, logs, and rule history, suspends the malicious tenant, worker, or edge route, removes origin access, rotates provider credentials, and coordinates with registrar or hosting. The victim organization blocks egress by destination, process, and campaign, isolates the endpoint, and continues task or result collection. Use short, reversible quarantine pending human confirmation to avoid blocking a shared service from a 404 or differential alone.
      applications:
        - target: parent
          use:
            zh: 对 candidate C2 先建立 victim-success，再从 edge/request/rule/origin 和 longitudinal listener 证明选择性暴露；provider 与受害 IR 共同处置 tenant/front/origin 和 endpoint。
            en: Establish victim success for candidate C2 first, then prove selective exposure from edge, request, rule, origin, and longitudinal listener evidence. Provider and victim IR jointly contain the tenant, front, origin, and endpoint.
          expected_effect:
            zh: request/vantage differential 不再停留在外部推测，攻击者须放弃 provider/front、频繁改 rule/origin 或承担 victim C2 中断与 rule audit 暴露。
            en: Request and vantage differences no longer remain external inference. The actor must abandon the provider or front, repeatedly change rules or origins, or accept victim C2 interruption and exposure in rule audit.
          limitations:
            zh: victim 组织通常无 provider/origin 权限，跨组织共享和法律流程会延迟；one-time token、加密、短窗口和共享 CDN 增加误报/盲区，必须使用组合证据和渐进处置。
            en: Victim organizations usually lack provider and origin access, and cross-organization sharing and legal process can delay action. One-time tokens, encryption, short windows, and shared CDNs increase false positives and blind spots, requiring combined evidence and staged enforcement.
        - target: B5-T1665-NJS-REQUEST-QUALIFIED
          use:
            zh: 在 provider-side replay 中恢复最小安全 request profile，审查 positive allow/route rule，撤销 tenant credential 并隔离 origin；victim 侧同时阻断产生 qualified callback 的 process/destination。
            en: Recover the minimum safe request profile in provider-side replay, review positive allow and route rules, revoke tenant credentials, and isolate the origin while the victim blocks the process and destination generating qualified callbacks.
          expected_effect:
            zh: 合格请求不能继续秘密到达 C2 origin，且规则、请求和 origin 的谱系可用于识别同 tenant/cluster 的替代 front。
            en: Qualified requests can no longer secretly reach the C2 origin, and rule, request, and origin lineage can identify replacement fronts in the same tenant or cluster.
          limitations:
            zh: 无 sample/profile 或 provider log 时不能安全重放；泄漏 active token 可能触发 actor 轮换，必须先保存证据并使用合成/过期值。
            en: Safe replay may be impossible without a sample, profile, or provider logs. Leaking an active token may trigger actor rotation, so preserve evidence first and use synthetic or expired values.
        - target: B5-T1665-NJS-DEFENDER-SUPPRESSION
          use:
            zh: 对 same-request cross-vantage 差连接 matched deny rule，审查针对 security/research sources 的 rule owner/purpose；确认恶意后暂停 tenant/listener 并保留 blocklist/rule version。
            en: Join the same-request cross-vantage difference to a matched deny rule and review rule owner and purpose for security or research sources. After malicious confirmation, suspend the tenant or listener and preserve block-list and rule versions.
          expected_effect:
            zh: 攻击者不能再靠识别固定 defender networks 让 C2 对研究者消失，distributed observation 和 provider audit 提高基础设施映射/处置率。
            en: The actor can no longer make C2 disappear to researchers merely by identifying fixed defender networks, and distributed observation plus provider audit improves mapping and containment.
          limitations:
            zh: 普通 DDoS/anti-bot 也会屏蔽 data-center/scanner sources；没有 victim C2 与 rule linkage 时不得暂停 tenant。
            en: Ordinary DDoS and anti-bot controls also block data-center and scanner sources. Do not suspend a tenant without victim C2 and rule linkage.
      evidence_keys: [REF-000975, B5-T1665-REF-UNIT42-CAMBODIA, B5-T1665-REF-IRONNET-UKRAINE-CS, B5-T1665-REF-MANDIANT-CS-COMPONENTS, B5-T1665-REF-CLOUDFLARE-HTTP-LOGS]

cross_technique_boundary_and_dedup:
  - adjacent_ref: NJT-0051
    adjacent_name: Acquire Stealth-Oriented Infrastructure
    decision: distinct
    boundary:
      zh: NJT-0051 结束于取得、信誉老化或预置可供后续使用的资源；T1665-adapt 从资源已承担 C2 后的 per-request/per-observer/listener exposure decision 开始。可信 CDN/hosting 购买本身不能完成本技术。
      en: NJT-0051 ends with acquiring, reputation-aging, or prepositioning a resource for later use. The T1665 adaptation begins with each request, observer, or listener exposure decision after the resource serves C2. Acquiring trusted CDN or hosting does not complete this technique.
  - adjacent_ref: NJT-0044
    adjacent_name: Compromise Infrastructure
    decision: distinct-co-classify
    boundary:
      zh: NJT-0044 拥有第三方资源 takeover 与继承 provenance/normal function；若该资源后来用 attacker rules 选择性暴露 C2，可并列 T1665，但 compromised ownership 不替代 runtime differential。
      en: NJT-0044 owns takeover of a third-party resource and inherited provenance or normal function. If attacker rules later expose C2 selectively on that resource, T1665 can coexist, but compromised ownership does not substitute for a runtime differential.
  - adjacent_ref: NJT-0206
    adjacent_name: Intermediary-Path C2 Relaying
    decision: distinct-co-classify
    boundary:
      zh: NJT-0206/T1090 拥有 relay topology、last hop、cross-layer routing authority 和 domain fronting；T1665 只拥有 front 是否把某 request/observer 转发到真实 C2 的条件分支。所有流量都经 CDN/redirector 时只有路径，不是选择性暴露。
      en: NJT-0206 and T1090 own relay topology, last hops, cross-layer routing authority, and domain fronting. T1665 owns only the conditional branch deciding whether a request or observer is forwarded to real C2. If all traffic traverses the CDN or redirector, only path relaying exists, not selective exposure.
  - adjacent_ref: NJT-0213
    adjacent_name: Runtime C2 Endpoint Derivation
    decision: distinct-co-classify
    boundary:
      zh: NJT-0213/T1568 拥有 resolver/shared state/parameter 合成 endpoint locator；T1665 不改变 client 怎样获得 locator，而改变请求抵达 candidate endpoint 后观察到的服务。rotation/short TTL/DGA 单独不准入。
      en: NJT-0213 and T1568 own endpoint locators derived from resolvers, shared state, or parameter synthesis. T1665 does not change how the client obtains a locator; it changes the service observed after a request reaches a candidate endpoint. Rotation, short TTL, or DGA alone is not admitted.
  - adjacent_ref: NJT-0209
    adjacent_name: Shared Web-Service Control Resources
    decision: distinct-co-classify
    boundary:
      zh: NJT-0209/T1102 拥有合法 service resource/account/namespace 中 task-state rendezvous；T1665 的 predicate 位于 C2 front/listener exposure。使用 Cloudflare/AWS/GitHub 等服务名既不证明 shared-service resource，也不证明 selective exposure。
      en: NJT-0209 and T1102 own task-state rendezvous in a legitimate service resource, account, or namespace. The T1665 predicate is at C2 front or listener exposure. A service name such as Cloudflare, AWS, or GitHub establishes neither a shared-service resource nor selective exposure.
  - adjacent_ref: NJT-0052
    adjacent_name: Content Injection
    decision: distinct-co-classify
    boundary:
      zh: T1659/NJT-0052 改变受害者在线 flow 中接收的内容，NJS-0052-001 的 target/request gate 以 injection outcome 为核心；T1665 正向 gate 以真实 C2 service/origin 是否暴露为核心。若 redirector 同时向目标注入 payload 并隐藏 C2，可双重归类但证据分别成立。
      en: T1659 and NJT-0052 change content received in a victim's online flow, and the target or request gate in NJS-0052-001 centers on an injection outcome. The positive T1665 gate centers on whether the real C2 service or origin is exposed. A redirector that both injects a payload and hides C2 can be dual-classified when each evidence chain independently holds.
  - adjacent_ref: NJT-0152
    adjacent_name: C2 Message Carrier and Service Camouflage
    decision: distinct-co-classify
    boundary:
      zh: NJT-0152/T1001 拥有已发生 C2 stream 内的 message、carrier 与 service-contract camouflage；T1665 拥有不同观察者是否获得该 stream/service。XLoader 404 command 可支持 NJT-0152，只有 valid/invalid observer branch 和 successor C2 同时证明时才支持 T1665。
      en: NJT-0152 and T1001 own message, carrier, and service-contract camouflage inside an established C2 stream. T1665 owns whether different observers obtain that stream or service. An XLoader 404 command can support NJT-0152 and supports T1665 only when a valid versus invalid observer branch and successor C2 are also established.
  - adjacent_ref: NJT-0049
    adjacent_name: Stealth-Oriented Capability Staging
    decision: distinct
    boundary:
      zh: NJT-0049/NJS-0049-002 与 DET-000047/NJA-000021 关注 Resource Development 中 staged payload/content 对 target context 的条件投放，结束于后续 retrieval/execution；T1665 是已运行 C2 endpoint 对控制会话暴露的差异，success outcome 是 C2 task/result，不是 staged object execution。
      en: NJT-0049 and NJS-0049-002 with DET-000047 and NJA-000021 concern conditional delivery of staged payload or content during Resource Development and end at later retrieval or execution. T1665 concerns exposure differences at an operational C2 endpoint, and its successful outcome is a C2 task or result rather than execution of a staged object.
  - adjacent_ref: DET-000032
    adjacent_name: Web Host Profiling and Selective-Response Correlation
    decision: do-not-reuse
    boundary:
      zh: DET-000032/NJA-000006 从 request metadata/browser property collection 识别 victim profiling 与 selective content；它不要求 candidate endpoint 已产生 C2，也不采集 edge-origin route/deny policy。T1665 新 DET/NJA 可借用 response hash/多客户端比较方法，但 direct subject、success anchor 和字段 identity 不同。
      en: DET-000032 and NJA-000006 identify victim profiling and selective content from request metadata and browser property collection. They do not require a candidate endpoint with a C2 result or collect edge-to-origin routes and deny policies. The new T1665 DET and NJA can reuse response-hash and multi-client comparison methods, but the direct subject, success anchor, and field identity differ.

