strategies:
  B5-T1571-DET-SEMANTIC-PORT-DIFFERENTIAL:
    summary:
      zh: 比较当地服务预期、真实协议解析和策略结果，并要求同一会话产生后继 C2。
      en: Compare the locally expected service, actual protocol parsing, and policy outcome, requiring a successor C2 result
        from the same session.
    description:
      paragraphs:
      - zh: 本策略将端口从标签变为可检验的服务预期。NJA-000343 先用版本化资产和策略登记得到 expected_service，再用 Zeek、Suricata、应用感知防火墙或协议仿真得到 actual_semantics；分别保留误放行和解析错位结果，最终连接端点任务、响应或重复控制通信。未知协议与罕见端口只能生成调查候选。
        en: This strategy treats a port as a testable service expectation rather than a label. NJA-000343 derives expected_service
          from versioned asset and policy records and obtains actual semantics from Zeek, Suricata, an application-aware firewall,
          or protocol emulation. It retains mistaken allowance and parser displacement as separate outcomes and then joins
          endpoint tasking, responses, or repeated control communication. An unknown protocol or rare port alone produces
          an investigation candidate.
  B5-T1572-DET-CROSSLAYER:
    summary:
      zh: 重建内层服务、外层连接和解封装结果之间的映射，识别未经批准的 C2 协议隧道。
      en: Reconstruct mappings among inner services, outer connections, and decapsulation outcomes to identify unapproved
        C2 protocol tunnels.
    description:
      paragraphs:
      - zh: NJA-000344 连接隧道进程的内外 socket 和服务结果，NJA-000345 用流 ID 或端点 fan-in 恢复一个外层会话中的多条内层流，NJA-000346 按会话与片序跨外层事务重建单条内层命令流。三条分析都要求内外层关系和后继结果，并以批准的
          VPN、服务网格、开发隧道和运维路径作对照；单个外层长连接不足以报警。
        en: NJA-000344 joins a tunnel process's inner and outer sockets to service outcomes. NJA-000345 recovers several inner
          flows within one outer session using stream IDs or endpoint fan-in. NJA-000346 reconstructs one inner command flow
          across outer transactions by session and fragment order. Each analytic requires an inner-to-outer relationship and
          successor outcome and compares it with approved VPN, service-mesh, development-tunnel, and administration paths.
          One long outer connection is insufficient.
  B5-T1573-DET-KEY-RECOVERY:
    summary:
      zh: 连接攻击者附加密码层、密钥生命周期、接收端明文和命令结果。
      en: Join attacker-added cryptography, key lifetime, receiver plaintext, and command outcomes.
    description:
      paragraphs:
      - zh: NJA-000347 从样本配置恢复跨会话可复用秘密并对历史密文做经校验的解密；NJA-000348 在授权端点捕获会话或消息范围的握手、密钥句柄与解密结果。两者分别输出可回溯与短时恢复范围，均要求承载协议外的密码层和实际
          C2 命令；熵值或普通 TLS 不触发结论。
        en: NJA-000347 recovers a reusable secret from sample configuration and validates decryption of historical ciphertext,
          while NJA-000348 captures handshake, key-handle, and decryption outcomes for session- or message-scoped secrets
          on an authorized endpoint. They report retrospective and transient recovery scope separately. Both require a cryptographic
          layer beyond the carrier and an actual C2 command; entropy or ordinary TLS is not dispositive.
  B5-T1573-DET-NESTED:
    summary:
      zh: 发现外层 TLS 已解开但内层命令仍需独立密钥恢复的检查边界。
      en: Identify a boundary where outer TLS is decrypted but inner commands still require independent key recovery.
    description:
      paragraphs:
      - zh: NJA-000349 分别记录外层 TLS 解密状态和内层封套状态，将解密后的 body、封装密钥、端点 crypto context 与命令结果按消息关联。策略针对把“TLS 可见”误当作“内容可检查”的盲区；合法端到端加密业务必须由应用目录、密钥所有者和授权观察范围排除。
        en: NJA-000349 records outer TLS decryption state separately from inner-envelope state and joins decrypted bodies,
          wrapped keys, endpoint cryptographic context, and command outcomes by message. The strategy addresses the blind
          spot created by assuming that visible TLS content is necessarily inspectable; legitimate end-to-end encrypted business
          applications require exclusion through application inventory, key owner, and authorized observation scope.
  B5-T1659-DET-C2-INJECTION:
    summary:
      zh: 比较目标、源站和独立视点的响应谱系，并把差异连接到已受控主机的任务与结果循环。
      en: Compare target, origin, and independent-vantage response lineage and join differences to task-and-result cycles
        on an already compromised host.
    description:
      paragraphs:
      - zh: NJA-000350 保存同一请求在目标、独立出口和真实源站的内容摘要、路由及接收结果，再关联植入体反复读取命令、写回输出和加载插件的周期。策略把“响应来自受控路径”与“该响应维持 C2”分成两个证据门，避免浏览器入口检测直接冒充持续通信覆盖；竞速伪造回复的
          C2 用途仍需独立事件证据。
        en: NJA-000350 retains content digests, routes, and receipt outcomes for the same request at the target, independent
          egress, and true origin, then joins cycles of implant command reads, output writes, and plug-in loads. The strategy
          separates evidence that a response came from a controlled path from evidence that it sustained C2. Browser-entry
          detection does not itself cover continuing communication, and C2 use of racing forged replies still needs independent
          incident evidence.
  B5-T1665-DET-VICTIM-EXPOSURE-DIFFERENTIAL:
    summary:
      zh: 以同请求跨观察者和同来源跨请求变体的对照，确认 C2 前端选择性暴露及受害端结果。
      en: Use same-request cross-observer and same-source request-variant comparisons to confirm selective C2-front exposure
        and victim outcomes.
    description:
      paragraphs:
      - zh: NJA-000351 把正向请求资格和负向防守来源抑制设为两条实验分支：前者固定来源、逐字段变更请求并关联 edge-to-origin；后者固定请求、变更安全与中性观察来源并审计 deny 规则。两条分支都要求恶意 C2
          tenant/origin 与受害端命令结果，且主动测量仅在授权范围进行；时窗暴露只保留长期监测候选。
        en: NJA-000351 uses two experiment branches. Positive request qualification holds the source constant, varies one
          request field, and joins edge to origin. Negative defender-source suppression holds the request constant, varies
          security and neutral vantages, and audits deny rules. Both branches require a malicious C2 tenant or origin and
          victim command outcome, with active measurement restricted to authorized scope. Temporal exposure remains a long-horizon
          candidate.
analytics:
  B5-T1571-NJA-SEMANTIC-PORT-DIFFERENTIAL:
    summary:
      zh: 分级输出未登记端口、协议错配、误放行或解析偏移，并仅在后继 C2 成立时确认技术。
      en: Emit unregistered-port, semantic mismatch, mistaken allowance, and parser-displacement states, confirming the technique
        only with successor C2.
    window:
      zh: 会话至端点结果默认十五分钟，周期性信标或协议仿真回复扩展至二十四小时；策略版本必须覆盖事件发生时刻。
      en: Join sessions to endpoint outcomes within fifteen minutes by default and recurring beacons or protocol-emulation
        responses within twenty-four hours; the policy version must be valid at event time.
    observables:
    - zh: 内容解析器在环境预期不同服务的端口确认 HTTP SSH 或另一应用
      en: A payload-aware parser confirms HTTP, SSH, or another application on a port expected for a different service
    - zh: 443 或 53 的预期 TLS 或 DNS 解析失败而自定义双向会话继续
      en: The expected TLS or DNS parser fails on 443 or 53 while custom bidirectional traffic continues
    - zh: 端口规则放行但应用识别或独立解析器报告其他或未知协议
      en: A port rule allows a session while App-ID or an independent parser reports another or unknown application
    - zh: 同一端点进程维持错配流并产生命令结果或后继动作
      en: The same endpoint process maintains the mismatched flow and produces a command, result, or follow-on action
    false_positives:
    - zh: 已登记自定义服务与厂商管理端口
      en: Registered custom services and vendor management ports
    - zh: 开发测试 服务网格 端口共享与迁移例外
      en: Development tests, service meshes, port sharing, and migration exceptions
    - zh: STARTTLS 代理 TLS 终止与解析器误判
      en: STARTTLS, proxies, TLS termination, and parser misclassification
    blind_spots:
    - zh: 加密或未支持的专有协议及负载采样
      en: Encrypted or unsupported proprietary protocols and sampled payloads
    - zh: 短流 单向流 DPD 关闭或缺少解析签名
      en: Short or one-way flows, disabled DPD, or missing parser signatures
    - zh: NAT 代理遮蔽目标及缺少端点进程遥测
      en: NAT or proxy obscuring the destination and missing endpoint process telemetry
  B5-T1572-NJA-ENDPOINT:
    summary:
      zh: 连接隧道进程内外 socket、目标服务与后继登录结果，识别未批准端点解耦。
      en: Join a tunnel process's inner and outer sockets, target service, and successor login outcome to identify unapproved
        endpoint decoupling.
  B5-T1572-NJA-MULTIPLEX:
    summary:
      zh: 按流 ID 或端点 fan-in 恢复一个外层连接中的并发内层服务与结果。
      en: Recover concurrent inner services and outcomes in one outer connection through stream IDs or endpoint fan-in.
  B5-T1572-NJA-TRANSACTION:
    summary:
      zh: 按会话 方向与片序跨外层事务重建内层命令流，并核对端点结果。
      en: Reassemble an inner command stream across outer transactions by session, direction, and fragment order and verify
        endpoint outcomes.
  B5-T1573-NJA-REUSABLE-KEY:
    summary:
      zh: 从样本恢复稳定密钥路径，验证跨会话命令与结果明文并回溯同一密钥期。
      en: Recover a stable key path from a sample, validate commands and results across sessions, and revisit the same cryptoperiod.
    window:
      zh: 依据样本恢复的密钥配置有效期回溯流量；密文到端点结果关联默认十分钟或一个恶意任务周期。
      en: Revisit traffic across the key or configuration cryptoperiod recovered from a sample; join ciphertext to endpoint
        outcome within ten minutes or one malware task cycle.
    observables:
    - zh: 同一密钥派生路径跨多个 C2 会话使用
      en: The same key-derivation path is used across several C2 sessions
    - zh: 解密结果通过命令格式与完整性校验
      en: Decrypted content validates against command format and integrity checks
    - zh: 任务输出沿同一密钥路径重新加密
      en: Task output is encrypted through the same key path
    - zh: 端点动作与恢复的明文命令吻合
      en: Endpoint actions match the recovered plaintext command
    false_positives:
    - zh: 合法旧版代理或设备协议内嵌测试密钥
      en: Approved legacy agents or device protocols with embedded test keys
    - zh: 取证测试流量或应用意外复用秘密
      en: Forensic test traffic or accidental secret reuse in applications
    blind_spots:
    - zh: 每主机独立或轮换密钥及缺少原始密文
      en: Per-host or rotated keys and unavailable raw ciphertext
    - zh: 缺少 IV 方向或自定义填充完整性信息
      en: Missing IV, direction, or custom padding and integrity details
    - zh: 进程注入使样本家族与流量归属断裂
      en: Process injection breaking sample-family to flow attribution
  B5-T1573-NJA-RUNTIME-SECRET:
    summary:
      zh: 将短时密钥协商或封套、端点密码上下文与同一消息的控制结果相连。
      en: Join transient key agreement or envelopes, endpoint cryptographic context, and control outcomes for the same message.
    window:
      zh: 覆盖准确会话或消息生命周期，从密钥创建至销毁捕获内存和 API 状态，并延伸一个任务周期。
      en: Cover the exact session or message lifetime, capturing memory and API state from key creation to destruction and
        extending one task cycle.
    observables:
    - zh: 非承载协议的多步密钥协商
      en: A custom multistep key agreement outside the carrier protocol
    - zh: 每消息独立封装的秘密
      en: A separately wrapped secret for each message
    - zh: 密码上下文与 C2 流量标识关联
      en: Cryptographic context bound to a C2 flow identifier
    - zh: 恢复的明文与端点命令结果一致
      en: Recovered plaintext agrees with endpoint command outcomes
    false_positives:
    - zh: 合法端到端加密或企业自定义协议
      en: Legitimate end-to-end encryption or a custom enterprise protocol
    - zh: TLS SSH IPsec QUIC 的原生密钥流程及批准备份代理
      en: Native TLS, SSH, IPsec, or QUIC key schedules and approved backup agents
    blind_spots:
    - zh: 无端点插桩或密钥销毁早于采集
      en: No endpoint instrumentation or key erasure before capture
    - zh: 内核或硬件密码卸载及控制端独占私钥
      en: Kernel or hardware cryptographic offload and controller-only private keys
    - zh: 进程注入或异步 API 使密钥句柄映射断裂
      en: Process injection or asynchronous APIs breaking key-handle mapping
  B5-T1573-NJA-NESTED:
    summary:
      zh: 区分外层 TLS 解密与内层消息恢复，并验证内层命令对端点动作的影响。
      en: Separate outer TLS decryption from inner-message recovery and verify that inner commands drive endpoint actions.
    window:
      zh: 覆盖一条 TLS 会话及其内层任务周期；明文和密钥引用仅按获批事件政策短期保留。
      en: Cover one TLS session and its inner task cycles; retain plaintext and key references only for the period allowed
        by incident policy.
    observables:
    - zh: 外层解密成功后 body 仍为独立密文封套
      en: Outer decryption succeeds but the body remains an independently encrypted envelope
    - zh: 内层封套结构在消息之间稳定出现
      en: A stable inner-envelope layout recurs across messages
    - zh: 恢复内层密钥需要与 TLS 不同的材料
      en: Inner-key recovery requires material distinct from TLS secrets
    - zh: 内层解密命令与端点动作连接
      en: An inner decrypted command joins to an endpoint outcome
    false_positives:
    - zh: 合法端到端通信与客户端加密存储
      en: Legitimate end-to-end messaging and client-side encrypted storage
    - zh: 金融 医疗封套及企业代理应用层密码
      en: Financial or healthcare envelopes and enterprise-agent application cryptography
    blind_spots:
    - zh: 无法合法取得外层解密或 ECH 及代理缺口
      en: No authorized outer decryption, ECH, or a proxy visibility gap
    - zh: 内层填充分片及控制端私钥不可得
      en: Inner padding or fragmentation and unavailable controller private key
    - zh: 端点使用硬件密码模块而无明文观察
      en: Endpoint hardware cryptography without plaintext observation
  B5-T1665-NJA-VICTIM-EXPOSURE-DIFFERENTIAL:
    summary:
      zh: 对请求资格与防守来源抑制分别做配对差分，并以受害端 C2 结果和前端规则确认。
      en: Run paired differentials for request qualification and defensive-source suppression, confirming them with victim
        C2 outcomes and front rules.
    window:
      zh: 配对请求与观察者对照默认十五分钟，受害端结果关联二十四小时；时窗候选观察七至三十日，策略版本须覆盖事件时刻。
      en: Match request and vantage comparisons within fifteen minutes and victim outcomes within twenty-four hours; observe
        temporal candidates for seven to thirty days, with policy versions valid at event time.
    observables:
    - zh: 已证实恶意进程成功连接的端点对普通安全探针只返回 404 重定向或关闭
      en: A confirmed malicious process succeeds to an endpoint that gives generic safe probes only a 404, redirect, reset,
        timeout, or closed service
    - zh: 植入体一致请求到达源站而普通变体停在前端
      en: An implant-congruent request reaches the origin while a generic variant stops at the edge
    - zh: 相同请求从安全扫描来源被阻断而中性来源可达源站
      en: The same request is blocked from a security-scanner source while a neutral source reaches the origin
    - zh: 前端规则明确匹配安全来源或植入体字段并选择拒绝诱饵或上游路由
      en: A front rule matches security sources or implant fields and selects deny, decoy, or upstream routing
    - zh: 监听器只在受害端 C2 活动时段重复可用
      en: The listener is repeatedly available only during victim C2 activity windows
    false_positives:
    - zh: 合法反爬 抗滥用 DDoS 扫描拦截与速率限制
      en: Legitimate anti-bot, abuse, DDoS, scan blocking, and rate controls
    - zh: 地域合规 mTLS 私有 API 和租户授权门
      en: Geographic controls, mTLS, private APIs, and tenant authorization gates
    - zh: CDN 缓存 灰度发布 灾备和批准诱捕平台
      en: CDN caching, staged releases, disaster recovery, and approved deception platforms
    blind_spots:
    - zh: 无受害端进程链或无法独立证实端点用于 C2
      en: No victim process lineage or independent evidence that the endpoint is C2
    - zh: 一次性令牌 加密协议或隐私约束阻止安全复现
      en: One-time tokens, encrypted protocols, or privacy limits preventing safe reproduction
    - zh: 服务提供方日志缺失且攻击者识别所有可用探针视点
      en: Provider logs are unavailable and the actor recognizes every available probe vantage
    - zh: Anycast GeoDNS 缓存和短时监听造成不可配对观察
      en: Anycast, GeoDNS, caching, and brief listeners prevent matched observations
  B5-T1659-NJA-C2-INJECTION:
    summary:
      zh: 把同一请求的源站与目标响应差连接到已受控主机多轮命令读取和结果写回。
      en: Join origin-to-target response differences for the same request to repeated command reads and result writes on an
        already compromised host.
