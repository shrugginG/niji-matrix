schema_version: "1.0.0"
type: batch-admission-and-taxonomy-review
batch_ref: BATCH-TA0040-001
reviewed: "2026-09-22"
baseline: {domain: enterprise-attack, version: "19.1"}
decisions:
  - candidate: T1485
    decision: adapt
    confidence: medium
    rationale_zh: 数据销毁的影响结果本身不证明匿迹；保留删除或覆写导致业务数据不可用的父行为，仅在能证明破坏决策与可见执行被有意分离时进入 Niji 正式匿迹范围。生命周期规则路径具有控制面写入与后续服务主体删除的独立证据，但缺少完整受害者事件链，不能建立具体子项 CASE。
    rationale_en: Destructive impact alone does not establish stealth. Retain the parent behavior of deletion or overwrite denying use of business data, and admit it to Niji only where a deliberate split between destructive decision and visible execution is supported. The lifecycle-rule pathway has independent evidence for a control-plane write and later service-principal deletion, but lacks a complete victim incident chain, so no child CASE is asserted.
    attack_child_count: 1
    attack_child_coverage:
      - attack_id: T1485.001
        resolution: niji-variable-candidate
        reason_zh: 该项提供生命周期规则实例；正式变量是操作者到服务执行者的主体、时点和遥测分离，不继承 ATT&CK 名称或平台分割。
        reason_en: This child supplies the lifecycle-rule example; the formal variable is separation of operator and service executor across principal, time, and telemetry, not the ATT&CK label or platform partition.
    niji_axes:
      - {key: delegated-execution, result: formal, evidence: "AWS lifecycle implementation plus Palo Alto attack-path analysis; no victim case", child_count: 1}
      - {key: namespace-preserving-overwrite, result: evidence-deferred, evidence: "destructive behavior documented, stealth observation contrast insufficient"}
      - {key: slow-distributed-destruction, result: evidence-deferred, evidence: "no conclusion-level deliberate threshold-evasion source"}
      - {key: selective-preservation, result: adjacent-technique, evidence: "NJT-0117 owns processed-versus-preserved targets"}
      - {key: guest-execution, result: adjacent-technique, evidence: "NJS-0111-004 owns observation-domain boundary"}
      - {key: disk-structure-wipe, result: adjacent-technique, evidence: "T1561 directly owns disk and boot structure erasure"}
    proposed_niji_children: 1
    second_pass_required: false
  - candidate: T1486
    decision: adapt
    confidence: high
    rationale_zh: 加密造成业务数据不可读符合影响释放，但勒索结果和密钥不可得不自动形成匿迹。正式父级只接纳有证据证明攻击者改变文件内部改写布局，或把重加密执行转移到掌握客户密钥的存储服务，从而改变内容、写入或端点观察的变体。
    rationale_en: Encryption that denies business reading is Impact, but the ransom outcome and missing key alone do not establish stealth. The formal parent admits evidenced variants in which the adversary changes in-file rewrite layout or moves re-encryption into a storage service under an adversary-held customer key, changing content, write, or endpoint observation.
    attack_child_count: 0
    attack_child_coverage: []
    niji_axes:
      - {key: sparse-in-file-coverage, result: formal, evidence: "SentinelOne Labs observed regional encryption and lower I/O or whole-file detection signal"}
      - {key: customer-key-service-execution, result: formal, evidence: "AWS CIRT observed malicious SSE-C CopyObject overwrites; current bucket SSE-C permission must be checked"}
      - {key: cadence-dilution, result: evidence-deferred, evidence: "no specific supported intentional schedule and defender-window contrast"}
      - {key: remote-unmanaged-encryption, result: evidence-deferred, evidence: "sensor-location contrast and sibling boundary under-evidenced"}
      - {key: selective-preservation, result: adjacent-technique, evidence: "NJT-0117 owns exclusion decisions"}
      - {key: guest-execution, result: adjacent-technique, evidence: "NJS-0111-004 owns host/guest sensor split"}
      - {key: algorithm-or-family, result: not-stealth-distinct, evidence: "cipher and malware names do not independently change defender observation"}
      - {key: recovery-suppression, result: adjacent-technique, evidence: "T1490 owns backup or snapshot recovery interference"}
    proposed_niji_children: 2
    second_pass_required: false
cross_candidate_boundaries:
  - {owner: T1485, boundary: "Deletion or overwrite removes useful data; a key change with surviving ciphertext belongs to T1486"}
  - {owner: T1486, boundary: "Ciphertext remains present but legitimate key custody and reading fail; deletion of originals can separately belong to T1485"}
  - {owner: T1561, boundary: "Disk sector or boot-structure wiping remains outside the T1485 file/object owner"}
  - {owner: T1490, boundary: "Recovery-copy or snapshot suppression remains distinct from the current data impact"}
