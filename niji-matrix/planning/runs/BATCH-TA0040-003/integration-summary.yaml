review_notes_zh: 本批完成五项 adapt 准入与十项原生 NJS，所有 ATT&CK 子项只作为 planning 广度参考。新增网络/端点 DoS、生命周期、身份锁定和块层擦除的目标化防御，并按语义身份扩充既有调度、身份状态、raw-storage
  与恢复控制对象。共享库查重、ID 同步、make quality、五个 Bundle 和完整 Web/API 测试通过。正式对象保持 review，等待人工领域评审；TA0040 尚余三个固定候选。
review_notes_en: The batch completes five adapt admissions and ten native NJS; all ATT&CK children remain planning
  breadth only. It adds target-specific defense for network and endpoint DoS, lifecycle, identity lockout, and block-layer
  wiping and extends existing scheduler, identity-state, raw-storage, and recovery controls by semantic identity.
  Shared-library deduplication, ID sync, make quality, five bundles, and the complete Web/API suite pass. Formal objects
  remain in review pending human domain review; three fixed TA0040 candidates remain.
