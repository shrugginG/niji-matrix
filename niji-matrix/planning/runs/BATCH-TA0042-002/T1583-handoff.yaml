candidate:
  source_type: attack
  source_attack_id: T1583
  name:
    zh: 获取基础设施
    en: Acquire Infrastructure
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: 普通基础设施采购不自动构成匿迹；将候选收窄为共享信任表面、预用生命周期或预置替换关系等明确设计后，取得阶段具有稳定痕迹与防御边界。
        en: Ordinary infrastructure procurement is not automatically stealth; after narrowing the candidate to explicit designs such as shared trust surfaces, pre-use lifecycle, or prepositioned replacement relationships, acquisition has stable traces and defensive boundaries.
proposed_content:
  summary:
    zh: 以非攻陷方式取得具有明确匿迹设计的行动基础设施，并改变资源外层、取得到启用时间或替换谱系。
    en: Obtain operational infrastructure without compromise and with an explicit stealth design that changes resource surfaces, acquisition-to-activation timing, or replacement lineage.
  definition_and_concept:
    paragraphs:
      - zh: 技术止于资源取得与预置，不包含攻陷第三方资源、账户培育、能力上传或后续恶意使用。
        en: The technique ends at resource acquisition and prepositioning and excludes compromise of third-party resources, account cultivation, capability upload, and downstream malicious use.
  stealth_characteristics:
    paragraphs:
      - zh: 共享供应商外层、长期年龄和多资源轮换会削弱粗粒度信誉、域龄和单点 IOC，但注册、租户、证书、DNS、托管与对象历史仍可恢复谱系。
        en: Shared provider surfaces, long age, and multi-resource rotation weaken coarse reputation, domain age, and point IOCs, while registration, tenant, certificate, DNS, hosting, and object history can still recover lineage.
  scope_boundary_definition:
    paragraphs:
      - zh: 资源类型和供应商不定义子技术，只有稳定匿迹变量及其痕迹和防御差异能够准入。
        en: Resource type and provider do not define children; only stable stealth variables with distinct traces and defenses qualify.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者在后续托管、重定向、代理、投放或通信前取得并准备共享、老化或可替换的基础设施。
          en: Adversaries acquire and prepare shared, aged, or replaceable infrastructure before later hosting, redirection, proxying, staging, or communication.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要资源取得与生命周期控制能力，并承担租户治理、长期持有或多资源协调成本。
            en: The adversary needs resource-acquisition and lifecycle control and bears tenant-governance, long-term holding, or multi-resource coordination costs.
      defender_model:
        paragraphs:
          - zh: 防守方需要结合提供方控制平面与长期 DNS、证书、托管、对象和目标关系，不能把供应商或年龄作为结论。
            en: Defenders need provider control-plane plus long-term DNS, certificate, hosting, object, and target relationships and cannot treat provider or age as a verdict.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 借用共享服务或长期资源外层，使行动资源接近正常租户和长期资产
        en: Borrow shared-service or long-lived outer features so operational resources resemble normal tenants and established assets
      analysis:
        paragraphs:
          - zh: 合法外层或年龄特征替代专用新资源外观，粗粒度分类难以区分具体恶意对象，但租户与启用行为仍可见。
            en: Legitimate outer or age features replace the appearance of a dedicated new resource, weakening coarse classification while tenant and activation behavior remains visible.
      evidence_keys: [REF-000059, REF-000071]
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 分离注册与启用并把行动分散到预置替补资源
        en: Separate registration from activation and distribute operations across prepositioned replacements
      analysis:
        paragraphs:
          - zh: 长期休眠和依次启用让短窗口与单点指标只看到资源谱系片段，防守需要跨时间和供应商关联。
            en: Long dormancy and sequential activation leave short windows and point indicators with only fragments of resource lineage, requiring cross-time and cross-provider correlation.
      evidence_keys: [REF-000071, REF-000072]
      confidence: high
proposed_subtechniques:
  - canonical_ref: NJS-0051-001
    name: {zh: 合法多租户信任表面取得, en: Legitimate Multi-Tenant Trust-Surface Acquisition}
    stable_variable: sharing of outer provider trust features
    evidence_refs: [REF-000059]
    confidence: high
  - canonical_ref: NJS-0051-002
    name: {zh: 预用休眠与信誉老化, en: Pre-Use Dormancy and Reputation Aging}
    stable_variable: deliberate low-activity time from acquisition to activation
    evidence_refs: [REF-000071]
    confidence: high
  - canonical_ref: NJS-0051-003
    name: {zh: 预置可替换资源池, en: Prepositioned Replacement Resource Pool}
    stable_variable: replacement relationships among multiple pre-acquired resources
    evidence_refs: [REF-000059, REF-000072]
    confidence: high
