research:
  limitations:
    paragraphs:
      - zh: 多租户使用本身不能证明匿迹意图，域名老化证据不能自动推广到所有资源，正常业务也会使用长期闲置和多资源高可用。
        en: Multi-tenant use alone does not prove stealth intent, domain-aging evidence cannot automatically generalize to all resources, and normal business also uses long-idle and multi-resource high availability.
  rejected_mechanisms:
    - mechanism_ref: NM-BT
      reason: Provider and lifecycle telemetry remain available; the primary effects are distinguishability and correlation rather than complete observation absence.
    - mechanism_ref: NM-DO
      reason: The candidate does not change inherent inspectability of captured data.
  open_questions:
    - Registration and billing identity compartmentation remains deferred.
