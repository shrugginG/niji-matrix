batch_ref: BATCH-TA0042-002
work_item_ref: WORK-TA0042-T1584
temporary_key_prefix: B42V2-T1584
candidate:
  source_type: attack
  source_attack_id: T1584
  name:
    zh: 攻陷基础设施
    en: Compromise Infrastructure
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 被攻陷基础设施可继承真实所有者的域、网络归属、信誉和正常功能，使实际操作者与可见资产所有者分离，并把恶意代理或托管叠加到合法流量中，具有独立匿迹链。
      en: Compromised infrastructure can inherit a real owner's domain, network attribution, reputation, and normal function, separating the actual operator from the visible asset owner
        and overlaying malicious proxying or hosting on legitimate traffic, which forms an independent stealth chain.
proposed_content:
  summary:
    zh: 接管第三方域名、服务器、云服务、网络设备或其他基础设施，并继承其真实所有权、信誉和正常功能作为后续资源。
    en: Take over third-party domains, servers, cloud services, network devices, or other infrastructure and inherit their real ownership, reputation, and normal function as later resources.
  definition_and_concept:
    paragraphs:
    - zh: 接管第三方域名、服务器、云服务、网络设备或其他基础设施，并继承其真实所有权、信誉和正常功能作为后续资源。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
      en: Take over third-party domains, servers, cloud services, network devices, or other infrastructure and inherit their real ownership, reputation, and normal function as later
        resources. The direct objective is to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution,
        communication, or another downstream behavior; products, media, and tool names matter only when they carry a stable stealth variable.
  stealth_characteristics:
    paragraphs:
    - zh: 实际操作者与可见所有者分离，恶意代理或托管可寄生在合法服务和高信誉表面中。该对象仍会留下所有权与操作者不一致、正常资产出现异常代理/托管、配置完整性和流量模式变化等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
      en: The actual operator separates from the visible owner, and malicious proxying or hosting can parasitize legitimate services and high-reputation surfaces. The object still leaves
        traces such as ownership inconsistent with operator, normal assets gaining anomalous proxy or hosting, and configuration-integrity and traffic-pattern changes; those traces are
        generally more complete at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon lineage can limit the
        stealth effect.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入接管第三方基础设施作为行动资源、保留正常功能并叠加恶意功能、继承域/证书/网络信誉。它排除非攻陷取得的租赁资源、账户本身作为主要对象、具体入侵步骤、后续代理/C2/投放，并与以下相邻对象明确区分：NJT-0051 通过合法取得而非攻陷获得资源、NJT-0043 的主要对象是服务账户。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
      en: This technique includes taking over third-party infrastructure as an operational resource, preserving normal function while overlaying malicious function, and inheriting domain/certificate/network
        reputation. It excludes leased resources acquired without compromise, accounts as the primary object, concrete compromise steps, and downstream proxy/C2/staging and is distinguished
        because NJT-0051 obtains resources legitimately rather than through compromise and NJT-0043 has a service account as the primary object. Legitimate business, testing, compatibility,
        or administration remains a normal lookalike when no adversary-controlled stealth variable is present, and resource class or one anomaly alone cannot qualify the behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 本技术适用于攻击者在域名/DNS/服务器/云服务、Web 与无服务器平台、SOHO/边缘网络设备中准备高信誉域和服务、住宅/企业网络出口、具有现有用户流量的基础设施，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
        en: This technique applies when adversaries prepare high-reputation domains and services, residential or enterprise egress, and infrastructure with existing user traffic in domains/DNS/servers/cloud
          services, web and serverless platforms, and SOHO and edge network devices and want those resources to have lower distinguishability or higher attribution cost before first
          high-risk use. Downstream results may establish preparation effects but do not expand this technique boundary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须满足以下前提：第三方基础设施已被接管、其信誉或正常功能仍可维持。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
          en: 'The adversary must satisfy the following prerequisites: third-party infrastructure has been compromised and its reputation or normal function can remain. The operator
            must also control timing, configuration, relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination, build
            administration, or third-party enforcement; loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
      defender_model:
        paragraphs:
        - zh: 防守方可能观察到所有权与操作者不一致、正常资产出现异常代理/托管、配置完整性和流量模式变化，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
          en: Defenders may observe ownership inconsistent with operator, normal assets gaining anomalous proxy or hosting, and configuration-integrity and traffic-pattern changes, but
            fields and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry
            and maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 真实所有者的域、证书、网络归属和正常服务让恶意资源呈现为既有合法基础设施
      en: A real owner's domain, certificate, network attribution, and normal service make the malicious resource appear as existing legitimate infrastructure
    analysis:
      paragraphs:
      - zh: 真实所有者的域、证书、网络归属和正常服务让恶意资源呈现为既有合法基础设施。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
        en: A real owner's domain, certificate, network attribution, and normal service make the malicious resource appear as existing legitimate infrastructure. The design substitutes
          normal or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing
          a Feature Disguise effect.
    evidence_refs:
    - REF-000061
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 低扰动寄生把恶意功能叠加到正常资产，所有者缺少完整性或服务级监控时可能不触发告警
      en: Low-disruption parasitism overlays malicious function on a normal asset and may avoid alerts where the owner lacks integrity or service-level monitoring
    analysis:
      paragraphs:
      - zh: 低扰动寄生把恶意功能叠加到正常资产，所有者缺少完整性或服务级监控时可能不触发告警。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
        en: Low-disruption parasitism overlays malicious function on a normal asset and may avoid alerts where the owner lacks integrity or service-level monitoring. The design makes
          critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis conditions
          can still recover the difference, producing a Behavioral Transparency effect.
    evidence_refs:
    - REF-000061
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 大规模被攻陷边缘出口池把来源分散到短寿节点，提高跨节点行动重构成本
      en: Large compromised-edge egress pools distribute origin across short-lived nodes and raise cross-node operation reconstruction cost
    analysis:
      paragraphs:
      - zh: 大规模被攻陷边缘出口池把来源分散到短寿节点，提高跨节点行动重构成本。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
        en: Large compromised-edge egress pools distribute origin across short-lived nodes and raise cross-node operation reconstruction cost. The design distributes traces of one operation
          across temporal or spatial units so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal Trace
          Dilution effect.
    evidence_refs:
    - REF-000073
    - REF-000074
    - REF-000075
    confidence: high
