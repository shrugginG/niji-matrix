research:
  limitations:
    paragraphs:
    - zh: 现有证据直接支持候选行为和至少一个稳定匿迹变量，但对攻击者在每个实例中的主观目的、所有平台的同等效果以及提供方内部可见性并不完整。非攻陷取得的租赁资源、账户本身作为主要对象、具体入侵步骤、后续代理/C2/投放也可能产生部分相似痕迹，因此结论必须保持在来源直接证明的行为、痕迹变化和观察模型内；新增子技术需要独立证据和防御差异。
      en: Current evidence directly supports the candidate behavior and at least one stable stealth variable, but does not fully establish adversary intent in every instance, equal effect
        across platforms, or provider-internal visibility. leased resources acquired without compromise, accounts as the primary object, concrete compromise steps, and downstream proxy/C2/staging
        can also create some similar traces, so conclusions must remain within behavior, trace change, and observation models directly supported by sources; any additional child requires
        independent evidence and defensive distinction.
  rejected_mechanisms: []
  open_questions: []
