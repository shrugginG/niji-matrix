handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0042-002
work_item_ref: WORK-TA0042-T1586
temporary_key_prefix: B42V2-T1586
candidate:
  source_type: attack
  source_attack_id: T1586
  name:
    zh: 攻陷账户
    en: Compromise Accounts
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 被接管账户继承真实身份、域、年龄、权限、关系与历史并降低后续异常度，同时提供方和原租户仍能观察准备痕迹，因此 T1586 具有独立资源和防御边界。
        en: Taken-over accounts inherit authentic identity, domain, age, privilege, relationships, and history and reduce later anomaly while providers and original tenants still observe preparation traces, giving T1586 independent resource and defensive boundaries.
proposed_content:
  summary:
    zh: 将被接管真实账户准备为后续资源，并利用既有身份与关系历史降低实体和业务情境异常。
    en: Prepare a taken-over genuine account as a later resource and use established identity and relationship history to reduce entity and business-context anomaly.
  definition_and_concept:
    paragraphs:
      - zh: 技术覆盖接管完成后到首次对外用途前的可用性、权限、关系和历史准备，不包含接管步骤或下游发送与登录。
        en: The technique covers usability, privilege, relationship, and history preparation after takeover and before first outward use, excluding takeover steps and downstream sending or logon.
  stealth_characteristics:
    paragraphs:
      - zh: 外部目标看到真实域和既有关系，提供方与原租户则可见异常会话、令牌、设备、设置和对象级历史访问。
        en: External targets see an authentic domain and established relationships, while providers and original tenants may see anomalous sessions, tokens, devices, settings, and object-level history access.
  scope_boundary_definition:
    paragraphs:
      - zh: 不按邮件、社交、云或协作产品拆分；唯一子技术要求实际检索真实历史并在首次对外行动前选择关系情境。
        en: The taxonomy does not partition by mail, social, cloud, or collaboration product; the sole child requires actual retrieval of genuine history and relationship-context selection before first outward action.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者在被接管企业邮箱或协作账户内检索付款、联系人、附件和业务线程，为后续 BEC、投递或冒充选择真实情境。
          en: Adversaries search payment, contact, attachment, and business-thread history inside taken-over enterprise mail or collaboration accounts to select authentic context for later BEC, delivery, or impersonation.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要已控制可用账户、访问历史对象并理解业务语境，同时规避会话和对象级审计。
            en: The adversary needs control of a usable account, access to historical objects, and business-context understanding while avoiding session and object-level audit.
      defender_model:
        paragraphs:
          - zh: 防守方需要把身份会话、令牌设备、账户完整性、内容访问和首次用途关联；外部目标通常缺少这些内部记录。
            en: Defenders need correlation across identity sessions, token-device state, account integrity, content access, and first use; external targets usually lack those internal records.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 继承真实账户特征并从历史中选择可信关系情境
        en: Inherit authentic account features and select trusted relationship context from genuine history
      analysis:
        paragraphs:
          - zh: 真实账户及其历史替代新建身份和编造语境，使外部交互接近既有合法活动，但内部会话和对象访问仍能暴露控制者变化。
            en: A genuine account and its history replace a new identity and fabricated context, making external interaction resemble established legitimate activity while internal session and object access can still expose operator change.
      evidence_keys: [REF-000060, REF-000067, REF-000068]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 将准备活动留在提供方与原租户内部，使外部目标只看到最终真实账户交互
        en: Keep preparation inside the provider and original tenant so external targets see only the final authentic-account interaction
      analysis:
        paragraphs:
          - zh: 历史检索与账户准备不出现在外部目标时间线，跨租户审计缺失时目标无法解释准确情境来源。
            en: History access and account preparation do not appear in the external target timeline, preventing explanation of accurate context when cross-tenant audit is unavailable.
      evidence_keys: [REF-000067, REF-000068]
      confidence: high
proposed_subtechniques:
  - canonical_ref: NJS-0043-001
    name: {zh: 账户历史导向的关系情境选择, en: Account-History-Guided Relationship Context Selection}
    stable_variable: pre-action retrieval and selection of genuine historical relationships
    evidence_refs: [REF-000067, REF-000068]
    confidence: high
