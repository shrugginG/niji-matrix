research:
  limitations:
    paragraphs:
      - zh: 邮件案例支持最强，其他账户类型的准备阶段证据较弱；Proofpoint 案例证明真实线程利用，但未公开完整历史搜索日志。
        en: Evidence is strongest for mail accounts and weaker for preparation in other account types; the Proofpoint case establishes use of genuine threads but does not publish complete history-search audit.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason: No independent time or multi-source variable beyond ordinary parent preparation is supported.
    - mechanism_ref: NM-DO
      reason: Historical context changes visible features rather than inherent data inspectability.
  open_questions: []
