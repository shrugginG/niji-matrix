candidate:
  source_type: attack
  source_attack_id: T1587
  name:
    zh: 开发能力
    en: Develop Capabilities
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 普通能力自研只是资源准备；当攻击者在需求和构建阶段把分析环境、工具或目标配置条件写入能力，减少分析环境中的高信号行为时，研发阶段本身具有独立痕迹和防守边界，故适配保留。
      en: Ordinary in-house development is merely resource preparation; when adversaries encode analysis-environment, tool, or target-configuration conditions during requirements and
        build stages to reduce high-signal behavior in analysis environments, development has independent traces and a defensive boundary and is retained as adapted.
proposed_content:
  summary:
    zh: 在攻击者内部或受其需求控制的研发中，把观测规避属性写入恶意软件、利用、协议或其他能力。
    en: Encode observation-evasion properties into malware, exploits, protocols, or other capability during in-house or requirements-controlled development.
  definition_and_concept:
    paragraphs:
    - zh: 在攻击者内部或受其需求控制的研发中，把观测规避属性写入恶意软件、利用、协议或其他能力。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
      en: Encode observation-evasion properties into malware, exploits, protocols, or other capability during in-house or requirements-controlled development. The direct objective is
        to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution, communication, or another downstream
        behavior; products, media, and tool names matter only when they carry a stable stealth variable.
  stealth_characteristics:
    paragraphs:
    - zh: 分析环境或目标条件门控可减少非目标环境中的高信号行为与有效样本，降低自动分析覆盖。该对象仍会留下环境间激活差异、条件检查代码、非目标环境空白或缩减行为、构建与样本谱系等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
      en: Analysis-environment or target-condition gating can reduce high-signal behavior and effective samples outside intended targets, lowering automated-analysis coverage. The object
        still leaves traces such as activation differences across environments, condition-checking code, blank or reduced behavior outside targets, and build and sample lineage; those
        traces are generally more complete at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon lineage can
        limit the stealth effect.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入研发需求与构建阶段的匿迹设计、嵌入环境/工具/目标条件门控。它排除普通功能开发、外部取得能力、内容生成、能力部署、运行时规避动作本身，并与以下相邻对象明确区分：NJT-0048 从外部取得能力、NJT-0049 处理部署状态转换。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
      en: This technique includes stealth design during requirements and build stages and encoding environment/tool/target-condition gating. It excludes ordinary functional development,
        external capability acquisition, content generation, capability staging, and runtime evasion action itself and is distinguished because NJT-0048 obtains capability externally
        and NJT-0049 handles deployment-state transition. Legitimate business, testing, compatibility, or administration remains a normal lookalike when no adversary-controlled stealth
        variable is present, and resource class or one anomaly alone cannot qualify the behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 本技术适用于攻击者在恶意软件/利用开发、CI/CD 与构建系统、测试和沙箱环境中准备自动沙箱、分析工具和非目标系统、基于静态 IOC 的检测，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
        en: This technique applies when adversaries prepare automated sandboxes, analysis tools, non-target systems, and static-IOC-based detection in malware/exploit development, CI/CD
          and build systems, and testing and sandbox environments and want those resources to have lower distinguishability or higher attribution cost before first high-risk use. Downstream
          results may establish preparation effects but do not expand this technique boundary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须满足以下前提：攻击者控制需求或构建过程、可识别分析/目标环境条件。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
          en: 'The adversary must satisfy the following prerequisites: the adversary controls requirements or build and analysis or target-environment conditions can be identified. The
            operator must also control timing, configuration, relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination,
            build administration, or third-party enforcement; loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
      defender_model:
        paragraphs:
        - zh: 防守方可能观察到环境间激活差异、条件检查代码、非目标环境空白或缩减行为、构建与样本谱系，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
          en: Defenders may observe activation differences across environments, condition-checking code, blank or reduced behavior outside targets, and build and sample lineage, but
            fields and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry
            and maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 研发时嵌入条件门控，使能力在分析或非目标环境不触发关键行为，落在既有自动观测逻辑之外
      en: Development-time conditional gating prevents critical behavior in analysis or non-target environments, placing it outside existing automated observation logic
    analysis:
      paragraphs:
      - zh: 研发时嵌入条件门控，使能力在分析或非目标环境不触发关键行为，落在既有自动观测逻辑之外。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
        en: Development-time conditional gating prevents critical behavior in analysis or non-target environments, placing it outside existing automated observation logic. The design
          makes critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis
          conditions can still recover the difference, producing a Behavioral Transparency effect.
    evidence_refs:
    - REF-000014
    - REF-000062
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 构建多样化重塑每个产物的哈希、配置和调试特征，缩短固定静态 IOC 覆盖
      en: Build diversification reshapes hash, configuration, and debug features per artifact, shortening fixed static-IOC coverage
    analysis:
      paragraphs:
      - zh: 构建多样化重塑每个产物的哈希、配置和调试特征，缩短固定静态 IOC 覆盖。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
        en: Build diversification reshapes hash, configuration, and debug features per artifact, shortening fixed static-IOC coverage. The design substitutes normal or trusted features
          for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.
    evidence_refs:
    - REF-000062
    - REF-000076
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 同一代码族分散到多个目标化构建，增加跨样本谱系恢复要求
      en: One code family disperses across target-specific builds, increasing cross-sample lineage requirements
    analysis:
      paragraphs:
      - zh: 同一代码族分散到多个目标化构建，增加跨样本谱系恢复要求。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
        en: One code family disperses across target-specific builds, increasing cross-sample lineage requirements. The design distributes traces of one operation across temporal or spatial
          units so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal Trace Dilution effect.
    evidence_refs:
    - REF-000076
    confidence: medium
