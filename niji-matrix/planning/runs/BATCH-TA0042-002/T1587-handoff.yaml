research:
  limitations:
    paragraphs:
    - zh: 现有证据直接支持候选行为和至少一个稳定匿迹变量，但对攻击者在每个实例中的主观目的、所有平台的同等效果以及提供方内部可见性并不完整。普通功能开发、外部取得能力、内容生成、能力部署、运行时规避动作本身也可能产生部分相似痕迹，因此结论必须保持在来源直接证明的行为、痕迹变化和观察模型内；新增子技术需要独立证据和防御差异。
      en: Current evidence directly supports the candidate behavior and at least one stable stealth variable, but does not fully establish adversary intent in every instance, equal effect
        across platforms, or provider-internal visibility. ordinary functional development, external capability acquisition, content generation, capability staging, and runtime evasion
        action itself can also create some similar traces, so conclusions must remain within behavior, trace change, and observation models directly supported by sources; any additional
        child requires independent evidence and defensive distinction.
  rejected_mechanisms: []
  open_questions: []
