research:
  limitations:
    paragraphs:
      - zh: 访问经纪与认证状态交易证据较强，但卖方验证、私下交易和买方首次使用的完整联合时间线少见；休眠以规避日志的意图保持中等置信度。
        en: Evidence for access brokering and authentication-state trade is strong, but complete joined timelines of seller validation, private transactions, and buyer first use are rare; intent to use dormancy to evade logs remains medium confidence.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: No supported change to the inherent inspectability of captured data.
  open_questions: []
