handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0042-002
work_item_ref: WORK-TA0042-T1650
temporary_key_prefix: B42V2-T1650
candidate:
  source_type: attack
  source_attack_id: T1650
  name:
    zh: 获取访问权
    en: Acquire Access
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 已验证目标访问权具有独立资源对象，买方通过经纪或伙伴交付跳过自行形成入口的可见活动，并可从低监控或已有认证状态的位置开始，因此 T1650 在 TA0042 中应保留。
        en: Verified victim access is an independent resource object; broker or partner handoff lets a buyer skip visible buyer-side foothold creation and may begin from weak monitoring or existing authentication state, so T1650 should be retained in TA0042.
proposed_content:
  summary:
    zh: 取得并准备已经存在的目标入口，通过观察转移、谱系分段、时间分离或认证状态继承降低后续行动的可观察性与可归因性。
    en: Acquire and prepare an existing victim foothold and reduce later observability or attribution through observation displacement, lineage segmentation, temporal separation, or authentication-state inheritance.
  definition_and_concept:
    paragraphs:
      - zh: 候选仅涵盖目标特定、已验证且在交付时仍有效的入口取得与使用前准备；卖方前置攻陷、通用凭据或能力和买方后续目标操作均被排除。
        en: The candidate covers only acquisition and pre-use preparation of target-specific verified access that remains valid at handoff; seller compromise, generic credentials or capabilities, and buyer-side victim operations are excluded.
  stealth_characteristics:
    paragraphs:
      - zh: 入口形成与买方活动可由不同主体和时间承担，买方缺少自身前置痕迹；低监控位置和既有认证状态进一步减少首次使用信号，但市场、身份、端点和入口历史仍可恢复链路。
        en: Different actors and times can carry foothold creation and buyer activity, leaving no buyer-side preceding sequence; weak monitoring and existing authentication state further reduce first-use signals, while market, identity, endpoint, and foothold history can still recover the chain.
  scope_boundary_definition:
    paragraphs:
      - zh: 分类不按凭据、VPN、Web shell、远程服务或后门拆分，也不继承 ATT&CK 子技术；稳定边界是访问已被验证并在不同主体间交付。
        en: The taxonomy does not partition by credentials, VPN, Web shell, remote service, or backdoor and does not inherit ATT&CK children; the stable boundary is verified access handed between actors.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 初始访问经纪、犯罪伙伴和分工化行动在后续勒索、访问或其他活动前交付已验证企业入口。
          en: Initial-access brokers, criminal partners, and divided operations deliver validated enterprise footholds before later ransomware, access, or other activity.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要经纪或伙伴渠道、入口验证能力和对失效或欺诈清单的容忍；强实现还需要监控状态、长期有效入口或可移植认证状态。
            en: The adversary needs broker or partner channels, foothold validation, and tolerance for expired or fraudulent listings; stronger variants also require monitoring status, durable access, or portable authentication state.
      defender_model:
        paragraphs:
          - zh: 防守方需要把外部访问情报与身份、远程服务、端点覆盖、入口历史和首次使用进行长期关联。
            en: Defenders need long-horizon correlation of external access intelligence with identity, remote-service, endpoint-coverage, foothold-history, and first-use data.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 让买方入口准备缺少自身前置痕迹并可从低监控位置开始
        en: Leave buyer access preparation without buyer-side preceding traces and optionally begin from a weakly monitored position
      analysis:
        paragraphs:
          - zh: 卖方建立和验证入口并可按覆盖条件筛选，目标因此没有相邻买方入口形成序列，低遥测位置还可能使首次使用不进入有效告警。
            en: A seller establishes and validates access and may select by coverage conditions, leaving the victim without an adjacent buyer-side creation sequence and potentially keeping first use outside effective alerting.
      evidence_keys:
        - REF-000058
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 跨主体和时间分散入口形成、交付、休眠与首次使用
        en: Distribute foothold creation, handoff, dormancy, and first use across actors and time
      analysis:
        paragraphs:
          - zh: 经纪分工与静默期把连续访问链拆成跨组织和留存窗口的片段，防守必须结合外部情报与长期历史才能恢复。
            en: Broker division of labor and silence split a continuous access chain across organizations and retention windows, requiring external intelligence and long-term history for recovery.
      evidence_keys:
        - REF-000058
        - REF-000069
      confidence: medium
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 交付原用户令牌和设备状态以继承既有认证外观
        en: Transfer original-user token and device state to inherit an established authentication appearance
      analysis:
        paragraphs:
          - zh: 有效令牌、Cookie 和设备指纹使买方续用既有会话并减少新认证信号，令牌谱系与持续访问评估仍可识别重放。
            en: Valid tokens, cookies, and device fingerprints let a buyer continue an existing session and reduce new-authentication signals, while token lineage and continuous access evaluation can still expose replay.
      evidence_keys:
        - REF-000069
        - REF-000070
      confidence: high
proposed_subtechniques:
  - canonical_ref: NJS-0050-001
    name: {zh: 监控缺口导向的访问筛选, en: Monitoring-Gap-Selected Access}
    stable_variable: monitoring coverage of the selected foothold
    evidence_refs: [REF-000058]
    confidence: high
  - canonical_ref: NJS-0050-002
    name: {zh: 经纪化访问谱系分段, en: Brokered Access-Lineage Segmentation}
    stable_variable: seller-to-buyer operator lineage
    evidence_refs: [REF-000058, REF-000069]
    confidence: high
  - canonical_ref: NJS-0050-003
    name: {zh: 休眠入口再激活, en: Dormant Foothold Reactivation}
    stable_variable: deliberate silence before first buyer use
    evidence_refs: [REF-000058, REF-000069]
    confidence: medium
  - canonical_ref: NJS-0050-004
    name: {zh: 活动认证状态交付, en: Live Authentication-State Transfer}
    stable_variable: portable still-valid authentication and device state
    evidence_refs: [REF-000069, REF-000070]
    confidence: high
