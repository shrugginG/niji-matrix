schema_version: 2.0.0
type: detection-strategy
id: DET-000045
name: {zh: 匿迹能力构建与供应谱系, en: Stealth-Capability Build and Supply Lineage}
summary: {zh: 关联条件门控、构建差异、签名、供应商与客户关系，识别自研和外取能力的匿迹来源。, en: Correlate conditional gating, build differences, signatures, providers, and customer relationships to identify stealth provenance of developed and obtained capabilities.}
description:
  paragraphs:
  - zh: 本策略覆盖研发阶段的观测门控与构建多样化，以及外部能力的信任谱系借用和经纪供应分离。NJA-000019 在多环境执行、样本静态特征、代码相似、配置、调试、签名、证书、供应商水印和客户活动之间恢复谱系，不把工具名称、签名有效或样本差异单独作为恶意结论。
    en: This strategy covers development-time observation gating and build diversification and external capability trust-lineage borrowing and brokered supply separation. NJA-000019 recovers lineage across multi-environment execution, static sample features, code similarity, configuration, debug data, signatures, certificates, provider watermarks, and customer activity without treating tool name, valid signature, or sample difference alone as malicious.
