schema_version: 2.0.0
type: detection-strategy
id: DET-000046
name: {zh: 欺骗内容人物设定与来源关联, en: Deceptive-Content Persona and Provenance Correlation}
summary: {zh: 关联目标化语言、人物属性、模板、提示、图像和跨表面状态，识别用于后续欺骗的内容资产准备。, en: Correlate targeted language, persona attributes, templates, prompts, imagery, and cross-surface state to identify content assets prepared for later deception.}
description:
  paragraphs:
  - zh: 本策略覆盖目标情境约束的内容拟态和跨表面人物设定连续性，重点是生成阶段的来源与一致性，不把首次发送后的下游诱导吞并。NJA-000020 关联内容版本、作者或服务账户、提示与模板、人物履历、语言风格、图像工件、目标资料和后续首次使用，并排除合法品牌、营销、翻译和创意生产。
    en: This strategy covers target-context-constrained content camouflage and cross-surface persona-legend continuity and focuses on generation-stage provenance and coherence without absorbing downstream elicitation after first sending. NJA-000020 correlates content versions, author or service accounts, prompts and templates, persona biographies, language style, image artifacts, victim data, and first downstream use and excludes legitimate brand, marketing, translation, and creative production.
detects_refs: [NJT-0047, NJS-0047-001, NJS-0047-002]
domains: [enterprise]
analytic_refs: [NJA-000020]
evidence_refs: [REF-000043, REF-000064, REF-000079, REF-000080]
