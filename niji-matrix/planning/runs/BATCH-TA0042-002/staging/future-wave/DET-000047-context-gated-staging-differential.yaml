schema_version: 2.0.0
type: detection-strategy
id: DET-000047
name: {zh: 条件门控投放多视角差异分析, en: Multi-Vantage Differential Analysis of Context-Gated Staging}
summary: {zh: 从不同请求者、设备、地区和交互状态比较投放响应，识别只向匹配目标暴露的恶意对象。, en: Compare staging responses across requesters, devices, geographies, and interaction states to identify malicious objects exposed only to matching targets.}
description:
  paragraphs:
  - zh: 本策略针对可信投放表面中的条件选择，不把一般地理定制或反欺诈响应视为恶意。NJA-000021 使用多视角重复访问、控制平面配置、重定向链、对象哈希和后续下载结果，识别审核员或扫描器看到良性内容而目标看到恶意内容的稳定差异。
    en: This strategy targets conditional selection within trusted staging surfaces without treating ordinary geolocation or anti-fraud responses as malicious. NJA-000021 uses repeated multi-vantage access, control-plane configuration, redirect chains, object hashes, and downstream download results to identify stable differences where reviewers or scanners receive benign content and targets receive malicious content.
detects_refs: [NJT-0049, NJS-0049-002]
domains: [enterprise]
analytic_refs: [NJA-000021]
evidence_refs: [REF-000066, REF-000084]
