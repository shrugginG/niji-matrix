schema_version: 2.0.0
type: mitigation
id: MIT-000044
name: {zh: 能力构建、签名与供应谱系治理, en: Capability Build, Signing, and Supply-Lineage Governance}
summary: {zh: 通过多环境分析、代码谱系、签名服务控制和供应商处置降低门控、多样构建与外部信任借用收益。, en: Reduce benefits of gating, diverse builds, and external trust borrowing through multi-environment analysis, code lineage, signing-service controls, and provider enforcement.}
description: {paragraphs: [{zh: 本缓解将静态 IOC 与签名验证扩展为多环境行为、代码与配置谱系、证书和供应商关系分析，并要求签名与能力服务验证客户、保存构建审计和撤销滥用信任。, en: This mitigation extends static IOC and signature validation into multi-environment behavior, code and configuration lineage, certificate and provider relationship analysis and requires signing and capability services to verify customers, retain build audit, and revoke abused trust.}]}
domains: [enterprise]
measures:
- key: multienvironment-lineage-analysis
  name: {zh: 多环境与跨样本谱系分析, en: Multi-Environment and Cross-Sample Lineage Analysis}
  description: {paragraphs: [{zh: 在不同目标和分析条件运行样本并关联代码、配置、编译、调试和行为，避免依赖单个哈希。, en: Execute samples under different target and analysis conditions and correlate code, configuration, compilation, debug, and behavior without relying on one hash.}]}
  control_type: detective-support
- key: signing-provider-governance
  name: {zh: 签名与能力供应商治理, en: Signing and Capability-Provider Governance}
  description: {paragraphs: [{zh: 验证客户、限制高风险用途、保存租户与构建审计，并快速撤销被滥用证书、签名和服务账户。, en: Verify customers, restrict high-risk uses, retain tenant and build audit, and rapidly revoke abused certificates, signatures, and service accounts.}]}
  control_type: governance
applications:
- target_ref: NJS-0045-001
  use: {paragraphs: [{zh: 以多环境和多视角执行触发条件，保存未激活路径并比较真实与沙箱行为。, en: Exercise activation conditions across environments and vantage points, preserve inactive paths, and compare real and sandbox behavior.}]}
  expected_effect: {paragraphs: [{zh: 能力在非目标环境保持空白的收益降低，条件检查与差异行为更容易被恢复。, en: The benefit of blank behavior outside targets declines and condition checks or differential behavior are recovered more readily.}]}
  limitations: {paragraphs: [{zh: 真实目标条件可能无法安全复现，逻辑炸弹可等待未知信号。, en: Real target conditions may be unsafe to reproduce and logic bombs can await unknown signals.}]}
- target_ref: NJS-0045-002
  use: {paragraphs: [{zh: 关联不同构建的代码、配置、编译与目标特征，使用行为族而非固定哈希检测。, en: Correlate code, configuration, compilation, and target features across builds and detect behavior families rather than fixed hashes.}]}
  expected_effect: {paragraphs: [{zh: 多样化产物仍能连接到共同代码族，静态差异不再切断覆盖。, en: Diverse artifacts remain linked to a common code family and static differences no longer break coverage.}]}
  limitations: {paragraphs: [{zh: 大幅重写和共享开源代码会分别造成漏关联和误关联。, en: Major rewrites and shared open-source code cause missed and false lineage respectively.}]}
- target_ref: NJS-0048-001
  use: {paragraphs: [{zh: 不因合法工具名、发行者或有效签名放行，结合授权、行为和连接关系验证用途。, en: Do not allow solely on legitimate tool name, publisher, or valid signature and validate purpose through authorization, behavior, and connections.}]}
  expected_effect: {paragraphs: [{zh: 合法信任特征不能覆盖恶意行为，外部信任借用价值下降。, en: Legitimate trust features cannot suppress malicious behavior and external trust borrowing loses value.}]}
  limitations: {paragraphs: [{zh: 过严控制会影响合法管理工具和软件发行流程。, en: Aggressive controls can impair legitimate management tools and software-release workflows.}]}
- target_ref: NJS-0048-002
  use: {paragraphs: [{zh: 将签名、构建水印、供应商租户和客户行动关联，并在确认滥用时跨客户撤销与共享。, en: Correlate signatures, build watermarks, provider tenants, and customer operations and revoke and share across customers when abuse is confirmed.}]}
  expected_effect: {paragraphs: [{zh: 供应层仍可分离操作者，但共享构建与证书关系支持客户归属和批量处置。, en: The supply layer can still separate operators, but shared build and certificate relationships support customer attribution and broad enforcement.}]}
  limitations: {paragraphs: [{zh: 供应商记录和跨辖区共享可能不可获得，多个合法客户会共享特征。, en: Provider records and cross-jurisdiction sharing may be unavailable and legitimate customers share features.}]}
evidence_refs: [REF-000014, REF-000062, REF-000065, REF-000076, REF-000081, REF-000082]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-09', modified: '2026-09-09', contributors: [Niji Matrix Research], reviewers: []}
