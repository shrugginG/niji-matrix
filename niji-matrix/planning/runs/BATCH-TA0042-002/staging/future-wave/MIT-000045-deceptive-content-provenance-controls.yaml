schema_version: 2.0.0
type: mitigation
id: MIT-000045
name: {zh: 欺骗内容来源与人物设定治理, en: Deceptive-Content Provenance and Persona Governance}
summary: {zh: 记录内容来源、人物状态、模板与审批并验证跨表面一致性的真实授权，降低目标化拟态资产可信度。, en: Record content provenance, persona state, templates, and approvals and verify genuine authorization behind cross-surface consistency to reduce credibility of target-specific deceptive assets.}
description: {paragraphs: [{zh: 本缓解要求内容和平台服务保留创作账户、版本、提示、模板、媒体来源和首次使用，并为组织品牌与人物建立可验证授权，使流畅语言和跨平台一致性不能替代真实关系。, en: This mitigation requires content and platform services to retain production account, version, prompt, template, media source, and first use and establishes verifiable authorization for organizational brands and personas so fluent language and cross-platform consistency cannot substitute for genuine relationships.}]}
domains: [enterprise]
measures:
- key: content-provenance-record
  name: {zh: 内容来源、版本与审批记录, en: Content Provenance, Version, and Approval Records}
  description: {paragraphs: [{zh: 为高风险内容保存作者或服务账户、源素材、提示、模板、版本、审批和首次发布。, en: Preserve author or service account, source material, prompts, templates, versions, approval, and first publication for high-risk content.}]}
  control_type: governance
- key: persona-brand-verification
  name: {zh: 人物与品牌授权验证, en: Persona and Brand Authorization Verification}
  description: {paragraphs: [{zh: 对跨平台人物、品牌和业务身份使用独立目录与关系证明，不把外观一致性视为真实性。, en: Use independent directories and relationship proof for cross-platform personas, brands, and business identities rather than treating appearance consistency as authenticity.}]}
  control_type: preventive
applications:
- target_ref: NJS-0047-001
  use: {paragraphs: [{zh: 对高度贴合目标语言、角色和业务情境的内容验证来源、授权关系和首次用途。, en: Verify provenance, authorized relationship, and first use of content closely aligned with victim language, role, and business context.}]}
  expected_effect: {paragraphs: [{zh: 目标化流畅内容不再自动可信，异常来源与用途更容易被识别。, en: Target-specific fluent content is no longer automatically trusted and anomalous provenance or purpose is easier to identify.}]}
  limitations: {paragraphs: [{zh: 离线人工内容和短消息可能缺少稳定来源工件。, en: Offline human-created content and short messages may lack stable provenance artifacts.}]}
- target_ref: NJS-0047-002
  use: {paragraphs: [{zh: 跨平台核验人物履历、语气、图像和关系时检查独立授权与共同创作工件。, en: When verifying cross-platform biography, voice, imagery, and relationships, check independent authorization and shared production artifacts.}]}
  expected_effect: {paragraphs: [{zh: 人物设定连续性需要真实关系背书，复用模板与提示可支持平台关联。, en: Persona continuity requires genuine relationship corroboration and reused templates or prompts support platform linkage.}]}
  limitations: {paragraphs: [{zh: 隐私、合法艺名和创意角色会限制跨平台核验。, en: Privacy, legitimate pseudonyms, and creative characters limit cross-platform verification.}]}
evidence_refs: [REF-000043, REF-000064, REF-000079, REF-000080]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-09', modified: '2026-09-09', contributors: [Niji Matrix Research], reviewers: []}
