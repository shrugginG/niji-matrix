schema_version: 2.0.0
type: detection-analytic
id: NJA-000019
strategy_ref: DET-000045
name: {zh: 匿迹能力构建与供应谱系分析, en: Stealth-Capability Build and Supply Lineage Analytic}
summary: {zh: 以多环境行为差异和跨样本供应关系恢复门控、构建多样化、信任借用与经纪化能力来源。, en: Recover gating, build diversification, trust borrowing, and brokered capability provenance through multi-environment behavioral differences and cross-sample supply relationships.}
domains: [enterprise]
platforms: [Malware Analysis, Software Supply Chain, Code Signing]
logic:
  paragraphs:
  - zh: 在真实、沙箱和不同配置环境运行样本，比较激活条件、关键行为和退出路径；对样本提取代码相似、编译、配置、调试、哈希、签名、证书、工具发行者与供应商水印。将目标化构建差异与共同代码族关联，并把多个客户共享签名、构建服务或合法工具但出现不同行动的情况标记为供应层。结果区分研发门控、构建多样化、合法信任特征借用和经纪供应，不从单一哈希或签名推断操作者。
    en: Execute samples in real, sandboxed, and differently configured environments and compare activation conditions, critical behavior, and exit paths; extract code similarity, compilation, configuration, debug, hash, signature, certificate, tool publisher, and provider watermark. Connect target-specific build differences to a common code family and mark a supply layer when multiple customers share signing, build service, or legitimate tools across different operations. Separate development gating, build diversification, legitimate trust-feature borrowing, and brokered supply and do not infer an operator from one hash or signature.
data_requirements:
- source_type: multi-environment-analysis
  name: {zh: 多环境动态能力分析, en: Multi-environment dynamic capability analysis}
  channel: null
  required_fields: [sample_id, environment_id, environment_features, activated_behavior, exit_path, network_behavior]
- source_type: sample-build-metadata
  name: {zh: 样本构建与静态元数据, en: Sample build and static metadata}
  channel: null
  required_fields: [sample_id, hash, code_similarity, compile_time, configuration, debug_artifact, publisher, signature_id, certificate_id]
- source_type: capability-supply-intelligence
  name: {zh: 能力供应商、客户与处置情报, en: Capability provider, customer, and enforcement intelligence}
  channel: null
  required_fields: [provider_id, customer_indicator, sample_id, build_marker, transaction_time, enforcement_state]
observables:
- {zh: 关键行为仅在匹配分析规避或目标条件时激活, en: Critical behavior activates only under matching analysis-evasion or target conditions}
- {zh: 多个样本共享代码但哈希、配置和调试特征按目标变化, en: Samples share code while hashes, configurations, and debug features vary by target}
- {zh: 多个行动共享签名、发行者、供应商水印或构建基础设施, en: Multiple operations share signatures, publishers, provider watermarks, or build infrastructure}
correlation:
  window: {zh: 使用样本执行期窗口比较环境差异，并使用一年以上窗口恢复构建、证书、供应商与客户谱系。, en: Use sample-execution windows for environment differences and year-or-longer windows for build, certificate, provider, and customer lineage.}
  dimensions: [sample, code_family, environment, configuration, signature, certificate, provider, customer, campaign, time]
false_positives:
- {zh: 合法软件环境兼容、功能开关和客户定制构建, en: Legitimate software compatibility, feature flags, and customer-specific builds}
- {zh: 合法远程管理工具和共享代码签名服务, en: Legitimate remote-management tools and shared code-signing services}
blind_spots:
- {zh: 样本无法在匹配环境执行或关键配置缺失, en: Samples cannot execute in a matching environment or lack critical configuration}
- {zh: 供应商与交易记录不可获得且构建工件被清除, en: Provider and transaction records are unavailable and build artifacts are removed}
tuning_guidance:
  paragraphs:
  - zh: 应以代码、行为、配置、签名与供应关系的组合评分，并维护合法客户定制、测试门控和管理工具清单。有效签名或工具名称不能覆盖恶意行为，样本差异也不能自动解释为谱系抑制。
    en: Score combinations of code, behavior, configuration, signature, and supply relationships and maintain inventories of legitimate customer builds, test gating, and management tools. Valid signatures or tool names must not suppress malicious behavior, and sample differences must not automatically imply lineage suppression.
evidence_refs: [REF-000014, REF-000062, REF-000065, REF-000076, REF-000081, REF-000082]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-09', modified: '2026-09-09', contributors: [Niji Matrix Research], reviewers: []}
