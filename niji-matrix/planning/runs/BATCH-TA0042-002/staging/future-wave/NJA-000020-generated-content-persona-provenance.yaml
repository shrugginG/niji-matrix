schema_version: 2.0.0
type: detection-analytic
id: NJA-000020
strategy_ref: DET-000046
name: {zh: 欺骗内容人物设定与来源关联分析, en: Deceptive-Content Persona and Provenance Correlation Analytic}
summary: {zh: 从内容工件和创作时间线识别目标化拟态及跨资产人物连续性。, en: Identify target-specific camouflage and cross-asset persona continuity from content artifacts and production timelines.}
domains: [enterprise]
platforms: [Content Platform, Public AI Service, Collaboration]
logic:
  paragraphs:
  - zh: 对文本、图像、音频和视频提取语言、语气、角色、品牌、履历、时间、模板与媒体工件，并将其与创作账户、提示、版本和目标资料关联。识别多个内容资产对同一人物保持异常精确的一致状态，或内容在生成阶段大量吸收目标组织术语和关系后首次用于高风险行动；单一风格相似或 AI 使用不能独立判定恶意。
    en: Extract language, tone, role, brand, biography, time, template, and media artifacts from text, image, audio, and video and link them with production accounts, prompts, versions, and victim data. Identify multiple assets maintaining unusually precise state for one persona or content that incorporates extensive victim terminology and relationships during generation before first high-risk use; style similarity or AI use alone cannot establish maliciousness.
data_requirements:
- source_type: content-production-audit
  name: {zh: 内容创作、提示与版本审计, en: Content production, prompt, and version audit}
  channel: null
  required_fields: [timestamp, account_id, content_id, version_id, prompt_or_brief, template_id, source_assets]
- source_type: content-artifact-analysis
  name: {zh: 文本与媒体工件分析, en: Text and media artifact analysis}
  channel: null
  required_fields: [content_id, language, style_features, persona_attributes, brand_features, media_fingerprint]
- source_type: first-content-use
  name: {zh: 内容首次发送或展示事件, en: First content sending or display event}
  channel: null
  required_fields: [timestamp, content_id, sender_account, target_entity, channel, action_type]
observables:
- {zh: 内容语言、角色和理由与目标资料异常精确匹配, en: Content language, role, and justification match victim data with unusual precision}
- {zh: 多个平台和媒体保持同一人物履历、语气和关系状态, en: Multiple platforms and media maintain one persona biography, voice, and relationship state}
- {zh: 多个账户复用提示、模板、图像或人物数据库工件, en: Multiple accounts reuse prompt, template, image, or persona-database artifacts}
correlation:
  window: {zh: 使用创作会话至首次使用的分钟至三十日窗口，并使用一年窗口观察跨表面人物连续性。, en: Use minute-to-thirty-day windows from production session to first use and a one-year window for cross-surface persona continuity.}
  dimensions: [content, version, creator_account, template, persona, target, media_fingerprint, first_use, time]
false_positives:
- {zh: 合法品牌营销、招聘、客户支持和本地化内容生产, en: Legitimate brand marketing, recruiting, customer support, and localized content production}
- {zh: 创意团队跨渠道维护一致虚构角色, en: Creative teams maintaining consistent fictional characters across channels}
blind_spots:
- {zh: 内容离线生成且无创作平台或版本审计, en: Content is generated offline without platform or version audit}
- {zh: 媒体经过重编码且文本短到无法提取稳定特征, en: Media is re-encoded and text is too short for stable features}
tuning_guidance:
  paragraphs:
  - zh: 应按合法品牌、人物和活动维护内容来源与审批记录，并结合目标敏感度和首次用途评分。不得以语法流畅、AI 痕迹或跨平台一致性单独触发处置。
    en: Maintain content provenance and approval records for legitimate brands, personas, and campaigns and score with target sensitivity and first use. Fluency, AI artifacts, or cross-platform consistency alone must not trigger enforcement.
evidence_refs: [REF-000043, REF-000064, REF-000079, REF-000080]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-09', modified: '2026-09-09', contributors: [Niji Matrix Research], reviewers: []}
