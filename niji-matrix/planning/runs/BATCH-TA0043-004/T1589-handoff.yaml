research:
  limitations:
    paragraphs:
    - zh: 域外采集通常缺少查询日志，合法用户错误和批量身份活动会产生相似事务，因此前者依赖后续使用反推，后者依赖跨事件模式而不能单点归因。
      en: Off-victim collection usually lacks query logs, while legitimate user error and bulk identity activity create similar transactions, so the former relies on inference from downstream use and the latter on cross-event patterns rather than point attribution.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason: no_identity_collection_specific_obscuration_chain_supported
  - mechanism_ref: NM-ST
    reason: low_rate_and_multi_origin_identity_queries_lack_distinct_t1589_evidence
  open_questions: []
