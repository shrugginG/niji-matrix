candidate:
  source_type: attack
  source_attack_id: T1589
  name:
    zh: 收集目标身份信息
    en: Gather Victim Identity Information
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 具体人员、账户和数字身份属性直接支持目标选择、冒充与后续账户行动；公开事件与技术资料共同支持受害域外获取和正常身份事务拟态两类稳定匿迹实现，因此保留父技术并建立 Niji 原生子技术。
      en: Concrete people, account, and digital-identity attributes directly support targeting, impersonation, and follow-on account action; public incidents and technical sources jointly support stable stealth implementations through off-victim acquisition and normal identity-transaction mimicry, so the parent is retained with Niji-native children.
proposed_content:
  summary:
    zh: 在获得目标内部访问前收集或推断具体人员、账户和数字身份属性，并通过域外获取或正常身份事务拟态降低采集可见性与可区分性。
    en: Collect or infer attributes of specific people, accounts, and digital identities before internal access while using off-victim acquisition or normal-transaction mimicry to reduce collection visibility and distinguishability.
  definition_and_concept:
    paragraphs:
    - zh: 候选以攻击前获得具体身份属性为信息对象，凭据、邮箱和姓名等字段类别不构成子技术边界。
      en: The candidate is anchored in obtaining concrete identity attributes before compromise; field categories such as credentials, email addresses, and names do not define children.
  stealth_characteristics:
    paragraphs:
    - zh: 域外获取使目标身份系统没有采集事件，工作流拟态则使主动推断表现为普通失败或未完成事务，残余痕迹需要跨域或跨账户关联。
      en: Off-victim acquisition leaves no collection event in victim identity systems, while workflow mimicry makes active inference appear as ordinary failure or incomplete transactions, requiring cross-domain or cross-account correlation of residual traces.
  scope_boundary_definition:
    paragraphs:
    - zh: 直接诱导人员披露归 T1598，密码猜测、凭证填充、成功重置和账户接管属于后续行为，抽象岗位关系属于组织信息。
      en: Direct elicitation belongs to T1598, password guessing, credential stuffing, successful reset, and account takeover are downstream behavior, and abstract role relationships are organizational information.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 适用于社会工程、帮助台冒充、恢复滥用和定向账户行动前的高价值身份筛选与属性验证。
        en: Applies to high-value identity selection and attribute validation before social engineering, help-desk impersonation, recovery abuse, and targeted account action.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要外部身份资料或访问目标身份功能的能力，并具备实体解析、响应比较和自动化请求能力。
          en: The adversary needs external identity material or access to victim identity functions, together with entity-resolution, response-comparison, and request-automation capability.
      defender_model:
        paragraphs:
        - zh: 防守方需要外部暴露情报、身份服务审计和后续帮助台或恢复记录，单个公开资料访问或失败事务不足以判断恶意。
          en: Defenders need external-exposure intelligence, identity-service audit, and downstream help-desk or recovery records; one public-data access or failed transaction is insufficient.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 在受害域外检索与富化身份材料，使目标身份系统没有对应采集事件
      en: Retrieve and enrich identity material off-victim so target identity systems have no corresponding collection event
    analysis:
      paragraphs:
      - zh: 外部平台和离线材料替代目标身份系统查询，使受害方只能观察暴露或后续精确使用，降低直接可见性和归因能力。
        en: External platforms and offline material replace queries in victim identity systems, leaving the victim able to observe only exposure or precise downstream use and reducing direct visibility and attribution.
    evidence_keys: [REF-000031, REF-000032]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 以语义正常的失败或未完成事务承载身份属性比较
      en: Carry identity-attribute comparison in semantically normal failed or incomplete transactions
    analysis:
      paragraphs:
      - zh: 登录、注册、恢复和 MFA 请求保持业务有效外观，恶意推断只有跨身份、功能和响应簇关联才能恢复。
        en: Login, registration, recovery, and MFA requests retain a business-valid appearance, and malicious inference is recoverable only through correlation across identities, functions, and response classes.
    evidence_keys: [REF-000033, REF-000034, REF-000035]
    confidence: high
