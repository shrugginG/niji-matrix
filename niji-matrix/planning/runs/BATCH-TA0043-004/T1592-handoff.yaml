handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-004
work_item_ref: WORK-TA0043-T1592
temporary_key_prefix: B43R4-T1592
candidate:
  source_type: attack
  source_attack_id: T1592
  name:
    zh: 收集目标主机信息
    en: Gather Victim Host Information
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 主机与端点属性直接支持攻击前目标选择和环境适配；公开事件与技术资料共同支持第三方观测替代、请求固有元数据采集和嵌入式客户端枚举三类稳定匿迹实现，因此保留父技术并重新建立 Niji 原生子技术。
      en: Host and endpoint attributes directly support pre-compromise targeting and environment adaptation; public incidents and technical sources jointly support stable stealth implementations through third-party observation substitution, inherent request metadata, and embedded client enumeration, so the parent is retained with rebuilt Niji-native children.
proposed_content:
  summary:
    zh: 在获得目标内部访问前收集或推断主机、设备、平台和端点属性，并通过第三方观测或普通 Web 会话降低采集的可见性与可区分性。
    en: Collect or infer host, device, platform, and endpoint attributes before internal access while using third-party observations or ordinary web sessions to reduce collection visibility and distinguishability.
  definition_and_concept:
    paragraphs:
    - zh: 候选以攻击前获得具体主机与端点属性为信息对象，字段类别和实现产品不构成分类边界。
      en: The candidate is anchored in obtaining concrete host and endpoint attributes before compromise; field categories and implementation products do not define its taxonomy.
  stealth_characteristics:
    paragraphs:
    - zh: 主要痕迹变化是专用直接探测被提供方历史观测、目标主动请求或与页面共存的脚本执行替代，残余信号分布在提供方、服务器和浏览器遥测中。
      en: The main trace change replaces dedicated direct probing with provider historical observations, victim-initiated requests, or page-coincident script execution, leaving residual signals across provider, server, and browser telemetry.
  scope_boundary_definition:
    paragraphs:
    - zh: 直接端口、服务或协议探测归 NJT-0001，身份和网络信息分别归对应信息对象，合法兼容性与反欺诈处理不因字段相同而纳入。
      en: Direct port, service, or protocol probing remains NJT-0001, identity and network information belong to their respective objects, and legitimate compatibility or anti-fraud processing is not included merely because fields overlap.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 适用于第三方互联网测绘、远端选择性响应以及被篡改或诱导访问的网页主机画像。
        en: Applies to third-party Internet mapping, remote selective response, and host profiling through altered or lured web pages.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要提供方查询权、远端请求可见性或页面与脚本控制能力，并接受数据时效、浏览器限制和提供方审计约束。
          en: The adversary needs provider query access, visibility into remote requests, or control of pages and scripts, while accepting freshness, browser, and provider-audit constraints.
      defender_model:
        paragraphs:
        - zh: 防守方需要跨提供方审计、Web 请求响应、脚本遥测、页面完整性和后续活动关联，单个字段或 API 调用不足以判断恶意。
          en: Defenders need correlation across provider audit, web requests and responses, script telemetry, page integrity, and downstream activity; one field or API call is insufficient.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 以第三方观测或目标主动会话替代攻击者专用主机探测
      en: Substitute third-party observations or victim-initiated sessions for dedicated adversary host probes
    analysis:
      paragraphs:
      - zh: 提供方测量或目标主动请求替代攻击者发起的采集事件，使目标没有对应查询或只见普通访问，并迫使防守方跨组织和端点关联。
        en: Provider measurement or victim-initiated requests replace adversary-originated collection events, leaving no corresponding victim query or only ordinary access and forcing cross-organizational and endpoint correlation.
    evidence_keys: [REF-000025, REF-000026, REF-000027, REF-000029]
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 让属性读取和回传混入常见兼容性、分析与跟踪行为
      en: Blend property access and reporting into common compatibility, analytics, and tracking behavior
    analysis:
      paragraphs:
      - zh: 请求固有字段处理与网页指纹 API 具有大量合法背景，恶意画像只有结合脚本来源、属性集合和选择性响应才能区分。
        en: Inherent request-field processing and web fingerprinting APIs have abundant legitimate background, so malicious profiling is distinguishable only with script provenance, attribute sets, and selective responses.
    evidence_keys: [REF-000027, REF-000028, REF-000029, REF-000030]
    confidence: high
proposed_subtechniques:
- resulting_ref: NJS-0032-001
  name:
    zh: 第三方主机观测替代
    en: Third-Party Host-Observation Substitution
  stable_variable: original_measurement_actor
  trace_change: provider_measurement_and_query_replace_adversary_probe
  defender_effect: victim_has_no_current_adversary_query
  evidence_keys: [REF-000025, REF-000026]
- resulting_ref: NJS-0032-002
  name:
    zh: 环境请求元数据采集
    en: Ambient Request-Metadata Harvesting
  stable_variable: zero_incremental_client_collection_event
  trace_change: profiling_uses_fields_inherent_in_original_request
  defender_effect: local_event_matches_ordinary_resource_access
  evidence_keys: [REF-000027, REF-000028]
- resulting_ref: NJS-0032-003
  name:
    zh: 嵌入式客户端主机指纹采集
    en: Embedded Client-Side Host Fingerprinting
  stable_variable: additional_client_property_access_and_reporting
  trace_change: enumeration_shares_page_script_and_web_channels
  defender_effect: malicious_reads_overlap_high_volume_legitimate_scripts
  evidence_keys: [REF-000029, REF-000030]
