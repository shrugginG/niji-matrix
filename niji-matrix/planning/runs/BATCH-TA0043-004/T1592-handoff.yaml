research:
  limitations:
    paragraphs:
    - zh: 第三方查询审计通常不可获得，正常网站广泛处理请求字段和运行指纹脚本，因此主观匿迹意图和单事件归因需保持证据层级限制。
      en: Third-party query audit is rarely available, and normal sites widely process request fields and run fingerprinting scripts, so subjective stealth intent and single-event attribution require evidence-level limits.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason: encryption_or_field_encoding_did_not_establish_host_collection_specific_obscuration
  - mechanism_ref: NM-ST
    reason: low_rate_and_multi_origin_execution_belongs_to_active_scanning_and_lacks_t1592_specific_evidence
  open_questions: []
