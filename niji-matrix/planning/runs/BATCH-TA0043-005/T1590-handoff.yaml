handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-005
work_item_ref: WORK-TA0043-T1590
temporary_key_prefix: B43R5-T1590
candidate:
  source_type: attack
  source_attack_id: T1590
  name: {zh: 收集目标网络信息, en: Gather Victim Network Information}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 网络命名、地址、路由、拓扑、信任与边界是稳定信息对象，第三方测量和公共控制面提供有证据的目标外匿迹路径，因此保留。
      en: Network naming, addressing, routing, topology, trust, and perimeter form a stable information object, and third-party measurement and public control planes provide evidenced off-target stealth paths, so retention is justified.
proposed_content:
  summary: {zh: 通过目标外来源收集网络属性并减少目标侧采集事件。, en: Collect network attributes through off-target sources while reducing victim-side collection events.}
  definition_and_concept:
    paragraphs:
    - zh: 以攻击前网络级关系和边界属性为直接信息对象，不按 DNS、证书或 IP 字段拆分。
      en: Anchor the candidate in pre-compromise network-level relationships and perimeter attributes without partitioning by DNS, certificate, or IP fields.
  stealth_characteristics:
    paragraphs:
    - zh: 第三方观测或公共控制面查询替代目标交互，残余痕迹位于提供方、公开对象和后续接触。
      en: Third-party observations or public control-plane queries replace victim interaction, leaving residual traces at providers, public objects, and downstream contact.
  scope_boundary_definition:
    paragraphs:
    - zh: 直接探测归 NJT-0001，主机、身份和组织信息分别归对应父技术。
      en: Direct probing belongs to NJT-0001, while host, identity, and organizational information belong to their respective parents.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于攻击前建立域、地址、证书、前缀和路由关系图。
        en: Used to build domain, address, certificate, prefix, and routing relationship graphs before compromise.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要外部数据访问和实体解析能力，并受平台审计与数据时效限制。
          en: The adversary needs external-data access and entity-resolution capability and is constrained by provider audit and data freshness.
      defender_model:
        paragraphs:
        - zh: 防守方主要依赖提供方审计、外部暴露清单和后续行为关联。
          en: Defenders rely primarily on provider audit, external-exposure inventories, and downstream correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 以目标外查询替代受害方采集事件, en: Substitute off-target queries for victim-side collection events}
    analysis:
      paragraphs:
      - zh: 外部测量和公开对象查询使完整网络画像不进入目标业务日志，降低直接观察和归因能力。
        en: External measurement and public-object queries keep the complete network profile out of victim business logs, reducing direct observation and attribution.
    evidence_keys: [REF-000025, REF-000026, REF-000036, REF-000037, REF-000038, REF-000039]
    confidence: high
proposed_subtechniques:
