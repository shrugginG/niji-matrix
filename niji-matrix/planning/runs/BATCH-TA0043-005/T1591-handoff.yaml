handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-005
work_item_ref: WORK-TA0043-T1591
temporary_key_prefix: B43R5-T1591
candidate:
  source_type: attack
  source_attack_id: T1591
  name: {zh: 收集目标组织信息, en: Gather Victim Organization Information}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 保留组织信息对象，但收窄为非直接诱导式画像，只接受目标外综合这一具有明确受害方观测变化的子技术。
      en: Retain the organizational information object but narrow it to non-elicitation profiling and admit only off-target synthesis as a child with an explicit victim-observation change.
proposed_content:
  summary: {zh: 在目标外收集并综合组织结构、职责、关系与运营规律。, en: Collect and synthesize organizational structure, responsibilities, relationships, and operating patterns off-target.}
  definition_and_concept:
    paragraphs:
    - zh: 直接对象是抽象组织模型，不是具体人员、网络或访问表面。
      en: The immediate object is an abstract organizational model rather than concrete people, networks, or an access surface.
  stealth_characteristics:
    paragraphs:
    - zh: 查询和完整模型位于目标控制域外，各提供方只看到局部访问。
      en: Queries and the complete model remain outside victim control, while each provider sees only partial access.
  scope_boundary_definition:
    paragraphs:
    - zh: 具体身份、网络技术关系和直接诱导分别归 NJT-0033、NJT-0034 与 NJT-0036。
      en: Concrete identities, technical network relationships, and direct elicitation belong respectively to NJT-0033, NJT-0034, and NJT-0036.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于供应商冒充、社会工程和行动排期前的组织关系与节奏建模。
        en: Used to model organizational relationships and tempo before supplier impersonation, social engineering, and operation scheduling.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要多来源访问和实体解析能力，并受资料陈旧与平台审计限制。
          en: The adversary needs multisource access and entity-resolution capability and is constrained by stale material and provider audit.
      defender_model:
        paragraphs:
        - zh: 防守方主要通过公开内容治理、提供方共享和后续话术关联观察。
          en: Defenders observe primarily through public-content governance, provider sharing, and downstream pretext correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 在目标外形成完整组织模型以避免受害方采集日志, en: Form the complete organizational model off-target to avoid victim collection logs}
    analysis:
      paragraphs:
      - zh: 外部平台查询和本地综合替代目标资产访问，使完整意图不出现在单一防守观察面。
        en: External-platform queries and local synthesis replace victim-asset access so complete intent does not appear at one defensive vantage point.
    evidence_keys: [REF-000023, REF-000040, REF-000041]
    confidence: high
proposed_subtechniques:
- resulting_ref: NJS-0035-001
  name: {zh: 目标外组织情报拼接, en: Off-Target Organizational Intelligence Synthesis}
  stable_variable: sources_and_synthesis_outside_victim_control
