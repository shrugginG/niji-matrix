    paragraphs:
    - zh: 匿名浏览、缓存、镜像、多平台分散和离线筛选均缺少稳定因果证据，继续延期。
      en: Anonymous browsing, caches, mirrors, multi-platform distribution, and offline filtering lack stable causal evidence and remain deferred.
  rejected_mechanisms: [NM-DO, NM-ST]
