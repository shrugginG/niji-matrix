handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-005
work_item_ref: WORK-TA0043-T1593
temporary_key_prefix: B43R5-T1593
candidate:
  source_type: attack
  source_attack_id: T1593
  name: {zh: 搜索开放网站与域, en: Search Open Websites/Domains}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 适配为第三方开放内容访问表面，避免与主机、身份、网络和组织信息对象重复，只保留有直接证据的假名研究账户子技术。
      en: Adapt to the third-party open-content access surface to avoid duplicating host, identity, network, and organizational information objects and retain only the directly evidenced pseudonymous research-account child.
proposed_content:
  summary: {zh: 在目标外公开平台检索信息并通过假名研究身份降低归因。, en: Search information on off-victim public platforms and reduce attribution through a pseudonymous research identity.}
  definition_and_concept:
    paragraphs:
    - zh: 父技术描述第三方公开访问表面，所得信息仍归对应信息对象技术。
      en: The parent describes a third-party public access surface while resulting information remains with the corresponding information-object technique.
  stealth_characteristics:
    paragraphs:
    - zh: 查询留在提供方且目标无日志，假名账户进一步隔离真实身份和查询历史。
      en: Queries remain at providers with no victim logs, while pseudonymous accounts further separate real identity from query history.
  scope_boundary_definition:
    paragraphs:
    - zh: 受害者自有网站归 NJT-0038，结构化技术数据和公共 AI 实质中介归各自父技术。
      en: Victim-owned sites belong to NJT-0038, while structured technical data and material public-AI mediation belong to their respective parents.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于搜索员工、伙伴、公开代码、招聘与业务资料并支持后续目标选择。
        en: Used to search employees, partners, public code, recruiting, and business material for downstream targeting.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要公开平台访问和账户隔离能力，并受平台审计与处置限制。
          en: The adversary needs public-platform access and account-compartmentation capability and is constrained by provider audit and enforcement.
      defender_model:
        paragraphs:
        - zh: 目标依赖暴露治理和后续活动关联，平台依赖账户、设备、查询与目标图。
          en: Victims depend on exposure governance and downstream correlation, while platforms depend on account, device, query, and target graphs.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 将采集痕迹移至第三方提供方, en: Move collection traces to a third-party provider}
    analysis:
      paragraphs:
      - zh: 第三方查询替代目标资产访问，使受害方没有对应采集事件。
        en: Third-party queries replace victim-asset access, leaving no corresponding victim collection event.
    evidence_keys: [REF-000044, REF-000052]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary: {zh: 以隔离画像替代真实操作者身份, en: Replace the real operator identity with a compartmented profile}
    analysis:
      paragraphs:
      - zh: 假名账户使单次查询接近普通平台参与并提高跨行动归因成本。
        en: A pseudonymous account makes one query resemble ordinary platform participation and raises cross-operation attribution cost.
    evidence_keys: [REF-000050, REF-000051]
    confidence: medium
