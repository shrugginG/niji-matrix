handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-005
work_item_ref: WORK-TA0043-T1594
temporary_key_prefix: B43R5-T1594
candidate:
  source_type: attack
  source_attack_id: T1594
  name: {zh: 搜索受害者自有网站, en: Search Victim-Owned Websites}
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 收窄为直接读取已公开页面和路径，排除猜测式枚举与表单诱导，只保留正常访客拟态和导航工件替代。
      en: Narrow to direct reading of published pages and paths, exclude speculative enumeration and form elicitation, and retain only benign-visitor mimicry and navigation-artifact substitution.
proposed_content:
  summary: {zh: 直接读取受害者公开网站并降低会话异常与猜测式枚举信号。, en: Directly read victim public websites while reducing session anomaly and speculative-enumeration signals.}
  definition_and_concept:
    paragraphs:
    - zh: 父技术只消费受害者已公开内容，不生成未发布路径或直接诱导回应。
      en: The parent consumes only victim-published content and does not generate unpublished paths or elicit a direct response.
  stealth_characteristics:
    paragraphs:
    - zh: 正常会话外观降低可区分性，已发布导航路径减少错误与高扇出。
      en: Normal session appearance reduces distinguishability, while published navigation paths reduce errors and fan-out.
  scope_boundary_definition:
    paragraphs:
    - zh: 第三方查询、主动路径探测和表单诱导分别归 NJT-0037、NJT-0001 与 NJT-0036。
      en: Third-party queries, active path probing, and form elicitation belong respectively to NJT-0037, NJT-0001, and NJT-0036.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于从官网、招聘、文档、支持和状态页面建立攻击前画像。
        en: Used to build pre-compromise profiles from corporate, recruiting, documentation, support, and status pages.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要公开 Web 访问和会话或导航控制能力，并受日志与内容变化限制。
          en: The adversary needs public web access and session or navigation control and is constrained by logging and content changes.
      defender_model:
        paragraphs:
        - zh: 防守方需要完整会话、页面主题、导航来源和后续活动关联。
          en: Defenders need complete sessions, page topics, navigation provenance, and downstream correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 使访问会话接近正常访客, en: Make the access session resemble a normal visitor}
    analysis:
      paragraphs:
      - zh: 常见客户端、自然路径和人工节奏替代机械化抓取特征，降低局部可区分性。
        en: Common clients, natural paths, and human cadence replace mechanical crawling features and reduce local distinguishability.
    evidence_keys: [REF-000030, REF-000045]
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 以已发布路径替代猜测式枚举, en: Substitute published paths for speculative enumeration}
    analysis:
      paragraphs:
      - zh: 导航工件提供确定路径，使错误、高扇出和字典序列不再出现。
        en: Navigation artifacts provide deterministic paths so errors, high fan-out, and wordlist sequences no longer appear.
    evidence_keys: [REF-000045]
    confidence: medium
proposed_subtechniques:
- resulting_ref: NJS-0038-001
  name: {zh: 正常访客拟态的网站浏览, en: Benign-Visitor-Mimetic Web Browsing}
  stable_variable: session_appearance_and_cadence
  evidence_keys: [REF-000030, REF-000045]
- resulting_ref: NJS-0038-002
  name: {zh: 受害者发布导航工件替代, en: Victim-Published Navigation-Artifact Substitution}
  stable_variable: published_navigation_as_exclusive_path_source
  evidence_keys: [REF-000001, REF-000045]
