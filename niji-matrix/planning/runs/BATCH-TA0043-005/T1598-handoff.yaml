handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-005
work_item_ref: WORK-TA0043-T1598
temporary_key_prefix: B43R5-T1598
candidate:
  source_type: attack
  source_attack_id: T1598
  name: {zh: 通过钓鱼获取信息, en: Phishing for Information}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 电子社会工程直接获得信息具有独立侦查目的，证据支持语义、时序、受信账户、邮箱证据和托管界面五类不同匿迹变量，因此保留并拆分旧合并子技术。
      en: Electronic social engineering directly acquiring information has a distinct reconnaissance objective, and evidence supports five different stealth variables across semantics, timing, trusted accounts, mailbox evidence, and hosting interfaces, so retention and splitting of the former combined child are justified.
proposed_content:
  summary: {zh: 直接诱导人员披露信息并改变通信语义、时间、信任或证据。, en: Directly induce people to disclose information while changing communication semantics, timing, trust, or evidence.}
  definition_and_concept:
    paragraphs:
    - zh: 即时结果必须是数据而非代码执行、载荷投递或直接访问，子技术不按媒介拆分。
      en: The immediate result must be data rather than code execution, payload delivery, or direct access, and children are not partitioned by medium.
  stealth_characteristics:
    paragraphs:
    - zh: 请求可借用可信语义、长期会话、真实账户、缺失证据或可信界面，使任何单点线索不足以判断。
      en: Requests can borrow plausible semantics, long conversations, genuine accounts, missing evidence, or trusted interfaces so no single cue is sufficient.
  scope_boundary_definition:
    paragraphs:
    - zh: 非互动资料收集与后续凭据使用排除，取得账户和托管资源属于前置行为。
      en: Non-interactive collection and downstream credential use are excluded, while acquisition of accounts and hosting resources is prerequisite behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于招聘、教育、财务、供应商、支持和内部行政情境中的敏感信息索取。
        en: Used for sensitive-information requests in recruiting, education, finance, supplier, support, and internal-administration contexts.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要通信渠道、目标情境和信息接收表面，部分实现还需要长期身份、受信账户或托管租户。
          en: The adversary needs a communication channel, victim context, and data-receiving surface, with some implementations also requiring a persistent persona, trusted account, or hosting tenant.
      defender_model:
        paragraphs:
        - zh: 防守方需要通信、身份、邮箱、表单、授权关系与不可变审计的跨域关联。
          en: Defenders need cross-domain correlation of communication, identity, mailbox, form, authorization-relationship, and immutable-audit data.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 让身份、话术、受信关系和界面接近正常业务, en: Make persona, pretext, trusted relationships, and interfaces resemble normal business}
    analysis:
      paragraphs:
      - zh: 可信语义、真实关系或平台界面替代异常来源与页面特征，降低单事件可区分性。
        en: Plausible semantics, genuine relationships, or platform interfaces replace anomalous origin and page features, reducing per-event distinguishability.
    evidence_keys: [REF-000024, REF-000042, REF-000043]
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary: {zh: 将完整请求分散到多轮与较长时间, en: Distribute the complete request across multiple turns and longer time}
    analysis:
      paragraphs:
      - zh: 敏感度逐步提升使短窗口只见局部低风险消息并提高会话重构成本。
        en: Gradual sensitivity escalation leaves only partial low-risk messages in short windows and raises conversation-reconstruction cost.
    evidence_keys: [REF-000024, REF-000043]
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 抑制邮箱消息与规则证据以降低可观察性, en: Suppress mailbox message and rule evidence to reduce observability}
    analysis:
      paragraphs:
      - zh: 删除、隐藏和规则操纵使普通视图与短期审计无法反映完整诱导会话。
        en: Deletion, hiding, and rule manipulation prevent ordinary views and short-term audit from reflecting the complete elicitation conversation.
    evidence_keys: [REF-000024]
    confidence: medium
proposed_subtechniques:
- resulting_ref: NJS-0036-001
  name: {zh: 情境一致的身份与话术伪装, en: Context-Conforming Persona and Pretext Camouflage}
  stable_variable: semantic_and_persona_consistency
  evidence_keys: [REF-000024, REF-000042, REF-000043]
- resulting_ref: NJS-0036-002
  name: {zh: 渐进式会话诱导, en: Progressive Conversational Elicitation}
  stable_variable: temporal_sensitivity_escalation
  evidence_keys: [REF-000024, REF-000043]
- resulting_ref: NJS-0036-003
  name: {zh: 受信账户与线程寄生, en: Trusted-Account and Thread Parasitism}
  stable_variable: genuine_trusted_identity_or_relationship
  evidence_keys: [REF-000024, REF-000042]
- resulting_ref: NJS-0036-004
  name: {zh: 邮箱侧诱导痕迹抑制, en: Mailbox-Side Solicitation Trace Suppression}
  stable_variable: mailbox_evidence_visibility_and_integrity
  evidence_keys: [REF-000024]
- resulting_ref: NJS-0036-005
  name: {zh: 可信界面与托管表面借用, en: Trusted Interface and Hosting-Surface Borrowing}
  stable_variable: hosting_tenant_and_interface_appearance
  evidence_keys: [REF-000042]
