research:
  limitations:
    paragraphs:
    - zh: 渠道遥测差异大，邮箱痕迹抑制的公开案例证据弱于情境与托管界面，因此保持中等置信度。
      en: Channel telemetry varies widely, and public case evidence for mailbox trace suppression is weaker than for contextual and hosting-interface camouflage, so confidence remains medium.
