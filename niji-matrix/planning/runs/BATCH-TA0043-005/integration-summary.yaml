review_notes_zh: 五项候选已完成既有 retain/adapt 决策复核、YAML-only 2.0 父子字段重写、跨技术分类收敛、共享库查重与对象治理、父级自包含 NJS 编号、双语证据映射、DET→NJA 与 MIT 应用建模、完整质量门禁、五个 Bundle 构建和双语 Web 数据审查。T1598 将旧版受信账户线程寄生与痕迹抑制拆为两个独立子技术。所有正式对象保持 review，等待人工领域审查；TA0043 仍有 T1681 与 T1682 的非排除旧包待 YAML-only 2.0 重开发。
review_notes_en: The five candidates completed review of their existing retain or adapt decisions, YAML-only 2.0 parent and child authoring, cross-technique taxonomy convergence, shared-library deduplication and governance, parent-scoped NJS allocation, bilingual evidence mapping, DET-to-NJA and Mitigation application modeling, the complete quality gate, construction of five bundles, and bilingual Web data review. T1598 splits the former combined trusted-account thread parasitism and trace-suppression child into two independent children. All canonical objects remain in review pending human domain review; TA0043 still has non-excluded T1681 and T1682 legacy packages awaiting YAML-only 2.0 redevelopment.
