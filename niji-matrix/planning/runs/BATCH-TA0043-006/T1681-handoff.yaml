batch_ref: BATCH-TA0043-006
work_item_ref: WORK-TA0043-T1681
temporary_key_prefix: B43R6-T1681
candidate:
  source_type: attack
  source_attack_id: T1681
  name: {zh: 搜索威胁厂商数据, en: Search Threat Vendor Data}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 自身或同业暴露反馈与后续特征或资源调整形成独立闭环，公开事件同时支持披露后轮换和候选声誉门控，因此保留。
      en: Self- or peer-exposure feedback and subsequent feature or resource adjustment form an independent loop, and public incidents support both post-disclosure rotation and candidate-reputation gating, so retention is justified.
proposed_content:
  summary: {zh: 搜索自身或同业威胁暴露并据此轮换特征或门控资源。, en: Search self or peer threat exposure and use it to rotate features or gate resources.}
  definition_and_concept:
    paragraphs:
    - zh: 直接对象是攻击者暴露、检测、归因和声誉反馈，不是受害者数据或一般安全知识。
      en: The immediate object is feedback on adversary exposure, detection, attribution, and reputation rather than victim data or general security knowledge.
  stealth_characteristics:
    paragraphs:
    - zh: 反馈获取位于提供方，后续实体脱离静态指标和历史声誉，但仍保留平台日志与跨时间谱系。
      en: Feedback acquisition occurs at providers and follow-on entities escape static indicators and historical reputation while retaining platform logs and longitudinal lineage.
  scope_boundary_definition:
    paragraphs:
    - zh: 只有反馈获取、暴露判断和行动调整闭环纳入；受害者数据按 NJT-0032 至 NJT-0035 分类。
      en: Only a feedback-acquisition, exposure-assessment, and operational-adjustment loop is included; victim data follows NJT-0032 through NJT-0035.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于报告发布后轮换 IOC，以及部署前后查询候选域名和基础设施声誉。
        en: Used to rotate IOCs after reporting and query candidate domain or infrastructure reputation around deployment.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要威胁平台访问、暴露归属判断和可替换资源，并受平台审计与谱系限制。
          en: The adversary needs threat-platform access, exposure attribution, and replaceable resources and is constrained by provider audit and lineage.
      defender_model:
        paragraphs:
        - zh: 受害方依赖披露与后续变化，平台方可观察账户、查询与声誉结果。
          en: Victims depend on disclosure and downstream change, while providers can observe accounts, queries, and reputation results.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 让当前实体脱离已知指标与历史声誉, en: Make current entities diverge from known indicators and historical reputation}
    analysis:
      paragraphs:
      - zh: 反馈驱动的替换或筛选使精确匹配失效，防守必须使用行为和谱系。
        en: Feedback-driven replacement or screening defeats exact matches and forces defense to use behavior and lineage.
    evidence_keys: [REF-000048, REF-000053, REF-000054]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 将反馈查询置于威胁情报提供方, en: Place feedback queries at threat-intelligence providers}
    analysis:
      paragraphs:
      - zh: 目标无法直接观察攻击者获知哪些检测信息，服务商仍保留集中可见性。
        en: Victims cannot directly observe which detection information the adversary learned, while providers retain concentrated visibility.
    evidence_keys: [REF-000048, REF-000054, REF-000055]
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary: {zh: 以快速轮换形成跨时间短寿命片段, en: Create short-lived fragments across time through rapid rotation}
    analysis:
      paragraphs:
      - zh: 新旧指标拆分同一行动，提高长期谱系重构成本。
        en: Old and new indicators split one operation and increase long-term lineage-reconstruction cost.
    evidence_keys: [REF-000053, REF-000054]
    confidence: medium
