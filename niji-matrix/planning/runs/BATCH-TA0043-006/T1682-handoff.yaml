handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0043-006
work_item_ref: WORK-TA0043-T1682
temporary_key_prefix: B43R6-T1682
candidate:
  source_type: attack
  source_attack_id: T1682
  name: {zh: 查询公共 AI 服务, en: Query Public AI Services}
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 威胁主体确实通过公共 AI 研究目标，但只有实质语义中介和查询替代改变痕迹，因此适配为公共 AI 中介侦查。
      en: Threat actors do research targets through public AI, but only material semantic mediation and query substitution change traces, so adaptation to Public-AI-Mediated Reconnaissance is justified.
proposed_content:
  summary: {zh: 让公共 AI 实质综合公开材料并替代直接或逐源查询。, en: Have public AI materially synthesize public material and replace direct or source-by-source queries.}
  definition_and_concept:
    paragraphs:
    - zh: AI 必须产生新综合、推断或转换并减少原始访问，通用写作和简单链接返回排除。
      en: AI must produce new synthesis, inference, or transformation and reduce original access, excluding generic writing and simple link return.
  stealth_characteristics:
    paragraphs:
    - zh: 实际消费者痕迹迁移到服务商提示、响应和工具调用，受害方可见性下降但平台检测机会增加。
      en: Actual-consumer traces move into provider prompts, responses, and tool calls, reducing victim visibility while increasing platform detection opportunity.
  scope_boundary_definition:
    paragraphs:
    - zh: 输出信息仍归 NJT-0032 至 NJT-0035，直接开放内容、受害者网站和信息诱导分别归 NJT-0037、NJT-0038 和 NJT-0036。
      en: Output information remains under NJT-0032 through NJT-0035, while direct open content, victim sites, and information elicitation belong to NJT-0037, NJT-0038, and NJT-0036 respectively.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 用于人员与邮箱列表、组织伙伴、目标技术、公开漏洞和攻击面优先级综合。
        en: Used for synthesis of people and email lists, organizational partners, victim technologies, public vulnerabilities, and attack-surface priorities.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要公共 AI 访问和可直接使用输出，受平台检测、模型错误和核验需求限制。
          en: The adversary needs public-AI access and capability to use output directly and is constrained by provider detection, model error, and verification needs.
      defender_model:
        paragraphs:
        - zh: 受害方缺少提示日志，服务商可能拥有账户、内容、分类器和工具调用的集中视角。
          en: Victims lack prompt logs, while providers may have a concentrated account, content, classifier, and tool-invocation vantage.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 将实际消费者多源访问替换为服务商交互, en: Replace actual-consumer multisource visits with provider interactions}
    analysis:
      paragraphs:
      - zh: 公共 AI 模型与工具代替攻击者访问多个来源，使检测视角从受害方迁移到平台。
        en: Public-AI models and tools visit or synthesize multiple sources for the adversary, moving detection from victims to the platform.
    evidence_keys: [REF-000041, REF-000043, REF-000049, REF-000056]
    confidence: medium
