research:
  limitations:
    paragraphs:
    - zh: 公开报告无法量化原始查询减少量，不同服务日志不可泛化，提示伪装、匿名账户和私有模型继续延期或排除。
      en: Public reporting cannot quantify reduced original queries, service logging cannot be generalized, and prompt disguise, anonymous accounts, and private models remain deferred or excluded.
  rejected_mechanisms: [NM-DO, NM-FD, NM-ST]
  open_questions: []
