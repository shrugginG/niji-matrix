type: technique-research-handoff
batch_ref: BATCH-TA0112-001
work_item_ref: WORK-TA0112-T1685
temporary_key_prefix: DI01-T1685
candidate:
  source_type: attack
  source_attack_id: T1685
  name: {zh: 禁用或修改工具, en: Disable or Modify Tools}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 固定 ATT&CK 19.1 父项直接描述攻击者停止、降级、篡改或阻断安全工具、传感器、日志代理和更新能力，从而降低防御预防、检测和响应效力。BlackByte 对 Defender 排除范围与安全进程的修改、CLEANPULSE 对日志处理路径的条件化跳过、PHASEJAM 对升级结果的伪造反馈和 Scattered Spider 对传感器例程的内核级篡改尝试共同证明该行为具有稳定的防御削弱对象、残余痕迹与匿迹因果链，因此保留父语义。
        en: The fixed ATT&CK 19.1 parent directly describes adversary stopping, degradation, tampering, or blocking of security tools, sensors, logging agents, and update capability to reduce prevention, detection, and response effectiveness. BlackByte changes to Defender exclusion scope and security processes, CLEANPULSE conditional skipping in a log-handling path, PHASEJAM false upgrade feedback, and Scattered Spider's attempted kernel-level sensor-routine tampering jointly establish a stable impairment object, residual traces, and stealth causality, supporting retention of the parent semantics.
proposed_content:
  summary:
    zh: 攻击者使防御工具或其观察与反馈链停止、缩小、静默或错误报告健康，以降低安全控制覆盖并制造难以确认的观察缺口。
    en: Adversaries stop, narrow, silence, or falsely report the health of defensive tools and their observation chains to reduce control coverage and create difficult-to-verify visibility gaps.
  definition_and_concept:
    paragraphs:
      - zh: 防御工具功能削弱是攻击者直接改变安全工具、传感器、日志组件、分析代理、响应功能或其更新恢复路径，使原本应执行的预防、采集、判断、告警或处置能力全部或部分失效。直接目标是改变防守能力本身，而不是仅隐藏某个普通工件或使用某种系统管理介质。
        en: Defensive Tool Function Impairment is adversary-directed change to a security tool, sensor, logging component, analytic agent, response function, or its update and recovery path so an expected prevention, collection, decision, alerting, or response capability fails wholly or partially. The immediate object is the defensive capability itself rather than merely hiding an ordinary artifact or using a particular administration medium.
      - zh: 概念锚由变更前应有能力、攻击者控制的变更、受损范围、实际结果与残余观察构成。停止服务、修改注册表、加载驱动、调用云 API 或替换界面代码只是实现；只有它们直接改变安全控制能力或可信反馈时才属于本技术。
        en: The concept is anchored in expected pre-change capability, an adversary-controlled change, impaired scope, actual result, and residual observation. Stopping a service, editing the Registry, loading a driver, calling a cloud API, or replacing interface code are implementations and enter scope only when they directly alter a security control or its trustworthy feedback.
  stealth_characteristics:
    paragraphs:
      - zh: 该技术改变防守方本应获得的检测结果、事件序列、覆盖范围或健康反馈，使后续恶意活动在更少告警、更少遥测或错误健康状态下进行。最隐蔽的实现不一定关闭整个产品，而是让工具继续运行、报到或显示正常，同时只遗漏攻击者选择的对象和事件。
        en: This technique changes the detection results, event sequence, protection scope, or health feedback defenders should receive, allowing follow-on malicious activity to proceed with fewer alerts, less telemetry, or false healthy state. The stealthiest implementation need not stop an entire product; it can leave the tool running, checking in, or appearing normal while omitting only adversary-selected objects and events.
      - zh: 残余痕迹包括权限主体、服务与进程状态变化、配置前后态、排除项、更新版本停滞、心跳中断、预期事件量断点、控制面操作和报告状态与真实结果不一致。独立控制面、远程追加式日志、完整性度量和功能性 canary 能缩小盲区；若这些观察与工具处于同一受损信任域，匿迹效果会显著增强。
        en: Residual traces include acting principal, service and process state changes, configuration before and after state, exclusions, stalled update versions, missing heartbeats, breaks in expected event volume, control-plane operations, and disagreement between reported state and real outcome. Independent control planes, remote append-oriented logs, integrity measurements, and functional canaries reduce the blind spot; stealth increases sharply when these observations share the compromised trust domain with the tool.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入针对安全工具可用性、保护范围、遥测生成或输送、操作员健康视图和更新恢复功能的攻击者受控变更。判定必须证明目标具有防御职责、变更由攻击者控制、至少一项预期能力实际受损，并说明防守观察如何减少或失真。
        en: Scope includes adversary-controlled changes to security-tool availability, protection scope, telemetry generation or delivery, operator health views, and update or recovery functions. Classification requires evidence that the target has a defensive role, the adversary controls the change, at least one expected capability is actually impaired, and defender observation is reduced or distorted.
      - zh: 防火墙策略归 T1686；事后删除已写入日志、文件或关系归 NJT-0112；不改变防御能力的普通服务管理、注册表编辑、软件卸载和维护升级排除。故障、资源耗尽、许可证到期、兼容性问题、合法调优和批准的留存策略即使造成相同缺口，也不能在缺少攻击者控制证据时归入。
        en: Firewall policy belongs to T1686, and post-hoc deletion of already stored logs, files, or relationships belongs to NJT-0112. Ordinary service management, Registry editing, software removal, and maintenance upgrades that do not impair a defense are excluded. Failures, resource exhaustion, license expiry, compatibility defects, legitimate tuning, and approved retention policy can produce similar gaps and cannot be classified without adversary-control evidence.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者常在投放载荷、横向移动、凭据操作、勒索加密或撤离前削弱端点、防病毒、审计、云监控、网络设备日志或完整性检查。动作可以面向单主机、设备、租户集成或集中管理服务，并可在后续活动开始前建立一个已知盲区。
          en: Adversaries commonly impair endpoint, antivirus, audit, cloud-monitoring, network-device logging, or integrity-checking functions before payload delivery, lateral movement, credential operations, ransomware encryption, or withdrawal. The action may target one host, appliance, tenant integration, or centralized management service and establish a known blind interval before follow-on activity begins.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要足以控制防御进程、服务、驱动、配置、策略、API、代理或界面的本地或控制面权限，并知道哪些能力、范围或状态会暴露后续行为。其约束包括篡改保护、签名与完整性检查、独立管理权限、远程日志副本、自动恢复以及过度停用产生的明显心跳缺口。
            en: The adversary needs local or control-plane authority over defensive processes, services, drivers, configuration, policy, APIs, agents, or interfaces and knowledge of which capability, scope, or status would expose follow-on behavior. Constraints include tamper protection, signing and integrity checks, separate management authority, remote log copies, automatic recovery, and conspicuous heartbeat loss from excessive disablement.
      defender_model:
        paragraphs:
          - zh: 防守方假定能从至少一个与被削弱工具不同权的来源观察配置与服务状态、资产活动、代理心跳、事件计数、策略版本或功能测试，并把这些信息按资产、工具实例、版本、主体和时间关联。只看同一产品的本地 UI、当前配置或缺失事件时，无法区分攻击、正常维护和传感器故障。
            en: The defender is assumed to observe configuration and service state, asset activity, agent heartbeat, event counts, policy version, or functional tests from at least one authority distinct from the impaired tool and correlate them by asset, tool instance, version, principal, and time. A defender relying only on the same product's local UI, current configuration, or absent events cannot distinguish attack from maintenance and sensor failure.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 削弱观察链使后续恶意行为不再产生或上送原有防御信号, en: Impair the observation chain so follow-on malicious behavior no longer produces or delivers expected defensive signals}
      analysis:
        paragraphs:
          - zh: 攻击者先停止能力、收缩覆盖或在持久存储前跳过事件，使后续行为与原本应有的告警、扫描结果或日志记录脱钩；痕迹由完整的行为—信号链收缩为状态变化、心跳缺口或独立来源中的后继行为。防守方若无法跨信任域恢复差分，就会把恶意活动当成未发生或正常噪声，形成行为透明。
            en: The adversary first stops a capability, narrows its scope, or skips events before durable storage, decoupling follow-on behavior from the alerts, scan outcomes, or records that should have accompanied it. The trace contracts from a complete behavior-to-signal chain to a state change, heartbeat gap, or follow-on action in an independent source. Without a cross-trust-domain differential, defenders may treat the activity as absent or ordinary noise, producing Behavioral Transparency.
      evidence_keys: [DI01-T1685-REF-01, DI01-T1685-REF-02, DI01-T1685-REF-03, REF-000358]
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary: {zh: 伪造健康或成功反馈使受损防御继续呈现正常外观, en: Forge healthy or successful feedback so an impaired defense retains a normal appearance}
      analysis:
        paragraphs:
          - zh: 攻击者把操作员可见的健康、升级或成功状态与真实服务、版本和结果分离，使受损工具在熟悉界面中呈现正常。痕迹变化不是简单缺失，而是两个观察面的矛盾；若防守方信任本地界面且不做独立结果验证，就会延迟调查和恢复，形成特征伪装。
            en: The adversary separates operator-visible health, upgrade, or success state from the real service, version, and outcome so an impaired tool appears normal in a familiar interface. The trace is not merely absent but contradictory across observation planes. Defenders who trust the local interface without independent outcome validation delay investigation and recovery, producing Feature Disguise.
      evidence_keys: [DI01-T1685-REF-04]
      confidence: high
proposed_subtechniques:
  - temporary_key: DI01-T1685-SUB-01
    name: {zh: 防御能力可用性抑制, en: Defensive-Capability Availability Suppression}
    stable_variable: whole defensive capability availability across process service module sensor update or agent lifecycle
    trace_change: expected component and heartbeat disappear or fail persistently while follow-on activity continues
    defender_effect: missing protection is broad but the absence itself becomes a state and continuity signal
    evidence_keys: [DI01-T1685-REF-01, DI01-T1685-REF-02, REF-000358]
    confidence: high
  - temporary_key: DI01-T1685-SUB-02
    name: {zh: 选择性防护范围收缩, en: Selective Protection-Scope Contraction}
    stable_variable: protection or inspection scope while the tool remains operational
    trace_change: exclusions rules providers event classes or target sets omit attacker-selected objects
    defender_effect: coarse health checks pass and only configuration before-after plus affected-object outcomes reveal the blind area
    evidence_keys: [DI01-T1685-REF-01, DI01-T1685-REF-02, DI01-T1685-REF-05]
    confidence: high
  - temporary_key: DI01-T1685-SUB-03
    name: {zh: 入库前遥测抑制, en: Pre-Storage Telemetry Suppression}
    stable_variable: whether selected activity produces and reaches a durable independent event record
    trace_change: expected events are conditionally skipped redirected or dropped before durable storage without a later deletion transaction
    defender_effect: independent activity remains while the security event sequence is selectively absent
    evidence_keys: [DI01-T1685-REF-01, DI01-T1685-REF-03]
    confidence: high
  - temporary_key: DI01-T1685-SUB-04
    name: {zh: 防御健康状态反馈伪造, en: Defensive Health-State Feedback Forgery}
    stable_variable: fidelity between operator-visible tool state and real function version or outcome
    trace_change: familiar UI progress health or success messages remain normal while independent state does not advance or function
    defender_effect: investigation is delayed unless status is challenged with an independent state or canary outcome
    evidence_keys: [DI01-T1685-REF-01, DI01-T1685-REF-04]
    confidence: high
