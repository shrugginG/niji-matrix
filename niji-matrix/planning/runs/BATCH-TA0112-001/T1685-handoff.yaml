    second_pass_required: true
    second_pass_completed: true
    proposed_niji_child_count: 4
    breadth_gap_explained: true
    reviewer_notes:
      zh: 六项 ATT&CK 子项按平台和日志生命周期实现展开；四项正式 Niji 轴按能力可用性、覆盖范围、持久存储前事件存在性和报告状态保真度划分。已存历史擦除归 NJT-0112，平台与工具名不成为子项。
      en: The six ATT&CK children partition platform and log-lifecycle implementations, while the four formal Niji axes partition capability availability, protection scope, event existence before durable storage, and reported-state fidelity. Stored-history erasure belongs to NJT-0112, and platform or product names do not define children.
  evidence_coverage:
    parent_behavior_keys: [DI01-T1685-REF-01, DI01-T1685-REF-02, DI01-T1685-REF-03, DI01-T1685-REF-04, REF-000358]
    boundary_keys: [DI01-T1685-REF-01, DI01-T1685-REF-03]
    mechanism_support:
      - {mechanism_ref: NM-BT, evidence_keys: [DI01-T1685-REF-02, DI01-T1685-REF-03, REF-000358]}
      - {mechanism_ref: NM-FD, evidence_keys: [DI01-T1685-REF-04]}
    child_existence_support:
      - {child_key: DI01-T1685-SUB-01, evidence_keys: [DI01-T1685-REF-02, REF-000358]}
      - {child_key: DI01-T1685-SUB-02, evidence_keys: [DI01-T1685-REF-02, DI01-T1685-REF-05]}
      - {child_key: DI01-T1685-SUB-03, evidence_keys: [DI01-T1685-REF-03]}
      - {child_key: DI01-T1685-SUB-04, evidence_keys: [DI01-T1685-REF-04]}
    unsupported_or_deferred: [product-specific and platform-specific child partitions, update blocking as a fifth child without a distinct residue, post-storage clearing as a TA0112 child because NJT-0112 owns that object]
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级和四个子项将在正式写入时分别展开直接对象、残余痕迹、正常反例、权限前提、观察信任域和恢复限制；不复用主动扫描或其他批次的威胁模型与限制段落。
      en: Canonical writing will separately develop the direct object, residual trace, normal counterexamples, authority prerequisites, observation trust domain, and recovery limits for the parent and four children without reusing Active Scanning or another batch's threat model and limitations.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [ID allocation, YAML serialization, field-order checking, validation, bundle construction]
  limitations:
    paragraphs:
      - zh: 三个直接案例分别证明范围收缩与工具停止、日志处理路径条件化跳过和界面—真实升级结果分离；它们不能证明所有产品都能以相同方式受损。Scattered Spider 来源记录的是被阻止的内核传感器篡改尝试，支持攻击意图和控制面，但不能当作成功失明结果。检测阈值与心跳周期必须按产品和环境校准，缺失遥测本身不能证明攻击者控制。
        en: The three direct cases respectively establish scope contraction plus tool stopping, conditional skipping in a log-handling path, and separation of interface feedback from real upgrade outcome; they do not establish identical impairment across every product. The Scattered Spider source records a prevented kernel sensor-tampering attempt and supports intent and control surface, but not a completed blind outcome. Detection thresholds and heartbeat periods require product and environment calibration, and missing telemetry alone does not prove adversary control.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: the dominant effect is loss of behavior-to-signal linkage rather than making retained content less inspectable}
    - {mechanism_ref: NM-ST, reason: time or source distribution is not the controlled variable}
