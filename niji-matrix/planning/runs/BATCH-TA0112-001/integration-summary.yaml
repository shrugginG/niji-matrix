review_notes_zh: T1685 保留为 NJT-0123“防御工具功能削弱”，六项 ATT&CK 子项经覆盖表和第二轮 taxonomy 收敛为四项 Niji 原生变量。BlackByte、CLEANPULSE 与 PHASEJAM 分别直接支持能力/范围、入库前抑制和反馈伪造，Scattered Spider 的被阻止尝试只用于校准内核篡改控制面。新建两套 DET、四个不同数据模型的 NJA 和一个含五项具体 Application 的 MIT；所有机器、Bundle 与 Web 门禁通过，保持 review 等待人工领域评审。TA0112 仅完成 1/18，剩余 17 项。
review_notes_en: T1685 is retained as NJT-0123 Defensive Tool Function Impairment. An explicit coverage table and second taxonomy pass converge the six ATT&CK children into four Niji-native variables. BlackByte, CLEANPULSE, and PHASEJAM directly support capability or scope, pre-storage suppression, and feedback forgery respectively, while the prevented Scattered Spider attempt only calibrates the kernel-tampering control surface. The batch creates two DETs, four NJAs with distinct data models, and one MIT with five specific Applications. All machine, bundle, and Web gates pass; objects remain in review pending human domain review. TA0112 is 1 of 18 complete with 17 remaining.
