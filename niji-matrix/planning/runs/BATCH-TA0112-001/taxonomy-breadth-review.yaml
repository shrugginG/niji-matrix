schema_version: "1.0.0"
type: taxonomy-breadth-review
batch_ref: BATCH-TA0112-001
work_items:
  - work_item_ref: WORK-TA0112-T1685
    attack_baseline: {domain: enterprise-attack, version: "19.1"}
    attack_subtechnique_count: 6
    attack_subtechnique_ids: [T1685.001, T1685.002, T1685.003, T1685.004, T1685.005, T1685.006]
    represented_dimensions:
      - Windows Event Log service and audit-policy impairment
      - cloud audit and monitoring control-plane impairment
      - operator-facing tool interface and health-status manipulation
      - Linux Audit service and rule impairment
      - post-storage Windows event-log erasure
      - post-storage Linux or macOS log erasure
    breadth_trigger: explicit-coverage-table-and-second-pass
    coverage_resolutions:
      - attack_ids: [T1685.001]
        resolution: niji-variable-candidate
        notes: Windows service or audit-policy implementation contributes evidence to complete availability suppression and pre-storage telemetry suppression but the platform is not a child boundary.
      - attack_ids: [T1685.002]
        resolution: niji-variable-candidate
        notes: Cloud logging changes contribute evidence to protection-scope contraction and pre-storage telemetry suppression; control-plane location is an implementation rather than a Niji child.
      - attack_ids: [T1685.003]
        resolution: niji-variable-candidate
        notes: A reported healthy or successful state that diverges from real tool or upgrade state supports defensive health-state feedback forgery.
      - attack_ids: [T1685.004]
        resolution: niji-variable-candidate
        notes: Linux Audit service and rule changes contribute to complete availability and pre-storage suppression; auditd is not inherited as a child.
      - attack_ids: [T1685.005, T1685.006]
        resolution: adjacent-technique
        notes: Events were already recorded and are erased afterward, so the stable object and recovery path belong to NJT-0112 Selective Trace Contraction rather than a duplicate TA0112 child.
    candidate_stealth_axes_examined:
      - axis: defensive-capability-availability-suppression
        disposition: formal-high
        trace_change: an expected security process service module sensor or update function becomes absent stopped unloaded uninstalled or persistently unable to start
        defender_effect: prevention and observation disappear for a broad capability while missing heartbeat or state-change residue becomes the primary remaining signal
      - axis: selective-protection-scope-contraction
        disposition: formal-high
        trace_change: the tool remains running but exclusions rules scan directions providers or protected targets are narrowed around attacker activity
        defender_effect: ordinary health checks can pass while only a chosen payload path extension process tenant resource or event class falls outside protection
      - axis: pre-storage-telemetry-suppression
        disposition: formal-high
        trace_change: expected events are skipped at generation redirected or dropped before reaching a durable independent store
        defender_effect: activity remains visible in an independent action or control plane but the security event sequence has a selective or abrupt gap rather than a later deletion record
      - axis: defensive-health-state-feedback-forgery
        disposition: formal-high
        trace_change: operator-facing UI progress status health or success output is decoupled from the actual service configuration version or outcome
        defender_effect: a local or familiar management view reports normal operation while independent state and behavioral tests show impairment
      - axis: post-storage-history-erasure
        disposition: adjacent-technique
        trace_change: stored event objects disappear or sequences contract after generation
        defender_effect: recovery depends on deletion events sequence gaps replicas and backups and is already owned by NJT-0112
      - axis: update-or-recovery-path-blocking
        disposition: collapsed
        trace_change: expected version or recovery state fails to advance
        defender_effect: pure functional blockage is covered by availability suppression while a false success indication is covered by health-state feedback forgery; version downgrade as the direct object remains for T1689
      - axis: service-stop-versus-process-kill-versus-driver-unload
        disposition: not-stealth-distinct
        trace_change: different implementation objects produce the same whole-capability availability loss
        defender_effect: the same state heartbeat and independent outcome model applies
      - axis: windows-versus-linux-versus-cloud
        disposition: not-stealth-distinct
        trace_change: channels and field names differ but not the controlled observation variable
        defender_effect: platform does not create a stable sibling boundary
    second_pass_required: true
    second_pass_completed: true
    proposed_niji_child_count: 4
    breadth_gap_explained: true
    reviewer_notes_zh: 第二轮先按防御链位置复核“控制能力、覆盖范围、遥测入库、操作员反馈、历史存储和更新恢复”，再按残余痕迹与防御方法合并。四个正式轴分别需要状态/心跳、配置范围差分、独立活动—遥测差分和报告状态—真实结果差分；历史擦除已有 NJT-0112，平台与停止方式没有独立防守观察边界，更新阻断也不会为数量单列。
    reviewer_notes_en: The second pass reviewed control capability, protection scope, pre-storage telemetry, operator feedback, historical storage, and update or recovery position before merging by residue and defensive method. The four formal axes respectively require state and heartbeat, configuration-scope differential, independent activity-to-telemetry differential, and reported-state-to-real-outcome differential. Historical erasure is already owned by NJT-0112, platforms and stop methods do not create independent observation boundaries, and update blocking is not split merely to increase count.
