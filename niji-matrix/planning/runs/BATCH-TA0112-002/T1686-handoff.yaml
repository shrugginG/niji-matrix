handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0112-002
work_item_ref: WORK-TA0112-T1686
temporary_key_prefix: DI02-T1686
candidate: {source_type: attack, source_attack_id: T1686, name: {zh: 禁用或修改系统防火墙, en: Disable or Modify System Firewall}}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 固定基线将攻击者禁用或修改系统防火墙以削弱限制和支持后续行动列入 TA0112。CISA 的 Dragonfly 事件直接记录主机防火墙整体关闭与远程入口开放；BPFDoor 原始分析证明只对攻击者来源进行规则重定向，使可见的常用端口落到隐藏 shell；Mandiant 的 UNC3886 事件证明受限制设备上的条件化重定向和后门访问。它们共同支持保留父级防火墙策略变更，同时要求按有效裁决与真实网络结果而非命令或平台分类。
        en: The fixed baseline places adversary disablement or modification of system firewalls in TA0112 because it weakens restrictions and enables follow-on action. CISA directly recorded broad host-firewall shutdown and remote-entry opening in the Dragonfly activity. Original BPFDoor analysis shows rules redirecting only an adversary source so a visible common port reaches a concealed shell; Mandiant documents conditional redirection and backdoor access on a restricted UNC3886 device. Together these support retaining the parent firewall-policy behavior while classifying by effective decision and real network outcome rather than command or platform.
proposed_content:
  summary: {zh: 攻击者改变防火墙的有效阻断或转发结果，让原本受限的网络路径可通行并降低防守方对真实入口的判断能力。, en: Adversaries change effective firewall blocking or forwarding outcomes so restricted network paths become usable and defenders have a less reliable view of the real entry point.}
  definition_and_concept:
    paragraphs:
      - zh: 本对象是攻击者对主机、网络设备、虚拟化或云边界的系统防火墙有效策略施加受控变化，使原本应拒绝的会话被允许，或让表面目的地与真实接收进程错位。直接目标是削弱网络限制，而不是一般路由、服务启动或连接尝试。
        en: This object is adversary-controlled change to effective system-firewall policy on a host, network device, virtualization layer, or cloud boundary so a session expected to be denied is allowed or the visible destination differs from the real receiving process. Its immediate purpose is to weaken a network restriction rather than perform ordinary routing, service startup, or connection attempts.
  stealth_characteristics:
    paragraphs:
      - zh: 防火墙策略被修改后，阻断事件、有效规则命中、网络可达性和会话谱系发生变化；整个策略关闭会留下明显配置异常，精确例外或重定向则保留大部分正常过滤背景。独立配置审计、前后态快照、流量与进程映射可恢复差异，单看端口或防火墙运行状态可能误判。
        en: After firewall-policy modification, deny events, effective rule hits, reachability, and session lineage change. Whole-policy shutdown leaves a conspicuous configuration anomaly, while precise exceptions or redirection preserve much of the normal filtering background. Independent configuration audit, before-and-after snapshots, traffic, and process mapping can recover the difference; port or firewall-running state alone may mislead.
  scope_boundary_definition:
    paragraphs:
      - zh: 只有攻击者控制的策略变化造成预期 deny 与观察 allow/redirect 之间的正差才纳入。合法变更、故障切换、临时维护和业务放行需要 owner、工单、范围与回滚结果；只停用日志不改变过滤结果归 NJT-0123，单纯隐藏监听归既有隐藏对象。
        en: Scope requires an adversary-controlled policy change with a positive difference between expected deny and observed allow or redirect. Legitimate change, failover, temporary maintenance, and business access require owner, ticket, scope, and rollback outcome. Disabling only logs without changing filtering belongs to NJT-0123, while merely hiding a listener belongs to an existing concealment object.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者通常在建立持久远程入口、部署后门、横向移动或规避新实施的 ACL 后改变防火墙状态，可从单主机扩展至云安全组或设备策略。后续网络结果必须与该策略变化在时间和资产上相连。
          en: Adversaries commonly change firewall state before durable remote access, backdoor use, lateral movement, or evasion of a newly imposed ACL, from one host to cloud security groups or device policy. Follow-on network outcomes must join the policy change by time and asset.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要防火墙管理权限、受侵高权限主机、云角色或设备配置权，并了解策略优先级、NAT 顺序和目标网络；配置审计、不同权管理与独立流量传感器会限制隐蔽性。
            en: The adversary needs firewall administration authority, a compromised privileged host, cloud role, or device configuration right and knowledge of policy precedence, NAT order, and target network. Configuration audit, differently authorized management, and independent traffic sensors constrain stealth.
      defender_model:
        paragraphs:
          - zh: 防守方需保留批准基线、策略版本、规则有效性、变更者、规则命中、阻断与放行流量、NAT 前后目的地及接收进程。只靠防火墙当前规则或单侧 flow logs 无法判定原应拒绝的会话与真实接收者。
            en: Defenders need approved baselines, policy versions, rule effectiveness, writer, rule hits, denied and allowed flows, pre- and post-NAT destination, and receiving process. Current rules or one-sided flow logs alone cannot establish a session that should have been denied or its real receiver.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 减少原应阻断的会话与防火墙拒绝信号, en: Remove expected denies while allowing restricted sessions to pass}
      analysis:
        paragraphs:
          - zh: 攻击者停用策略或增加例外后，受限会话从拒绝转为放行，阻断事件与后继网络行为之间的对应关系消失；精确选择器还保留其他正常拒绝作背景，增加局部缺口识别难度。
            en: After the adversary disables policy or adds an exception, restricted sessions change from denied to allowed and the correspondence between deny events and follow-on network behavior disappears. Precise selectors retain other normal denials as background and make the local gap harder to identify.
      evidence_keys: [DI02-T1686-REF-01, DI02-T1686-REF-02, DI02-T1686-REF-03]
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary: {zh: 将真实后门入口藏在表面合法的网络目的地之后, en: Hide the real backdoor receiver behind an apparently ordinary network destination}
      analysis:
        paragraphs:
          - zh: 选择性重定向让边界传感器看到常用目的端口而实际进程接收高位监听端口，分离了表面网络特征与真实服务；只看单侧五元组时会把后门会话误归于合法服务。
            en: Selective redirection lets a boundary sensor see a common destination port while a different process receives the high-port listener, separating visible network features from the real service. A one-sided five-tuple can misattribute the backdoor session to a legitimate service.
      evidence_keys: [DI02-T1686-REF-03, REF-000155]
      confidence: high
proposed_subtechniques:
  - {temporary_key: DI02-T1686-SUB-01, name: {zh: 广域防火墙姿态压低, en: Broad Firewall Posture Suppression}, stable_variable: breadth of effective enforcement loss, trace_change: whole profile or broad policy moves from deny to allow, defender_effect: large reachability delta with state and deny-count discontinuity, evidence_keys: [DI02-T1686-REF-02], confidence: high}
  - {temporary_key: DI02-T1686-SUB-02, name: {zh: 精确规则例外开口, en: Scoped Rule-Exception Opening}, stable_variable: narrow policy selector added or relaxed, trace_change: only matched source destination protocol or time slice becomes allowed, defender_effect: coarse posture remains normal while a narrow session crosses the boundary, evidence_keys: [DI02-T1686-REF-01, DI02-T1686-REF-03], confidence: medium}
  - {temporary_key: DI02-T1686-SUB-03, name: {zh: 策略路径重定向, en: Policy-Path Redirection}, stable_variable: mapping between visible destination and actual receiving service, trace_change: NAT or filtering rule sends selected apparent ordinary-port traffic to a hidden listener, defender_effect: pre-NAT flow and post-NAT process lineage disagree, evidence_keys: [DI02-T1686-REF-03, REF-000155], confidence: high}
defense_candidates:
  detection_strategies:
    - {temporary_key: DI02-T1686-DET-01, objective: compare approved effective firewall policy with observed rule hits and denied-to-allowed outcomes across versions}
    - {temporary_key: DI02-T1686-DET-02, objective: join pre-NAT visible flow, policy redirect rule, post-NAT destination and receiving process}
  detection_analytics:
    - {temporary_key: DI02-T1686-NJA-01, implementation: profile and rule-set before-after plus flow decision differential}
    - {temporary_key: DI02-T1686-NJA-02, implementation: narrow selector matched first-session and short-lived rollback correlation}
    - {temporary_key: DI02-T1686-NJA-03, implementation: policy redirect to listener and process lineage}
  mitigations:
    - {temporary_key: DI02-T1686-MIT-01, purpose: separate firewall policy authority, require change approval, retain versioned effective state, verify reachability and restore from trusted policy}
