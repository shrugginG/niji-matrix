    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes: {zh: 正式写入需逐项展开流量裁决、策略前后态、正常变更和各自残余痕迹，不能使用 T1685 的工具健康正文。, en: Canonical writing must separately develop flow decision, policy before-and-after state, normal changes, and each residue rather than reuse T1685 tool-health prose.}
  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [ID allocation, validation, bundle]}
  limitations:
    paragraphs:
      - zh: CISA 事件同时记录整体关停与远程入口，BPFDoor 与 TABLEFLIP 更清楚支持定向重定向；通用云安全组审计文档只支持可实施数据源，不证明在野使用。临时规则回滚是同一变量的寿命变化，除非出现独立观察效果不单列。
        en: The CISA case records broad shutdown and a remote entry together, while BPFDoor and TABLEFLIP more clearly support targeted redirection. Generic cloud security-group audit documentation supports implementable data sources but not observed malicious use. Temporary rollback changes the lifetime of the same variable and is not split without an independent observation effect.
  rejected_mechanisms: [{mechanism_ref: NM-DO, reason: retained packets are not made less inspectable by the firewall change}, {mechanism_ref: NM-ST, reason: neither time nor source distribution is the primary controlled variable}]
