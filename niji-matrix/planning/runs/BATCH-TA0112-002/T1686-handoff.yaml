    reviewer_notes: {zh: 三个 Niji 变量的观察边界分别是状态、精确规则命中和 NAT 前后进程映射。, en: The three Niji variables have distinct state, narrow rule-hit, and pre/post-NAT process-mapping observation boundaries.}
