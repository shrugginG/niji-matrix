review_notes_zh: T1686 保留为防火墙策略削弱；三项 ATT&CK 平台子项经多轴审查收敛为广域姿态压低、精确规则例外和策略路径重定向。CISA Dragonfly 支持广域关停，Sandfly BPFDoor 与 Mandiant TABLEFLIP 分别支持来源限定重定向；云/Windows 官方文档只支持数据要求。两套 DET、三项各自可实施的 NJA 与含四项具体应用的 MIT 通过质量、Bundle 和 Web 门禁。保持 review，等待人工领域评审；TA0112 完成 2/18。
review_notes_en: T1686 is retained as Firewall Policy Impairment. Multi-axis review of three platform-defined ATT&CK children converged on broad posture suppression, scoped rule exception, and policy-path redirection. CISA Dragonfly supports broad shutdown; Sandfly BPFDoor and Mandiant TABLEFLIP support source-limited redirection, while official cloud and Windows documentation supports data requirements only. Two DETs, three implementable NJAs, and one MIT with four specific applications passed quality, bundle, and Web gates. Objects remain in review pending human domain review; TA0112 is 2 of 18 complete.
