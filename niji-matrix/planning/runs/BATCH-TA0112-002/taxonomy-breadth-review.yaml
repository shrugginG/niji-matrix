batch_ref: BATCH-TA0112-002
work_items:
  - work_item_ref: WORK-TA0112-T1686
    attack_baseline: {domain: enterprise-attack, version: "19.1"}
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1686.001, T1686.002, T1686.003]
    represented_dimensions: [cloud security groups and virtual firewalls, network-device ACL and zone policy, host firewall profile and rule state]
    breadth_trigger: multi-axis-review
    coverage_resolutions:
      - {attack_ids: [T1686.001], resolution: niji-variable-candidate, notes: Cloud rule audit and effective security-group reachability inform broad posture and selective exception variables; cloud is not a child boundary.}
      - {attack_ids: [T1686.002], resolution: niji-variable-candidate, notes: Network-device ACL and NAT changes inform selective exception and redirection variables; device type is not a child boundary.}
      - {attack_ids: [T1686.003], resolution: niji-variable-candidate, notes: Windows profile-disable and rule-add behavior informs broad posture and selective exception variables; Windows is not inherited as a child.}
    candidate_stealth_axes_examined:
      - {axis: broad-firewall-posture-suppression, disposition: formal, trace_change: profile or policy enforcement changes from active to inactive for a broad traffic set, defender_effect: large deny-to-allow delta with conspicuous state change and missing block outcomes}
      - {axis: scoped-rule-exception, disposition: formal, trace_change: one source destination protocol service or time-bounded selector becomes allowed while surrounding denials remain, defender_effect: coarse firewall-health checks pass and only effective-policy plus session matching exposes the pinhole}
      - {axis: policy-path-redirection, disposition: formal, trace_change: accepted public destination is transparently redirected by NAT or filtering to a concealed listener, defender_effect: edge five-tuple and actual process destination disagree and path reconstruction requires rule-hit and post-NAT lineage}
      - {axis: temporary-opening-and-reversion, disposition: collapsed, trace_change: short-lived rule or profile change returns to prior state after use, defender_effect: lifetime changes detection window but not the direct policy variable; include temporal correlation in each analytic rather than make another child}
      - {axis: cloud-versus-device-versus-host, disposition: not-stealth-distinct, trace_change: audit channels and APIs differ, defender_effect: deployment plane does not alter the stable observation question}
      - {axis: firewall-logging-disablement-only, disposition: adjacent-technique, trace_change: enforcement unchanged but flow logs disappear, defender_effect: NJT-0123 telemetry chain owns the direct impairment}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes_zh: 三项 ATT&CK 子项只说明云、网络设备和主机的配置面；Niji 三项分别按有效策略的广度、选择器范围和可见目的地到真实接收者的路径错位划分，产生不同的状态、规则命中与 NAT 后进程观察要求。临时开口是生命周期叠加变量，不强制独立子项。
    reviewer_notes_en: The three ATT&CK children describe cloud, network-device, and host configuration planes only. Three Niji children partition breadth of effective-policy loss, selector scope, and mismatch between visible destination and actual receiver, producing different state, rule-hit, and post-NAT process observation requirements. A temporary opening is a lifecycle overlay rather than a forced separate child.
