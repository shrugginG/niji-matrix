candidate: {source_type: attack, source_attack_id: T1484, name: {zh: 域或租户策略修改, en: Domain or Tenant Policy Modification}}
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
      - zh: T1484 的固定父语义覆盖域/租户策略与信任修改，但 TA0112 仅保留权威防御设置经集中发布和目标消费后实际削弱安全控制的分支。Microsoft 2026 事件直接观察到攻击者构造 Defender 篡改 GPO，却被防守机制阻断；因此其攻击意图与控制面痕迹为高置信，成功防御损伤不得由该事件宣称。已有 NJT-0100 只处理权限增加，身份认证与账户授权也各有 owner，故新父对象需明确收窄而不能跨战术复用旧结论。
        en: Fixed T1484 semantics cover domain or tenant policy and trust changes, but TA0112 retains only the branch where an authoritative defensive setting is centrally published, consumed by targets, and actually weakens a security control. Microsoft's 2026 incident directly observed an adversary constructing a Defender-tampering GPO, but defenders blocked it; attack intent and control-plane traces are high confidence while completed defensive damage cannot be claimed from that case. Existing NJT-0100 addresses added authority only, and authentication and account authorization have other owners, so a new parent must narrow scope rather than reuse the old conclusion across tactics.
proposed_content:
  summary: {zh: 攻击者借域或租户权威策略向多个消费者发布防御削弱设置，使控制面写入与端点实际失防分离。, en: Adversaries publish defense-weakening settings through authoritative domain or tenant policy to many consumers, separating the control-plane write from actual endpoint protection loss.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是中心策略版本对安全控制的生效结果，必须有 writer、版本、作用域、consumer 与实际防御状态；GPO、trust 和平台只是载体。, en: The direct object is the effective security-control outcome of a central policy version, requiring writer, version, scope, consumer, and real defensive state; GPO, trust, and platform are carriers.}]}
  stealth_characteristics: {paragraphs: [{zh: 一个写入可由受信客户端扇出，端点显示正常策略应用而原始攻击者在控制面；版本和 consumer 关联可恢复来源，篡改保护可使表面成功却未损伤防御。, en: One write can fan out through trusted clients, leaving ordinary policy application at endpoints while the adversary remains on the control plane; version-to-consumer correlation restores provenance, and tamper protection may make apparent application fail to impair the defense.}]}
  scope_boundary_definition: {paragraphs: [{zh: 只纳入实际使安全工具、审计或响应策略降低覆盖的集中版本；纯权限增加归 NJT-0100，策略触发的任务与载荷执行归对应 owner，正常发布与域迁移排除。, en: Include only central versions that actually reduce security-tool, audit, or response-policy coverage; added authority belongs to NJT-0100, policy-triggered tasks and payload execution to their owners, and normal rollout or domain migration is excluded.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者在勒索或横向活动前利用委派 GPO/租户策略写权发布安全设置，等待设备或服务刷新后才开展后继行动。, en: Before ransomware or lateral activity, an adversary uses delegated GPO or tenant-policy write authority to publish security settings and waits for devices or services to refresh before follow-on action.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要策略或作用域写权、版本与优先级知识及传播时间；受管配置、审批与篡改保护可阻止实际损伤。, en: The adversary needs policy or scope write authority, version and precedence knowledge, and propagation time; managed configuration, approval, and tamper protection can block actual impairment.}]}
      defender_model: {paragraphs: [{zh: 需独立保存 AD/SYSVOL 或租户策略前后态、目标作用域、实际 consumer 版本和工具保护结果，不能只凭 GPO 创建或客户端刷新定性。, en: Defenders independently retain AD and SYSVOL or tenant-policy before-and-after state, target scope, consumed version, and real tool-protection outcome; GPO creation or client refresh alone is insufficient.}]}
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 中心策略写入借可信传播隐藏攻击者与端点防御缺口的直接关系, en: A central policy write uses trusted propagation to separate the adversary from the endpoint defensive gap}
      analysis: {paragraphs: [{zh: 攻击者在控制面发布恶意防御设置，受信消费者后续应用，使原始 writer 与失去防护的端点分属不同日志；只有版本、作用域、consumer 和功能结果闭合才可证明因果。, en: The adversary publishes malicious defensive settings on a control plane and trusted consumers apply them later, placing the original writer and unprotected endpoint in separate logs; only version, scope, consumer, and functional outcome close the causal chain.}]}
      evidence_keys: [REF-000338, REF-000341, REF-000344]
      confidence: medium
