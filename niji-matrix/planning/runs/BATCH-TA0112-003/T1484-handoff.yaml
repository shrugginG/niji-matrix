  limitations: {paragraphs: [{zh: 公开 GPO 案例的主要防御损伤被阻断；不能把策略发布、设备刷新或命令返回视为实际失防。信任修改若主要改变认证和权限则由相邻对象拥有。, en: The main defensive impairment in the public GPO case was blocked; policy publication, device refresh, or a successful command return cannot substitute for actual protection loss. Trust changes whose main effect is authentication or authority belong to adjacent objects.}]}
