  limitations: {paragraphs: [{zh: 官方云文档证明层级迁离与控制继承效果，Peach Sandstorm 报告证明恶意新订阅使用但未给出完整防御覆盖差。现场需要全局节点清单、组织 trail 和首个操作结果；缺失任一层应降置信度。, en: Official cloud documents establish departure and inherited-control effects, while Peach Sandstorm reporting establishes malicious new-subscription use but not a complete defensive-coverage differential. Local assessment needs global node inventory, organization trail, and first-operation outcome; missing a layer lowers confidence.}]}
