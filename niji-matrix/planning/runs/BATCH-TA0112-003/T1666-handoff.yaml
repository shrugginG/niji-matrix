candidate: {source_type: attack, source_attack_id: T1666, name: {zh: 修改云资源层级, en: Modify Cloud Resource Hierarchy}}
recommendation:
  decision: adapt
  confidence: medium
  rationale: {paragraphs: [{zh: ATT&CK 固定父项描述改变云账户、订阅、项目与组织单元层级以规避防御。AWS 官方文档直接说明账户离开组织后组织 trail 不再为其记录新事件，Google Cloud 文档说明项目换父节点立即改变继承策略；Microsoft 观察 Peach Sandstorm 新建订阅并用于活动，但未证明其具体控制缺失。因此 Niji 适配为“层级造成的防御覆盖位移”，只在 ancestry 变化与日志、guardrail 或检测覆盖正差得到证明时纳入。, en: The fixed ATT&CK parent describes changing cloud account, subscription, project, and organizational-unit hierarchy to evade defenses. AWS documentation directly states that an account leaving an organization no longer produces new events in its organization trail, and Google Cloud documentation states that moving a project changes inherited policy immediately. Microsoft observed Peach Sandstorm create subscriptions and use them operationally but did not prove specific missing controls. Niji therefore adapts the object to defensive coverage displacement by hierarchy and includes it only when ancestry change and a positive difference in logging, guardrails, or detection coverage are established.}]}
proposed_content:
  summary: {zh: 攻击者迁移或新建云资源层级节点，使继承的安全控制和集中观察不再覆盖真实工作负载。, en: Adversaries move or create cloud-hierarchy nodes so inherited security controls and centralized observation cease to cover the real workload.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是资源的 parent/ancestor 关系及由此决定的有效控制，不是策略文本、计算实例本身或账单名称。, en: The direct object is the resource parent and ancestor relationship and its effective controls, not policy text, a compute instance itself, or a billing label.}]}
  stealth_characteristics: {paragraphs: [{zh: 节点仍可正常运行或计费，中心审计和检测的覆盖集合却因 ancestry 改变而收缩；管理账户中的成员事件、项目移动记录和目的组织的新日志仍是残余。, en: A node can continue operating or billing normally while central audit and detection coverage contracts after ancestry changes; membership events, project-move records, and destination-organization logs remain as residue.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入现有节点迁离或新节点在控制注册前承载攻击活动，且实际失去继承日志/guardrail；仅创建、迁移或账单重排无防御差异时排除，改写策略内容归 T1484。, en: Include an existing node leaving governance or a new node carrying adversary activity before control enrollment when inherited logging or guardrails actually disappear. Creation, migration, or billing reorder without a defensive difference is excluded; policy-content edits belong to T1484.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者取得组织管理或订阅创建权限后，在既有资源迁移或新订阅承载 C2 与计算活动时利用集中观察缺口。, en: After obtaining organization management or subscription-creation rights, an adversary exploits a central-visibility gap when moving existing resources or using a new subscription for C2 and compute activity.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要成员离开、资源移动或新节点创建权和对继承策略/注册延迟的了解；保护性 SCP、转移阻断和组织外独立库存会限制效果。, en: The adversary needs membership-departure, resource-move, or node-creation authority and knowledge of inherited policy and enrollment delay; protective SCPs, transfer blocks, and out-of-organization inventory constrain the effect.}]}
      defender_model: {paragraphs: [{zh: 需在管理账户/租户保存全局 ancestry、成员事件、策略继承、集中 trail/enrollment 和首个资源操作，避免只依赖原组织的单一日志。, en: Defenders need global ancestry, membership events, policy inheritance, central trail or enrollment, and first resource action in the management account or tenant rather than relying on one log in the original organization.}]}
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 通过层级变更使活动脱离原集中防御观察域, en: Move activity out of the original centralized defensive observation domain through hierarchy change}
      analysis: {paragraphs: [{zh: 攻击者改变 parent 边，原组织的日志和策略不再覆盖相同资源，而工作负载可继续；防守方若只查旧层级，会把后续活动视为消失，须用成员事件和跨组织资源身份恢复链路。, en: The adversary changes a parent edge so the original organization's logs and policies no longer cover the same resource while the workload can continue; defenders checking only the old hierarchy see follow-on activity disappear and need membership events plus cross-organization resource identity to recover the chain.}]}
      evidence_keys: [DI03-T1666-REF-01, DI03-T1666-REF-02, DI03-T1666-REF-03, DI03-T1666-REF-05]
      confidence: medium
proposed_subtechniques:
  - {temporary_key: DI03-T1666-SUB-01, name: {zh: 既有资源治理迁离, en: Existing-Resource Governance Departure}, stable_variable: existing node changes ancestor or leaves organization, trace_change: previous central trail and inherited guardrail stop for same stable resource identity, defender_effect: continuity gap across membership transition, evidence_keys: [DI03-T1666-REF-02, DI03-T1666-REF-03, DI03-T1666-REF-05], confidence: medium}
  - {temporary_key: DI03-T1666-SUB-02, name: {zh: 新节点先于治理注册运行, en: New-Node Pre-Enrollment Operation}, stable_variable: first workload action occurs before required governance enrollment, trace_change: new account or subscription activity starts outside expected central sensor inventory, defender_effect: no historical local baseline and first-use gap, evidence_keys: [DI03-T1666-REF-01, DI03-T1666-REF-04, DI03-T1666-REF-06], confidence: medium}
defense_candidates:
  detection_strategies: [{temporary_key: DI03-T1666-DET-01, objective: global hierarchy version to inherited controls and first workload action}]
  detection_analytics: [{temporary_key: DI03-T1666-NJA-01, implementation: existing node departure to org trail or control loss}, {temporary_key: DI03-T1666-NJA-02, implementation: new node creation to enrollment and first workload activity}]
  mitigations: [{temporary_key: DI03-T1666-MIT-01, purpose: protect hierarchy authority enforce inherited baselines at enrollment and retain global membership evidence}]
