  content_depth_review: {compared_with_njt_0001: true, field_responsibilities_complete: true, candidate_specific_prose: true, repeated_prose_reviewed: true, notes: {zh: 正式父子项必须区分资源身份不变的迁离与全新节点首次使用，不复制策略内容修改模型。, en: Formal parent and children must distinguish departure of a stable existing identity from first use of a new node and must not copy the policy-content model.}}
