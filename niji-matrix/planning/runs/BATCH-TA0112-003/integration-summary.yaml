review_notes_zh: T1484 与 T1666 分别经 adapt 准入形成集中防御策略削弱和云层级防御覆盖位移。T1484 因子项证据不足保持零 NJS；T1666 以既有节点迁离与新节点注册前运行的前态及残余痕迹，建立两项 Niji 原生 NJS。创建两套不同的数据关联 DET、三项可实施 NJA 和两项目标化 MIT；复用策略证据并扩展被阻断 GPO 案例，云层级公开案例只按其可证结论使用。质量、查重、ID 同步、Bundle 与 Web 门禁通过，保持 review 等待人工领域评审。TA0112 正式矩阵完成 4/18，剩余 14 项。
review_notes_en: T1484 and T1666 were independently adapted as Central Defensive-Policy Impairment and Cloud Hierarchy Defensive-Coverage Displacement. T1484 has no NJS because candidate child evidence remains insufficient. T1666 has two Niji-native children separated by the prior state and residual traces of existing-node departure versus operation before new-node enrollment. The batch creates two distinct correlation strategies, three implementable analytics, and two target-specific mitigations; it reuses policy evidence, extends the blocked GPO case, and limits cloud hierarchy cases to supported conclusions. Quality, duplicate, ID-sync, bundle, and Web gates pass. Objects remain in review pending human domain review. TA0112 has 4 of 18 formal-matrix parents complete and 14 remaining.
