  - work_item_ref: WORK-TA0112-T1484
    attack_baseline: {domain: enterprise-attack, version: "19.1"}
    attack_subtechnique_count: 2
    attack_subtechnique_ids: [T1484.001, T1484.002]
    represented_dimensions: [domain GPO and SYSVOL settings with client refresh, domain or tenant trust and federation settings with identity evaluation]
    breadth_trigger: ordinary-open-search
    coverage_resolutions:
      - {attack_ids: [T1484.001], resolution: parent-core, notes: GPO is a carrier for centralized defensive settings, not a Niji variable; a successful endpoint defensive result must be established independently.}
      - {attack_ids: [T1484.002], resolution: adjacent-technique, notes: Trust and federation changes chiefly alter authentication or authorization and are owned by NJT-0093, NJT-0100 or other identity objects unless direct defensive-control impairment is proved.}
    candidate_stealth_axes_examined:
      - {axis: centralized-security-policy-fanout, disposition: parent-core, trace_change: one control-plane write becomes many trusted consumer setting changes, defender_effect: original writer and endpoint control result occupy different observation planes}
      - {axis: selectively-scoped-defensive-policy-exception, disposition: evidence-deferred, trace_change: a policy filter would remove a selected device set from protection while other devices stay protected, defender_effect: needs exact scope-to-consumer proof beyond available incident record}
      - {axis: post-use-policy-reversion, disposition: evidence-deferred, trace_change: a malicious policy version is restored after defensive effects, defender_effect: ATT&CK describes possibility but current direct case does not prove attack reversion and residual control outcome}
      - {axis: gpo-versus-trust, disposition: not-stealth-distinct, trace_change: different implementation and consumer semantics, defender_effect: implementation partition does not by itself prove a separate defense-impairment variable}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes_zh: T1484 在 TA0112 正式保留父级集中防御策略发布与消费效果，但本轮没有结论级证据足以把策略作用域例外或用后回退建立为独立子项。GPO/trust 子项不导入；已证明的提权回退由 NJT-0100 负责。零子项是证据和兄弟边界裁决，不是忽略 taxonomy 搜索。
    reviewer_notes_en: T1484 retains parent-level centralized defensive-policy publication and consumer effect in TA0112, but current conclusion-level evidence does not establish scoped exception or post-use reversion as a separate child. GPO and trust children are not imported, and proven elevation reversion belongs to NJT-0100. Zero children reflects evidence and sibling-boundary review, not a skipped taxonomy search.
  - work_item_ref: WORK-TA0112-T1666
    attack_baseline: {domain: enterprise-attack, version: "19.1"}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [organization to account membership, OU and folder parentage, subscription and project placement, inherited controls and central logging enrollment]
    breadth_trigger: ordinary-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - {axis: existing-resource-governance-departure, disposition: formal-medium, trace_change: an existing account subscription or project moves or leaves its governed ancestor and loses inherited controls while workloads remain, defender_effect: historical identity remains but central inventory and logging coverage contract}
      - {axis: new-node-outside-control-enrollment, disposition: formal-medium, trace_change: a new account subscription or project is created in a branch not yet under required logging guardrails or detection enrollment, defender_effect: no prior local resource history and coverage gap appears at first workload action}
      - {axis: policy-document-edit, disposition: adjacent-technique, trace_change: the policy version changes without changing ancestry, defender_effect: T1484 or a more specific control owner applies}
      - {axis: billing-only-hierarchy-edit, disposition: not-stealth-distinct, trace_change: organization labels or payment ownership change but security controls remain equivalent, defender_effect: no demonstrated defensive observation difference}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: ATT&CK 无子项，开放搜索按现有节点迁离与新节点先于治理注册区分两种稳定变量。前者要比较同一资源 ancestry 与既有日志连续性，后者要连接创建、注册时差和首个工作负载行为；单纯 LeaveOrganization 或 CreateAccount 不证明成功失明。
    reviewer_notes_en: ATT&CK has no children, so open search distinguishes an existing node leaving governance from a new node operating before control enrollment. The first compares the same resource's ancestry and prior log continuity; the second joins creation, enrollment delay, and first workload action. LeaveOrganization or CreateAccount alone does not prove completed blindness.
