review_notes_zh: 五项候选均经 adapt 准入。T1689 形成两个按实际加载前态、痕迹和防守方法划分的原生 NJS；其余四项经开放搜索与 ATT&CK 广度审查保持零 NJS，不按平台、产品、CVE、权限介质或 Registry 键名复制分类。五项分别建立目标化 DET、可实施 NJA 与 MIT，公开事件只按直接结论使用：Cisco 支持弱密钥材料与密文外观差，Avast 支持 AppLocker 利用到防御干扰，ESET Grandoreiro 保留权限修改 attempt 限制，Booz Allen 支持 BlackEnergy Registry 设置—后继链。共享库查重、ID 同步、五个 Bundle、质量、91 项 Web 测试与 API 0 issue 通过；全部对象保持 review 等待人工领域评审。TA0112 正式矩阵完成 9/18，剩余 9 项。
review_notes_en: All five candidates were adapted. T1689 produces two native NJS separated by actual-load prior state, residue, and defensive method. The other four remain zero-child after open search and ATT&CK breadth review rather than copying platform, product, CVE, permission medium, or Registry-key classifications. Each candidate has a target-specific DET, implementable NJA, and MIT. Public cases are limited to direct conclusions: Cisco supports weak keying material under ciphertext appearance, Avast supports AppLocker exploitation leading to defense interference, ESET Grandoreiro retains the permission-change attempt limitation, and Booz Allen supports the BlackEnergy Registry-setting to follow-on chain. Shared-library duplicate audit, ID synchronization, five bundles, quality, 91 Web tests, and zero API issues pass. All objects remain in review pending human domain review. TA0112 has 9 of 18 formal-matrix parents complete and 9 remaining.
