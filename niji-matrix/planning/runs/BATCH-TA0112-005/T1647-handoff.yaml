  limitations:
    paragraphs:
      - zh: Microsoft 与 Trend Micro 对 XCSSET 的技术分析直接证明 plist 呈现、Dock 重绑定和持久化行为，但不把 plist 写入本身描述为安全工具或审计控制失效；ATT&CK 父页的 Defense Impairment 映射不能补足这一结论。未来若出现 plist 内防御设置被消费并产生独立控制下降的直接事件，应重新准入。
        en: Microsoft and Trend Micro technical analyses directly establish XCSSET plist presentation, Dock rebinding, and persistence behavior, but do not describe the plist write itself as failure of a security tool or audit control. The ATT&CK parent's Defense Impairment mapping cannot fill that conclusion. A future direct incident in which a defensive plist setting is consumed and independently reduces a control should reopen admission.
