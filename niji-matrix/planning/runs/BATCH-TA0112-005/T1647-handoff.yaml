work_item_ref: WORK-TA0112-T1647
temporary_key_prefix: DI05-T1647
candidate:
  source_type: attack
  source_attack_id: T1647
  name: {zh: Plist 文件修改, en: Plist File Modification}
recommendation:
  decision: exclude
  confidence: high
  rationale:
    paragraphs:
      - zh: 固定 T1647 将 plist 作为 macOS 配置介质，程序实例分别通过 LSUIElement 隐藏应用呈现、替换 Dock/LaunchPad 指向、建立 LaunchAgent/LaunchDaemon 持久化或设置加载环境变量。Apple 文档证明这些键由 Launch Services 正常消费，Microsoft 的 XCSSET 分析证明攻击者确实利用 LSUIElement、显示名、图标和 Dock URI 承载隐藏与假应用执行；但现有来源没有证明“plist 修改”作为独立对象直接关闭或削弱安全控制。可见性差由 NJT-0111 拥有，启动/服务持久化由 NJT-0084/NJT-0089 拥有，执行与动态加载由对应执行流对象拥有，因此 TA0112 排除介质型重复父项。
        en: Fixed T1647 treats plist as a macOS configuration medium. Procedure examples use LSUIElement to hide application presentation, replace Dock or LaunchPad targets, establish LaunchAgent or LaunchDaemon persistence, or set loader environment variables. Apple documentation establishes normal Launch Services consumption of those keys, and Microsoft's XCSSET analysis directly establishes adversary use of LSUIElement, display names, icons, and Dock URIs for hidden or fake-application execution. Available sources do not establish plist modification itself as an independent object that directly disables or weakens a security control. NJT-0111 owns the visibility difference, NJT-0084 and NJT-0089 own startup or service persistence, and execution-flow objects own execution and dynamic loading, so TA0112 excludes the medium-defined duplicate parent.
proposed_content:
  summary: {zh: Plist 修改是多种既有技术的实现介质，当前不构成独立 TA0112 正式技术。, en: Plist modification is an implementation medium for existing techniques and does not currently form an independent TA0112 formal technique.}
  definition_and_concept:
    paragraphs:
      - zh: 候选描述修改 macOS property list 的 key-value，使 Launch Services、Dock、launchd 或应用运行时改变呈现、目标或启动行为。能够进入 Niji 的直接对象应是被改变的可见性、生命周期、执行目标或防御结果，而不是 XML/二进制 plist 文件本身。
        en: The candidate describes changing macOS property-list key values so Launch Services, Dock, launchd, or application runtime changes presentation, target, or launch behavior. The direct object eligible for Niji is the changed visibility, lifecycle, execution target, or defensive outcome rather than the XML or binary plist file itself.
  stealth_characteristics:
    paragraphs:
      - zh: LSUIElement 可使应用不出现在 Dock 或 Force Quit，假图标和显示名可让 Dock 指向攻击者应用，这些痕迹改变属于默认视图遗漏和可见特征替换。plist old/new、bundle hash、代码签名、Dock URI、应用启动和进程仍是残余；不存在跨所有 plist 用途统一的新观察差。
        en: LSUIElement can omit an app from Dock or Force Quit, while fake icons and display names can redirect a Dock entry to an adversary app. Those trace changes are default-view omission and visible-feature substitution. Plist old and new state, bundle hash, code signature, Dock URI, app launch, and process remain as residue, with no new observation differential shared by all plist uses.
  scope_boundary_definition:
    paragraphs:
      - zh: 隐藏呈现转交 NJT-0111，启动与登录消费转交 NJT-0084，服务/daemon 定义转交 NJT-0089，用户触发假应用和动态加载转交对应执行/劫持对象。只有未来直接案例证明 plist 中某个防御设置被消费者采用并降低独立安全控制，且不能由现有结果 owner 表达时，才重新评估 TA0112 准入。
        en: Hidden presentation is referred to NJT-0111, boot or logon consumption to NJT-0084, service or daemon definition to NJT-0089, and user-triggered fake applications or dynamic loading to their execution or hijack owners. TA0112 admission should be reconsidered only if a future direct case shows a plist defensive setting consumed to reduce an independent security control that no existing outcome owner can express.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: XCSSET 创建假 Launchpad/Reminders 等应用，修改 Info.plist 的 LSUIElement、显示名和可执行字段，再通过 Dock 或用户动作触发恶意载荷；同一报告也记录独立的 firewall_off 和 updates_off 模块，说明真正防御关闭并非由 plist 介质本身完成。
          en: XCSSET creates fake Launchpad or Reminders applications, changes Info.plist LSUIElement, display-name, and executable fields, and then triggers malicious payloads through Dock or user action. The same reporting describes separate firewall_off and updates_off modules, showing that actual defensive shutdown is not accomplished by the plist medium itself.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需能写应用 bundle、用户偏好或启动定义，并了解 Launch Services、Dock 或 launchd 的消费语义；代码签名、受保护系统卷、notarization 和 bundle 完整性会限制目标。所需能力随具体结果 owner 不同，无法从 plist 格式推导统一模型。
            en: The adversary needs write authority over an application bundle, user preference, or launch definition and knowledge of Launch Services, Dock, or launchd consumption. Code signing, the sealed system volume, notarization, and bundle integrity constrain targets. Required capability varies by the actual outcome owner and cannot be derived uniformly from plist format.
      defender_model:
        paragraphs:
          - zh: 防守方可保留 plist old/new、writer、bundle 签名/hash、Dock/Launch Services 数据、launchd 状态与后继进程，并按实际结果选择检测。只监控 .plist 扩展名会把合法开发、安装和偏好变更与不同恶意结果混合。
            en: Defenders can retain plist old and new state, writer, bundle signature and hash, Dock or Launch Services data, launchd state, and downstream process, selecting detection by actual outcome. Monitoring only the .plist extension merges legitimate development, installation, and preference changes with distinct malicious results.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: plist 元数据可使恶意应用呈现为隐藏或熟悉对象, en: Plist metadata can present a malicious application as hidden or familiar}
      analysis:
        paragraphs:
          - zh: XCSSET 改写 LSUIElement、显示名、图标和 Dock 目标，使攻击者应用不进入默认 Dock/Force Quit 视图或呈现为 Launchpad 等熟悉对象；底层 bundle、签名、plist 与真实进程仍可检查。这条因果链成立，但其结果已由 NJT-0111 及相关呈现/执行 owner 表达，不支持在 TA0112 再建父项。
            en: XCSSET changes LSUIElement, display name, icon, and Dock target so an adversary app is omitted from default Dock or Force Quit views or appears as a familiar object such as Launchpad. The underlying bundle, signature, plist, and real process remain inspectable. The causal chain is valid, but its outcome is already expressed by NJT-0111 and related presentation or execution owners and does not support another TA0112 parent.
      evidence_keys: [DI05-T1647-REF-01, DI05-T1647-REF-02, DI05-T1647-REF-03]
      confidence: high
