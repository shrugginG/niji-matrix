review_notes_zh: T1647 经 exclude 准入，不创建正式 NJT/NJS 或防御对象。固定父项和 XCSSET 案例证明 plist 可承载 LSUIElement 隐藏、Dock/LaunchPad 重绑定及持久化/执行，但直接结果分别由 NJT-0111、NJT-0084、NJT-0089 和执行/加载对象覆盖；XCSSET 的防火墙与更新关闭由独立模块完成。创建三项准入 Reference，查重、ID 同步、质量、91 项 Web 测试和 API 0 issue 通过。TA0112 正式矩阵仍为 9 项；18 个固定候选中 10 项已决策、8 项未决策。
review_notes_en: T1647 was excluded and creates no formal NJT, NJS, or defense objects. The fixed parent and XCSSET case establish plist use for LSUIElement hiding, Dock or LaunchPad rebinding, persistence, and execution, but those direct outcomes are owned by NJT-0111, NJT-0084, NJT-0089, and execution or loading objects. XCSSET turns off firewall and updates through separate modules. The batch creates three admission References and passes duplicate audit, ID synchronization, quality, 91 Web tests, and zero API issues. The TA0112 formal matrix remains at nine techniques; ten of eighteen fixed candidates have decisions and eight remain undecided.
