  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [validation, bundle, ID synchronization]}
  limitations: {paragraphs: [{zh: TA0112 的具体事件仍需证明认证要求相对基线降低；存在后门入口不自动等于所有请求都弱化，Credential Access 分支也不能混入。, en: A concrete TA0112 event still requires proof that authentication requirements fell relative to baseline; a backdoor entry does not mean all requests were weakened, and Credential Access branches cannot be mixed in.}]}
