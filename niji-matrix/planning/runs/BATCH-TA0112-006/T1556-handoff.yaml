handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0112-006
work_item_ref: WORK-TA0112-T1556
temporary_key_prefix: DI06-T1556
candidate: {source_type: attack, source_attack_id: T1556, name: {zh: 修改认证过程, en: Modify Authentication Process}}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: TA0003 已有 NJT-0093 及两项原生子技术，直接对象是验证器/信任额外接受攻击者证明或总体策略启用但作用域例外。TA0112 的认证强度下降与同一 mutation—request—decision 链一致，不应按战术复制父子项；扩充 tactic_refs 与 TA0112 决策即可。
        en: TA0003 already has NJT-0093 and two native children whose direct objects are a validator or trust accepting an added adversary proof and an enabled overall policy with a scoped exception. TA0112 authentication-strength decline uses the same mutation-to-request-to-decision chain and should not duplicate the parent or children by tactic; extending tactic_refs and adding a TA0112 decision is sufficient.
proposed_content:
  summary: {zh: 复用 NJT-0093，并明确同一认证路径变化在降低预期认证控制时服务 TA0112。, en: Reuse NJT-0093 and state that the same authentication-path mutation serves TA0112 when it lowers intended authentication enforcement.}
  definition_and_concept: {paragraphs: [{zh: 直接对象仍是认证 decision path，不是具体模块或产品；Persistence 与 Defense Impairment 是同一状态变化的不同成立结果。, en: The direct object remains the authentication decision path rather than a module or product; Persistence and Defense Impairment are different qualification outcomes of the same state change.}]}
  stealth_characteristics: {paragraphs: [{zh: 正常请求继续通过、异常证明或窄范围情境才触发弱化分支，现有可见性和防御方法不因战术增加而改变。, en: Ordinary requests continue to pass and only an anomalous proof or narrow context triggers the weakened branch, so visibility and defensive method do not change merely because another tactic applies.}]}
  scope_boundary_definition: {paragraphs: [{zh: 只获取秘密归 Credential Access，账户级认证器归 T1098，纯日志关闭归记录对象；验证器/策略本身被改变并产生较弱允许结果时复用 NJT-0093。, en: Secret acquisition alone belongs to Credential Access, account-level authenticators to T1098, and logging-only shutdown to recording objects; reuse NJT-0093 when the validator or policy itself changes and produces a weaker allow result.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者在控制域验证器、联合信任或身份策略后，加入主证明或认证例外，使以后请求绕过预期要求。, en: After controlling a domain validator, federation trust, or identity policy, an adversary adds a master proof or authentication exception so later requests bypass intended requirements.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要认证组件、信任或策略写权，并理解验证顺序和作用域；错误修改会造成广泛登录异常。, en: The adversary needs write authority over an authentication component, trust, or policy and knowledge of validation order and scope; bad changes create broad sign-in anomalies.}]}
      defender_model: {paragraphs: [{zh: 需连接组件/策略 old-new、writer、输入/情境、逐策略结果和最终 decision；总体 MFA 已启用不足以证明控制有效。, en: Defenders join component or policy old and new state, writer, input or context, per-policy result, and final decision; an overall MFA-enabled state does not prove effective enforcement.}]}
  stealth_mechanisms:
    - {mechanism_ref: NM-BT, role: primary, summary: {zh: 稀少证明或窄条件分支避开普通认证检查, en: A rare proof or narrow condition branch avoids ordinary authentication checks}, analysis: {paragraphs: [{zh: 仅攻击者选择的证明或情境得到不同认证结果，普通健康检查不触发该分支；此机理已由 NJT-0093 完整表达。, en: Only adversary-selected proof or context receives a different authentication result, and ordinary health checks do not trigger the branch; NJT-0093 already expresses this mechanism completely.}]}, evidence_keys: [REF-000303, REF-000304, REF-000305, REF-000306, REF-000307], confidence: medium}
proposed_subtechniques:
  - {temporary_key: reuse-NJS-0093-001, name: {zh: 选择性后门秘密接受, en: Selective Backdoor-Secret Acceptance}, stable_variable: added adversary proof, trace_change: rare input receives anomalous allow, defender_effect: requires validator or trust integrity plus input-outcome differential, evidence_keys: [REF-000303, REF-000304], confidence: high}
  - {temporary_key: reuse-NJS-0093-002, name: {zh: 范围化认证策略例外, en: Scoped Authentication-Policy Exception}, stable_variable: changed condition or exclusion scope under an enabled policy, trace_change: selected principal device location or resource bypasses expected requirement, defender_effect: requires policy old-new scope and matched-session outcome, evidence_keys: [REF-000305, REF-000306, REF-000307], confidence: high}
