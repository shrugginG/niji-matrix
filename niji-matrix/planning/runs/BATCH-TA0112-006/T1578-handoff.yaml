candidate: {source_type: attack, source_attack_id: T1578, name: {zh: 修改云计算基础设施, en: Modify Cloud Compute Infrastructure}}
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
      - zh: 固定 T1578 将快照、创建、删除、回退和租户级计算配置放在一个父项。Niji 只保留计算生命周期变化相对批准基线造成的控制注册或取证连续性差：新建/克隆资源可在既有实例控制之外承载活动，删除/回退可使同一工作负载的来宾证据不再连续。单纯资源操作、配额增加、区域启用或破坏性删除必须由实际防御结果门槛约束。
        en: Fixed T1578 groups snapshots, creation, deletion, reversion, and tenant-wide compute configuration. Niji retains only compute-lifecycle changes that create a control-enrollment or forensic-continuity difference relative to the approved baseline. A new or cloned resource can carry activity outside controls on existing instances, while deletion or reversion can break guest-evidence continuity for the same workload. Resource operations, quota increases, region enablement, or destructive deletion alone remain gated by an actual defensive outcome.
proposed_content:
  summary: {zh: 攻击者改变云计算资源生命周期，使活动进入未注册计算分支或使来宾取证状态出现不可恢复断点。, en: Adversaries change cloud-compute lifecycles so activity enters an unenrolled compute branch or guest forensic state develops an unrecoverable break.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是计算资源 lineage 与防御状态的差，不是实例、快照或 API 名称。, en: The direct object is the difference between compute-resource lineage and defensive state rather than an instance, snapshot, or API name.}]}
  stealth_characteristics: {paragraphs: [{zh: 控制面仍显示正常生命周期动作，来宾遥测和安全代理却可能从新资源或回退点重新开始；不同权控制面日志保留残余。, en: The control plane still shows ordinary lifecycle operations while guest telemetry and security agents may restart from a new resource or rollback point; separately authorized control-plane logs remain as residue.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入必须证明控制注册或证据连续性下降及后继活动；普通弹性伸缩、灾备、备份、成本优化和破坏行为不能只凭生命周期事件准入。, en: Inclusion requires proof of reduced control enrollment or evidence continuity plus follow-on activity; ordinary scaling, recovery, backup, cost optimization, and destructive behavior cannot qualify from lifecycle events alone.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者可从敏感卷创建快照并挂载到新实例，或在活动后删除/回退实例，使原实例控制与来宾证据不再覆盖当前状态。, en: An adversary can snapshot a sensitive volume and mount it to a new instance or delete or revert an instance after activity so controls and guest evidence on the original no longer cover current state.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要计算生命周期、快照或配置权限并了解安全代理注册和取证保留；组织策略、强制 enrollment、删除保护和独立审计会限制效果。, en: The adversary needs compute-lifecycle, snapshot, or configuration authority and knowledge of security-agent enrollment and forensic retention; organization policy, mandatory enrollment, deletion protection, and independent audit limit the effect.}]}
      defender_model: {paragraphs: [{zh: 需连接 API actor、资源 lineage、映像/快照来源、网络/IAM、控制注册、首个活动、删除/回退和外部日志，不能只看当前实例清单。, en: Defenders join API actor, resource lineage, image or snapshot source, network and IAM, control enrollment, first activity, deletion or reversion, and external logs rather than relying only on current instance inventory.}]}
  stealth_mechanisms:
    - {mechanism_ref: NM-BT, role: primary, summary: {zh: 正常云生命周期动作拆开控制面记录与来宾防御连续性, en: Ordinary cloud lifecycle actions separate control-plane records from guest defensive continuity}, analysis: {paragraphs: [{zh: 攻击者借受信云 API 创建新 lineage 或回退/删除旧状态，操作外观符合正常运维，但安全代理和来宾证据边界发生变化；缺少 lineage—control join 时活动落在原观察模型之外。, en: The adversary uses trusted cloud APIs to create a new lineage or revert or delete old state. The operations resemble normal administration while security-agent and guest-evidence boundaries change; without a lineage-to-control join activity falls outside the original observation model.}]}, evidence_keys: [DI06-T1578-REF-01, REF-000103, DI06-T1578-REF-03, DI06-T1578-REF-04], confidence: medium}
proposed_subtechniques:
  - {temporary_key: DI06-T1578-SUB-01, name: {zh: 影子计算控制范围分叉, en: Shadow-Compute Control-Scope Fork}, stable_variable: new or cloned compute identity begins activity before equivalent control enrollment, trace_change: snapshot or image lineage moves data into a new resource ID with different network IAM or agent state, defender_effect: no previous guest baseline and old-instance controls do not automatically follow, evidence_keys: [DI06-T1578-REF-01, REF-000103, DI06-T1578-REF-02, DI06-T1578-REF-03], confidence: medium}
  - {temporary_key: DI06-T1578-SUB-02, name: {zh: 计算取证状态连续性断裂, en: Compute Forensic-State Continuity Break}, stable_variable: deletion reversion or ephemeral reset removes the guest state covering an already observed activity interval, trace_change: control-plane lifecycle remains while local file memory and agent sequence disappear or rewind, defender_effect: requires independent retention and lineage-aware rollback analysis, evidence_keys: [DI06-T1578-REF-01, REF-000103, DI06-T1578-REF-03, DI06-T1578-REF-04], confidence: medium}
defense_candidates:
  detection_strategies: [{temporary_key: DI06-T1578-DET-01, objective: compute lifecycle lineage to control enrollment guest evidence and first or last activity}]
  detection_analytics: [{temporary_key: DI06-T1578-NJA-01, implementation: snapshot or image to new instance control-scope fork}, {temporary_key: DI06-T1578-NJA-02, implementation: delete revert or ephemeral reset to forensic continuity break}]
  mitigations: [{temporary_key: DI06-T1578-MIT-01, purpose: least lifecycle authority mandatory enrollment deletion protection and external evidence retention}]
