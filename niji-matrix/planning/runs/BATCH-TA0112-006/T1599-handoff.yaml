  detection_analytics: [{temporary_key: DI06-T1599-NJA-01, implementation: boundary config or forwarding rewrite to prohibited flow}, {temporary_key: DI06-T1599-NJA-02, implementation: overlay relay process or tunnel to paired flows}]
  mitigations: [{temporary_key: DI06-T1599-MIT-01, purpose: independent segmentation least device authority relay controls and bilateral telemetry}]
