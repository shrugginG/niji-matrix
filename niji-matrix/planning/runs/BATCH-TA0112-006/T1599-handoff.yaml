candidate: {source_type: attack, source_attack_id: T1599, name: {zh: 网络边界桥接, en: Network Boundary Bridging}}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: T1599 的直接对象是原本禁止跨越的两安全域之间出现攻击者可用路径，而不是 NAT、代理或隧道工具。ThreatNeedle 直接案例证明被攻陷路由 VM 被配置为跨企业/受限网的 Apache proxy；印度关键基础设施报告支持 FRP/VPN 叠加中继。两类路径分别改变边界设备策略/转发表和独立中继会话，数据、痕迹与恢复不同。
        en: T1599's direct object is an adversary-usable path between two security domains that should not be crossed, rather than a NAT, proxy, or tunnel tool. The direct ThreatNeedle case establishes a compromised router VM configured as an Apache proxy across corporate and restricted networks, while Indian critical-infrastructure reporting supports FRP or VPN overlay relays. The two paths respectively change boundary-device policy or forwarding and independent relay sessions and have different data, residue, and recovery.
proposed_content:
  summary: {zh: 攻击者在分隔网络之间建立未批准传输路径，使流量绕过预期分段和检查。, en: Adversaries establish an unapproved transit path between segmented networks so traffic bypasses intended separation and inspection.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是 domain A—bridge—domain B 的可达性和检查路径差，不是代理产品或边界设备类型。, en: The direct object is the reachability and inspection-path difference across domain A, bridge, and domain B rather than a proxy product or boundary-device type.}]}
  stealth_characteristics: {paragraphs: [{zh: 边界设备或受信中继仍可呈现正常运维流量，但原本禁止的双向路径实际成立；残余在配置、监听会话和跨域 flow。, en: A boundary device or trusted relay can still present ordinary operational traffic while a formerly prohibited bidirectional path exists; residue remains in configuration, listening sessions, and cross-domain flows.}]}
  scope_boundary_definition: {paragraphs: [{zh: 必须证明批准基线禁止路径、攻击者桥接状态和实际跨域流；普通远程访问、同域代理、单边 C2 或仅防火墙开口分别排除或转交相邻对象。, en: Proof requires a baseline that prohibits the path, adversary bridge state, and actual cross-domain flow. Ordinary remote access, same-domain proxy, one-sided C2, or a firewall opening alone is excluded or referred to adjacent objects.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者控制路由器/防火墙/双宿主主机后，可修改转发/NAT/代理或运行 FRP/VPN relay，把恶意载荷、交互或数据跨越隔离区。, en: After controlling a router, firewall, or dual-homed host, an adversary can modify forwarding, NAT, or proxy state or run an FRP or VPN relay to move payloads, sessions, or data across isolated zones.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要同时到达两个域、能写设备策略或运行持久中继并维持会话；独立边界控制、出站限制和强身份会增加成本。, en: The adversary needs reachability to both domains, authority to write device policy or run a durable relay, and ability to maintain sessions; independent boundary controls, egress restrictions, and strong identity raise cost.}]}
      defender_model: {paragraphs: [{zh: 需有网络域/批准路径模型、边界配置、进程/监听/隧道状态和两侧 flow，并按 bridge_id 连接；单侧日志不能证明端到端桥接。, en: Defenders need a network-domain and approved-path model, boundary configuration, process or listener or tunnel state, and flows on both sides joined by bridge_id; one-sided logs cannot prove end-to-end bridging.}]}
  stealth_mechanisms:
    - {mechanism_ref: NM-BT, role: primary, summary: {zh: 受信边界设备或中继承载未批准跨域流量, en: A trusted boundary device or relay carries unapproved cross-domain traffic}, analysis: {paragraphs: [{zh: 攻击者借正常路由/代理或应用层中继承载跨域流，单侧看似普通会话；缺少端到端 path graph 时防守看不到策略被绕过，形成行为透明。, en: The adversary carries cross-domain traffic through ordinary routing or proxying or an application relay, leaving an ordinary session on either side. Without an end-to-end path graph, defenders miss the bypassed policy, producing behavioral transparency.}]}, evidence_keys: [DI06-T1599-REF-01, DI06-T1599-REF-02, DI06-T1599-REF-03, DI06-T1599-REF-04], confidence: high}
proposed_subtechniques:
  - {temporary_key: DI06-T1599-SUB-01, name: {zh: 边界设备转发路径改写, en: Boundary-Device Forwarding-Path Rewrite}, stable_variable: compromised boundary device changes routing NAT ACL or proxy state, trace_change: same device forwards a previously prohibited domain pair, defender_effect: join config old-new and bilateral flows plus policy decision, evidence_keys: [DI06-T1599-REF-01, DI06-T1599-REF-02, DI06-T1599-REF-03], confidence: high}
  - {temporary_key: DI06-T1599-SUB-02, name: {zh: 叠加中继边界桥接, en: Overlay-Relay Boundary Bridge}, stable_variable: a process or VPN or FRP session with access to both domains relays traffic without changing the underlying boundary route, trace_change: two independent sessions share relay identity timing and payload volume, defender_effect: requires process or tunnel state and bidirectional flow correlation, evidence_keys: [DI06-T1599-REF-01, DI06-T1599-REF-04], confidence: medium}
