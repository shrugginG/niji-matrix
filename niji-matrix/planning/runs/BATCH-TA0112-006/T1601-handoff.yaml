candidate: {source_type: attack, source_attack_id: T1601, name: {zh: 修改系统映像, en: Modify System Image}}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: T1601 的直接对象是嵌入式网络设备运行/启动系统映像的可信完整性。Cisco 原始取证区分了只修改运行内存、重载后消失的事件，与修改闪存 IOS 或 ROMMON、跨重载持续的事件；两者痕迹、窗口和恢复完全不同。ATT&CK 的 Patch/Downgrade 是实现和版本语义，不作为 Niji 子项，版本回退的防御能力差另由 NJT-0127 负责。
        en: T1601's direct object is trusted integrity of the running or boot system image on an embedded network device. Cisco original forensics distinguishes incidents that changed running memory only and disappeared after reload from modified flash IOS or ROMMON that persisted across reloads. Their traces, windows, and recovery are different. ATT&CK Patch and Downgrade are implementation and version semantics rather than Niji children, while defensive capability differences from rollback belong to NJT-0127.
proposed_content:
  summary: {zh: 攻击者修改网络设备运行或启动映像，使安全与观察功能在受信设备身份下发生未批准变化。, en: Adversaries modify a network device running or boot image so security and observation functions change under a trusted device identity.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是映像完整性与被设备实际消费的代码版本，不是固件品牌、文件名或版本号。, en: The direct object is image integrity and the code version actually consumed by the device rather than firmware brand, filename, or version number.}]}
  stealth_characteristics: {paragraphs: [{zh: 设备管理身份与业务转发可保持正常，运行内存或启动映像却与可信来源不同；配置与常规版本查询可能无法显示修改。, en: Device management identity and business forwarding can remain normal while running memory or boot image differs from trusted provenance; configuration and ordinary version queries may not expose the mutation.}]}
  scope_boundary_definition: {paragraphs: [{zh: 需证明攻击者映像变化和安全/观察结果；仅旧版本、普通更新或模块文件修改无结果时不确认。版本回退归 NJT-0127，加密强度归 NJT-0128，认证路径可并记 NJT-0093。, en: Proof requires adversary image mutation and a security or observation outcome; an old version, normal update, or module-file change without outcome is insufficient. Rollback belongs to NJT-0127, cryptographic strength to NJT-0128, and authentication-path outcomes may also map to NJT-0093.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者取得设备高权后，可实时补丁运行 IOS，或替换闪存/ROMMON/关键系统组件，在保持网络服务的同时加入后门、流量复制或防御绕过。, en: After privileged device access, an adversary can patch running IOS or replace flash, ROMMON, or critical system components, adding backdoors, traffic duplication, or defensive bypass while network service continues.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要调试/内存写、映像存储或启动链权限以及设备架构知识；崩溃、签名校验、Trust Anchor 和重载会限制。, en: The adversary needs debug or memory-write, image-storage, or boot-chain authority plus device-architecture knowledge; crashes, signature validation, Trust Anchor, and reload constrain the path.}]}
      defender_model: {paragraphs: [{zh: 需比较可信闪存/启动测量与运行内存、模块/函数、版本输出、core dump 和功能 canary，不能只信任设备自报。, en: Defenders compare trusted flash or boot measurement with running memory, module or function, version output, core dump, and functional canary rather than trusting device self-report alone.}]}
  stealth_mechanisms:
    - {mechanism_ref: NM-FD, role: primary, summary: {zh: 受信设备身份与版本外观掩盖实际运行代码变化, en: Trusted device identity and version appearance conceal changes to the code actually running}, analysis: {paragraphs: [{zh: 攻击者保留设备名称、管理界面和网络功能，却修改运行/启动代码；防守按可见版本和配置分类时会把受损设备视为正常，运行内存与可信映像差可揭示。, en: The adversary preserves device name, management interface, and network function while changing running or boot code. Defenders classifying from visible version and configuration treat the impaired device as normal, while a running-memory to trusted-image differential reveals it.}]}, evidence_keys: [DI06-T1601-REF-01, REF-000467, REF-000468, REF-000449], confidence: high}
proposed_subtechniques:
  - {temporary_key: DI06-T1601-SUB-01, name: {zh: 运行内存映像即时修改, en: Runtime-Memory Image Mutation}, stable_variable: modified code exists in the running image but not trusted persistent storage, trace_change: flash hash remains approved while memory or core dump differs and mutation disappears after reload, defender_effect: requires live memory or core-dump differential before reboot, evidence_keys: [REF-000467], confidence: high}
  - {temporary_key: DI06-T1601-SUB-02, name: {zh: 启动持久映像替换, en: Boot-Persistent Image Replacement}, stable_variable: modified image or boot component is stored and consumed across reload, trace_change: flash ROMMON manifest or boot target differs while device identity and service persist, defender_effect: requires signed image boot-chain and post-reload attestation plus trusted recovery, evidence_keys: [REF-000467, REF-000468, REF-000449], confidence: high}
defense_candidates:
  detection_strategies: [{temporary_key: DI06-T1601-DET-01, objective: trusted persistent image to running memory boot consumption and security outcome}]
