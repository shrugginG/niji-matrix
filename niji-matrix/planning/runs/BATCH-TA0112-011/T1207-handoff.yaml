    reviewer_notes: {zh: 新建 registration、DRS push 和快速撤销是同一窄父行为的顺序阶段，拆分会失去完成闭环；inactive registration 复用只有父页陈述，缺少足以建立独立防御模型的直接案例，暂延迟；元数据清理属于证据擦除。, en: New registration, DRS push, and rapid removal are sequential stages of one narrow parent behavior, and splitting them would lose completion closure. Reuse of an inactive registration is stated on the parent page but lacks a direct case sufficient for a separate defensive model and is deferred. Metadata cleanup belongs to evidence erasure.}
