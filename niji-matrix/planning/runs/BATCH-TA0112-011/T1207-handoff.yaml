  content_depth_review: {compared_with_njt_0001: true, field_responsibilities_complete: true, candidate_specific_prose: true, repeated_prose_reviewed: true, notes: {zh: 父项需要完整解释身份注册、复制消费、来源日志缺口、正常 promotion 反例和权限模型；零子项来自窄闭环而非停止搜索。, en: The parent must fully explain identity registration, replication consumption, the source-log gap, legitimate-promotion counterexamples, and the privilege model. Zero children follows from the narrow closure rather than stopping taxonomy search.}}
