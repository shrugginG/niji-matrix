  limitations:
    paragraphs:
      - zh: ATT&CK、Microsoft 与 UncoverDCShadow 直接支持技术语义和研究复现，但没有公开在野事件可验证完整注册—复制—结果链；检测字段在不同 Windows/审计策略和传感器版本中并不齐全，需本地 promotion 与 DCShadow canary 校准。
        en: ATT&CK, Microsoft, and UncoverDCShadow directly support technique semantics and research reproduction, but no public in-the-wild event validates the complete registration-to-replication-to-outcome chain. Detection fields vary by Windows version, audit policy, and sensor version and require local promotion and DCShadow canary calibration.
