candidate: {source_type: attack, source_attack_id: T1688, name: {zh: 安全模式启动, en: Safe Mode Boot}}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: T1688 直接支持攻击者利用 Windows 受限启动让正常 endpoint defense driver/service 不加载，但 BCD 修改或重启本身不证明防御削弱。Niji 将完成点固定为 boot intent—实际 restricted boot session—expected-versus-loaded defense set—follow-on adversary outcome，并把攻击者主动将自身 service/payload 加入 SafeBoot 允许集作为一项额外稳定变量。
        en: T1688 directly supports adversary use of Windows restricted boot so normal endpoint-defense drivers or services do not load, but a BCD modification or reboot alone does not prove defensive impairment. Niji fixes completion on boot intent to actual restricted-boot session to expected-versus-loaded defense set to follow-on adversary outcome and treats adversary enrollment of its own service or payload in the SafeBoot allowlist as one additional stable variable.
proposed_content:
  summary: {zh: 攻击者使主机进入受限启动状态，让正常防御组件缺席，并在该覆盖缺口窗口中执行后继恶意行为。, en: Adversaries place a host into a restricted boot state so normal defensive components are absent and execute follow-on malicious behavior during the coverage-gap window.}
  definition_and_concept:
    paragraphs:
      - zh: 直接对象是启动模式消费后形成的实际防御覆盖差及窗口内结果，不是 bcdedit、BCD 或 SafeBoot Registry 介质；技术要求主机完成受限启动且正常模式应在场的具体防御组件没有加载。
        en: The direct object is the actual defensive-coverage difference after boot-mode consumption plus an outcome in that window, not bcdedit, BCD, or the SafeBoot Registry medium. The technique requires a completed restricted boot and absence of a specific defensive component expected in normal mode.
  stealth_characteristics:
    paragraphs:
      - zh: Safe Mode 以合法诊断语义只加载有限 driver/service，防御缺席可被误认为故障排查；boot state、BCD old-new、reboot、Ntbtlog/service inventory、EDR heartbeat gap 和后继进程仍是残余。若防御支持 Safe Mode 或有外部网络/虚拟化传感器，匿迹收益下降。
        en: Safe Mode uses legitimate diagnostic semantics to load a limited driver and service set, and defensive absence can resemble troubleshooting. Boot state, BCD old and new, reboot, Ntbtlog or service inventory, EDR heartbeat gap, and follow-on processes remain as residue. Stealth falls when defenses support Safe Mode or external network or virtualization sensors remain present.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入要求未批准 boot intent、实际 restricted session、防御组件 expected-loaded 差和恶意结果；正常维护、DSRM、故障恢复与失败启动按批准窗口/console/状态排除。仅 BCD/Registry 变化、普通 service stop 或加密结果分别由 exposure、NJT-0123 和 Impact owner 处理。
        en: Inclusion requires unapproved boot intent, an actual restricted session, an expected-versus-loaded defensive-component difference, and a malicious outcome. Approved window, console, and state exclude maintenance, DSRM, failure recovery, and failed boot. BCD or Registry change alone, ordinary service stopping, and encryption outcomes belong to exposure, NJT-0123, and the Impact owner respectively.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 勒索软件操作者在取得本地管理员后设置下一次 safeboot，必要时把 loader/service 加入 Minimal/Network 列表，重启后在 EDR/AV 缺席时禁用安全目录、删除恢复数据或加密文件，再恢复正常启动。
          en: After obtaining local administrator access, a ransomware operator sets the next safeboot and can enroll a loader or service in the Minimal or Network list, reboot, disable security directories, delete recovery data, or encrypt files while EDR or AV is absent, and then restore normal boot.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要管理员级 BCD/Registry/service 权限、可承受重启和暂时业务中断、确保 payload 在受限环境可执行并有本地或网络控制路径；错误 driver/service 依赖、BitLocker/Secure Boot、远程管理缺失或故障恢复会使操作失败。
            en: The adversary needs administrator-level BCD, Registry, and service authority, tolerance for reboot and temporary business interruption, assurance that the payload runs in the restricted environment, and a local or network control path. Incorrect driver or service dependencies, BitLocker or Secure Boot, loss of remote management, or recovery behavior can fail the operation.
      defender_model:
        paragraphs:
          - zh: 防守方维护批准启动/维护窗口和每类主机的 normal/safe expected component sets，取得 BCD/Registry/service old-new、shutdown/reboot、boot ID/mode、loaded driver/service、EDR heartbeat、登录/网络和后继进程/文件结果；同一 agent 自身缺席时需外部证据。
            en: Defenders maintain approved boot or maintenance windows and normal and safe expected-component sets per host class and obtain BCD, Registry, and service old and new state, shutdown or reboot, boot ID and mode, loaded drivers and services, EDR heartbeat, sign-in or network, and follow-on process or file outcomes. External evidence is required when the same agent is absent.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 合法受限启动策略让防御组件缺席而恶意活动继续, en: Legitimate restricted-boot policy omits defenses while malicious activity continues}
      analysis:
        paragraphs:
          - zh: 攻击者让操作系统按正常 Safe Mode 规则消费受限允许集，而不是逐一篡改所有防御组件；防御工具缺席表现为启动模式的合法结果，后继行为发生在默认传感器不在场的观察窗口。跨启动关联 BCD、boot session、组件差与外部结果可恢复这段行为。
            en: The adversary has the operating system consume the restricted allowlist under normal Safe Mode rules rather than tampering with every defensive component individually. Defensive absence appears as a legitimate boot-mode result, and follow-on behavior occurs in an observation window where default sensors are not present. Cross-boot correlation of BCD, boot session, component difference, and external outcomes recovers the behavior.
      evidence_keys: [DI12-T1688-REF-01, DI12-T1688-REF-02, DI12-T1688-REF-03, DI12-T1688-REF-05, DI12-T1688-REF-06]
      confidence: high
proposed_subtechniques:
  - temporary_key: DI12-T1688-SUB-01
    name: {zh: 受限启动载荷存活注册, en: Restricted-Boot Payload Survival Enrollment}
    stable_variable: attacker adds its payload service or COM activation path to the SafeBoot Minimal or Network permitted set while ordinary defenses remain excluded
    trace_change: SafeBoot Registry and service or COM registration changes precede a boot in which the payload loads but baseline defense components do not
    defender_effect: requires joining allowlist mutation and service identity to actual boot consumption and asymmetric loaded-component outcome rather than checking BCD alone
    evidence_keys: [DI12-T1688-REF-01, DI12-T1688-REF-02, DI12-T1688-REF-05, DI12-T1688-REF-06]
    confidence: high
