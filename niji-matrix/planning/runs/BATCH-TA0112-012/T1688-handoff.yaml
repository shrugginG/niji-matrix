  automation_review: {canonical_prose_bulk_generated: false, mechanical_uses: [validation, allocation, bundle]}
  limitations:
    paragraphs:
      - zh: Snatch 与 Embargo 直接支持真实事件和 child，LockBit 支持另一实现；但不同 EDR/AV 对 Safe Mode 支持不同，公开报告通常不列完整 expected-versus-loaded component set，需按产品/版本和主机角色本地 canary。
        en: Snatch and Embargo directly support real incidents and the child, while LockBit supports another implementation. EDR and AV products differ in Safe Mode support, and public reports rarely enumerate the complete expected-versus-loaded component set, requiring local canaries by product, version, and host role.
