work_item_ref: WORK-TA0112-T1553
temporary_key_prefix: DI13-T1553
candidate: {source_type: attack, source_attack_id: T1553, name: {zh: 颠覆信任控制, en: Subvert Trust Controls}}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - zh: T1553 的六个子项跨越对象签名、root/anchor、verifier policy/provider 和 per-object provenance，若按 ATT&CK 名称复制会混合平台与介质。Niji 将父对象固定为 attacker-controlled trust input/state—named consumer decision—accepted execution/connection/content outcome，并按信任输入位于对象、anchor graph、evaluator state 或 provenance metadata 四个稳定位置建立原生变量。
        en: T1553's six children span object signatures, roots or anchors, verifier policy or providers, and per-object provenance, and copying their ATT&CK labels would mix platform and medium. Niji fixes the parent on attacker-controlled trust input or state to a named consumer decision to an accepted execution, connection, or content outcome and creates native variables from four stable locations of the trust input: the object, anchor graph, evaluator state, and provenance metadata.
proposed_content:
  summary: {zh: 攻击者改变安全消费者使用的信任证明、锚、验证器状态或来源约束，使恶意对象获得允许、可信或无警告的实际裁决。, en: Adversaries change trust evidence, anchors, verifier state, or provenance constraints consumed by security controls so a malicious object receives an actual allow, trusted, or no-warning decision.}
  definition_and_concept:
    paragraphs:
      - zh: 直接对象是 trust input/state 到 consumer decision 与 accepted outcome 的裁决差；签名、证书、Registry、xattr/ADS 或策略状态只是输入介质，只有被真实 consumer 消费并改变原本应拒绝/警告的结果才完成。
        en: The direct object is the decision difference from trust input or state through a consumer decision to an accepted outcome. A signature, certificate, Registry value, xattr or ADS, or policy state is only an input medium, and completion requires consumption by a real consumer that changes an outcome that should have been blocked or warned.
  stealth_characteristics:
    paragraphs:
      - zh: 恶意对象借用合法签名/锚/策略或缺少来源标记，粗粒度日志只显示“valid/trusted/allowed”并降低审查；残余包括 signer/chain、trust store/policy/provider old-new、provenance metadata、consumer/version/decision 和 first outcome。独立 issuance/build/delivery lineage 可揭示。
        en: A malicious object borrows a legitimate signature, anchor, or policy or lacks a provenance mark, leaving coarse logs with valid, trusted, or allowed and reducing scrutiny. Residue includes signer and chain, trust-store, policy, or provider old and new, provenance metadata, consumer, version, decision, and first outcome. Independent issuance, build, and delivery lineage exposes it.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入要求攻击者控制 trust input/state、明确 consumer 实际评估、决策与基线不同且恶意对象/会话被接受；只有配置或 metadata 改变、有效签名或执行都不足。网络中间介入、二进制内容破坏、一般证据删除和用户社会信任由相邻 owner 处理。
        en: Inclusion requires adversary control of trust input or state, evaluation by a named consumer, a decision differing from baseline, and acceptance of the malicious object or session. A configuration or metadata change, valid signature, or execution alone is insufficient. Network interposition, binary-content compromise, generic evidence deletion, and human social trust have adjacent owners.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者可用被盗签名证书签 malware、加入 root 让自签链被接受、改写 WinVerifyTrust/SIP/WDAC/Gatekeeper enforcement，或利用/制造 MOTW/quarantine 缺失，让 loader、浏览器、Office、Gatekeeper 或应用控制降低拦截与警告。
          en: An adversary can sign malware with a stolen certificate, enroll a root so a self-controlled chain is accepted, rewrite WinVerifyTrust, SIP, WDAC, or Gatekeeper enforcement, or exploit or create absence of MOTW or quarantine so a loader, browser, Office, Gatekeeper, or application control lowers blocking and warning.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 需要获得签名密钥/证书、trust store 或 verifier policy/provider 写权、对象 metadata/容器控制，并理解目标 consumer 的 chain、revocation、notarization、policy 与继承语义；错误签名、撤销、cache、policy sealing 和 delivery lineage 会暴露。
            en: The adversary needs a signing key or certificate, write authority over a trust store or verifier policy or provider, or control of object metadata or a container and knowledge of the target consumer's chain, revocation, notarization, policy, and inheritance semantics. Incorrect signatures, revocation, caches, sealed policies, and delivery lineage expose the operation.
      defender_model:
        paragraphs:
          - zh: 防守方需要独立信任基线、cert/issuance/revocation/build provenance、trust store/policy/provider 版本、ADS/xattr/容器继承、consumer/version/decision 与首个 execution/connection/content 结果；单看“签名有效”或当前 store/policy 会把攻击者输入误当信任事实。
            en: Defenders need independent trust baselines, certificate, issuance, revocation, and build provenance, trust-store, policy, and provider versions, ADS or xattr and container inheritance, consumer, version, and decision, and first execution, connection, or content outcome. A valid signature or current store or policy alone mistakes adversary input for trust fact.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: 恶意对象呈现消费者会接受的可信特征, en: A malicious object presents trusted features the consumer accepts}
      analysis:
        paragraphs:
          - zh: 攻击者让恶意对象携带有效签名/chain，或改变 anchor、policy/provider、provenance input，使 consumer 输出与合法对象相同的 trusted/allowed 特征。粗粒度分类把攻击者对象映射为可信来源，形成特征伪装；独立 build/issuance/delivery lineage 与历史状态可恢复差。
            en: The adversary gives a malicious object a valid signature or chain or changes anchor, policy or provider, or provenance input so the consumer emits the same trusted or allowed feature as for a legitimate object. Coarse classification maps the adversary object to a trusted source and produces Feature Disguise. Independent build, issuance, delivery lineage, and historical state recover the difference.
      evidence_keys: [DI13-T1553-REF-01, DI13-T1553-REF-03, REF-000281, DI13-T1553-REF-09, DI13-T1553-REF-10, REF-000594, DI13-T1553-REF-15]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 早期信任状态改变与后续裁决分置于不同证据面, en: Earlier trust-state change and later decision occupy different evidence planes}
      analysis:
        paragraphs:
          - zh: Anchor、policy/provider 或 provenance 在较早阶段被改变，真正允许结果在 loader/browser/Office/Gatekeeper 后续消费时出现；只看当前对象或决策日志缺少 writer 和原始来源，形成行为透明。版本化 state 与 decision/outcome 连接可恢复。
            en: An anchor, policy or provider, or provenance state is changed earlier, while the actual allow outcome appears when a loader, browser, Office, or Gatekeeper later consumes it. Current-object or decision-only logs lack the writer and original provenance and produce Behavioral Transparency. Joining versioned state to decision and outcome recovers the chain.
      evidence_keys: [DI13-T1553-REF-04, DI13-T1553-REF-05, DI13-T1553-REF-06, DI13-T1553-REF-11, DI13-T1553-REF-12, DI13-T1553-REF-13, DI13-T1553-REF-14]
      confidence: high
proposed_subtechniques:
  - {temporary_key: DI13-T1553-SUB-01, name: {zh: 对象信任证明借用, en: Object Trust-Attestation Borrowing}, stable_variable: malicious object carries a verifiable signature certificate or notarization identity while consumer trust policy remains materially unchanged, trace_change: object metadata shows valid signer or ticket but issuance key control build lineage revocation timing and object behavior diverge, defender_effect: requires artifact-signature decision joined to certificate and build provenance rather than trusting valid status, evidence_keys: [DI13-T1553-REF-03, DI13-T1553-REF-09, REF-000281], confidence: high}
  - {temporary_key: DI13-T1553-SUB-02, name: {zh: 信任锚图扩展, en: Trust-Anchor Graph Expansion}, stable_variable: attacker adds or promotes a root anchor so later certificate chains under attacker control become trusted, trace_change: trust store old-new and installer precede a consumer accepting a chain that was previously untrusted, defender_effect: requires anchor inventory chain consumption scope and outcome and distinct revocation or store recovery, evidence_keys: [DI13-T1553-REF-05, DI13-T1553-REF-10, DI13-T1553-REF-14], confidence: high}
  - {temporary_key: DI13-T1553-SUB-03, name: {zh: 验证策略与提供者改写, en: Verification-Policy and Provider Override}, stable_variable: attacker changes evaluator enforcement mode rule provider or SIP callback while object evidence and anchors may remain unchanged, trace_change: policy/provider old-new or module mapping diverges and a previously rejected input receives allow, defender_effect: requires verifier version effective policy provider/module load decision and outcome and has state-specific recovery, evidence_keys: [DI13-T1553-REF-02, DI13-T1553-REF-04, DI13-T1553-REF-07, DI13-T1553-REF-08, DI13-T1553-REF-11, DI13-T1553-REF-12, DI13-T1553-REF-13], confidence: high}
  - {temporary_key: DI13-T1553-SUB-04, name: {zh: 对象来源约束移除, en: Object Provenance-Constraint Removal}, stable_variable: attacker removes suppresses or prevents inheritance of per-object internet or quarantine provenance while trust policy itself remains active, trace_change: delivery parent or container has external provenance but child object loses Zone Identifier or quarantine before consumer decision, defender_effect: requires source-to-container-to-child metadata continuity and consumer route rather than trust-store monitoring, evidence_keys: [DI13-T1553-REF-02, DI13-T1553-REF-06, DI13-T1553-REF-08, REF-000594, DI13-T1553-REF-15], confidence: high}
