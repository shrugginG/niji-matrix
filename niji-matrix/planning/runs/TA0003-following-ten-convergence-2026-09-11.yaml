boundary_reviews:
- subjects: [NJT-0089, NJT-0090, NJT-0095]
  resolution_zh: NJT-0089 的直接对象是服务管理器定义；NJT-0090 是一般事件谓词—动作注册；NJT-0095 是 Office 认可的持久扩展状态。Outlook 事件谓词归 NJT-0090，Office 扩展内容与信任面归 NJT-0095，服务启动不与两者合并。
  resolution_en: NJT-0089 owns service-manager definitions NJT-0090 general event predicate-to-action registrations and NJT-0095 Office-recognized durable extension state. Outlook event predicates belong to NJT-0090 Office extension content and trust surfaces to NJT-0095 and service startup is not merged with either.
- subjects: [NJT-0087, NJT-0092, NJT-0097]
  resolution_zh: NJT-0087 修改主机软件二进制；NJT-0092 修改内部置备镜像并影响未来实例；NJT-0097 控制 OS 接管前 firmware/boot。三者按生命周期层和 consumer 分离。
  resolution_en: NJT-0087 modifies host software binaries NJT-0092 internal provisioning images affecting future instances and NJT-0097 firmware or boot before OS takeover. They separate by lifecycle layer and consumer.
- subjects: [NJT-0083, NJT-0055, NJT-0093]
  resolution_zh: NJT-0083 修改既有身份自身状态；NJT-0055 使用远程服务建立/恢复会话；NJT-0093 修改共享验证路径或策略结果。账户、会话和验证器分别为直接对象。
  resolution_en: NJT-0083 modifies an existing identity's state NJT-0055 establishes or restores a session through a remote service and NJT-0093 changes a shared validation path or policy outcome. Account session and validator are separate direct objects.
- subjects: [NJT-0094, NJT-0084, NJT-0089, NJT-0093, NJT-0095]
  resolution_zh: NJT-0094 不吸收所有 Registry 用途，只拥有以后被消费的 Registry 驻留状态与 API 视图差；自启动、服务、认证与 Office 语义继续由各自父技术拥有。
  resolution_en: NJT-0094 does not absorb every Registry use and owns only later-consumed Registry-resident state plus API-view differentials while autostart service authentication and Office semantics remain with their parents.
- subjects: [NJT-0091, NJT-0096]
  resolution_zh: NJT-0091 要求排除其他入口且自身入口存续；NJT-0096 要求状态转换本会终止当前易失入口。前者不是一般防御破坏，后者不是一般可用性影响。
  resolution_en: NJT-0091 requires exclusion of other entry with own-entry survival and NJT-0096 requires a state transition that would otherwise terminate a current volatile entry. The former is not generic defense impairment and the latter not generic availability impact.
