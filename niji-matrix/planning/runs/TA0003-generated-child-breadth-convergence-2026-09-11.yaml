cross_technique_boundary_resolutions:
  - objects: [NJT-0083, NJT-0088, NJT-0086]
    resolution_zh: NJT-0083 改变既有身份的认证器、授权边或设备信任；NJT-0088 创建新身份；NJT-0086 的持续载体是独立应用/client 集成与 consent。身份、账户和应用对象键不可互换。
    resolution_en: NJT-0083 mutates authenticator, authorization edge, or device trust of an existing identity; NJT-0088 creates a new identity; NJT-0086 persists through an independent application or client integration and consent. Identity, account, and application object keys are not interchangeable.
  - objects: [NJT-0084, NJT-0085]
    resolution_zh: NJT-0084 的直接对象是生命周期消费的目标描述符；NJT-0085 的直接对象是解释执行的脚本正文/钩子。描述符指向脚本时可以并列记录，但不合并子项。
    resolution_en: NJT-0084 directly owns a lifecycle-consumed target descriptor; NJT-0085 directly owns interpreted script body or hook. Both may be recorded when a descriptor points to a script, but their children are not merged.
  - objects: [NJT-0084, NJT-0085, NJT-0087]
    resolution_zh: NJT-0087 改变软件二进制内容；启动描述符或初始化脚本只是调用载体。路径相同不改变 direct-object 边界。
    resolution_en: NJT-0087 changes software-binary content; autostart descriptor or initialization script is only an invocation carrier. A shared path does not change the direct-object boundary.
  - objects: [NJT-0063]
    resolution_zh: BITS 作业 GUID、状态、文件队列和通知构成独立对象，跨 TA0002/TA0003 复用，不与通用启动、脚本或云集成对象合并。
    resolution_en: BITS job GUID, state, file queue, and notification form an independent object reused across TA0002 and TA0003 and are not merged with generic startup, script, or cloud-integration objects.
