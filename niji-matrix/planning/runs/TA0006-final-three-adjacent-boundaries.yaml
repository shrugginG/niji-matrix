- id: NJT-0227
  name:
    zh: 认证证书控制取得与构造
    en: Authentication-Certificate Control Acquisition and Construction
  scope:
    paragraphs:
    - zh: 纳入既有认证证书私钥控制的取得、通过不符合组织批准意图的受信上下文取得认证证书，以及使用受信签名能力构造认证证书。证据应支持认证用途、对应私钥控制或可用构造结果；仅有公开证书、弱模板、管理员权限、导出调用或一次成功登录不足以证明取得。合法备份、迁移、自动注册、代理代办和恢复会产生相似痕迹，需核对所有者、请求控制、目标身份、批准范围和输出保管。
      en: Include acquisition of private-key control for existing authentication certificates, acquisition through trusted enrollment inconsistent
        with organizational approval, and construction using trusted signing capability. Evidence must support authentication purpose and
        corresponding key control or a usable construction result. A public certificate, weak template, administrative privilege, export
        invocation, or successful sign-in alone is insufficient. Legitimate backup, migration, autoenrollment, delegation, and recovery require
        checks of ownership, request control, subject, approved scope, and output custody.
    - zh: 受管理保管库取用、OS 认证秘密提取和未保护文件中的秘密暴露各有相邻对象；存储路径结果与认证证书材料结果可以分别举证。应用令牌取得、Web 或联合断言构造、认证组件修改、账户认证器增补和有效身份使用不由证书格式统一接管。KDC 在正常 PKINIT 中签发
        TGT 不等于 Kerberos 票据伪造。
      en: Managed-store retrieval, OS authentication-secret extraction, and unprotected-file exposure are neighboring behaviors; storage-path
        and certificate-material outcomes can be independently supported. Application-token acquisition, web or federation assertion construction,
        authentication-component changes, account-authenticator additions, and valid-identity use do not transfer ownership merely because
        certificates are involved. Normal KDC issuance of a TGT during PKINIT is not Kerberos ticket forgery.
    - zh: 仅用于 C2 加密、服务器 TLS、内容签名或根信任安装的证书行为不属于本项。借用公开 CA 证书但未掌握签名私钥不能构造可信身份材料；仅调用已有不可导出密钥完成一次认证也不能自动证明独立的凭据取得路径。
      en: Certificate behavior solely for C2 encryption, server TLS, content signing, or root installation is outside scope. Borrowing a
        public CA certificate without its signing key does not enable trusted identity construction, and invoking an existing non-exportable
        key for an authentication does not automatically establish an independent acquisition path.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 受信签发上下文挟持改变实际控制者与请求身份、代理范围及批准意图的关系，仍保留正常签发事务；脱离签发链的认证证书构造改变新材料是否经过权威服务，产生签发到接受的记录断裂。前者需要来源与授权判断，后者需要完整历史签发库存及独立构造证据。
        en: Trusted Enrollment-Context Hijacking changes the relationship among actual controller, request identity, delegation scope, and
          approval intent while retaining normal issuance. Off-Issuance-Chain Authentication-Certificate Construction changes whether new
          material passes through the authority, disrupting issuance-to-acceptance continuity. The former needs origin and authorization
          context; the latter needs complete historical inventory and independent construction evidence.
      - zh: 既有终端私钥取得属于父级核心，并不按文件、内存、容器格式或保管产品再分项。两项子技术不宣称穷尽所有实现；若事件分别具有受信签发与服务外构造证据，可以按阶段并列。不可导出调用、有效期调整和提交频率不能仅凭可行性成为额外分类。
        en: Existing end-entity key acquisition remains parent core rather than being split by files, memory, containers, or vault products.
          The children do not claim exhaustive implementation coverage, and an event with separate evidence of enrollment and off-service
          construction can carry both by stage. Non-exportable invocation, validity adjustments, and request cadence do not form additional
          partitions from feasibility alone.
    coverage: established
    subtechnique_refs:
    - NJS-0227-001
    - NJS-0227-002
- id: NJT-0178
  name:
    zh: 应用访问令牌取得
    en: Application Access Token Acquisition
  scope:
    paragraphs:
    - zh: 纳入要求访问令牌、刷新令牌或等价应用 API 授权材料实际返回、被读取或被复制到攻击者控制接收者。T1606/NJT-0166 拥有在正规签发链之外新构造令牌、断言或 Web 认证材料；正规 issuer 返回原令牌给恶意 client、受侵工作负载或被接管
        redirect 属本对象。T1550.001 拥有已取得应用访问令牌的提交与使用；T1078/NJT-0061 拥有身份或会话被 relying party 接受并形成入口。三者可按取得、呈现和接受分别并列，任何后继阶段都不能补写前一阶段。
      en: Inclusion requires an access token, refresh token, or equivalent application API authorization material to be returned, read, or
        copied into an adversary-controlled recipient. T1606/NJT-0166 owns construction of a new token, assertion, or web authentication
        material outside the legitimate issuance chain. An original token returned by the legitimate issuer to a malicious client, compromised
        workload, or captured redirect belongs here. T1550.001 owns presentation and use of an acquired application token, while T1078/NJT-0061
        owns relying-party acceptance that creates entry. Acquisition, presentation, and acceptance may be co-recorded separately, and a
        later stage cannot backfill an earlier one.
    - zh: T1539 处理浏览器或 Web 应用以 Cookie 语义维护的会话状态；T1528 处理面向 API/resource server、具有 issuer/audience/scope 或等价授权语义的应用令牌。如果同一 bearer 值既作为 Cookie
        又作为 API token，必须依据实际材料格式、投递方式和依赖方用途证明两个对象。T1555/NJT-0147 处理受管理保管库或解锁边界的读取路径，普通文件或配置中的散落秘密可能归 T1552；当其中返回的材料是应用令牌时可与本对象并列，但只发现或打开存储对象不足以证明令牌值已取得。
      en: T1539 covers browser or web-application session state maintained with cookie semantics. T1528 covers application tokens presented
        to an API or resource server with issuer, audience, scope, or equivalent authorization meaning. If one bearer value serves as both
        a cookie and an API token, both objects require evidence from material format, delivery method, and relying-party purpose. T1555/NJT-0147
        owns retrieval through a managed vault or unlock boundary, and loose secrets in ordinary files or configuration may belong to T1552.
        Either can coexist when the returned material is an application token, but finding or opening the storage object does not prove the
        token value was acquired.
    - zh: T1056/NJT-0169 处理口令、表单或其他认证输入被截获；若认证成功后另有 token response 被复制，输入与令牌结果分别成立。合法 OAuth 委派、云 attached identity、容器 service account、CI/CD
        runner 和第三方集成都会正常取得 token；须以 app/workload owner、批准 client/redirect、scope、资源用途、运行代码来源和 recipient 控制权排除。既有第三方集成被供应商攻陷可由 NJS-0086-003
        描述持久关系控制转移，而具体 token 材料落入攻击者控制面仍由本对象另证。
      en: T1056/NJT-0169 covers interception of passwords, forms, or other authentication input. If a token response is separately copied
        after authentication, input and token outcomes can both apply. Legitimate OAuth delegation, cloud attached identity, container service
        account, CI/CD runner, and third-party integration all normally obtain tokens and require exclusion through application or workload
        owner, approved client and redirect, scope, resource purpose, runtime-code provenance, and recipient control. NJS-0086-003 may describe
        durable integration-control transfer after vendor compromise, while this object separately requires evidence that concrete token
        material entered adversary control.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 建议按完整 token 材料在被取走前的稳定位置和取得路径建立三项 Niji 原生子技术。签发返回面令牌取得发生在 authority 新返回 token 的事务中，不读取旧材料；持久令牌工件读取从文件、Secret、投影卷、仓库或持久 cache
          取得已存在 token；易失运行态令牌提取从进程内存、环境、临时脚本、broker/IPC 或仅在 job 生命周期存在的状态取得 token。三者分别需要 issuer/request、object-read 和 process-runtime 观察面。
        en: Propose three Niji-native children based on the stable location of complete token material immediately before acquisition and
          the acquisition path. Issuance-Return Token Acquisition occurs in the transaction where an authority newly returns a token and
          does not read existing material. Persisted Token-Artifact Retrieval obtains an existing token from a file, Secret, projected volume,
          repository, or durable cache. Volatile Runtime Token Extraction obtains one from process memory, environment, a temporary script,
          broker or IPC, or state existing only for the job lifetime. The three require issuer and request, object-read, and process-runtime
          observation respectively.
      - zh: OAuth、云厂商、容器、设备、应用、API、产品和 token 格式只是实现维度。材料有效性横跨三项：任何位置都可能保存有效、过期、撤销或 sender-constrained token，因此它是结果分级而不是第四子项。CASE-000064 证明
          token 在攻击者控制下和完整撤销需求，却没有说明其来自返回、工件还是运行态，故只支持父级与防御，不用于任一子项成立。
        en: OAuth, cloud vendor, container, device, application, API, product, and token format are implementation dimensions. Material usability
          crosses all three children because any location can contain a valid, expired, revoked, or sender-constrained token, so it is an
          outcome grade rather than a fourth child. CASE-000064 establishes adversary control of tokens and the need for complete revocation
          without identifying whether acquisition came from return, artifact, or runtime, and therefore supports only the parent and defense
          rather than any child.
    coverage: established
    subtechnique_refs:
    - NJS-0178-001
    - NJS-0178-002
    - NJS-0178-003
- id: NJT-0147
  name:
    zh: 受管理凭据保管库取用
    en: Managed Credential-Store Retrieval
  scope:
    paragraphs:
    - zh: 纳入必须同时有受管理保管库对象、攻击者驱动的越界取用，以及可说明匿迹收益的可控观察变量。普通备份、用户发起的导出、同步、迁移、批准的管理员调查或受信工作负载定期读取可产生同类事件；必须核对任务单、所有者、调用身份、来源、目标条目、输出和时间。仅凭文件名、security
        命令、GetSecretValue 或可疑进程访问不足以断言已获可用凭据。
      en: Inclusion requires a managed-store object, attacker-driven access across its protection boundary, and a controllable observation
        variable with a defensible stealth effect. Backups, user-initiated exports, synchronization, migration, approved administration,
        and scheduled workload reads can create similar events. Assessment must compare ticket, owner, caller, origin, target item, output,
        and timing. A filename, security invocation, GetSecretValue call, or suspicious process access alone is insufficient to claim a usable
        credential was obtained.
    - zh: T1552 处理未受保护的散落秘密；T1003 处理操作系统认证材料转储，而非普通应用密码库的运行态；NJT-0137/NJS-0137-003 处理取得可比对材料后的候选验证；T1056 处理秘密输入时的截获；T1528 处理应用令牌本身。若原始卷或影子副本绕过活动文件路径，介质层归
        NJT-0108，本技术仅在证据继续指向保管库材料及其解锁或返回时并列成立。偷到令牌后直接重放、或使用已得口令登录，是后继行为，不把凭据获取改写成身份使用。
      en: T1552 covers loose unprotected secrets; T1003 covers operating-system authentication-material dumping rather than ordinary application-vault
        runtime; NJT-0137/NJS-0137-003 covers candidate validation after comparable material is acquired; T1056 covers interception as a
        secret is entered; and T1528 owns application tokens as the target material. If raw-volume or shadow-copy access bypasses the live
        file path, NJT-0108 owns that access medium; this technique coexists only when evidence continues to vault material and its unlock
        or return. Replaying a stolen token or signing in with an acquired password is a successor behavior, not a redefinition of acquisition.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 正式子技术按两种可跨产品复现的观察变量划分。受信消费身份转用改变保管库记录的调用主体与实际控制者之间的关系，需把配置、消费身份、秘密返回和输出相连；解锁运行态旁路取密改变取用位置，逐项读取记录可能缺席，但高权进程访问和转储成为残余。两项可在同一入侵链先后发生，却有不同的前态、数据源、误报和控制动作。
        en: 'The two formal children use observation variables that can recur across products. Trusted-consumer identity repurposing changes
          the relation between the caller recorded by a vault and the actual controller, requiring joins among configuration, consumer, secret
          return, and output. Unlocked-runtime bypass changes where retrieval occurs: per-item reads may be absent while high-rights process
          access and dumps remain. The children can occur sequentially in one intrusion but differ in prior state, data, false positives,
          and controls.'
      - zh: 钥匙串、浏览器、Windows 凭据集、密码管理器和云秘密服务是实现位置，不是子项名称。密文副本复制同样会改变审计视角，但已公开的 UNC1069 与 UNC2465 事件未证明同一副本被解锁或返回可用秘密，因此不建立第三子项。未来若有同一事件的副本、解锁和秘密结果证据，应重新审查；当前两项结果来自六项实现覆盖与第二轮原生变量搜索，而非数量配额。
        en: Keychains, browsers, Windows credential sets, password managers, and cloud secret services are implementation locations, not
          child labels. Copying ciphertext also shifts the audit view, but the published UNC1069 and UNC2465 events do not prove the same
          copy was unlocked or returned a usable secret, so no third child is established. Same-incident evidence joining copy, unlock, and
          secret result would reopen this decision. The two-child result follows coverage of all six implementations and a second native-variable
          search rather than a numeric quota.
    coverage: established
    subtechnique_refs:
    - NJS-0147-001
    - NJS-0147-002
- id: NJT-0169
  name:
    zh: 认证输入路径截获
    en: Authentication-Input Path Interception
  scope:
    paragraphs:
    - zh: 纳入要求同时存在认证输入、攻击者驱动的截获路径、实际内容结果和可说明匿迹收益的观察差。合法无障碍、输入法、远程支持、密码管理器自动填充、软件测试、DLP 或遥测代理可能取得相似权限或读取相同界面；必须核对批准身份、签名、版本、会话、目标应用、工单和结果去向。只看到
        SetWindowsHookEx、/dev/input 打开、TCC 授权、脚本提示或登录页变更是调查线索，不能单独断言秘密已获。
      en: Inclusion requires authentication input, an attacker-driven interception path, an actual content result, and an observation difference
        that explains stealth value. Accessibility, input methods, remote support, password-manager autofill, testing, DLP, and telemetry
        agents can hold similar authority or read the same interface. Assessment must check approved identity, signature, version, session,
        target app, ticket, and result destination. SetWindowsHookEx use, a /dev/input open, TCC authority, a scripted prompt, or a login-page
        change is an investigative lead and cannot alone establish secret acquisition.
    - zh: 屏幕像素归 T1113/NJT-0158，浏览器已经显示或返回的页面内容归 NJT-0145，麦克风或通话音频归 T1123，摄像头和视频帧归 T1125。受管理保管库中已存秘密归 NJT-0147/T1555，散落文件或配置中的秘密归 T1552；提交后形成的应用令牌和
        Web 会话 Cookie 分别归 T1528 和 T1539。若 Hook 改变认证决定或持久接受条件而非只复制输入，T1556 拥有该改变；同一事件可在各直接对象都有独立证据时并列标记。
      en: Display pixels belong to T1113/NJT-0158, page content already rendered or returned in a browser belongs to NJT-0145, microphone
        or call audio belongs to T1123, and camera or video frames belong to T1125. Existing secrets in managed stores belong to NJT-0147/T1555
        and loose secrets in files or configuration to T1552. Application tokens and web session cookies created after submission belong
        to T1528 and T1539 respectively. If a hook changes the authentication decision or durable acceptance condition rather than merely
        copying input, T1556 owns that change; an event may carry both labels only with evidence for each direct object.
    - zh: 恶意中间路径若改变终端与服务之间的信任指向，NJT-0136/T1557 可描述路径介入；本技术只在用户输入内容又被实际捕获时成立。诱饵邮件、恶意链接和页面投递属于相邻的初始访问行为，不能代替表单内容已交给攻击者的证据。输入被捕获后再压缩、加密、暂存或分批外传属于各自后继动作，不按文件格式、平台、产品或输入字段类别拆分子项。
      en: When a malicious intermediary changes trust direction between endpoint and service, NJT-0136/T1557 can describe the path intervention;
        this technique applies only when user input content is also actually captured. Lure email, malicious links, and page delivery are
        adjacent initial-access behavior and do not substitute for proof that form content reached the attacker. Compression, encryption,
        staging, or batched egress after capture is successor behavior and does not create children by file format, platform, product, or
        input-field category.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 本分类只按输入信任路径和真正接收者的控制位置划分。消费者前输入流旁路在预期应用解析前形成副本；真实消费者内提交镜像保留真正应用或 origin，却在内部增加第二接收路径；仿冒消费者诱导取密则保留外观并改变进程、origin 或提交归属。三项分别要求输入权限与设备遥测、静态和运行态完整性、以及界面身份与
          IdP 事务差分。
        en: The taxonomy is divided only by input trust path and control location of the true receiver. Pre-Consumer Input-Stream Bypass
          forms a copy before the intended app parses input. Genuine-Consumer Submission Shadowing retains the genuine app or origin but
          adds an internal second receiver. Impersonated-Consumer Credential Elicitation retains appearance while changing process, origin,
          or submission ownership. The three require input-authority and device telemetry, static and runtime integrity, and interface-identity
          to IdP-transaction differential respectively.
      - zh: 键盘、GUI、Web、API、操作系统和产品是实现介质，不构成子项。窗口或页面条件门控由 NJS-0132-001 拥有；捕获后缓存、加密、暂存和分批外传属于后继处理。ATT&CK 的四项子技术已逐项核对覆盖，但没有直接复制或机械合并为 NJS。
        en: Keyboard, GUI, web, API, operating system, and product are implementation media and do not define children. Window or page context
          gating is owned by NJS-0132-001, while buffering, encryption, staging, and batched egress after capture are successor handling.
          All four ATT&CK children were checked for coverage without being copied or mechanically merged into NJS objects.
    coverage: established
    subtechnique_refs:
    - NJS-0169-001
    - NJS-0169-002
    - NJS-0169-003
- id: NJT-0137
  name:
    zh: 候选秘密反复验证
    en: Repeated Candidate-Secret Verification
  scope:
    paragraphs:
    - zh: 纳入范围要求存在针对未知秘密的重复候选验证，并有可论证的节奏、分布或验证位置变化。用户偶发输错、批准的安全测试、批量密码重置与正常账户恢复可产生相似日志，应结合授权、目标、请求序列和结果排除。单次使用已知有效口令属于有效账户使用；仅收集用户名、密码策略或泄露清单属于前期身份侦查或凭据材料获取。
      en: Inclusion requires repeated candidate validation of an unknown secret and a defensible change in timing, distribution, or verifier
        location. Ordinary mistyping, authorized security tests, bulk password resets, and account recovery can resemble parts of the logs;
        authorization, targets, request sequence, and outcomes must be checked. One-time use of an already known valid password belongs to
        valid-account use. Merely collecting usernames, password policies, or leaked lists belongs to prior identity reconnaissance or credential-material
        acquisition.
    - zh: T1557 控制凭据承载通信的信任路径，T1110 控制对未知秘密的候选验证；通过中间人得到握手或哈希可以成为离线验证的前提，但路径介入和后续候选测试是两个可分事件。取得哈希本身不等于已破解，哈希的直接重放也不是候选秘密验证。在线失败之后的成功事件需要区分首因验证、MFA
        阻断和真正获得资源访问。
      en: T1557 controls the trust path carrying credential exchanges, whereas T1110 controls candidate validation of an unknown secret.
        An intercepted handshake or hash may become a prerequisite for offline testing, but path intervention and subsequent candidate testing
        are separable events. Hash acquisition alone does not prove cracking, and direct replay of a hash is not candidate-secret verification.
        A success after online failures requires distinguishing a matched primary secret, an MFA block, and actual resource access.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 本技术按候选判断如何进入防守视野划分三项子技术。时间展延改变同一可关联在线序列的密度，跨主体与来源分布改变验证事件的账号—来源拓扑，验证器脱离则改变候选判断发生的控制域，使目标服务不再产生逐次失败。前两项可同时成立，但分别要求长窗单身份重建与跨身份图关联；第三项需要材料取用和后继使用链，而非在线登录阈值。
        en: The three children partition how candidate judgments enter the defender's view. Temporal dilution changes density within one
          linkable online sequence; cross-principal and source distribution changes the account-to-source topology of verifier events; detached
          verification changes the control domain where candidates are judged, removing per-trial failures from the target service. The first
          two can co-occur but need different long-horizon principal and cross-identity graph joins. The third needs material-access and
          later-use lineage instead of online login thresholds.
      - zh: 字典猜测、泄露凭据对、密码喷洒和离线破解是候选输入或行为情境，不是直接移植的 Niji 子项名称。同一泄露凭据对可以按时间展延或来源分布提交，已获哈希的离线比较也不等于先前转储材料的行为。离线分析只能报告暴露和可能的后继风险，除非直接看到可信计算端活动，不能以零失败日志断言破解成功。
        en: Dictionary guesses, leaked credential pairs, password spraying, and offline cracking describe candidate input or behavior context
          rather than imported Niji child names. One leaked pair can be submitted with temporal or source distribution, and offline comparison
          of acquired hashes is distinct from the earlier dumping action. Offline analysis reports exposure and possible later risk; absent
          trusted visibility into the compute host, zero server failures cannot prove cracking succeeded.
    coverage: established
    subtechnique_refs:
    - NJS-0137-001
    - NJS-0137-002
    - NJS-0137-003
- id: NJT-0166
  name:
    zh: 离权威 Web 认证材料构造
    en: Off-Authority Web Authentication Material Construction
  scope:
    paragraphs:
    - zh: 纳入需要证明攻击者构造了一个此前不存在的 Web 认证材料或认证链辅状态，并有密码学秘密、信任状态、格式语义或依赖方结果支持其可接受性。只发现签名密钥被读取、证书被导出或联合信任被修改，不足以证明材料已经构造；只有成功登录也不能区分伪造、窃取、重放或合法签发。证据应分为构造、依赖方接受和资源使用三级，并允许在缺少后级证据时保留较低置信度，而不把各级拼接为未观察到的完整攻击链。
      en: Inclusion requires evidence that the adversary constructed previously nonexistent web authentication material or auxiliary authentication-chain
        state, supported by a cryptographic secret, trust state, format semantics, or relying-party result showing potential acceptability.
        Finding a signing-key read, certificate export, or federation-trust change alone does not prove construction. A successful sign-in
        alone cannot distinguish forgery from theft, replay, or legitimate issuance. Evidence should be tiered as construction, relying-party
        acceptance, and resource use, retaining lower confidence when later stages are absent rather than splicing them into an unobserved
        complete chain.
    - zh: T1539 与 T1528 处理既有 Cookie 或应用访问令牌的取得，本技术只拥有新材料构造；T1558 处理 Kerberos 票据而非 Web/联合材料；T1556 及现有 NJT-0093/NJT-0100 处理验证器、认证流程或联合信任状态修改，若修改后又构造材料可以并列映射。T1649
        或密钥取用技术拥有证书、私钥或共享秘密的取得阶段。Valid Accounts 与 NJT-0061 处理身份或会话被依赖方实际用于进入，资源访问是本技术的后继结果。AWS STS 等合法服务根据有权请求正式签发新凭据时，即使权限被滥用，也不因“新”而成为本技术；只有攻击者自行构造输入证明或输出材料，且签发权威没有执行对应正常流程时才纳入。
      en: T1539 and T1528 cover acquisition of existing cookies or application access tokens; this technique owns only newly constructed
        material. T1558 owns Kerberos tickets rather than web or federation material. T1556 and existing NJT-0093 or NJT-0100 own modifications
        to validators, authentication processes, or federation trust; a later construction event can be co-mapped. T1649 or key-retrieval
        techniques own acquisition of certificates, private keys, or shared secrets. Valid Accounts and NJT-0061 own actual identity or session
        use for entry, and resource access is a successor outcome. When a legitimate service such as AWS STS authoritatively issues new credentials
        for an authorized request, abuse does not become forgery merely because the credentials are new. Inclusion requires adversary construction
        of the input proof or output material without the authority performing the corresponding normal flow.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 本技术以材料在正常权威签发链之外如何获得可信外观划分两项子技术。签发链外可信证明铸造利用活动 signer、预认证密钥或等价秘密独立构造完整声明，使依赖方接受而权威侧没有对应认证/签发；组合认证辅状态伪造保留真实主认证，却伪造 MFA、remember-device
          或应用本地辅状态，使最终会话缺少对应外部事务。
        en: The two children separate how material acquires a trusted appearance outside the normal authoritative issuance chain. Trusted-proof
          minting uses an active signer, preauthentication key, or equivalent secret to construct a complete assertion independently, producing
          relying-party acceptance without matching authentication or issuance. Auxiliary-state forgery retains genuine primary authentication
          but forges MFA, remembered-device, or app-local state so the final session lacks the corresponding external transaction.
      - zh: Cookie 和 SAML 是实现介质，不是 Niji 分类。Issuer、Audience、Recipient、时限、请求绑定与重放状态是完整证明轴的验证维度，当前证据不足以形成独立兄弟项。权威 API 按策略正式签发的新临时凭据不属于链外伪造；偷来的
          Cookie/token 归 T1539/T1528，新增 signer 或信任状态归 T1556/NJT-0093，实际材料构造可在证据独立时并列。
        en: Cookie and SAML are implementation media rather than Niji partitions. Issuer, Audience, Recipient, lifetime, request binding,
          and replay state are validation dimensions of the complete-proof axis and lack evidence for a separate sibling. New temporary credentials
          formally issued by an authoritative API under policy are not off-chain forgery. Stolen cookies or tokens belong to T1539 or T1528;
          added signer or trust state belongs to T1556 or NJT-0093, while material construction may co-occur when separately evidenced.
    coverage: established
    subtechnique_refs:
    - NJS-0166-001
    - NJS-0166-002
- id: NJT-0177
  name:
    zh: 操作系统认证材料提取
    en: Operating-System Authentication-Material Extraction
  scope:
    paragraphs:
    - zh: 纳入要求对象是操作系统或目录认证权威维护的认证材料，攻击者驱动了越权或非预期取用，并有材料内容、可识别输出或权威响应证据。仅加载 Mimikatz、获得 SeDebugPrivilege、打开 LSASS、复制加密数据库、列出目录对象、取得 DRS 权限或读取
        /proc/maps 都是能力或前置阶段；没有材料结果时不能完成父技术。合法 EDR、反恶意软件、崩溃诊断、备份、域复制、密码轮换、灾备和取证可产生同类事件，必须核对 owner、工单、签名、来源、对象范围、输出和时间。
      en: Inclusion requires authentication material maintained by an operating-system or directory authentication authority, adversary-driven
        unauthorized or unintended retrieval, and evidence of material content, identifiable output, or an authoritative response. Loading
        Mimikatz, obtaining SeDebugPrivilege, opening LSASS, copying an encrypted database, listing directory objects, obtaining DRS rights,
        or reading /proc/maps is capability or preparation only. The parent is incomplete without a material result. Legitimate EDR, antimalware,
        crash diagnostics, backup, domain replication, password rotation, disaster recovery, and forensics can produce similar events and
        require comparison of owner, case, signature, origin, object scope, output, and time.
    - zh: NJT-0147/T1555 处理操作系统、浏览器、密码管理器或云服务所维护的普通凭据保管条目及已解锁消费路径；本技术处理操作系统认证权威本身的登录材料、账户数据库和域验证材料。T1552 处理散落在普通文件、历史、配置或消息中的未受保护秘密，/etc/shadow
        因其系统账户验证角色和受限读取属于本技术。NJT-0169/T1056 在用户提交前或提交时复制输入；NJT-0093/T1556 改变认证过程或增加秘密旁路；本技术只读取既有状态。NJS-0137-003 在材料取得后测试未知候选；NJT-0108 拥有原始卷或副本视图绕过，二者在同一事件分别证明介质与认证材料结果时并列。一般内存采集若未证明认证材料内容，不进入本技术。
      en: NJT-0147/T1555 covers ordinary credential-vault items and unlocked consumer paths maintained by operating systems, browsers, password
        managers, or cloud services. This technique covers login material, account databases, and domain verification material belonging
        to the operating-system authentication authority itself. T1552 covers unprotected secrets scattered in ordinary files, history, configuration,
        or messages; /etc/shadow belongs here because of its system-account verification role and restricted read. NJT-0169/T1056 copies
        input before or during submission. NJT-0093/T1556 changes the authentication process or adds a secret side output; this technique
        reads existing state. NJS-0137-003 tests unknown candidates after material acquisition. NJT-0108 owns raw-volume or copy-view bypass;
        both apply to one event only when medium and authentication-material outcomes are each proven. Generic memory acquisition without
        authentication-material content does not enter this technique.
  taxonomy:
    narrative:
      paragraphs:
      - zh: 本分类按读取主体、存储视图和权威导出控制面划分。可信凭据读取上下文转用把代码移入正常会接近认证材料的 reader；非活动认证存储视图提取从快照、备份或原始派生视图取出存储；目录复制式认证材料导出让权威目录服务通过复制协议返回秘密。三项分别要求 reader
          provenance、copy-to-object mapping 和 caller/rights/response 关联。
        en: The taxonomy divides by reader, storage view, and authoritative export control plane. Trusted Credential-Reader Context Repurposing
          places code inside a reader normally expected near authentication material. Inactive Authentication-Store View Extraction removes
          a store through snapshot, backup, or raw-derived view. Directory-Replication Authentication-Material Export makes the authoritative
          directory service return secrets through replication. They require reader provenance, copy-to-object mapping, and caller, rights,
          and response correlation respectively.
      - zh: LSASS、SAM、NTDS、LSA、cache、DCSync、proc、passwd/shadow、Windows 和 Linux 是材料或实现，不构成子项。普通高权进程直接读活动存储留在父级；低量账户范围、dump 加密和离线猜测因证据或相邻所有权不建项。
        en: LSASS, SAM, NTDS, LSA, cache, DCSync, proc, passwd or shadow, Windows, and Linux are materials or implementations rather than
          children. Direct reading of a live store by an ordinary privileged process remains parent core. Low-volume account scope, dump
          encryption, and offline guessing do not form children because of evidence limits or adjacent ownership.
    coverage: established
    subtechnique_refs:
    - NJS-0177-001
    - NJS-0177-002
    - NJS-0177-003
- id: NJT-0184
  name:
    zh: 替代认证材料横向使用
    en: Lateral Use of Alternate Authentication Material
  scope:
    paragraphs:
    - zh: 纳入要求材料在本次使用前已经由系统生成并进入攻击者控制，攻击者随后实际提交该材料或用其完成协议证明，目标接受并出现另一内部资源结果。材料的存在、导出文件、内存读取、token claims、ticket cache、hash dump、提交尝试或拒绝分别只证明前提或
        attempt。合法 SSO、应用 refresh、服务账户、票据续期、浏览器恢复、管理员自动化和灾难恢复会产生同形事件，必须以所有者、批准 client/device、允许来源、audience/scope、时间和资源用途排除。
      en: Inclusion requires material already generated by the system and under adversary control before this use, actual presentation of
        the material or completion of protocol proof with it, target acceptance, and a result on another internal resource. Material presence,
        an exported file, a memory read, token claims, a ticket cache, a hash dump, a presentation attempt, and a rejection respectively
        establish only prerequisites or an attempt. Legitimate SSO, application refresh, service identities, ticket renewal, browser recovery,
        administrator automation, and disaster recovery create the same event shapes and require owner, approved client or device, permitted
        origin, audience and scope, time, and resource purpose as exclusions.
    - zh: NJT-0178/T1528 以完整 access/refresh material 返回、读取或复制到攻击者接收者为完成点，T1550 从其后“材料被呈现”开始；正规 token endpoint 因 refresh material 返回新 access
        token时，两者可分别记录 input use 与 output acquisition。NJT-0166/T1606、T1558 及其他伪造对象拥有权威链外构造的新材料；T1556/NJT-0093 拥有 verifier、provider、trust
        或策略被修改后产生的异常接受。已盗原件按原验证规则被使用才属于本对象。
      en: NJT-0178 or T1528 completes when full access or refresh material is returned, read, or copied into an adversary recipient; T1550
        begins when that material is presented. When a legitimate token endpoint returns a new access token in response to refresh material,
        input use and output acquisition can be recorded separately. NJT-0166 or T1606, T1558, and other forgery objects own newly constructed
        material outside the authoritative chain. T1556 or NJT-0093 owns anomalous acceptance caused by modified verifiers, providers, trust,
        or policy. This object applies when a stolen original is used under the existing validation rules.
    - zh: 资源直接接受仍有效 Cookie/access token/browser state 而没有新完整认证链时，接受和使用的匿迹变量已由 NJS-0061-002“既有认证会话续用”拥有；外部 VPN/网关的新会话重放另由 NJS-0055-001 所有。T1550
        可与它们共映射材料呈现阶段，但不重复建立“会话续用”子项。NJT-0151 要求控制者进入同一个既有远程传输或交互会话；T1550 则用材料触发另一验证、派生或资源接受，即使最终账户相同也不是会话控制端接管。
      en: When a resource directly accepts a still-valid cookie, access token, or browser state without a fresh complete authentication chain,
        NJS-0061-002, Reuse of Established Authenticated Sessions, already owns the acceptance-and-use stealth variable; creation of a new
        external VPN or gateway session by replay is separately owned by NJS-0055-001. T1550 can co-map the material-presentation stage without
        creating another session-reuse child. NJT-0151 requires the adversary to enter the same existing remote transport or interactive
        session. T1550 instead uses material to trigger another validation, derivation, or resource acceptance, even when the represented
        account is unchanged.
    - zh: T1021 拥有远程服务连接与目标交互，T1550 拥有其中替代材料的认证输入。一次 Pass-the-Hash 后通过 SMB/WinRM 控制目标可分别标注材料验证和远程服务结果；不能由远程连接成功推断使用了 hash，也不能由验证成功推断已取得目标控制。进程访问
        token、线程模拟和本地主体切换若没有跨主机/资源认证，属于对应的进程令牌或权限技术。
      en: T1021 owns the remote-service connection and destination interaction, while T1550 owns alternate material as the authentication
        input. Pass-the-Hash followed by SMB or WinRM control can be labeled separately as material validation and remote-service outcome.
        Remote connection success does not prove hash use, and validation success does not prove destination control. Process access tokens,
        thread impersonation, and local principal switching without cross-host or cross-resource authentication belong to the relevant process-token
        or privilege technique.
  taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 建议一项新 Niji 子项“验证器介导的替代证明新建认证”，稳定变量是攻击者以已有材料触发当前 verifier/authority 验证并形成新的登录、安全上下文或派生目标证明。它跨越 NTLM hash challenge response、TGT
          请求 service ticket、refresh/sign-in-session material 换取新 access token 等实现；痕迹集中在 verifier/KDC/token endpoint 与新 context，而不是材料名称。TGT→TGS
          与 refresh→access 可在新上下文前多一层权威派生，NTLM 可直接验证，但二者均产生当前验证事务并需要类似的预期来源与原认证关联。
        en: Propose one new Niji child, Verifier-Mediated Alternate-Proof Authentication. Its stable variable is an adversary using existing
          material to trigger current verifier or authority validation that creates a fresh logon, security context, or derived target proof.
          It spans NTLM hash challenge response, a TGT requesting a service ticket, and refresh or sign-in-session material obtaining a new
          access token. Residue concentrates at the verifier, KDC, or token endpoint and the new context rather than following material names.
          TGT-to-TGS and refresh-to-access add authority-mediated derivation before the fresh context, while NTLM can validate directly,
          but both produce a current verification transaction needing expected-origin and original-authentication correlation.
      - zh: “资源直接接受既有 bearer/cookie session state”确有不同观察拓扑：使用时 IdP/KDC 可能无事件，资源只看到真实 session/token 继续。然而 NJS-0061-002 已按同一稳定变量、痕迹和防御拥有该行为，NJS-0055-001
          又拥有远程网关的活动状态重放；本批不为 T1550 复制子项。设备/来源情境移植由 NJS-0061-001 或 NJS-0050-004 表达，材料取得由 NJT-0178 表达，proof 伪造由 NJT-0166/T1558 表达。四个 ATT&CK
          子项仅作为材料与协议宽度，均未导入。
        en: 'Direct resource acceptance of established bearer or cookie session state has a different observation topology: the IdP or KDC
          may have no event at use, while the resource sees a real session or token continuing. NJS-0061-002 already owns that behavior with
          the same stable variable, traces, and defenses, and NJS-0055-001 owns live-state replay at remote gateways. This batch does not
          duplicate it under T1550. NJS-0061-001 or NJS-0050-004 expresses device or origin-context transplantation; NJT-0178 expresses material
          acquisition; and NJT-0166 or T1558 expresses proof forgery. The four ATT&CK children remain material and protocol breadth only
          and are not imported.'
    subtechnique_refs:
    - NJS-0184-001
