- source_attack_id: T1558
  name: Steal or Forge Kerberos Tickets
  description: 'Adversaries may attempt to subvert Kerberos authentication by stealing or forging Kerberos tickets to enable [Pass the Ticket](https://attack.mitre.org/techniques/T1550/003).
    Kerberos is an authentication protocol widely used in modern Windows domain environments. In Kerberos environments, referred to as “realms”,
    there are three basic participants: client, service, and Key Distribution Center (KDC).(Citation: ADSecurity Kerberos Ring Decoder) Clients
    request access to a service and through the exchange of Kerberos tickets, originating from KDC, they are granted access after having
    successfully authenticated. The KDC is responsible for both authentication and ticket granting.  Adversaries may attempt to abuse Kerberos
    by stealing tickets or forging tickets to enable unauthorized access.


    On Windows, the built-in <code>klist</code> utility can be used to list and analyze cached Kerberos tickets.(Citation: Microsoft Klist)

    '
  attack_child_count: 5
  attack_children:
  - id: T1558.004
    name: 'Steal or Forge Kerberos Tickets: AS-REP Roasting'
    description: "Adversaries may reveal credentials of accounts that have disabled Kerberos preauthentication by [Password Cracking](https://attack.mitre.org/techniques/T1110/002)\
      \ Kerberos messages.(Citation: Harmj0y Roasting AS-REPs Jan 2017) \n\nPreauthentication offers protection against offline [Password\
      \ Cracking](https://attack.mitre.org/techniques/T1110/002). When enabled, a user requesting access to a resource initiates communication\
      \ with the Domain Controller (DC) by sending an Authentication Server Request (AS-REQ) message with a timestamp that is encrypted with\
      \ the hash of their password. If and only if the DC is able to successfully decrypt the timestamp with the hash of the user’s password,\
      \ it will then send an Authentication Server Response (AS-REP) message that contains the Ticket Granting Ticket (TGT) to the user.\
      \ Part of the AS-REP message is signed with the user’s password.(Citation: Microsoft Kerberos Preauth 2014)\n\nFor each account found\
      \ without preauthentication, an adversary may send an AS-REQ message without the encrypted timestamp and receive an AS-REP message\
      \ with TGT data which may be encrypted with an insecure algorithm such as RC4. The recovered encrypted data may be vulnerable to offline\
      \ [Password Cracking](https://attack.mitre.org/techniques/T1110/002) attacks similarly to [Kerberoasting](https://attack.mitre.org/techniques/T1558/003)\
      \ and expose plaintext credentials. (Citation: Harmj0y Roasting AS-REPs Jan 2017)(Citation: Stealthbits Cracking AS-REP Roasting Jun\
      \ 2019) \n\nAn account registered to a domain, with or without special privileges, can be abused to list all domain accounts that have\
      \ preauthentication disabled by utilizing Windows tools like [PowerShell](https://attack.mitre.org/techniques/T1059/001) with an LDAP\
      \ filter. Alternatively, the adversary may send an AS-REQ message for each user. If the DC responds without errors, the account does\
      \ not require preauthentication and the AS-REP message will already contain the encrypted data. (Citation: Harmj0y Roasting AS-REPs\
      \ Jan 2017)(Citation: Stealthbits Cracking AS-REP Roasting Jun 2019)\n\nCracked hashes may enable [Persistence](https://attack.mitre.org/tactics/TA0003),\
      \ [Privilege Escalation](https://attack.mitre.org/tactics/TA0004), and [Lateral Movement](https://attack.mitre.org/tactics/TA0008)\
      \ via access to [Valid Accounts](https://attack.mitre.org/techniques/T1078).(Citation: SANS Attacking Kerberos Nov 2014)"
  - id: T1558.005
    name: 'Steal or Forge Kerberos Tickets: Ccache Files'
    description: "\nAdversaries may attempt to steal Kerberos tickets stored in credential cache files (or ccache). These files are used\
      \ for short term storage of a user's active session credentials. The ccache file is created upon user authentication and allows for\
      \ access to multiple services without the user having to re-enter credentials. \n\nThe <code>/etc/krb5.conf</code> configuration file\
      \ and the <code>KRB5CCNAME</code> environment variable are used to set the storage location for ccache entries. On Linux, credentials\
      \ are typically stored in the `/tmp` directory with a naming format of `krb5cc_%UID%` or `krb5.ccache`. On macOS, ccache entries are\
      \ stored by default in memory with an `API:{uuid}` naming scheme. Typically, users interact with ticket storage using <code>kinit</code>,\
      \ which obtains a Ticket-Granting-Ticket (TGT) for the principal; <code>klist</code>, which lists obtained tickets currently held in\
      \ the credentials cache; and other built-in binaries.(Citation: Kerberos GNU/Linux)(Citation: Binary Defense Kerberos Linux)\n\nAdversaries\
      \ can collect tickets from ccache files stored on disk and authenticate as the current user without their password to perform [Pass\
      \ the Ticket](https://attack.mitre.org/techniques/T1550/003) attacks. Adversaries can also use these tickets to impersonate legitimate\
      \ users with elevated privileges to perform [Privilege Escalation](https://attack.mitre.org/tactics/TA0004). Tools like Kekeo can also\
      \ be used by adversaries to convert ccache files to Windows format for further [Lateral Movement](https://attack.mitre.org/tactics/TA0008).\
      \ On macOS, adversaries may use open-source tools or the Kerberos framework to interact with ccache files and extract TGTs or Service\
      \ Tickets via lower-level APIs.(Citation: SpectorOps Bifrost Kerberos macOS 2019)(Citation: Linux Kerberos Tickets)(Citation: Brining\
      \ MimiKatz to Unix)(Citation: Kekeo) "
  - id: T1558.001
    name: 'Steal or Forge Kerberos Tickets: Golden Ticket'
    description: "Adversaries who have the KRBTGT account password hash may forge Kerberos ticket-granting tickets (TGT), also known as a\
      \ golden ticket.(Citation: AdSecurity Kerberos GT Aug 2015) Golden tickets enable adversaries to generate authentication material for\
      \ any account in Active Directory.(Citation: CERT-EU Golden Ticket Protection) \n\nUsing a golden ticket, adversaries are then able\
      \ to request ticket granting service (TGS) tickets, which enable access to specific resources. Golden tickets require adversaries to\
      \ interact with the Key Distribution Center (KDC) in order to obtain TGS.(Citation: ADSecurity Detecting Forged Tickets)\n\nThe KDC\
      \ service runs all on domain controllers that are part of an Active Directory domain. KRBTGT is the Kerberos Key Distribution Center\
      \ (KDC) service account and is responsible for encrypting and signing all Kerberos tickets.(Citation: ADSecurity Kerberos and KRBTGT)\
      \ The KRBTGT password hash may be obtained using [OS Credential Dumping](https://attack.mitre.org/techniques/T1003) and privileged\
      \ access to a domain controller."
  - id: T1558.003
    name: 'Steal or Forge Kerberos Tickets: Kerberoasting'
    description: "Adversaries may abuse a valid Kerberos ticket-granting ticket (TGT) or sniff network traffic to obtain a ticket-granting\
      \ service (TGS) ticket that may be vulnerable to [Brute Force](https://attack.mitre.org/techniques/T1110).(Citation: Empire InvokeKerberoast\
      \ Oct 2016)(Citation: AdSecurity Cracking Kerberos Dec 2015) \n\nService principal names (SPNs) are used to uniquely identify each\
      \ instance of a Windows service. To enable authentication, Kerberos requires that SPNs be associated with at least one service logon\
      \ account (an account specifically tasked with running a service(Citation: Microsoft Detecting Kerberoasting Feb 2018)).(Citation:\
      \ Microsoft SPN)(Citation: Microsoft SetSPN)(Citation: SANS Attacking Kerberos Nov 2014)(Citation: Harmj0y Kerberoast Nov 2016)\n\n\
      Adversaries possessing a valid Kerberos ticket-granting ticket (TGT) may request one or more Kerberos ticket-granting service (TGS)\
      \ service tickets for any SPN from a domain controller (DC).(Citation: Empire InvokeKerberoast Oct 2016)(Citation: AdSecurity Cracking\
      \ Kerberos Dec 2015) Portions of these tickets may be encrypted with the RC4 algorithm, meaning the Kerberos 5 TGS-REP etype 23 hash\
      \ of the service account associated with the SPN is used as the private key and is thus vulnerable to offline [Brute Force](https://attack.mitre.org/techniques/T1110)\
      \ attacks that may expose plaintext credentials.(Citation: AdSecurity Cracking Kerberos Dec 2015)(Citation: Empire InvokeKerberoast\
      \ Oct 2016) (Citation: Harmj0y Kerberoast Nov 2016)\n\nThis same behavior could be executed using service tickets captured from network\
      \ traffic.(Citation: AdSecurity Cracking Kerberos Dec 2015)\n\nCracked hashes may enable [Persistence](https://attack.mitre.org/tactics/TA0003),\
      \ [Privilege Escalation](https://attack.mitre.org/tactics/TA0004), and [Lateral Movement](https://attack.mitre.org/tactics/TA0008)\
      \ via access to [Valid Accounts](https://attack.mitre.org/techniques/T1078).(Citation: SANS Attacking Kerberos Nov 2014)"
  - id: T1558.002
    name: 'Steal or Forge Kerberos Tickets: Silver Ticket'
    description: 'Adversaries who have the password hash of a target service account (e.g. SharePoint, MSSQL) may forge Kerberos ticket granting
      service (TGS) tickets, also known as silver tickets. Kerberos TGS tickets are also known as service tickets.(Citation: ADSecurity Silver
      Tickets)


      Silver tickets are more limited in scope in than golden tickets in that they only enable adversaries to access a particular resource
      (e.g. MSSQL) and the system that hosts the resource; however, unlike golden tickets, adversaries with the ability to forge silver tickets
      are able to create TGS tickets without interacting with the Key Distribution Center (KDC), potentially making detection more difficult.(Citation:
      ADSecurity Detecting Forged Tickets)


      Password hashes for target services may be obtained using [OS Credential Dumping](https://attack.mitre.org/techniques/T1003) or [Kerberoasting](https://attack.mitre.org/techniques/T1558/003).'
  niji_children_imported: false
- source_attack_id: T1552
  name: Unsecured Credentials
  description: 'Adversaries may search compromised systems to find and obtain insecurely stored credentials. These credentials can be stored
    and/or misplaced in many locations on a system, including plaintext files (e.g. [Shell History](https://attack.mitre.org/techniques/T1552/003)),
    operating system or application-specific repositories (e.g. [Credentials in Registry](https://attack.mitre.org/techniques/T1552/002)),  or
    other specialized files/artifacts (e.g. [Private Keys](https://attack.mitre.org/techniques/T1552/004)).(Citation: Brining MimiKatz to
    Unix)'
  attack_child_count: 8
  attack_children:
  - id: T1552.008
    name: 'Unsecured Credentials: Chat Messages'
    description: 'Adversaries may directly collect unsecured credentials stored or passed through user communication services. Credentials
      may be sent and stored in user chat communication applications such as email, chat services like Slack or Teams, collaboration tools
      like Jira or Trello, and any other services that support user communication. Users may share various forms of credentials (such as
      usernames and passwords, API keys, or authentication tokens) on private or public corporate internal communications channels.


      Rather than accessing the stored chat logs (i.e., [Credentials In Files](https://attack.mitre.org/techniques/T1552/001)), adversaries
      may directly access credentials within these services on the user endpoint, through servers hosting the services, or through administrator
      portals for cloud hosted services. Adversaries may also compromise integration tools like Slack Workflows to automatically search through
      messages to extract user credentials. These credentials may then be abused to perform follow-on activities such as lateral movement
      or privilege escalation (Citation: Slack Security Risks).'
  - id: T1552.005
    name: 'Unsecured Credentials: Cloud Instance Metadata API'
    description: 'Adversaries may attempt to access the Cloud Instance Metadata API to collect credentials and other sensitive data.


      Most cloud service providers support a Cloud Instance Metadata API which is a service provided to running virtual instances that allows
      applications to access information about the running virtual instance. Available information generally includes name, security group,
      and additional metadata including sensitive data such as credentials and UserData scripts that may contain additional secrets. The
      Instance Metadata API is provided as a convenience to assist in managing applications and is accessible by anyone who can access the
      instance.(Citation: AWS Instance Metadata API) A cloud metadata API has been used in at least one high profile compromise.(Citation:
      Krebs Capital One August 2019)


      If adversaries have a presence on the running virtual instance, they may query the Instance Metadata API directly to identify credentials
      that grant access to additional resources. Additionally, adversaries may exploit a Server-Side Request Forgery (SSRF) vulnerability
      in a public facing web proxy that allows them to gain access to the sensitive information via a request to the Instance Metadata API.(Citation:
      RedLock Instance Metadata API 2018)


      The de facto standard across cloud service providers is to host the Instance Metadata API at <code>http[:]//169.254.169.254</code>.

      '
  - id: T1552.007
    name: 'Unsecured Credentials: Container API'
    description: 'Adversaries may gather credentials via APIs within a containers environment. APIs in these environments, such as the Docker
      API and Kubernetes APIs, allow a user to remotely manage their container resources and cluster components.(Citation: Docker API)(Citation:
      Kubernetes API)


      An adversary may access the Docker API to collect logs that contain credentials to cloud, container, and various other resources in
      the environment.(Citation: Unit 42 Unsecured Docker Daemons) An adversary with sufficient permissions, such as via a pod''s service
      account, may also use the Kubernetes API to retrieve credentials from the Kubernetes API server. These credentials may include those
      needed for Docker API authentication or secrets from Kubernetes cluster components. '
  - id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
    description: 'Adversaries may search local file systems and remote file shares for files containing insecurely stored credentials. These
      can be files created by users to store their own credentials, shared credential stores for a group of individuals, configuration files
      containing passwords for a system or service, or source code/binary files containing embedded passwords.


      It is possible to extract passwords from backups or saved virtual machines through [OS Credential Dumping](https://attack.mitre.org/techniques/T1003).(Citation:
      CG 2014) Passwords may also be obtained from Group Policy Preferences stored on the Windows Domain Controller.(Citation: SRD GPP)


      In cloud and/or containerized environments, authenticated user and service account credentials are often stored in local configuration
      and credential files.(Citation: Unit 42 Hildegard Malware) They may also be found as parameters to deployment commands in container
      logs.(Citation: Unit 42 Unsecured Docker Daemons) In some cases, these files can be copied and reused on another machine or the contents
      can be read and then used to authenticate without needing to copy any files.(Citation: Specter Ops - Cloud Credential Storage)'
  - id: T1552.002
    name: 'Unsecured Credentials: Credentials in Registry'
    description: 'Adversaries may search the Registry on compromised systems for insecurely stored credentials. The Windows Registry stores
      configuration information that can be used by the system or other programs. Adversaries may query the Registry looking for credentials
      and passwords that have been stored for use by other programs or services. Sometimes these credentials are used for automatic logons.


      Example commands to find Registry keys related to password information: (Citation: Pentestlab Stored Credentials)


      * Local Machine Hive: <code>reg query HKLM /f password /t REG_SZ /s</code>

      * Current User Hive: <code>reg query HKCU /f password /t REG_SZ /s</code>'
  - id: T1552.006
    name: 'Unsecured Credentials: Group Policy Preferences'
    description: 'Adversaries may attempt to find unsecured credentials in Group Policy Preferences (GPP). GPP are tools that allow administrators
      to create domain policies with embedded credentials. These policies allow administrators to set local accounts.(Citation: Microsoft
      GPP 2016)


      These group policies are stored in SYSVOL on a domain controller. This means that any domain user can view the SYSVOL share and decrypt
      the password (using the AES key that has been made public).(Citation: Microsoft GPP Key)


      The following tools and scripts can be used to gather and decrypt the password file from Group Policy Preference XML files:


      * Metasploit’s post exploitation module: <code>post/windows/gather/credentials/gpp</code>

      * Get-GPPPassword(Citation: Obscuresecurity Get-GPPPassword)

      * gpprefdecrypt.py


      On the SYSVOL share, adversaries may use the following command to enumerate potential GPP XML files: <code>dir /s * .xml</code>

      '
  - id: T1552.004
    name: 'Unsecured Credentials: Private Keys'
    description: "Adversaries may search for private key certificate files on compromised systems for insecurely stored credentials. Private\
      \ cryptographic keys and certificates are used for authentication, encryption/decryption, and digital signatures.(Citation: Wikipedia\
      \ Public Key Crypto) Common key and certificate file extensions include: .key, .pgp, .gpg, .ppk., .p12, .pem, .pfx, .cer, .p7b, .asc.\
      \ \n\nAdversaries may also look in common key directories, such as <code>~/.ssh</code> for SSH keys on * nix-based systems or <code>C:&#92;Users&#92;(username)&#92;.ssh&#92;</code>\
      \ on Windows. Adversary tools may also search compromised systems for file extensions relating to cryptographic keys and certificates.(Citation:\
      \ Kaspersky Careto)(Citation: Palo Alto Prince of Persia)\n\nWhen a device is registered to Entra ID, a device key and a transport\
      \ key are generated and used to verify the device’s identity.(Citation: Microsoft Primary Refresh Token) An adversary with access to\
      \ the device may be able to export the keys in order to impersonate the device.(Citation: AADInternals Azure AD Device Identities)\n\
      \nOn network devices, private keys may be exported via [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands\
      \ such as `crypto pki export`.(Citation: cisco_deploy_rsa_keys) \n\nSome private keys require a password or passphrase for operation,\
      \ so an adversary may also use [Input Capture](https://attack.mitre.org/techniques/T1056) for keylogging or attempt to [Brute Force](https://attack.mitre.org/techniques/T1110)\
      \ the passphrase off-line. These private keys can be used to authenticate to [Remote Services](https://attack.mitre.org/techniques/T1021)\
      \ like SSH or for use in decrypting other collected files such as email."
  - id: T1552.003
    name: 'Unsecured Credentials: Shell History'
    description: 'Adversaries may search the command history on compromised systems for insecurely stored credentials.


      On Linux and macOS systems, shells such as Bash and Zsh keep track of the commands users type on the command-line with the "history"
      utility. Once a user logs out, the history is flushed to the user''s history file. For each user, this file resides at the same location:
      for example, `~/.bash_history` or `~/.zsh_history`. Typically, these files keeps track of the user''s last 1000 commands.


      On Windows, PowerShell has both a command history that is wiped after the session ends, and one that contains commands used in all
      sessions and is persistent. The default location for persistent history can be found in `%userprofile%\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadline\ConsoleHost_history.txt`,
      but command history can also be accessed with `Get-History`. Command Prompt (CMD) on Windows does not have persistent history.(Citation:
      Microsoft about_History)(Citation: Medium)


      Users often type usernames and passwords on the command-line as parameters to programs, which then get saved to this file when they
      log out. Adversaries can abuse this by looking through the file for potential credentials.(Citation: External to DA, the OS X Way)'
  niji_children_imported: false
- source_attack_id: T1539
  name: Steal Web Session Cookie
  description: 'An adversary may steal web application or service session cookies and use them to gain access to web applications or Internet
    services as an authenticated user without needing credentials. Web applications and services often use session cookies as an authentication
    token after a user has authenticated to a website.


    Cookies are often valid for an extended period of time, even if the web application is not actively used. Cookies can be found on disk,
    in the process memory of the browser, and in network traffic to remote systems. Additionally, other applications on the targets machine
    might store sensitive authentication cookies in memory (e.g. apps which authenticate to cloud services). Session cookies can be used
    to bypasses some multi-factor authentication protocols.(Citation: Pass The Cookie)


    There are several examples of malware targeting cookies from web browsers on the local system.(Citation: Kaspersky TajMahal April 2019)(Citation:
    Unit 42 Mac Crypto Cookies January 2019) Adversaries may also steal cookies by injecting malicious JavaScript content into websites or
    relying on [User Execution](https://attack.mitre.org/techniques/T1204) by tricking victims into running malicious JavaScript in their
    browser.(Citation: Talos Roblox Scam 2023)(Citation: Krebs Discord Bookmarks 2023)


    There are also open source frameworks such as `Evilginx2` and `Muraena` that can gather session cookies through a malicious proxy (e.g.,
    [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557)) that can be set up by an adversary and used in phishing campaigns.(Citation:
    Github evilginx2)(Citation: GitHub Mauraena)


    After an adversary acquires a valid cookie, they can then perform a [Web Session Cookie](https://attack.mitre.org/techniques/T1550/004)
    technique to login to the corresponding web application.'
  attack_child_count: 0
  attack_children: []
