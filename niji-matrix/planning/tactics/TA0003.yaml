gap_analysis:
  status: complete
  notes_zh: Enterprise ATT&CK 19.1 Persistence 固定 22 个父候选全部完成独立准入并进入 22 个正式 NJT，战术下可见 49 项 Niji 原生 NJS。开放搜索与跨技术收敛覆盖身份、认证、调度、启动、服务、事件、软件内容、服务器/客户端扩展、云集成、远程入口、网络信号、固件/镜像与电源连续性；未发现同时具备独立父行为、稳定匿迹变量、结论级证据和差异化防御的额外 Niji 原生父级。证据不足轴继续 defer，人工领域评审仍未完成。
  notes_en: All twenty-two fixed Enterprise ATT&CK 19.1 Persistence parent candidates completed independent admission and map to twenty-two formal NJT objects with forty-nine visible Niji-native NJS objects. Open search and cross-technique convergence covered identity authentication scheduling startup services events software content server and client extensions cloud integrations remote entry network signaling firmware and images and power continuity. No additional Niji-native parent simultaneously has an independent parent behavior stable stealth variable conclusion-level evidence and differentiated defense. Evidence-limited axes remain deferred and human domain review is still pending.
