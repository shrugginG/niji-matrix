gap_analysis:
  status: in-progress
  notes_zh: 当前 Stealth 矩阵的二十七个正式 NJT 技术均已按 NJT-0001 字段责任、证据、防御、Bundle 与 Web 门禁完成本轮整改；固定 Enterprise ATT&CK 19.1 的三十个父候选也已有独立准入决议。Niji-native gap、跨技术 taxonomy/防御收敛与人工领域审查仍需独立完成，TA0005 不得关闭。
  notes_en: All twenty-seven formal NJT techniques in the current Stealth matrix completed this remediation round under NJT-0001 field responsibilities, evidence, defense, bundle, and Web gates, and all thirty fixed Enterprise ATT&CK 19.1 parent candidates have independent admission decisions. Niji-native gap analysis, cross-technique taxonomy and defense convergence, and human domain review remain unfinished, so TA0005 must not be closed.
