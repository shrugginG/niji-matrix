  batch_ref: BATCH-TA0006-002
  notes_zh: 固定清单第 3 项；经 adapt 准入并完成六项 ATT&CK 实现覆盖和第二轮 taxonomy，形成 NJT-0147 与两项按受信消费身份、解锁运行态划分的 Niji 原生子技术。密文副本轴因缺少同一事件解锁证据暂缓。质量、Bundle、Web 与双语门禁通过，等待人工领域评审。
  notes_en: Fixed-inventory position 3; adapted after coverage of all six ATT&CK implementation children and a second taxonomy pass, producing
    NJT-0147 and two Niji-native children for trusted-consumer identity and unlocked runtime. The protected-copy axis is deferred for lack of
    same-incident unlock evidence. Quality, bundle, Web, and bilingual gates pass; human domain review is pending.
