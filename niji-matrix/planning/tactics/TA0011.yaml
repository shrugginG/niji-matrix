  notes_zh: adapt；正式范围为 C2 消息及服务会话观察差。NJS-0152-001/002 分别改变有效语义比例与服务契约；载体内外遮蔽归父级且与 NJT-0115 对照。正式对象已通过质量、Bundle 和双语 Web 门禁，保持
    review 待人工领域评审。
  notes_en: Adapt; formal scope is the C2 message and service-conversation observation differential. NJS-0152-001/002 vary
    semantic share and service contract; carrier extraction stays at parent level alongside NJT-0115. Canonical objects passed
    quality, bundle, and bilingual Web gates and remain in review pending human domain review.
