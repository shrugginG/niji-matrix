gap_analysis:
  status: complete
  notes_zh: 固定 Enterprise 19.1 的 18 个父候选全部完成准入和正式归宿；开放搜索覆盖 C2 消息、承载、路径、状态、端点、授权、密码、内容注入和基础设施暴露，未发现兼具独立父行为、结论级证据与差异化防御的额外 Niji
    原生父级。T1665 操作时窗等证据不足的轴保留在研究层，不伪装为已关闭的子项。人工领域评审仍未进行。
  notes_en: All eighteen fixed Enterprise 19.1 parent candidates have admission decisions and formal outcomes. Open search
    covered C2 messages, carriage, paths, state, endpoints, authorization, cryptography, content injection, and infrastructure
    exposure and found no additional Niji-native parent with an independent behavior, conclusion-level evidence, and distinct
    defense. Evidence-limited axes such as T1665 operational-window exposure remain in research. Human domain review is still
    pending.
