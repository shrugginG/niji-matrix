gap_analysis:
  status: complete
  notes_zh: 固定 ATT&CK Enterprise 19.1 的 15 个 TA0040 父候选已全部完成准入与正式 review，共形成 15 个 ATT&CK 来源 NJT 和 23 个 Niji 原生 NJS。战术级开放搜索与跨技术收敛未发现证据足以支持额外
    add 父技术；低速/分布/委托/伪装/表示分歧等有证据变量已归入现有父级，未满足门禁的协议、平台、工具、目标类型、低速或条件轴继续延期。跨技术边界、共享库、防御、Bundle、全库质量与双语 Web 门禁通过，等待人工领域评审。
  notes_en: All fifteen fixed Enterprise ATT&CK 19.1 TA0040 parent candidates have admission decisions and formal
    review packages, producing fifteen ATT&CK-origin NJT objects and twenty-three Niji-native NJS objects. Tactic-level
    open search and cross-technique convergence found no evidence sufficient for an additional parent technique. Evidenced
    low-rate, distributed, delegated, camouflage, and representation-divergence variables are owned by existing parents,
    while protocol, platform, tool, target-type, pacing, or conditional axes that failed gates remain deferred. Cross-technique
    boundaries, shared libraries, defenses, bundles, matrix quality, and bilingual Web gates pass pending human domain
    review.
