- id: WORK-TA0040-T1485
  source_type: attack
  source_attack_id: T1485
  name_zh: 数据销毁
  name_en: Data Destruction
  decision_ref: DEC-TA0040-T1485
  resulting_technique_ref: NJT-0156
  stage: review
  batch_ref: BATCH-TA0040-001
  notes_zh: 固定基线一个 ATT&CK 子项 T1485.001，仅作广度先验；检查逻辑删除、生命周期触发与不可恢复性之间的痕迹和观察差异。 首批准入和正式内容、证据、防御、质量、Bundle 与双语 Web 门禁已通过，待人工领域评审。
  notes_en: One ATT&CK child T1485.001 is breadth context only; examine trace and observation differences among logical
    deletion, lifecycle triggers, and irrecoverability. Batch-one admission, canonical content, evidence, defense,
    quality, bundles, and bilingual Web gates pass pending human domain review.
- id: WORK-TA0040-T1486
  source_type: attack
  source_attack_id: T1486
  name_zh: 为影响而加密数据
  name_en: Data Encrypted for Impact
  decision_ref: DEC-TA0040-T1486
  resulting_technique_ref: NJT-0157
  stage: review
  batch_ref: BATCH-TA0040-001
  notes_zh: ATT&CK 无子项；检查加密过程、密钥控制、业务不可用与数据销毁的边界，开放搜索原生匿迹变量。 首批准入和正式内容、证据、防御、质量、Bundle 与双语 Web 门禁已通过，待人工领域评审。
  notes_en: ATT&CK has no children; examine encryption process, key control, business unavailability, and the destruction
    boundary while searching openly for native stealth variables. Batch-one admission, canonical content, evidence,
    defense, quality, bundles, and bilingual Web gates pass pending human domain review.
- id: WORK-TA0040-T1489
  source_type: attack
  source_attack_id: T1489
  name_zh: 停止服务
  name_en: Service Stop
  decision_ref: DEC-TA0040-T1489
  resulting_technique_ref: NJT-0185
  stage: review
  batch_ref: BATCH-TA0040-002
  notes_zh: 无 ATT&CK 子项；需要区分业务中断、为后续破坏清障及 TA0112 防御损伤。 第二批准入、正式内容、证据、防御、质量、Bundle 与双语 Web 门禁已通过，待人工领域评审。
  notes_en: No ATT&CK children; distinguish service interruption, preparation for later impact, and TA0112 defense
    impairment. In the five-candidate second batch; one sub-agent researches this parent and canonical IDs follow
    all five handoffs and cross-technique convergence. Batch-two admission, canonical content, evidence, defense,
    quality, bundles, and bilingual Web gates pass pending human domain review.
- id: WORK-TA0040-T1490
  source_type: attack
  source_attack_id: T1490
  name_zh: 抑制系统恢复
  name_en: Inhibit System Recovery
  decision_ref: DEC-TA0040-T1490
  resulting_technique_ref: NJT-0186
  stage: review
  batch_ref: BATCH-TA0040-002
  notes_zh: 无 ATT&CK 子项；核对恢复控制受损和当前业务可用性之间的先后关系。 第二批准入、正式内容、证据、防御、质量、Bundle 与双语 Web 门禁已通过，待人工领域评审。
  notes_en: No ATT&CK children; distinguish recovery control damage from present business availability. In the five-candidate
    second batch; one sub-agent researches this parent and canonical IDs follow all five handoffs and cross-technique
    convergence. Batch-two admission, canonical content, evidence, defense, quality, bundles, and bilingual Web gates
    pass pending human domain review.
