gap_analysis:
  status: complete
  notes_zh: 固定 ATT&CK Enterprise 19.1 的 18 个 TA0112 父候选均已完成准入：17 项正式矩阵父技术与 27 项 Niji 原生子技术保持 review，T1647 排除。战术级审查确认工具功能、集中策略、本地 Registry/权限、版本/映像/加密、云层级/计算、网络边界、认证/目录复制、交互历史、受限启动和 trust decision 均有独立直接对象与防御数据；未发现需要 add 的稳定 Niji 原生父级缺口。失活 DC identity 复用、跨平台 Safe Mode 变体、未证实 provider 事件和其他低证据轴保持 defer；人工领域评审仍单独待办。
  notes_en: >-
    All eighteen TA0112 parent candidates in fixed ATT&CK Enterprise 19.1 have admission decisions: seventeen formal-matrix parents and twenty-seven Niji-native children remain in review, and T1647 is excluded. Tactic-level review confirms independent direct objects and defensive data for tool function, central policy, local Registry or permissions, version, image, or encryption, cloud hierarchy or compute, network boundary, authentication or directory replication, interactive history, restricted boot, and trust decisions. No stable Niji-native parent gap requiring add was found. Inactive-DC-identity reuse, cross-platform restricted-boot variants, unverified provider events, and other low-evidence axes remain deferred; human domain review remains separately pending.
