notes_zh: >-
  用于划定边界：T1497 主要描述恶意代码在执行环境内部检查虚拟化或沙箱迹象；本技术描述取得主机执行前、从远程交互侧识别诱捕环境并调整行为。
notes_en: >-
  Used for boundary definition. T1497 primarily concerns malware inspecting virtualization
  or sandbox artifacts from inside an execution environment; this technique concerns remote
  identification of a deception environment and behavioral adaptation before host execution.
