notes_zh: >-
  论文实证记录攻击者在攻击前检查端口、服务和蜜罐指纹；静态横幅及服务响应不一致会导致蜜罐被识别、拉黑或攻击中止，而自适应高交互响应能够通过检查并诱导恶意载荷上传。
notes_en: >-
  The paper empirically documents pre-attack port, service, and honeypot-fingerprint checks.
  Static banners and inconsistent service behavior can cause identification, blacklisting,
  or attack termination, while adaptive high-interaction responses can pass the checks and
  induce malicious payload delivery.
