notes_zh: >-
  将远程蜜罐指纹划分为结构、时间、运行、硬件、环境和信息物理一致性等类别，为本技术按可观察因果路径划分子技术提供主要依据。
notes_en: >-
  Categorizes remote honeypot fingerprints into structural, temporal, operational,
  hardware, environmental, and cyber-physical consistency classes. It is a primary basis
  for partitioning this technique by observable causal path.
