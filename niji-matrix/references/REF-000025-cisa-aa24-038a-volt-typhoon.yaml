notes_zh: 联合公告既记录 Volt Typhoon 使用 FOFA、Shodan、Censys 开展攻击前侦查，也记录其在域控制器上以 vssadmin 创建卷影副本，再通过 WMIC 与 ntdsutil 从副本复制 NTDS.dit 和 SYSTEM 配置单元。后者直接支持“副本视图—锁定敏感对象—离线凭据用途”的案例链。
notes_en: The joint advisory documents both Volt Typhoon's pre-compromise use of FOFA, Shodan, and Censys and its creation
  of a domain-controller volume shadow copy with vssadmin followed by WMIC and ntdsutil copying of NTDS.dit and the SYSTEM
  hive from that copy. The latter directly supports a copy-view-to-locked-sensitive-object-to-offline-credential-use case chain.
