notes_zh: 联合公告既记录 Volt Typhoon 使用 FOFA、Shodan、Censys 开展攻击前侦查，也记录其在域控制器上以 vssadmin 创建卷影副本，再通过 WMIC 与 ntdsutil 从副本复制 NTDS.dit
  和 SYSTEM 配置单元。后者直接支持“副本视图—锁定敏感对象—离线凭据用途”的案例链。 reg query 的工具使用与 reg save 或凭据副本是不同观察；汇总列表不公开每次查询路径、具体信息目的、返回值或进程内执行方式。 新增配置与连接请求定位，不扩张既有其他阶段案例；命令表不证明同机连续执行、非空结果或进程内承载。
  新增时间请求及脚本消费的窄事实，不公开实际读数、每次执行日期或改时结果；保留既有其他阶段事实及应用。
notes_en: The joint advisory documents both Volt Typhoon's pre-compromise use of FOFA, Shodan, and Censys and its creation
  of a domain-controller volume shadow copy with vssadmin followed by WMIC and ntdsutil copying of NTDS.dit and the SYSTEM
  hive from that copy. The latter directly supports a copy-view-to-locked-sensitive-object-to-offline-credential-use case
  chain. reg query use is distinct from reg save or credential copies; the aggregate list does not publish each query path,
  immediate information purpose, returned values, or in-process execution. Adds configuration and connection request locators
  without broadening existing other-stage cases; the command table establishes neither consecutive same-host execution, nonempty
  results, nor in-process carriage. Adds narrow temporal-request and scripted-consumption facts without actual readings, per-invocation
  dates, or clock-change outcomes; preserve earlier other-stage facts and uses.
