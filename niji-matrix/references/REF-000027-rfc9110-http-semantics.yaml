notes_zh: 标准定义 User-Agent 等请求字段可以携带软件产品及版本信息，并明确指出过细信息会增加用户指纹识别风险。
notes_en: The standard defines request fields such as User-Agent that can disclose software product and version information and notes that excessive detail increases fingerprinting risk.
