notes_zh: JPCERT/CC 记录被篡改 VPN 页面向访问者加载 Scanbox，收集软件、补丁、Office、Java、插件和驱动器等主机属性，直接支持嵌入网页会话的客户端主机指纹采集。
notes_en: JPCERT/CC documents altered VPN pages loading Scanbox to collect software, patches, Office, Java, plugins, drives, and other host properties, directly supporting embedded client-side host fingerprinting.
