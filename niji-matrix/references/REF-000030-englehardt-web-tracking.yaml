notes_zh: 大规模测量展示浏览器指纹和跟踪脚本在正常网站生态中的广泛存在，用于解释恶意网页主机指纹采集为何具有高背景噪声和误报风险。
notes_en: The large-scale measurement demonstrates the prevalence of browser fingerprinting and tracking scripts in the normal web ecosystem, explaining the background noise and false-positive risk around malicious web-based host profiling.
