notes_zh: OWASP 说明登录、注册和恢复工作流中的正文、状态或行为差异可以泄露账户有效性，为身份工作流拟态推断提供技术基础和防御边界。
notes_en: OWASP explains that content, status, and behavioral differences across login, registration, and recovery workflows can disclose account validity, providing the technical basis and defensive boundary for identity-workflow inference.
