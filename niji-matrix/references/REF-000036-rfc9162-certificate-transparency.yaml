notes_zh: 标准规定公开、可验证的证书日志，并指出恶意监视者可能从日志中发现难以查找的域名和服务线索，支持通过非目标公共基础设施推断网络信息。
notes_en: The standard specifies public, auditable certificate logs and notes that malicious monitors may discover otherwise difficult-to-find domain names and service clues, supporting network inference through non-victim public infrastructure.
