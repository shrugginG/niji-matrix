notes_zh: 标准将被动 DNS 定义为存储 DNS 响应并支持历史或反向键查询的系统，为复用第三方既有网络观测提供规范基础。
notes_en: The standard defines passive DNS as stored DNS responses supporting historical and reverse-key queries, providing a normative basis for reusing pre-existing third-party network observations.
