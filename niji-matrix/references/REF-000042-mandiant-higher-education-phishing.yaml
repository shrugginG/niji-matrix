notes_zh: Mandiant 观察到攻击者使用受信或被控制的教育环境托管 Google Forms，模仿院校品牌和紧急业务流程以索取凭据、财务机构资料及其他敏感信息，支持情境与可信界面伪装。
notes_en: Mandiant observed adversaries hosting Google Forms in trusted or compromised educational environments and imitating institutional branding and urgent business workflows to request credentials, financial-institution details, and other sensitive information, supporting contextual and trusted-interface camouflage.
