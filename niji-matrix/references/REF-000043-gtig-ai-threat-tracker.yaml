notes_zh: GTIG 记录威胁主体使用生成式 AI 综合 OSINT、画像高价值目标、定位联系信息并研究商业伙伴，同时利用本地语言、组织语气和多轮对话支持社会工程；Google 禁用相关资产并强化分类器，证明平台方存在检测视角。后续载荷行为不作为 T1598 或 T1682 查询本身的证据。
notes_en: GTIG documents threat actors using generative AI to synthesize OSINT, profile high-value targets, locate contact information, and research business partners, while using local language, organizational tone, and multi-turn dialogue for social engineering. Google's disabling of associated assets and classifier strengthening establish a provider detection vantage. Follow-on payload behavior is not treated as evidence of T1598 or the T1682 query itself.
