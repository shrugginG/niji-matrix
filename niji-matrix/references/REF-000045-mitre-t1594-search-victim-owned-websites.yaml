notes_zh: ATT&CK v19 将 T1594 定义为访问受害者控制的网站以收集部门、位置、人员、运营和业务关系等目标信息，并将快速爬取、大量请求及 HTTP 元数据列为检测线索。
notes_en: ATT&CK v19 defines T1594 as accessing victim-controlled websites for departmental, location, personnel, operational, and business-relationship information, and identifies rapid crawling, request volume, and HTTP metadata as detection leads.
