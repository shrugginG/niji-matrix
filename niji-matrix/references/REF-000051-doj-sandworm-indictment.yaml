notes_zh: 起诉书指控 Sandworm 相关人员使用虚构身份、社交媒体账户和在线服务规避检测、掩蔽归属并开展研究；这些是刑事指控，不等同于已经裁判确认的事实。
notes_en: The indictment alleges that Sandworm-linked personnel used fictitious identities, social-media accounts, and online services to avoid detection, mask attribution, and conduct research; these are criminal allegations rather than adjudicated facts.
