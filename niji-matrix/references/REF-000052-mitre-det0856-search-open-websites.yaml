notes_zh: DET0856 指出开放网站搜索具有很高合法发生率和误报率，并可能发生在目标组织视野之外，检测往往需要依赖后续阶段或平台方数据。
notes_en: DET0856 notes that open-website searching has high legitimate prevalence and false-positive rates and may occur outside target-organization visibility, often requiring downstream or provider-side evidence.
