notes_zh: ATT&CK v19 将 T1650 定义为购买、交换或以其他方式取得目标系统/网络已经存在的访问权，包括初始访问经纪出售或伙伴共享的入口。
notes_en: ATT&CK v19 defines T1650 as purchasing, exchanging, or otherwise acquiring existing access to a victim system or network, including access sold by initial-access brokers or shared by partners.
