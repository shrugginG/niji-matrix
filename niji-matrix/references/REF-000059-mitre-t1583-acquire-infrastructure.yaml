notes_zh: ATT&CK v19 将 T1583 定义为购买、租用、注册、申请或以其他非攻陷方式取得支持后续行动的域名、服务器、云、Web 服务、无服务器资源、广告或僵尸网络等基础设施。
notes_en: ATT&CK v19 defines T1583 as buying, leasing, registering, provisioning, or otherwise obtaining without compromise infrastructure such as domains, servers, cloud or Web services, serverless resources, advertising, or botnets for later operations.
