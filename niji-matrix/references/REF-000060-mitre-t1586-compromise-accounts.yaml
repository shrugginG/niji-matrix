notes_zh: ATT&CK v19 将 T1586 定义为接管可用于目标选择与后续行动的既有服务账户，并利用真实人物或组织已经形成的关系、信誉、域和权限。
notes_en: ATT&CK v19 defines T1586 as taking over existing service accounts for targeting and later operations and leveraging relationships, reputation, domains, and privileges already associated with real people or organizations.
