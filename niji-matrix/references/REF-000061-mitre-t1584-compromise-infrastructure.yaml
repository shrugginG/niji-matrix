notes_zh: ATT&CK v19 将 T1584 定义为攻陷第三方域名、DNS、服务器、云资源、Web 服务、无服务器平台、僵尸网络或网络设备，并将其作为后续行动基础设施。
notes_en: ATT&CK v19 defines T1584 as compromising third-party domains, DNS, servers, cloud resources, Web services, serverless platforms, botnets, or network devices and using them as infrastructure for later operations.
