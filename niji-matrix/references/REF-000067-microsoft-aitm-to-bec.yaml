notes_zh: Microsoft 观察到攻击者接管邮箱后反复访问财务邮件和附件、搜索进行中的支付线程，再实施下游 BEC；报告同时给出异常令牌、登录、邮件访问与收件箱规则等提供方信号。
notes_en: Microsoft observed attackers repeatedly accessing finance mail and attachments and searching ongoing payment threads after mailbox takeover before downstream BEC; the report also identifies provider-side anomalous token, sign-in, mail-access, and inbox-rule signals.
