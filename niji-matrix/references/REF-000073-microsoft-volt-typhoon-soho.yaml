notes_zh: Microsoft 观察 Volt Typhoon 经被攻陷 SOHO 路由器、防火墙与 VPN 设备路由流量，使来源混入正常网络活动并隐藏真实发起位置。 同文档 Discovery 段直接记录主机存储属性发现，不证明独立匿迹子项或逐查询输出。
  运行进程发现是独立的观察；一般就地取材意图不证明每次注册表查询的目的、输出或匿迹结果。
notes_en: Microsoft observed Volt Typhoon routing traffic through compromised SOHO routers, firewalls, and VPN devices to
  blend with normal network activity and hide the true origin. The same publication directly reports host storage-attribute
  discovery in its Discovery section without establishing an independent stealth child or per-query output. Running-process
  discovery is a separate observation; general living-off-the-land intent does not establish the purpose, output, or stealth
  outcome of each Registry query.
