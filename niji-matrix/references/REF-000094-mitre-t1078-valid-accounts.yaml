notes_zh: ATT&CK v19 将 T1078 定义为使用真实有效身份绕过访问控制，并明确映射到 Initial Access、Persistence、Privilege Escalation 与 Defense Evasion；被攻陷凭据可持续访问远程系统和外部服务，低活动/无活跃 owner 身份又可能减少人工反馈。该来源锚定父行为、TA0003 适用性和四项账户类型广度，不自动证明具体跨时段攻击者连续性或 Niji 子项。
notes_en: ATT&CK v19 defines T1078 as using authentic valid identities to bypass access controls and explicitly maps it to Initial Access Persistence Privilege Escalation and Defense Evasion. Compromised credentials can provide persistent access to remote systems and external services while low-activity identities without active owners can reduce human feedback. The source anchors parent behavior TA0003 applicability and four-account-class breadth but does not automatically establish event-level controller continuity across episodes or Niji children.
