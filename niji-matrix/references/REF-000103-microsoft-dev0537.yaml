notes_zh: Microsoft 记录 DEV-0537/LAPSUS$ 选择接近目标地理位置的 VPN、注册设备满足条件访问、招募人员提供凭据或批准 MFA，也直接观察其在受害云内创建攻击者控制 VM 并在窃取后删除云资源。来源分别支持身份情境、用户动作和恶意计算生命周期；是否缺少控制注册或本地证据必须结合具体云遥测判断。
notes_en: Microsoft documents DEV-0537 or LAPSUS$ choosing VPN egress near victims, registering devices for conditional access, and recruiting people to provide credentials or approve MFA. It also directly observes actor-controlled VMs created inside victim clouds and cloud resources deleted after exfiltration. The source supports identity context, user action, and malicious compute lifecycle respectively, while missing control enrollment or local evidence still requires environment-specific cloud telemetry.
