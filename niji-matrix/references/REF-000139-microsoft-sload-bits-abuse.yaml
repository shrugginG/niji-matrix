notes_zh: Microsoft 对 sLoad 的现场威胁研究，直接记录其大量使用 BITS 进行通信、下载与外传，并说明这种非常规协议会避开未检查 BITS 的防护。该来源支持 BITS 的特征伪装与观察盲点，但不单独证明 SetNotifyCmdLine 执行。
notes_en: Microsoft field research on sLoad directly records extensive BITS use for communication, download, and exfiltration and explains that this unconventional protocol can evade defenses that do not inspect BITS. It supports feature disguise and observation gaps, but does not independently establish SetNotifyCmdLine execution.
