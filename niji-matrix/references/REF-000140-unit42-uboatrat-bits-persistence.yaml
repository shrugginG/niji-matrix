notes_zh: 直接观察 UBoatRAT 创建 BITS 作业、添加本地文件、设置 SetNotifyCmdLine、恢复作业并在传输完成后执行恶意程序；报告还观察到作业跨重启周期性执行。目标为韩国或游戏行业人员与组织属于报告作者的推断，应保持原有限定。
notes_en: Directly observes UBoatRAT creating a BITS job, adding a local file, setting SetNotifyCmdLine, resuming the job, and executing malware after transfer. The report also observes periodic execution across reboot. Targeting of Korean or video-game personnel and organizations remains the authors' qualified inference.
