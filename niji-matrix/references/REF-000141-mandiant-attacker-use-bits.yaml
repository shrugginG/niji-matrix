notes_zh: "直接记录 BITS 服务宿主、作业数据库、通知命令和取证字段，并给出医疗机构事件响应中的 KEGTAP 案例：攻击者使用名为 System update 的 normal-priority 作业和不存在的本地 URL 触发 error 状态通知程序。该来源同时说明手工数据库分析的规模限制。"
notes_en: "Directly documents the BITS service host, job database, notification command, and forensic fields, and provides a KEGTAP incident-response case in healthcare: an adversary used a normal-priority job named System update and a nonexistent local URL to trigger an error-state notification program. It also states the scaling limits of manual database analysis."
