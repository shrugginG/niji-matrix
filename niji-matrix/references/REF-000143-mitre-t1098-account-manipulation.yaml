notes_zh: ATT&CK Enterprise 19.1 将 T1098 定义为通过修改既有账户的凭据、权限组或其他访问状态维持或提升访问，映射到 TA0003 与 TA0004，并说明攻击者虽需先有足够系统/域权限，新增角色、权限或更高权限 Valid Account 仍可造成后继提权。该来源只锚定父行为、两项战术与七项广度；不自动成为 Niji 子技术、匿迹机理或具体 authority-delta 事件的充分证据。
notes_en: ATT&CK Enterprise 19.1 defines T1098 as maintaining or elevating access by modifying credentials, permission groups, or other access state of existing accounts and maps it to TA0003 and TA0004. Although the adversary needs sufficient system or domain permission first, additional roles, permissions, or higher-privileged Valid Accounts can produce subsequent elevation. The source anchors parent behavior, both tactics, and seven-child breadth only; it is not automatically sufficient evidence for a Niji child, stealth mechanism, or specific authority-delta event.
