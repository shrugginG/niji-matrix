notes_zh: 官方指南把向既有应用添加凭据列为高风险监控事件，指出应用和服务主体更新可能形成两条审计记录，并要求依据正常业务流程、类型和寿命判断；还列出角色分配与高权限授权的审计活动。该来源支持变更遥测和控制设计，不单独证明任一事件为恶意。
notes_en: The official guide treats credential additions to existing applications as a high-risk monitoring event, notes that application and service-principal updates may produce two audit records, and calls for evaluation against normal workflow, credential type, and lifetime. It also identifies audit activities for role assignments and privileged grants. It supports mutation telemetry and control design but does not make any individual event malicious by itself.
