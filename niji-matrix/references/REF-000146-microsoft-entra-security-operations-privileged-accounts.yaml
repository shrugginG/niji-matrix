notes_zh: 官方指南要求监控特权账户认证方法、权限和角色的更改，将新增认证方法视为可能的持续访问迹象，并列出时间、服务、活动、状态、目标和发起者等审计维度。它支持身份变更审计与后续登录关联模型。
notes_en: The official guide calls for monitoring changes to authentication methods, permissions, and roles on privileged accounts, treats an added authentication method as a possible continued-access indicator, and identifies time, service, activity, status, target, and initiator as audit dimensions. It supports the identity-change and later-sign-in correlation model.
