notes_zh: 说明非用户服务主体使用证书或应用机密进行认证，登录记录按服务主体名称或 ID、状态、IP 地址和资源聚合，且系统生成记录不可修改或删除。该字段集合可支持主体级变更到使用关联，但未暴露具体新增密钥时不能声称完成凭据级精确匹配。
notes_en: Explains that nonuser service principals authenticate with certificates or application secrets and that sign-in records are grouped by service-principal name or ID, status, IP address, and resource and are system-generated and immutable. These fields support principal-level mutation-to-use correlation, but exact credential matching cannot be claimed when the newly added key is not exposed.
