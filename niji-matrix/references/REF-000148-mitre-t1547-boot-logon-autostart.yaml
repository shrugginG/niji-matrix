notes_zh: 固定 Enterprise ATT&CK 19.1 基线的父技术来源，支持通过系统启动或登录配置自动执行程序的父行为以及 TA0003/TA0004 映射；页面明确说明部分自启动程序以更高权限运行，攻击者可借此提权。它不证明任一具体映射都产生权限增量；Niji TA0004 判定仍需 writer/pre-state、consumer security context 和新获准结果。页面列出的十四项 ATT&CK 子技术没有被导入 Niji taxonomy。
notes_en: Parent-technique source for the fixed Enterprise ATT&CK 19.1 baseline, supporting automatic program execution through system boot or logon configuration and the TA0003 and TA0004 mappings. The page explicitly states that some autostart programs run with higher privileges that adversaries can leverage. It does not establish authority gain for every mapping; Niji TA0004 classification still requires writer or pre-state, consumer security context, and a newly authorized outcome. The fourteen ATT&CK sub-techniques are not imported into Niji taxonomy.
