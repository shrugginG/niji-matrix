notes_zh: 官方文档直接说明 Run 在每次登录时运行程序、RunOnce 在下一次处理后删除、多个值执行顺序不确定且系统可延迟运行。它支持持久状态到登录激活的时间关系与正常安装用途，不单独证明恶意或匿迹意图。
notes_en: Official documentation directly states that Run launches programs at every logon, RunOnce is deleted after its next processing, execution order among multiple values is indeterminate, and the system may delay execution. It supports the temporal relationship from durable state to logon activation and legitimate installation use, but does not independently establish maliciousness or evasion intent.
