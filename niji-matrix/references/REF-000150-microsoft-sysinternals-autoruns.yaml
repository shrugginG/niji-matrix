notes_zh: Autoruns 官方说明显示启动状态分布在大量注册表与文件系统位置，并提供条目、映像、用户、哈希和签名视图。隐藏签名 Microsoft 条目或只看某一类别会改变可见范围；完整盘点支持描述符、真实目标与软件清单的一致性验证。
notes_en: Official Autoruns documentation shows startup state distributed across many registry and filesystem locations and exposes entry, image, user, hash, and signature views. Hiding signed Microsoft entries or examining only one category changes visibility, while complete inventory supports consistency checks among descriptor, actual target, and software inventory.
