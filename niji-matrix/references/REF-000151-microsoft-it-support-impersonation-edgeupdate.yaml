notes_zh: Microsoft 直接观察到恶意 MSI 创建名为 EdgeUpdate 的 HKCU Run 值或用户启动文件夹快捷方式，在登录时从 LocalAppData 启动 Node.js loader；报告明确称这些为 update-themed entries。它直接支持子项行为与案例，实际匿迹收益仍需结合目标、签名和软件清单推断。
notes_en: Microsoft directly observed a malicious MSI create either an HKCU Run value or user Startup-folder shortcut named EdgeUpdate that launched a Node.js loader from LocalAppData at sign-in, explicitly calling them update-themed entries. It directly supports child behavior and the case; actual evasion benefit remains inferred from target, signature, and software-inventory context.
