notes_zh: 官方检测策略把 Run/RunOnce、systemd 或 init 文件、LaunchAgent/LaunchDaemon plist 的创建或修改，与启动或登录时异常进程和父子关系关联，并明确列出 Windows Security、Sysmon、auditd 与 macOS unified log 通道。它支持跨生命周期检测设计，但平台例子不是 Niji 子技术分类。
notes_en: The official detection strategy correlates creation or modification of Run/RunOnce, systemd or init files, and LaunchAgent or LaunchDaemon plists with anomalous processes and parent-child relationships at boot or logon and identifies Windows Security, Sysmon, auditd, and macOS unified log channels. It supports cross-lifecycle detection design, while platform examples do not define Niji children.
