notes_zh: 固定 Enterprise 19.1 父来源，支持自动执行初始化脚本的父行为、TA0004 映射及“某些脚本以更高权限运行”时可能提权的限定，并记录 APT29 劫持合法应用启动脚本。该条件不表示所有脚本自动提权；必须另证 writer/pre-state、实际 interpreter 权限差与新获准结果。页面的五个 ATT&CK 子技术未导入 Niji taxonomy。
notes_en: Fixed Enterprise 19.1 parent source supporting automatically executed initialization-script behavior, TA0004 mapping, and the qualified possibility of elevation when some scripts run with higher privileges, while recording APT29 hijacking legitimate application startup scripts. The condition does not make every script automatic elevation; writer or pre-state, actual interpreter authority difference, and a newly authorized outcome require separate proof. Its five ATT&CK sub-techniques are not imported into the Niji taxonomy.
