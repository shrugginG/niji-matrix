notes_zh: 直接观察 UNC3886 向 FortiManager 与 FortiAnalyzer 既有 `/etc/init.d/localnet` 启动配置加入命令，在启动时恢复被改二进制以跳过签名验证。支持内联脚本修改、启动执行和内容级残余。
notes_en: Directly observes UNC3886 add a command to the existing `/etc/init.d/localnet` startup configuration in FortiManager and FortiAnalyzer so boot restored a modified binary and bypassed signature verification. It supports inline script mutation, boot execution, and content-level residual evidence.
