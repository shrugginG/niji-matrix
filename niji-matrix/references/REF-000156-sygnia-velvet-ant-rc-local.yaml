notes_zh: 直接观察攻击者把 VELVETSTING 与 VELVETTAP 加入被攻陷 F5 BIG-IP 的既有 `/etc/rc.local`，由系统启动流程自动执行。支持保留脚本路径并内联增加恶意内容的案例。
notes_en: Directly observes the adversary add VELVETSTING and VELVETTAP to the existing `/etc/rc.local` on a compromised F5 BIG-IP so the system startup process executed them automatically. It supports a case preserving script path while adding malicious content inline.
