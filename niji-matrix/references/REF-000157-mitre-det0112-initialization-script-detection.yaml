notes_zh: 官方策略要求把用户或系统登录脚本、shell 初始化脚本、macOS 钩子、ESXi rc 脚本和网络设备启动配置的修改与后续执行关联。它支持数据与窗口设计，不作为 Niji 平台子项来源。
notes_en: The official strategy joins mutation of user or system logon scripts, shell initialization scripts, macOS hooks, ESXi rc scripts, and network-device startup configuration to later execution. It supports data and window design without defining platform-based Niji children.
