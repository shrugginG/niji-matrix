notes_zh: Microsoft 直接观察攻击者通过 Azure 管理面部署 VMAccess 扩展，在来宾 VM 中创建新的本地管理员账户以获得后门访问。该案例支持“创建发生在云控制面、身份落地和使用发生在来宾系统”的跨控制面变量。
notes_en: Microsoft directly observed an adversary deploy the VMAccess extension through Azure management and create a new privileged local administrator inside a guest VM for backdoor access. The case supports a cross-control-plane variable where creation occurs in cloud management while identity materialization and use occur in the guest.
