notes_zh: ATT&CK Enterprise 19.1 记录攻击者通过向既有云账户附加角色或策略取得持续权限，并列出用户、组、服务主体与资源策略等授权边。该来源证明授权图增补行为，但平台枚举本身不构成 Niji 子技术。
notes_en: ATT&CK Enterprise 19.1 documents adversaries attaching roles or policies to existing cloud accounts for continuing privilege and identifies authorization edges involving users, groups, service principals, and resource policies. It establishes authorization-graph augmentation behavior, while the platform enumeration does not itself define a Niji child.
