notes_zh: ATT&CK Enterprise 19.1 记录攻击者把自有设备注册到 MFA 或设备管理体系，以维持访问并绕过依赖 MFA 或条件访问的控制；它还列出 APT29 与 Scattered Spider 的程序实例。该来源直接支持设备信任附着行为与规避目的。
notes_en: ATT&CK Enterprise 19.1 documents adversaries registering their own devices in MFA or device-management systems to maintain access and bypass controls dependent on MFA or Conditional Access, with procedure examples including APT29 and Scattered Spider. It directly supports device-trust attachment behavior and its evasion purpose.
