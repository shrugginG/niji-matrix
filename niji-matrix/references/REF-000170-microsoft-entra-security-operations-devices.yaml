notes_zh: 官方指南说明注册或加入的设备会形成 Entra 设备身份并可取得 PRT，PRT 可能携带强认证声明；它要求监控缺少 MFA 的注册/加入、条件访问变化及异常设备合规状态。该来源支持设备身份、注册审计和后续令牌/访问之间的关联模型。
notes_en: The official guide explains that registered or joined devices create Entra device identities and may receive Primary Refresh Tokens carrying strong-authentication claims. It calls for monitoring registration or join without MFA, Conditional Access changes, and anomalous device compliance. It supports correlation among device identity, registration audit, and later token or access activity.
