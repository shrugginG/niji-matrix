notes_zh: Microsoft 调查报告描述攻击者利用被盗身份注册自有设备，使设备加入目标租户并支持后续钓鱼与访问；处置必须删除恶意设备并撤销会话，而非只重置密码。该案例直接证明设备信任是独立于主密码的持续状态。
notes_en: Microsoft's investigation describes attackers using a compromised identity to register their own device into a victim tenant and support later phishing and access. Remediation requires removal of the rogue device and revocation of sessions rather than only a password reset, directly establishing device trust as durable state independent of the primary password.
