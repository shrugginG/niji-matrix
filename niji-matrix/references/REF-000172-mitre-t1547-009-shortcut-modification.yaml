notes_zh: ATT&CK Enterprise 19.1 记录攻击者修改既有快捷方式目标或参数，使用户或登录生命周期执行攻击者代码。该来源直接支持“保留描述符身份、替换真实目标”的行为变量，但匿迹收益仍需结合清单与检测语义推断。
notes_en: ATT&CK Enterprise 19.1 documents adversaries modifying an existing shortcut target or arguments so user action or logon lifecycle executes adversary code. It directly supports the behavior variable of preserving descriptor identity while substituting its actual target, while evasion benefit remains inferred from inventory and detection semantics.
