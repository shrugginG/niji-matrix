notes_zh: ATT&CK Enterprise 19.1 记录攻击者操纵 macOS 登录窗口维护的重新打开应用状态，使指定应用在用户重新登录时启动。它直接证明会话恢复队列可被写入持久目标，平台实现本身不自动扩大为所有登录项。
notes_en: ATT&CK Enterprise 19.1 documents adversaries manipulating macOS re-opened-application state maintained by the login window so a selected application launches when the user signs in again. It directly establishes that a session-restoration queue can carry a persistent target without generalizing the platform implementation to all login items.
