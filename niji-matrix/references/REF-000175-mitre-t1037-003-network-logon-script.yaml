notes_zh: ATT&CK Enterprise 19.1 说明网络登录脚本可由 Active Directory 或 GPO 分配，并可能应用到多个乃至全部系统；其 DET0367 要求把 GPO 更新、网络脚本与用户登录触发的远程文件执行关联。该来源直接支持集中脚本到多端执行的变量。
notes_en: ATT&CK Enterprise 19.1 states that network logon scripts can be assigned through Active Directory or Group Policy Objects and may apply to multiple or potentially all systems. DET0367 correlates GPO update and network script with remote-file execution triggered by user logons, directly supporting the centralized-script-to-multiple-endpoint variable.
