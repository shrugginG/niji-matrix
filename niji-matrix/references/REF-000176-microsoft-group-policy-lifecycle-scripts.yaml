notes_zh: Microsoft 官方文档说明 GPO 可把脚本关联到计算机启动/关闭和用户登录/注销，脚本及依赖可存放在域控制器 Netlogon 共享，并由目标 GPO 客户端执行；其中 startup script 以 Local System 账户及其完整权限运行。该来源确立集中管理、共享存储、分布式生命周期消费和一种高权限 consumer 的正常架构，但没有证明脚本 writer 必然低权限或每个 GPO 脚本均造成提权。
notes_en: Microsoft documentation explains that Group Policy associates scripts with computer startup or shutdown and user logon or logoff, stores scripts and dependencies in a domain controller Netlogon share, and causes targeted GPO clients to execute them. Startup scripts run under the Local System account with its full associated rights. The source establishes the normal architecture for centralized administration, shared storage, distributed lifecycle consumption, and one privileged consumer, but does not prove that the script writer is necessarily lower-authority or that every GPO script causes elevation.
