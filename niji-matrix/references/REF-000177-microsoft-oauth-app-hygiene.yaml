notes_zh: Microsoft 官方指南要求按应用 last used、凭据 unused since 与到期状态识别休眠或高权限 OAuth 应用，并给出对长期未使用应用自动禁用的治理方式。该来源支持长期静默基线、合法反例与检测/缓解字段，不单独证明攻击者延迟使用。
notes_en: Microsoft guidance uses application last-used, credential-unused-since, and expiry state to identify dormant or high-privilege OAuth applications and describes automatic disablement of applications unused for long periods. It supports long-silence baselines, legitimate alternatives, and detection or mitigation fields without independently proving adversary-delayed use.
