notes_zh: Google 直接观察 UNC6395 使用与既有 Salesloft Drift 第三方集成相关的被盗 OAuth token 访问多个客户 Salesforce 实例及少量 Workspace 邮件，并要求撤销/轮换集成 token、审查所有相连系统和禁用相关集成。该来源支持既有集成控制被挪用及其跨客户面活动。
notes_en: Google directly observed UNC6395 use compromised OAuth tokens associated with existing Salesloft Drift third-party integrations to access multiple customer Salesforce instances and a small number of Workspace mailboxes, and recommended revoking or rotating integration tokens, reviewing every connected system, and disabling affected integrations. It supports co-option of existing integration control and cross-customer activity.
