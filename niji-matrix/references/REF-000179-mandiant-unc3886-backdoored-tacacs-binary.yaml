locator: Replacement of /usr/bin/tac_plus with a malicious credential-logging version; REPTILE kernel component loading through RC or systemd state; specialized TCP UDP or ICMP packet and port-knock activation; TABLEFLIP packet and source matching to REPTILE redirection; backdoored SSH executables; CVE-2022-22948 and encrypted vpxuser result
