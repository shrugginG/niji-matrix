notes_zh: Mandiant 直接观察 UNC3886 以 RC 脚本或 systemd 状态重新加载 REPTILE 内核组件，并通过专用 TCP、UDP 或 ICMP 包及端口敲击激活后门；TABLEFLIP 又按特殊包与来源把流量重定向至 REPTILE，在 ACL 中断后恢复直连。报告还记录恶意 tac_plus、后门化 SSH 与取得加密 vpxuser 凭据。前述事实直接支持持久载体—matcher 重载—特殊包—访问恢复链；其他事实各自保留原结论边界。
notes_en: Mandiant directly observed UNC3886 reload REPTILE kernel components through RC scripts or systemd state and activate the backdoor through specialized TCP UDP or ICMP packets and port knocking. TABLEFLIP matched special packets and source traffic and redirected them to REPTILE restoring direct access after ACL disruption. The report also documents malicious tac_plus backdoored SSH and acquisition of encrypted vpxuser credentials. The former facts directly support durable carrier to matcher reload to specialized packet to restored access while the other facts retain their original conclusion boundaries.
