notes_zh: ESET 报告说明 Industroyer 把恶意代码插入完整可用的 Windows Notepad，恶意代码执行后解密并把控制交还文件末尾保存的原始 Notepad 代码，使应用继续按预期工作。该来源直接支持“恶意前奏—原始功能接力”的行为保持变量。
notes_en: ESET reports that Industroyer inserted malicious code into a fully functional Windows Notepad; after malicious execution it decrypted and passed control to original Notepad code stored at the end of the file so the application worked as expected. It directly supports the malicious-prelude-to-original-function handoff variable.
