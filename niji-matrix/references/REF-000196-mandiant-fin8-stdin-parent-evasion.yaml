notes_zh: 直接观察 FIN8 将 PowerShell 命令存入环境状态并经 stdin 送入，使 PowerShell 参数只显示 `-`；同时用 WMI 改写 Word 到 PowerShell 的直接父子关系。分别支持短驻语义载体和入口谱系借用。
notes_en: Directly observes FIN8 store PowerShell commands in environment state and supply them through standard input so PowerShell arguments show only `-`, while WMI changes the direct Word-to-PowerShell parent relation. It supports transient semantic carriage and entry-lineage borrowing.
