notes_zh: 直接观察攻击者以恶意 VIB 在 ESXi 上建立跨重启启动状态，并把 descriptor 中的 acceptance level 伪装为 PartnerSupported；常规列表继承声明值，而 signature verification 暴露签名缺失。报告还直接观察 VIRTUALPITA 从 ESXi 调用脚本向 Windows 来宾执行命令，来宾侧命令成为合法 `vmtoolsd.exe` 子进程。两组事实分别支持服务器组件信任身份差分与跨层执行来源断点。
notes_en: Directly observes malicious VIBs establish reboot-persistent ESXi startup state while falsifying descriptor acceptance level as PartnerSupported. Ordinary inventory inherits the declared value while signature verification exposes the missing signature. The report also observes VIRTUALPITA invoke an ESXi script to execute commands in Windows guests where commands become children of legitimate vmtoolsd.exe. These facts separately support server-component trust-identity differential and cross-plane execution-provenance breaks.
