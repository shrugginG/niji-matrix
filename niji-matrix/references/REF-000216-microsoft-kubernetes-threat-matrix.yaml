notes_zh: 说明有权限的攻击者可用 `kubectl exec` 在容器运行命令，并可把 Ubuntu 等合法镜像作为后门容器；也说明默认挂载服务账户令牌和 kubeconfig 会向攻击者提供 API 身份。
