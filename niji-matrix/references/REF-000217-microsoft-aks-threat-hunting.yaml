notes_zh: 明确指出攻击者在进一步访问前需要 exec 进入容器，相关命令通常不写入 Pod 定义且很少被记录；提供 kube-audit-admin 与 host audit 的检测前提，并说明服务账户和特权规格风险。
notes_en: States that adversaries must exec into a container before several follow-on paths and that commands are rarely logged and absent from Pod definitions, with kube-audit-admin and host audit prerequisites plus service-account and privileged-spec risks.
