notes_zh: 在暴露的 Kubernetes 蜜罐中观察外部攻击者首先 `kubectl exec` 进入既有容器取得 shell，并记录运行时 bash、父级与终端上下文；受控蜜罐环境使归因范围有限但行为直接可见。
notes_en: Observes an external attacker first use `kubectl exec` into an existing container for a shell and records runtime bash parent and terminal context. The controlled honeypot limits attribution breadth but directly captures the behavior.
