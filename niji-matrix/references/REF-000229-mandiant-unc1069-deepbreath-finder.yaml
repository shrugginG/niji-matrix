notes_zh: 在真实 UNC1069 入侵中，DEEPBREATH 借具有 Full Disk Access 的 Finder 完成受保护 TCC 目录重命名，并用 AppleScript 后台重启自身；XProtect 数据库仍保存时间与哈希残余。 同一 UNC1069 分析还记录
  DEEPBREATH 复制钥匙串和浏览器数据并打包外传；公开内容未逐项证明解密成功。
notes_en: In a real UNC1069 intrusion DEEPBREATH used Finder with Full Disk Access to rename protected TCC folders and AppleScript to relaunch
  itself in the background while XProtect retained timestamp and hash residuals. The same UNC1069 analysis also records DEEPBREATH copying keychain
  and browser data and exfiltrating an archive; it does not prove per-item decryption.
