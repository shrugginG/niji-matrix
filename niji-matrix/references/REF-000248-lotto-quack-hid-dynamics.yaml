notes_zh: 系统研究 HID 攻击者可控制输入速度和随机延迟，简单速度/规则性阈值易被规避；它直接支持时间变量可控与防守差异，但不是确认野外人类节奏模仿案例。
notes_en: Systematically studies HID adversaries controlling speed and random delays and simple timing or regularity heuristics being evadable. It directly supports control of the timing variable and defensive difference but is not a confirmed field case of human-cadence mimicry.
