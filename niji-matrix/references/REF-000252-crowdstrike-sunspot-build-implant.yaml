notes_zh: 该技术分析直接记录 SUNSPOT 修改自身进程安全令牌以启用 SeDebugPrivilege，随后读取其他进程内存；还记录其监视特定 MsBuild 进程、校验目标源文件、临时替换源代码、等待成功构建后恢复原文件，并抑制可能暴露篡改的编译警告。令牌结论限于启用已有调试权限与后继进程访问，不证明增加原令牌不存在的权限。
notes_en: The technical analysis directly documents SUNSPOT modifying its process security token to enable SeDebugPrivilege before reading other-process memory. It also records selected MsBuild monitoring, target-source validation, temporary source replacement, restoration after a successful build, and warning suppression. The token conclusion is limited to enabling an existing debug privilege and subsequent process access; it does not show addition of a privilege absent from the original token.
