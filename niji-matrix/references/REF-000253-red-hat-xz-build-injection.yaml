notes_zh: Red Hat 说明恶意 M4 触发器只存在于 5.6.0/5.6.1 发布 tarball，构建过程从伪装测试文件提取预编译对象并修改 liblzma；Git 分发缺少该触发宏，直接支持间接构建输入与条件差异。
notes_en: Red Hat states that the malicious M4 trigger existed only in the 5.6.0 and 5.6.1 release tarballs and caused the build to extract a prebuilt object from a disguised test file and modify liblzma while the Git distribution lacked the trigger supporting indirect build input and conditional differences.
