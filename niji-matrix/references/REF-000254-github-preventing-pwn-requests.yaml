notes_zh: GitHub Security Lab 说明 fork PR 可通过构建脚本、测试或依赖安装在 runner 上执行代码，并解释 pull_request_target 的具权上下文及把低权构建与后续具权处理分离的安全模式。
notes_en: GitHub Security Lab explains how fork pull requests execute through build scripts tests or dependency installation on runners and documents the privileged pull_request_target context and the safe separation of low-privilege builds from later privileged processing.
