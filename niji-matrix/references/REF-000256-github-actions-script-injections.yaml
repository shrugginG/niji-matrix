notes_zh: GitHub 官方文档把 PR 标题、正文、分支名等上下文字段定义为不可信输入，并说明这些值直接插入 inline script 时会在 runner 上被解释为代码。
notes_en: GitHub documentation identifies pull-request titles bodies branch names and other context values as untrusted inputs and explains that direct interpolation into inline scripts causes runner-side code interpretation.
