notes_zh: SLSA 1.2 要求高等级构建使用托管、隔离且不可跨构建持久影响的环境，保护平台秘密和缓存，并由平台生成可验证来源证明，为控制 runner 信任边界和验证构建输入输出提供依据。
notes_en: SLSA 1.2 requires higher-level builds to use hosted isolated environments without cross-build persistence protect platform secrets and caches and generate verifiable provenance providing a basis for runner trust-boundary controls and build input-output verification.
