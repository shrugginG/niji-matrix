notes_zh: Microsoft 在 HAFNIUM/Silk Typhoon 活动中直接观察 Tarrask 创建 WinUpdate 任务并删除 TaskCache Tree 下的 SD 值，使任务从 schtasks /query 和 Task Scheduler 消失但继续执行；报告同时列出注册表、XML 与 4698/Operational 残余。
notes_en: Microsoft directly observed Tarrask create a WinUpdate task and delete the TaskCache Tree SD value causing disappearance from schtasks query and Task Scheduler while execution continued and documented residual registry XML 4698 and Operational evidence.
