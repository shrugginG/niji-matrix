notes_zh: 该现场调查记录 Guloader 建立符合 Firefox BackgroundUpdate 命名惯例的任务，但主机从未安装 Firefox，任务以 regsvr32 执行用户目录数据并每分钟运行，支持资产局部基线而非仅名称信誉的判断。
notes_en: The incident investigation records Guloader creating a task that followed Firefox BackgroundUpdate naming conventions although Firefox had never been installed and using regsvr32 on user-directory data every minute supporting asset-local baselines rather than name reputation alone.
