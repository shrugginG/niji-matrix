notes_zh: Mandiant 在调查中观察 APT32 入侵 McAfee ePO 基础设施，把恶意软件作为软件部署任务发布，使所有系统经专有 SPIPE 协议从 ePO 服务器拉取载荷；报告将此置于其贴合合法活动的匿迹行为中。
