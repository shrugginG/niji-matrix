notes_zh: 联合指南把 MDM、RMM/SCCM、补丁管理和 EDR remote shell 列为攻击者可借用的已部署工具，指出其高权限和面向大量系统的能力，并主张行为与跨源关联而非仅 IOC。
notes_en: The joint guidance lists MDM RMM or SCCM patch management and EDR remote shells as deployed tools adversaries abuse notes their elevated access to many systems and emphasizes behavior and cross-source correlation over IOC-only detection.
