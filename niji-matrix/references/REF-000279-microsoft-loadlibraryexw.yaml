notes_zh: Microsoft 定义 LoadLibraryExW 如何把 DLL 或映像映射进调用进程并返回 module handle，以及不同 flags 对 DllMain、依赖、搜索和 EnumProcessModules 可见性的影响，为标准 loader 模块状态提供权威语义。
