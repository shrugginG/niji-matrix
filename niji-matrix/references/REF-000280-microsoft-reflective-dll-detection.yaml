notes_zh: Microsoft 说明反射加载可不使用 Windows loader 把 DLL 放入进程内存，并通过 VirtualAlloc/VirtualProtect 等可执行内存调用和行为信号检测，支持 file/module inventory 与 private executable memory 的差分。
notes_en: Microsoft explains that reflective loading places DLLs in process memory without the Windows loader and detects it through executable-memory calls such as VirtualAlloc and VirtualProtect and behavior signals supporting the differential between file or module inventory and private executable memory.
