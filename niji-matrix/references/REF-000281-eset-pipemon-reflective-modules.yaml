notes_zh: ESET 在游戏企业入侵中发现 PipeMon。其 modules、installer 和工具由同一有效代码签名证书签名，研究人员判断证书很可能在 Winnti 早期行动中被盗，直接支持恶意对象借用合法 signer 特征。报告还记录 UAC/令牌/PPID 提权、SeLoadDriverPrivilege、模块加密、reflective loading、Print Processor 持久化与跨进程注入；各技术只引用对应事实，不把签名自动升级为所有 consumer 都放行。
notes_en: ESET found PipeMon in gaming-company intrusions. Its modules, installer, and tools were signed with the same valid code-signing certificate, which researchers assessed was likely stolen during an earlier Winnti campaign, directly supporting malicious-object borrowing of legitimate signer features. The report also covers UAC, token, and PPID elevation, SeLoadDriverPrivilege, encrypted modules, reflective loading, Print Processor persistence, and cross-process injection. Each technique uses only its corresponding facts, and signature does not automatically prove every consumer allowed the object.
