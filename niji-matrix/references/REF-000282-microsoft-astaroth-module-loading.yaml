notes_zh: Microsoft 观察 Astaroth 借 ExtExport.exe 等合法进程加载载荷并减少独立恶意进程/文件外观，同时强调 fileless 仍留下可检查内存和行为链，支持进程身份保持与残余可见性结论。
notes_en: Microsoft observed Astaroth use legitimate processes including ExtExport.exe to load payloads and reduce standalone malicious process or file appearance while emphasizing that fileless activity retains inspectable memory and behavioral chains supporting process-identity preservation and residual visibility.
