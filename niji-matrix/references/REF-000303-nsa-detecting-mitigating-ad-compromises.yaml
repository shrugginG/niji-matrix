notes_zh: 多国网络安全机构的联合指南说明 Skeleton Key 覆盖 NTLM 与 Kerberos 认证过程，使一个主密码能够以任意域用户身份通过，同时指出受保护进程、LSA 插件签名、凭据轮换和域控制器恢复等控制。该来源直接支持选择性后门秘密的行为与关键缓解面，但不意味着所有验证器补丁都使用相同实现。
notes_en: The joint guidance from multiple national cybersecurity authorities explains that Skeleton Key overrides NTLM and Kerberos authentication so a master password authenticates as any domain user, and it identifies protected-process, LSA plug-in signing, credential-rotation, and domain-controller recovery controls. It directly supports selective backdoor-secret behavior and core mitigation surfaces without implying that every validator patch uses the same implementation.
