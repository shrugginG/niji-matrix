notes_zh: Microsoft 的跨域调查描述攻击者获得云管理权限后向既有联合信任加入自有签名证书，使其签发的 SAML 令牌被目标租户接受并绕过 MFA；文章给出联合设置变更的审计查询，并要求轮换证书、隔离和修复 AD FS。该来源支持认证信任路径变更、后续异常允许和恢复动作之间的直接案例链。
  同一 Solorigate 来源还支持攻击者构造 SAML 证明并被云资源接受。
notes_en: Microsoft's cross-domain investigation describes attackers using cloud administrative authority to add their own signing certificate
  to an existing federation trust so SAML tokens they issued were accepted by the victim tenant and bypassed MFA. The report provides an audit
  query for federation-setting changes and calls for certificate rotation plus AD FS isolation and remediation, directly supporting the chain
  from authentication-trust mutation to anomalous allow and recovery. The same Solorigate source also supports attacker-created SAML proof accepted
  by cloud resources.
