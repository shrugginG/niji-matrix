notes_zh: GTIG/Mandiant 说明 UNC3944 已知会修改 MFA 使用要求，并要求重点监控受信命名位置及强制 MFA 的 Conditional Access 策略中对被攻陷用户或设备的排除。该来源直接支持范围化认证策略例外，同时给出管理员访问隔离、变更监控、令牌撤销与身份恢复等防御依据。
notes_en: GTIG and Mandiant state that UNC3944 is known to modify MFA requirements and call for monitoring trusted named locations and exclusions of compromised users or devices from Conditional Access policies enforcing MFA. The source directly supports scoped authentication-policy exceptions and provides defensive grounding for administrative isolation, change monitoring, token revocation, and identity recovery.
