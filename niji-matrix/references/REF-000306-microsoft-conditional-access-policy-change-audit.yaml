notes_zh: Microsoft 官方文档说明 Conditional Access 变更进入 Entra 审计日志，modifiedProperties 保存策略旧值与新值，并可通过 AuditLogs 查询；默认三十日保留期可能不足，需通过诊断设置延长。该来源直接支持策略版本差分的数据字段、保留期要求和短期日志盲区。
notes_en: Microsoft documentation states that Conditional Access changes are recorded in Entra audit logs, modifiedProperties retains old and new policy JSON, and AuditLogs can be queried for updates. The default thirty-day retention can be insufficient and must be extended through diagnostic settings. The source directly supports policy-differential fields, retention requirements, and the short-log blind spot.
