notes_zh: Microsoft 官方文档列出登录主体、客户端、资源、request/correlation/token 标识、认证方法序列、Conditional Access 策略及结果、设备和风险情境，并明确部分聚合字段可能暂时不完整或存在语义边界。该来源支持把策略变更与逐请求决策及资源结果关联，同时要求在字段缺失时降低结论强度。
notes_en: Microsoft documentation enumerates sign-in principal, client, resource, request, correlation and token identifiers, authentication-method sequence, Conditional Access policies and outcomes, device and risk context, while warning that some aggregated fields can be temporarily incomplete or semantically limited. It supports joining policy changes to request-level decisions and resource outcomes while requiring lower confidence when fields are absent.
