notes_zh: Microsoft Sysinternals 说明包含嵌入式 null 字符的 Registry key 不能由标准注册表编辑工具正常删除，并提供 RegDelNull 搜索与清除这些对象；同时警告删除关联 key 可能导致应用失败。该来源直接支持 API/工具视图差与恢复限制，不单独证明某个 key 为恶意。
notes_en: Microsoft Sysinternals states that Registry keys containing embedded null characters cannot be deleted normally with standard Registry-editing tools and provides RegDelNull to search for and remove them, while warning that removal can break associated applications. It directly supports the API or tool-view differential and recovery limitations but does not make a specific key malicious by itself.
