notes_zh: Sysinternals 解释 Windows API 把 key 名视为 null 结尾字符串，而 kernel 使用带长度字符串，因此可以创建操作系统可见、Regedit 等工具只部分可见的 key；RootkitRevealer 通过高层 API 与原始 hive 差分发现这类状态，并提醒扫描中值变化会产生竞争型差异。该来源直接支持子技术因果、检测方法和误报条件。
notes_en: Sysinternals explains that the Windows API treats key names as null-terminated strings while the kernel uses counted strings, allowing keys visible to the operating system but only partially visible to tools such as Regedit. RootkitRevealer finds such state through high-level API versus raw-hive differential and warns that values changing during a scan create race-condition discrepancies. The source directly supports the child causality, detection method, and false-positive conditions.
