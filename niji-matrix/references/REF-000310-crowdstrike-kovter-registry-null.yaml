notes_zh: CrowdStrike 对 Kovter 的分析记录持久 Run 值使用 null byte 或不可读字符，Regedit、reg query 与 Autoruns 对该对象呈现不同结果，并说明完整处置需要加载用户 hive 清理相关 Run 与 file-association 状态。该来源直接支持伪隐藏 Registry 对象、跨工具差分、consumer 持久化和恢复边界。
notes_en: CrowdStrike's Kovter analysis records a persistent Run value using a null byte or unreadable character, different representations across Regedit, reg query, and Autoruns, and remediation requiring user hives to be loaded to remove related Run and file-association state. It directly supports pseudo-hidden Registry objects, cross-tool differential, consumer persistence, and recovery boundaries.
