notes_zh: Mandiant 在 FIN7 调查中观察到 shim database 补丁在启动时触发 loader，loader 从固定 Registry 路径读取、解压并执行其中保存的 CARBANAK shellcode/DLL，随后创建 svchost 进程。该来源直接证明 Registry 不只是配置介质，而可以保存跨启动后被 consumer 读取并产生进程结果的持久状态。
notes_en: >-
  Mandiant observed in FIN7 investigations that a shim-database patch triggered a loader at startup, which read, decompressed, and executed CARBANAK shellcode or a DLL stored at a defined Registry path and then created a svchost process. The source directly establishes Registry as more than a configuration medium because it can retain state consumed after startup to produce a process outcome.
