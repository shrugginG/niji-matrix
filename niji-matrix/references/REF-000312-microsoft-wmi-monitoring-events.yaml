notes_zh: Microsoft 官方文档说明永久 WMI consumer 会持续运行直到显式取消，并在 WMI 或系统重启后启动；注册由 consumer、含 WQL Query 的 __EventFilter 与 __FilterToConsumerBinding 组成，只有事件匹配过滤条件时 WMI 才找到并启动相应 consumer。该来源直接支持持久注册、可配置谓词、broker 关联和状态对象字段。
notes_en: Microsoft documentation states that a permanent WMI consumer runs until explicitly canceled and starts after WMI or the system restarts. Registration consists of a consumer, an __EventFilter containing a WQL Query, and a __FilterToConsumerBinding, and WMI locates and starts the associated consumer only when an event matches the filter. It directly supports durable registration, configurable predicates, broker association, and state-object fields.
