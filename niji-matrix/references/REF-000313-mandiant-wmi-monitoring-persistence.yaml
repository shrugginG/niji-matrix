notes_zh: Mandiant 在红队与防守工程中使用 WMI 永久订阅作为持久机制，并明确拆分 Event Consumer、Event Filter 和 Filter-to-Consumer Binding；文中给出系统 uptime 达到条件后执行的窄谓词示例，并构建监控新 consumer 与 WMI 进程执行的事件记录。该来源支持注册—谓词—consumer 结构、上下文选择性和检测字段，但红队示例不能单独证明现实攻击者的主观匿迹意图。
notes_en: Mandiant used WMI permanent subscriptions as a persistence mechanism in red-team and defensive engineering and explicitly separates Event Consumer, Event Filter, and Filter-to-Consumer Binding. It gives a narrow predicate example executing after system uptime reaches a condition and builds event logging for new consumers and WMI process execution. It supports registration-predicate-consumer structure, contextual selectivity, and detection fields, while the red-team example alone cannot establish a real adversary's subjective stealth intent.
