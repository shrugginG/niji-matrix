notes_zh: Mandiant 观察 UNC5174 利用 F5 BIG-IP CVE-2023-46747、创建后门管理账户并部署工具后，运行 F5 官方 mitigation.sh 尝试自修补漏洞；Mandiant 评估其目的是阻止无关攻击者再次利用。该来源直接提供“利用—替代入口—原面关闭”的顺序、writer 和审计字段。
notes_en: Mandiant observed UNC5174 exploit F5 BIG-IP CVE-2023-46747, create backdoor administrative accounts and deploy tooling, and then run F5's mitigation.sh to self-patch the vulnerability. Mandiant assessed the purpose as preventing later exploitation by unrelated actors. The source directly provides the exploitation-alternative-entry-original-surface-closure sequence plus writer and audit fields.
