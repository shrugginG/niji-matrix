notes_zh: F-Secure 技术描述记录 NetSky.P 复制并传播自身，同时删除多种 Bagle 变体的 Registry Run keys。该来源直接证明一个恶意主体在保留自身驻留/传播能力时清除竞争恶意软件状态，但旧报告不提供完整 writer telemetry、攻击者主观匿迹意图或现代端点字段。
notes_en: F-Secure's technical description records NetSky.P copying and spreading itself while deleting Registry Run keys used by multiple Bagle variants. It directly establishes one malicious actor removing competing malware state while preserving its own residence or propagation, but the older report does not provide complete writer telemetry, subjective stealth intent, or modern endpoint fields.
