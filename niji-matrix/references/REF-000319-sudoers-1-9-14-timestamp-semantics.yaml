notes_zh: 定义 sudo 成功认证后的时间戳缓存、默认有限有效期、per-tty/global/kernel 记录范围和缓存文件位置，支持可重建的本地短期授权窗口。该手册不把正常缓存使用自动归因为恶意。
notes_en: Defines sudo authentication timestamp caching, bounded default validity, per-tty, global, or kernel record scopes, and timestamp record storage, supporting a reconstructable local temporary-authorization interval. The manual does not attribute normal cache use to malicious activity.
