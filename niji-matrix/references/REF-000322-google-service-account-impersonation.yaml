notes_zh: 说明认证主体取得服务账户短期凭据后以其权限访问资源、凭据仅持续数小时或更短、多数审计日志记录两种身份，并区分只显示服务账户的 key 使用。它同时支持中介来源谱系、短期窗口和日志盲区边界。
notes_en: Explains that an authenticated principal obtains short-lived service-account credentials and accesses resources with that account's permissions, that credentials last hours or less, that most audit logs retain both identities, and that key use can show only the service account. It supports intermediary provenance, temporary intervals, and logging blind-spot boundaries.
