notes_zh: 说明 TCC/PPPC 可按 bundle ID 或路径及代码签名要求批准应用，并给出 AttributionChain 诊断日志；支持把调用来源、已批准中介与受保护资源结果关联。它不证明所有已批准应用调用都具有提权语义。
notes_en: Describes TCC and PPPC approval by bundle ID or path and code-signing requirement and supplies an AttributionChain diagnostic log predicate, supporting correlation of caller, approved intermediary, and protected-resource outcome. It does not establish that every approved-app invocation is privilege elevation.
