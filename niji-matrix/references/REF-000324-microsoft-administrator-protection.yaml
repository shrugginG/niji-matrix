notes_zh: 描述逐操作交互授权、隔离管理员令牌随进程结束销毁，以及 ETW 事件记录发起 SID、应用路径、结果、系统管理账户和认证方法。部分配置仍为预览，故只用于检测与缓解可实施性，不外推为所有 Windows 部署现状。
notes_en: Describes per-operation interactive authorization, an isolated administrator token destroyed when the process ends, and ETW events retaining initiating SID, application path, outcome, system-managed administrator account, and authentication method. Some configuration remains preview and is used only for detection and mitigation feasibility, not as a universal Windows deployment assumption.
