notes_zh: 厂商在多个客户环境观察到 Glupteba，通过用户可写 HKCU handler 把攻击者可执行文件交给 CompMgmtLauncher 或 fodhelper，并展示受信父进程后出现 system-level 子进程。该案例支持受信中介谱系借用，不证明所有 UAC 绕过都以隐藏为主要意图。
notes_en: The vendor observed Glupteba across customer environments, using a user-writable HKCU handler to pass adversary code to CompMgmtLauncher or fodhelper and showing a system-level child after the trusted parent. The case supports trusted-intermediary lineage borrowing but does not establish concealment as the primary intent of every UAC bypass.
