notes_zh: 说明令牌包含用户/组 SID、登录 SID、权限、来源、主/模拟类型与模拟级别；进程具有主令牌，线程模拟时还具有模拟令牌，并列出 DuplicateTokenEx、SetThreadToken 与 AdjustTokenPrivileges 等接口。该文档支持状态模型，不单独证明攻击者意图。
notes_en: Defines token contents including user and group SIDs, logon SID, privileges, source, primary or impersonation type, and impersonation level. A process has a primary token and an impersonating thread also has an impersonation token; the page lists interfaces including DuplicateTokenEx, SetThreadToken, and AdjustTokenPrivileges. It supports the state model, not adversary intent by itself.
