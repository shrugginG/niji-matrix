notes_zh: 说明 SetThreadToken 将模拟令牌赋给指定线程，或移除线程模拟令牌。它直接支持线程有效身份可以在进程主令牌保持不变时发生变化，以及检测需要 thread/token 关联；合法服务模拟仍是必要反例。
notes_en: Defines SetThreadToken assignment of an impersonation token to a specified thread and removal of thread impersonation. It directly supports an effective thread identity changing while the process primary token remains, and the need for a thread-to-token join. Legitimate service impersonation remains a necessary counterexample.
