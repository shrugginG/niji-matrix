notes_zh: 说明以指定主令牌的安全上下文创建新进程，并指出可由 LogonUser 得到主令牌或用 DuplicateTokenEx 将模拟令牌转换为主令牌。LOGON_NETCREDENTIALS_ONLY 会建立新的 LSA 登录会话但本地仍用调用者令牌，证明令牌、登录会话与承载体字段必须分别解释。
notes_en: Defines creation of a new process in the security context of a specified primary token and notes that a primary token can come from LogonUser or from converting an impersonation token with DuplicateTokenEx. LOGON_NETCREDENTIALS_ONLY creates a new LSA logon session while retaining the caller's token locally, demonstrating why token, logon-session, and carrier fields require separate interpretation.
