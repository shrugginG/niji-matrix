notes_zh: 说明进程创建者可指定一个不同于调用进程的父进程，句柄必须具有 PROCESS_CREATE_PROCESS；新进程从该父体继承句柄、设备映射、亲和性、优先级、配额、进程令牌和作业对象。它支持父级/调用者/继承上下文可分离，不单独证明恶意。
notes_en: Defines selection of a parent different from the calling process, requiring a handle with PROCESS_CREATE_PROCESS. The new process inherits handles, device map, affinity, priority, quotas, process token, and job object from the selected parent. It supports separation among parent, caller, and inherited context, not maliciousness by itself.
