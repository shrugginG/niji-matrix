notes_zh: 说明调用者需要 TOKEN_ADJUST_PRIVILEGES，可启用、禁用或移除指定令牌中的权限并取得 previous state；函数不能增加令牌原本没有的权限。该来源支持“已有权限位状态变化”边界和前后态防御，不单独说明攻击者为何选择某个权限。
notes_en: States that the caller needs TOKEN_ADJUST_PRIVILEGES and can enable, disable, or remove privileges in a specified token while retrieving previous state; the function cannot add privileges absent from the token. This supports the existing-privilege-state boundary and before-and-after defense, not why an adversary selects a particular privilege.
