notes_zh: Talos 在所观察的 Lotus Blossom 活动中记录一个工具取得另一进程令牌并为启动进程调整权限。报告支持真实行动中的令牌来源跨进程与启动权限变化，但公开文字未提供 thread token ID、具体权限前后态或完整 API 序列，因此不单独证明某一更窄实现。
notes_en: Talos records a tool in observed Lotus Blossom activity that retrieves another process token and adjusts privilege for the launch process. The report supports cross-process token provenance and launch-authority change in real activity, but its public text lacks thread token ID, exact privilege before and after state, and a complete API sequence, so it does not independently establish a narrower implementation.
