notes_zh: Trellix 逆向分析 DarkGate 多个版本，直接观察其结合进程注入与父 PID 欺骗来隐藏进程，并把该设计与规避 Task Manager、Process Explorer 和部分安全产品联系。来源直接支持谱系观察影响，但没有证明每次 PPID 欺骗都取得更高权限；TA0004 归类仍需独立的令牌继承或权限结果。
notes_en: Trellix reverse-engineered multiple DarkGate versions and directly observed process injection and parent PID spoofing used to hide a process, relating the design to evasion of Task Manager, Process Explorer, and some security products. It directly supports the lineage-observation effect but does not show that every PPID spoof obtains higher privilege; TA0004 classification still requires independent token inheritance or a privileged outcome.
