notes_zh: 固定基线页面说明 SID-History 是目录账户上的附加 SID 属性，值会进入后续访问令牌，并以 5136 属性变化到新登录令牌和资源访问的链检测。它支持将直接状态判为 NJT-0083/NJS-0083-002 的持久授权图边，同时把令牌声明保留为 T1134 上下文；该 ATT&CK 子技术未被导入 Niji。
notes_en: The fixed-baseline page defines SID-History as additional SID state on a directory account whose values enter later access tokens and detects a chain from 5136 attribute change through new-logon token to resource access. It supports treating the direct state as the durable authorization-graph edge owned by NJT-0083 and NJS-0083-002 while retaining token claims as T1134 context; the ATT&CK child is not imported into Niji.
