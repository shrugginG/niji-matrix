notes_zh: Microsoft 直接定义服务对象的变更、查询、DACL 与启动权限，并说明无 SERVICE_QUERY_STATUS 的对象会被 EnumServicesStatusEx 静默省略；它同时给出低可信主体持有 SERVICE_CHANGE_CONFIG 等权限可能借 LocalSystem 运行应用的安全边界。该文档支持 Windows 具体语义，不自动证明任一事件已发生提权。
notes_en: Microsoft directly defines service-object change, query, DACL, and start rights and states that EnumServicesStatusEx silently omits an object when the caller lacks SERVICE_QUERY_STATUS. It also identifies the security boundary where untrusted possession of rights such as SERVICE_CHANGE_CONFIG can allow applications to run as LocalSystem. The documentation supports Windows semantics but does not automatically prove elevation in any event.
