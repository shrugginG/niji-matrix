notes_zh: Microsoft 直接说明 LocalSystem 服务的运行时安全上下文和广泛权限，为 service manager 执行侧的权限集合提供依据。该账户标签只描述 post-state；是否相对 writer/pre-state 提升以及是否完成新获准操作仍需事件遥测。
notes_en: Microsoft directly describes the runtime security context and extensive authority of a LocalSystem service, supporting the execution-side authorization set. The account label describes only post-state; event telemetry must still show gain relative to writer or pre-state and a newly authorized operation.
