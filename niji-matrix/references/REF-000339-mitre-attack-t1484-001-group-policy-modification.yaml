notes_zh: 该页证明 GPO 作为 T1484 实现可改变域访问控制并驱动下游行为；它不把 GPO、文件路径、用户权限或 Windows 平台变成 Niji 子项，也不证明每次恶意 GPO 修改产生权限增量。
notes_en: The page establishes GPO as a T1484 implementation able to change domain access control and drive downstream behavior. It does not make GPO, file path, user right, or Windows platform a Niji child or prove that every malicious GPO mutation produces an authority gain.
