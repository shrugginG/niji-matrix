notes_zh: 该观察案例直接支持攻击者借集中可信机制一次写入、多端消费的 parent 行为和跨边界痕迹；防守方阻断了 GPO 路径，目标主要是防御削弱与勒索分发，因此它不证明权限提升、成功消费或用后回退。
notes_en: This observed case directly supports parent behavior in which an adversary uses one central write and many consumers through a trusted mechanism, with cross-boundary traces. Defenders blocked the GPO path and the primary objectives were defense impairment and ransomware distribution, so it does not prove elevation, successful consumption, or post-use reversion.
