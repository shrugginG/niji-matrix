notes_zh: Docker 明确说明 namespace 隔离容器与宿主、rootful daemon 具有 root 权限、控制 daemon 可创建把宿主根目录映射进容器且无限制修改的实例，并警告容器可访问未保护 API 会导致权限提升。该文档建立系统语义，不证明任一事件恶意或成功。
notes_en: Docker states that namespaces isolate containers from the host, a rootful daemon has root authority, daemon control can create a container mapping the host root with unrestricted modification, and an unprotected API reachable from containers can lead to privilege escalation. It establishes system semantics but does not prove malicious intent or success in any event.
