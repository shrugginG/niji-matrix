notes_zh: 文档界定 privileged、capability、seccomp/AppArmor/SELinux 与 user namespace 等前提和控制。它支持解释为何容器内 UID 0 不等于宿主 root，以及为何高能力配置扩大越界面，但这些字段本身不是成功结果或独立匿迹轴。
notes_en: The documentation defines privileged mode, capabilities, seccomp or AppArmor or SELinux, user namespaces, and their controls. It supports why container UID 0 is not equivalent to host root and why high-capability configurations expand the crossing surface, but those fields are neither successful outcomes nor independent evasion axes by themselves.
