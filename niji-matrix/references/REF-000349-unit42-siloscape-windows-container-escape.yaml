notes_zh: 调查直接观察并逆向 Siloscape，以全局符号链接把容器盘符映射到宿主 C 盘，再访问宿主文件、节点凭据和命令执行路径；它强力支持资源别名轴及成功越界，但单个 Windows 案例不能证明所有 mount/device/VM 变体或每个事件的权限集合。
notes_en: The investigation directly observed and reversed Siloscape mapping a container drive to host C through a global symbolic link and then using host files, node credentials, and execution paths. It strongly supports the resource-alias axis and successful crossing, but one Windows case cannot establish every mount, device, or VM variant or every event's authority set.
