notes_zh: 该调查把 TeamTNT 实战镜像与 host mount、chroot、Docker TCP/UNIX socket 和 privileged child-container 路径连接，支持 alias 与 Broker 两种拓扑。报告对部分路径使用“attempts/if successful”措辞，故案例分开记录已观察 host mount 结果与 socket 工具能力，不把所有分支都视为成功。
notes_en: The investigation links TeamTNT images used in attacks to host mounts, chroot, Docker TCP or UNIX sockets, and privileged child-container paths, supporting both alias and broker topologies. Some paths are described as attempts or conditional on success, so the case separates observed host-mount outcomes from socket-tool capability rather than treating every branch as successful.
