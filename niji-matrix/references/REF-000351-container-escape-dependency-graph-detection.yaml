notes_zh: 该实验研究指出 Linux Audit 路径记录不能直接说明事件在宿主还是容器，也不能直接标明 container，因而用 cgroup/container label、container root、path 与 inode 匹配恢复资源归属；六类复现实验支持跨边界依赖图检测。实验环境与假设限制了跨平台外推。
notes_en: This experimental study notes that Linux Audit path records do not directly say whether an event occurred on the host or in a container and do not directly identify the container, so it combines cgroup or container labels, container root, path, and inode to recover resource ownership. Six reproduced techniques support cross-boundary dependency-graph detection, with experimental assumptions limiting cross-platform generalization.
