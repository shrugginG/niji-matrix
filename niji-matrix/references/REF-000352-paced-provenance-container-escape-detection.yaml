notes_zh: PACED 以 whole-system provenance 捕获容器与宿主 namespace 间的信息流，并复现 runtime API、cgroup release_agent、host file 和 host command 结果，直接支持必须连接原容器动作、宿主执行上下文与结果。它是受控实验，不证明真实攻击者的匿迹意图或生产误报率。
notes_en: PACED uses whole-system provenance to capture information flow between container and host namespaces and reproduces runtime-API, cgroup release-agent, host-file, and host-command outcomes, directly supporting the need to join originating container action, host execution context, and result. It is a controlled experiment and does not prove real-adversary concealment intent or production false-positive rates.
