notes_zh: Microsoft 说明 permanent subscription 跨系统重启存在，filter、consumer 与 binding 保存同一 CreatorSID；高风险 ActiveScript/CommandLine consumer 需要管理员创建，永久订阅在无人登录时以 LocalSystem 运行，并可按 MaintainSecurityContext/hosting model 影响身份。它支持 writer、订阅对象、consumer context 与委托策略字段，但不证明任一具体恶意事件已获得正权限差。
notes_en: Microsoft states that permanent subscriptions survive operating-system restart and that filter, consumer, and binding retain the same CreatorSID. High-risk ActiveScript or CommandLine consumers require administrative creation, permanent subscriptions operate under LocalSystem when no user is logged on, and MaintainSecurityContext or hosting model can affect identity. It supports writer, subscription-object, consumer-context, and delegation-policy fields but does not prove a positive authority difference in any particular malicious event.

