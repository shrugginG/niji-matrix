notes_zh: Microsoft 将 ActiveScriptEventConsumer 定义为事件到达时执行预定义脚本，将 CommandLineEventConsumer 定义为在 local system context 启动任意进程。该来源直接证明某些持久 WMI action 的 effective consumer context 可高于注册者当前进程，但具体 TA0004 仍需比较 pre-state 与资源结果。
notes_en: Microsoft defines ActiveScriptEventConsumer as executing a predefined script when an event is delivered and CommandLineEventConsumer as launching an arbitrary process in the local-system context. This directly establishes that some durable WMI actions can have an effective consumer context above the registrant's contemporary process, while a concrete TA0004 conclusion still requires pre-state and resource-outcome comparison.

