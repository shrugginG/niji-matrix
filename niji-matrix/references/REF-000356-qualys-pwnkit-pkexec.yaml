notes_zh: 原始发现团队直接展示低权限调用者以 argc=0 触发 pkexec 的 argv/envp 边界错误、重新引入原本被移除的环境变量并取得 root。它支持 exact input—vulnerable privileged consumer—authority result 与普通授权事务缺失，但属于研究 exploit，不证明现场攻击者匿迹意图或通用检测率。
notes_en: The original discovery team directly shows a low-authority caller using argc zero to trigger pkexec argv and envp boundary confusion, reintroduce an environment variable normally stripped from SUID execution, and obtain root. It supports exact input to vulnerable privileged consumer to authority result and absence of an ordinary authorization transaction, but it is a research exploit and does not establish field-adversary stealth intent or universal detection rates.
