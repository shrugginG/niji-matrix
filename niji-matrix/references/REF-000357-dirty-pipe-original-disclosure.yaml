notes_zh: 原始发现者证明非特权进程能通过 pipe/splice 与 page-cache 状态错误改写本来只读的文件，并可向 root 进程注入代码。它支持 kernel vulnerable transition、受保护对象变化与权限结果之间的因果，也显示普通 file-open/write permission telemetry 不能单独恢复真实变更；它不证明在野使用或独立子技术的匿迹意图。
notes_en: The original discoverer proves that an unprivileged process can use pipe and splice state errors to overwrite an otherwise read-only file and inject code into root processes. It supports causality among a vulnerable kernel transition, protected-object change, and privileged effect and shows that ordinary file-open or write-permission telemetry alone cannot recover the real mutation. It does not establish in-the-wild use or concealment intent for a separate child.
