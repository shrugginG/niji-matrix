notes_zh: CrowdStrike 直接观察并阻止 Scattered Spider 借 Intel 签名诊断驱动漏洞映射恶意 kernel driver、改写传感器例程的尝试，并明确把意图判为关闭安全产品可见性。该来源强支持攻击者选择预受信脆弱组件、来源借用和不同防御对象；事件被阻断，所以不能把该案例记为已实现权限结果。
notes_en: CrowdStrike directly observed and prevented Scattered Spider using a vulnerability in a signed Intel diagnostic driver to map a malicious kernel driver and attempt to overwrite sensor routines, explicitly attributing the objective to disabling security-product visibility. The source strongly supports adversary selection of a pretrusted vulnerable component, borrowed provenance, and a distinct defense object. Because prevention succeeded, the case cannot be recorded as a completed authority result.
