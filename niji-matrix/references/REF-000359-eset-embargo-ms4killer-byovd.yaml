notes_zh: ESET 直接分析多个在野事件和样本。MS4Killer 分支连接 encrypted embedded vulnerable driver、落盘改名、service/registry、FilterLoad、driver interface 与安全进程终止；MDeployer 分支连接 Safe Mode、WinDefend 项删除、irnagentd 注册、受限启动消费、安全目录改名和勒索载荷结果。来源明确只有部分变体/事件使用 Safe Mode，签名存在也不等于事件时策略必然允许。
notes_en: ESET directly analyzed multiple in-the-wild incidents and samples. The MS4Killer branch joins an encrypted embedded vulnerable driver, renamed drops, service or Registry creation, FilterLoad, driver interface, and security-process termination. The MDeployer branch joins Safe Mode, deletion of the WinDefend entry, irnagentd enrollment, restricted-boot consumption, security-directory renaming, and ransomware outcome. The source states that only some variants or incidents used Safe Mode, and signature presence does not prove event-time policy admission.
