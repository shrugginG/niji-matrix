notes_zh: 官方文档说明 write prevention 与 load blocking 并不等价、blocklist 需版本化且不保证覆盖所有脆弱驱动，并要求审计模式兼容性验证和对已加载驱动重启。它直接支持 MIT 的 target-specific 限制以及 DET/NJA 的 policy-version/admission-result 字段，不提供 exploit 成功结论。
notes_en: The official guidance states that write prevention and load blocking are not equivalent, the blocklist must be versioned and is not guaranteed to cover every vulnerable driver, audit-mode compatibility validation is required, and already loaded drivers require reboot. It directly supports target-specific mitigation limitations and policy-version or admission-result fields in DET and NJA but does not establish exploit success.
