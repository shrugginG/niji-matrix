notes_zh: 固定 Enterprise ATT&CK 19.1 父页锚定 T1055 的父级行为、TA0004 映射、三个平台和十二项实现清单。它明确指出代码在另一 live process 地址空间执行可借用合法进程并可能取得更高权限；本来源不单独证明四个 Niji-native 轴、具体事件权限差、检测效果或缓解有效性。
notes_en: The fixed Enterprise ATT&CK 19.1 parent page anchors T1055 parent behavior, TA0004 mapping, three platforms, and the twelve-implementation inventory. It states that code executing in another live process address space can borrow a legitimate process and possibly obtain higher authority. This source does not alone establish the four Niji-native axes, an event-specific authority difference, detection performance, or mitigation effectiveness.
