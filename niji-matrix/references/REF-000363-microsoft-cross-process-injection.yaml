notes_zh: Microsoft 将跨进程注入拆为把代码置入远程可执行页和控制线程/执行上下文两步，说明 CreateRemoteThread、SetThreadContext 与 QueueUserAPC 等不同 dispatch 会留下不同信号，并直接描述合法落盘映像仍指向正常文件而恶意代码藏在进程内的观察差。来源支持父级 source-target 链、无背衬和既有执行流轴；API 也有调试、诊断、安全等合法用途，不能单点定性。
notes_en: Microsoft divides cross-process injection into placing code in a remote executable page and controlling thread or execution context, explains the different signals from CreateRemoteThread, SetThreadContext, and QueueUserAPC, and directly describes the observation gap where loaded images still point to legitimate files while malicious code is concealed in-process. It supports the parent source-target chain plus unbacked-memory and existing-flow axes. The APIs also have legitimate debugging, diagnostic, and security uses and cannot classify an event alone.
