notes_zh: Microsoft 从内核 process creation 语义解释 hollowing 与 doppelganging/herpaderping/ghosting 类规避如何让 image section、文件状态和安全回调观察错位，并给出基于创建属性的泛化检测。它还明确说明成熟攻击者会选择本来就执行目标行为的 host（如 browser 网络通信）。来源支持创建期来源轴和角色选择概念，但其 transient-file 类不自动等于每个 ATT&CK T1055 事件。
notes_en: Microsoft explains from kernel process-creation semantics how hollowing and doppelganging, herpaderping, or ghosting variants misalign image sections, file state, and security-callback observation and presents generalized detection through creation properties. It also explicitly notes that sophisticated adversaries choose a host that normally performs the intended action, such as browser networking. The source supports birth-time provenance and role selection but its transient-file class does not automatically classify every ATT&CK T1055 event.
