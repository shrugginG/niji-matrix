notes_zh: Mandiant 直接分析现场 Ursnif 样本，证明攻击者写入 crafted TLS callback、unmap 后 ResumeThread，使 injected child 在 PE 名义入口前先执行恶意 callback；报告明确指出不了解该偏移的 debugger、unpacker 或 detection framework 可能丢失真实入口。它强支持既有生命周期 callback 调度轴，但没有 source/target 权限快照，不能证明该事件完成 TA0004 权限提升。
notes_en: Mandiant directly analyzed a field Ursnif sample and proves that a crafted TLS callback followed by unmap and ResumeThread makes an injected child execute the malicious callback before the nominal PE entry point. The report explicitly states that debuggers, unpackers, or detection frameworks unaware of the deviation can lose the true entry. It strongly supports existing-lifecycle callback dispatch but provides no source and target authority snapshots and cannot establish TA0004 elevation for the incident.
