notes_zh: Microsoft 将 ProcessAccess、CreateRemoteThread 与 ProcessTampering 定义为不同事件；Event 25 明确覆盖 hollowing/herpaderping，Event 10 噪声较高需目标化过滤，Event 8 是低量高信号经典注入事件。它支持检测字段和分支差异，不代表 Sysmon 覆盖所有 callback、内存 backing、Linux 或 macOS 注入，也不提供准确率保证。
notes_en: Microsoft defines ProcessAccess, CreateRemoteThread, and ProcessTampering as separate events. Event 25 explicitly covers hollowing and herpaderping, Event 10 is noisy and needs targeted filtering, and Event 8 is a low-volume high-signal classic injection event. It supports detection fields and branch differences but does not imply Sysmon covers every callback, memory-backing, Linux, or macOS path or guarantees accuracy.
