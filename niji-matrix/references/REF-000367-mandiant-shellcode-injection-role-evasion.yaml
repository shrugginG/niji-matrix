notes_zh: Mandiant Red Team 明确把注入技术作为可切换控制变量，并解释把 Mimikatz shellcode 注入经常访问 LSASS 的 svchost 可使行为检测看到预期主体/动作组合；同时给出远程进程内存保护、进程树和 API 反制信号。来源直接支持无背衬 payload、dispatch 选择和角色贴合的可控性与观察影响，但属于授权评估方法，不是未授权在野案例，也不证明 TA0004 正权限差。
notes_en: Mandiant Red Team explicitly exposes injection technique as a selectable control variable and explains that placing Mimikatz shellcode in svchost, which commonly accesses LSASS, can make behavioral detection see an expected subject and action combination. It also provides remote-process memory-protection, process-tree, and API counter-signals. The source directly supports controllability and observation effects for unbacked payload, dispatch choice, and role conformity but is an authorized assessment method rather than an unauthorized field incident and does not establish a TA0004 authority difference.
