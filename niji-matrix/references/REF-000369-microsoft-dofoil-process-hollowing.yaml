notes_zh: Microsoft 在大规模 Dofoil 活动中直接观察 trojan 新建合法 explorer.exe 实例后用恶意代码替换其内容，再由 hollowed explorer 产生后继下载/挖矿链；报告也展示错误位置、命令行与网络行为可反证外观。它支持创建期 image identity 与执行内容分离和字段检测，但不提供 source-target 权限差，不能证明 hollowing 自动提权。
notes_en: Microsoft directly observed in the large Dofoil campaign a trojan create a new legitimate explorer.exe instance and replace its contents with malicious code, after which the hollowed explorer produced follow-on download and mining behavior. The report also shows that wrong location, command line, and network behavior can contradict the appearance. It supports divergence between birth-time image identity and executed content plus field detection, but provides no source-target authority difference and does not show hollowing automatically elevates privileges.
