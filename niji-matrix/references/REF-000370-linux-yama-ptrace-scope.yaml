notes_zh: Linux Kernel 文档明确把宽松同 UID ptrace 视为可导致任意代码注入、SSH session hijack 与 credential scope 扩张的风险，并定义父子关系、PR_SET_PTRACER、CAP_SYS_PTRACE 和禁止 attach 的控制级别。它支持 Linux 访问前提、合法 debugger/crash-handler 反例和缓解，不证明具体恶意 payload、四个 Niji 子轴或任何事件的 TA0004 结果。
notes_en: Linux Kernel documentation explicitly treats permissive same-UID ptrace as a risk enabling arbitrary code injection, SSH-session hijacking, and expansion through credentials and defines parent-child relationships, PR_SET_PTRACER, CAP_SYS_PTRACE, and no-attach control modes. It supports Linux access prerequisites, legitimate debugger or crash-handler counterexamples, and mitigation, not a particular malicious payload, the four Niji child axes, or a TA0004 result in any event.
