notes_zh: Apple 说明 Hardened Runtime 与 SIP 可阻止部分 code injection、library hijacking 和 process-memory tampering，并把 unsigned executable memory、JIT、library validation 等兼容需求建模为显式 entitlement 例外。它支持 macOS 防御对象和例外边界，不证明某次攻击、检测覆盖率或 Windows 注入轴可无条件外推。
notes_en: Apple states that Hardened Runtime with SIP prevents classes of code injection, library hijacking, and process-memory tampering and models unsigned executable memory, JIT, and library-validation compatibility needs as explicit entitlement exceptions. It supports the macOS defense object and exception boundary, not an incident, detection coverage, or unconditional transfer of Windows injection axes.
