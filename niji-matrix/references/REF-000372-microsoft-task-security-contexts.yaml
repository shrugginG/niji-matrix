notes_zh: Microsoft 明确任务按指定 user/group security context 运行，RunLevel 决定动作权限，并规定低权限进程不能登记 TASK_RUNLEVEL_HIGHEST、Builtin Administrator、Local System 或 group context；这既支持 submitter/runtime authority 分离，也证明高权限结果不能从任务字段自动推断，必须验证实际准入和 caller 权限。
notes_en: Microsoft states that tasks run under a specified user or group security context, RunLevel determines action privilege, and a low-privilege process cannot register TASK_RUNLEVEL_HIGHEST, Builtin Administrator, Local System, or group context. This supports submitter-to-runtime authority separation while showing that a privileged result cannot be inferred from task fields without actual admission and caller-authority evidence.
