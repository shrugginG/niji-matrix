notes_zh: Cronie 手册说明用户 crontab 中命令以表所有者运行，system crontab/cron.d 还包含 execution username，且 crontab 默认不得被 owner 之外主体写入；这些语义支持 definition owner、runtime identity 与权限边界的验证，而不是把 cron daemon 或 root 字符串视为自动提权。
notes_en: The Cronie manual states that commands in a user crontab execute as the table owner, system crontab or cron.d entries include an execution username, and crontabs are normally not writable by principals other than the owner. These semantics support validation of definition owner, runtime identity, and authority boundaries instead of treating the cron daemon or a root string as automatic elevation.
