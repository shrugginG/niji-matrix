notes_zh: systemd 官方文档定义 system service manager 与 user manager 的默认 credentials，并由 User/Group、DynamicUser、capabilities、namespace 和 sandbox directives 改变 service runtime authority。timer 只负责激活关联 service，因此 TA0004 必须连接 timer、精确 service version、实际 credentials 与资源结果。
notes_en: Official systemd documentation defines default credentials for system and user service managers and how User, Group, DynamicUser, capabilities, namespaces, and sandbox directives alter service runtime authority. A timer only activates the associated service, so TA0004 must join the timer, exact service version, actual credentials, and resource outcome.
