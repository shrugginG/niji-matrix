notes_zh: Kubernetes 官方文档说明 Pod 通过 spec.serviceAccountName 取得 namespaced workload identity 和 RBAC 权限，未指定时使用 default ServiceAccount，且应按最小权限授权并可禁止自动挂载 token。CronJob 的 Job template 最终创建 Pod，因此 scheduler object、Job/Pod、实际 ServiceAccount 与资源授权必须连续验证。
notes_en: Kubernetes documentation states that Pods receive a namespaced workload identity and RBAC permissions through spec.serviceAccountName, use the default ServiceAccount when none is specified, should receive least privilege, and can disable automatic token mounting. A CronJob's Job template ultimately creates Pods, so the scheduler object, Job or Pod, actual ServiceAccount, and resource authorization must be validated continuously.
