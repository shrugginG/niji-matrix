notes_zh: Microsoft 说明 Entra 为租户应用和资源记录登录，日志可回答 who identity、how client 与 what target resource，覆盖交互、非交互、服务主体和托管身份，且系统生成记录不可修改或删除。这些字段支持把被接受身份连接到目标资源，但没有 pre-state 授权快照时不能单独证明提权。
notes_en: Microsoft states that Entra records sign-ins to tenant applications and resources and exposes who identity how client and what target resource across interactive noninteractive service-principal and managed-identity logs; system-generated entries cannot be changed or deleted. These fields support accepted-identity to target-resource lineage but do not prove elevation without a pre-state authorization snapshot.
