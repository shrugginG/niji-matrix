notes_zh: 4624 记录登录会话在目标机器上成功创建，并提供 subject、新登录账户、Logon ID、登录类型、进程和网络字段。Logon ID 可与同一会话的敏感权限和对象访问事件关联；成功本身只证明认证会话建立，不证明攻击者控制或正权限差。
notes_en: Event 4624 records successful creation of a logon session on the destination machine and includes subject new-logon account Logon ID logon type process and network fields. Logon ID can correlate sensitive-privilege and object-access events in the same session; success alone proves session establishment rather than adversary control or a positive authority difference.
