notes_zh: 4672 在新登录会话获得指定敏感权限时产生，记录账户 SID、账户域、Logon ID 和权限列表；Logon ID 可连接 4624。SYSTEM 等预期主体会大量产生该事件，因此 4672 只证明会话被赋予权限，仍需攻击者连续性、前态比较和实际资源结果。
notes_en: Event 4672 is generated when a new logon session receives listed sensitive privileges and records account SID domain Logon ID and the privilege list; Logon ID can join event 4624. Expected principals such as SYSTEM generate many events so 4672 establishes assigned privileges only and still requires adversary continuity pre-state comparison and an actual resource result.
