notes_zh: 4663 记录主体对文件、注册表等受审计对象实际使用的访问权，包括 Security ID、Logon ID、对象名、进程、Access Mask 与 Accesses。它可为同一 4624/4672 会话提供受保护资源结果，但只覆盖已配置 SACL 的对象且事件语义仍需按权限和结果校准。
notes_en: Event 4663 records rights actually used by a subject against an audited object such as a file or registry key including Security ID Logon ID object name process Access Mask and Accesses. It can provide a protected-resource result for the same 4624 and 4672 session but covers only objects with configured SACLs and still requires permission and outcome calibration.
