notes_zh: Microsoft 说明传统客户端会在 token 未过期时从缓存重放，CAE 使资源提供方可因账户禁用、密码重置、显式撤销、高风险或位置变化拒绝未过期 token；支持、传播延迟、共享出口与位置策略仍有限制。该资料支持 session lineage、连续授权与撤销设计，不证明所有服务即时失效。
notes_en: Microsoft explains that clients traditionally replay cached tokens until expiry and that CAE lets resource providers reject unexpired tokens after account disablement password reset explicit revocation high risk or location change; support propagation shared-egress and location-policy limitations remain. It supports session-lineage continuous-authorization and revocation design without claiming immediate invalidation for every service.
