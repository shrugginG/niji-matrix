notes_zh: Microsoft 将 90 天无登录的 stale user、180 天未用的敏感身份和 stale service account 识别为攻击面，指出休眠敏感身份可提供安静深入路径、未绑定具体用户且缺少交互监控的高权服务账户活动可能不被注意，并建议移除权限、禁用/删除、明确 owner、限制登录及定期复核。该指导支持低反馈变量和专门防御；攻击者是否有意选择仍需个案证据。
notes_en: Microsoft identifies users with no logon for 90 days dormant sensitive identities unused for 180 days and stale service accounts as attack surface; it describes dormant sensitive identities as a quiet path deep into an organization and notes that privileged service-account activity without a specific user or interactive monitoring may go unnoticed. It recommends privilege removal disablement or deletion explicit ownership logon restriction and recurring review. This supports the low-feedback variable and specialized defense while case evidence must establish deliberate adversary selection.
