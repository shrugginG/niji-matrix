notes_zh: Microsoft 观察到 Storm-0501 从已控本地环境转向云端：某些案例中已受控 Domain Admin 账户对应一个 MFA 未启用且具有 Global Administrator 角色的 Entra 账户，攻击者可通过已知密码、受控设备会话或提取
  token 取得云端高权访问，并在可用后创建联邦域后门。报告支持混合身份权限路径，但未公开完整事件级 pre-state authorization set 与首个 expected-deny/observed-allow，因此不单独建事件级 TA0004 case。 同一原文还记录
  Storm-0501 查找 KeePass 配置、密钥文件与主密钥线索并启动应用以获取凭据；不把启动动作单独等同明文已返回。
notes_en: Microsoft observed Storm-0501 pivoting from controlled on-premises environments to cloud access. In some cases a compromised Domain
  Admin account had a corresponding Entra account with MFA disabled and a Global Administrator role; the actor could use a known password a controlled-device
  session or extracted tokens to gain cloud administrative access and then create a federated-domain backdoor. The report supports a hybrid identity-authority
  path but does not publish a complete event-level pre-state authorization set and first expected-deny to observed-allow result so it does not
  independently become a TA0004 case. The same source also records Storm-0501 locating KeePass configuration, keyfile, and master-key clues and
  launching the app to gather credentials; launch alone does not establish plaintext return.
