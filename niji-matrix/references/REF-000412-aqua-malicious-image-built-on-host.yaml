notes_zh: 直接记录攻击者滥用暴露的 Docker API，以 Alpine 基础镜像在宿主构建新镜像、构建期下载恶意脚本并部署挖矿容器，以绕过成品恶意镜像和来源情报监控。
notes_en: Directly documents adversary abuse of an exposed Docker API to build a new image on-host from Alpine, retrieve a
  malicious script during the build, and deploy a mining container, bypassing monitoring based on finished malicious images
  and source intelligence.
