notes_zh: >-
  官方 API 文档说明以 \\.\PhysicalDriveX 或 \\.\X: 打开物理磁盘或卷可取得直接访问存储设备的 DASD 句柄，并要求相应管理权限；这为文件句柄与原始设备句柄的观察边界提供平台语义证据。
notes_en: >-
  Official API documentation explains that opening a physical disk or volume through \\.\PhysicalDriveX or \\.\X: can
  yield a DASD handle for direct storage-device access and requires corresponding administrative authority, establishing the
  platform-semantic boundary between file handles and raw-device handles.
