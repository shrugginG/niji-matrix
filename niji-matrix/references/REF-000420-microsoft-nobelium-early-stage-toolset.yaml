notes_zh: >-
  Microsoft 记录 EnvyScout 仅在执行路径前缀为 C: 时写出内嵌 ISO，并按用户代理决定是否向 Windows 客户端投递；BoomBox 还要求当前工作目录存在 NV 目录，否则终止。报告直接展示明文属性读取、比较与后继载荷差异。
notes_en: >-
  Microsoft records EnvyScout writing its embedded ISO only when the execution-path prefix is C: and using user agent to decide
  whether a Windows client receives the payload. BoomBox also requires an NV directory in its current working directory or
  terminates. The report directly exposes plaintext attribute reads, comparisons, and differential successor payloads.
