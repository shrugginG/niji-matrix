notes_zh: 样本分析记录 Gauss 特殊载荷区段以 RC4 加密，密钥由 %PATH% 环境字符串与 %PROGRAMFILES% 目录名组合后进行一万次 MD5 派生；研究者因未知正确环境值而无法恢复区段内容，直接支持环境值进入密钥派生并决定能力可见性的因果。
notes_en: Sample analysis records special Gauss payload sections encrypted with RC4 whose key is derived by applying MD5 ten
  thousand times to a combination of the %PATH% environment string and a directory name under %PROGRAMFILES%. Researchers
  could not recover the sections without the correct environmental values, directly supporting environment-fed key derivation
  as the gate on capability visibility.
