notes_zh: 协调披露研究证明，持有有效 IAM 凭据和所需权限的调用者曾可通过 Service Catalog gamma 端点执行读写操作，而这些请求不进入 CloudTrail；AWS 确认并修复。它直接支持“有效动作—缺失规范审计事件”的漏洞因果，但未证明在野攻击者使用。
notes_en: Coordinated disclosure research proves that a caller with valid IAM credentials and sufficient authority could use
  a Service Catalog gamma endpoint for read and write actions that did not enter CloudTrail, and AWS confirmed and fixed the
  issue. It directly supports vulnerability causality from valid action to missing canonical audit event but does not establish
  adversary use in the wild.
