notes_zh: Sygnia 在事件响应中观察 Velvet Ant 以管理员凭据触发 CVE-2024-20399，从 NX-OS CLI 逃逸到通常不可见的底层 Linux，部署 VELVETSHELL，并在执行后删除伪装 curl 与 ufdm.so。来源直接支持受信接口上下文逃逸和后继证据对象擦除。
notes_en: Sygnia observed during incident response that Velvet Ant used administrator credentials to trigger CVE-2024-20399,
  escape from the NX-OS CLI into the normally inaccessible underlying Linux layer, deploy VELVETSHELL, and delete the masqueraded
  curl copy and ufdm.so after execution. The source directly supports trusted-interface context escape and successor evidence-object
  erasure.
