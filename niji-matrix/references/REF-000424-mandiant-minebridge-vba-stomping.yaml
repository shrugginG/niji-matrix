notes_zh: Mandiant 在面向金融机构的定向钓鱼活动中分析到恶意 Office 文档让良性或空白 VBA 源码与恶意 p-code 不一致，并修改 PROJECT stream 阻止 GUI 正常显示宏；正确 Office 版本仍执行并下载 MINEBRIDGE。该来源直接支持检查表示与运行状态分离。
notes_en: Mandiant analyzed targeted phishing against financial organizations in which malicious Office documents made benign
  or blank VBA source diverge from malicious p-code and modified the PROJECT stream to prevent normal GUI macro display, while
  a compatible Office version still executed and downloaded MINEBRIDGE. The source directly supports inspection-representation
  and runtime-state divergence.
