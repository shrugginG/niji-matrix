accessed: '2026-09-21'
locator: VirtualBox deployment; shared-folder mapping; guest ransomware and host visibility
archive_url: null
credibility: high
notes_zh: Sophos 观察攻击者在宿主安装 VirtualBox 与 Windows XP 虚拟磁盘，把 Ragnar Locker 放入来宾，并把宿主本地、移动和网络驱动器映射给来宾。来宾内 vrun.exe 超出宿主安全软件可见范围，宿主侧文件操作归因给合法 VboxHeadless.exe。
notes_en: Sophos observed attackers install VirtualBox and a Windows XP virtual disk on the host, place Ragnar Locker in the
  guest, and map host local, removable, and network drives into that guest. Guest vrun.exe remained outside host security
  visibility while host-side file operations were attributed to legitimate VboxHeadless.exe.
