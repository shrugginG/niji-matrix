title_zh: Ragnar Locker 在虚拟机中运行勒索载荷以规避宿主安全
title_en: Ragnar Locker Ransomware Deploys Virtual Machine to Dodge Security
source_type: incident-report
authors:
- Mark Loman
publisher: Sophos
published: '2020-05-21'
