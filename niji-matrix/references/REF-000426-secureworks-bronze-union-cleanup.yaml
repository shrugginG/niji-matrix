notes_zh: SecureWorks CTU 在入侵调查中观察 BRONZE UNION 把加密归档暂存到网络共享，外传后通过 web shell 删除归档并断开共享，评估其目的很可能是避免检测。该链直接支持操作关系拆除，并同时保留删除对象的独立证据。
notes_en: SecureWorks CTU observed in intrusions that BRONZE UNION staged encrypted archives over network shares and, after
  exfiltration, used a web shell to delete the archives and detach the shares, likely to avoid detection. The chain directly
  supports operational-relationship teardown while retaining independent evidence of object deletion.
