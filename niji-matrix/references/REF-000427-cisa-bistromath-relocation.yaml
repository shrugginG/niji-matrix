notes_zh: CISA 对 BISTROMATH 的配置解析显示恶意软件具有显式 relocation 选项，可把自身复制到 Windows、Program Files、ProgramData、用户目录、临时目录等多个目标位置。该来源支持内容身份跨位置连续性与新路径消费，但不证明每次配置都实际启用。
notes_en: CISA configuration parsing for BISTROMATH exposes an explicit relocation option that can copy the malware into Windows,
  Program Files, ProgramData, user, temporary, and other destination directories. The source supports content-identity continuity
  across locations and consumption from a new path but does not prove the option was enabled in every configuration.
