notes_zh: Huntress 在三个加拿大组织的入侵中发现计划任务调用 pcalua.exe，再由其启动恶意二进制、批处理和 RPivot Python 脚本。完整任务参数与后继进程直接支持一次调用输入经受信实用程序代理到结果的链。
notes_en: Huntress found across intrusions at three Canadian organizations that scheduled tasks invoked pcalua.exe, which
  then started malicious binaries, batch files, and an RPivot Python script. Complete task arguments and successor processes
  directly support one invocation input being proxied through a trusted utility to an outcome.
