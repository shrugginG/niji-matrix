notes_zh: Elastic 的生产检测文档区分 ProxyCommand 通过 shell 启动本地 helper、LocalCommand 在连接后触发本地动作以及 RemoteCommand 的远端语义，并要求关联配置、进程、会话和网络。它直接支持持久配置或命令选项触发代理的独立防御变量，但不是特定攻击活动归因。
notes_en: Elastic production detection documentation distinguishes ProxyCommand launching a local helper through a shell,
  LocalCommand triggering locally after connection, and RemoteCommand semantics, and requires correlation of configuration,
  process, session, and network. It directly supports the independent defense variable of configuration- or option-triggered
  proxying but is not attribution to a specific intrusion.
