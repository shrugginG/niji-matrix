notes_zh: GTIG 在 UNC6032 活动中观察下载的可执行文件同时使用 .mp4 与 .exe 扩展名，并以十三至三十多个 Braille Pattern Blank 字符把真实 .exe 推出用户视图，同时使用默认 MP4 图标。来源直接连接用户可见媒体类型、原始 PE 类型、执行和后继 STARKVEIL。
notes_en: GTIG observed in UNC6032 activity an executable using both .mp4 and .exe extensions with thirteen to more than thirty
  Braille Pattern Blank characters pushing the real .exe out of user view and a default MP4 icon. The source directly joins
  user-visible media type, raw PE type, execution, and successor STARKVEIL.
