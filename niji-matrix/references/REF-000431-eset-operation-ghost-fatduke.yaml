notes_zh: ESET 在 Operation Ghost 中分析 FatDuke 通过本地 socket 打开默认浏览器并提取真实 User-Agent，失败时按注册表选择对应浏览器字符串，再用于 C2；同一活动还以图像隐写隐藏载荷或命令并使用定制打包与频繁重新混淆。来源分别支持客户端指纹仿真和载体嵌入遮蔽。
notes_en: ESET analyzed FatDuke in Operation Ghost opening the default browser against a local socket to capture its real User-Agent
  and otherwise selecting a browser-matched string from Registry state before using it for C2. The same operation also hid
  payloads or commands through image steganography and used custom packing and repeated re-obfuscation. The source supports
  client-fingerprint emulation and carrier-embedded concealment separately.
