notes_zh: GTIG 与 Mandiant 对 APT41 相关 POISONPLUG.SHADOW 样本逆向，确认 ScatterBrain 通过控制流图重构、指令变异和完整导入保护改变静态特征而保持程序功能，并发布可恢复功能二进制的静态去混淆器。它直接支持静态特征空间畸变及语义恢复。
notes_en: GTIG and Mandiant reverse engineered APT41-associated POISONPLUG.SHADOW samples and established ScatterBrain restructuring
  control-flow graphs, mutating instructions, and fully protecting imports while preserving program function, then released
  a static deobfuscator producing functional binaries. It directly supports static feature-space distortion and semantic recovery.
