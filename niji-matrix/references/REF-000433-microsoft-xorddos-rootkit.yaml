notes_zh: Microsoft 对 XorDdos 样本和内核模块的分析确认，用户态组件通过特定 IOCTL 告知根套件隐藏 PID 与端口，根套件替换系统调用和网络序列显示函数，在返回结果中移除对应进程和连接；真实进程、socket、控制设备与 hook 仍留下差分。
notes_en: Microsoft's sample and kernel-module analysis establishes the user-mode component instructing the rootkit through specific IOCTL commands to hide PIDs and ports. The rootkit replaces system calls and network sequence-display functions and removes corresponding processes and connections from returned results, while real processes, sockets, the control device, and hooks preserve a differential.
