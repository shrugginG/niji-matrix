notes_zh: Mandiant 逆向多个 AVADDON 版本，列出一致的系统、应用和数据目录排除以及不加密扩展名，并说明部分扩展被保留以便受害者恢复系统和使用解密器。来源直接支持主机内关键对象保留过滤。
notes_en: Mandiant reverse engineered multiple AVADDON versions, listed consistent operating-system, application, and data-directory exclusions plus unencrypted extensions, and explained that some extensions were preserved so the victim could recover the system and use the decryptor. The source directly supports in-host critical-object preservation filtering.
