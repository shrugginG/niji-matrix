notes_zh: CERT Polska 在制造业受害组织中分析 LazyWiper，确认脚本在域控制器上运行时通过 safeguard 终止，而在其他域主机上按扩展名破坏文件；同一报告记录攻击者从域控制器经 GPO 分发 wiper。来源直接支持角色条件整机保留与跨主机覆盖差分。
notes_en: CERT Polska analyzed LazyWiper in a manufacturing victim and established that a safeguard terminates the script when it runs on a domain controller while files on other domain hosts are destroyed according to extensions. The same report documents GPO distribution of the wiper from a domain controller. It directly supports role-conditioned host preservation and a cross-host coverage differential.
