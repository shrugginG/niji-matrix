notes_zh: Microsoft 记录 Midnight Blizzard 使用已失陷租户和安全主题域名，在 Teams 中冒充技术支持，诱使用户输入认证代码；成功时攻击者取得令牌并访问 Microsoft 365。来源直接支持关系权威冒充、用户动作和未授权结果链。
notes_en: Microsoft documented Midnight Blizzard using compromised tenants and security-themed domains to impersonate technical support in Teams and induce a user to enter an authentication code. On success the actor obtained a token and accessed Microsoft 365. The source directly supports the chain from relational-authority impersonation through user action to unauthorized outcome.
