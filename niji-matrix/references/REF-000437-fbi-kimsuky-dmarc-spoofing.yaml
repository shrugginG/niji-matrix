notes_zh: FBI、美国国务院与 NSA 的联合公告确认 Kimsuky 利用错误配置或弱 DMARC 策略，让伪造邮件呈现为来自合法域的邮件交换，并冒充记者、学者或专家开展情报收集。公告把传输来源伪造与 SPF/DKIM/DMARC 验证和用户关系判断区分开。
notes_en: The joint FBI, State Department, and NSA advisory establishes Kimsuky exploiting misconfigured or weak DMARC policy so spoofed messages appear to come from a legitimate domain's mail exchange while posing as journalists, academics, or experts for intelligence collection. It distinguishes transport-provenance forgery from SPF, DKIM, and DMARC validation and from user relationship judgment.
