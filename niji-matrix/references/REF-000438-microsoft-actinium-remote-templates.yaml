notes_zh: Microsoft 记录 ACTINIUM 在鱼叉式钓鱼附件中使用远程模板，使静态文档不保存恶意宏，只有用户打开时才从攻击者域取得；攻击者还能控制何时向自动化分析系统提供或拒绝远程内容。来源直接支持远程模板内容替换与原文档—响应—执行谱系。
notes_en: Microsoft documented ACTINIUM using remote templates in spearphishing attachments so malicious macros were absent from the static document and retrieved from an adversary domain only when a user opened it. The adversary could also control when remote content was supplied to or withheld from automated analysis. The source directly supports remote-template content substitution and original-document-to-response-to-execution lineage.
