notes_zh: Unit 42 确认 DarkHydrus 向中东教育机构投递带 attachedTemplate 的 Word 文档，Office 解析攻击者 URL 时显示认证对话框，用户输入的凭据被发送至 C2；研究人员以 Phishery 复现实验确认引用—认证—泄露链。来源直接支持引用诱发认证边界。
notes_en: Unit 42 established DarkHydrus delivering a Word document with attachedTemplate to a Middle Eastern educational institution. Office displayed an authentication dialog while resolving the adversary URL and sent entered credentials to C2. Researchers reproduced the reference-to-authentication-to-disclosure chain with Phishery, directly supporting the reference-induced authentication boundary.
