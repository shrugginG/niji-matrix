notes_zh: Mandiant 在多个国家确认 SYNful Knock Cisco IOS 植入，基础植入位于改写映像并跨重启存续，而运行时加载的附加模块会丢失。基础植入监视指向常用端口的特殊 TCP SYN、序列/确认号差分和后续命令包，再暴露模块化 C2；普通服务扫描与合法密码流程看不到该隐藏功能。来源直接支持内容/字段型数据包激活和跨中断持久入口，同时限制结论只适用于基础 matcher 与入口。
notes_en: Mandiant confirmed SYNful Knock Cisco IOS implants across several countries with the base implant residing in a modified image and surviving reboot while additional runtime-loaded modules were lost. The base implant watched for a specially crafted TCP SYN to a common port a sequence-to-acknowledgment differential and a successor command packet before exposing modular C2. Ordinary scanning and legitimate password flows did not reveal the hidden function. The source directly supports content-pattern activation and a post-interruption persistent entry while limiting the conclusion to the base matcher and entry point.
