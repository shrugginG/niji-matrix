notes_zh: ESET 分析 FishMonger 的 SprySOCKS Windows 变体，确认 RawWNPF 驱动注册 WFP 过滤器并检查 TCP 包中特制数据，命中后把到任意开放端口的流量转发到被隐藏的随机后门端口；不同协议还使用固定魔数。来源直接支持单包内容匹配与隐藏端口重定向。
notes_en: ESET analyzed FishMonger's SprySOCKS Windows variant and established the RawWNPF driver registering WFP filters, inspecting crafted data in TCP packets, and diverting traffic sent to any open port toward a hidden random backdoor port on a match. Different protocols also use fixed magic values. The source directly supports single-packet content matching and hidden-port redirection.
