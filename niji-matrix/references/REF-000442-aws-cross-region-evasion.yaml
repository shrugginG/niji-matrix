notes_zh: AWS 事件响应指南通过跨区域 Bedrock 滥用调查说明，攻击者从常用区域转向次区域可利用区域特定监控与访问控制不一致；文档分别要求观察区域变化、比较两地控制覆盖，并对包括未使用区域在内的全部区域实施一致检测。来源支持使用基线位移与控制覆盖不对称两个变量。
notes_en: The AWS incident-response guide uses a cross-Region Bedrock misuse investigation to show an adversary moving from a common Region to a secondary Region and exploiting inconsistent Region-specific monitoring and access controls. It separately requires watching Region changes, comparing controls across Regions, and maintaining consistent detection in every Region including unused ones. The source supports distinct usage-baseline displacement and control-coverage asymmetry variables.
