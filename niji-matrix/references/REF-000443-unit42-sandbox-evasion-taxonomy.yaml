notes_zh: Unit 42 基于 WildFire 沙箱运营经验分别描述虚拟机工件检查、人类交互充分性检查以及睡眠/时钟与计算资源规避，并给出不同实验对策：硬件仿真、键鼠与文档交互、时间加速和 hypervisor 计数。这一来源直接支持三项不可互换的分析环境变量。
notes_en: Unit 42, drawing on WildFire sandbox operations, separately describes virtual-machine artifact checks, sufficiency of human interaction, and sleep, clock, or computing-resource evasion, with different experimental countermeasures for hardware emulation, keyboard and mouse or document interaction, time acceleration, and hypervisor counting. It directly supports three non-interchangeable analysis-environment variables.
