notes_zh: 研究者对样本进行解混淆与动态分析，直接列出 Defender 排除范围修改、Raccine 进程和更新任务移除及安全功能停用。它同时支持完整能力可用性抑制和工具仍运行时的选择性防护范围收缩，但不代表所有 BlackByte 版本或受害环境。
notes_en: Researchers de-obfuscated and dynamically analyzed the sample and directly enumerate Defender exclusion changes, removal of Raccine processes and update task, and security-feature disablement. It supports both whole-capability availability suppression and selective scope contraction while a tool remains present, but it does not represent every BlackByte version or victim environment.
