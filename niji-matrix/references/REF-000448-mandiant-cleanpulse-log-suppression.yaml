notes_zh: Mandiant 事件响应与逆向工程发现 CLEANPULSE 把两个字符串写入目标进程并条件化跳过日志函数，使特定事件可能在生成阶段即不出现；报告另将 THINBLOOD 事后清日志区分开。来源不披露所有受害者的完整事件基线，因此选择性缺口仍需现场独立活动作对照。
notes_en: Mandiant incident response and reverse engineering found CLEANPULSE writing two strings into a target process and conditionally skipping a logging function so selected events may never be generated; the report separately distinguishes THINBLOOD post-hoc log clearing. It does not disclose complete event baselines for every victim, so selective gaps still require comparison with independent local activity.
