notes_zh: Mandiant 直接分析 PHASEJAM，证明攻击者把管理员可见的升级进度与真实升级结果分离，并同步阻断恢复路径。该案例强支持健康/成功状态反馈伪造；它不能证明所有工具界面都具有相同可篡改路径。
notes_en: Mandiant directly analyzed PHASEJAM and establishes separation of administrator-visible upgrade progress from the real upgrade outcome while the recovery path is blocked. The case strongly supports health or success-state feedback forgery but does not establish an equivalent tampering path for every tool interface.
