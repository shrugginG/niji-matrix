notes_zh: 官方文档说明篡改保护可阻止或记录安全设置、排除项、服务、进程和代理文件变化，并要求通过集中管理和设备健康报告检查状态。该来源支持控制措施和数据字段，不证明某一攻击事件，也不能外推为所有产品、平台或内核失陷场景的普遍阻断。
notes_en: Official documentation explains that tamper protection can block or record changes to security settings, exclusions, services, processes, and agent files and can be reviewed through centralized management and device-health reports. It supports control measures and data fields, not a particular attack, and cannot be generalized to every product, platform, or kernel-compromise scenario.
