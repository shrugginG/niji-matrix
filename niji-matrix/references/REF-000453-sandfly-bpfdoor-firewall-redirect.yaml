notes_zh: 原始技术分析同时给出 BPFDoor 在进入 shell 前把 HISTFILE 与 MYSQL_HISTFILE 指向 /dev/null，以及攻击者来源限定的防火墙重定向。两项行为分别支持命令历史整体抑制和端口/接收者错位；演示中禁用
  RC4 只用于说明行为，不能当作实战协议特征。 本来源还直接支持魔术包匹配后的 bind shell、反向 shell 与来源限定重定向；演示关闭 RC4，不能把明文响应当作实战签名。 本来源还直接支持魔术包匹配后的 bind shell、反向
  shell 与来源限定重定向；演示关闭 RC4，不能把明文响应当作实战签名。
notes_en: The original technical analysis shows both BPFDoor pointing HISTFILE and MYSQL_HISTFILE to /dev/null before
  entering its shell and attacker-source-limited firewall redirection. These behaviors support whole-session command-history
  suppression and port or receiver mismatch respectively. RC4 was disabled only for the demonstration, so plaintext response
  is not an operational protocol characteristic. The source also directly supports bind shell, reverse shell, and source-scoped
