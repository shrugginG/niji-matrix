notes_zh: 官方 API 文档说明成员账户可主动离开组织，管理账户保留离开事件且 SCP 可以阻止调用；它证明层级变化与可观测线索，不证明某次调用恶意或已经使所有防御失效。
notes_en: The official API reference says a member account can leave the organization, the management account retains a departure event, and SCPs can block the call. It establishes hierarchy change and observable clues, not malice or universal loss of defenses in a particular event.
