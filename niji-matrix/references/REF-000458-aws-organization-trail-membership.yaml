notes_zh: 官方文档明确组织成员移出后组织 trail 与服务关联角色从该账户移除，历史日志仍留在原存储，但新事件不再由原组织 trail 覆盖。它支持既有资源治理迁离的观察差，不能推断所有其他日志也同时消失。
notes_en: Official documentation states that organization trail and service-linked role are removed from an account after departure while prior logs remain in the original store and new events are no longer covered by that trail. It supports an observation difference for existing-resource departure but does not imply every other log disappears too.
