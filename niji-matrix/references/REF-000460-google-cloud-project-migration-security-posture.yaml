notes_zh: 官方文档证明相同 project ID 与运行资源在迁移时保持，而新父节点立即改变继承 IAM 和组织策略；它说明防御差异的机制，但是否降低覆盖取决于来源与目的组织配置，不能一概推断。
notes_en: Official documentation establishes that the same project ID and running resources persist through migration while the new parent immediately changes inherited IAM and organization policy. This establishes mechanism, but whether coverage decreases depends on source and destination configuration and cannot be assumed.
