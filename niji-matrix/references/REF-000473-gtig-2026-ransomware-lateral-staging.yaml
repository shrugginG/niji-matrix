notes_zh: 一手事件汇总直接记录 SAFEPAY 经 SMB 在多主机暂存 NETSCAN，以及 LOCKBIT.WARLOCK 在域控制器暂存 NetExec 并向多主机复制批处理文件；未说明为隐藏来源而选择该路径。 同一一手汇总另记录 UNC2165 恢复浏览器加密主钥匙，以及独立
  UNC2465 入侵导出 Bitwarden 数据库；不能把两案拼接为同一解锁链。
notes_en: First-hand incident review records SAFEPAY staging NETSCAN on multiple hosts over SMB and LOCKBIT.WARLOCK staging NetExec on a domain
  controller before copying a batch file to many hosts. It does not state that the route was selected to hide provenance. The same first-party
  review also records UNC2165 recovering browser encryption material and a separate UNC2465 intrusion exporting a Bitwarden database; the incidents
  cannot be combined into one unlock chain.
