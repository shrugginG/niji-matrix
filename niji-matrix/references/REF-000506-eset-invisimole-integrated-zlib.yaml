notes_zh: 同时支持内置压缩路径及摄像头照片与屏幕截图的来源区别；不证明摄像头指示被隐藏。 该条支持逆向确认的一般注册表枚举能力，不能把同一命令中的创建、删除和设值当成读取，也不证明具体现场采用。
notes_en: Supports integrated compression and the source distinction between webcam photos and screen captures; does not show
  camera-indicator suppression. The entry supports reverse-engineered general Registry enumeration; create, delete, and set
  branches are not reads and do not establish specific field adoption.
