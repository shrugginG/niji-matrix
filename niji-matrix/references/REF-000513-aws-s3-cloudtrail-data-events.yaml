notes_en: The source still supports GetObject/PutObject data events and enablement conditions. Its current table lists ListObjects
  for ordinary S3 object resources and ListObjectsV2 under Express, Access Point, Outposts, and other specified resource types.
  Omission from one row does not prove V2 is never logged for ordinary buckets; validate selectors and a controlled request
  in the target environment.
