locator: 'Original KREMLIN extension sample and lab validation: browser shutdown or idle gating; extension-directory writes;
  Secure Preferences registration; HMAC and App-Bound hash regeneration; later browser load; page source request-body interception
  HTML injection configuration and browser-to-controller traffic; 2026-09-14 source after fixed ATT&CK baseline'
archive_url: null
credibility: high
notes_zh: 样本与实验同时证明攻击者直接写入扩展目录和 Secure Preferences、重建完整性字段并由后续 Chrome 启动加载扩展，也证明页面源码和请求内容上传能力；不证明每位真实受害者的取数结果。
notes_en: The sample and lab validation establish direct writes to the extension directory and Secure Preferences regeneration of integrity fields and later Chrome loading in addition to page-source and request-content upload capability. Real-victim collection outcomes are not established.
