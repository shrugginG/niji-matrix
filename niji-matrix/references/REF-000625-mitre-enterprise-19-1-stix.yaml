notes_zh: 固定版本仅锚定父行为、战术映射、相邻边界和 ATT&CK 子项研究广度；不证明 Niji 子项、传感器盲区或实际规避效果。 本次固定版本对照支持父行为范围，不作为原生匿迹子项或检测字段的自动证据。 本批仅用作远程系统发现父行为和零子项基线，不证明原生分类或检测效果。
