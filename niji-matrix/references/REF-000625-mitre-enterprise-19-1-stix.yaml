notes_en: The fixed version anchors parent behavior, tactic mapping, adjacent boundaries, and ATT&CK-child research breadth;
  it does not prove Niji children, sensor gaps, or measured evasion. The pinned parent records anchor behavior scope rather
  than automatically proving native children or analytic fields. This delivery uses it only for Remote System Discovery parent
  scope and the zero-child baseline, not native taxonomy or detector effects. This delivery uses the fixed publication only
  for the five parent behaviors and inventory, not novel native taxonomy, mechanism effects, or telemetry capabilities; distinct
  rolling/v19 page proposals were not added as canonical sources. This delivery anchors five parent behaviors, tactic membership,
  and original-child research inventory only, not native stealth taxonomy, sensor capability, or detector effects.
