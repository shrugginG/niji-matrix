notes_zh: 原始逆向分析支持 SUNBURST 的消息噪声、命令提取及服务遥测外观，不给出通用检测阈值或漏报率。 补充画像能力与 DNS 输入的阶段边界，不将 DNS 成功解释为任意 Internet 可达，也不复用旧消息伪装案例证明属性读取。
notes_en: Original reverse engineering supports SUNBURST message noise, command extraction, and service telemetry appearance;
  it gives no universal detector threshold or miss rate. Adds profile-capability and DNS-input boundaries without treating
  DNS success as arbitrary Internet reachability or using an older message-disguise case to establish attribute reads.
