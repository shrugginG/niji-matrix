notes_en: Supports controlled-size splitting by malicious code, without measuring bypass of a defensive threshold. Shared-resource
  reconnaissance in a recovered command package does not establish per-server inventories, effective access, or content reads;
  Turla attribution remains the source's medium-confidence assessment. Broadens the bibliography and inquiry locators within
  the same original publication while preserving earlier exfiltration facts; commands and capabilities do not establish particular
  returns or per-host query dates, and Turla attribution retains the source's medium confidence. The user-information request
  is a separate central fact in the command package without an exact getter, return value, or query date. Other discovery
  facts in the publication do not automatically form the same CASE.
