notes_zh: 支持恶意样本按受控大小分块发送；未测量防守阈值规避。 已恢复命令包中的共享资源侦察不证明逐服务器返回清单、有效访问或正文读取；Turla 归因仍为来源给出的中等置信度。 同一原始出版物扩大书目标题和调查定位，保留既有外传等事实；命令与能力不自动证明具体返回或逐主机查询日期，Turla
