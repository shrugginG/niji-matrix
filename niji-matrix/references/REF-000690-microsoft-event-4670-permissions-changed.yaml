notes_zh: 4670 可提供对象、writer 会话及旧新安全描述符，但只有为对象配置相应 SACL 时才生成；事件证明权限更改，不证明消费者已被拒绝或防御已失效。
notes_en: Event 4670 can provide object, writer session, and old and new security descriptors, but it is generated only when the object has the required SACL. The event proves a permission change, not consumer denial or completed defensive failure.
