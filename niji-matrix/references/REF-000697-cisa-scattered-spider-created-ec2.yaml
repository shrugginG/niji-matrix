notes_zh: 联合公告直接支持攻击者在受害云中创建并使用新 EC2 实例；来源未逐实例披露安全代理或日志注册状态，因此只支持恶意新 lineage 与后继活动，不单独证明失明。
notes_en: The joint advisory directly supports adversary creation and use of new EC2 instances in a victim cloud. It does not disclose security-agent or logging enrollment for each instance and therefore supports malicious new lineage and follow-on activity rather than blindness by itself.
