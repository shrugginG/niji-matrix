notes_zh: 固定父页明确网络设备系统映像可在运行内存即时修改或在存储中等待下次启动；Patch/Downgrade 只作实现广度，Niji 子项按运行时与启动持久拓扑划分。
notes_en: The fixed parent explicitly states that a network-device system image can be changed live in running memory or in storage for the next boot. Patch and Downgrade provide implementation breadth only; Niji children use runtime versus boot-persistent topology.
