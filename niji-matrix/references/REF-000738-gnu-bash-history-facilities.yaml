notes_zh: 官方手册定义交互历史从读取、内存保留到退出写入 HISTFILE 的消费语义，并说明 HISTCONTROL/HISTIGNORE 可在加入历史前过滤命令。它支持基线和检测字段，不单独证明恶意使用。
notes_en: The official manual defines the interactive-history lifecycle from reading through in-memory retention to writing HISTFILE at exit and documents pre-history filtering by HISTCONTROL and HISTIGNORE. It supports baseline and detection fields but does not alone establish malicious use.
