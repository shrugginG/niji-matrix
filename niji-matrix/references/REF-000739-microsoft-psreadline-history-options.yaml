notes_zh: 官方 cmdlet 文档证明 PowerShell 交互历史具有可配置的保存方式和路径；SaveNothing 是整体不落盘的直接平台语义。文档不证明攻击者事件，需与独立命令证据和未批准设置变化关联。
notes_en: The official cmdlet documentation establishes configurable persistence style and path for PowerShell interactive history, with SaveNothing providing direct whole-session non-persistence semantics. It does not establish an adversary event and must be joined to independent command evidence and an unapproved setting change.
