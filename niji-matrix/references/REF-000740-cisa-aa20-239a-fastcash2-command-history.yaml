notes_zh: 联合政府通告直接支持攻击者利用 Bash ignorespace 对单条命令选择性遗漏；它不支持整段 session 均未持久化，也不能把所有前导空格命令视为恶意。
notes_en: The joint government advisory directly supports adversary use of Bash ignorespace to omit selected commands. It does not support non-persistence of an entire session and does not make every leading-space command malicious.
