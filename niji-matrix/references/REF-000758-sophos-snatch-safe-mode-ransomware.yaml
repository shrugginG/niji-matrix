notes_zh: 事件调查完整支持父项与 child：攻击者把 service 加入 SafeBoot Minimal、设置 BCD、实际重启，并在多数安全软件不运行时执行加密。报告也说明部分受 Sophos 保护主机阻断，不能推广为所有产品均失效。
notes_en: The incident investigation directly supports the parent and child through SafeBoot Minimal service enrollment, BCD mutation, actual reboot, and encryption while most security software does not run. It also notes that some Sophos-protected systems blocked payloads, preventing a claim that every product fails.
