notes_zh: 说明 audit rule 的启用与范围限制；未预配置规则时不能从缺事件推断未枚举。 本批要求规则和采集健康可核验，主机标识由采集器元数据提供；无事件不证明未访问。 uname 成功只到系统调用层，不含返回缓冲区；执行成功不等于查询成功，uid、euid
  和 auid 分别保留。
notes_en: Defines audit-rule enablement and scope constraints; absent events without preconfigured rules do not prove no enumeration.
  This delivery requires verifiable rule and collection health with collector-provided host identity; absent events do not
  establish no access. Successful uname reaches only the syscall level without return buffers; successful execution is not
  successful inquiry, and uid, euid, and auid remain distinct.
