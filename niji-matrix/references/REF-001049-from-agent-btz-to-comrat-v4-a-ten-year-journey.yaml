notes_zh: 按定位段落引用；本来源支持“从 Agent.BTZ 到 ComRAT v4：Gmail Web UI 指挥控制”所述的样本、协议、字段或控制事实，不自动证明所有环境中的匿迹意图、检测阈值或告警规避。 同一研究的正文与关联白皮书记录
  gpresult /z 和 /v 操作者命令；它们支持组策略调查尝试，不证明完整返回值、独立匿迹子技术或告警规避。 安全日志反馈是与既有 Gmail 和组策略命令不同的观察；不证明每次读取后均有行动调整。 密码策略与组关系命令分别支持限定的查询活动观察，未公开逐查询结果；不证明匿名、无句柄、策略推导或驻留内联子项。
notes_en: 'Use at the stated locator. This source supports the sample, protocol, field, or control facts described by “From
  Agent.BTZ to ComRAT v4: A Ten-Year Journey”; it does not automatically establish stealth intent, detection thresholds, or
  alert evasion in every environment. The article and linked report from the same research record operator gpresult /z and
  /v commands, supporting policy-survey attempts without establishing complete returned values, a distinct stealth child,
  or alert evasion. Security-log feedback is distinct from the existing Gmail and Group Policy command observations and does
  not establish adaptation after every read. Password-policy and group commands support separate bounded query observations
  without per-query results; they do not establish anonymity, handle elision, policy inference, or resident inline children.'
