notes_zh: Windows 为剪贴板变化提供 sequence number、format listener 和 viewer 三类路径；listener 在变化时收到 WM_CLIPBOARDUPDATE，viewer 收到 WM_DRAWCLIPBOARD
  并可读取数据。只支持平台前提与事件结构，不证明恶意取得。
notes_en: Windows supplies a sequence number, format listener, and viewer paths for clipboard changes. A listener receives
  WM_CLIPBOARDUPDATE on change, while a viewer receives WM_DRAWCLIPBOARD and can retrieve data. Supports platform prerequisites
  and event structure, not malicious acquisition.
