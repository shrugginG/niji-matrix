notes_en: The 2025 incident sample creates a hidden tool window, registers AddClipboardFormatListener, harvests content after
  WM_CLIPBOARDUPDATE, writes a privilege-dependent hidden log, and uploads captured keystrokes and clipboard contents through
  command 150. Directly supports the parent, event child, and outcome chain.
