notes_zh: QBot 将注入模块放入目标进程并 hook GetClipboardData 与 TranslateMessage；Notepad 实验显示内容在应用前被捕获，记录进程路径、窗口标题和文本，随后 RC4 加密落入文件并由传输线程处理，直接支持消费者上下文截获。
notes_en: QBot places an injected module in target processes and hooks GetClipboardData and TranslateMessage. A Notepad experiment
  shows content captured before the application with process path, window title, and text, then RC4-encrypted into a file
  handled by a transmission thread. Directly supports consumer-context interception.
