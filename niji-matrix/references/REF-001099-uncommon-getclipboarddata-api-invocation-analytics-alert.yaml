notes_zh: 至少一种商业 EDR 能针对异常 GetClipboardData 调用提供分析告警，证明 API 级观察在特定产品中可实现；页面不证明默认 Windows 日志具有同等字段，正式 Analytic 必须先验证本地传感器。
notes_en: At least one commercial EDR exposes an analytic alert for unusual GetClipboardData invocation, establishing that
  API-level observation is feasible in a specific product. It does not establish equivalent fields in default Windows logs,
  so the formal analytic must validate the local sensor first.
