notes_zh: Endpoint DLP 可对受保护文件的复制到剪贴板执行审计、阻断或 override，并对受支持浏览器粘贴进行条件检查；覆盖依赖纳管设备、应用、数据和配置。
notes_en: Endpoint DLP can audit, block, or allow override for copy-to-clipboard from protected files and evaluate paste into
  supported browsers. Coverage depends on managed devices, apps, data, and configuration.
