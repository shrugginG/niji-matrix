notes_zh: 密码管理器可通过与 URI 匹配的 autofill 减少人工复制，并可关闭自动 TOTP 复制或设置剪贴板清理间隔；也说明密码管理器自身是合法剪贴板使用者。
notes_en: A password manager can reduce manual copying through URI-matched autofill and can disable automatic TOTP copying
  or set a clipboard-clear interval. It also establishes password managers as legitimate clipboard users.
