notes_zh: Windows 应用可用 ExcludeClipboardContentFromMonitorProcessing、CanIncludeInClipboardHistory 和 CanUploadToCloudClipboard
  控制其写入项是否进入历史或云同步；这些格式不声明阻止实时本地读取。
notes_en: Windows applications can use ExcludeClipboardContentFromMonitorProcessing, CanIncludeInClipboardHistory, and CanUploadToCloudClipboard
  to control whether written items enter history or cloud synchronization. These formats do not claim to prevent real-time
  local reads.
