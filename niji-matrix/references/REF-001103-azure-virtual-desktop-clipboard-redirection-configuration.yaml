notes_zh: Windows 远程会话可在本地端、session host 和 host pool 多层配置剪贴板重定向，最严格设置决定结果；可按业务需要禁用重定向。只约束跨会话传播，不阻止所有同会话本地读取。
notes_en: Windows remote sessions can configure clipboard redirection across local-device, session-host, and host-pool layers,
  with the most restrictive setting determining the result. Redirection can be disabled by business need. This constrains
  cross-session propagation rather than every local read in one session.
