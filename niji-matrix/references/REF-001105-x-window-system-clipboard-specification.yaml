notes_zh: X11 CLIPBOARD/PRIMARY 是异步 selection，源应用在粘贴请求时提供数据，clipboard daemon 可持续 harvest selection；支持 Linux 平台直接对象与正常管理器反例，不证明安全审计覆盖。
notes_en: X11 CLIPBOARD and PRIMARY are asynchronous selections whose source application supplies data at paste request time,
  while a clipboard daemon can continuously harvest selections. Supports the Linux direct object and a benign manager comparator,
  not security-audit coverage.
