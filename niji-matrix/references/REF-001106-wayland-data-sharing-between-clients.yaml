notes_zh: Wayland 通过 wl_data_source、wl_data_offer、MIME 协商和文件描述符在客户端间转移复制粘贴数据，说明其观察键和权限面不同于 Windows；不自动提供进程级恶意判定。
notes_en: Wayland transfers copy-paste data through wl_data_source, wl_data_offer, MIME negotiation, and file descriptors,
  showing observation keys and permission surfaces different from Windows. It does not automatically supply process-level
  malicious attribution.
