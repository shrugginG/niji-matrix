notes_en: 'Local command accounting can record executed commands as syslog but is not supported for commands executed through
  NETCONF, XML, or gRPC, establishing a product-specific audit-surface mismatch. Limitation: Applies to documented IOS XR
  releases and command-accounting mode, not every Cisco or other-vendor platform; it does not prove malicious acquisition
  through the gap.'
