notes_en: 'NETCONF get-config retrieves configuration data, optional filters select portions, and a positive response returns
  a data element while errors use rpc-error, supporting request/response/outcome separation. Limitation: Protocol semantics
  do not guarantee product logging, sensor visibility, attacker use, or plaintext inspection.'
