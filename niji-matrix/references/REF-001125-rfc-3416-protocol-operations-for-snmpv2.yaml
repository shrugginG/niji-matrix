notes_en: 'GET and GETBULK requests produce Response-PDUs with request IDs, status, and variable bindings; successful bulk
  retrieval can return many name/value bindings, supporting query-versus-returned-value distinction. Limitation: Protocol
  semantics do not establish that a particular OID is configuration, that a sensor records values, or that an incident completed
  acquisition.'
