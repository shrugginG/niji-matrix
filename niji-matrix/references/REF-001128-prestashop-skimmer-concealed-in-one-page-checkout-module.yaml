notes_zh: 用于支持“隐藏在单页结账模块中的 PrestaShop 窃取程序”所定位的行为、字段或控制；来源限制须随结论保留。
notes_en: 'The investigation found a fake payment form overlaid within the legitimate checkout, malicious JavaScript in a
  legitimate one-page-checkout asset monitoring payment-form changes and sending payment data to a same-site path, server-side
  code recognizing the request, and harvested card data being sent to an attacker-controlled server. Limitation: One compromised
  PrestaShop implementation. It does not establish prevalence, cross-platform fields, alert rates, or that every visitor submitted
  data. The attack combines overlay, field monitoring, same-origin handling, error feedback, and later egress, which must
  not be collapsed into one universal trace.'
