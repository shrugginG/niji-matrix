notes_zh: 用于支持“支付页面安全与防止电子窃取指南”所定位的行为、字段或控制；来源限制须随结论保留。
notes_en: 'PCI SSC explains that payment-page scripts should be authorized, checked for integrity, and monitored for tampering,
  including pages, scripts, and security-impacting headers as received by the consumer browser; supports artifact, script-inventory,
  and rendered-page controls. Limitation: Control and compliance guidance rather than a sensor schema or measured detection
  efficacy. Payment-page scope must not be presented as automatically covering every business form.'
