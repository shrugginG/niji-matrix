notes_zh: 用于支持“内容安全策略第三级”所定位的行为、字段或控制；来源限制须随结论保留。
notes_en: 'Defines script and connection source controls, report-only policy delivery, and form-action restriction of form-submission
  target URLs; supports receiver restrictions and policy metadata. Limitation: A browser control specification, not evidence
  of malicious capture. Same-origin compromised code and server handlers can remain within allowed sources, and deployment
  support varies.'
