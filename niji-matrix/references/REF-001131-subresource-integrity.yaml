notes_zh: 用于支持“子资源完整性”所定位的行为、字段或控制；来源限制须随结论保留。
notes_en: 'Defines integrity metadata for script and link resources and Integrity-Policy reporting, supporting browser-side
  validation that a fetched resource matches an expected representation. Limitation: Does not cover every inline, dynamic,
  or same-origin resource and does not prove input was captured; CORS and browser support affect applicability.'
