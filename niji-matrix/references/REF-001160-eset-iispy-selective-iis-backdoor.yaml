notes_zh: 直接观察 IISpy 被配置为 native IIS module 后随 w3wp 自动加载，只在 Cookie、Host 与 URL 的隐藏关系匹配时执行后门命令，其他请求由正常模块处理；还记录响应伪装和日志字段改写。
notes_en: Directly observes IISpy configured as a native IIS module and automatically loaded by w3wp, executing backdoor commands only when a hidden relation among Cookie Host and URL matches while ordinary requests continue through benign modules. Also documents response disguise and log-field rewriting.
