notes_zh: 说明 sysadmin 可用 sp_procoption 把存储过程标记为 SQL Server 每次启动时自动执行，并可取消该状态；支持数据库组件的持久绑定与恢复验证，不证明攻击者使用。
notes_en: Documents sysadmin use of sp_procoption to mark a stored procedure for automatic execution at every SQL Server startup and to remove that state. Supports database-component durable binding and restoration validation but not adversary use.
