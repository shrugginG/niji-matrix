notes_zh: 直接分析多个 VS Code Marketplace 恶意扩展，其中 `prettiest java` 借用 Prettier-Java 的功能和名称预期，扩展安装后窃取 PII 或建立后门；支持新扩展身份仿冒与市场信誉借用。
