notes_zh: 说明 Chrome Web Store 开发者账户或自动构建身份被攻陷后，可向既有安装基数分发恶意更新并借用扩展既有信誉；同时给出 Verified CRX Upload 等缓解。该来源支持供应链相邻边界与更新治理，不直接定义新的 T1176 本地子项。
notes_en: Describes compromised Chrome Web Store developer accounts or automated build identities distributing malicious updates to an installed base while borrowing established extension reputation and provides mitigations such as Verified CRX Upload. Supports the adjacent supply-chain boundary and update governance rather than a new local T1176 child.
