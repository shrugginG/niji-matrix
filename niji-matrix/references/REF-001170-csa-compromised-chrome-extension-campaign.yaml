title_zh: 针对 Chrome 浏览器扩展的持续恶意更新活动
title_en: Ongoing Campaign Targeting Chrome Browser Extensions
source_type: incident-report
authors: [Cyber Security Agency of Singapore]
publisher: Cyber Security Agency of Singapore
published: '2024-12-30'
url: https://www.csa.gov.sg/alerts-and-advisories/alerts/al-2024-147/
accessed: '2026-10-22'
locator: Compromised extension list including Cyberhaven; malicious code in previously installed extensions; session and cookie theft; uninstall reset and safe-version recovery recommendations
archive_url: null
credibility: high
notes_zh: 政府通告记录多项既有 Chrome 扩展被注入恶意代码并可窃取会话和 Cookie，支持扩展更新供应链进入目标后的持久状态与恢复措施；不证明每个列名扩展的完整事件链。
notes_en: Government advisory records malicious code injected into multiple existing Chrome extensions with session and cookie theft capability. Supports installed persistent state reached through extension-update supply chain and recovery measures but not a complete chain for every listed extension.
