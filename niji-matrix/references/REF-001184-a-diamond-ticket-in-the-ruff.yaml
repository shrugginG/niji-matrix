notes_zh: 原始实验支持真实签发后修改、承袭自然字段和限定签发存在性检测的弱化；2022年实验不保证当前所有补丁与策略下规避。TrustedSec共发版本属于同一研究，不是独立复验。
notes_en: The original experiment supports post-issuance modification, inheritance of natural fields, and weakened bounded issuance-existence
  detection. The 2022 experiment does not guarantee evasion under every current patch and policy. The TrustedSec co-publication is the same
  research rather than an independent replication.
