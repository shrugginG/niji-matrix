notes_zh: 原始Windows实验明确手工TGS交互可避免每个目标票据进入登录缓存，KDC仍接收请求。历史加密协商和缓存行为需在当前客户端复验，缓存缺失不独立证明恶意。
notes_en: The original Windows experiment explicitly shows manual TGS exchanges avoiding addition of every target ticket to the logon cache
  while the KDC still receives requests. Historical encryption negotiation and caching behavior need replication on current clients, and
  missing cache entries do not independently prove malice.
