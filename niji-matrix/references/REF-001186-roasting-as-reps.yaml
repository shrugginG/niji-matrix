notes_zh: 原始研究区分由krbtgt保护的TGT与客户端密钥保护的AS回复enc-part，并实现无预认证取材；回复取得不证明离线破解成功或可直接使用TGT。
notes_en: The original research distinguishes the krbtgt-protected TGT from the client-key-protected AS reply enc-part and implements acquisition
  without preauthentication. Receiving a reply establishes neither successful offline recovery nor directly usable TGT control.
