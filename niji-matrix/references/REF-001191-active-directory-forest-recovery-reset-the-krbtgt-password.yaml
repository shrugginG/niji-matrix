notes_zh: 官方过程要求对可写DC的krbtgt执行双次重置并遵守实际票据寿命与恢复约束；不是立即两次重置或统一覆盖RODC的指令，也不证明所有既存会话即刻失效。
notes_en: The official procedure calls for two krbtgt resets on writable DCs subject to actual ticket lifetime and recovery constraints.
  It is not an instruction for two immediate resets or uniform RODC handling and does not establish immediate invalidation of every existing
  session.
