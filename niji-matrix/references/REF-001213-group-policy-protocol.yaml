notes_zh: 正常客户端使用 LDAP 得到策略属性与文件路径，再访问策略文件；两面语义不同且正常行为也会读取。文档所述流程不等于每个诊断工具的实现，不证明每个攻击者都执行完整双面流程。
notes_en: Normal clients obtain policy attributes and file paths through LDAP and then access policy files; the planes have
  different semantics and normal behavior also reads them. The documented sequence is not every diagnostic tool's implementation
  and does not establish a complete dual-plane sequence for every adversary.
