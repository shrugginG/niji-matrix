notes_zh: 用户策略读取改用计算机上下文，移除必要读取会使策略应用失败。来源是特定补丁的兼容性说明，不支持对所有策略一律删权限或保证最小权限阻断已失陷客户端读取。
notes_en: User-policy retrieval uses computer context, and removing necessary read rights can break application. A patch compatibility
  statement, not support for blanket permission removal or guaranteed prevention of reads by compromised clients.
