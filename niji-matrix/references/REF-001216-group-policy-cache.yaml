notes_zh: 存在可配置的策略缓存，适用版本和客户端/服务器默认情况有差别。文档明确读取缓存时仍可能尝试联系登录域控制器检查链路；它不说明攻击者离线读取方法、缓存 ACL 或没有网络事件。
notes_en: Configurable policy caches exist, with version and client/server-default differences. The documentation explicitly
  says cache use can still attempt contact with a logon domain controller for link-speed checks. It does not establish adversarial
  offline access, cache ACLs, or absence of network events.
