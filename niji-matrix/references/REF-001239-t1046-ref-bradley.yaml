notes_zh: 作者的一手入侵叙述记录攻击者发出 SSH 服务浏览命令，并说明该操作依赖服务公告而非端口扫描；未披露完整应答、解析端点或检测对照，且不能由一个操作推断整个入侵没有其他扫描。
notes_en: Firsthand intrusion reporting records adversarial SSH-service browsing and explains its advertisement rather than
