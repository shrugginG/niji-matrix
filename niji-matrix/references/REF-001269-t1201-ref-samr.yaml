notes_zh: 单一协议出版物统一身份。操作56不需对象context handle，仍需要RPC binding handle和服务器级检查；仅返回最小长度和密码属性。该能力及较短协议链不直接证明攻击者有意匿迹或没有其他观察。
notes_en: One identity covers the protocol publication. Operation 56 needs no object context handle but still needs an RPC
  binding handle and server-wide access check. It returns only minimum length and password properties. Capability and a shorter
  protocol sequence do not themselves establish deliberate evasion or absence of other observations.
