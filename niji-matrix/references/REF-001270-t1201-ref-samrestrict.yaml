notes_zh: 访问描述符与版本/角色相关。16965/16968表示服务器级访问检查，不能单独证明密码策略查询，16965默认节流。此设置可能破坏必要软件，应先验证audit-only。
notes_en: Descriptors depend on role and version. Events 16965/16968 describe server-wide access checks, not password-policy
  queries by themselves, and 16965 is throttled by default. The setting can break required software; validate in audit-only
  mode first.
