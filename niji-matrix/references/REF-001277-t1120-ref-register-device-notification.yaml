notes_zh: 顶层窗口可收到默认端口或卷广播，显式接口通知注册的合同不同；按 VOLUME 类型调用该注册会失败。用于审查 Trellix 混合叙述而非照搬错误结构，并支持注册成功与接收消息分级。
notes_en: Top-level windows can receive default port or volume broadcasts under a different contract from explicit interface
  notification registration; registration using VOLUME type fails. This resolves Trellix's mixed description without copying
  incorrect structures and separates registration success from reception.
