notes_zh: TH32CS_SNAPPROCESS 包含系统全部进程，此时PID参数不是进程筛选器；成功返回快照句柄，仍需后续遍历。模块/堆的位数和访问限制不应泛化为所有基础进程条目失败。
notes_en: TH32CS_SNAPPROCESS includes all system processes and its PID argument does not filter that set. Success yields a
  snapshot handle requiring later walking. Module/heap bitness and access restrictions must not be generalized to failure
  of every basic process entry.
