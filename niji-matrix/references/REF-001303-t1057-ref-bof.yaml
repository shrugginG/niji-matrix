notes_zh: 官方明确比较每任务创建与注入和 Beacon 内执行的足迹，说明短任务、阻塞与崩溃约束。文档支持能力和设计目的，不证明任何特定恶意主体采用、所有 API 无日志或实测逃逸率；进程与注册表查询各需独立行为证据。
notes_en: The official documentation compares per-task creation and injection with execution inside Beacon and describes short-task,
  blocking, and crash constraints. It supports capability and design purpose, not adoption by a particular malicious actor,
  absent API telemetry, or measured evasion. Process and Registry inquiries each require independent behavioral evidence.
