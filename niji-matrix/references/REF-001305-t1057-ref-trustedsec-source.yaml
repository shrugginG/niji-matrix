notes_zh: Aggressor入口显式beacon_inline_execute，tasklist执行Win32_Process查询、解析并返回字段；默认本地、可选远端，需对应token。代码可核验能力而非现场采用，main分支新变化不改变该固定证据。
  同一固定出版物的身份读取证据，扩定位而不另建别名REF。TokenUser来自OpenProcessToken(GetCurrentProcess)，名称来自GetUserNameExA，模拟时不保证一致；代码能力不证明野外采用。 同版本sc_query入口显式beacon_inline_execute并调用go；枚举SERVICE_WIN32/STATE_ALL或读取指定服务，随后组织返回。源码是静态能力，未执行，枚举不循环续页且状态文字表未覆盖PAUSED索引，不能保证健壮完整输出。保留原tasklist和本批whoami定位及限制。
notes_en: The Aggressor entry explicitly invokes beacon_inline_execute; tasklist queries Win32_Process, parses fields, and
  returns them. Local is default and optional remote use requires a suitable token. Source verifies capability, not field
  adoption; later branch changes do not alter this pinned evidence. Identity-reading evidence from the same pinned publication
  extends locators without a duplicate alias REF. TokenUser comes from OpenProcessToken(GetCurrentProcess), while the name
  comes from GetUserNameExA and can differ under impersonation. Code capability does not establish field adoption. The same-version
  sc_query entry explicitly invokes beacon_inline_execute and go, enumerates SERVICE_WIN32/STATE_ALL or reads one service,
  then formats returns. This is unexecuted static capability; enumeration lacks continuation looping and the status-text table
  omits the PAUSED index, so robust complete output is not guaranteed. Preserve original tasklist and this batch's whoami
  locators and limits.
