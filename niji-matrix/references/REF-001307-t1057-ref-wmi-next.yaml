notes_zh: WBEM_S_FALSE可伴随有效对象，TIMEDOUT不是空集合定论；实际对象数、状态和后续遍历共同界定已消费结果，不能仅用一个HRESULT判全量成功。
notes_en: WBEM_S_FALSE may accompany valid objects and TIMEDOUT does not establish an empty set. Returned counts, status,
  and later iteration bound consumed results; one HRESULT does not prove complete retrieval.
