notes_zh: 支持自定义结果采集的实现可行性，具体事件形状、身份映射、版本、采集健康和保存合同仍是待部署验证的研究设计，不能视为默认 EDR 能力。 补充身份、服务、时间和环境判断实验的自定义采集可行性定位；线程、任务、句柄、ABI、比较语义和后继映射均需独立实现及验收，普通安装或默认EDR不自动提供这些事件。
notes_en: Supports feasibility of custom result collection. Event shape, identity mapping, version, health, and retention
  remain research deployment contracts requiring validation, not default EDR capability. Adds feasibility locators for custom
  identity, service, time, and environment-condition experiments. Thread, task, handle, ABI, comparison, and successor mapping
  each require implementation and acceptance; ordinary installation or default EDR does not automatically supply those events.
