notes_zh: 同名工具的路由、连接、监听与统计需按实际开关区分，不因出现 netstat 自动归入连接发现。 -n 不尝试名称解析是能力事实，不自动证明规避意图或原生子项；显示请求不是实际返回证据。
notes_en: Routing, connections, listeners, and statistics require flag-specific interpretation rather than classifying every
  netstat invocation as connection discovery. The fact that -n does not attempt name resolution establishes capability, not
  evasion intent or a native child; display requests are not actual-return evidence.
