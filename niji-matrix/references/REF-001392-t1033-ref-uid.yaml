notes_zh: getuid返回进程真实UID，geteuid返回有效UID，两者不失败；真实是内核身份种类而非真实人类归因，未提供跨平台遥测或恶意采用。
notes_en: getuid returns a process real UID and geteuid its effective UID; neither fails. Real is a kernel identity kind rather
  than attribution to a real human, without cross-platform telemetry or malicious-adoption evidence.
