notes_zh: 环境列表值可改变，未找到变量返回NULL；变量名与账户字段相似不赋予其权威性。未把secure_getenv拒绝解释为无用户。
notes_en: Environment-list values can change and a missing variable returns NULL. Resemblance to an account field does not
  make the value authoritative; secure_getenv refusal is not interpreted as absence of a user.
