notes_zh: 登录终端用户可与有效用户不同，无终端或登录记录缺失均可能失败；LOGNAME可任意设置，不以无返回证明无人使用。
notes_en: A terminal login user can differ from the effective user, and absent terminal or login records can fail. LOGNAME
  is arbitrarily settable and absence of a return does not prove no user.
