notes_en: Specifies SCM enumeration authority, service-type/state filters, page counts/bytes, resume, and buffer errors. Missing
  per-service status authority silently omits entries. This is not default call telemetry or a guarantee that tools implement
  continuation; decode strings/structures for actual A/W and ABI variants.
