notes_zh: 需要逐服务状态读取权，非零返回才取得有效结构，缓冲不足不写有效状态。返回是最近向SCM报告的状态，可能落后变化；STOPPED的PID无效，START/STOP_PENDING时可能无效。
notes_en: Requires individual status-read authority, with valid structures after nonzero returns and none on insufficient
  buffers. The latest status reported to SCM may lag changes. STOPPED PIDs are invalid, and START/STOP_PENDING PIDs may be
  invalid.
