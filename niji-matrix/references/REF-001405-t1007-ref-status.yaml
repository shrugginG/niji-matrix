notes_zh: 类型、状态、服务自报错误与API错误分开；WaitHint单位毫秒，不等于实测耗时，checkpoint不是时间。该PID描述服务进程而非查询者，字段不证明有效防护或实时健康。
notes_en: Distinguishes types, states, service-reported errors, and API errors. WaitHint is milliseconds rather than measured
  duration, and checkpoints are not time. The PID describes a service rather than its reader and fields do not attest effective
  protection or real-time health.
