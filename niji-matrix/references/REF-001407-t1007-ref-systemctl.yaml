notes_zh: 已加载unit与已安装unit文件是不同视图，缺省列表并非全量；active不等于所有服务均running，enable与start也不同。按本机版本验证参数与manager，当前URL未来可变，不代表所有Linux系统都有相同systemd版本。
notes_en: Loaded units and installed unit files are different views, and default lists are incomplete. Active is not universally
  running, and enable differs from start. Validate options/managers by local version; the current URL can change and does
  not establish a common systemd version across Linux.
