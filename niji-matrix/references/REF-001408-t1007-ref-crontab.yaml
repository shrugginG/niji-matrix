notes_zh: -l显示当前表，-u选择用户，缺省只针对执行者；-e/-r和安装输入是不同操作。allow/deny只约束crontab工具使用，不停止既有作业；此Cronie实现不能自动代表macOS调度器，固定基线的macOS范围另外保留研究限制。
notes_en: -l displays the current table, -u selects a user, and the default concerns the executing user only. -e/-r and installation
  input are different operations. Allow/deny constrains utility use without stopping existing jobs. Cronie does not automatically
  describe macOS schedulers, whose fixed-baseline coverage retains separate research limits.
