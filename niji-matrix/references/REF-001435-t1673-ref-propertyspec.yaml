notes_zh: PropertySpec按对象类型选择属性，适用spec的属性集合取并集；all=true忽略pathSet，pathSet为空可仅返回对象引用。请求范围不证明值已返回；all=true或不能展开的集合不可被空pathSet误判为全部属性完成。
notes_en: PropertySpec selects properties by object type and applicable specs contribute a union. all=true ignores pathSet,
  while an empty pathSet can retrieve references without properties. Requested scope does not establish returned values. all=true
  or an unexpandable scope cannot be mistaken for complete property acquisition from an empty pathSet.
